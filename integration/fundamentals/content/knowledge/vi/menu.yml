      - "Outbox relay bằng polling hoặc CDC và khả năng phát trùng"
      - "Kết hợp outbox với inbox và consumer có tính lũy đẳng"
      - "Saga và chuỗi giao dịch cục bộ của quy trình nghiệp vụ"
      - "Compensation và khác biệt với rollback của cơ sở dữ liệu"
      - "Điểm không thể đảo ngược, đặt chỗ và xác nhận tài nguyên"
      - "Saga bị kẹt, thử lại bước bù và đối soát trạng thái cuối"
  - level1: "Nhất quán dữ liệu"
    level2:
      - "Strong consistency, eventual consistency và yêu cầu nghiệp vụ"
      - "Phân vùng mạng và đánh đổi giữa nhất quán với khả dụng"
      - "Độ trễ lan truyền, cửa sổ không nhất quán và giới hạn chấp nhận"
      - "Read-your-writes và phản hồi sau khi chấp nhận yêu cầu"
      - "Projection, read model và đồng bộ trạng thái dẫn xuất"
      - "Đồng bộ một chiều, hai chiều và giải quyết cập nhật xung đột"
      - "Bất biến nghiệp vụ, quyền quyết định và tránh nhiều nguồn dữ liệu chuẩn"
      - "Đối soát định kỳ, phát hiện thiếu và sửa sai lệch"
      - "Thiết kế trải nghiệm cho trạng thái chờ, thất bại và cần can thiệp"
