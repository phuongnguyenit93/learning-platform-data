menu:
  - level1: "Nền tảng tích hợp"
    level2:
      - "Mục tiêu tích hợp ứng dụng, hệ thống và dữ liệu"
      - "Ranh giới hệ thống, thành phần tham gia và quyền sở hữu dữ liệu"
      - "Phân biệt API, lệnh, thông điệp, sự kiện và bản ghi dữ liệu"
      - "Tích hợp nội bộ, giữa tổ chức và với dịch vụ bên ngoài"
      - "Khác biệt giữa lời gọi nội bộ và giao tiếp qua mạng"
      - "Độ trễ, lỗi từng phần và kết quả xử lý không xác định"
      - "Liên kết về thời gian, vị trí, giao thức và mô hình dữ liệu"
      - "Yêu cầu chức năng, độ tin cậy và ràng buộc vận hành"
      - "Bản đồ hệ thống và cách mô tả một luồng tích hợp"
  - level1: "Đồng bộ và bất đồng bộ"
    level2:
      - "Request-response và thời gian chờ của bên gọi"
      - "Gửi bất đồng bộ và tiếp nhận kết quả xử lý sau"
      - "Phân biệt bất đồng bộ ở mã nguồn với bất đồng bộ giữa hệ thống"
      - "Fire-and-forget và giới hạn bảo đảm hoàn tất nghiệp vụ"
      - "Polling, long polling, callback và thông báo kết quả"
      - "Trạng thái tác vụ và tài nguyên theo dõi tiến độ"
      - "Correlation ID và ghép yêu cầu với phản hồi bất đồng bộ"
      - "SSE, WebSocket và kết nối cập nhật dữ liệu liên tục"
      - "Đánh đổi giữa phản hồi tức thời, thông lượng và khả năng phục hồi"
      - "Kết hợp bước đồng bộ với quy trình xử lý bất đồng bộ"
  - level1: "Kiến trúc tích hợp"
    level2:
      - "Tích hợp point-to-point và vấn đề kết nối chằng chịt"
      - "Hub-and-spoke, ESB và giới hạn của trung tâm tích hợp"
      - "API gateway, reverse proxy và ranh giới trách nhiệm"
      - "Message broker, event broker và vai trò trung gian truyền tin"
      - "Adapter, connector và cổng giao tiếp với hệ thống ngoài"
      - "Anti-corruption layer và bảo vệ mô hình nghiệp vụ nội bộ"
      - "Tích hợp trong monolith, modular monolith và microservices"
      - "Phân biệt điều phối tập trung và phối hợp bằng sự kiện"
      - "Sơ đồ ngữ cảnh, sơ đồ tuần tự và luồng lỗi giữa các thành phần"
  - level1: "Hợp đồng tích hợp"
    level2:
      - "Contract-first và code-first trong thiết kế tích hợp"
      - "Hợp đồng cú pháp và ý nghĩa nghiệp vụ của dữ liệu"
      - "Thiết kế thao tác, tài nguyên, lệnh và sự kiện theo mục đích"
      - "Trường bắt buộc, trường tùy chọn, giá trị mặc định và null"
      - "Tiền điều kiện, hậu điều kiện và quy tắc kiểm tra đầu vào"
      - "Mã lỗi, cấu trúc lỗi và khả năng thử lại của từng loại lỗi"
      - "OpenAPI cho API HTTP và AsyncAPI cho giao tiếp bất đồng bộ"
      - "Protobuf IDL và mô tả giao diện RPC"
      - "Cam kết về thời gian phản hồi, giao nhận và hoàn tất nghiệp vụ"
      - "Ví dụ yêu cầu, phản hồi, sự kiện và tình huống biên trong tài liệu"
  - level1: "Biểu diễn dữ liệu"
    level2:
      - "JSON, XML và định dạng nhị phân trong trao đổi dữ liệu"
      - "Serialization, deserialization và chi phí chuyển đổi"
      - "JSON Schema, XSD, Avro và Protobuf ở mức nền tảng"
      - "Mã định danh, enum và ý nghĩa ổn định của các trường"
      - "Ngày giờ, múi giờ và thời điểm nghiệp vụ so với thời điểm xử lý"
      - "Số thập phân, tiền tệ, đơn vị đo và độ chính xác"
      - "Unicode, mã hóa ký tự và chuẩn hóa chuỗi"
      - "Message envelope, metadata và payload nghiệp vụ"
      - "Giới hạn kích thước, nén dữ liệu và truyền tham chiếu tới tệp lớn"
  - level1: "HTTP và REST"
    level2:
      - "Request, response, header, URI và vòng đời kết nối HTTP"
      - "Thiết kế tài nguyên và ngữ nghĩa các phương thức HTTP"
      - "Tính an toàn, tính lũy đẳng và giới hạn khi thử lại thao tác"
      - "Mã trạng thái và phân biệt tiếp nhận với hoàn tất xử lý"
      - "Content negotiation, media type và cấu trúc phản hồi"
      - "Phân trang bằng offset hoặc cursor và tính ổn định của kết quả"
      - "Lọc, sắp xếp, tìm kiếm và giới hạn truy vấn"
      - "Cache, ETag và yêu cầu có điều kiện"
      - "Kiểm soát cập nhật đồng thời bằng phiên bản tài nguyên"
      - "Thiết kế API cho tác vụ dài và thao tác xử lý hàng loạt"
  - level1: "RPC và gRPC"
    level2:
      - "Mô hình lời gọi thủ tục từ xa và khác biệt với REST"
      - "Định nghĩa service, method và message trong gRPC"
      - "Unary RPC, server streaming, client streaming và bidirectional streaming"
      - "Stub, client SDK và sự phụ thuộc vào mã sinh từ hợp đồng"
      - "Metadata, mã trạng thái và truyền ngữ cảnh lời gọi"
      - "Deadline, hủy yêu cầu và giới hạn truyền hủy giữa các dịch vụ"
      - "Kết nối, cân bằng tải và tác động của proxy tới RPC"
      - "SOAP, WSDL và các đặc trưng của tích hợp dịch vụ cũ"
      - "Lựa chọn RPC cho giao tiếp nội bộ và các giới hạn tương tác"
  - level1: "Webhook"
    level2:
      - "Webhook và sự khác biệt với polling hoặc lời gọi API chủ động"
      - "Đăng ký endpoint, loại sự kiện và vòng đời subscription"
      - "Xác thực nguồn gửi bằng chữ ký và kiểm tra thời gian"
      - "Tiếp nhận nhanh, lưu bền vững và xử lý sau khi phản hồi"
      - "Chính sách gửi lại và ý nghĩa mã phản hồi của bên nhận"
      - "Xử lý webhook trùng lặp, đến muộn hoặc sai thứ tự"
      - "Bảo vệ endpoint công khai và xác minh địa chỉ callback"
      - "Theo dõi lịch sử giao nhận, replay và đối soát sự kiện bị thiếu"
      - "Thay đổi endpoint, xoay khóa và kiểm thử webhook ở môi trường phát triển"
  - level1: "Hàng đợi thông điệp"
    level2:
      - "Producer, consumer, queue và vòng đời một thông điệp"
      - "Point-to-point, competing consumers và phân chia công việc"
      - "Thông điệp lệnh và trách nhiệm xử lý của bên nhận"
      - "Xác nhận phía producer và xác nhận xử lý phía consumer"
      - "Ack, nack, requeue và thời hạn giữ thông điệp đang xử lý"
      - "Thông điệp bền vững, lưu trữ và khôi phục sau sự cố"
      - "At-most-once, at-least-once và điều kiện của các bảo đảm giao nhận"
      - "Prefetch, số thông điệp đang xử lý và tốc độ tiêu thụ"
      - "TTL, hàng đợi trì hoãn và giới hạn tuổi thọ thông điệp"
      - "Poison message, dead-letter queue và tiêu chí chuyển lỗi"
  - level1: "Sự kiện và pub/sub"
    level2:
      - "Sự kiện là sự việc đã xảy ra và khác biệt với yêu cầu thực hiện lệnh"
      - "Domain event, integration event và ranh giới công bố"
      - "Topic, subscription, fan-out và consumer độc lập"
      - "Thiết kế tên sự kiện và dữ liệu theo ý nghĩa nghiệp vụ"
      - "Event notification và event-carried state transfer"
      - "Định danh sự kiện, nguồn phát, thời điểm xảy ra và quan hệ nhân quả"
      - "Lọc subscription và tránh phụ thuộc vào sự kiện không liên quan"
      - "Khám phá luồng nghiệp vụ trong kiến trúc hướng sự kiện"
      - "Vòng lặp sự kiện, phát tán ngoài ý muốn và kiểm soát liên kết ngầm"
      - "Phân biệt event-driven integration, event sourcing và CQRS"
  - level1: "Luồng dữ liệu"
    level2:
      - "Luồng liên tục, dữ liệu hữu hạn và khác biệt với hàng đợi tác vụ"
      - "Append-only log, partition, offset và consumer group"
      - "Retention, compacted log và khả năng đọc lại dữ liệu"
      - "Khóa phân vùng, phân phối tải và phạm vi bảo đảm thứ tự"
      - "Event time, processing time và dữ liệu đến muộn"
      - "Window, watermark và đánh đổi giữa độ trễ với độ đầy đủ"
      - "Biến đổi, lọc, gộp và kết nối các luồng ở mức nền tảng"
      - "State, checkpoint và khôi phục tiến độ xử lý"
      - "Backpressure, consumer lag và thay đổi tốc độ nguồn dữ liệu"
      - "Replay, backfill và giới hạn hiệu ứng phụ khi xử lý lại"
  - level1: "Tệp và xử lý lô"
    level2:
      - "Khi nào chọn trao đổi tệp hoặc xử lý lô"
      - "CSV, JSON Lines, XML và định dạng trao đổi theo lô"
      - "SFTP, object storage và cơ chế bàn giao tệp"
      - "Tên tệp, manifest, checksum và dấu hiệu tệp đã sẵn sàng"
      - "Tránh đọc tệp chưa hoàn tất bằng vùng tạm và công bố nguyên tử"
      - "Kiểm tra định dạng, cách ly bản ghi lỗi và báo cáo chất lượng"
      - "Chunk, checkpoint và tiếp tục lô bị gián đoạn"
      - "Lịch chạy, vùng thời gian, cửa sổ xử lý và chạy bù"
      - "Biên nhận, chống nạp trùng và đối soát tổng số bản ghi"
  - level1: "Tích hợp dữ liệu"
    level2:
      - "Phân biệt tích hợp nghiệp vụ và đồng bộ dữ liệu"
      - "ETL, ELT và vị trí thực hiện chuyển đổi dữ liệu"
      - "Full load, incremental load và mốc theo dõi thay đổi"
      - "CDC dựa trên log và ý nghĩa của bản ghi thay đổi"
      - "Phối hợp snapshot ban đầu với luồng thay đổi liên tục"
      - "Lan truyền thao tác xóa, tombstone và thay đổi khóa"
      - "Nguồn dữ liệu chuẩn, bản sao và quyền ghi của từng hệ thống"
      - "Rủi ro dùng chung cơ sở dữ liệu và truy cập trực tiếp schema nội bộ"
      - "Data lineage, kiểm tra chất lượng và phát hiện sai lệch dữ liệu"
  - level1: "Định tuyến và chuyển đổi"
    level2:
      - "Message channel và pipeline xử lý tích hợp"
      - "Content-based router và định tuyến theo metadata"
      - "Message filter và kiểm soát thông điệp không hợp lệ"
      - "Message translator và ánh xạ mô hình dữ liệu"
      - "Content enricher và quản lý phụ thuộc khi bổ sung dữ liệu"
      - "Splitter, aggregator và điều kiện hoàn tất tổng hợp"
      - "Recipient list, multicast và scatter-gather"
      - "Canonical data model và đánh đổi với ánh xạ trực tiếp"
      - "Bảo toàn định danh, trace context và lỗi qua các bước chuyển đổi"
  - level1: "Điều phối quy trình"
    level2:
      - "Orchestration và choreography trong quy trình nhiều hệ thống"
      - "Máy trạng thái và lưu tiến độ quy trình dài"
      - "Phân tách bước tiếp nhận, thực thi và xác nhận kết quả"
      - "Nhánh điều kiện, xử lý song song và điểm đồng bộ"
      - "Bộ hẹn giờ, hạn hoàn thành và chờ phản hồi từ hệ thống ngoài"
      - "Hủy tác vụ, hết hạn và phản hồi đến sau khi quy trình đóng"
      - "Quyền sở hữu trạng thái và tránh nhiều bên cùng điều khiển quy trình"
      - "Khôi phục quy trình sau khi worker hoặc dịch vụ khởi động lại"
      - "Điểm can thiệp thủ công và dấu vết quyết định nghiệp vụ"
  - level1: "Thời hạn và thử lại"
    level2:
      - "Phân loại lỗi tạm thời, lỗi vĩnh viễn và lỗi nghiệp vụ"
      - "Connection timeout, read timeout và deadline toàn bộ thao tác"
      - "Phân bổ ngân sách thời gian qua chuỗi lời gọi"
      - "Timeout không đồng nghĩa với bên nhận chưa xử lý"
      - "Điều kiện thử lại theo loại thao tác và trạng thái kết quả"
      - "Exponential backoff, jitter và giới hạn số lần thử"
      - "Retry budget và khuếch đại tải khi nhiều tầng cùng thử lại"
      - "Retry-After, giới hạn tốc độ và thời điểm gửi lại phù hợp"
      - "Truy vấn trạng thái hoặc đối soát trước khi lặp thao tác chưa rõ kết quả"
      - "Truyền deadline, hủy công việc và kiểm thử chính sách thử lại"
  - level1: "Cô lập và phục hồi"
    level2:
      - "Lỗi từng phần và nguy cơ lỗi lan truyền giữa các dịch vụ"
      - "Circuit breaker và các trạng thái đóng, mở, thăm dò"
      - "Bulkhead và cô lập pool kết nối, luồng xử lý hoặc tài nguyên"
      - "Load shedding, giới hạn đồng thời và từ chối tải vượt khả năng"
      - "Fallback, dữ liệu cũ và giới hạn chấp nhận theo nghiệp vụ"
      - "Store-and-forward khi hệ thống đích tạm thời không sẵn sàng"
      - "Cách ly thông điệp lỗi và bảo vệ luồng xử lý chính"
      - "Phục hồi có kiểm soát để tránh dồn tải sau sự cố"
      - "Đối soát và xử lý bù cho công việc bị bỏ dở"
  - level1: "Chống xử lý trùng"
    level2:
      - "Nguồn phát sinh trùng ở phía gửi, truyền tải và phía nhận"
      - "Phân biệt tính lũy đẳng với loại bỏ thông điệp trùng"
      - "Idempotency key và phạm vi duy nhất theo khách hàng hoặc thao tác"
      - "Lưu trạng thái đang xử lý, kết quả và phản hồi cho yêu cầu lặp"
      - "Phát hiện cùng khóa nhưng payload khác nhau"
      - "Unique constraint, thao tác nguyên tử và tranh chấp giữa worker"
      - "Inbox pattern và gắn nhận thông điệp với giao dịch nội bộ"
      - "TTL, lưu trữ khóa và cửa sổ chống trùng khi replay"
      - "Chống lặp hiệu ứng phụ với thanh toán, email và dịch vụ ngoài"
      - "Giới hạn exactly-once và cách xác định phạm vi bảo đảm thực tế"
  - level1: "Thứ tự và đồng thời"
    level2:
      - "Thứ tự toàn cục, thứ tự theo khóa và thứ tự nhân quả"
      - "Sequence number, phiên bản thực thể và phát hiện khoảng trống"
      - "Thông điệp đến muộn, sai thứ tự và dữ liệu cũ ghi đè dữ liệu mới"
      - "Tuần tự hóa theo thực thể và xử lý song song giữa các thực thể"
      - "Optimistic locking, compare-and-set và kiểm tra phiên bản"
      - "Khóa, lease, fencing token và giới hạn phối hợp phân tán"
      - "Ảnh hưởng của retry, redelivery và rebalance tới thứ tự"
      - "Buffer, resequencer và giới hạn thời gian chờ thông điệp thiếu"
      - "Chọn chính sách xung đột theo bất biến nghiệp vụ"
  - level1: "Giao dịch phân tán"
    level2:
      - "Phạm vi ACID cục bộ và ranh giới giao dịch giữa hệ thống"
      - "Dual write và các cửa sổ mất hoặc lệch dữ liệu"
