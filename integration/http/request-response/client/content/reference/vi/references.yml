references:
  - title: "IETF RFC 9110 — HTTP Semantics"
    url: "https://www.rfc-editor.org/rfc/rfc9110.html"
    description: "Đặc tả ngữ nghĩa HTTP method, status code, headers và request/response."
  - title: "Oracle Java SE 26 — HttpClient"
    url: "https://docs.oracle.com/en/java/javase/26/docs/api/java.net.http/java/net/http/HttpClient.html"
    description: "Java HttpClient, send/sendAsync, response body handlers và tái sử dụng kết nối."
  - title: "Spring Framework — REST Clients"
    url: "https://docs.spring.io/spring-framework/reference/integration/rest-clients.html"
    description: "Spring RestClient, WebClient, HTTP interface clients và xử lý request/response."
  - title: "Spring Framework — WebClient"
    url: "https://docs.spring.io/spring-framework/reference/web/webflux-webclient.html"
    description: "Cấu hình client non-blocking, request/response, body codecs và filters."
  - title: "IETF RFC 9457 — Problem Details for HTTP APIs"
    url: "https://www.rfc-editor.org/rfc/rfc9457.html"
    description: "Định dạng lỗi HTTP API có cấu trúc cho phép client ánh xạ và xử lý nhất quán."
  - title: "Resilience4j — Retry"
    url: "https://resilience4j.readme.io/docs/retry"
    description: "Cấu hình retry giới hạn, wait interval, exponential backoff và điều kiện thử lại."
  - title: "WireMock — Stubbing"
    url: "https://wiremock.org/docs/stubbing/"
    description: "Mô phỏng HTTP response để kiểm thử client khi thành công và thất bại."
  - title: "OWASP — SSRF Prevention Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html"
    description: "Kiểm soát URL, host đích và mạng khi client gọi tài nguyên bên ngoài."