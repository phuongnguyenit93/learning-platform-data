references:
  - title: "RFC 9110 — HTTP Semantics"
    url: "https://www.rfc-editor.org/rfc/rfc9110.html"
    description: "Chuẩn IETF về HTTP, URI, methods, status codes, field semantics và ngữ nghĩa dùng chung giữa các phiên bản."
  - title: "MDN — Overview of HTTP"
    url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview"
    description: "Tổng quan kiến trúc client–server, trao đổi request/response và thành phần HTTP."
  - title: "MDN — HTTP Messages"
    url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Messages"
    description: "Cấu trúc request và response: start line, header, body và lưu ý khác biệt HTTP/2."
  - title: "MDN — HTTP Request Methods"
    url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Methods"
    description: "Ý nghĩa GET, POST, PUT, PATCH, DELETE, tính safe, idempotent và cacheable."
  - title: "MDN — HTTP Response Status Codes"
    url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status"
    description: "Phân loại phản hồi 1xx–5xx và ý nghĩa các mã HTTP phổ biến."
  - title: "MDN — Content Negotiation"
    url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Content_negotiation"
    description: "Accept, Content-Type, định dạng dữ liệu và lựa chọn representation."
  - title: "MDN — HTTP Caching"
    url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching"
    description: "Cache-Control, private/shared cache, ETag, If-None-Match và 304 Not Modified."
  - title: "MDN — HTTP Authentication"
    url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Authentication"
    description: "Authorization, WWW-Authenticate, xác thực HTTP và khác biệt 401/403."
  - title: "MDN — Cross-Origin Resource Sharing"
    url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS"
    description: "Same-origin policy, CORS response headers và cơ chế preflight của trình duyệt."