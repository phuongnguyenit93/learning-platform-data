references:
  - title: "WHATWG HTML Standard — Server-sent events"
    url: "https://html.spec.whatwg.org/multipage/server-sent-events.html"
    description: "Chuẩn EventSource, định dạng text/event-stream, id, retry, Last-Event-ID và reconnect."
  - title: "MDN — Using server-sent events"
    url: "https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events"
    description: "Cách tạo EventSource, định dạng event stream, comments heartbeat, reconnect và lưu ý giới hạn kết nối."
  - title: "MDN — EventSource API"
    url: "https://developer.mozilla.org/en-US/docs/Web/API/EventSource"
    description: "API trình duyệt, message và custom events, readyState, close và phạm vi sử dụng SSE một chiều."
  - title: "Spring Framework — Asynchronous Requests (MVC)"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-ann-async.html"
    description: "Cấu hình và gửi SSE bằng SseEmitter, completion, timeout và phát hiện client ngắt kết nối."
  - title: "Spring WebFlux — Controller Return Values"
    url: "https://docs.spring.io/spring-framework/reference/web/webflux/controller/ann-methods/return-types.html"
    description: "Kiểu trả về Flux<ServerSentEvent> và điều kiện text/event-stream trong WebFlux."
  - title: "Spring WebFlux — Reactive Core"
    url: "https://docs.spring.io/spring-framework/reference/web/webflux/reactive-spring.html"
    description: "Đặc tính streaming, heartbeat và quản lý kết nối trong reactive stack."