menu:
  - level1: "Tổng quan SSE"
    level2:
      - "Mô hình giao tiếp sự kiện một chiều từ server đến client"
      - "Cách SSE duy trì luồng phản hồi trên một kết nối HTTP"
      - "Vai trò của server, trình duyệt và EventSource"
      - "So sánh SSE với polling và long polling"
      - "So sánh SSE với WebSocket và streaming qua Fetch API"
      - "Các trường hợp sử dụng: thông báo, tiến độ và dữ liệu cập nhật trực tiếp"
      - "Giới hạn của SSE đối với dữ liệu nhị phân và giao tiếp hai chiều"
      - "Phân biệt kết nối HTTP, luồng sự kiện và phiên nghiệp vụ"
      - "Lựa chọn Spring MVC SseEmitter hoặc Spring WebFlux"
      - "Chuẩn bị môi trường Java, Spring Boot và công cụ quan sát HTTP"
  - level1: "HTTP cho SSE"
    level2:
      - "Thiết kế endpoint GET trả về một luồng sự kiện dài hạn"
      - "Content-Type text/event-stream và mã hóa UTF-8"
      - "Accept header và thương lượng nội dung với client"
      - "Gửi header sớm và flush dữ liệu để client nhận kịp thời"
      - "Phân biệt truyền dữ liệu theo chunk ở HTTP/1.1 và stream ở HTTP/2"
      - "Bộ nhớ đệm HTTP, Cache-Control và nguy cơ cache nhầm luồng sự kiện"
      - "Content-Length, response streaming và phản hồi chưa kết thúc"
      - "Ảnh hưởng của nén nội dung đến buffering và độ trễ"
      - "Mã trạng thái HTTP trước khi mở luồng và giới hạn sau khi commit response"
      - "Phân biệt TCP keepalive, HTTP keep-alive và heartbeat của SSE"
  - level1: "Định dạng event-stream"
    level2:
      - "Cấu trúc thông điệp SSE và dòng trống kết thúc một sự kiện"
      - "Trường data và cách ghép nhiều dòng dữ liệu bằng ký tự xuống dòng"
      - "Trường event và phân biệt message mặc định với sự kiện có tên"
      - "Trường id và trạng thái ID sự kiện cuối cùng"
      - "Trường retry và giá trị thời gian reconnect tính bằng mili giây"
      - "Dòng comment bắt đầu bằng dấu hai chấm để gửi heartbeat"
      - "Quy tắc dấu hai chấm, khoảng trắng đầu giá trị và trường không được nhận diện"
      - "Xử lý LF, CRLF, CR và thông điệp bị chia giữa các lần đọc mạng"
      - "Trường id rỗng, ký tự NUL và các giá trị retry không hợp lệ"
      - "Đóng gói JSON, Unicode và dữ liệu nhiều dòng trong thông điệp SSE"
  - level1: "EventSource cơ bản"
    level2:
      - "Khởi tạo EventSource và đăng ký một endpoint SSE"
      - "Theo dõi readyState với CONNECTING, OPEN và CLOSED"
      - "Xử lý onopen, onmessage và onerror"
      - "Lắng nghe sự kiện có tên bằng addEventListener"
      - "Đọc data, lastEventId và origin từ MessageEvent"
      - "Phân tích JSON và xử lý payload không hợp lệ"
      - "Đóng kết nối chủ động bằng close"
      - "Kết nối cùng origin và cấu hình withCredentials cho khác origin"
      - "Giới hạn của EventSource gốc đối với method, request body và custom header"
      - "Lựa chọn Fetch streaming hoặc thư viện thay thế khi cần kiểm soát request"
  - level1: "Reconnect phía client"
    level2:
      - "Vòng đời kết nối khi mở trang, mất mạng và kết nối trở lại"
      - "Cơ chế reconnect tự động của EventSource và tác động của trường retry"
      - "Phân biệt sự kiện lỗi kết nối với sự kiện lỗi nghiệp vụ"
      - "Hành vi khi stream kết thúc, sai Content-Type hoặc nhận phản hồi HTTP lỗi"
      - "Dùng HTTP 204 để thông báo client ngừng reconnect"
      - "Thiết kế backoff và jitter khi ứng dụng tự quản lý việc kết nối lại"
      - "Tránh tạo nhiều vòng reconnect đồng thời với cơ chế của EventSource"
      - "Quản lý kết nối khi chuyển trang, đăng xuất hoặc component bị hủy"
      - "Khôi phục sau khi tab ngủ, thiết bị đổi mạng hoặc trình duyệt quay lại trang"
      - "Hiển thị trạng thái đang kết nối, gián đoạn và dữ liệu có thể đã cũ"
  - level1: "Event ID và phát lại"
    level2:
      - "Thiết kế event ID duy nhất và phạm vi thứ tự theo luồng hoặc partition"
      - "Cách trình duyệt gửi Last-Event-ID khi EventSource reconnect"
      - "Phân biệt reconnect của cùng EventSource với tạo một đối tượng mới"
      - "Lưu cursor phía ứng dụng để tiếp tục sau khi tải lại trang"
      - "Xác định ranh giới replay và tránh bỏ sót giữa dữ liệu cũ với dữ liệu mới"
      - "Lưu sự kiện trong bộ đệm có giới hạn hoặc nhật ký bền vững"
      - "Xử lý cursor quá cũ, không hợp lệ hoặc nằm ngoài cửa sổ lưu trữ"
      - "Kết hợp snapshot ban đầu với cập nhật tăng dần"
      - "Khử trùng lặp và xử lý idempotent khi sự kiện được gửi lại"
      - "Giới hạn bảo đảm giao nhận của SSE và thiết kế xác nhận qua API riêng"
  - level1: "Hợp đồng sự kiện"
    level2:
      - "Đặt tên sự kiện theo ngữ nghĩa nghiệp vụ và vòng đời tài nguyên"
      - "Thiết kế envelope gồm ID, loại, thời gian, phiên bản và payload"
      - "Chọn định dạng thời gian, múi giờ và quy tắc biểu diễn giá trị"
      - "Phân biệt dữ liệu snapshot, delta và thông báo vô hiệu hóa cache"
      - "Thiết kế sự kiện bắt đầu, tiến độ, hoàn tất và thất bại"
      - "Phân biệt sự kiện kết thúc nghiệp vụ với thao tác đóng kết nối mạng"
      - "Tiến hóa schema và duy trì tương thích với client cũ"
      - "Giới hạn kích thước payload và tham chiếu dữ liệu lớn qua API"
      - "Lọc sự kiện theo chủ đề, tài nguyên và quyền truy cập"
      - "Tài liệu hóa endpoint, schema, mã lỗi và quy tắc reconnect"
  - level1: "Kiến trúc luồng sự kiện"
    level2:
      - "Tách nguồn phát sự kiện, tầng phân phối và tầng HTTP SSE"
      - "Ánh xạ người dùng, tenant và chủ đề tới các subscriber"
      - "Quản lý registry kết nối và định danh từng phiên kết nối"
      - "Kết hợp REST API cho lệnh ghi với SSE cho thông báo thay đổi"
      - "Phân phối một sự kiện tới nhiều client theo mô hình fan-out"
      - "Phát sự kiện sau khi giao dịch cơ sở dữ liệu commit thành công"
      - "Áp dụng transactional outbox hoặc CDC để giảm khoảng trống đồng bộ dữ liệu"
      - "Tích hợp Redis Pub/Sub, Redis Streams hoặc Kafka theo nhu cầu lưu trữ và replay"
      - "Phân biệt broadcast tới mọi node với chia tải qua consumer group"
      - "Tách thứ tự sự kiện tại nguồn khỏi thứ tự nhận và áp dụng ở client"
  - level1: "Spring MVC với SSE"
    level2:
      - "Khai báo controller trả về SseEmitter với text/event-stream"
      - "Thiết lập timeout cho SseEmitter và xử lý request bất đồng bộ"
      - "Gửi dữ liệu bằng SseEmitter.event với data, name, id và reconnectTime"
      - "Cấu hình chuyển đổi JSON và kiểm soát kiểu dữ liệu payload"
      - "Đăng ký emitter theo người dùng, tenant hoặc chủ đề"
      - "Phát sự kiện từ service nghiệp vụ tới các emitter phù hợp"
      - "Cấu hình executor có giới hạn cho tác vụ phát sự kiện"
      - "Đồng bộ việc gửi khi nhiều producer cùng ghi vào một emitter"
      - "Cấu hình Servlet async và các thành phần filter liên quan"
      - "Hoàn tất luồng bằng complete và xử lý lỗi với completeWithError"
  - level1: "Vòng đời SseEmitter"
    level2:
      - "Đăng ký onCompletion, onTimeout và onError để theo dõi emitter"
      - "Dọn registry, timer và subscription theo cách idempotent"
      - "Nhận diện client ngắt kết nối khi ghi dữ liệu hoặc nhận callback"
      - "Xử lý IOException và tránh tiếp tục gửi trên emitter đã đóng"
      - "Lập lịch heartbeat dùng chung và hủy lịch khi kết nối kết thúc"
      - "Phân biệt timeout Servlet async với timeout của proxy và mạng"
      - "Xử lý race condition giữa gửi sự kiện, timeout và đóng kết nối"
      - "Giới hạn hàng đợi gửi và cách ly emitter của client chậm"
      - "Truyền ngữ cảnh log và thông tin người dùng sang tác vụ bất đồng bộ"
      - "Thu hồi kết nối và tài nguyên khi ứng dụng dừng hoặc người dùng đăng xuất"
  - level1: "Spring WebFlux với SSE"
    level2:
      - "Khai báo endpoint trả về Flux với text/event-stream"
      - "Sử dụng ServerSentEvent để biểu diễn data, event, id, retry và comment"
      - "Phân biệt Flux payload thuần với Flux ServerSentEvent"
      - "Tạo luồng từ nguồn nghiệp vụ, timer hoặc message broker"
      - "Kết hợp heartbeat với sự kiện dữ liệu trong cùng một response"
      - "Cấu hình codec JSON, kiểu payload và giới hạn dữ liệu liên quan"
      - "Thiết kế endpoint bằng annotated controller hoặc functional routing"
      - "Xử lý lỗi trước và sau khi response được commit"
      - "Xây dựng client Java nhận SSE bằng WebClient"
      - "Chọn mô hình reactive dựa trên nguồn dữ liệu và cách quản lý tài nguyên"
  - level1: "Quản lý luồng reactive"
    level2:
      - "Phân biệt publisher cold và hot khi có nhiều subscriber SSE"
      - "Chọn Sinks unicast, multicast hoặc replay theo nhu cầu phân phối"
      - "Xử lý kết quả phát của Sinks và tình huống phát đồng thời"
      - "Quản lý share, publish và refCount khi subscriber xuất hiện hoặc rời đi"
      - "Giới hạn bộ nhớ replay và thời gian giữ sự kiện"
      - "Xử lý cancel và dọn tài nguyên bằng doFinally hoặc cơ chế quản lý tài nguyên"
      - "Đưa tác vụ blocking khỏi event loop và kiểm soát scheduler"
      - "Phân biệt demand trong Reactive Streams với tốc độ xử lý thực tế ở trình duyệt"
      - "Bảo toàn thứ tự khi dùng map, flatMap hoặc concatMap"
      - "Tránh subscription trùng, rò rỉ nguồn phát và chia sẻ dữ liệu giữa tenant"
  - level1: "Tích hợp giao diện"
    level2:
      - "Đóng gói EventSource thành service dùng chung trong ứng dụng frontend"
      - "Đăng ký và hủy listener đúng vòng đời component"
      - "Kết hợp tải dữ liệu ban đầu qua REST với cập nhật SSE"
      - "Áp dụng sự kiện theo ID và tránh cập nhật trùng trạng thái"
      - "Gộp nhiều cập nhật để giảm số lần render giao diện"
      - "Giới hạn lịch sử sự kiện và dữ liệu lưu trong bộ nhớ trình duyệt"
      - "Xử lý sự kiện đến muộn hoặc sai thứ tự so với trạng thái hiện tại"
      - "Phối hợp nhiều tab bằng BroadcastChannel hoặc SharedWorker khi phù hợp"
      - "Quản lý kết nối theo trạng thái đăng nhập và chuyển đổi tài khoản"
      - "Thiết kế thông báo lỗi, thao tác thử lại và khả năng tiếp cận giao diện"
  - level1: "Xác thực và phân quyền"
    level2:
      - "Áp dụng Spring Security cho endpoint SSE của MVC hoặc WebFlux"
      - "Xác thực bằng session cookie và tích hợp EventSource cùng origin"
      - "Kết nối khác origin với cookie, withCredentials và CORS"
      - "Truyền Authorization header bằng client hỗ trợ tùy biến request"
      - "Dùng vé kết nối ngắn hạn khi EventSource gốc không đáp ứng cơ chế xác thực"
      - "Đánh giá nguy cơ lộ token trong URL, log và công cụ giám sát"
      - "Phân quyền theo tài nguyên, chủ đề, người dùng và tenant"
      - "Xử lý hết hạn thông tin xác thực trong một kết nối dài hạn"
      - "Thu hồi quyền và đóng các kết nối còn hoạt động khi đăng xuất"
      - "Phân quyền lại dữ liệu replay và ngăn truy cập cursor của người khác"
  - level1: "Bảo mật ứng dụng"
    level2:
      - "Bảo vệ luồng sự kiện bằng HTTPS và kiểm tra cấu hình TLS"
      - "Cấu hình allowlist origin và tránh hiểu CORS như cơ chế xác thực"
      - "Giữ endpoint GET không có tác dụng ghi và đánh giá CSRF theo cơ chế đăng nhập"
      - "Cấu hình SameSite, Secure và HttpOnly cho cookie liên quan"
      - "Giới hạn kết nối và tốc độ reconnect theo tài khoản hoặc nguồn truy cập"
      - "Kiểm tra đầu vào và ngăn chèn trường SSE qua ký tự xuống dòng"
      - "Kiểm tra payload và tránh XSS khi hiển thị dữ liệu sự kiện"
      - "Tối thiểu hóa dữ liệu nhạy cảm trong payload, cursor và log"
      - "Cấu hình Content Security Policy với connect-src cho endpoint SSE"
      - "Ngăn rò rỉ dữ liệu do dùng chung cache, sink hoặc kênh phát giữa tenant"
  - level1: "Backpressure và client chậm"
    level2:
      - "Nhận diện chênh lệch tốc độ giữa producer, server và client"
      - "Phân biệt bộ đệm tại ứng dụng, HTTP server, proxy và trình duyệt"
      - "Thiết lập hàng đợi có giới hạn cho từng kết nối"
      - "Chọn chính sách drop, giữ giá trị mới nhất, gộp cập nhật hoặc ngắt kết nối"
      - "Phân loại sự kiện được phép bỏ qua và sự kiện cần lưu để replay"
      - "Cách ly client chậm để tránh chặn toàn bộ quá trình fan-out"
      - "Áp dụng toán tử backpressure trong Reactor theo đặc điểm nguồn phát"
      - "Điều tiết tốc độ, batching và lấy mẫu theo mục tiêu độ trễ"
      - "Giới hạn kích thước thông điệp và ngân sách bộ nhớ trên mỗi kết nối"
      - "Đo độ trễ hàng đợi và xây dựng cơ chế đồng bộ lại sau khi quá tải"
  - level1: "Proxy và mạng trung gian"
    level2:
      - "Mô hình đường đi qua reverse proxy, ingress, load balancer và CDN"
      - "Tắt response buffering phù hợp cho endpoint SSE trên Nginx"
      - "Sử dụng X-Accel-Buffering theo khả năng và cấu hình của proxy"
      - "Điều chỉnh idle timeout, read timeout và giới hạn thời lượng kết nối"
      - "Thiết kế chu kỳ heartbeat phù hợp với các tầng hạ tầng"
      - "Kiểm tra buffering do gzip và các lớp nén trung gian"
      - "Cấu hình cache bypass và tránh biến đổi nội dung event-stream"
      - "Đánh giá giới hạn kết nối ở HTTP/1.1 và khả năng ghép luồng của HTTP/2"
      - "Kiểm tra hành vi WAF, API gateway và CDN đối với response streaming"
      - "Đo đường truyền thực tế qua proxy với curl và công cụ trình duyệt"
  - level1: "Mở rộng hệ thống"
    level2:
      - "Ước lượng số kết nối đồng thời và mức fan-out trên từng node"
      - "Thiết kế node SSE không giữ trạng thái bền vững cục bộ"
      - "Chia sẻ sự kiện giữa các node qua broker hoặc nhật ký sự kiện"
      - "Định tuyến sự kiện tới node đang giữ kết nối của người dùng"
      - "Đánh giá sticky session và giới hạn khi node bị mất"
      - "Chia partition theo tenant, chủ đề hoặc khóa nghiệp vụ"
      - "Điều phối replay khi client reconnect sang một node khác"
      - "Mở rộng tự động theo kết nối, tốc độ sự kiện và áp lực tài nguyên"
      - "Giới hạn và phân bổ công bằng tài nguyên cho từng tenant"
      - "Ngăn reconnect đồng loạt khi triển khai, mất node hoặc gián đoạn mạng"
  - level1: "Phục hồi và độ tin cậy"
    level2:
      - "Xây dựng mô hình lỗi từ nguồn dữ liệu tới quá trình áp dụng ở client"
      - "Phân biệt đã gửi vào socket, client đã nhận và nghiệp vụ đã xử lý"
      - "Thiết kế replay hỗ trợ xử lý ít nhất một lần trong phạm vi lưu trữ"
      - "Phát hiện khoảng trống sự kiện và yêu cầu đồng bộ lại bằng snapshot"
      - "Xử lý broker gián đoạn và giới hạn dữ liệu giữ trong bộ nhớ"
      - "Khôi phục subscription khi nguồn phát hoạt động trở lại"
      - "Bảo toàn thứ tự trong phạm vi khóa và xử lý dữ liệu đến muộn"
      - "Cách ly payload lỗi để một sự kiện không làm hỏng toàn bộ luồng"
      - "Thiết kế chế độ suy giảm bằng polling hoặc thông báo dữ liệu tạm ngừng"
      - "Xác định mục tiêu phục hồi và cửa sổ replay phù hợp nghiệp vụ"
  - level1: "Hiệu năng và tài nguyên"
    level2:
      - "Lập ngân sách bộ nhớ, socket và file descriptor cho kết nối dài hạn"
      - "Đánh giá mô hình thread của Servlet async và event loop reactive"
