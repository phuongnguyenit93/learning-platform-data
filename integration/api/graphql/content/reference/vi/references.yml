references:
  - title: "GraphQL - Schemas and Types"
    url: "https://graphql.org/learn/schema/"
    description: "Hệ thống kiểu, SDL, root types, input, list, non-null và mô tả schema."
  - title: "GraphQL - Queries"
    url: "https://graphql.org/learn/queries/"
    description: "Selection sets, fields, arguments, variables, aliases và fragments."
  - title: "GraphQL - Mutations"
    url: "https://graphql.org/learn/mutations/"
    description: "Định nghĩa mutation để cập nhật dữ liệu và sử dụng input types."
  - title: "GraphQL - Response"
    url: "https://graphql.org/learn/response/"
    description: "Cấu trúc data/errors, lỗi request, field errors và partial data."
  - title: "GraphQL - Pagination"
    url: "https://graphql.org/learn/pagination/"
    description: "Cursor-based pagination, edges, connections và pageInfo."
  - title: "GraphQL - Subscriptions"
    url: "https://graphql.org/learn/subscriptions/"
    description: "Subscription cho sự kiện thời gian thực và các tùy chọn transport."
  - title: "GraphQL - Security"
    url: "https://graphql.org/learn/security/"
    description: "Phân quyền, depth, query complexity, rate limits và bảo vệ tài nguyên."
  - title: "GraphQL Java - Getting Started"
    url: "https://graphql-java.com/documentation/getting-started/"
    description: "Tích hợp graphql-java, định nghĩa schema và thực thi truy vấn trong Java."
  - title: "GraphQL Java - Data Fetching"
    url: "https://graphql-java.com/documentation/data-fetching/"
    description: "DataFetcher, runtime wiring và cơ chế lấy dữ liệu cho mỗi field."
  - title: "GraphQL Java - Java DataLoader"
    url: "https://github.com/graphql-java/java-dataloader"
    description: "Batching, caching theo request để giải quyết vấn đề N+1."
  - title: "Spring GraphQL - Annotated Controllers"
    url: "https://docs.spring.io/spring-graphql/reference/controllers.html"
    description: "@QueryMapping, @MutationMapping, @SchemaMapping và @Argument."
  - title: "Spring GraphQL - Testing"
    url: "https://docs.spring.io/spring-graphql/reference/testing.html"
    description: "Dùng GraphQlTester kiểm thử operation, response, errors và subscriptions."