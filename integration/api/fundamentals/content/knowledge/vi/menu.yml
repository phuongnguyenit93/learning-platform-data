      - "Ghi nhận giả định, giới hạn và các trường hợp nằm ngoài phạm vi"
      - "Xác lập tiêu chí thành công và tiêu chí chấp nhận của hợp đồng"
  - level1: "Các kiểu API và mô hình tương tác"
    level2:
      - "So sánh API cục bộ với API qua mạng"
      - "Mô hình request–response đồng bộ và sự phụ thuộc theo thời gian"
      - "Mô hình bất đồng bộ, hàng đợi và giao tiếp dựa trên sự kiện"
      - "Polling, webhook và streaming dưới góc nhìn nhu cầu tích hợp"
      - "API hướng tài nguyên và API hướng thao tác"
      - "REST như một phong cách kiến trúc và giới hạn của nhãn RESTful"
      - "Các ràng buộc REST về client–server, stateless, cache và hệ thống phân lớp"
      - "Giao diện thống nhất, biểu diễn tài nguyên và vai trò của liên kết hypermedia"
      - "RPC và gRPC ở mức khái niệm về thao tác và hợp đồng"
