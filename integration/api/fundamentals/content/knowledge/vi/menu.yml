      - "Định danh, mã nghiệp vụ và giá trị hiển thị có thể thay đổi"
      - "Trường chỉ đọc, trường chỉ ghi và dữ liệu do hệ thống suy ra"
      - "Thiết kế tham chiếu, dữ liệu nhúng và ảnh chụp dữ liệu theo thời điểm"
      - "Ghi rõ độ chính xác, độ mới và nguồn gốc của dữ liệu trả về"
  - level1: "Tiếp nhận đầu vào, kiểm tra hợp lệ và cập nhật"
