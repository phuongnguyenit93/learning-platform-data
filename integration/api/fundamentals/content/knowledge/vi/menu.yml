      - "Chi phí của hợp đồng mơ hồ và kỳ vọng ngầm giữa các hệ thống"
      - "Những ngộ nhận phổ biến khi xem API chỉ là một đường dẫn HTTP"
  - level1: "Xác định nhu cầu tích hợp và phạm vi hợp đồng"
