      - "Phân biệt thông báo sự kiện với yêu cầu thực hiện lệnh"
      - "Tiêu chí chọn kiểu tương tác theo môi trường, độ trễ và mức độ liên kết"
  - level1: "Vòng đời request–response và ranh giới lỗi qua mạng"
    level2:
      - "Các thành phần của một request và một response"
      - "Luồng gọi từ ứng dụng khách qua các thành phần trung gian đến máy chủ"
      - "Phân biệt địa chỉ mạng, địa chỉ dịch vụ và định danh tài nguyên"
      - "Vai trò của DNS, kết nối TCP, TLS và HTTP trong một lần gọi"
      - "Kết nối, thời gian chờ xử lý và hạn chót của toàn bộ lời gọi"
      - "Phân biệt lỗi truyền tải, lỗi giao thức và lỗi nghiệp vụ"
      - "Vì sao không nhận được response chưa đủ để kết luận thao tác thất bại"
      - "Lỗi xảy ra trước, trong và sau khi máy chủ thực hiện thay đổi"
      - "Tác động của proxy, gateway và cân bằng tải lên hành vi quan sát được"
      - "Trạng thái tại phía gọi, phía phục vụ và các hệ thống phụ thuộc"
      - "Diễn giải một cuộc trao đổi request–response từ đầu đến cuối"
  - level1: "Nền tảng HTTP và cấu trúc thông điệp"
    level2:
      - "Cấu trúc URI và vai trò của scheme, authority, path, query và fragment"
      - "Phân biệt URL, URI, endpoint và base URL"
      - "Phân biệt method, request target, header và message body"
      - "Cấu trúc response với status code, header và body"
      - "Mã hóa ký tự, percent-encoding và quy tắc xử lý ký tự đặc biệt"
      - "HTTPS và phạm vi bảo vệ của mã hóa trên đường truyền"
      - "Nguyên tắc stateless của HTTP và trạng thái ở tầng ứng dụng"
      - "Các thành phần trung gian và yêu cầu giữ đúng ngữ nghĩa HTTP"
      - "HTTP/1.1, HTTP/2 và HTTP/3 ở mức khái niệm truyền tải"
      - "Kết nối dùng lại, ghép kênh và giới hạn tài nguyên kết nối"
      - "Phân biệt header chuẩn, header mở rộng và metadata của ứng dụng"
      - "Đọc và diễn giải thông điệp HTTP thô với công cụ dòng lệnh"
  - level1: "Mô hình tài nguyên và thiết kế URI"
    level2:
      - "Chuyển khái niệm nghiệp vụ thành tài nguyên có danh tính"
      - "Phân biệt tài nguyên đơn, tập hợp và tài nguyên quan hệ"
      - "Chọn định danh ổn định và tránh để lộ chi tiết lưu trữ"
      - "Định danh do máy chủ cấp và định danh do phía gọi cung cấp"
      - "Thiết kế đường dẫn nhất quán theo danh từ và phạm vi nghiệp vụ"
      - "Biểu diễn quan hệ bằng lồng đường dẫn, tham chiếu và liên kết"
      - "Cân nhắc độ sâu của URI và vòng đời độc lập của tài nguyên"
      - "Phân biệt thuộc tính tài nguyên với tài nguyên con độc lập"
      - "Biểu diễn thao tác nghiệp vụ khó quy về CRUD"
      - "Thiết kế vòng đời tài nguyên và các chuyển trạng thái hợp lệ"
      - "Phân biệt xóa vật lý, xóa logic, lưu trữ và thời hạn tồn tại"
      - "Nhận diện các thiết kế URI khiến bên gọi phụ thuộc cấu trúc nội bộ"
  - level1: "Ngữ nghĩa phương thức HTTP và thao tác tài nguyên"
    level2:
      - "GET và yêu cầu đọc dữ liệu không gây thay đổi nghiệp vụ"
      - "HEAD và việc truy xuất metadata mà không lấy response body"
      - "POST để tạo tài nguyên và khởi tạo thao tác xử lý"
      - "PUT với ý nghĩa tạo hoặc thay thế tại một URI xác định"
      - "PATCH và hợp đồng cập nhật từng phần"
      - "DELETE và ý nghĩa xóa liên kết với tài nguyên đích"
      - "OPTIONS và việc mô tả khả năng giao tiếp của endpoint"
      - "Phân biệt phương thức an toàn với phương thức có tính lũy đẳng"
      - "Ngữ nghĩa phương thức và các tác dụng phụ mà phía gọi quan sát được"
      - "Lựa chọn method cho tạo mới, cập nhật, xóa và hành động nghiệp vụ"
      - "Hợp đồng khi thao tác lặp lại trên tài nguyên đã tồn tại hoặc đã bị xóa"
      - "Các lỗi thiết kế khi dùng GET để thay đổi dữ liệu hoặc POST cho mọi thao tác"
  - level1: "Mã trạng thái HTTP và metadata của phản hồi"
    level2:
      - "Ý nghĩa của các nhóm mã 1xx, 2xx, 3xx, 4xx và 5xx"
      - "Phân biệt 200, 201, 202 và 204 theo kết quả xử lý"
      - "Mã 304 khi xác thực cache và 206 khi trả một phần nội dung"
      - "Sử dụng Location khi tạo tài nguyên hoặc công bố nơi theo dõi tác vụ"
      - "Mã 301, 302, 303, 307 và 308 với ảnh hưởng tới method khi chuyển hướng"
      - "Phân biệt 400, 415 và 422 theo định dạng, kiểu nội dung và tính hợp lệ"
      - "Phân biệt 401, 403 và 404 trong thiết kế trải nghiệm truy cập"
      - "Phân biệt 409 và 412 khi có xung đột trạng thái hoặc điều kiện"
      - "Phân biệt 429, 503 và phản hồi có hướng dẫn thử lại"
      - "Phân biệt 500, 502 và 504 theo nơi phát sinh lỗi và thời gian chờ"
      - "Lựa chọn response body cho thành công, kết quả rỗng và lỗi"
      - "Giữ nhất quán giữa status code, header và ý nghĩa trong body"
  - level1: "Biểu diễn dữ liệu và hợp đồng schema"
    level2:
      - "Phân biệt tài nguyên, mô hình miền và biểu diễn trao đổi qua API"
      - "Lựa chọn JSON, XML, dữ liệu nhị phân hoặc văn bản theo nhu cầu"
      - "Vai trò của Content-Type và Accept trong thương lượng nội dung"
      - "Encoding, charset và khác biệt giữa nội dung với cách truyền nội dung"
      - "Thiết kế object, array và cấu trúc lồng dễ sử dụng"
      - "Phân biệt thuộc tính bắt buộc, thuộc tính tùy chọn và giá trị mặc định"
      - "Quy ước đặt tên trường và giữ nhất quán trong toàn bộ API"
      - "Định nghĩa schema với kiểu, định dạng, giới hạn và ràng buộc"
      - "Xử lý trường chưa biết và dữ liệu mở rộng trong hợp đồng"
      - "Biểu diễn tài nguyên đơn, danh sách và metadata bằng cấu trúc phù hợp"
      - "Ví dụ dữ liệu hợp lệ, dữ liệu biên và dữ liệu không hợp lệ"
  - level1: "Ngữ nghĩa của trường dữ liệu và các trường hợp biên"
