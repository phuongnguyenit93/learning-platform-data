references:
  - title: "MDN — Overview of HTTP"
    url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview"
    description: "Mô hình client-server, request/response, header, HTTP và tính stateless."
  - title: "IETF RFC 9110 — HTTP Semantics"
    url: "https://www.rfc-editor.org/rfc/rfc9110.html"
    description: "Quy định ngữ nghĩa HTTP method, status code, URI và content negotiation."
  - title: "Microsoft Learn — Web API Design"
    url: "https://learn.microsoft.com/en-gb/azure/architecture/best-practices/api-design"
    description: "Thiết kế endpoint tài nguyên, pagination, versioning, khả năng tương thích và API contract."
  - title: "Google Cloud — API Design Guide"
    url: "https://docs.cloud.google.com/apis/design"
    description: "Nguyên tắc thiết kế giao diện API mạng, áp dụng cho cả REST và RPC."
  - title: "OpenAPI Initiative — Specification v3.2.1"
    url: "https://spec.openapis.org/oas/v3.2.1.html"
    description: "Định nghĩa chuẩn mô tả contract của HTTP API: paths, operations, schemas và responses."
  - title: "IETF RFC 9457 — Problem Details"
    url: "https://www.rfc-editor.org/rfc/rfc9457.html"
    description: "Định dạng lỗi có cấu trúc, dễ đọc máy cho HTTP APIs."
  - title: "OWASP — API Security Top 10 (2023)"
    url: "https://api-security.owasp.org/editions/2023/en/0x11-t10/"
    description: "Các rủi ro xác thực, phân quyền đối tượng, lộ dữ liệu và tài nguyên API."
  - title: "IETF RFC 6749 — OAuth 2.0"
    url: "https://www.rfc-editor.org/rfc/rfc6749.html"
    description: "Khung ủy quyền OAuth 2.0 và các vai trò client, authorization server, resource server."
  - title: "Microsoft Learn — Web API Implementation"
    url: "https://learn.microsoft.com/en-us/azure/architecture/best-practices/api-implementation"
    description: "Idempotency, retry, validation, kiểm thử API và theo dõi chất lượng vận hành."