  - '@Oneway và giới hạn của thao tác một chiều'
  - Endpoint.publish và phạm vi dùng cho thực hành
  - Triển khai endpoint qua runtime trong servlet container
  - Tách xử lý giao thức khỏi service nghiệp vụ
  - WebServiceContext, MessageContext và thông tin yêu cầu
  - Vòng đời endpoint và xử lý đồng thời
  - Xuất WSDL, cấu hình địa chỉ công khai và xác minh hợp đồng
  - Chọn SOAP binding và bật các feature được runtime hỗ trợ
- level1: Client SOAP Java
