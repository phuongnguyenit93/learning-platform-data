  - Xử lý trực tiếp XML bằng DOM, Source hoặc XPath
  - EndpointInterceptor và kiểm tra payload theo schema
  - SoapFaultMappingExceptionResolver và ánh xạ lỗi
  - WebServiceTemplate và marshalling khi gọi dịch vụ
  - WebServiceMessageCallback để bổ sung header và action
  - Message factory, message sender và cấu hình timeout
  - Wss4jSecurityInterceptor và tích hợp kiểm tra bảo mật
  - Tách cấu hình giao thức khỏi logic nghiệp vụ
- level1: Apache CXF
