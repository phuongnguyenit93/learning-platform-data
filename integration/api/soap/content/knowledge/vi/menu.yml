  - Cấu hình tác vụ sinh mã trong Gradle hoặc Maven
  - Binding customization cho package, tên lớp và kiểu dữ liệu
  - Quản lý WSDL import, XSD import và XML catalog
  - Sinh mã offline từ bộ hợp đồng đã được chốt
  - Khóa phiên bản công cụ để kết quả có thể tái lập
