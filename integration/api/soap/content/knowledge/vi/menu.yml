  - Tắt DTD, external entity và kiểm soát truy cập schema bên ngoài
  - Giới hạn độ sâu XML, entity expansion và kích thước payload
  - Chọn thuật toán, cấu hình WSS4J và kiểm thử thông điệp giả mạo
- level1: WS-Policy
  level2:
  - Policy mô tả yêu cầu dịch vụ và khác biệt với mã triển khai
  - Policy assertion, alternative, ExactlyOne và All
  - PolicyReference và gắn policy vào WSDL
  - Khả năng bắt buộc, tùy chọn và nhận diện assertion không hỗ trợ
  - WS-SecurityPolicy cho token, ký và mã hóa
  - TransportBinding, AsymmetricBinding và SymmetricBinding
  - Policy liên quan đến addressing, MTOM và reliable messaging
  - Đối chiếu policy với cấu hình thực tế của client, server
  - Chẩn đoán policy alternative không tương thích
  - Quản lý policy import và bộ hợp đồng có thể dùng offline
- level1: Tin cậy và giao dịch
  level2:
  - Timeout không chứng minh thao tác nghiệp vụ chưa thực hiện
  - Retry, backoff và tính lũy đẳng ở tầng ứng dụng
  - Mã yêu cầu, lưu kết quả và phát hiện yêu cầu trùng
  - 'WS-ReliableMessaging: sequence, message number và acknowledgment'
  - Gửi lại, bảo đảm thứ tự và lưu trạng thái phục hồi
  - Phân biệt xác nhận giao thức với hoàn tất tác dụng phụ nghiệp vụ
  - Khả năng hỗ trợ WS-RM và kiểm tra tương thích hai đầu
  - WS-Coordination và vai trò của ngữ cảnh điều phối
  - WS-AtomicTransaction và ranh giới giao dịch phân tán
  - Hỗ trợ WS-AT phụ thuộc runtime và hệ thống quản lý giao dịch
  - Phân biệt giao dịch cục bộ, WS-AT và xử lý bù
  - Đánh đổi khóa tài nguyên, thời gian chờ và khả năng phục hồi
  - Chọn thử lại, đối soát hoặc xử lý bù khi kết quả không xác định
- level1: Liên thông
  level2:
  - WS-I Basic Profile và phạm vi bảo đảm tương thích
  - Đối chiếu SOAP version, WSDL version và binding style
  - Khác biệt giữa namespace prefix và namespace URI
  - Wrapped, bare và cách các nền tảng sinh chữ ký phương thức
  - Null, nillable, optional và danh sách rỗng giữa Java, .NET
  - Ngày giờ, múi giờ, precision của decimal và enum mở rộng
  - SOAPAction, action và WS-Addressing khi gọi khác nền tảng
  - Khác biệt SOAP Fault và cách ánh xạ exception của client
  - Liên thông MTOM, MIME type và tên attachment
  - Liên thông WS-Security, thuật toán và policy
  - Đọc dịch vụ Axis hoặc rpc/encoded cũ và lựa chọn adapter
  - Chốt thông điệp mẫu cùng bộ kiểm thử liên thông với đối tác
- level1: Kiểm thử
  level2:
  - Phân chia unit test, contract test và integration test
  - Kiểm tra WSDL, XSD và các import trước khi triển khai
  - Gửi SOAP thô bằng curl để kiểm chứng thông điệp trên đường truyền
  - SoapUI cho request, assertion, test suite và dữ liệu mẫu
  - Kiểm tra XML bằng QName, XPath và schema
  - XMLUnit và so sánh XML theo ý nghĩa thay vì chuỗi ký tự
  - MockWebServiceClient để kiểm thử endpoint Spring-WS
  - MockWebServiceServer để kiểm thử WebServiceTemplate
  - Stub HTTP và mô phỏng timeout, HTTP error, SOAP Fault
  - Kiểm thử mustUnderstand, namespace và phiên bản không khớp
  - Kiểm thử chữ ký, token hết hạn, replay và payload XML không an toàn
  - Kiểm thử MTOM, dữ liệu lớn và ngắt kết nối giữa chừng
  - Kiểm thử thay đổi hợp đồng, khả năng chống trùng và liên thông
  - Tổ chức bộ kiểm thử tái lập trong CI với hợp đồng cục bộ
- level1: Quan sát hệ thống
  level2:
  - Định nghĩa SLI, SLO theo thao tác SOAP và kết quả nghiệp vụ
  - Ghi log request, response và fault có kiểm soát
  - Che token, dữ liệu cá nhân và nội dung đính kèm trong log
  - Correlation ID, MessageID và liên kết log hai đầu
  - Truyền ngữ cảnh truy vết qua HTTP header hoặc SOAP Header
  - Đo độ trễ đầu cuối, thời gian xử lý và thời gian gọi phụ thuộc
  - Thống kê lỗi truyền tải, lỗi bảo mật, lỗi validation và lỗi nghiệp vụ
  - Metric theo operation với kiểm soát số lượng nhãn
  - Quan sát connection pool, thread pool và hàng chờ xử lý
  - Dashboard, cảnh báo và dữ liệu cần có để đối soát yêu cầu
- level1: Hiệu năng
  level2:
  - Đo chi phí XML parsing, validation và JAXB mapping
  - Chọn DOM hoặc streaming theo kích thước và thao tác cần làm
  - Tái sử dụng JAXBContext và quản lý đối tượng không an toàn đa luồng
  - Connection pooling, keep-alive và giới hạn kết nối mỗi đích
  - Đặt ngân sách timeout cho từng tầng của lời gọi
  - Giới hạn concurrency và áp lực ngược khi dịch vụ đích chậm
  - Ảnh hưởng của chữ ký, mã hóa và canonicalization
  - MTOM, buffering và quản lý tệp tạm với payload lớn
  - Chi phí logging, pretty print và lưu toàn bộ thông điệp
  - Load test theo phân bố kích thước payload và độ trễ p95, p99
  - Tối ưu sau đo đạc và xác minh lại hợp đồng, bảo mật
- level1: Vận hành dịch vụ
  level2:
  - Đóng gói ứng dụng SOAP và chọn runtime triển khai
  - Cấu hình endpoint, WSDL location và secret theo môi trường
  - Địa chỉ WSDL sau reverse proxy, TLS termination hoặc gateway
  - Chuỗi import WSDL, XSD khi chạy trong mạng hạn chế
  - Health check, readiness và phân biệt với phép thử nghiệp vụ
  - Graceful shutdown và hoàn tất yêu cầu đang xử lý
  - Giới hạn thân yêu cầu, luồng xử lý, kết nối và tệp tạm
  - Cân bằng tải, trạng thái phiên và yêu cầu WS-* có trạng thái
  - Timeout, rate limit, bulkhead và circuit breaker khi gọi đối tác
  - Rolling deployment với nhiều phiên bản hợp đồng
  - Sao lưu khóa, cấu hình và trạng thái cần cho phục hồi
  - Runbook xoay chứng chỉ, gián đoạn đối tác và khôi phục dịch vụ
- level1: Chẩn đoán sự cố
  level2:
  - HTTP 404, 405 và nhầm URL WSDL với URL gọi dịch vụ
  - HTTP 415 do Content-Type hoặc SOAP version không khớp
  - SOAPAction, WS-Addressing Action và thao tác không được định tuyến
  - Namespace sai, phần tử không mong đợi và lỗi JAXB unmarshalling
  - Sai thứ tự XSD, trường bắt buộc thiếu hoặc xsi:nil không hợp lệ
  - Không tải được WSDL import, XSD import hoặc policy reference
  - ClassNotFoundException, lỗi provider và xung đột javax, jakarta
  - MustUnderstand, VersionMismatch và Fault không được client nhận diện
  - Chứng chỉ không tin cậy, hostname sai và TLS handshake thất bại
  - UsernameToken, timestamp, replay hoặc chữ ký không hợp lệ
  - Policy không tương thích và thuật toán không được hỗ trợ
  - MTOM sai boundary, Content-ID hoặc attachment bị thiếu
  - Timeout, pool cạn, yêu cầu trùng và kết quả không xác định
  - Thu thập thông điệp đã che dữ liệu, đối chiếu hợp đồng và xác nhận sửa lỗi
- level1: Tiến hóa dịch vụ
  level2:
  - Đánh giá thay đổi tương thích ở XSD, WSDL và hành vi nghiệp vụ
  - Vì sao thêm trường XML chưa chắc tương thích mọi client
  - Tách phiên bản namespace, endpoint và operation
  - Chạy song song hợp đồng cũ, mới và theo dõi bên sử dụng
  - Nâng Java, Spring hoặc CXF với ma trận javax, jakarta
  - Sinh lại client có kiểm soát và kiểm tra thay đổi chữ ký phương thức
  - Adapter và lớp chống phụ thuộc khi tích hợp SOAP cũ
  - Bao bọc SOAP bằng API REST hoặc sự kiện theo nhu cầu sử dụng
  - Ánh xạ SOAP Fault, null và kiểu dữ liệu khi đổi giao thức
  - Giữ ngữ nghĩa bảo mật, tính lũy đẳng và đối soát khi hiện đại hóa
  - Kế hoạch ngừng phiên bản và xác nhận hệ thống đối tác đã chuyển đổi
- level1: Thực hành tổng hợp
  level2:
  - Đọc WSDL và viết SOAP request thủ công cho dịch vụ tra cứu
  - Thiết kế XSD, WSDL và thông điệp mẫu cho thao tác tạo đơn hàng
  - Tạo endpoint contract-first bằng Spring Web Services
  - Sinh client Java từ WSDL và gọi dịch vụ bằng proxy
  - Triển khai cùng hợp đồng trên Jakarta XML Web Services hoặc CXF
  - So sánh SOAP 1.1, SOAP 1.2 và kiểm chứng lỗi phiên bản
  - Thêm validation, SOAP Header và Fault có cấu trúc
  - Trao đổi tệp bằng MTOM và kiểm thử giới hạn kích thước
  - Bảo vệ bằng TLS, UsernameToken và chữ ký theo policy đã chọn
  - Mô phỏng timeout sau xử lý để kiểm chứng chống trùng, đối soát
  - Kiểm thử liên thông với nền tảng khác bằng bộ thông điệp mẫu
  - Hoàn thiện contract test, dashboard và runbook cho dịch vụ
