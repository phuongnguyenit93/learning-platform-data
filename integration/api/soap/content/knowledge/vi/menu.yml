menu:
- level1: Tổng quan
  level2:
  - SOAP là gì và bài toán tích hợp dịch vụ có hợp đồng
  - Vai trò của bên cung cấp, bên sử dụng và điểm cuối dịch vụ
  - Mối liên hệ giữa XML, XSD, WSDL, SOAP và HTTP
  - Phân biệt giao thức SOAP với phong cách kiến trúc REST
  - SOAP, RPC và dịch vụ hướng thông điệp
  - Khi nào nên dùng SOAP và khi nào nên chọn cách tích hợp khác
  - Khả năng mở rộng bằng SOAP Header và các đặc tả WS-*
  - Đọc toàn bộ một lượt yêu cầu, phản hồi và lỗi SOAP
  - Lộ trình từ hợp đồng dịch vụ đến ứng dụng Java liên thông
- level1: XML cho SOAP
  level2:
  - 'Cấu trúc tài liệu XML: declaration, element, attribute và text'
  - XML đúng cú pháp và XML hợp lệ theo schema
  - Namespace URI, prefix và tên đầy đủ QName
  - Namespace mặc định và quy tắc áp dụng cho element, attribute
  - Phân biệt namespace URI với địa chỉ tải tài liệu
  - Escaping, CDATA và ký tự đặc biệt trong dữ liệu
  - Encoding, BOM, UTF-8 và khai báo charset
  - Khoảng trắng, thứ tự phần tử và ý nghĩa khi đối chiếu XML
  - DOM, SAX, StAX và cách chọn mô hình xử lý XML
  - XPath có namespace để chọn dữ liệu trong thông điệp
- level1: XML Schema
  level2:
  - Vai trò của XSD trong hợp đồng dữ liệu SOAP
  - targetNamespace, elementFormDefault và attributeFormDefault
  - Global element, local element và tham chiếu bằng ref
  - Simple type, complex type và kiểu dựng sẵn
  - sequence, choice, all và thứ tự phần tử
  - minOccurs, maxOccurs và ánh xạ danh sách
  - Phân biệt phần tử thiếu, chuỗi rỗng và xsi:nil
  - restriction, enumeration, pattern và giới hạn giá trị
  - extension, kiểu kế thừa và xsi:type
  - xs:date, xs:dateTime, decimal và dữ liệu nhị phân
  - xs:include, xs:import và tổ chức nhiều schema
  - xs:any, anyAttribute và đánh đổi khả năng mở rộng
  - Kiểm tra yêu cầu, phản hồi bằng XSD và giới hạn kiểm tra nghiệp vụ
- level1: Cấu trúc SOAP
  level2:
  - Envelope, Header và Body trong một thông điệp
  - Namespace của Envelope và nhận diện phiên bản SOAP
  - Header block và dữ liệu mở rộng ngoài payload nghiệp vụ
  - Body và nội dung yêu cầu, phản hồi
  - QName của phần tử gốc payload và định tuyến thao tác
  - Phân biệt SOAP Header với HTTP header
  - Thuộc tính mustUnderstand và nghĩa vụ xử lý header
  - actor của SOAP 1.1 và role của SOAP 1.2
  - relay trong SOAP 1.2 và chuyển tiếp header
  - encodingStyle và phạm vi áp dụng
  - Những cấu trúc XML không được phép trong SOAP Envelope
- level1: Xử lý thông điệp
  level2:
  - SOAP sender, receiver, intermediary và ultimate receiver
  - Vai trò của từng nút trên đường đi của thông điệp
  - Xác định header dành cho nút hiện tại
  - Trình tự kiểm tra phiên bản, header và Body
  - Phản hồi khi không hiểu header bắt buộc
  - Phân biệt hiểu header với hoàn tất thao tác nghiệp vụ
  - Forwarding intermediary và active intermediary
  - Chuyển tiếp, loại bỏ hoặc thêm header theo quy tắc
  - Message exchange pattern và ranh giới với giao thức truyền tải
  - Vì sao SOAP không tự cung cấp bảo đảm giao dịch hoặc chống trùng
- level1: Phiên bản SOAP
  level2:
  - 'SOAP 1.1 và SOAP 1.2: mục tiêu và trạng thái đặc tả'
  - Khác biệt namespace, thuộc tính header và mô hình lỗi
  - text/xml của SOAP 1.1 và application/soap+xml của SOAP 1.2
  - SOAPAction trong SOAP 1.1 và tham số action của SOAP 1.2
  - SOAP 1.2 Fault và cấu trúc mở rộng so với SOAP 1.1
  - VersionMismatch và giới hạn thương lượng phiên bản
  - Xuất nhiều binding cho các client khác phiên bản
  - Chọn phiên bản theo hợp đồng và khả năng của hệ thống đối tác
  - Đối chiếu cùng một thao tác bằng hai phiên bản SOAP
- level1: SOAP qua HTTP
  level2:
  - Ánh xạ SOAP message vào HTTP request và response
  - URL điểm cuối, HTTP method và SOAP HTTP binding
  - Content-Type, Accept, charset và nội dung thực tế
  - Action dùng để định tuyến và mối liên hệ với hợp đồng
  - HTTP status và SOAP Fault theo phiên bản, binding
  - Phân biệt HTTP thành công với kết quả nghiệp vụ thành công
  - Request-response, SOAP response MEP và giới hạn hỗ trợ
  - One-way operation và ý nghĩa của phản hồi ở tầng truyền tải
  - Connection timeout, read timeout và giới hạn kích thước thông điệp
  - Proxy, redirect, keep-alive và nén dữ liệu theo thỏa thuận
- level1: WSDL 1.1
  level2:
  - WSDL là hợp đồng mô tả dịch vụ, không phải thông điệp SOAP
  - definitions, targetNamespace và các namespace liên quan
  - types và liên kết đến XML Schema
  - message, part và tham chiếu element hoặc type
  - portType và tập thao tác trừu tượng
  - operation với input, output và fault
  - One-way, request-response, solicit-response và notification
  - binding và ánh xạ từ thao tác sang giao thức cụ thể
  - soap:binding, soap:operation và soapAction
  - soap:body, soap:header, soap:fault và soap:headerfault
  - service, port và soap:address
  - wsdl:import, tài liệu hóa và lần theo chuỗi phụ thuộc
  - Đọc ngược một endpoint để tìm thao tác và schema dữ liệu
- level1: WSDL 2.0
  level2:
  - Phân biệt WSDL 2.0 với WSDL 1.1
  - description, interface, binding, service và endpoint
  - Interface operation, interface fault và tham chiếu phần tử XSD
  - Message exchange pattern và mô hình input, output
  - Binding SOAP trong WSDL 2.0
  - Tách phiên bản WSDL khỏi phiên bản SOAP
  - Kiểm tra hỗ trợ WSDL 2.0 trước khi chọn công cụ Java
  - Đọc và chuyển đổi hợp đồng với nhận diện giới hạn tương thích
- level1: Kiểu binding
  level2:
  - Document style và RPC style khác nhau ở đâu
  - Literal use và encoded use
  - Document/literal wrapped và document/literal bare
  - Wrapped convention và quan hệ với chữ ký phương thức Java
  - RPC/literal trong hợp đồng có sẵn
  - SOAP Encoding và cách đọc hợp đồng rpc/encoded cũ
  - Ánh xạ input, output và nhiều message part
  - Phân biệt quy tắc bắt buộc của SOAP với quy ước của framework
  - Chọn binding theo công cụ và yêu cầu liên thông
  - Đối chiếu WSDL, XML thực tế và mã client đã sinh
- level1: Thiết kế hợp đồng
  level2:
  - 'Contract-first và code-first: quy trình, lợi ích và đánh đổi'
  - Thiết kế thao tác theo khả năng nghiệp vụ
  - Tách hợp đồng XML khỏi entity và mô hình lưu trữ
  - Thiết kế kiểu request, response và fault
  - Quy ước tên, namespace và cấu trúc wrapper
  - Định nghĩa dữ liệu bắt buộc, tùy chọn và giá trị mặc định
  - Chuẩn hóa thời gian, múi giờ, số thập phân và đơn vị đo
  - Phân trang, lọc và giới hạn kích thước kết quả
  - Thiết kế mã yêu cầu, tính lũy đẳng và đối soát kết quả
  - Chính sách phiên bản, tương thích và ngừng hỗ trợ
  - Đóng gói WSDL, XSD và tài liệu ví dụ thành bộ hợp đồng
  - Rà soát hợp đồng cùng bên sử dụng trước khi viết triển khai
- level1: SOAP Fault
  level2:
  - Phân biệt lỗi truyền tải, lỗi giao thức và lỗi nghiệp vụ
  - Cấu trúc faultcode, faultstring, faultactor và detail của SOAP 1.1
  - Cấu trúc Code, Subcode, Reason, Node, Role và Detail của SOAP 1.2
  - VersionMismatch, MustUnderstand và lỗi xử lý header
  - Client, Server của SOAP 1.1 và Sender, Receiver của SOAP 1.2
  - Thiết kế fault detail có schema và mã lỗi ổn định
  - Declared fault trong WSDL và lỗi ngoài hợp đồng
  - Ánh xạ exception Java thành SOAP Fault
  - Phân biệt lỗi có thể thử lại với lỗi cần sửa dữ liệu
  - Giữ thông tin đối soát và tránh lộ stack trace, dữ liệu nội bộ
  - Kiểm tra cả HTTP status và Fault khi chẩn đoán
- level1: Hệ sinh thái Java
  level2:
  - JAX-WS và Jakarta XML Web Services
  - Jakarta XML Binding, SOAP with Attachments và Web Services Metadata
  - Phân biệt API đặc tả với runtime triển khai
  - Metro, Apache CXF và Spring Web Services
  - Spring-WS khác mô hình JAX-WS ở mức xử lý thông điệp
  - Chuyển từ javax.* sang jakarta.* và những namespace XML giữ nguyên
  - JDK hiện đại và các API, công cụ SOAP không còn đi kèm JDK
  - Chọn phiên bản Java, Spring Boot, runtime và thư viện tương thích
  - Thiết lập dependency và plugin sinh mã bằng Gradle hoặc Maven
  - Tổ chức thư mục hợp đồng, mã sinh, endpoint và lớp nghiệp vụ
  - Chuẩn bị dịch vụ mẫu và client để kiểm tra kết nối cục bộ
- level1: Ánh xạ XML và Java
  level2:
