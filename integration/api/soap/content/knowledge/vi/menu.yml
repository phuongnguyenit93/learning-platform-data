  - Xuất WSDL tĩnh hoặc sinh WSDL từ XSD
  - '@Endpoint, @PayloadRoot, @RequestPayload và @ResponsePayload'
  - Định tuyến theo payload QName, SOAPAction hoặc WS-Addressing
