  - JAXBContext, Marshaller, Unmarshaller và vòng đời sử dụng
  - '@XmlRootElement, @XmlType, @XmlElement và @XmlAccessorType'
  - package-info.java, @XmlSchema và cấu hình namespace
  - JAXBElement, ObjectFactory và phần tử không có @XmlRootElement
  - Ánh xạ kiểu nguyên thủy, wrapper, enum và collection
  - Ánh xạ optional element, nillable và giá trị null
  - BigDecimal, XMLGregorianCalendar và chuyển đổi thời gian
  - XmlAdapter và tùy biến kiểu dữ liệu
  - Ánh xạ kế thừa, choice và phần tử mở rộng
  - Validation khi marshal, unmarshal và xử lý ValidationEvent
  - An toàn đa luồng của context, marshaller và unmarshaller
  - Kiểm chứng XML đầu ra thay vì chỉ so sánh đối tượng Java
- level1: Sinh mã từ hợp đồng
