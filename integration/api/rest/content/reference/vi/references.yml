references:
  - title: "RFC 9110 – HTTP Semantics"
    url: "https://www.rfc-editor.org/rfc/rfc9110.html"
    description: "Resource, HTTP methods, status, headers, safe/idempotent và conditional requests."
  - title: "RFC 3986 – URI Generic Syntax"
    url: "https://www.rfc-editor.org/rfc/rfc3986.html"
    description: "Cấu trúc URI gồm scheme, authority, path, query và fragment."
  - title: "RFC 9457 – Problem Details for HTTP APIs"
    url: "https://www.rfc-editor.org/rfc/rfc9457.html"
    description: "Cấu trúc application/problem+json để mô tả lỗi API có thể xử lý bằng máy."
  - title: "RFC 9111 – HTTP Caching"
    url: "https://www.rfc-editor.org/rfc/rfc9111.html"
    description: "Cache-Control, freshness, validation và giới hạn tái sử dụng response."
  - title: "OpenAPI Specification v3.1.0"
    url: "https://spec.openapis.org/oas/v3.1.0.html"
    description: "Đặc tả paths, operations, requestBody, responses và schema cho hợp đồng API."
  - title: "Spring – Building a RESTful Web Service"
    url: "https://spring.io/guides/gs/rest-service/"
    description: "Bài thực hành tạo REST controller trả JSON bằng Java Spring."
  - title: "Spring Framework – Mapping Requests"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-requestmapping.html"
    description: "@RequestMapping, @GetMapping, @PostMapping và mapping dựa trên URI/header."
  - title: "Spring Framework – Validation"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-validation.html"
    description: "Bean Validation cho request, ràng buộc tham số và phản hồi lỗi hợp lệ."
  - title: "Spring Framework – MockMvc"
    url: "https://docs.spring.io/spring-framework/reference/testing/mockmvc.html"
    description: "Kiểm thử request/response Spring MVC mà không khởi chạy máy chủ HTTP thật."
  - title: "OWASP – API Security Project"
    url: "https://owasp.org/projects/api-security-project"
    description: "Rủi ro API, broken object-level authorization, broken authentication và resource consumption."