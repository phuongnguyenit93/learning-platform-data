menu:
- level1: Tổng quan ActiveMQ
  level2:
  - ActiveMQ là gì và vai trò của broker trong tích hợp ứng dụng
  - Bài toán tách rời hệ thống, xử lý bất đồng bộ và hấp thụ tải đột biến
  - Quan hệ giữa producer, broker, destination, consumer và subscription
  - Hành trình của một thông điệp từ lúc gửi đến khi xử lý xong
  - Phân biệt lệnh, sự kiện và dữ liệu yêu cầu–phản hồi
  - Phân biệt JMS/Jakarta Messaging, giao thức truyền tin và sản phẩm broker
  - Khi nào dùng ActiveMQ; khi nào cân nhắc HTTP, RabbitMQ hoặc Kafka
  - Kiến thức nền và trình tự học từ một broker đến hệ thống nhiều broker
- level1: Classic và Artemis
  level2:
  - Phân biệt ActiveMQ Classic và Artemis về kiến trúc, cấu hình và hệ sinh thái
  - Lập bảng tương thích broker, client, JDK và phiên bản API JMS
  - Phân biệt namespace javax.jms và jakarta.jms khi chọn thư viện
  - Kiểm tra mức hỗ trợ JMSContext, gửi bất đồng bộ và shared subscription theo phiên bản
  - Giới hạn của Classic Jakarta transition client đối với embedded broker và VM transport
  - Phân biệt tương thích OpenWire với tương đương tính năng giữa hai broker
  - Tiêu chí chọn broker cho hệ thống mới và hệ thống JMS đang vận hành
- level1: Môi trường thực hành
  level2:
  - Chuẩn bị JDK, Gradle, Docker và công cụ gửi nhận thông điệp
  - Khởi chạy Classic độc lập và xác định tệp activemq.xml
  - Tạo broker instance Artemis và xác định broker.xml, bootstrap.xml, management.xml
  - Dựng Classic và Artemis bằng Docker Compose với cổng và tài khoản tách biệt
  - Gắn volume dữ liệu và phân biệt khởi động lại container với tạo broker mới
  - Kiểm tra kết nối bằng CLI, console và cặp producer–consumer tối thiểu
  - Quản lý cấu hình, bí mật và phiên bản image để tái lập môi trường
  - Dừng môi trường, bảo toàn dữ liệu và đặt lại bài thực hành có chủ đích
- level1: Kiến trúc broker
  level2:
  - Các thành phần nhận kết nối, định tuyến, lưu trữ và phân phối thông điệp
  - Luồng xử lý từ transport đến bộ lưu trữ và xác nhận gửi
  - Phân biệt thông điệp đang chờ, đang giao và đã được xác nhận
  - Ranh giới giữa bộ nhớ broker, bộ nhớ client và dữ liệu trên đĩa
  - Quan hệ giữa destination, subscription và vòng đời lưu giữ thông điệp
  - Khác biệt giữa broker độc lập và broker nhúng trong ứng dụng
  - Phân biệt mở rộng consumer, mở rộng broker và dự phòng dữ liệu
- level1: Queue và Topic
  level2:
  - Queue và mô hình nhiều consumer cạnh tranh xử lý
  - Topic và mô hình mỗi subscription nhận một bản sao
  - Subscription không bền vững và hành vi khi consumer ngoại tuyến
  - Durable subscription, client ID và tên subscription
  - Shared subscription và giới hạn hỗ trợ của từng broker, client và phiên bản
  - Phân biệt độ bền của destination, subscription và chế độ persistent của thông điệp
  - Temporary queue, temporary topic và ràng buộc vòng đời kết nối
  - Quy tắc đặt tên, tạo trước và quản lý vòng đời destination
- level1: Định tuyến Classic
  level2:
  - Tạo destination tĩnh và tự tạo destination khi client kết nối
  - Destination policy và cách khớp chính sách theo tên
  - Wildcard của Classic và phạm vi áp dụng
  - Virtual Topic và các queue tiêu thụ độc lập
  - Composite destination và gửi một thông điệp đến nhiều đích
  - Advisory message và theo dõi thay đổi trên broker
  - Retroactive consumer, subscription recovery và giới hạn lưu giữ
  - Dọn destination không hoạt động và tránh xóa nhầm dữ liệu
- level1: Định tuyến Artemis
  level2:
  - Address, queue, binding và routing type trong mô hình Artemis
  - Anycast và phân phối thông điệp đến queue
  - Multicast và sao chép thông điệp đến các queue đăng ký
  - Ánh xạ JMS Queue, Topic và subscription sang address và queue
  - Fully Qualified Queue Name để chỉ rõ address::queue
  - Address settings, wildcard và phạm vi chính sách
  - Tự tạo và tự xóa address, queue theo chính sách
  - Filter trên queue và selector phía consumer
  - Divert, transformer và phân luồng thông điệp
  - 'Ring queue, last-value queue và non-destructive queue: mục đích và giới hạn'
- level1: Giao thức kết nối
  level2:
  - Phân biệt API phía ứng dụng và giao thức trên đường truyền
  - OpenWire trong Classic và khả năng tương thích của Artemis
  - Core protocol và lựa chọn Core client của Artemis
  - AMQP 1.0 và tích hợp client ngoài Java
  - STOMP, MQTT và giới hạn ánh xạ ngữ nghĩa theo giao thức
  - Transport connector của Classic và acceptor, connector của Artemis
  - Cấu hình URI, cổng, timeout và phát hiện kết nối chết
  - 'TCP, TLS, WebSocket và VM transport: phạm vi sử dụng'
  - Đối chiếu kiểu dữ liệu, header và xác nhận khi kết nối khác giao thức
- level1: Lập trình JMS
  level2:
  - ConnectionFactory, Connection, Session và trách nhiệm của từng đối tượng
  - MessageProducer, MessageConsumer và Destination
  - Vòng đời create, start, stop, close của kết nối
  - Tạo Session theo chế độ giao dịch và xác nhận
  - Giới hạn chia sẻ Session, producer và consumer giữa các luồng
  - Gửi và nhận đồng bộ bằng JMS API truyền thống
  - MessageListener và xử lý nhận bất đồng bộ
  - JMSContext, JMSProducer, JMSConsumer và kiểm tra hỗ trợ của provider
  - ExceptionListener, JMSException và lỗi nghiệp vụ trong bộ xử lý
  - JNDI, cấu hình trực tiếp và quản lý tài nguyên an toàn
- level1: Thiết kế thông điệp
  level2:
  - Cấu trúc header, properties và body của JMS Message
  - TextMessage, BytesMessage, MapMessage, StreamMessage và ObjectMessage
  - JMSMessageID, JMSCorrelationID, JMSReplyTo và định danh nghiệp vụ
  - JMSDestination, JMSType, JMSTimestamp và các header do provider quản lý
  - JMSDeliveryMode, JMSPriority, JMSExpiration và trạng thái gửi lại
  - JSON, encoding và chuyển đổi kiểu dữ liệu giữa các ứng dụng
  - Thiết kế schema, version và thay đổi hợp đồng tương thích
  - Property cho selector, định tuyến và dấu vết xử lý
  - Giới hạn kích thước, dữ liệu nhạy cảm và rủi ro Java serialization
- level1: Producer
  level2:
  - Gửi đến destination cố định và destination xác định lúc chạy
  - Lựa chọn persistent, non-persistent, priority và time-to-live
  - Phân biệt gửi đồng bộ, gửi bất đồng bộ và xác nhận từ broker
  - Ranh giới giữa send thành công và nghiệp vụ phía consumer hoàn tất
  - Timeout khi gửi và kết quả không xác định sau mất kết nối
  - Gửi nhiều thông điệp trong một giao dịch và giới hạn kích thước lô
  - Tái sử dụng connection, session và producer thay vì tạo theo từng bản tin
  - Quản lý retry phía producer để tránh nhân bản thông điệp
- level1: Consumer
  level2:
  - Nhận bằng receive, receiveNoWait và timeout
  - Nhận bằng MessageListener và vòng đời consumer
  - Selector, cú pháp biểu thức và ảnh hưởng đến phân phối thông điệp
  - QueueBrowser để quan sát queue mà không lấy thông điệp ra
  - Competing consumers và phân phối công việc giữa nhiều tiến trình
  - Exclusive consumer, consumer priority và giới hạn theo broker
  - Quản lý durable subscription, noLocal và thao tác unsubscribe
  - Dừng nhận, hoàn tất phần đang xử lý và đóng consumer an toàn
- level1: Xác nhận và giao dịch
  level2:
  - AUTO_ACKNOWLEDGE và thời điểm xác nhận theo cách nhận thông điệp
  - CLIENT_ACKNOWLEDGE và phạm vi xác nhận trong cùng Session
  - DUPS_OK_ACKNOWLEDGE và đánh đổi giữa chi phí xác nhận với gửi lặp
  - Session.recover và gửi lại trong phiên không giao dịch
  - 'Transacted Session: commit, rollback và ranh giới giao dịch cục bộ'
  - Giao dịch nhận–xử lý–gửi tiếp trong cùng JMS Session
  - Phân biệt giao dịch JMS cục bộ với giao dịch cơ sở dữ liệu
  - XA/JTA, giao dịch phân tán và chi phí phối hợp tài nguyên
  - Các chế độ xác nhận mở rộng của provider và tính di động của mã
- level1: Độ tin cậy
  level2:
  - At-most-once, at-least-once và phạm vi của từng cam kết
  - Phân tích các điểm lỗi giữa gửi, lưu, giao, cập nhật dữ liệu và xác nhận
  - Vì sao persistent message không tự bảo đảm xử lý nghiệp vụ đúng một lần
  - Nhận diện thông điệp lặp bằng định danh nghiệp vụ ổn định
  - Consumer lũy đẳng với bảng inbox, ràng buộc duy nhất và giao dịch dữ liệu
  - Transactional outbox để phối hợp cập nhật dữ liệu và phát thông điệp
  - Duplicate detection của Artemis và giới hạn so với chống lặp nghiệp vụ
  - Xử lý kết quả commit không xác định khi kết nối đứt
  - Phân biệt tính bền vững, khả năng sẵn sàng và khả năng phục hồi
- level1: Gửi lại và DLQ
  level2:
  - Phân biệt retry tại client, redelivery từ broker và gửi lại thủ công
  - JMSRedelivered, JMSXDeliveryCount và cách nhận biết số lần giao
  - Redelivery policy phía client Classic và broker redelivery plugin
  - Redelivery delay, hệ số tăng và số lần giao tối đa của Artemis
  - Phân biệt lỗi tạm thời, lỗi vĩnh viễn và poison message
  - Dead Letter Queue của Classic và Individual Dead Letter Strategy
  - Dead-letter address, expiry address và các queue tương ứng của Artemis
  - Thiết kế lịch thử lại để tránh vòng lặp nóng và bão retry
  - Phân tích, sửa và phát lại DLQ với kiểm soát thông điệp lặp
- level1: Thứ tự và thời gian
  level2:
  - Phạm vi bảo đảm thứ tự với một producer, một Session và một consumer
  - Tác động của nhiều consumer, prefetch, priority, rollback và failover đến thứ tự
  - Message group với JMSXGroupID và phân phối theo khóa nghiệp vụ
  - Đóng nhóm, phân phối lại nhóm và giới hạn khi một nhóm quá tải
  - Exclusive consumer hoặc exclusive queue cho luồng cần tuần tự
  - Message priority và nguy cơ thông điệp ưu tiên thấp bị chờ lâu
  - Time-to-live, hết hạn và xử lý thông điệp đã quá thời điểm hữu ích
  - Scheduled message của Classic với schedulerSupport và AMQ_SCHEDULED_*
  - Scheduled delivery của Artemis và khác biệt với JMS delivery delay
  - Phân biệt trì hoãn giao, lịch công việc nghiệp vụ và retry
- level1: Lưu trữ Classic
  level2:
  - KahaDB, journal, index và quá trình phục hồi sau khởi động
  - MultiKahaDB và tách vùng lưu trữ theo destination
  - JDBC persistence và phụ thuộc vào cơ sở dữ liệu
  - Chính sách đồng bộ đĩa và đánh đổi độ trễ với độ bền
  - Message cursor, pending message và lưu tạm khi backlog tăng
  - Thu hồi journal, giao dịch còn mở và subscription giữ dữ liệu
  - Sao lưu và phục hồi nhất quán theo loại persistence adapter
- level1: Lưu trữ Artemis
  level2:
  - Bindings journal, message journal, paging và thư mục large messages
  - Journal NIO, ASYNCIO và yêu cầu của môi trường chạy
  - JDBC store và tiêu chí lựa chọn so với file journal
  - Độ bền của send, commit và chính sách đồng bộ journal
  - Paging khi thông điệp vượt giới hạn bộ nhớ
  - Large message và xử lý body theo luồng
  - Thu hồi journal, page và dữ liệu thông điệp không còn tham chiếu
  - Công cụ kiểm tra, xuất nhập và phục hồi dữ liệu khi broker ngoại tuyến
- level1: Điều tiết lưu lượng
  level2:
  - Backpressure và quan hệ tốc độ gửi, tốc độ xử lý với backlog
  - Prefetch của Classic và ảnh hưởng đến phân phối tải
  - Producer flow control với memoryUsage, storeUsage và tempUsage của Classic
  - Cursor memory và giới hạn theo destination trên Classic
  - consumerWindowSize, producerWindowSize và cơ chế credit của Artemis Core client
  - Address full policy PAGE, BLOCK, FAIL và DROP của Artemis
  - Giới hạn toàn broker, giới hạn address và ngưỡng dung lượng đĩa
  - Phát hiện consumer chậm, giới hạn tốc độ và bảo vệ hệ thống đích
  - Điều chỉnh timeout, số consumer và mức lấy trước bằng số đo thực tế
- level1: Spring Boot
  level2:
  - Chọn spring-boot-starter-activemq hoặc spring-boot-starter-artemis
  - Quản lý phiên bản phụ thuộc và tránh trộn javax.jms với jakarta.jms
  - Cấu hình Classic qua spring.activemq.* và Artemis qua spring.artemis.*
  - Chế độ kết nối broker bên ngoài và điều kiện dùng embedded broker
  - ConnectionFactory tự cấu hình và trường hợp cần bean tùy chỉnh
  - Phân biệt CachingConnectionFactory với JmsPoolConnectionFactory
  - Cấu hình profile, tài khoản, URL, TLS và timeout
  - Cấu hình nhiều broker hoặc nhiều ConnectionFactory trong một ứng dụng
  - Xác minh cấu hình hiệu lực và kết nối trước khi chạy luồng nghiệp vụ
- level1: Spring JMS
  level2:
  - JmsTemplate và JmsMessagingTemplate trong tầng gửi nhận
  - convertAndSend, receiveAndConvert và MessagePostProcessor
  - MessageConverter cho JSON, kiểu dữ liệu và header ánh xạ
  - DestinationResolver, Queue, Topic và pubSubDomain
  - '@JmsListener và DefaultJmsListenerContainerFactory'
  - Concurrency của listener và quan hệ với Session, thứ tự và tải
  - sessionTransacted, JmsTransactionManager và giao dịch xử lý tại listener
  - ErrorHandler, ngoại lệ trong listener và tác động đến redelivery
  - Durable subscription, shared subscription và nhận diện client theo khả năng provider
  - '@SendTo, request–reply và truyền JMSCorrelationID'
  - Quản lý khởi động, dừng và phục hồi kết nối của listener container
- level1: Mẫu tích hợp
  level2:
  - Hàng đợi công việc và nhóm consumer xử lý nền
  - Phát sự kiện đến nhiều hệ thống với Topic, Virtual Topic hoặc multicast
  - Request–reply với reply queue, correlation ID và timeout
  - Message selector, bộ lọc và định tuyến theo thuộc tính
  - Chuyển đổi thông điệp giữa các hợp đồng và phiên bản schema
  - Fan-out, tổng hợp kết quả và kiểm soát thiếu phản hồi
  - Kết nối ActiveMQ với Apache Camel hoặc Spring Integration
  - Outbox, inbox và xử lý từng bước trong quy trình nghiệp vụ
  - Chuyển tiếp giữa giao thức và kiểm tra tính toàn vẹn của thông điệp
- level1: Bảo mật
  level2:
  - Phân biệt xác thực kết nối và phân quyền destination
  - Tài khoản, JAAS, LDAP và cấu hình xác thực theo broker
  - Authorization policy của Classic và security settings của Artemis
  - Quyền gửi, nhận, tạo, xóa và quản trị theo nguyên tắc tối thiểu
  - TLS, mTLS, keystore, truststore và kiểm tra danh tính máy chủ
  - Cô lập mạng cho cổng giao thức, console, JMX và Jolokia
  - Quản lý bí mật, đổi chứng thư và luân chuyển mật khẩu
  - Kiểm soát ObjectMessage, trusted packages và rủi ro giải tuần tự
  - Giới hạn kết nối, kích thước bản tin và tài nguyên theo ứng dụng
  - Theo dõi bản vá, cảnh báo bảo mật và nhật ký thao tác quản trị
- level1: Sẵn sàng cao
  level2:
  - Xác định mục tiêu phục hồi RTO, mất dữ liệu RPO và các miền lỗi
  - Classic shared-file-system và JDBC master/slave với cơ chế khóa
  - Artemis primary/backup với shared store
  - Artemis primary/backup với replication
  - Phân biệt HA, cân bằng tải, network of brokers và cluster
  - Split-brain, network partition và cơ chế phối hợp khi kích hoạt dự phòng
  - Failover transport của Classic và cấu hình reconnect của Artemis client
  - Khôi phục consumer, subscription và giao dịch sau failover
  - Failback, khởi động lại có kiểm soát và diễn tập lỗi
  - Đối chiếu dữ liệu persistent và phần đang xử lý sau chuyển đổi broker
- level1: Kết nối nhiều broker
  level2:
  - Classic network of brokers và cơ chế store-and-forward
  - Network connector, duplex, include/exclude destination và network TTL
  - Consumer demand, advisory và thông điệp bị giữ tại broker trung gian
  - Giới hạn thứ tự và độ sẵn sàng dữ liệu trong network of brokers
  - Artemis cluster connection, khám phá node và phân phối tải
  - Artemis message redistribution khi consumer thay đổi vị trí
  - Artemis Core bridge và chuyển tiếp tin cậy giữa broker
  - Artemis federation, mirror và khác biệt với HA replication
  - Thiết kế kết nối liên vùng với độ trễ, mất mạng và giới hạn băng thông
- level1: Giám sát
  level2:
  - Classic Web Console, JMX và chỉ số của từng destination
  - Artemis Management Console, CLI, JMX và management API
  - Queue depth, số thông điệp đang giao, enqueue, dequeue và tốc độ xử lý
  - Tuổi thông điệp lâu nhất, thời gian chờ và độ trễ toàn hành trình
  - Consumer count, connection count và session count
  - Memory, store, temp, paging, journal và dung lượng đĩa
  - Theo dõi redelivery, DLQ, expiry và lỗi xác thực
  - Thu thập metrics, tích hợp Prometheus và thiết kế cảnh báo
  - Correlation ID, log có cấu trúc và truyền ngữ cảnh tracing
  - Phân biệt broker còn sống, broker sẵn sàng và luồng nghiệp vụ còn hoạt động
- level1: Hiệu năng
  level2:
  - Thiết kế phép đo theo thông lượng, độ trễ p95/p99 và tỷ lệ lỗi
  - Tác động của kích thước thông điệp, persistence, TLS và giao dịch
  - Điều chỉnh số connection, session, producer và consumer
  - Điều chỉnh prefetch, window và kích thước lô giao dịch
  - Phân tích ảnh hưởng của selector, priority, message group và topic fan-out
  - Đo chi phí journal, đĩa, mạng, CPU, heap và GC
  - Ước lượng dung lượng backlog, tốc độ phục hồi và thời gian cạn queue
  - Đánh giá tải ổn định, tải đột biến và quá tải kéo dài
  - So sánh Classic và Artemis với cùng ngữ nghĩa bảo đảm và điều kiện đo
- level1: Kiểm thử
  level2:
  - Phân biệt kiểm thử logic xử lý với kiểm thử ngữ nghĩa của broker
  - Dựng broker thật bằng Testcontainers hoặc container theo vòng đời kiểm thử
  - Kiểm thử gửi nhận Queue, Topic và durable subscription
  - Kiểm thử schema, converter, header và selector
  - Kiểm thử commit, rollback, recover và phạm vi xác nhận
  - Kiểm thử redelivery, DLQ, TTL và lịch giao thông điệp
  - Kiểm thử thông điệp lặp, consumer lũy đẳng và outbox
  - Kiểm thử crash sau cập nhật dữ liệu nhưng trước xác nhận
  - Kiểm thử mất kết nối, restart, failover và khôi phục subscription
  - Chờ điều kiện bất đồng bộ, cô lập destination và dọn dữ liệu kiểm thử
- level1: Vận hành
  level2:
  - Đóng gói image, cấu hình và dữ liệu broker độc lập
  - Quản lý volume, quyền truy cập và yêu cầu của bộ lưu trữ
  - Resource limit, JVM heap và dung lượng dự phòng trên đĩa
  - Graceful shutdown, tạm dừng nhận và xử lý thông điệp đang giao
  - Thao tác browse, move, retry, purge và điều kiện bảo vệ dữ liệu
  - Sao lưu cấu hình, dữ liệu và diễn tập phục hồi
  - Nâng cấp broker, client, schema cấu hình và kế hoạch rollback
  - Triển khai một hoặc nhiều broker trên Kubernetes với danh tính và lưu trữ ổn định
  - Quản lý destination, subscription mồ côi và thời hạn lưu giữ
  - Xây dựng quy trình ứng phó backlog, DLQ tăng và sự cố dung lượng
- level1: Chẩn đoán sự cố
  level2:
  - Không kết nối được do URI, cổng, DNS, tài khoản hoặc TLS
  - Producer bị treo do flow control, bộ lưu trữ đầy hoặc mất xác nhận
  - Consumer không nhận do Connection chưa start, selector hoặc sai destination
  - Phát nhầm Queue/Topic và nhầm anycast/multicast
  - Thông điệp vẫn đang giao do prefetch, giao dịch chưa đóng hoặc consumer chậm
  - Thông điệp lặp do timeout, reconnect, rollback hoặc thiếu chống lặp nghiệp vụ
  - Thông điệp mất hoặc hết hạn do delivery mode, subscription hay chính sách DROP
  - Thông điệp sai thứ tự khi tăng concurrency, gửi lại hoặc failover
  - DLQ tăng do converter, schema, quyền truy cập hoặc lỗi nghiệp vụ
  - Lỗi classpath javax/jakarta và tính năng JMS chưa được provider hỗ trợ
  - Broker phục hồi chậm, journal không thu hồi hoặc paging tăng kéo dài
- level1: Di chuyển broker
  level2:
  - Kiểm kê destination, subscription, client, giao thức và tính năng đang dùng
  - Đánh giá nâng cấp Classic và chuyển từ Classic sang Artemis
  - Ánh xạ Queue, Topic, Virtual Topic sang mô hình đích
  - Chuyển policy, redelivery, DLQ, expiry, bảo mật và giới hạn tài nguyên
  - Lựa chọn giữ OpenWire hoặc đổi sang Artemis client
  - Xử lý namespace javax/jakarta và các tính năng chưa tương đương
  - Lập kế hoạch chuyển backlog, durable subscription và thông điệp đang giao
  - Chạy kiểm thử tương thích, chuyển lưu lượng và xác định điểm rollback
  - Đối soát số lượng, thông điệp lặp, thứ tự và độ trễ sau di chuyển
- level1: Bài tập tổng hợp
  level2:
  - Xây dựng hàng đợi xử lý đơn hàng với producer và nhiều consumer
  - So sánh fan-out bằng Topic Classic, Virtual Topic và multicast Artemis
  - Thực hành message group để giữ thứ tự theo đơn hàng
  - Thực hành outbox và inbox để xử lý lỗi giữa dữ liệu và JMS
  - Thực hành retry, DLQ và phát lại thông điệp lỗi có kiểm soát
  - Thực hành giới hạn lưu lượng khi consumer chậm và backlog tăng
  - Diễn tập broker bị dừng đột ngột rồi kiểm chứng phục hồi và failover
  - Đo thông lượng và độ trễ trước, sau khi điều chỉnh cấu hình
  - Xây dựng hồ sơ vận hành gồm cấu hình, chỉ số, cảnh báo và quy trình khôi phục
