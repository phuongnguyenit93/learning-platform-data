references:
  - title: "RabbitMQ – Hello World in Java"
    url: "https://www.rabbitmq.com/tutorials/tutorial-one-java"
    description: "Giới thiệu producer, queue, consumer và luồng gửi/nhận bằng Java."
  - title: "RabbitMQ – Work Queues in Java"
    url: "https://www.rabbitmq.com/tutorials/tutorial-two-java"
    description: "Phân chia công việc, acknowledgment, persistence và fair dispatch."
  - title: "RabbitMQ – Publish/Subscribe in Java"
    url: "https://www.rabbitmq.com/tutorials/tutorial-three-java"
    description: "Fan-out một message đến nhiều subscribers."
  - title: "RabbitMQ – Publisher Confirms and Consumer Acknowledgements"
    url: "https://www.rabbitmq.com/docs/confirms"
    description: "Tách biệt xác nhận producer-broker và consumer-broker."
  - title: "RabbitMQ – Dead Letter Exchanges"
    url: "https://www.rabbitmq.com/docs/3.13/dlx"
    description: "Nền tảng dead-lettering khi reject, expire hoặc vượt giới hạn queue."
  - title: "Apache Kafka – Introduction"
    url: "https://kafka.apache.org/documentation/"
    description: "Event log, topics, partitions, retention và producer/consumer API."
  - title: "CloudEvents – Specification Index"
    url: "https://github.com/cloudevents/spec/blob/main/README.md"
    description: "Tiêu chuẩn metadata sự kiện và các định dạng/binding liên quan."
  - title: "AsyncAPI – Document Structure"
    url: "https://www.asyncapi.com/docs/concepts/asyncapi-document/structure"
    description: "Đặc tả channels, messages và operations send/receive."
  - title: "Spring AMQP – Reference"
    url: "https://docs.spring.io/spring-amqp/reference/"
    description: "Template, listener và cấu hình messaging dựa trên AMQP."
  - title: "Spring Guide – Messaging with RabbitMQ"
    url: "https://spring.io/guides/gs/messaging-rabbitmq/"
    description: "Ví dụ Spring Boot Java kết hợp RabbitTemplate, queue và listener."