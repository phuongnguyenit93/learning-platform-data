references:
  - title: "Apache Kafka — Introduction and Concepts"
    url: "https://kafka.apache.org/documentation/"
    description: "Tài liệu nền tảng chính thức về event, topic, partition, producer, consumer, replication và các Kafka API."
  - title: "Apache Kafka — Quickstart"
    url: "https://kafka.apache.org/quickstart/"
    description: "Hướng dẫn chạy Kafka với KRaft, tạo topic, thử console producer/consumer, Kafka Connect và Kafka Streams."
  - title: "Apache Kafka — Design"
    url: "https://kafka.apache.org/design/"
    description: "Giải thích partitioning, consumer groups, offsets, replication, delivery semantics, retention và log compaction."
  - title: "Apache Kafka 4.4 — APIs"
    url: "https://kafka.apache.org/44/apis/"
    description: "Tổng quan Producer, Consumer, Share Consumer, Streams, Connect và Admin APIs cùng phạm vi áp dụng."
  - title: "Apache Kafka — Streams Security"
    url: "https://kafka.apache.org/documentation/streams/developer-guide/security/"
    description: "Hướng dẫn bảo vệ ứng dụng stream processing qua TLS, authentication, authorization và ACL."
