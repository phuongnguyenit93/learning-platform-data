references:
  - title: "OpenAPI Initiative — OpenAPI Specification"
    url: "https://spec.openapis.org/oas/"
    description: "Chuẩn mô tả HTTP API, operation, request, response, schema và security."
  - title: "AsyncAPI — Document Structure"
    url: "https://www.asyncapi.com/docs/concepts/asyncapi-document/structure"
    description: "Mô tả channel, message và operation của API bất đồng bộ."
  - title: "AsyncAPI — Payload Schema"
    url: "https://www.asyncapi.com/docs/concepts/asyncapi-document/define-payload"
    description: "Khai báo schema cho payload và tái sử dụng các định nghĩa."
  - title: "JSON Schema — Specification"
    url: "https://json-schema.org/specification"
    description: "Đặc tả JSON Schema Core và Validation cho dữ liệu trao đổi."
  - title: "CNCF CloudEvents — Specification"
    url: "https://github.com/cloudevents/spec/blob/main/README.md"
    description: "Chuẩn metadata của event nhằm tăng khả năng tương tác giữa hệ thống."
  - title: "Confluent — Schema Evolution and Compatibility"
    url: "https://docs.confluent.io/platform/current/schema-registry/fundamentals/schema-evolution.html"
    description: "Backward, forward, full và transitive compatibility khi tiến hóa schema."
  - title: "Protocol Buffers — Proto3 Language Guide"
    url: "https://protobuf.dev/programming-guides/proto3/"
    description: "Khai báo message, field number và lưu ý an toàn khi thay đổi schema."
  - title: "Pact — Contract Testing Documentation"
    url: "https://docs.pact.io/"
    description: "Consumer-driven contract testing cho HTTP API và message."
  - title: "RFC 9457 — Problem Details for HTTP APIs"
    url: "https://www.rfc-editor.org/rfc/rfc9457"
    description: "Cấu trúc chuẩn mô tả lỗi ứng dụng trong phản hồi HTTP API."