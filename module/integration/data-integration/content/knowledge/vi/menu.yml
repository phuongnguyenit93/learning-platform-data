menu:
- level1: Bức tranh tổng thể
  level2:
  - Tích hợp dữ liệu (data integration) là gì và giải quyết vấn đề nào
  - Từ dữ liệu phân tán đến thông tin sử dụng thống nhất
  - 'Ví dụ xuyên suốt: đồng bộ khách hàng, đơn hàng và báo cáo doanh thu'
  - Nguồn, đích, bộ kết nối và luồng xử lý dữ liệu
  - Các chặng trích xuất → biến đổi → nạp → kiểm tra kết quả
  - Tích hợp dữ liệu cho nghiệp vụ và tích hợp dữ liệu cho phân tích
  - Phân biệt tích hợp dữ liệu, tích hợp ứng dụng và trao đổi thông điệp
  - Độ mới, độ đầy đủ, tính đúng đắn và tính nhất quán của dữ liệu
  - Khi cần tích hợp và khi nên truy cập trực tiếp nguồn
  - Các nhóm thuật ngữ và trình tự học toàn bộ chủ đề
- level1: Khảo sát bài toán
  level2:
  - Xác định người sử dụng, mục đích và quyết định dựa trên dữ liệu
  - Kiểm kê hệ thống nguồn, hệ thống đích và chủ sở hữu dữ liệu
  - Xác định thực thể, khóa, quan hệ và ý nghĩa nghiệp vụ
  - Chọn nguồn chuẩn (system of record) cho từng loại dữ liệu
  - Phạm vi dữ liệu, mức chi tiết và lịch sử cần giữ
  - Tần suất cập nhật, độ trễ chấp nhận và thời hạn hoàn tất
  - Khối lượng ban đầu, tốc độ tăng và đặc điểm tải cao điểm
  - Quy định lưu giữ, quyền truy cập và dữ liệu nhạy cảm
  - Xác định chiều đồng bộ và quyền cập nhật từng trường
  - 'Tiêu chí nghiệm thu: đủ bản ghi, đúng giá trị và đúng thời điểm'
  - Đánh giá phụ thuộc, giới hạn nguồn và tác động khi nguồn thay đổi
- level1: Kiến trúc tích hợp
  level2:
  - 'ETL: trích xuất, biến đổi rồi nạp dữ liệu'
  - 'ELT: trích xuất, nạp rồi biến đổi tại hệ thống đích'
  - So sánh ETL và ELT theo khả năng xử lý, quản trị và chi phí
  - Xử lý theo lô (batch), lô nhỏ (micro-batch) và luồng liên tục (streaming)
  - Tích hợp một chiều, hai chiều và hợp nhất nhiều nguồn
  - Đẩy dữ liệu (push) và chủ động lấy dữ liệu (pull)
  - 'Sao chép dữ liệu và liên kết truy vấn (data federation): hai cách tiếp cận'
  - Ảo hóa dữ liệu (data virtualization) và giới hạn khi không sao chép
  - Kho dữ liệu (warehouse), hồ dữ liệu (lake) và vai trò đích lưu trữ
  - Đưa dữ liệu phân tích trở lại hệ thống nghiệp vụ (reverse ETL)
  - Tích hợp điểm đến điểm và mô hình trung tâm điều phối
  - Tách vùng dữ liệu thô, vùng trung gian và dữ liệu sẵn sàng sử dụng
- level1: Nguồn và đích
  level2:
  - 'Cơ sở dữ liệu quan hệ: bảng, khóa và giao dịch nguồn'
  - 'Cơ sở dữ liệu phi quan hệ: cấu trúc linh hoạt và mô hình truy cập'
  - Tệp cục bộ, thư mục chia sẻ và kho lưu trữ đối tượng
  - API, dịch vụ bên ngoài và ứng dụng SaaS
  - Hàng đợi, chủ đề và nhật ký sự kiện làm nguồn dữ liệu
  - Đích phục vụ giao dịch, phân tích, tìm kiếm và bộ nhớ đệm
  - Bộ kết nối (connector) và ranh giới trách nhiệm với bộ biến đổi
  - 'Đọc từ bản sao và đọc từ hệ thống chính: độ trễ và tải'
  - Khả năng truy cập lịch sử, đọc lại và phát hiện thay đổi
  - Lập ma trận nguồn–đích theo định dạng, tốc độ và mức bảo đảm
- level1: Hợp đồng dữ liệu
  level2:
  - 'Hợp đồng dữ liệu (data contract): cấu trúc, ý nghĩa và cam kết chất lượng'
  - Lược đồ (schema), kiểu dữ liệu và các ràng buộc hợp lệ
  - Khóa nghiệp vụ, khóa thay thế và định danh giữa nhiều hệ thống
  - Ánh xạ trường nguồn–đích và bảng đặc tả chuyển đổi
  - Phân biệt trường vắng mặt, null, chuỗi rỗng và giá trị mặc định
  - Độ chính xác số, số tiền, đơn vị đo và quy tắc làm tròn
  - Thời gian, múi giờ, thời điểm có hiệu lực và ngày nghiệp vụ
  - Bộ mã ký tự, quy tắc so sánh và chuẩn hóa văn bản
  - Quyền sở hữu lược đồ và quy trình phê duyệt thay đổi
  - Tương thích ngược, tương thích xuôi và nhiều phiên bản cùng tồn tại
  - 'Thêm, đổi tên, đổi kiểu và xóa trường: đánh giá tác động'
  - Dữ liệu đến sai hợp đồng và chiến lược từ chối hoặc cách ly
- level1: Tệp và định dạng
  level2:
  - 'CSV: dấu phân cách, dấu nháy, xuống dòng và hàng tiêu đề'
  - 'JSON: đối tượng, mảng, cấu trúc lồng nhau và dữ liệu từng dòng'
  - 'XML: không gian tên, lược đồ và lựa chọn cách đọc'
  - 'Định dạng theo hàng và theo cột: mục đích và đánh đổi'
  - 'Avro và Parquet: định hướng lựa chọn định dạng tích hợp'
  - Nén dữ liệu, kích thước tệp và chi phí đọc
  - Phân vùng thư mục theo ngày hoặc khóa nghiệp vụ
  - 'Tệp đang ghi và tệp đã hoàn tất: dấu hiệu sẵn sàng để nhập'
  - Manifest, số lượng bản ghi và mã kiểm tra toàn vẹn
  - Tên tệp, mã lần xuất và phát hiện tệp trùng
  - Tệp lỗi, bản ghi lỗi và khả năng đọc lại đúng phần dữ liệu
- level1: Kết nối cơ sở dữ liệu
  level2:
  - 'JDBC: kết nối, truy vấn và đọc kết quả trong ứng dụng Java'
  - Tham số truy vấn và ánh xạ kiểu dữ liệu an toàn
  - Đọc tuần tự bằng con trỏ và giới hạn bộ nhớ
  - Kích thước lấy dữ liệu (fetch size) và hành vi phụ thuộc trình điều khiển
  - Phân trang theo độ lệch và phân trang theo khóa
  - Chọn cột, điều kiện lọc và chỉ mục phục vụ trích xuất
  - Mức cô lập và ảnh chụp nhất quán khi dữ liệu đang thay đổi
  - Đọc nhiều bảng liên quan và nguy cơ lệch thời điểm
  - Quản lý kết nối, thời gian chờ và hủy truy vấn
  - Tài khoản chỉ đọc và giới hạn ảnh hưởng đến hệ thống nguồn
  - Đọc kiểu dữ liệu đặc biệt và kiểm tra khả năng biểu diễn tại đích
- level1: Thu thập qua API
  level2:
  - Thiết kế bộ lấy dữ liệu từ API theo hợp đồng nguồn
  - Phân trang bằng số trang, độ lệch và con trỏ
  - Phân trang khi dữ liệu nguồn tiếp tục thay đổi
  - Lọc theo thời điểm cập nhật và phạm vi thời gian
  - Giới hạn số yêu cầu, hạn mức và phản hồi yêu cầu chờ
  - Xác thực, gia hạn thông tin truy cập và quản lý bí mật
  - Thời gian chờ, thử lại và phân biệt lỗi tạm thời với lỗi dữ liệu
  - Thu thập nhiều tài nguyên có quan hệ và hạn chế truy vấn lặp
  - Nhận thông báo thay đổi qua webhook và đối chiếu lại với nguồn
  - Lưu con trỏ, dấu lần lấy và khả năng tiếp tục sau gián đoạn
  - Thay đổi phiên bản API, trường dữ liệu và điều kiện sử dụng nguồn
- level1: Trích xuất dữ liệu
  level2:
  - Trích xuất toàn bộ (full extraction) và khi nào nên sử dụng
  - Trích xuất tăng dần (incremental extraction) và dữ liệu cần theo dõi
  - Chọn tập bản ghi, cột và khoảng thời gian cho một lần chạy
  - Chốt biên dữ liệu để lần trích xuất có phạm vi xác định
  - Chia nguồn thành các khoảng khóa hoặc phân vùng độc lập
  - Phối hợp ảnh chụp ban đầu với các thay đổi phát sinh
  - Giữ nguyên dữ liệu thô để kiểm tra và xử lý lại
  - Bổ sung nguồn gốc, mã lần chạy và thời điểm trích xuất
  - Giới hạn tốc độ đọc để bảo vệ hệ thống nguồn
  - Phân biệt lỗi đọc, thiếu dữ liệu và nguồn trả về tập rỗng
  - Kiểm tra tính đầy đủ ngay khi kết thúc trích xuất
- level1: Biến đổi dữ liệu
  level2:
  - Ánh xạ trường trực tiếp và chuyển đổi theo quy tắc nghiệp vụ
  - Ép kiểu an toàn và phát hiện mất độ chính xác
  - Chuẩn hóa chuỗi, mã ký tự, khoảng trắng và chữ hoa chữ thường
  - Chuẩn hóa thời gian, tiền tệ, đơn vị đo và mã danh mục
  - Tách, ghép, làm phẳng và dựng lại cấu trúc lồng nhau
  - Lọc bản ghi và phân biệt loại bỏ chủ động với mất dữ liệu
  - Làm giàu (enrichment) bằng dữ liệu tra cứu
  - Kết nối dữ liệu (join) và xử lý khi thiếu bản ghi liên quan
  - Tổng hợp, nhóm và lựa chọn mức chi tiết đầu ra
  - Khử trùng lặp (deduplication) và chọn bản ghi đại diện
  - Đối sánh thực thể và bảng ánh xạ định danh giữa các nguồn
  - Mô hình dữ liệu chuẩn chung (canonical model) và giới hạn sử dụng
  - Quy tắc biến đổi có tính xác định, phiên bản và khả năng kiểm chứng
- level1: Chất lượng dữ liệu
  level2:
  - 'Các chiều chất lượng: chính xác, đầy đủ, hợp lệ, duy nhất và kịp thời'
  - Khảo sát dữ liệu (data profiling) trước khi xây dựng quy tắc
  - Kiểm tra bắt buộc, miền giá trị và định dạng
  - Kiểm tra khóa duy nhất và toàn vẹn tham chiếu
  - Kiểm tra chéo trường, chéo bảng và quy tắc nghiệp vụ
  - Nhận diện giá trị bất thường và biến động phân bố dữ liệu
  - Phân biệt giá trị thiếu, dữ liệu đến muộn và dữ liệu không áp dụng
  - Chọn ngưỡng chấp nhận, mức cảnh báo và điều kiện dừng luồng
  - Cách ly bản ghi lỗi và giữ bằng chứng truy nguyên
  - Sửa dữ liệu tại nguồn, sửa trong luồng và trách nhiệm phê duyệt
  - Đo chất lượng theo nguồn, phân vùng và từng lần chạy
  - Ngăn dữ liệu sai lan truyền sang hệ thống sử dụng phía sau
- level1: Nạp dữ liệu
  level2:
  - Chèn mới, cập nhật, xóa và thay thế toàn bộ dữ liệu
  - 'Upsert: kết hợp chèn hoặc cập nhật theo khóa đã xác định'
  - Vùng trung gian (staging) và kiểm tra trước khi công bố
  - Nạp từng bản ghi, theo lô và dùng cơ chế nạp khối lượng lớn
  - Ranh giới giao dịch và kích thước đơn vị xác nhận
  - Khóa duy nhất và ngăn tạo bản ghi trùng khi nạp lại
  - Thứ tự nạp bảng cha, bảng con và dữ liệu tham chiếu
  - Thay thế phân vùng và công bố một tập dữ liệu hoàn chỉnh
  - Cập nhật từng trường và bảo toàn dữ liệu do hệ thống đích sở hữu
  - Xử lý xóa mềm, xóa cứng và yêu cầu xóa theo chính sách
  - Nạp thành công một phần và xác định phần cần xử lý lại
  - Kiểm tra khả năng đọc và sử dụng dữ liệu sau khi nạp
  - Lưu trạng thái hiện tại và lưu lịch sử thay đổi theo nhu cầu sử dụng
  - Cập nhật ghi đè và tạo phiên bản lịch sử (SCD Type 1/Type 2)
  - Khoảng hiệu lực, bản ghi hiện hành và bản cập nhật đến muộn
- level1: Xử lý theo lô
  level2:
  - Đơn vị công việc (job), bước xử lý (step) và một lần chạy
  - Chọn lịch chạy, cửa sổ dữ liệu và thời hạn hoàn tất
  - Tham số lần chạy và định danh một tập dữ liệu đầu vào
  - Đọc → biến đổi → ghi theo từng nhóm bản ghi (chunk)
  - Chốt giao dịch, lưu tiến độ và khả năng khởi động lại
  - Luồng phụ thuộc tuần tự và các nhánh có thể chạy song song
  - Chia lô theo khóa, ngày hoặc vùng dữ liệu
  - Ngăn hai lần chạy xử lý chồng cùng một phạm vi
  - Xử lý lô rỗng, tệp đến muộn và đầu vào chưa đủ
  - Tái chạy một lô và bảo đảm kết quả không bị nhân đôi
  - Theo dõi trạng thái từng bước và tổng kết kết quả cả lô
- level1: Đồng bộ tăng dần
  level2:
  - Cột thời điểm cập nhật, số thứ tự và phiên bản làm dấu thay đổi
  - Mốc đã xử lý (high-water mark) và điều kiện tiếp tục lần sau
  - Dùng khóa phụ để phân biệt các bản ghi có cùng thời điểm cập nhật
  - Chốt mốc trên để dữ liệu mới không làm trôi phạm vi đang đọc
  - Khoảng thời gian chồng lấn và khử trùng khi đọc lại
  - Giao dịch hoàn tất muộn và nguy cơ bỏ sót khi dùng dấu thời gian
  - Xử lý bản ghi được sửa nhiều lần giữa hai lần đồng bộ
  - Phát hiện xóa khi chỉ có truy vấn tăng dần
  - Lưu mốc tiến độ theo nguồn, bảng và phân vùng
  - Chỉ nâng mốc sau khi dữ liệu đích đã được xác nhận
  - Đồng bộ bù dữ liệu lịch sử (backfill) mà không làm mất tiến độ hiện tại
  - Đối soát định kỳ để phát hiện sai lệch tích lũy
- level1: Theo dõi thay đổi
  level2:
  - Thu thập thay đổi dữ liệu (CDC) là gì và khác truy vấn định kỳ thế nào
  - CDC dựa trên truy vấn, trigger và nhật ký giao dịch
  - Sự kiện thêm, sửa, xóa và ảnh dữ liệu trước–sau
  - Vị trí trong nhật ký và mốc tiếp tục đọc (offset)
  - Ảnh chụp ban đầu và chuyển tiếp sang đọc thay đổi liên tục
  - Ranh giới giao dịch và tính nhất quán của thay đổi nhiều bảng
  - Nhận diện xóa, khóa thay đổi và bản ghi đánh dấu xóa
  - Thay đổi lược đồ trong khi bộ thu thập đang hoạt động
  - Giữ nhật ký đủ lâu và hậu quả khi mốc đọc không còn hợp lệ
  - Chuyển đổi máy chủ nguồn và khôi phục bộ thu thập
  - 'Sự kiện thay đổi hàng dữ liệu và sự kiện nghiệp vụ: ý nghĩa khác nhau'
  - Đánh giá quyền truy cập, chi phí vận hành và tác động lên nguồn
- level1: Tích hợp luồng
  level2:
  - Luồng dữ liệu không có điểm kết thúc và mô hình xử lý liên tục
  - Phân biệt thời điểm xảy ra sự kiện với thời điểm được xử lý
  - Dữ liệu đến muộn, sai thứ tự và độ lệch đồng hồ
  - Chia cửa sổ thời gian để tổng hợp dữ liệu liên tục
  - Mốc tiến triển theo thời gian sự kiện (watermark) và giới hạn dữ liệu đến muộn
  - Biến đổi không giữ trạng thái và biến đổi có trạng thái
  - Tra cứu, làm giàu và kết nối các luồng dữ liệu
  - Phân vùng theo khóa và phạm vi bảo đảm thứ tự
  - Điều tiết ngược (backpressure) khi hệ thống đích xử lý chậm
  - Lưu trạng thái, khôi phục và phát lại dữ liệu đầu vào
  - Phát lại có tác dụng phụ và yêu cầu bảo vệ hệ thống đích
  - Ranh giới giữa bộ thu thập CDC, broker và bộ xử lý luồng
- level1: Nhất quán dữ liệu
  level2:
  - Nhất quán tức thời và nhất quán sau cùng trong luồng tích hợp
  - Ranh giới giao dịch giữa đọc nguồn, ghi đích và lưu tiến độ
  - Phân biệt cam kết chuyển giao với số lần tạo hiệu ứng dữ liệu
  - Tính lũy đẳng (idempotency) để nạp lại mà không nhân đôi kết quả
  - Mất tiến độ, nhận trùng và ghi thành công nhưng chưa được xác nhận
  - Ảnh chụp nhiều bảng và tính toàn vẹn giữa các thực thể
  - Thứ tự cập nhật và phiên bản để ngăn dữ liệu cũ ghi đè dữ liệu mới
  - Xung đột khi hai hệ thống cùng sửa một thực thể
  - Quy tắc nguồn ưu tiên và quyền sở hữu ở cấp trường
  - Chiến lược ghi sau thắng và giới hạn của dấu thời gian
  - Tránh vòng lặp phản chiếu trong đồng bộ hai chiều
  - 'Outbox, inbox và giao dịch phân tán: định hướng xử lý ranh giới nguyên tử'
- level1: Điều phối luồng việc
  level2:
  - Biểu diễn quan hệ phụ thuộc bằng đồ thị công việc
  - Lập lịch theo thời gian, sự kiện và điều kiện dữ liệu sẵn sàng
  - Điều kiện bắt đầu, kết thúc và công bố kết quả của từng bước
  - Truyền tham số, mã lần chạy và phạm vi dữ liệu giữa các bước
  - Chạy song song các nhánh độc lập và chờ đủ điều kiện hợp nhất
  - Giới hạn số lần chạy đồng thời và tránh tranh chấp tài nguyên
  - 'Thử lại ở cấp bước và thử lại cả luồng: phạm vi tác động'
  - Dừng, hủy và tiếp tục luồng đang xử lý
  - Quản lý cấu hình theo môi trường và phiên bản luồng tích hợp
  - Phân biệt bộ điều phối, bộ lập lịch và hệ thống thực thi
- level1: Phục hồi và xử lý lại
  level2:
  - Phân loại lỗi kết nối, định dạng, chất lượng và lỗi nghiệp vụ
  - Chính sách thử lại có giới hạn, thời gian chờ và độ lệch ngẫu nhiên
  - Điểm khôi phục (checkpoint) và thông tin cần lưu bền vững
  - Phân biệt chạy lại, tiếp tục, phát lại và bổ sung dữ liệu lịch sử
  - Khôi phục sau lỗi giữa một lô hoặc giữa một giao dịch
  - Cách ly bản ghi lỗi mà vẫn kiểm soát độ đầy đủ đầu ra
  - Sửa dữ liệu lỗi và đưa trở lại đúng phạm vi xử lý
  - Chạy lại với phiên bản quy tắc biến đổi đã thay đổi
  - Công bố kết quả sau kiểm tra và tránh để lộ dữ liệu dở dang
  - Hoàn tác hoặc sửa bù khi dữ liệu sai đã được công bố
  - Lập bảng tình huống lỗi và tiêu chí chứng minh phục hồi thành công
- level1: Hiệu năng và mở rộng
  level2:
  - Đo thông lượng, độ trễ và thời gian hoàn tất theo từng chặng
  - Tìm điểm nghẽn ở nguồn, mạng, biến đổi và hệ thống đích
  - Chia việc theo khóa, khoảng giá trị hoặc phân vùng thời gian
  - Phân bố dữ liệu lệch (data skew) và các phân vùng xử lý quá chậm
  - Xử lý song song và giới hạn do khóa, thứ tự hoặc giao dịch
  - Chọn kích thước lô, số bản ghi lấy và số kết nối
  - Đọc theo dòng để giới hạn bộ nhớ khi dữ liệu lớn
  - Giảm dữ liệu truyền bằng lọc và chọn cột tại nguồn
  - Đẩy phép xử lý xuống nguồn hoặc đích (pushdown) và giới hạn an toàn
  - Tra cứu có bộ nhớ đệm và nguy cơ dùng dữ liệu tham chiếu cũ
  - Chi phí nén, truyền mạng, lưu trữ và truy vấn
  - Điều tiết tải và xây dựng kế hoạch năng lực theo tăng trưởng dữ liệu
- level1: Siêu dữ liệu
  level2:
  - Siêu dữ liệu kỹ thuật, nghiệp vụ và vận hành
  - Danh mục dữ liệu (data catalog) và khả năng tìm đúng tập dữ liệu
  - Từ điển dữ liệu, định nghĩa chỉ tiêu và quyền sở hữu
  - Nguồn gốc dữ liệu (data lineage) từ nguồn đến trường đầu ra
  - Theo dõi phiên bản lược đồ, quy tắc biến đổi và cấu hình
  - Mã lần chạy và dấu vết từng bản ghi hoặc từng lô
  - Phân tích tác động khi đổi cột nguồn hoặc công thức biến đổi
  - Lưu bằng chứng đối soát, chất lượng và quyết định xử lý lỗi
  - Thời hạn lưu siêu dữ liệu và khả năng tái hiện một kết quả
- level1: Bảo mật và quản trị
  level2:
  - Phân loại dữ liệu và xác định ranh giới tin cậy
  - Phân quyền tối thiểu cho tài khoản đọc nguồn và ghi đích
  - Quản lý bí mật, xoay vòng thông tin truy cập và tách theo môi trường
  - Mã hóa đường truyền và bảo vệ dữ liệu khi lưu trữ
  - Che dữ liệu, mã hóa định danh và giới hạn nhận diện cá nhân
  - Lọc dữ liệu nhạy cảm trước khi chuyển sang hệ thống đích
  - Giữ bí mật trong log, tệp lỗi và vùng trung gian
  - Kiểm soát quyền truy cập vào dữ liệu cách ly và dữ liệu lịch sử
  - Chính sách lưu giữ, xóa dữ liệu và lan truyền yêu cầu xóa
  - Cách ly đơn vị sử dụng và ngăn trộn dữ liệu giữa môi trường
  - Nhật ký kiểm toán và trách nhiệm phê duyệt thay đổi luồng dữ liệu
- level1: Giám sát và vận hành
  level2:
  - Trạng thái lần chạy, trạng thái bước và tiến độ từng phân vùng
  - Số bản ghi đọc, biến đổi, ghi, bỏ qua và cách ly
  - Độ mới dữ liệu (freshness) và độ trễ so với nguồn
  - Tốc độ thay đổi, độ trễ đồng bộ và thời gian giải phóng tồn đọng
  - Phát hiện lần chạy không có dữ liệu và lần chạy bị treo
  - Cảnh báo thay đổi lược đồ, chất lượng giảm và chênh lệch số lượng
  - Đo thời gian chạy, mức sử dụng tài nguyên và chi phí
  - Phân biệt hệ thống kết nối được với dữ liệu đã sẵn sàng sử dụng
  - Cam kết chất lượng dịch vụ và chỉ tiêu theo nhu cầu nghiệp vụ
  - Quy trình ứng phó sự cố, người chịu trách nhiệm và điều kiện chạy lại
  - Bàn giao vận hành bằng sơ đồ nguồn–đích và hướng dẫn phục hồi
- level1: Kiểm thử và đối soát
  level2:
  - Kiểm thử đơn vị cho từng quy tắc ánh xạ và biến đổi
  - Kiểm thử hợp đồng giữa bên cung cấp với bên sử dụng dữ liệu
  - Bộ dữ liệu chuẩn và kết quả kỳ vọng có thể kiểm chứng
  - 'Kiểm thử biên: null, Unicode, múi giờ và số có độ chính xác cao'
  - Kiểm thử tích hợp với nguồn, đích và bộ kết nối thực tế
  - Kiểm thử khởi động lại, chạy lại và xử lý một phần
  - Kiểm thử dữ liệu trùng, đến muộn, bị xóa và đổi lược đồ
  - Đối soát số lượng bản ghi theo khóa, ngày và phân vùng
  - Đối soát tổng tiền, chỉ tiêu nghiệp vụ và phân bố dữ liệu
  - Mã băm bản ghi và giới hạn khi chuẩn hóa chưa thống nhất
  - Phát hiện thiếu, thừa và khác giá trị giữa nguồn với đích
  - Kiểm thử tải, bảo mật và tính cô lập giữa các lần chạy
- level1: Di trú dữ liệu
  level2:
  - Phân biệt di trú một lần với đồng bộ vận hành liên tục
  - Khảo sát dữ liệu cũ, dữ liệu không hợp lệ và khóa cần chuyển đổi
  - Thiết kế ánh xạ định danh và bảo toàn quan hệ nghiệp vụ
  - Nạp dữ liệu lịch sử ban đầu theo phạm vi có thể kiểm soát
  - Theo kịp thay đổi phát sinh trong thời gian di trú
  - Chạy song song hệ thống cũ và mới để đối chiếu
  - Chọn thời điểm chuyển đổi (cutover) và cửa sổ tạm dừng ghi
  - Xác định điều kiện nghiệm thu và điều kiện quay lại hệ thống cũ
  - Chuyển hướng đọc, ghi và quyền sở hữu nguồn dữ liệu
  - Kiểm tra sau chuyển đổi và kết thúc đồng bộ tạm thời
  - Lưu bằng chứng di trú và xử lý dữ liệu cũ theo chính sách
- level1: Triển khai với Java
  level2:
  - Tách lớp đọc nguồn, biến đổi, kiểm tra và ghi đích
  - Đối tượng truyền dữ liệu và ánh xạ kiểu giữa Java với hệ thống ngoài
  - Chọn thư viện đọc tệp, xử lý JSON/XML và truy cập cơ sở dữ liệu
  - Quản lý giao dịch JDBC và lỗi khi xác nhận ghi
  - 'Spring Batch: vai trò Job, Step, ItemReader, ItemProcessor và ItemWriter'
  - JobRepository, tham số lần chạy và khả năng khởi động lại trong Spring Batch
  - Cấu hình thử lại, bỏ qua và hoàn tác theo ý nghĩa dữ liệu
  - Giới hạn luồng, kết nối và bộ nhớ khi chạy song song
  - Đóng tài nguyên, dừng có kiểm soát và ghi nhận kết quả cuối
  - Tách cấu hình môi trường khỏi quy tắc biến đổi nghiệp vụ
  - Chọn công cụ tích hợp sẵn có hay tự xây dựng bằng Java theo yêu cầu
- level1: Thực hành tổng hợp
  level2:
  - Khảo sát bài toán hợp nhất khách hàng, đơn hàng và doanh thu
  - Lập đặc tả nguồn–đích, hợp đồng dữ liệu và tiêu chí chất lượng
  - Nhập CSV vào cơ sở dữ liệu qua vùng trung gian và kiểm tra lỗi
  - Đọc cơ sở dữ liệu theo lô rồi chuẩn hóa và nạp sang hệ thống đích
  - Thu thập API có phân trang, giới hạn tốc độ và mốc tiếp tục
  - Xây dựng đồng bộ tăng dần có biên cố định và chống trùng
  - Thực nghiệm dữ liệu bị xóa, cập nhật muộn và thay đổi lược đồ
  - Thực nghiệm CDC với ảnh chụp ban đầu và thay đổi tiếp nối
  - Mô phỏng lỗi giữa lần chạy và chứng minh khả năng khôi phục
  - Đối soát số bản ghi, giá trị nghiệp vụ và lịch sử thay đổi
  - Lập bảng giám sát và quy trình xử lý dữ liệu bị cách ly
  - Diễn tập nạp lịch sử, theo kịp thay đổi và chuyển đổi hệ thống
  - Hoàn thiện hồ sơ thiết kế, kiểm thử và bàn giao vận hành
