references:
  - title: "AWS Glue — Concepts"
    url: "https://docs.aws.amazon.com/glue/latest/dg/components-key-concepts.html"
    description: "Khái niệm nguồn, đích, Data Catalog, ETL job, crawler và trigger trong pipeline dữ liệu."
  - title: "AWS Glue — What Is AWS Glue?"
    url: "https://docs.aws.amazon.com/glue/latest/dg/what-is-glue.html"
    description: "Tổng quan data integration, kết nối đa nguồn, chuẩn bị và chuyển dữ liệu cho phân tích hoặc ứng dụng."
  - title: "Apache Beam — Basics of the Beam Model"
    url: "https://beam.apache.org/documentation/basics/"
    description: "Mô hình xử lý batch/streaming, pipeline, PCollection, PTransform và schema."
  - title: "Apache Airflow — What Is Airflow?"
    url: "https://airflow.apache.org/docs/apache-airflow/stable/index.html"
    description: "Orchestration cho batch pipeline: DAG, lịch chạy, task dependency, retry, monitoring và backfill."
  - title: "Debezium — MySQL Connector"
    url: "https://debezium.io/documentation/reference/stable/connectors/mysql.html"
    description: "CDC từ binlog, initial snapshot, change events và offset/checkpoint khi đồng bộ tăng dần."
  - title: "Confluent — Schema Evolution and Compatibility"
    url: "https://docs.confluent.io/platform/current/schema-registry/fundamentals/schema-evolution.html"
    description: "Schema versioning, backward/forward compatibility và tác động đến producer, consumer."
  - title: "AWS Glue — Data Quality"
    url: "https://docs.aws.amazon.com/glue/latest/dg/glue-data-quality.html"
    description: "Định nghĩa và chạy rule kiểm tra data quality; hỗ trợ quality scoring, cảnh báo và kiểm thử dữ liệu."
  - title: "AWS Glue — Job Logging"
    url: "https://docs.aws.amazon.com/glue/latest/dg/monitor-continuous-logging.html"
    description: "Quan sát log ETL job, phân tích lỗi và cấu hình nơi lưu thông tin chạy pipeline."
  - title: "Google Cloud — Dataflow Overview"
    url: "https://docs.cloud.google.com/dataflow/docs/overview"
    description: "Các kiểu pipeline di chuyển dữ liệu, ETL và xử lý stream/batch tại quy mô lớn."