references:
  - title: "RabbitMQ — Java Hello World Tutorial"
    url: "https://www.rabbitmq.com/tutorials/tutorial-one-java"
    description: "Kết nối Java client, producer, consumer, channel và queue."
  - title: "RabbitMQ — Java Work Queues Tutorial"
    url: "https://www.rabbitmq.com/tutorials/tutorial-two-java"
    description: "Work queues, manual acknowledgements, durability và prefetch."
  - title: "RabbitMQ — Exchanges"
    url: "https://www.rabbitmq.com/docs/exchanges"
    description: "Exchanges, bindings, routing keys và các loại direct/fanout/topic."
  - title: "RabbitMQ — Queues"
    url: "https://www.rabbitmq.com/docs/queues"
    description: "Thuộc tính queue, durability, ordering và giới hạn sử dụng."
  - title: "RabbitMQ — Quorum Queues"
    url: "https://www.rabbitmq.com/docs/quorum-queues"
    description: "Hàng đợi quorum bền vững, replicated và các điểm cần cân nhắc."
  - title: "RabbitMQ — Consumer Acknowledgements and Publisher Confirms"
    url: "https://www.rabbitmq.com/docs/confirms"
    description: "Hai cơ chế xác nhận, nack/requeue và publisher data safety."
  - title: "RabbitMQ — Dead Letter Exchanges"
    url: "https://www.rabbitmq.com/docs/dlx"
    description: "Cấu hình DLX, trường hợp dead-letter và chính sách retry."
  - title: "RabbitMQ — Management Plugin"
    url: "https://www.rabbitmq.com/docs/management"
    description: "Management UI, HTTP API, theo dõi queue và message rates."
  - title: "RabbitMQ — Access Control"
    url: "https://www.rabbitmq.com/docs/access-control"
    description: "Virtual hosts, authentication và cấp quyền tối thiểu cho ứng dụng."