references:
  - title: "Enterprise Integration Patterns — Messaging Patterns Overview"
    url: "https://www.enterpriseintegrationpatterns.com/patterns/messaging/"
    description: "Danh mục gốc của các mẫu Message, Channel, Routing, Transformation, Endpoint và System Management."
  - title: "Enterprise Integration Patterns — Request-Reply"
    url: "https://www.enterpriseintegrationpatterns.com/patterns/messaging/RequestReply.html"
    description: "Giải thích tương tác hai chiều trên các channel riêng và các cách xử lý reply đồng bộ hoặc bất đồng bộ."
  - title: "Enterprise Integration Patterns — Message Routing"
    url: "https://www.enterpriseintegrationpatterns.com/patterns/messaging/MessageRoutingIntro.html"
    description: "Phân loại router, filter, recipient list, splitter, aggregator và composed message processor."
  - title: "Enterprise Integration Patterns — Message Translator"
    url: "https://www.enterpriseintegrationpatterns.com/patterns/messaging/MessageTranslator.html"
    description: "Mẫu biến đổi định dạng thông điệp để tách biệt mô hình dữ liệu giữa các ứng dụng tích hợp."
  - title: "Enterprise Integration Patterns — Aggregator"
    url: "https://www.enterpriseintegrationpatterns.com/patterns/messaging/Aggregator.html"
    description: "Nguyên tắc correlation, điều kiện hoàn tất và cách ghép các kết quả liên quan thành một message."
  - title: "Enterprise Integration Patterns — Competing Consumers"
    url: "https://www.enterpriseintegrationpatterns.com/patterns/messaging/CompetingConsumers.html"
    description: "Mô hình nhiều consumer xử lý song song trên một point-to-point channel và các đánh đổi về phân phối."
  - title: "Spring Integration — Core Messaging"
    url: "https://docs.spring.io/spring-integration/reference/core.html"
    description: "Tài liệu triển khai Message, Channel và các pattern router, filter, transformer, splitter, aggregator trong Spring Integration."
