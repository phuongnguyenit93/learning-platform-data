menu:
- level1: Tổng quan độ tin cậy
  level2:
  - 'Độ tin cậy trong messaging: mục tiêu, lợi ích và giới hạn'
  - Vai trò của producer, broker, consumer và hệ thống lưu trữ
  - Vòng đời thông điệp từ ý định nghiệp vụ đến tác động cuối cùng
  - Phân biệt gửi thành công, lưu bền vững, nhận thành công và xử lý thành công
  - 'Hàng đợi và luồng sự kiện: khác biệt ảnh hưởng đến độ tin cậy'
  - Đánh đổi giữa tính đúng đắn, độ trễ, thông lượng và khả năng sẵn sàng
  - 'Phạm vi bảo đảm: một tiến trình, một broker và nhiều hệ thống'
  - Lộ trình học và các thuật ngữ cốt lõi
- level1: Mô hình lỗi
  level2:
  - Lỗi tạm thời, lỗi vĩnh viễn và lỗi do dữ liệu
  - Mất kết nối, timeout và kết quả gửi không xác định
  - Producer, broker hoặc consumer dừng đột ngột
  - Cửa sổ mất thông điệp và cửa sổ phát sinh bản sao
  - Phân vùng mạng, mất quorum và chuyển đổi nút chủ
  - Xử lý thành công nhưng thất lạc phản hồi xác nhận
  - Thông điệp chậm, đến sai thứ tự hoặc hết giá trị nghiệp vụ
  - Thông điệp độc hại cho luồng xử lý và lỗi lặp lại có tính quyết định
  - Lỗi tương quan, sự cố dây chuyền và phạm vi ảnh hưởng
  - Lập ma trận lỗi theo từng ranh giới hệ thống
- level1: Bảo đảm giao nhận
  level2:
  - 'At-most-once: chấp nhận mất để tránh giao lại'
  - 'At-least-once: giao lại và trách nhiệm xử lý trùng'
  - 'Exactly-once: xác định ranh giới và điều kiện bảo đảm'
  - Phân biệt delivery, processing và business effect
  - Tính an toàn và khả năng tiến triển của luồng thông điệp
  - Điểm xác nhận thành công và trách nhiệm của từng thành phần
  - Bảo đảm của giao thức so với bảo đảm của ứng dụng
  - Thiết kế hợp đồng giao nhận cho từng loại nghiệp vụ
- level1: Định danh và hợp đồng
  level2:
  - Message ID, event ID, business key và idempotency key
  - Correlation ID, causation ID và liên kết chuỗi xử lý
  - Phạm vi duy nhất, thời hạn sử dụng và quy tắc tái sử dụng định danh
  - Thiết kế envelope với loại sự kiện, phiên bản, thời gian và nguồn phát
  - Phân biệt thời gian phát sinh, thời gian công bố và thời gian xử lý
  - Kiểm tra schema và quy tắc từ chối thông điệp không hợp lệ
  - Tương thích schema giữa producer, consumer và thông điệp lưu lâu
  - Giữ ổn định định danh và metadata khi retry hoặc replay
- level1: Lưu trữ bền vững
  level2:
  - Thông điệp persistent và cấu hình lưu trữ của đích nhận
  - Bộ đệm, ghi đĩa, flush và ranh giới mất dữ liệu
  - Nhân bản, quorum và mức xác nhận ghi
  - Lưu bền vững thông điệp, metadata và trạng thái tiêu thụ
  - Chính sách retention, compaction và khả năng đọc lại
  - Dung lượng đĩa, hạn mức lưu trữ và hành vi khi đầy
  - Phát hiện hỏng dữ liệu và kiểm tra tính toàn vẹn
  - Bảo đảm thực tế khi broker khởi động lại hoặc failover
- level1: Gửi thông điệp an toàn
  level2:
  - Phân biệt lỗi trước khi gửi, lỗi khi gửi và lỗi sau khi broker nhận
  - Publisher confirmation và mức xác nhận của producer
  - Thông điệp không có tuyến nhận và cơ chế phát hiện unroutable
  - Timeout gửi và quyết định gửi lại khi kết quả chưa rõ
  - Giới hạn số lần gửi đang chờ xác nhận
  - 'Gửi theo lô: đánh đổi thông lượng và phạm vi lỗi'
  - Producer idempotence và giới hạn chống trùng theo phiên
  - Giữ dữ liệu chờ gửi khi tiến trình producer dừng
  - Đóng producer an toàn và xử lý các lần gửi chưa hoàn tất
- level1: Nhận và xác nhận
  level2:
  - Auto acknowledgement và manual acknowledgement
  - Thời điểm ack so với hoàn tất tác động nghiệp vụ
  - Nack, reject, requeue và lựa chọn giao lại
  - Thông điệp đang xử lý, thời hạn giữ quyền xử lý và gia hạn
  - Consumer mất kết nối trước hoặc sau khi ack
  - Prefetch và giới hạn thông điệp chưa xác nhận
  - Xử lý theo lô và xác nhận một phần khi có lỗi
  - Offset, checkpoint và ranh giới commit trong luồng sự kiện
  - Consumer group, rebalance và quyền sở hữu partition
  - 'Graceful shutdown: ngừng nhận mới và hoàn tất việc đang xử lý'
- level1: Ranh giới giao dịch
  level2:
  - 'Hai lần ghi vào database và broker: bài toán dual write'
  - Các cửa sổ lỗi khi lưu database trước hoặc gửi thông điệp trước
  - Giao dịch cục bộ và những tài nguyên thực sự tham gia
  - Commit, rollback và việc hoàn tác tác động bên ngoài
  - Giao dịch broker và giao dịch database độc lập
  - 'XA và two-phase commit: điều kiện sử dụng, chi phí và giới hạn'
  - Luồng consume–process–produce trong một nền tảng messaging
  - Tác động HTTP, email, thanh toán và ranh giới không thể rollback
  - Lựa chọn bảo đảm theo yêu cầu nhất quán của nghiệp vụ
- level1: Transactional Outbox
  level2:
  - 'Ý tưởng Outbox: lưu trạng thái nghiệp vụ và ý định phát trong một giao dịch'
  - Thiết kế bảng Outbox với định danh, khóa thứ tự và trạng thái
  - Tạo sự kiện từ thay đổi nghiệp vụ mà không bỏ sót
  - 'Polling relay: truy vấn, khóa và nhận quyền xử lý bản ghi'
  - 'CDC relay: đọc thay đổi đã commit và theo dõi vị trí đọc'
  - Cửa sổ relay gửi thành công nhưng chưa đánh dấu hoàn tất
  - 'Nhiều relay: phân công công việc, lease và khôi phục quyền sở hữu'
  - Bảo toàn thứ tự sự kiện theo thực thể nghiệp vụ
  - Retry, cách ly lỗi và giám sát độ trễ Outbox
  - Dọn dữ liệu, lưu lịch sử và đối soát Outbox
- level1: Xử lý idempotent
  level2:
  - 'Idempotency: xử lý nhiều lần với tác động nghiệp vụ tương đương'
  - Phân biệt thao tác tự nhiên idempotent và thao tác cần bảo vệ
  - Chọn khóa chống trùng theo sự kiện hay theo ý định nghiệp vụ
  - Unique constraint và phép ghi nguyên tử thay cho check-then-act
  - Ghi nhận khóa chống trùng cùng cập nhật nghiệp vụ trong một giao dịch
  - Xử lý hai consumer đồng thời nhận cùng một thông điệp
  - Lưu và trả lại kết quả xử lý cho yêu cầu lặp
  - TTL của dữ liệu chống trùng và bản sao đến muộn
  - Idempotency của lời gọi tới hệ thống bên ngoài
  - Phân biệt sự kiện trùng và yêu cầu nghiệp vụ hợp lệ lặp lại
- level1: Inbox và trạng thái
  level2:
  - 'Transactional Inbox: ghi nhận tiếp nhận trước khi xử lý'
  - Phối hợp Inbox, dữ liệu nghiệp vụ và acknowledgement
  - Mô hình trạng thái RECEIVED, PROCESSING, SUCCEEDED và FAILED
  - Khôi phục thông điệp dở dang sau khi tiến trình dừng
  - Lease, fencing token và ngăn worker cũ tiếp tục ghi
  - Optimistic locking và kiểm tra phiên bản thực thể
  - Chuyển trạng thái hợp lệ để ngăn tác động lặp hoặc sai thứ tự
  - Kết hợp Outbox và Inbox cho luồng nhiều dịch vụ
  - Dọn lịch sử Inbox và giữ đủ bằng chứng đối soát
- level1: Retry có kiểm soát
  level2:
  - Phân loại lỗi retryable và non-retryable
  - Retry tức thời, retry trì hoãn và retry thủ công
  - Exponential backoff, giới hạn thời gian chờ và jitter
  - Giới hạn số lần thử, tổng thời gian và ngân sách retry
  - 'Retry tại producer, broker và consumer: tránh nhân số lần thử'
  - 'Blocking retry và non-blocking retry: tác động đến thứ tự'
  - Thiết kế retry queue hoặc retry topic và metadata lần thử
  - Ngăn vòng lặp requeue và retry storm
  - Tôn trọng thời hạn nghiệp vụ khi quyết định thử lại
  - Giữ nguyên định danh và tránh lặp tác động khi retry
- level1: Dead Letter và cách ly
  level2:
  - 'Dead Letter Queue: mục đích và điều kiện chuyển thông điệp'
  - Phân biệt dead letter, parking lot và khu vực cách ly dữ liệu
  - Lưu nguyên payload, định danh, nguồn và nguyên nhân thất bại
  - 'Lỗi deserialize hoặc schema: cách ly trước xử lý nghiệp vụ'
  - Xử lý lỗi khi chính thao tác chuyển DLQ thất bại
  - Phân loại, phân công và đặt thời hạn xử lý thông điệp tồn đọng
  - Sửa nguyên nhân gốc trước khi redrive
  - Redrive có giới hạn tốc độ và kiểm tra chống trùng
  - Ngăn vòng lặp giữa luồng chính, retry và DLQ
  - Retention, phân quyền và kiểm toán thao tác trên DLQ
- level1: Thứ tự và đồng thời
  level2:
  - Thứ tự toàn cục, theo partition và theo thực thể nghiệp vụ
  - Chọn message key để giữ thứ tự trong đúng phạm vi
  - Nhiều producer và giới hạn suy luận từ thứ tự đến
  - Tăng consumer concurrency và nguy cơ hoàn tất sai thứ tự
  - Retry, DLQ và rebalance làm thay đổi thứ tự xử lý
  - Sequence number và phát hiện sự kiện thiếu hoặc đến muộn
  - Buffer và thời hạn chờ khi thiếu sự kiện trước
  - Version check và từ chối cập nhật từ sự kiện cũ
  - Phân phối lại partition hoặc khóa và tác động đến thứ tự
- level1: Exactly-once thực tế
  level2:
  - Phân biệt exactly-once delivery, processing và effect
  - Producer idempotence không thay thế consumer idempotency
  - Giao dịch thông điệp và commit offset trong cùng ranh giới
  - Đọc dữ liệu đã commit và xử lý giao dịch bị hủy
  - 'Retry sau timeout: chứng minh kết quả khi trạng thái chưa rõ'
  - Exactly-once trong nền tảng và tác động tới database bên ngoài
  - Kết hợp transaction, deduplication và đối soát cho hiệu quả nghiệp vụ
  - Kiểm chứng tuyên bố exactly-once bằng các cửa sổ lỗi cụ thể
- level1: Nhất quán nghiệp vụ
  level2:
  - Eventual consistency và thời điểm người dùng thấy kết quả
  - Thiết kế trạng thái chờ thay cho giả định hoàn tất tức thì
  - Bất biến nghiệp vụ và điểm kiểm soát thay đổi trạng thái
  - Saga và điều phối nhiều bước qua thông điệp
  - Bù trừ nghiệp vụ và khác biệt với rollback kỹ thuật
  - Timeout nghiệp vụ, phản hồi muộn và hủy tác vụ
  - Giao tiếp request–reply bất đồng bộ và tương quan phản hồi
  - Đối soát giữa nguồn dữ liệu chuẩn và hệ thống nhận
  - Phát hiện, sửa sai và lưu vết khi các hệ thống lệch nhau
- level1: Backpressure và tải
  level2:
  - 'Backpressure: cân bằng tốc độ phát, nhận và xử lý'
  - Queue depth, consumer lag và tuổi thông điệp lâu nhất
  - Prefetch, batch size, concurrency và giới hạn tài nguyên
  - Bộ đệm hữu hạn và hành vi khi vượt dung lượng
  - Rate limiting theo dịch vụ, khách hàng hoặc loại thông điệp
  - Circuit breaker khi hệ thống phụ thuộc gặp lỗi
  - Bulkhead và cách ly luồng ưu tiên hoặc khách hàng gây tải lớn
  - Tự động mở rộng consumer với giới hạn partition và database
  - Giảm tải có chủ đích theo mức độ quan trọng của nghiệp vụ
  - Ước lượng thời gian giải phóng backlog và năng lực phục hồi
- level1: Thời hạn và vòng đời
  level2:
  - TTL kỹ thuật và thời hạn hiệu lực nghiệp vụ
  - Thông điệp trễ, hết hạn và quyết định bỏ qua hay bù trừ
  - Đồng hồ lệch và giới hạn so sánh timestamp giữa hệ thống
  - Retention của thông điệp và thời hạn lưu khóa chống trùng
  - Lưu trữ dài hạn, dữ liệu nhạy cảm và chính sách xóa
  - Replay lịch sử và khác biệt với retry một lần thất bại
  - Khôi phục projection mà không lặp tác động bên ngoài
  - Replay với schema cũ, phiên bản xử lý mới và dữ liệu tham chiếu
  - Đặt checkpoint và giới hạn tốc độ cho tác vụ replay
- level1: Sẵn sàng và khôi phục
  level2:
  - Replication, failover và các điều kiện duy trì quorum
  - Đánh đổi consistency và availability khi mạng bị phân vùng
  - Reconnect, khôi phục subscription và tái lập consumer
  - Triển khai nhiều vùng sẵn sàng và lỗi tương quan hạ tầng
  - RPO và RTO cho broker, database, Outbox và Inbox
  - Backup dữ liệu, cấu hình, offset và trạng thái chống trùng
  - Khôi phục sau thảm họa và ngăn hai hệ thống cùng phát tác động
  - Đối soát dữ liệu mất, trùng hoặc chưa rõ kết quả sau khôi phục
  - Diễn tập phục hồi và đo thời gian quay lại trạng thái ổn định
- level1: Bảo vệ luồng xử lý
  level2:
  - Xác thực và phân quyền producer, consumer, relay và công cụ redrive
  - Mã hóa kết nối và xử lý sự cố chứng chỉ
  - Xoay vòng thông tin xác thực mà không làm gián đoạn xử lý
  - Giới hạn kích thước payload và bảo vệ bước deserialize
  - Cách ly thông điệp không tin cậy và kiểm tra metadata
  - Bảo vệ dữ liệu nhạy cảm trong log, retry và DLQ
  - Ngăn một tenant hoặc luồng lỗi chiếm toàn bộ tài nguyên
  - Kiểm toán thay đổi cấu hình, replay và thao tác khôi phục
- level1: Java và Spring
  level2:
  - Ánh xạ producer confirmation và kết quả gửi bất đồng bộ vào mã Java
  - Chọn acknowledgement mode và xử lý exception trong listener
  - Phạm vi @Transactional và tài nguyên được transaction manager quản lý
  - Giới hạn độ bền của callback afterCommit và @TransactionalEventListener
  - Triển khai Outbox bằng JDBC hoặc JPA với giao dịch cục bộ
  - Triển khai consumer idempotent bằng unique constraint và transaction
  - 'Spring AMQP: publisher confirms, returns và xử lý giao lại'
  - 'Spring Kafka: offset, error handling và ranh giới giao dịch'
  - 'JMS và Spring JMS: acknowledgement, session transaction và redelivery'
  - Giữ correlation context khi xử lý trên thread hoặc executor khác
  - Quản lý thread pool, connection pool và graceful shutdown
  - Tránh chặn luồng xử lý và kiểm soát tác động của timeout
- level1: Quan sát và SLO
  level2:
  - Xác định SLI và SLO cho giao nhận và hoàn tất nghiệp vụ
  - Đo độ trễ đầu cuối theo từng mốc trong vòng đời thông điệp
  - Metric về lỗi gửi, timeout, retry, redelivery và duplicate
  - Metric về backlog, lag, DLQ và bản ghi Outbox chưa phát
  - Log có cấu trúc theo message ID và correlation ID
  - Distributed tracing qua producer, broker, consumer và retry
  - Cảnh báo theo tác động nghiệp vụ và nguy cơ vi phạm thời hạn
  - Dashboard phân biệt thiếu consumer, lỗi phụ thuộc và nghẽn broker
  - Đối soát số liệu và giới hạn của metric tổng hợp
  - Ngăn log và metric làm lộ dữ liệu hoặc tăng cardinality ngoài kiểm soát
- level1: Kiểm thử độ tin cậy
  level2:
  - Chuyển bất biến nghiệp vụ và bảo đảm giao nhận thành tiêu chí kiểm thử
  - Unit test cho phân loại lỗi, retry policy và chuyển trạng thái
  - Integration test với broker và database thật bằng Testcontainers
  - Kiểm thử thông điệp trùng, đến muộn và sai thứ tự
  - Dừng tiến trình tại các điểm trước và sau commit, send, ack
  - Mô phỏng timeout, mất mạng, failover và rebalance
  - Kiểm thử lỗi relay, khóa Outbox và cạnh tranh Inbox
  - Kiểm thử poison message, lỗi deserialize và DLQ không khả dụng
  - Load test, soak test và đo thời gian xử lý hết backlog
  - Kiểm thử replay, schema evolution và khôi phục từ backup
  - Kiểm chứng không mất tác động hợp lệ và không tạo tác động thừa
- level1: Vận hành và thay đổi
  level2:
  - Runbook cho backlog tăng, retry storm và DLQ tăng đột biến
  - Chẩn đoán thông điệp mất, trùng hoặc chưa rõ trạng thái
  - Dừng phát, tạm dừng consumer và cô lập phạm vi sự cố
  - Rolling deployment với nhiều phiên bản producer và consumer
  - Thay đổi schema, routing và partition mà vẫn giữ bảo đảm
  - Di chuyển broker hoặc luồng dữ liệu với checkpoint rõ ràng
  - Rollback phiên bản khi đã có thông điệp định dạng mới
  - Thay đổi retention, concurrency và timeout dựa trên số liệu
  - Redrive và replay có phê duyệt, nhật ký và điểm dừng
  - Hậu kiểm sự cố và cập nhật bằng chứng về bảo đảm thực tế
- level1: Thực hành tổng hợp
  level2:
  - Xây dựng luồng đơn hàng với Outbox và consumer idempotent
  - Xử lý thanh toán có kết quả không xác định và đối soát trạng thái
  - Gửi thông báo với retry hữu hạn, DLQ và redrive an toàn
  - Giữ thứ tự cập nhật tồn kho theo mã sản phẩm
  - Phục hồi projection bằng replay mà không lặp tác động bên ngoài
  - Thí nghiệm dừng consumer sau commit nhưng trước acknowledgement
  - Thí nghiệm relay gửi trùng sau khi broker xác nhận
  - Thí nghiệm quá tải và kiểm chứng backpressure
  - Thiết kế ma trận lỗi và đo SLO cho luồng nhiều dịch vụ
  - Đánh giá kiến trúc qua mất dữ liệu, trùng lặp, độ trễ và chi phí vận hành
