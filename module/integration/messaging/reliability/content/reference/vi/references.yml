references:
  - title: "Apache Kafka — Design: Message Delivery Semantics"
    url: "https://kafka.apache.org/41/design/design/"
    description: "Bảo đảm at-most-once, at-least-once, exactly-once và ranh giới transaction/offset."
  - title: "RabbitMQ — Reliability Guide"
    url: "https://www.rabbitmq.com/docs/reliability"
    description: "Độ tin cậy đầu cuối, xác nhận, publisher confirms, lỗi mạng và gửi trùng."
  - title: "RabbitMQ — Consumer Acknowledgements and Publisher Confirms"
    url: "https://www.rabbitmq.com/docs/confirms"
    description: "ACK, NACK, requeue, prefetch và xác nhận publisher."
  - title: "RabbitMQ — Dead Letter Exchanges"
    url: "https://www.rabbitmq.com/docs/dlx"
    description: "Cấu hình dead lettering, retry và nguy cơ lặp vòng hay mất message."
  - title: "Amazon SQS — Visibility Timeout"
    url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html"
    description: "Visibility timeout, phát lại, xử lý lỗi và dead-letter queues."
  - title: "Debezium — Outbox Event Router"
    url: "https://debezium.io/documentation/reference/stable/transformations/outbox-event-router.html"
    description: "Transactional outbox giúp đồng bộ cập nhật database và phát event."
  - title: "OpenTelemetry — Messaging Semantic Conventions"
    url: "https://opentelemetry.io/docs/specs/semconv/messaging/"
    description: "Trace, metric và log convention cho message producer/consumer."