menu:
- level1: Tổng quan
  level2:
  - Kafka là gì và bài toán tích hợp bằng luồng sự kiện
  - Sự kiện, thông điệp và luồng sự kiện khác nhau thế nào
  - Từ hàng đợi truyền thống đến nhật ký sự kiện phân tán
  - Vai trò và quan hệ giữa producer, broker, topic và consumer
  - Pub/sub, xử lý theo nhóm và khả năng đọc lại dữ liệu
  - Khi nào nên dùng Kafka và khi nào nên chọn giải pháp khác
  - Phân biệt Kafka với RabbitMQ, cơ sở dữ liệu và công cụ xử lý luồng
  - Các API chính và vị trí của Connect, Streams trong hệ sinh thái
  - Lộ trình thực hành từ một bản ghi đến hệ thống nhiều dịch vụ
- level1: Môi trường thực hành
  level2:
  - Kiến thức nền về Java, mạng, lưu trữ và hệ phân tán
  - Chọn phiên bản broker, Java client và JDK tương thích
  - Khởi tạo cụm KRaft một nút bằng Docker Compose
  - Thiết lập cụm nhiều broker và controller để mô phỏng sự cố
  - Cấu hình listeners, advertised.listeners và kết nối trong Docker
  - Tạo topic và kiểm tra metadata bằng công cụ dòng lệnh
  - Gửi và đọc bản ghi đầu tiên bằng console producer, console consumer
  - Quan sát consumer group và offset bằng công cụ dòng lệnh
  - Tổ chức dự án Java, cấu hình kết nối và dữ liệu thực hành
  - Lưu volume, khởi động lại và dọn môi trường thử nghiệm an toàn
- level1: Bản ghi sự kiện
  level2:
  - 'Cấu trúc record: key, value, headers, timestamp, partition và offset'
  - Phân biệt dữ liệu nghiệp vụ với metadata do Kafka quản lý
  - Key ảnh hưởng đến phân vùng và thứ tự xử lý như thế nào
  - Phân biệt null key, null value và thông điệp rỗng
  - Tombstone và ý nghĩa xóa theo key
  - CreateTime, LogAppendTime và thời gian phát sinh nghiệp vụ
  - Headers cho mã tương quan, truy vết và phiên bản sự kiện
  - Thiết kế event ID, nguồn phát và thời điểm phát sinh
  - Kích thước bản ghi và lựa chọn lưu dữ liệu lớn bên ngoài Kafka
  - Thiết kế sự kiện bất biến và phân biệt sự kiện với lệnh
- level1: Topic và phân vùng
  level2:
  - Topic, partition và nhật ký chỉ ghi nối tiếp
  - Offset chỉ có ý nghĩa trong từng partition
  - Phạm vi bảo đảm thứ tự trong một partition
  - Chọn key theo thực thể và yêu cầu thứ tự nghiệp vụ
  - Phân phối bản ghi không có key và cơ chế gom lô
  - Phân vùng tùy chỉnh và sự nhất quán giữa các producer
  - Ước lượng số partition từ lưu lượng và mức song song
  - Tăng số partition và ảnh hưởng đến ánh xạ key
  - Hot partition, key lệch và cách phân tán tải
  - Quy ước đặt tên topic, chủ sở hữu và phân chia miền nghiệp vụ
  - Tách topic theo loại sự kiện, mức bảo mật và vòng đời dữ liệu
  - Chính sách tự tạo topic và quản lý cấu hình topic
- level1: Kiến trúc cụm
  level2:
  - Trách nhiệm của broker, controller và client
  - Luồng ghi từ producer đến leader của partition
  - Luồng đọc từ consumer đến broker
  - Metadata discovery và vai trò của bootstrap.servers
  - Data plane, control plane và các loại listener
  - Group coordinator và các topic nội bộ
  - Transaction coordinator và trạng thái giao dịch
  - Request handler, network thread và quá trình xử lý yêu cầu
  - Leader epoch, broker epoch và nhận diện trạng thái lỗi thời
  - Phân biệt lỗi client, lỗi broker và lỗi điều phối cụm
- level1: KRaft
  level2:
  - Vì sao Kafka cần cơ chế đồng thuận cho metadata
  - Vai trò controller quorum, active controller và voter
  - Metadata log, snapshot và quá trình đồng bộ metadata
  - Raft, bầu leader và điều kiện đạt quorum
  - Tách vai trò broker và controller trong môi trường vận hành
  - Cluster ID, node ID và khởi tạo thư mục lưu trữ
  - Cấu hình controller listener và kết nối giữa các nút
  - Theo dõi trạng thái quorum và độ trễ metadata
  - Ảnh hưởng khi mất controller, mất quorum hoặc phân vùng mạng
  - Quản lý thành viên quorum theo khả năng của phiên bản
  - ZooKeeper trong hệ thống cũ và ranh giới chuyển sang KRaft
- level1: Lưu trữ
  level2:
  - Cấu trúc log segment, offset index và time index
  - Record batch, nén dữ liệu và kiểm tra tính toàn vẹn
  - Page cache, ghi tuần tự và truyền dữ liệu hiệu quả
  - Log end offset, high watermark và last stable offset
  - Phân biệt ghi log, nhân bản và đồng bộ dữ liệu xuống đĩa
  - Retention theo thời gian, dung lượng và cơ chế xóa segment
  - Log compaction và trạng thái mới nhất theo key
  - Tombstone, delete.retention.ms và khả năng dựng lại trạng thái
  - Kết hợp cleanup.policy=compact,delete và các đánh đổi
  - Segment roll, log cleaner và tác động đến dung lượng
  - Lưu trữ phân tầng và yêu cầu thành phần lưu trữ từ xa
- level1: Nhân bản
  level2:
  - Replica, leader, follower và replication factor
  - In-sync replicas và điều kiện replica rời hoặc gia nhập ISR
  - Cơ chế follower fetch và độ trễ nhân bản
  - Quan hệ giữa acks, min.insync.replicas và độ bền dữ liệu
  - Vì sao acks=all không có nghĩa chờ mọi replica đã cấu hình
  - Leader election khi broker lỗi và thời gian gián đoạn
  - Unclean leader election và đánh đổi mất dữ liệu
  - Log truncation, leader epoch và phục hồi replica
  - Rack awareness và bố trí replica theo miền sự cố
  - Preferred leader và cân bằng vai trò leader
  - Thử nghiệm broker lỗi để kiểm chứng tính sẵn sàng và độ bền
- level1: Producer Java
  level2:
  - Vòng đời KafkaProducer và cấu hình tối thiểu
  - Serializer cho key, value và xử lý lỗi tuần tự hóa
  - Tạo ProducerRecord với topic, key, headers và partition
  - send bất đồng bộ, Future và callback
  - Đọc RecordMetadata để xác nhận partition, offset và timestamp
  - Phân biệt gửi bất đồng bộ với chờ kết quả từng bản ghi
  - Quản lý producer dùng chung và đặc tính an toàn đa luồng
  - flush, close và dừng ứng dụng có kiểm soát
  - ProducerInterceptor và giới hạn sử dụng
  - Metadata refresh và phản ứng khi leader thay đổi
  - Xử lý lỗi trong callback mà không chặn luồng gửi
  - Xây dựng producer Java hoàn chỉnh với cấu hình ngoài mã nguồn
- level1: Điều phối gửi
  level2:
  - Record accumulator, sender thread và cơ chế gom lô
  - batch.size và linger.ms trong đánh đổi độ trễ, thông lượng
  - compression.type và chi phí CPU, mạng, lưu trữ
  - buffer.memory, max.block.ms và áp lực ngược lên bên gửi
  - acks=0, acks=1 và acks=all
  - retries, retry.backoff.ms và lỗi có thể thử lại
  - request.timeout.ms và delivery.timeout.ms
  - max.in.flight.requests.per.connection và rủi ro đảo thứ tự
  - enable.idempotence, producer ID và sequence number
  - Giới hạn khử trùng của producer so với sự kiện nghiệp vụ trùng
  - Xử lý kết quả gửi không xác định khi mất kết nối hoặc hết hạn
- level1: Consumer Java
  level2:
  - Vòng đời KafkaConsumer và cấu hình tối thiểu
  - Deserializer và cách đọc ConsumerRecord
  - subscribe theo danh sách topic hoặc biểu thức chính quy
  - assign trực tiếp và khác biệt với tham gia consumer group
  - Vòng lặp poll và giới hạn trách nhiệm của luồng consumer
  - position, committed offset và bản ghi tiếp theo sẽ đọc
  - enable.auto.commit và những tình huống có thể mất hoặc lặp xử lý
  - commitSync, commitAsync và xử lý lỗi commit
  - Commit offset theo từng partition và quy tắc offset kế tiếp
  - pause, resume và điều tiết tốc độ xử lý
  - wakeup, WakeupException và dừng consumer an toàn
  - Mô hình đa luồng và giới hạn an toàn của KafkaConsumer
  - Xây dựng consumer Java hoàn chỉnh có quản lý vòng đời
- level1: Nhóm consumer
  level2:
  - group.id và sự độc lập giữa các nhóm đọc cùng topic
  - Phân chia partition cho thành viên trong consumer group
  - Số consumer hữu ích và giới hạn từ số partition
  - Group coordinator, membership và lưu trữ offset
  - Heartbeat, session timeout và phát hiện thành viên mất kết nối
  - max.poll.interval.ms và trường hợp xử lý quá lâu
  - max.poll.records, fetch.min.bytes và giới hạn lô đọc
  - group.instance.id và thành viên tĩnh
  - Range, RoundRobin, Sticky và CooperativeSticky assignor
  - Theo dõi group state, assignment và consumer lag
  - Thay đổi số thành viên theo tải và tránh mở rộng vượt năng lực
- level1: Cân bằng lại
  level2:
  - Các nguyên nhân kích hoạt rebalance
  - Eager rebalance và cooperative rebalance
  - Consumer group protocol mới và khác biệt với classic protocol
  - Nhận diện cấu hình phụ thuộc phía client hoặc phía broker
  - ConsumerRebalanceListener và các callback thu hồi, cấp phát
  - Hoàn tất công việc và commit an toàn trước khi mất partition
  - Xử lý partition bị mất và tránh ghi kết quả từ chủ sở hữu cũ
  - Giảm rebalance khi triển khai hoặc khởi động lại ứng dụng
  - Ngăn rebalance lặp do poll chậm, GC hoặc kết nối không ổn định
  - Kiểm chứng thứ tự và bản ghi trùng trong thời gian rebalance
- level1: Offset và phát lại
  level2:
  - __consumer_offsets và vòng đời offset đã commit
  - auto.offset.reset khi chưa có offset hoặc offset không còn hợp lệ
  - seek, seekToBeginning và seekToEnd
  - Tìm offset theo timestamp bằng offsetsForTimes
  - 'Reset offset bằng công cụ quản trị: xem trước rồi thực thi'
  - Phát lại bằng group mới và cách bảo vệ consumer đang hoạt động
  - Chọn điểm bắt đầu theo thời gian hoặc mốc nghiệp vụ
  - Retention, offset hết hạn và OffsetOutOfRangeException
  - Đọc lại trên compacted topic và những dữ liệu không thể phục hồi
  - Thiết kế replay có giới hạn tốc độ và không lặp tác dụng phụ
  - Phân biệt consumer lag bằng số bản ghi với độ trễ nghiệp vụ
- level1: Ngữ nghĩa xử lý
  level2:
  - At-most-once, at-least-once và exactly-once
  - Phân biệt xác nhận ghi, giao bản ghi và hoàn tất xử lý
  - Cửa sổ lỗi giữa đọc, xử lý và commit offset
  - Tính bất biến và tính lũy đẳng trong xử lý sự kiện
  - Khử trùng bằng event ID và lưu dấu xử lý bền vững
  - Giữ thứ tự theo thực thể khi có nhiều bước xử lý
  - Xử lý trễ, sự kiện trùng và sự kiện đến sai thứ tự
  - Giới hạn bảo đảm khi gọi HTTP hoặc ghi cơ sở dữ liệu ngoài Kafka
  - Đánh đổi giữa độ trễ, độ bền, tính sẵn sàng và chi phí
  - Chọn ngữ nghĩa theo hậu quả nghiệp vụ của mất hoặc lặp sự kiện
- level1: Giao dịch
  level2:
  - Idempotent producer và transactional producer khác nhau thế nào
  - transactional.id, producer epoch và cơ chế fencing
  - initTransactions, beginTransaction, commitTransaction và abortTransaction
  - Ghi nguyên tử vào nhiều topic và partition
  - sendOffsetsToTransaction trong luồng đọc, xử lý và ghi lại Kafka
  - isolation.level=read_committed và read_uncommitted
  - Transaction marker, last stable offset và giao dịch chưa kết thúc
  - Phân loại lỗi có thể thử lại, phải hủy hoặc phải đóng producer
  - transaction.timeout.ms và khôi phục sau khi ứng dụng lỗi
  - Vì sao giao dịch Kafka không tự bao phủ HTTP hoặc cơ sở dữ liệu
  - Thử nghiệm crash để xác minh phạm vi exactly-once
- level1: Xử lý lỗi
  level2:
  - Phân loại lỗi tạm thời, lỗi dữ liệu và lỗi nghiệp vụ
  - Thử lại có giới hạn với backoff và jitter
  - Thử lại tại chỗ và ảnh hưởng đến poll, thứ tự, consumer lag
  - Retry topic và tác động đến thứ tự theo key
  - Dead-letter topic và dữ liệu chẩn đoán cần lưu
  - Lỗi deserialization và bản ghi không thể xử lý
  - Commit offset khi bỏ qua, chuyển lỗi hoặc xử lý một phần lô
  - Điều tiết khi hệ thống đích chậm hoặc không khả dụng
  - Khử trùng tác dụng phụ khi retry sau timeout
  - Quy trình sửa dữ liệu và đưa bản ghi lỗi trở lại luồng
  - Kiểm soát retry storm và giới hạn tài nguyên phục hồi
- level1: Hợp đồng dữ liệu
  level2:
  - Chọn String, JSON, Avro, Protobuf hoặc dữ liệu nhị phân
  - Serializer, deserializer và sự tương thích giữa các ngôn ngữ
  - Vai trò của schema registry và ranh giới với Apache Kafka
  - Schema ID, subject và quy ước đăng ký schema
  - Backward, forward, full compatibility và kiểm tra bắc cầu
  - Thêm, đổi, xóa trường và giá trị mặc định
  - Tiến hóa schema của key và hệ quả đối với phân vùng, compaction
  - Định danh sự kiện, phiên bản hợp đồng và metadata dùng chung
  - Phân biệt tương thích cấu trúc với thay đổi ý nghĩa nghiệp vụ
  - Chiến lược triển khai producer và consumer khi đổi hợp đồng
  - Contract testing và kiểm tra schema trong CI
  - Quản lý dữ liệu nhạy cảm và vòng đời schema
- level1: Quản trị qua API
  level2:
  - Admin client và mô hình bất đồng bộ của kết quả quản trị
  - Tạo, mô tả, liệt kê và xóa topic
  - Đọc và thay đổi cấu hình bằng incrementalAlterConfigs
  - Thêm partition và kiểm tra điều kiện thay đổi
  - Mô tả cluster, broker và phân bố replica
  - Liệt kê consumer group, đọc offset và tính lag
  - Điều chỉnh offset bằng Admin API với điều kiện vận hành an toàn
  - Quản lý ACL và quota bằng API
  - Tính lũy đẳng, timeout và kiểm tra kết quả thao tác quản trị
  - Tách quyền quản trị khỏi quyền chạy ứng dụng
- level1: Spring Kafka
  level2:
  - Vai trò của Spring for Apache Kafka và Spring Boot auto-configuration
  - Quản lý phiên bản Spring Kafka và Kafka client tương thích
  - ProducerFactory, ConsumerFactory và cấu hình theo môi trường
  - KafkaTemplate, CompletableFuture và xử lý kết quả gửi
  - '@KafkaListener, container factory và nhóm consumer'
  - Record listener, batch listener và mức concurrency
  - AckMode, manual acknowledgment và ranh giới commit offset
  - Message converter, JSON và bảo vệ deserialization
  - CommonErrorHandler, DefaultErrorHandler và bộ khôi phục bản ghi
  - DeadLetterPublishingRecoverer và cấu hình dead-letter topic
  - '@RetryableTopic và giới hạn của retry không chặn'
  - KafkaTransactionManager và giao dịch đọc, xử lý, ghi
  - Vòng đời listener container, pause, resume và graceful shutdown
  - Quan sát listener, truyền ngữ cảnh và kiểm thử tích hợp Spring
- level1: Kafka Connect
  level2:
  - Connect giải quyết bài toán tích hợp nguồn và đích dữ liệu
  - Connector, task, worker và worker group
  - Source connector và sink connector
  - Standalone mode và distributed mode
  - Các topic nội bộ lưu cấu hình, offset và trạng thái
  - Cài plugin, cách ly classloader và quản lý phiên bản connector
  - Converter, serializer và ranh giới của schema
  - Single Message Transform và predicate
  - 'Quản lý connector qua REST API: tạo, đổi cấu hình và xem trạng thái'
  - tasks.max, phân chia công việc và giới hạn song song của nguồn
  - Retry, error tolerance và dead-letter queue theo loại connector
  - Offset, khả năng phục hồi và bảo đảm xử lý phụ thuộc connector
  - Triển khai, cập nhật và bảo mật worker Connect
- level1: CDC và Outbox
  level2:
  - Change Data Capture và khác biệt với phát sự kiện từ ứng dụng
  - Vai trò của Debezium trong pipeline CDC vào Kafka
  - Snapshot ban đầu, đọc transaction log và chuyển sang streaming
  - Ánh xạ thao tác insert, update, delete và tombstone
  - Tiến hóa schema của bảng nguồn và tác động đến consumer
  - Bài toán dual write giữa cơ sở dữ liệu và Kafka
  - Transactional Outbox và tính nguyên tử trong cơ sở dữ liệu
  - Đọc outbox bằng polling hoặc CDC
  - Thiết kế outbox event ID, aggregate key và thứ tự sự kiện
  - Khử trùng, replay và dọn dữ liệu outbox
  - Khôi phục connector và phát hiện khoảng trống dữ liệu nguồn
  - Ranh giới giữa sự kiện thay đổi dữ liệu và sự kiện nghiệp vụ
- level1: Kafka Streams
  level2:
