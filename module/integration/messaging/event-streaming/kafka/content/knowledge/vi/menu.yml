  - StreamsBuilder, Serdes và cấu hình ứng dụng
  - KStream, KTable và GlobalKTable
  - filter, map, mapValues, flatMap và selectKey
  - Nhánh xử lý, gộp luồng và ghi sang topic đích
  - groupByKey, groupBy, aggregate, count và reduce
  - Stream task, stream thread và phân bố công việc
  - Repartition topic và điều kiện phát sinh phân vùng lại
  - Join giữa KStream, KTable và GlobalKTable
  - Co-partitioning và điều kiện để phép join đúng
  - Processor API và trường hợp DSL chưa đáp ứng
  - processing.guarantee và phạm vi exactly_once_v2
- level1: Trạng thái và thời gian
  level2:
  - State store trong bộ nhớ hoặc trên đĩa
  - Changelog topic và phục hồi state store
  - Standby replica, warmup và thời gian phục hồi ứng dụng
  - Event time, processing time và stream time
  - TimestampExtractor và dữ liệu có timestamp không hợp lệ
  - Tumbling window, hopping window, sliding window và session window
  - Grace period và xử lý sự kiện đến trễ
  - Windowed join và dữ liệu không khớp trong khoảng thời gian
  - Retention của cửa sổ, state store và changelog
  - Suppress, cache và thời điểm phát kết quả tổng hợp
  - Interactive Queries và định tuyến truy vấn theo trạng thái
  - Reset ứng dụng Streams và hậu quả đối với dữ liệu, trạng thái
  - Kiểm soát kích thước state store và xử lý key lệch
- level1: Share group
  level2:
  - Queues for Kafka và nhu cầu chia việc theo từng bản ghi
  - Phân biệt share group với consumer group theo partition
  - Điều kiện phiên bản, cấu hình và khả năng hỗ trợ của client
  - KafkaShareConsumer và vòng lặp nhận bản ghi
  - Khóa bản ghi, thời hạn xử lý và cấp lại bản ghi
  - Xác nhận ACCEPT, RELEASE, REJECT và gia hạn khi được hỗ trợ
  - Số lần giao, bản ghi không xử lý được và chiến lược xử lý lỗi
  - Mức song song vượt số partition và đánh đổi thứ tự
  - Theo dõi, quản trị và kiểm thử share group
  - Chọn share group hay consumer group theo yêu cầu nghiệp vụ
- level1: Bảo mật
  level2:
  - Bề mặt tấn công và ranh giới tin cậy trong hệ thống Kafka
  - TLS cho client, broker và controller
  - Keystore, truststore, chứng chỉ và kiểm tra hostname
  - mTLS và định danh bằng chứng chỉ
  - SASL/PLAIN, SASL/SCRAM, Kerberos và OAuthBearer
  - Ánh xạ principal và phân biệt xác thực với phân quyền
  - ACL theo topic, group, cluster và transactional.id
  - Quyền tối thiểu cho producer, consumer, Streams và Connect
  - Listener nội bộ, listener bên ngoài và phân đoạn mạng
  - Quản lý secret, xoay vòng chứng chỉ và thông tin xác thực
  - Quota để cô lập tenant và giảm tác động của client quá tải
  - Bảo vệ dữ liệu nhạy cảm trong payload, headers và bản ghi lỗi
  - Mã hóa khi lưu trữ và giới hạn của Kafka đối với xóa dữ liệu cá nhân
  - Kiểm tra quyền, ghi nhận hoạt động quản trị và ứng phó lộ thông tin
- level1: Quan sát hệ thống
  level2:
  - Thiết kế SLI, SLO theo luồng sự kiện và mục tiêu nghiệp vụ
  - Thu thập JMX metrics và xuất số liệu cho Prometheus
  - Theo dõi request latency, error rate và throughput của broker
  - Under-replicated partition, offline partition và biến động ISR
  - Độ trễ nhân bản, tình trạng controller quorum và metadata
  - 'Producer metrics: retry, buffer, batch và thời gian gửi'
  - 'Consumer metrics: lag, tốc độ đọc, commit và rebalance'
  - Phân biệt lag theo offset, tuổi bản ghi và độ trễ đầu cuối
  - Quan sát Connect task, Streams state store và quá trình restore
  - Truyền trace context qua headers và nối trace bất đồng bộ
  - Thiết kế log có cấu trúc và mã tương quan sự kiện
  - Cảnh báo theo triệu chứng, nguyên nhân và mức độ ảnh hưởng
  - Dashboard cho sức khỏe cụm và một luồng nghiệp vụ cụ thể
- level1: Hiệu năng
  level2:
  - Xác định mục tiêu throughput, latency và giới hạn tài nguyên
  - Thiết kế benchmark có tải nền, warmup và phân bố kích thước bản ghi
  - Đo latency p50, p95, p99 và tránh kết luận từ giá trị trung bình
  - Tối ưu batching, compression và số kết nối producer
  - Tối ưu fetch, poll và kích thước lô consumer
  - Cân bằng số partition, số client và mức concurrency
  - Chi phí serializer, payload và cấp phát đối tượng Java
  - Tác động của đĩa, page cache, RAM, CPU và mạng
  - JVM heap, GC và nguy cơ tranh chấp bộ nhớ với page cache
  - Quota, giới hạn tốc độ và cô lập tải nền
  - Nhận diện nút thắt bằng metrics trước khi thay cấu hình
  - Kiểm chứng hiệu năng đồng thời với thứ tự và ngữ nghĩa xử lý
- level1: Vận hành cụm
  level2:
  - Cấu hình broker tĩnh, động và cấu hình ghi đè ở topic
  - Quản lý cấu hình có phiên bản và kiểm tra sai lệch môi trường
  - Thêm broker và chuyển replica có kiểm soát
  - Partition reassignment, throttle và theo dõi tiến độ
  - Cân bằng replica, leader và dung lượng đĩa
  - Dừng có kiểm soát, rolling restart và thứ tự thao tác
  - Thay broker, thay đĩa và xử lý thư mục log lỗi
  - Phục hồi replica mà không phá vỡ điều kiện độ bền
  - Xử lý gần đầy đĩa và thay retention an toàn
  - Xóa topic, xóa group và điều kiện xác minh trước thao tác
  - 'Triển khai trên Kubernetes: định danh ổn định, lưu trữ và phân bố nút'
  - Tự vận hành, operator và dịch vụ quản lý sẵn
  - Runbook, phân quyền thao tác và kiểm tra sau thay đổi
- level1: Hoạch định năng lực
  level2:
  - Ước lượng lưu lượng vào từ tốc độ và kích thước sự kiện
  - Tính dung lượng theo retention, replication và hệ số nén
  - Tính băng thông ghi, đọc, nhân bản và phục hồi
  - Chọn số broker, controller và miền sự cố
  - Lập kế hoạch partition theo tăng trưởng và giới hạn metadata
  - Dự phòng tài nguyên khi mất broker hoặc bảo trì
  - Ước lượng thời gian xử lý backlog và mục tiêu phục hồi
  - Chi phí topic nhỏ, partition nhiều và kết nối nhiều
  - Quản lý tenant, quota và phân bổ tài nguyên
  - Đánh giá tổng chi phí và tiêu chí mở rộng cụm
- level1: Đa cụm và khôi phục
  level2:
  - Phân biệt replication trong cụm với sao chép giữa các cụm
  - RPO, RTO và các kịch bản thảm họa
  - MirrorMaker 2 và nền tảng Kafka Connect
  - MirrorSourceConnector, MirrorCheckpointConnector và MirrorHeartbeatConnector
  - Đặt tên topic đích, lọc dữ liệu và tránh vòng lặp sao chép
  - Đồng bộ cấu hình, quyền truy cập và các giới hạn cần kiểm tra
  - Offset translation và điều kiện chuyển consumer sang cụm dự phòng
  - Mô hình active-passive và active-active
  - Thứ tự, trùng dữ liệu và xung đột key khi có nhiều cụm
  - Failover, failback và diễn tập khôi phục
  - Phân biệt sao chép dữ liệu, backup và khả năng khôi phục dữ liệu đã xóa
  - Khôi phục ứng dụng, schema, connector và secret ngoài dữ liệu topic
- level1: Nâng cấp
  level2:
  - Đọc release notes và lập ma trận broker, client, Connect, Streams
  - Phân biệt phiên bản phần mềm với metadata.version và feature level
  - Đánh giá tính năng bị loại bỏ, cấu hình đổi mặc định và API deprecated
  - Chuẩn bị nâng cấp ZooKeeper sang KRaft cho hệ thống cũ
  - Rolling upgrade theo lộ trình hỗ trợ của từng phiên bản
  - Nâng client độc lập và kiểm thử thương lượng protocol
  - Canary, kiểm tra tương thích schema và theo dõi sau nâng cấp
  - Điều kiện rollback và thay đổi không thể hạ cấp
  - Lập bằng chứng xác nhận dữ liệu, hiệu năng và khả năng phục hồi
- level1: Kiểm thử
  level2:
  - Phân chia unit test, integration test và kiểm thử đầu cuối
  - MockProducer, MockConsumer và giới hạn mô phỏng
  - TopologyTestDriver cho logic Kafka Streams
  - Testcontainers và Embedded Kafka cho ứng dụng Java, Spring
  - Tạo topic, group ID và dữ liệu riêng cho từng ca kiểm thử
  - Chờ kết quả bất đồng bộ theo điều kiện thay vì thời gian cố định
  - Contract test cho schema và tương thích producer, consumer
  - Kiểm thử key, thứ tự, offset và khả năng phát lại
  - Kiểm thử lặp bản ghi, commit lỗi và giao dịch bị hủy
  - Mô phỏng broker lỗi, mạng gián đoạn và consumer rebalance
  - Load test, soak test và kiểm thử phục hồi sau backlog
  - Kiểm thử ACL, TLS và cấu hình sai
  - Tổ chức kiểm thử Kafka trong CI và dọn tài nguyên ổn định
- level1: Chẩn đoán sự cố
  level2:
  - Không kết nối được do bootstrap, DNS hoặc advertised.listeners
  - Lỗi TLS, SASL và phân quyền theo topic hoặc group
  - Topic không tồn tại, metadata cũ và leader chưa sẵn sàng
  - RecordTooLargeException và giới hạn kích thước ở nhiều tầng
  - Timeout gửi, buffer cạn và kết quả ghi không xác định
  - NotEnoughReplicas và ISR không đạt yêu cầu
  - Consumer không nhận dữ liệu do group, offset hoặc isolation level
  - CommitFailedException và rebalance liên tục
  - Lag tăng do consumer chậm, key lệch hoặc hệ thống đích nghẽn
  - Lỗi deserialization, schema không tương thích và bản ghi độc hại
  - Giao dịch treo, fencing và consumer read_committed bị chặn
  - Connect task lỗi hoặc Streams phục hồi trạng thái quá lâu
  - Đĩa đầy, replica offline và mất controller quorum
  - Quy trình thu thập chứng cứ, khoanh vùng và xác nhận phục hồi
- level1: Thiết kế ứng dụng
  level2:
  - Thiết kế luồng sự kiện theo ranh giới miền nghiệp vụ
  - Fact event, notification event và dữ liệu mang theo sự kiện
  - Tránh topic dùng chung trở thành hợp đồng phụ thuộc chặt
  - Xây dựng read model và phép chiếu từ sự kiện
  - Saga qua Kafka và trách nhiệm xử lý bù
  - Request-reply qua Kafka và khi nên chọn HTTP hoặc RPC
  - Version theo thực thể và phát hiện khoảng trống thứ tự
  - Giới hạn fan-out, backpressure và ngân sách độ trễ
  - Quản lý quyền sở hữu topic, schema và consumer group
  - Tránh lạm dụng Kafka như cơ sở dữ liệu truy vấn hoặc bộ lập lịch
  - Hồ sơ thiết kế gồm giả định, bảo đảm và kịch bản lỗi
- level1: Thực hành tổng hợp
  level2:
  - Luồng đơn hàng bằng Java producer và consumer có key
  - Nhiều consumer group cùng xử lý một nguồn sự kiện
  - Thay đổi số consumer và quan sát partition assignment
  - Tăng partition để kiểm chứng thay đổi ánh xạ key
  - Thử broker lỗi với các cấu hình acks và min.insync.replicas
  - Mô phỏng crash giữa xử lý và commit để nhận diện bản ghi trùng
  - Pipeline đọc, biến đổi và ghi bằng giao dịch Kafka
  - Luồng Spring Kafka có retry, dead-letter topic và phát lại
  - Pipeline CDC, Outbox và consumer khử trùng
  - Ứng dụng Streams tổng hợp theo cửa sổ với dữ liệu đến trễ
  - Diễn tập backlog, mở rộng và khôi phục sang cụm dự phòng
  - Đánh giá giải pháp bằng kiểm thử, dashboard và runbook
