menu:
- level1: Tổng quan Webhook
  level2:
  - 'Webhook là gì: thông báo sự kiện bằng lời gọi HTTP từ hệ thống khác'
  - 'Vì sao cần Webhook: giảm việc hỏi lại định kỳ và kết nối các hệ thống'
  - 'Các khái niệm nền tảng: sự kiện, bên gửi, bên nhận, endpoint và lần gửi'
  - Phân biệt Webhook với API yêu cầu–phản hồi, polling và callback
  - Phân biệt Webhook với hàng đợi thông điệp, SSE và WebSocket
  - Các tình huống sử dụng và tiêu chí lựa chọn Webhook
  - 'Giới hạn cần biết: độ trễ, lỗi mạng, sự kiện trùng và sai thứ tự'
  - Lộ trình học và kiến thức HTTP, JSON, Java cần chuẩn bị
- level1: Vòng đời sự kiện
  level2:
  - Từ thay đổi nghiệp vụ đến sự kiện và yêu cầu Webhook
  - 'Luồng gửi thành công: tạo sự kiện, gửi, xác nhận và xử lý'
  - Phân biệt tạo sự kiện, gửi HTTP, tiếp nhận và hoàn tất nghiệp vụ
  - Vai trò và ranh giới trách nhiệm của bên gửi và bên nhận
  - Phân biệt mã sự kiện, mã lần gửi và mã tương quan
  - Trạng thái sự kiện và trạng thái lần gửi trong toàn bộ vòng đời
  - Các điểm có thể lỗi và cửa sổ mất dữ liệu giữa từng bước
  - Bảo đảm chuyển phát và vì sao không nên mặc định xử lý đúng một lần
- level1: Giao tiếp HTTP
  level2:
  - Thiết kế URL, phương thức và đường dẫn endpoint nhận Webhook
  - Header, Content-Type, charset và cách đọc phần thân yêu cầu
  - Ý nghĩa mã phản hồi theo hợp đồng Webhook của từng hệ thống
  - Phản hồi xác nhận tiếp nhận và kết quả xử lý nghiệp vụ
  - Timeout, kết nối bị ngắt và trường hợp không biết bên nhận đã xử lý hay chưa
  - Chuyển hướng HTTP và chính sách theo dõi redirect khi gửi Webhook
  - Giới hạn kích thước payload, nén dữ liệu và nội dung không hỗ trợ
  - Kết nối HTTPS, chứng thư và hành vi của proxy ở giữa
  - Ví dụ phân tích một yêu cầu Webhook và phản hồi HTTP hoàn chỉnh
- level1: Thiết kế sự kiện
  level2:
  - Đặt tên loại sự kiện theo thay đổi nghiệp vụ và phạm vi miền dữ liệu
  - 'Thiết kế envelope: mã sự kiện, loại, thời điểm, nguồn và phiên bản'
  - Phân biệt thời điểm nghiệp vụ xảy ra, thời điểm tạo và thời điểm gửi
  - Lựa chọn payload chứa đầy đủ dữ liệu hoặc chỉ chứa tham chiếu
  - Ảnh chụp dữ liệu tại thời điểm phát sinh và dữ liệu hiện tại
  - Thiết kế khóa tài nguyên, mã tenant và thông tin tương quan
  - Biểu diễn thời gian, số tiền, giá trị rỗng và trường tùy chọn
  - Lược đồ JSON, ví dụ payload và kiểm tra tính hợp lệ
  - Giảm dữ liệu nhạy cảm và xác định dữ liệu thực sự cần chuyển
- level1: Đăng ký nhận
  level2:
  - 'Mô hình đăng ký: URL đích, chủ sở hữu, loại sự kiện và trạng thái'
  - Đăng ký tĩnh, đăng ký qua API và cổng quản trị Webhook
  - Xác minh quyền kiểm soát endpoint bằng luồng challenge
  - Phân biệt xác minh endpoint với xác thực từng yêu cầu gửi đến
  - Lọc sự kiện theo loại, tài nguyên và phạm vi tenant
  - Tạo, sửa, tạm dừng và hủy đăng ký nhận sự kiện
  - Quản lý nhiều endpoint và thay đổi cấu hình khi đang có lần gửi chờ
  - Tách cấu hình môi trường phát triển, kiểm thử và sản xuất
- level1: Thiết kế bên nhận
  level2:
  - Ranh giới endpoint tiếp nhận, bộ xử lý sự kiện và nghiệp vụ nội bộ
  - 'Trình tự tiếp nhận: kiểm tra yêu cầu, xác thực, kiểm tra dữ liệu và lưu bền vững'
  - Xử lý đồng bộ hay xác nhận sớm rồi xử lý bất đồng bộ
  - Chọn thời điểm trả phản hồi sau khi sự kiện đã được lưu an toàn
  - Điều phối xử lý theo loại sự kiện và xử lý loại chưa hỗ trợ
  - Phân loại lỗi yêu cầu với lỗi nghiệp vụ để trả phản hồi phù hợp
  - Quản lý trạng thái tiếp nhận và trạng thái xử lý độc lập
  - Tiếp nhận sự kiện không đồng nghĩa tin mọi dữ liệu trong payload
- level1: Thiết kế bên gửi
  level2:
  - Ranh giới phát sinh sự kiện, lập kế hoạch chuyển phát và gửi HTTP
  - Tách sự kiện nghiệp vụ khỏi bản ghi lần gửi đến từng endpoint
  - Phân phối một sự kiện đến nhiều bên nhận và cô lập kết quả từng đích
  - Thiết kế trạng thái lần gửi và quy tắc chuyển trạng thái
  - Tạo yêu cầu, ký nội dung và lưu kết quả HTTP có kiểm soát
  - Phân loại lỗi kết nối, timeout, mã phản hồi và lỗi cấu hình đích
  - Lập lịch gửi, lấy việc và quản lý quyền xử lý giữa nhiều worker
  - Chính sách lưu giữ lịch sử gửi và quyền truy cập thông tin chuyển phát
- level1: Độ bền dữ liệu
  level2:
  - Bài toán ghi dữ liệu nghiệp vụ và phát Webhook trong hai thao tác riêng
  - Mẫu transactional outbox cho sự kiện phát sinh cùng giao dịch nghiệp vụ
  - 'Bộ chuyển phát outbox: lấy bản ghi, gửi và cập nhật trạng thái'
  - Mẫu inbox để lưu sự kiện đã tiếp nhận trước khi xử lý
  - Giao dịch giữa inbox, thay đổi nghiệp vụ và đánh dấu hoàn tất
  - Phối hợp cơ sở dữ liệu với hàng đợi mà không bỏ sót sự kiện
  - Khóa, lease và thu hồi công việc khi tiến trình xử lý bị dừng
  - Lưu trữ, dọn dẹp và lập chỉ mục outbox, inbox, lịch sử lần gửi
- level1: Gửi lại và phục hồi
  level2:
  - Phân biệt lỗi có thể thử lại, lỗi vĩnh viễn và lỗi cần can thiệp
  - Xác định chính sách gửi lại theo hợp đồng HTTP của bên nhận
  - Khoảng chờ tăng dần, giới hạn khoảng chờ và độ ngẫu nhiên jitter
  - Xử lý Retry-After, giới hạn tần suất và thời gian ngừng dịch vụ
  - Giới hạn số lần thử, thời hạn chuyển phát và điều kiện kết thúc
  - Lưu lần gửi kế tiếp và khôi phục lịch sau khi khởi động lại
  - Khu vực cách ly sự kiện lỗi và hàng đợi thất bại cuối cùng
  - 'Gửi lại thủ công: quyền thao tác, dấu vết và phạm vi ảnh hưởng'
  - Phân biệt thử lại một lần chuyển phát, phát lại sự kiện và tạo sự kiện mới
- level1: Chống xử lý trùng
  level2:
  - 'Nguồn gốc sự kiện trùng: retry, timeout, thao tác thủ công và xử lý đồng thời'
  - Thiết kế khóa chống trùng theo sự kiện, bên nhận và phạm vi tenant
  - Phân biệt chống tiếp nhận trùng với chống lặp tác động nghiệp vụ
  - Ràng buộc duy nhất và thao tác nguyên tử khi nhiều yêu cầu đến cùng lúc
  - Ghi nhận kết quả xử lý cùng giao dịch nghiệp vụ để tránh cửa sổ lỗi
  - Chống trùng khi gọi dịch vụ bên ngoài và xử lý tác động không thể hoàn tác
  - Thời hạn lưu khóa, lưu kết quả và hệ quả khi phát lại sự kiện cũ
  - Xử lý bản ghi đang chạy, bị treo hoặc đã thất bại mà không bỏ mất công việc
- level1: Thứ tự và nhất quán
  level2:
  - Vì sao thứ tự tạo, gửi, đến và xử lý sự kiện có thể khác nhau
  - Xác định phạm vi cần giữ thứ tự theo tài nguyên hoặc thực thể nghiệp vụ
  - Số phiên bản, số thứ tự và kiểm tra dữ liệu đã cũ
  - Xử lý sự kiện đến trước, đến muộn và thiếu sự kiện trung gian
  - Tuần tự hóa theo khóa và đánh đổi với khả năng xử lý song song
  - Đọc lại trạng thái từ API nguồn để đối soát hoặc làm giàu sự kiện
  - Nhất quán cuối cùng và tác động đến trạng thái hiển thị cho người dùng
  - Quy trình đối soát định kỳ khi Webhook không đủ để khôi phục trạng thái
- level1: Xác thực và chữ ký
  level2:
  - 'Mô hình đe dọa: giả mạo bên gửi, sửa payload và phát lại yêu cầu'
  - Phân biệt mã bí mật, mã truy cập, hàm băm và chữ ký yêu cầu
  - Xác thực thông điệp bằng HMAC và vai trò của khóa bí mật dùng chung
  - Ký và xác minh trên đúng chuỗi byte gốc của phần thân yêu cầu
  - 'Cấu trúc dữ liệu được ký: timestamp, payload và quy tắc ghép nối'
  - Đọc header chữ ký, định dạng mã hóa và so sánh an toàn
  - Kiểm tra timestamp, độ lệch đồng hồ và cửa sổ chống phát lại
  - Luân chuyển khóa, nhận diện khóa và giai đoạn chấp nhận nhiều khóa
  - Chữ ký bất đối xứng và quản lý khóa công khai khi hợp đồng yêu cầu
  - Kiểm tra chữ ký trước khi tin dữ liệu và phản hồi khi xác thực thất bại
- level1: An toàn hệ thống
  level2:
  - Quản lý bí mật theo endpoint, tenant và môi trường triển khai
  - SSRF khi bên gửi nhận URL do người dùng cấu hình
  - Kiểm soát hostname, địa chỉ IP, DNS rebinding và redirect đến mạng nội bộ
  - Giới hạn kết nối ra ngoài và ngăn endpoint đích truy cập dịch vụ nhạy cảm
  - Phân quyền quản trị đăng ký, xem payload và gửi lại sự kiện
  - Giới hạn kích thước, độ sâu JSON và chi phí phân tích yêu cầu
  - Cấu hình xác thực và CSRF cho endpoint máy–máy theo mô hình ứng dụng
  - IP allowlist, mTLS và lớp bảo vệ bổ sung theo môi trường
  - Che dữ liệu nhạy cảm trong log, lỗi và lịch sử chuyển phát
  - Chính sách lưu giữ, xóa dữ liệu và dấu vết thao tác quản trị
- level1: Điều tiết tải
  level2:
  - Ước lượng tải từ số sự kiện, số bên nhận và số lần thử lại
  - Giới hạn tốc độ theo endpoint, tenant và toàn hệ thống
  - Giới hạn xử lý song song, pool kết nối và tài nguyên luồng
  - Điều tiết theo áp lực ngược khi bên nhận xử lý chậm
  - Hấp thụ đợt tăng tải bằng bộ đệm bền vững và giới hạn dung lượng
  - Cô lập endpoint lỗi để tránh làm chậm các bên nhận khác
  - Ngắt mạch, thăm dò phục hồi và phối hợp với lịch gửi lại
  - Tăng số worker, phân vùng công việc và phát hiện nút thắt hiệu năng
- level1: Bên nhận với Spring
  level2:
  - Cấu trúc ví dụ Java và Spring Boot cho endpoint nhận Webhook
  - Đọc raw body và header mà không làm thay đổi dữ liệu xác minh
  - Tách bộ xác thực chữ ký khỏi Controller và bộ xử lý nghiệp vụ
  - Ánh xạ JSON sang kiểu sự kiện và kiểm tra dữ liệu sau xác thực
  - Lưu inbox bằng giao dịch và chống tiếp nhận trùng bằng ràng buộc dữ liệu
  - Trả phản hồi xác nhận và chuyển công việc sang bộ xử lý nền
  - Điều phối handler theo loại sự kiện và ghi nhận kết quả xử lý
  - Quản lý lỗi, cấu hình timeout, giới hạn payload và bí mật bên nhận
  - Kiểm chứng toàn luồng từ yêu cầu HTTP đến thay đổi dữ liệu nghiệp vụ
- level1: Bên gửi với Spring
  level2:
  - Cấu trúc ví dụ Java và Spring Boot cho bộ phát Webhook
  - Lưu thay đổi nghiệp vụ và outbox trong cùng giao dịch
  - Triển khai bộ lấy việc với khóa hoặc lease giữa nhiều worker
  - Tạo HTTP client với giới hạn kết nối và timeout phù hợp
  - Tuần tự hóa payload ổn định, tạo timestamp và ký yêu cầu trước khi gửi
  - Ghi nhận kết quả từng lần gửi và lập lịch thử lại bền vững
  - Quản lý trạng thái đăng ký và cấu hình giới hạn theo endpoint
  - Dừng dịch vụ an toàn và tiếp tục công việc chưa hoàn tất
  - Kiểm chứng lỗi tiến trình tại các ranh giới giao dịch và gửi HTTP
- level1: Tích hợp bên ngoài
  level2:
  - 'Đọc tài liệu nhà cung cấp: loại sự kiện, payload và cách đăng ký'
  - 'Lập bảng hợp đồng: chữ ký, timeout, mã xác nhận và chính sách retry'
  - Triển khai challenge và xác thực theo đúng giao thức nhà cung cấp
  - Dùng môi trường thử nghiệm, công cụ gửi mẫu và đường hầm phát triển
  - Ánh xạ sự kiện bên ngoài sang mô hình nghiệp vụ nội bộ
  - Phân biệt payload thử nghiệm với dữ liệu và hành vi trên môi trường thật
  - Kiểm tra quyền gọi API nguồn và đối soát tài nguyên liên quan
  - Cô lập sự khác biệt nhà cung cấp bằng bộ chuyển đổi và cấu hình riêng
- level1: Tương thích hợp đồng
  level2:
  - Xác định phần hợp đồng ổn định và phần có thể mở rộng của Webhook
  - Thêm trường, đổi kiểu, xóa trường và tác động đến bên nhận
  - Thiết kế bên nhận chịu được trường bổ sung nhưng vẫn kiểm tra dữ liệu thiết yếu
  - Quản lý phiên bản sự kiện, phiên bản endpoint và phiên bản cấu hình đăng ký
  - Chuyển đổi hợp đồng với nhiều phiên bản cùng tồn tại
  - Xử lý sự kiện lịch sử khi phát lại sau khi lược đồ đã thay đổi
  - 'Tài liệu hợp đồng: ví dụ, bảo mật, lỗi, retry và chính sách ngừng hỗ trợ'
- level1: Kiểm thử Webhook
  level2:
  - Lập ma trận kiểm thử theo vòng đời sự kiện và ranh giới lỗi
  - Kiểm thử chữ ký với payload chuẩn, sai khóa và nội dung bị sửa
  - Kiểm thử timestamp cũ, lệch đồng hồ và luân chuyển khóa
  - 'Kiểm thử HTTP: mã phản hồi, timeout, mất kết nối và redirect'
  - Kiểm thử sự kiện trùng và nhiều yêu cầu đến đồng thời
  - Kiểm thử sự kiện sai thứ tự, thiếu sự kiện và dữ liệu nguồn thay đổi
  - Kiểm thử outbox, inbox và phục hồi sau khi tiến trình bị dừng
  - Kiểm thử lịch retry bằng đồng hồ điều khiển được và nguồn ngẫu nhiên kiểm soát
  - Kiểm thử hợp đồng, mô phỏng nhà cung cấp và kiểm thử xuyên suốt
  - Kiểm thử tải, SSRF, payload quá lớn và rò rỉ dữ liệu nhạy cảm
- level1: Quan sát hệ thống
  level2:
  - Thiết kế log có cấu trúc cho sự kiện, lần gửi và lần xử lý
  - Theo dõi mã tương quan qua bên gửi, bên nhận và hàng đợi nội bộ
  - Đo tỷ lệ tiếp nhận, tỷ lệ chuyển phát và kết quả xử lý nghiệp vụ
  - Đo độ trễ từng giai đoạn và thời gian từ phát sinh đến hoàn tất
  - Theo dõi backlog, tuổi sự kiện chờ và số lần retry
  - Dashboard và cảnh báo cho endpoint lỗi, chữ ký sai và hàng đợi thất bại
  - Truy vết phân tán và giới hạn độ đa dạng nhãn metric
  - Thiết kế trang tra cứu lịch sử gửi mà vẫn bảo vệ payload và bí mật
- level1: Triển khai và vận hành
  level2:
  - Kiểm tra DNS, TLS, URL đích và khả năng truy cập giữa các hệ thống
  - Cấu hình reverse proxy, cân bằng tải và giới hạn thời gian chờ
  - Đồng bộ đồng hồ, mã hóa đường truyền và quản lý chứng thư
  - Triển khai nhiều bản sao với trạng thái tiếp nhận và lịch gửi dùng chung
  - Readiness, health check và dừng nhận việc khi dịch vụ sắp tắt
  - Triển khai phiên bản mới khi vẫn còn sự kiện chờ và worker phiên bản cũ
  - Thay đổi endpoint, chuyển khóa và phối hợp chuyển đổi với bên nhận
  - Sao lưu, khôi phục và kiểm tra khả năng phục hồi dữ liệu chuyển phát
  - 'Runbook vận hành: phân quyền, kiểm tra định kỳ và diễn tập phục hồi'
- level1: Xử lý sự cố
  level2:
  - 'Webhook không đến: kiểm tra đăng ký, bộ lọc, mạng và lịch sử gửi'
  - 'Chữ ký không khớp: kiểm tra raw body, encoding, khóa và timestamp'
  - Bên nhận trả thành công nhưng nghiệp vụ chưa hoàn tất
  - Sự kiện trùng gây lặp tác động và cách truy tìm cửa sổ lỗi
  - Sự kiện sai thứ tự làm ghi đè trạng thái mới bằng dữ liệu cũ
  - Retry tăng hàng loạt, backlog lớn và endpoint bị quá tải
  - Khoanh vùng sự kiện lỗi, sửa nguyên nhân và phát lại có kiểm soát
  - Đối soát dữ liệu sau sự cố và đánh giá mức độ khôi phục
- level1: Dự án thực hành
  level2:
  - Xác định bài toán thông báo trạng thái đơn hàng giữa hai dịch vụ
  - Thiết kế loại sự kiện, payload, đăng ký và tiêu chí hoàn thành
  - Xây dựng bên gửi với outbox, chữ ký và lịch thử lại
  - Xây dựng bên nhận với inbox, xử lý nền và chống tác động trùng
  - Mô phỏng timeout, lỗi tạm thời, sự kiện trùng và sai thứ tự
  - Bổ sung dashboard, cảnh báo và thao tác gửi lại có dấu vết
  - Thực hiện kiểm thử xuyên suốt và đối soát trạng thái giữa hai dịch vụ
  - Đánh giá thiết kế, lập tài liệu hợp đồng và checklist nghiệm thu vận hành
