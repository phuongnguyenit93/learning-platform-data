references:
  - title: "Enterprise Integration Patterns — Introduction"
    url: "https://www.enterpriseintegrationpatterns.com/patterns/messaging/Introduction.html"
    description: "Bốn kiểu tích hợp cơ bản: file transfer, shared database, remote procedure invocation và messaging."
  - title: "AWS Prescriptive Guidance — Communication Patterns"
    url: "https://docs.aws.amazon.com/prescriptive-guidance/latest/modernization-integrating-microservices/communication-patterns.html"
    description: "So sánh giao tiếp đồng bộ và bất đồng bộ khi tích hợp microservices."
  - title: "RFC 9110 — HTTP Semantics"
    url: "https://www.rfc-editor.org/rfc/rfc9110.html"
    description: "Đặc tả HTTP request–response, methods, status codes và ngữ nghĩa của giao tiếp HTTP."
  - title: "OpenAPI Specification — v3.2.1"
    url: "https://spec.openapis.org/oas/v3.2.1.html"
    description: "Chuẩn mô tả hợp đồng HTTP API độc lập ngôn ngữ để triển khai và kiểm thử khả năng tương tác."
  - title: "CloudEvents — Specification"
    url: "https://github.com/cloudevents/spec/blob/main/README.md"
    description: "Định dạng và thuộc tính metadata chuẩn cho sự kiện để tăng tính tương tác giữa hệ thống."
  - title: "Enterprise Integration Patterns — Messaging Patterns"
    url: "https://www.enterpriseintegrationpatterns.com/patterns/messaging/"
    description: "Thư viện mẫu message channel, router, translator, request–reply và idempotent receiver."
  - title: "OWASP — API Security Project"
    url: "https://owasp.org/projects/api-security-project"
    description: "Rủi ro API như broken authorization, authentication và thiếu giới hạn tài nguyên."
  - title: "Microsoft — Retry Pattern"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/retry"
    description: "Xử lý lỗi tạm thời, backoff, giới hạn số lần thử và yêu cầu idempotency."
  - title: "Microsoft — Circuit Breaker Pattern"
    url: "https://learn.microsoft.com/en-gb/azure/architecture/patterns/circuit-breaker"
    description: "Ngắt tạm gọi dịch vụ đang lỗi để hạn chế cascading failure và bảo vệ khả năng phục hồi."
  - title: "OpenTelemetry — Context Specification"
    url: "https://opentelemetry.io/docs/specs/otel/context/"
    description: "Cơ chế mang ngữ cảnh truy vết và liên kết hoạt động xuyên ranh giới API hoặc các đơn vị xử lý."