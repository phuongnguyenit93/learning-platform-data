references:
  - title: "RSocket – Protocol Overview"
    url: "https://github.com/rsocket/rsocket"
    description: "Định nghĩa giao thức, bốn interaction models và extension metadata."
  - title: "RSocket – Protocol Specification"
    url: "https://rsocket.io/about/protocol/"
    description: "SETUP, REQUEST_N, KEEPALIVE, LEASE, resume và fragmentation."
  - title: "RSocket – Motivations"
    url: "https://rsocket.io/about/motivations/"
    description: "Reactive Streams backpressure, leasing và mục đích thiết kế RSocket."
  - title: "RSocket – Implementations"
    url: "https://rsocket.io/about/implementations/"
    description: "Các khả năng giao thức cốt lõi và mức hỗ trợ tính năng tùy implementation."
  - title: "Spring Framework – RSocket"
    url: "https://docs.spring.io/spring-framework/reference/rsocket.html"
    description: "RSocketRequester, @MessageMapping, @ConnectMapping, routing metadata và RSocketStrategies."
  - title: "Spring Boot – RSocket"
    url: "https://docs.spring.io/spring-boot/3.4/reference/messaging/rsocket.html"
    description: "Spring Boot server auto-configuration, transport TCP/WebSocket và requester builder."
  - title: "RSocket Java – Implementation"
    url: "https://github.com/rsocket/rsocket-java"
    description: "Thư viện giao thức RSocket trên Java cùng các dependency và transport."