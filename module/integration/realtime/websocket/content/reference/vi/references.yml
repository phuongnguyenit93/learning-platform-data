references:
  - title: "RFC 6455 — The WebSocket Protocol"
    url: "https://www.rfc-editor.org/info/rfc6455/"
    description: "Tiêu chuẩn chính thức về HTTP handshake, frame, message, ping/pong và đóng WebSocket."
  - title: "Spring Framework — WebSocket API"
    url: "https://docs.spring.io/spring-framework/reference/web/websocket/server.html"
    description: "Cấu hình WebSocket server, WebSocketHandler, endpoint và allowed origins."
  - title: "Spring Framework — STOMP"
    url: "https://docs.spring.io/spring-framework/reference/web/websocket/stomp.html"
    description: "STOMP over WebSocket, message broker, @MessageMapping, destination và phân phối tin."
  - title: "Spring Security — WebSocket Security"
    url: "https://docs.spring.io/spring-security/reference/servlet/integrations/websocket.html"
    description: "Xác thực, phân quyền message/destination và bảo vệ Origin khi dùng WebSocket."
  - title: "MDN — Writing WebSocket Client Applications"
    url: "https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API/Writing_WebSocket_client_applications"
    description: "WebSocket client trong trình duyệt, các event, bufferedAmount và xử lý disconnect."
  - title: "Spring Framework — WebSockets with WebFlux"
    url: "https://docs.spring.io/spring/reference/web/webflux-websocket.html"
    description: "Khái niệm protocol và lựa chọn tích hợp WebSocket theo mô hình reactive Spring."