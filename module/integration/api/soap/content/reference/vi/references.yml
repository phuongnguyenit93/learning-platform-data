references:
  - title: "W3C — SOAP 1.2 Part 0: Primer"
    url: "https://www.w3.org/TR/soap12-part0/"
    description: "Giới thiệu SOAP 1.2, cấu trúc thông điệp, ví dụ tương tác và các tình huống sử dụng."
  - title: "W3C — SOAP 1.2 Part 1: Messaging Framework"
    url: "https://www.w3.org/TR/soap12-part1/"
    description: "Định nghĩa Envelope, Header, Body, message processing và SOAP Fault."
  - title: "W3C — SOAP 1.2 Part 2: Adjuncts"
    url: "https://www.w3.org/TR/soap12-part2/"
    description: "Định nghĩa binding qua HTTP, request–response message exchange và quy ước RPC."
  - title: "W3C — Web Services Description Language 1.1"
    url: "https://www.w3.org/TR/2001/NOTE-wsdl-20010315/"
    description: "Mô tả types, message, portType, binding, service và SOAP 1.1 binding trong WSDL."
  - title: "W3C — XML Schema 1.1 Part 1: Structures"
    url: "https://www.w3.org/TR/xmlschema11-1/"
    description: "Đặc tả kiểu dữ liệu, phần tử, namespace và cơ chế đánh giá tính hợp lệ của XML."
  - title: "OASIS — WS-Security SOAP Message Security 1.1.1"
    url: "https://docs.oasis-open.org/wss-m/wss/v1.1.1/os/wss-SOAPMessageSecurity-v1.1.1-os.html"
    description: "Chuẩn bảo mật thông điệp SOAP bằng security tokens, chữ ký số và mã hóa."
  - title: "Spring — Spring Web Services Reference 4.1.3"
    url: "https://docs.spring.io/spring-ws/docs/4.1.3/reference/html/"
    description: "Tài liệu SOAP contract-first, endpoint, WSDL và client WebServiceTemplate trong Spring."
  - title: "Jakarta EE — Jakarta XML Web Services 4.0"
    url: "https://jakarta.ee/specifications/xml-web-services/4.0/jakarta-xml-ws-spec-4.0.html"
    description: "Đặc tả xây dựng web service Java dựa trên SOAP, WSDL và các annotation/API Jakarta."