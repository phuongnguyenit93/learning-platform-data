menu:
- level1: Tổng quan
  level2:
  - Nền tảng phát triển nội bộ (Internal Developer Platform) là gì
  - Vấn đề phân mảnh công cụ, thao tác lặp lại và thời gian chờ của nhóm phát triển
  - 'Bản đồ khái niệm: người dùng, khả năng nền tảng, dịch vụ, môi trường và quy trình'
  - Phân biệt Internal Developer Platform với Internal Developer Portal
  - Mối liên hệ giữa IDP, Platform Engineering, DevOps và SRE
  - Vai trò của tự phục vụ trong giảm công việc phối hợp thủ công
  - Ranh giới giữa nền tảng dùng chung và logic nghiệp vụ của ứng dụng
  - Những điều kiện tổ chức cần có trước khi xây dựng IDP
- level1: Nhu cầu người dùng
  level2:
  - Xác định nhóm người dùng và các công việc họ cần hoàn thành
  - Khảo sát hành trình từ tạo dự án đến vận hành và ngừng dịch vụ
  - Phân tích thời gian chờ, bước bàn giao và điểm gây lỗi trong quy trình hiện tại
  - Phân biệt nhu cầu thực tế với yêu cầu thêm một công cụ
  - Thu thập phản hồi bằng phỏng vấn, quan sát và dữ liệu sử dụng
  - Đánh giá mức độ phức tạp mà người dùng phải tự xử lý
  - Chọn trường hợp sử dụng phổ biến có giá trị khi chuẩn hóa
  - Xác định nhu cầu khác nhau của dịch vụ mới và ứng dụng đang vận hành
  - Đặt tiêu chí thành công cho từng hành trình tự phục vụ
- level1: Sản phẩm nền tảng
  level2:
  - Quản lý IDP như sản phẩm nội bộ có người dùng và kết quả mong đợi
  - Xác định giá trị cung cấp và phạm vi khả năng được cam kết
  - Xây dựng danh mục khả năng theo nhu cầu thay vì tập hợp công cụ sẵn có
  - Ưu tiên phát triển theo tác động, tần suất sử dụng và chi phí duy trì
  - Chọn lớp tích hợp tối thiểu đủ phục vụ thay vì tự xây lại mọi hệ thống
  - Tách tiêu chuẩn bắt buộc khỏi lựa chọn mặc định được khuyến nghị
  - Công bố lộ trình, giới hạn hỗ trợ và cách tiếp nhận yêu cầu
  - Quản lý phản hồi và giả thuyết sản phẩm trong từng vòng cải tiến
  - Đánh giá lợi ích của nền tảng đối với nhóm ứng dụng và tổ chức
- level1: Kiến trúc
  level2:
  - Phân lớp giao diện, API, điều phối công việc và hệ thống cung cấp tài nguyên
  - Phân biệt mặt phẳng điều khiển nền tảng với nơi ứng dụng thực thi
  - Vai trò của catalog, danh tính, chính sách và dữ liệu trạng thái
  - Luồng từ yêu cầu người dùng đến tài nguyên được tạo và xác minh
  - Chọn xử lý đồng bộ, công việc bất đồng bộ hoặc vòng lặp đối soát
  - Phân chia chức năng giữa IDP và các hệ thống CI/CD, IaC, GitOps
  - Thiết kế ranh giới tích hợp với dịch vụ nội bộ và nhà cung cấp bên ngoài
  - Xác định dữ liệu có thẩm quyền và các bản chiếu phục vụ giao diện
  - Đánh giá điểm lỗi tập trung và phạm vi ảnh hưởng của nền tảng
  - Tránh phụ thuộc vào portal duy nhất để thực hiện mọi thao tác
- level1: Mô hình tài nguyên
  level2:
  - Định nghĩa dịch vụ, thành phần, hệ thống, tài nguyên và môi trường
  - Thiết kế định danh ổn định và quan hệ giữa các đối tượng nền tảng
  - Biểu diễn chủ sở hữu, vòng đời, mức quan trọng và thông tin hỗ trợ
  - Tách ý định người dùng khỏi chi tiết triển khai của nhà cung cấp
  - Thiết kế hợp đồng yêu cầu đầu vào, kết quả đầu ra và trạng thái lỗi
  - Xác định thuộc tính nào người dùng được chọn và thuộc tính do nền tảng quản lý
  - Phân biệt trạng thái mong muốn, trạng thái quan sát được và trạng thái hiệu lực
  - Quản lý tài nguyên dùng chung và ranh giới quyền sở hữu
  - Phiên bản hóa schema và bảo toàn tương thích khi mô hình phát triển
- level1: Giao diện tự phục vụ
  level2:
  - Lựa chọn portal, CLI, API và luồng qua Git theo hành trình người dùng
  - Thiết kế trải nghiệm nhất quán giữa các kênh sử dụng
  - Xây dựng biểu mẫu theo khả năng cần yêu cầu thay vì chi tiết hạ tầng
  - Kiểm tra dữ liệu và phản hồi lỗi tại đúng bước người dùng cần xử lý
  - Hiển thị quyền, chi phí dự kiến và phạm vi tác động trước thao tác
  - Phân biệt yêu cầu đã tiếp nhận, đang xử lý và tài nguyên đã sẵn sàng
  - Cung cấp trạng thái tiến độ, lịch sử và cách tiếp tục khi thao tác bị gián đoạn
  - Thiết kế đường dẫn đến tài liệu, log và hỗ trợ có ngữ cảnh
  - Giữ giao diện dễ truy cập và dùng được cho nhiều nhóm kỹ năng
  - Cung cấp API ổn định cho tự động hóa mà không phụ thuộc thao tác giao diện
- level1: Danh mục dịch vụ
  level2:
  - Vai trò của software catalog trong tìm kiếm và hiểu hệ thống
  - Đăng ký dịch vụ mới và tiếp nhận dịch vụ có sẵn
  - Lưu thông tin chủ sở hữu, kho mã, tài liệu và môi trường triển khai
  - Mô hình hóa phụ thuộc giữa ứng dụng, API và tài nguyên hạ tầng
  - Tìm kiếm, phân loại và lọc dịch vụ theo ngữ cảnh sử dụng
  - Đồng bộ dữ liệu từ Git, hệ thống danh tính và nền tảng triển khai
  - Xử lý dữ liệu trùng, chủ sở hữu thiếu và thông tin đã lỗi thời
  - Phân biệt catalog với CMDB và nguồn trạng thái vận hành trực tiếp
  - Liên kết sức khỏe, cảnh báo và mức tuân thủ mà không tạo nguồn sự thật cạnh tranh
  - Quản lý vòng đời đăng ký, đổi chủ sở hữu, lưu trữ và xóa mục catalog
- level1: Lộ trình chuẩn
  level2:
  - Lộ trình chuẩn (golden path) là gì và gồm những thành phần nào
  - Phân biệt golden path với template tạo mã ban đầu
  - Thiết kế luồng tạo, kiểm thử, triển khai và quan sát dịch vụ hoàn chỉnh
  - Cung cấp mặc định an toàn và tài liệu thực hành có thể kiểm chứng
  - Xác định mức tùy biến mà vẫn giữ cam kết hỗ trợ của nền tảng
  - Thiết kế cách rời lộ trình chuẩn khi nhu cầu ứng dụng vượt phạm vi
  - Quản lý phiên bản và thời hạn hỗ trợ của từng golden path
  - Đánh giá lộ trình chuẩn bằng kết quả người dùng đạt được
  - Tránh buộc mọi ứng dụng dùng chung một kiến trúc hoặc công nghệ
- level1: Khuôn mẫu dự án
  level2:
  - Thiết kế template tạo kho mã, cấu trúc ứng dụng và cấu hình ban đầu
  - Định nghĩa tham số, schema và quy tắc đặt tên cho dự án mới
  - Sinh pipeline, tài liệu, thông tin catalog và cấu hình quan sát mặc định
  - Tham chiếu thành phần dùng chung thay vì sao chép mọi nội dung vào dự án
  - Kiểm tra nội dung sinh ra bằng build, test và kiểm tra chính sách
  - Xác định trách nhiệm cập nhật sau khi dự án đã được tạo từ template
  - Phân biệt nâng phiên bản template với nâng các dự án đã sinh trước đó
  - Quản lý nguồn tin cậy và quyền thực thi của template
  - Thiết kế hủy thao tác hoặc dọn tài nguyên khi tạo dự án chưa hoàn tất
- level1: Quy trình yêu cầu
  level2:
  - Mô tả một hành động tự phục vụ bằng điều kiện, đầu vào và kết quả
  - Phân biệt thao tác được phép tự động với thao tác cần phê duyệt
  - Kiểm tra quyền và chính sách trước khi tạo công việc
  - Tính lũy đẳng và chống tạo tài nguyên trùng khi người dùng gửi lại yêu cầu
  - Thiết kế trạng thái chờ duyệt, đang chạy, thành công, thất bại và bị hủy
  - Lưu mã công việc và cho phép người dùng kiểm tra kết quả
  - Quản lý thời hạn yêu cầu và thay đổi điều kiện trong lúc chờ
  - Xác định khi nào có thể hủy và khi nào cần thao tác bù
  - Truy vết người yêu cầu, người phê duyệt và hệ thống thực thi
  - Giữ phê duyệt và thông tin nhạy cảm nhất quán giữa portal, CLI và API
- level1: Thực thi bất đồng bộ
  level2:
  - Tách tiếp nhận yêu cầu khỏi worker thực thi có quyền hạn chế
  - Lựa chọn hàng đợi, workflow engine hoặc bộ điều khiển đối soát theo bài toán
  - Quản lý bước phụ thuộc và trạng thái công việc bền vững
  - Phân biệt lỗi tạm thời với lỗi dữ liệu hoặc chính sách cần người dùng sửa
  - Thiết lập thử lại, thời gian chờ và giãn khoảng cách có giới hạn
  - Xử lý sự kiện lặp, đến sai thứ tự và kết quả bị gửi lại
  - Ngăn hai công việc cùng thay đổi một tài nguyên theo cách xung đột
  - Xử lý thành công một phần và thao tác bù giữa nhiều hệ thống
  - Khôi phục công việc sau khi worker hoặc dịch vụ điều phối khởi động lại
  - Giới hạn đồng thời, hạn mức và phạm vi ảnh hưởng của tự động hóa
  - Đối chiếu kết quả công việc với trạng thái thực của tài nguyên đã tạo
- level1: Cấp phát hạ tầng
  level2:
  - Cung cấp khả năng yêu cầu compute, mạng và lưu trữ theo hợp đồng nền tảng
  - Ánh xạ yêu cầu sản phẩm với module IaC hoặc dịch vụ cung cấp tài nguyên
  - Quản lý tham số được phép tùy biến và cấu hình hạ tầng do nền tảng kiểm soát
  - Xem trước thay đổi, chi phí và thao tác phá hủy trước khi áp dụng
  - Liên kết kết quả cấp phát với danh tính dịch vụ và catalog
  - Quản lý trạng thái công cụ IaC, khóa thao tác và quyền truy cập
  - Phát hiện tài nguyên tạo bên ngoài hoặc sai lệch so với khai báo
  - Cập nhật, thay thế và thu hồi tài nguyên theo vòng đời
  - Giữ khả năng tích hợp nhiều nhà cung cấp mà không che mất giới hạn thực tế
- level1: Môi trường
  level2:
  - Mô hình hóa môi trường phát triển, kiểm thử, tiền sản xuất và sản xuất
  - Cấp môi trường theo yêu cầu với mức cô lập và quota phù hợp
  - Tạo môi trường xem trước cho đề xuất thay đổi khi có nhu cầu
  - Quản lý thời hạn sử dụng và tự động dọn môi trường tạm
  - Tách dữ liệu, cấu hình và bí mật giữa các môi trường
  - Liên kết môi trường với phiên bản ứng dụng và tài nguyên phụ thuộc
  - Giữ khả năng tái tạo môi trường từ đầu vào có phiên bản
  - Kiểm soát truy cập và dữ liệu nhạy cảm trong môi trường thử nghiệm
  - Xử lý môi trường không được sử dụng, bị bỏ quên hoặc thiếu chủ sở hữu
  - Thu hồi môi trường mà không xóa nhầm tài nguyên hoặc dữ liệu dùng chung
- level1: Môi trường lập trình
  level2:
  - Chuẩn hóa công cụ phát triển và phụ thuộc theo loại dự án
  - Cung cấp lựa chọn phát triển cục bộ hoặc workspace từ xa
  - Tái tạo môi trường lập trình từ cấu hình có phiên bản
  - Kết nối môi trường phát triển với dịch vụ phụ trợ cần thiết
  - Cấp quyền truy cập tạm mà không phát tán bí mật dùng chung
  - Cô lập dữ liệu, mạng và mã chưa tin cậy trong môi trường phát triển
  - Quản lý thời hạn, tài nguyên và chi phí của workspace
  - Giữ trải nghiệm phát triển tương thích với quy trình build và kiểm thử
- level1: Nền tảng thực thi
  level2:
  - Cung cấp hợp đồng chạy dịch vụ, tác vụ nền và công việc theo lịch
  - Ánh xạ nhu cầu ứng dụng với container, máy ảo hoặc dịch vụ được quản lý
  - Đóng gói mặc định về tài nguyên, mạng, sức khỏe và kết thúc êm
  - Cho phép nhóm ứng dụng điều chỉnh trong phạm vi được hỗ trợ
  - Thiết lập khám phá dịch vụ, tên miền và điểm truy cập
  - Cung cấp lựa chọn mở rộng và giới hạn năng lực theo môi trường
  - Tách cấu hình ứng dụng khỏi cấu hình vận hành cụm dùng chung
  - Theo dõi phiên bản và sức khỏe của ứng dụng qua nhiều môi trường
  - Phân định vận hành nền tảng thực thi với trách nhiệm của nhóm phát triển
- level1: Dịch vụ phụ trợ
  level2:
  - Cung cấp cơ sở dữ liệu, cache, hàng đợi và lưu trữ đối tượng theo nhu cầu
  - Định nghĩa gói dịch vụ với năng lực, mức hỗ trợ và giới hạn rõ ràng
  - Cấp danh tính, kết nối và quyền sử dụng tài nguyên cho ứng dụng
  - Quản lý vòng đời từ tạo mới đến thay đổi dung lượng và ngừng sử dụng
  - Phân biệt tài nguyên dành riêng với dịch vụ dùng chung giữa nhiều ứng dụng
  - Quy định sao lưu, giữ dữ liệu và phục hồi theo trách nhiệm vận hành
  - Xử lý thay đổi phiên bản và khả năng tương thích với ứng dụng
  - Quản lý migration và chuyển giao dữ liệu có phê duyệt
  - Kiểm tra phụ thuộc trước khi xóa để tránh làm gián đoạn dịch vụ khác
- level1: Phân phối phần mềm
  level2:
  - Cung cấp quy trình build, test và phát hành artifact có thể tái sử dụng
  - Tích hợp hệ thống CI/CD hiện có thay vì tạo nguồn thực thi cạnh tranh
  - Quản lý registry, quyền xuất bản và quyền tải artifact
  - Liên kết commit, kết quả kiểm tra, artifact và cấu hình triển khai
  - Cung cấp luồng thăng cấp cùng artifact qua các môi trường
  - Tích hợp GitOps hoặc API triển khai theo mô hình vận hành đã chọn
  - Hiển thị riêng trạng thái pipeline, đồng bộ và sức khỏe ứng dụng
  - Đặt cổng phê duyệt, kiểm tra chính sách và điều kiện phát hành
  - Cung cấp hành động quay lại phiên bản với thông tin rủi ro và giới hạn
  - Tách quyền thay đổi môi trường sản xuất khỏi quyền chỉnh giao diện nền tảng
- level1: Quan sát ứng dụng
  level2:
  - Cung cấp cấu hình log, chỉ số và dấu vết phân tán theo mặc định
  - Liên kết tín hiệu quan sát với dịch vụ, chủ sở hữu và môi trường
  - Cung cấp dashboard phù hợp với nhu cầu nhóm phát triển
  - Phân biệt sức khỏe tài nguyên với hành vi dịch vụ đối với người dùng
  - Liên kết cảnh báo và hướng dẫn xử lý sự cố theo ngữ cảnh
  - Truy cập log và dữ liệu chẩn đoán theo quyền và phạm vi tài nguyên
  - Quản lý dữ liệu nhạy cảm, thời hạn lưu giữ và chi phí quan sát
  - Nhận diện dữ liệu trễ hoặc thiếu thay vì hiển thị trạng thái khỏe không có căn cứ
  - Phân định nền tảng quan sát dùng chung với trách nhiệm theo dõi nghiệp vụ
- level1: Vận hành tự phục vụ
  level2:
  - Thiết kế hành động vận hành sau triển khai (day-2) theo nhu cầu người dùng
  - Cung cấp thao tác đổi cấu hình, mở rộng và khởi động lại có giới hạn
  - Cho phép xem log, chạy chẩn đoán và kiểm tra phụ thuộc theo quyền
  - Kiểm soát truy cập tương tác vào tiến trình hoặc môi trường sản xuất
  - Xác nhận phạm vi ảnh hưởng trước thao tác gây gián đoạn
  - Áp dụng thời hạn truy cập tạm và ghi nhận bằng chứng thao tác
  - Phối hợp thao tác khẩn cấp với nguồn khai báo để tránh bị ghi đè
  - Chuyển chủ sở hữu và bàn giao quyền vận hành dịch vụ
  - Ngừng dịch vụ, thu hồi quyền và dọn tài nguyên theo quy trình
  - Ngăn thao tác tự phục vụ trở thành đường bỏ qua chính sách bắt buộc
- level1: Danh tính và quyền
  level2:
  - Tích hợp danh tính tổ chức và đăng nhập thống nhất
  - Ánh xạ người dùng, nhóm và vai trò với tài nguyên nền tảng
  - Phân biệt xác thực, phân quyền và kiểm tra chính sách hành động
  - Kiểm tra quyền tại API và worker thay vì chỉ ẩn nút trên giao diện
  - Phân biệt quyền của người yêu cầu với danh tính hệ thống thực thi
  - Thiết kế ủy quyền để tránh nền tảng dùng quyền cao thay người không được phép
  - Cấp quyền tối thiểu cho từng adapter và loại công việc
  - Đồng bộ thay đổi thành viên và thu hồi quyền khi rời tổ chức
  - Quản lý danh tính workload và thông tin xác thực ngắn hạn khi phù hợp
  - Kiểm toán quyết định cấp quyền và thao tác đặc quyền
- level1: Bí mật và chứng chỉ
  level2:
  - Tách giá trị bí mật khỏi metadata hiển thị trong catalog
  - Tích hợp kho bí mật và cung cấp tham chiếu an toàn cho ứng dụng
  - Giới hạn chủ thể được đọc, cấp và xoay vòng thông tin xác thực
  - Tránh lưu bí mật trong template, Git, artifact và lịch sử công việc
  - Che dữ liệu trong log, đầu ra bước thực thi và thông báo lỗi
  - Quản lý chứng chỉ, khóa và danh tính kết nối theo vòng đời
  - Xoay vòng bí mật và xác minh ứng dụng đã nhận giá trị mới
  - Thu hồi thông tin xác thực khi dịch vụ hoặc môi trường bị xóa
  - Xử lý sự cố lộ bí mật và phục hồi khả năng truy cập có kiểm soát
- level1: Chính sách đa nhóm
  level2:
  - Xác định đơn vị thuê dùng nền tảng theo đội ngũ, sản phẩm hoặc tổ chức
  - Tách tài nguyên, dữ liệu và quyền giữa các nhóm
  - Thiết lập quota, giới hạn chi phí và danh mục dịch vụ được phép sử dụng
  - Áp dụng chính sách tại lúc yêu cầu, lúc thực thi và trong quá trình vận hành
  - Phân biệt mặc định an toàn với quy tắc bắt buộc không được ghi đè
  - Quản lý ngoại lệ bằng lý do, người phê duyệt và thời hạn
  - Ngăn một nhóm gây cạn tài nguyên hoặc làm gián đoạn nhóm khác
  - Chuẩn hóa chủ sở hữu, nhãn và metadata phục vụ quản trị
  - Đối chiếu bằng chứng tuân thủ với trạng thái thực tế
  - Đánh giá khi nào cần tách không gian quản lý hoặc tách hệ thống nền tảng
- level1: An toàn chuỗi cung ứng
  level2:
  - Thiết lập nguồn tin cậy cho template, plugin và thành phần tích hợp
  - Kiểm tra mã, phụ thuộc và artifact trong quy trình mặc định
  - Liên kết thông tin xuất xứ và danh mục thành phần với artifact phát hành
  - Xác minh nội dung và quyền thực thi trước khi đưa thành phần vào nền tảng
  - Cô lập tác vụ build và tác vụ có quyền tạo tài nguyên
  - Giới hạn khả năng thực thi mã tùy ý từ biểu mẫu và tham số người dùng
  - Quản lý cập nhật, bản vá và ngừng dùng thành phần có rủi ro
  - Xử lý artifact hoặc template bị xác định không còn đáng tin cậy
  - Phân định kiểm tra tự động với quyết định chấp nhận rủi ro có trách nhiệm
- level1: Tích hợp hệ thống
  level2:
  - Thiết kế adapter giữa hợp đồng nền tảng và API hệ thống bên dưới
  - Xác định nguồn có thẩm quyền cho danh tính, catalog và trạng thái triển khai
  - Chọn gọi API, webhook, sự kiện hoặc đối soát định kỳ theo bài toán
  - Phiên bản hóa hợp đồng tích hợp và kiểm tra khả năng tương thích
  - Xử lý phân trang, giới hạn tốc độ và lỗi tạm thời của nhà cung cấp
  - Chống xử lý trùng và xác minh tính xác thực của sự kiện nhận vào
  - Đồng bộ thông tin khi webhook bị mất, trễ hoặc đến sai thứ tự
  - Giới hạn quyền, bí mật và kết nối mạng của mỗi tích hợp
  - Kiểm tra khả năng gỡ hoặc thay thế nhà cung cấp mà không mất dữ liệu
  - Quản lý plugin theo vòng đời và trách nhiệm hỗ trợ rõ ràng
- level1: Phiên bản và tiến hóa
  level2:
  - Quản lý phiên bản API, schema, template và gói khả năng nền tảng
  - Thiết kế thay đổi tương thích với người dùng và công việc đang chạy
  - Phân biệt cập nhật nền tảng với cập nhật ứng dụng sử dụng nền tảng
  - Thông báo thời hạn ngừng hỗ trợ và cung cấp đường nâng cấp
  - Di chuyển metadata và trạng thái công việc có kiểm chứng
  - Cập nhật hàng loạt cấu hình dùng chung mà vẫn giới hạn phạm vi ảnh hưởng
  - Thử phiên bản mới với một nhóm người dùng trước khi mở rộng
  - Quay lại phiên bản nền tảng mà không làm mất trạng thái tài nguyên
  - Quản lý lối tùy biến để tránh mỗi nhóm trở thành một nhánh sản phẩm riêng
- level1: Độ tin cậy nền tảng
  level2:
  - Xác định các hành trình quan trọng cần đo độ sẵn sàng và thời gian đáp ứng
  - Tách khả năng tạo thay đổi mới khỏi khả năng ứng dụng đang chạy tiếp tục phục vụ
  - Thiết lập SLI, SLO và điều kiện cảnh báo cho API và công việc nền tảng
  - Thiết kế dự phòng cho dữ liệu trạng thái, hàng đợi và dịch vụ điều khiển
  - Giới hạn lỗi lan truyền khi một tích hợp hoặc nhà cung cấp ngừng hoạt động
  - Hiển thị trạng thái suy giảm thay vì khẳng định kết quả chưa được xác minh
  - Phục hồi công việc sau sự cố mà không tạo trùng hoặc mất dấu tài nguyên
  - Sao lưu và phục hồi cấu hình, metadata, quyền và trạng thái thực thi
  - Chuẩn bị quy trình vận hành khi portal không truy cập được
  - Diễn tập khôi phục và đối chiếu tài nguyên thực tế sau sự cố
- level1: Kiểm thử nền tảng
  level2:
  - Kiểm thử hợp đồng API, schema và quy tắc kiểm tra dữ liệu
  - Kiểm thử template bằng dự án sinh thực tế và kết quả build
  - Kiểm thử tích hợp adapter với môi trường nhà cung cấp có giới hạn
  - Kiểm thử toàn hành trình từ yêu cầu đến tài nguyên sẵn sàng
  - Kiểm thử phân quyền giữa người dùng, đội ngũ và môi trường
  - Kiểm thử gửi lặp, chạy đồng thời và khôi phục công việc bị gián đoạn
  - Kiểm thử lỗi một phần và thao tác bù khi nhiều hệ thống cùng tham gia
  - Đánh giá tải, giới hạn đồng thời và tác động của công việc chậm
  - Kiểm thử khả dụng giao diện và khả năng hoàn thành tác vụ của người dùng
  - Xây dựng dữ liệu kiểm thử và bước dọn tài nguyên an toàn
- level1: Chi phí và năng lực
  level2:
  - Liên kết chi phí hạ tầng với dịch vụ, môi trường và chủ sở hữu
  - Phân biệt chi phí nền tảng dùng chung với chi phí tài nguyên ứng dụng
  - Hiển thị ước lượng và giới hạn trước khi người dùng yêu cầu tài nguyên
  - Thiết lập ngân sách, cảnh báo và quota theo nhóm
  - Phát hiện môi trường tạm quá hạn và tài nguyên không còn sử dụng
  - Cung cấp dữ liệu phân bổ chi phí và giải thích phương pháp tính
  - Đánh giá lựa chọn công suất, thời hạn sử dụng và gói dịch vụ
  - Quản lý năng lực của hệ thống thực thi công việc nền tảng
  - Đo chi phí phục vụ một hành trình và công sức vận hành phát sinh
- level1: Đo hiệu quả
  level2:
  - Đo tỷ lệ sử dụng, người dùng quay lại và mức hoàn thành hành trình
  - Theo dõi thời gian từ yêu cầu đến khả năng sử dụng thực tế
  - Đo thời gian tiếp nhận thành viên mới và tạo dịch vụ đầu tiên
  - Theo dõi số bước thủ công và nhu cầu hỗ trợ còn lại
  - Kết hợp dữ liệu sử dụng với phản hồi định tính của nhóm phát triển
  - Đánh giá tác động đến phân phối phần mềm mà không gán mọi thay đổi cho IDP
  - Phân biệt mức dùng bắt buộc với giá trị người dùng tự nguyện lựa chọn
  - Thiết lập dữ liệu ban đầu và so sánh theo nhóm trường hợp tương đương
  - Bảo vệ quyền riêng tư và tránh biến chỉ số nền tảng thành giám sát cá nhân
  - Điều chỉnh ưu tiên sản phẩm theo kết quả và chi phí duy trì
- level1: Tổ chức vận hành
  level2:
  - Phân định trách nhiệm giữa nhóm nền tảng, nhóm hạ tầng và nhóm ứng dụng
  - Xác định chủ sở hữu sản phẩm, khả năng và tích hợp
  - Công bố cam kết hỗ trợ, giờ phục vụ và đường báo sự cố
  - Tách lỗi nền tảng khỏi lỗi ứng dụng để định tuyến hỗ trợ đúng nơi
  - Quản lý yêu cầu đóng góp từ nhóm dùng nền tảng
  - Phân bổ nguồn lực cho phát triển mới, vận hành và giảm công việc lặp lại
  - Tổ chức review kiến trúc và thay đổi chính sách có đại diện người dùng
  - Duy trì tài liệu, ví dụ và thông tin liên hệ có chủ sở hữu
  - Tránh chuyển toàn bộ công việc vận hành ứng dụng sang nhóm nền tảng
- level1: Triển khai áp dụng
  level2:
  - Chọn hành trình đầu tiên theo nhu cầu có giá trị và dễ kiểm chứng
  - Hợp tác với nhóm dùng thử để xây phiên bản nền tảng tối thiểu
  - Tích hợp công cụ hiện có trước khi cân nhắc thay thế diện rộng
  - Tiếp nhận dịch vụ đang chạy mà không buộc tạo lại toàn bộ
  - Chuẩn bị tài liệu, ví dụ và hỗ trợ tiếp nhận người dùng mới
  - Giới thiệu khả năng qua trường hợp sử dụng thực tế và phản hồi trực tiếp
  - Mở rộng theo nhóm và môi trường với tiêu chí dừng rõ ràng
  - Quản lý thời gian cùng tồn tại giữa quy trình cũ và quy trình nền tảng
  - Đánh giá giả thuyết giá trị trước khi bổ sung khả năng mới
  - Duy trì đường xuất dữ liệu và kế hoạch rời nền tảng khi cần
- level1: Lựa chọn giải pháp
  level2:
  - Xây tiêu chí lựa chọn từ hành trình người dùng và yêu cầu tích hợp
  - So sánh tự xây, dùng sản phẩm có sẵn và kết hợp nhiều thành phần
  - Đánh giá khả năng mở rộng bằng API, plugin và hợp đồng dữ liệu
  - Vai trò của Backstage ở lớp portal, catalog và trải nghiệm phát triển
  - Phân biệt chọn portal với hoàn thiện các khả năng của IDP
  - Đánh giá mô hình triển khai, danh tính, phân quyền và lưu trữ dữ liệu
  - Kiểm tra chi phí tích hợp, nâng cấp, hỗ trợ và phụ thuộc nhà cung cấp
  - Thử nghiệm giải pháp bằng cùng hành trình và tiêu chí nghiệm thu
  - Xác định ranh giới với hướng dẫn triển khai chuyên sâu từng công cụ
- level1: Sai lầm và sự cố
  level2:
  - Nền tảng tập hợp nhiều liên kết nhưng người dùng vẫn phải tự phối hợp mọi bước
  - Template tạo dự án thành công nhưng không có quy trình vận hành tiếp theo
  - Catalog sai chủ sở hữu hoặc hiển thị trạng thái nguồn đã cũ
  - API báo tiếp nhận thành công nhưng tài nguyên không được tạo hoặc chưa sẵn sàng
  - Gửi lại yêu cầu gây tạo trùng do thiếu kiểm soát lũy đẳng
  - Công việc thất bại giữa chừng để lại tài nguyên mồ côi
  - Quyền trên portal không khớp quyền thực tế của hệ thống thực thi
  - Thay đổi trực tiếp bị công cụ quản lý cấu hình hoặc GitOps ghi đè
  - Một tích hợp chậm làm nghẽn toàn bộ hàng đợi công việc
  - Trừu tượng hóa quá nhiều khiến người dùng không hiểu giới hạn và không thể chẩn đoán
  - Nền tảng có nhiều khả năng nhưng ít người hoàn thành hành trình cần thiết
  - Chẩn đoán theo yêu cầu, danh tính, công việc và trạng thái nhà cung cấp
- level1: Thực hành
  level2:
  - Khảo sát một hành trình tạo và đưa dịch vụ mới vào vận hành
  - Thiết kế hợp đồng tự phục vụ với đầu vào, quyền và tiêu chí sẵn sàng
  - Xây mô hình catalog liên kết dịch vụ, chủ sở hữu, kho mã và môi trường
  - Thiết kế golden path gồm template, pipeline, tài liệu và cấu hình quan sát
  - Cấp môi trường và tài nguyên phụ trợ bằng công việc có trạng thái bền vững
  - Kiểm thử gửi lặp, lỗi một phần và dọn tài nguyên tạo chưa hoàn tất
  - Tích hợp triển khai và phân biệt trạng thái công việc với sức khỏe ứng dụng
  - Thực hiện thao tác vận hành có phân quyền và bằng chứng kiểm toán
  - Đo thời gian hoàn thành, nhu cầu hỗ trợ và phản hồi người dùng thử
  - Nâng phiên bản một khả năng mà vẫn giữ tương thích với dịch vụ đang dùng
  - Ngừng dịch vụ rồi xác minh quyền, dữ liệu và tài nguyên đã được xử lý đúng
  - Đánh giá IDP thử nghiệm theo giá trị, an toàn và công sức duy trì
