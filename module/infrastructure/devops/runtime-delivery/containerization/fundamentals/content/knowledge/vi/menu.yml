menu:
  - level1: Nền tảng container hóa và lựa chọn mô hình triển khai
    level2:
      - Bài toán đóng gói ứng dụng và sự khác biệt giữa các môi trường
      - Container là tiến trình được cô lập với môi trường thực thi riêng
      - Phân biệt image, container và registry trong vòng đời ứng dụng
      - So sánh container, máy ảo và tiến trình chạy trực tiếp trên máy chủ
      - Kernel dùng chung và giới hạn cô lập của container so với máy ảo
      - Tính bất biến của image và tính có thể thay thế của container
      - Ứng dụng stateless, stateful và dữ liệu cần tồn tại sau triển khai
      - Lợi ích và chi phí của container hóa trong phát triển và vận hành
      - Trường hợp phù hợp và không phù hợp để sử dụng container
      - Ranh giới kiến thức giữa container cơ bản và hệ thống orchestration
  - level1: Kiến trúc hệ sinh thái container và các chuẩn OCI
    level2:
      - Vai trò của container engine, runtime, registry và công cụ dòng lệnh
      - Luồng yêu cầu từ Docker CLI qua Docker Engine API đến container
      - Vai trò của containerd, shim và runtime cấp thấp như runc hoặc crun
      - Phân biệt công cụ build image với runtime chạy container
      - OCI Image Specification và cấu trúc trao đổi image
      - OCI Runtime Specification và cấu hình tiến trình container
      - OCI Distribution Specification và giao tiếp với registry
      - Quan hệ giữa Docker, Podman và các thành phần trong hệ sinh thái
      - Tiến trình runtime trên máy chủ và tiến trình ứng dụng trong container
      - Đọc sơ đồ tổng thể từ mã nguồn đến image và container đang chạy
  - level1: Chuẩn bị môi trường và thao tác với container engine
    level2:
      - Kiểm tra hệ điều hành, kiến trúc CPU và khả năng chạy container
      - Phân biệt Docker Engine trên Linux và môi trường Docker Desktop
      - Máy ảo Linux bên dưới Docker Desktop trên Windows hoặc macOS
      - Vai trò của WSL 2 trong môi trường Docker Desktop trên Windows
      - Kiểm tra phiên bản client, server và trạng thái engine
      - Docker context và cách xác định daemon đang nhận lệnh
      - Kết nối engine từ xa qua SSH hoặc TLS và bảo vệ API của daemon
      - Quyền truy cập Docker socket và hệ quả của nhóm docker
      - Lựa chọn môi trường rootful hoặc rootless cho thực hành
      - Kiểm tra kết nối registry bằng một image tối giản
      - Tách tài nguyên thực hành bằng quy ước đặt tên và label
      - Chuẩn bị thư mục, cổng và dữ liệu mẫu trước khi làm bài tập
  - level1: Cơ chế cô lập bằng Linux namespaces và cgroups
    level2:
      - Tiến trình Linux, cây tiến trình và mối liên hệ với container
      - PID namespace và sự khác nhau giữa PID trong container với trên host
      - Mount namespace và cách container nhìn thấy cây filesystem riêng
      - Network namespace với interface, địa chỉ và bảng định tuyến riêng
      - UTS namespace và phạm vi hostname của container
      - IPC namespace và cô lập tài nguyên giao tiếp liên tiến trình
      - User namespace và ánh xạ UID hoặc GID giữa container với host
      - Cgroup namespace và cách quan sát cây phân cấp tài nguyên
      - Namespaces cô lập góc nhìn còn cgroups quản lý tài nguyên
      - Khái niệm controller và khác biệt nền tảng giữa cgroups v1 với v2
      - Quan sát namespaces và cgroups của một container từ máy chủ Linux
      - Tài nguyên kernel vẫn dùng chung và giới hạn bảo mật của sự cô lập
      - Những thay đổi khi chia sẻ namespace với host hoặc container khác
  - level1: Cấu trúc image, layers và filesystem của container
    level2:
      - Image gồm cấu hình, manifest và các filesystem layer
      - Phân biệt image manifest với image index cho nhiều nền tảng
      - Tag có thể thay đổi và digest nhận diện nội dung image
      - Quan hệ giữa image ID, manifest digest và layer digest
      - Layer chỉ đọc và writable layer riêng của từng container
      - Cơ chế hợp nhất filesystem và nguyên lý copy-on-write
      - OverlayFS, copy-up và ảnh hưởng của thao tác ghi lần đầu
      - Whiteout và lý do xóa tệp không loại bỏ dữ liệu khỏi layer trước
      - Chia sẻ layer giữa nhiều image và cách đọc dung lượng sử dụng
      - Phân biệt kích thước image truyền qua registry với dung lượng trên đĩa
      - Đọc metadata bằng docker image inspect và lịch sử bằng docker history
      - Quan sát thay đổi filesystem bằng docker diff
      - Phân biệt docker save hoặc load với docker export hoặc import
      - Hạn chế của docker commit trong quy trình build có thể tái tạo
  - level1: Chạy container và quản lý vòng đời tiến trình
    level2:
      - Tạo container từ image bằng docker run và docker create
      - Quan hệ giữa lệnh khởi chạy, tiến trình chính và trạng thái container
      - Chạy foreground, detached và phiên tương tác với stdin hoặc TTY
      - Liệt kê container và đọc các trạng thái created, running, exited
      - Bắt đầu lại container đã dừng và phân biệt với tạo container mới
      - Chạy lệnh bổ sung bằng docker exec và giới hạn khi container đã dừng
      - Phân biệt docker attach với docker exec khi tương tác ứng dụng
      - Đặt tên, label và tra cứu container theo bộ lọc
      - Xử lý PID 1, tiến trình con và hiện tượng zombie
      - Dùng init tối giản khi ứng dụng không thu hồi tiến trình con
      - Gửi tín hiệu, dừng có thời hạn và buộc kết thúc container
      - Exit code và cách phân biệt thoát bình thường với lỗi tiến trình
      - Chính sách restart và những điều kiện không tự khởi động lại
      - Phân biệt pause, unpause, stop và restart
      - Xóa container và lựa chọn tự xóa sau khi kết thúc bằng tùy chọn rm
      - Quy trình chạy một tác vụ ngắn hạn và thu thập kết quả
  - level1: Viết Dockerfile và cấu hình khởi chạy ứng dụng
    level2:
      - Cấu trúc Dockerfile và mối quan hệ với build context
      - Chọn base image phù hợp và sử dụng FROM
      - Thiết lập thư mục làm việc với WORKDIR
      - Sao chép tệp bằng COPY và lựa chọn trường hợp cần ADD
      - Thực thi lệnh build bằng RUN và ảnh hưởng đến layer
      - Phân biệt shell form với exec form trong Dockerfile
      - Vai trò của ENTRYPOINT, CMD và cách ghi đè khi chạy
      - Truyền đối số và chuyển tiếp tín hiệu qua entrypoint script
      - Phân biệt ARG lúc build với ENV mặc định lúc chạy
      - Thiết lập USER, quyền tệp và COPY với tùy chọn chown
      - EXPOSE là metadata và không tự công bố cổng trên host
      - Khai báo VOLUME và tác động đến lưu trữ khi chạy image
      - Khai báo HEALTHCHECK và giới hạn ý nghĩa của trạng thái health
      - Khai báo STOPSIGNAL phù hợp với tiến trình ứng dụng
      - Gắn metadata bằng LABEL và các nhãn OCI thông dụng
      - Khả năng tái sử dụng stage và cách đặt tên stage trong Dockerfile
      - Thực hành đọc một Dockerfile từ base image đến lệnh khởi chạy
  - level1: Build image, tối ưu cache và tổ chức multi-stage build
    level2:
      - Thực hiện build và đặt tag cho image đầu ra
      - Giới hạn build context bằng tệp dockerignore
      - Thứ tự COPY và RUN để tận dụng cache phụ thuộc
      - Xác định nguyên nhân cache hit hoặc cache miss
      - Phân biệt làm mới base image với vô hiệu hóa cache build
      - Vai trò của BuildKit và cách đọc log các bước build
      - Multi-stage build để tách môi trường biên dịch khỏi runtime
      - Sao chép artifact giữa các stage và build một target cụ thể
      - Dùng cache mount cho trình quản lý gói hoặc công cụ biên dịch
      - Truyền build secret và SSH mount mà không nhúng khóa vào image
      - Ghim đầu vào và nhận diện nguyên nhân build không thể tái tạo
      - Tối ưu số lượng tệp, phụ thuộc và kích thước image đầu ra
      - Lựa chọn base image tối giản, distroless hoặc scratch theo nhu cầu
      - Xuất, nhập và chia sẻ cache build trong môi trường làm việc nhóm
      - Đo thời gian build và kiểm chứng tối ưu bằng cùng một bộ đầu vào
  - level1: Chuẩn bị ứng dụng để chạy đúng trong container
    level2:
      - Xác định runtime, thư viện hệ thống và artifact cần đóng gói
      - Đóng gói ứng dụng Java dạng JAR bằng các stage JDK và runtime Java
      - Chạy tiến trình ứng dụng trực tiếp và tránh daemon hóa bên trong container
      - Lắng nghe trên địa chỉ phù hợp để nhận kết nối ngoài container
      - Đưa log ứng dụng ra stdout hoặc stderr
      - Tách dữ liệu lâu dài khỏi thư mục cài đặt ứng dụng
      - Xác định thư mục tạm và đường dẫn ứng dụng cần quyền ghi
      - Đóng gói chứng chỉ CA và xử lý kết nối TLS từ ứng dụng
      - Thiết lập locale, múi giờ và encoding theo yêu cầu ứng dụng
      - Xử lý SIGTERM, hoàn tất yêu cầu đang chạy và đóng kết nối
      - Thiết kế điểm kiểm tra sức khỏe có chi phí và phụ thuộc phù hợp
      - Kiểm chứng cùng một image với nhiều bộ cấu hình môi trường
  - level1: Registry và phân phối image có kiểm soát
    level2:
      - Cấu trúc tên image gồm registry, namespace, repository và tag
      - Phân biệt registry công khai, registry riêng và registry chạy cục bộ
      - Đăng nhập registry và quản lý credential bằng credential store
      - Kéo image bằng tag và xác minh image đã chọn
      - Gắn tag bổ sung và đẩy image lên repository được cấp quyền
      - Kéo hoặc triển khai image bằng digest để cố định nội dung
      - Thiết kế tag phiên bản và nhận diện rủi ro khi dùng latest
      - Phân quyền đọc hoặc ghi repository theo vai trò sử dụng
      - Xác thực TLS, proxy và kết nối registry trong mạng nội bộ
      - Lưu chuyển image bằng archive khi không truy cập được registry
      - Kiểm tra manifest hoặc image index trước khi phân phối nhiều nền tảng
      - Quản lý retention và phân biệt xóa tag với thu gom blob tại registry
  - level1: Mạng container, DNS và công bố dịch vụ
    level2:
      - Luồng gói tin từ ứng dụng qua network namespace đến mạng ngoài
      - Veth pair, Linux bridge và vai trò kết nối container trên cùng host
      - Địa chỉ IP, route và NAT trong mạng bridge cơ bản
      - So sánh default bridge với user-defined bridge
      - Tạo mạng riêng và kết nối hoặc ngắt kết nối container
      - Phân giải tên container và network alias trong mạng hỗ trợ DNS
      - Localhost của container khác localhost của host và container khác
      - Phân biệt cổng ứng dụng, cổng container và cổng công bố trên host
      - Ánh xạ cổng TCP hoặc UDP và lựa chọn địa chỉ bind trên host
      - Truy cập từ container đến dịch vụ chạy trên host theo từng môi trường
      - Dùng mạng host hoặc none và đánh giá phạm vi cô lập
      - Kết nối một container với nhiều mạng để tách luồng giao tiếp
      - Container truy cập Internet qua proxy và cấu hình DNS phù hợp
      - Quan hệ giữa port publishing, firewall của host và phạm vi truy cập
      - Cấu hình IPv6 cơ bản và nhận diện khi môi trường chỉ hỗ trợ IPv4
      - Quan sát kết nối bằng network inspect và công cụ chẩn đoán mạng
  - level1: Lưu trữ dữ liệu với volume, bind mount và tmpfs
    level2:
      - Phân biệt writable layer, named volume, bind mount và tmpfs
      - Vòng đời dữ liệu khi dừng, xóa hoặc thay thế container
      - Tạo, gắn, kiểm tra và xóa named volume
      - Anonymous volume và cách tránh mất dấu dữ liệu cần giữ
      - Bind mount thư mục host và lựa chọn đường dẫn an toàn
      - Mount tệp hoặc thư mục ở chế độ chỉ đọc
      - Dữ liệu image bị che khi mount vào một đường dẫn đã có nội dung
      - Cơ chế khởi tạo volume mới từ nội dung trong image
      - Quyền đọc ghi, UID hoặc GID và lỗi permission denied với mount
      - Vai trò nhãn SELinux khi chia sẻ thư mục host trên hệ thống có bật SELinux
      - Dùng tmpfs cho dữ liệu tạm và cân nhắc việc dùng bộ nhớ hoặc swap
      - Chia sẻ volume giữa nhiều container và giới hạn ghi đồng thời
      - Sao lưu, phục hồi và kiểm chứng tính nhất quán của dữ liệu
      - Dữ liệu cơ sở dữ liệu và yêu cầu dừng hoặc snapshot đúng cách khi backup
      - Thực hành thay container ứng dụng mà vẫn bảo toàn dữ liệu trên volume
  - level1: Cấu hình runtime và quản lý thông tin nhạy cảm
    level2:
      - Tách cấu hình môi trường khỏi image có thể tái sử dụng
      - Truyền cấu hình bằng biến môi trường, env file và tệp cấu hình
      - Phân biệt env file truyền cho container với tệp env dùng để nội suy
      - Thứ tự ưu tiên cấu hình và cách xác định giá trị ứng dụng thực nhận
      - Vì sao ARG, ENV, layer và build log không phù hợp để lưu secret
      - Rủi ro lộ thông tin nhạy cảm qua inspect, log và lịch sử lệnh
      - Cấp secret lúc chạy qua tệp mount với quyền truy cập tối thiểu
      - Đối chiếu cơ chế secret giữa container chạy trực tiếp và Compose
      - Thay hoặc xoay vòng secret và xác định khi nào cần tạo lại container
      - Xác minh cấu hình bắt buộc khi khởi động mà không ghi secret vào log
  - level1: Chạy ứng dụng nhiều container bằng Docker Compose
    level2:
      - Vai trò của Compose và giới hạn điều phối trên một môi trường engine
      - Cấu trúc tệp Compose với services, networks và volumes
      - Khai báo image có sẵn hoặc build từ Dockerfile cho từng service
      - Chạy, dừng, tạo lại và xóa stack với các lệnh Compose
      - Project name và cách tách tài nguyên của nhiều stack
      - Giao tiếp giữa service bằng tên DNS và cổng nội bộ
      - Khai báo volume, bind mount và bảo toàn dữ liệu khi dùng down
      - Nội suy biến và kiểm tra cấu hình đã hợp nhất bằng compose config
      - Kết hợp nhiều tệp cấu hình và sử dụng profiles cho tác vụ tùy chọn
      - Depends_on, healthcheck và sự khác nhau giữa thứ tự chạy với sẵn sàng phục vụ
      - Retry kết nối ứng dụng khi dependency khởi động chậm hoặc bị gián đoạn
      - Cấp configs hoặc secrets và nhận diện giới hạn của Compose cục bộ
      - Thiết lập tài nguyên hoặc restart và kiểm tra cấu hình thực tế trên container
      - Xem log, thực thi lệnh và cập nhật một service trong stack
      - Mở rộng số container của service và xử lý xung đột cổng host
      - Thực hành ghép ứng dụng, cơ sở dữ liệu và mạng riêng bằng Compose
  - level1: Giới hạn tài nguyên và đọc hành vi của cgroups
    level2:
      - Phân biệt mức sử dụng tài nguyên hiện tại với giới hạn được cấu hình
      - CPU quota, CPU period và giới hạn theo số CPU tương đương
      - CPU shares hoặc weight và tác dụng khi có tranh chấp tài nguyên
      - CPU affinity với cpuset và cân nhắc khi gắn ứng dụng vào CPU cụ thể
      - Giới hạn bộ nhớ cứng, giới hạn mềm và vùng nhớ của ứng dụng
      - Tương tác giữa giới hạn memory, swap và cấu hình của host
      - Phân biệt OOM bên trong container với áp lực bộ nhớ toàn host
      - Đọc trạng thái OOMKilled và vì sao exit code 137 chưa đủ kết luận OOM
      - Giới hạn số tiến trình bằng pids limit và phòng ngừa cạn PID
      - Ulimit cho file descriptor hoặc tài nguyên tiến trình và phạm vi áp dụng
      - Kiểm soát I/O khi driver, thiết bị và cgroup controller hỗ trợ
      - Quan sát CPU throttling và memory pressure bằng thống kê runtime hoặc cgroups
      - JVM nhận diện giới hạn container và cách dành bộ nhớ ngoài Java heap
      - Thực nghiệm điều chỉnh giới hạn dưới tải và chừa tài nguyên cho host
  - level1: Bảo mật runtime và giảm quyền của container
    level2:
      - Mô hình đe dọa khi container dùng chung kernel với host
      - Chạy ứng dụng bằng người dùng không phải root trong image
      - User namespace và rootless runtime trong mô hình giảm quyền
      - Giới hạn mạng, lưu trữ và cgroups cần kiểm tra khi chạy rootless
      - Phân biệt root bên trong container với quyền trên host
      - Linux capabilities và cách giữ tập quyền tối thiểu cần thiết
      - No-new-privileges và ngăn tiến trình tăng đặc quyền
      - Seccomp và giới hạn tập syscall được phép
      - AppArmor hoặc SELinux trong kiểm soát truy cập bắt buộc
      - Root filesystem chỉ đọc và các điểm ghi cần cấp riêng
      - Rủi ro của privileged, host namespace và truy cập thiết bị host
      - Rủi ro mount Docker socket hoặc đường dẫn nhạy cảm của host
      - Giảm bề mặt tấn công từ cổng công bố, mạng và volume chia sẻ
      - Kiểm tra cấu hình bảo mật thực tế bằng inspect trước khi triển khai
  - level1: An toàn image và nền tảng chuỗi cung ứng phần mềm
    level2:
      - Lựa chọn nguồn base image và đánh giá mức độ tin cậy của nhà phát hành
      - Ghim digest nhưng vẫn có kế hoạch cập nhật bản vá
      - Giảm công cụ, package và tài khoản không cần thiết trong runtime image
      - Loại bỏ mã nguồn riêng, credential và tệp thừa khỏi build context
      - Quét lỗ hổng trong image và hiểu giới hạn của kết quả quét
      - Phân loại mức độ ảnh hưởng theo gói, phiên bản và khả năng khai thác thực tế
      - SBOM và khả năng truy vết thành phần đã đóng gói
      - Chữ ký image và kiểm chứng nguồn phát hành trước khi chạy
      - Provenance và mối liên hệ giữa mã nguồn, quy trình build với artifact
      - Khắc phục lỗ hổng bằng rebuild image và thay container đang chạy
      - Thực hành phát hiện secret trong layer và xử lý bằng thu hồi hoặc thay khóa
  - level1: Quan sát trạng thái, log và dấu vết vận hành
    level2:
      - Đọc cấu hình và trạng thái container bằng docker inspect
      - Thu thập stdout hoặc stderr bằng docker logs
      - Logging driver và giới hạn khả năng truy xuất log theo driver
      - Giới hạn kích thước, luân chuyển và theo dõi dung lượng log
      - Đo CPU, bộ nhớ, network I/O và block I/O bằng docker stats
      - Theo dõi sự kiện tạo, chạy, dừng và xóa container bằng docker events
      - Quan sát tiến trình bằng docker top và đối chiếu với góc nhìn trong container
      - Đọc kết quả healthcheck và lịch sử kiểm tra sức khỏe
      - Gắn label hoặc metadata để liên kết container với phiên bản triển khai
      - Phân biệt tiến trình còn sống, ứng dụng sẵn sàng và dependency hoạt động
      - Thu thập bộ thông tin chẩn đoán tối thiểu mà không làm lộ cấu hình nhạy cảm
      - Ranh giới giữa quan sát bằng CLI và hệ thống thu thập metrics hoặc log tập trung
  - level1: Chẩn đoán các lỗi container thường gặp
    level2:
      - Quy trình khoanh vùng lỗi từ build đến pull, create và run
      - Build lỗi do context, đường dẫn COPY hoặc tệp bị dockerignore loại bỏ
      - Image không kéo được do sai tên, thiếu quyền hoặc lỗi xác thực registry
      - Manifest không có nền tảng phù hợp và lỗi exec format error
      - Container thoát ngay do lệnh khởi chạy, đối số hoặc thiếu dependency
      - Lỗi entrypoint do shebang, quyền thực thi hoặc ký tự xuống dòng CRLF
      - Lệnh không tồn tại khi dùng base image tối giản hoặc distroless
      - Ứng dụng chạy nhưng không truy cập được do bind address hoặc publish port
      - Lỗi DNS, sai mạng và dùng localhost khi kết nối service khác
      - Xung đột cổng host và lỗi cấp phát địa chỉ mạng
      - Lỗi quyền volume do UID, GID hoặc chính sách truy cập của host
      - Dữ liệu biến mất do ghi vào writable layer hoặc gắn nhầm volume
      - Restart loop, OOM và tiến trình bị kill khi thiếu tài nguyên
      - Build hoặc ứng dụng chậm do cache, I/O bind mount hoặc CPU throttling
      - Sự cố đầy đĩa từ image, build cache, writable layer hoặc log
      - Debug image không có shell bằng công cụ từ host hoặc container hỗ trợ
      - Ghi lại giả thuyết, bằng chứng và cách tái hiện trước khi thay cấu hình
  - level1: Vòng đời triển khai và cập nhật ứng dụng an toàn
    level2:
      - Từ image đã kiểm chứng đến cấu hình triển khai có thể lặp lại
      - Tạo lại container khi đổi image hoặc cấu hình thay vì sửa trực tiếp
      - Cố định phiên bản image và lưu bằng chứng phiên bản đang chạy
      - Kiểm tra cấu hình, cổng, volume và giới hạn trước khi khởi chạy
      - Tách startup, readiness và liveness ở mức khái niệm vận hành
      - Healthcheck độc lập không mặc nhiên thay container hoặc khởi động lại ứng dụng
      - Thời gian chờ dependency và khả năng tự phục hồi kết nối
      - Graceful shutdown, stop timeout và xử lý yêu cầu đang dở
      - Bảo toàn dữ liệu và xử lý migration tương thích khi nâng phiên bản
      - Thay thế phiên bản trên một host và nhận diện khoảng gián đoạn dịch vụ
      - Khái niệm blue-green hoặc rolling và vai trò của proxy hoặc orchestrator
      - Rollback image, cấu hình và giới hạn rollback khi dữ liệu đã thay đổi
      - Kiểm chứng sau triển khai bằng log, sức khỏe ứng dụng và thao tác nghiệp vụ mẫu
  - level1: Đưa image vào quy trình tích hợp và phân phối liên tục
    level2:
      - Chuỗi công việc từ checkout, kiểm thử, build đến push image
      - Dùng cùng một image artifact qua các môi trường kiểm thử và triển khai
      - Gắn phiên bản phát hành, mã commit và metadata truy vết cho image
      - Cấp credential registry cho pipeline với quyền và thời hạn phù hợp
      - Tách build secret khỏi biến môi trường thông thường của job
      - Chia sẻ cache giữa các job và tránh phụ thuộc cache để bảo đảm tính đúng
      - Chạy smoke test trên image vừa build trước khi phát hành
      - Kiểm tra lỗ hổng, SBOM hoặc chữ ký tại các điểm kiểm soát thích hợp
      - Nhận diện rủi ro khi job build được truy cập Docker socket của host
      - Bàn giao digest, cấu hình cần thiết và tiêu chí kiểm chứng cho bước triển khai
  - level1: Tính tương thích giữa kiến trúc CPU và hệ điều hành
    level2:
      - Image phụ thuộc hệ điều hành và kiến trúc CPU mục tiêu
      - So sánh nền tảng linux amd64 với linux arm64 khi chọn image
      - Buildx, builder và lựa chọn platform khi build
      - Native build, cross-compilation và emulation bằng QEMU
      - Build và phát hành image index cho nhiều nền tảng
      - Thư viện native và sự khác nhau giữa glibc với musl
      - Windows containers và yêu cầu tương thích với kernel hoặc chế độ cô lập
      - Khác biệt đường dẫn, phân biệt hoa thường và quyền tệp giữa các host
      - Hiệu năng bind mount và cơ chế thông báo thay đổi tệp qua máy ảo Desktop
      - Kiểm thử cùng artifact trên các nền tảng được tuyên bố hỗ trợ
  - level1: Bảo trì tài nguyên và giữ môi trường thực hành ổn định
    level2:
      - Kiểm kê container, image, volume, network và build cache đang tồn tại
      - Đọc báo cáo dung lượng bằng docker system df
      - Phân biệt image dangling với image không còn container tham chiếu
      - Dọn container đã dừng và image cũ sau khi xác minh nhu cầu khôi phục
      - Dọn cache build và cân nhắc chi phí build lại
      - Dọn network không còn sử dụng mà không làm gián đoạn stack khác
      - Kiểm tra backup và quyền sở hữu dữ liệu trước khi xóa volume
      - Hiểu phạm vi từng lệnh prune trước khi áp dụng bộ lọc
      - Lập kế hoạch cập nhật engine, base image và khởi động lại dịch vụ
      - Thiết lập quy trình kết thúc bài thực hành và xác nhận tài nguyên đã thu hồi
  - level1: Bài thực hành tổng hợp và đánh giá năng lực nền tảng
    level2:
      - Lab so sánh tiến trình, namespace và dữ liệu giữa hai container cùng image
      - Lab quan sát writable layer khi tạo lại container từ cùng digest
      - Lab viết Dockerfile multi-stage cho ứng dụng Java và chạy bằng user không root
      - Lab đo cache hit hoặc miss và giảm kích thước runtime image
      - Lab chạy registry cục bộ, push image và pull lại bằng digest
      - Lab kết nối ứng dụng với cơ sở dữ liệu qua user-defined network
      - Lab lưu dữ liệu bằng named volume và phục hồi sang container thay thế
      - Lab dựng stack Compose với healthcheck và retry dependency
      - Lab gây tải để quan sát CPU throttling, giới hạn bộ nhớ và trạng thái OOM
      - Lab giảm quyền runtime và kiểm chứng đường dẫn chỉ đọc hoặc được phép ghi
      - Lab chẩn đoán lỗi cổng, DNS, permission và entrypoint từ bằng chứng vận hành
      - Lab nâng phiên bản, kiểm tra graceful shutdown và rollback image
      - Bài đánh giá lựa chọn image, mạng, lưu trữ và giới hạn tài nguyên cho một ứng dụng
      - Bài đánh giá giải thích ranh giới cô lập và rủi ro của cấu hình container đã cho
