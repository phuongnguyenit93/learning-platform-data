references:
  - title: "Docker Docs — What Is a Container?"
    url: "https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-a-container/"
    description: "Giải thích container như tiến trình cô lập, so sánh với máy ảo và ví dụ thao tác vòng đời bằng Docker CLI."
  - title: "Docker Docs — What Is an Image?"
    url: "https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-an-image/"
    description: "Giới thiệu image bất biến, layers và cách đóng gói ứng dụng cùng phụ thuộc."
  - title: "Open Container Initiative — Overview"
    url: "https://opencontainers.org/about/overview/"
    description: "Định nghĩa tiêu chuẩn mở OCI cho image, runtime và phân phối nội dung container."
  - title: "Docker Docs — Building Best Practices"
    url: "https://docs.docker.com/build/building/best-practices/"
    description: "Hướng dẫn Dockerfile, base image, multi-stage build, cache, .dockerignore và tái lập image an toàn."
  - title: "Docker Docs — What Is a Registry?"
    url: "https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-a-registry/"
    description: "Giải thích registry, repository, image tag và thao tác chia sẻ image giữa môi trường."
  - title: "Docker Docs — Networking Overview"
    url: "https://docs.docker.com/engine/network/"
    description: "Tài liệu mạng bridge, custom networks, liên lạc giữa container và publish port."
  - title: "Docker Docs — Volumes"
    url: "https://docs.docker.com/engine/storage/volumes/"
    description: "Mô tả volume, bind mount, vòng đời dữ liệu và cách gắn storage vào container."
  - title: "Docker Docs — Docker Engine Security"
    url: "https://docs.docker.com/engine/security/"
    description: "Giải thích namespaces, cgroups, quyền daemon và các giới hạn bảo mật của container."
  - title: "Kubernetes — Containers"
    url: "https://kubernetes.io/docs/concepts/containers/"
    description: "Tổng quan image, runtime dependencies và tính di động của container khi chạy trên nền tảng orchestration."
