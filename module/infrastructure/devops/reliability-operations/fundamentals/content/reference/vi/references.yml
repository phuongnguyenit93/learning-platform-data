references:
  - title: "Google SRE - Service Level Objectives"
    url: "https://sre.google/sre-book/service-level-objectives/"
    description: "Định nghĩa SLI, SLO, SLA và error budget gắn với trải nghiệm người dùng."
  - title: "Google SRE - Monitoring Distributed Systems"
    url: "https://sre.google/sre-book/monitoring-distributed-systems/"
    description: "Golden signals, black-box/white-box monitoring và cảnh báo theo triệu chứng."
  - title: "Google SRE Workbook - Alerting on SLOs"
    url: "https://sre.google/workbook/alerting-on-slos/"
    description: "Thiết kế cảnh báo dựa trên SLO và mức tiêu hao error budget."
  - title: "Google SRE - Being On-Call"
    url: "https://sre.google/sre-book/being-on-call/"
    description: "Trách nhiệm người trực, escalation và vận hành on-call bền vững."
  - title: "Google SRE Workbook - Incident Response"
    url: "https://sre.google/workbook/incident-response/"
    description: "Phân vai, phối hợp, truyền thông và ghi chép quá trình xử lý incident."
  - title: "Google SRE - Effective Troubleshooting"
    url: "https://sre.google/sre-book/effective-troubleshooting/"
    description: "Triage, kiểm tra giả thuyết, dùng telemetry và tránh suy luận sai."
  - title: "Google SRE - Postmortem Culture"
    url: "https://sre.google/sre-book/postmortem-culture/"
    description: "Postmortem không đổ lỗi, impact, timeline và hành động ngăn tái diễn."
  - title: "Google SRE - Handling Overload"
    url: "https://sre.google/sre-book/handling-overload/"
    description: "Giảm cấp dịch vụ, bảo vệ backend và xử lý retry khi quá tải."
  - title: "Google SRE Workbook - Eliminating Toil"
    url: "https://sre.google/workbook/eliminating-toil/"
    description: "Đo, phân loại và giảm thao tác lặp lại trong vận hành."
  - title: "AWS - Reliability Design Principles"
    url: "https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/design-principles.html"
    description: "Tự động phục hồi, thử nghiệm quy trình recovery và quản lý thay đổi."
  - title: "Kubernetes - Liveness, Readiness and Startup Probes"
    url: "https://kubernetes.io/docs/concepts/workloads/pods/probes/"
    description: "Phân biệt các health probe và tránh restart không cần thiết khi quá tải."
  - title: "Prometheus - Alerting Best Practices"
    url: "https://prometheus.io/docs/practices/alerting/"
    description: "Cảnh báo theo triệu chứng người dùng, ít nhiễu và có liên kết xử lý."