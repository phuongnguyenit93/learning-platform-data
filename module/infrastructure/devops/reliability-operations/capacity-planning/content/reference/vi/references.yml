references:
  - title: "Google SRE - Introduction: Demand Forecasting and Capacity Planning"
    url: "https://sre.google/sre-book/introduction/"
    description: "Định nghĩa capacity planning, dự báo tăng trưởng tự nhiên/chiến dịch, kiểm thử tải và provisioning."
  - title: "Google SRE Workbook - Managing Load"
    url: "https://sre.google/workbook/managing-load/"
    description: "Headroom, load balancing, load shedding, tự động mở rộng và khả năng chịu tải."
  - title: "Google SRE Workbook - Data Processing"
    url: "https://sre.google/workbook/data-processing/"
    description: "Ví dụ thực hành capacity planning, quota dùng chung và điều chỉnh autoscaler."
  - title: "Azure Well-Architected - Capacity Planning"
    url: "https://learn.microsoft.com/en-us/azure/well-architected/performance-efficiency/capacity-planning"
    description: "Phân tích nhu cầu workload, sizing, giới hạn tài nguyên, monitoring và autoscaling."
  - title: "Azure Well-Architected - Performance Testing"
    url: "https://learn.microsoft.com/en-us/azure/well-architected/performance-efficiency/performance-test"
    description: "Chiến lược load, stress, spike và endurance test để kiểm chứng capacity."
  - title: "Azure Architecture Center - Autoscaling Guidance"
    url: "https://learn.microsoft.com/en-us/azure/architecture/best-practices/auto-scaling"
    description: "Cơ chế scale theo lịch hoặc metrics, headroom, warm-up, dependency và vận hành."
  - title: "Kubernetes - Horizontal Pod Autoscaling"
    url: "https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/"
    description: "HPA metrics, scaling algorithm, min/max replicas và stabilization window."
  - title: "AWS Well-Architected - Performance Efficiency"
    url: "https://docs.aws.amazon.com/wellarchitected/latest/framework/performance-efficiency.html"
    description: "Thiết kế năng lực cloud đáp ứng mục tiêu hiệu năng và thay đổi theo nhu cầu."
  - title: "Google Cloud - Conduct Load Testing"
    url: "https://docs.cloud.google.com/support/docs/peak-events/conduct-load-testing"
    description: "Chuẩn bị kiểm thử tải trước sự kiện cao điểm, đánh giá bottleneck, quota và chi phí."