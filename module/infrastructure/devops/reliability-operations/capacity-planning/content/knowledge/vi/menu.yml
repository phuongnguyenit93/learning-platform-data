menu:
- level1: Tổng quan
  level2:
  - Hoạch định năng lực là gì và giải quyết vấn đề nào
  - Phân biệt nhu cầu, năng lực, hiệu năng và mức sử dụng
  - Thông lượng, độ trễ, mức đồng thời và điểm bão hòa
  - Năng lực lý thuyết, năng lực thực tế và năng lực đáp ứng mục tiêu
  - Quan hệ giữa hoạch định năng lực, độ tin cậy và chi phí
  - Hoạch định chủ động và ứng phó thiếu tài nguyên
  - Vai trò của nhóm ứng dụng, nền tảng, vận hành và kinh doanh
  - Lộ trình học cùng kiến thức hệ thống cần chuẩn bị
- level1: Mục tiêu và phạm vi
  level2:
  - Xác định dịch vụ, hành trình người dùng và tài nguyên cần quy hoạch
  - Chuyển mục tiêu kinh doanh thành giả định về nhu cầu
  - Dùng SLI, SLO và yêu cầu độ trễ làm ràng buộc năng lực
  - Xác định thời hạn quy hoạch ngắn, trung và dài hạn
  - Phân biệt năng lực theo dịch vụ, cụm, vùng và toàn hệ thống
  - Lập bản đồ thành phần và luồng xử lý quan trọng
  - Xác định chủ sở hữu, bên cung cấp dữ liệu và người phê duyệt
  - Ghi nhận giới hạn ngân sách, hạ tầng và yêu cầu tuân thủ
  - Định nghĩa tiêu chí đủ năng lực cùng bằng chứng nghiệm thu
- level1: Mô hình tải
  level2:
  - Phân loại tải tương tác, xử lý nền, theo lô và truyền dữ liệu
  - Phân biệt người dùng hoạt động, phiên truy cập và yêu cầu
  - Tốc độ yêu cầu đến, tốc độ hoàn thành và yêu cầu đang xử lý
  - Cơ cấu nghiệp vụ, kích thước dữ liệu và chi phí mỗi loại yêu cầu
  - Thời gian suy nghĩ của người dùng và mức đồng thời
  - Mô hình tải mở và tải đóng
  - Tải nền, giờ cao điểm và chu kỳ ngày hoặc tuần
  - Tải tăng đột biến, chiến dịch và sự kiện theo lịch
  - Tải thử lại, công việc định kỳ và lưu lượng nội bộ
  - Tải theo khách hàng, khu vực, phân vùng và mức độ ưu tiên
- level1: Chỉ số năng lực
  level2:
  - Chọn đơn vị năng lực theo yêu cầu, giao dịch hoặc khối lượng dữ liệu
  - Thông lượng trung bình, thông lượng đỉnh và cửa sổ đo
  - Độ trễ trung vị, p95, p99 và tác động của phân phối đuôi dài
  - Mức sử dụng, độ bão hòa và lỗi theo phương pháp USE
  - Đo tài nguyên tiêu thụ trên mỗi đơn vị công việc
  - Hàng đợi, tuổi công việc và thời gian chờ
  - Năng lực còn lại, khoảng dự trữ và ngưỡng vận hành an toàn
  - Tỷ lệ hoàn thành đúng SLO theo từng mức tải
  - Phân biệt tài nguyên được cấp, được đặt trước và thực sự sử dụng
  - Giới hạn của giá trị trung bình và số đo tổng hợp
- level1: Dữ liệu nền
  level2:
  - Thu thập metrics, logs, traces và dữ liệu nghiệp vụ
  - Chọn tần suất lấy mẫu và thời gian lưu dữ liệu
  - Đồng bộ thời gian cùng đơn vị đo giữa các nguồn
  - Kiểm tra dữ liệu thiếu, số đo sai và thay đổi cách ghi nhận
  - Gắn nhãn theo dịch vụ, phiên bản, vùng và nhóm khách hàng
  - Xây dựng đường cơ sở trong điều kiện vận hành ổn định
  - Phân biệt tải đại diện với tải bất thường
  - Đánh dấu bản phát hành, sự cố và thay đổi hạ tầng trên chuỗi thời gian
  - Giới hạn cardinality và chi phí thu thập dữ liệu
  - Lưu giả định, nguồn dữ liệu và phiên bản của đường cơ sở
- level1: Mô hình hiệu năng
  level2:
  - Liên hệ giữa tốc độ đến, thông lượng và số yêu cầu trong hệ thống
  - Luật Little và điều kiện áp dụng
  - Nhu cầu thời gian phục vụ trên mỗi tài nguyên
  - Mối quan hệ giữa mức sử dụng và thời gian chờ
  - Mô hình hàng đợi đơn và các giả định đơn giản hóa
  - Hệ thống nhiều tầng và hàng đợi nối tiếp
  - Phần tuần tự, phần song song và giới hạn tăng tốc
  - Chi phí phối hợp và hiệu quả khi tăng số bản sao
  - Hiệu chỉnh mô hình bằng dữ liệu đo thay vì suy rộng tuyến tính
- level1: Kiểm thử tải
  level2:
  - Xác định câu hỏi và tiêu chí đạt trước khi kiểm thử
  - Thiết kế kịch bản theo cơ cấu nghiệp vụ thực tế
  - Chuẩn bị dữ liệu, môi trường và trạng thái bộ nhớ đệm
  - Kiểm thử tải thông thường, tải đỉnh và khả năng mở rộng
  - Kiểm thử quá tải để tìm giới hạn chịu tải
  - Kiểm thử tải tăng đột biến và tốc độ hồi phục
  - Kiểm thử bền để phát hiện rò rỉ hoặc suy giảm theo thời gian
  - Chọn mô hình phát tải bằng k6, JMeter hoặc Gatling
  - Sai lệch do bỏ sót thời gian chờ (coordinated omission) khi đo độ trễ
  - Kiểm chứng bộ phát tải và mạng không trở thành nút thắt
  - Thu thập độ trễ, lỗi và tài nguyên đồng thời trong mỗi lượt chạy
  - Lặp lại kiểm thử, so sánh kết quả và lưu điều kiện thí nghiệm
- level1: Phân tích nút thắt
  level2:
  - Vẽ đường cong tải, thông lượng, độ trễ và lỗi
  - Xác định điểm bắt đầu vi phạm SLO
  - Phân biệt nút thắt CPU, bộ nhớ, I/O, mạng và khóa
  - Liên kết hàng đợi với tài nguyên hoặc phụ thuộc bị nghẽn
  - Phân tích tài nguyên nóng ở một node hoặc phân vùng
  - Phân biệt giới hạn ứng dụng với giới hạn hạ tầng
  - Dùng profiling và tracing để kiểm tra giả thuyết
  - Đánh giá sự dịch chuyển nút thắt sau tối ưu hoặc mở rộng
  - Xác định năng lực bền vững thay vì lấy thông lượng cao nhất
- level1: Dự báo nhu cầu
  level2:
  - Chọn biến dự báo, độ phân giải và khoảng thời gian dự báo
  - Phân tích xu hướng, mùa vụ và các điểm thay đổi
  - Dự báo đơn giản bằng giá trị gần nhất và đường cơ sở theo mùa
  - Trung bình trượt và làm trơn chuỗi thời gian
  - Hồi quy theo tăng trưởng người dùng hoặc khối lượng nghiệp vụ
  - Ảnh hưởng của chiến dịch, sản phẩm mới và khách hàng lớn
  - Dự báo riêng theo vùng, nhóm tải và tài nguyên
  - Chuyển nhu cầu nghiệp vụ thành nhu cầu tài nguyên
  - Kiểm định dự báo bằng các cửa sổ dữ liệu quá khứ
  - Chọn thước đo sai số và nhận diện sai lệch có hệ thống
  - Cập nhật dự báo khi giả định hoặc cơ cấu tải thay đổi
- level1: Rủi ro dự báo
  level2:
  - Phân biệt sai số đo, sai số mô hình và bất định kinh doanh
  - Lập kịch bản tăng trưởng thấp, cơ sở và cao
  - Khoảng dự báo và cách diễn giải mức tin cậy
  - Phân tích độ nhạy với các giả định quan trọng
  - Chọn khoảng dự trữ theo biến động, hậu quả và thời gian bổ sung
  - Tránh cộng trùng dự phòng ở nhiều tầng
  - Kịch bản vượt dự báo và giới hạn chấp nhận rủi ro
  - Nhận diện tín hiệu cho thấy mô hình không còn phù hợp
- level1: Quy hoạch CPU
  level2:
  - Đo thời gian CPU trên mỗi yêu cầu hoặc công việc
  - Phân biệt mức sử dụng CPU với hàng đợi chờ CPU
  - vCPU, lõi vật lý và khác biệt hiệu năng giữa loại máy
  - Chi phí ngữ cảnh, khóa và tranh chấp khi tăng số luồng
  - CPU quota, throttling và ảnh hưởng tới độ trễ
  - Tải một luồng và giới hạn mở rộng theo số lõi
  - Tranh chấp tài nguyên với ứng dụng lân cận (noisy neighbor)
  - So sánh tăng cấu hình máy với tăng số bản sao
  - Xác minh năng lực CPU sau thay đổi phần cứng hoặc runtime
- level1: Quy hoạch bộ nhớ
  level2:
  - Phân biệt bộ nhớ thường trú, bộ nhớ ảo và bộ nhớ khả dụng
  - Bộ nhớ nền cùng phần tăng thêm theo phiên hoặc yêu cầu
  - Heap, bộ nhớ ngoài heap, ngăn xếp luồng và bộ nhớ đệm
  - Ảnh hưởng của thu gom rác tới thông lượng và độ trễ JVM
  - Page cache, working set và quan hệ với I/O
  - Rò rỉ bộ nhớ, phân mảnh và tăng trưởng trong kiểm thử bền
  - Giới hạn container, OOM và hành vi khi thiếu bộ nhớ
  - Swap, áp lực bộ nhớ và suy giảm hiệu năng
  - Tính nhu cầu bộ nhớ theo mức đồng thời và thời gian lưu trạng thái
  - Chọn khoảng dự trữ bộ nhớ và kiểm chứng khi tải đỉnh
- level1: Quy hoạch lưu trữ
  level2:
  - Phân biệt dung lượng, IOPS, băng thông và độ trễ lưu trữ
  - Đặc tả tải đọc, ghi, tuần tự, ngẫu nhiên và kích thước khối
  - Dự báo dữ liệu tăng theo nghiệp vụ và thời gian lưu giữ
  - Dung lượng cho chỉ mục, bản sao, snapshot và bản sao lưu
  - Khoảng trống cho compaction, tái lập chỉ mục và thao tác bảo trì
  - Tốc độ tăng logs, traces và dữ liệu tạm
  - Giới hạn volume, filesystem, inode và hạn ngạch
  - Ảnh hưởng của cache, nén và khuếch đại ghi
  - Kiểm thử năng lực lưu trữ trong trạng thái ổn định
  - Nhu cầu I/O và dung lượng khi phục hồi hoặc đồng bộ lại
  - Chọn thời điểm mở rộng, phân tầng hoặc xóa dữ liệu
- level1: Quy hoạch mạng
  level2:
  - Ước tính lưu lượng từ số yêu cầu và kích thước dữ liệu
  - Băng thông, số gói mỗi giây và độ trễ mạng
  - Kết nối đồng thời, tốc độ tạo kết nối và chi phí TLS
  - Giới hạn cổng tạm, socket, file descriptor và bảng theo dõi kết nối
  - Năng lực load balancer, proxy và cổng API
  - Lưu lượng giữa dịch vụ, giữa vùng và ra internet
  - Chi phí mạng của sao chép dữ liệu, sao lưu và phục hồi
  - Đo tắc nghẽn, mất gói, truyền lại và giới hạn thiết bị
  - Kiểm chứng năng lực mạng khi chuyển hướng lưu lượng
- level1: Năng lực ứng dụng
  level2:
  - Phân biệt công việc dùng CPU với công việc chờ I/O
  - Thread pool, event loop và giới hạn xử lý đồng thời
  - Connection pool và hàng đợi chờ tài nguyên
  - Chi phí tuần tự hóa, nén và kích thước phản hồi
  - Khóa, vùng tranh chấp và giới hạn trong tiến trình
  - Ảnh hưởng của timeout, retry và lời gọi lặp tới tải thực
  - Tác động của khởi động, warm-up và biên dịch JIT
  - Ứng dụng giữ trạng thái và giới hạn khi thêm bản sao
  - Đo chi phí tài nguyên của từng loại giao dịch
  - Đánh giá thay đổi năng lực sau mỗi phiên bản ứng dụng
- level1: Cơ sở dữ liệu
  level2:
  - Mô hình nhu cầu theo truy vấn, giao dịch và kích thước dữ liệu
  - CPU, bộ nhớ, I/O và working set của cơ sở dữ liệu
  - Chỉ mục, kế hoạch truy vấn và chi phí trên mỗi giao dịch
  - Số kết nối, connection pool và giới hạn đồng thời
  - Khóa, tranh chấp và thời gian giữ giao dịch
  - Tốc độ ghi, nhật ký giao dịch và độ trễ sao chép
  - Read replica và giới hạn mở rộng tải đọc
  - Phân mảnh dữ liệu, khóa phân vùng và phân vùng nóng
  - Dung lượng cùng tài nguyên cho backup, restore và bảo trì
  - Năng lực còn lại khi mất replica hoặc chuyển vai trò
  - Kiểm thử tải với dữ liệu có quy mô và phân bố đại diện
- level1: Bộ nhớ đệm
  level2:
  - Mục tiêu năng lực của cache và tải giảm cho hệ thống phía sau
  - Ước tính bộ nhớ từ số khóa, kích thước giá trị và metadata
  - Tỷ lệ hit, miss và chi phí xử lý tương ứng
  - TTL, eviction và ảnh hưởng của chính sách giữ dữ liệu
  - Khóa nóng, phân bố không đều và giới hạn từng node
  - Cache stampede và tải khi hết hạn đồng loạt
  - Khởi động với cache lạnh và thời gian làm ấm
  - Dự phòng khi cache mất dữ liệu hoặc không sẵn sàng
- level1: Xử lý bất đồng bộ
  level2:
  - Tốc độ nhận việc, tốc độ xử lý và năng lực của consumer
  - Độ sâu hàng đợi, độ trễ và tuổi bản tin lâu nhất
  - Ước tính số worker từ thời gian xử lý và mục tiêu hoàn thành
  - Tính thời gian giải phóng tồn đọng sau một đợt tải
  - Batch size, mức song song và đánh đổi với độ trễ
  - Phân vùng, thứ tự bản tin và giới hạn số consumer hữu ích
  - Retry, dead-letter queue và khuếch đại khối lượng công việc
  - Retention, replication và dung lượng broker
  - Năng lực khi consumer dừng, broker lỗi hoặc phân vùng nóng
  - Giới hạn tiếp nhận và tạo áp lực ngược tới bên gửi
- level1: Hệ thống phân tán
  level2:
  - Tổng hợp năng lực theo chuỗi phụ thuộc giữa các dịch vụ
  - Fan-out và số lời gọi phía sau trên mỗi yêu cầu đầu vào
  - Giới hạn đồng thời và quota của dịch vụ bên ngoài
  - Phân bố tải không đều giữa các bản sao
  - Hot key, hot shard và tác động của độ lệch dữ liệu
  - Chi phí đồng bộ, phối hợp và sao chép khi mở rộng
  - Giới hạn mở rộng tuyến tính trong hệ thống nhiều node
  - Tải tái cân bằng, di chuyển dữ liệu và bổ sung thành viên
  - Nhu cầu tăng thêm khi phụ thuộc chậm hoặc lỗi
  - Xác định hợp đồng năng lực giữa các nhóm sở hữu dịch vụ
- level1: Năng lực Kubernetes
  level2:
  - Phân biệt capacity và allocatable của node
  - Requests, limits và tài nguyên thực tế của Pod
  - Khả năng đặt lịch và hiện tượng tài nguyên bị chia nhỏ
  - Quy hoạch số Pod, số node và cấu hình node pool
  - DaemonSet, thành phần hệ thống và chi phí nền của cụm
  - Pod Pending, taint, affinity và giới hạn đặt lịch
  - Chọn request từ dữ liệu sử dụng cùng yêu cầu độ tin cậy
  - ResourceQuota, LimitRange và phân bổ giữa nhóm sử dụng
  - Ephemeral storage, volume và giới hạn gắn ổ đĩa
  - Năng lực cho rolling update và số Pod tăng tạm thời
  - Tài nguyên dự phòng khi node bảo trì hoặc mất một vùng
  - Đánh giá mật độ Pod cùng năng lực mạng của cụm
- level1: Năng lực cloud
  level2:
  - Chọn loại máy theo CPU, bộ nhớ, I/O và tải thực tế
  - Hiệu năng dùng chung, burst credit và giới hạn bền vững
  - Quota tài khoản, vùng và giới hạn từng dịch vụ
  - Phân biệt quota được cấp với tài nguyên thực sự có thể cấp phát
  - Thời gian tạo máy, gắn volume và chuẩn bị dịch vụ
  - Giới hạn mở rộng của cơ sở dữ liệu và dịch vụ được quản lý
  - Cold start, concurrency và giới hạn của serverless
  - Năng lực cho môi trường thử nghiệm, staging và production
  - Rủi ro thu hồi máy Spot hoặc tài nguyên gián đoạn
  - Kiểm chứng kế hoạch theo vùng triển khai và điều kiện cấp phát
- level1: Mở rộng tự động
  level2:
  - Chọn mở rộng dọc, mở rộng ngang hoặc kết hợp
  - Phân biệt mở rộng phản ứng, theo lịch và theo dự báo
  - Chọn tín hiệu theo CPU, yêu cầu, hàng đợi hoặc độ trễ
  - Xác định số bản sao tối thiểu, tối đa và mức dự phòng
  - Thời gian phát hiện, cấp phát, khởi động và nhận tải
  - Cooldown, khoảng ổn định và hiện tượng tăng giảm liên tục
  - HPA, VPA và tương tác khi điều chỉnh tài nguyên Pod
  - Mở rộng node cùng ràng buộc quota và khả năng đặt lịch
  - Giới hạn mở rộng do database, cache và phụ thuộc
  - Thu hẹp an toàn với kết nối dài, phiên và công việc đang xử lý
  - Kiểm thử autoscaling khi tải tăng nhanh và khi tài nguyên cạn
- level1: Dự phòng năng lực
  level2:
  - Chọn mức dự phòng theo mục tiêu độ tin cậy
  - Mô hình N+1 và giả định về miền lỗi
  - Tính năng lực còn lại sau khi mất node hoặc vùng sẵn sàng
  - Kịch bản đồng thời có tải đỉnh và sự cố
  - Phân bố dự phòng theo vùng và giới hạn chia sẻ tài nguyên
  - Tải tăng trên thành phần sống sót khi chuyển lưu lượng
  - Năng lực để tái tạo bản sao và khôi phục dữ liệu
  - Yêu cầu tài nguyên phục vụ RTO và RPO
  - Dự phòng cho triển khai, bảo trì và thay thế hạ tầng
  - Phân biệt dự phòng nóng, ấm, lạnh và thời gian đưa vào phục vụ
  - Kiểm chứng chuyển vùng bằng diễn tập có đo đạc
- level1: Điều tiết quá tải
  level2:
  - Nhận diện quá tải trước khi hệ thống sụp đổ dây chuyền
  - Giới hạn tốc độ và hạn ngạch theo khách hàng
  - Admission control và giới hạn yêu cầu đồng thời
  - Hàng đợi có giới hạn và cơ chế tạo áp lực ngược
  - Ưu tiên công việc quan trọng và loại bỏ tải có kiểm soát
  - Suy giảm chức năng để duy trì luồng nghiệp vụ cốt lõi
  - Retry budget, backoff và jitter để tránh khuếch đại tải
  - Timeout, circuit breaker và cô lập nhóm tài nguyên
  - Đánh giá ảnh hưởng tới SLO, tính công bằng và trải nghiệm
- level1: Hiệu quả chi phí
  level2:
  - Chi phí trên mỗi yêu cầu, giao dịch hoặc khách hàng
  - So sánh chi phí tăng cấu hình với tăng số bản sao
  - Điều chỉnh cấu hình (right-sizing) theo nhu cầu bền vững và rủi ro tải đỉnh
  - Chi phí của tài nguyên nhàn rỗi và khoảng dự phòng
  - Đánh đổi giữa hiệu năng, độ tin cậy và ngân sách
  - Cam kết sử dụng, đặt trước năng lực và tính linh hoạt
  - Phân biệt ưu đãi giá với bảo đảm tài nguyên sẵn có
  - Chi phí lưu trữ, truyền dữ liệu và dịch vụ phụ trợ
  - Phân bổ chi phí theo dịch vụ, nhóm và môi trường
  - Kiểm chứng hiệu quả tối ưu bằng chi phí cùng kết quả SLO
- level1: Lập kế hoạch
  level2:
  - Tổng hợp nhu cầu dự báo và năng lực hiện có
  - Xác định khoảng thiếu hụt theo tài nguyên và thời gian
  - So sánh tối ưu phần mềm, điều tiết tải và bổ sung hạ tầng
  - Chọn mốc hành động theo tốc độ tăng trưởng và thời gian chuẩn bị
  - Đặt ngưỡng kích hoạt yêu cầu tăng quota hoặc mua sắm
  - Lập ngân sách cùng các phương án tăng trưởng
  - Lập lịch kiểm thử, triển khai và nghiệm thu năng lực mới
  - Ghi rõ giả định, mức dự phòng và rủi ro được chấp nhận
  - Chỉ định chủ sở hữu, thời hạn và phương án dự phòng
  - Trình bày báo cáo năng lực cho nhóm kỹ thuật và bên kinh doanh
- level1: Giám sát năng lực
  level2:
  - Thiết kế dashboard theo nhu cầu, tài nguyên và SLO
  - Theo dõi năng lực còn lại theo từng thành phần
  - Ước tính thời gian tới khi chạm ngưỡng tài nguyên
  - Phân biệt cảnh báo khẩn cấp với cảnh báo cần lập kế hoạch
  - Theo dõi quota, dung lượng trống và khả năng cấp phát
  - Phát hiện độ lệch tải giữa node, vùng và khách hàng
  - Giám sát hàng đợi, tồn đọng và thời gian hoàn thành dự kiến
  - So sánh dự báo với nhu cầu thực tế
  - Liên kết cảnh báo với chủ sở hữu và hướng dẫn xử lý
- level1: Vận hành liên tục
  level2:
  - Thiết lập chu kỳ rà soát năng lực và cập nhật giả định
  - Đưa đánh giá năng lực vào quy trình phát hành
  - Kiểm thử hồi quy hiệu năng và phát hiện tăng chi phí tài nguyên
  - Chuẩn bị năng lực trước chiến dịch hoặc mùa cao điểm
  - Hướng dẫn xử lý khi chạm giới hạn hoặc cấp phát thất bại
  - Dùng dữ liệu sự cố để điều chỉnh mô hình và khoảng dự phòng
  - Tự động hóa thu thập, tính toán và xuất báo cáo có kiểm chứng
  - Quản lý phiên bản dữ liệu, mô hình và quyết định quy hoạch
  - Rà soát tài nguyên dư thừa sau sự kiện hoặc thay đổi sản phẩm
- level1: Thực hành tổng hợp
  level2:
  - Xây dựng đường cơ sở cho một dịch vụ từ dữ liệu quan sát
  - Lập mô hình tải từ mục tiêu người dùng và cơ cấu nghiệp vụ
  - Tìm năng lực đáp ứng SLO bằng kiểm thử tải tăng dần
  - Chẩn đoán nút thắt CPU, bộ nhớ và connection pool
  - Dự báo tăng trưởng cùng kịch bản bất định
  - Tính dung lượng lưu trữ với retention, replication và backup
  - Tính worker cùng thời gian giải phóng hàng đợi tồn đọng
  - Quy hoạch cụm Kubernetes cho tải đỉnh và mất một vùng
  - So sánh autoscaling với cấp phát cố định theo chi phí và độ tin cậy
  - Hoàn thiện kế hoạch năng lực cùng dashboard, ngưỡng hành động và bằng chứng nghiệm thu
