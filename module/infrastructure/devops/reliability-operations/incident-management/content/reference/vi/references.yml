references:
  - title: "Google SRE — Incident Management Guide"
    url: "https://sre.google/resources/practices-and-processes/incident-management-guide/"
    description: "Quy trình chuẩn bị, điều phối, truyền thông, giảm thiểu và học hỏi sau sự cố của Google SRE."
  - title: "Google SRE Book — Managing Incidents"
    url: "https://sre.google/sre-book/managing-incidents/"
    description: "Vai trò điều phối, nguyên tắc 3C, incident state document và bàn giao Incident Commander."
  - title: "Google SRE Workbook — Incident Response"
    url: "https://sre.google/workbook/incident-response/"
    description: "Mô hình phản ứng sự cố, phân vai IC/OL/CL và các kênh phối hợp trong incident."
  - title: "Google SRE Book — Postmortem Culture"
    url: "https://sre.google/sre-book/postmortem-culture/"
    description: "Phân tích sự cố không đổ lỗi, xác định yếu tố đóng góp và thiết kế hành động phòng ngừa."
  - title: "Google SRE Workbook — Postmortem Culture"
    url: "https://sre.google/workbook/postmortem-culture/"
    description: "Thực hành viết, rà soát và theo dõi postmortem có hành động đo được."
  - title: "Atlassian — Incident Management Handbook"
    url: "https://www.atlassian.com/incident-management/handbook"
    description: "Quy trình incident, vai trò incident manager, on-call, kênh thông báo và tài liệu hóa."
  - title: "Atlassian — Responding to an Incident"
    url: "https://www.atlassian.com/incident-management/handbook/incident-response"
    description: "Các bước phát hiện, đánh giá, escalation, giảm thiểu, khôi phục và truyền thông trạng thái."
  - title: "Atlassian — Incident Postmortems"
    url: "https://www.atlassian.com/incident-management/handbook/postmortems"
    description: "Biên soạn timeline, impact, root cause và gắn owner cho các corrective actions."
  - title: "AWS Well-Architected — OPS 10 Event Management"
    url: "https://docs.aws.amazon.com/wellarchitected/2025-02-25/framework/ops-10.html"
    description: "Khuyến nghị quản lý event/incident/problem, ưu tiên theo impact, escalation và tự động hóa."