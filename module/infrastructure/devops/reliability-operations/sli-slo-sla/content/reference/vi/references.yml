    url: "https://sre.google/workbook/error-budget-policy/"
    description: "Mẫu chính sách xử lý khi vượt ngân sách lỗi và trách nhiệm giữa các nhóm."
  - title: "Google Cloud Monitoring — SLO Concepts"
    url: "https://docs.cloud.google.com/stackdriver/docs/solutions/slo-monitoring"
    description: "SLI request/window-based, cửa sổ tuân thủ, error budget và các ví dụ đo lường."