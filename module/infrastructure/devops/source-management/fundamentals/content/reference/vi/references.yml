references:
  - title: "Git Book — About Version Control"
    url: "https://git-scm.com/book/en/v2/Getting-Started-About-Version-Control"
    description: "Khái niệm version control, nhu cầu truy vết thay đổi và phân biệt VCS tập trung, phân tán."
  - title: "Git Book — Getting a Git Repository"
    url: "https://git-scm.com/book/en/v2/Git-Basics-Getting-a-Git-Repository"
    description: "Khởi tạo repository với git init, clone kho chung và cấu trúc làm việc cơ bản."
  - title: "Git Book — Recording Changes to the Repository"
    url: "https://git-scm.com/book/en/v2/Git-Basics-Recording-Changes-to-the-Repository"
    description: "Working tree, tracking, staging, diff và chu trình commit có kiểm soát."
  - title: "Git Book — Basic Branching and Merging"
    url: "https://git-scm.com/book/en/v2/Git-Branching-Basic-Branching-and-Merging"
    description: "Tạo nhánh, chuyển đổi nhánh, merge và xử lý xung đột giữa các thay đổi."
  - title: "Git Book — Tagging"
    url: "https://git-scm.com/book/en/v2/Git-Basics-Tagging"
    description: "Đánh dấu commit quan trọng, phân biệt lightweight/annotated tag và chia sẻ tag."
  - title: "GitHub Docs — Creating and Managing Repositories"
    url: "https://docs.github.com/en/repositories/creating-and-managing-repositories"
    description: "Tổ chức repository, các thực hành bảo trì và quản lý cộng tác mã nguồn."
  - title: "GitHub Docs — Pull Requests"
    url: "https://docs.github.com/en/pull-requests/reference/pull-requests"
    description: "Đề xuất, thảo luận, review và hợp nhất thay đổi bằng pull request."
  - title: "GitHub Docs — About Protected Branches"
    url: "https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches"
    description: "Đặt điều kiện review, required status checks và giới hạn force push với nhánh quan trọng."
  - title: "GitHub Docs — Secret Scanning"
    url: "https://docs.github.com/en/code-security/concepts/secret-security/secret-scanning"
    description: "Phát hiện credential bị lộ trong repository và giảm rủi ro sử dụng trái phép."
  - title: "GitHub Docs — Continuous Integration"
    url: "https://docs.github.com/en/actions/get-started/continuous-integration"
    description: "Chạy build/test tự động khi commit hoặc pull request để kiểm tra thay đổi trước khi tích hợp."