  - level1: "Chẩn đoán Git"
    level2:
      - "Thu thập trạng thái, nhánh, remote và log trước khi chọn hướng xử lý"
      - "Xử lý commit nhầm nhánh, detached HEAD và upstream chưa được thiết lập"
      - "Chẩn đoán nhánh không thấy commit sau fetch hoặc lịch sử chưa được tải đủ"
      - "Phân biệt lỗi xác thực, phân quyền, kết nối và URL remote không đúng"
      - "Giải thích diff bất thường do line ending, tên tệp khác hoa thường và quyền tệp"
      - "Nhận biết merge, rebase, cherry-pick đang dở và hoàn tất đúng thao tác"
      - "Xử lý thông báo repository lock bằng cách kiểm tra tiến trình trước khi can thiệp"
      - "Kiểm tra tính toàn vẹn bằng git fsck và hiểu clone, backup cùng giới hạn phục hồi"
  - level1: "Thực hành tổng hợp"
    level2:
      - "Bài thực hành khởi tạo dự án, cấu hình Git và xây dựng lịch sử commit rõ ràng"
      - "Bài thực hành staging từng phần, ignore và kiểm tra diff trước commit"
      - "Bài thực hành tạo nhánh, merge và giải quyết xung đột có kiểm thử"
      - "Bài thực hành rebase, cherry-pick và khôi phục commit bằng reflog"
      - "Bài thực hành cộng tác hai bản clone, xử lý push bị từ chối và đồng bộ fork"
      - "Bài thực hành mở pull request, review, sửa phản hồi và áp dụng bảo vệ nhánh"
      - "Bài thực hành tạo tag, release notes và truy vết artifact về đúng commit"
      - "Bài đánh giá cuối module: xử lý hồi quy và giải thích đầy đủ lịch sử thay đổi"
