menu:
  - level1: "Nền tảng kho mã"
    level2:
      - "Monorepo và polyrepo: khái niệm, đặc trưng và phạm vi áp dụng"
      - "Phân biệt kho mã, dự án, module, thư viện, dịch vụ và đơn vị triển khai"
      - "Phân biệt chiến lược kho mã với kiến trúc monolith và microservices"
      - "Độc lập giữa ranh giới kho mã, nhịp phát hành và cách triển khai"
      - "Luồng thay đổi từ chỉnh sửa mã đến build, kiểm thử và giao phần mềm"
      - "Lợi ích và đánh đổi về khả năng quan sát mã, tự chủ nhóm và phối hợp"
      - "Các ngộ nhận về tái sử dụng mã, thay đổi nguyên tử và khả năng mở rộng"
      - "Dấu hiệu chiến lược kho mã hiện tại không còn phù hợp với tổ chức"
  - level1: "Tiêu chí lựa chọn"
    level2:
      - "Thu thập bối cảnh sản phẩm, quy mô nhóm, công nghệ và vòng đời hệ thống"
      - "Đánh giá mức độ thay đổi cùng nhau giữa các thành phần và nhóm sở hữu"
      - "So sánh nhu cầu tự chủ với chi phí phối hợp và chuẩn hóa toàn tổ chức"
      - "Đánh giá yêu cầu bảo mật, chia sẻ mã với đối tác và giới hạn truy cập"
      - "Phân tích ảnh hưởng của nhịp phát hành, phụ thuộc và yêu cầu tương thích"
      - "Đánh giá năng lực nền tảng build, CI/CD và nguồn lực vận hành"
      - "Xây dựng ma trận quyết định có trọng số, giả định và bằng chứng kiểm chứng"
      - "Ghi nhận quyết định kiến trúc, điều kiện xem xét lại và chi phí đảo chiều"
  - level1: "Ranh giới kiến trúc"
    level2:
      - "Xác định miền nghiệp vụ và bounded context trước khi chia kho mã"
      - "Ánh xạ ranh giới trách nhiệm nhóm vào module, dịch vụ và thư viện"
      - "Phân biệt liên kết mã nguồn, liên kết build, liên kết phát hành và liên kết lúc chạy"
      - "Dùng lịch sử thay đổi cùng nhau để phát hiện ranh giới chưa hợp lý"
      - "Thiết lập API công khai và giới hạn truy cập vào phần triển khai nội bộ"
      - "Nhận diện phụ thuộc vòng và kiến trúc phân tán nhưng vẫn phải phát hành đồng loạt"
      - "Kiểm soát ranh giới bằng quy tắc import, kiến trúc và hướng phụ thuộc"
      - "Điều chỉnh ranh giới khi nhóm, miền nghiệp vụ và sản phẩm thay đổi"
  - level1: "Sở hữu mã nguồn"
    level2:
      - "Thiết lập bản đồ chủ sở hữu cho thư mục, module, kho mã và thư viện"
      - "Phân định trách nhiệm giữa nhóm sản phẩm, nhóm nền tảng và nhóm bảo mật"
      - "Thiết kế CODEOWNERS, tuyến review và cơ chế thay thế khi chủ sở hữu vắng mặt"
      - "Phân biệt quyền phê duyệt thay đổi với quyền đọc và ghi kho mã"
      - "Xác định người chịu trách nhiệm khi thay đổi ảnh hưởng nhiều thành phần"
      - "Thiết lập cam kết hỗ trợ cho thành phần dùng chung và phụ thuộc nội bộ"
      - "Quản lý mã chưa có chủ sở hữu, nhóm giải thể và bàn giao trách nhiệm"
      - "Đo thời gian chờ review, điểm nghẽn sở hữu và mức tập trung kiến thức"
  - level1: "Cấu trúc monorepo"
    level2:
      - "Tổ chức thư mục theo miền nghiệp vụ, ứng dụng và thư viện dùng chung"
      - "Thiết kế workspace và khai báo danh tính ổn định cho từng dự án"
      - "Tách cấu hình cấp gốc với cấu hình build và kiểm thử của từng thành phần"
      - "Quản lý mã ứng dụng, hạ tầng, tài liệu, mã sinh và công cụ nội bộ"
      - "Đặt quy tắc đặt tên, đường dẫn, dependency và phạm vi API của module"
      - "Giới hạn thư mục dùng chung để tránh phụ thuộc tùy tiện giữa các miền"
      - "Bố trí vùng thử nghiệm, dự án ngừng dùng và tài sản có vòng đời riêng"
      - "Ví dụ cấu trúc monorepo Java gồm nhiều dịch vụ, thư viện và cấu hình triển khai"
  - level1: "Cấu trúc polyrepo"
    level2:
      - "Chọn đơn vị tách kho theo miền nghiệp vụ, sản phẩm, dịch vụ hoặc thư viện"
      - "Thiết lập quy ước tên kho và danh mục tra cứu chủ sở hữu, tài liệu, trạng thái"
      - "Xác định nội dung chuẩn của mỗi kho: mã, build, kiểm thử và cấu hình phát hành"
      - "Thiết kế kho thư viện, kho hợp đồng và kho mẫu phục vụ nhiều nhóm"
      - "Chọn vị trí lưu hạ tầng và cấu hình triển khai theo trách nhiệm vận hành"
      - "Tổ chức môi trường làm việc khi một tính năng cần sửa nhiều kho"
      - "Quản lý vòng đời tạo mới, chuyển quyền sở hữu, lưu trữ và ngừng sử dụng kho"
      - "Ví dụ hệ thống Java đa kho với registry nội bộ và danh mục dịch vụ"
  - level1: "Mô hình kết hợp"
    level2:
      - "Monorepo theo miền kết hợp polyrepo giữa các miền nghiệp vụ"
      - "Tách nền tảng dùng chung khỏi kho sản phẩm theo vòng đời và quyền sở hữu"
      - "Kết hợp mã nguồn mở, mã nội bộ và mã đối tác theo yêu cầu truy cập"
      - "Phân biệt mô hình kho kết hợp với cơ chế Git submodule và subtree"
      - "Đánh giá chi phí đồng bộ, ghim phiên bản và trải nghiệm làm việc với submodule"
      - "Thiết kế giao diện và cơ chế phát hành qua ranh giới các nhóm kho"
      - "Kiểm soát sao chép mã và đồng bộ hai chiều giữa các kho liên quan"
      - "Xác định điều kiện giữ mô hình kết hợp hoặc chuyển sang cấu trúc khác"
  - level1: "Đồ thị phụ thuộc"
    level2:
      - "Lập đồ thị phụ thuộc mã nguồn, build, công cụ, kiểm thử và artifact"
      - "Phân biệt phụ thuộc trực tiếp, bắc cầu và phụ thuộc ngược để xác định tác động"
      - "Ghi nhận phụ thuộc ẩn qua cấu hình, tài nguyên, mã sinh và biến môi trường"
      - "Phân biệt đồ thị build với quan hệ gọi dịch vụ và phụ thuộc dữ liệu lúc chạy"
      - "Phát hiện phụ thuộc vòng và giới hạn phụ thuộc xuyên miền"
      - "Ánh xạ tệp thay đổi tới dự án và tập thành phần chịu ảnh hưởng"
      - "Cập nhật đồ thị khi thêm, đổi tên, di chuyển hoặc xóa thành phần"
      - "Kiểm chứng độ đầy đủ của đồ thị và xử lý phụ thuộc không thể suy ra tự động"
  - level1: "Thư viện dùng chung"
    level2:
      - "Lựa chọn tái sử dụng qua mã nguồn, package, artifact hoặc API dịch vụ"
      - "Phân biệt thư viện kỹ thuật dùng chung với logic nghiệp vụ cần giữ ranh giới"
      - "Quản lý dependency nội bộ và bên ngoài bằng BOM, constraints và lockfile"
      - "Đánh giá một phiên bản chung và nhiều phiên bản dependency cùng tồn tại"
      - "Thiết kế registry nội bộ, tọa độ artifact và chính sách lưu giữ phiên bản"
      - "Thiết lập quyền sở hữu, tài liệu sử dụng và cam kết tương thích của thư viện"
      - "Tự động đề xuất cập nhật dependency và theo dõi mức tiếp nhận của các kho"
      - "Loại bỏ thư viện lỗi thời, fork nội bộ và bản sao mã dùng chung mất kiểm soát"
  - level1: "Phiên bản và thay đổi"
    level2:
      - "So sánh đánh phiên bản đồng bộ và đánh phiên bản độc lập theo thành phần"
      - "Áp dụng quy tắc phiên bản ngữ nghĩa theo hợp đồng và loại người tiêu thụ"
      - "Xác định phiên bản phát hành từ thay đổi mã, dependency và nội dung artifact"
      - "Thiết kế tag, changelog và ghi chú phát hành cho nhiều thành phần"
      - "Phân biệt commit nguyên tử trong monorepo với cập nhật đồng thời ở môi trường chạy"
      - "Điều phối thay đổi nhiều kho bằng chuỗi pull request và thứ tự phát hành"
      - "Duy trì nhánh hỗ trợ, bản vá và truy vết các phiên bản đang được sử dụng"
      - "Quản lý deprecation, thời hạn nâng cấp và thay đổi phá vỡ tương thích"
  - level1: "Build có chọn lọc"
    level2:
      - "Xác định tập build chịu ảnh hưởng từ diff, đồ thị phụ thuộc và mục tiêu build"
      - "Chọn mốc so sánh theo merge base, nhánh đích và lần kiểm tra thành công phù hợp"
      - "Lan truyền tác động tới thành phần tiêu thụ và tác vụ phụ thuộc bắc cầu"
      - "Xử lý thay đổi cấu hình gốc, toolchain, lockfile, plugin và mã sinh"
      - "Tính tác động khi thêm, đổi tên, di chuyển hoặc xóa tệp và dự án"
      - "Phân biệt lọc pipeline theo đường dẫn với tính đầy đủ của tập cần build"
      - "Chạy build đầy đủ khi thiếu lịch sử Git, thiếu mốc hoặc không xác định được tác động"
      - "Đối chiếu build chọn lọc với build đầy đủ để phát hiện trường hợp bỏ sót"
  - level1: "Cache và tái lập"
    level2:
      - "Thiết kế build có đầu vào khai báo rõ và kết quả tái lập được"
      - "Xây dựng khóa cache từ mã nguồn, dependency, toolchain và môi trường liên quan"
      - "Phân biệt dependency cache, task cache, artifact và kết quả kiểm thử"
      - "Lựa chọn cache cục bộ, cache từ xa và chính sách chia sẻ giữa các nhóm"
      - "Kiểm soát quyền ghi cache và ngăn kết quả từ nguồn không tin cậy được tái sử dụng"
      - "Vô hiệu hóa cache khi thay đổi đầu vào ẩn hoặc phát hiện kết quả không chính xác"
      - "Tối ưu song song, chia nhỏ tác vụ và cấp tài nguyên theo đồ thị build"
      - "Đo tỷ lệ cache hit, thời gian truyền dữ liệu và chi phí lưu trữ cache"
  - level1: "Chiến lược kiểm thử"
    level2:
      - "Phân bổ unit test, integration test, contract test và end-to-end test theo rủi ro"
      - "Chọn kiểm thử chịu ảnh hưởng dựa trên mã, dependency và hợp đồng thay đổi"
      - "Kiểm tra thành phần tiêu thụ khi thư viện hoặc cấu hình dùng chung thay đổi"
      - "Thiết kế ma trận tương thích cho nhiều phiên bản dịch vụ và thư viện"
      - "Quản lý dữ liệu thử nghiệm, môi trường tạm thời và tài nguyên kiểm thử dùng chung"
      - "Chia test thành các phần chạy song song và xử lý test chậm hoặc thiếu ổn định"
      - "Kết hợp kiểm thử trước merge với kiểm thử đầy đủ định kỳ và sau tích hợp"
      - "Đánh giá độ tin cậy của test chọn lọc bằng lỗi lọt, mức bao phủ và thời gian phản hồi"
  - level1: "CI cho monorepo"
    level2:
      - "Thiết kế pipeline phát hiện thay đổi, lập kế hoạch và chạy tác vụ theo đồ thị"
      - "Tách kiểm tra toàn kho với build và kiểm thử riêng của từng dự án"
      - "Dùng pipeline động, mẫu dùng chung và cấu hình mở rộng theo thành phần"
      - "Thiết kế trạng thái kiểm tra bắt buộc khi một thành phần không có thay đổi"
      - "Dùng merge queue để kiểm tra thay đổi trên trạng thái tích hợp dự kiến"
      - "Hủy tác vụ lỗi thời, giới hạn đồng thời và phân bổ runner giữa các nhóm"
      - "Cô lập pull request không tin cậy khỏi secret, cache ghi được và quyền phát hành"
      - "Khoanh vùng lỗi pipeline dùng chung và duy trì phản hồi nhanh cho người phát triển"
  - level1: "CI cho polyrepo"
    level2:
      - "Chuẩn hóa pipeline qua template, workflow tái sử dụng và phiên bản cấu hình"
      - "Phát hiện consumer bị ảnh hưởng khi producer hoặc thư viện phát hành phiên bản mới"
      - "Thiết kế sự kiện liên kho với xác thực, chống lặp và khả năng truy vết"
      - "Điều phối chuỗi build producer, xuất bản artifact và kiểm thử consumer"
      - "Kiểm thử thay đổi nhiều kho bằng artifact tạm thời và tập phiên bản được ghim"
      - "Quản lý danh tính máy, token phạm vi hẹp và quyền kích hoạt pipeline liên kho"
      - "Xử lý retry, timeout và khôi phục khi chuỗi pipeline liên kho thất bại một phần"
      - "Phát hiện lệch chuẩn pipeline và triển khai cập nhật cấu hình trên nhiều kho"
  - level1: "Phát hành và triển khai"
    level2:
      - "Xác định đơn vị phát hành và triển khai độc lập với đơn vị lưu trữ mã"
      - "Build artifact một lần và quảng bá cùng artifact qua các môi trường"
      - "Truy vết commit, phiên bản dependency, kết quả CI và artifact đã triển khai"
      - "Điều phối thứ tự phát hành khi nhiều thành phần có quan hệ phụ thuộc"
      - "Thiết kế release manifest ghi nhận tập phiên bản của một hệ thống"
      - "Áp dụng feature flag, canary và phát hành từng phần để giảm phạm vi ảnh hưởng"
      - "Thiết kế rollback theo thành phần và xử lý ràng buộc tương thích khi quay lui"
      - "Tổ chức bản vá khẩn cấp, phê duyệt phát hành và kiểm tra sau triển khai"
  - level1: "Hợp đồng và dữ liệu"
    level2:
      - "Quản lý phiên bản API, sự kiện và schema dữ liệu qua ranh giới kho mã"
      - "Đặt nguồn chuẩn cho hợp đồng và xác định trách nhiệm cập nhật producer, consumer"
      - "Kiểm tra tương thích lùi, tương thích tiến và giới hạn của contract test"
      - "Áp dụng expand-contract cho thay đổi API, sự kiện và cơ sở dữ liệu"
      - "Quản lý mã client được sinh tự động và đồng bộ phiên bản với hợp đồng"
      - "Lập trình tự migration dữ liệu khi các dịch vụ nâng cấp không đồng thời"
      - "Kiểm thử trạng thái nhiều phiên bản cùng hoạt động trong quá trình chuyển tiếp"
      - "Loại bỏ hợp đồng cũ dựa trên bằng chứng sử dụng và cam kết với nhóm tiêu thụ"
  - level1: "Phân quyền truy cập"
    level2:
      - "Ánh xạ yêu cầu đọc, ghi, review, quản trị và phát hành cho từng nhóm người dùng"
      - "Phân biệt CODEOWNERS và bảo vệ nhánh với cơ chế kiểm soát quyền đọc mã"
      - "Đánh giá giới hạn phân quyền theo thư mục của nền tảng lưu trữ đang dùng"
      - "Thiết kế ranh giới kho khi mã cần cách ly theo khách hàng, đối tác hoặc mức nhạy cảm"
      - "Quản lý tài khoản dịch vụ, ứng dụng tích hợp và quyền truy cập liên kho"
      - "Bảo vệ nhánh, tag, môi trường triển khai và quyền vượt qua quy tắc kiểm tra"
      - "Thực hiện cấp quyền, thu hồi quyền và rà soát truy cập theo vòng đời nhân sự"
      - "Kiểm toán truy cập mã, thay đổi quyền và các đường vượt ranh giới dự kiến"
  - level1: "Bảo mật chuỗi cung ứng"
    level2:
      - "Mô hình hóa rủi ro từ mã nguồn, dependency, runner, cache và registry"
      - "Quét secret, lỗ hổng và giấy phép theo phạm vi thành phần chịu ảnh hưởng"
      - "Tách secret khỏi kho mã và giới hạn thông tin nhạy cảm trong log CI"
      - "Ghim dependency, công cụ và workflow theo định danh có thể kiểm chứng"
      - "Sinh SBOM, thông tin nguồn gốc build và chữ ký cho artifact phát hành"
      - "Kiểm tra chính sách bảo mật trước khi xuất bản package và triển khai hệ thống"
      - "Đánh giá phạm vi ảnh hưởng khi thư viện, tài khoản hoặc pipeline dùng chung bị xâm phạm"
      - "Thu hồi thông tin xác thực, cô lập artifact và điều phối vá lỗi trên nhiều thành phần"
  - level1: "Phối hợp nhóm"
    level2:
