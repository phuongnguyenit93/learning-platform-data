references:
  - title: "GitLab Docs — Repository"
    url: "https://docs.gitlab.com/user/project/repository/"
    description: "Cấu trúc repository trong project, thao tác lưu mã nguồn, commit và lịch sử thay đổi."
  - title: "GitLab Docs — Project Members"
    url: "https://docs.gitlab.com/user/project/members/"
    description: "Quản lý thành viên dự án, vai trò, quyền truy cập và thành viên kế thừa từ group."
  - title: "GitLab Docs — Branches"
    url: "https://docs.gitlab.com/user/project/repository/branches/"
    description: "Feature branch, lịch sử thay đổi, quy trình cộng tác và liên kết branch với issue/MR."
  - title: "GitLab Docs — Issues"
    url: "https://docs.gitlab.com/user/project/issues/"
    description: "Theo dõi task, bug, tính năng; assignee, label, milestone và thảo luận nhóm."
  - title: "GitLab Docs — Merge Requests"
    url: "https://docs.gitlab.com/user/project/merge_requests/"
    description: "Mở MR, so sánh diff, thảo luận, nhận review và liên kết issue với thay đổi."
  - title: "GitLab Docs — Merge Request Approvals"
    url: "https://docs.gitlab.com/user/project/merge_requests/approvals/"
    description: "Approval, review status, điều kiện merge và khác biệt rule theo tier GitLab."
  - title: "GitLab Docs — Protected Branches"
    url: "https://docs.gitlab.com/user/project/repository/branches/protected/"
    description: "Quy tắc giới hạn push/merge, bảo vệ nhánh mặc định và yêu cầu review qua MR."
  - title: "GitLab Docs — CI/CD Pipelines"
    url: "https://docs.gitlab.com/ci/pipelines/"
    description: "Pipeline build/test/deploy, stages/jobs và cách kiểm tra trạng thái thực thi."
  - title: "GitLab Docs — Merge Request Pipelines"
    url: "https://docs.gitlab.com/ci/pipelines/merge_request_pipelines/"
    description: "Kiểm tra thay đổi qua pipeline trên merge request, cấu hình và lưu ý khi dùng fork."