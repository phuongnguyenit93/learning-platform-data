roadmap:
- id: git-quan-ly-phien-ban
  title: Git & quản lý phiên bản
  purpose: Hiểu cách Git lưu snapshot phân tán và vì sao commit là đơn vị theo dõi thay đổi đáng tin cậy.
  objectives:
  - Giải thích repository, commit, HEAD và working tree
  - Phân biệt Git phân tán với hệ thống tập trung
  - Thử git init và git clone trên dự án nhỏ
- id: working-tree-index-commit
  title: Working Tree, Index & Commit
  purpose: Nắm ba trạng thái thay đổi của tệp để tạo commit chính xác, gọn và có thể truy vết.
  objectives:
  - Phân biệt untracked, modified và staged
  - Dùng status, add, diff --staged và commit
  - Viết commit message mô tả rõ thay đổi
- id: lich-su-diff
  title: Lịch sử & Diff
  purpose: Đọc quan hệ giữa các commit để kiểm tra thay đổi và tìm nguyên nhân lỗi trong dự án.
  objectives:
  - Xem log --oneline --graph và git show
  - So sánh working tree, index và các commit bằng diff
  - Nhận diện HEAD, commit hash và parent commit
- id: branch-merge-conflict
  title: Branch, Merge & Conflict
  purpose: Tách luồng phát triển bằng branch rồi hợp nhất thay đổi có kiểm soát mà không làm mất mã.
  objectives:
  - Tạo và chuyển branch bằng branch, switch
  - Phân biệt fast-forward với merge commit
  - Giải quyết xung đột, kiểm thử và hoàn tất merge
- id: remote-dong-bo
  title: Remote & Đồng bộ
  purpose: Đồng bộ repository giữa máy và đồng đội, hiểu tác dụng khác nhau của các lệnh lấy và đẩy lịch sử.
  objectives:
  - Xem remote, origin và tracking branch
  - Phân biệt fetch, pull và push
  - Thử đồng bộ nhánh và xử lý push bị từ chối
- id: rebase-chinh-lich-su
  title: Rebase & Chỉnh lịch sử
  purpose: Biết khi nào cần tuyến tính hóa hoặc sắp xếp commit mà không gây hỏng lịch sử đã chia sẻ.
  objectives:
  - So sánh rebase với merge theo sơ đồ commit
  - Dùng interactive rebase để squash trên nhánh cá nhân
  - Giải thích rủi ro rewrite lịch sử đã public
- id: undo-stash-recovery
  title: Undo, Stash & Recovery
  purpose: Chọn thao tác hoàn tác phù hợp với thay đổi chưa commit hoặc đã chia sẻ, tránh mất dữ liệu.
  objectives:
  - Phân biệt restore, reset và revert
  - Cất tạm thay đổi bằng stash rồi khôi phục
  - Kiểm tra reflog trước khi cứu commit thất lạc
- id: tags-git-workflow-an-toan
  title: Tags & Git Workflow an toàn
  purpose: Vận dụng Git trong quy trình nhóm với mốc phát hành, commit dễ review và bảo vệ dữ liệu nhạy cảm.
  objectives:
  - Tạo annotated tag để đánh dấu phiên bản
  - Dùng .gitignore cho tệp không cần theo dõi
  - Thực hành commit nhỏ, review diff và tránh commit secrets
