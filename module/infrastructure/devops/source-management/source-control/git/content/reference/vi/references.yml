references:
  - title: "Git — Tutorial"
    url: "https://git-scm.com/docs/gittutorial"
    description: "Hướng dẫn chính thức từ git init, git add, commit, status đến branch, merge và lịch sử."
  - title: "Git — git-log"
    url: "https://git-scm.com/docs/git-log"
    description: "Tham chiếu chính thức để xem, lọc và đối chiếu lịch sử các commit."
  - title: "Git — git-branch"
    url: "https://git-scm.com/docs/git-branch"
    description: "Cách tạo, liệt kê, đổi tên, xóa branch và quản lý tracking branch."
  - title: "Git — git-merge"
    url: "https://git-scm.com/docs/git-merge"
    description: "Giải thích fast-forward, merge commit, xử lý xung đột và hủy merge."
  - title: "Git — git-remote"
    url: "https://git-scm.com/docs/git-remote"
    description: "Thiết lập, xem và quản lý các remote repository cùng địa chỉ đồng bộ."
  - title: "Git — git-rebase"
    url: "https://git-scm.com/docs/git-rebase"
    description: "Cơ chế rebase, interactive rebase, xử lý lỗi và các lưu ý khi viết lại lịch sử."
  - title: "Git — git-revert"
    url: "https://git-scm.com/docs/git-revert"
    description: "Hoàn tác commit bằng một commit mới và so sánh với reset hoặc restore."
  - title: "Git — gitignore"
    url: "https://git-scm.com/docs/gitignore"
    description: "Quy tắc bỏ qua tệp untracked, mẫu đường dẫn và các lưu ý với tệp đã được Git theo dõi."
  - title: "Git — git-tag"
    url: "https://git-scm.com/docs/git-tag"
    description: "Tạo, liệt kê, kiểm tra và quản lý các tag đánh dấu phiên bản hoặc mốc phát hành."
