  - Liên kết sự kiện với Pod, image digest và chủ sở hữu
  - Điều chỉnh cảnh báo, kiểm soát nhiễu và bảo vệ dữ liệu nhật ký
  - Kiểm chứng độ bao phủ phát hiện cùng chi phí vận hành
- level1: Ứng phó sự cố
  level2:
  - Dấu hiệu container bị xâm nhập và tiêu chí kích hoạt ứng phó
  - Chuẩn bị quyền, công cụ và quy trình điều tra
  - Cô lập workload cùng lưu lượng mạng theo mức độ sự cố
  - Thu thập tiến trình, kết nối, thay đổi tệp và metadata
  - Bảo toàn bằng chứng trước khi dừng hoặc xóa container
  - Truy vết image digest, provenance và lịch sử triển khai
  - Đánh giá phạm vi lan truyền tới node và workload khác
  - Thu hồi token, xoay vòng bí mật và chặn image bị ảnh hưởng
  - Thay thế workload hoặc node từ nguồn đã được kiểm chứng
  - Phân tích nguyên nhân, phục hồi dịch vụ và cập nhật biện pháp phòng vệ
- level1: Cập nhật và khắc phục
  level2:
  - Xây dựng lại image để đưa bản vá vào môi trường chạy
  - Theo dõi base image cùng thông báo bảo mật của nhà cung cấp
  - Kiểm tra tác động khi cập nhật gói hệ điều hành và thư viện
  - Quảng bá cùng một image digest qua các môi trường
  - Canary, rolling update và kiểm chứng sau triển khai
  - Rollback và rủi ro quay lại image có lỗ hổng
  - Phát hiện cấu hình trôi lệch hoặc thay đổi trong container
  - Ngừng sử dụng image hết hỗ trợ và quản lý ngoại lệ khẩn cấp
- level1: Kiểm chứng bảo mật
  level2:
  - Thiết kế phòng thực hành cô lập và dữ liệu thử nghiệm
  - Đối chiếu cấu hình với CIS Benchmarks phù hợp nền tảng
  - Kiểm tra tự động người dùng, quyền, mount và namespace
  - Kiểm thử seccomp, capabilities và quyền ghi tệp
  - Kiểm thử giới hạn tài nguyên và tác động tới workload lân cận
  - Kiểm thử phân đoạn mạng cùng chính sách chặn lưu lượng
  - Kiểm thử admission với image chưa ký hoặc cấu hình vi phạm
  - Mô phỏng hành vi nguy hiểm để kiểm chứng cảnh báo runtime
  - Đánh giá lỗ hổng trong bối cảnh triển khai thực tế
  - Lưu bằng chứng, tái hiện kết quả và kiểm thử hồi quy
- level1: Quản trị bảo mật
  level2:
  - Xây dựng chuẩn tối thiểu theo loại container và môi trường
  - Xác định chủ sở hữu image, workload và biện pháp kiểm soát
  - Phân loại rủi ro để áp dụng yêu cầu theo mức độ tin cậy
  - Quy trình ngoại lệ có lý do, thời hạn và biện pháp bù đắp
  - Chỉ số về image, bản vá, đặc quyền và thời gian xử lý
  - Quản lý phiên bản chính sách cùng bằng chứng kiểm toán
  - Đánh giá nhà cung cấp image, runtime và dịch vụ container
  - Rà soát định kỳ mô hình đe dọa cùng chuẩn gia cố
- level1: Thực hành tổng hợp
  level2:
  - Gia cố image ứng dụng từ Dockerfile còn nhiều rủi ro
  - Tách bí mật khỏi build và cấp quyền lúc chạy
  - Tạo SBOM, quét image và lập kế hoạch xử lý lỗ hổng
  - Ký image rồi xác minh danh tính cùng nguồn gốc bản build
  - Cấu hình registry riêng với phân quyền tối thiểu
  - Chạy ứng dụng bằng rootless và đánh giá giới hạn
  - Triển khai Pod theo chuẩn Restricted cùng chính sách mạng
  - Chặn image và cấu hình vi phạm bằng admission policy
  - Phát hiện, cô lập và điều tra container có hành vi bất thường
  - Hoàn thiện hồ sơ bảo mật từ mô hình đe dọa đến bằng chứng kiểm chứng
