  - Bao phủ thư viện được shaded, relocated hoặc nhúng trong executable JAR
  - Kết nối commit, JDK, tham số build và digest của JAR trong provenance
  - Ký, phân phối và xác minh JAR hoặc image chứa ứng dụng Java
  - Tái build và điều tra khác biệt do metadata, timestamp hoặc môi trường
- level1: Khác biệt hệ sinh thái
  level2:
  - So sánh danh tính gói, lockfile và nguồn tải giữa các hệ sinh thái
  - Nhận diện script vòng đời và phụ thuộc công cụ trong hệ sinh thái npm
  - Phân biệt source distribution, wheel và quá trình build package Python
  - Đánh giá cơ chế checksum, proxy và module trong hệ sinh thái Go
  - Kiểm kê thư viện native, compiler và công cụ tạo mã
  - Quản lý gói hệ điều hành và thành phần cài ngoài trình quản lý ứng dụng
  - Nhận diện mã được tải hoặc plugin được nạp trong thời gian chạy
  - Xây dựng quy tắc dùng chung nhưng giữ kiểm soát đặc thù từng hệ sinh thái
