references:
  - title: "GitHub Docs – Secret Scanning Alerts"
    url: "https://docs.github.com/en/code-security/concepts/secret-security/about-alerts"
    description: "Phân loại cảnh báo secret scanning và giới hạn khả dụng theo loại repository."
  - title: "GitHub Docs – Supported Secret Patterns"
    url: "https://docs.github.com/en/code-security/reference/secret-security/supported-secret-scanning-patterns"
    description: "Các pattern provider/generic/AI và khả năng push protection, validity check."
  - title: "GitHub Docs – Push Protection"
    url: "https://docs.github.com/en/code-security/concepts/secret-security/push-protection"
    description: "Chặn credential trước khi được push và cơ chế bypass có kiểm soát."
  - title: "Gitleaks – Official Repository"
    url: "https://github.com/gitleaks/gitleaks"
    description: "CLI quét thư mục, Git history, pre-commit hook, rules, allowlists và baseline."
  - title: "GitLab Docs – Secret Detection"
    url: "https://docs.gitlab.com/user/application_security/secret_detection/"
    description: "Push protection, pipeline detection và hoạt động rà soát credential lộ."
  - title: "GitLab Docs – Pipeline Secret Detection"
    url: "https://docs.gitlab.com/user/application_security/secret_detection/pipeline/"
    description: "Cấu hình CI secret_detection job và historic scan cho repository."
  - title: "GitHub Docs – Resolving Secret Alerts"
    url: "https://docs.github.com/en/code-security/how-tos/manage-security-alerts/manage-secret-scanning-alerts/resolving-alerts"
    description: "Triage và xử lý cảnh báo, rotate/revoke credential và ghi lại lý do đóng."
  - title: "GitHub Docs – Removing Sensitive Data"
    url: "https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/removing-sensitive-data-from-a-repository"
    description: "Rủi ro Git history rewrite và ưu tiên thu hồi secret đã lộ."
  - title: "OWASP – Secrets Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet"
    description: "Vòng đời, quyền tối thiểu, lưu trữ, rotation và ứng cứu khi secret bị lộ."
  - title: "GitHub Docs – Viewing Secret Alerts"
    url: "https://docs.github.com/en/code-security/how-tos/manage-security-alerts/manage-secret-scanning-alerts/viewing-alerts"
    description: "Tra cứu và lọc alerts theo loại secret, trạng thái và mức độ hiệu lực."