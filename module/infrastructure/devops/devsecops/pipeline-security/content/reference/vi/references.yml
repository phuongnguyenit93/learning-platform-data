references:
  - title: "OWASP CI/CD Security Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/CI_CD_Security_Cheat_Sheet.html"
    description: "Rủi ro và biện pháp bảo vệ SCM, runner, secrets, least privilege, integrity và logging."
  - title: "GitHub Actions Security"
    url: "https://docs.github.com/en/actions/how-tos/secure-your-work"
    description: "Hướng dẫn bảo vệ workflow, pin action, artifact attestations và deploy an toàn."
  - title: "GitHub Actions OIDC Reference"
    url: "https://docs.github.com/en/actions/reference/security/oidc"
    description: "Cấu hình token OIDC ngắn hạn và quyền id-token cho workload trong workflow."
  - title: "GitLab Runner Security"
    url: "https://docs.gitlab.com/runner/security/"
    description: "Rủi ro của self-managed runner và cách cô lập môi trường thực thi job."
  - title: "GitLab CI/CD Hardening"
    url: "https://docs.gitlab.com/security/hardening_cicd_recommendations/"
    description: "Bảo vệ secret, network, audit logging và giới hạn quyền triển khai."
  - title: "SLSA Build Track"
    url: "https://slsa.dev/spec/v1.2/build-track-basics"
    description: "Các mức bảo đảm về build provenance, hosted build và hardened build."
  - title: "SLSA Provenance"
    url: "https://slsa.dev/spec/v1.2/provenance"
    description: "Mô tả nguồn gốc artifact, quá trình build và khả năng xác minh đầu ra."
  - title: "NIST Secure Software Development Framework"
    url: "https://csrc.nist.gov/pubs/sp/800/218/final"
    description: "Khung SSDF để tích hợp thực hành phát triển phần mềm an toàn vào SDLC."