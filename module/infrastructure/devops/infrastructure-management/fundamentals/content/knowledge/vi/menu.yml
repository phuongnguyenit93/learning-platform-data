menu:
  - level1: "Nền tảng quản lý hạ tầng trong DevOps"
    level2:
      - "Phạm vi quản lý hạ tầng và mối liên hệ với vòng đời ứng dụng"
      - "Nhận diện tài nguyên vật lý, máy ảo, container và dịch vụ được quản lý"
      - "So sánh hạ tầng tại chỗ, đám mây và mô hình kết hợp"
      - "Phân định trách nhiệm giữa nhà cung cấp, đội nền tảng và đội ứng dụng"
      - "Nhận diện rủi ro của cấu hình thủ công và kiến thức chỉ nằm ở cá nhân"
      - "Các thuộc tính của hạ tầng có thể tái lập, kiểm tra và truy vết"
      - "Phân biệt provisioning, configuration management và orchestration"
      - "Mối liên hệ giữa quản lý hạ tầng, độ tin cậy, bảo mật và chi phí"
  - level1: "Kiểm kê tài nguyên và mô hình hóa hiện trạng"
    level2:
      - "Xác định phạm vi kiểm kê theo tài khoản, khu vực, môi trường và hệ thống"
      - "Thu thập danh sách máy chủ, mạng, lưu trữ và dịch vụ nền tảng"
      - "Xây dựng hồ sơ tài nguyên với định danh, vị trí, phiên bản và trạng thái"
      - "Gắn chủ sở hữu, đơn vị sử dụng và đầu mối vận hành cho tài nguyên"
      - "Thiết kế quy ước đặt tên, nhãn và thẻ tài nguyên"
      - "Phân loại mức độ quan trọng và dữ liệu được xử lý trên tài nguyên"
      - "Lập bản đồ phụ thuộc giữa tài nguyên, dịch vụ và bên cung cấp"
      - "Xây dựng sổ kiểm kê và phân biệt vai trò của CMDB với mã IaC"
      - "Đối soát dữ liệu kiểm kê để tìm tài nguyên thiếu chủ, trùng lặp hoặc bị bỏ quên"
      - "Tự động thu thập và cập nhật kiểm kê mà không đưa thông tin nhạy cảm vào báo cáo"
  - level1: "Yêu cầu hạ tầng và thiết kế trạng thái đích"
    level2:
      - "Chuyển nhu cầu ứng dụng thành yêu cầu về tính toán, lưu trữ và kết nối"
      - "Thu thập yêu cầu về tính sẵn sàng, hiệu năng và giới hạn gián đoạn"
      - "Xác định ràng buộc về vị trí dữ liệu, kết nối và quyền truy cập"
      - "Ước lượng tải nền, tải đỉnh và dung lượng dự phòng"
      - "Nhận diện điểm lỗi đơn và các miền lỗi của hệ thống"
      - "Vẽ sơ đồ hạ tầng cùng ranh giới tin cậy và luồng dữ liệu"
      - "Định nghĩa cấu hình chuẩn và tiêu chí chấp nhận trạng thái đích"
      - "Ghi nhận giả định, quyết định thiết kế và đánh đổi vận hành"
      - "Đánh giá khoảng cách giữa hiện trạng kiểm kê và trạng thái mong muốn"
  - level1: "Phân tách và quản lý môi trường"
    level2:
      - "Xác định vai trò của môi trường phát triển, kiểm thử, staging và production"
      - "Chọn ranh giới cách ly bằng tài khoản, dự án, mạng và không gian tên"
      - "Phân tách định danh, quyền truy cập và thông tin bí mật theo môi trường"
      - "Tách dữ liệu sản xuất khỏi dữ liệu thử nghiệm và quy trình làm sạch dữ liệu"
      - "Tái sử dụng cấu trúc hạ tầng với tham số riêng cho từng môi trường"
      - "Quản lý khác biệt có chủ đích về quy mô, tính sẵn sàng và chi phí"
      - "Thiết lập quy ước đặt tên và nhãn để nhận diện đúng môi trường"
      - "Kiểm soát kết nối giữa các môi trường và dịch vụ dùng chung"
      - "Quản lý môi trường tạm thời với thời hạn sử dụng và quy tắc thu hồi"
      - "Đảm bảo staging đại diện đủ cho production khi kiểm tra thay đổi"
  - level1: "Các thành phần tài nguyên cần quản lý"
    level2:
      - "Quản lý máy ảo theo kích thước, hệ điều hành, image và vai trò"
      - "Phân biệt vòng đời của tài nguyên tính toán với dữ liệu bền vững"
      - "Tổ chức mạng, subnet, dải địa chỉ và bảng định tuyến"
      - "Quản lý địa chỉ IP, DNS và điểm truy cập nội bộ hoặc công khai"
      - "Kiểm soát luồng truy cập bằng firewall và nhóm bảo mật"
      - "Quản lý cân bằng tải và điều kiện kiểm tra sức khỏe đích"
      - "Phân biệt lưu trữ block, file và object theo nhu cầu sử dụng"
      - "Quản lý dung lượng, quyền truy cập, mã hóa và chính sách lưu giữ dữ liệu"
      - "Xác định trách nhiệm quản lý với cơ sở dữ liệu và dịch vụ được quản lý"
      - "Kiểm kê phụ thuộc vào chứng chỉ, tên miền và dịch vụ bên ngoài"
      - "Nhận diện quota, hạn mức và các ràng buộc vị trí tài nguyên"
  - level1: "Nguyên lý Infrastructure as Code"
    level2:
      - "Biểu diễn hạ tầng bằng mã và xác định mã nguồn chuẩn của cấu hình"
      - "So sánh cách khai báo trạng thái với cách mô tả từng lệnh thực thi"
      - "Phân biệt tính lặp an toàn, tính xác định và khả năng hội tụ"
      - "Nhận diện provider, resource và data source trong mô hình IaC"
      - "Khai báo đầu vào, giá trị mặc định, đầu ra và ràng buộc dữ liệu"
      - "Mô hình hóa phụ thuộc và thứ tự tạo tài nguyên"
      - "Hiểu chu trình khởi tạo, kiểm tra, lập kế hoạch và áp dụng"
      - "Đọc kế hoạch tạo mới, cập nhật, thay thế và hủy tài nguyên"
      - "Phân biệt khả năng tái lập cấu hình với khả năng khôi phục dữ liệu"
      - "Xác định giới hạn của IaC đối với tác vụ thủ công và hệ thống bên ngoài"
  - level1: "Tổ chức mã hạ tầng và tái sử dụng"
    level2:
      - "Thiết kế cấu trúc kho mã theo hệ thống, môi trường và ranh giới trách nhiệm"
      - "Chia cấu hình thành thành phần nhỏ với đầu vào và đầu ra rõ ràng"
      - "Xác định ranh giới module theo vòng đời và phạm vi ảnh hưởng"
      - "Tách cấu hình dùng chung khỏi tham số của từng môi trường"
      - "Tránh sao chép cấu hình và tránh tổng quát hóa module quá sớm"
      - "Quản lý phiên bản công cụ, provider, module và tệp khóa phụ thuộc"
      - "Dùng Git để lưu lịch sử, so sánh và truy vết thay đổi hạ tầng"
      - "Áp dụng nhánh làm việc, pull request và trách nhiệm sở hữu mã"
      - "Viết tài liệu đầu vào, đầu ra, phụ thuộc và cách sử dụng module"
      - "Kiểm tra định dạng, cú pháp, tham chiếu và các giá trị đầu vào"
  - level1: "Trạng thái IaC và quản lý tài nguyên hiện hữu"
    level2:
      - "Phân biệt mã khai báo, trạng thái IaC và trạng thái tài nguyên thực tế"
      - "Hiểu ánh xạ giữa địa chỉ tài nguyên trong mã và định danh ngoài hệ thống"
      - "Lựa chọn nơi lưu trạng thái cục bộ hoặc dùng chung theo nhu cầu phối hợp"
      - "Bảo vệ backend trạng thái bằng mã hóa, phân quyền và quản lý phiên bản"
      - "Sử dụng khóa trạng thái để ngăn các lần áp dụng đồng thời"
      - "Tách trạng thái theo môi trường, vòng đời và phạm vi ảnh hưởng"
      - "Kiểm soát thông tin nhạy cảm trong state, đầu ra và bản kế hoạch"
      - "Đưa tài nguyên có sẵn vào phạm vi quản lý bằng import và đối chiếu cấu hình"
      - "Đổi tên hoặc di chuyển địa chỉ tài nguyên mà vẫn bảo toàn ánh xạ"
      - "Xử lý khóa bị bỏ lại và trạng thái không khớp sau lần chạy gián đoạn"
      - "Sao lưu và phục hồi trạng thái trước khi thực hiện thao tác sửa chữa"
  - level1: "Quản lý cấu hình theo trạng thái mong muốn"
    level2:
      - "Xác định phần cấu hình bên trong máy chủ sau khi cấp phát tài nguyên"
      - "Mô tả trạng thái mong muốn của gói phần mềm, tệp và dịch vụ"
      - "Tổ chức inventory máy đích và nhóm cấu hình theo vai trò"
      - "Áp dụng biến, mẫu cấu hình và thứ tự ưu tiên có kiểm soát"
      - "Thiết kế tác vụ lặp an toàn và kiểm chứng khả năng hội tụ"
      - "Quản lý phụ thuộc giữa thay đổi cấu hình và khởi động lại dịch vụ"
      - "Sử dụng chế độ kiểm tra và xem khác biệt trước khi áp dụng"
      - "So sánh mô hình đẩy cấu hình và tác nhân tự đối soát định kỳ"
      - "So sánh cập nhật tại chỗ với thay thế bằng image đã chuẩn hóa"
      - "Quản lý image gốc, phiên bản cấu hình và lịch làm mới định kỳ"
      - "Phân định ranh giới giữa IaC, cấu hình hệ điều hành và triển khai ứng dụng"
  - level1: "Cấu hình, bí mật và hiện vật hạ tầng"
    level2:
      - "Phân loại cấu hình thông thường, dữ liệu nhạy cảm và thông tin bí mật"
      - "Tách bí mật khỏi kho Git, tệp tham số và image máy chủ"
      - "Quản lý nơi lưu bí mật và đường cấp bí mật vào quy trình vận hành"
      - "Ưu tiên định danh workload và thông tin xác thực có thời hạn ngắn"
      - "Phân quyền đọc bí mật theo dịch vụ, môi trường và nhu cầu thực tế"
      - "Luân chuyển khóa, mật khẩu và chứng chỉ với kế hoạch cập nhật bên sử dụng"
      - "Ngăn rò rỉ bí mật qua log, đầu ra, bản kế hoạch và hiện vật CI"
      - "Định danh và lưu trữ image, mẫu cấu hình cùng phiên bản đã kiểm tra"
      - "Quản lý vòng đời chứng chỉ từ cấp phát đến gia hạn và thu hồi"
  - level1: "Phân quyền và nền tảng bảo mật hạ tầng"
    level2:
      - "Phân biệt định danh con người, tài khoản dịch vụ và vai trò tự động hóa"
      - "Thiết kế quyền tối thiểu theo tài nguyên, hành động và môi trường"
      - "Phân tách người đề xuất, người phê duyệt và quyền thực thi thay đổi"
      - "Quản lý truy cập quản trị với xác thực mạnh và quyền có thời hạn"
      - "Thiết kế đường truy cập quản trị qua VPN hoặc máy trung chuyển"
      - "Kiểm soát quyền của pipeline và tránh dùng chung tài khoản quản trị"
      - "Thiết lập cấu hình bảo mật cơ sở cho hệ điều hành và dịch vụ"
      - "Bảo vệ dữ liệu khi truyền và khi lưu trữ cùng quyền sử dụng khóa"
      - "Rà soát cổng công khai, quyền quá rộng và tài nguyên sai cấu hình"
      - "Thu hồi quyền khi đổi vai trò, kết thúc dự án hoặc ngừng dịch vụ"
      - "Quản lý truy cập khẩn cấp và ghi nhận đầy đủ hoạt động sử dụng"
  - level1: "Kiểm soát thay đổi và tự động hóa triển khai hạ tầng"
    level2:
      - "Mô tả yêu cầu thay đổi cùng mục tiêu, phụ thuộc và tiêu chí thành công"
      - "Đánh giá phạm vi ảnh hưởng và rủi ro trước khi tạo kế hoạch"
      - "Xây dựng pipeline kiểm tra mã, lập kế hoạch và chờ phê duyệt phù hợp"
      - "Rà soát tác động của thay thế, hủy tài nguyên và thay đổi mạng"
      - "Ràng buộc bản kế hoạch được duyệt với đúng phiên bản mã và đầu vào"
      - "Ngăn chạy áp dụng đồng thời bằng hàng đợi và khóa trạng thái"
      - "Áp dụng thay đổi qua môi trường thử nghiệm trước khi đưa vào production"
      - "Triển khai theo đợt nhỏ và đặt điểm dừng khi kiểm tra sức khỏe thất bại"
      - "Lập phương án hoàn tác và phân biệt với sửa tiếp để đạt trạng thái an toàn"
      - "Xử lý thay đổi không thể hoàn tác trực tiếp hoặc có nguy cơ mất dữ liệu"
      - "Kiểm tra sau thay đổi và ghi nhận bằng chứng cùng người thực hiện"
      - "Đưa thay đổi khẩn cấp trở lại mã nguồn và quy trình rà soát"
  - level1: "Phát hiện drift và đối soát trạng thái"
    level2:
      - "Nhận diện drift do chỉnh tay, tác nhân tự động và thay đổi ngoài kho mã"
      - "Phân biệt drift của tài nguyên với sai lệch dữ liệu kiểm kê và trạng thái IaC"
      - "Đối chiếu mã, trạng thái IaC và hiện trạng bằng kế hoạch chỉ đọc"
      - "Kiểm tra sai lệch cấu hình hệ điều hành, tệp và dịch vụ"
      - "Lên lịch phát hiện drift và thông báo đúng chủ sở hữu"
      - "Phân loại sai lệch theo mức rủi ro và phạm vi ảnh hưởng"
      - "Lựa chọn khôi phục cấu hình chuẩn hoặc chấp nhận thay đổi qua mã"
      - "Khoanh vùng các trường do hệ thống khác quản lý và ghi rõ ngoại lệ"
      - "Ngăn tự động sửa drift gây gián đoạn hoặc mất dữ liệu"
      - "Lưu bằng chứng xử lý và xác minh trạng thái đã hội tụ"
  - level1: "Giám sát và khả năng quan sát hạ tầng"
    level2:
      - "Xác định tín hiệu sức khỏe theo tài nguyên, phụ thuộc và dịch vụ"
      - "Thu thập chỉ số CPU, bộ nhớ, tải hệ thống và trạng thái tiến trình"
      - "Theo dõi dung lượng, độ trễ, lỗi lưu trữ và nguy cơ đầy đĩa"
      - "Giám sát kết nối, băng thông, lỗi mạng, DNS và điểm truy cập"
      - "Tập trung log hệ thống, sự kiện hạ tầng và log kiểm toán truy cập"
      - "Gắn nhãn môi trường, tài nguyên và chủ sở hữu vào dữ liệu giám sát"
      - "Xây dựng dashboard từ nhu cầu vận hành và mục tiêu độ tin cậy"
      - "Thiết kế cảnh báo có ngưỡng, thời gian duy trì và hành động xử lý"
      - "Phân tuyến cảnh báo, kiểm soát nhiễu và tạm ngưng trong bảo trì"
      - "Giám sát hạn mức, thời hạn chứng chỉ và tình trạng tác vụ tự động"
      - "Kiểm tra chính hệ thống giám sát và xác minh cảnh báo hoạt động"
  - level1: "Sao lưu, phục hồi và khôi phục sau thảm họa"
    level2:
      - "Phân biệt tái tạo hạ tầng, sao lưu dữ liệu và khôi phục dịch vụ"
      - "Xác định tập dữ liệu, cấu hình, trạng thái IaC và thành phần cần sao lưu"
      - "Chuyển yêu cầu mất dữ liệu cho phép và thời gian gián đoạn thành RPO, RTO"
      - "Chọn cơ chế sao lưu phù hợp với tính nhất quán của từng hệ thống"
      - "Phân biệt snapshot, bản sao nhân bản và bản sao lưu độc lập"
      - "Lập lịch sao lưu, chính sách lưu giữ và quy tắc hết hạn bản sao"
      - "Cách ly bản sao lưu khỏi tài khoản và miền lỗi của hệ thống nguồn"
      - "Mã hóa bản sao lưu và kiểm soát khóa cùng quyền xóa hoặc khôi phục"
      - "Giám sát tác vụ sao lưu và kiểm tra khả năng đọc dữ liệu đã lưu"
      - "Xây dựng thứ tự phục hồi theo phụ thuộc mạng, định danh và dịch vụ"
      - "Diễn tập khôi phục trong môi trường cách ly và đo RPO, RTO thực tế"
      - "Cập nhật phương án khôi phục theo thay đổi hạ tầng và kết quả diễn tập"
  - level1: "Độ tin cậy và quản lý năng lực"
    level2:
      - "Xác định mục tiêu độ tin cậy của hạ tầng theo nhu cầu dịch vụ"
      - "Chọn mức dự phòng phù hợp với miền lỗi và ngân sách"
      - "Đánh giá giới hạn của một máy, một khu vực và các dịch vụ dùng chung"
