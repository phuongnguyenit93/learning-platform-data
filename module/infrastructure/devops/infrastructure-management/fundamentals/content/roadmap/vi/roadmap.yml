roadmap:
- id: kiem-ke-ha-tang
  title: Kiểm kê hạ tầng
  purpose: Nắm tài nguyên và phụ thuộc để quản lý hạ tầng có trách nhiệm.
  objectives:
  - Lập danh sách máy chủ, mạng, lưu trữ và dịch vụ.
  - Gắn owner, mục đích và vòng đời cho tài nguyên.
  - Vẽ sơ đồ phụ thuộc của một ứng dụng.
- id: moi-truong-baseline
  title: Môi trường & baseline
  purpose: Tách biệt các môi trường và chuẩn hóa cấu hình nền trước khi mở rộng.
  objectives:
  - Phân biệt dev, staging và production.
  - Thiết lập quy ước đặt tên, tag và cấu hình chuẩn.
  - Chỉ ra khác biệt về tài nguyên và quyền truy cập.
- id: trang-thai-mong-muon-iac
  title: Trạng thái mong muốn & IaC
  purpose: Biểu diễn hạ tầng bằng mã để triển khai lặp lại và kiểm soát thay đổi.
  objectives:
  - Phân biệt declarative với thao tác thủ công.
  - Viết cấu hình IaC cho một tài nguyên mẫu.
  - Thử quy trình write, plan và apply trong sandbox.
- id: cau-hinh-idempotency
  title: Cấu hình & idempotency
  purpose: Quản lý cấu hình hệ điều hành và dịch vụ nhất quán trên nhiều host.
  objectives:
  - Tổ chức inventory theo host và nhóm.
  - Chạy playbook cấu hình một dịch vụ thử nghiệm.
  - Kiểm tra chạy lại không gây thay đổi ngoài ý muốn.
- id: mang-iam-secrets
  title: Mạng, IAM & secrets
  purpose: Giảm rủi ro truy cập trái phép khi kết nối và vận hành hạ tầng.
  objectives:
  - Phác thảo phân đoạn mạng và firewall.
  - Áp dụng nguyên tắc least privilege cho tài khoản.
  - Lưu secret an toàn, không commit vào Git/state.
- id: git-kiem-soat-thay-doi
  title: Git & kiểm soát thay đổi
  purpose: Đưa mọi thay đổi hạ tầng qua quy trình review và phê duyệt minh bạch.
  objectives:
  - Version hóa cấu hình và tài liệu trong Git.
  - Tạo pull request kèm bản plan và đánh giá rủi ro.
  - Phân biệt thay đổi ứng dụng với thay đổi hạ tầng.
- id: drift-quan-sat-he-thong
  title: Drift & quan sát hệ thống
  purpose: Phát hiện sai lệch giữa cấu hình dự kiến và tình trạng vận hành thực tế.
  objectives:
  - Kiểm tra drift khi tài nguyên bị sửa ngoài quy trình.
  - Theo dõi metrics, logs và trạng thái dịch vụ.
  - Thiết lập cảnh báo cho một tình huống lỗi.
- id: van-hanh-phuc-hoi
  title: Vận hành & phục hồi
  purpose: Duy trì khả năng vận hành lâu dài và kiểm soát rủi ro, chi phí.
  objectives:
  - Viết runbook cho thay đổi và sự cố thường gặp.
  - Kiểm thử backup, restore và quy trình quay lui.
  - Theo dõi mức sử dụng, tag chi phí và lịch bảo trì.
