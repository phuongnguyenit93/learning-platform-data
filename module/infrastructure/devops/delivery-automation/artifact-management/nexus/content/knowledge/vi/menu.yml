  - Lập lịch compact hoặc thu gom theo loại blob store
  - Phân biệt xóa component với xóa từng asset
  - Theo dõi kết quả tác vụ và tốc độ tăng dung lượng
  - Giữ đủ artifact để dựng lại và quay về bản phát hành cần thiết
- level1: Quan sát hệ thống
  level2:
  - Đọc nhật ký ứng dụng, truy cập và kiểm toán theo khả năng hỗ trợ
  - Theo dõi trạng thái dịch vụ và các endpoint kiểm tra sẵn sàng
  - Đo độ trễ, tỷ lệ lỗi và tốc độ tải lên hoặc tải xuống
  - Theo dõi JVM, heap, thu gom rác và số luồng
  - Theo dõi cơ sở dữ liệu, dung lượng và độ trễ blob store
  - Giám sát proxy bị chặn, upstream lỗi và tỷ lệ dùng cache
  - Theo dõi tác vụ dọn dữ liệu, sao lưu và bảo trì
  - Phát hiện sử dụng vượt giới hạn hoặc lưu lượng xuất bản bất thường
  - Xây dựng cảnh báo và hướng dẫn điều tra theo ảnh hưởng đến pipeline
- level1: Hiệu năng
  level2:
  - Đo tải thực tế theo số yêu cầu và kích thước artifact
  - Phân biệt nghẽn CPU, bộ nhớ, cơ sở dữ liệu và lưu trữ
  - Điều chỉnh JVM theo hướng dẫn của phiên bản đang dùng
  - Quản lý số kết nối, thời gian chờ và tác vụ nền
  - Tối ưu đường truyền và cấu hình reverse proxy cho tệp lớn
  - Điều chỉnh cache dựa trên độ mới và độ ổn định nguồn
  - Tránh chạy tác vụ bảo trì nặng vào thời điểm tải cao
  - Kiểm thử tải với giới hạn và dữ liệu gần thực tế
- level1: Sao lưu và phục hồi
  level2:
  - Xác định mục tiêu mất dữ liệu cho phép và thời gian khôi phục
  - Sao lưu cơ sở dữ liệu cùng blob store tương ứng
  - Bảo toàn thư mục dữ liệu, cấu hình, khóa và định danh node cần thiết
  - Chọn phương án sao lưu H2 hoặc PostgreSQL theo tài liệu hiện hành
  - Giữ tính nhất quán khi sao lưu trong lúc hệ thống hoạt động
  - Phân biệt snapshot hạ tầng, sao chép lưu trữ và bản sao lưu độc lập
  - Phục hồi vào phiên bản và cấu hình tương thích
  - Kiểm chứng đăng nhập, tải artifact và xuất bản sau phục hồi
  - Đánh giá kế hoạch sửa dữ liệu chỉ khi có nguyên nhân và hướng dẫn phù hợp
  - Diễn tập phục hồi và ghi lại bằng chứng kiểm chứng
- level1: Nâng cấp và di chuyển
  level2:
  - Đọc release notes, cảnh báo bảo mật và đường nâng cấp được hỗ trợ
  - Kiểm tra thay đổi yêu cầu Java, cơ sở dữ liệu và hệ điều hành
  - Phân biệt nâng cấp ứng dụng với chuyển đổi cơ sở dữ liệu
  - Nhận diện OrientDB và kiến trúc cũ khi tiếp quản hệ thống
  - Sao lưu và thử nâng cấp trên môi trường cô lập
  - Kiểm tra plugin, API và công cụ tích hợp sau nâng cấp
  - Di chuyển máy chủ hoặc blob store bằng quy trình được hỗ trợ
  - Lập kế hoạch chuyển endpoint mà không làm gián đoạn công cụ build
  - Xác định giới hạn quay lui sau khi đã chuyển đổi lược đồ dữ liệu
- level1: Tính sẵn sàng
  level2:
  - Phân biệt một node có khả năng phục hồi với cụm sẵn sàng cao
  - Đối chiếu kiến trúc HA, giấy phép và phiên bản được hỗ trợ
  - Thiết kế cân bằng tải, kiểm tra sẵn sàng và dữ liệu dùng chung
  - Hiểu vì sao không thể tùy ý tăng số container dùng chung thư mục dữ liệu
  - Đánh giá proxy vùng, sao chép và dự phòng theo tính năng sẵn có
  - Xử lý mất upstream mà không giả định mọi artifact đã được cache
  - Diễn tập lỗi node, cơ sở dữ liệu và hệ thống lưu trữ
- level1: Xử lý lỗi
  level2:
  - Phân biệt HTTP 401, 403, 404, lỗi chính sách và lỗi máy chủ
  - Kiểm tra sai endpoint hoặc nhầm hosted, proxy và group
  - Chẩn đoán thiếu quyền add, edit hoặc quyền theo đường dẫn
  - Xử lý release bị từ chối ghi đè hoặc sai version policy
  - Xử lý artifact đã có ở upstream nhưng còn bị negative cache
  - Chẩn đoán Maven metadata hoặc checksum không khớp
  - Kiểm tra Gradle hoặc Maven vẫn truy cập kho ngoài Nexus
  - Xử lý lỗi chứng chỉ, chuyển hướng và xác thực qua reverse proxy
  - Chẩn đoán container push hoặc pull không đúng endpoint
  - Xử lý đầy đĩa, quyền thư mục và blob store không sẵn sàng
  - Kiểm tra tác vụ thất bại mà không tự sửa dữ liệu lưu trữ trực tiếp
  - Thu thập thông tin phiên bản, yêu cầu lỗi và nhật ký để tái hiện
- level1: Kiểm chứng
  level2:
  - Thiết kế bộ kiểm tra tải lên và tải xuống cho từng định dạng sử dụng
  - Kiểm tra release bất biến và snapshot theo chính sách
  - Kiểm tra phân quyền bằng nhiều vai trò riêng biệt
  - Kiểm tra proxy khi cache trống, cache có dữ liệu và upstream mất kết nối
  - Kiểm tra nguồn artifact trong repository group
  - Kiểm tra pipeline dùng Nexus từ môi trường không có cache cục bộ
  - Kiểm tra tính toàn vẹn và metadata của artifact xuất bản
  - Kiểm tra cleanup với dữ liệu đại diện trước khi dùng thực tế
  - Kiểm tra lại chức năng sau nâng cấp hoặc phục hồi
- level1: Thực hành
  level2:
  - Dựng Nexus bằng container với dữ liệu bền vững
  - Tạo bộ Maven release, snapshot, proxy và group
  - Xuất bản thư viện bằng Maven rồi sử dụng từ dự án độc lập
  - Xuất bản thư viện bằng Gradle cùng POM, sources và Javadoc
  - Tạo vai trò chỉ đọc và vai trò xuất bản có phạm vi hẹp
  - Tích hợp pipeline xuất bản bằng danh tính máy build
  - Thêm một hệ sinh thái như npm hoặc PyPI vào cùng hệ thống
  - Xuất bản và kéo image qua Nexus container registry
  - Thử nghiệm cache, phân quyền và lỗi xuất bản thường gặp
  - Thiết kế chính sách lưu giữ cùng kế hoạch sao lưu và phục hồi
  - Tự đánh giá độ đúng, khả năng tái tạo build và chi phí vận hành
