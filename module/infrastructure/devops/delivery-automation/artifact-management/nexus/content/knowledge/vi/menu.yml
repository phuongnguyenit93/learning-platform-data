  - Liệt kê repository, component và asset
  - Tìm kiếm có điều kiện và xử lý continuationToken
  - Tải lên component theo định dạng được API hỗ trợ
  - Tải xuống bằng định danh chính xác và xác minh checksum
  - Tạo hoặc cập nhật repository bằng API có kiểm tra trạng thái hiện tại
  - Quản lý tác vụ và theo dõi kết quả tự động hóa
  - Phân biệt REST API được hỗ trợ với Groovy scripting bị giới hạn
  - Thiết kế thao tác thử lại an toàn và xử lý lỗi từng bước
- level1: CI/CD
  level2:
