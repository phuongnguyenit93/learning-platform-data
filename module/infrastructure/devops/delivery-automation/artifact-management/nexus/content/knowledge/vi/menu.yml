  - Kiểm tra phạm vi content selector theo giao thức sử dụng
  - Kiểm tra tác động của quyền qua repository group
  - Tránh cấp wildcard hoặc quyền quản trị cho tài khoản CI
  - Phân tách quyền xuất bản release với xóa hoặc ghi đè dữ liệu
  - Kiểm chứng cả thao tác được phép và thao tác phải bị từ chối
- level1: Chuỗi cung ứng
