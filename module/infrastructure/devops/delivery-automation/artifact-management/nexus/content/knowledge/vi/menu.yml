  - Đánh giá user token hoặc cơ chế token theo edition và giao thức
  - Cấu hình realms và thứ tự xử lý xác thực
  - Tích hợp LDAP theo mô hình danh tính của tổ chức
  - Kiểm tra khả năng hỗ trợ SAML hoặc OIDC theo edition
  - Xác định phạm vi và rủi ro của truy cập ẩn danh
  - Luân chuyển, thu hồi và kiểm chứng thông tin xác thực
- level1: Phân quyền
