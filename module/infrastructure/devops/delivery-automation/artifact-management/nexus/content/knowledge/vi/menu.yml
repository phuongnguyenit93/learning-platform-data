  - Chọn phiên bản còn được hỗ trợ và lập danh sách khả năng cần dùng
- level1: Kiến trúc và dữ liệu
  level2:
  - Nhận diện ứng dụng Nexus, cơ sở dữ liệu và blob store
  - Phân biệt repository, component, asset và blob
  - Mối liên hệ giữa dữ liệu nhị phân với siêu dữ liệu
  - Phân biệt thư mục cài đặt và thư mục dữ liệu
  - Đọc luồng tải xuống qua proxy và luồng xuất bản vào hosted
  - Xác định cổng giao diện quản trị và endpoint giao thức kho
  - Phân biệt cấu hình hệ thống với cấu hình từng repository
  - Xác định ranh giới trách nhiệm giữa Nexus, công cụ build và CI
- level1: Cài đặt
  level2:
  - Kiểm tra yêu cầu hệ điều hành, Java và kiến trúc máy theo phiên bản
  - Ước lượng CPU, RAM, dung lượng và hiệu năng lưu trữ
  - Cài đặt từ bản phân phối chính thức và kiểm tra tính toàn vẹn
  - Khởi chạy bằng container với phiên bản image được ghim
  - Gắn vùng lưu trữ bền vững và thiết lập quyền thư mục
  - Chạy bằng tài khoản hệ thống có quyền phù hợp
  - Tổ chức cấu hình môi trường và tham số JVM
  - Chạy như dịch vụ và kiểm tra quá trình khởi động
  - Phân biệt môi trường thực hành với yêu cầu triển khai thực tế
- level1: Quản trị ban đầu
  level2:
  - Đăng nhập ban đầu và thay thông tin quản trị mặc định
  - Làm quen giao diện Browse, Search và Administration
  - Xác định thông tin phiên bản, giấy phép và trạng thái hệ thống
  - Kiểm tra các repository mặc định trước khi sử dụng
  - Thiết lập truy cập ẩn danh theo chính sách tổ chức
  - Tạo tài khoản dùng thử chỉ có quyền cần thiết
  - Kiểm chứng tải lên và tải xuống một artifact đầu tiên
- level1: Mô hình repository
  level2:
  - 'Hosted: lưu artifact mà tổ chức sở hữu và xuất bản'
  - 'Proxy: truy cập và lưu đệm artifact từ kho nguồn'
  - 'Group: cung cấp điểm truy cập chung cho nhiều repository'
  - Phân biệt định dạng kho với loại hosted, proxy hoặc group
  - Đọc ma trận hỗ trợ loại kho của từng định dạng
  - Quy ước đặt tên, URL và chủ sở hữu repository
  - Thiết kế kho theo nhóm phát triển, sản phẩm và mức tin cậy
  - Chọn endpoint đọc và endpoint xuất bản theo giao thức
  - Tránh tạo quá nhiều kho mà không có ranh giới quản trị rõ ràng
- level1: Lưu trữ
  level2:
  - Lựa chọn cơ sở dữ liệu được hỗ trợ theo phiên bản và edition
  - Phân biệt H2 nhúng với PostgreSQL bên ngoài
  - Tạo và gán blob store cho repository
  - Đánh giá blob store dạng tệp và lưu trữ đối tượng theo khả năng hỗ trợ
  - Tổ chức dung lượng cho dữ liệu, cơ sở dữ liệu, nhật ký và tệp tạm
  - Đặt ngưỡng theo dõi và cảnh báo dung lượng
  - Hiểu tác động của độ trễ lưu trữ lên tải lên và tải xuống
  - Kiểm tra ràng buộc khi thay đổi hoặc di chuyển blob store
  - Không sửa hoặc xóa trực tiếp tệp blob để quản lý artifact
- level1: Kho Maven
  level2:
  - Hiểu tọa độ groupId, artifactId, version, classifier và extension
  - Phân biệt một component Maven với các asset đi kèm
  - Tạo Maven hosted dành cho release
  - Tạo Maven hosted dành cho snapshot
  - Tạo proxy đến Maven Central hoặc kho Maven bên ngoài
  - Tạo group làm endpoint tải phụ thuộc dùng chung
  - Cấu hình version policy, layout policy và kiểm tra kiểu nội dung
  - Chọn deployment policy và kiểm soát ghi đè phiên bản
  - Hiểu cấu trúc đường dẫn và maven-metadata.xml
  - Kiểm tra POM, JAR, sources và Javadoc sau khi xuất bản
- level1: Maven client
  level2:
  - Cấu hình mirror trong settings.xml để tải qua Nexus
  - Phân biệt repository tải thư viện và pluginRepository
  - Đặt thông tin xác thực trong server theo đúng id
  - Cấu hình distributionManagement cho release và snapshot
  - Xuất bản bằng Maven Deploy Plugin
  - Đưa thư viện bên thứ ba vào hosted với tọa độ và POM phù hợp
  - Kiểm tra phụ thuộc trực tiếp và phụ thuộc bắc cầu từ máy sạch
  - Phân biệt bộ nhớ đệm .m2 cục bộ với bộ nhớ đệm Nexus
  - Chẩn đoán endpoint, profile và thông tin cấu hình Maven hiệu lực
- level1: Gradle
  level2:
  - Khai báo repository Maven của Nexus để phân giải thư viện
  - Quản lý repository tập trung trong settings.gradle
  - Phân biệt pluginManagement với dependencyResolutionManagement
  - Sử dụng maven-publish để tạo MavenPublication
  - Khai báo tọa độ, thành phần Java và thông tin POM
  - Xuất bản sources, Javadoc và siêu dữ liệu cần thiết
  - Chọn kho release hoặc snapshot theo phiên bản artifact
  - Truyền thông tin xác thực qua biến môi trường hoặc cấu hình riêng
  - Áp dụng bộ lọc nội dung để chọn nguồn phụ thuộc phù hợp
  - Kiểm chứng thư viện đã xuất bản từ một dự án sử dụng độc lập
- level1: Quy trình xuất bản
  level2:
  - Phân biệt tạo artifact, tải lên và công bố cho bên sử dụng
  - Đặt phiên bản phát hành và phiên bản phát triển nhất quán
  - Giữ release bất biến và xác định quy tắc cập nhật snapshot
  - Xuất bản đủ dữ liệu nhị phân cùng siêu dữ liệu phụ thuộc
  - Kiểm tra checksum, chữ ký và nội dung theo yêu cầu dự án
  - Xử lý lần tải lên thất bại hoặc chỉ hoàn tất một phần
  - Đánh giá việc thử lại khi không rõ kết quả xuất bản
  - Liên kết artifact với commit nguồn và lần chạy build
  - Tránh đồng nhất kho Nexus nội bộ với quy trình xuất bản Maven Central
- level1: Proxy và cache
  level2:
  - Cấu hình kho nguồn, xác thực upstream và kết nối HTTP
  - Hiểu thời hạn bộ nhớ đệm component và metadata
  - Hiểu negative cache khi artifact chưa tồn tại
  - Phân biệt làm mới cache với xóa artifact đã lưu
  - Xử lý snapshot hoặc metadata thay đổi ở kho nguồn
  - Kiểm tra tự động chặn upstream và trạng thái kết nối
  - Đánh giá khả năng phục vụ khi kho nguồn mất kết nối
  - Phân biệt proxy cache với bản sao đầy đủ của kho nguồn
  - Cân bằng độ mới dữ liệu với số lần gọi upstream
  - Kiểm tra chính sách cache sau khi thay cấu hình hoặc phiên bản
- level1: Group và định tuyến
  level2:
  - Sắp xếp thứ tự thành viên trong group theo nguồn ưu tiên
  - Hiểu tác động khi cùng tọa độ xuất hiện ở nhiều kho
  - Phân biệt quyền truy cập qua group và truy cập trực tiếp thành viên
  - Thiết kế group dùng chung mà vẫn kiểm soát nguồn nội bộ
  - Dùng routing rule để giới hạn đường dẫn được lấy từ upstream
  - Phân biệt quy tắc định tuyến với content selector
  - Kiểm tra repository lồng nhau và tránh cấu hình khó truy vết
  - Xác minh nguồn artifact thực tế thay vì chỉ kiểm tra URL group
- level1: npm
  level2:
  - Tạo npm hosted, proxy và group theo mô hình sử dụng
  - Cấu hình registry và phạm vi gói trong .npmrc
  - Thiết lập realm và cơ chế xác thực phù hợp cho npm
  - Xuất bản gói nội bộ và cài đặt qua endpoint đọc
  - Kiểm soát namespace để hạn chế nhầm gói nội bộ với gói công khai
  - Phân biệt nội dung gói, metadata và phiên bản phát hành
  - Quản lý thông tin xác thực npm trong CI
  - Kiểm chứng cài đặt từ môi trường không có cache cục bộ
- level1: Container
  level2:
  - Xác định phạm vi hỗ trợ Docker và OCI theo phiên bản
  - Tạo kho container hosted, proxy và group phù hợp
  - Chọn phương án endpoint qua cổng, tên miền hoặc reverse proxy
  - Cấu hình xác thực registry và kiểm tra Docker Bearer Token Realm
  - Đăng nhập, gắn tên image, đẩy và kéo image
  - Phân biệt tag thay đổi được với digest định danh nội dung
  - Kiểm tra manifest, lớp image và dung lượng lưu trữ
  - Kiểm tra điều kiện hỗ trợ xuất bản qua group trước khi sử dụng
  - Giới hạn phạm vi Nexus registry với các nội dung container chuyên sâu
- level1: Python và NuGet
  level2:
  - Tạo PyPI hosted, proxy và group theo khả năng hỗ trợ
  - Cấu hình pip để tải thư viện qua Nexus
  - Xuất bản gói Python bằng twine và xác thực phù hợp
  - Kiểm tra metadata và nguy cơ nhầm nguồn gói Python
  - Tạo NuGet hosted, proxy và group
  - Chọn endpoint NuGet v2 hoặc v3 theo nhu cầu công cụ
  - Cấu hình nguồn gói, xác thực và xuất bản gói .NET
  - Kiểm chứng tải phụ thuộc của Python và .NET từ môi trường sạch
- level1: Định dạng mở rộng
  level2:
  - Đọc ma trận định dạng trước khi thiết kế kho mới
  - Quản lý Helm chart và phân biệt kho Helm với artifact OCI
  - Quản lý gói hệ điều hành APT và Yum theo loại kho được hỗ trợ
  - Thiết lập Go modules và phạm vi mô-đun riêng
  - Thiết lập Rust Cargo và nguồn crate nội bộ
  - Đánh giá Conan, Conda, Composer và RubyGems theo hệ sinh thái
  - Nhận diện các định dạng khác như Ansible, Alpine và Hugging Face
  - Phân biệt khả năng tích hợp chính thức với plugin cộng đồng
  - Kiểm tra công cụ khách, xác thực và metadata riêng của từng định dạng
- level1: Kho Raw
  level2:
