  - Dùng phiên bản duy nhất và kiểm soát hai lần chạy xuất bản đồng thời
  - Dựng một lần và dùng cùng artifact qua các môi trường
  - Kiểm tra kết quả xuất bản trước khi cho bước triển khai tiếp tục
  - Lưu thông tin truy vết giữa commit, pipeline và artifact
