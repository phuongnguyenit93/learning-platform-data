  - Phân biệt TLS phía công cụ khách với TLS đến upstream
  - Kiểm tra truststore của JVM và kho chứng chỉ hệ điều hành
  - Điều chỉnh header chuyển tiếp, đường dẫn ngữ cảnh và chuyển hướng
  - Cấu hình HTTP proxy cho kết nối ra ngoài
  - Xử lý giới hạn kích thước yêu cầu và thời gian tải lên
  - Tách mạng quản trị với truy cập artifact theo kiến trúc
  - Kiểm chứng các giao thức kho qua cùng hạ tầng mạng
- level1: API và tự động hóa
