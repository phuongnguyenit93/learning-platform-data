  - Tạo Raw hosted, proxy hoặc group theo nhu cầu
  - Tổ chức đường dẫn và quy ước phiên bản cho tệp phân phối
  - Tải lên và tải xuống tệp bằng HTTP hoặc API được hỗ trợ
  - Lưu gói ZIP, tài liệu và tệp kiểm chứng đi kèm
  - Kiểm tra kiểu nội dung, checksum và quyền truy cập
