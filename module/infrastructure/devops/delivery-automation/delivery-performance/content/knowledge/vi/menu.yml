menu:
  - level1: "Nền tảng hiệu quả phân phối"
    level2:
      - "Hiệu quả phân phối phần mềm và mối liên hệ giữa tốc độ, độ ổn định và giá trị"
      - "Bốn chỉ số DORA: tần suất triển khai, thời gian đưa thay đổi, tỷ lệ lỗi và thời gian phục hồi"
      - "Phân biệt hiệu quả phân phối với năng suất cá nhân và mức độ bận rộn của đội ngũ"
      - "Phân biệt hiệu quả phân phối, độ tin cậy vận hành và kết quả kinh doanh"
      - "Phân biệt triển khai mã nguồn với phát hành tính năng cho người dùng"
      - "Đọc đồng thời các chỉ số tốc độ và ổn định để tránh tối ưu lệch"
      - "Đánh giá chỉ số trong bối cảnh sản phẩm, kiến trúc và yêu cầu tuân thủ"
      - "Chu trình đo lường, hình thành giả thuyết, cải tiến và kiểm chứng kết quả"
  - level1: "Phạm vi và quy ước đo"
    level2:
      - "Chọn đơn vị đo theo dịch vụ, sản phẩm, nhóm và luồng giá trị"
      - "Xác định môi trường production và ranh giới thay đổi tác động đến người dùng"
      - "Thống nhất định nghĩa thay đổi, lần triển khai, lỗi thay đổi và phục hồi"
      - "Quy định thời điểm bắt đầu và kết thúc cho từng chỉ số"
      - "Xác định cách tính ngày lịch, giờ làm việc, múi giờ và lịch bảo trì"
      - "Quy định phạm vi cho mã ứng dụng, cấu hình, hạ tầng và thay đổi dữ liệu"
      - "Xây dựng từ điển chỉ số gồm công thức, đơn vị, nguồn và quy tắc loại trừ"
      - "Quản lý phiên bản định nghĩa để duy trì khả năng so sánh theo thời gian"
  - level1: "Mô hình sự kiện phân phối"
    level2:
      - "Mô hình hóa commit, pull request, bản dựng, artifact, deployment và incident"
      - "Thiết kế định danh ổn định cho dịch vụ, môi trường, phiên bản và sự kiện"
      - "Liên kết commit với artifact và deployment bằng thông tin nguồn gốc bản dựng"
      - "Biểu diễn quan hệ nhiều commit trong một deployment và nhiều dịch vụ trong một release"
      - "Liên kết deployment với sự cố, rollback và bản vá có bằng chứng"
      - "Phân biệt thời gian sự kiện xảy ra với thời gian hệ thống nhận dữ liệu"
      - "Thiết kế trạng thái, kết quả và chuyển tiếp của vòng đời deployment"
      - "Xử lý sự kiện trùng, đến muộn, sai thứ tự và được cập nhật sau khi ghi nhận"
  - level1: "Kiến trúc dữ liệu đo lường"
    level2:
      - "Thiết kế luồng từ hệ thống nguồn đến kho sự kiện, mô hình chỉ số và dashboard"
      - "Lựa chọn webhook, truy vấn API định kỳ hoặc kết hợp theo đặc điểm nguồn"
      - "Tổ chức dữ liệu thô, dữ liệu chuẩn hóa và bảng tổng hợp có thể truy vết"
      - "Thiết kế bảng sự kiện và bảng chiều cho dịch vụ, nhóm và môi trường"
      - "Xây dựng phép nối commit, deployment và incident để tính các chỉ số DORA"
      - "Tính toán theo lô hoặc gần thời gian thực với yêu cầu độ trễ phù hợp"
      - "Thiết kế nạp bù, tính lại lịch sử và xử lý thay đổi lược đồ dữ liệu"
      - "Cân đối chi phí lưu trữ, thời gian lưu giữ và độ chi tiết phục vụ phân tích"
  - level1: "Dữ liệu từ Git"
    level2:
      - "Thu thập commit, nhánh, tag, pull request và lịch sử hợp nhất"
      - "Phân biệt thời điểm tác giả tạo commit, ghi commit và hợp nhất thay đổi"
      - "Ánh xạ repository và đường dẫn mã nguồn đến dịch vụ trong monorepo"
      - "Xử lý squash merge, rebase và cherry-pick khi truy vết thay đổi"
      - "Xác định tập commit mới xuất hiện giữa hai phiên bản triển khai"
      - "Đo thời gian chờ review, thời gian review và thời gian chờ hợp nhất"
      - "Nhận diện thay đổi tự động, cập nhật phụ thuộc và commit không tác động production"
      - "Đối soát lịch sử Git thiếu dữ liệu hoặc bị viết lại mà không làm sai số đo"
  - level1: "Dữ liệu từ CI/CD"
    level2:
      - "Thu thập pipeline run, job, trạng thái, thời lượng và môi trường đích"
      - "Phân biệt build thành công, deployment thành công và phát hành thành công"
      - "Gắn mã commit, artifact digest và deployment ID xuyên suốt pipeline"
      - "Ghi nhận thời gian xếp hàng, thực thi, phê duyệt và chờ triển khai"
      - "Nhận diện chạy lại, retry, hủy tác vụ và deployment không tạo thay đổi mới"
      - "Chuẩn hóa sự kiện từ nhiều công cụ CI/CD và cơ chế triển khai thủ công"
      - "Bổ sung dữ liệu cho canary, blue-green và các đợt triển khai từng phần"
      - "Kiểm tra tính đầy đủ của deployment production bằng đối soát hệ thống chạy thực tế"
  - level1: "Dữ liệu vận hành và sự cố"
    level2:
      - "Thu thập sự cố từ hệ thống trực ca, quản lý incident và hỗ trợ khách hàng"
      - "Kết hợp log, metric, trace và dấu mốc triển khai để điều tra tác động"
      - "Ghi nhận thời điểm tác động bắt đầu, phát hiện, giảm thiểu và phục hồi"
      - "Xác định mức độ nghiêm trọng và phạm vi người dùng hoặc dịch vụ bị ảnh hưởng"
      - "Sử dụng SLI, SLO và tín hiệu nghiệp vụ để xác minh dịch vụ phục hồi"
      - "Xác nhận quan hệ giữa thay đổi và sự cố qua điều tra hoặc hậu kiểm"
      - "Ghi nhận rollback, roll-forward, tắt tính năng và can thiệp thủ công"
      - "Quản lý sự cố đồng thời, sự cố mở lại và sự cố không do thay đổi triển khai"
  - level1: "Chất lượng dữ liệu"
    level2:
      - "Đánh giá độ đầy đủ, chính xác, nhất quán và kịp thời của dữ liệu"
      - "Phát hiện deployment thiếu commit, sự cố thiếu liên kết và dịch vụ chưa được ánh xạ"
      - "Chuẩn hóa múi giờ, kiểm tra lệch đồng hồ và phát hiện thời lượng âm"
      - "Khử trùng lặp bằng định danh nguồn và bảo đảm nạp lại không tạo bản ghi mới"
      - "Phân biệt giá trị bằng không, dữ liệu chưa có và chỉ số không xác định"
      - "Đối chiếu mẫu thủ công giữa Git, CI/CD, hệ thống vận hành và dashboard"
      - "Theo dõi độ phủ dữ liệu và đánh dấu chỉ số có độ tin cậy thấp"
      - "Xử lý sai lệch do đổi công cụ, đổi nhóm hoặc thay đổi định nghĩa chỉ số"
  - level1: "Tần suất triển khai"
    level2:
      - "Định nghĩa Deployment Frequency và đơn vị deployment production hợp lệ"
      - "Tính số lần triển khai theo ngày, tuần hoặc kỳ quan sát đã thống nhất"
      - "Phân biệt số deployment, số ngày có triển khai và khoảng cách giữa các lần triển khai"
      - "Quy tắc đếm deployment thành công, thất bại, rollback và hotfix theo từ điển chỉ số"
      - "Tránh đếm lặp theo pod, máy chủ, vùng hoặc bước rollout của cùng một deployment"
      - "Diễn giải thời kỳ không triển khai, lịch đóng băng và mùa vụ sản phẩm"
      - "Tổng hợp tần suất giữa dịch vụ mà vẫn giữ khác biệt về quy mô và bối cảnh"
      - "Đọc tần suất cùng kích thước lô thay đổi, tỷ lệ lỗi và nhu cầu phát hành"
  - level1: "Thời gian đưa thay đổi"
    level2:
      - "Định nghĩa Lead Time for Changes và phân biệt với thời gian từ ý tưởng đến giá trị"
      - "Tính thời lượng từ commit theo quy ước đến khi thay đổi chạy thành công trên production"
      - "Ghép từng commit với lần triển khai production đầu tiên chứa thay đổi đó"
      - "Xử lý một deployment chứa nhiều commit có thời gian chờ khác nhau"
      - "Phân rã thời gian viết mã, review, kiểm thử, phê duyệt và chờ phát hành"
      - "Đọc trung vị, phân vị cao và phân bố để nhận diện nhóm thay đổi chậm"
      - "Xử lý thay đổi chưa triển khai, thay đổi bị hủy và khoảng quan sát chưa hoàn tất"
      - "Phân tích độ trễ giữa triển khai mã và bật tính năng cho người dùng"
  - level1: "Tỷ lệ lỗi thay đổi"
    level2:
      - "Định nghĩa Change Failure Rate và tiêu chí thay đổi cần hành động khắc phục"
      - "Tính tỷ lệ deployment gây lỗi trên tổng deployment đủ điều kiện trong cùng phạm vi"
      - "Xác định cửa sổ phát hiện lỗi và quy tắc gán lỗi cho deployment"
      - "Nhận diện rollback, hotfix và suy giảm dịch vụ đáp ứng tiêu chí lỗi thay đổi"
      - "Phân biệt lỗi trên production với pipeline thất bại trước khi tác động người dùng"
      - "Xử lý một deployment gây nhiều sự cố và một sự cố liên quan nhiều deployment"
      - "Diễn giải mẫu số nhỏ, kỳ không deployment và lỗi được phát hiện muộn"
      - "Phân tích tỷ lệ lỗi cùng mức độ ảnh hưởng để tránh xem mọi lỗi như nhau"
  - level1: "Thời gian phục hồi"
    level2:
      - "Định nghĩa thời gian phục hồi sau deployment lỗi và phân biệt với MTTR của mọi sự cố"
      - "Thống nhất mốc bắt đầu theo tác động hoặc deployment lỗi và mốc xác nhận phục hồi"
      - "Tính thời lượng từng trường hợp rồi tổng hợp bằng thống kê phù hợp"
      - "Phân rã thời gian phát hiện, huy động, chẩn đoán, khắc phục và xác minh"
      - "Phân biệt giảm thiểu tác động, khôi phục dịch vụ và sửa nguyên nhân gốc"
      - "Đo phục hồi qua rollback, roll-forward, failover và tắt tính năng"
      - "Xử lý sự cố chưa đóng, tái phát, phục hồi từng phần và nhiều dịch vụ phụ thuộc"
      - "Đọc phân vị thời gian phục hồi theo mức độ nghiêm trọng và giờ trực vận hành"
  - level1: "Bối cảnh triển khai"
    level2:
      - "Đo lường nhất quán giữa triển khai thủ công, theo lịch và liên tục"
      - "Xác định ranh giới deployment khi canary hoặc blue-green chuyển lưu lượng từng bước"
      - "Theo dõi nhiều vùng và nhiều cụm mà không nhân bản số lần triển khai"
      - "Tách deployment mã khỏi thời điểm bật feature flag và thử nghiệm tính năng"
      - "Đo dịch vụ độc lập trong monorepo và release phối hợp nhiều microservice"
      - "Xử lý ứng dụng di động, phần mềm đóng gói và độ trễ phân phối đến người dùng"
      - "Đưa thay đổi hạ tầng, cấu hình và migration dữ liệu vào phạm vi có quy ước rõ ràng"
      - "Giữ khả năng so sánh khi chuyển kiến trúc hoặc thay đổi chiến lược phát hành"
  - level1: "Thống kê và cửa sổ đo"
    level2:
      - "Lựa chọn kỳ cố định và cửa sổ trượt theo nhịp phát hành của sản phẩm"
      - "Phân biệt đơn vị quan sát theo commit, deployment, sự cố và dịch vụ"
      - "Sử dụng trung bình, trung vị và phân vị phù hợp với phân bố lệch"
      - "Hiển thị cỡ mẫu và khoảng bất định khi so sánh các kỳ"
      - "Tổng hợp tỷ lệ bằng tử số và mẫu số thay vì lấy trung bình tỷ lệ tùy ý"
      - "Phát hiện ngoại lệ và kiểm tra nguyên nhân trước khi loại khỏi dữ liệu"
      - "Điều chỉnh cách diễn giải theo mùa vụ, ngày nghỉ và thay đổi tải công việc"
      - "Nhận diện sai lệch chọn mẫu, dữ liệu chưa hoàn tất và nghịch lý khi gộp nhóm"
  - level1: "Đường cơ sở và mục tiêu"
    level2:
      - "Thiết lập đường cơ sở từ giai đoạn có dữ liệu đủ ổn định và đầy đủ"
      - "Phân đoạn đường cơ sở theo dịch vụ, loại thay đổi và mức rủi ro"
      - "Chuyển vấn đề phân phối thành mục tiêu có thời hạn và tiêu chí thành công"
      - "Đặt mục tiêu tốc độ đi kèm giới hạn tỷ lệ lỗi và độ tin cậy"
      - "Kết nối mục tiêu cải tiến với SLO, error budget và nhu cầu sản phẩm"
      - "Sử dụng benchmark có bối cảnh và kiểm tra phiên bản định nghĩa trước khi so sánh"
      - "Đánh giá tiến bộ của cùng một hệ thống qua thời gian trước khi so sánh giữa nhóm"
      - "Hiệu chỉnh mục tiêu khi có thay đổi lớn về kiến trúc, phạm vi hoặc nguồn lực"
  - level1: "Bản đồ luồng giá trị"
    level2:
      - "Xác định ranh giới luồng từ yêu cầu đến giá trị và vị trí của các chỉ số DORA"
      - "Lập bản đồ các bước phát triển, review, kiểm thử, phê duyệt, triển khai và phản hồi"
      - "Đo thời gian xử lý thực tế và thời gian chờ tại từng công đoạn"
      - "Đánh dấu bàn giao, vòng lặp làm lại và phụ thuộc giữa các nhóm"
      - "Liên kết dữ liệu sự kiện với phỏng vấn người thực hiện để kiểm chứng bản đồ"
      - "Tính hiệu suất dòng chảy và nhận diện phần thời gian chưa tạo giá trị"
      - "Xây dựng bản đồ hiện trạng và trạng thái mong muốn có mục tiêu đo lường"
      - "Ưu tiên cơ hội cải tiến theo tác động toàn luồng và công sức thực hiện"
  - level1: "Nút thắt và công việc dở dang"
    level2:
      - "Phân biệt nút thắt năng lực, hàng đợi, phụ thuộc và biến động nhu cầu"
      - "Theo dõi WIP, tuổi công việc và thời gian chu kỳ theo từng trạng thái"
      - "Áp dụng định luật Little với điều kiện ổn định và đơn vị đo nhất quán"
      - "Phân tích tác động của lô thay đổi lớn và phát hành theo đợt"
      - "Nhận diện quá tải review, môi trường kiểm thử dùng chung và cổng phê duyệt"
      - "Đánh giá ảnh hưởng của chuyển ngữ cảnh, ưu tiên khẩn cấp và công việc làm lại"
      - "Thử giới hạn WIP, giảm kích thước lô và cân bằng năng lực tại nút thắt"
      - "Kiểm tra nút thắt dịch chuyển sau cải tiến và tác động đến toàn bộ luồng"
  - level1: "Phân tích nguyên nhân"
    level2:
      - "Đặt câu hỏi phân tích từ biểu hiện chỉ số thay vì suy đoán nguyên nhân"
      - "Phân tách dữ liệu theo dịch vụ, loại thay đổi, pipeline và khung thời gian"
      - "Đối chiếu biến động chỉ số với thay đổi công cụ, quy trình và tổ chức"
      - "Phân biệt tương quan với quan hệ nhân quả khi đánh giá thực hành kỹ thuật"
      - "Phân tích Pareto cho nguyên nhân lỗi, thời gian chờ và hoạt động làm lại"
      - "Kết hợp truy vết sự kiện, hậu kiểm sự cố và phản hồi của nhóm"
      - "Xây dựng cây giả thuyết và xác định dữ liệu cần bổ sung để kiểm chứng"
      - "Ước tính tác động, độ tin cậy và chi phí để xếp thứ tự vấn đề cần xử lý"
  - level1: "Dashboard hiệu quả phân phối"
    level2:
      - "Thiết kế dashboard theo nhu cầu của nhóm phát triển, vận hành và lãnh đạo"
      - "Trình bày đồng thời bốn chỉ số DORA, xu hướng, cỡ mẫu và phạm vi đo"
      - "Hiển thị phân bố thời gian đưa thay đổi và phục hồi bên cạnh số tổng hợp"
      - "Bổ sung chỉ số chẩn đoán về hàng đợi, kích thước lô và thời gian pipeline"
      - "Cho phép đi từ số liệu tổng hợp đến deployment, commit và incident nguồn"
