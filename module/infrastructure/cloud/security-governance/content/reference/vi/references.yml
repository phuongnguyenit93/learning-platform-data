references:
  - title: "NIST — Cybersecurity Framework (CSF) 2.0"
    url: "https://www.nist.gov/cyberframework"
    description: "Khung Govern, Identify, Protect, Detect, Respond, Recover giúp đánh giá và quản trị rủi ro an ninh mạng."
  - title: "Cloud Security Alliance — Cloud Controls Matrix"
    url: "https://cloudsecurityalliance.org/research/cloud-controls-matrix"
    description: "Ma trận kiểm soát bảo mật dành cho cloud để lập baseline, đánh giá và lập bằng chứng tuân thủ."
  - title: "NIST SP 800-207 — Zero Trust Architecture"
    url: "https://csrc.nist.gov/pubs/sp/800/207/final"
    description: "Nguyên tắc truy cập dựa trên danh tính, tài nguyên và kiểm tra xác thực/phân quyền liên tục."
  - title: "AWS — Well-Architected Security Pillar"
    url: "https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/welcome.html"
    description: "Các thực hành bảo mật AWS về danh tính, phát hiện, bảo vệ dữ liệu, hạ tầng và ứng phó sự cố."
  - title: "Microsoft — Build a Cloud Governance Team"
    url: "https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/govern/build-cloud-governance-team"
    description: "Xác định trách nhiệm nhóm quản trị, đánh giá rủi ro, chính sách và cải tiến quản trị cloud."
  - title: "Google Cloud — Enterprise Foundations Blueprint"
    url: "https://docs.cloud.google.com/architecture/blueprints/security-foundations"
    description: "Blueprint hạ tầng tổ chức, guardrails và baseline bảo mật cho môi trường Google Cloud."