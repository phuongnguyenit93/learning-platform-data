roadmap:
- id: ip-cidr-vung-dia-chi
  title: IP, CIDR & Vùng địa chỉ
  purpose: Nắm địa chỉ mạng và cách chia dải IP trước khi tạo hạ tầng cloud.
  objectives:
  - Phân biệt private/public IP và IPv4/IPv6.
  - Đọc CIDR, tính dải subnet và tránh trùng địa chỉ.
  - Giải thích TCP/UDP, port và đường đi gói tin.
- id: vpc-vnet-subnet
  title: VPC/VNet & Subnet
  purpose: Thiết kế mạng riêng ảo và phân tách tài nguyên theo tầng ứng dụng.
  objectives:
  - Tạo VPC/VNet và phân chia subnet theo mục đích.
  - Phân biệt subnet public với private theo tuyến mạng.
  - Nhận diện phạm vi region của từng cloud provider.
- id: route-internet-nat
  title: Route, Internet & NAT
  purpose: Kiểm soát lưu lượng giữa subnet, internet và các mạng khác.
  objectives:
  - Đọc route table, destination CIDR và next hop.
  - Phân biệt Internet Gateway, NAT Gateway và IP công khai.
  - Kiểm tra đường ra internet cho tài nguyên private.
- id: firewall-phan-vung
  title: Firewall & Phân vùng
  purpose: Giới hạn luồng kết nối bằng nguyên tắc chỉ mở quyền cần thiết.
  objectives:
  - Cấu hình rule ingress/egress theo IP, port và protocol.
  - So sánh AWS Security Group, Azure NSG và GCP firewall.
  - Thử chặn truy cập trực tiếp từ internet tới database.
- id: dns-cong-khai-noi-bo
  title: DNS công khai & nội bộ
  purpose: Phân giải tên dịch vụ và chọn cách định tuyến DNS phù hợp.
  objectives:
  - Phân biệt DNS public và private zone.
  - Tạo hoặc đọc bản ghi A, CNAME và TTL.
  - Kiểm tra phân giải tên bằng nslookup hoặc dig.
- id: load-balancer-l4-l7
  title: Load Balancer L4/L7
  purpose: Phân phối truy cập và tăng tính sẵn sàng cho ứng dụng.
  objectives:
  - Phân biệt cân bằng tải L4 TCP/UDP và L7 HTTP/HTTPS.
  - Cấu hình backend pool và health check.
  - Giải thích TLS termination và đường truyền tới backend.
- id: private-link-peering-vpn
  title: Private Link, Peering & VPN
  purpose: Kết nối hệ thống riêng tư và mở rộng kết nối tới on-premises.
  objectives:
  - Phân biệt private endpoint, VPC/VNet peering và site-to-site VPN.
  - Tránh dải IP trùng nhau ở các mạng cần định tuyến.
  - Chọn kênh kết nối theo bảo mật và nhu cầu lưu lượng.
- id: flow-logs-chan-doan
  title: Flow Logs & Chẩn đoán
  purpose: Theo dõi lưu lượng và tìm nguyên nhân lỗi kết nối theo từng lớp.
  objectives:
  - Bật hoặc đọc flow log cho lưu lượng cho phép và từ chối.
  - Kiểm tra lần lượt DNS, route, firewall và cổng ứng dụng.
  - Đo độ trễ và nhận diện các kết nối thất bại.
- id: lab-kien-truc-chi-phi
  title: Lab kiến trúc & Chi phí
  purpose: Tổng hợp kiến thức để thiết kế mạng cloud có thể kiểm tra và vận hành.
  objectives:
  - Vẽ kiến trúc web–app–database theo subnet và luồng kết nối.
  - Kiểm thử cân bằng tải, phân vùng mạng và truy cập riêng.
  - Ước tính phí NAT, load balancer, truyền dữ liệu và dọn lab.
