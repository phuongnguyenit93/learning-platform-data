references:
  - title: "FinOps Framework"
    url: "https://www.finops.org/framework/"
    description: "Nguyên tắc, personas, domains và capabilities quản trị chi phí cloud."
  - title: "FinOps Phases"
    url: "https://www.finops.org/framework/phases/"
    description: "Chu trình Inform, Optimize, Operate để cải thiện liên tục hiệu quả chi phí."
  - title: "AWS Cost Explorer"
    url: "https://docs.aws.amazon.com/cost-management/latest/userguide/ce-what-is.html"
    description: "Phân tích chi phí và usage, xem xu hướng, nhóm theo dịch vụ và dự báo."
  - title: "AWS Budgets"
    url: "https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-managing-costs.html"
    description: "Thiết lập cost/usage budgets, ngưỡng cảnh báo và theo dõi chi tiêu."
  - title: "AWS Cost Allocation Tags"
    url: "https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html"
    description: "Gắn và kích hoạt tags để phân loại, báo cáo và phân bổ chi phí."
  - title: "AWS Compute Optimizer"
    url: "https://docs.aws.amazon.com/compute-optimizer/latest/ug/what-is-compute-optimizer.html"
    description: "Đề xuất rightsizing và nhận diện tài nguyên nhàn rỗi dựa trên metrics."
  - title: "AWS Savings Plans"
    url: "https://docs.aws.amazon.com/savingsplans/latest/userguide/"
    description: "Đánh đổi giữa giá On-Demand và cam kết tiêu thụ compute dài hạn."
  - title: "AWS Well-Architected Cost Optimization"
    url: "https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/"
    description: "Nguyên tắc cost-aware architecture và tối ưu chi phí liên tục."
  - title: "Microsoft Cost Management - Cost Analysis & Budgets"
    url: "https://learn.microsoft.com/training/modules/analyze-costs-create-budgets-azure-cost-management"
    description: "Bài học phân tích chi phí Azure, tạo budget và thông báo."
  - title: "Google Cloud Billing Reports"
    url: "https://docs.cloud.google.com/billing/docs/how-to/reports"
    description: "Xem biểu đồ, lọc báo cáo theo project/service và phân tích biến động."
  - title: "Google Cloud Billing Budgets"
    url: "https://docs.cloud.google.com/billing/docs/how-to/budgets"
    description: "Cách thiết lập và quản lý budget/alerts theo billing account hoặc project."