menu:
  - level1: "Tổng quan đám mây"
    level2:
      - "Điện toán đám mây là gì và những bài toán thường gặp khi sử dụng"
      - "Năm đặc trưng: tự phục vụ, truy cập qua mạng, dùng chung tài nguyên, co giãn và đo lường sử dụng"
      - "Các nhóm tài nguyên: tính toán, lưu trữ, mạng và dịch vụ được quản lý"
      - "Vai trò của trung tâm dữ liệu, ảo hóa và phân bổ tài nguyên theo yêu cầu"
      - "So sánh vận hành tại chỗ với sử dụng tài nguyên đám mây"
      - "Lợi ích về tốc độ triển khai, khả năng thử nghiệm và tiếp cận người dùng"
      - "Giới hạn về kết nối, quyền kiểm soát, phụ thuộc nhà cung cấp và chi phí"
      - "Vòng đời sử dụng đám mây: lựa chọn, cấp phát, vận hành, tối ưu và thu hồi"
  - level1: "Mô hình dịch vụ"
    level2:
      - "IaaS: thuê hạ tầng và tự quản lý hệ điều hành, phần mềm, ứng dụng"
      - "PaaS: triển khai ứng dụng trên nền tảng do nhà cung cấp quản lý"
      - "SaaS: sử dụng phần mềm hoàn chỉnh qua tài khoản và cấu hình dịch vụ"
      - "So sánh IaaS, PaaS và SaaS theo quyền kiểm soát, công việc vận hành và chi phí"
      - "Container được quản lý và chức năng theo sự kiện trong phổ dịch vụ đám mây"
      - "Dịch vụ được quản lý và tự vận hành: phạm vi hỗ trợ, giới hạn và phần việc còn lại"
      - "Phân chia trách nhiệm về hạ tầng, hệ điều hành, ứng dụng, danh tính và dữ liệu"
      - "Phân biệt mô hình cung cấp dịch vụ với mô hình triển khai đám mây"
      - "Khả năng tùy biến, tính di động và mức độ phụ thuộc dịch vụ của nhà cung cấp"
      - "Lựa chọn mô hình dịch vụ cho website, hệ thống nội bộ và ứng dụng nghiệp vụ"
  - level1: "Mô hình triển khai"
    level2:
      - "Đám mây công cộng: đặc điểm, cách chia sẻ hạ tầng và trường hợp sử dụng"
      - "Đám mây riêng: quyền kiểm soát, yêu cầu đầu tư và trách nhiệm vận hành"
      - "Đám mây lai: phối hợp hạ tầng tại chỗ với dịch vụ đám mây"
      - "Đa đám mây: mục tiêu sử dụng nhiều nhà cung cấp và độ phức tạp phát sinh"
      - "Đám mây cộng đồng và nhu cầu dùng chung hạ tầng của các tổ chức"
      - "Phân biệt triển khai đám mây riêng với chỉ sử dụng máy chủ ảo tại chỗ"
      - "Ảnh hưởng của chủ quyền dữ liệu, độ trễ và yêu cầu kiểm soát đến cách triển khai"
      - "So sánh các mô hình theo năng lực đội ngũ, chi phí, bảo mật và khả năng mở rộng"
  - level1: "Vùng và miền lỗi"
    level2:
      - "Region: phạm vi địa lý, vị trí tài nguyên và danh mục dịch vụ khả dụng"
      - "Availability Zone: miền triển khai cô lập lỗi bên trong một vùng"
      - "Phân biệt trung tâm dữ liệu vật lý, vùng và vùng sẵn sàng"
      - "Điểm hiện diện và vị trí biên trong phân phối nội dung gần người dùng"
      - "Tài nguyên toàn cục, theo vùng và theo vùng sẵn sàng"
      - "Miền lỗi và rủi ro khi các thành phần dùng chung nguồn điện, mạng hoặc dịch vụ"
      - "Chọn vùng theo vị trí người dùng, nơi lưu dữ liệu, dịch vụ hỗ trợ và ngân sách"
      - "Triển khai nhiều vùng sẵn sàng và nhiều vùng địa lý: lợi ích và đánh đổi"
      - "Độ trễ, lưu lượng truyền và chi phí khi sao chép dữ liệu giữa các vị trí"
  - level1: "Tài nguyên và API"
    level2:
      - "Tài nguyên đám mây, định danh tài nguyên và quan hệ phụ thuộc"
      - "Mặt phẳng điều khiển và mặt phẳng dữ liệu trong một dịch vụ"
      - "Console, CLI, SDK và API: cách tương tác và trường hợp sử dụng"
      - "Vòng đời tạo, cấu hình, cập nhật, dừng và xóa tài nguyên"
      - "Thao tác bất đồng bộ, trạng thái cấp phát và tính nhất quán sau thay đổi"
      - "Phạm vi tài nguyên và lựa chọn vùng trước khi gọi API"
      - "Hạn ngạch tài nguyên, giới hạn tốc độ API và quy trình xin tăng giới hạn"
      - "Theo dõi yêu cầu bằng mã định danh, sự kiện và nhật ký hoạt động"
  - level1: "Tài khoản và quản trị"
    level2:
      - "Tổ chức, tài khoản, tenant, subscription và project: vai trò và cách ánh xạ"
      - "Phân tách môi trường phát triển, kiểm thử và sản xuất"
      - "Phân nhóm tài nguyên theo ứng dụng, đội ngũ và ranh giới trách nhiệm"
      - "Chính sách tổ chức và giới hạn cấu hình được phép triển khai"
      - "Quy tắc đặt tên, gắn nhãn, xác định chủ sở hữu và trung tâm chi phí"
      - "Quản trị hạn ngạch, ngân sách và quyền cấp phát tài nguyên"
      - "Nền tảng dùng chung cho mạng, danh tính, nhật ký và tài khoản mới"
      - "Kiểm kê tài nguyên, kiểm toán thay đổi và xử lý tài nguyên không rõ chủ sở hữu"
  - level1: "Lựa chọn tài nguyên"
    level2:
      - "Thu thập yêu cầu chức năng, số người dùng và mục tiêu chất lượng dịch vụ"
      - "Ước lượng nhu cầu CPU, bộ nhớ, dung lượng, IOPS và băng thông"
      - "Phân tích tải nền, tải cao điểm, tải đột biến và tốc độ tăng trưởng"
      - "Chọn kiến trúc bộ xử lý, loại máy và tài nguyên tăng tốc theo tính tương thích"
      - "Đối chiếu nhu cầu với hạn ngạch, giới hạn dịch vụ và công suất tại vùng triển khai"
      - "Đánh giá công sức vận hành khi chọn tự quản lý hoặc dịch vụ được quản lý"
      - "Cân nhắc vị trí dữ liệu, độ trễ, bảo mật và yêu cầu khôi phục"
      - "Lập bảng so sánh tài nguyên theo hiệu năng, độ tin cậy và tổng chi phí"
      - "Đo thử với tải đại diện, chọn dung lượng ban đầu và điều chỉnh theo số liệu"
  - level1: "Máy ảo"
    level2:
      - "Máy ảo, máy chủ vật lý, hypervisor và cơ chế chia sẻ tài nguyên"
      - "Chọn dòng máy theo CPU, bộ nhớ, mạng và đặc điểm tải xử lý"
      - "Ảnh máy, mẫu triển khai, hệ điều hành và yêu cầu bản quyền"
      - "Đĩa khởi động, đĩa dữ liệu và lưu trữ cục bộ tạm thời"
      - "Khởi tạo máy bằng cấu hình tự động, dữ liệu khởi động và mẫu dùng lại"
      - "Truy cập quản trị qua SSH, RDP, bastion và kết nối riêng có kiểm soát"
      - "Cập nhật hệ điều hành, vá lỗi và quản lý phiên bản ảnh máy"
      - "Hạ tầng dùng chung, máy chủ dành riêng và yêu cầu cô lập tài nguyên"
      - "Khởi động, dừng, khởi động lại và xóa máy: ảnh hưởng đến trạng thái và tài nguyên đi kèm"
  - level1: "Container"
    level2:
      - "Container và máy ảo: cơ chế cô lập, mật độ triển khai và giới hạn"
      - "Ảnh container, kho lưu trữ ảnh và quản lý phiên bản triển khai"
      - "Nền tảng chạy container được quản lý và cụm điều phối Kubernetes"
      - "Đơn vị triển khai, số bản sao, kiểm tra sức khỏe và vòng đời tác vụ"
      - "Yêu cầu CPU, bộ nhớ, giới hạn tài nguyên và khả năng mở rộng"
      - "Kết nối dịch vụ, cấu hình mạng và tiếp nhận lưu lượng vào ứng dụng"
      - "Dữ liệu tạm thời, ổ đĩa bền vững và cấu hình bên ngoài ảnh container"
      - "Quét ảnh, bảo vệ thông tin bí mật, thu thập nhật ký và cập nhật ứng dụng"
  - level1: "Serverless"
    level2:
      - "Mô hình serverless và phần hạ tầng nhà cung cấp quản lý"
      - "Hàm, runtime, sự kiện kích hoạt và tích hợp với dịch vụ đám mây"
      - "Gọi đồng bộ, gọi bất đồng bộ và xử lý thông điệp từ hàng đợi"
      - "Giới hạn thời gian chạy, bộ nhớ, dung lượng tạm và môi trường thực thi"
      - "Khởi động nguội, tái sử dụng môi trường và tác động đến độ trễ"
      - "Giới hạn đồng thời, tốc độ tiếp nhận và kiểm soát tải xuống dịch vụ phụ thuộc"
      - "Xử lý không lưu trạng thái, sự kiện trùng lặp, thử lại và tính lũy đẳng"
      - "Phối hợp nhiều bước xử lý và quản lý lỗi trong luồng công việc"
      - "Chi phí theo lượt gọi và thời gian thực thi; trường hợp phù hợp và không phù hợp"
  - level1: "Nền tảng lưu trữ"
    level2:
      - "Phân biệt lưu trữ đối tượng, lưu trữ khối và lưu trữ tệp"
      - "Dung lượng, IOPS, thông lượng và độ trễ khi đánh giá hiệu năng lưu trữ"
      - "Độ bền dữ liệu và tính sẵn sàng: ý nghĩa và phạm vi cam kết"
      - "Dữ liệu bền vững và dữ liệu tạm thời trong vòng đời tài nguyên tính toán"
      - "Lớp truy cập thường xuyên, ít truy cập và lưu trữ dài hạn"
      - "Mô hình truy cập, chia sẻ đồng thời và yêu cầu nhất quán dữ liệu"
      - "Giới hạn dung lượng, kích thước đối tượng, số lượt gọi và tốc độ truy cập"
      - "Chọn loại lưu trữ theo ứng dụng, yêu cầu khôi phục và cơ cấu chi phí"
  - level1: "Lưu trữ đối tượng"
    level2:
      - "Bucket, khóa đối tượng, metadata và cách tổ chức dữ liệu không phụ thuộc thư mục vật lý"
      - "Tải lên, tải xuống, tải nhiều phần và xử lý tệp dung lượng lớn"
      - "Chính sách truy cập, chặn truy cập công khai và chia sẻ có thời hạn"
      - "Phiên bản đối tượng, khôi phục bản đã xóa và bảo vệ khỏi ghi đè ngoài ý muốn"
      - "Chính sách vòng đời, chuyển lớp lưu trữ và thời hạn giữ dữ liệu"
      - "Sao chép đối tượng, phạm vi bảo vệ và mô hình nhất quán của dịch vụ"
      - "Mã hóa đối tượng, quản lý khóa và bảo vệ đường truyền"
      - "Phân phối nội dung tĩnh qua CDN và bảo vệ nguồn dữ liệu gốc"
      - "Ứng dụng cho nội dung đa phương tiện, nhật ký, bản sao lưu và kho dữ liệu"
  - level1: "Lưu trữ khối và tệp"
    level2:
      - "Ổ đĩa khối, gắn vào máy ảo và phân tách đĩa hệ điều hành với đĩa dữ liệu"
      - "Loại ổ đĩa, mức IOPS, thông lượng và giới hạn từ máy sử dụng"
      - "Snapshot ổ đĩa, bản sao tăng dần và phục hồi thành ổ đĩa mới"
      - "Dịch vụ tệp dùng chung qua NFS, SMB và yêu cầu kết nối"
      - "Truy cập đồng thời, quyền trên tệp, khóa tệp và tính nhất quán"
      - "Đĩa cục bộ tạm thời và nguy cơ mất dữ liệu khi thay đổi máy chủ"
      - "Mở rộng dung lượng, hệ thống tệp và giới hạn thay đổi khi đang hoạt động"
      - "Chọn lưu trữ khối hoặc tệp cho cơ sở dữ liệu, ứng dụng và nội dung dùng chung"
  - level1: "Dịch vụ dữ liệu"
    level2:
      - "Cơ sở dữ liệu quan hệ, SQL, giao dịch và cấu trúc dữ liệu có lược đồ"
      - "NoSQL: mô hình khóa giá trị, tài liệu, cột và đồ thị theo nhu cầu truy vấn"
      - "Cơ sở dữ liệu được quản lý và tự triển khai trên máy ảo"
      - "Bản sao đọc, sao chép dữ liệu, chuyển đổi dự phòng và khác biệt với sao lưu"
      - "Nhất quán mạnh, nhất quán cuối cùng và đánh đổi khi phân phối dữ liệu"
      - "Bộ nhớ đệm, thời hạn dữ liệu và xử lý dữ liệu đệm lỗi thời"
      - "Kết nối riêng, xác thực ứng dụng, mã hóa và kiểm soát quyền truy vấn"
      - "Dung lượng, hiệu năng truy vấn, số kết nối và cách mở rộng cơ sở dữ liệu"
      - "Thay đổi lược đồ, chuyển dữ liệu và khôi phục theo thời điểm"
  - level1: "Mạng đám mây"
    level2:
      - "Mạng ảo VPC, VNet và phạm vi cô lập tài nguyên mạng"
      - "IPv4, IPv6, CIDR, địa chỉ riêng và địa chỉ công cộng"
      - "Subnet và mối quan hệ với vùng, vùng sẵn sàng của từng nền tảng"
      - "Bảng định tuyến, cổng mạng, tuyến mặc định và đường đi của gói tin"
      - "Subnet công cộng và riêng: đánh giá theo định tuyến và khả năng truy cập"
      - "Internet gateway, NAT và điều kiện để tài nguyên riêng truy cập Internet"
      - "Security group và ACL mạng: lọc có trạng thái, không trạng thái và khác biệt nền tảng"
      - "Cổng, giao thức TCP, UDP, ICMP và quy tắc cho lưu lượng phản hồi"
      - "Quy hoạch địa chỉ, tránh dải mạng chồng lấn và dự phòng địa chỉ khi mở rộng"
      - "DNS công cộng, DNS riêng và phân giải tên trong mạng đám mây"
  - level1: "Kết nối mạng"
    level2:
      - "Peering giữa các mạng ảo và giới hạn chuyển tiếp kết nối"
      - "Mô hình mạng trung tâm, mạng nhánh và dịch vụ trung chuyển"
      - "Điểm kết nối riêng đến dịch vụ và cách hạn chế truy cập qua Internet"
      - "VPN giữa các địa điểm, VPN người dùng và bảo vệ đường hầm"
      - "Kết nối chuyên dụng giữa hạ tầng tại chỗ và nhà cung cấp đám mây"
      - "Định tuyến tĩnh, định tuyến động và vai trò cơ bản của BGP"
      - "Đánh giá băng thông, độ trễ, thông lượng và chi phí truyền dữ liệu"
      - "Chẩn đoán kết nối theo DNS, tuyến đường, luật lọc và nhật ký luồng mạng"
  - level1: "Phân phối lưu lượng"
    level2:
      - "Cân bằng tải lớp 4 và lớp 7 theo loại giao thức và yêu cầu ứng dụng"
      - "Bộ lắng nghe, nhóm đích, kiểm tra sức khỏe và phân phối yêu cầu"
      - "Cân bằng tải công cộng, nội bộ và ranh giới tiếp nhận lưu lượng"
      - "Chứng chỉ TLS, kết thúc TLS và mã hóa từ người dùng đến dịch vụ đích"
      - "Tên miền, bản ghi DNS, TTL và ảnh hưởng khi thay đổi đích truy cập"
      - "CDN: máy chủ gốc, bộ nhớ đệm tại biên, thời hạn và vô hiệu hóa nội dung"
      - "Định tuyến toàn cục theo độ trễ, vị trí và tình trạng dịch vụ"
      - "WAF, phòng chống DDoS và giới hạn tốc độ yêu cầu"
  - level1: "Danh tính và quyền"
    level2:
      - "Người dùng, nhóm, vai trò và danh tính của ứng dụng hoặc dịch vụ"
      - "Xác thực, phân quyền và đánh giá chính sách cho một yêu cầu truy cập"
      - "Quyền tối thiểu, kiểm soát theo vai trò và kiểm soát theo thuộc tính"
      - "Xác thực nhiều yếu tố, đăng nhập một lần và liên kết danh tính"
      - "Thông tin xác thực ngắn hạn và danh tính gắn với tài nguyên chạy ứng dụng"
      - "Ủy quyền, nhận vai trò và truy cập giữa các tài khoản hoặc dự án"
      - "Chính sách gắn danh tính, gắn tài nguyên và quy tắc từ chối truy cập"
