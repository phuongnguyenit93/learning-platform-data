references:
  - title: "OpenStax — Fundamental OS Concepts"
    url: "https://openstax.org/books/introduction-computer-science/pages/6-2-fundamental-os-concepts"
    description: "Tổng quan khái niệm hệ điều hành, quản lý process/thread, bộ nhớ, file, thiết bị và đồng bộ."
  - title: "Linux Kernel Documentation — Concepts Overview (Memory)"
    url: "https://docs.kernel.org/admin-guide/mm/concepts.html"
    description: "Virtual memory, address translation, page tables, page cache, reclaim và OOM ở góc nhìn kernel."
  - title: "Linux Kernel Documentation — Virtual File System"
    url: "https://docs.kernel.org/filesystems/vfs.html"
    description: "Lớp VFS, abstraction cho filesystem và các thao tác file mà user space sử dụng."
  - title: "Linux man-pages — System Call Introduction"
    url: "https://www.man7.org/linux/man-pages/man2/intro.2.html"
    description: "System call là điểm vào kernel, phân biệt wrapper của thư viện C với dịch vụ kernel."
  - title: "Linux man-pages — Scheduling"
    url: "https://man7.org/linux/man-pages/man7/sched.7.html"
    description: "Khái niệm scheduler, scheduling policy, priority và giao diện điều khiển scheduling của process."
  - title: "Linux Kernel Documentation — Block Multi-Queue I/O"
    url: "https://docs.kernel.org/block/blk-mq.html"
    description: "Đường xử lý block I/O, request queues, merging và lựa chọn I/O scheduler."
  - title: "Linux Kernel Documentation — Control Group v2"
    url: "https://docs.kernel.org/admin-guide/cgroup-v2.html"
    description: "Tổ chức process theo nhóm và giới hạn/phân phối CPU, memory cùng các tài nguyên hệ thống."
  - title: "FreeBSD Documentation — Design and Implementation of 4.4BSD"
    url: "https://docs.freebsd.org/en/books/design-44bsd/"
    description: "Tham khảo kiến trúc kernel, system calls, process, file system, memory và I/O qua một hệ UNIX."