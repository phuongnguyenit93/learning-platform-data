  - 'pthread_cancel: kiểu hủy, điểm hủy và hàm dọn dẹp'
  - Đánh thức tác vụ đang chờ khi có yêu cầu dừng
  - Truyền lỗi và kết quả giữa các luồng mà không bỏ sót tài nguyên
  - Đóng hàng đợi, ngừng nhận việc, chờ hoàn tất và hết thời hạn
  - 'Xử lý công việc đang làm dở: hoàn tất, hủy hoặc bàn giao'
  - Phạm vi vòng đời giúp tiến trình cha quản lý toàn bộ tác vụ con
- level1: Nhóm luồng và tải
  level2:
