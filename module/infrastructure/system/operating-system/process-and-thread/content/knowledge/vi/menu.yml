  - Quan hệ happens-before nối việc ghi dữ liệu với việc đọc hợp lệ
  - Acquire, release, relaxed và thứ tự nhất quán tuần tự
  - Đồng bộ cache không tự tạo hợp đồng đồng bộ cho chương trình
  - Vì sao volatile trong C/C++ không thay thế mutex hoặc kiểu nguyên tử
  - Vấn đề ABA và vòng đời vùng nhớ trong thuật toán không khóa
  - Phân biệt blocking, lock-free và wait-free
  - Khi nào nên chọn thư viện đồng bộ đã được kiểm chứng
- level1: Bế tắc và tiến triển
  level2:
  - Bốn điều kiện cần của deadlock và đồ thị chờ tài nguyên
  - Chu kỳ chờ giữa nhiều khóa và cách áp đặt thứ tự khóa
  - Bế tắc do gọi lại, chờ join hoặc chờ kết quả trong khi giữ khóa
  - 'Phòng ngừa, tránh và phát hiện bế tắc: các hướng tiếp cận khác nhau'
  - Thuật toán Banker trong mô hình cấp phát tài nguyên
  - Thời hạn chờ hỗ trợ phát hiện nhưng không tự chứng minh hết bế tắc
  - 'Livelock: các luồng vẫn hoạt động nhưng công việc không tiến triển'
  - 'Starvation: tác vụ liên tục không nhận được tài nguyên'
  - Lock convoy và thundering herd khi nhiều luồng cùng chờ
  - Giảm tranh chấp bằng chia nhỏ sở hữu và giới hạn số tác vụ cạnh tranh
- level1: Hợp tác và hủy tác vụ
  level2:
