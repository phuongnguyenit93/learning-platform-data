  - Ước lượng số luồng cho công việc tính toán hoặc chờ nhiều
  - 'Số luồng vượt số lõi: lợi ích và chi phí tùy loại công việc'
  - Bế tắc khi tác vụ trong nhóm chờ tác vụ khác cùng nhóm
  - Work stealing và phân phối những công việc nhỏ không đều
  - Chi phí tạo luồng, tái sử dụng luồng và dữ liệu cục bộ bị giữ lại
  - Điều tiết đầu vào để ngăn hàng đợi và độ trễ tăng không kiểm soát
  - Nhóm tiến trình so với nhóm luồng khi cần cách ly lỗi
  - 'Vòng lặp sự kiện, coroutine và luồng hệ điều hành: quan hệ giữa các lớp'
- level1: Phân cấp và giới hạn
  level2:
  - Nhóm tiến trình, phiên và phạm vi gửi tín hiệu
  - 'Job control: tác vụ tiền cảnh, nền và terminal điều khiển'
  - Giới hạn tài nguyên theo tiến trình bằng getrlimit, setrlimit và ulimit
  - RLIMIT_NPROC và cách hệ điều hành tính phạm vi áp dụng
  - 'PID namespace: định danh khác nhau giữa bên trong và bên ngoài'
  - Tiến trình PID 1 trong namespace và trách nhiệm xử lý tín hiệu, thu hồi
  - 'cgroup v2: nhóm tiến trình để theo dõi và kiểm soát tài nguyên'
  - cpu.weight, cpu.max và hiện tượng bị giới hạn thời gian CPU
  - 'cpuset và pids.max: CPU được phép dùng và giới hạn số tác vụ'
  - Windows Job Objects và quản lý vòng đời một nhóm tiến trình
  - Giới hạn container khác khả năng CPU nhìn thấy từ máy chủ
- level1: Quan sát trên Linux
  level2:
  - 'ps: đọc PID, PPID, TID, trạng thái và thời gian CPU'
  - 'top và htop: chuyển giữa góc nhìn tiến trình với luồng'
  - 'pstree: dựng quan hệ cha–con để tìm nguồn khởi chạy'
  - '/proc/<pid>/status, stat và task: đối chiếu thông tin tiến trình, luồng'
  - '/proc/<pid>/fd, cmdline và environ: quan sát tài nguyên trong phạm vi quyền được cấp'
  - 'pidstat và vmstat: lấy mẫu CPU, chuyển ngữ cảnh và hàng đợi chạy'
  - 'strace: theo dõi tạo tiến trình, lời gọi chờ và tín hiệu'
  - 'perf stat, perf record và perf sched: đo sự kiện, mẫu CPU và lập lịch'
  - 'taskset, chrt và prlimit: đọc cấu hình trước khi thay đổi có kiểm soát'
  - 'gdb và pstack: xem ngăn xếp các luồng khi chương trình treo'
  - Quyền ptrace, dữ liệu nhạy cảm và chi phí của công cụ quan sát
- level1: Quan sát trên Windows
  level2:
  - 'Task Manager: đối chiếu tiến trình, luồng, CPU và tài nguyên'
  - 'Resource Monitor: quan sát hoạt động và phân tích chuỗi chờ'
  - 'Process Explorer: xem cây tiến trình, luồng và handle'
  - 'Get-Process và Get-CimInstance: lấy thông tin tiến trình bằng PowerShell'
  - 'PID và handle: nhận diện đối tượng và quản lý vòng đời tham chiếu'
  - Wait Chain Traversal và đọc quan hệ chờ khi nghi ngờ bế tắc
  - 'Windows Performance Recorder và Windows Performance Analyzer: phân tích CPU, luồng, lập lịch'
  - 'WinDbg: đọc ngăn xếp luồng và dữ liệu chẩn đoán tiến trình'
  - 'Stop-Process và cơ chế dừng có kiểm soát: hiểu tác động trước khi dùng'
  - Đối chiếu kết quả Windows với mô hình chung mà không suy diễn hành vi POSIX
- level1: Liên hệ với Java
  level2:
  - Tiến trình JVM, các luồng ứng dụng và các luồng nội bộ
  - Luồng nền tảng Java và mối quan hệ với luồng hệ điều hành
  - 'Luồng ảo trong Java 21: luồng Java không tương ứng một-một với luồng hệ điều hành'
  - Trạng thái Thread.State khác trạng thái tiến trình, luồng do hệ điều hành báo
  - Thread.start, join và interrupt dưới góc nhìn vòng đời tác vụ
  - interrupt là yêu cầu hợp tác, không phải tín hiệu POSIX hay lệnh cưỡng bức dừng
  - synchronized, Lock, volatile và kiểu nguyên tử thuộc mô hình bộ nhớ Java
  - ExecutorService và giới hạn số luồng, hàng đợi khi xử lý công việc
  - 'ProcessBuilder và Process: khởi chạy, đọc đầu ra, chờ và kết thúc tiến trình con'
  - Tiến trình con bị chặn khi đầu ra đầy mà ứng dụng Java chưa đọc
  - jcmd, jstack và đối chiếu định danh luồng với công cụ hệ điều hành
- level1: Hiệu năng đa luồng
  level2:
  - Định luật Amdahl và giới hạn tăng tốc của phần công việc tuần tự
  - Chọn độ hạt tác vụ để chi phí điều phối không lấn át tính toán
  - True sharing và false sharing trên cùng dòng cache
  - Tính cục bộ dữ liệu, NUMA và ảnh hưởng của di chuyển luồng
  - Cạnh tranh khóa, thời gian giữ khóa và đoạn tới hạn nóng
  - Chờ bận, đánh thức liên tục và lãng phí CPU
  - Thông lượng cao khác độ trễ thấp, nhất là ở các phân vị cuối
  - Lấy mẫu với khoảng đo đủ dài và phân biệt CPU time với wall-clock time
  - 'Thiết kế phép đo: tải ổn định, khởi động, lặp lại và đối chứng'
  - Tách nút thắt CPU, đồng bộ và I/O trước khi tăng số luồng
- level1: Chẩn đoán sự cố
  level2:
  - Quy trình từ triệu chứng đến giả thuyết, bằng chứng và phép kiểm chứng
  - CPU cao do tính toán, vòng lặp bận hoặc quá nhiều tác vụ cạnh tranh
  - 'CPU thấp nhưng chương trình chậm: chờ I/O, khóa hay giới hạn CPU'
  - 'Nhiều luồng ở trạng thái chờ: khi nào bình thường, khi nào bất thường'
  - Luồng tăng liên tục và cạn tài nguyên do không quản lý vòng đời
  - Zombie tích tụ và tiến trình cha không thu hồi đúng cách
  - 'Không dừng được bằng SIGTERM: kiểm tra mặt nạ, xử lý tín hiệu và trạng thái chờ'
  - Chương trình treo khi chờ tiến trình con, pipe hoặc khóa
  - Phân biệt deadlock, starvation, livelock và nghẽn tài nguyên
  - 'Tiến trình bị kết thúc ngoài ý muốn: mã thoát, tín hiệu, OOM và nhật ký'
  - Lưu mốc thời gian, ảnh chụp trạng thái và ngăn xếp để đối chiếu trước–sau
- level1: Thực hành tổng hợp
  level2:
  - Dựng cây tiến trình và giải thích PID, PPID, TID bằng quan sát
  - Thí nghiệm fork–exec–wait và chứng minh PID được giữ qua exec
  - Tạo zombie trong môi trường kiểm soát rồi thu hồi đúng cách
  - So sánh dữ liệu riêng của hai tiến trình với dữ liệu dùng chung giữa hai luồng
  - Đo công việc tính toán khi thay đổi số luồng và số CPU được phép dùng
  - Tạo tranh chấp bộ đếm rồi sửa bằng mutex và phép toán nguyên tử
  - Xây hàng đợi có giới hạn bằng mutex và biến điều kiện
  - Tạo bế tắc hai khóa, đọc ngăn xếp và sửa thứ tự lấy khóa
  - Xây giao tiếp pipe có xử lý EOF và tiến trình con xuất nhiều dữ liệu
  - Điều phối dừng nhiều tiến trình, luồng bằng tín hiệu và thời hạn
  - Quan sát tác động của cpu.max và pids.max trong môi trường cô lập
  - Lập hồ sơ hiệu năng và giải thích kết quả bằng bằng chứng hệ điều hành
  - Bài tập chọn kiến trúc tiến trình, luồng hoặc vòng lặp sự kiện theo yêu cầu
