references:
  - title: "Linux Kernel — Virtual Filesystem (VFS) Overview"
    url: "https://docs.kernel.org/filesystems/vfs.html"
    description: "Mô tả VFS, inode, dentry, file object, pathname lookup và cách kernel gắn filesystem vào mount tree."
  - title: "Linux Kernel — ext4 Data Structures and Algorithms"
    url: "https://docs.kernel.org/filesystems/ext4/"
    description: "Giải thích block, block group, superblock, inode table, allocation, checksums và journal của ext4."
  - title: "Linux man-pages — mount(8)"
    url: "https://man7.org/linux/man-pages/man8/mount.8.html"
    description: "Cú pháp mount/umount, loại filesystem, mount options, thiết bị và mount point."
  - title: "Linux man-pages — fstab(5)"
    url: "https://man7.org/linux/man-pages/man5/fstab.5.html"
    description: "Cấu trúc /etc/fstab, trường device/UUID, mount point, filesystem type, options và thứ tự xử lý."
  - title: "util-linux — lsblk(8)"
    url: "https://man7.org/linux/man-pages/man8/lsblk.8.html"
    description: "Liệt kê block devices, quan hệ giữa disk và partition, filesystem, UUID và mount points."
  - title: "Linux man-pages — df(1)"
    url: "https://man7.org/linux/man-pages/man1/df.1.html"
    description: "Báo cáo dung lượng filesystem đã dùng/còn trống và tùy chọn hiển thị inode."
  - title: "Linux man-pages — fsck(8)"
    url: "https://man7.org/linux/man-pages/man8/fsck.8.html"
    description: "Giao diện kiểm tra và sửa filesystem, cách chọn checker phù hợp và lưu ý an toàn khi kiểm tra."
  - title: "Filesystem Hierarchy Standard (FHS)"
    url: "https://refspecs.linuxfoundation.org/FHS_3.0/fhs/index.html"
    description: "Chuẩn bố trí thư mục hệ thống Linux như /etc, /var, /home, /usr và mục đích của từng vùng."
