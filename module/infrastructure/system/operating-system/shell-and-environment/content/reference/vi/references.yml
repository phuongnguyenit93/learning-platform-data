references:
  - title: "GNU Bash Reference Manual"
    url: "https://www.gnu.org/software/bash/manual/bash.html"
    description: "Tài liệu chính thức về cú pháp shell, command execution, variables, expansions, redirections, scripts, jobs và environment."
  - title: "Linux man-pages — environ(7)"
    url: "https://man7.org/linux/man-pages/man7/environ.7.html"
    description: "Mô hình process environment, biến name=value, kế thừa từ tiến trình cha và các biến phổ biến như PATH, HOME, LANG."
  - title: "Linux man-pages — execve(2)"
    url: "https://man7.org/linux/man-pages/man2/execve.2.html"
    description: "Cách chương trình được thực thi và nhận command-line arguments cùng environment qua argv và envp."
  - title: "GNU Coreutils Manual"
    url: "https://www.gnu.org/software/coreutils/manual/coreutils.html"
    description: "Hướng dẫn các tiện ích dòng lệnh phổ biến để thao tác file, văn bản, quyền và luồng dữ liệu."
  - title: "ShellCheck — Shell Script Analysis Tool"
    url: "https://github.com/koalaman/shellcheck"
    description: "Công cụ phân tích tĩnh Bash/sh để phát hiện lỗi cú pháp, quoting, portability và các lỗi script khó thấy."
  - title: "Microsoft Learn — about_Environment_Variables"
    url: "https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_environment_variables?view=powershell-7.6"
    description: "Cách đọc/sửa environment variables trong PowerShell, scope process/user/machine và kế thừa sang tiến trình con."
  - title: "Microsoft Learn — about_Profiles"
    url: "https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_profiles?view=powershell-7.6"
    description: "Các profile PowerShell, thời điểm nạp và cách tùy chỉnh môi trường cho từng loại session."
  - title: "Microsoft Learn — about_Pipelines"
    url: "https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_pipelines?view=powershell-7.6"
    description: "Cách PowerShell pipeline chuyển object giữa các lệnh và kết hợp command để xử lý dữ liệu."