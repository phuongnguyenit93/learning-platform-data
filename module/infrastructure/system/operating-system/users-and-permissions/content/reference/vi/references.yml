references:
  - title: "Linux man-pages — useradd(8)"
    url: "https://man7.org/linux/man-pages/man8/useradd.8.html"
    description: "Tạo user, UID, primary/supplementary group, home directory, shell và cấu hình account mặc định."
  - title: "Linux man-pages — usermod(8)"
    url: "https://man7.org/linux/man-pages/man8/usermod.8.html"
    description: "Thay đổi thuộc tính tài khoản, home, shell, UID và membership nhóm bổ sung."
  - title: "Linux man-pages — passwd(5)"
    url: "https://man7.org/linux/man-pages/man5/passwd.5.html"
    description: "Cấu trúc /etc/passwd, UID/GID, home directory và trường login shell."
  - title: "Linux man-pages — group(5)"
    url: "https://man7.org/linux/man-pages/man5/group.5.html"
    description: "Cấu trúc /etc/group, GID và danh sách thành viên nhóm."
  - title: "GNU Coreutils — chmod(1)"
    url: "https://man7.org/linux/man-pages/man1/chmod.1.html"
    description: "Quyền rwx, symbolic/octal mode, setuid, setgid và sticky bit."
  - title: "Linux man-pages — ACL(5)"
    url: "https://man7.org/linux/man-pages/man5/acl.5.html"
    description: "POSIX access/default ACL, user/group entries, mask và cách tính quyền hiệu lực."
  - title: "Linux man-pages — sudoers(5)"
    url: "https://man7.org/linux/man-pages/man5/sudoers.5.html"
    description: "Cú pháp policy sudoers, user/group specifications, command scope, authentication và logging."
  - title: "Debian Reference — Authentication and Access Controls"
    url: "https://www.debian.org/doc/manuals/debian-reference/ch04.en.html"
    description: "Tổng quan Unix authentication, PAM, shadow password, ACL và sudo trong quản trị Debian/Linux."
  - title: "Linux man-pages — chage(1)"
    url: "https://man7.org/linux/man-pages/man1/chage.1.html"
    description: "Thiết lập và kiểm tra tuổi thọ mật khẩu, cảnh báo hết hạn và thời điểm account hết hiệu lực."
