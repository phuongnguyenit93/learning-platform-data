  - Đào tạo operator về dấu hiệu tấn công
  - Audit trail cho thao tác quản trị
- level1: Sai lầm thường gặp
  level2:
  - Tin rằng mạng nội bộ luôn an toàn
  - Mở port để xử lý sự cố rồi quên đóng
  - Dùng allow all để che lỗi cấu hình
  - Đặt rule quá rộng theo địa chỉ IP
  - Bỏ qua IPv6 khi chỉ bảo vệ IPv4
  - Không bảo vệ kênh quản trị
  - Không ghi log deny và thay đổi cấu hình
  - Dùng chung một security group cho mọi workload
  - Cho phép egress không giới hạn
  - Không kiểm tra đường bypass proxy hoặc firewall
  - Phụ thuộc vào IP thay vì identity
  - Tạo quá nhiều ngoại lệ không có thời hạn
  - Không kiểm thử khi topology thay đổi
- level1: Dự án thực hành bảo mật mạng
  level2:
  - Đặt mục tiêu và phạm vi cho lab network security
  - Vẽ topology và các trust boundary
  - Tạo subnet public, private và management
  - Triển khai firewall theo nguyên tắc default deny
  - Đặt reverse proxy trước service mẫu
  - Bật TLS và kiểm tra certificate chain
  - Thiết lập DNS logging và flow logging
  - Tạo chính sách egress cho workload
  - Thêm network policy cho container hoặc Kubernetes
  - Mô phỏng một sự cố lateral movement
  - Thu thập packet capture và log liên quan
  - Viết playbook cô lập nguồn tấn công
  - Kiểm thử các đường truy cập hợp lệ và bị chặn
  - Đánh giá kết quả và đề xuất cải tiến
