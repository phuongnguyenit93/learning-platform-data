references:
  - title: "OWASP — API Security Project"
    url: "https://owasp.org/projects/api-security-project"
    description: "Tổng quan OWASP API Security Top 10 2023, các nhóm rủi ro về xác thực, phân quyền, cấu hình và lạm dụng."
  - title: "OWASP API1:2023 — Broken Object Level Authorization"
    url: "https://api-security.owasp.org/editions/2023/en/0xa1-broken-object-level-authorization/"
    description: "Rủi ro truy cập đối tượng của người dùng hoặc tenant khác và hướng thiết kế kiểm tra quyền theo object."
  - title: "OWASP API4:2023 — Unrestricted Resource Consumption"
    url: "https://api-security.owasp.org/editions/2023/en/0xa4-unrestricted-resource-consumption/"
    description: "Hạn chế request rate, kích thước payload, chi phí tính toán và các tài nguyên có thể bị lạm dụng."
  - title: "OWASP — REST Security Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/REST_Security_Cheat_Sheet.html"
    description: "Hướng dẫn HTTPS, access control, JWT, API keys, content type, CORS, error handling và audit log."
  - title: "OWASP — Input Validation Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html"
    description: "Kiểm tra cấu trúc, kiểu, độ dài, schema, giới hạn dữ liệu và phân biệt validation với chống injection."
  - title: "OWASP — Server Side Request Forgery Prevention Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html"
    description: "Biện pháp phòng tránh SSRF khi API gọi URL hoặc dịch vụ nội bộ/bên ngoài dựa trên input."
  - title: "OWASP — Web Security Testing Guide"
    url: "https://owasp.org/projects/web-security-testing-guide"
    description: "Phương pháp kiểm thử bảo mật ứng dụng và API với các ca kiểm tra xác thực, phân quyền và dữ liệu."
  - title: "IETF RFC 9700 — OAuth 2.0 Security Best Current Practice"
    url: "https://www.rfc-editor.org/rfc/rfc9700.html"
    description: "Khuyến nghị cập nhật về xác thực OAuth, bảo vệ access token, scope, audience và chống replay."