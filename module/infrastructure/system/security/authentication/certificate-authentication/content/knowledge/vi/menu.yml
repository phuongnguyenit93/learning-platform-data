menu:
- level1: Nền tảng xác thực bằng chứng chỉ
  level2:
  - Chứng chỉ số giải quyết bài toán xác thực như thế nào?
  - Phân biệt định danh, xác thực và phân quyền
  - Bằng chứng sở hữu khóa riêng và giới hạn của việc xuất trình chứng chỉ
  - Xác thực một chiều, xác thực hai chiều và các ranh giới tin cậy
  - So sánh chứng chỉ với mật khẩu, khóa công khai thuần và token
  - Mô hình đe dọa và điều kiện để tin cậy một danh tính
  - Phân biệt xác thực chủ thể với mã hóa đường truyền và phân quyền truy cập
  - 'Các chủ thể được xác thực: người dùng, thiết bị, máy chủ và dịch vụ'
  - Khi chứng chỉ nhận diện thiết bị nhưng chưa đủ để xác thực người sử dụng
  - Mối liên hệ giữa chứng chỉ, khóa công khai, khóa riêng, CA và bên tin cậy
- level1: Cơ sở mật mã
  level2:
  - Cặp khóa bất đối xứng và mối liên hệ giữa khóa với danh tính
  - Hàm băm, chữ ký số và cách phát hiện dữ liệu bị thay đổi
  - Phân biệt ký số, mã hóa và thỏa thuận khóa
  - Nguồn ngẫu nhiên và yêu cầu sinh khóa an toàn
  - Lựa chọn thuật toán, độ dài khóa và khả năng chuyển đổi thuật toán
  - Phân biệt chữ ký số với MAC và thông điệp có mã xác thực
  - Thử thách, số ngẫu nhiên dùng một lần và bằng chứng chống phát lại
  - Phân biệt CA ký chứng chỉ với bên xác minh quyền dùng khóa riêng
- level1: Cấu trúc chứng chỉ X.509
  level2:
  - Các trường phiên bản, số sê-ri, chủ thể, tổ chức phát hành và thời hạn
  - Khóa công khai của chủ thể và chữ ký của tổ chức phát hành
  - Phần mở rộng và ý nghĩa của thuộc tính critical
  - Basic Constraints và giới hạn độ dài đường dẫn chứng chỉ
  - Key Usage và Extended Key Usage
  - Subject Alternative Name và giới hạn của Common Name
  - Subject Key Identifier và Authority Key Identifier
  - Định dạng PEM, DER và gói chứng chỉ kèm khóa PKCS#12
  - Phạm vi duy nhất của số sê-ri chứng chỉ trong cùng một CA phát hành
  - 'Các dạng danh tính trong SAN: DNS, IP, URI và địa chỉ thư điện tử'
  - Diễn giải Not Before, Not After và ranh giới hiệu lực chứng chỉ
  - Đối chiếu thuật toán khóa công khai và thuật toán CA dùng để ký chứng chỉ
- level1: PKI và mô hình tin cậy
  level2:
  - Vai trò của CA, RA, kho công bố và bên xác minh
  - Chứng chỉ gốc, chứng chỉ trung gian và chứng chỉ thực thể cuối
  - Điểm neo tin cậy và kho chứng chỉ tin cậy
  - Chuỗi chữ ký hợp lệ và quyết định tin cậy
  - PKI công cộng, PKI nội bộ và chứng chỉ tự ký
  - Phân cấp CA, ký chéo và nhiều đường dẫn chứng chỉ
  - Tách biệt nhiệm vụ CA và bảo vệ CA gốc ngoại tuyến
  - Phân biệt xây dựng chuỗi chứng chỉ với kiểm tra tính hợp lệ của chuỗi
  - Chuỗi do máy khách cung cấp và điểm neo do bên xác minh quản lý
  - Chứng chỉ tự ký không tự động trở thành điểm neo tin cậy
  - Ghim chứng chỉ hoặc khóa công khai và rủi ro khi chuyển đổi khóa hoặc CA
- level1: Danh tính và chính sách cấp chứng chỉ
  level2:
  - Mô hình danh tính cho người dùng, thiết bị và khối lượng công việc
  - Thẩm tra danh tính và quyền yêu cầu cấp chứng chỉ
  - Quy tắc đặt Subject, SAN và xác minh quyền sở hữu định danh
  - Hồ sơ chứng chỉ theo mục đích sử dụng và phạm vi tin cậy
  - Lựa chọn thời hạn chứng chỉ theo rủi ro và khả năng vận hành
  - Quy trình phê duyệt, phân công trách nhiệm và bằng chứng kiểm toán
  - Xác định chủ sở hữu, mục đích và nguồn xác nhận danh tính trước khi cấp
  - Phân biệt quyền yêu cầu danh tính với khả năng chứng minh sở hữu khóa
  - Ràng buộc hồ sơ chứng chỉ với SAN, Key Usage và Extended Key Usage
  - Ghi nhận chứng chỉ, khóa, chủ sở hữu và vị trí triển khai theo từng vai trò
- level1: Cấp phát và vòng đời chứng chỉ
  level2:
  - Tạo yêu cầu CSR và kiểm tra bằng chứng sở hữu khóa yêu cầu
  - Thiết lập tin cậy ban đầu khi đăng ký chứng chỉ
  - Cấp phát, phân phối và đối chiếu chứng chỉ với khóa cùng chuỗi CA
  - Tự động hóa đăng ký và cấp lại chứng chỉ bằng giao thức chuẩn
  - Phân biệt gia hạn chứng chỉ với thay cặp khóa
  - Luân chuyển chứng chỉ với khoảng chuyển tiếp và kế hoạch quay lui
  - Thu hồi, ngừng sử dụng và hủy bỏ chứng chỉ cùng khóa liên quan
  - Kiểm kê chứng chỉ, chủ sở hữu và cảnh báo hết hạn
  - Kiểm tra SAN, EKU và chính sách sử dụng trước khi ký CSR
  - Xác thực thiết bị hoặc dịch vụ ở lần cấp phát ban đầu khi tự động hóa
  - Khoảng chồng lấp chứng chỉ để triển khai thay khóa không gián đoạn
  - Thay đổi kho tin cậy khi đổi CA gốc hoặc CA trung gian
  - Duy trì ánh xạ danh tính qua nhiều lần gia hạn và thay cặp khóa
  - Thu hồi chứng chỉ, vô hiệu hóa tài khoản và xử lý kết nối đang tồn tại
  - Quy trình loại bỏ chứng chỉ cũ, xử lý mất thiết bị và chuyển chủ sở hữu
- level1: Bảo vệ khóa riêng
  level2:
  - Bảo vệ khóa riêng khi lưu trữ, truyền giao và sử dụng
  - Kho khóa hệ điều hành, HSM và TPM
  - Quyền truy cập tối thiểu, khóa không xuất được và kiểm toán thao tác khóa
  - Sao lưu, khôi phục và giới hạn áp dụng đối với khóa ký
  - Xử lý mất khóa, nghi lộ khóa và xâm phạm thiết bị giữ khóa
  - Bảo vệ quyền tệp và tài khoản tiến trình khi khóa được lưu trên đĩa
  - Mật khẩu bảo vệ khóa riêng và bài toán cấp mật khẩu khi khởi chạy dịch vụ
  - Khác biệt giữa khóa riêng PKCS#8, PKCS#1 và tệp chứng chỉ X.509
  - Ngăn lộ khóa qua kho mã, log, bản dựng và gói triển khai
  - Giới hạn của khóa không thể xuất khi thiết bị vẫn bị lạm dụng thao tác ký
- level1: Xác minh chứng chỉ
  level2:
  - Tiếp nhận và phân tích chứng chỉ từ nguồn chưa tin cậy
  - Xây dựng đường dẫn chứng chỉ đến điểm neo được chấp nhận
  - Kiểm tra chữ ký, thời hạn và đồng hồ trên đường dẫn chứng chỉ
  - Thực thi ràng buộc CA, độ dài đường dẫn, tên và phần mở rộng critical
  - Kiểm tra mục đích sử dụng và chính sách thuật toán
  - Đối chiếu định danh mong đợi với SAN theo quy tắc của giao thức
  - Từ chối chuỗi không tin cậy và xử lý lỗi xác minh an toàn
  - So khớp tên DNS, địa chỉ IP và wildcard theo quy tắc giao thức
  - Phân biệt chuỗi hợp lệ, danh tính mong đợi và trạng thái tài khoản
  - Kiểm tra name constraints và các ràng buộc định danh của tổ chức
  - Điểm quyết định từ chối khi chứng chỉ sai EKU hoặc Key Usage
  - Giới hạn sai lệch đồng hồ khi kiểm tra thời điểm chứng chỉ có hiệu lực
  - Phân biệt kiểm tra dấu critical với việc thực thi phần mở rộng đó
- level1: Thu hồi và trạng thái chứng chỉ
  level2:
  - Phân biệt hết hạn, thu hồi và thời điểm trạng thái có hiệu lực
  - Danh sách thu hồi CRL, Delta CRL và bộ nhớ đệm
  - OCSP và ý nghĩa các trạng thái good, revoked, unknown
  - OCSP stapling và điều kiện hỗ trợ của giao thức
  - Độ mới của thông tin trạng thái và nguy cơ dùng lại phản hồi cũ
  - Chính sách chấp nhận hoặc từ chối khi không kiểm tra được trạng thái
  - Kiểm tra trạng thái trong mạng cô lập và giới hạn của chứng chỉ ngắn hạn
  - Xác minh nguồn, chữ ký và thời hạn hiệu lực của phản hồi OCSP
  - Bộ nhớ đệm, thời điểm cập nhật và độ trễ khi một chứng chỉ bị thu hồi
  - Rủi ro khi tự động truy xuất URL AIA, CRL hoặc OCSP từ chứng chỉ chưa tin cậy
  - OCSP stapling và giới hạn hỗ trợ trong từng vai trò giao thức TLS
- level1: Xác thực trong TLS
  level2:
  - Xác thực máy chủ bằng chứng chỉ trong bắt tay TLS
  - Chứng minh sở hữu khóa và ràng buộc chữ ký với phiên bắt tay
  - Khôi phục phiên, tái sử dụng kết nối và tác động đến thay đổi chứng chỉ
  - Chính sách phiên bản TLS, thuật toán và cấu hình xác thực
  - Phạm vi bảo vệ của TLS khi kết nối đi qua nhiều chặng
  - CertificateRequest và vị trí yêu cầu chứng chỉ máy khách trong bắt tay TLS
  - CertificateVerify và bằng chứng dùng khóa riêng trên transcript bắt tay
  - Finished và kiểm tra toàn vẹn tiến trình bắt tay TLS
  - Khác biệt quan trọng giữa cơ chế bắt tay TLS 1.2 và TLS 1.3
  - Khóa phiên, thỏa thuận khóa và tính bí mật chuyển tiếp khác với ký chứng chỉ
  - Dữ liệu TLS 0-RTT và trách nhiệm chống phát lại ở tầng ứng dụng
- level1: Triển khai mTLS
  level2:
  - Yêu cầu, lựa chọn và xác thực chứng chỉ phía máy khách
  - Thiết lập tin cậy hai chiều giữa các miền quản trị
  - Chế độ bắt buộc hoặc tùy chọn chứng chỉ máy khách
  - So sánh xác thực TLS một chiều với xác thực hai chiều bằng chứng chỉ
  - Thiết lập chuỗi máy chủ và kho CA chấp nhận chứng chỉ máy khách
  - Danh sách CA gợi ý chọn chứng chỉ không thay thế chính sách cấp quyền
  - Cấu hình chứng chỉ máy khách gửi và quyền sử dụng khóa riêng
  - Từ chối máy khách thiếu chứng chỉ, sai mục đích hoặc không tương thích
  - Phân biệt xác thực trong bắt tay mTLS với cho phép truy cập tài nguyên
  - Ranh giới tin cậy giữa các môi trường, tổ chức và dịch vụ dùng mTLS
- level1: Ánh xạ danh tính
  level2:
  - Chuyển chứng chỉ đã xác minh thành danh tính được xác thực
  - Chọn định danh ổn định và tránh ánh xạ nhầm chủ thể
  - Chính sách chấp nhận theo CA, miền danh tính và mục đích chứng chỉ
  - Chọn thuộc tính SAN được quản trị làm định danh ổn định
  - Giới hạn của Subject DN và CN khi dùng làm khóa tài khoản
  - Chuẩn hóa, so sánh và tránh va chạm khi ánh xạ định danh
  - Phân biệt số sê-ri chứng chỉ với định danh chủ thể được xác thực
  - Nhiều chứng chỉ và khóa khác nhau có thể đại diện cho cùng một chủ thể
  - Phân tách tổ chức, môi trường và không gian tên khi ánh xạ chứng chỉ
  - Xử lý thay chủ sở hữu, tài khoản bị khóa và danh tính không còn hợp lệ
- level1: Phân quyền truy cập
  level2:
  - Gắn quyền truy cập với danh tính theo nguyên tắc tối thiểu
  - Thay đổi vai trò và vô hiệu hóa tài khoản độc lập với thu hồi chứng chỉ
  - Điều kiện để xác thực bằng chứng chỉ đáp ứng yêu cầu nhiều yếu tố
  - Ánh xạ danh tính chứng chỉ sang nhóm, vai trò và chính sách quyền tối thiểu
  - Kiểm tra quyền ở mức thao tác và từng tài nguyên được yêu cầu
  - Giới hạn tin cậy vào thuộc tính do chứng chỉ tự mang theo
  - Chứng chỉ hợp lệ nhưng tài khoản bị khóa hoặc không đủ quyền
  - Điều chỉnh quyền khi phiên TLS hoặc kết nối ứng dụng vẫn còn tồn tại
  - Ghi dấu vết bên gọi, danh tính đã ánh xạ và quyết định cấp quyền
- level1: Ứng dụng và kiến trúc triển khai
  level2:
  - mTLS giữa dịch vụ và quản lý danh tính khối lượng công việc
  - Xác thực người dùng bằng chứng chỉ và thẻ thông minh
  - Chứng chỉ trong truy cập mạng EAP-TLS và VPN
  - Đăng ký, xác thực và thay chứng chỉ cho thiết bị IoT
  - Kết thúc TLS tại proxy, bộ cân bằng tải và cổng truy cập
  - Chuyển tiếp danh tính qua hạ tầng tin cậy và ngăn giả mạo header
  - Chứng chỉ SSH, principal và khác biệt với chứng chỉ X.509
  - Loại bỏ header nhận dạng chứng chỉ do máy khách ngoài tự gửi qua proxy
  - Ngăn kết nối trực tiếp bỏ qua điểm xác thực tại gateway hoặc proxy
  - Mã hóa lại kết nối giữa proxy và dịch vụ phía sau
  - Service mesh, danh tính workload và giới hạn của xác thực tầng hạ tầng
  - Lựa chọn chứng chỉ trong trình duyệt, kho hệ điều hành và công cụ dòng lệnh
  - Thẻ thông minh, PIN và trải nghiệm xác thực người dùng
  - Phân biệt VPN IKE, EAP-TLS và xác thực bằng chứng chỉ của SSH
- level1: Tấn công và biện pháp phòng vệ
  level2:
  - Đánh cắp khóa riêng và giả mạo chủ thể hợp lệ
  - Cấp sai chứng chỉ và xâm phạm CA
  - Giả mạo chuỗi và khai thác lỗi xác minh chứng chỉ
  - Tấn công trung gian khi bỏ qua định danh hoặc thêm điểm neo tùy tiện
  - Phát lại chứng chỉ, chữ ký và vai trò của thử thách cùng ràng buộc phiên
  - Làm cạn tài nguyên khi bắt tay và xử lý chuỗi chứng chỉ
  - Rò rỉ danh tính qua nội dung chứng chỉ và quá trình xác thực
  - Lạm dụng chứng chỉ hợp lệ khi phân quyền sai hoặc tài khoản đã bị khóa
  - Nhầm danh tính người dùng, thiết bị và dịch vụ khi ánh xạ quyền
  - Giả mạo header tại proxy hoặc tin cậy nhầm chứng chỉ từ CA ngoài phạm vi
  - Phát lại thông điệp ngoài TLS khi thiếu thử thách và ràng buộc giao dịch
- level1: Vận hành và xử lý sự cố
  level2:
  - Cấu hình mặc định an toàn và tách kho tin cậy giữa các môi trường
  - Phân phối, cập nhật và chuyển đổi CA gốc có kiểm soát
  - Đồng bộ thời gian và chuẩn bị vận hành khi chứng chỉ sắp hết hạn
  - Giám sát lỗi xác thực, độ trễ bắt tay và sự kiện vòng đời chứng chỉ
  - Ghi nhật ký phục vụ điều tra mà không lộ khóa hoặc dữ liệu nhạy cảm
  - Chẩn đoán thiếu chứng chỉ trung gian, sai chuỗi và CA không được tin cậy
  - Chẩn đoán lỗi định danh, mục đích, thời hạn và trạng thái thu hồi
  - Ứng phó xâm phạm CA và khôi phục tin cậy trên diện rộng
  - Phân loại lỗi mạng, bắt tay, xác minh, ánh xạ và phân quyền
  - Chẩn đoán thuật toán không tương thích và chứng chỉ không được chọn
  - Thu thập bằng chứng đối chiếu từ máy khách, proxy và máy chủ
  - Chi phí xác minh chuỗi, bộ nhớ đệm và tác động của nối lại phiên
  - Tài liệu hóa cấu hình, trách nhiệm vận hành và kiểm tra định kỳ
- level1: Thực hành và đánh giá thiết kế
  level2:
  - Thiết kế PKI nội bộ với CA gốc, CA trung gian và các vai trò chứng chỉ
  - Thực hành tạo CSR, cấp chứng chỉ và cài đặt đầy đủ chuỗi bằng công cụ độc lập ngôn ngữ
  - Quan sát và so sánh bắt tay TLS một chiều với mTLS
  - Kiểm thử từ chối chứng chỉ hết hạn, bị thu hồi, sai danh tính, sai CA và sai mục đích
  - Mô phỏng gia hạn, thay khóa và chuyển đổi điểm neo tin cậy
  - Kiểm thử ánh xạ quyền và ngăn vượt qua xác thực tại cổng truy cập
  - Đánh giá thiết kế theo mô hình đe dọa và yêu cầu vận hành
  - Đọc CSR, chứng chỉ và chuỗi CA bằng OpenSSL
  - Kiểm tra bắt tay bằng openssl s_client và curl
  - Thử thiếu chứng chỉ, sai CA và thiếu chứng chỉ trung gian
  - Thử sai SAN, sai EKU, hết hạn và chưa có hiệu lực
  - Thử chứng chỉ bị thu hồi khi dịch vụ thu hồi tạm không khả dụng
  - Thử truy cập qua proxy, giả mạo header và đi thẳng vào dịch vụ
