roadmap:
- id: pham-vi-rui-ro-phuc-hoi
  title: Phạm vi & rủi ro phục hồi
  purpose: Hiểu khác biệt giữa quên mật khẩu và mất toàn bộ yếu tố xác thực, từ đó chọn mức kiểm chứng phù hợp.
  objectives:
  - Phân biệt password reset với account/MFA recovery
  - Liệt kê nguy cơ chiếm tài khoản qua kênh phục hồi
  - Xác định đối tượng và mức rủi ro cho từng luồng
- id: yeu-cau-reset-an-toan
  title: Yêu cầu reset an toàn
  purpose: Thiết kế điểm yêu cầu khôi phục không tiết lộ tài khoản có tồn tại hay tạo cơ hội spam.
  objectives:
  - Trả thông báo thống nhất cho email có/không tồn tại
  - Áp dụng rate limit theo IP, tài khoản và thời gian
  - Giữ trạng thái đăng nhập/mật khẩu cũ đến khi xác minh
- id: token-lien-ket-khoi-phuc
  title: Token & liên kết khôi phục
  purpose: Cấp bằng chứng sở hữu kênh phục hồi an toàn, ngắn hạn và không thể dùng lại.
  objectives:
  - Sinh token bằng CSPRNG, gắn với người dùng và mục đích
  - Lưu token dạng băm, đặt hạn dùng và dùng một lần
  - Dùng HTTPS, domain tin cậy và Referrer-Policy phù hợp
- id: dat-lai-mat-khau
  title: Đặt lại mật khẩu
  purpose: Chỉ cập nhật thông tin xác thực sau khi token hợp lệ, đồng thời ngăn tấn công vào biểu mẫu.
  objectives:
  - Kiểm tra token, hạn dùng, mục đích và trạng thái đã dùng
  - Lưu mật khẩu mới bằng password hash thích hợp
  - Chặn CSRF trên thao tác nhạy cảm, không tự đăng nhập
- id: khoi-phuc-mfa-recovery-code
  title: Khôi phục MFA & recovery code
  purpose: Cho phép người dùng lấy lại quyền truy cập khi mất thiết bị mà không biến recovery thành đường vòng bỏ MFA.
  objectives:
  - Tạo và lưu recovery codes dùng một lần an toàn
  - Yêu cầu bằng chứng bổ sung theo mức bảo đảm tài khoản
  - Thu hồi yếu tố mất, đăng ký yếu tố mới có kiểm chứng
- id: kenh-ho-tro-xac-minh
  title: Kênh hỗ trợ & xác minh
  purpose: Xử lý các trường hợp mất cả kênh khôi phục theo quy trình có kiểm soát và dấu vết.
  objectives:
  - Đánh giá recovery contact hoặc identity re-proofing
  - Thiết kế quy trình support chống social engineering
  - Yêu cầu approval bổ sung cho tài khoản đặc quyền
- id: session-canh-bao
  title: Session & cảnh báo
  purpose: Hạn chế quyền truy cập từ phiên cũ và giúp chủ tài khoản phát hiện hoạt động bất thường.
  objectives:
  - Quy định thu hồi hoặc cho người dùng vô hiệu phiên cũ
  - Gửi thông báo sau reset và sau khôi phục MFA
  - Ghi audit event không chứa token, password hay mã khôi phục
- id: kiem-thu-giam-sat
  title: Kiểm thử & giám sát
  purpose: Xác nhận luồng phục hồi vừa dùng được khi hợp lệ vừa chống được các cách lạm dụng phổ biến.
  objectives:
  - Kiểm thử token hết hạn, dùng lại và đoán token
  - Thử enumeration, brute-force, CSRF và thay đổi user ID
  - Theo dõi tỷ lệ lỗi, giới hạn yêu cầu và sự kiện bất thường
