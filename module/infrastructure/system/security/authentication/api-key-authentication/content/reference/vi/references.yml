  - title: "OWASP — API Security Top 10 2023"
    url: "https://api-security.owasp.org/editions/2023/en/0x11-t10/"
    description: "Các lỗi broken authentication, broken object authorization và rủi ro lạm dụng tài nguyên API."
  - title: "Microsoft Learn — Create API Management Subscriptions"
    url: "https://learn.microsoft.com/en-us/azure/api-management/api-management-howto-create-subscriptions"
    description: "Tạo subscription keys với scope và cách phân phối khóa cho client sử dụng API."