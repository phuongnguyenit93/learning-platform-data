references:
  - title: "OWASP — Authentication Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"
    description: "Đăng nhập an toàn, generic error, chống user enumeration, throttling và quản lý lockout."
  - title: "OWASP — Credential Stuffing Prevention Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Credential_Stuffing_Prevention_Cheat_Sheet.html"
    description: "Phòng chống credential stuffing, password spraying, bot detection và các biện pháp nhiều lớp."
  - title: "OWASP — Bot Management and Anti-Automation Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Bot_Management_and_Anti-Automation_Cheat_Sheet.html"
    description: "Rate limiting đa chiều, phát hiện bot và cân bằng khả năng chống lạm dụng với usability."
  - title: "NIST SP 800-63B-4 — Authentication and Authenticator Management"
    url: "https://csrc.nist.gov/pubs/sp/800/63/b/4/final"
    description: "Yêu cầu xác thực, chống online guessing, throttling và quản lý authenticator."
  - title: "OWASP — Multifactor Authentication Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Multifactor_Authentication_Cheat_Sheet.html"
    description: "MFA, step-up dựa trên rủi ro, thay đổi yếu tố xác thực và bảo vệ phục hồi MFA."
  - title: "OWASP — Forgot Password Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html"
    description: "Chống enumeration và flood ở luồng reset, token một lần và hết hạn."
  - title: "OWASP — Logging Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
    description: "Security events, đăng nhập thành công/thất bại, giám sát và bảo vệ dữ liệu nhạy cảm trong log."