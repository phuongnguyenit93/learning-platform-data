references:
  - title: "OWASP - Input Validation Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html"
    description: "Allowlist, độ dài, kiểu dữ liệu, Unicode, kiểm tra phía server và payload bất thường."
  - title: "OWASP - Deserialization Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html"
    description: "Rủi ro dữ liệu không tin cậy trong quá trình deserialize JSON/XML và các định dạng đối tượng."
  - title: "OWASP - Cross Site Scripting Prevention"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html"
    description: "Output encoding theo HTML, attribute, JavaScript, URL, safe sinks và HTML sanitization."
  - title: "OWASP - Content Security Policy"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Content_Security_Policy_Cheat_Sheet.html"
    description: "CSP phòng vệ nhiều lớp cho browser, không thay thế encoding và sanitization."
  - title: "OWASP - REST Security Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/REST_Security_Cheat_Sheet.html"
    description: "Input validation, Content-Type, chống MIME sniffing và bảo vệ dữ liệu trả về."
  - title: "OWASP - HTTP Security Response Headers"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/HTTP_Headers_Cheat_Sheet.html"
    description: "Content-Type, X-Content-Type-Options, cache policy và response headers an toàn."
  - title: "OWASP - Error Handling Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html"
    description: "Xử lý ngoại lệ tập trung, trả lỗi có cấu trúc và không lộ chi tiết hệ thống."
  - title: "OWASP - Logging Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
    description: "Giới hạn dữ liệu log, mask secrets, chống log injection và kiểm tra sự kiện."
  - title: "Spring Framework - @RequestBody Validation"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/requestbody.html"
    description: "Dùng @RequestBody cùng @Valid/@Validated để kiểm tra DTO và trả lỗi HTTP 400."
  - title: "IETF RFC 9457 - Problem Details for HTTP APIs"
    url: "https://www.rfc-editor.org/rfc/rfc9457.html"
    description: "Chuẩn response lỗi machine-readable cho HTTP APIs, thay thế RFC 7807."