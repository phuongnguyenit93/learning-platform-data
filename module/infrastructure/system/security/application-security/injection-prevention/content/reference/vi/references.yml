references:
  - title: "OWASP - Injection Prevention"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html"
    description: "Nguyên tắc tách dữ liệu khỏi interpreter và các họ injection thường gặp."
  - title: "OWASP - SQL Injection Prevention"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html"
    description: "Parameterized queries, allowlist định danh SQL và least privilege."
  - title: "OWASP - Input Validation"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html"
    description: "Kiểm tra kiểu, cú pháp và ngữ nghĩa; giới hạn của validation."
  - title: "OWASP - NoSQL Security"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/NoSQL_Security_Cheat_Sheet.html"
    description: "Filter qua driver, kiểm tra kiểu và hạn chế query operators từ client."
  - title: "OWASP - OS Command Injection Defense"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html"
    description: "Ưu tiên API an toàn, truyền argument tách biệt và validate allowlist."
  - title: "OWASP - LDAP Injection Prevention"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/LDAP_Injection_Prevention_Cheat_Sheet.html"
    description: "Context escaping cho LDAP DN và search filter, phân quyền tối thiểu."
  - title: "OWASP - XSS Prevention"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html"
    description: "Output encoding theo ngữ cảnh, DOM an toàn và HTML sanitization."
  - title: "OWASP - Top 10 Injection"
    url: "https://top10.owasp.org/2021/A03_2021-Injection/"
    description: "Mô tả injection, nhóm kỹ thuật phòng ngừa và phát hiện lỗi qua SAST/DAST."
  - title: "OWASP - Web Security Testing Guide"
    url: "https://wstg.owasp.org/"
    description: "Phương pháp kiểm thử bảo mật ứng dụng và xác minh đường input có rủi ro."