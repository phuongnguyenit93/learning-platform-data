references:
  - title: "OWASP — SSRF Prevention Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html"
    description: "Biện pháp chống SSRF bằng allowlist, kiểm tra IP/domain, DNS, redirect và phân lớp mạng."
  - title: "MDN — Server-Side Request Forgery"
    url: "https://developer.mozilla.org/en-US/docs/Web/Security/Attacks/SSRF"
    description: "Khái niệm SSRF, bề mặt tấn công qua URL và checklist phòng ngừa theo các lớp."
  - title: "IETF — RFC 3986 URI Generic Syntax"
    url: "https://www.rfc-editor.org/rfc/rfc3986.html"
    description: "Cấu trúc URI, scheme, authority, hostname, port, userinfo và các vấn đề chuẩn hóa."
  - title: "OWASP — Input Validation Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html"
    description: "Nguyên tắc xác thực dữ liệu đầu vào, allowlist và kiểm tra cú pháp/ngữ nghĩa."
  - title: "Oracle — Java HttpClient API (JDK 25)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.net.http/java/net/http/HttpClient.html"
    description: "Cấu hình HTTP client, chính sách redirect, proxy và connect timeout trong Java."
  - title: "Kubernetes — Network Policies"
    url: "https://kubernetes.io/docs/concepts/services-networking/network-policies/"
    description: "Kiểm soát kết nối outbound bằng NetworkPolicy egress và lưu ý phụ thuộc CNI."
  - title: "AWS EC2 — Use the Instance Metadata Service"
    url: "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html"
    description: "Cơ chế IMDSv2 yêu cầu token, giúp giảm nguy cơ lạm dụng truy cập metadata trong EC2."
  - title: "OWASP — Transport Layer Security Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html"
    description: "Thực hành TLS, xác minh tên miền và chứng chỉ khi kết nối tới endpoint HTTPS."
  - title: "OWASP — Logging Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
    description: "Ghi log sự kiện cần thiết và loại bỏ hoặc che access token, mật khẩu và dữ liệu nhạy cảm."