references:
  - title: "RFC 6750 — OAuth 2.0 Bearer Token Usage"
    url: "https://www.rfc-editor.org/rfc/rfc6750.html"
    description: "Cách truyền bearer token trong HTTP và rủi ro token bị lộ khi lưu trữ hoặc vận chuyển."
  - title: "RFC 7519 — JSON Web Token (JWT)"
    url: "https://www.rfc-editor.org/rfc/rfc7519.html"
    description: "Cấu trúc JWT, các registered claims như iss, aud, exp, nbf và các yêu cầu xác minh."
  - title: "RFC 8725 — JWT Best Current Practices"
    url: "https://www.rfc-editor.org/rfc/rfc8725.html"
    description: "Khuyến nghị xác minh thuật toán, khóa, issuer, audience và chống các lỗi triển khai JWT."
  - title: "RFC 9700 — OAuth 2.0 Security Best Current Practice"
    url: "https://www.rfc-editor.org/rfc/rfc9700.html"
    description: "Thực hành OAuth hiện đại về least privilege, access token, refresh token rotation và chống rò rỉ/replay."
  - title: "RFC 7662 — OAuth 2.0 Token Introspection"
    url: "https://www.rfc-editor.org/rfc/rfc7662.html"
    description: "Giao thức resource server kiểm tra trạng thái active và metadata của token opaque."
  - title: "RFC 7009 — OAuth 2.0 Token Revocation"
    url: "https://www.rfc-editor.org/rfc/rfc7009.html"
    description: "Định nghĩa revocation endpoint để thu hồi token khi logout, mất quyền hoặc không còn sử dụng."
  - title: "RFC 9449 — OAuth 2.0 Demonstrating Proof of Possession"
    url: "https://www.rfc-editor.org/rfc/rfc9449.html"
    description: "Cơ chế DPoP giới hạn token vào một bên gửi và giúp phát hiện replay."
  - title: "OWASP — Session Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html"
    description: "Thực hành quản lý session/token, cookie flags, bảo vệ phiên và cơ chế hết hạn."