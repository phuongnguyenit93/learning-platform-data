roadmap:
- id: vai-tro-ranh-gioi-tin-cay
  title: Vai trò & ranh giới tin cậy
  purpose: Hiểu token là thông tin xác thực hoặc ủy quyền được trao đổi giữa các thành phần có trách nhiệm khác nhau.
  objectives:
  - Phân biệt authentication với authorization
  - Mô tả issuer, client và resource server
  - Nhận diện nguy cơ khi token bị đánh cắp
- id: cac-loai-token
  title: Các loại token
  purpose: Chọn đúng loại token và phân biệt quyền truy cập với thông tin định danh người dùng.
  objectives:
  - Phân biệt access, refresh và ID token
  - So sánh opaque token với JWT
  - Phân biệt bearer token với proof-of-possession token
- id: phat-hanh-pham-vi-quyen
  title: Phát hành & phạm vi quyền
  purpose: Giới hạn thời gian và quyền của token ngay từ lúc cấp để giảm thiểu thiệt hại khi rò rỉ.
  objectives:
  - Chọn scope và audience theo least privilege
  - Thiết lập expiration và issuer phù hợp
  - Tránh đưa dữ liệu nhạy cảm vào JWT claims
- id: chu-ky-khoa-bao-mat
  title: Chữ ký & khóa bảo mật
  purpose: Bảo đảm tính toàn vẹn của token và quản lý khóa xác minh hoặc ký một cách an toàn.
  objectives:
  - Phân biệt chữ ký số với mã hóa payload
  - Cho phép thuật toán được cấu hình tin cậy
  - Bảo vệ signing key và lập kế hoạch key rotation
- id: truyen-luu-tru-token
  title: Truyền & lưu trữ token
  purpose: Giảm rủi ro lộ token khi di chuyển qua mạng, trình duyệt, ứng dụng hoặc log.
  objectives:
  - Gửi bearer token qua HTTPS và Authorization header
  - Không đặt token trong URL, log hoặc thông báo lỗi
  - Đánh giá cookie Secure/HttpOnly/SameSite và rủi ro CSRF/XSS
- id: xac-minh-kiem-soat-truy-cap
  title: Xác minh & kiểm soát truy cập
  purpose: Chỉ chấp nhận token hợp lệ, đúng đích và đúng quyền tại API được bảo vệ.
  objectives:
  - Xác minh chữ ký, issuer, audience, exp và nbf của JWT
  - Dùng introspection khi hệ thống sử dụng opaque token
  - Kiểm tra scope/quyền tại từng endpoint
- id: het-han-lam-moi-thu-hoi
  title: Hết hạn, làm mới & thu hồi
  purpose: Kiểm soát vòng đời để giảm thời gian khai thác token bị lộ hoặc không còn được phép dùng.
  objectives:
  - Phân biệt access token hết hạn với refresh token
  - Áp dụng refresh token rotation hoặc sender constraint
  - Thực hiện revocation và xử lý logout/đổi quyền
- id: chong-replay-kiem-thu
  title: Chống replay & kiểm thử
  purpose: Phát hiện sai cấu hình và thử nghiệm các tình huống tấn công token thường gặp.
  objectives:
  - Thử token sai chữ ký, sai audience và hết hạn
  - Kiểm tra duplicate/replay và cơ chế DPoP khi dùng
  - Theo dõi lỗi xác thực mà không ghi lộ token
