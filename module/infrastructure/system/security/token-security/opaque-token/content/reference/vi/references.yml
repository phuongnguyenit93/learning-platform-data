references:
  - title: "RFC 7662 — OAuth 2.0 Token Introspection"
    url: "https://www.rfc-editor.org/rfc/rfc7662.html"
    description: "Đặc tả endpoint introspection, trường active, metadata token, xác thực Resource Server và yêu cầu bảo vệ thông tin."
  - title: "RFC 7009 — OAuth 2.0 Token Revocation"
    url: "https://www.rfc-editor.org/rfc/rfc7009.html"
    description: "Cơ chế thu hồi access token hoặc refresh token và xử lý yêu cầu vô hiệu hóa credential."
  - title: "RFC 6750 — OAuth 2.0 Bearer Token Usage"
    url: "https://www.rfc-editor.org/info/rfc6750/"
    description: "Quy tắc truyền bearer token trong HTTP Authorization header, TLS và phòng tránh rò rỉ token."
  - title: "RFC 9700 — Best Current Practice for OAuth 2.0 Security"
    url: "https://www.rfc-editor.org/rfc/rfc9700.html"
    description: "Khuyến nghị bảo vệ OAuth 2.0 hiện hành, hạn chế replay, lộ token và các kiểu tấn công triển khai."
  - title: "Spring Security — OAuth 2.0 Resource Server Opaque Token"
    url: "https://docs.spring.io/spring-security/reference/servlet/oauth2/resource-server/opaque-token.html"
    description: "Tài liệu Java cấu hình introspection, ánh xạ scope thành authority, tùy chỉnh OpaqueTokenIntrospector và timeout."
