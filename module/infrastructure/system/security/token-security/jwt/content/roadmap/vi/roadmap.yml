roadmap:
- id: vai-tro-va-gioi-han-jwt
  title: Vai trò và giới hạn JWT
  purpose: Hiểu JWT là định dạng token và khi nào nên sử dụng.
  objectives:
  - Phân biệt JWT với OAuth/OIDC và cơ chế phiên.
  - Đánh giá token tự chứa và giới hạn thu hồi.
- id: cau-truc-va-claims
  title: Cấu trúc và claims
  purpose: Đọc dữ liệu token trước khi thiết kế cách sử dụng.
  objectives:
  - Nhận diện header, claims và dạng compact.
  - Phân biệt claims chuẩn và claims riêng.
- id: co-che-bao-ve
  title: Cơ chế bảo vệ
  purpose: Chọn cách bảo vệ phù hợp với mô hình tin cậy.
  objectives:
  - Phân biệt JWS, JWE và biểu diễn Base64url.
  - So sánh HMAC với chữ ký bất đối xứng.
- id: xac-minh-token
  title: Xác minh token
  purpose: Chỉ chấp nhận JWT hợp lệ cho đúng mục đích.
  objectives:
  - Cố định thuật toán cho phép và xác minh bằng khóa tin cậy.
  - Kiểm tra nguồn cấp, đối tượng nhận, thời hạn và mục đích token.
- id: khoa-va-jwks
  title: Khóa và JWKS
  purpose: Duy trì nguồn khóa xác minh đáng tin cậy.
  objectives:
  - Chọn khóa từ nguồn JWKS được cấu hình tin cậy.
  - Quản lý kid, bộ nhớ đệm và chuyển phiên bản khóa.
- id: tich-hop-va-vong-doi
  title: Tích hợp và vòng đời
  purpose: Sử dụng JWT trong luồng truy cập có giới hạn rõ ràng.
  objectives:
  - Phân biệt vai trò access token, ID token và refresh token.
  - Thiết kế lưu trữ, truyền qua TLS, hết hạn và thu hồi.
- id: rui-ro-thuong-gap
  title: Rủi ro thường gặp
  purpose: Nhận diện cách JWT bị dùng sai hoặc bị lạm dụng.
  objectives:
  - Phân tích nhầm thuật toán, nhầm loại token và phát lại.
  - Giảm dữ liệu nhạy cảm trong claims và ngăn lộ token.
- id: kiem-thu-va-van-hanh
  title: Kiểm thử và vận hành
  purpose: Kiểm chứng xác minh token và xử lý lỗi thực tế.
  objectives:
  - Thử sửa payload, sai khóa, sai đối tượng nhận và hết hạn.
  - Kiểm chứng xoay khóa, lỗi JWKS và nhật ký không chứa token.
