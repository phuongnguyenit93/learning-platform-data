references:
  - title: "OWASP — Secrets Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet"
    description: "Hướng dẫn quản lý tập trung, truy cập ít quyền, audit, cấp phát, rotation, revoke và xử lý secret bị rò rỉ."
  - title: "NIST — SP 800-57 Part 1 Rev. 5"
    url: "https://www.nist.gov/publications/recommendation-key-management-part-1-general-1"
    description: "Nguyên tắc quản lý khóa mật mã và bảo vệ key material trong toàn bộ vòng đời."
  - title: "HashiCorp Vault — Secrets Engines"
    url: "https://developer.hashicorp.com/vault/docs/secrets"
    description: "Cơ chế lưu trữ, tạo credential động và cung cấp dịch vụ secret thông qua engines của Vault."
  - title: "AWS — Secrets Manager Best Practices"
    url: "https://docs.aws.amazon.com/secretsmanager/latest/userguide/best-practices.html"
    description: "Least-privilege IAM, mã hóa, secret retrieval, rotation, monitoring và bảo vệ secret trên AWS."
  - title: "Google Cloud — Secret Manager Best Practices"
    url: "https://docs.cloud.google.com/secret-manager/docs/best-practices"
    description: "Workload identity, quyền truy cập, audit và hạn chế lộ secret khi tích hợp ứng dụng."
  - title: "Kubernetes — Good Practices for Secrets"
    url: "https://kubernetes.io/docs/concepts/security/secrets-good-practices/"
    description: "RBAC, mã hóa at rest, giới hạn truy cập Pod và cảnh báo rằng base64 không phải mã hóa."
  - title: "GitHub Actions — Using Secrets"
    url: "https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-secrets"
    description: "Tạo repository/environment secrets và quản lý phạm vi đưa secret vào workflow CI/CD."
  - title: "GitHub Actions — Secure Use Reference"
    url: "https://docs.github.com/en/actions/reference/security/secure-use"
    description: "Thực hành least privilege, tránh lộ secret vào logs và kiểm soát rủi ro workflow."