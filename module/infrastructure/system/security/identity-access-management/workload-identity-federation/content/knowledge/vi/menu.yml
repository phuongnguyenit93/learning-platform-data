menu:
- level1: Tổng quan
  level2:
  - Workload Identity Federation là gì và bài toán nó giải quyết
  - 'Workload là gì: ứng dụng, dịch vụ, job, container và máy ảo'
  - Rủi ro của API key, client secret và khóa tài khoản dịch vụ dài hạn
  - Trao đổi bằng chứng danh tính để nhận quyền truy cập ngắn hạn
  - Phân biệt xác thực danh tính với cấp quyền truy cập tài nguyên
  - Workload identity, workload federation và managed identity
  - Workload federation khác workforce federation và đăng nhập người dùng
  - Lợi ích, giới hạn và các điều kiện tiên quyết
  - Bản đồ thuật ngữ và lộ trình học từ nguyên lý đến triển khai
- level1: Mô hình danh tính
  level2:
  - Danh tính con người, danh tính dịch vụ và danh tính workload
  - Danh tính logic của ứng dụng so với từng phiên thực thi
  - Chủ thể (subject), người phát hành (issuer) và bên nhận (audience)
  - Identity provider, relying party và security token service
  - Principal nguồn và principal tại hệ thống đích
  - Thuộc tính danh tính và ranh giới tin cậy
  - Xác minh môi trường chạy và bằng chứng gắn với workload
  - Tính ổn định, tính duy nhất và khả năng thay đổi của định danh
  - Vòng đời danh tính từ cấp phát đến ngừng sử dụng
- level1: Kiến trúc liên kết
  level2:
  - 'Các thành phần: workload, nguồn danh tính, bộ trao đổi và tài nguyên'
  - Luồng tổng thể từ nhận bằng chứng đến gọi API đích
  - Trust domain và quan hệ tin cậy một chiều
  - Xác thực tại tầng trao đổi và phân quyền tại tài nguyên
  - Truy cập trực tiếp bằng principal liên kết
  - Truy cập thông qua vai trò hoặc danh tính trung gian
  - Một nguồn danh tính truy cập nhiều hệ thống đích
  - Nhiều nguồn danh tính cùng liên kết tới một hệ thống đích
  - Chuỗi tin cậy và giới hạn lan truyền quyền
- level1: Nền tảng giao thức
  level2:
  - OAuth 2.0 trong cấp quyền cho workload
  - OpenID Connect và vai trò của issuer, discovery, JWKS
  - JWT, JWS và phân biệt token có chữ ký với token mã hóa
  - RFC 8693 và mô hình OAuth 2.0 Token Exchange
  - Subject token, actor token và requested token type
  - Delegation và impersonation theo hợp đồng của nhà cung cấp
  - SAML, chứng thư X.509 và các dạng bằng chứng được hỗ trợ
  - Bằng chứng dựa trên danh tính cloud và yêu cầu ký
  - Phân biệt chuẩn giao thức với cách triển khai riêng từng nền tảng
- level1: Nguồn bằng chứng
  level2:
  - Token danh tính từ nền tảng CI/CD
  - Token service account của Kubernetes
  - Danh tính máy ảo và metadata service của cloud
  - Danh tính được quản lý bởi hạ tầng
  - Bằng chứng từ chứng thư và danh tính SPIFFE
  - Token từ identity provider do tổ chức vận hành
  - Chọn nguồn theo khả năng xác minh và ràng buộc môi trường
  - Giới hạn khi workload tự khai báo thuộc tính danh tính
  - Bài toán bootstrap và phụ thuộc vào nguồn tin cậy ban đầu
- level1: Vòng đời token
  level2:
  - Nhận subject token từ môi trường thực thi
  - Yêu cầu audience phù hợp cho nơi trao đổi
  - Gửi yêu cầu trao đổi tới endpoint tin cậy
  - Nhận access token hoặc credential phiên ngắn hạn
  - Sử dụng credential theo API và cơ chế ký của đích
  - TTL của token nguồn và credential đích
  - Làm mới bằng chứng, trao đổi lại và tránh nhầm với refresh token
  - Bộ nhớ đệm credential và thời điểm làm mới sớm
  - Hủy workload và xử lý credential chưa hết hạn
  - Phân biệt hết hạn, thu hồi quyền và vô hiệu hóa phiên
- level1: Xác minh token
  level2:
  - Đọc token để chẩn đoán khác với xác minh token để tin cậy
  - Kiểm tra chữ ký và danh sách thuật toán được phép
  - Khớp issuer chính xác và tránh nguồn phát hành giả mạo
  - Kiểm tra audience đúng dịch vụ và đúng mục đích
  - Kiểm tra exp, nbf, iat và độ lệch đồng hồ
  - Xác minh subject và các claim bắt buộc
  - JWKS, key ID, xoay vòng khóa và bộ nhớ đệm
  - Xử lý khóa không biết, discovery lỗi và nguồn danh tính gián đoạn
  - Tránh lấy địa chỉ khóa hoặc issuer tùy ý từ token không tin cậy
  - Giới hạn chống phát lại của bearer token
- level1: Ánh xạ danh tính
  level2:
  - Ánh xạ subject và thuộc tính từ token nguồn
  - Định danh bất biến so với tên hiển thị có thể đổi
  - Nguy cơ trùng định danh giữa issuer, tenant và tổ chức
  - Ràng buộc repository, project, namespace hoặc service account
  - Phân biệt thuộc tính do nền tảng xác nhận với dữ liệu workload kiểm soát
  - Biểu thức mapping và xử lý claim thiếu hoặc sai kiểu
  - Điều kiện chấp nhận trước khi tạo principal đích
  - Xử lý đổi tên, di chuyển và tái sử dụng tên tài nguyên
  - Kiểm thử mapping bằng danh tính hợp lệ và danh tính gần giống
- level1: Thiết lập tin cậy
  level2:
  - Đăng ký issuer hoặc identity provider tại hệ thống đích
  - Cấu hình audience và loại bằng chứng được chấp nhận
  - Ràng buộc subject theo phạm vi tối thiểu
  - Phối hợp điều kiện tin cậy với policy tài nguyên
  - Nguy cơ wildcard quá rộng và điều kiện chỉ kiểm tra issuer
  - Tách tin cậy giữa phát triển, kiểm thử và sản xuất
  - Tách tenant, tài khoản cloud và miền quản trị
  - Quản trị người có quyền sửa cấu hình federation
  - Kiểm tra đường đi thực tế từ nguồn danh tính đến quyền đích
- level1: Phân quyền
  level2:
  - Ánh xạ principal liên kết vào IAM role hoặc quyền tài nguyên
  - Quyền tối thiểu cho từng workload và từng môi trường
  - Quyền nhận danh tính trung gian khác với quyền của danh tính đó
  - Giới hạn phạm vi theo tài nguyên, hành động và điều kiện
  - Tránh gom nhiều workload vào cùng một danh tính đặc quyền
  - Ảnh hưởng của quyền thừa kế và chính sách cấp ở tầng cha
  - Session policy, attribute-based access và hỗ trợ từng nền tảng
  - Kiểm tra effective permissions thay vì chỉ đọc một policy
  - Đánh giá đường leo thang đặc quyền qua impersonation hoặc role chaining
- level1: Google Cloud
  level2:
  - Workload identity pool, provider và principal liên kết
  - Phân biệt workload identity pool với workforce identity pool
  - OIDC provider và điều kiện issuer, audience, claim
  - Nguồn AWS và các loại provider khác theo khả năng hỗ trợ
  - Attribute mapping, google.subject và attribute condition
  - Principal, principalSet và cách cấp quyền IAM
  - Truy cập trực tiếp tài nguyên bằng danh tính liên kết
  - Service account impersonation khi tài nguyên hoặc thiết kế yêu cầu
  - Quyền tạo token cho service account và giới hạn chuỗi quyền
  - Tệp cấu hình external_account và tính toàn vẹn của nguồn cấu hình
  - Security Token Service, IAM Credentials API và luồng credential
  - Audit, quota và chẩn đoán lỗi exchange hoặc impersonation
- level1: AWS
  level2:
  - OIDC identity provider trong IAM
  - IAM role trust policy và chủ thể được phép assume role
  - AssumeRoleWithWebIdentity và credential phiên STS
  - Ràng buộc issuer, audience, subject và claim được hỗ trợ
  - Role permission policy và quyền tài nguyên
  - Thời lượng phiên, session name và khả năng truy vết
  - Phân biệt web identity federation với AssumeRole
  - Cross-account access và chuỗi quyền cần kiểm soát
  - Credential provider chain và tránh dùng nhầm credential cũ
  - CloudTrail và liên kết sự kiện STS với truy cập tài nguyên
  - Quota, endpoint và chẩn đoán lỗi trust policy
- level1: Microsoft Entra
  level2:
  - Workload identity federation trong Microsoft Entra ID
  - Ứng dụng, service principal và managed identity
  - Federated identity credential và quan hệ với danh tính đích
  - Khớp issuer, subject và audience
  - Đổi assertion từ workload thành access token
  - Tenant, client ID, scope và tài nguyên yêu cầu
  - Phân quyền tại Azure và quyền ứng dụng tại dịch vụ đích
  - Phân biệt workload federation với client secret hoặc chứng thư client
  - Điều kiện hỗ trợ theo loại danh tính và nền tảng
  - Nhật ký đăng nhập workload và chẩn đoán token exchange
  - Thay đổi federation mà không để lại credential dài hạn
- level1: Kubernetes
  level2:
  - ServiceAccount và danh tính của Pod
  - Projected service account token và giới hạn token dài hạn
  - Audience, thời hạn token và cơ chế luân chuyển
  - OIDC issuer, discovery và JWKS của cluster
  - Ràng buộc namespace, service account và cluster
  - RBAC và ai có thể tạo Pod dưới danh tính đặc quyền
  - Token projection, quyền tệp và chia sẻ volume
  - Pod, node, sidecar và ranh giới truy cập token
  - Nguy cơ chiếm service account qua quyền sửa workload
  - Tách quyền Kubernetes khỏi quyền tài nguyên cloud
  - Đổi cluster, issuer hoặc service account và tác động tới federation
- level1: Danh tính trên K8s
  level2:
  - GKE Workload Identity Federation và mô hình principal của nền tảng
  - Truy cập trực tiếp và liên kết service account theo hỗ trợ của GKE
  - EKS IRSA và OIDC trust tới IAM role
  - EKS Pod Identity và sự khác biệt với luồng IRSA
  - AKS Workload Identity và federated identity credential
  - Webhook, annotation, biến môi trường và token projection
  - Kubernetes tự quản lý và yêu cầu công bố issuer tin cậy
  - Quyền node và nguy cơ fallback sang danh tính của node
  - Kiểm tra credential thực sự được ứng dụng sử dụng
  - Ma trận lựa chọn theo cloud, mô hình cluster và ranh giới quyền
- level1: GitHub Actions
  level2:
  - 'OIDC token của job và quyền id-token: write'
  - Issuer, audience và các claim nhận dạng workflow
  - Subject theo repository, ref, pull request hoặc environment
  - Ràng buộc repository bằng định danh ổn định khi nền tảng hỗ trợ
  - Nhánh, tag, environment protection và quyền triển khai
  - Workflow dùng lại và kiểm soát nguồn workflow được tin cậy
  - Fork, pull request và mã không tin cậy trong job
  - Pin action, bảo vệ workflow và giảm rủi ro chuỗi cung ứng
  - Trao đổi credential với AWS, Azure hoặc Google Cloud
  - Không ghi token vào log, artifact, output hoặc cache
  - Kiểm tra policy bằng các job có và không đủ điều kiện
- level1: Các nền tảng CI/CD
  level2:
  - ID token của GitLab CI và ràng buộc project, ref, environment
  - Nền tảng build được quản lý và nguồn danh tính tích hợp
  - Jenkins hoặc runner tự quản lý và bài toán nguồn tin cậy
  - Shared runner so với runner riêng
  - Tách job build, kiểm thử và triển khai
  - Credential theo từng job thay vì dùng chung toàn pipeline
  - Runner bị chiếm quyền và phạm vi credential có thể lấy
  - Định danh artifact khác với danh tính job phát hành
  - Thu hồi quyền sau khi job bị hủy hoặc repository chuyển chủ
  - Thiết kế pipeline không có fallback tới secret dài hạn
- level1: Đa cloud và tại chỗ
  level2:
  - Workload tại chỗ truy cập tài nguyên cloud
  - Workload trên cloud này truy cập cloud khác
  - Lựa chọn nguồn danh tính chung hoặc tin cậy trực tiếp
  - Phụ thuộc mạng tới issuer, STS và API đích
  - Ánh xạ danh tính qua nhiều hệ thống IAM
  - Chuỗi trao đổi token và giới hạn lan truyền quyền
  - Tránh biến một danh tính trung gian thành điểm đặc quyền tập trung
  - Phân tách tenant và môi trường trong hệ thống đa cloud
  - So sánh federation với cấp secret từ kho tập trung
  - Thiết kế khả dụng khi một hệ thống danh tính gián đoạn
- level1: SPIFFE và broker
  level2:
  - SPIFFE ID, trust domain và workload attestation
  - X.509-SVID, JWT-SVID và mục đích sử dụng
  - Phân biệt liên kết trust domain với trao đổi credential cloud
  - Bridging từ danh tính SPIFFE sang principal hệ thống đích
  - Identity broker và vai trò trung gian kiểm tra bằng chứng
  - Vault JWT/OIDC auth và cấp token Vault cho workload
  - Phân biệt đăng nhập vào broker với OAuth Token Exchange chuẩn
  - Giữ nguyên dấu vết danh tính nguồn qua các tầng trung gian
  - Rủi ro khi broker có quyền phát hành hoặc ánh xạ quá rộng
- level1: Tích hợp client
  level2:
  - Credential provider và chuỗi tìm kiếm credential
  - Cấu hình SDK, CLI và thư viện trung lập với ngôn ngữ
  - Nhận token từ tệp, metadata endpoint hoặc nguồn được hỗ trợ
  - Phân biệt cấu hình federation với dữ liệu xác thực bí mật
  - Bảo vệ cấu hình khỏi sửa đổi và chuyển hướng nguồn credential
  - Cache credential trong bộ nhớ và làm mới trước hạn
  - Đồng thời nhiều luồng và tránh trao đổi token lặp lại
  - Chọn danh tính rõ ràng khi môi trường có nhiều nguồn credential
  - Kiểm tra quyền thực tế bằng lời gọi tài nguyên tối thiểu
  - Không để fallback che giấu cấu hình federation sai
- level1: Bảo vệ credential
  level2:
  - Token ngắn hạn vẫn là dữ liệu nhạy cảm
  - Giới hạn quyền đọc projected token và tệp credential
  - Không đặt token trong URL, tham số tiến trình và lịch sử shell
  - Che token trong log, exception, tracing và công cụ debug
  - Tránh lưu credential vào artifact, image và volume dùng chung
  - Bảo vệ metadata service trước SSRF và truy cập trái phép
  - Ràng buộc audience theo nơi nhận thay vì tái sử dụng một token
  - Giảm thời gian tồn tại và số bản sao credential
  - PoP, mTLS, DPoP và điều kiện hỗ trợ thực tế
  - Giới hạn bảo vệ khi tiến trình hoặc runner đã bị chiếm quyền
- level1: Mô hình đe dọa
  level2:
  - Tài sản, kẻ tấn công và ranh giới tin cậy
  - Token replay và đánh cắp credential trong thời hạn hiệu lực
  - Audience confusion và token được dùng sai mục đích
  - Confused deputy trong trao đổi và impersonation
  - Subject collision, tái sử dụng tên và chiếm định danh
  - Policy quá rộng cho tổ chức, repository hoặc namespace
  - Giả issuer, sửa JWKS và thao túng discovery
  - Chiếm runner, Pod, node hoặc nguồn phát hành
  - Leo thang quyền qua vai trò trung gian và chuỗi impersonation
  - Chuỗi cung ứng workflow, action và credential helper
  - Thu hẹp phạm vi ảnh hưởng khi một trust relationship bị lộ
- level1: Vòng đời tin cậy
  level2:
  - Đăng ký workload và xác định chủ sở hữu
  - Phê duyệt issuer, subject mapping và quyền đích
  - Quản lý cấu hình federation bằng hạ tầng dưới dạng mã
  - Kiểm kê trust relationship và các danh tính đang sử dụng
  - Đổi tên repository, service account hoặc môi trường
  - Xoay vòng khóa ký tại nguồn danh tính
  - Thay issuer và chuyển đổi hệ thống CI hoặc cluster
  - Ngừng workload và xóa quyền, mapping, provider không còn dùng
  - Rà soát định kỳ để phát hiện trust quá rộng hoặc không có chủ
  - Phân biệt xóa cấu hình tin cậy với vô hiệu hóa token đã phát hành
- level1: Thu hồi và sự cố
  level2:
  - Tắt trao đổi mới khi nguồn danh tính bị xâm nhập
  - Thu hồi quyền tài nguyên của principal đích
  - Vô hiệu hóa vai trò hoặc danh tính trung gian
  - Đánh giá credential đã cấp còn hiệu lực bao lâu
  - Xoay vòng khóa issuer và ảnh hưởng của JWKS cache
  - Cách ly runner, workload hoặc cluster bị chiếm quyền
  - Truy vết từ job/Pod đến phiên credential và hành động tài nguyên
  - Khôi phục trust relationship theo quy trình kiểm soát
  - Loại bỏ credential dài hạn còn sót sau sự cố
  - Diễn tập việc vô hiệu hóa quyền và kiểm chứng tại tài nguyên
- level1: Khả dụng và hiệu năng
  level2:
  - Phụ thuộc issuer, discovery, JWKS, STS và IAM API
  - Timeout và retry có backoff, jitter
  - Cache JWKS và cân bằng khả dụng với độ mới của khóa
  - Cache access token và giới hạn dùng token gần hết hạn
  - Tránh thundering herd khi nhiều workload khởi động
  - Quota trao đổi token và giới hạn credential API
  - Đồng bộ đồng hồ và xử lý clock skew
  - Chọn endpoint, DNS, proxy và đường đi mạng
  - Fail closed và kế hoạch giảm chức năng có kiểm soát
  - Không tự chuyển sang khóa tĩnh khi federation gián đoạn
- level1: Quan sát và kiểm toán
  level2:
  - Nhật ký tại issuer, dịch vụ trao đổi và tài nguyên đích
  - Liên kết issuer, subject, principal và phiên truy cập
  - Truy vết job ID, workflow, Pod và môi trường triển khai
  - Mã định danh tương quan thay cho việc ghi token gốc
  - Metrics về tỷ lệ trao đổi, lỗi, độ trễ và thời gian sống
  - Cảnh báo thay đổi trust policy và cấp quyền đặc biệt
  - Phát hiện subject bất thường hoặc truy cập sai môi trường
  - Đánh giá độ phủ audit qua nhiều cloud và broker
  - Lưu giữ log, phân quyền truy cập và bảo vệ dữ liệu nhận dạng
  - Bằng chứng phục vụ rà soát quyền và điều tra sự cố
- level1: Chẩn đoán
  level2:
  - Phân biệt lỗi lấy subject token, exchange và truy cập tài nguyên
  - Token sai issuer, audience, subject hoặc thời hạn
  - Chữ ký không hợp lệ, key ID không biết và JWKS cũ
  - Claim thiếu, mapping sai hoặc điều kiện không khớp
  - Trust hợp lệ nhưng principal chưa có quyền tài nguyên
  - Thiếu quyền impersonation hoặc assume role
  - Sai tenant, project, tài khoản cloud hoặc namespace
  - Ứng dụng đang dùng credential fallback thay cho federation
  - Proxy, DNS, TLS, đồng hồ và endpoint không truy cập được
  - Quy trình chẩn đoán bằng dữ liệu đã che thông tin nhạy cảm
- level1: Kiểm thử
  level2:
  - Kiểm thử đường đi hợp lệ từ workload tới tài nguyên
  - Token đúng chữ ký nhưng sai audience hoặc sai issuer
  - Subject tương tự nhưng khác repository, namespace hoặc môi trường
  - Token hết hạn, chưa có hiệu lực và clock skew
  - Claim thiếu, sai kiểu, đổi tên và tái sử dụng định danh
  - Fork hoặc pull request không được quyền truy cập sản xuất
  - Quyền workload ở nguồn và quyền principal ở đích
  - Xoay vòng khóa, lỗi JWKS và gián đoạn STS
  - Làm mới credential trong tiến trình dài hạn
  - Thu hồi trust và quyền tài nguyên trong khi token còn hạn
  - Kiểm thử tải, quota và hành vi retry
  - Kiểm tra log, artifact và image không chứa token
- level1: Thiết kế triển khai
  level2:
  - Chọn nguồn danh tính và hệ thống đích theo môi trường
  - Lập bảng issuer, audience, subject, mapping và quyền
  - Trực tiếp hay thông qua danh tính trung gian
  - Một danh tính cho mỗi workload và môi trường khi phù hợp
  - Tách quyền quản trị trust với quyền triển khai workload
  - Quy ước định danh bền vững và quản lý thay đổi
  - Triển khai thử trong môi trường ít quyền
  - Chọn TTL theo mô hình đe dọa và yêu cầu vận hành
  - Định nghĩa chủ sở hữu, runbook và tiêu chí chấp nhận
  - Đánh giá chi phí vận hành và mức phụ thuộc nhà cung cấp
- level1: Chuyển đổi khóa tĩnh
  level2:
  - Kiểm kê nơi lưu và nơi sử dụng credential dài hạn
  - Chọn workload thí điểm và xác định quyền đang dùng
  - Thiết lập federation song song có thời hạn kiểm soát
  - Xác minh principal mới và quyền thực tế
  - Chuyển SDK, CLI hoặc pipeline sang credential provider mới
  - Phát hiện fallback và chứng minh không còn dùng khóa cũ
  - Thu hồi, xóa và kiểm tra credential cũ ở hệ thống nguồn
  - Xử lý bản sao trong secret store, artifact và lịch sử
  - Kế hoạch rollback không tái tạo bí mật không kiểm soát
  - Đo lường mức giảm khóa tĩnh và phạm vi quyền sau chuyển đổi
- level1: Thực hành
  level2:
  - Chuẩn bị môi trường cloud, repository và workload thử nghiệm
  - Vẽ luồng issuer, subject, STS, principal và tài nguyên
  - Giải mã JWT để quan sát claim bằng dữ liệu giả
  - Cấu hình GitHub Actions liên kết tới một cloud được chọn
  - Kiểm thử job đúng và sai branch hoặc environment
  - Cấu hình Kubernetes workload truy cập tài nguyên cloud
  - So sánh truy cập trực tiếp với service account impersonation
  - Thử làm mới credential trong một workload chạy dài
  - Mô phỏng subject sai, token hết hạn và trust policy quá rộng
  - Xoay vòng khóa issuer hoặc thay cấu hình tin cậy trong môi trường thử
  - Diễn tập thu hồi quyền và điều tra bằng audit log
  - Hoàn thiện bảng quyền, mô hình đe dọa và runbook vận hành
