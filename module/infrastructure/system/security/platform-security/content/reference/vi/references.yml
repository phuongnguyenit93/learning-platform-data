references:
  - title: "NIST SP 800-53 Rev. 5 - Security Controls"
    url: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
    description: "Danh mục kiểm soát danh tính, cấu hình, mạng, giám sát và ứng phó sự cố."
  - title: "CIS Critical Security Controls v8.1"
    url: "https://www.cisecurity.org/controls/v8-1"
    description: "Ưu tiên thực hành quản lý tài sản, cấu hình an toàn, quyền và lỗ hổng."
  - title: "AWS Well-Architected - Security Pillar"
    url: "https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/welcome.html"
    description: "Nguyên tắc bảo vệ danh tính, phát hiện, hạ tầng, dữ liệu và xử lý sự cố cloud."
  - title: "NIST SP 800-190 - Application Container Security"
    url: "https://csrc.nist.gov/pubs/sp/800/190/final"
    description: "Rủi ro và biện pháp bảo vệ image, registry, host, orchestrator và container."
  - title: "Kubernetes - Security"
    url: "https://kubernetes.io/docs/concepts/security/"
    description: "Tổng quan bảo vệ cluster, workload, control plane, access và audit."
  - title: "Kubernetes - RBAC Authorization"
    url: "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"
    description: "Roles, ClusterRoles, RoleBindings và giới hạn quyền truy cập API."
  - title: "Kubernetes - Network Policies"
    url: "https://kubernetes.io/docs/concepts/services-networking/network-policies/"
    description: "Chính sách kiểm soát ingress và egress giữa Pod cùng các endpoint."
  - title: "Kubernetes - Secrets"
    url: "https://kubernetes.io/docs/concepts/configuration/secret/"
    description: "Cách lưu dữ liệu nhạy cảm và các cảnh báo an toàn khi dùng Kubernetes Secret."
  - title: "Kubernetes - Pod Security Standards"
    url: "https://kubernetes.io/docs/concepts/security/pod-security-standards/"
    description: "Các cấp Privileged, Baseline và Restricted cho cấu hình an toàn của Pod."
  - title: "Kubernetes - Security Checklist"
    url: "https://kubernetes.io/docs/concepts/security/security-checklist/"
    description: "Danh sách kiểm soát bảo vệ API server, node, workload, secrets và logging."