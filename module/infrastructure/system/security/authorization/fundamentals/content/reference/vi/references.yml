references:
  - title: "OWASP — Authorization Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"
    description: "Nền tảng kiểm tra quyền mọi request, least privilege, deny by default và quyết định ở server."
  - title: "OWASP — Authorization Patterns Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Patterns_Cheat_Sheet.html"
    description: "Policy Enforcement Point (PEP), Policy Decision Point (PDP) và phạm vi resource/tenant."
  - title: "NIST SP 800-162 — Attribute Based Access Control"
    url: "https://csrc.nist.gov/pubs/sp/800/162/upd2/final"
    description: "Giải thích ABAC và các thuộc tính subject, object, operation, environment trong quyết định quyền."
  - title: "OWASP API1:2023 — Broken Object Level Authorization"
    url: "https://api-security.owasp.org/editions/2023/en/0xa1-broken-object-level-authorization/"
    description: "Kiểm tra quyền trên từng object ID và ngăn truy cập bản ghi của người dùng khác."
  - title: "OWASP API5:2023 — Broken Function Level Authorization"
    url: "https://api-security.owasp.org/editions/2023/en/0xa5-broken-function-level-authorization/"
    description: "Rủi ro truy cập endpoint quản trị, sai quyền theo vai trò và phương thức HTTP."
  - title: "OWASP Top 10:2025 — Broken Access Control"
    url: "https://top10.owasp.org/2025/A01_2025-Broken_Access_Control/"
    description: "Các dạng broken access control và khuyến nghị kiểm tra quyền phía server."
  - title: "Spring Security — Method Security"
    url: "https://docs.spring.io/spring-security/reference/servlet/authorization/method-security.html"
    description: "Dùng EnableMethodSecurity, PreAuthorize và custom policy cho phân quyền service/method."
  - title: "OWASP — Authorization Testing Automation"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Testing_Automation.html"
    description: "Xây authorization matrix và tự động kiểm tra quyền theo role, feature, dữ liệu."