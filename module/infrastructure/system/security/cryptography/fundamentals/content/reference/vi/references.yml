references:
  - title: "OWASP - Cryptographic Storage"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html"
    description: "Threat model, lựa chọn mã hóa AEAD, sinh số ngẫu nhiên và bảo vệ dữ liệu khi lưu."
  - title: "OWASP - Key Management"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet.html"
    description: "Vòng đời khóa, HSM/KMS, phân quyền, lưu trữ, xoay vòng và phục hồi."
  - title: "OWASP - Password Storage"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"
    description: "Argon2id, salt, cost parameters và khác biệt giữa hashing với mã hóa mật khẩu."
  - title: "OWASP - Transport Layer Security"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html"
    description: "TLS hiện đại, chứng thư và cấu hình ciphersuites bảo mật."
  - title: "NIST FIPS 197 - AES"
    url: "https://csrc.nist.gov/pubs/fips/197/final"
    description: "Tiêu chuẩn Advanced Encryption Standard và kích thước khóa AES."
  - title: "NIST SP 800-38D - AES-GCM"
    url: "https://csrc.nist.gov/pubs/sp/800/38/d/final"
    description: "Chế độ authenticated encryption GCM và xác thực tính toàn vẹn."
  - title: "NIST SP 800-57 Part 1 Rev.5"
    url: "https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final"
    description: "Khung quản lý khóa, loại khóa, sử dụng, lưu trữ và vòng đời bảo vệ."
  - title: "NIST FIPS 186-5 - Digital Signatures"
    url: "https://csrc.nist.gov/pubs/fips/186-5/final"
    description: "Các chuẩn chữ ký số, bảo đảm toàn vẹn và xác thực người ký."
  - title: "IETF RFC 5869 - HKDF"
    url: "https://www.rfc-editor.org/info/rfc5869/"
    description: "Dẫn xuất khóa bằng HMAC với mô hình extract-and-expand."
  - title: "IETF RFC 7748 - Elliptic Curves"
    url: "https://www.rfc-editor.org/info/rfc7748/"
    description: "X25519 và X448 cho việc thỏa thuận shared secret bằng ECDH."
  - title: "IETF RFC 8032 - EdDSA"
    url: "https://www.rfc-editor.org/info/rfc8032/"
    description: "Chữ ký số Ed25519/Ed448 và cách xác minh chữ ký."
  - title: "IETF RFC 9846 - TLS 1.3"
    url: "https://www.rfc-editor.org/info/rfc9846/"
    description: "Đặc tả TLS 1.3 cập nhật, thay thế RFC 8446 và bảo vệ kênh truyền."
  - title: "Java SE 25 - SecureRandom"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/security/SecureRandom.html"
    description: "Sinh byte ngẫu nhiên mật mã an toàn từ Java."
  - title: "Java SE 25 - Cipher API"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/javax/crypto/Cipher.html"
    description: "API mã hóa AEAD, GCM tag, AAD và yêu cầu không dùng lại IV."