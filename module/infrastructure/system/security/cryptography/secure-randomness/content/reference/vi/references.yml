references:
  - title: "Java SE 25 – SecureRandom API"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/security/SecureRandom.html"
    description: "Java API cho CSPRNG, nextBytes, getInstanceStrong, seed và reseed."
  - title: "Java SE 25 – Random API"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Random.html"
    description: "Giới hạn an toàn của java.util.Random và khuyến nghị SecureRandom cho bảo mật."
  - title: "Java SE 25 – JCA Reference Guide"
    url: "https://docs.oracle.com/en/java/javase/25/security/java-cryptography-architecture-jca-reference-guide.html"
    description: "Provider, SecureRandom, key generation và cấu hình entropy/DRBG trong Java."
  - title: "Java SE 25 – DrbgParameters API"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/security/DrbgParameters.html"
    description: "DRBG strength, prediction resistance, personalization và yêu cầu reseeding."
  - title: "NIST SP 800-90A Rev. 1 – DRBG"
    url: "https://csrc.nist.gov/pubs/sp/800/90/a/r1/final"
    description: "Cơ chế DRBG dựa trên hash và block cipher dùng để sinh bit khó đoán."
  - title: "NIST SP 800-90B – Entropy Sources"
    url: "https://csrc.nist.gov/pubs/sp/800/90/b/final"
    description: "Đánh giá nguồn entropy, min-entropy và health testing cho RNG."
  - title: "NIST SP 800-90C – RBG Constructions"
    url: "https://csrc.nist.gov/pubs/sp/800/90/c/final"
    description: "Cấu trúc hệ thống Random Bit Generator kết hợp DRBG với entropy source."
  - title: "NIST SP 800-133 Rev. 2 – Key Generation"
    url: "https://csrc.nist.gov/pubs/sp/800/133/r2/final"
    description: "Yêu cầu sinh khóa mật mã an toàn và sử dụng thuật toán phù hợp."
  - title: "OWASP – Cryptographic Storage Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html"
    description: "Chọn CSPRNG cho key, token, IV và tránh RNG không an toàn."
  - title: "OWASP – Session Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet"
    description: "Entropy, kích thước, tạo session ID khó đoán và quản lý rủi ro đoán token."
  - title: "OWASP – Forgot Password Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html"
    description: "Token ngẫu nhiên bảo mật, đủ dài, có hạn dùng và dùng một lần."