references:
  - title: "NIST – Cybersecurity Framework (CSF 2.0)"
    url: "https://www.nist.gov/cyberframework"
    description: "Govern, Identify, Protect, Detect, Respond, Recover và quản lý rủi ro ở cấp tổ chức."
  - title: "NIST SP 800-53 Rev. 5 – Security and Privacy Controls"
    url: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
    description: "Danh mục security/privacy controls và cách tiếp cận chức năng, mức độ bảo đảm."
  - title: "NIST SP 800-53A Rev. 5 – Control Assessment"
    url: "https://csrc.nist.gov/pubs/sp/800/53/a/r5/final"
    description: "Thiết kế kế hoạch đánh giá, thủ tục kiểm tra và xử lý bằng chứng hiệu quả controls."
  - title: "NIST SP 800-218 – Secure Software Development Framework"
    url: "https://csrc.nist.gov/pubs/sp/800/218/final"
    description: "Bộ thực hành SSDF tích hợp bảo mật vào các giai đoạn phát triển phần mềm."
  - title: "OWASP SAMM – Security Assurance Maturity Model"
    url: "https://owaspsamm.org/model/"
    description: "Năm nhóm chức năng và mười lăm thực hành để cải thiện độ trưởng thành bảo mật."
  - title: "OWASP SAMM – Assessment"
    url: "https://owaspsamm.org/assessment/"
    description: "Đánh giá hiện trạng, chất lượng hoạt động và định hướng cải tiến theo mức trưởng thành."
  - title: "OWASP – Application Security Verification Standard"
    url: "https://asvs.owasp.org/"
    description: "Các yêu cầu kỹ thuật có thể kiểm chứng cho ứng dụng web và dịch vụ."
  - title: "OWASP – Web Security Testing Guide"
    url: "https://wstg.owasp.org/"
    description: "Kịch bản và phương pháp kiểm thử bảo mật cho ứng dụng, API web."
  - title: "OWASP – Threat Modeling Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Threat_Modeling_Cheat_Sheet.html"
    description: "Luồng thực hành mô hình hóa hệ thống, trust boundaries, mối đe dọa và biện pháp xử lý."
  - title: "CIS – Critical Security Controls v8.1"
    url: "https://www.cisecurity.org/controls/v8-1"
    description: "Tập biện pháp bảo mật ưu tiên và có thể đánh giá cho hệ thống và tổ chức."