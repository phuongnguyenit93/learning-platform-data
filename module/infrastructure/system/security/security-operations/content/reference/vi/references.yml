references:
  - title: "NIST — Cybersecurity Framework 2.0"
    url: "https://www.nist.gov/cyberframework"
    description: "Khung quản trị rủi ro với các chức năng Govern, Identify, Protect, Detect, Respond và Recover."
  - title: "NIST SP 800-137 — Information Security Continuous Monitoring"
    url: "https://csrc.nist.gov/pubs/sp/800/137/final"
    description: "Chiến lược giám sát liên tục tài sản, rủi ro, lỗ hổng và hiệu quả kiểm soát an ninh."
  - title: "NIST SP 800-92 — Guide to Computer Security Log Management"
    url: "https://csrc.nist.gov/pubs/sp/800/92/final"
    description: "Thu thập, quản lý và vận hành log phục vụ giám sát và điều tra."
  - title: "OWASP — Logging Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
    description: "Thiết kế security event logging, dữ liệu cần ghi, bảo vệ dữ liệu nhạy cảm và chống log injection."
  - title: "MITRE — ATT&CK"
    url: "https://attack.mitre.org/"
    description: "Kho chiến thuật và kỹ thuật tấn công dựa trên quan sát thực tế để hỗ trợ detection và hunting."
  - title: "NIST SP 800-40 Rev. 4 — Enterprise Patch Management"
    url: "https://csrc.nist.gov/pubs/sp/800/40/r4/final"
    description: "Lên kế hoạch, ưu tiên, triển khai và xác minh bản vá trong quản lý lỗ hổng doanh nghiệp."
  - title: "NIST SP 800-61 Rev. 3 — Incident Response Recommendations"
    url: "https://csrc.nist.gov/pubs/sp/800/61/r3/final"
    description: "Hướng dẫn ứng phó sự cố và phục hồi gắn với NIST CSF 2.0, bản chính thức năm 2025."
  - title: "NIST — Incident Response Project"
    url: "https://csrc.nist.gov/Projects/incident-response"
    description: "Tài liệu và nguồn thực hành bổ sung để cải tiến phát hiện, phản ứng và phục hồi sự cố."