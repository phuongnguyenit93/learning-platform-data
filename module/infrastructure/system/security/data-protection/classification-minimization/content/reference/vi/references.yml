references:
  - title: "NIST FIPS 199 — Security Categorization"
    url: "https://csrc.nist.gov/pubs/fips/199/final"
    description: "Phân loại thông tin và hệ thống theo tác động lên confidentiality, integrity, availability."
  - title: "NIST SP 800-60 Vol. 1 Rev. 1 — Information Types"
    url: "https://csrc.nist.gov/pubs/sp/800/60/v1/r1/final"
    description: "Phương pháp ánh xạ loại thông tin sang mức độ bảo vệ và lý do phân loại."
  - title: "NIST SP 800-122 — Protecting PII"
    url: "https://csrc.nist.gov/pubs/sp/800/122/final"
    description: "Nhận diện dữ liệu cá nhân, đánh giá ảnh hưởng khi lộ thông tin và lựa chọn bảo vệ phù hợp."
  - title: "NIST — Privacy Framework"
    url: "https://www.nist.gov/privacy-framework"
    description: "Quản trị rủi ro quyền riêng tư và đánh giá hoạt động xử lý dữ liệu trong tổ chức."
  - title: "ICO — Data Minimisation"
    url: "https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/data-protection-principles/a-guide-to-the-data-protection-principles/data-minimisation/"
    description: "Nguyên tắc dữ liệu phải đầy đủ, liên quan và giới hạn ở mức cần thiết cho mục đích xử lý."
  - title: "OWASP — User Privacy Protection Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/User_Privacy_Protection_Cheat_Sheet.html"
    description: "Giảm thu thập dữ liệu riêng tư, bảo vệ quyền truy cập và giới hạn việc chia sẻ hoặc lưu giữ."
  - title: "OWASP — Logging Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
    description: "Những loại PII, token và secrets không nên ghi trực tiếp vào log; cách làm sạch hoặc che thông tin."
  - title: "Microsoft Purview — Sensitivity Labels"
    url: "https://learn.microsoft.com/en-us/purview/get-started-with-sensitivity-labels"
    description: "Tạo taxonomy, nhãn nhạy cảm và chính sách áp dụng bảo vệ cho dữ liệu được phân loại."