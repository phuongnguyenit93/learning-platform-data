references:
  - title: "NIST SP 800-57 Part 1 Rev. 5 – Key Management"
    url: "https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final"
    description: "Vòng đời, cryptoperiod, loại khóa, chính sách và bảo vệ key material."
  - title: "NIST SP 800-133 Rev. 2 – Cryptographic Key Generation"
    url: "https://csrc.nist.gov/pubs/sp/800/133/r2/final"
    description: "Hướng dẫn sinh khóa và thông số ngẫu nhiên cho mật mã được chấp thuận."
  - title: "OWASP – Key Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet"
    description: "Lưu trữ, phân phối, rotation, backup, hủy khóa và khôi phục sau compromise."
  - title: "OWASP – Cryptographic Storage Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html"
    description: "Chọn key, thuật toán, entropy, vòng đời và bảo vệ dữ liệu khi lưu trữ."
  - title: "AWS KMS – Generate Data Keys"
    url: "https://docs.aws.amazon.com/kms/latest/developerguide/data-keys.html"
    description: "Luồng tạo, bọc và sử dụng data key trong envelope encryption."
  - title: "Google Cloud KMS – Key Rotation"
    url: "https://docs.cloud.google.com/kms/docs/key-rotation"
    description: "Tác động của key version, rotation và giới hạn tự động re-encrypt."
  - title: "Google Cloud KMS – CMEK Recommended Practices"
    url: "https://docs.cloud.google.com/kms/docs/cmek-recommended-practices"
    description: "Chọn quyền tối thiểu, KMS/HSM và chính sách xoay vòng phù hợp."
  - title: "Azure Key Vault – Key Types and Operations"
    url: "https://learn.microsoft.com/en-us/azure/key-vault/keys/about-keys-details"
    description: "Các loại khóa, phiên bản, thao tác ký/giải mã và giới hạn truy cập vật liệu khóa."
  - title: "Azure Key Vault – Configure Key Rotation"
    url: "https://learn.microsoft.com/en-us/azure/key-vault/keys/how-to-configure-key-rotation"
    description: "Rotation policy, sự kiện hết hạn và quyền quản trị vòng đời key."
  - title: "NIST – Key Management Guidelines"
    url: "https://csrc.nist.gov/Projects/Key-Management/Key-Management-Guidelines"
    description: "Cổng tham chiếu chính thức đến các hướng dẫn NIST về key management."