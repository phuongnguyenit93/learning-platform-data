references:
  - title: "OWASP – Application Security Verification Standard"
    url: "https://asvs.owasp.org/"
    description: "Danh mục yêu cầu bảo mật kiểm chứng được cho ứng dụng web và dịch vụ; ASVS 5.0 stable."
  - title: "NIST SP 800-218 – Secure Software Development Framework"
    url: "https://csrc.nist.gov/pubs/sp/800/218/final"
    description: "Quy trình tích hợp xác định yêu cầu bảo mật vào phát triển phần mềm an toàn."
  - title: "OWASP – Threat Modeling Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Threat_Modeling_Cheat_Sheet.html"
    description: "Xác định trust boundaries, rủi ro và chuyển biện pháp giảm thiểu thành yêu cầu."
  - title: "OWASP – Abuse Case Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Abuse_Case_Cheat_Sheet.html"
    description: "Mô tả hành vi tấn công và chuyển abuse cases thành security requirements."
  - title: "NIST SP 800-53 Rev. 5 – Security and Privacy Controls"
    url: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
    description: "Thư viện controls về danh tính, phân quyền, logging, bảo vệ dữ liệu và ứng phó."
  - title: "OWASP – Authorization Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"
    description: "Yêu cầu least privilege, kiểm tra quyền cho từng tài nguyên và deny by default."
  - title: "OWASP – Cryptographic Storage Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html"
    description: "Đặc tả bảo vệ dữ liệu, thuật toán phù hợp và quản lý vòng đời khóa."
  - title: "OWASP – API Security Project"
    url: "https://owasp.org/projects/api-security-project"
    description: "Rủi ro API như object-level authorization, authentication và resource consumption."
  - title: "OWASP – Logging Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
    description: "Yêu cầu sự kiện log, bảo vệ dữ liệu nhạy cảm và giám sát sai lệch."
  - title: "OWASP – Proactive Controls Index"
    url: "https://cheatsheetseries.owasp.org/IndexProactiveControls"
    description: "Định nghĩa security requirements và ánh xạ sang các hướng dẫn thiết kế bảo mật."