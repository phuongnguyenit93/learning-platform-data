references:
  - title: "OWASP - Attack Surface Analysis Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html"
    description: "Định nghĩa, lập bản đồ, đo lường và quản lý attack surface của ứng dụng."
  - title: "OWASP - Threat Modeling Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Threat_Modeling_Cheat_Sheet.html"
    description: "Sơ đồ luồng dữ liệu, trust boundaries, đánh giá rủi ro và biện pháp giảm thiểu."
  - title: "OWASP WSTG - Information Gathering Overview"
    url: "https://wstg.owasp.org/latest/4-Web_Application_Security_Testing/01-Information_Gathering/00-Information_Gathering_Overview/"
    description: "Phương pháp kiểm kê ứng dụng, host, endpoint và phạm vi kiểm thử bảo mật web."
  - title: "OWASP - API Security Top 10 (2023)"
    url: "https://owasp.org/API-Security/editions/2023/en/0x11-t10/"
    description: "Rủi ro API về authorization, tài nguyên tiêu thụ, cấu hình và inventory."
  - title: "OWASP - Application Security Verification Standard"
    url: "https://asvs.owasp.org/"
    description: "Yêu cầu xác minh bảo mật ứng dụng, bao gồm kiến trúc, thiết kế và quyền truy cập."
  - title: "CIS Controls v8.1"
    url: "https://www.cisecurity.org/controls/v8-1"
    description: "Thực hành kiểm kê, quản lý tài sản phần mềm và giảm phơi lộ hệ thống."
  - title: "Microsoft - Threat Modeling Tool"
    url: "https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool"
    description: "Mô hình kiến trúc, phân tích ranh giới tin cậy và quản lý các biện pháp giảm thiểu."