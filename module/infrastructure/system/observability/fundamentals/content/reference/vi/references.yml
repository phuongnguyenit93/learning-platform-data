references:
  - title: "Observability Primer - OpenTelemetry"
    url: "https://opentelemetry.io/docs/concepts/observability-primer/"
    description: "Giải thích observability, monitoring và vai trò của telemetry."
  - title: "Telemetry Signals - OpenTelemetry"
    url: "https://opentelemetry.io/docs/concepts/signals/"
    description: "Tổng quan về metrics, logs, traces và các loại tín hiệu."
  - title: "OpenTelemetry Collector"
    url: "https://opentelemetry.io/docs/collector/"
    description: "Giới thiệu vai trò của collector trong luồng thu thập và xử lý telemetry."
  - title: "Context Propagation - OpenTelemetry"
    url: "https://opentelemetry.io/docs/concepts/context-propagation/"
    description: "Cơ chế truyền ngữ cảnh để liên kết dữ liệu giữa các thành phần."
  - title: "Monitoring Distributed Systems - Google SRE"
    url: "https://sre.google/sre-book/monitoring-distributed-systems/"
    description: "Các tín hiệu vàng, dashboard, cảnh báo và phân tích sự cố."
  - title: "Implementing SLOs - Google SRE"
    url: "https://sre.google/workbook/implementing-slos/"
    description: "Nền tảng xây dựng SLI và SLO gắn với độ tin cậy của dịch vụ."
