references:
  - title: "Jaeger 2.23 — Introduction"
    url: "https://www.jaegertracing.io/docs/2.23/"
    description: "Tổng quan Jaeger, quan hệ với OpenTelemetry, trace data model, khả năng lưu trữ và các chức năng phân tích."
  - title: "Jaeger 2.23 — Getting Started"
    url: "https://www.jaegertracing.io/docs/2.23/getting-started/"
    description: "Chạy all-in-one bằng container, mở Jaeger UI, gửi trace OTLP và thử ứng dụng demo HotROD."
  - title: "Jaeger 2.23 — Architecture"
    url: "https://www.jaegertracing.io/docs/2.23/architecture/"
    description: "Vai trò collector/query/ingester/all-in-one, các pipeline receiver-processor-exporter, storage và khả năng scale."
  - title: "Jaeger 2.23 — Configuration"
    url: "https://www.jaegertracing.io/docs/2.23/deployment/configuration/"
    description: "Cấu hình YAML theo OpenTelemetry Collector, receivers, processors, exporters, storage extension và query extension."
  - title: "Jaeger 2.23 — Storage Backends"
    url: "https://www.jaegertracing.io/docs/2.23/storage/"
    description: "Các backend lưu trace, memory/Badger và backend phân tán; cân nhắc lựa chọn cho phát triển và production."
  - title: "Jaeger 2.23 — Sampling"
    url: "https://www.jaegertracing.io/docs/2.23/architecture/sampling/"
    description: "Head-based, tail-based và remote sampling; ảnh hưởng của sampling đến chi phí và khả năng chẩn đoán."
  - title: "Jaeger 2.23 — Deployment"
    url: "https://www.jaegertracing.io/docs/2.23/deployment/"
    description: "Các mô hình triển khai production, tách vai trò, scaling và vận hành backend Jaeger."
  - title: "Jaeger 2.23 — Monitoring"
    url: "https://www.jaegertracing.io/docs/2.23/operations/monitoring/"
    description: "Metrics, logs và self-tracing của Jaeger; theo dõi accepted, refused và exported spans."
  - title: "Jaeger 2.23 — Troubleshooting"
    url: "https://www.jaegertracing.io/docs/2.23/operations/troubleshooting/"
    description: "Điều tra trace không tới backend, sampling, endpoint/port, network namespace, log verbosity và storage export."
