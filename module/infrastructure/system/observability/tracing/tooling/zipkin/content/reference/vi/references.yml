references:
  - title: "OpenZipkin - Architecture"
    url: "https://zipkin.io/pages/architecture.html"
    description: "Kiến trúc tracer, reporter, collector, storage, query API và Web UI; transport và luồng span."
  - title: "OpenZipkin - Data Model"
    url: "https://zipkin.io/pages/data_model.html"
    description: "Mô hình trace/span, traceId, spanId, endpoint, annotation và tag."
  - title: "OpenZipkin - Tracers and Instrumentation"
    url: "https://zipkin.io/pages/tracers_instrumentation"
    description: "Danh sách thư viện instrumentation, propagation và transport có thể gửi dữ liệu tới Zipkin."
  - title: "OpenZipkin - Instrumenting a Library"
    url: "https://zipkin.io/pages/instrumenting.html"
    description: "Quy ước span, annotation cho RPC/messaging và metadata phục vụ truy vấn."
  - title: "OpenZipkin - Official Project"
    url: "https://zipkin.io/"
    description: "Tổng quan khả năng tìm trace, service dependency diagram, UI và cách thử Zipkin."
  - title: "Spring Boot - Tracing"
    url: "https://docs.spring.io/spring-boot/reference/actuator/tracing.html"
    description: "Tích hợp Micrometer Tracing với Brave hoặc OpenTelemetry, Zipkin reporting, sampling và cấu hình."
  - title: "OpenTelemetry Java - Configure the SDK"
    url: "https://opentelemetry.io/docs/languages/java/configuration/"
    description: "Cấu hình Java SDK, context propagators, sampling và exporter; thông tin cấu hình Zipkin hiện hành."
  - title: "OpenTelemetry - Deprecating Zipkin Exporters"
    url: "https://opentelemetry.io/blog/2025/deprecating-zipkin-exporters/"
    description: "Thông báo deprecation tháng 12/2025, thời hạn hỗ trợ exporter hiện có và khuyến nghị chuyển sang OTLP hoặc Collector."
  - title: "OpenTelemetry Collector Contrib - Zipkin Exporter"
    url: "https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/exporter/zipkinexporter/README.md"
    description: "Định tuyến trace qua Collector tới Zipkin, endpoint v2, TLS, queue và retry."
  - title: "OpenZipkin - Extension Choices"
    url: "https://zipkin.io/pages/extensions_choices"
    description: "Các lựa chọn backend/extension tương thích định dạng Zipkin và endpoint ingestion."