references:
  - title: "Grafana Tempo — Architecture"
    url: "https://grafana.com/docs/tempo/latest/introduction/architecture/"
    description: "Kiến trúc write/read path, distributor, live-store, querier, block storage và metrics-generator."
  - title: "Grafana Tempo — Set Up Tempo"
    url: "https://grafana.com/docs/tempo/latest/set-up-for-tracing/setup-tempo/"
    description: "Các bước lập kế hoạch, triển khai, kiểm tra cài đặt và cấu hình các thành phần Tempo."
  - title: "Grafana Tempo — Deployment"
    url: "https://grafana.com/docs/tempo/latest/set-up-for-tracing/setup-tempo/deploy/"
    description: "Triển khai monolithic hoặc microservices bằng binary, Docker, Helm, Tanka hay Kubernetes; lưu ý authentication proxy."
  - title: "Grafana Tempo — Configure Tempo"
    url: "https://grafana.com/docs/tempo/latest/configuration/"
    description: "Cấu hình receiver, storage, query frontend, metrics-generator, giới hạn và multitenancy."
  - title: "Grafana Tempo — TraceQL"
    url: "https://grafana.com/docs/tempo/latest/traceql/"
    description: "Cú pháp và cách truy vấn trace theo resource attributes, span attributes, duration và trạng thái."
  - title: "Grafana Tempo — Object Storage"
    url: "https://grafana.com/docs/tempo/latest/configuration/hosted-storage/s3/"
    description: "Cấu hình S3-compatible object storage làm backend lưu trace blocks và dữ liệu dài hạn."
  - title: "Grafana Tempo — Metrics from Traces"
    url: "https://grafana.com/docs/tempo/latest/metrics-from-traces/"
    description: "Metrics-generator, span metrics, service graphs, RED metrics và TraceQL metrics."
  - title: "OpenTelemetry — Traces Concepts"
    url: "https://opentelemetry.io/docs/concepts/signals/traces/"
    description: "Khái niệm trace, span, Tracer Provider, exporter và context propagation trong distributed tracing."
  - title: "Grafana Tempo — Multitenancy"
    url: "https://grafana.com/docs/tempo/latest/configuration/multitenancy/"
    description: "Cô lập dữ liệu theo tenant, bật multitenancy và sử dụng tenant identification header."