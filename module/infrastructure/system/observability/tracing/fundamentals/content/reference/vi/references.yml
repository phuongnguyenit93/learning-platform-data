references:
  - title: "OpenTelemetry — Traces"
    url: "https://opentelemetry.io/docs/concepts/signals/traces/"
    description: "Khái niệm trace, span, quan hệ cha–con, Span Context, attributes, events và trace exporters."
  - title: "OpenTelemetry — Context Propagation"
    url: "https://opentelemetry.io/docs/concepts/context-propagation/"
    description: "Cách context được serialize và truyền qua process/network boundary để liên kết spans trong cùng trace."
  - title: "W3C — Trace Context Recommendation"
    url: "https://www.w3.org/TR/trace-context/"
    description: "Đặc tả HTTP headers traceparent và tracestate để truyền trace context liên thông giữa các hệ thống."
  - title: "OpenTelemetry — Instrumentation"
    url: "https://opentelemetry.io/docs/concepts/instrumentation/"
    description: "Vai trò API/SDK, TracerProvider, tracer và cách instrument ứng dụng tự động hoặc thủ công."
  - title: "OpenTelemetry — Semantic Conventions"
    url: "https://opentelemetry.io/docs/concepts/semantic-conventions/"
    description: "Quy ước chuẩn hóa tên span và attributes cho HTTP, database, messaging và các công nghệ phổ biến."
  - title: "OpenTelemetry — Sampling"
    url: "https://opentelemetry.io/docs/concepts/sampling/"
    description: "Các phương án head/tail sampling, quyết định giữ trace và đánh đổi chi phí với độ đầy đủ dữ liệu."
  - title: "OpenTelemetry — Collector"
    url: "https://opentelemetry.io/docs/collector/"
    description: "Kiến trúc receiver, processor, exporter và pipeline để thu thập, xử lý và chuyển tiếp telemetry."
  - title: "OpenTelemetry — OTLP Specification"
    url: "https://opentelemetry.io/docs/specs/otlp/"
    description: "Giao thức chuẩn truyền telemetry giữa SDK, Collector và backend qua OTLP."
  - title: "OpenTelemetry — Trace API"
    url: "https://opentelemetry.io/docs/specs/otel/trace/api/"
    description: "Đặc tả Span, SpanContext, SpanKind, status, links, events và các thao tác trace API."