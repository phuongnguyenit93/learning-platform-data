references:
  - title: "Fluentd Quickstart"
    url: "https://docs.fluentd.org/quickstart"
    description: "Tổng quan công cụ Fluentd và cách bắt đầu."
  - title: "Configuration File Syntax"
    url: "https://docs.fluentd.org/configuration/config-file"
    description: "Cấu trúc source, filter, match và tag để thiết kế luồng sự kiện."
  - title: "Tail Input Plugin"
    url: "https://docs.fluentd.org/input/tail"
    description: "Thu thập các dòng log mới từ tệp bằng plugin in_tail."
  - title: "Parse Section"
    url: "https://docs.fluentd.org/configuration/parse-section"
    description: "Cấu hình parser để biến log thô thành bản ghi có cấu trúc."
  - title: "Record Transformer Filter"
    url: "https://docs.fluentd.org/filter/record_transformer.html"
    description: "Làm giàu và biến đổi trường của sự kiện qua filter."
  - title: "Forward Output Plugin"
    url: "https://docs.fluentd.org/output/forward.html"
    description: "Định tuyến và chuyển log đến Fluentd khác bằng output forward."
  - title: "Buffer Section"
    url: "https://docs.fluentd.org/configuration/buffer-section"
    description: "Buffer memory/file, chính sách retry và giới hạn tài nguyên."
  - title: "Monitoring Fluentd with Prometheus"
    url: "https://docs.fluentd.org/monitoring-fluentd/monitoring-prometheus"
    description: "Theo dõi bộ đếm log, lỗi, số lần retry và hàng đợi buffer."
