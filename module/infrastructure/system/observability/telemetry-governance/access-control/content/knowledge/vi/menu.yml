menu:
- level1: Nền tảng
  level2:
  - Kiểm soát truy cập là gì trong quản trị dữ liệu quan sát
  - Vì sao log, metric, trace và profile cần được bảo vệ
  - Phân biệt định danh, xác thực, phân quyền và kiểm toán
  - Phân biệt quyền truy cập với phân loại, lọc, che và giữ dữ liệu
  - Chủ thể, tài nguyên, hành động và ngữ cảnh của một yêu cầu
  - Nguyên tắc đặc quyền tối thiểu, mặc định từ chối và nhu cầu biết
  - Phân tách nhiệm vụ và tránh tài khoản dùng chung
  - Áp dụng tư duy Zero Trust vào chuỗi thu thập và sử dụng dữ liệu
  - Phạm vi module và lộ trình từ chính sách đến kiểm chứng thực thi
- level1: Bề mặt truy cập
  level2:
  - Lập bản đồ đường đi dữ liệu từ ứng dụng đến người sử dụng
  - Phân biệt luồng dữ liệu với luồng cấu hình và quản trị
  - Kiểm kê endpoint nhận, truy vấn, quản trị và chẩn đoán
  - Nhận diện API, giao diện, CLI và truy cập trực tiếp kho lưu trữ
  - Xác định ranh giới tin cậy giữa ứng dụng, collector, gateway và backend
  - Nhận diện bản sao trong bộ đệm, hàng đợi, cache, backup và tệp xuất
  - Xác định chủ sở hữu dữ liệu, chủ hệ thống và người phê duyệt quyền
  - Lập mô hình rủi ro đọc trái phép, ghi giả, sửa và xóa dữ liệu
  - Phân tích leo thang đặc quyền và truy cập chéo nhóm hoặc tenant
  - Xác định bằng chứng để đánh giá từng biện pháp kiểm soát
- level1: Danh tính
  level2:
  - Phân biệt người dùng, tài khoản dịch vụ và danh tính ứng dụng đang chạy (workload identity)
  - Chọn định danh ổn định thay cho tên hiển thị có thể thay đổi
  - Tích hợp nhà cung cấp danh tính và nguồn dữ liệu nhân sự
  - Tổ chức nhóm theo đội, dự án, trách nhiệm và môi trường
  - Quản lý danh tính bên ngoài, nhà thầu và đối tác
  - Ánh xạ claim và thành viên nhóm vào phạm vi được cấp
  - Kiểm soát nguồn thuộc tính dùng trong quyết định phân quyền
  - Phân biệt danh tính gốc với danh tính đại diện hoặc được ủy quyền
  - Xử lý nhóm lồng nhau, nhiều nhóm và thành viên hết hiệu lực
  - Đánh giá rủi ro khi danh tính người dùng bị mất qua các tầng trung gian
- level1: Xác thực
  level2:
  - Đăng nhập tập trung bằng SSO và OpenID Connect
  - Phân biệt vai trò OIDC trong xác thực với OAuth 2.0 trong ủy quyền
  - Áp dụng MFA và xác thực bổ sung cho thao tác nhạy cảm
  - Xác minh chữ ký, issuer, audience và thời hạn token
  - Quản lý phiên đăng nhập, đăng xuất và phiên đang hoạt động
  - Xác thực ứng dụng bằng client credentials hoặc danh tính liên kết
  - Xác thực bằng chứng chỉ mTLS và ánh xạ chứng chỉ đến danh tính
  - Giới hạn sử dụng Basic Auth, API key và bearer token
  - Xử lý token hết hạn, sai đối tượng nhận và thay khóa ký
  - Kiểm soát truy cập ẩn danh và endpoint được miễn xác thực
- level1: Mô hình phân quyền
  level2:
  - Phân quyền theo vai trò với RBAC
  - Phân quyền theo thuộc tính với ABAC
  - Phân quyền theo quan hệ với ReBAC
  - Phân quyền theo nhãn và điều kiện áp dụng của LBAC
  - Phân biệt vai trò, quyền, scope và ràng buộc tài nguyên
  - Xây dựng cấp bậc vai trò và kiểm soát kế thừa quyền
  - Kết hợp vai trò với thuộc tính dịch vụ, môi trường và độ nhạy cảm
  - Phân tích bùng nổ vai trò và độ phức tạp của biểu thức chính sách
  - Phân biệt hạn ngạch, giới hạn tốc độ và quyết định cho phép truy cập
  - Lựa chọn mô hình phù hợp với tổ chức và khả năng của nền tảng
- level1: Thiết kế chính sách
  level2:
  - Chuyển yêu cầu nghiệp vụ thành ma trận chủ thể, hành động và tài nguyên
  - Tách quyền gửi, đọc, truy vấn, xuất, sửa, xóa và quản trị
  - Định nghĩa quyền theo nhóm dịch vụ và môi trường production, staging, development
  - Phân tách người cấp quyền, người triển khai và người kiểm toán
  - Thiết kế điều kiện theo thời gian, mục đích và mức tin cậy
  - Xác định quy tắc ưu tiên khi nhiều chính sách cùng áp dụng
  - Xử lý thuộc tính thiếu, không xác định và quyết định mặc định
  - Hạn chế wildcard, quyền toàn cục và quyền ủy quyền tiếp
  - Thiết kế ngoại lệ có chủ sở hữu, lý do và ngày hết hạn
  - Quản lý phiên bản chính sách và khả năng giải thích quyết định
  - Phân biệt quyền được khai báo với quyền có hiệu lực thực tế
- level1: Kiến trúc thực thi
  level2:
  - Phân biệt điểm thực thi PEP, điểm quyết định PDP, nguồn thuộc tính PIP và quản trị chính sách PAP
  - Lựa chọn phân quyền tại gateway, backend hoặc kết hợp nhiều tầng
  - Truyền danh tính và ngữ cảnh quyền giữa các dịch vụ
  - Ngăn tầng trung gian sử dụng quyền của mình thay cho quyền của người gọi
  - Đánh giá mô hình proxy dùng chung với mô hình đại diện người dùng
  - Thiết kế chính sách và dữ liệu thuộc tính cho Open Policy Agent
  - Phân biệt quyết định cho phép với nghĩa vụ lọc hoặc che dữ liệu
  - Đánh giá việc sửa truy vấn bằng cấu trúc cú pháp thay cho nối chuỗi
  - Đồng bộ quyết định giữa các đường truy cập và cụm triển khai
  - Xác định phần bảo vệ bắt buộc tại backend khi gateway gặp lỗi
- level1: Phạm vi dữ liệu
  level2:
  - 'Chọn ranh giới tài nguyên: tổ chức, tenant, dự án, dịch vụ và môi trường'
  - Phân quyền theo index, stream, dataset hoặc không gian lưu trữ
  - Kiểm soát theo bản ghi và theo trường ở backend có hỗ trợ
  - Phân biệt kiểm soát lúc ghi với kiểm soát lúc đọc
  - Áp dụng phân loại dữ liệu vào điều kiện cấp quyền
  - Kiểm soát metadata, tên trường, nhãn và gợi ý tìm kiếm
  - Phân quyền đối với dữ liệu đã tổng hợp và dữ liệu dẫn xuất
  - Kiểm soát quyền với dữ liệu lịch sử sau khi tổ chức hoặc chủ sở hữu thay đổi
  - Đánh giá giới hạn của truy vấn được thêm bộ lọc bắt buộc
  - Đặt điểm thực thi quyền gần dữ liệu và kiểm tra đường truy cập thay thế
- level1: Cách ly tenant
  level2:
  - Tenant là gì và khác gì với team, namespace hoặc thư mục
  - So sánh tách logic, tách tiến trình và tách hạ tầng
  - Ánh xạ tenant từ danh tính đã được xác thực
  - Ngăn giả mạo tenant qua header, tag và resource attribute
  - Ghi đè hoặc loại bỏ header tenant không đáng tin tại gateway
  - Bảo toàn ngữ cảnh tenant qua định tuyến, hàng đợi và exporter
  - Giới hạn truy vấn nhiều tenant và cơ chế phê duyệt tương ứng
  - Cô lập cache, dữ liệu tạm và kết quả truy vấn theo tenant
  - Tách quyền truy cập với hạn ngạch tài nguyên của mỗi tenant
  - Kiểm chứng cách ly trên cả đường ghi, đường đọc và đường quản trị
  - Quản lý tạo, di chuyển và ngừng sử dụng tenant
- level1: Quyền tiếp nhận
  level2:
  - Cấp quyền gửi theo ứng dụng, loại tín hiệu và môi trường
  - Thiết kế thông tin xác thực chỉ ghi và giới hạn đích nhận
  - Ràng buộc danh tính nguồn với service.name, namespace và tenant
  - Ngăn nguồn tự khai báo danh tính của dịch vụ khác
  - Phân quyền OTLP qua HTTP và gRPC theo thành phần hỗ trợ
  - Bảo vệ endpoint scrape và quyền đọc của hệ thống thu thập metric
  - Kiểm soát remote write và các giao thức nhận dữ liệu khác
  - Giới hạn quyền đọc tệp, journal và metadata tại agent
  - Phân tách thông tin xác thực cho từng nguồn hoặc nhóm nguồn
  - Xử lý nguồn bị thu hồi quyền mà vẫn còn dữ liệu chờ gửi
  - Kiểm chứng từ chối dữ liệu sai tenant, sai scope và sai môi trường
- level1: Collector và gateway
  level2:
  - Vai trò thực thi xác thực và phân quyền tại gateway
  - Gắn authenticator extension vào receiver hoặc exporter của OpenTelemetry Collector
  - Kiểm tra extension có trong bản phân phối và được bật đúng giao thức
  - Phân biệt xác thực kết nối với phân quyền nội dung telemetry
  - Ánh xạ danh tính đã xác thực sang tuyến xử lý được phép
  - Kiểm tra việc truyền ngữ cảnh xác thực qua batch, queue và nhiều chặng
  - Tách thông tin xác thực gửi đi khỏi token do nguồn gửi vào
  - Ngăn truy cập backend đi vòng qua gateway
  - Bảo vệ health check, pprof, zPages và endpoint quản trị
  - Giới hạn quyền đọc cấu hình, truy cập Secret và sửa pipeline
  - Đánh giá rủi ro collector dùng chung thông tin xác thực có quyền rộng
- level1: Quyền với log
  level2:
  - Phân vùng quyền đọc theo dịch vụ, stream, index và môi trường
  - Tách quyền tìm kiếm log với quyền tải toàn bộ dữ liệu
  - Kiểm soát trường nhạy cảm và bản ghi đặc biệt theo khả năng backend
  - Phân quyền log bảo mật, log kiểm toán và log ứng dụng
  - Bảo vệ truy vấn thời gian thực và tính năng xem log liên tục
  - Giới hạn truy cập metadata, label và thống kê của nguồn log
  - Thiết kế lớp xác thực phía trước Loki và ánh xạ tenant tin cậy
  - Phân biệt X-Scope-OrgID trong Loki với bằng chứng xác thực
  - Đánh giá quyền index, document và field trong Elasticsearch hoặc OpenSearch
  - Phân tách quyền truy vấn, thay cấu trúc lưu trữ, xóa và nạp lại log
- level1: Quyền với metric
  level2:
  - Bảo vệ metric nghiệp vụ và thông tin hạ tầng trong tên, nhãn, giá trị
  - Giới hạn quyền truy cập endpoint metrics và exporter
  - Đánh giá giả định bảo mật của Prometheus khi mở endpoint truy vấn
  - Thiết kế lớp phân quyền hoặc hệ thống lưu trữ nhiều tenant khi cần
  - Phân biệt bộ lọc nhãn trong dashboard với chính sách được thực thi
  - Kiểm soát remote read, federation và truy vấn dữ liệu lịch sử
  - Phân quyền recording rule và dữ liệu metric được tạo mới
  - Kiểm soát exemplars và liên kết từ metric sang trace
  - Phân tách quyền truy vấn với quyền thay scrape target và relabeling
  - Bảo vệ API quản trị, xóa chuỗi thời gian và nạp lại cấu hình
- level1: Trace và profile
  level2:
  - Phân quyền trace theo tenant, dịch vụ và môi trường
  - Kiểm soát tra cứu trực tiếp theo trace ID
  - Kiểm soát tìm kiếm span, thuộc tính và metadata của trace
  - Xử lý trace đi qua nhiều dịch vụ có phạm vi quyền khác nhau
  - Giới hạn service graph, bản đồ phụ thuộc và thống kê dẫn xuất
  - Kiểm tra lại quyền khi đi từ log hoặc metric sang trace
  - Thiết kế gateway xác thực và phân quyền trước hệ thống lưu trace
  - Đánh giá khả năng cách ly của Tempo, Jaeger hoặc nền tảng được chọn
  - Phân quyền dữ liệu profile, stack trace và thông tin mã nguồn
  - Phân tách quyền xem dữ liệu với quyền thay cấu hình lấy mẫu hoặc đo đạc
- level1: Truy vấn và xuất
  level2:
  - Thực thi quyền nhất quán ở giao diện, API và công cụ truy vấn trực tiếp
  - Kiểm soát truy vấn tức thời, theo khoảng thời gian và tìm kiếm toàn cục
  - Giới hạn metadata, tự hoàn thành và thông báo lỗi có thể tiết lộ tài nguyên
  - Phân quyền tải CSV, JSON, ảnh, báo cáo và kết quả tìm kiếm
  - Kiểm soát quyền của truy vấn chạy nền và tác vụ xuất bất đồng bộ
  - Gắn phạm vi người dùng và phiên bản chính sách vào cache khi cần
  - Xử lý kết quả đang tải khi quyền bị thu hồi giữa chừng
  - Quản lý tệp xuất tạm, URL tải và thời hạn sử dụng
  - Đánh giá truy vấn tổng hợp có thể suy ra dữ liệu ngoài phạm vi
  - Kiểm soát công cụ bên ngoài và trợ lý AI truy vấn thay người dùng
- level1: Giao diện quan sát
  level2:
  - Phân biệt vai trò tổ chức, team, folder và dashboard
  - Đánh giá quyền hiệu lực từ nhiều nguồn và quyền kế thừa
  - Phân biệt quyền xem dashboard với quyền truy vấn data source
  - Tách quyền cấu hình data source với quyền truy vấn dữ liệu
  - Quản lý tài khoản dịch vụ và token cho công cụ giao diện
  - Đánh giá RBAC, data source permissions và LBAC theo phiên bản sản phẩm
  - Kiểm tra ranh giới tính năng giữa bản OSS, Enterprise và dịch vụ Cloud
  - Phân quyền Explore, annotation, thư viện panel và công cụ bổ sung
  - Kiểm soát quyền của thông tin xác thực dùng chung trong data source
  - Ánh xạ team từ SSO và kiểm chứng quyền sau đồng bộ
- level1: Cảnh báo và chia sẻ
  level2:
  - Phân biệt quyền tạo rule với danh tính dùng để chạy truy vấn cảnh báo
  - Tách quyền xem, sửa rule, tạo silence và quản lý tuyến thông báo
  - Kiểm soát contact point, webhook và thông tin xác thực gửi thông báo
  - Giới hạn dữ liệu trong nội dung cảnh báo gửi ra ngoài nền tảng
  - Phân quyền cảnh báo được quản lý tại giao diện và tại backend
  - Đánh giá quyền Alertmanager độc lập với quyền Prometheus
  - Kiểm soát dashboard công khai, snapshot và liên kết chia sẻ
  - Quản lý nhúng dashboard và quyền của người xem
  - Phân quyền báo cáo định kỳ và danh sách người nhận
  - Thu hồi quyền chia sẻ và đánh giá các bản sao đã được tải xuống
- level1: Danh tính máy
  level2:
  - Tách tài khoản dịch vụ theo chức năng gửi, đọc và quản trị
  - Cấp thông tin xác thực riêng cho agent, collector, exporter và công cụ tự động
  - Sử dụng danh tính ứng dụng (workload identity) hoặc liên kết danh tính khi hạ tầng hỗ trợ
  - Đánh giá ServiceAccount và RBAC của collector trên Kubernetes
  - Phân biệt quyền Kubernetes API với quyền đọc telemetry tại backend
  - Quản lý Secret bằng kho bí mật và hạn chế quyền truy xuất
  - Ưu tiên thông tin xác thực ngắn hạn và tự động gia hạn
  - Luân chuyển token, mật khẩu và chứng chỉ không mở rộng quyền
  - Ngăn ghi thông tin xác thực vào log, metric label hoặc trace attribute
  - Kiểm kê chủ sở hữu, lần sử dụng và phạm vi của từng thông tin xác thực
  - Thu hồi danh tính máy không sử dụng hoặc bị nghi xâm phạm
- level1: Truy cập đặc quyền
  level2:
  - Phân biệt quản trị danh tính, quản trị hệ thống và đọc dữ liệu nhạy cảm
  - Tách tài khoản vận hành thông thường với tài khoản đặc quyền
  - Cấp quyền tạm thời theo nhu cầu và có thời hạn
  - Thiết kế quy trình break-glass cho xử lý sự cố khẩn cấp
  - Yêu cầu lý do, người phê duyệt và phạm vi của phiên đặc quyền
  - Áp dụng kiểm soát hai người cho thay đổi có tác động lớn
  - Giới hạn quyền giả lập người dùng và ủy quyền tiếp
  - Kiểm soát quyền sửa policy, exporter, routing và điểm đến dữ liệu
  - Theo dõi phiên đặc quyền và tự động kết thúc quyền tạm
  - Rà soát sau sự cố và thu hồi toàn bộ quyền phát sinh
- level1: Mạng và lưu trữ
  level2:
  - Phân đoạn mạng giữa nguồn, collector, gateway, truy vấn và quản trị
  - Kết hợp mTLS, firewall và NetworkPolicy với phân quyền ở tầng ứng dụng
  - Hạn chế đường đi trực tiếp tới database, object storage và hàng đợi
  - Cấp quyền đọc, ghi, liệt kê và xóa riêng biệt trên kho lưu trữ
  - Giới hạn tài khoản của hệ thống lưu trữ theo dataset hoặc tenant
  - Bảo vệ tệp buffer, thư mục spool và volume dùng chung
  - Kiểm soát truy cập backup, snapshot và môi trường khôi phục
  - Phân tách quyền sử dụng khóa mã hóa với quyền quản lý khóa
  - Quản lý tài khoản hỗ trợ của nhà cung cấp và kết nối quản trị từ xa
  - Đánh giá đường xuất dữ liệu qua exporter, proxy và tích hợp bên ngoài
- level1: Chính sách bằng mã
  level2:
  - Mô hình hóa vai trò, binding, scope và ngoại lệ trong tệp cấu hình
  - Lưu chính sách trong Git và quản lý người có quyền thay đổi
  - Rà soát chính sách bằng pull request và phân tách quyền phê duyệt
  - Viết quyết định phân quyền minh bạch với ngôn ngữ chính sách phù hợp
  - Kiểm tra cú pháp, kiểu dữ liệu và thuộc tính đầu vào
  - Xây dựng bộ kiểm thử quyết định cho phép và từ chối
  - Kiểm tra chính sách trước triển khai bằng dữ liệu đã loại bỏ thông tin nhạy cảm
  - Phát hành chính sách theo phiên bản và bảo vệ gói phân phối
  - Phát hiện sai lệch giữa cấu hình khai báo và trạng thái thực tế
  - Hoàn tác chính sách và kiểm soát thay đổi quyền trong quá trình triển khai
- level1: Vòng đời quyền
  level2:
  - Tiếp nhận yêu cầu quyền với mục đích, tài nguyên và thời hạn rõ ràng
  - Phê duyệt theo chủ sở hữu dữ liệu và mức độ nhạy cảm
  - Cấp quyền cho nhân sự mới, chuyển nhóm và kết thúc công việc
  - Thu hồi quyền của người dùng, nhóm và tài khoản dịch vụ
  - Xử lý phiên, token và kết nối còn hiệu lực sau khi thu hồi
  - Rà soát quyền định kỳ và xác nhận lại nhu cầu sử dụng
  - Phát hiện quyền tích lũy, tài khoản mồ côi và quyền không sử dụng
  - Quản lý quyền của đối tác có thời hạn và nhà cung cấp hỗ trợ
  - Đặt mục tiêu thời gian cấp quyền, thu hồi và xử lý ngoại lệ
  - Lưu dấu vết phê duyệt và chứng minh trạng thái quyền tại một thời điểm
- level1: Kiểm toán truy cập
  level2:
  - 'Xác định sự kiện cần ghi: đăng nhập, truy vấn, xuất và thay đổi quyền'
  - Ghi danh tính, tài nguyên, hành động, quyết định và lý do liên quan
  - Ghi phiên bản chính sách, phạm vi tenant và mã tương quan yêu cầu
  - Phân biệt log xác thực, log quyết định quyền và log truy cập dữ liệu
  - Theo dõi danh tính gốc khi có ủy quyền hoặc tài khoản trung gian
  - Giới hạn ghi nội dung truy vấn và kết quả có dữ liệu nhạy cảm
  - Chống sửa, xóa và vô hiệu hóa dấu vết kiểm toán
  - Tách quyền đọc log kiểm toán với quyền quản trị hệ thống được theo dõi
  - Quản lý thời hạn giữ và quyền truy cập bằng chứng
  - Xử lý mất log kiểm toán, trùng sự kiện và lệch thời gian
  - Đánh giá khả năng ghi kiểm toán theo sản phẩm, phiên bản và gói dịch vụ
- level1: Giám sát quyền
  level2:
  - Theo dõi tỷ lệ xác thực thất bại và quyết định từ chối
  - Phát hiện truy vấn chéo tenant và truy cập ngoài phạm vi công việc
  - Phát hiện tải dữ liệu hàng loạt và xuất dữ liệu bất thường
  - Cảnh báo thay đổi vai trò quản trị, chính sách và đường xuất dữ liệu
  - Theo dõi sử dụng break-glass và quyền tạm quá hạn
  - Phát hiện tài khoản dịch vụ có phạm vi rộng hoặc dùng sai nguồn
  - Đo độ trễ quyết định quyền và lỗi đồng bộ thuộc tính
  - Theo dõi thời gian thu hồi có hiệu lực trên toàn hệ thống
  - Thiết kế bảng theo dõi quyền hiệu lực và ngoại lệ còn mở
  - Kiểm soát quyền truy cập chính hệ thống giám sát phân quyền
- level1: Khả dụng và hiệu năng
  level2:
  - Lựa chọn hành vi từ chối khi PDP hoặc nguồn thuộc tính không sẵn sàng
  - Phân biệt lỗi xác thực, lỗi phân quyền và lỗi hạ tầng chính sách
  - Quản lý cache quyết định theo danh tính, tài nguyên, tenant và phiên bản chính sách
  - Giới hạn thời gian lưu cache theo yêu cầu thu hồi quyền
  - Kiểm soát nhất quán quyền giữa nhiều nút và nhiều vùng triển khai
  - Đánh đổi độ trễ với việc kiểm tra quyền ở từng lớp
  - Bảo vệ dịch vụ quyết định quyền trước yêu cầu quá tải
  - Thiết kế dự phòng mà không vô tình bỏ qua kiểm tra quyền
  - Kiểm tra ảnh hưởng khi dữ liệu đang truyền hoặc kết nối dài hạn
  - Duy trì đường xử lý khẩn cấp có kiểm soát trong sự cố danh tính
- level1: Kiểm chứng
  level2:
  - Lập ma trận kiểm thử theo danh tính, hành động, tài nguyên và ngữ cảnh
  - Kiểm thử trường hợp được phép và trường hợp bắt buộc bị từ chối
  - Kiểm tra truy cập ngang cấp và leo thang lên vai trò cao hơn
  - Kiểm tra giả mạo tenant header, nhãn và thuộc tính nguồn
  - Kiểm tra API trực tiếp, endpoint nội bộ và đường truy cập kho dữ liệu
  - Kiểm tra metadata, cache, truy vấn nền và tệp xuất
  - Kiểm tra liên kết giữa log, metric, trace và profile
  - Kiểm tra token hết hạn, sai audience và danh tính bị thu hồi
  - Kiểm tra quyền sau đổi nhóm, đổi chính sách và hoàn tác
  - Mô phỏng lỗi PDP, mất kết nối nhà cung cấp danh tính và cache cũ
  - Đối chiếu quyết định tại gateway với kết quả backend thực tế
  - Thiết lập tiêu chí nghiệm thu và lưu bằng chứng cách ly truy cập
- level1: Xử lý sự cố
  level2:
  - Phân biệt lỗi 401, 403, phản hồi rỗng và lỗi kết nối
  - Chẩn đoán claim, nhóm, scope hoặc tenant không đúng
  - Chẩn đoán quyền kế thừa và vai trò rộng ngoài dự kiến
  - Chẩn đoán truy vấn được phép ở giao diện nhưng bị từ chối tại backend
  - Chẩn đoán dashboard bị ẩn nhưng dữ liệu vẫn truy vấn được
  - Chẩn đoán lỗi mất danh tính hoặc tenant qua proxy và collector
  - Chẩn đoán thu hồi quyền chậm do phiên, token và cache
  - Khoanh vùng rò rỉ do data source dùng chung thông tin xác thực
  - Xử lý thông tin xác thực bị lộ và giới hạn phạm vi ảnh hưởng
  - Bảo toàn bằng chứng khi xử lý sự cố truy cập trái phép
  - Khôi phục quyền đúng phạm vi và rà soát nguyên nhân sau sự cố
- level1: Bài thực hành
  level2:
  - Xây dựng ma trận quyền cho đội phát triển, SRE và kiểm toán
  - Thiết kế RBAC kết hợp thuộc tính dịch vụ và môi trường
  - Bảo vệ OTLP tại collector với danh tính nguồn và quyền chỉ gửi
  - Dựng gateway ánh xạ danh tính sang tenant và ngăn giả mạo header
  - Triển khai cách ly hai tenant trên đường ghi và truy vấn log
  - Kiểm chứng giới hạn quyền dashboard và data source trong Grafana
  - Bảo vệ truy vấn metric và liên kết từ exemplar sang trace
  - Xây dựng chính sách bằng mã cùng kiểm thử cho phép, từ chối
  - Diễn tập thu hồi tài khoản, luân chuyển token và cache quyền
  - Diễn tập cấp quyền khẩn cấp rồi tự động thu hồi và kiểm toán
  - Thiết kế hệ thống hoàn chỉnh với bằng chứng cách ly, khả dụng và quyền tối thiểu
