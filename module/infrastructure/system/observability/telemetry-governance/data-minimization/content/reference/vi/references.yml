references:
  - title: "OpenTelemetry - Handling Sensitive Data"
    url: "https://opentelemetry.io/docs/security/handling-sensitive-data/"
    description: "Nguyên tắc data minimization, xử lý dữ liệu nhạy cảm và ví dụ loại bỏ hoặc biến đổi thuộc tính telemetry."
  - title: "OpenTelemetry - Transforming Telemetry"
    url: "https://opentelemetry.io/docs/collector/transforming-telemetry/"
    description: "Cách dùng processor để lọc, xóa thuộc tính và biến đổi logs, metrics, traces trước khi xuất."
  - title: "OpenTelemetry - Collector Configuration"
    url: "https://opentelemetry.io/docs/collector/configuration/"
    description: "Cấu trúc receivers, processors, exporters và pipelines để triển khai quy tắc xử lý dữ liệu."
  - title: "OpenTelemetry - Sampling"
    url: "https://opentelemetry.io/docs/concepts/sampling/"
    description: "Khái niệm và các cách lấy mẫu trace nhằm giảm khối lượng thu thập."
  - title: "OpenTelemetry - Collector Configuration Best Practices"
    url: "https://opentelemetry.io/docs/security/config-best-practices/"
    description: "Biện pháp bảo vệ Collector và làm sạch dữ liệu nhạy cảm trước khi gửi tới backend."
  - title: "OpenTelemetry - Attribute Requirement Levels"
    url: "https://opentelemetry.io/docs/specs/semconv/general/attribute-requirement-level/"
    description: "Phân biệt thuộc tính required, recommended và opt-in để lựa chọn trường dữ liệu có chủ đích."
  - title: "European Commission - Principles of the GDPR"
    url: "https://commission.europa.eu/law/law-topic/data-protection/information-business-and-organisations/principles-gdpr_en"
    description: "Giải thích nguyên tắc purpose limitation, data minimisation, storage limitation và trách nhiệm giải trình đối với dữ liệu cá nhân."