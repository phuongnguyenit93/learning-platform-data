menu:
- level1: Nền tảng redaction
  level2:
  - Redaction là gì và vai trò trong quản trị dữ liệu quan sát
  - Vì sao log, trace và metric có thể làm lộ dữ liệu nhạy cảm
  - 'Các thành phần: dữ liệu đầu vào, bộ nhận diện, quy tắc và đầu ra'
  - Luồng dữ liệu từ ứng dụng đến nơi lưu trữ và người sử dụng
  - Ví dụ trước và sau redaction với dữ liệu hoàn toàn giả lập
  - Cân bằng bảo vệ dữ liệu với khả năng chẩn đoán hệ thống
  - Điều kiện tiên quyết và trình tự học từ khái niệm đến vận hành
- level1: Ranh giới kỹ thuật
  level2:
  - Phân biệt redaction với che một phần giá trị (masking)
  - Phân biệt xóa trường nhạy cảm với lọc bỏ toàn bộ bản ghi
  - Quan hệ giữa redaction và giảm thiểu dữ liệu ngay khi thu thập
  - Phân biệt redaction với băm, mã hóa và thay bằng mã đại diện
  - Vì sao redaction không tự bảo đảm dữ liệu đã được ẩn danh
  - Giới hạn của cắt ngắn chuỗi, lấy mẫu và che dữ liệu trên giao diện
  - Phạm vi của redaction trong bảo vệ dữ liệu và yêu cầu tuân thủ
- level1: Dữ liệu cần bảo vệ
  level2:
  - Dữ liệu định danh trực tiếp và thông tin có thể kết hợp để định danh
  - Mật khẩu, khóa API, token truy cập và thông tin xác thực
  - Cookie phiên, mã đặt lại mật khẩu và liên kết chứa bí mật
  - Thông tin thanh toán, tài chính, sức khỏe và dữ liệu nghiệp vụ
  - Địa chỉ IP, vị trí, định danh thiết bị và thông tin người dùng
  - Tên trường, tên tệp và siêu dữ liệu cũng có thể chứa thông tin nhạy cảm
  - Phân loại dữ liệu theo ngữ cảnh thay vì chỉ dựa vào mẫu ký tự
  - Lập danh mục trường cần loại bỏ, thay thế hoặc được phép giữ
- level1: Bản đồ rò rỉ
  level2:
  - Kiểm kê nơi phát sinh dữ liệu quan sát và bên sở hữu nguồn dữ liệu
  - Xác định ranh giới tin cậy giữa ứng dụng, agent, gateway và nhà cung cấp
  - Theo dấu bản sao qua stdout, tệp log, hàng đợi và kho lưu trữ
  - Phát hiện đường xuất phụ, chế độ debug và kênh dự phòng bỏ qua redaction
  - Rủi ro từ tự động đo đạc, thư viện bên thứ ba và cấu hình thu thập
  - Rủi ro từ dashboard, cảnh báo, báo cáo và tệp xuất dữ liệu
  - Đánh giá tình huống đầu vào cố tình né quy tắc nhận diện
  - Ưu tiên vị trí khắc phục theo mức nhạy cảm và phạm vi phát tán
- level1: Chính sách redaction
  level2:
  - Xác định mục tiêu bảo vệ và thông tin chẩn đoán tối thiểu cần giữ
  - Mô tả quy tắc theo tín hiệu, dịch vụ, trường dữ liệu và điểm xuất
  - Danh sách trường được phép và danh sách trường cần loại bỏ
  - Chọn xóa trường hoặc thay toàn bộ giá trị theo từng trường hợp
  - Quy ước nhãn thay thế để phân biệt đã xử lý với dữ liệu vốn bị thiếu
  - Thứ tự ưu tiên khi nhiều quy tắc cùng áp dụng hoặc mâu thuẫn
  - Xử lý trường chưa biết, khóa động và thay đổi cấu trúc dữ liệu
  - Ngoại lệ có chủ sở hữu, phạm vi, thời hạn và tiêu chí chấm dứt
  - Tiêu chí chấp nhận và trường hợp bắt buộc ngăn dữ liệu đi tiếp
- level1: Vị trí xử lý
  level2:
  - Ngăn ghi dữ liệu nhạy cảm ngay tại mã nguồn và điểm đo đạc
  - Redaction ở SDK, bộ ghi log và trước khi tạo hàng đợi bất đồng bộ
  - Redaction tại agent cục bộ và gateway tập trung
  - Xử lý trước khi truyền ra ngoài hoặc ghi vào bộ đệm bền vững
  - Phối hợp nhiều lớp bảo vệ và xác định trách nhiệm từng lớp
  - Thứ tự phân tích cấu trúc, làm giàu dữ liệu, redaction và xuất dữ liệu
  - Ngăn dữ liệu nhạy cảm xuất hiện lại sau bước làm giàu hoặc định tuyến
  - Giới hạn của xử lý tại kho dữ liệu khi bản gốc đã được thu thập
- level1: Nhận diện dữ liệu
  level2:
  - Nhận diện theo tên khóa, đường dẫn trường và cấu trúc dữ liệu
  - Nhận diện theo mẫu giá trị và biểu thức chính quy (regex)
  - Kết hợp loại dữ liệu, ngữ cảnh nghiệp vụ và quy tắc nhận diện
  - Nhận diện email, số điện thoại và định danh có nhiều cách biểu diễn
  - Nhận diện token, chuỗi kết nối và bí mật không có định dạng cố định
  - Khớp nhầm dữ liệu an toàn và bỏ sót dữ liệu nhạy cảm
  - Giới hạn của kiểm tra định dạng, checksum và độ ngẫu nhiên
  - Chọn bộ phân tích chuyên dụng thay vì áp dụng regex cho mọi đầu vào
  - Giới hạn và cách đánh giá bộ nhận diện dùng mô hình học máy
- level1: Chuẩn hóa đầu vào
  level2:
  - Chuẩn hóa chữ hoa, chữ thường và bí danh của tên trường
  - Xử lý Unicode, dấu tiếng Việt và ký tự có hình dạng tương tự
  - Xử lý khoảng trắng, ký tự điều khiển và ký tự phân tách
  - Nhận diện dữ liệu trong URL encoding, JSON escape và chuỗi lồng nhau
  - Giải mã có giới hạn đối với dữ liệu Base64 hoặc mã hóa nhiều lớp
  - Phân tích JSON trong chuỗi và xử lý dữ liệu không đúng định dạng
  - Đặt giới hạn độ sâu, kích thước và số bước giải mã
  - Giữ ngữ nghĩa đầu vào và tránh chuẩn hóa làm mất dấu vết cần thiết
- level1: Thực thi quy tắc
  level2:
  - Xóa trường nhạy cảm và xử lý trường bắt buộc của cấu trúc đầu ra
  - Thay toàn bộ giá trị hoặc phần nhạy cảm bằng nhãn cố định
  - Xử lý object lồng nhau, mảng và tập hợp có kiểu phần tử khác nhau
  - Xử lý khóa chứa dữ liệu nhạy cảm và xung đột sau khi đổi khóa
  - Phân biệt trường không tồn tại, null, chuỗi rỗng và giá trị không hợp lệ
  - Xử lý nhiều lần xuất hiện, mẫu chồng lấn và thứ tự thay thế
  - Tính xác định và tính lũy đẳng khi dữ liệu đi qua nhiều lớp redaction
  - Ngăn tham chiếu dùng chung hoặc xử lý đồng thời làm lọt bản gốc
- level1: Log có cấu trúc
  level2:
  - Redaction trong nội dung bản ghi và thuộc tính đi kèm
  - Chọn trường theo đường dẫn trong JSON có cấu trúc lồng nhau
  - Loại bỏ dữ liệu nhạy cảm trong MDC và ngữ cảnh ghi log
  - Bảo vệ đối tượng được tuần tự hóa từ DTO, Map và thông điệp nghiệp vụ
  - Xử lý JSON trùng khóa, khóa động và cấu trúc thay đổi giữa bản ghi
  - Redaction thông báo lỗi, chi tiết xác thực đầu vào và ngăn xếp lời gọi
  - Giữ mức log, thời gian, mã sự kiện và ngữ cảnh chẩn đoán cần thiết
  - Ngăn logger phụ, appender khác hoặc tệp dự phòng ghi bản chưa xử lý
- level1: Log văn bản
  level2:
  - Khác biệt giữa xử lý thông điệp tự do và log có cấu trúc
  - Phân tích chuỗi khóa–giá trị, dấu phân cách và ký tự escape
  - Redaction nhiều loại thông tin nhạy cảm trong cùng một thông điệp
  - Xử lý log nhiều dòng, ngăn xếp ngoại lệ và ranh giới bản ghi
  - Xử lý bản ghi bị cắt, bị chia khối hoặc thiếu dấu kết thúc
  - Giới hạn regex khi bí mật trải qua nhiều phần hoặc nhiều bản ghi
  - Phân biệt ngăn chèn log (log injection) với loại bỏ dữ liệu nhạy cảm
  - Chính sách xử lý văn bản không thể phân tích an toàn
- level1: Traces và ngữ cảnh
  level2:
  - Rà soát tên span, thuộc tính, sự kiện, liên kết và thông báo trạng thái
  - Redaction dữ liệu nhạy cảm trong thuộc tính resource và scope
  - Dùng mẫu tuyến đường thay cho URL chứa định danh cụ thể
  - Xử lý sự kiện ngoại lệ và tham số nghiệp vụ trong trace
  - Bảo vệ baggage và dữ liệu lan truyền giữa các dịch vụ
  - Phân biệt Trace ID, Span ID và định danh người dùng hoặc phiên
  - Giữ liên kết log–trace mà không tái đưa dữ liệu nhạy cảm vào bản ghi
  - Đánh giá tác động lên lấy mẫu theo đuôi và định tuyến trace
  - Kiểm tra tính nhất quán giữa tự động đo đạc và đo đạc thủ công
- level1: Metrics và profiles
  level2:
  - Phát hiện dữ liệu nhạy cảm trong nhãn và thuộc tính điểm dữ liệu
  - Tránh dùng thông tin người dùng làm tên hoặc nhãn metric
  - Xóa nhãn có thể làm trùng chuỗi thời gian và thay đổi phép tổng hợp
  - Giữ ý nghĩa đo lường khi loại bỏ chiều dữ liệu nhạy cảm
  - Rà soát exemplar, thuộc tính resource và thông tin liên kết trace
  - Nhận diện thông tin nhạy cảm trong nhãn profile và đường dẫn tệp
  - Kiểm tra khả năng hỗ trợ redaction theo tín hiệu và phiên bản công cụ
- level1: HTTP và API
  level2:
  - Loại bỏ Authorization, Cookie và header tùy biến chứa bí mật
  - Redaction tham số truy vấn, đoạn đường dẫn và URL có thông tin đăng nhập
  - Xử lý URL ký số, liên kết dùng một lần và tham số chuyển hướng
  - Chính sách thu thập request body và response body theo loại nội dung
  - Xử lý JSON, form, multipart và nội dung tệp được tải lên
  - Loại bỏ mật khẩu, OTP và token khỏi log đăng nhập hoặc xác thực
  - Ngăn lỗi xác thực đầu vào phản chiếu dữ liệu nhạy cảm vào telemetry
  - Kiểm tra dữ liệu ở reverse proxy, access log và phía ứng dụng
- level1: Truy vấn và thông điệp
  level2:
  - Loại bỏ giá trị literal và tham số nhạy cảm trong câu truy vấn SQL
  - Phân biệt câu truy vấn đã tham số hóa với log ghi giá trị bind
  - Xử lý chuỗi kết nối, tên cơ sở dữ liệu và thông tin truy cập
  - Redaction lệnh Redis và truy vấn dữ liệu có cấu trúc
  - Rà soát tham số và biến đầu vào trong lời gọi RPC hoặc GraphQL
  - Bảo vệ header, khóa và payload thông điệp trong hệ thống hàng đợi
  - Xử lý telemetry từ retry, dead-letter queue và công cụ phát lại
  - Giữ loại thao tác và thông tin lỗi mà không giữ dữ liệu nghiệp vụ
- level1: Java và Spring Boot
  level2:
  - Thiết kế đối tượng ghi log an toàn thay cho ghi toàn bộ đối tượng nghiệp vụ
  - Rà soát toString(), record và mã sinh tự động có thể lộ trường nhạy cảm
  - Giới hạn của ghi log có tham số trong SLF4J đối với bảo vệ dữ liệu
  - Redaction qua Logback encoder, layout và appender theo cấu trúc đầu ra
  - Kiểm soát MDC khi xử lý bất đồng bộ và chuyển luồng
  - Loại bỏ bí mật trong exception message, cause và lỗi kiểm tra dữ liệu
  - Rà soát bộ lọc, interceptor và cơ chế ghi request/response trong Spring
  - Rà soát cấu hình Java agent và dữ liệu tự động thu thập
  - Kiểm tra redaction với AsyncAppender, log xoay vòng và nhiều đích ghi
  - Kiểm thử đầu ra log và OTLP bằng dữ liệu giả lập
- level1: OpenTelemetry Collector
  level2:
  - Chọn redaction processor, transform processor hoặc xử lý tại nguồn
  - Kiểm tra bản phân phối, phiên bản và tín hiệu được processor hỗ trợ
  - Thiết kế danh sách khóa được phép và quy tắc xử lý giá trị nhạy cảm
  - 'Xác minh phạm vi xử lý: thuộc tính, nội dung log và tên span'
  - Kiểm tra thứ tự processor trong từng pipeline logs, traces và metrics
  - Rà soát pipeline phân nhánh, connector và đường xuất trực tiếp
  - Ngăn log debug và thuộc tính chẩn đoán của processor làm lộ dữ liệu
  - Kiểm chứng cấu hình với dữ liệu thực nghiệm trước khi đưa vào vận hành
- level1: Biến đổi bằng OTTL
  level2:
  - Ngữ cảnh resource, scope, log, span, spanevent và datapoint
  - Chọn đường dẫn và điều kiện áp dụng đúng kiểu dữ liệu
  - Xóa khóa nhạy cảm hoặc chỉ giữ danh sách khóa được phép
  - Thay mẫu trong giá trị chuỗi bằng hàm biến đổi phù hợp
  - Phân tích nội dung JSON trước khi xử lý các trường lồng nhau
  - Kiểm tra nil, kiểu dữ liệu và dữ liệu không phân tích được
  - Thứ tự câu lệnh và nguy cơ tạo bản sao trong bộ nhớ tạm
  - Ý nghĩa error_mode và cách kiểm chứng hành vi khi biến đổi thất bại
  - Giới hạn tính năng, cú pháp và khả năng tương thích giữa các phiên bản
- level1: An toàn khi lỗi
  level2:
  - Chọn ngừng chuyển dữ liệu hoặc tiếp tục khi redaction thất bại
  - Xử lý lỗi cấu hình, regex không hợp lệ và quy tắc không tải được
  - Xử lý quá thời gian, thiếu bộ nhớ và bộ nhận diện không khả dụng
  - Tránh đường dự phòng tự động chuyển tiếp dữ liệu nguyên bản
  - Kiểm soát dữ liệu trong bộ đệm, hàng đợi bền vững và vùng cách ly
  - Xử lý bản ghi không hợp lệ mà không ghi nguyên văn vào log lỗi
  - Kiểm tra retry, phát lại và tính lũy đẳng sau sự cố
  - Đánh đổi giữa mất tín hiệu quan sát và nguy cơ lộ dữ liệu
- level1: Giá trị chẩn đoán
  level2:
  - Định nghĩa những câu hỏi vận hành phải trả lời được sau redaction
  - Giữ mã lỗi, loại thao tác và ngữ cảnh kỹ thuật cần thiết
  - Tránh xóa quá mức làm mất khả năng điều tra nguyên nhân
  - Phân biệt dữ liệu vốn bị thiếu với dữ liệu đã bị loại bỏ theo chính sách
  - Đánh giá tác động lên truy vấn, dashboard, cảnh báo và SLO
  - Đánh giá khả năng liên kết dữ liệu còn lại và rủi ro tái định danh
  - Thiết kế mã tương quan an toàn khi cần theo dõi một luồng nghiệp vụ
- level1: Kiểm thử quy tắc
  level2:
  - Xây dựng bộ dữ liệu giả lập có nhãn nhạy cảm và kết quả mong đợi
  - Kiểm thử trường hợp khớp đúng, khớp nhầm và bỏ sót
  - Kiểm thử Unicode, mã hóa, chuỗi nhiều dòng và mẫu bị biến đổi
  - Kiểm thử object lồng nhau, mảng, null và dữ liệu sai kiểu
  - Kiểm thử nhiều quy tắc, mẫu chồng lấn và ngoại lệ
  - Kiểm thử tính lũy đẳng, tính xác định và bảo toàn cấu trúc
  - Kiểm thử sinh dữ liệu và fuzzing đối với đầu vào bất thường
  - So sánh đầu ra chuẩn và kiểm tra âm tính rằng bí mật không còn xuất hiện
  - Quản lý dữ liệu kiểm thử để tránh dùng thông tin thật hoặc bí mật thật
- level1: Kiểm thử xuyên suốt
  level2:
  - Dựng luồng ứng dụng–collector–kho thử nghiệm có thể kiểm tra đầu ra
  - Đưa chuỗi đánh dấu giả lập vào mọi vị trí có khả năng rò rỉ
  - Kiểm tra đồng thời log, trace, metric và các bản sao trung gian
  - Kiểm tra hàng đợi, tệp cục bộ, dead-letter queue và đường xuất phụ
  - Thử lỗi processor, mất kết nối, khởi động lại và tải cấu hình mới
  - Kiểm tra dữ liệu sau phát lại và sau khi quay về phiên bản cấu hình trước
  - Xác nhận truy vấn chẩn đoán vẫn hoạt động sau khi áp dụng chính sách
  - Thiết lập cổng kiểm tra trong CI để phát hiện hồi quy và cấu hình bỏ sót
- level1: Hiệu năng và quy mô
  level2:
  - Đo độ trễ, thông lượng, CPU và bộ nhớ của từng lớp redaction
  - Đánh giá chi phí phân tích cấu trúc so với quét văn bản
  - Biên dịch và tái sử dụng mẫu theo khả năng của công cụ
  - Nhận diện regex tốn tài nguyên và khác biệt giữa các bộ máy regex
  - Giới hạn kích thước bản ghi, độ sâu dữ liệu và số quy tắc
  - Xử lý áp lực ngược, đầy hàng đợi và dữ liệu tăng đột biến
  - Đánh giá xử lý song song, chia lô và số lần sao chép dữ liệu
  - Đo hiệu năng với đầu vào xấu mà vẫn giữ yêu cầu bảo vệ dữ liệu
- level1: Triển khai chính sách
  level2:
  - Quản lý cấu hình redaction bằng phiên bản và quy trình duyệt thay đổi
  - Phân phối chính sách nhất quán giữa môi trường, dịch vụ và tenant
  - Kiểm tra cấu hình và khả năng hỗ trợ trước khi khởi động
  - Triển khai thử trên phạm vi hẹp bằng dữ liệu đã được kiểm soát
  - Đánh giá quy tắc mới mà không xuất thêm bản sao dữ liệu nguyên bản
  - Phát hiện lệch cấu hình, pipeline thiếu processor và đường đi bỏ qua
  - Quay về phiên bản trước mà không khôi phục lỗ hổng đã biết
  - Rà soát quy tắc khi nâng cấp công cụ hoặc thay đổi cấu trúc telemetry
- level1: Giám sát redaction
  level2:
  - Theo dõi số bản ghi xử lý, số trường loại bỏ và lỗi biến đổi
  - Đo tỷ lệ khớp theo quy tắc mà không đưa dữ liệu nhạy cảm vào nhãn metric
  - Giới hạn độ chi tiết của log chẩn đoán và dấu vết kiểm toán
  - Cảnh báo khi tỷ lệ xử lý thay đổi bất thường hoặc quy tắc ngừng có tác dụng
  - Kiểm tra khả năng phát hiện rò rỉ bằng dữ liệu đánh dấu giả lập
  - Đánh giá bỏ sót bằng bộ dữ liệu kiểm soát thay vì chỉ nhìn số lần khớp
  - Theo dõi phiên bản chính sách đang chạy và độ bao phủ từng pipeline
  - Thiết kế dashboard vận hành và quy trình xử lý cảnh báo
- level1: Ứng phó và quản trị
  level2:
  - Ngăn phát tán tiếp khi phát hiện telemetry chứa dữ liệu nhạy cảm
  - Xác định khoảng thời gian, dịch vụ, đường xuất và bản sao bị ảnh hưởng
  - Thu hồi hoặc thay thông tin xác thực đã bị lộ khi cần thiết
  - Xử lý dữ liệu đã lưu trong index, cache, tệp xuất và bản sao lưu
  - Phối hợp quyền truy cập, lưu giữ và xóa dữ liệu sau sự cố
  - Lưu bằng chứng xử lý mà không nhân bản dữ liệu nhạy cảm
  - Phân công chủ sở hữu chính sách, phê duyệt ngoại lệ và rà soát định kỳ
  - Lập báo cáo phạm vi bảo vệ, giới hạn và rủi ro còn tồn tại
  - Không suy diễn đạt tuân thủ chỉ từ việc bộ quy tắc chạy thành công
- level1: Thực hành tổng hợp
  level2:
  - Thiết kế chính sách redaction cho telemetry của một API đăng nhập
  - Xây dựng bộ ghi log JSON an toàn cho ứng dụng Java/Spring Boot
  - Loại bỏ dữ liệu nhạy cảm trong HTTP, truy vấn và trace ngoại lệ
  - Cấu hình Collector và OTTL cho luồng nhiều tín hiệu
  - Tìm và khắc phục đường rò rỉ qua debug exporter hoặc hàng đợi
  - Kiểm chứng tác động của xóa nhãn metric lên kết quả tổng hợp
  - Diễn tập lỗi redaction, phát lại dữ liệu và khôi phục cấu hình
  - Hoàn thiện bộ kiểm thử, bằng chứng đầu ra và danh sách kiểm tra vận hành
