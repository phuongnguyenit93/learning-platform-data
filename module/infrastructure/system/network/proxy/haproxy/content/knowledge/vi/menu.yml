  - Xác thực HTTP Basic bằng userlist và giới hạn sử dụng
  - Xác minh JWT khi phiên bản hỗ trợ và phân định trách nhiệm xác thực
  - Kiểm tra Host, phương thức, kích thước và cấu trúc yêu cầu
  - Chuẩn hóa URI và phòng tránh vượt qua quy tắc định tuyến
  - HTTP request smuggling và tính nhất quán giữa các bộ phân tích
  - Xử lý header chuyển tiếp giả mạo và ranh giới tin cậy
  - Giảm tác động Slowloris, quét tự động và lưu lượng gây quá tải
  - Tích hợp WAF khi cần và giới hạn của ACL so với WAF
  - Cập nhật bản vá, kiểm tra cấu hình an toàn và kiểm soát bí mật
- level1: Cache và nén
  level2:
  - Phạm vi bộ nhớ đệm HTTP tích hợp và trường hợp sử dụng phù hợp
  - Khối cache, cache-use và cache-store
  - Điều kiện lưu phản hồi, thời gian sống và kích thước đối tượng
  - Cache-Control, Vary, cookie và dữ liệu riêng tư
  - Đánh đổi khi vô hiệu hóa hoặc thay mới nội dung đã lưu
  - Cấu hình nén phản hồi và thương lượng Accept-Encoding
  - Chọn MIME type và tránh nén lại nội dung đã nén
  - Đánh giá CPU, bộ nhớ, băng thông và rủi ro rò rỉ qua nén
  - Phân biệt cache trong HAProxy với CDN và hệ thống cache chuyên dụng
- level1: Ghi log
  level2:
  - Luồng ghi log tới syslog, stdout và hệ thống thu thập tập trung
  - Cấu hình log trong global, defaults và từng proxy
  - Định dạng httplog, tcplog và trường hợp lựa chọn
  - Đọc frontend, backend, server, trạng thái và số byte trong log
  - Các bộ đếm thời gian chờ, kết nối và phản hồi
  - Mã trạng thái kết thúc kết nối và cách khoanh vùng lỗi
  - Định dạng log tùy chỉnh và thoát ký tự để tạo dữ liệu có cấu trúc
  - Ghi lại header, cookie và biến có chọn lọc
  - Định danh yêu cầu và liên kết log với ứng dụng
  - Điều chỉnh mức log, lấy mẫu và kiểm soát lưu lượng log
  - Che dữ liệu nhạy cảm, lưu giữ log và kiểm tra mất log
- level1: Giám sát
  level2:
  - Trang thống kê HAProxy và cách giới hạn quyền truy cập
  - Đọc trạng thái frontend, backend và từng server
  - Chỉ số số kết nối, tốc độ phiên, hàng đợi và lỗi
  - Chỉ số health check và phân biệt sự cố máy chủ với sự cố proxy
  - Xuất số liệu Prometheus theo tính năng của bản cài đặt
  - Thiết kế dashboard về lưu lượng, độ trễ, lỗi và bão hòa
  - Cảnh báo hết backend, hàng đợi tăng và chạm giới hạn kết nối
  - Theo dõi lỗi TLS, chứng chỉ sắp hết hạn và DNS bất thường
  - Đo từ bên ngoài để phát hiện lỗi mà kiểm tra nội bộ bỏ sót
  - Đối chiếu số liệu HAProxy với hệ điều hành và ứng dụng
- level1: Runtime API
  level2:
  - Stats socket, Runtime API và Master CLI
  - Cấu hình socket Unix, quyền truy cập và mức quyền lệnh
  - Kết nối bằng socat và khám phá lệnh đúng phiên bản
  - Đọc show info, show stat và trạng thái máy chủ
  - Đưa máy chủ vào drain hoặc maintenance và cho nhận tải trở lại
  - Thay đổi trọng số, giới hạn kết nối và tham số máy chủ
  - Cập nhật ACL, map và stick-table khi dịch vụ đang chạy
  - Cập nhật chứng chỉ bằng set ssl cert và commit ssl cert
  - Thêm hoặc bỏ máy chủ động theo khả năng của phiên bản
  - Phân biệt thay đổi trong bộ nhớ với cấu hình bền vững
  - Ghi nhận thao tác quản trị và xây dựng khả năng quay lại trạng thái trước
- level1: Quản trị cấu hình
  level2:
  - Quản lý cấu hình như mã nguồn và quy trình duyệt thay đổi
  - Tạo cấu hình từ mẫu và tách dữ liệu theo môi trường
  - Kiểm tra cú pháp, cảnh báo và tham chiếu trước triển khai
  - Reload mềm, restart và graceful stop
  - Chuyển giao listener và xử lý các worker cũ
  - Giới hạn thời gian tồn tại kết nối cũ với hard-stop-after
  - Lưu và nạp trạng thái server qua lần khởi động hoặc reload
  - Triển khai cấu hình nguyên tử và quay lại bản trước khi kiểm tra thất bại
  - Phân biệt Runtime API với Data Plane API
  - Tự động hóa thay đổi bằng Data Plane API và kiểm soát ghi đồng thời
  - Nâng cấp phiên bản, kiểm tra tương thích và kế hoạch quay lại
- level1: Sẵn sàng cao
  level2:
  - Điểm lỗi duy nhất khi chỉ triển khai một HAProxy
  - Mô hình active-passive với Keepalived, VRRP và địa chỉ IP ảo
  - Kiểm tra tiến trình, đường mạng và khả năng phục vụ trước chuyển nút
  - Điều kiện mạng cho VRRP và xử lý nguy cơ hai nút cùng nhận vai trò chính
  - Active-active với cân bằng tải bên ngoài, DNS hoặc định tuyến mạng
  - Đồng bộ cấu hình, chứng chỉ và dữ liệu peers giữa các nút
  - Những trạng thái không được sao chép và tác động tới kết nối đang mở
  - Failover, failback và tránh chuyển vai trò liên tục
  - Bảo trì từng nút và nâng cấp luân phiên
  - Kiểm thử mất tiến trình, mất máy, mất mạng và mất toàn bộ backend
- level1: Hiệu năng
  level2:
  - Xác định mục tiêu thông lượng, độ trễ và số kết nối đồng thời
  - Thiết kế phép đo với wrk, h2load và công cụ phù hợp giao thức
  - Phân biệt giới hạn của máy phát tải, proxy và backend
  - Đọc phân vị độ trễ thay vì chỉ số trung bình
  - File descriptor, backlog, cổng tạm và trạng thái TCP của hệ điều hành
  - Chọn số luồng, gắn CPU và xem xét ảnh hưởng NUMA
  - Dự trù bộ nhớ cho kết nối, bộ đệm, TLS, cache và stick-table
  - Tối ưu chi phí TLS, bắt tay và tái sử dụng kết nối
  - Chi phí regex, ACL, log, nén và tiện ích mở rộng
  - Tối ưu HTTP/2, kết nối backend và luồng dữ liệu dài hạn
  - Đo lại từng thay đổi và phát hiện suy giảm hiệu năng
- level1: Tích hợp ứng dụng
  level2:
  - HAProxy trước Spring Boot và cấu hình tin cậy header chuyển tiếp
  - Kiểm tra readiness của ứng dụng bằng endpoint sức khỏe phù hợp
  - Khớp timeout và giới hạn kết nối với web server hoặc connection pool
  - Rút ứng dụng khỏi nhận tải trước khi dừng để triển khai an toàn
  - 'Ứng dụng có phiên: cookie, Redis và thiết kế không lưu trạng thái cục bộ'
  - Phối hợp HAProxy với CDN, Nginx hoặc cân bằng tải của nhà cung cấp
  - Triển khai trong Docker Compose và cập nhật địa chỉ dịch vụ
  - Phân biệt HAProxy độc lập với HAProxy Kubernetes Ingress Controller
  - Định tuyến Ingress, TLS và kiểm tra cấu hình được controller sinh ra
  - Cân bằng kết nối cơ sở dữ liệu và yêu cầu nhận biết vai trò primary, replica
  - Phân định trách nhiệm giữa HAProxy, API Gateway và service mesh
- level1: Mở rộng
  level2:
  - Khi nào nên mở rộng và khi nào nên giữ cấu hình khai báo
  - 'Lua: nạp mã, đăng ký converter, sample fetch và action'
  - Lua service và tạo phản hồi theo yêu cầu
  - Giới hạn thời gian, bộ nhớ và thao tác chặn trong Lua
  - SPOE, SPOA và cách chuyển xử lý sang dịch vụ bên ngoài
  - Thiết kế khi dịch vụ mở rộng chậm, lỗi hoặc không kết nối được
  - Tích hợp kiểm tra bảo mật ngoài HAProxy và chính sách cho phép khi lỗi
  - Truyền định danh truy vết và tích hợp theo khả năng của bản cài đặt
  - Kiểm thử, đo chi phí và kiểm soát phụ thuộc của tiện ích mở rộng
- level1: Xử lý sự cố
  level2:
  - Quy trình khoanh vùng từ DNS, TCP, TLS tới HTTP và ứng dụng
  - 'Không khởi động được: lỗi cú pháp, quyền tệp và cổng bị chiếm'
  - 'Không kết nối được: listener, firewall, định tuyến và backlog'
  - HTTP 400, 403, 408 và lỗi quy tắc kiểm tra yêu cầu
  - HTTP 502, 503, 504 và cách xác định phía phát sinh
  - Backend luôn DOWN dù ứng dụng vẫn truy cập trực tiếp được
  - Lỗi chọn chứng chỉ, SNI, ALPN và xác minh backend TLS
  - Vòng lặp chuyển hướng, sai URL và sai giao thức gốc
  - Phân tải không đều, mất phiên và thử lại gây trùng giao dịch
  - Độ trễ tăng do xếp hàng, cạn kết nối hoặc backend chậm
  - WebSocket, gRPC hoặc luồng dữ liệu bị ngắt định kỳ
  - Lỗi DNS động, container thay IP và máy chủ không được cập nhật
  - Dùng curl, tcpdump, ss và Runtime API để thu thập bằng chứng
  - Phân tích sự cố, bảo vệ dữ liệu thu thập và cập nhật hướng dẫn vận hành
- level1: Thực hành tổng hợp
  level2:
  - Dựng reverse proxy HTTP với hai backend và chứng minh chia tải
  - Định tuyến nhiều tên miền, nhiều dịch vụ và tuyến mặc định
  - Triển khai HTTPS, mTLS và xác minh TLS ở backend
  - Cân bằng TCP và phân luồng TLS theo SNI
  - Chủ động làm hỏng backend để kiểm chứng health check và chuyển tải
  - Tạo tình huống quá tải để đo hàng đợi, timeout và thử lại
  - Áp dụng giới hạn tốc độ và kiểm tra người dùng chung địa chỉ nguồn
  - So sánh cookie gắn kết phiên với ứng dụng lưu phiên bên ngoài
  - Triển khai canary, blue-green và quay lại bản cũ
  - Thay map, trọng số và chứng chỉ khi đang phục vụ
  - Thiết lập log, dashboard, cảnh báo và truy vết một yêu cầu lỗi
  - Kiểm chứng reload mềm và rút kết nối khi bảo trì
  - Diễn tập failover hai nút HAProxy và ghi nhận kết nối bị ảnh hưởng
  - Lập bộ kiểm tra hồi quy cấu hình và tiêu chí đưa vào vận hành
