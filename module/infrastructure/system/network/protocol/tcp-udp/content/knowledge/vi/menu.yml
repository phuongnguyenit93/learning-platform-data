  - 'tcpdump: bắt theo host, port, TCP và UDP'
  - 'Wireshark: phân tích phiên và Follow TCP Stream'
  - Đọc handshake, payload, ACK, FIN và RST theo thời gian
  - Nhận diện retransmission, out-of-order và duplicate ACK
  - Phân tích receive window, zero window và RTT
  - Thống kê luồng UDP, tốc độ, mất gói và jitter
  - Giới hạn của suy luận từ bản chụp một phía
  - Đồng bộ thời gian và đối chiếu bản chụp hai đầu
  - Ẩn danh và lưu trữ tệp PCAP phục vụ phân tích
- level1: Công cụ chẩn đoán
  level2:
  - 'ss và netstat: cổng, trạng thái và hàng đợi socket'
  - 'lsof: ánh xạ socket với tiến trình'
  - 'nc và socat: thử kết nối và truyền dữ liệu tối thiểu'
  - curl và giới hạn khi dùng công cụ tầng ứng dụng để suy luận TCP
  - 'iperf3: đo TCP, UDP và chọn tham số thí nghiệm'
  - ping, traceroute và giới hạn khi suy luận chất lượng TCP/UDP
  - Thông số TCP theo kết nối qua TCP_INFO
  - Bộ đếm lỗi mạng, dropped packets và bộ đệm hệ điều hành
  - Phân biệt lỗi DNS, IP, transport và giao thức ứng dụng
- level1: Xử lý sự cố
  level2:
  - Connection Refused và kiểm tra cổng lắng nghe
  - Connect timeout, SYN không có phản hồi và đường đi bị lọc
  - Handshake thành công nhưng không truyền được dữ liệu
  - Connection Reset và xác định bên gửi RST
  - Broken Pipe, EOF và ghi vào kết nối đã đóng
  - CLOSE-WAIT tăng kéo dài và kiểm tra vòng đời tài nguyên
  - TIME-WAIT nhiều, cạn cổng tạm thời và giới hạn thiết kế
  - Zero Window, ứng dụng đọc chậm và hàng đợi tăng
  - Truyền chậm do mất gói, RTT cao hoặc cửa sổ nhỏ
  - Kết nối treo do PMTU black hole
  - UDP gửi thành công nhưng bên nhận không thấy dữ liệu
  - UDP bị cắt, trùng, đảo thứ tự hoặc mất theo đợt
  - Lập giả thuyết, thu bằng chứng và kiểm chứng nguyên nhân
- level1: Kiểm thử truyền tải
  level2:
  - Thiết kế môi trường lab và sơ đồ hai đầu truyền
  - Tạo độ trễ, mất gói, trùng và đảo thứ tự bằng netem
  - Kiểm thử băng thông giới hạn và hàng đợi
  - Mô phỏng đóng có trật tự, reset và mất mạng im lặng
  - Kiểm thử đọc từng phần và nhiều thông điệp trong một lần đọc
  - Kiểm thử gói UDP sát MTU và datagram vượt bộ đệm
  - Kiểm thử tải, soak test và giải phóng tài nguyên
  - Đo kết quả có kiểm soát và tránh nhầm lẫn do công cụ
  - Đặt tiêu chí đạt cho độ đúng, độ trễ, thông lượng và mất gói
  - Lưu cấu hình, PCAP, số đo và cách tái hiện
- level1: Bài thực hành
  level2:
  - Theo dõi vòng đời TCP từ bắt tay tới đóng kết nối
  - Xây giao thức TCP có khung độ dài và phản hồi
  - Mô phỏng bên nhận chậm để quan sát backpressure
  - So sánh truyền gói nhỏ khi bật và tắt TCP_NODELAY
  - Đo TCP dưới các mức RTT, mất gói và băng thông
  - Xây UDP echo có số thứ tự và thống kê mất gói
  - Tạo luồng UDP thời gian thực có jitter buffer đơn giản
  - Thử retry và chống xử lý trùng cho thông điệp UDP
  - Chẩn đoán một phiên truyền lỗi từ PCAP và log
  - So sánh TCP, UDP thuần và yêu cầu dùng QUIC cho một tình huống
- level1: Thiết kế và vận hành
  level2:
  - Chuyển yêu cầu nghiệp vụ thành tiêu chí truyền tải
  - Chọn giao thức, kiểu thông điệp và mô hình kết nối
  - Lập ngân sách timeout, retry, backoff và giới hạn tải
  - Thiết kế heartbeat, reconnect và khôi phục phiên
  - Giữ ranh giới giữa xác nhận truyền tải và xác nhận nghiệp vụ
  - Thiết lập chỉ số, log và cảnh báo có thể hành động
  - Kiểm soát dung lượng kết nối, bộ đệm và tài nguyên
  - Đánh giá khả năng tương thích IPv4, IPv6, NAT và firewall
  - Checklist rà soát trước khi đưa ứng dụng vào vận hành
  - Những ngộ nhận thường gặp và cách kiểm chứng bằng thí nghiệm
