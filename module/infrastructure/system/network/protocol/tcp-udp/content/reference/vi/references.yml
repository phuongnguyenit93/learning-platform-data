references:
  - title: "RFC 9293 — Transmission Control Protocol (TCP)"
    url: "https://www.rfc-editor.org/info/rfc9293/"
    description: "Đặc tả TCP hiện hành về kết nối, byte stream, state machine, sequence/acknowledgment và cửa sổ nhận."
  - title: "RFC 768 — User Datagram Protocol"
    url: "https://www.rfc-editor.org/info/rfc768/"
    description: "Định nghĩa datagram, trường header và checksum của UDP."
  - title: "RFC 8085 — UDP Usage Guidelines"
    url: "https://www.rfc-editor.org/info/rfc8085/"
    description: "Hướng dẫn dùng UDP an toàn và hiệu quả, bao gồm kích thước gói, độ tin cậy, congestion control và middlebox."
  - title: "RFC 5681 — TCP Congestion Control"
    url: "https://www.rfc-editor.org/info/rfc5681/"
    description: "Giải thích slow start, congestion avoidance, fast retransmit và fast recovery của TCP."
  - title: "RFC 6298 — Computing TCP's Retransmission Timer"
    url: "https://www.rfc-editor.org/info/rfc6298/"
    description: "Nguyên tắc tính RTO và xử lý timeout khi TCP chưa nhận acknowledgment."
  - title: "RFC 9438 — CUBIC for Fast and Long-Distance Networks"
    url: "https://www.rfc-editor.org/info/rfc9438/"
    description: "Cơ chế congestion control CUBIC và cách điều chỉnh congestion window trong triển khai TCP hiện đại."
  - title: "RFC 9000 — QUIC: A UDP-Based Multiplexed and Secure Transport"
    url: "https://www.rfc-editor.org/info/rfc9000/"
    description: "Ví dụ giao thức có kết nối, mã hóa và reliable streams được xây dựng trên UDP."
  - title: "Wireshark User's Guide"
    url: "https://www.wireshark.org/docs/wsug_html_chunked/"
    description: "Hướng dẫn capture, display filter, theo dõi TCP stream và kiểm tra packet analysis để chẩn đoán giao thức."