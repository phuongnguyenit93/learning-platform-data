  - Không gian ip6.arpa và thứ tự đảo nhãn của IPv6
  - Tạo bản ghi PTR và quản lý zone ngược
  - Ủy quyền phân giải ngược cho dải địa chỉ nhỏ
  - 'Ai kiểm soát PTR: chủ dải IP, nhà mạng và nhà cung cấp cloud'
  - Đối chiếu phân giải xuôi với phân giải ngược và giới hạn xác thực
  - Ứng dụng của DNS ngược trong nhật ký, thư điện tử và chẩn đoán
- level1: Bộ phân giải đệ quy
