  - TSIG cho cập nhật động và bảo vệ thông tin xác thực
  - Kết hợp DHCP với đăng ký tên và địa chỉ
  - Xung đột giữa cập nhật tự động và thao tác thủ công
  - Quản lý bản ghi hết hiệu lực và dọn dữ liệu theo chính sách
