- level1: Định tuyến bằng DNS
  level2:
  - Nhiều địa chỉ trong một RRset và cơ chế luân phiên kết quả
  - Giới hạn của cân bằng tải bằng DNS so với cân bằng theo từng kết nối
  - Phân phối theo trọng số, địa lý và độ trễ trong DNS được quản lý
  - Kiểm tra sức khỏe, chuyển đổi dự phòng và độ trễ do bộ nhớ đệm
  - Ảnh hưởng của vị trí bộ phân giải và tùy chọn ECS
  - CDN, chuỗi CNAME và lựa chọn điểm phục vụ
  - Anycast ở tầng IP và chính sách trả lời ở tầng DNS
  - Giữ phiên, kết nối dài và những yêu cầu DNS không bảo đảm
  - Thiết kế chuyển dịch lưu lượng và quay lui thay đổi an toàn
- level1: Bảo mật DNS
  level2:
  - Bề mặt tấn công tại máy khách, bộ phân giải, máy chủ và tài khoản tên miền
  - Giả mạo phản hồi và đầu độc bộ nhớ đệm
  - Ngẫu nhiên hóa mã giao dịch, cổng nguồn và kiểm tra dữ liệu nhận được
  - Tấn công phản xạ, khuếch đại và rủi ro của bộ phân giải mở
  - Giới hạn tốc độ phản hồi và các biện pháp giảm lạm dụng
  - 'DNS tunneling: dấu hiệu nhận biết và hướng giám sát'
  - DNS rebinding và kiểm soát truy cập dịch vụ nội bộ
  - Chiếm quyền tên miền, thay đổi ủy quyền và bảo vệ tài khoản quản trị
  - Bản ghi treo, CNAME lỗi thời và nguy cơ chiếm tên miền con
  - Chính sách chặn tên miền, RPZ và ảnh hưởng đến kết quả phân giải
  - Bảo vệ cập nhật động, truyền zone và khóa xác thực
  - Quản lý nhật ký truy vấn theo mục đích, quyền truy cập và thời hạn lưu
- level1: Hiệu năng và độ sẵn sàng
  level2:
  - Đo độ trễ từ bộ nhớ đệm, truy vấn đệ quy và kết nối mạng
  - Tỷ lệ trúng bộ nhớ đệm, số truy vấn mỗi giây và tài nguyên máy chủ
  - Tác động của chuỗi CNAME dài và nhiều lớp ủy quyền
  - Câu trả lời lớn, phân mảnh và chi phí chuyển sang TCP
  - Giới hạn đồng thời, bão truy vấn và phục hồi sau khi bộ nhớ đệm lạnh
  - Phân tán máy chủ theo mạng, vị trí và miền lỗi
  - Phối hợp nhiều nhà cung cấp DNS và duy trì dữ liệu nhất quán
  - Đánh giá TTL theo yêu cầu cập nhật và khả năng chịu lỗi
  - Kiểm thử tải DNS trong môi trường được kiểm soát
  - Xác định mục tiêu độ trễ, tỷ lệ thành công và ngân sách lỗi
- level1: Công cụ và quan sát
  level2:
  - 'dig: chọn máy chủ, loại bản ghi và đọc từng phần phản hồi'
  - 'dig +trace: lần theo ủy quyền và các giới hạn của phép kiểm tra'
  - dig với TCP, EDNS, DNSSEC và tùy chọn kiểm tra phản hồi
  - 'nslookup, host và Resolve-DnsName: lựa chọn công cụ theo hệ điều hành'
  - resolvectl và kiểm tra cấu hình bộ phân giải cục bộ
  - delv và công cụ phân tích chuỗi tin cậy DNSSEC
  - tcpdump, Wireshark và đối chiếu truy vấn với phản hồi
  - Nhật ký truy vấn, nhật ký lỗi và dữ liệu dnstap
  - Các chỉ số độ trễ, tỷ lệ NXDOMAIN, SERVFAIL và lỗi thời gian chờ
  - Kiểm tra chủ động từ nhiều mạng và đối chiếu các máy chủ NS
  - Che dữ liệu nhạy cảm khi thu thập gói tin hoặc chia sẻ kết quả
- level1: Xử lý sự cố DNS
  level2:
  - Quy trình khoanh vùng từ ứng dụng đến máy chủ có thẩm quyền
  - Phân biệt NXDOMAIN, NODATA, SERVFAIL, REFUSED và hết thời gian chờ
  - Cùng tên nhưng kết quả khác giữa máy, mạng hoặc bộ phân giải
  - Tên công cộng phân giải được nhưng tên nội bộ thất bại
  - Máy chủ có thẩm quyền đúng nhưng bộ phân giải vẫn trả dữ liệu cũ
  - Sai NS, thiếu glue, lame delegation và vòng lặp ủy quyền
  - CNAME vòng lặp, đích bí danh mất và wildcard không khớp như dự kiến
  - UDP thành công nhưng TCP thất bại hoặc ngược lại
  - EDNS bị chặn, phản hồi lớn bị mất và lỗi phân mảnh
  - DNSSEC thất bại do DS, khóa, chữ ký hoặc đồng hồ hệ thống
  - IPv4 hoạt động nhưng IPv6 lỗi sau khi phân giải
  - Ứng dụng Java giữ địa chỉ cũ dù truy vấn bằng dig đã đổi
  - DNS trong container hoặc Kubernetes chậm do search, ndots và chuyển tiếp
  - Lập bằng chứng, xác nhận nguyên nhân và kiểm tra sau khắc phục
- level1: Thực hành DNS
  level2:
  - Dựng môi trường thử nghiệm với máy có thẩm quyền, bộ phân giải và máy khách
  - Tạo zone, công bố A, AAAA, CNAME, MX, TXT và kiểm tra RRset
  - Ủy quyền miền con, cấu hình glue và lần theo chuỗi phân giải
  - Thiết lập zone ngược và đối chiếu kết quả A, AAAA, PTR
  - Đo TTL, bộ nhớ đệm âm tính và quá trình thay đổi dữ liệu
  - Bắt gói để quan sát truy vấn lặp, cờ TC và chuyển sang TCP
  - Cấu hình secondary, TSIG, NOTIFY và kiểm tra đồng bộ zone
  - Ký zone DNSSEC, thiết lập tin cậy và tạo lỗi xác minh có kiểm soát
  - Thiết lập DNS mã hóa và kiểm tra danh tính đầu cuối
  - Mô phỏng split-horizon DNS và chuyển tiếp có điều kiện
  - Thực nghiệm bộ nhớ đệm JVM và nhóm kết nối khi địa chỉ dịch vụ đổi
  - Phân tích DNS trong Kubernetes và giảm truy vấn do tên ngắn
  - Mô phỏng mất máy chủ DNS, lỗi mạng và chuyển đổi dự phòng
  - Viết báo cáo thực nghiệm bằng truy vấn, gói tin và kết quả có thể lặp lại
- level1: Thiết kế và vận hành
  level2:
  - Chuyển yêu cầu ứng dụng thành yêu cầu không gian tên và phân giải
  - Chọn mô hình công cộng, nội bộ hoặc kết hợp theo ranh giới hệ thống
  - Lập danh mục zone, chủ sở hữu bản ghi và quyền thay đổi
  - Quản lý cấu hình bằng phiên bản, kiểm tra tự động và rà soát trước triển khai
  - Lập kế hoạch chuyển tên miền, nhà cung cấp, NS và DNSSEC
  - Chuẩn bị TTL, thứ tự thay đổi, tiêu chí xác nhận và phương án quay lui
  - Xây dựng hướng dẫn ứng phó sự cố và phân công trách nhiệm
  - Kiểm tra định kỳ bản ghi lỗi thời, ủy quyền và ngày hết hạn tên miền
  - Đánh giá kiến trúc bằng các tình huống lỗi và bằng chứng thực nghiệm
