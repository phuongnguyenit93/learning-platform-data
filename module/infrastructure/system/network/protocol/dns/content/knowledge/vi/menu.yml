  - Giới hạn kích thước phản hồi, cờ TC và chuyển sang TCP
  - EDNS(0), MTU và rủi ro phân mảnh IP
  - Đóng khung thông điệp DNS khi truyền qua TCP
  - Tái sử dụng kết nối TCP và nhiều truy vấn trên một kết nối
  - Mất gói, thử lại, thời gian chờ và lựa chọn máy chủ khác
  - Tường lửa, NAT và lỗi chỉ cho phép một trong hai giao thức
  - Tác động của DNSSEC và câu trả lời lớn đến lựa chọn đường truyền
- level1: Bộ nhớ đệm
