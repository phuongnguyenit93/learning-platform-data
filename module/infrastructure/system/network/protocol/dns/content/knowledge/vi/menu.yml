  - Lưu kết quả âm tính cho NXDOMAIN và NODATA
  - Ảnh hưởng của thay đổi TTL trước và sau một đợt chuyển đổi
  - Bộ nhớ đệm của CNAME, NS, glue và chuỗi ủy quyền
  - Cơ chế nạp trước dữ liệu và phục vụ dữ liệu hết hạn khi được cấu hình
  - Gộp truy vấn đồng thời để hạn chế tải lặp lại
  - Vì sao thay đổi DNS xuất hiện ở các nơi vào thời điểm khác nhau
  - Xóa bộ nhớ đệm đúng lớp và giới hạn của việc kiểm tra lại
  - Đánh đổi giữa tốc độ cập nhật, độ trễ và tải truy vấn
- level1: DNS ngược
  level2:
