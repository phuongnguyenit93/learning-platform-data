menu:
- level1: Tổng quan DNS
  level2:
  - DNS là gì và vì sao mạng cần hệ thống phân giải tên
  - Tên dễ nhớ, địa chỉ IP và sự tách biệt giữa tên với vị trí dịch vụ
  - DNS trong hành trình truy cập một website hoặc gọi API
  - DNS liên hệ thế nào với IP, TCP, UDP, HTTP và TLS
  - 'Các khái niệm cốt lõi: tên miền, zone, bản ghi và máy chủ DNS'
  - Phân giải tên, công bố dữ liệu và khám phá dịch vụ
  - Phạm vi của DNS và những vấn đề DNS không tự giải quyết
- level1: Tên miền
  level2:
  - 'Cấu trúc phân cấp: tên gốc, tên miền cấp cao và các miền con'
  - Nhãn tên miền, dấu chấm và giới hạn độ dài tên
  - Tên đầy đủ FQDN, tên tương đối và dấu chấm cuối
  - Phân biệt tên miền, tên máy, URL và địa chỉ thư điện tử
  - Tên miền quốc tế IDN, Unicode và Punycode
  - Chữ hoa, chữ thường và cách biểu diễn ký tự đặc biệt
  - Tên đặc biệt, tên dành cho tài liệu và các ranh giới sử dụng
  - Đăng ký tên miền, vòng đời sở hữu và thay đổi nhà cung cấp
- level1: Kiến trúc DNS
  level2:
  - Mô hình dữ liệu phân tán và quyền quản lý theo từng miền
  - Vai trò của bộ phân giải cục bộ, bộ phân giải đệ quy và máy chủ có thẩm quyền
  - Máy chủ gốc, máy chủ tên miền cấp cao và chuỗi ủy quyền
  - 'Truy vấn đệ quy và truy vấn lặp: trách nhiệm của từng bên'
  - Nhà đăng ký, đơn vị quản lý tên miền cấp cao và nhà cung cấp DNS
  - DNS công cộng, DNS riêng và các góc nhìn dữ liệu
  - Địa chỉ anycast và cách phục vụ cùng một dịch vụ DNS ở nhiều nơi
- level1: Luồng phân giải
  level2:
  - Luồng phân giải từ ứng dụng qua hệ điều hành đến máy chủ đệ quy
  - Phân giải khi bộ nhớ đệm trống và khi đã có dữ liệu
  - Lần theo chuỗi ủy quyền từ gốc đến máy chủ có thẩm quyền
  - Phản hồi giới thiệu máy chủ tiếp theo và vai trò của bản ghi glue
  - Theo chuỗi bí danh CNAME và phát hiện vòng lặp
  - Câu trả lời có thẩm quyền và câu trả lời từ bộ nhớ đệm
  - Tên không tồn tại, loại bản ghi không tồn tại và lỗi phân giải
  - Phân giải đồng thời nhiều loại bản ghi và tác động đến thời gian chờ
- level1: Bản ghi DNS
  level2:
  - 'Cấu trúc bản ghi: tên sở hữu, loại, lớp, TTL và dữ liệu'
  - 'RRset: nhóm bản ghi cùng tên, loại và lớp'
  - 'Bản ghi A và AAAA: ánh xạ tên sang IPv4 và IPv6'
  - 'Bản ghi CNAME: bí danh, chuỗi chuyển tiếp và giới hạn tại đỉnh zone'
  - 'Bản ghi DNAME: chuyển hướng một nhánh không gian tên'
  - 'Bản ghi NS và SOA: máy chủ quản lý và thông tin zone'
  - 'Bản ghi MX: máy chủ thư và mức ưu tiên'
  - 'Bản ghi TXT: dữ liệu văn bản, xác minh quyền sở hữu và giới hạn sử dụng'
  - 'Bản ghi SRV: dịch vụ, cổng, mức ưu tiên và trọng số'
  - 'Bản ghi PTR: tên trong không gian phân giải ngược'
  - 'Bản ghi CAA: chính sách cho phép cấp chứng thư'
  - 'Bản ghi SVCB và HTTPS: mô tả điểm kết nối và tham số dịch vụ'
  - Bản ghi TLSA và mối liên hệ với DANE, DNSSEC
  - 'Bản ghi wildcard: tổng hợp câu trả lời và các giới hạn khớp tên'
- level1: Zone và ủy quyền
  level2:
  - Phân biệt tên miền, zone, đỉnh zone và ranh giới ủy quyền
  - 'Tệp zone: chỉ thị $ORIGIN, $TTL và tên tương đối'
  - 'Bản ghi SOA: số thứ tự phiên bản và các mốc thời gian'
  - 'Số thứ tự SOA: quy tắc tăng phiên bản và xử lý quay vòng'
  - Ủy quyền miền con bằng NS tại zone cha
  - 'Bản ghi NS tại cha và con: tính nhất quán của cấu hình'
  - Glue trong miền, ngoài miền và vòng phụ thuộc khi tìm máy chủ
  - Máy chủ primary, secondary và mô hình hidden primary
  - Ủy quyền sai, lame delegation và máy chủ được khai báo nhưng không phục vụ zone
  - Di chuyển zone giữa nhà cung cấp mà vẫn duy trì chuỗi ủy quyền
- level1: Gói tin DNS
  level2:
  - 'Cấu trúc thông điệp: phần đầu, câu hỏi, câu trả lời, thẩm quyền và bổ sung'
  - Mã giao dịch, OPCODE và ghép cặp truy vấn với phản hồi
  - Các cờ QR, AA, TC, RD, RA, AD và CD
  - Tên truy vấn, loại truy vấn và lớp truy vấn
  - Các mã phản hồi NOERROR, NXDOMAIN, SERVFAIL, REFUSED và FORMERR
  - Mã hóa tên miền trên đường truyền và cơ chế nén tên
  - Phân biệt dữ liệu trong phần Answer, Authority và Additional
  - EDNS(0), bản ghi OPT và quảng bá kích thước gói UDP
  - 'Các tùy chọn mở rộng: DNS Cookies, NSID và ECS'
  - Thông tin lỗi mở rộng EDE và cách diễn giải khi chẩn đoán
  - Gói tin sai định dạng, con trỏ nén lỗi và kiểm tra đầu vào
- level1: UDP và TCP
  level2:
  - Vì sao DNS sử dụng cả UDP và TCP
