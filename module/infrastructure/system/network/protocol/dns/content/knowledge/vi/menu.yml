  - Phân biệt DNS đơn hướng với mDNS và các cơ chế tìm tên cục bộ
  - 'DNS trong trình duyệt: bộ nhớ đệm, bộ phân giải riêng và DNS bảo mật'
  - Tác động của cấu hình máy khách đến hiện tượng cùng tên nhưng khác kết quả
- level1: DNS nội bộ
