  - 'DNS over HTTPS: phân giải DNS qua HTTPS'
  - 'DNS over QUIC: phân giải DNS trên nền QUIC'
  - So sánh DoT, DoH và DoQ theo kết nối, độ trễ và quản trị
  - Khởi tạo kết nối đến bộ phân giải mã hóa khi vẫn cần phân giải tên
  - Xác minh danh tính máy chủ và cấu hình chứng thư
  - Tương tác giữa DNS mã hóa, DNSSEC và độ tin cậy của bộ phân giải
  - Chính sách trình duyệt, hệ điều hành và nguy cơ bỏ qua DNS nội bộ
  - 'Giới hạn quyền riêng tư: bộ phân giải, nhật ký và dữ liệu phía có thẩm quyền'
- level1: DNS trên máy khách
