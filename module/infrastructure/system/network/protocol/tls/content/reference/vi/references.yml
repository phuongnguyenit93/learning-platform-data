references:
  - title: "RFC 8446 – The TLS Protocol Version 1.3"
    url: "https://www.rfc-editor.org/rfc/rfc8446.html"
    description: "Đặc tả TLS 1.3: handshake, record layer, key schedule và cơ chế bảo vệ dữ liệu."
  - title: "RFC 9325 – Secure Use of TLS and DTLS"
    url: "https://www.rfc-editor.org/rfc/rfc9325.html"
    description: "Khuyến nghị chọn phiên bản và cấu hình TLS an toàn trong vận hành."
  - title: "RFC 5280 – X.509 Certificate and CRL Profile"
    url: "https://www.rfc-editor.org/rfc/rfc5280.html"
    description: "Chứng chỉ X.509, chuỗi tin cậy, đường dẫn xác thực và thu hồi chứng chỉ."
  - title: "RFC 6066 – TLS Extension Definitions"
    url: "https://www.rfc-editor.org/rfc/rfc6066.html"
    description: "Đặc tả các TLS extension, bao gồm server_name (SNI)."
  - title: "RFC 8448 – Example Handshake Traces for TLS 1.3"
    url: "https://www.rfc-editor.org/rfc/rfc8448.html"
    description: "Các ví dụ bản tin và giá trị trung gian để học hoặc kiểm tra handshake TLS 1.3."