menu:
- level1: Tổng quan TLS
  level2:
  - 'TLS là gì: mục đích, vấn đề cần giải quyết và phạm vi của module'
  - 'Bảo mật đường truyền: tính bí mật, tính toàn vẹn và xác thực'
  - 'Bản đồ thuật ngữ: bắt tay, chứng chỉ, khóa phiên, bản ghi và phiên'
  - Quan hệ giữa TLS, TCP, HTTP và HTTPS trong một kết nối
  - Hành trình truy cập HTTPS từ phân giải DNS đến dữ liệu ứng dụng
  - Vai trò của máy khách, máy chủ, CA và bên trung gian
  - 'Ranh giới bảo vệ: dữ liệu khi truyền, tại điểm kết thúc TLS và khi lưu trữ'
  - TLS không thay thế phân quyền, bảo mật ứng dụng hay bảo vệ thiết bị
  - Kiến thức tiên quyết và trình tự học từ nền tảng đến thực hành
- level1: Nền tảng mật mã
  level2:
  - 'Mã hóa đối xứng và bất đối xứng: vai trò khác nhau trong TLS'
  - 'Hàm băm, HMAC và chữ ký số: mục đích và cách phân biệt'
  - Trao đổi khóa Diffie–Hellman, DHE và ECDHE
  - Khóa tạm thời và tính bí mật chuyển tiếp (forward secrecy)
  - RSA, ECDSA và EdDSA trong xác thực bằng chữ ký
  - Mã hóa có xác thực AEAD, thẻ xác thực và dữ liệu liên kết
  - AES-GCM và ChaCha20-Poly1305 ở mức khái niệm
  - Nguồn ngẫu nhiên, nonce, IV và nguy cơ tái sử dụng
  - 'Dẫn xuất khóa bằng PRF và HKDF: đầu vào, đầu ra và mục đích'
  - Phân biệt khóa riêng chứng chỉ, bí mật chia sẻ và khóa bảo vệ dữ liệu
- level1: Phiên bản TLS
  level2:
  - 'Từ SSL đến TLS: lịch sử phát triển và lý do thay đổi giao thức'
  - SSL 2.0, SSL 3.0, TLS 1.0 và TLS 1.1 trong hệ thống cũ
  - 'TLS 1.2: đặc điểm, phạm vi sử dụng và các cơ chế kế thừa'
  - 'TLS 1.3: mục tiêu thiết kế và những thay đổi chính'
  - So sánh TLS 1.2 và TLS 1.3 về bắt tay, thuật toán và độ trễ
  - 'Các cơ chế bị loại khỏi TLS 1.3: RSA key exchange, CBC và renegotiation'
  - Phiên bản được hỗ trợ, được cấu hình và thực sự được thương lượng
  - Đọc RFC, errata và hướng dẫn triển khai để xác định yêu cầu áp dụng
- level1: Kiến trúc giao thức
  level2:
  - 'Handshake Protocol và Record Protocol: phân chia trách nhiệm'
  - Thông điệp bắt tay, bản ghi TLS và phân đoạn TCP khác nhau thế nào
  - Trạng thái kết nối, hướng gửi nhận và thời điểm chuyển khóa
  - 'Cấu trúc bản ghi: loại nội dung, phiên bản kế thừa và độ dài'
  - Application Data và ranh giới dữ liệu của ứng dụng
  - 'Alert Protocol: thông báo lỗi và ảnh hưởng đến kết nối'
  - ChangeCipherSpec trong TLS 1.2 và chế độ tương thích TLS 1.3
  - Đóng kết nối bằng close_notify và rủi ro dữ liệu bị cắt cụt
  - Đọc sơ đồ trình tự để lần theo một kết nối TLS hoàn chỉnh
- level1: Chứng chỉ X.509
  level2:
  - 'Chứng chỉ số: gắn danh tính với khóa công khai như thế nào'
  - 'Cấu trúc X.509: phiên bản, số sê-ri, chủ thể và bên phát hành'
  - Khóa công khai, thuật toán chữ ký và chữ ký của bên phát hành
  - Thời hạn notBefore, notAfter và ảnh hưởng của đồng hồ hệ thống
  - Subject Alternative Name với tên DNS, địa chỉ IP và wildcard
  - Basic Constraints, CA=true và giới hạn độ dài chuỗi
  - 'Key Usage và Extended Key Usage: serverAuth, clientAuth'
  - Subject Key Identifier và Authority Key Identifier
  - CRL Distribution Points, AIA và thông tin kiểm tra thu hồi
  - Định dạng PEM, DER, PKCS#12 và sự khác nhau giữa chứng chỉ với khóa riêng
  - Chứng chỉ tự ký, chứng chỉ do CA cấp và yêu cầu thiết lập tin cậy
- level1: PKI và chuỗi tin cậy
  level2:
  - Hạ tầng khóa công khai (PKI) và vai trò của cơ quan chứng thực (CA)
  - Root CA, Intermediate CA và chứng chỉ đầu cuối
  - Điểm neo tin cậy (trust anchor) và kho tin cậy (trust store)
  - Xây dựng đường dẫn chứng thực và kiểm tra đường dẫn chứng thực
  - Chuỗi máy chủ gửi và chuỗi máy khách có thể xây dựng
  - Thiếu Intermediate CA, sai thứ tự chuỗi và khác biệt giữa máy khách
  - Chứng thực chéo, nhiều đường dẫn và thay đổi Root CA
  - 'PKI công cộng và PKI nội bộ: khác biệt về phân phối tin cậy'
  - Ranh giới quản trị CA, bảo vệ khóa CA và ảnh hưởng khi CA bị xâm phạm
- level1: Xác minh chứng chỉ
  level2:
  - 'Trình tự xác minh: chuỗi tin cậy, thời hạn, mục đích sử dụng và danh tính'
  - Kiểm tra tên máy chủ bằng SAN và tên tham chiếu của ứng dụng
  - Quy tắc wildcard, tên quốc tế IDNA và kết nối bằng địa chỉ IP
  - Phân biệt chọn chứng chỉ bằng SNI với kiểm tra tên máy chủ
  - Xử lý chứng chỉ hết hạn, chưa hiệu lực, tự ký hoặc không được tin cậy
  - Kiểm tra chữ ký, thuật toán, độ dài khóa và ràng buộc CA
  - 'Thu hồi chứng chỉ bằng CRL và OCSP: mục tiêu và giới hạn'
  - OCSP stapling, độ mới của phản hồi và khác biệt hỗ trợ
  - 'Chính sách khi không kiểm tra được thu hồi: soft-fail và hard-fail'
  - Certificate Transparency, SCT và giới hạn của việc ghi nhật ký chứng chỉ
  - 'Certificate pinning: mô hình tin cậy, xoay khóa và rủi ro vận hành'
- level1: Tham số mật mã
  level2:
  - Bộ mã (cipher suite) mô tả những thành phần nào
  - Đọc tên cipher suite TLS 1.2 theo trao đổi khóa, xác thực và bảo vệ dữ liệu
  - Đọc tên cipher suite TLS 1.3 theo AEAD và hàm băm
  - Phân biệt cipher suite, nhóm trao đổi khóa và thuật toán chữ ký
  - supported_groups, key_share và lựa chọn nhóm mật mã
  - signature_algorithms và sự tương thích với khóa của chứng chỉ
  - Thứ tự ưu tiên của hai bên và điều kiện không có tham số chung
  - Lựa chọn chứng chỉ RSA hoặc ECDSA theo khả năng của máy khách
  - Đánh giá tương thích và mức an toàn của một cấu hình mật mã
- level1: Bắt tay TLS 1.2
  level2:
  - Toàn cảnh bắt tay đầy đủ TLS 1.2 và các lượt trao đổi
  - ClientHello, ServerHello và quá trình chọn tham số
  - Certificate và ServerKeyExchange trong bắt tay ECDHE
  - CertificateRequest, ServerHelloDone và xác thực máy khách tùy chọn
  - ClientKeyExchange, premaster secret và master secret
  - CertificateVerify, ChangeCipherSpec và Finished
  - Bắt tay RSA key exchange trong hệ thống cũ và giới hạn bí mật chuyển tiếp
  - Extended Master Secret và ràng buộc khóa với nội dung bắt tay
  - 'Tái thương lượng (renegotiation): mục đích, ràng buộc và rủi ro'
  - Bắt tay rút gọn TLS 1.2 bằng Session ID hoặc Session Ticket
- level1: Bắt tay TLS 1.3
  level2:
  - Toàn cảnh bắt tay TLS 1.3 và thời điểm có thể gửi dữ liệu
  - ClientHello với supported_versions, supported_groups và key_share
  - ServerHello và thiết lập khóa bảo vệ thông điệp bắt tay
  - HelloRetryRequest khi cần thay đổi nhóm trao đổi khóa
  - EncryptedExtensions và tham số nằm ngoài ServerHello
  - CertificateRequest, Certificate và CertificateVerify
  - Finished, transcript hash và xác nhận tính toàn vẹn của bắt tay
  - Những phần được mã hóa và phần còn lộ trong bắt tay thông thường
  - Chế độ tương thích với thiết bị trung gian và các trường legacy
  - 'Thông điệp sau bắt tay: NewSessionTicket, KeyUpdate và xác thực tùy chọn'
  - Đối chiếu sơ đồ TLS 1.2 với TLS 1.3 theo từng giai đoạn
- level1: Khóa và bản ghi
  level2:
  - 'Cây dẫn xuất khóa TLS 1.3: early secret, handshake secret và master secret'
  - Khóa lưu lượng bắt tay, khóa ứng dụng và tách biệt hai hướng truyền
  - Transcript hash và ràng buộc các bí mật với nội dung bắt tay
  - Sequence number, nonce và thẻ AEAD trong bảo vệ bản ghi
  - Dữ liệu liên kết, header bản ghi và kiểm tra tính toàn vẹn
  - Loại nội dung bên trong, bản ghi Application Data bên ngoài và padding
  - Phân mảnh thông điệp, ghép bản ghi và giới hạn kích thước
  - KeyUpdate, giới hạn sử dụng khóa và xử lý cập nhật khóa
  - Exporter và dẫn xuất vật liệu khóa cho giao thức sử dụng TLS
- level1: Phiên và 0-RTT
  level2:
  - Phân biệt kết nối TLS, phiên, vé phiên và tái sử dụng kết nối ứng dụng
  - 'Tiếp tục phiên TLS 1.2: Session ID, bộ nhớ đệm và Session Ticket'
  - 'Tiếp tục phiên TLS 1.3: NewSessionTicket và khóa chia sẻ trước (PSK)'
  - PSK binder và chứng minh quyền sở hữu bí mật tiếp tục phiên
  - 'PSK-only và PSK kết hợp (EC)DHE: khác biệt về bí mật chuyển tiếp'
  - 'Dữ liệu sớm 0-RTT: điều kiện sử dụng, lợi ích và giới hạn bảo mật'
  - Tấn công phát lại 0-RTT và lựa chọn thao tác ứng dụng phù hợp
  - Từ chối dữ liệu sớm, gửi lại yêu cầu và xử lý HTTP 425 khi áp dụng
  - Thời hạn vé, xoay khóa vé và tiếp tục phiên qua nhiều máy chủ
  - Quyền riêng tư, liên kết các phiên và thay đổi chính sách sau khi cấp vé
- level1: SNI và ALPN
  level2:
  - 'Phần mở rộng TLS: cách đề xuất, phản hồi và kiểm tra tương thích'
  - Server Name Indication (SNI) cho nhiều tên miền trên cùng địa chỉ
  - Chọn virtual host, chứng chỉ mặc định và hành vi khi thiếu SNI
  - Application-Layer Protocol Negotiation (ALPN) và lựa chọn giao thức ứng dụng
  - Thương lượng h2, http/1.1 và trường hợp không có ALPN chung
  - Quan hệ giữa SNI, DNS, địa chỉ kết nối và HTTP Host
  - 'Encrypted ClientHello (ECH): mục đích bảo vệ và ranh giới triển khai'
  - GREASE và khả năng mở rộng khi gặp thiết bị trung gian
  - Chẩn đoán lỗi định tuyến hoặc sai giao thức do SNI và ALPN
- level1: Xác thực hai chiều
  level2:
  - 'TLS một chiều và TLS hai chiều (mTLS): khác biệt về xác thực'
  - Luồng yêu cầu và cung cấp chứng chỉ máy khách
  - CertificateVerify và bằng chứng sở hữu khóa riêng
  - CA được chấp nhận, lựa chọn chứng chỉ và clientAuth
  - Chế độ chứng chỉ máy khách tùy chọn hoặc bắt buộc
  - Ánh xạ danh tính chứng chỉ sang tài khoản, dịch vụ và quyền truy cập
  - mTLS không thay thế kiểm tra quyền trên từng tài nguyên
  - Đổi chứng chỉ, thu hồi và tách miền tin cậy giữa các môi trường
  - mTLS tại proxy, chuyển tiếp danh tính và ranh giới tin cậy phía sau
  - Chẩn đoán thiếu chứng chỉ, sai CA, sai EKU và chứng chỉ bị từ chối
- level1: Vòng đời chứng chỉ
  level2:
  - Tạo cặp khóa, bảo vệ khóa riêng và phân quyền truy cập
  - Certificate Signing Request (CSR), SAN và thông tin yêu cầu cấp
  - Quy trình cấp chứng chỉ và xác minh quyền kiểm soát tên miền
  - ACME với HTTP-01, DNS-01 và TLS-ALPN-01 ở mức cơ chế
  - Triển khai chứng chỉ đầu cuối, khóa riêng và chuỗi trung gian
  - Gia hạn tự động, nạp lại cấu hình và kiểm tra chứng chỉ đang phục vụ
  - Xoay khóa, thay CA và chuyển đổi chuỗi tin cậy không gián đoạn
  - Giám sát thời hạn, xử lý gia hạn lỗi và khôi phục cấu hình
  - Thu hồi, cấp lại và ứng phó khi khóa riêng bị lộ
  - Bảo vệ khóa bằng secret manager, HSM hoặc KMS theo khả năng tích hợp
- level1: Mô hình triển khai
  level2:
  - Kết thúc TLS tại ứng dụng, reverse proxy hoặc bộ cân bằng tải
  - TLS passthrough, TLS termination và TLS re-encryption
  - Đường đi bên ngoài, đường đi nội bộ và các điểm có dữ liệu rõ
  - 'Bảo vệ cả hai chặng: kiểm tra chứng chỉ upstream và mTLS'
  - SNI routing, health check và chứng chỉ trên hệ thống nhiều nút
  - Khóa vé phiên, tính nhất quán cấu hình và xoay khóa theo cụm
  - CDN, API Gateway, Ingress và service mesh trong đường đi TLS
  - CONNECT proxy, kiểm tra TLS doanh nghiệp và phân phối CA nội bộ
  - Thiết kế ranh giới tin cậy và ghi nhận danh tính sau mỗi điểm kết thúc
- level1: TLS với giao thức khác
  level2:
  - 'HTTPS: lớp bảo vệ TLS và ngữ nghĩa HTTP bên trong'
  - HTTP/2 qua TLS, ALPN và các ràng buộc tương thích
  - 'HTTP/3 và QUIC: sử dụng bắt tay TLS 1.3 với bảo vệ gói riêng'
  - 'DTLS: bảo vệ datagram và khác biệt khi không có luồng TCP'
  - So sánh TLS, DTLS và QUIC theo truyền tải và xử lý mất gói
  - WebSocket bảo mật (wss) và kết nối sống lâu
  - TLS ngầm định và STARTTLS trong SMTP, IMAP hoặc giao thức tương tự
  - Nguy cơ hạ cấp STARTTLS và chính sách bắt buộc kênh bảo mật
  - 'TLS với cơ sở dữ liệu, LDAP và gRPC: cấu hình ở đúng lớp'
  - HSTS, mixed content và cookie Secure trong phạm vi bảo mật web
- level1: Tấn công và phòng vệ
  level2:
  - Nghe lén, sửa dữ liệu và giả mạo trong mô hình đối thủ TLS
  - Tấn công xen giữa khi bỏ kiểm tra chứng chỉ hoặc tin nhầm CA
  - Hạ cấp giao thức, phiên bản dự phòng và tín hiệu chống hạ cấp
  - 'POODLE, BEAST và Lucky Thirteen: bài học từ SSL và CBC'
  - 'CRIME và BREACH: khác biệt giữa nén TLS với nén ứng dụng'
  - 'Heartbleed: lỗi triển khai thư viện và hậu quả lộ bí mật'
  - 'ROBOT, Logjam và FREAK: rủi ro của cơ chế mật mã kế thừa'
  - Triple Handshake và vai trò của ràng buộc nội dung bắt tay
  - Replay 0-RTT, phát lại yêu cầu và trách nhiệm của ứng dụng
  - Phân tích lưu lượng, thông tin còn lộ và giới hạn của mã hóa
  - Từ chối dịch vụ khi bắt tay và các biện pháp giới hạn tài nguyên
- level1: Cấu hình an toàn
  level2:
  - Xây dựng chính sách TLS theo mô hình đe dọa và nhóm máy khách
  - Quản lý phiên bản tối thiểu, tối đa và các giao thức đã ngừng sử dụng
  - Chọn AEAD, nhóm trao đổi khóa và thuật toán chữ ký phù hợp
  - Vô hiệu cơ chế yếu, nén TLS và tái thương lượng không cần thiết
  - Bắt buộc xác minh danh tính khi gọi upstream hoặc dịch vụ bên ngoài
  - Quản lý trust store riêng, CA nội bộ và khác biệt giữa môi trường
  - Chính sách tiếp tục phiên, khóa vé và bật hoặc tắt 0-RTT
  - Cập nhật thư viện TLS, theo dõi lỗ hổng và kiểm kê phụ thuộc
  - Kiểm thử tương thích, triển khai từng phần và phương án quay lui
  - Kiểm tra cấu hình hiệu lực và phát hiện sai lệch giữa các nút
- level1: Hiệu năng TLS
  level2:
  - Chi phí DNS, TCP, TLS và xử lý ứng dụng trong độ trễ đầu cuối
  - Đo thời gian bắt tay đầy đủ, tiếp tục phiên và tái sử dụng kết nối
  - Ảnh hưởng của RTT, mất gói, CPU và tăng tốc mật mã
  - Kích thước chuỗi chứng chỉ, kiểu khóa và chi phí chữ ký
  - Connection pooling, HTTP keep-alive và multiplexing
  - Kích thước bản ghi, bộ đệm và đánh đổi độ trễ với thông lượng
  - Bộ nhớ đệm phiên, Session Ticket và tỷ lệ tiếp tục phiên thành công
  - Đánh giá 0-RTT theo lợi ích đo được và rủi ro phát lại
  - Thiết kế phép đo tải, chỉ số nền và so sánh cấu hình công bằng
- level1: Quan sát và chẩn đoán
  level2:
  - 'Quy trình khoanh vùng: DNS, TCP, bắt tay TLS hay giao thức ứng dụng'
  - Đọc log phiên bản, cipher suite, SNI, ALPN và trạng thái tiếp tục phiên
  - 'Hiểu alert: handshake_failure, protocol_version và insufficient_security'
  - 'Hiểu alert: unknown_ca, bad_certificate, certificate_expired và certificate_required'
  - Phân biệt lỗi TLS, đóng kết nối TCP, timeout và HTTP 4xx hoặc 5xx
  - Chẩn đoán sai SAN, thiếu intermediate, lệch đồng hồ và sai trust store
  - Chẩn đoán không có cipher suite, nhóm hoặc thuật toán chữ ký chung
  - Chẩn đoán kết nối qua proxy, CDN hoặc bộ cân bằng tải
  - Giám sát hạn chứng chỉ, tỷ lệ bắt tay lỗi và độ trễ theo máy khách
  - Thu thập bằng chứng, bảo vệ dữ liệu nhạy cảm và lưu lại nguyên nhân sự cố
- level1: OpenSSL và curl
  level2:
  - Đọc phiên bản công cụ, khả năng TLS và thư viện mật mã đang dùng
  - Kiểm tra endpoint bằng openssl s_client với SNI và ALPN
  - Buộc phiên bản, cipher suite hoặc nhóm để kiểm thử thương lượng
  - Đọc chứng chỉ bằng openssl x509 và kiểm tra chuỗi bằng openssl verify
  - Tạo CA thử nghiệm, khóa, CSR và chứng chỉ có SAN
  - Dựng máy chủ thử nghiệm bằng openssl s_server
  - Thử mTLS bằng chứng chỉ máy khách và CA được chỉ định
  - Kiểm tra tiếp tục phiên bằng lưu và nạp lại phiên
  - Chẩn đoán HTTPS bằng curl --verbose, --cacert, --cert và --key
  - Giữ tên máy chủ khi đổi địa chỉ bằng curl --resolve
  - Đối chiếu kết quả công cụ với cấu hình và lưu ý khi dùng tùy chọn bỏ xác minh
- level1: Phân tích Wireshark
  level2:
  - Chọn điểm bắt gói, bộ lọc và kết nối cần phân tích
  - Nhận diện TCP handshake, ClientHello, ServerHello và bản ghi TLS
  - Đọc phiên bản, cipher suite, supported_groups và key_share
  - Theo dõi SNI, ALPN và giới hạn quan sát khi có mã hóa
  - Phân tích bắt tay TLS 1.2 và TLS 1.3 theo dòng thời gian
  - Nhận diện HelloRetryRequest, tiếp tục phiên và dữ liệu sớm
  - Phân biệt TCP segmentation với thông điệp bắt tay bị chia thành nhiều bản ghi
  - Giải mã trong phòng thử nghiệm bằng session key log khi công cụ hỗ trợ
  - Vì sao khóa riêng máy chủ không đủ giải mã phiên dùng ECDHE
  - Bảo vệ tệp bắt gói, tệp bí mật phiên và xóa dữ liệu thử nghiệm
- level1: TLS với Java
  level2:
  - JSSE, TLS provider và các thành phần SSLContext, SSLSocket, SSLEngine
  - 'KeyStore và TrustStore: nơi giữ danh tính và nơi xác định tin cậy'
  - KeyManager, TrustManager và lựa chọn chứng chỉ
  - Quản lý chứng chỉ với keytool và định dạng PKCS#12
  - Cấu hình TLS cho Java HttpClient và xác minh tên máy chủ
  - Bật HTTPS hoặc mTLS cho ứng dụng Spring Boot theo máy chủ nhúng
  - Giới hạn giao thức, cipher suite và thuật toán bị vô hiệu trên JDK
  - Chẩn đoán bằng javax.net.debug trong môi trường thử nghiệm
  - Xử lý PKIX path building failed, SSLHandshakeException và lỗi SAN
  - Cập nhật chứng chỉ, kiểm thử trust store và tránh TrustManager chấp nhận mọi chứng chỉ
- level1: Thực hành tổng hợp
  level2:
  - Dựng phòng thử nghiệm với CA nội bộ, máy chủ và máy khách riêng
  - So sánh bắt tay TLS 1.2 và TLS 1.3 bằng log cùng bản bắt gói
  - Tái hiện chứng chỉ hết hạn, sai SAN và thiếu chuỗi trung gian
  - Triển khai mTLS rồi kiểm tra chứng chỉ thiếu, hợp lệ và không được tin cậy
  - So sánh termination, passthrough và re-encryption trên hai chặng
  - Đo bắt tay đầy đủ, tiếp tục phiên và tái sử dụng kết nối
  - Thử gia hạn, xoay khóa và thay CA với kiểm tra sau triển khai
  - Khảo sát 0-RTT trong môi trường hỗ trợ và đánh giá khả năng phát lại
  - Điều tra một sự cố TLS từ triệu chứng đến nguyên nhân và biện pháp sửa
  - Tự đánh giá bằng sơ đồ kết nối, cấu hình, bằng chứng và giải thích ranh giới bảo vệ
