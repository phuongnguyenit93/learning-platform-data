menu:
- level1: Tổng quan
  level2:
  - Service mesh là gì và giải quyết bài toán giao tiếp giữa các dịch vụ
  - Vì sao hệ thống nhiều dịch vụ cần quản lý kết nối nhất quán
  - 'Các thuật ngữ: service, workload, proxy, data plane và control plane'
  - Hình dung một yêu cầu đi qua ứng dụng và các thành phần mesh
  - 'Ba nhóm khả năng: quản lý lưu lượng, bảo mật và quan sát'
  - Phân biệt service mesh với mạng mesh ở tầng kết nối
  - Quan hệ giữa service mesh, microservices và hệ thống phân tán
  - Giá trị nhận được và phần phức tạp vận hành được bổ sung
  - Lộ trình học từ đường đi yêu cầu đến kiểm chứng chính sách
- level1: Nền tảng kết nối
  level2:
  - Ôn lại địa chỉ IP, cổng, socket và kết nối TCP trong phạm vi cần thiết
  - Vai trò của DNS và tên dịch vụ khi tìm đích kết nối
  - Phân biệt xử lý lớp vận chuyển (L4) và lớp ứng dụng (L7)
  - Vai trò của proxy thuận, proxy ngược và trung gian trong suốt
  - Phân biệt kết nối mạng với một yêu cầu ứng dụng
  - Khái niệm upstream, downstream, inbound và outbound
  - Phân biệt lưu lượng nội bộ (east–west) và ra vào hệ thống (north–south)
  - Hiểu ranh giới của TLS trước khi thêm lớp bảo vệ của mesh
- level1: Phạm vi trách nhiệm
  level2:
  - Phân biệt service mesh với thư viện HTTP client và bộ công cụ chịu lỗi
  - Phối hợp service mesh với API gateway và ingress controller
  - Phân biệt service mesh với service discovery và bộ cân bằng tải
  - Quan hệ với CNI, mạng Kubernetes và NetworkPolicy
  - Phân biệt chính sách giao tiếp với phân quyền nghiệp vụ
  - Những thay đổi ứng dụng vẫn phải thực hiện khi sử dụng mesh
  - Giới hạn đối với dữ liệu, giao thức hoặc đường truyền không được mesh xử lý
  - Xác định trách nhiệm của nhóm ứng dụng, nền tảng, mạng và bảo mật
- level1: Kiến trúc
  level2:
  - Mặt phẳng dữ liệu (data plane) trực tiếp xử lý lưu lượng
  - Mặt phẳng điều khiển (control plane) quản lý cấu hình và chính sách
  - Vai trò của nguồn khám phá dịch vụ và bộ đăng ký đích kết nối
  - Chuyển ý định định tuyến thành cấu hình cho các proxy
  - Phân phối cấu hình động và khái niệm trạng thái mong muốn, trạng thái thực tế
  - Vai trò của cơ quan cấp chứng chỉ và quản lý danh tính
  - Quan hệ giữa thành phần điều khiển, thành phần xử lý và hệ thống telemetry
  - Phân biệt luồng điều khiển với đường truyền yêu cầu nghiệp vụ
  - Điều kiện và giới hạn khi data plane dùng cấu hình đã nhận lúc control plane gián đoạn
- level1: Mô hình triển khai
  level2:
  - 'Sidecar: proxy chạy cùng đơn vị triển khai của ứng dụng'
  - Proxy dùng chung theo node và phạm vi ảnh hưởng khi thành phần lỗi
  - Mô hình phân tầng L4 và L7 với proxy bổ sung theo nhu cầu
  - Ambient và waypoint trong Istio như một ví dụ triển khai
  - Phân biệt không có sidecar với không có proxy
  - Vai trò của chuyển hướng bằng quy tắc mạng, CNI hoặc eBPF
  - So sánh độ hạt chính sách, mức quan sát và chi phí giữa các mô hình
  - Xác định khả năng hỗ trợ workload trên Kubernetes và máy ảo
  - Đánh giá giới hạn tính năng theo sản phẩm, chế độ và phiên bản
- level1: Luồng lưu lượng
  level2:
  - Theo dấu một cuộc gọi từ ứng dụng nguồn đến ứng dụng đích
  - Chuyển hướng kết nối outbound vào thành phần xử lý của mesh
  - Xử lý inbound và chuyển lưu lượng đến cổng ứng dụng
  - Phân biệt địa chỉ đích logic với endpoint thực tế được chọn
  - Nhận diện đoạn đường có mã hóa và điểm kết thúc mỗi kết nối
  - Xử lý giao tiếp với workload chưa tham gia mesh
  - Kiểm soát cổng loại trừ, đường đi trực tiếp và khả năng bỏ qua chính sách
  - Phân tích đường đi khi có gateway hoặc proxy L7 dùng chung
  - Phân biệt yêu cầu thành công ở proxy với nghiệp vụ hoàn tất ở ứng dụng
- level1: Khám phá dịch vụ
  level2:
  - Vai trò của service registry, DNS và thông tin endpoint
  - Đồng bộ thay đổi khi workload được tạo, thu hồi hoặc đổi địa chỉ
  - Phân biệt tên dịch vụ, phiên bản ứng dụng và nhóm endpoint
  - Xử lý dữ liệu khám phá chưa cập nhật và endpoint đã ngừng hoạt động
  - Phân biệt readiness của ứng dụng với trạng thái sức khỏe do proxy quan sát
  - Đăng ký dịch vụ bên ngoài hoặc workload không thuộc Kubernetes
  - Giới hạn phạm vi nhìn thấy dịch vụ theo môi trường hoặc miền quản trị
  - Kiểm chứng tập endpoint mà data plane thực sự sử dụng
- level1: Giao thức
  level2:
  - Khả năng xử lý TCP và giới hạn khi không nhìn thấy nội dung L7
  - Xử lý HTTP/1.1, kết nối giữ lâu và tái sử dụng kết nối
  - HTTP/2, nhiều luồng trên một kết nối và ảnh hưởng đến cân bằng tải
  - 'gRPC: mã trạng thái, deadline và yêu cầu dạng streaming'
  - WebSocket và các kết nối ứng dụng tồn tại lâu
  - Nhận diện giao thức tự động và khai báo cổng hoặc giao thức tường minh
  - TLS do ứng dụng tạo và giới hạn quan sát nội dung được mã hóa
  - Kiểm tra hỗ trợ đối với UDP, giao thức tùy biến và giao thức không được nhận diện
  - Phân biệt tính năng hỗ trợ ở L4 với tính năng cần xử lý L7
- level1: Định tuyến
  level2:
  - Ánh xạ tên đích và điều kiện khớp sang tuyến xử lý
  - Định tuyến HTTP theo host, đường dẫn, phương thức và header
  - Định tuyến đến phiên bản hoặc tập con của dịch vụ
  - Chia lưu lượng theo trọng số và giới hạn của tỷ lệ quan sát thực tế
  - Phân biệt định tuyến theo yêu cầu với phân phối theo kết nối
  - Quy tắc ưu tiên, tuyến mặc định và điều kiện khớp chồng lấn
  - Chuyển hướng, viết lại đường dẫn và tác động đến ứng dụng
  - Canary, blue–green và điều kiện cần để kiểm chứng kết quả
  - Phản chiếu lưu lượng (traffic mirroring) và nguy cơ tạo tác dụng phụ
  - Giới hạn định tuyến khi thiếu thông tin giao thức hoặc lưu lượng bị mã hóa
- level1: Cân bằng tải
  level2:
  - Phân biệt cân bằng tải phía client, proxy và hạ tầng mạng
  - Nguyên lý round robin, chọn ngẫu nhiên và chọn đích ít tải
  - Vai trò của connection pool và tái sử dụng kết nối tới đích
  - Ảnh hưởng của HTTP/2, gRPC và kết nối lâu đến phân phối tải
  - Giới hạn của session affinity và lựa chọn đích ổn định
  - Nhận diện endpoint lỗi từ kiểm tra chủ động và quan sát lỗi thụ động
  - Tạm loại endpoint bất thường (outlier detection) và điều kiện đưa trở lại
  - Ưu tiên vị trí gần, chuyển vùng dự phòng và đánh đổi độ trễ
  - Xử lý khi không còn endpoint sẵn sàng hoặc được phép sử dụng
- level1: Độ tin cậy
  level2:
  - Nhận diện lỗi kết nối, lỗi ứng dụng và lỗi một phần của hệ thống
  - Phân biệt timeout kết nối, timeout yêu cầu và timeout từng lần thử
  - Thiết kế ngân sách thời gian cho chuỗi cuộc gọi nhiều dịch vụ
  - Điều kiện retry an toàn và tính lũy đẳng (idempotency) của thao tác
  - Giới hạn số lần thử, ngân sách retry, backoff và jitter
  - Ngăn retry khuếch đại tải và tạo hiệu ứng lỗi dây chuyền
  - Giới hạn kết nối, yêu cầu chờ và mức đồng thời tại proxy
  - Phân biệt circuit breaking tại proxy với cơ chế trạng thái trong thư viện ứng dụng
  - Vai trò của loại endpoint lỗi, failover và giới hạn của phục hồi tự động
  - Phân biệt rate limiting với kiểm soát đồng thời và kiểm tra khả năng hỗ trợ
  - Vì sao timeout ở proxy không bảo đảm tác vụ nghiệp vụ phía đích đã dừng
- level1: Phối hợp ứng dụng
  level2:
  - Phân chia trách nhiệm timeout và retry giữa HTTP client với mesh
  - Phối hợp Resilience4j hoặc thư viện chịu lỗi khác với chính sách proxy
  - Ngăn nhiều tầng retry nhân số lần gọi đến dịch vụ đích
  - Truyền deadline, hủy yêu cầu và ngữ cảnh xuyên qua nhiều dịch vụ
  - Thiết kế idempotency key cho thao tác có tác dụng phụ
  - Giữ xử lý lỗi, fallback và bù trừ nghiệp vụ trong ứng dụng
  - Phân biệt lỗi do proxy sinh với lỗi do ứng dụng trả về
  - Xử lý khởi động, kiểm tra sẵn sàng và dừng ứng dụng có kiểm soát
  - Kiểm tra Java HTTP client, connection pool và luồng bất đồng bộ khi thêm mesh
- level1: Danh tính và chứng chỉ
  level2:
  - Phân biệt danh tính workload với địa chỉ IP và tên host
  - Quan hệ giữa service account, workload và danh tính dịch vụ
  - Khái niệm miền tin cậy (trust domain) và ranh giới quản trị danh tính
  - SPIFFE và SVID như nền tảng nhận diện workload cần biết
  - Vai trò của chứng chỉ X.509, khóa riêng và cơ quan cấp chứng chỉ
  - Cấp danh tính ban đầu và kiểm chứng workload xin chứng chỉ
  - Tự động cấp mới, luân chuyển và xử lý chứng chỉ hết hạn
  - Phân phối tập chứng chỉ tin cậy và thay đổi gốc tin cậy
  - Bảo vệ khóa riêng và quyền truy cập vào thành phần cấp danh tính
- level1: mTLS
  level2:
  - TLS một chiều và xác thực hai phía bằng mutual TLS
  - Xác thực danh tính hai workload trong quá trình thiết lập kết nối
  - Xác định phạm vi mã hóa giữa proxy, node, gateway và ứng dụng
  - Phân biệt mTLS của mesh với HTTPS do ứng dụng tự cấu hình
  - Triển khai chế độ chuyển tiếp và chế độ bắt buộc theo khả năng của mesh
  - Xử lý giao tiếp giữa workload trong mesh và workload ngoài mesh
  - Quan hệ giữa mTLS, phân quyền và cách tiếp cận zero trust
  - Kiểm chứng danh tính, chuỗi tin cậy và mã hóa thay vì chỉ dựa vào cấu hình
- level1: Phân quyền
  level2:
  - Phân biệt xác thực workload, xác thực người dùng và quyết định cấp quyền
  - Thiết kế quyền gọi dịch vụ dựa trên danh tính đã được kiểm chứng
  - Chính sách L4 theo kết nối và chính sách L7 theo nội dung yêu cầu
  - Phạm vi chính sách theo mesh, namespace, workload và đích dịch vụ
  - Quy tắc cho phép, từ chối và hành vi khi không có chính sách
  - Vai trò của JWT và giới hạn khi danh tính người dùng đi qua nhiều dịch vụ
  - Ngăn tin cậy header danh tính do nguồn không đáng tin tự khai báo
  - Phối hợp chính sách mesh với NetworkPolicy và kiểm tra quyền trong ứng dụng
  - Kiểm thử trường hợp không được phép và đường đi có thể bỏ qua điểm thực thi
- level1: Cổng và kết nối ngoài
  level2:
  - Vai trò của ingress gateway tại ranh giới vào hệ thống
  - Vai trò của egress gateway khi gọi dịch vụ bên ngoài
  - Phân biệt gateway của mesh với API gateway quản lý API
  - TLS termination, TLS passthrough và TLS origination
  - Phân biệt host, SNI, tên trong chứng chỉ và đích kết nối thực tế
  - Kiểm soát DNS và dịch vụ bên ngoài theo chính sách
  - Giới hạn của định tuyến egress nếu không chặn được đường ra trực tiếp
  - Giữ danh tính, địa chỉ nguồn và header chuyển tiếp qua nhiều proxy
  - Đánh giá độ sẵn sàng và điểm nghẽn của gateway dùng chung
- level1: Kubernetes
  level2:
  - Quan hệ giữa Pod, Service, EndpointSlice và service mesh
  - Thêm workload vào mesh bằng cơ chế injection hoặc cơ chế tham gia tương ứng
  - Vai trò của namespace, nhãn và annotation trong lựa chọn phạm vi
  - Đồng bộ ServiceAccount với danh tính workload
  - Ảnh hưởng của admission webhook và thành phần CNI đến triển khai Pod
  - Khởi động, readiness, liveness và dừng proxy theo vòng đời workload
  - Giới hạn tài nguyên, lập lịch và tự động mở rộng các thành phần mesh
  - Phân biệt Kubernetes RBAC với quyền gọi dịch vụ do mesh thực thi
  - Vai trò của Gateway API và GAMMA trong cấu hình giao tiếp dịch vụ
  - Đối chiếu tính tương thích của nền tảng, mô hình mesh và phiên bản API
- level1: Quan sát
  level2:
  - Nhật ký truy cập, chỉ số và truy vết do các thành phần mesh cung cấp
  - Đo lưu lượng, tỷ lệ lỗi và độ trễ theo dịch vụ hoặc tuyến
  - Phân biệt góc nhìn phía nguồn, phía đích và số liệu ứng dụng
  - Ngăn đếm trùng yêu cầu khi nhiều proxy cùng phát telemetry
  - Phân biệt độ trễ ở proxy, trên mạng và trong xử lý nghiệp vụ
  - Vai trò của truyền ngữ cảnh trace trong ứng dụng để nối các span
  - Phối hợp mesh telemetry với OpenTelemetry và instrumentation của ứng dụng
  - Kiểm soát lấy mẫu, cardinality, dữ liệu nhạy cảm và chi phí quan sát
  - Theo dõi bản đồ phụ thuộc và giới hạn của suy luận từ lưu lượng
  - Tách chỉ số sức khỏe của control plane khỏi chất lượng giao tiếp dịch vụ
- level1: Nhiều cụm
  level2:
  - Phân biệt nhiều cluster, nhiều mạng và nhiều mesh
  - Lựa chọn control plane dùng chung hoặc độc lập theo miền quản trị
  - Khám phá dịch vụ và tránh xung đột tên giữa các cụm
  - Thiết lập kết nối qua gateway và các ranh giới mạng
  - Phân phối danh tính và thiết lập quan hệ tin cậy giữa các miền
  - Định tuyến theo vị trí, failover và ảnh hưởng của dữ liệu nghiệp vụ
  - Xử lý mất kết nối liên cụm và khả năng hoạt động độc lập
  - Giới hạn phạm vi sự cố và chi phí truyền dữ liệu qua vùng
- level1: Hiệu năng
  level2:
  - Đo chi phí bổ sung về độ trễ, CPU và bộ nhớ trên đường truyền
  - Phân biệt chi phí xử lý L4 với xử lý L7 và quan sát chi tiết
  - Ảnh hưởng của bắt tay TLS, tái sử dụng kết nối và mã hóa
  - Ảnh hưởng của số endpoint, số tuyến và kích thước cấu hình
  - Đánh giá tài nguyên khi dùng sidecar hoặc proxy dùng chung
  - Kiểm soát hàng đợi, giới hạn đồng thời và hành vi khi quá tải
  - Thiết kế benchmark có tải đại diện và đường cơ sở không dùng mesh
  - So sánh phân vị độ trễ, thông lượng và tỷ lệ lỗi thay vì chỉ giá trị trung bình
  - Xác định năng lực dự phòng và chi phí vận hành theo quy mô hệ thống
- level1: Vận hành
  level2:
  - Thiết kế độ sẵn sàng cao cho control plane, gateway và thành phần cấp danh tính
  - Theo dõi kết nối điều khiển, phân phối cấu hình và độ lệch trạng thái
  - Xử lý cấu hình bị từ chối và kiểm chứng cấu hình có hiệu lực tại proxy
  - Giám sát cấp mới chứng chỉ, hạn chứng chỉ và thay đổi tập tin cậy
  - Đánh giá hoạt động khi control plane, CA hoặc thành phần khám phá gián đoạn
  - Xác định hành vi khi thiếu cấu hình, thiếu chứng chỉ hoặc phụ thuộc bảo mật lỗi
  - Nâng cấp có kiểm soát và quản lý độ lệch phiên bản giữa các thành phần
  - Rút kết nối có kiểm soát (connection draining) khi dừng hoặc thay proxy
  - Quản lý log gỡ lỗi, cổng quản trị và quyền truy cập công cụ chẩn đoán
  - Chuẩn bị quy trình phục hồi cấu hình và xác minh kết nối sau sự cố
- level1: Cấu hình và chính sách
  level2:
  - Quản lý cấu hình khai báo và nguồn chuẩn trong Git
  - Tách quyền quản trị mesh với quyền định nghĩa tuyến của nhóm ứng dụng
  - Xác định phạm vi, thứ tự ưu tiên và cách kết hợp các chính sách
  - Rà soát selector, tên dịch vụ và các tham chiếu trước khi áp dụng
  - Phân biệt cấu hình hợp lệ về lược đồ với hành vi đúng khi chạy
  - Nhận biết độ trễ lan truyền và khả năng các proxy tạm dùng phiên bản khác nhau
  - Hiểu ACK, NACK và giới hạn của xác nhận cấu hình trong triển khai dùng xDS
  - Xem trước tác động, triển khai theo phạm vi nhỏ và xác minh thực tế
  - Phát hiện thay đổi thủ công, cấu hình trôi lệch và chính sách không còn dùng
- level1: Áp dụng từng bước
  level2:
  - Kiểm kê giao thức, luồng gọi và cơ chế chịu lỗi đang có
  - Đo đường cơ sở về độ trễ, lỗi, tài nguyên và khả năng quan sát
  - Chọn phạm vi thử nghiệm với tiêu chí thành công rõ ràng
  - Đưa từng nhóm workload vào mesh và kiểm tra giao tiếp hai chiều
  - Chuyển dần từ kết nối chưa bảo vệ sang yêu cầu danh tính và mTLS
  - Bổ sung phân quyền sau khi đã xác minh danh tính và đường truyền
  - Phối hợp timeout, retry và telemetry giữa ứng dụng với mesh
  - Đánh giá tương thích khi cùng tồn tại nhiều mô hình data plane
  - Thiết kế quay lui và gỡ mesh mà vẫn duy trì yêu cầu bảo vệ cần thiết
- level1: Kiểm thử
  level2:
  - Tạo mô hình dịch vụ thử nghiệm với đường gọi và kết quả đã biết
  - Kiểm chứng lưu lượng thực sự đi qua các điểm xử lý dự kiến
  - Kiểm thử quy tắc khớp, trọng số, tuyến mặc định và trường hợp không khớp
  - Kiểm thử danh tính đúng, sai, hết hạn và không thuộc miền tin cậy
  - Kiểm thử phân quyền với cả yêu cầu được phép và bị từ chối
  - Mô phỏng chậm, lỗi, reset kết nối và mất endpoint trong phạm vi thử nghiệm
  - Kiểm tra giới hạn tương tác giữa fault injection, timeout và retry của từng mesh
  - Kiểm chứng số lần gọi và tác dụng phụ khi thử lại yêu cầu
  - Kiểm thử khởi động, dừng, nâng cấp và gián đoạn thành phần điều khiển
  - Đối chiếu metrics, access log và trace với kết quả tại ứng dụng
  - Kiểm thử tải và xác nhận các ngưỡng chấp nhận trước khi mở rộng
- level1: Chẩn đoán sự cố
  level2:
  - Phân lớp lỗi từ ứng dụng, proxy, DNS, endpoint đến mạng nền
  - Kiểm tra workload đã tham gia mesh và lưu lượng có được chuyển hướng
  - Điều tra tên đích không phân giải được hoặc tập endpoint rỗng
  - Điều tra tuyến không khớp, chọn sai phiên bản hoặc lệch tỷ lệ lưu lượng
  - Phát hiện nhận diện sai giao thức và giới hạn quan sát lưu lượng TLS
  - Phân biệt lỗi chứng chỉ, lỗi danh tính và từ chối quyền truy cập
  - Truy nguyên timeout, retry lặp, lỗi 502/503 và reset kết nối
  - Điều tra độ trễ tăng do proxy quá tải, pool kết nối hoặc hàng đợi
  - Kiểm tra cấu hình chưa lan truyền, bị từ chối hoặc không có hiệu lực
  - Điều tra Pod không khởi động do injection, CNI hoặc vòng đời thành phần
  - Thu thập bằng chứng có giới hạn và kiểm chứng nguyên nhân sau khắc phục
- level1: Đánh giá lựa chọn
  level2:
  - Xác định bài toán giao tiếp và mức kiểm soát thực sự cần có
  - Đánh giá khả năng của thư viện ứng dụng, nền tảng mạng và service mesh
  - Lựa chọn mô hình data plane theo tải, ranh giới lỗi và năng lực vận hành
  - Đối chiếu tính năng cần thiết với khả năng của từng sản phẩm và chế độ
  - Đọc Istio và Linkerd như các ví dụ hiện thực hóa nguyên lý chung
  - Đánh giá API cấu hình, khả năng tích hợp và chi phí chuyển đổi
  - Đánh giá vòng đời hỗ trợ, cập nhật bảo mật và tương thích phiên bản
  - Xác định trách nhiệm vận hành và tiêu chí tiếp tục mở rộng sau thử nghiệm
- level1: Thực hành tổng hợp
  level2:
  - Vẽ đường đi một yêu cầu qua hệ thống nhiều dịch vụ và đánh dấu các ranh giới
  - Dựng môi trường thử nghiệm từ mô hình ứng dụng và một mesh đã chọn
  - Kiểm chứng khám phá dịch vụ, định tuyến theo phiên bản và chia lưu lượng
  - Bảo vệ một luồng gọi bằng danh tính, mTLS và quyền tối thiểu
  - Thiết kế ngân sách thời gian và retry cho thao tác đọc hoặc ghi có kiểm soát
  - Quan sát sự khác nhau giữa lỗi ứng dụng, lỗi mạng và lỗi chính sách
  - Mô phỏng mất endpoint hoặc control plane rồi kiểm tra giới hạn hoạt động
  - Đo chi phí trước và sau khi áp dụng tính năng L4 hoặc L7
  - Hoàn thiện sơ đồ, bảng kiểm và hướng dẫn vận hành cho phạm vi đã thử
