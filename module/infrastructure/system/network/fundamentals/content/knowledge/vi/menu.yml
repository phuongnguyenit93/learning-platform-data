  - Cổng dịch vụ, cổng tạm thời và phạm vi sử dụng
  - Socket, endpoint và định danh một cuộc giao tiếp
  - Bind, listen, accept, connect, send và receive ở mức khái niệm
  - Bind vào loopback, một địa chỉ cụ thể hoặc địa chỉ wildcard
  - 'Phân biệt 0.0.0.0 và :: khi lắng nghe'
  - Địa chỉ lắng nghe và địa chỉ client cần dùng để kết nối
  - Nhiều client cùng kết nối tới một cổng dịch vụ
  - Chọn địa chỉ nguồn và cổng nguồn khi tạo kết nối đi
  - TCP socket, UDP socket và Unix domain socket
  - Connection refused, connection timeout và không có route khác nhau thế nào
  - Cạn cổng tạm thời, hàng đợi kết nối và giới hạn socket
  - Đọc trạng thái socket và ghép với tiến trình sở hữu
- level1: DNS
  level2:
  - Vì sao cần tên miền và hệ thống phân giải tên
