  - Mã hóa tín hiệu, điều chế và ghép kênh ở mức khái niệm
  - Suy hao, nhiễu, khoảng cách và chất lượng liên kết
  - Đồng bộ tốc độ, auto-negotiation và lỗi duplex
  - Phân biệt cổng vật lý, card mạng và giao diện mạng logic
  - Liên kết hoạt động và khả năng truyền dữ liệu đầu cuối là hai kiểm tra khác nhau
- level1: Ethernet và Wi-Fi
  level2:
