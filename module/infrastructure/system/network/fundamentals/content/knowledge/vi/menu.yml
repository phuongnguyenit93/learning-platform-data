  - Phân biệt stub resolver, recursive resolver và authoritative server
  - Luồng tra cứu từ máy client qua các cấp DNS
  - Vai trò cơ bản của A, AAAA, CNAME, MX, NS, TXT, PTR và SRV
  - TTL, bộ nhớ đệm và lưu kết quả không tồn tại
  - Phân giải thuận, phân giải ngược và ranh giới xác thực danh tính
  - DNS dùng UDP, TCP hoặc kênh mã hóa trong những bối cảnh nào
  - Tệp hosts, search domain và khác biệt cách phân giải giữa công cụ với ứng dụng
  - Split-horizon DNS và tên nội bộ so với tên công khai
  - DNS thay đổi nhưng ứng dụng vẫn dùng địa chỉ cũ
  - Phân biệt lỗi phân giải tên với lỗi kết nối tới địa chỉ đã phân giải
- level1: Giao thức ứng dụng
  level2:
  - Giao thức ứng dụng định nghĩa thông điệp và quy tắc trao đổi
  - URL, URI, tên miền, cổng và đường dẫn trong một địa chỉ dịch vụ
  - HTTP request, response, phương thức, header và mã trạng thái
  - Kết nối HTTP/1.1, multiplexing của HTTP/2 và HTTP/3 trên QUIC
  - HTTP keep-alive và phân biệt với TCP keepalive
  - HTTPS kết hợp HTTP với TLS ở đâu trong luồng truyền
  - WebSocket và mô hình giao tiếp hai chiều
  - gRPC, lời gọi thủ tục từ xa và truyền dữ liệu theo luồng
  - SMTP, giao thức truy cập hộp thư và luồng gửi nhận email
  - SSH, truyền tệp và quản trị từ xa
  - NTP, đồng bộ thời gian và tác động của sai lệch đồng hồ
  - Vì sao kết nối mạng thành công chưa chứng minh giao thức ứng dụng hoạt động đúng
- level1: TLS và danh tính
  level2:
  - 'Mục tiêu của TLS: bí mật, toàn vẹn và xác thực đầu bên kia'
  - Mã hóa đối xứng, bất đối xứng và hàm băm ở mức khái niệm
  - Chứng thư số, khóa công khai và khóa riêng
  - CA, chuỗi chứng thư và kho tin cậy
  - Kiểm tra tên máy chủ, thời hạn và chuỗi tin cậy của chứng thư
  - Bắt tay TLS và thiết lập khóa phiên ở mức tổng quan
  - SNI, ALPN và phân biệt với HTTP Host
  - Xác thực một chiều và xác thực hai chiều bằng mTLS
  - TLS termination, TLS passthrough và mã hóa lại tới upstream
  - Khác biệt giữa mã hóa đường truyền với cấp quyền truy cập ứng dụng
  - Ảnh hưởng của đồng hồ sai, chứng thư sai tên và CA không được tin cậy
- level1: Firewall và phân đoạn
  level2:
  - Chính sách truy cập và nguyên tắc đặc quyền tối thiểu
  - Lọc theo IP, số cổng, giao thức và chiều lưu lượng
  - Firewall không trạng thái và firewall có trạng thái
  - Theo dõi kết nối và nhận diện lưu lượng phản hồi
  - Ingress, egress và cách nhìn phụ thuộc vị trí quan sát
  - Thứ tự rule, hành động cho phép, từ chối và loại bỏ im lặng
  - Firewall trên máy, firewall mạng và firewall tại hạ tầng cloud
  - Phân vùng mạng, DMZ và kiểm soát liên lạc giữa các tầng
  - Phân biệt route tồn tại với chính sách cho phép truyền
  - Ảnh hưởng của định tuyến bất đối xứng đến thiết bị có trạng thái
  - Kiểm soát riêng IPv4 và IPv6 để tránh khoảng trống chính sách
  - Ghi nhận và kiểm tra thay đổi chính sách truy cập
- level1: Bảo mật mạng
  level2:
  - Tài sản, mối đe dọa, bề mặt tấn công và ranh giới tin cậy
  - Phân biệt giả mạo địa chỉ, nghe lén và tấn công xen giữa
  - ARP spoofing, DNS spoofing và rủi ro từ hạ tầng phân giải
  - Quét cổng và việc lộ dịch vụ ngoài phạm vi dự kiến
  - DoS, DDoS và khuếch đại lưu lượng ở mức nền tảng
  - Phân biệt xác thực, cấp quyền và mã hóa
  - Giới hạn của việc tin cậy theo địa chỉ IP hoặc vị trí trong mạng
  - Zero Trust và xác minh danh tính thay vì mặc định tin mạng nội bộ
  - Bảo vệ giao diện quản trị, thông tin đăng nhập và khóa bí mật
  - Thu thập gói tin và log theo phạm vi được phép, hạn chế lộ dữ liệu
  - Phòng thủ nhiều lớp và trách nhiệm phối hợp của mạng với ứng dụng
- level1: VPN và đường hầm
  level2:
  - Đường hầm đóng gói lưu lượng của mạng này trong mạng khác
  - Phân biệt tunneling với mã hóa
  - VPN site-to-site và VPN truy cập từ xa
  - Định tuyến qua VPN, full tunnel và split tunnel
  - Ảnh hưởng của VPN đến địa chỉ nguồn, DNS và quyền truy cập
  - Chi phí đóng gói, MTU và hiệu năng của đường hầm
  - IPsec, WireGuard và VPN dựa trên TLS ở mức khái niệm
  - Mạng overlay và mạng underlay
  - Những giới hạn bảo mật còn tồn tại sau khi đã kết nối VPN
- level1: Proxy và cân bằng tải
  level2:
  - Vì sao cần thành phần trung gian giữa client và dịch vụ
  - Forward proxy, reverse proxy và gateway
  - Cân bằng tải tầng vận chuyển và tầng ứng dụng
  - Phân phối theo kết nối, theo yêu cầu và ảnh hưởng đến phiên
  - Health check và rút đích không khỏe khỏi lưu lượng
  - TLS termination và tác động đến danh tính đầu cuối
  - Bảo toàn địa chỉ client qua header hoặc PROXY protocol
  - NAT, proxy và load balancer khác nhau ở cách chuyển dữ liệu
  - Service discovery và thay đổi địa chỉ của dịch vụ
  - Ranh giới giữa load balancer, API Gateway và Service Mesh
  - Tác động của nhiều lớp trung gian đến timeout, retry và chẩn đoán
- level1: Mạng ảo
  level2:
  - Máy ảo, container và nhu cầu cô lập giao diện mạng
  - Network namespace, virtual NIC, veth và virtual bridge
  - Mạng host và mạng bridge trong môi trường container
  - Địa chỉ bên trong container và cổng được công bố trên host
  - Ý nghĩa của localhost khi có nhiều namespace hoặc máy ảo
  - DNS nội bộ và tên dịch vụ trong môi trường container
  - Luồng gói tin từ máy bên ngoài tới ứng dụng trong container
  - Overlay giữa nhiều host và chi phí đóng gói
  - Khái niệm Pod, Service và đường vào cụm trong Kubernetes
  - Phân biệt địa chỉ dịch vụ logic với địa chỉ tiến trình thực tế
  - Ranh giới giữa nền tảng mạng ảo với cấu hình chuyên biệt của công cụ triển khai
- level1: Mạng cloud
  level2:
  - Mạng riêng ảo và sự cô lập logic trong hạ tầng cloud
  - Subnet, zone và bố trí tài nguyên theo phạm vi mạng
  - Địa chỉ riêng, địa chỉ công cộng và địa chỉ dành riêng
  - Bảng tuyến và phân biệt subnet công khai với subnet riêng
  - Cổng Internet, NAT gateway và lưu lượng đi ra
  - Security group, network ACL và khác biệt cần kiểm tra theo nhà cung cấp
  - Load balancer công khai, nội bộ và endpoint dịch vụ riêng
  - Peering, mạng trung chuyển và kết nối về trung tâm dữ liệu
  - DNS riêng và phạm vi phân giải trong mạng cloud
  - Đường truyền liên vùng, qua zone và các yếu tố chi phí
  - Ranh giới trách nhiệm giữa nhà cung cấp cloud với người triển khai
- level1: Hiệu năng mạng
  level2:
  - Phân biệt băng thông, thông lượng và goodput
  - Độ trễ lan truyền, truyền dữ liệu, xử lý và xếp hàng
  - Độ trễ một chiều, round-trip time và giới hạn phép đo
  - Jitter, mất gói, trùng gói và gói đến sai thứ tự
  - Bottleneck và lý do tăng băng thông không giải quyết mọi vấn đề
  - Bandwidth-delay product và lượng dữ liệu cần đang truyền
  - Quan hệ giữa độ trễ, cửa sổ TCP và thông lượng
  - Hàng đợi, bufferbloat và độ trễ khi đường truyền bão hòa
  - Chi phí DNS, bắt tay TCP, bắt tay TLS và tái sử dụng kết nối
  - Kích thước thông điệp, batching, nén và chi phí xử lý
  - Phân vị p50, p95, p99 và độ trễ đuôi
  - Chất lượng dịch vụ, ưu tiên và đánh dấu lưu lượng ở mức khái niệm
  - CDN, vị trí địa lý và rút ngắn khoảng cách tới người dùng
  - Thiết kế phép đo để phân biệt giới hạn mạng với giới hạn máy phát hoặc ứng dụng
- level1: Khả dụng
  level2:
  - Lỗi đường truyền, thiết bị, vùng mạng và lỗi từng phần
  - Điểm lỗi đơn và dự phòng ở các tầng mạng
  - Failover, hội tụ và khoảng gián đoạn khi đổi đường đi
  - Phát hiện lỗi bằng timeout, heartbeat và health check
  - Phân biệt không nhận được phản hồi với kết luận máy bên kia đã chết
  - Retry, backoff, jitter và nguy cơ khuếch đại tải
  - Deadline tổng thể và ngân sách timeout qua nhiều chặng
  - Tính lũy đẳng và kết quả chưa biết sau khi kết nối bị ngắt
  - Phân vùng mạng và ảnh hưởng tới tính nhất quán của hệ phân tán
  - Thiết kế kiểm tra khả dụng từ góc nhìn người dùng và từ từng thành phần
- level1: Công cụ quan sát
  level2:
  - 'Xác định điểm quan sát: client, host, gateway hay dịch vụ phía sau'
  - Xem giao diện và địa chỉ bằng ip addr hoặc công cụ tương đương
  - Xem bảng tuyến và tra cứu đường đi bằng ip route
  - Xem bảng láng giềng bằng ip neigh và đối chiếu với ARP/NDP
  - Kiểm tra socket và tiến trình bằng ss hoặc netstat
  - Dùng ping để kiểm tra phản hồi ICMP và đo RTT
  - Dùng traceroute hoặc tracert để quan sát các chặng
  - Phân giải tên bằng dig, nslookup và công cụ dùng resolver của hệ điều hành
  - Dùng curl và openssl s_client để tách bước HTTP khỏi TLS
  - Kiểm tra cổng bằng nc hoặc công cụ tương đương
  - Bắt và đọc gói tin bằng tcpdump cùng Wireshark
  - Đo thông lượng bằng iperf3 và nhận diện giới hạn của môi trường đo
  - Kết hợp packet capture, log, metric và thời gian của từng sự kiện
  - Giới hạn suy luận từ một phép ping, một lần traceroute hoặc một điểm bắt gói
- level1: Tư duy xử lý lỗi
  level2:
  - Ghi rõ nguồn, đích, giao thức, thời điểm và kết quả mong đợi
  - Tách lỗi cấu hình, lỗi phân giải tên, lỗi đường truyền và lỗi ứng dụng
  - Kiểm tra từ phạm vi cục bộ đến gateway rồi tới đích
  - Tách lần lượt DNS, IP, cổng, TLS và giao thức ứng dụng
  - Đọc triệu chứng connection refused, timeout và no route to host
  - Phân biệt dịch vụ không lắng nghe với firewall đang chặn
  - Kết nối bằng IP được nhưng bằng tên không được
  - Kết nối từ host được nhưng từ container hoặc máy khác không được
  - Kết nối nhỏ thành công nhưng truyền dữ liệu lớn bị treo
  - Lỗi chỉ xuất hiện trên IPv4, IPv6 hoặc một đường mạng
  - Kiểm tra cả đường đi, đường về, NAT và chính sách có trạng thái
  - Thay đổi một yếu tố mỗi lần và giữ bằng chứng trước khi sửa
  - Ghi kết luận cùng giới hạn của bằng chứng và chuyển sang điều tra chuyên sâu khi cần
- level1: Bài thực hành
  level2:
  - Vẽ sơ đồ mạng hiện tại và mô tả vai trò của từng thành phần
  - Lần theo một yêu cầu HTTPS từ nhập URL đến nhận dữ liệu
  - Đọc địa chỉ, prefix, gateway, DNS và bảng tuyến của một máy
  - Chia subnet IPv4 và kiểm tra kế hoạch không chồng lấn
  - Quan sát Ethernet, ARP và TCP trong một phiên bắt gói
  - So sánh gói tin gửi cùng subnet với gói tin gửi qua router
  - Đọc địa chỉ IPv6, bảng NDP và thông tin Router Advertisement
  - Dựng client–server cục bộ và so sánh bind loopback với wildcard
  - Quan sát DNS qua các lần tra cứu và thay đổi bộ nhớ đệm
  - Theo dõi một ánh xạ NAT và kiểm tra cổng được chuyển tiếp
  - Thiết lập hai phân đoạn và kiểm tra chính sách truy cập được phép
  - So sánh địa chỉ và localhost giữa host với container
  - Đo RTT, thông lượng và ảnh hưởng của mất gói trong môi trường kiểm soát
  - Mô phỏng lỗi DNS, route, cổng và TLS rồi xác định lớp gây lỗi
  - Tổng hợp sơ đồ, bảng luồng kết nối và báo cáo bằng chứng của một hệ thống nhỏ
