  - Cấu trúc cơ bản của Ethernet frame
  - 'Địa chỉ MAC: định dạng, unicast, multicast và broadcast'
  - Địa chỉ MAC cục bộ, ngẫu nhiên hóa và giới hạn của việc nhận diện thiết bị
  - EtherType và nhận diện giao thức được chở trong frame
  - Kiểm tra lỗi FCS và phân biệt phát hiện lỗi với xác thực dữ liệu
  - MTU của liên kết và phần dữ liệu Ethernet chuyên chở
  - Chia sẻ môi trường truyền và miền va chạm
  - 'Wi-Fi: điểm truy cập, trạm, SSID và BSSID'
  - Kênh vô tuyến, vùng phủ, nhiễu và tốc độ thực tế
  - Xác thực Wi-Fi, mã hóa liên kết và roaming ở mức nền tảng
  - Vì sao kết nối được Wi-Fi chưa có nghĩa là truy cập được Internet
- level1: Thiết bị mạng
  level2:
  - Vai trò của card mạng và giao diện loopback
  - Repeater, hub, bridge và switch
  - Router và quyết định chuyển tiếp giữa các mạng IP
  - Modem, thiết bị đầu cuối quang và bộ định tuyến gia đình
  - Access point và bộ điều khiển mạng không dây
  - Firewall, proxy và load balancer
  - Gateway là một vai trò và có thể xuất hiện ở nhiều tầng
  - Thiết bị vật lý, thiết bị ảo và chức năng tích hợp trên cùng thiết bị
