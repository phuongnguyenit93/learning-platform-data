  - Header UDP, số cổng và kiểm tra lỗi
  - Những gì UDP không tự bảo đảm về thứ tự, giao nhận và truyền lại
  - Kích thước datagram, phân mảnh và rủi ro gửi gói quá lớn
  - Ứng dụng tự xử lý mất gói, trùng gói và thứ tự khi cần
  - 'Các bài toán phù hợp với UDP: DNS, thời gian thực và truyền dữ liệu theo luồng'
  - Timeout và trạng thái NAT đối với lưu lượng UDP
  - QUIC xây dựng cơ chế kết nối, bảo mật và luồng trên UDP
  - Phân biệt TCP, UDP và QUIC theo trách nhiệm của từng giao thức
  - Vì sao dùng UDP không đồng nghĩa với nhanh hơn trong mọi hoàn cảnh
- level1: Cổng và socket
  level2:
