  - Đọc sơ đồ mạng và xác định trách nhiệm của từng thiết bị
- level1: Switching và VLAN
  level2:
  - Cách switch học địa chỉ MAC từ frame nhận được
  - Bảng MAC, thời gian lưu và ảnh hưởng của thay đổi vị trí thiết bị
  - Chuyển tiếp unicast và phát tán frame chưa biết đích
  - Broadcast domain và tác động của broadcast trong LAN
  - VLAN và phân chia mạng logic trên hạ tầng chung
  - Cổng access, cổng trunk và thẻ VLAN 802.1Q
  - Native VLAN và những điểm cần thống nhất giữa hai đầu liên kết
  - Giao tiếp cùng VLAN và định tuyến giữa các VLAN
  - Vòng lặp tầng liên kết, broadcast storm và vai trò của STP
  - Gộp liên kết và giới hạn của việc tăng băng thông theo luồng
  - Vì sao VLAN không thay thế đầy đủ chính sách bảo mật giữa các mạng
- level1: Địa chỉ IPv4
  level2:
  - Vai trò của IP trong liên kết nhiều mạng khác nhau
  - Cấu trúc địa chỉ IPv4 và biểu diễn thập phân có dấu chấm
  - Biểu diễn nhị phân, phép AND và cách xác định phần mạng
  - Subnet mask, prefix length và ký hiệu CIDR
  - Địa chỉ mạng, địa chỉ host và địa chỉ broadcast
  - Địa chỉ riêng, địa chỉ công cộng và phạm vi định tuyến
  - Loopback, link-local và địa chỉ không xác định
  - Default route, default gateway và các cách dùng địa chỉ 0.0.0.0
  - Địa chỉ giao diện, địa chỉ nguồn và máy có nhiều giao diện
  - Địa chỉ tĩnh, địa chỉ động và vòng đời sử dụng địa chỉ
  - Phân biệt địa chỉ duy nhất trong một phạm vi với địa chỉ duy nhất toàn cục
  - Xung đột IPv4 và các biểu hiện thường gặp
  - Vì sao có địa chỉ IP công cộng chưa bảo đảm nhận được kết nối từ Internet
- level1: Chia mạng IPv4
  level2:
  - Vì sao cần chia subnet và lập kế hoạch địa chỉ
  - Tính địa chỉ mạng từ IP và subnet mask
  - Tính dải địa chỉ và địa chỉ broadcast của subnet
  - Tính số địa chỉ và số host sử dụng được trong từng trường hợp
  - Các trường hợp cần phân biệt với /31 và /32
  - Xác định hai địa chỉ có cùng subnet hay không
  - Chia subnet theo số lượng mạng hoặc số lượng host
  - VLSM và phân bổ subnet có kích thước khác nhau
  - Tổng hợp tuyến bằng supernet và CIDR aggregation
  - Phát hiện subnet chồng lấn và địa chỉ nằm ngoài dải
  - Chia địa chỉ cho nhiều tầng ứng dụng, môi trường và khu vực
  - Phân biệt phân loại A/B/C mang tính lịch sử với cách dùng CIDR
  - Bài toán thay đổi subnet và ảnh hưởng đến gateway cùng tuyến mạng
- level1: IPv6
  level2:
  - Động lực của IPv6 và khác biệt nền tảng so với IPv4
  - Cấu trúc địa chỉ 128 bit và biểu diễn thập lục phân
  - 'Rút gọn địa chỉ IPv6 và các quy tắc đọc ký hiệu ::'
  - Prefix IPv6 và phân biệt tiền tố mạng với phần định danh giao diện
  - Global unicast, link-local, unique local, multicast và anycast
  - Địa chỉ loopback, địa chỉ không xác định và việc không có broadcast
  - Một giao diện có nhiều địa chỉ IPv6 và phạm vi sử dụng từng địa chỉ
  - Địa chỉ link-local và ý nghĩa của zone identifier
  - Header IPv6 cơ bản và vai trò của extension header
  - Phân bổ prefix, subnet thông dụng và phạm vi áp dụng của /64
  - Cấu hình tự động, địa chỉ tạm thời và quyền riêng tư
  - Dual stack và lựa chọn IPv4 hoặc IPv6 khi kết nối
  - Các cách chuyển tiếp và chuyển đổi giữa IPv4 với IPv6 ở mức khái niệm
  - Những giả định từ IPv4 không nên áp dụng nguyên xi cho IPv6
- level1: ARP và NDP
  level2:
  - Vì sao gửi gói IP trên liên kết cục bộ cần tìm địa chỉ tầng liên kết
  - ARP request, ARP reply và phạm vi hoạt động trong IPv4
  - Bảng ARP, thời gian lưu và mục chưa phân giải được
  - ARP khi đích cùng subnet và khi phải gửi qua gateway
  - Gratuitous ARP, phát hiện xung đột và cập nhật thông tin lân cận
  - NDP trong IPv6 và vai trò của ICMPv6
  - Neighbor Solicitation, Neighbor Advertisement và solicited-node multicast
  - Router Solicitation, Router Advertisement và tìm router mặc định
  - Duplicate Address Detection và kiểm tra khả năng tiếp cận láng giềng
  - Phân biệt bảng MAC, bảng ARP/NDP và bảng định tuyến
  - Nguy cơ giả mạo ARP/NDP và ranh giới bảo vệ trong mạng cục bộ
- level1: Cấp phát cấu hình
  level2:
  - 'Các thông tin máy cần để giao tiếp: IP, prefix, gateway, DNS và tuyến'
  - Cấu hình thủ công và cấu hình tự động
  - 'DHCPv4: Discover, Offer, Request và Acknowledge'
  - Lease, gia hạn và cấp phát lại địa chỉ
  - DHCP option, reservation và địa chỉ gán cố định tại máy
  - DHCP relay và cấp phát qua nhiều subnet
  - Địa chỉ IPv4 link-local khi không nhận được cấu hình mong đợi
  - SLAAC và thông tin nhận từ Router Advertisement
  - DHCPv6 có trạng thái, không trạng thái và quan hệ với Router Advertisement
  - Phân biệt nguồn nhận địa chỉ, DNS và default route trong IPv6
  - Tác động của cấu hình cũ, nhiều DHCP server và thông tin gateway sai
- level1: Định tuyến
  level2:
  - Phân biệt chuyển tiếp từng gói với xây dựng bảng định tuyến
  - Đích cục bộ, đích cùng liên kết và đích ở mạng khác
  - 'Cấu trúc một tuyến: prefix đích, next hop, giao diện và độ ưu tiên'
  - Longest prefix match và cách chọn tuyến cụ thể nhất
  - Default route và tình huống không có tuyến phù hợp
  - Connected route, static route và dynamic route
  - Next hop, tra cứu láng giềng và quá trình chuyển tiếp qua nhiều router
  - Địa chỉ IP đầu cuối và địa chỉ MAC thay đổi qua từng chặng
  - TTL, Hop Limit và giới hạn vòng lặp chuyển tiếp
  - Đường đi, đường về và định tuyến bất đối xứng
  - Metric, nhiều tuyến cùng đích và cân bằng theo ECMP ở mức khái niệm
  - Hệ tự trị, IGP, EGP và vai trò tổng quan của OSPF cùng BGP
  - Tổng hợp tuyến, hội tụ và thay đổi đường đi sau sự cố
  - Policy routing và tình huống chọn tuyến theo điều kiện bổ sung
  - Phân biệt bảng định tuyến trên máy với bảng định tuyến của hạ tầng
- level1: ICMP và MTU
  level2:
  - ICMP và ICMPv6 dùng để báo lỗi, chẩn đoán và hỗ trợ vận hành
  - Echo request, echo reply và những gì ping thực sự kiểm tra
  - Thông báo destination unreachable và time exceeded
  - Cách traceroute khai thác TTL hoặc Hop Limit
  - MTU của liên kết, MTU đường đi và kích thước gói IP
  - Phân mảnh IPv4, cờ DF và quá trình lắp lại
  - Phân mảnh IPv6 và trách nhiệm của đầu gửi
  - Path MTU Discovery và thông báo Packet Too Big
  - Phân biệt MTU, TCP MSS và kích thước payload ứng dụng
  - Đường hầm làm giảm MTU hữu dụng như thế nào
  - MTU black hole và biểu hiện kết nối được nhưng truyền dữ liệu bị treo
  - Vì sao chặn ICMP tùy tiện có thể làm hỏng chức năng mạng
- level1: NAT và Internet
  level2:
  - Vai trò của NAT và phân biệt với định tuyến
  - Static NAT, dynamic NAT và PAT/NAPT
  - SNAT, DNAT và vị trí thay đổi địa chỉ trong luồng dữ liệu
  - Bảng ánh xạ NAT, trạng thái kết nối và thời hạn hết hạn
  - Luồng đi ra Internet qua gateway có NAT
  - Port forwarding và điều kiện tiếp nhận kết nối từ bên ngoài
  - Hairpin NAT và truy cập địa chỉ công cộng từ bên trong
  - Double NAT, CGNAT và các giới hạn đối với kết nối đi vào
  - Phân biệt IP riêng, IP công cộng và cổng đã ánh xạ
  - Giới hạn cổng, cạn bảng trạng thái và nhiều client dùng chung địa chỉ
  - NAT traversal và vai trò khái quát của STUN, TURN, ICE
  - Ảnh hưởng của NAT đến danh tính nguồn, giao thức và quan sát mạng
  - Vì sao NAT không thay thế firewall và không phải yêu cầu mặc định của IPv6
- level1: TCP
  level2:
  - TCP cung cấp luồng byte tin cậy cho ứng dụng như thế nào
  - Xác định kết nối TCP qua địa chỉ IP, số cổng và giao thức
  - Thiết lập kết nối bằng bắt tay ba bước
  - Sequence number, acknowledgement và sắp xếp lại dữ liệu
  - Checksum, mất gói, truyền lại và phản hồi trùng lặp
  - Phân biệt điều khiển luồng với điều khiển tắc nghẽn
  - Cửa sổ nhận, cửa sổ tắc nghẽn và lượng dữ liệu đang truyền
  - Slow start và thay đổi tốc độ gửi ở mức nền tảng
  - TCP là luồng byte và không giữ ranh giới thông điệp ứng dụng
  - Đóng kết nối bằng FIN, đóng đột ngột bằng RST và half-close
  - Các trạng thái LISTEN, ESTABLISHED, CLOSE_WAIT và TIME_WAIT
  - TCP keepalive và phân biệt với heartbeat của ứng dụng
  - Ảnh hưởng của mất gói và head-of-line blocking
  - Ranh giới giữa dữ liệu đã được TCP xác nhận với tác vụ nghiệp vụ đã hoàn tất
- level1: UDP và QUIC
  level2:
