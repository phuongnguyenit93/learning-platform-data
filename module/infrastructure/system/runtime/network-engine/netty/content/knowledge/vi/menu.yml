  - Đổi chứng chỉ và vòng đời cấu hình TLS
  - Tác động của TLS tới truyền tệp, bộ đệm và hiệu năng
  - Không bỏ xác minh chứng chỉ ngoài môi trường kiểm thử có kiểm soát
- level1: Kiểm soát tải
  level2:
  - Backpressure là gì và điểm dữ liệu có thể tích tụ
  - ChannelOutboundBuffer và dữ liệu chưa ghi xong
  - WriteBufferWaterMark với ngưỡng cao và ngưỡng thấp
  - isWritable và sự kiện channelWritabilityChanged
  - Tính không writable không tự động ngăn ứng dụng tiếp tục write
  - Dừng và tiếp tục đọc bằng autoRead hoặc read theo yêu cầu
  - Giới hạn hàng đợi nghiệp vụ và công việc đang xử lý
  - Điều tiết bridge hoặc proxy giữa hai Channel
  - Xử lý bên nhận chậm mà không giữ buffer vô hạn
  - Gom write và lựa chọn thời điểm flush
  - Giới hạn tốc độ với thành phần traffic shaping
  - Phân biệt TCP flow control với kiểm soát tải ở ứng dụng
  - Chính sách từ chối, giảm tải và ưu tiên công việc
- level1: Tác vụ nghiệp vụ
  level2:
  - Xác định công việc phù hợp để chạy trên EventLoop
  - Đưa I/O chặn và tính toán dài sang bộ thực thi riêng
  - EventExecutorGroup gắn với handler
  - Executor của ứng dụng và trách nhiệm giới hạn hàng đợi
  - Bảo toàn thứ tự thông điệp khi xử lý song song
  - Trả kết quả về Channel và chọn ngữ cảnh thực thi
  - Quyền sở hữu ByteBuf qua ranh giới luồng
  - Hủy công việc khi timeout hoặc kết nối đã đóng
  - Truyền ngữ cảnh người dùng, log và truy vết
  - Không dùng ThreadLocal như trạng thái cố định của một kết nối
  - Giới hạn hệ thống phụ thuộc bằng semaphore hoặc pool hữu hạn
  - Virtual thread trong tác vụ nghiệp vụ và giới hạn đối với EventLoop
- level1: Kết nối và phục hồi
  level2:
  - IdleStateHandler và các loại trạng thái nhàn rỗi
  - ReadTimeoutHandler, WriteTimeoutHandler và phạm vi thời hạn
  - Heartbeat khác TCP keepalive ở tầng giao thức
  - Phát hiện kết nối nửa mở và mất mạng
  - Tự kết nối lại với backoff, jitter và giới hạn
  - Phân biệt retry kết nối với retry yêu cầu nghiệp vụ
  - Tính lũy đẳng khi gửi lại sau mất kết nối
  - Khôi phục xác thực, đăng ký và trạng thái phiên
  - Xử lý request đang chờ và phản hồi của phiên kết nối cũ
  - Connection storm khi nhiều client cùng phục hồi
  - Giới hạn tuổi kết nối và luân chuyển kết nối
  - Dọn bộ hẹn giờ và callback khi đóng phiên
- level1: Bảo vệ giao thức
  level2:
  - Mô hình đe dọa tại biên nhận dữ liệu mạng
  - Xác thực trước khi cho phép thao tác có đặc quyền
  - Kiểm tra dữ liệu theo trạng thái phiên giao thức
  - Giới hạn độ dài, số phần tử và mức lồng dữ liệu
  - Serialization không an toàn và dữ liệu không đáng tin cậy
  - Decompression bomb và giới hạn dữ liệu sau giải nén
  - Slow client, slow request và thời hạn hoàn tất thông điệp
  - Giới hạn kết nối, request rate và tài nguyên theo client
  - Bảo vệ HTTP parser và tính thống nhất khi qua proxy
  - Che payload, token và thông tin cá nhân trong log
  - Kiểm soát đích kết nối khi xây dựng proxy hoặc client đa đích
  - Theo dõi phụ thuộc và xử lý cảnh báo bảo mật
- level1: Quan sát hệ thống
  level2:
  - Log theo ChannelId và mã tương quan yêu cầu
  - LoggingHandler và giới hạn khi ghi payload
  - Số kết nối đang mở, tốc độ tạo và tỷ lệ thất bại
  - Thông lượng thông điệp, byte vào ra và độ trễ phản hồi
  - Số luồng, tác vụ chờ và độ trễ EventLoop
  - Trạng thái writability và dữ liệu outbound tồn đọng
  - Chỉ số pooled allocator và bộ nhớ trực tiếp
  - Leak detector và kiểm soát chi phí chẩn đoán
  - Theo dõi handshake, DNS, connect và reconnect
  - Truy vết qua callback và ranh giới bộ thực thi
  - Kết hợp chỉ số JVM, tiến trình và TCP của hệ điều hành
  - Cảnh báo theo mức bão hòa và ảnh hưởng người sử dụng
- level1: Hiệu năng
  level2:
  - Đặt mô hình tải trước khi chọn cấu hình
  - Phân biệt benchmark thông lượng với benchmark độ trễ
  - EventLoop count, CPU khả dụng và tranh chấp tài nguyên
  - Pool bộ nhớ, cấp phát đối tượng và áp lực GC
  - Batching, flush và số lần gọi hệ thống
  - TCP_NODELAY, SO_KEEPALIVE và tùy chọn socket theo nhu cầu
  - SO_BACKLOG, bộ đệm socket và giới hạn hệ điều hành
  - Số kết nối, giới hạn file descriptor và ephemeral port
  - Ảnh hưởng của TLS, compression và serialization
  - Lựa chọn transport bằng phép đo trên nền tảng triển khai
  - Độ trễ đuôi, bên nhận chậm và hàng đợi tích tụ
  - Kiểm thử tải tăng dần, đột biến và kéo dài
  - Tránh tối ưu cục bộ làm quá tải hệ thống phía sau
- level1: Kiểm thử
  level2:
  - EmbeddedChannel và kiểm thử Pipeline không cần socket
  - Đưa dữ liệu inbound và kiểm tra thông điệp đã giải mã
  - Ghi outbound và kiểm tra byte được mã hóa
  - Kiểm thử từng byte, khung bị chia và nhiều khung ghép lại
  - Kiểm thử dữ liệu sai, độ dài vượt giới hạn và trạng thái giao thức sai
  - Kiểm thử kết quả Future, lỗi ghi và đóng Channel
  - Kiểm thử scheduled task, idle event và timeout
  - Giải phóng đầu ra và finishAndReleaseAll trong kiểm thử
  - Kiểm thử retain/release trên mọi đường kết thúc
  - Kiểm thử tích hợp qua socket thật và cổng được cấp động
  - Kiểm thử TLS, HTTP/2 và WebSocket theo giao thức mục tiêu
  - Mô phỏng mạng chậm, mất kết nối và bên nhận ngừng đọc
  - Kiểm thử cạnh tranh và bảo toàn thứ tự khi offload
  - Kiểm thử rò rỉ tài nguyên sau nhiều chu kỳ kết nối
  - Đặt tiêu chí đo và giới hạn cho kiểm thử tải
- level1: Vận hành và vòng đời
  level2:
  - Quyền sở hữu EventLoopGroup, resolver và connection pool
  - Tài nguyên dùng chung và tài nguyên theo instance
  - Dừng tiếp nhận kết nối mới trước khi kết thúc server
  - Ngừng nhận công việc và chờ tác vụ đang xử lý
  - Drain dữ liệu outbound với thời hạn hữu hạn
  - Đóng Channel và giải quyết Promise đang chờ
  - shutdownGracefully, quiet period và timeout
  - Dọn executor, bộ hẹn giờ và tài nguyên native
  - Readiness, liveness và thứ tự chuyển lưu lượng
  - Giới hạn CPU, RAM và socket khi chạy trong container
  - Truyền tín hiệu dừng từ dịch vụ hoặc container tới ứng dụng
  - Kiểm chứng không còn luồng, buffer và cổng bị giữ sau shutdown
- level1: Chẩn đoán sự cố
  level2:
  - Khoanh vùng lỗi ở DNS, TCP, TLS, codec hay nghiệp vụ
  - BindException và địa chỉ hoặc cổng không khả dụng
  - Connection refused, connect timeout và network unreachable
  - Channel không nhận dữ liệu do autoRead, Pipeline hoặc decoder
  - Decoder chờ mãi do sai trường độ dài hoặc readerIndex
  - Thông điệp mất, lặp hoặc sai thứ tự do logic ứng dụng
  - Future không hoàn tất hoặc EventLoop bị chặn
  - OutOfDirectMemoryError và áp lực bộ nhớ ngoài heap
  - IllegalReferenceCountException và quyền sở hữu buffer sai
  - Cảnh báo leak và cách lần theo đường giữ tham chiếu
  - CPU cao do tác vụ dài, vòng lặp hoặc tải quá mức
  - Ghi chậm, Channel không writable và dữ liệu chờ tăng
  - SSLException và lỗi handshake hoặc trust
  - Lỗi native library do nền tảng, kiến trúc hoặc phụ thuộc
  - Tiến trình không dừng do tài nguyên chưa giải phóng
  - Thu thập thread dump, JFR và trạng thái socket để xác minh nguyên nhân
- level1: Tích hợp và lựa chọn
  level2:
