  - Thư viện RPC sử dụng Netty và phần ứng dụng không nên tự thay
  - Nhúng TCP server Netty vào một ứng dụng Java
  - Quản lý vòng đời Netty trong Spring Boot
  - Dùng chung hay tách EventLoop giữa các thành phần
  - Quản lý xung đột phiên bản và đồng bộ các mô-đun Netty
  - Shading, classpath và native dependency trong đóng gói
  - Khi chọn Netty trực tiếp hoặc HTTP client/server cấp cao hơn
- level1: Thực hành Netty
  level2:
  - Xây dựng TCP echo server và client tối thiểu
  - Quan sát EventLoop và thứ tự sự kiện của nhiều kết nối
  - Thiết kế giao thức nhị phân có trường độ dài và phiên bản
  - Viết codec với kiểm thử phân mảnh và ghép khung
  - Xây dựng request–response có mã tương quan và timeout
