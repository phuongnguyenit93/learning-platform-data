references:
  - title: "Netty — User Guide for 4.x"
    url: "https://github.com/netty/netty/wiki/User-guide-for-4.x"
    description: "Ví dụ client/server, Bootstrap, ChannelHandler, ChannelPipeline, ByteBuf và giải phóng message."
  - title: "Netty — Threat Model and Architecture"
    url: "https://github.com/netty/netty/wiki/Threat-model"
    description: "Kiến trúc event loop group, event loop, channels, pipeline, handlers, codecs và buffer."
  - title: "Netty — Reference-counted Objects"
    url: "https://netty.io/wiki/reference-counted-objects.html"
    description: "Quy tắc retain/release, ownership trong ChannelPipeline, leak detection và kiểm thử rò rỉ."
  - title: "Netty — New and Noteworthy in 4.0"
    url: "https://netty.io/wiki/new-and-noteworthy-in-4.0.html"
    description: "Vòng đời ByteBuf, reference counting, handler pipeline và phát hiện buffer leak."
  - title: "Netty — Analyzing Memory Allocator Behavior"
    url: "https://github.com/netty/netty/wiki/Analyzing-Memory-Allocator-Behavior"
    description: "So sánh pooled, unpooled và adaptive allocator; lựa chọn và quan sát memory allocation."
  - title: "Netty — API Documentation"
    url: "https://netty.io/4.1/api/index.html"
    description: "Javadoc các thành phần Bootstrap, EventLoopGroup, ChannelPipeline, ChannelHandler và ByteBuf."
  - title: "Netty — EmbeddedChannel API"
    url: "https://netty.io/4.1/api/io/netty/channel/embedded/EmbeddedChannel.html"
    description: "Kiểm thử ChannelHandler và pipeline nhúng mà không cần mở socket thật."