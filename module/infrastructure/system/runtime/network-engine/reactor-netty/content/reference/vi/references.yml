references:
  - title: "Reactor Netty - Reference Guide"
    url: "https://projectreactor.io/docs/netty/release/reference/index.html"
    description: "Tài liệu chính thức tổng hợp HTTP/TCP, event loop, transport, resources, timeout, metrics và tracing."
  - title: "Reactor Netty - HTTP Client"
    url: "https://projectreactor.io/docs/netty/release/reference/http-client.html"
    description: "HttpClient, event-loop group, connection pool, timeout, TLS, metrics và tracing."
  - title: "Reactor Netty - HTTP Server"
    url: "https://projectreactor.io/docs/netty/release/reference/http-server.html"
    description: "HttpServer, xử lý request reactive, SSL/TLS và metrics cho HTTP server."
  - title: "Reactor Netty - TCP Client"
    url: "https://projectreactor.io/docs/netty/release/reference/tcp-client.html"
    description: "TcpClient, event loop, connection lifecycle, pool, TLS và TCP metrics."
  - title: "Reactor Netty - TCP Server"
    url: "https://projectreactor.io/docs/netty/release/reference/tcp-server.html"
    description: "TcpServer, LoopResources, TLS, resource disposal và metrics."
  - title: "Spring Boot - Reactive Web Applications"
    url: "https://docs.spring.io/spring-boot/reference/web/reactive.html"
    description: "Reactive web server support, Reactor Netty mặc định và cấu hình server."
  - title: "Spring Framework - WebClient"
    url: "https://docs.spring.io/spring-framework/reference/web/webflux-webclient.html"
    description: "WebClient reactive API và tích hợp connector của HTTP client."
  - title: "Reactor Core - Error Handling"
    url: "https://projectreactor.io/docs/core/release/reference/coreFeatures/error-handling.html"
    description: "Xử lý lỗi trong reactive sequence và phân biệt recovery với retry."
  - title: "Micrometer - Observation"
    url: "https://docs.micrometer.io/micrometer/reference/observation.html"
    description: "Mô hình observation, metrics và tracing phục vụ khả năng quan sát."