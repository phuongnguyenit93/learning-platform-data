references:
  - title: "PostgreSQL — Transactions"
    url: "https://www.postgresql.org/docs/current/tutorial-transactions.html"
    description: "Vòng đời transaction, BEGIN, COMMIT, ROLLBACK và SAVEPOINT."
  - title: "PostgreSQL — Transaction Isolation"
    url: "https://www.postgresql.org/docs/current/transaction-iso.html"
    description: "Các hiện tượng bất thường, isolation levels và serialization failures."
  - title: "PostgreSQL — Multiversion Concurrency Control"
    url: "https://www.postgresql.org/docs/current/mvcc-intro.html"
    description: "MVCC, snapshot và tác động đến thao tác đọc/ghi đồng thời."
  - title: "PostgreSQL — Explicit Locking"
    url: "https://www.postgresql.org/docs/current/explicit-locking.html"
    description: "Khóa bảng, khóa hàng, deadlock và cách giảm xung đột khóa."
  - title: "PostgreSQL — pg_locks"
    url: "https://www.postgresql.org/docs/current/view-pg-locks.html"
    description: "Quan sát các khóa đang giữ hoặc đang chờ trong PostgreSQL."
  - title: "MySQL 8.4 — Transaction Isolation Levels"
    url: "https://dev.mysql.com/doc/refman/8.4/en/innodb-transaction-isolation-levels.html"
    description: "Cách InnoDB triển khai các mức cô lập, giúp đối chiếu hành vi giữa DBMS."