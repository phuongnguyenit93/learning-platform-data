  - title: "PostgreSQL Documentation - Transactions"
    url: "https://www.postgresql.org/docs/current/tutorial-transactions.html"
    description: "Nguyên tắc giao dịch và BEGIN, COMMIT, ROLLBACK."
  - title: "PostgreSQL Documentation - Using EXPLAIN"
    url: "https://www.postgresql.org/docs/current/using-explain.html"
    description: "Kiểm tra kế hoạch thực thi và phân tích hiệu năng truy vấn."
  - title: "SQLite - SQL Language"
    url: "https://www.sqlite.org/lang.html"
    description: "Danh mục cú pháp SQL của SQLite và khác biệt giữa các hệ quản trị."