  - title: "PostgreSQL Documentation - Data Manipulation"
    url: "https://www.postgresql.org/docs/current/dml.html"
    description: "Cách INSERT, UPDATE, DELETE và đọc dữ liệu thay đổi."
  - title: "PostgreSQL Documentation - Data Definition"
    url: "https://www.postgresql.org/docs/current/ddl.html"
