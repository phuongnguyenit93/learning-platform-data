references:
  - title: "PostgreSQL — High Availability, Load Balancing, and Replication"
    url: "https://www.postgresql.org/docs/current/high-availability.html"
    description: "Phân loại synchronous/asynchronous replication, standby và đánh đổi hiệu năng, tính sẵn sàng."
  - title: "PostgreSQL — Log-Shipping Standby Servers"
    url: "https://www.postgresql.org/docs/current/warm-standby.html"
    description: "WAL streaming, primary/standby, synchronous replication, promotion và replication slots."
  - title: "PostgreSQL — Logical Replication"
    url: "https://www.postgresql.org/docs/current/logical-replication.html"
    description: "Mô hình publication/subscription và truyền các thay đổi dữ liệu logic."
  - title: "PostgreSQL — The Cumulative Statistics System"
    url: "https://www.postgresql.org/docs/current/monitoring-stats.html"
    description: "Các view pg_stat_replication và pg_stat_replication_slots để giám sát replication."
  - title: "MongoDB — Replication and Replica Set Fundamentals"
    url: "https://www.mongodb.com/docs/manual/replication/"
    description: "Replica set, primary/secondary, election, oplog và read preference."
  - title: "MongoDB — Replica Set Read and Write Semantics"
    url: "https://www.mongodb.com/docs/manual/applications/replication/"
    description: "Read preference, write concern và hành vi đọc/ghi khi có replica."
  - title: "MongoDB — Write Concern for Replica Sets"
    url: "https://www.mongodb.com/docs/manual/core/replica-set-write-concern/"
    description: "Ý nghĩa của w:1, w:majority và xác nhận ghi khi có nhiều nút."
  - title: "MongoDB — Sharding Introduction and Architecture"
    url: "https://www.mongodb.com/docs/manual/sharding/"
    description: "Shard key, mongos routing, phân phối tải và sự khác biệt giữa sharding với replication."