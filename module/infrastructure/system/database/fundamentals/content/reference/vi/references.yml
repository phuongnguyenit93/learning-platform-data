references:
  - title: "PostgreSQL Tutorial"
    url: "https://www.postgresql.org/docs/current/tutorial.html"
    description: "Giới thiệu database quan hệ, tạo bảng, CRUD, JOIN, khóa ngoại và transaction bằng SQL."
  - title: "PostgreSQL Constraints"
    url: "https://www.postgresql.org/docs/current/ddl-constraints.html"
    description: "NOT NULL, UNIQUE, PRIMARY KEY, FOREIGN KEY và ràng buộc toàn vẹn."
  - title: "PostgreSQL Transactions"
    url: "https://www.postgresql.org/docs/current/tutorial-transactions.html"
    description: "Khái niệm transaction và thực hành BEGIN, COMMIT, ROLLBACK."
  - title: "PostgreSQL Indexes"
    url: "https://www.postgresql.org/docs/current/indexes.html"
    description: "Các loại index và đánh đổi giữa tìm kiếm nhanh với chi phí hệ thống."
  - title: "PostgreSQL Using EXPLAIN"
    url: "https://www.postgresql.org/docs/current/using-explain.html"
    description: "Giải thích kế hoạch truy vấn, các bước scan và cách đọc EXPLAIN."
  - title: "MongoDB Documents"
    url: "https://www.mongodb.com/docs/manual/core/document/"
    description: "Mô hình document, BSON và dữ liệu lồng nhau để so sánh với bảng quan hệ."
  - title: "Microsoft - Understand Data Models"
    url: "https://learn.microsoft.com/azure/architecture/data-guide/technology-choices/understand-data-store-models"
    description: "So sánh dữ liệu quan hệ và các kiểu lưu trữ NoSQL theo nhu cầu ứng dụng."
  - title: "Oracle Java Tutorial - JDBC Basics"
    url: "https://docs.oracle.com/javase/tutorial/jdbc/basics/"
    description: "JDBC Connection, PreparedStatement, transaction và truy xuất dữ liệu Java; tài liệu JDK 8."
  - title: "PostgreSQL Backup and Restore"
    url: "https://www.postgresql.org/docs/current/backup.html"
    description: "Các cách sao lưu/phục hồi bằng SQL dump, bản sao hệ thống tệp và PITR."