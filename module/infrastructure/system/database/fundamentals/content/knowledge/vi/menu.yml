  - 'Mô hình phân cấp, mô hình mạng và mô hình hướng đối tượng: tổng quan'
  - 'Mô hình quan hệ: bảng, liên kết và ràng buộc'
  - 'Mô hình khóa–giá trị: cách truy cập theo khóa và giới hạn biểu diễn'
  - 'Mô hình tài liệu: cấu trúc lồng nhau, nhúng và tham chiếu'
  - 'Mô hình họ cột rộng: tổ chức dữ liệu theo nhu cầu truy cập'
  - 'Mô hình đồ thị: đỉnh, cạnh và quan hệ nhiều bước'
