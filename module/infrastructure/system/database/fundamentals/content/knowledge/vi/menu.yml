  - 'SQL và NoSQL: phân loại mô hình, khả năng truy vấn và các ngộ nhận'
  - Dữ liệu có cấu trúc, bán cấu trúc và phi cấu trúc
- level1: Kiến trúc cơ sở dữ liệu
  level2:
  - 'Ba mức mô tả: góc nhìn người dùng, lược đồ khái niệm và lưu trữ bên trong'
  - Mô hình khái niệm, mô hình logic và mô hình vật lý trong quá trình thiết kế
  - 'Hệ nhúng và hệ máy khách–máy chủ: vị trí chạy và cách truy cập'
  - 'Cơ sở dữ liệu tập trung và cơ sở dữ liệu phân tán: phạm vi trách nhiệm'
  - 'OLTP và OLAP: khác biệt giữa xử lý giao dịch và phân tích'
  - 'Cơ sở dữ liệu tác nghiệp, kho dữ liệu và hồ dữ liệu: vai trò tổng quan'
  - 'Lưu trữ trong bộ nhớ và lưu trữ bền vững: đánh đổi cơ bản'
  - 'Một nút và nhiều nút: giới thiệu sao chép, phân mảnh và các đánh đổi'
  - Phân biệt cơ sở dữ liệu với bộ nhớ đệm và công cụ tìm kiếm chuyên dụng
- level1: Mô hình quan hệ
  level2:
  - 'Quan hệ, bộ và thuộc tính: nền tảng lý thuyết của bảng, hàng và cột'
  - Miền giá trị và lược đồ quan hệ
  - Lược đồ cơ sở dữ liệu và trạng thái dữ liệu tại một thời điểm
  - Bậc của quan hệ và số lượng bộ trong quan hệ
  - Tính nguyên tử của giá trị theo miền đã chọn
  - Tập hợp trong lý thuyết quan hệ và dữ liệu trùng trong kết quả SQL
  - Vì sao thứ tự hàng không được bảo đảm khi chưa yêu cầu sắp xếp
  - Quan hệ giữa các bảng và cách biểu diễn sự kiện nghiệp vụ
  - Phân biệt bảng cơ sở, bảng dẫn xuất và kết quả truy vấn
- level1: Kiểu dữ liệu
  level2:
  - Chọn kiểu dữ liệu từ ý nghĩa nghiệp vụ, miền giá trị và cách sử dụng
  - 'Số nguyên: phạm vi biểu diễn và nguy cơ tràn'
  - Số thập phân chính xác và số dấu phẩy động
  - Tiền tệ, đơn vị đo và quy tắc lưu giá trị số
  - Chuỗi độ dài cố định và biến đổi
  - Unicode, bộ mã ký tự và quy tắc đối chiếu chuỗi (collation)
  - Ngày, giờ, thời điểm và múi giờ
  - Giá trị Boolean và tập giá trị phân loại
  - Dữ liệu nhị phân và lựa chọn lưu tệp ngoài cơ sở dữ liệu
  - JSON và dữ liệu bán cấu trúc trong hệ quản trị quan hệ
  - Chuyển đổi kiểu tường minh, chuyển đổi ngầm và mất thông tin
  - 'Giá trị mặc định và cột được tính toán: vai trò và giới hạn'
- level1: NULL và phép so sánh
  level2:
  - NULL biểu diễn điều gì và khi nào nên cho phép thiếu giá trị
  - Phân biệt NULL, chuỗi rỗng, số không và giá trị chưa được gán
  - 'Logic ba giá trị: TRUE, FALSE và UNKNOWN'
  - Vì sao so sánh bằng NULL khác với kiểm tra IS NULL
  - NULL trong biểu thức số học và phép nối chuỗi
  - NULL trong điều kiện lọc, phép phủ định và NOT IN
  - NULL trong hàm tổng hợp và cách đếm hàng
  - NULL trong khóa, ràng buộc duy nhất và khác biệt giữa các hệ quản trị
  - Thiết kế dữ liệu để phân biệt chưa biết, không áp dụng và chưa được cung cấp
- level1: Khóa và định danh
  level2:
  - Siêu khóa, khóa ứng viên, khóa chính và khóa thay thế
  - 'Khóa đơn và khóa ghép: cách nhận diện duy nhất một hàng'
  - 'Khóa tự nhiên và khóa thay thế: tiêu chí lựa chọn'
  - Khóa ngoại và mối liên hệ giữa định danh với tham chiếu
  - Khóa nghiệp vụ và định danh kỹ thuật của cùng một thực thể
  - 'Số tự tăng, bộ sinh dãy số và định danh UUID: tổng quan'
  - Tính ổn định, kích thước và khả năng thay đổi của khóa
  - 'Phạm vi duy nhất: toàn hệ thống, từng tổ chức hay từng quan hệ'
  - Vì sao số thứ tự hiển thị không đồng nghĩa với định danh
- level1: Ràng buộc toàn vẹn
  level2:
  - Toàn vẹn miền giá trị, toàn vẹn thực thể và toàn vẹn tham chiếu
  - NOT NULL và ý nghĩa bắt buộc cung cấp dữ liệu
  - 'PRIMARY KEY và UNIQUE: bảo đảm duy nhất theo mục đích'
  - FOREIGN KEY và điều kiện tồn tại của bản ghi được tham chiếu
  - CHECK và giới hạn của điều kiện kiểm tra trên dữ liệu
  - DEFAULT khác với ràng buộc kiểm tra như thế nào
  - 'Hành vi khi cập nhật hoặc xóa: hạn chế, lan truyền và đặt NULL'
  - Ràng buộc đơn cột, nhiều cột và quy tắc nghiệp vụ
  - 'Kiểm tra ở ứng dụng và bảo đảm ở cơ sở dữ liệu: phân chia trách nhiệm'
  - Thời điểm kiểm tra ràng buộc và giới hạn phụ thuộc hệ quản trị
- level1: Mô hình thực thể
  level2:
  - Thu thập yêu cầu từ câu chuyện nghiệp vụ và tình huống sử dụng
  - Xác định thực thể, thuộc tính và định danh
  - Phân biệt thực thể, giá trị mô tả và sự kiện nghiệp vụ
  - Thuộc tính đơn, thuộc tính phức hợp, đa trị và dẫn xuất
  - Mối quan hệ một–một, một–nhiều và nhiều–nhiều
  - Tính bắt buộc và tùy chọn ở mỗi phía của mối quan hệ
  - Thực thể yếu và sự phụ thuộc vào thực thể chủ
  - Quan hệ tự tham chiếu, phân cấp và quan hệ có thuộc tính
  - Quan hệ ba ngôi và nguy cơ làm mất nghĩa khi tách thành quan hệ hai ngôi
  - Kế thừa và chuyên biệt hóa trong mô hình khái niệm
  - Đọc sơ đồ ER và ký pháp chân quạ
  - Kiểm chứng sơ đồ bằng dữ liệu mẫu và các trường hợp biên
- level1: Thiết kế quan hệ
  level2:
  - Chuyển thực thể và thuộc tính thành bảng và cột
  - Ánh xạ quan hệ một–nhiều bằng khóa ngoại
  - Ánh xạ quan hệ một–một và bảo đảm tính duy nhất
  - Ánh xạ quan hệ nhiều–nhiều bằng bảng liên kết
  - Thiết kế bảng liên kết có thuộc tính và vòng đời riêng
  - Tách thuộc tính đa trị và nhóm lặp thành bảng phụ
  - Ánh xạ thực thể yếu và quan hệ tự tham chiếu
  - Các lựa chọn ánh xạ kiểu cha–con vào bảng
  - Đặt tên bảng, cột, khóa và ràng buộc nhất quán
  - Thiết kế dữ liệu tham chiếu, trạng thái và đơn vị đo
  - Ghi nhận quy tắc nghiệp vụ trong từ điển dữ liệu
  - Đối chiếu thiết kế logic với các thao tác đọc và ghi dự kiến
- level1: Chuẩn hóa dữ liệu
  level2:
  - Dư thừa dữ liệu và bất thường khi thêm, sửa hoặc xóa
  - Phụ thuộc hàm và cách xác định từ quy tắc nghiệp vụ
  - Phụ thuộc hàm đầy đủ, bộ phận và bắc cầu
  - Bao đóng thuộc tính và cách tìm khóa ứng viên trong ví dụ nhỏ
  - Dạng chuẩn thứ nhất (1NF) và việc loại bỏ nhóm lặp
  - Dạng chuẩn thứ hai (2NF) và phụ thuộc vào một phần khóa
  - Dạng chuẩn thứ ba (3NF) và phụ thuộc bắc cầu
  - Dạng chuẩn Boyce–Codd (BCNF) và quan hệ với khóa ứng viên
  - Phân rã không mất mát và bảo toàn phụ thuộc
  - Phụ thuộc đa trị và giới thiệu dạng chuẩn thứ tư (4NF)
  - Phụ thuộc nối và giới thiệu dạng chuẩn thứ năm (5NF)
  - Thực hành chuẩn hóa bảng đơn hàng từng bước và kiểm tra dữ liệu sau phân rã
- level1: Phi chuẩn hóa
  level2:
  - Phi chuẩn hóa là gì và khi nào nên cân nhắc
  - Phân biệt phi chuẩn hóa có chủ đích với thiết kế sai
  - Lặp có kiểm soát dữ liệu mô tả để giảm công việc khi đọc
  - Dữ liệu tổng hợp, bộ đếm và giá trị được tính sẵn
  - Bản chụp giá, địa chỉ và thông tin tại thời điểm phát sinh nghiệp vụ
  - Xác định nguồn dữ liệu chuẩn khi có nhiều bản biểu diễn
  - Nguy cơ sai lệch, cách đồng bộ và chi phí cập nhật
  - Đánh giá thiết kế bằng yêu cầu nhất quán và số liệu đo thực tế
- level1: Đại số quan hệ
  level2:
  - Đại số quan hệ và vai trò nền tảng cho việc truy vấn
  - Phép chọn hàng và phép chiếu thuộc tính
  - Phép đổi tên và ý nghĩa khi dùng nhiều lần cùng một quan hệ
  - Hợp, giao, hiệu và điều kiện tương thích lược đồ
  - Tích Descartes và nguy cơ tăng số lượng tổ hợp
  - Phép nối theo điều kiện và nối bằng
  - 'Nối tự nhiên: ý nghĩa lý thuyết và sự phụ thuộc tên thuộc tính'
  - Nối ngoài, bán nối và phản nối ở mức khái niệm
  - Phép chia và bài toán tìm đối tượng thỏa mọi điều kiện
  - Từ yêu cầu bằng lời đến chuỗi phép toán trên các quan hệ
- level1: Nền tảng SQL
  level2:
  - SQL là ngôn ngữ khai báo và cách diễn đạt kết quả mong muốn
  - Các nhóm lệnh định nghĩa, truy vấn, thao tác, phân quyền và giao dịch
  - 'CREATE, ALTER và DROP: hình thành và thay đổi cấu trúc'
  - 'INSERT, UPDATE và DELETE: thay đổi dữ liệu có điều kiện'
  - 'SELECT, FROM và WHERE: lựa chọn dữ liệu cần đọc'
  - Biểu thức, bí danh và chuyển đổi kiểu trong câu truy vấn
  - JOIN và ảnh hưởng của số lượng bản ghi khớp đến kết quả
  - GROUP BY, hàm tổng hợp và HAVING
  - ORDER BY, giới hạn kết quả và yêu cầu thứ tự ổn định
  - 'Truy vấn con, EXISTS và biểu thức bảng chung (CTE): nhập môn'
  - Các phép kết hợp kết quả và cách xử lý bản ghi trùng
  - Thứ tự xử lý logic và thứ tự viết các mệnh đề
  - Tham số hóa truy vấn và phân biệt giá trị dữ liệu với cú pháp SQL
  - Chuẩn SQL, phương ngữ và giới hạn tính di động
- level1: Đối tượng lược đồ
  level2:
  - 'Database, catalog và schema: cách tổ chức tên và khác biệt hệ quản trị'
  - Bảng thường, bảng tạm và phạm vi tồn tại của dữ liệu
  - 'View: đóng gói truy vấn và giới hạn cập nhật'
  - Materialized view và yêu cầu làm mới dữ liệu
  - Sequence và cơ chế cấp giá trị định danh
  - 'Hàm và thủ tục lưu trữ: mục đích sử dụng cơ bản'
  - 'Trigger: thời điểm thực thi, lợi ích và rủi ro logic ẩn'
  - Danh mục hệ thống và cách tra cứu cấu trúc cơ sở dữ liệu
  - Vòng đời và sự phụ thuộc giữa các đối tượng lược đồ
- level1: Giao dịch
  level2:
  - Vì sao một thao tác nghiệp vụ có thể cần nhiều câu lệnh dữ liệu
  - Ranh giới giao dịch, bắt đầu, xác nhận và hoàn tác
  - Tính nguyên tử (Atomicity) qua ví dụ chuyển tiền
  - Tính nhất quán (Consistency) và các bất biến nghiệp vụ
  - Tính cô lập (Isolation) và khả năng nhiều giao dịch cùng hoạt động
  - Tính bền vững (Durability) khi đã xác nhận giao dịch
  - Chế độ tự xác nhận (autocommit) và giao dịch tường minh
  - Điểm lưu (savepoint) và hoàn tác một phần
  - Lỗi giữa giao dịch và trạng thái ứng dụng cần xử lý
  - Giao dịch cơ sở dữ liệu và giới hạn với thao tác ở hệ thống bên ngoài
- level1: Truy cập đồng thời
  level2:
  - Các tình huống xen kẽ khi nhiều người đọc và ghi cùng dữ liệu
  - Cập nhật bị mất và thao tác kiểm tra rồi mới ghi
  - Đọc dữ liệu chưa xác nhận, đọc không lặp lại và bản ghi ảo
  - Các mức cô lập và sự khác nhau giữa cam kết chuẩn với cách triển khai
  - 'Khóa chia sẻ, khóa độc quyền và phạm vi khóa: khái niệm cơ bản'
  - 'Đa phiên bản (MVCC) và ảnh chụp dữ liệu: mô hình trực quan'
  - Chờ khóa, hết thời gian chờ và bế tắc (deadlock)
  - Khóa bi quan và kiểm tra phiên bản lạc quan ở mức ứng dụng
  - Thử lại giao dịch và ý nghĩa của thao tác có tính lặp an toàn
  - Bài thực nghiệm hai phiên làm việc để quan sát dữ liệu đồng thời
- level1: Lưu trữ dữ liệu
  level2:
  - Từ bảng logic đến tệp, trang dữ liệu và bản ghi vật lý
  - 'Lưu trữ theo hàng và theo cột: nhu cầu truy cập khác nhau'
  - Vùng đệm và mối quan hệ giữa bộ nhớ với thiết bị lưu trữ
  - Đọc tuần tự, đọc ngẫu nhiên và chi phí vào/ra
  - Tổ chức bảng kiểu heap và dữ liệu được tổ chức theo khóa
  - Nhật ký ghi trước (WAL), xác nhận giao dịch và khả năng phục hồi
  - Checkpoint và phục hồi sau sự cố ở mức tổng quan
  - Xóa logic bên trong hệ quản trị, phiên bản cũ và thu hồi dung lượng
  - Giới hạn giữa mô hình lưu trữ chung với chi tiết từng hệ quản trị
- level1: Chỉ mục
  level2:
  - Chỉ mục giải quyết vấn đề tìm dữ liệu như thế nào
  - 'Quét bảng và tìm qua chỉ mục: mô hình chi phí cơ bản'
  - 'Cây B và B+ tree: ý tưởng tổ chức tìm kiếm có thứ tự'
  - Chỉ mục băm và kiểu tra cứu phù hợp
  - Chỉ mục đơn cột và nhiều cột
  - Thứ tự cột, tiền tố và điều kiện lọc trong chỉ mục ghép
  - Chỉ mục duy nhất và mối liên hệ với ràng buộc duy nhất
  - 'Chỉ mục có tổ chức dữ liệu và chỉ mục phụ: khác biệt theo hệ quản trị'
  - Độ chọn lọc, thống kê và vì sao có chỉ mục vẫn có thể quét bảng
  - Chi phí thêm, sửa, xóa và dung lượng khi duy trì chỉ mục
  - Đọc kế hoạch thực thi ở mức nhập môn trước khi tối ưu
- level1: Bảo mật dữ liệu
  level2:
  - Xác thực danh tính và phân quyền truy cập
  - Tài khoản, vai trò và nguyên tắc cấp quyền tối thiểu
  - Quyền trên cơ sở dữ liệu, lược đồ, bảng và thao tác
  - Chủ sở hữu đối tượng và tài khoản ứng dụng
  - SQL injection và vai trò của truy vấn có tham số
  - Bảo vệ mật khẩu, chuỗi kết nối và thông tin bí mật
  - Mã hóa khi truyền, mã hóa khi lưu và giới hạn bảo vệ
  - Dữ liệu nhạy cảm, che dữ liệu và môi trường kiểm thử
  - Ghi nhận truy cập, nhật ký kiểm toán và trách nhiệm sử dụng dữ liệu
  - Phân biệt xóa dữ liệu với đáp ứng chính sách lưu giữ và quyền riêng tư
- level1: Kết nối ứng dụng
  level2:
  - Driver, giao thức và chuỗi kết nối cơ sở dữ liệu
  - Kết nối, phiên làm việc và tài nguyên phía máy chủ
  - Quy trình gửi truy vấn, nhận tập kết quả và giải phóng tài nguyên
  - 'Connection pool: tái sử dụng kết nối và giới hạn số lượng'
  - Trạng thái phiên, cấu hình giao dịch và rủi ro khi tái sử dụng kết nối
  - Ánh xạ kiểu dữ liệu, NULL, ngày giờ và độ chính xác giữa ứng dụng với cơ sở dữ liệu
  - JDBC, công cụ ánh xạ đối tượng và trách nhiệm của cơ sở dữ liệu
  - 'Thời gian chờ kết nối, truy vấn và chờ khóa: phân biệt mục đích'
  - 'Lỗi kết nối, lỗi ràng buộc và lỗi giao dịch: phân loại để xử lý'
  - Giới hạn phân trang, kích thước kết quả và lượng dữ liệu truyền
  - Quản lý ranh giới giao dịch và tránh giữ kết nối trong thao tác kéo dài
- level1: Vòng đời dữ liệu
  level2:
  - Dữ liệu hiện tại, dữ liệu lịch sử và dữ liệu dẫn xuất
  - Thời điểm tạo, cập nhật và hiệu lực nghiệp vụ của dữ liệu
  - Xóa vật lý, đánh dấu xóa và những ảnh hưởng đến truy vấn
  - Lưu lịch sử thay đổi và yêu cầu truy vết
  - Chính sách lưu giữ, lưu trữ dài hạn và dọn dữ liệu
  - 'Nhập và xuất dữ liệu: định dạng, bộ mã và chuyển đổi kiểu'
  - 'Chất lượng dữ liệu: tính hợp lệ, đầy đủ, nhất quán và trùng lặp'
  - Đối soát và làm sạch dữ liệu mà không làm mất ý nghĩa nghiệp vụ
  - Thay đổi lược đồ, thay đổi dữ liệu và tương thích với ứng dụng
  - Phân biệt migration, bản sao lưu và dữ liệu khởi tạo
- level1: Vận hành cơ bản
  level2:
  - Môi trường học tập riêng và nguyên tắc không thử nghiệm trên dữ liệu thật
  - Công cụ dòng lệnh, giao diện quản trị và cách kiểm tra kết nối
  - Tạo cơ sở dữ liệu thử nghiệm, tài khoản và bộ dữ liệu mẫu
  - 'Sao lưu logic và sao lưu vật lý: phạm vi và mục đích'
  - Khôi phục dữ liệu và vì sao phải kiểm chứng khả năng khôi phục
  - 'Mục tiêu mất dữ liệu và thời gian phục hồi: RPO và RTO'
  - Phân biệt sao lưu, sao chép dữ liệu và tính sẵn sàng cao
  - Theo dõi kết nối, dung lượng, lỗi và truy vấn kéo dài
  - 'Bảo trì dữ liệu, chỉ mục và thống kê: vai trò tổng quan'
  - 'Xử lý sự cố cơ bản: thiếu quyền, sai cấu hình, hết dung lượng và chờ khóa'
- level1: Lựa chọn giải pháp
  level2:
  - Xác định yêu cầu từ hình dạng dữ liệu và quan hệ nghiệp vụ
  - Xác định cách đọc, cách ghi, quy mô dữ liệu và số người truy cập
  - Yêu cầu giao dịch, tính nhất quán và khả năng chấp nhận độ trễ
  - Lựa chọn mô hình quan hệ, tài liệu, khóa–giá trị hay đồ thị
  - Tính sẵn sàng, mở rộng, phục hồi và phạm vi phân tán
  - Chi phí triển khai, vận hành và kỹ năng của đội ngũ
  - 'Dịch vụ được quản lý và tự vận hành: phân chia trách nhiệm'
  - Tính di động dữ liệu, phụ thuộc nhà cung cấp và phương án chuyển đổi
  - Thử nghiệm bằng dữ liệu cùng tình huống sử dụng thực tế trước khi quyết định
- level1: Lỗi thiết kế thường gặp
  level2:
  - Gộp nhiều giá trị hoặc danh sách định danh vào một cột
  - Thiết kế một bảng quá rộng hoặc tách bảng thiếu căn cứ
  - Lặp dữ liệu nghiệp vụ mà không có nguồn chuẩn
  - Dùng tên hoặc số thứ tự hiển thị làm định danh thiếu ổn định
  - Bỏ ràng buộc cơ sở dữ liệu và chỉ dựa vào kiểm tra ứng dụng
  - Lưu số, ngày giờ hoặc giá trị phân loại bằng kiểu không phù hợp
  - Dùng NULL và giá trị giả khiến mất nghĩa dữ liệu
  - Nhầm bản chụp lịch sử với dữ liệu dư thừa cần xóa bỏ
  - Thêm chỉ mục cho mọi cột hoặc tối ưu khi chưa có số liệu
  - Giả định mọi hệ quản trị có cùng hành vi, cú pháp và cách đặt tên
- level1: Thực hành tổng hợp
  level2:
  - Phân tích yêu cầu và bất biến của hệ thống quản lý đơn hàng
  - Vẽ mô hình ER, xác định quan hệ và tính bắt buộc
  - Chuyển mô hình ER thành lược đồ bảng, khóa và ràng buộc
  - Chọn kiểu dữ liệu cho định danh, tiền tệ, số lượng và thời điểm
  - Chuẩn hóa thiết kế và giải thích các bản chụp lịch sử cần giữ
  - Tạo cấu trúc, nạp dữ liệu mẫu và thử các trường hợp vi phạm
  - Viết truy vấn đọc, nối bảng, tổng hợp và kiểm tra kết quả
  - Thực hiện giao dịch tạo đơn, ghi chi tiết và điều chỉnh tồn kho
  - Mô phỏng lỗi giữa chừng và hai phiên cùng cập nhật dữ liệu
  - Quan sát kế hoạch thực thi và đề xuất chỉ mục có căn cứ
  - Phân quyền tài khoản ứng dụng và kiểm tra truy cập bị từ chối
  - Sao lưu, khôi phục và đối soát bộ dữ liệu thử nghiệm
  - Hoàn thiện từ điển dữ liệu và giải trình các quyết định thiết kế
  - Tự đánh giá kiến thức nền và xác định hướng học chuyên sâu tiếp theo
