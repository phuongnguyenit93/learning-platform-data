references:
  - title: "PostgreSQL – SQL Tutorial"
    url: "https://www.postgresql.org/docs/current/tutorial-sql.html"
    description: "Tạo bảng, CRUD, JOIN, aggregate và các thao tác SQL cơ bản."
  - title: "PostgreSQL – Data Definition"
    url: "https://www.postgresql.org/docs/current/ddl.html"
    description: "Schema, kiểu bảng, khóa, ràng buộc và sửa cấu trúc dữ liệu."
  - title: "PostgreSQL – Indexes"
    url: "https://www.postgresql.org/docs/current/indexes.html"
    description: "Loại chỉ mục B-tree, GIN, partial và multicolumn; đánh đổi hiệu năng."
  - title: "PostgreSQL – Using EXPLAIN"
    url: "https://www.postgresql.org/docs/current/using-explain.html"
    description: "Đọc kế hoạch truy vấn và so sánh ước lượng với EXPLAIN ANALYZE."
  - title: "PostgreSQL – Concurrency Control"
    url: "https://www.postgresql.org/docs/current/mvcc.html"
    description: "MVCC, isolation, locking, deadlock và kiểm soát đồng thời."
  - title: "PostgreSQL – Transaction Isolation"
    url: "https://www.postgresql.org/docs/current/transaction-iso.html"
    description: "Read Committed, Repeatable Read, Serializable và các hiện tượng cạnh tranh."
  - title: "PostgreSQL – Database Roles"
    url: "https://www.postgresql.org/docs/current/user-manag.html"
    description: "Tạo role, quản lý membership và nguyên tắc cấp quyền."
  - title: "PostgreSQL – Routine Vacuuming"
    url: "https://www.postgresql.org/docs/current/routine-vacuuming.html"
    description: "Autovacuum, VACUUM, statistics và phòng tránh transaction ID wraparound."
  - title: "PostgreSQL – Monitoring Database Activity"
    url: "https://www.postgresql.org/docs/current/monitoring.html"
    description: "pg_stat_activity, lock, thống kê I/O và giám sát hoạt động server."
  - title: "PostgreSQL – Backup and Restore"
    url: "https://www.postgresql.org/docs/current/backup.html"
    description: "pg_dump, phục hồi, base backup, WAL archiving và point-in-time recovery."