  - Vòng đời truy vấn qua phân tích, viết lại, lập kế hoạch và thực thi
  - Shared buffers, bộ nhớ riêng của phiên và bộ nhớ hệ điều hành
  - Database cluster, PGDATA, tablespace và các tệp quan hệ
  - Cấu trúc trang dữ liệu, hàng và tham chiếu vị trí vật lý
  - System catalog, OID và quan hệ giữa các đối tượng
  - WAL, checkpoint và khôi phục sau sự cố trong bức tranh tổng thể
  - MVCC, phiên bản hàng và snapshot trong bức tranh tổng thể
  - Tiến trình nền mở rộng (background worker), autovacuum và tiến trình phục vụ sao chép
  - Phân biệt dữ liệu bền vững, trạng thái phiên và dữ liệu tạm
- level1: Cấu hình
  level2:
  - Vai trò của postgresql.conf, pg_hba.conf và pg_ident.conf
