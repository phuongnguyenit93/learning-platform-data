  - Tablespace và tổ chức vị trí lưu trữ
  - COMMENT và tài liệu hóa đối tượng ngay trong cơ sở dữ liệu
  - Tra cứu cấu trúc bằng information_schema và pg_catalog
- level1: Thiết kế lược đồ
  level2:
  - Chuyển yêu cầu nghiệp vụ thành thực thể và quan hệ
  - Lựa chọn khóa tự nhiên, khóa thay thế và UUID
  - Quan hệ một một, một nhiều và nhiều nhiều
  - Chuẩn hóa dữ liệu và nhận diện phụ thuộc hàm
  - Phi chuẩn hóa có chủ đích và đánh đổi tính nhất quán
  - Thiết kế dữ liệu thời gian, lịch sử và nhật ký thay đổi
  - Mô hình đa khách hàng theo database, schema hoặc cột định danh
  - Quy ước tên và thiết kế lược đồ dễ bảo trì
  - Xóa mềm, vòng đời dữ liệu và chính sách lưu giữ
  - Đánh giá lược đồ theo truy vấn, ràng buộc và tốc độ tăng dữ liệu
