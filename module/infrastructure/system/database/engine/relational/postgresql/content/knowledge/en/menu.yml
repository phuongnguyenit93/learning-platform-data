  - Sử dụng pgAdmin hoặc công cụ SQL để khám phá dữ liệu
  - Quản lý thông tin kết nối bằng service file và .pgpass
  - Đọc SQLSTATE và thông báo lỗi từ máy chủ
  - Tự động hóa tác vụ quản trị bằng công cụ dòng lệnh
  - Tổ chức tệp SQL và nhật ký thí nghiệm để tái lập kết quả
- level1: Kiến trúc
  level2:
  - Mô hình máy khách và máy chủ trong một phiên làm việc
