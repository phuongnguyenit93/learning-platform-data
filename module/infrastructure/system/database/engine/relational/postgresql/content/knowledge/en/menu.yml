  - FROM, bảng nguồn và phạm vi tên cột
  - WHERE, toán tử so sánh và toán tử logic
  - Logic ba giá trị với NULL và IS DISTINCT FROM
  - IN, BETWEEN, LIKE, ILIKE và điều kiện kết hợp
  - ORDER BY, nhiều khóa sắp xếp và NULLS FIRST hoặc LAST
