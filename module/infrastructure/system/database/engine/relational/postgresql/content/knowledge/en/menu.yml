  - Boolean, NULL và trạng thái thiếu dữ liệu
  - date, time, timestamp và timestamp with time zone
  - interval, phép tính thời gian và múi giờ
  - UUID và lựa chọn cách sinh định danh theo phiên bản
  - Dữ liệu nhị phân bytea và đối tượng lớn
  - Mảng, kiểu phần tử và kích thước mảng
  - json, jsonb và tiêu chí lựa chọn
  - Enum, domain và kiểu tổng hợp
  - Range, multirange và biểu diễn khoảng giá trị
  - Kiểu địa chỉ mạng, bit và kiểu hình học tích hợp
  - Ép kiểu tường minh, suy luận kiểu và chuyển đổi ngầm
  - Mã hóa ký tự, collation và ảnh hưởng đến so sánh
- level1: Ràng buộc
  level2:
