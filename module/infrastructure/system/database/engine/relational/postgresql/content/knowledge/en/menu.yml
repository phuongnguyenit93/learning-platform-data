- level1: Quản trị
  level2:
  - Quản lý role, database, schema và quyền sở hữu theo vòng đời
  - Tra cứu session, giao dịch và tác vụ nền
  - Hủy truy vấn, kết thúc phiên và đánh giá ảnh hưởng
  - Bảo trì chỉ mục, thống kê và dung lượng theo lịch
  - Quản lý extension và quyền cài đặt
  - Luân chuyển log và bảo vệ dung lượng lưu nhật ký
  - Quản lý thông tin bí mật và thay đổi mật khẩu
  - Kiểm tra catalog, phụ thuộc và đối tượng không còn sử dụng
  - Chế độ hoạt động hạn chế và cửa sổ bảo trì
  - Tự động hóa script có kiểm soát lỗi, timeout và nhật ký
  - Xây dựng runbook và bằng chứng kiểm tra sau thao tác
- level1: Nâng cấp
  level2:
  - Phân biệt cập nhật bản phụ và nâng cấp bản chính
  - Đọc ghi chú phát hành và lập danh sách thay đổi tương thích
  - Kiểm kê extension, kiểu dữ liệu và công cụ phụ thuộc
  - Nâng cấp bằng dump và restore
  - Nâng cấp bằng pg_upgrade và lựa chọn chế độ sao chép dữ liệu
  - Di chuyển bằng sao chép logic để giảm gián đoạn
  - Nâng cấp primary, standby và công cụ sao lưu theo thứ tự phù hợp
  - Thay đổi collation, reindex và rủi ro sau nâng cấp hệ điều hành
  - Thu thập lại thống kê và kiểm tra hồi quy kế hoạch
  - Diễn tập, đo thời gian dừng và chuẩn bị phương án quay lui
  - Xác minh dữ liệu, quyền, hiệu năng và sao lưu sau nâng cấp
- level1: Thay đổi lược đồ
  level2:
  - Migration có phiên bản và quản lý lịch sử thay đổi
  - DDL trong giao dịch và các lệnh có ngoại lệ
  - ALTER TABLE, mức khóa và thao tác cần viết lại bảng
  - Thêm cột, giá trị mặc định và kiểm tra hành vi theo phiên bản
  - Đổi kiểu dữ liệu, backfill và kiểm soát tác động
  - Thêm chỉ mục CONCURRENTLY ngoài giao dịch migration phù hợp
  - Triển khai ràng buộc theo giai đoạn NOT VALID và VALIDATE
  - Mô hình mở rộng rồi thu hẹp để tương thích ứng dụng
  - Đổi tên, xóa cột và quản lý phụ thuộc view hoặc hàm
  - Flyway, Liquibase và quy trình kiểm tra migration PostgreSQL
  - Đối phó migration lỗi, lược đồ lệch và triển khai dở dang
  - Đánh giá phương án quay lui so với sửa tiếp khi dữ liệu đã đổi
- level1: Mở rộng
  level2:
  - Extension, schema cài đặt và vòng đời CREATE hoặc ALTER EXTENSION
  - Extension tin cậy, quyền cài đặt và mã chạy phía máy chủ
  - pgcrypto và lựa chọn hàm mật mã phù hợp
  - hstore, ltree và các mô hình dữ liệu chuyên biệt
  - PostGIS và ranh giới giữa kiểu hình học tích hợp với dữ liệu không gian
  - Kiểu dữ liệu, toán tử, operator class và access method mở rộng
  - Ngôn ngữ thủ tục bổ sung và rủi ro quyền thực thi
  - amcheck, pageinspect, pg_buffercache và công cụ khảo sát nội bộ
  - Tương thích extension khi sao lưu, phục hồi và nâng cấp
  - Đánh giá độ tin cậy, hiệu năng và khả năng di chuyển trước khi phụ thuộc
- level1: Tích hợp dữ liệu
  level2:
  - Foreign Data Wrapper và mô hình bảng dữ liệu ngoài
  - postgres_fdw, foreign server, user mapping và foreign table
  - IMPORT FOREIGN SCHEMA và quản lý cấu trúc nguồn
  - Đẩy điều kiện, JOIN và tổng hợp sang máy chủ từ xa
  - Ước tính chi phí, fetch size và hiệu năng truy vấn liên máy
  - Giao dịch, lỗi mạng và giới hạn tính nguyên tử với nguồn ngoài
  - So sánh postgres_fdw, dblink và sao chép dữ liệu
  - Kết nối công cụ BI, ETL và hệ thống phân tích
  - CDC, sự kiện dữ liệu và bảo đảm xử lý ở hệ thống nhận
  - Giới hạn PostgreSQL một nút và tiêu chí cân nhắc phân tán dữ liệu
- level1: Kiểm thử
  level2:
  - Tách kiểm thử schema, SQL, giao dịch và hiệu năng
  - Dữ liệu mẫu, seed và khả năng tái lập
  - Kiểm thử ràng buộc, NULL, múi giờ và ranh giới kiểu dữ liệu
  - Kiểm thử hàm, thủ tục và trigger với pgTAP hoặc SQL script
  - Kiểm thử tích hợp Java bằng PostgreSQL thật và Testcontainers
  - Kiểm thử cạnh tranh bằng nhiều kết nối và lịch thực thi có kiểm soát
  - Kiểm thử migration trên dữ liệu và schema phiên bản trước
  - Kiểm thử quyền role, RLS và hành vi từ chối truy cập
  - Kiểm thử truy vấn với dữ liệu lệch và dung lượng đại diện
  - Kiểm thử mất kết nối, thử lại và tính lặp an toàn
  - Diễn tập phục hồi, failover và kiểm chứng yêu cầu nghiệp vụ
  - Tích hợp kiểm tra cơ sở dữ liệu vào CI và quản lý môi trường cô lập
- level1: Triển khai
  level2:
  - Lựa chọn máy chủ riêng, container hoặc dịch vụ PostgreSQL được quản lý
  - Chuẩn bị CPU, RAM, IOPS, dung lượng và tốc độ tăng dữ liệu
  - Volume bền vững, quyền thư mục và vòng đời container
  - Triển khai trên Kubernetes với operator và giới hạn trách nhiệm
  - Quản lý cấu hình, thông tin bí mật và TLS theo môi trường
  - Health check, readiness và kiểm tra khả năng phục vụ thực tế
  - Phân vùng mạng, tường lửa và quyền truy cập quản trị
  - Phân bố lỗi, sao lưu ngoài cụm và kế hoạch khôi phục thảm họa
  - Đưa migration, giám sát và kiểm tra sau triển khai vào quy trình
  - Tự động hóa hạ tầng, cấu hình và tài liệu bàn giao
  - Đánh giá giới hạn dịch vụ được quản lý, chi phí và khả năng chuyển đổi
- level1: Xử lý sự cố
  level2:
  - Không kết nối được do DNS, mạng, TLS, xác thực hoặc pg_hba.conf
  - Hết kết nối và sự cố dây chuyền từ pool ứng dụng
  - Truy vấn chậm đột ngột do kế hoạch, dữ liệu hoặc thống kê
  - Khóa kéo dài, deadlock và giao dịch bị treo
  - Tăng CPU, tràn bộ nhớ và truy vấn sinh nhiều tệp tạm
  - Đầy đĩa do bảng, WAL, archive hoặc nhật ký
  - Autovacuum không theo kịp và cảnh báo transaction ID
  - Độ trễ sao chép, slot bị bỏ quên và standby mất WAL
  - Phục hồi bị kẹt, lỗi archive và thiếu chuỗi WAL
  - Lỗi checksum, nghi ngờ hỏng dữ liệu và bảo toàn bằng chứng
  - Sự cố sau nâng cấp, thay đổi collation hoặc extension
  - Thu thập bằng chứng, giảm tác động và xác minh sau xử lý
  - Phân tích nguyên nhân gốc và cập nhật biện pháp phòng ngừa
- level1: Thực hành tổng hợp
  level2:
  - Xây cơ sở dữ liệu quản lý đơn hàng với schema và ràng buộc
  - Viết truy vấn báo cáo với JOIN, CTE, tổng hợp và hàm cửa sổ
  - Mô phỏng đặt hàng đồng thời và bảo vệ số lượng tồn kho
  - Xây hàng đợi công việc với SKIP LOCKED và cơ chế thử lại
  - So sánh mô hình quan hệ với jsonb trên cùng yêu cầu
  - Xây tìm kiếm toàn văn và tìm kiếm gần đúng cho danh mục
  - Chẩn đoán truy vấn chậm bằng EXPLAIN ANALYZE và chỉ mục
  - Thiết kế dữ liệu theo thời gian với phân vùng và chính sách lưu giữ
  - Triển khai phân quyền và RLS cho dữ liệu nhiều khách hàng
  - Thực hiện migration tương thích khi ứng dụng vẫn hoạt động
  - Tích hợp JDBC, pool kết nối và xử lý lỗi giao dịch
  - Dựng primary, standby và diễn tập chuyển đổi vai trò
  - Sao lưu, phục hồi tới thời điểm xác định và đối soát dữ liệu
  - Hoàn thiện dashboard, cảnh báo và runbook cho môi trường thực hành
