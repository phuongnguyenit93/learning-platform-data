  - ALTER SYSTEM và quản lý postgresql.auto.conf
  - Phân biệt tham số cần reload và cần restart
  - Địa chỉ lắng nghe, cổng kết nối và giới hạn phiên
  - Thiết lập múi giờ, mã hóa phía máy khách và thông báo
  - Cấu hình ghi nhật ký và thời gian chờ cơ bản
  - Kiểm tra lỗi cấu hình và thay đổi an toàn có phương án hoàn tác
- level1: Tổ chức dữ liệu
  level2:
  - CREATE DATABASE, template database và lựa chọn thuộc tính khởi tạo
  - Schema như không gian tên và ranh giới tổ chức đối tượng
