menu:
- level1: Tổng quan
  level2:
  - PostgreSQL là gì và vai trò của hệ quản trị cơ sở dữ liệu quan hệ
  - Mô hình quan hệ, SQL và đặc trưng quan hệ đối tượng của PostgreSQL
  - Bài toán phù hợp, giới hạn và tiêu chí lựa chọn PostgreSQL
  - Phân biệt máy chủ, cụm cơ sở dữ liệu, database, schema, bảng và hàng
  - Quan hệ giữa lưu trữ, truy vấn, giao dịch, chỉ mục và sao chép
  - ACID, tính toàn vẹn và trách nhiệm của ứng dụng
  - Phân biệt xử lý giao dịch và phân tích dữ liệu
  - Ranh giới giữa PostgreSQL, công cụ quản trị và dịch vụ được quản lý
  - Phiên bản chính, phiên bản phụ và cách đọc tài liệu đúng phiên bản
  - Lộ trình từ cơ sở dữ liệu đầu tiên đến vận hành an toàn
- level1: Cài đặt
  level2:
  - Chuẩn bị hệ điều hành, dung lượng, cổng kết nối và tài khoản dịch vụ
  - Cài đặt PostgreSQL trên Linux, Windows và macOS
  - Khởi tạo cụm dữ liệu bằng initdb và lựa chọn mã hóa, locale
  - Khởi động, dừng, khởi động lại và kiểm tra bằng pg_ctl
  - Tạo môi trường thực hành với Docker Compose và volume bền vững
  - Kết nối cục bộ qua Unix-domain socket hoặc TCP
  - Tạo role, database và bảng đầu tiên
  - Nạp bộ dữ liệu mẫu có thể tái tạo
  - Kiểm tra phiên bản, đường dẫn cấu hình và nhật ký khởi động
  - Phân biệt môi trường học tập, kiểm thử và sản xuất
- level1: Công cụ
  level2:
  - Kết nối bằng psql và cấu trúc chuỗi kết nối
  - Lệnh trợ giúp, liệt kê đối tượng và mô tả cấu trúc trong psql
  - Thực thi tệp SQL, biến psql và xử lý lỗi trong script
  - Định dạng kết quả, bộ đệm truy vấn, lịch sử và đo thời gian
