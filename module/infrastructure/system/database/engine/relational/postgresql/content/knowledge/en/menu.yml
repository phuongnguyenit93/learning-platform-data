  - ON, USING và rủi ro của NATURAL JOIN
  - Tự kết nối bảng và quan hệ phân cấp đơn giản
  - Đặt điều kiện trong ON hoặc WHERE với outer join
  - EXISTS, NOT EXISTS và kiểm tra sự tồn tại
