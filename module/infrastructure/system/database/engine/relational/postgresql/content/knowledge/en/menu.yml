  - NULL trong ràng buộc duy nhất và lựa chọn NULLS NOT DISTINCT
  - FOREIGN KEY và bảo toàn quan hệ tham chiếu
  - ON DELETE, ON UPDATE và lựa chọn hành vi lan truyền
  - Khóa ghép và ràng buộc nhiều cột
  - EXCLUDE và ngăn khoảng dữ liệu chồng lấn
  - Ràng buộc trì hoãn được và SET CONSTRAINTS
