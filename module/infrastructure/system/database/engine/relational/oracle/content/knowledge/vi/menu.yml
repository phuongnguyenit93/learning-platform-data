menu:
- level1: Tổng quan
  level2:
  - Oracle Database là gì và vai trò trong hệ thống ứng dụng
  - Bài toán lưu trữ quan hệ, tính toàn vẹn và xử lý giao dịch
  - Phân biệt Oracle Database, SQL, PL/SQL và ứng dụng Java
  - 'Bản đồ thuật ngữ: database, instance, service, schema, CDB và PDB'
  - Luồng từ yêu cầu ứng dụng đến câu lệnh SQL và dữ liệu trên đĩa
  - Phân biệt tải giao dịch OLTP, phân tích OLAP và tải hỗn hợp
  - Vai trò và ranh giới công việc của lập trình viên, DBA và người vận hành
  - Phiên bản, bản phát hành, Release Update và tham số COMPATIBLE
  - Đối chiếu edition, tính năng, option và management pack trước khi sử dụng
  - Trình tự học từ môi trường thực hành đến ứng dụng và vận hành
- level1: Môi trường thực hành
  level2:
  - Chọn bản Oracle phù hợp với bài thực hành và giới hạn tài nguyên
  - Chuẩn bị máy ảo hoặc container, bộ nhớ, dung lượng và cổng mạng
  - Cài đặt và khởi tạo database bằng công cụ phù hợp với bản Oracle
  - Cấu trúc thư mục ORACLE_HOME, ORACLE_BASE và vùng dữ liệu
  - Cấu hình biến môi trường ORACLE_SID, PATH và TNS_ADMIN
  - Tạo PDB, tài khoản thực hành, tablespace và hạn mức lưu trữ
  - Thiết kế bộ dữ liệu mẫu có quan hệ, dữ liệu NULL và dữ liệu biên
  - Lưu dữ liệu bền vững, sao lưu cấu hình và tái tạo môi trường
  - Kiểm tra phiên bản, trạng thái database, PDB và listener
  - Tách môi trường phát triển, kiểm thử và vận hành
- level1: Công cụ và kết nối
  level2:
  - Thực hiện câu lệnh và script bằng SQL*Plus, SQLcl và SQL Developer
  - Phân biệt kết nối cục bộ, kết nối mạng và xác thực hệ điều hành
  - Listener, đăng ký dịch vụ và luồng thiết lập kết nối Oracle Net
  - Phân biệt SID, SERVICE_NAME và tên kết nối TNS
  - Cú pháp Easy Connect và connect descriptor
  - Cấu hình tnsnames.ora, sqlnet.ora và listener.ora
  - 'Kiểm tra kết nối theo từng lớp: DNS, TCP, listener và database service'
  - Quản lý biến bind, biến thay thế và dấu kết thúc SQL/PLSQL trong script
  - Điều khiển autocommit, hiển thị kết quả và ghi nhật ký bằng SPOOL
  - Bộ ký tự, mã hóa và tham số phiên khi kết nối từ công cụ
  - Nguyên tắc cấu hình timeout, mã hóa đường truyền và quản lý mật khẩu
  - Đọc mã lỗi ORA và phân biệt lỗi kết nối với lỗi xác thực
- level1: Kiến trúc
  level2:
  - Phân biệt database vật lý, instance và các đối tượng logic
  - Luồng parse, bind, execute và fetch của một câu lệnh SQL
  - Tiến trình người dùng, server process và background process
  - Dedicated server, shared server và mô hình phục vụ phiên
  - 'Bộ nhớ SGA: buffer cache, shared pool, redo log buffer và các vùng bổ sung'
  - Bộ nhớ PGA, vùng làm việc và xử lý sắp xếp hoặc băm
  - DBWn, LGWR, CKPT, SMON, PMON và vai trò phối hợp
  - Datafile, control file, online redo log và archived redo log
  - SCN, checkpoint và quan hệ giữa redo, undo, dữ liệu đã commit
  - Logical read, physical read, dirty buffer và cơ chế ghi dữ liệu
  - Hard parse, soft parse, shared cursor và library cache
  - Đọc kiến trúc từ các dynamic performance view phù hợp
- level1: Lưu trữ
  level2:
  - Quan hệ giữa tablespace, datafile, segment, extent và data block
  - Block header, row piece, row chaining và row migration
  - Locally managed tablespace và tự động quản lý không gian segment
  - Tablespace SYSTEM, SYSAUX, USERS, TEMP và UNDO
  - Tạo tablespace, cấu hình autoextend và kiểm soát MAXSIZE
  - Phân biệt smallfile, bigfile và Oracle Managed Files
  - Phân bổ extent, high water mark và ảnh hưởng đến thao tác quét
  - Giải phóng không gian bằng shrink, move và tổ chức lại segment
  - Table compression, đánh đổi CPU/dung lượng và điều kiện tính năng/giấy phép
  - Temporary segment, sort spill và quản lý dung lượng TEMP
  - Undo segment, undo retention và nhu cầu đọc nhất quán
  - Tổng quan ASM, disk group, redundancy và ranh giới với filesystem
  - Theo dõi dung lượng, xu hướng tăng trưởng và cảnh báo đầy đĩa
- level1: CDB và PDB
  level2:
  - Mô hình multitenant và quan hệ giữa CDB root, seed và PDB
  - Container hiện tại, CON_ID và chuyển container đúng phạm vi
  - Common user, local user, common role và local role
  - Phạm vi tham số và metadata ở CDB so với PDB
  - Tạo, mở, đóng PDB và lưu trạng thái mở
  - Service của PDB và định tuyến kết nối ứng dụng
  - Clone, plug, unplug và kiểm tra điều kiện tương thích PDB
  - Phân quyền và giới hạn tài nguyên giữa các PDB
  - Tra cứu CDB_*, DBA_*, ALL_* và USER_* trong môi trường multitenant
  - Ranh giới sao lưu, phục hồi và bảo trì CDB/PDB
- level1: Schema và metadata
  level2:
  - Quan hệ giữa user, schema và quyền sở hữu đối tượng
  - Tên đối tượng, định danh có dấu ngoặc kép và phân biệt chữ hoa chữ thường
  - Phân giải tên theo schema, CURRENT_SCHEMA và synonym
  - Data dictionary, static dictionary view và dynamic performance view
  - Phạm vi dữ liệu trong USER_*, ALL_* và DBA_*
  - Tra cứu bảng, cột, ràng buộc, chỉ mục và thống kê
  - Tra cứu mã PL/SQL, lỗi biên dịch và trạng thái INVALID
  - Quan hệ phụ thuộc giữa đối tượng và cơ chế invalidation
  - Trích xuất DDL bằng DBMS_METADATA
  - Ghi chú bảng/cột và quy ước đặt tên phục vụ tài liệu hóa
- level1: Kiểu dữ liệu
  level2:
  - Chọn kiểu dữ liệu theo miền giá trị, độ chính xác và nhu cầu truy vấn
  - NUMBER, precision, scale và sai số khi chuyển sang số dấu phẩy động
  - BINARY_FLOAT, BINARY_DOUBLE và những giá trị số đặc biệt
  - CHAR, VARCHAR2, NCHAR và NVARCHAR2
  - Ngữ nghĩa độ dài BYTE/CHAR và lưu trữ tiếng Việt
  - Giới hạn kích thước chuỗi, MAX_STRING_SIZE và tương thích phiên bản
  - DATE, TIMESTAMP và các kiểu dữ liệu có múi giờ
  - INTERVAL YEAR TO MONTH và INTERVAL DAY TO SECOND
  - RAW, ROWID, UROWID và cách sử dụng đúng mục đích
  - CLOB, NCLOB, BLOB và BFILE
  - NULL, chuỗi rỗng và logic ba giá trị trong Oracle
  - Chuyển kiểu tường minh, chuyển kiểu ngầm định và lỗi mất dữ liệu
  - Phân biệt BOOLEAN trong PL/SQL và SQL theo phiên bản hỗ trợ
  - Kiểu dữ liệu người dùng, object type và collection type
- level1: Ngày giờ và NLS
  level2:
  - NLS_DATABASE_PARAMETERS, NLS_INSTANCE_PARAMETERS và NLS_SESSION_PARAMETERS
  - NLS_DATE_FORMAT, NLS_TIMESTAMP_FORMAT và nguy cơ phụ thuộc cấu hình phiên
  - Literal ngày giờ và mẫu định dạng (format model) tường minh
  - SYSDATE, SYSTIMESTAMP, CURRENT_DATE và CURRENT_TIMESTAMP
  - SESSIONTIMEZONE, DBTIMEZONE và chuẩn hóa thời điểm giữa hệ thống
  - TIMESTAMP WITH TIME ZONE và TIMESTAMP WITH LOCAL TIME ZONE
  - Cộng trừ ngày giờ, khoảng thời gian và quy tắc cuối tháng
  - Lọc theo khoảng thời gian nửa mở và tránh mất dữ liệu trong ngày
  - Múi giờ mùa hè, vùng giờ và cập nhật timezone file
  - NLS_NUMERIC_CHARACTERS, NLS_SORT và NLS_COMP khi xử lý dữ liệu
  - Collation, so sánh tiếng Việt và lựa chọn quy tắc tìm kiếm
- level1: Bảng và ràng buộc
  level2:
  - Chuyển miền dữ liệu và quan hệ nghiệp vụ thành bảng Oracle
  - CREATE TABLE, giá trị DEFAULT và cột bắt buộc
  - PRIMARY KEY, UNIQUE và quan hệ với chỉ mục
  - FOREIGN KEY, quan hệ cha con và lựa chọn hành vi khi xóa
  - CHECK, NOT NULL và giới hạn của kiểm tra dữ liệu khai báo
  - NULL trong ràng buộc UNIQUE, CHECK và khóa ghép
  - ENABLE, DISABLE, VALIDATE, NOVALIDATE và RELY
  - DEFERRABLE và kiểm tra ràng buộc tại thời điểm commit
  - 'ALTER TABLE: thêm, đổi, xóa cột và chuyển đổi dữ liệu'
  - Cột ảo, cột identity và các chế độ sinh giá trị
  - CREATE TABLE AS SELECT và những thuộc tính cần kiểm tra sau khi sao chép
  - Phân biệt DELETE, TRUNCATE, DROP và PURGE
  - Global/private temporary table, vòng đời dữ liệu và điều kiện phiên bản
  - Index-organized table, external table và lựa chọn cấu trúc bảng
- level1: SELECT cơ bản
  level2:
  - Cấu trúc SELECT và thứ tự xử lý logic các mệnh đề
  - Chọn cột, biểu thức, bí danh và sử dụng DUAL
  - WHERE, toán tử so sánh và kết hợp AND, OR, NOT
  - IN, BETWEEN, LIKE và ký tự đại diện
  - IS NULL, IS NOT NULL và kết quả UNKNOWN
  - DISTINCT và chi phí loại bỏ dữ liệu trùng
  - ORDER BY, thứ tự NULL và yêu cầu sắp xếp xác định
  - ROWNUM và lỗi giới hạn kết quả trước khi sắp xếp
  - OFFSET, FETCH FIRST, WITH TIES và phân trang
  - Biến bind, literal và phân biệt giá trị với tên đối tượng
  - Đọc kết quả rỗng, giá trị NULL và số dòng bị nhân bản
  - Giải thích và kiểm chứng một truy vấn bằng dữ liệu tối thiểu
- level1: Hàm và biểu thức
  level2:
  - Biểu thức số học, thứ tự ưu tiên và xử lý phép chia
  - 'Hàm số: ROUND, TRUNC, MOD, CEIL và FLOOR'
  - 'Hàm chuỗi: SUBSTR, INSTR, LENGTH, TRIM và REPLACE'
  - Nối chuỗi, padding và xử lý CHAR có khoảng trắng cuối
  - UPPER, LOWER, INITCAP và ảnh hưởng bộ ký tự
  - REGEXP_LIKE, REGEXP_SUBSTR, REGEXP_REPLACE và giới hạn sử dụng
  - TO_CHAR, TO_NUMBER, TO_DATE và TO_TIMESTAMP
  - CAST, format model và kiểm soát chuyển đổi dữ liệu
  - CASE dạng đơn giản và CASE dạng điều kiện
  - DECODE và khác biệt cần chú ý khi so sánh NULL
  - NVL, NVL2, COALESCE, NULLIF và lựa chọn kiểu kết quả
  - 'Hàm ngày tháng: ADD_MONTHS, MONTHS_BETWEEN, LAST_DAY và EXTRACT'
  - LEAST, GREATEST và ảnh hưởng của NULL hoặc chuyển kiểu
  - LISTAGG, tràn độ dài kết quả và khác biệt theo phiên bản
- level1: Gom nhóm và tập hợp
  level2:
  - COUNT(*), COUNT(cột), SUM, AVG, MIN và MAX
  - Ảnh hưởng của NULL và tập rỗng đến hàm tổng hợp
  - GROUP BY, khóa nhóm ghép và biểu thức nhóm
  - Phân biệt WHERE và HAVING
  - Conditional aggregation bằng CASE
  - ROLLUP, CUBE và GROUPING SETS
  - GROUPING, GROUPING_ID và phân biệt dòng tổng với NULL dữ liệu
  - UNION, UNION ALL, INTERSECT và MINUS
  - Điều kiện tương thích kiểu dữ liệu giữa các nhánh tập hợp
  - ORDER BY, độ ưu tiên và xử lý trùng trong truy vấn tập hợp
  - Kiểm chứng số lượng dòng và tổng hợp sau khi kết nối nhiều bảng
- level1: JOIN và truy vấn con
  level2:
  - INNER JOIN theo khóa đơn, khóa ghép và điều kiện nhiều cột
  - LEFT, RIGHT và FULL OUTER JOIN
  - CROSS JOIN, self join và nguy cơ nhân số dòng
  - Vị trí điều kiện trong ON/WHERE và ảnh hưởng đến OUTER JOIN
  - ANSI JOIN và cú pháp Oracle (+) trong mã cũ
  - Scalar subquery và điều kiện trả về tối đa một dòng
  - Single-row, multi-row và correlated subquery
  - EXISTS, NOT EXISTS và kiểm tra quan hệ tồn tại
  - IN, NOT IN và bẫy NULL trong truy vấn con
  - Inline view và phân tách các bước xử lý truy vấn
  - WITH và tái sử dụng khối truy vấn có tên
  - LATERAL, CROSS APPLY và OUTER APPLY theo phiên bản hỗ trợ
  - Chọn JOIN hay truy vấn con dựa trên ngữ nghĩa và kế hoạch thực thi
- level1: Truy vấn nâng cao
  level2:
  - Truy vấn cây bằng START WITH và CONNECT BY
  - LEVEL, PRIOR, CONNECT_BY_ROOT và SYS_CONNECT_BY_PATH
  - Phát hiện vòng lặp bằng NOCYCLE và CONNECT_BY_ISCYCLE
  - Recursive subquery factoring, SEARCH và CYCLE
  - PIVOT, UNPIVOT và chuyển đổi dạng dữ liệu báo cáo
  - Top-N toàn cục và Top-N trong từng nhóm
  - Phân trang bằng khóa tiếp nối và điều kiện thứ tự ổn định
  - Xử lý khoảng trống, dãy liên tiếp và dữ liệu thiếu kỳ
  - MODEL clause và bài toán tính toán trên tập ô
  - MATCH_RECOGNIZE và nhận dạng mẫu theo chuỗi sự kiện
  - SQL động theo nhu cầu lọc và nguyên tắc giữ an toàn
  - Thiết kế truy vấn báo cáo có tổng phụ, xếp hạng và dữ liệu thời gian
- level1: Hàm phân tích
  level2:
  - Phân biệt hàm tổng hợp và hàm phân tích theo cửa sổ
  - Cấu trúc OVER, PARTITION BY và ORDER BY
  - ROW_NUMBER, RANK và DENSE_RANK
  - LAG, LEAD và so sánh với dòng trước hoặc dòng sau
  - FIRST_VALUE, LAST_VALUE, NTH_VALUE và phạm vi cửa sổ
  - Khung ROWS/RANGE, khung mặc định và các dòng đồng hạng
  - SUM/AVG chạy dồn và trung bình trượt
  - COUNT phân tích, RATIO_TO_REPORT và tỷ trọng trong nhóm
  - NTILE, CUME_DIST, PERCENT_RANK và phân bố dữ liệu
  - KEEP (DENSE_RANK FIRST/LAST) trong phép tổng hợp
  - IGNORE NULLS, RESPECT NULLS và lấp dữ liệu theo chuỗi
  - Tách bước lọc kết quả phân tích và kiểm tra cú pháp theo phiên bản
  - Chi phí sắp xếp, kích thước phân vùng và kiểm chứng kết quả
- level1: Thay đổi dữ liệu
  level2:
  - INSERT một dòng, nhiều dòng và INSERT từ SELECT
  - INSERT ALL, INSERT FIRST và chèn có điều kiện
  - UPDATE một bảng, cập nhật nhiều cột và cập nhật từ truy vấn con
  - DELETE theo điều kiện và xóa dữ liệu quan hệ cha con
  - MERGE để đồng bộ dữ liệu và điều kiện khớp nguồn/đích
  - Nguồn MERGE trùng khóa và tính xác định của thao tác đồng bộ
  - RETURNING INTO để lấy giá trị sau INSERT, UPDATE hoặc DELETE
  - Sinh khóa bằng sequence, identity và lấy khóa vừa tạo
  - Default, trigger và ràng buộc trong vòng đời thay đổi dữ liệu
  - LOG ERRORS và tách dòng lỗi khi nạp dữ liệu
  - Xử lý dữ liệu trùng bằng ràng buộc và thao tác có thể thực hiện lại
  - Ảnh hưởng của DML đến undo, redo, chỉ mục và khóa
- level1: Giao dịch
  level2:
  - Đơn vị công việc nghiệp vụ và các thuộc tính ACID trong Oracle
  - Thời điểm bắt đầu, kết thúc và ranh giới của một giao dịch
  - COMMIT, ROLLBACK và khả năng quan sát dữ liệu giữa các phiên
  - SAVEPOINT và hoàn tác một phần giao dịch
  - Tính nguyên tử ở mức câu lệnh và mức giao dịch
  - Implicit commit của DDL và tác động đến script triển khai
  - Autocommit phía công cụ/JDBC và nguy cơ chia nhỏ giao dịch
  - Undo, MVCC và tính nhất quán khi đọc
  - READ COMMITTED và ảnh chụp dữ liệu tại từng câu lệnh
  - SERIALIZABLE, READ ONLY và khác biệt về tính nhất quán
  - SCN và mối quan hệ giữa commit với yêu cầu phục hồi
  - Thiết kế giao dịch ngắn, kiểm soát lỗi và quy tắc retry
- level1: Khóa và đồng thời
  level2:
  - Khóa dòng, khóa bảng, enqueue và latch/mutex
  - Đọc nhất quán, thao tác ghi và các tình huống phải chờ nhau
  - SELECT FOR UPDATE và phạm vi dòng bị khóa
  - NOWAIT, WAIT, SKIP LOCKED và mô hình nhận việc từ bảng
  - Lost update và khóa lạc quan bằng cột phiên bản
  - Khóa ngoại thiếu chỉ mục và tranh chấp trên dữ liệu cha con
  - Deadlock, nguyên nhân theo thứ tự khóa và phạm vi rollback
  - Blocking session, chuỗi chờ và truy tìm giao dịch gây nghẽn
  - Hot block, ITL và tranh chấp khi cập nhật tập trung
  - ORA-08177 và thử lại giao dịch SERIALIZABLE
  - ORA-01555 và quan hệ giữa thời gian truy vấn với undo
  - Mô phỏng hai phiên để kiểm chứng tính cô lập và cơ chế khóa
- level1: Đối tượng schema
  level2:
  - Tạo view và sử dụng view làm ranh giới truy cập dữ liệu
  - View có thể cập nhật, key-preserved table và WITH CHECK OPTION
  - Materialized view và lựa chọn ON DEMAND hoặc ON COMMIT
  - Complete refresh, fast refresh và materialized view log
  - Query rewrite và điều kiện tương thích, thống kê, tính năng
  - 'Sequence: NEXTVAL, CURRVAL, CACHE, ORDER và khoảng trống khóa'
  - Identity so với sequence và chiến lược sinh khóa cho ứng dụng
  - Private synonym, public synonym và rủi ro phân giải sai đối tượng
