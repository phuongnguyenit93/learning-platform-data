references:
  - title: "MySQL 8.4 Reference Manual"
    url: "https://dev.mysql.com/doc/refman/8.4/en/"
    description: "Tài liệu chính thức bao quát cài đặt, SQL, quản trị, tối ưu, sao lưu và replication."
  - title: "MySQL — Introduction to InnoDB"
    url: "https://dev.mysql.com/doc/refman/8.4/en/innodb-introduction.html"
    description: "Khái niệm storage engine InnoDB, khóa chính, ràng buộc và giao dịch."
  - title: "MySQL — Optimizing SELECT Statements"
    url: "https://dev.mysql.com/doc/refman/8.4/en/select-optimization.html"
    description: "Hướng dẫn tối ưu truy vấn SELECT, điều kiện lọc, index và join."
  - title: "MySQL — Optimization and Indexes"
    url: "https://dev.mysql.com/doc/refman/8.4/en/optimization-indexes.html"
    description: "Cách sử dụng và đánh đổi của index đơn, index ghép và các loại index."
  - title: "MySQL — Optimizing Queries with EXPLAIN"
    url: "https://dev.mysql.com/doc/refman/8.4/en/using-explain.html"
    description: "Đọc execution plan và xác định lý do query phải quét bảng."
  - title: "MySQL — InnoDB Transaction Model"
    url: "https://dev.mysql.com/doc/refman/8.4/en/innodb-transaction-model.html"
    description: "Isolation levels, locking reads, consistent reads, commit và rollback."
  - title: "MySQL — CREATE USER Statement"
    url: "https://dev.mysql.com/doc/refman/8.4/en/create-user.html"
    description: "Quản lý tài khoản, authentication, roles, TLS và giới hạn tài nguyên."
  - title: "MySQL — Using mysqldump for Backups"
    url: "https://dev.mysql.com/doc/refman/8.4/en/using-mysqldump.html"
    description: "Sao lưu logic bằng mysqldump và nhập lại SQL để phục hồi dữ liệu."
  - title: "MySQL — Replication"
    url: "https://dev.mysql.com/doc/refman/8.4/en/replication.html"
    description: "Nguyên tắc sao chép source-replica, binary log, GTID và các tình huống vận hành."