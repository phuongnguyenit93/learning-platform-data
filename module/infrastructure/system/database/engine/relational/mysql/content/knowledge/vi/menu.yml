menu:
- level1: Tổng quan
  level2:
  - MySQL là gì và vai trò trong hệ thống ứng dụng
  - Bài toán lưu trữ quan hệ, toàn vẹn dữ liệu và xử lý giao dịch
  - Phân biệt MySQL Server, SQL, storage engine và ứng dụng Java
  - 'Bản đồ thuật ngữ: server, instance, database, table, session và transaction'
  - Luồng từ yêu cầu ứng dụng đến câu lệnh SQL và dữ liệu trên đĩa
  - Đặc điểm tải giao dịch OLTP, báo cáo và tải hỗn hợp
  - Vai trò và ranh giới công việc của lập trình viên, DBA và người vận hành
  - Nhánh LTS, Innovation và cách xác định tính năng theo phiên bản
  - Community, Enterprise, dịch vụ quản lý và điều kiện sử dụng tính năng
  - Phân biệt MySQL với MariaDB và các hệ tương thích giao thức MySQL
  - Trình tự học từ môi trường thực hành đến ứng dụng và vận hành
- level1: Môi trường thực hành
  level2:
  - Chọn phiên bản MySQL và tài nguyên cho môi trường học
  - Cài đặt bằng gói hệ điều hành, máy ảo hoặc container
  - Khởi tạo data directory và tài khoản quản trị ban đầu
  - File cấu hình, cổng, socket và thư mục dữ liệu
  - Lưu dữ liệu bền vững bằng volume và tái tạo môi trường
  - Thiết lập tài khoản thực hành với quyền tối thiểu
  - Chuẩn bị schema, dữ liệu mẫu và các trường hợp biên
  - Kiểm tra phiên bản, storage engine và các biến cấu hình quan trọng
  - Thiết lập bộ ký tự, collation, múi giờ và SQL mode có thể tái lập
  - Kết nối từ máy chủ, container khác và ứng dụng Java
  - Tách môi trường phát triển, kiểm thử và vận hành
  - Sao lưu cấu hình và dọn môi trường thực hành đúng phạm vi
- level1: Công cụ và kết nối
  level2:
  - Sử dụng mysql client, MySQL Shell và MySQL Workbench
  - Chạy câu lệnh, script SQL và ghi lại kết quả thực hành
  - Classic Protocol, X Protocol và phạm vi sử dụng theo phiên bản
  - Kết nối TCP/IP, Unix socket và named pipe theo nền tảng
  - Host, port, socket, database mặc định và chuỗi kết nối
  - 'Vòng đời kết nối: xác thực, khởi tạo phiên, thực thi và đóng'
  - Tài khoản dạng user@host và cách MySQL lựa chọn tài khoản khớp
  - Cấu hình TLS, kiểm tra danh tính máy chủ và quản lý chứng thư
  - Quản lý mật khẩu bằng cấu hình bảo vệ hoặc cơ chế lưu thông tin đăng nhập
  - 'Kiểm tra kết nối theo lớp: DNS, mạng, giao thức, xác thực và quyền'
  - Biến người dùng, biến hệ thống và tham số ở phạm vi phiên
  - DELIMITER trong công cụ dòng lệnh và dấu kết thúc stored program
  - Đọc SQLSTATE, mã lỗi MySQL và thông báo lỗi từ client
- level1: Kiến trúc
  level2:
  - Các lớp kết nối, phân tích cú pháp, tối ưu và thực thi SQL
  - Server layer, storage engine API và ranh giới trách nhiệm
  - Mô hình tiến trình, luồng phục vụ kết nối và luồng nền
  - Luồng parse, prepare, execute và trả kết quả
  - Bộ nhớ dùng chung, bộ nhớ theo kết nối và vùng làm việc
  - Data dictionary, metadata cache và table definition cache
  - Phân biệt buffer pool, bộ đệm hệ điều hành và cache phía ứng dụng
  - Luồng ghi dữ liệu qua buffer pool, redo, undo và binary log
  - Checkpoint, flush, purge và phối hợp các tác vụ nền
  - Temporary table nội bộ và thao tác có thể tràn ra đĩa
  - Plugin, component và cơ chế mở rộng máy chủ
  - Cơ chế query cache của phiên bản cũ và giới hạn khi chuyển phiên bản
- level1: Storage engine
  level2:
  - Storage engine là gì và vì sao ảnh hưởng đến hành vi SQL
  - InnoDB và các đặc tính phục vụ giao dịch
  - MyISAM, cơ chế khóa và giới hạn về giao dịch
  - MEMORY, vòng đời dữ liệu và giới hạn vận hành
  - CSV, ARCHIVE, FEDERATED và điều kiện sử dụng
  - TempTable và phân biệt bảng tạm nội bộ với bảng tạm người dùng
  - NDB Cluster và ranh giới với InnoDB Cluster
  - Chọn engine theo toàn vẹn, đồng thời, độ bền và nhu cầu truy vấn
  - SHOW ENGINES, default_storage_engine và khai báo engine cho bảng
  - Chuyển engine và kiểm tra lại dữ liệu, ràng buộc, chỉ mục
  - Nguy cơ giao dịch chứa nhiều bảng thuộc engine khác nhau
- level1: Schema và metadata
  level2:
  - Quan hệ giữa database, schema, table và tài khoản người dùng
  - CREATE DATABASE, USE và phạm vi database mặc định
  - Tên đối tượng, backtick và từ khóa dành riêng
  - Phân biệt chữ hoa chữ thường, filesystem và lower_case_table_names
  - INFORMATION_SCHEMA và tra cứu metadata có cấu trúc
  - SHOW CREATE TABLE, SHOW INDEX và SHOW TABLE STATUS
  - Tra cứu cột, giá trị mặc định, ràng buộc và generated column
  - Tra cứu view, routine, trigger, event và người định nghĩa
  - Data dictionary và khác biệt so với các file metadata của bản cũ
  - Comment, quy ước đặt tên và tài liệu hóa schema
  - Quyền nhìn thấy metadata và giới hạn theo tài khoản
- level1: Kiểu dữ liệu
  level2:
  - Chọn kiểu dữ liệu theo miền giá trị, độ chính xác và chi phí lưu trữ
  - TINYINT, SMALLINT, MEDIUMINT, INT, BIGINT và SIGNED/UNSIGNED
  - DECIMAL so với FLOAT/DOUBLE và độ chính xác dữ liệu tiền tệ
  - Độ rộng hiển thị số nguyên, ZEROFILL và tương thích phiên bản
  - BOOLEAN/BOOL, TINYINT và kiểm tra miền giá trị đúng/sai
  - BIT và khác biệt với số nguyên hoặc chuỗi nhị phân
  - CHAR, VARCHAR và đánh đổi độ dài với cách lưu trữ
  - BINARY, VARBINARY và so sánh theo byte
  - TINYTEXT/TEXT/MEDIUMTEXT/LONGTEXT và các kiểu BLOB tương ứng
  - DATE, TIME, DATETIME, TIMESTAMP và YEAR
  - ENUM, SET và đánh đổi khi thay đổi tập giá trị
  - JSON và kiểu dữ liệu không gian
  - NULL, chuỗi rỗng, số 0 và logic ba giá trị
  - Chuyển kiểu ngầm định, so sánh số/chuỗi và mất khả năng dùng chỉ mục
  - Giới hạn kích thước dòng, độ dài khóa và dữ liệu lưu ngoài trang
  - Ánh xạ kiểu dữ liệu giữa MySQL, JDBC và mô hình miền Java
- level1: Bộ ký tự và collation
  level2:
  - Bộ ký tự, mã hóa và quy tắc so sánh (collation) giải quyết vấn đề nào
  - utf8mb4, các tên utf8 lịch sử và khả năng lưu emoji
  - Thiết lập bộ ký tự/collation ở server, database, table và column
  - character_set_client, character_set_connection và character_set_results
  - Độ dài theo ký tự, độ dài theo byte và giới hạn chỉ mục
  - Phân biệt hoa/thường, dấu và ý nghĩa các hậu tố collation
  - So sánh chuỗi nhị phân, chuỗi văn bản và ký tự có dấu
  - Collation coercibility và lỗi trộn collation
  - Khoảng trắng cuối, PAD SPACE/NO PAD và ảnh hưởng đến UNIQUE
  - Sắp xếp và tìm kiếm tiếng Việt theo yêu cầu nghiệp vụ
  - Chuyển bộ ký tự/collation và đánh giá dữ liệu trùng sau chuyển đổi
  - Kiểm chứng mã hóa xuyên suốt file, client, JDBC và database
- level1: Ngày giờ
  level2:
  - Phân biệt ngày lịch, giờ trong ngày, khoảng thời gian và thời điểm
  - DATE, DATETIME, TIMESTAMP và miền giá trị theo phiên bản
  - Độ chính xác phần giây và quy tắc làm tròn khi lưu
  - Múi giờ hệ điều hành, server và session
  - Khác biệt chuyển đổi múi giờ của TIMESTAMP và DATETIME
  - NOW, CURRENT_TIMESTAMP, UTC_TIMESTAMP và thời điểm lấy giá trị
  - DEFAULT CURRENT_TIMESTAMP và ON UPDATE CURRENT_TIMESTAMP
  - DATE_FORMAT, STR_TO_DATE và định dạng đầu vào tường minh
  - DATE_ADD, DATE_SUB, TIMESTAMPDIFF và xử lý cuối tháng
  - CONVERT_TZ, timezone table và thay đổi giờ mùa hè
  - Zero date, ngày không hợp lệ và ảnh hưởng của SQL mode
  - Lọc khoảng thời gian nửa mở và thiết kế truy vấn khai thác chỉ mục
- level1: SQL mode và ngữ nghĩa
  level2:
  - Phạm vi GLOBAL/SESSION của sql_mode và cách kiểm tra cấu hình hiệu lực
  - Strict mode, lỗi chuyển đổi và nguy cơ dữ liệu bị cắt ngắn
  - ONLY_FULL_GROUP_BY và quy tắc xác định giá trị trong nhóm
  - Phụ thuộc hàm, ANY_VALUE và ý nghĩa tính đúng của kết quả
  - ANSI_QUOTES, định danh và dấu ngoặc kép
  - PIPES_AS_CONCAT, phép nối chuỗi và khác biệt với toán tử OR
  - NO_BACKSLASH_ESCAPES, escape và xử lý literal an toàn
  - Quy tắc phép chia, tràn số và dữ liệu ngày giờ không hợp lệ
  - Warning so với error và đọc SHOW WARNINGS
  - sql_safe_updates và phân biệt với các cờ sql_mode
  - Ngữ nghĩa affected rows, matched rows và ảnh hưởng từ tùy chọn client
  - Kiểm chứng hành vi SQL khi thay đổi phiên bản hoặc cấu hình phiên
- level1: Bảng và ràng buộc
  level2:
  - Chuyển miền dữ liệu và quan hệ nghiệp vụ thành bảng MySQL
  - CREATE TABLE, DEFAULT, NOT NULL và biểu thức giá trị mặc định
  - PRIMARY KEY, UNIQUE và yêu cầu định danh dòng trong InnoDB
  - FOREIGN KEY, điều kiện kiểu dữ liệu/chỉ mục và engine hỗ trợ
  - ON DELETE/ON UPDATE, CASCADE, SET NULL và RESTRICT
  - CHECK constraint và khác biệt thực thi giữa các phiên bản
  - NULL trong UNIQUE, CHECK và khóa ghép
  - AUTO_INCREMENT, cách cấp giá trị và khoảng trống sau rollback
  - Generated column dạng VIRTUAL/STORED và giới hạn biểu thức
  - DEFAULT expression, invisible column và điều kiện phiên bản
  - CREATE TABLE LIKE, CREATE TABLE AS SELECT và thuộc tính cần đối chiếu
  - 'ALTER TABLE: thêm, đổi, xóa cột và ràng buộc'
  - Phân biệt DELETE, TRUNCATE, DROP và ảnh hưởng giao dịch
  - RENAME TABLE, đổi tên nguyên tử và các phụ thuộc cần kiểm tra
  - Kiểm tra dữ liệu mồ côi và rủi ro khi tắt foreign_key_checks
- level1: SELECT cơ bản
  level2:
  - Cấu trúc SELECT và thứ tự xử lý logic các mệnh đề
  - Chọn cột, biểu thức, bí danh và truy vấn không cần bảng
  - WHERE, phép so sánh và kết hợp AND, OR, NOT
  - IN, BETWEEN, LIKE và ký tự đại diện
  - IS NULL, IS NOT NULL và phép so sánh NULL-safe <=>
  - DISTINCT và chi phí loại bỏ dữ liệu trùng
  - ORDER BY, thứ tự NULL và yêu cầu sắp xếp xác định
  - LIMIT, OFFSET và phân trang trên tập dữ liệu thay đổi
  - Biến bind và phân biệt dữ liệu đầu vào với tên đối tượng
  - Quy tắc phân giải bí danh trong WHERE, GROUP BY và ORDER BY
  - Đọc kết quả rỗng, dữ liệu NULL và số dòng bị nhân bản
  - Kiểm chứng truy vấn bằng dữ liệu tối thiểu và trường hợp biên
- level1: Hàm và biểu thức
  level2:
  - Biểu thức số học, độ ưu tiên và phép chia / hoặc DIV
  - ROUND, TRUNCATE, MOD, CEIL, FLOOR và quy tắc số âm
  - CONCAT, CONCAT_WS và ảnh hưởng của NULL
  - SUBSTRING, LEFT, RIGHT, LOCATE và thao tác chuỗi
  - LENGTH, CHAR_LENGTH và dữ liệu nhiều byte
  - TRIM, REPLACE, LPAD, RPAD và chuẩn hóa dữ liệu
  - LOWER, UPPER và quan hệ với bộ ký tự/collation
  - REGEXP_LIKE, REGEXP_SUBSTR, REGEXP_REPLACE theo phiên bản
  - CASE, IF và lựa chọn nhánh biểu thức
  - IFNULL, COALESCE, NULLIF và kiểu dữ liệu kết quả
  - CAST, CONVERT và kiểm soát chuyển đổi tường minh
  - LEAST, GREATEST và xử lý NULL hoặc kiểu dữ liệu hỗn hợp
  - UUID, UUID_TO_BIN, BIN_TO_UUID và điều kiện sử dụng
  - LAST_INSERT_ID, CONNECTION_ID và các giá trị gắn với phiên
- level1: Gom nhóm và tập hợp
  level2:
  - COUNT(*), COUNT(cột), SUM, AVG, MIN và MAX
  - NULL, tập rỗng và kết quả của phép tổng hợp
  - GROUP BY theo một cột, khóa ghép hoặc biểu thức
  - Phân biệt WHERE và HAVING
  - Tổng hợp có điều kiện bằng CASE hoặc biểu thức logic
  - WITH ROLLUP, GROUPING và phân biệt dòng tổng với NULL dữ liệu
  - GROUP_CONCAT, thứ tự nối và giới hạn group_concat_max_len
  - JSON_ARRAYAGG, JSON_OBJECTAGG và đặc điểm kết quả
  - UNION, UNION ALL và tương thích kiểu dữ liệu các nhánh
  - INTERSECT, EXCEPT và điều kiện hỗ trợ theo phiên bản
  - ORDER BY/LIMIT trong truy vấn tập hợp và phạm vi áp dụng
  - Kiểm chứng tổng hợp sau JOIN để tránh đếm hoặc cộng trùng
- level1: JOIN và truy vấn con
  level2:
  - INNER JOIN theo khóa đơn, khóa ghép và điều kiện nhiều cột
  - LEFT/RIGHT OUTER JOIN và dữ liệu không có bản ghi tương ứng
  - CROSS JOIN, self join và nguy cơ nhân số dòng
  - Vị trí điều kiện trong ON/WHERE và ảnh hưởng đến OUTER JOIN
  - USING, NATURAL JOIN và rủi ro khi schema thay đổi
  - Mô phỏng FULL OUTER JOIN và kiểm chứng dữ liệu trùng
  - Scalar subquery và điều kiện trả về tối đa một dòng
  - Single-row, multi-row và correlated subquery
  - EXISTS, NOT EXISTS và truy vấn kiểm tra tồn tại
  - IN, NOT IN và bẫy NULL trong truy vấn con
  - Derived table, bí danh và tổ chức truy vấn nhiều bước
  - LATERAL derived table và điều kiện phiên bản hỗ trợ
  - Chọn JOIN hay truy vấn con theo ngữ nghĩa và kế hoạch thực thi
- level1: CTE và truy vấn cây
  level2:
  - WITH và Common Table Expression để đặt tên tập kết quả trung gian
  - Phạm vi tên, nhiều CTE và quan hệ tham chiếu giữa các CTE
  - Derived table, CTE và lựa chọn tái sử dụng truy vấn
  - 'WITH RECURSIVE: phần khởi tạo và phần đệ quy'
  - Kiểu dữ liệu cột CTE đệ quy và nguy cơ cắt ngắn dữ liệu
  - Truy vấn cây tổ chức, đường dẫn và độ sâu
  - Phát hiện chu trình và điều kiện dừng đệ quy
  - Giới hạn cte_max_recursion_depth và kiểm soát chi phí
  - Sinh dãy ngày, bù dữ liệu thiếu kỳ và tổng hợp theo lịch
  - Merge/materialization của CTE và kiểm tra kế hoạch thực thi
- level1: Hàm cửa sổ
  level2:
  - Phân biệt hàm tổng hợp và hàm cửa sổ
  - Cấu trúc OVER, PARTITION BY và ORDER BY
  - ROW_NUMBER, RANK và DENSE_RANK
  - LAG, LEAD và so sánh với dòng trước hoặc dòng sau
  - FIRST_VALUE, LAST_VALUE, NTH_VALUE và phạm vi cửa sổ
  - Khung ROWS/RANGE, khung mặc định và các dòng đồng hạng
  - SUM/AVG chạy dồn và trung bình trượt
  - NTILE, CUME_DIST, PERCENT_RANK và phân bố dữ liệu
  - WINDOW clause và tái sử dụng định nghĩa cửa sổ
  - Top-N trong từng nhóm và xử lý các giá trị bằng nhau
  - Lọc kết quả hàm cửa sổ qua CTE hoặc derived table
  - Giới hạn cú pháp, chi phí sắp xếp và kiểm chứng kết quả
- level1: Thay đổi dữ liệu
  level2:
  - INSERT một dòng, nhiều dòng và INSERT từ SELECT
  - Giá trị mặc định, cột sinh tự động và cột bỏ qua trong INSERT
  - INSERT IGNORE, warning và nguy cơ che giấu dữ liệu không hợp lệ
  - INSERT ON DUPLICATE KEY UPDATE và ý nghĩa của khóa xung đột
  - REPLACE và ảnh hưởng xóa/chèn đến khóa ngoại, trigger, định danh
  - UPDATE một bảng và cập nhật nhiều bảng
  - DELETE một bảng, nhiều bảng và xóa dữ liệu cha con
  - ORDER BY/LIMIT trong DML và giới hạn theo dạng câu lệnh
  - Lấy khóa tự sinh bằng LAST_INSERT_ID hoặc cơ chế generated keys
  - Affected rows và nhận diện trường hợp dữ liệu không thay đổi
  - Nạp hoặc thay đổi dữ liệu theo lô có thể thực hiện lại an toàn
  - Chia lô theo khóa ổn định và tránh giao dịch quá lớn
  - Tác động của DML đến chỉ mục, khóa, undo, redo và binary log
- level1: Giao dịch
  level2:
  - Đơn vị công việc nghiệp vụ và các thuộc tính ACID
  - START TRANSACTION, BEGIN, COMMIT và ROLLBACK
  - autocommit và ranh giới giao dịch ở từng kết nối
  - SAVEPOINT, ROLLBACK TO SAVEPOINT và RELEASE SAVEPOINT
  - Tính nguyên tử câu lệnh và tính nguyên tử toàn giao dịch
  - DDL implicit commit và các ngoại lệ cần kiểm tra
  - Atomic DDL, implicit commit và giới hạn hoàn tác DDL
  - Giao dịch chứa bảng không hỗ trợ transaction và thao tác ngoài database
