roadmap:
- id: property-graph-use-cases
  title: Property Graph & Use Cases
  purpose: Hiểu khi nào cơ sở dữ liệu đồ thị phù hợp hơn bảng quan hệ.
  objectives:
  - Phân biệt node, relationship, label và property.
  - Nhận diện bài toán nhiều liên kết như gợi ý và mạng xã hội.
  - Giải thích traversal thay cho chuỗi JOIN phức tạp.
- id: khoi-tao-neo4j
  title: Khởi tạo Neo4j
  purpose: Thiết lập môi trường để tương tác và quan sát dữ liệu đồ thị.
  objectives:
  - Tạo instance Neo4j AuraDB hoặc local.
  - Đăng nhập và chạy Cypher qua Query/Browser.
  - Tạo vài node mẫu rồi xem đồ thị.
- id: mo-hinh-hoa-graph
  title: Mô hình hóa Graph
  purpose: Thiết kế nhãn, quan hệ có hướng và thuộc tính theo truy vấn.
  objectives:
  - Xác định thực thể, label và relationship type.
  - Đặt thuộc tính định danh cho các node.
  - Phác thảo graph khách hàng–đơn hàng–sản phẩm.
- id: cypher-crud-merge
  title: Cypher CRUD & MERGE
  purpose: Thực hành tạo và chỉnh sửa dữ liệu mà tránh phát sinh bản sao.
  objectives:
  - Dùng CREATE tạo node và relationship.
  - Dùng MERGE tìm hoặc tạo phần tử có điều kiện.
  - Sửa bằng SET và xóa bằng DETACH DELETE có kiểm soát.
- id: match-graph-traversal
  title: MATCH & Graph Traversal
  purpose: Tìm quan hệ, đường đi và tổng hợp kết quả từ đồ thị.
  objectives:
  - Viết MATCH và OPTIONAL MATCH theo pattern.
  - Lọc WHERE, RETURN, ORDER BY và LIMIT.
  - Truy vấn quan hệ nhiều bước và tính COUNT.
- id: constraints-indexes
  title: Constraints & Indexes
  purpose: Giữ dữ liệu nhất quán và tăng tốc tìm node khởi đầu.
  objectives:
  - Tạo uniqueness constraint cho khóa nghiệp vụ.
  - Tạo range index trên thuộc tính truy vấn thường xuyên.
  - So sánh kết quả trước và sau khi thêm index.
- id: import-csv-du-lieu
  title: Import CSV & Dữ liệu
  purpose: Đưa dữ liệu từ nguồn bảng vào cấu trúc graph đúng quan hệ.
  objectives:
  - Chuẩn hóa khóa nhận diện và tệp CSV mẫu.
  - Dùng LOAD CSV để MERGE node và tạo cạnh.
  - Kiểm tra dữ liệu trùng và số quan hệ nhập.
- id: java-driver-transactions
  title: Java Driver & Transactions
  purpose: Tích hợp Neo4j vào ứng dụng và bảo toàn thao tác nhiều bước.
  objectives:
  - Kết nối bằng Neo4j Java Driver với token phù hợp.
  - Truyền Cypher parameters thay vì ghép chuỗi.
  - Dùng managed transaction và đóng session đúng cách.
- id: explain-profile-van-hanh
  title: EXPLAIN, PROFILE & Vận hành
  purpose: Đọc kế hoạch truy vấn và phát hiện điểm nghẽn trước khi mở rộng.
  objectives:
  - So sánh EXPLAIN với PROFILE.
  - Phát hiện label scan, Cartesian product và DB hits lớn.
  - Theo dõi truy vấn chậm, quyền truy cập và sao lưu phù hợp.
