menu:
- level1: Tư duy Cassandra
  level2:
  - Apache Cassandra là gì và những bài toán phân tán mà hệ được thiết kế để giải quyết
  - Mô hình cột rộng, phân vùng dữ liệu và khác biệt với kho phân tích dạng cột
  - Phân biệt Cassandra, CQL, driver và ứng dụng Java
  - 'Bản đồ thuật ngữ: keyspace, table, partition, row, node, replica và cluster'
  - Luồng từ truy vấn ứng dụng đến nút điều phối và các bản sao
  - Mục tiêu về mở rộng tải, tính sẵn sàng, độ bền và các đánh đổi
  - Thiết kế theo truy vấn và vai trò của khóa phân vùng
  - Phạm vi nguyên tử, mức nhất quán và cập nhật có điều kiện
  - Tình huống phù hợp với dữ liệu sự kiện, lịch sử hoặc truy cập theo khóa
  - Giới hạn cần cân nhắc với JOIN, ràng buộc quan hệ và giao dịch theo phiên bản
  - Phân biệt Apache Cassandra với dịch vụ tương thích hoặc sản phẩm mở rộng
  - Trình tự học từ mô hình cụm và dữ liệu đến CQL, ứng dụng và vận hành
- level1: Môi trường thực hành
  level2:
  - Chọn phiên bản Cassandra, JDK và driver tương thích
  - Chuẩn bị CPU, RAM, đĩa, hệ điều hành và đồng bộ thời gian
  - Cài đặt bằng gói hệ điều hành, máy ảo hoặc container
  - Khởi tạo một nút và kiểm tra trạng thái sẵn sàng
  - Thiết kế cụm thử nhiều nút, tên cluster và địa chỉ liên lạc
  - Volume bền vững, thư mục dữ liệu, commit log, hints và saved caches
  - Cấu hình cơ bản trong cassandra.yaml và các file liên quan
  - Kết nối bằng cqlsh và xác định phiên bản server/CQL/protocol
  - Tạo keyspace, tài khoản và dữ liệu mẫu cho thực nghiệm
  - Thử khởi động lại, mất một nút và đối chiếu dữ liệu
  - Tách môi trường phát triển, kiểm thử và vận hành
  - Tái tạo môi trường và quản lý cấu hình thực hành có thể kiểm chứng
- level1: Công cụ và kết nối
  level2:
  - Sử dụng cqlsh để chạy câu lệnh và script
  - DESCRIBE, USE, SOURCE và quản lý ngữ cảnh keyspace
  - CONSISTENCY, SERIAL CONSISTENCY, PAGING và TRACING trong cqlsh
  - Native protocol, cổng truy cập ứng dụng và tương thích giao thức
  - Địa chỉ listen/broadcast, kết nối giữa nút và từ ứng dụng
  - Seed node và vai trò khởi tạo thông tin thành viên
  - Phân giải tên, mạng container, firewall và kiểm tra đường kết nối
  - Chứng thực, thông tin đăng nhập và kết nối TLS
  - Đọc lỗi cú pháp, lỗi xác thực, unavailable và timeout
  - COPY trong cqlsh, giới hạn quy mô và công cụ nạp dữ liệu thay thế
  - system_schema, system_views và metadata phục vụ thực hành
  - Ghi lại câu lệnh, cấu hình phiên và kết quả để tái hiện thí nghiệm
- level1: Kiến trúc cụm
  level2:
  - Kiến trúc ngang hàng và vai trò nút điều phối theo từng yêu cầu
  - Quan hệ giữa node, rack, datacenter và cluster
  - Luồng ghi từ ứng dụng đến coordinator và replica
  - Luồng đọc, phản hồi digest và hợp nhất phiên bản
  - Gossip và truyền thông tin trạng thái thành viên
  - Failure detector và giới hạn suy luận một nút đã ngừng hoạt động
  - Snitch, thông tin topology và lựa chọn bản sao theo miền lỗi
  - Seed node, bootstrap và phân biệt với vai trò leader
  - Internode messaging, native transport và các loại lưu lượng
  - Phân vùng mạng, nút chậm và sự khác biệt với lỗi dừng hoàn toàn
  - Metadata cụm, schema agreement và thay đổi theo phiên bản
  - Background task, streaming và phối hợp các tài nguyên
  - Đọc sơ đồ cụm và truy vết một yêu cầu thực tế qua các nút
- level1: Token và sao chép
  level2:
  - Partitioner và ánh xạ khóa phân vùng thành token
  - Token ring, khoảng token và quyền sở hữu dữ liệu
  - Virtual node và đánh đổi trong phân phối/cân bằng
  - Replication factor và tập bản sao của một phân vùng
  - NetworkTopologyStrategy và bố trí bản sao theo datacenter/rack
  - SimpleStrategy trong thực nghiệm và giới hạn lựa chọn topology
  - Phân biệt số nút, số token và số bản sao
  - Vai trò replica và coordinator khi một nút bất kỳ nhận yêu cầu
  - Xác định endpoint của một khóa từ công cụ vận hành
  - Chênh lệch dung lượng hoặc tải dù số token tương đương
  - Ảnh hưởng của thay đổi RF đến dữ liệu đã tồn tại
  - Đặt bản sao theo miền lỗi và kiểm chứng khả năng chịu mất nút
  - Luồng truyền dữ liệu khi thêm, rút hoặc thay thế một nút
- level1: Nhất quán đọc/ghi
  level2:
  - Mức nhất quán điều khiển số phản hồi cần chờ cho từng thao tác
  - ONE, TWO, THREE, QUORUM và ALL
  - LOCAL_ONE, LOCAL_QUORUM và EACH_QUORUM theo phạm vi hỗ trợ
  - ANY cho thao tác ghi và quan hệ với hinted handoff
  - Tính số phản hồi quorum từ RF và phạm vi datacenter
  - Điều kiện giao nhau của quorum đọc/ghi và các giả định kèm theo
  - Phân biệt giao nhau quorum với bảo đảm tuyến tính hóa mọi cập nhật đồng thời
  - Độ mới của kết quả đọc và xử lý nhiều phiên bản dữ liệu
  - Read-after-write, mức đọc/ghi và tập bản sao có liên quan
  - SERIAL/LOCAL_SERIAL và phân biệt với mức nhất quán thông thường
  - Ảnh hưởng của lỗi nút, mạng chậm và unavailable đến từng lựa chọn
  - Timeout và kết quả chưa biết của thao tác ghi
  - Giới hạn hạ mức nhất quán khi retry
  - Thiết kế mức nhất quán từ yêu cầu nghiệp vụ
  - Thực nghiệm nhiều phiên và mất nút để kiểm chứng điều kiện đọc/ghi
- level1: Keyspace và schema
  level2:
  - Keyspace là phạm vi cấu hình sao chép và chứa đối tượng dữ liệu
  - CREATE/ALTER/DROP KEYSPACE và kiểm tra thuộc tính replication
  - CREATE TABLE, cột, primary key và table option
  - Tên đối tượng, quoted identifier và phân biệt hoa/thường
  - IF NOT EXISTS/IF EXISTS và giới hạn kiểm tra định nghĩa đã tồn tại
  - 'ALTER TABLE: thêm, bỏ, đổi thuộc tính và điều kiện thay đổi kiểu'
  - Schema agreement và cách quan sát trạng thái chưa đồng bộ
  - DDL trong cụm đang có nhiều phiên bản ứng dụng
  - System keyspace và ranh giới dữ liệu người dùng
  - system_schema và trích xuất định nghĩa phục vụ đối soát
  - Comment, quy ước đặt tên và tài liệu hóa lựa chọn thiết kế
  - TRUNCATE/DROP và các điều kiện an toàn trước thao tác
- level1: Kiểu dữ liệu
  level2:
  - Chọn kiểu theo miền giá trị, độ chính xác và mẫu truy cập
  - tinyint, smallint, int, bigint và varint
  - decimal, float, double và dữ liệu tiền tệ
  - text, varchar, ascii và Unicode
  - blob, boolean, inet và ánh xạ dữ liệu nhị phân/địa chỉ
  - uuid, timeuuid và yêu cầu về định danh hoặc thứ tự
  - timestamp, date, time và độ chính xác thời gian
  - duration và giới hạn ngữ nghĩa theo thao tác hỗ trợ
  - NULL, giá trị chưa được lưu và UNSET từ driver
  - list, set, map và lựa chọn cấu trúc dữ liệu
  - tuple, UDT, frozen và ngữ nghĩa lưu trữ
  - vector hoặc kiểu bổ sung theo phiên bản
  - Kiểu dữ liệu trong khóa và các ràng buộc tương ứng
  - Chuyển kiểu, literal, dữ liệu biên và ánh xạ sang Java
- level1: Khóa và phân vùng
  level2:
  - Quan hệ giữa primary key, partition key và clustering column
  - Khóa phân vùng đơn và khóa phân vùng ghép
  - Khóa phân cụm và thứ tự lưu các hàng trong phân vùng
  - CLUSTERING ORDER BY và truy vấn theo khoảng
  - Static column và dữ liệu dùng chung trong một phân vùng
  - Định danh duy nhất trong phạm vi primary key
  - Kích thước phân vùng theo số hàng, cột và dung lượng
  - Phân vùng lớn, hàng rộng và ảnh hưởng đến đọc/ghi
  - Cardinality khóa, dữ liệu lệch và điểm nóng
  - Khóa tăng dần, thời gian trong khóa và phân phối tải
  - Chia bucket theo thời gian hoặc miền dữ liệu
  - Khóa tenant và giới hạn tenant có quy mô quá lớn
  - Đổi thiết kế khóa bằng bảng mới và kế hoạch di chuyển
  - Ước lượng, đo thực tế và kiểm chứng giới hạn phân vùng
- level1: Thiết kế theo truy vấn
  level2:
  - Thu thập truy vấn, điều kiện lọc, thứ tự đọc và giới hạn kết quả
  - Một nhóm truy vấn và thiết kế bảng phù hợp
  - Chọn partition key từ đường truy cập chủ đạo
  - Chọn clustering column để hỗ trợ sắp xếp hoặc lọc theo khoảng
  - Thiết kế bảng tra cứu và bảng lịch sử theo thời gian
  - Thiết kế dữ liệu sự kiện với bucket và thời hạn lưu
  - Chấp nhận lặp dữ liệu để giảm truy vấn xuyên phân vùng
  - Đánh giá chi phí ghi nhiều bảng và đối soát tính nhất quán
  - Truy vấn phụ hiếm gặp và nhu cầu kho tìm kiếm/phân tích
  - Kiểm soát collection hoặc chuỗi lịch sử tăng trưởng không giới hạn
  - Tính dung lượng từ kích thước bản ghi, RF, chỉ mục và thời gian lưu
  - Thiết kế lại khi mẫu truy cập thay đổi
  - Ví dụ mô hình đơn hàng, hoạt động người dùng hoặc dữ liệu thiết bị
  - Kiểm chứng mô hình bằng CQL, dữ liệu đại diện và số liệu đọc/ghi
- level1: Quan hệ và dữ liệu lặp
  level2:
  - Biểu diễn quan hệ một-một, một-nhiều và nhiều-nhiều
  - Nhúng qua UDT/collection hoặc dùng bảng riêng theo truy vấn
  - Chọn dữ liệu cần sao chép sang bảng tra cứu
  - Xác định bảng nguồn chuẩn và các bảng biểu diễn dẫn xuất
  - Tần suất thay đổi thuộc tính và chi phí cập nhật nhiều bản
  - Ghi đến nhiều bảng (fan-out) và tập hợp dữ liệu tại ứng dụng khi đọc
  - Giới hạn JOIN, khóa ngoại và trách nhiệm duy trì toàn vẹn
  - Đọc dữ liệu từ nhiều bảng trong khi cập nhật đồng thời
  - Ứng dụng sự kiện hoặc công việc nền để đồng bộ dữ liệu lặp
  - Xóa dữ liệu gốc và xử lý dữ liệu phụ thuộc
  - Đối soát, tái xây dựng bảng đọc và sửa chênh lệch
  - Đánh đổi giữa độ mới của dữ liệu với chi phí duy trì nhiều bảng
- level1: SELECT và phân trang
  level2:
  - Cấu trúc SELECT, chọn cột và biểu thức kết quả
  - Điều kiện trên partition key và clustering column
  - Truy vấn theo khóa đầy đủ hoặc theo khoảng trong phân vùng
  - IN, khóa ghép và số phân vùng bị truy cập
  - ORDER BY và các điều kiện tương thích với khóa phân cụm
  - LIMIT, PER PARTITION LIMIT và phạm vi giới hạn
  - DISTINCT, GROUP BY và các ràng buộc CQL cần kiểm tra
  - COUNT, hàm tổng hợp và chi phí đọc thực tế
  - ALLOW FILTERING và đánh giá lượng dữ liệu phải quét
  - TOKEN để chia phạm vi quét có kiểm soát
  - Projection và giảm dữ liệu truyền về ứng dụng
  - Phân trang bằng paging state và giới hạn truy cập tiến
  - Page size, số hàng trả về và dữ liệu đang thay đổi
  - Kiểm chứng truy vấn bằng trace và bộ dữ liệu có trường hợp biên
- level1: Ghi và xóa bằng CQL
  level2:
  - INSERT, UPDATE và ngữ nghĩa ghi theo primary key
  - Upsert và phân biệt ghi mới với thay đổi một phần dữ liệu
  - Chọn cột cập nhật và ảnh hưởng đến các cột không được gửi
  - NULL, UNSET và tác động đến dữ liệu hoặc dấu xóa
  - Ghi giá trị của static column
  - UPDATE collection và thao tác trên từng phần tử
  - DELETE theo cột, hàng, khoảng clustering hoặc phân vùng
  - Ghi dữ liệu không cần đọc trước và giới hạn với thao tác đặc biệt
  - USING TIMESTAMP, USING TTL và điều kiện được phép kết hợp
  - IF NOT EXISTS/IF EXISTS và việc chuyển sang cập nhật có điều kiện
  - TRUNCATE so với DELETE và kế hoạch bảo vệ dữ liệu
  - Kết quả ghi thông thường, applied của lệnh IF và giới hạn thông tin phản hồi
  - Nạp nhiều bản ghi bằng yêu cầu độc lập hoặc BATCH phù hợp
  - Đối chiếu trạng thái trước/sau với hai phiên cập nhật đồng thời
- level1: Timestamp và TTL
  level2:
  - Mutation timestamp và quy tắc last-write-wins
  - Độ chính xác timestamp của mutation so với kiểu timestamp trong dữ liệu
  - Timestamp do driver, client hoặc coordinator cung cấp
  - Sai lệch đồng hồ và cập nhật mang thời điểm quá xa trong tương lai
  - Ghi đồng thời cùng cột và quy tắc phân giải theo timestamp
  - WRITETIME, TTL và quan sát metadata của giá trị
  - TTL cho dữ liệu ghi mới và thời điểm bắt đầu đếm
  - default_time_to_live và TTL được chỉ định trong câu lệnh
  - TTL ở các thành phần collection/UDT theo cách lưu trữ
  - Cập nhật giá trị có TTL và ý nghĩa thời hạn mới
  - Dữ liệu hết hạn logic, tombstone và thu hồi vật lý
  - Giới hạn thời hạn hoặc mốc thời gian hết hạn theo phiên bản
  - Retry với timestamp/TTL và nguy cơ thay đổi kết quả nghiệp vụ
  - Thiết kế dữ liệu theo thời gian, lưu giữ và kiểm thử đồng hồ
- level1: Collection và UDT
  level2:
  - list, set, map và lựa chọn theo ngữ nghĩa dữ liệu
  - Collection nhiều cell so với frozen collection
  - Thêm, sửa, xóa phần tử và chi phí tương ứng
  - List có thứ tự và những thao tác cần đọc trước hoặc không lũy đẳng
  - Map key/value, phần tử không tồn tại và cập nhật có điều kiện
  - Collection không giới hạn và ảnh hưởng đến kích thước hàng/phân vùng
  - tuple, UDT và mô hình hóa cấu trúc lồng nhau
  - CREATE/ALTER TYPE và khả năng tiến hóa schema
  - UDT dạng frozen/non-frozen và cập nhật từng trường
  - NULL, giá trị trống và dấu xóa khi cập nhật cấu trúc
  - Chỉ mục hoặc truy vấn collection theo khả năng phiên bản
  - Ánh xạ collection/UDT sang Java và kiểm thử vòng đọc–ghi
- level1: BATCH và counter
  level2:
  - Mục đích BATCH và phân biệt với giao dịch SQL thông thường
  - LOGGED BATCH, batchlog và khả năng hoàn tất khi coordinator lỗi
  - UNLOGGED BATCH và phạm vi sử dụng phù hợp
  - Phạm vi nguyên tử/cô lập trong cùng phân vùng và qua nhiều phân vùng
  - BATCH nhiều bảng cùng khóa và điều kiện bảo đảm
  - Timestamp trong BATCH và giới hạn suy luận thứ tự các câu lệnh
  - Kích thước BATCH, số phân vùng và tải lên coordinator
  - So sánh BATCH với nhiều yêu cầu bất đồng bộ có giới hạn
  - Kiểu counter và các ràng buộc của bảng counter
  - Tăng/giảm counter, retry và khả năng áp dụng nhiều lần
  - COUNTER BATCH và giới hạn kết hợp với dữ liệu thông thường
  - Thực nghiệm lỗi từng phần và đối chiếu kết quả ghi nhiều bản
- level1: LWT và đồng thời
  level2:
  - Bài toán kiểm tra rồi mới ghi và nguy cơ cạnh tranh
  - IF NOT EXISTS, IF EXISTS và điều kiện trên giá trị
  - Lightweight transaction và cơ chế đồng thuận theo phiên bản
  - Phân biệt đường ghi thông thường với đường ghi có điều kiện
  - Mức nhất quán thông thường và SERIAL/LOCAL_SERIAL
  - Trường applied cùng giá trị hiện tại khi điều kiện thất bại
  - Phạm vi điều kiện theo khóa/phân vùng và giới hạn kết hợp nhiều thao tác
  - Mẫu tạo định danh duy nhất trong phạm vi được bảo đảm
  - Khóa lạc quan bằng cột phiên bản hoặc trạng thái
  - Giữ chỗ tài nguyên và những bất biến không thể suy ra từ một bản ghi
