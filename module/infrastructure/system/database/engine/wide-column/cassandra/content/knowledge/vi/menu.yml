  - Read repair trong đường đọc và phạm vi bảo đảm
  - Speculative retry phía server và phân biệt với driver
  - Đọc theo khoảng/token so với truy vấn một phân vùng
  - Đối chiếu trace, metric và kết quả để xác định chi phí đọc
