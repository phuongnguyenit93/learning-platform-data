- level1: Di chuyển và schema
  level2:
  - Quản lý DDL, table option và lịch sử schema bằng version control
  - Phát hiện schema drift và kiểm tra schema agreement
  - Thêm cột, thay UDT hoặc đổi thuộc tính theo điều kiện phiên bản
  - Thiết kế bảng mới khi cần đổi partition/clustering key
  - Expand/contract với nhiều phiên bản ứng dụng cùng hoạt động
  - Backfill theo khoảng token/bucket và khả năng tiếp tục sau lỗi
  - Nạp dữ liệu bằng cqlsh COPY, sstableloader hoặc công cụ bulk phù hợp
  - Đối chiếu encoding, kiểu số, UUID, timestamp và timezone khi nhập
  - Dữ liệu có TTL và giữ đúng thời điểm hết hạn khi di chuyển
  - Đồng bộ thay đổi tăng thêm trong lúc hệ nguồn tiếp tục ghi
  - Giới hạn tác động đến compaction, dung lượng và tải replica
  - Đối soát dữ liệu nguồn/đích và các bất biến nghiệp vụ
  - Cắt chuyển đọc/ghi, quay lui và dọn bảng cũ theo kế hoạch
- level1: Nâng cấp và tương thích
  level2:
  - Xác định phiên bản server, CQL, native protocol và Java driver
  - Đọc release note, tính năng bị loại bỏ và tham số thay đổi
  - Đường nâng cấp được hỗ trợ và điều kiện nhảy phiên bản
  - Cụm chạy lẫn phiên bản trong giai đoạn chuyển tiếp
  - Thứ tự nâng cấp nút và bảo vệ số bản sao đang phục vụ
  - Sao lưu cấu hình/dữ liệu và diễn tập khôi phục trước thay đổi
  - Tương thích định dạng SSTable và nhu cầu upgradesstables
  - Đối chiếu chỉ mục, compaction strategy, LWT và các tính năng theo release
  - Kiểm tra schema, topology metadata và trạng thái background task
  - Ma trận JDK, driver, Spring Data và giao thức sau nâng cấp
  - Kiểm chứng dữ liệu, truy vấn, độ trễ và lỗi trước/sau
  - Giới hạn downgrade/rollback và tiêu chí dừng hoặc tiếp tục triển khai
- level1: Java driver cơ bản
  level2:
  - Driver cho Apache Cassandra, tọa độ dependency và package theo phiên bản
  - CqlSession là điểm vào và phạm vi dùng chung cho một cụm
  - Contact point, local datacenter và phát hiện topology
  - Thiết lập keyspace, xác thực và TLS
  - Driver configuration, execution profile và giá trị có hiệu lực
  - Quản lý vòng đời session, kết nối và thread pool
  - An toàn đa luồng của session, statement và đối tượng dữ liệu
  - SimpleStatement và thực thi truy vấn đồng bộ
  - ResultSet, Row và lấy giá trị theo tên/chỉ số cột
  - Ánh xạ số, BigDecimal, UUID, Instant và kiểu ngày giờ
  - NULL, UNSET và cách đọc trạng thái thiếu giá trị
  - TypeCodec, generic type và cấu trúc collection/UDT
  - Metadata schema/topology và điều kiện cập nhật
  - Load balancing, định tuyến theo token và locality
  - Giới hạn tài nguyên và tách cấu hình giữa môi trường
- level1: Truy vấn từ Java
  level2:
  - PreparedStatement, BoundStatement và bước chuẩn bị/bind/thực thi
  - Cache prepared statement và chi phí chuẩn bị lặp
  - Bind theo vị trí/tên và kiểm tra đúng kiểu dữ liệu
  - Chọn NULL hoặc UNSET khi cập nhật cột
  - QueryBuilder, identifier và tránh nối đầu vào vào CQL
  - Routing key và điều kiện định tuyến theo token
  - Consistency level, serial consistency và execution profile của statement
  - Timeout, page size và thuộc tính theo từng truy vấn
  - Lấy kết quả LWT qua wasApplied và các cột liên quan
  - BatchStatement và giới hạn theo loại/bản ghi/phân vùng
  - Cập nhật counter, collection và đánh giá tính lũy đẳng
  - PagingState, khôi phục trang và ràng buộc với truy vấn gốc
  - Bảo vệ token phân trang khi đưa ra giao diện ứng dụng
  - Object mapper/DAO và chi phí trừu tượng hóa
  - Kiểm chứng CQL phát sinh, dữ liệu trả về và số lần trao đổi mạng
  - ExecutionInfo, coordinator, cảnh báo và QueryTrace từ driver
- level1: Retry và lỗi Java
  level2:
  - Phân loại lỗi chuẩn bị truy vấn, lỗi đầu vào và lỗi thực thi
  - Authentication/Unauthorized, SyntaxError và InvalidQuery
  - Unavailable, ReadTimeout, WriteTimeout và phạm vi kết quả chưa rõ
  - DriverTimeout, AllNodesFailed và thông tin lỗi theo từng nút
  - ReadFailure/WriteFailure, Overloaded và tải server
  - Default retry policy, điều kiện kích hoạt và các lỗi được xử lý riêng
  - Cờ idempotent và trách nhiệm xác định ngữ nghĩa thao tác
  - Giới hạn retry với counter, list, TTL và cập nhật có điều kiện
  - Retry cùng nút hoặc nút khác và ảnh hưởng locality
  - Chính sách hạ consistency level và nguy cơ vi phạm yêu cầu nghiệp vụ
  - Speculative execution và phân biệt với retry
  - Deadline toàn nghiệp vụ, backoff và tránh nhân số lần thử qua nhiều lớp
  - Đối soát kết quả chưa biết và chống ghi trùng bằng thiết kế nghiệp vụ
- level1: Bất đồng bộ và reactive
  level2:
  - executeAsync, CompletionStage và AsyncResultSet
  - Phân biệt hoàn tất yêu cầu với đã đọc hết mọi trang kết quả
  - hasMorePages/fetchNextPage và kết hợp các trang bất đồng bộ
  - Chuỗi xử lý lỗi, phục hồi và truyền ngữ cảnh ứng dụng
  - Callback trên luồng driver và giới hạn gọi thao tác chặn
  - Giới hạn số yêu cầu đồng thời thay vì gửi không kiểm soát
  - Request throttler, hàng đợi và thời gian chờ
  - Reactive API, Publisher và điều kiện hỗ trợ theo driver
  - Subscription, nhu cầu nhận dữ liệu và vòng đời kết quả
  - Hủy Future/subscription và công việc còn chạy phía server
  - Phối hợp timeout, retry và phản hồi áp lực tải
  - Đo bộ nhớ, độ trễ và thông lượng khi chọn đồng bộ/bất đồng bộ
- level1: Spring Boot và Spring Data
  level2:
  - Cấu hình Cassandra trong Spring Boot và ma trận phiên bản thư viện
  - CqlSession bean, auto-configuration và quản lý vòng đời
  - Contact point, local datacenter, keyspace và cấu hình theo môi trường
  - Secret, xác thực, TLS và execution profile trong ứng dụng
  - '@Table, @Column và ánh xạ tên định danh'
  - '@PrimaryKey, @PrimaryKeyClass, @PrimaryKeyColumn và thứ tự khóa'
  - Mapping collection/UDT, enum, thời gian và custom converter
  - CassandraTemplate/CassandraOperations và kiểm soát CQL
  - Repository, derived query, @Query và giới hạn biểu đạt
  - Slice, paging state và chi phí đếm tổng kết quả
  - Optimistic locking qua @Version và cơ chế cập nhật có điều kiện
  - Ranh giới @Transactional với bảo đảm CQL/LWT theo khả năng hỗ trợ
  - Schema action, migration và tách thay đổi DDL khỏi khởi tạo ứng dụng
  - ReactiveCassandraTemplate/repository và kiểm soát tải, lỗi, subscription
- level1: Kiểm thử tích hợp
  level2:
  - Chọn phiên bản Cassandra, driver và cấu hình giống môi trường mục tiêu
  - Container/Testcontainers hoặc cụm thử cô lập
  - Phân biệt nút đã khởi động với dữ liệu đã phục vụ được ở CL yêu cầu
  - Tạo/reset keyspace, schema và dữ liệu mẫu
  - Kiểm thử primary key, static column và điều kiện SELECT
  - Kiểm thử NULL/UNSET, collection, UDT và kiểu dữ liệu biên
  - Kiểm thử múi giờ, timestamp, TTL và dữ liệu hết hạn
  - Kiểm thử CRUD, BATCH và giới hạn nguyên tử bằng nhiều phiên
  - Kiểm thử cạnh tranh LWT và kết quả applied
  - Kiểm thử phân trang khi dữ liệu thay đổi
  - Kiểm thử retry/idempotence và kết quả ghi chưa rõ
  - Kiểm thử mapping/repository và CQL thực tế được phát sinh
  - Đối soát dữ liệu lặp, xóa phụ thuộc và các bất biến nghiệp vụ
  - Giới hạn mock/emulator và bằng chứng cần chạy trên engine thật
- level1: Đo tải và lỗi phân tán
  level2:
  - Thiết kế tải đọc/ghi theo truy vấn nghiệp vụ
  - Dữ liệu đại diện về kích thước, phân vùng, TTL và tỷ lệ cập nhật
  - Giai đoạn làm nóng và trạng thái cache/compaction
  - Độ trễ p50/p95/p99, thông lượng và lượng tài nguyên
  - Điều tiết số yêu cầu đồng thời và tránh sai lệch do bộ phát tải
  - So sánh CL, RF, chỉ mục và compaction trên cùng điều kiện
  - Mô phỏng khóa nóng, phân vùng lớn hoặc nhiều tombstone
  - Dừng nút, mất mạng một phần và yêu cầu bị phản hồi chậm
  - Ghi được áp dụng nhưng phản hồi bị mất
  - Thử replica vắng mặt rồi hội tụ bằng hint/repair
  - Đo tải khi bootstrap, streaming, repair hoặc backup
  - Kiểm chứng ảnh hưởng của speculative execution và retry
  - Lưu lịch sử thao tác và kiểm tra bất biến sau sự cố
  - Ghi lại phiên bản, cấu hình, dữ liệu và điều kiện để tái hiện kết quả
- level1: Xử lý sự cố
  level2:
  - Khoanh vùng thời điểm, phạm vi, thay đổi gần nhất và bằng chứng
  - Không kết nối được do địa chỉ, cổng, DNS, firewall hoặc topology
  - Lỗi xác thực, quyền, TLS và chứng thư hết hạn
  - Keyspace/table không tồn tại và schema disagreement
  - InvalidQuery do điều kiện khóa, kiểu dữ liệu hoặc truy vấn không được hỗ trợ
  - Unavailable do không đủ replica để đạt CL
  - ReadTimeout/WriteTimeout và kiểm tra write type, ack hoặc dữ liệu nhận được
  - DriverTimeout/AllNodesFailed và đọc lỗi theo từng nút
  - Tombstone quá nhiều hoặc truy vấn chạm phân vùng lớn
  - Compaction backlog, nhiều SSTable và đĩa gần đầy
  - Memtable/flush bị nghẽn, commit log pressure hoặc dropped message
  - Heap/GC kéo dài, bộ nhớ ngoài heap và tài nguyên hệ điều hành
  - Hot partition, coordinator quá tải hoặc phân bố dữ liệu lệch
  - Hint backlog, replica thiếu dữ liệu hoặc đọc kết quả cũ
  - Repair/streaming bị kẹt và lỗi thay đổi topology
  - LWT contention, xung đột và thao tác có kết quả chưa biết
  - Dữ liệu đã xóa xuất hiện lại hoặc TTL không như mong đợi
  - Đánh giá tác động trước restart, scrub, compact hoặc thay giới hạn
- level1: Tự động hóa vận hành
  level2:
  - Quản lý cấu hình, topology và thay đổi bằng quy trình có thể kiểm tra
  - Khởi tạo cụm tự động và tách bí mật khỏi cấu hình lưu trong mã nguồn
  - Kiểm tra sức khỏe trước/sau bảo trì bằng trạng thái và truy vấn
  - Lập lịch repair dựa trên phạm vi dữ liệu và thời gian giữ dấu xóa
  - Tự động snapshot/backup, kiểm kê và kiểm tra bản sao ngoài cụm
  - Thử restore định kỳ và ghi nhận bằng chứng phục hồi
  - Triển khai lần lượt, giới hạn đồng thời và điều kiện dừng
  - Điều phối bootstrap/decommission mà không lặp thao tác nguy hiểm
  - Vận hành container/Kubernetes và lưu trữ bền vững theo điều kiện môi trường
  - Tách vòng đời nút, địa chỉ, volume và định danh trong tự động hóa
  - Cảnh báo, sổ tay ứng phó và lưu nhật ký thao tác quản trị
  - Kiểm chứng quy trình có thể tiếp tục hoặc quay lui sau lỗi từng phần
- level1: Kiến trúc ứng dụng
  level2:
  - Chọn vai trò Cassandra trong hệ thống và xác định nguồn dữ liệu chuẩn
  - Tách đường ghi nghiệp vụ khỏi bảng đọc theo truy vấn
  - Đồng bộ nhiều bảng và các cửa sổ dữ liệu lệch
  - Idempotency key, trạng thái nghiệp vụ và chống xử lý trùng
  - LWT, bước bù hoặc đối soát khi bất biến vượt một thao tác
  - CDC/commit log và điều kiện khai thác theo phiên bản
  - Đưa dữ liệu sang tìm kiếm hoặc phân tích với tiến độ đồng bộ rõ ràng
  - Cache trước Cassandra và chính sách độ mới dữ liệu
  - Phân tách tenant, hạn mức tài nguyên và tenant có quy mô lớn
  - Thiết kế truy cập nhiều datacenter theo yêu cầu người dùng
  - Giới hạn truy vấn không phù hợp và phối hợp với hệ lưu trữ khác
  - Viết quyết định kiến trúc bằng thử nghiệm, chi phí và các giả định
- level1: Thực hành tổng hợp
  level2:
  - Dựng cụm thử và lập sơ đồ token, bản sao, datacenter
  - Thiết kế bảng lịch sử hoạt động theo tenant và bucket thời gian
  - Mô hình hóa cùng nghiệp vụ bằng các bảng phục vụ truy vấn khác nhau
  - Thực hiện CRUD, TTL và quan sát dữ liệu xóa/hết hạn
  - So sánh ONE/QUORUM/LOCAL_QUORUM trong kịch bản lỗi đã nêu
  - Bảo vệ một bất biến trong phạm vi phù hợp bằng LWT
  - Xây dựng luồng Java với bind, phân trang và giới hạn đồng thời
  - Tích hợp Spring Data, mapping khóa và kiểm thử truy vấn
  - Tái hiện timeout, retry và thao tác ghi có thể bị lặp
  - Đo độ trễ trước/sau thay đổi schema, chỉ mục hoặc cách chia bucket
  - Quan sát compaction, tombstone và đồng bộ replica sau sự cố
  - Diễn tập thêm/thay nút và đối soát dữ liệu
  - Thực hành backup/restore cùng quyền truy cập và TLS
  - Hoàn thiện sơ đồ, quyết định thiết kế và sổ tay bằng bằng chứng thực nghiệm
