roadmap:
- id: ranh-gioi-kien-truc
  title: Ranh giới kiến trúc
  purpose: Xác định thành phần hệ thống và các giới hạn cần bảo vệ bằng quy tắc kiểm tra tĩnh.
  objectives:
  - Phân biệt tầng, gói và module
  - Vẽ sơ đồ phụ thuộc mong muốn
  - Nêu ví dụ xâm phạm ranh giới
- id: huong-phu-thuoc-tang
  title: Hướng phụ thuộc tầng
  purpose: Giữ chiều gọi và chiều phụ thuộc nhất quán với kiến trúc đã chọn.
  objectives:
  - Định nghĩa quan hệ được phép giữa các tầng
  - Phát hiện phụ thuộc ngược từ domain sang hạ tầng
  - Phân biệt phụ thuộc mã và luồng gọi
- id: api-va-noi-bo-module
  title: API và nội bộ module
  purpose: Bảo vệ tính đóng gói bằng cách kiểm soát lớp nào có thể được tham chiếu từ bên ngoài.
  objectives:
  - Xác định public API và implementation nội bộ
  - Phát hiện truy cập trái phép vào internal package
  - Thiết kế quy tắc cho giao tiếp giữa module
- id: gioi-han-phu-thuoc-thu-vien
  title: Giới hạn phụ thuộc thư viện
  purpose: Ngăn các thành phần sử dụng thư viện hoặc framework ngoài phạm vi được cho phép.
  objectives:
  - Lập danh sách dependency được phép và bị cấm
  - Phân biệt phụ thuộc trực tiếp và bắc cầu
  - Kiểm tra việc framework rò rỉ vào domain
- id: chu-trinh-phu-thuoc
  title: Chu trình phụ thuộc
  purpose: Nhận diện coupling vòng tròn gây khó kiểm thử, thay đổi và tái sử dụng.
  objectives:
  - Phát hiện cycle giữa gói hoặc module
  - Giải thích tác động của chu trình
  - Đề xuất tách interface để phá chu trình
- id: dinh-nghia-luat-bang-ma
  title: Định nghĩa luật bằng mã
  purpose: Chuyển nguyên tắc kiến trúc thành kiểm thử tự động, có thông báo lỗi cụ thể.
  objectives:
  - Viết quy tắc lớp và gói với ArchUnit
  - Kiểm tra hướng phụ thuộc và chu trình
  - Chạy thử trên trường hợp đúng và sai
- id: ngoai-le-no-kien-truc
  title: Ngoại lệ & nợ kiến trúc
  purpose: Quản lý vi phạm đã biết có kiểm soát để vẫn phát hiện các hồi quy mới.
  objectives:
  - Phân biệt false positive với vi phạm thực
  - Lập baseline cho các vi phạm hiện hữu
  - Ghi lý do, phạm vi và thời điểm xử lý ngoại lệ
- id: ci-duy-tri-luat
  title: CI & duy trì luật
  purpose: Đưa kiểm tra kiến trúc thành hàng rào chất lượng lặp lại được theo mỗi thay đổi.
  objectives:
  - Chạy kiểm tra trong build hoặc CI
  - Đọc báo cáo vi phạm và truy ngược mã nguồn
  - Cập nhật luật khi kiến trúc được phê duyệt thay đổi
