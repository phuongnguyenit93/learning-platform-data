references:
  - title: "Telegram Bot API"
    url: "https://core.telegram.org/bots/api"
    description: "Tài liệu HTTP API chính thức: getMe, sendMessage, chat_id, định dạng, lỗi và webhook."
  - title: "From BotFather to 'Hello World'"
    url: "https://core.telegram.org/bots/tutorial"
    description: "Hướng dẫn chính thức tạo bot, quản lý token và tích hợp API với ứng dụng Java."
  - title: "Telegram Bot Features"
    url: "https://core.telegram.org/bots/features"
    description: "Quyền bot, nhóm/kênh, bàn phím, định dạng, BotFather và quản trị bot."
  - title: "Bots FAQ"
    url: "https://core.telegram.org/bots/faq"
    description: "Giải đáp về quyền nhận tin, polling/webhook, giới hạn phát thông báo và sự cố phổ biến."
  - title: "Bot Guidelines"
    url: "https://core.telegram.org/bots/guidelines"
    description: "Nguyên tắc thiết kế trải nghiệm bot, nội dung tin nhắn và tương tác phù hợp."