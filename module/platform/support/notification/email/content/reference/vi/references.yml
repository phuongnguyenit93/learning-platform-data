references:
  - title: "Spring Boot – Sending Email"
    url: "https://docs.spring.io/spring-boot/reference/io/email.html"
    description: "Auto-configuration JavaMailSender, spring-boot-starter-mail, thuộc tính spring.mail và timeout."
  - title: "Spring Framework – Email"
    url: "https://docs.spring.io/spring-framework/reference/integration/email.html"
    description: "JavaMailSender, SimpleMailMessage, MimeMessageHelper và gửi email multipart."
  - title: "Amazon SES – SMTP Interface"
    url: "https://docs.aws.amazon.com/ses/latest/dg/send-email-smtp.html"
    description: "SMTP endpoint, credentials, TLS và các điều kiện gửi email qua SMTP."
  - title: "Amazon SES – Verified Identities"
    url: "https://docs.aws.amazon.com/ses/latest/dg/verify-addresses-and-domains.html"
    description: "Xác minh địa chỉ hoặc tên miền người gửi và các hạn chế khi còn trong sandbox."
  - title: "Amazon SES – SPF, DKIM and DMARC"
    url: "https://docs.aws.amazon.com/ses/latest/dg/send-email-authentication-dmarc.html"
    description: "Xác thực domain gửi và nguyên tắc domain alignment của SPF, DKIM và DMARC."
  - title: "SendGrid – Dynamic Email Templates"
    url: "https://www.twilio.com/docs/sendgrid/ui/sending-email/how-to-send-an-email-with-dynamic-templates"
    description: "Template HTML, nội dung cá nhân hóa và gửi transactional email bằng Email API."
  - title: "Amazon SES – Event Notifications"
    url: "https://docs.aws.amazon.com/ses/latest/dg/monitor-sending-activity-using-notifications.html"
    description: "Theo dõi bounce, complaint, delivery và thiết lập event notifications."
  - title: "SendGrid – Event Webhook"
    url: "https://www.twilio.com/docs/sendgrid/for-developers/tracking-events/event"
    description: "Các trạng thái processed, delivered, deferred, bounce, unsubscribe và khuyến nghị bảo vệ webhook."
  - title: "Amazon SES – Email Sending Overview"
    url: "https://docs.aws.amazon.com/ses/latest/dg/send-email.html"
    description: "Các phương thức gửi qua console, SMTP hoặc API và lưu ý khi gửi nhiều người nhận."
  - title: "Amazon SES – Mailbox Simulator"
    url: "https://docs.aws.amazon.com/ses/latest/dg/send-an-email-from-console.html"
    description: "Thực hành kiểm thử delivery, bounce và complaint bằng SES mailbox simulator."