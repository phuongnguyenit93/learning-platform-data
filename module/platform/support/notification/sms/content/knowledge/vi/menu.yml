menu:
- level1: Tổng quan SMS
  level2:
  - SMS là gì và vai trò trong hệ thống thông báo
  - Thông báo giao dịch, nhắc lịch, cảnh báo và mã xác minh
  - Vì sao SMS vẫn hữu ích khi người nhận không có ứng dụng riêng
  - Quan hệ giữa ứng dụng, nhà cung cấp, nhà mạng và điện thoại
  - Hành trình một tin từ sự kiện nghiệp vụ đến người nhận
  - Gửi một chiều khác trao đổi SMS hai chiều như thế nào
  - Phân biệt SMS với MMS, RCS và tin nhắn qua ứng dụng
  - Đánh đổi về tốc độ, chi phí, độ dài và khả năng xác nhận
  - Ranh giới giữa gửi tin thành công và hoàn tất mục tiêu nghiệp vụ
  - Trường hợp nên dùng SMS hoặc chọn kênh thông báo khác
  - Lộ trình học và kiến thức Java, HTTP, dữ liệu cần chuẩn bị
- level1: Hệ thống truyền SMS
  level2:
  - Trung tâm tin nhắn SMSC và cơ chế lưu rồi chuyển tiếp
  - Nhà mạng di động, đơn vị tổng hợp và nhà cung cấp API
  - Tin từ ứng dụng tới thuê bao (A2P) và tin giữa người dùng (P2P)
  - Tin gửi tới thiết bị (MT) và tin phát sinh từ thiết bị (MO)
  - Giao tiếp HTTP API khác kết nối SMPP
  - Tuyến nội địa, quốc tế và phạm vi phục vụ của nhà cung cấp
  - Thời hạn hiệu lực của tin và việc thử chuyển tiếp trên mạng
  - Thiết bị tắt nguồn, ngoài vùng phủ sóng và giao tin muộn
  - Biên nhận giao tin (DLR) và giới hạn quan sát của ứng dụng
  - Tại sao SMS có thể đến chậm, trùng hoặc không đúng thứ tự
  - Bộ lọc của nhà mạng và điều kiện chất lượng tuyến truyền
- level1: Định danh người gửi
  level2:
  - Sender ID là gì và người nhận nhìn thấy thông tin nào
  - Số dài, đầu số ngắn, số miễn cước và tên định danh chữ
  - Tên thương hiệu (brandname) và giới hạn theo thị trường
  - Phân biệt địa chỉ gửi trong API với thông tin hiển thị cuối cùng
  - Định danh một chiều và khả năng nhận tin trả lời
  - Đăng ký sender và kiểm chứng trạng thái được phép sử dụng
  - Quan hệ giữa thương hiệu, mục đích gửi và mẫu nội dung
  - Lựa chọn sender theo quốc gia đích và khả năng tuyến truyền
  - Sender pool và nguyên tắc giữ ổn định người gửi cho cùng người nhận
  - Sender bị thay thế, bị từ chối hoặc không được hỗ trợ
  - Đối chiếu yêu cầu brandname, mẫu tin và loại lưu lượng tại Việt Nam
  - Quản lý định danh theo tenant, môi trường và chủ sở hữu
- level1: Số điện thoại
  level2:
  - Số điện thoại là chuỗi định danh thay vì số để tính toán
  - Mã quốc gia, số quốc gia và tiền tố quay số trong nước
  - Chuẩn hóa định dạng E.164 và giữ dữ liệu đầu vào khi cần truy vết
  - Nhập số nội địa với vùng mặc định rõ ràng
  - Xử lý dấu cộng, khoảng trắng, dấu ngoặc và tiền tố không hợp lệ
  - Dùng libphonenumber để phân tích và định dạng số trong Java
  - isPossibleNumber khác isValidNumber như thế nào
  - Số đúng cấu trúc không chứng minh đang hoạt động hoặc thuộc về người nhập
  - Số di động, cố định, VoIP và khả năng nhận SMS
  - Chuyển mạng giữ số và giới hạn suy luận nhà mạng từ đầu số
  - Số được tái cấp và tác động tới liên kết tài khoản
  - Xác minh quyền kiểm soát số và quy trình thay đổi số
  - Che một phần số điện thoại trong giao diện và nhật ký
- level1: Mã hóa và phân đoạn
  level2:
  - Payload SMS và giới hạn dữ liệu trên mỗi đoạn
  - Bảng ký tự GSM-7 khác ASCII và UTF-8 như thế nào
  - Bảng ký tự mở rộng và ký tự cần hai septet
  - Mã hóa Unicode khi nội dung có ký tự ngoài GSM-7
  - Tiếng Việt có dấu và ảnh hưởng tới cách mã hóa
  - Một ký tự đặc biệt có thể đổi mã hóa của toàn bộ tin
  - Tin đơn và tin ghép nhiều đoạn với User Data Header
  - Ngưỡng độ dài tin đơn, tin ghép và ngoại lệ theo tuyến
  - Đếm số đoạn từ bảng mã thay vì chỉ dùng String.length
  - Emoji, surrogate pair và cách nhà cung cấp xử lý Unicode ngoài BMP
  - Chuẩn hóa Unicode và kiểm thử chữ có dấu dạng tổ hợp
  - Dấu ngoặc thông minh, khoảng trắng đặc biệt và ký tự ẩn
  - Chuyển đổi ký tự tự động và nguy cơ thay đổi ý nghĩa nội dung
  - Ước tính số đoạn sau khi thay biến và rút gọn liên kết
  - So sánh số đoạn dự tính với số đoạn thực tế từ nhà cung cấp
  - Tin ghép thiếu đoạn, đảo đoạn và giới hạn độ tin cậy
- level1: Nội dung và mẫu tin
  level2:
  - Cấu trúc tin ngắn gồm danh tính, thông tin chính và hành động
  - Thiết kế mẫu cho giao dịch, nhắc lịch và cảnh báo vận hành
  - Biến mẫu bắt buộc, tùy chọn và giới hạn độ dài
  - Kiểm tra nội dung sau khi thay biến thay vì chỉ kiểm tra mẫu gốc
  - Định dạng thời gian, múi giờ, tiền tệ và mã tham chiếu
  - Tiếng Việt có dấu, không dấu và lựa chọn có chủ đích
  - SMS văn bản thuần và giới hạn của HTML, Markdown
  - URL trong tin, tên miền thương hiệu và rút gọn liên kết
  - Dữ liệu nhạy cảm cần tránh đưa trực tiếp vào thông báo
  - Phiên bản mẫu và tái hiện nội dung đã gửi
  - Mẫu được phê duyệt và kiểm soát thay đổi theo yêu cầu nhà cung cấp
  - Xem trước nội dung, bảng mã và số đoạn trước khi mở gửi
- level1: Kết nối nhà cung cấp
  level2:
  - Tiêu chí đánh giá độ phủ, độ trễ và chất lượng giao tin
  - Khả năng hỗ trợ sender, tin hai chiều và biên nhận giao tin
  - Phân biệt tài khoản thử nghiệm với tài khoản gửi thật
  - API key, secret, tài khoản phụ và phạm vi quyền
  - Phân biệt SMS API với dịch vụ xác minh OTP được quản lý
  - Đọc hợp đồng request, response, lỗi và webhook
  - Giới hạn tốc độ, hạn mức số dư và điều kiện kích hoạt
  - Kiểm chứng yêu cầu từng quốc gia trước khi lựa chọn tuyến
  - So sánh giá theo đoạn, phụ phí và kết quả giao tin
  - Đặt tiêu chí thử nghiệm thay vì chỉ chọn theo giá niêm yết
  - Quản lý cấu hình nhiều nhà cung cấp mà không gắn chặt nghiệp vụ
- level1: Gửi qua HTTP API
  level2:
  - Thiết kế yêu cầu gửi gồm người nhận, người gửi và nội dung
  - Xác thực HTTP bằng API key, Basic Auth hoặc cơ chế của nhà cung cấp
  - JSON, form-urlencoded và chuẩn mã hóa dữ liệu
  - Cấu hình callback URL, tham chiếu nội bộ và thời hạn tin
  - Phản hồi tiếp nhận cùng mã tin của nhà cung cấp
  - Phân biệt lỗi HTTP với lỗi nghiệp vụ nằm trong response
  - Kết quả theo từng người nhận khi API hỗ trợ gửi nhiều đích
  - Truy vấn tin đã gửi và đối chiếu bằng mã tham chiếu
  - Timeout kết nối, timeout phản hồi và kết quả chưa xác định
  - Hỗ trợ idempotency của API và giới hạn theo tài liệu từng dịch vụ
  - Hủy tin còn chờ gửi khi nhà cung cấp hỗ trợ
  - Giới hạn những gì có thể thay đổi sau khi mạng đã tiếp nhận tin
- level1: Vòng đời giao tin
  level2:
  - Phân biệt yêu cầu nghiệp vụ với lần thử gửi và tin của nhà cung cấp
  - Trạng thái chờ xử lý, tiếp nhận, xếp hàng và chuyển ra mạng
  - Trạng thái sent khác delivered như thế nào
  - Biên nhận delivered phản ánh gì và không chứng minh người nhận đã đọc
  - Tin không giao được, hết hạn, bị từ chối và thất bại trước khi gửi
  - Chuẩn hóa trạng thái từ nhiều nhà cung cấp
  - Giữ trạng thái gốc, mã lỗi gốc và ý nghĩa riêng của từng tuyến
  - Mốc thời gian tạo tin, gửi ra mạng và nhận biên nhận
  - Trạng thái trung gian, trạng thái kết thúc và quy tắc chuyển hợp lệ
  - Trường hợp không có DLR hoặc DLR đến rất muộn
  - Trạng thái ở cấp thông điệp khác trạng thái từng đoạn SMS
  - Đặt thời hạn đối soát mà không tự suy diễn đã giao thành công
  - Phản hồi hoặc xác nhận nghiệp vụ từ người nhận là sự kiện riêng
- level1: Webhook biên nhận
  level2:
  - DLR webhook và luồng cập nhật từ nhà cung cấp vào ứng dụng
  - Đăng ký callback theo tài khoản, dịch vụ hoặc từng tin
  - Nhận dữ liệu JSON, form hoặc query theo đúng hợp đồng
  - Xác minh chữ ký, secret hoặc cơ chế xác thực được hỗ trợ
  - Bảo toàn URL, body và tham số cần dùng khi kiểm tra chữ ký
  - Ảnh hưởng của reverse proxy tới xác thực webhook
  - Liên kết mã tin nhà cung cấp với lần thử gửi nội bộ
  - Callback tới trước khi response gửi tin được lưu xong
  - Callback trùng, tới lệch thứ tự và cập nhật trạng thái có điều kiện
  - Tiếp nhận bền vững trước khi trả phản hồi thành công
  - Chính sách gửi lại webhook và thời gian chờ theo từng nhà cung cấp
  - Lưu sự kiện gốc có kiểm soát để phục vụ đối soát
  - Truy vấn API bổ sung khi webhook thiếu hoặc không đáng tin cậy
- level1: Nhận SMS hai chiều
  level2:
  - Điều kiện số gửi và thị trường hỗ trợ tin trả lời
  - Inbound webhook và cấu trúc người gửi, người nhận, nội dung
  - Phân biệt tin người dùng gửi với DLR của tin đi
  - Chuẩn hóa số và tìm ngữ cảnh hội thoại
  - Giải mã nội dung Unicode và tin nhiều đoạn
  - Xác thực nguồn, chống nhận trùng và giới hạn dữ liệu đầu vào
  - Từ khóa đăng ký, hủy nhận và yêu cầu trợ giúp
  - Xử lý từ khóa theo ngôn ngữ và cơ chế của nhà cung cấp
  - Tin trả lời không có ngữ cảnh hoặc từ số chưa được liên kết
  - Phản hồi tự động và phòng ngừa vòng lặp giữa hai hệ thống
  - Định tuyến yêu cầu tới nhân viên hoặc quy trình nghiệp vụ
  - Lưu lịch sử hội thoại theo phạm vi và thời hạn cần thiết
- level1: Tích hợp SMPP
  level2:
  - Khi nào cần SMPP thay vì HTTP API
  - SMSC, ESME và cấu trúc đơn vị giao thức PDU
  - bind_transmitter, bind_receiver và bind_transceiver
  - sequence_number và đối chiếu yêu cầu với phản hồi
  - submit_sm, submit_sm_resp và ranh giới xác nhận tiếp nhận
  - deliver_sm cho tin đến, DLR và phản hồi deliver_sm_resp
  - TON, NPI và địa chỉ nguồn, đích theo hợp đồng kết nối
  - data_coding và kiểm chứng bảng mã được SMSC hỗ trợ
  - UDH hoặc các tham số SAR cho tin ghép theo khả năng đối tác
  - registered_delivery và yêu cầu biên nhận giao tin
  - enquire_link, unbind và quản lý vòng đời phiên
  - Cửa sổ yêu cầu đang chờ, throttling và giới hạn thông lượng
  - Mất kết nối, bind lại và kết quả submit chưa xác định
  - Bảo vệ kết nối bằng cơ chế mạng, TLS hoặc VPN được hỗ trợ
  - Tiêu chí lựa chọn thư viện Java và kiểm thử với SMSC giả lập
- level1: HTTP client trong Java
  level2:
  - Thiết kế SmsProviderClient và mô hình dữ liệu độc lập nhà cung cấp
  - Gọi API gửi SMS bằng java.net.http.HttpClient
  - Ánh xạ JSON hoặc biểu mẫu bằng thư viện phù hợp
  - Bảo toàn chuỗi số điện thoại, mã tin và giá trị tiền tệ
  - Xử lý field tùy chọn và thay đổi response chưa được biết
  - Quản lý timeout, hủy tác vụ và HTTP connection tái sử dụng
  - Gọi đồng bộ hoặc bất đồng bộ và giới hạn executor
  - Chuẩn hóa exception thành lỗi có thể thử lại hoặc cần can thiệp
  - Che thông tin xác thực và số điện thoại trong log HTTP
  - Truyền tham chiếu nội bộ để liên kết request, response, callback
  - Tách retry nghiệp vụ khỏi retry ngầm của HTTP client
  - Kiểm thử client bằng máy chủ HTTP giả lập
- level1: Tích hợp Twilio
  level2:
  - Programmable Messaging và vai trò của Message resource
  - Khởi tạo Twilio Java SDK với cấu hình bên ngoài
  - 'Account, API key và Auth Token: phân biệt mục đích sử dụng'
  - Gửi SMS bằng From hoặc MessagingServiceSid
  - Messaging Service, sender pool và cấu hình gửi
  - Lưu Message SID và trạng thái ban đầu từ response
  - StatusCallback và ánh xạ trạng thái SMS
  - Xác thực X-Twilio-Signature bằng tiện ích SDK Java
  - Truy vấn Message để hỗ trợ đối soát
  - Đọc error code và phân loại lỗi theo tài liệu Twilio
  - Test credentials, số thử nghiệm và giới hạn mô phỏng giao tin thật
  - Phân biệt Programmable Messaging với Twilio Verify cho OTP
  - Kiểm chứng hỗ trợ sender, đăng ký và mẫu tin theo thị trường
- level1: Tích hợp Vonage
  level2:
  - Phân biệt Vonage SMS API với Messages API và Verify API
  - Khởi tạo Vonage Java SDK theo sản phẩm đang sử dụng
  - Xác thực và cấu hình người gửi, người nhận, nội dung
  - Chọn kiểu văn bản hoặc Unicode theo hợp đồng SMS API
  - Đọc kết quả gửi và mã lỗi theo từng tin
  - Lưu message ID, client reference và metadata cần đối soát
  - Tiếp nhận Delivery Receipt và chuẩn hóa trạng thái
  - Nhận SMS đầu vào bằng webhook
  - Xác thực webhook theo cơ chế cụ thể của API được chọn
  - Đối chiếu hạn mức, tài khoản thử và khả năng thị trường
  - Đặt adapter Vonage sau cùng hợp đồng gửi SMS nội bộ
- level1: Tích hợp Spring Boot
  level2:
  - Tổ chức SmsProperties bằng @ConfigurationProperties
  - Kiểm tra thiếu credential, sender hoặc callback URL khi kích hoạt
  - Tạo bean HTTP client, SDK client và adapter nhà cung cấp
  - Lựa chọn RestClient hoặc WebClient theo mô hình ứng dụng
  - Xây SmsNotificationService độc lập controller và nhà cung cấp
  - Thiết kế API nội bộ tiếp nhận yêu cầu gửi
  - Xây controller cho DLR và inbound SMS
  - Filter hoặc interceptor kiểm tra xác thực webhook
  - Ràng buộc đầu vào bằng Bean Validation và kiểm tra số điện thoại
  - '@Async, executor và giới hạn tác vụ nền'
  - Phối hợp transaction cơ sở dữ liệu với outbox
  - Cấu hình profile, biến môi trường và secret store
  - Graceful shutdown khi còn request hoặc công việc gửi đang chạy
  - Kiểm thử cấu hình và controller không phát sinh SMS thật
- level1: Kiến trúc dịch vụ SMS
  level2:
  - Tách thông báo nghiệp vụ khỏi thao tác gọi cổng SMS
  - Hợp đồng yêu cầu gửi và kết quả độc lập nhà cung cấp
  - Cổng giao tiếp và adapter cho từng nhà cung cấp SMS
  - Quy trình kiểm tra người nhận, quyền nhận, mẫu và số đoạn
  - Gửi trực tiếp trong request và đánh đổi với xử lý qua hàng đợi
  - Thành phần tạo thông báo, bộ lập lịch và worker gửi
  - Transactional outbox để không mất sự kiện cùng giao dịch nghiệp vụ
  - Bộ tiếp nhận DLR độc lập với luồng xử lý gửi
  - Định tuyến theo tenant, thị trường, sender và mức ưu tiên
  - Phân chia trách nhiệm điều tiết tải, thử lại và đối soát
  - Khả năng mở rộng đa kênh mà không ép SMS chứa mọi loại nội dung
  - Thiết kế chuyển đổi nhà cung cấp mà vẫn giữ lịch sử thông báo
- level1: Lưu trữ và trạng thái
  level2:
  - Mô hình người nhận, sender, mẫu tin và cấu hình nhà cung cấp
  - Thông báo nghiệp vụ khác tin gửi và từng lần thử như thế nào
  - Lưu snapshot nội dung, bảng mã và số đoạn dự tính
  - Khóa nghiệp vụ, mã tham chiếu nội bộ và mã tin nhà cung cấp
  - Trạng thái chờ, đang gửi, chưa xác định và kết thúc
  - Lưu lịch sử chuyển trạng thái cùng thời gian từ nguồn bên ngoài
  - Cập nhật trạng thái có điều kiện khi nhiều worker cùng xử lý
  - Lease và quyền nhận việc để phục hồi công việc dang dở
  - Lưu sự kiện DLR gốc riêng với trạng thái hiện tại
  - Đối chiếu biên nhận từng đoạn với kết quả của cả thông báo
  - Tách chi phí dự tính với chi phí thực tế được đối soát
  - Chính sách lưu trữ, phân vùng và dọn lịch sử gửi
- level1: Chống trùng và thứ tự
  level2:
  - Phân biệt yêu cầu gửi trùng, request thử lại và SMS tới máy trùng
  - Idempotency key cho API gửi nội bộ
  - Ràng buộc duy nhất theo sự kiện, người nhận và mục đích
  - Cửa sổ lỗi khi nhà cung cấp đã nhận tin nhưng response bị mất
  - Giới hạn của khóa chống trùng khi API đối tác không hỗ trợ idempotency
  - Kết hợp tham chiếu client với truy vấn đối soát khi được hỗ trợ
  - Chống xử lý lặp DLR và tin nhắn đầu vào
  - Inbox cho webhook và giao dịch cập nhật nghiệp vụ
  - Giữ thứ tự gửi theo người nhận hoặc thực thể nghiệp vụ
  - Thứ tự gửi không bảo đảm thứ tự hiển thị trên điện thoại
  - Thông báo trạng thái cũ và quy tắc bỏ qua công việc lỗi thời
  - Hủy tác vụ trùng còn chờ mà không làm mất thông báo hợp lệ
- level1: Lỗi và thử lại
  level2:
  - Phân loại lỗi đầu vào, cấu hình, quyền, hạn mức và mạng truyền
  - Số không hợp lệ, không hỗ trợ SMS và đích bị chặn
  - Sender chưa đăng ký hoặc không phù hợp thị trường
  - Lỗi xác thực, tài khoản chưa kích hoạt và số dư không đủ
  - Lỗi nội dung, mẫu tin và bộ lọc của nhà mạng
  - HTTP 429, throttling và tín hiệu thời gian được thử tiếp
  - HTTP 5xx, mất kết nối và hết thời gian chờ
  - Phân biệt lỗi submit với kết quả giao tin thất bại sau đó
  - Backoff tăng dần, jitter và giới hạn số lần thử
  - Thời hạn nghiệp vụ ngắn hơn thời gian có thể thử lại
  - Tránh thử lại mù khi kết quả gửi còn chưa xác định
  - Circuit breaker và cô lập nhà cung cấp đang gián đoạn
  - Kho lỗi, lý do dừng và quy trình phát lại có kiểm soát
  - Retry do ứng dụng khác cơ chế chuyển tiếp của SMSC như thế nào
- level1: Điều tiết tải
  level2:
  - Giới hạn theo tài khoản, sender, tuyến và quốc gia đích
  - Thông lượng đo theo thông điệp hay số đoạn cần kiểm chứng
  - Rate limiter toàn dịch vụ và hạn mức riêng từng tenant
  - Token bucket, cửa sổ trượt và lựa chọn phù hợp
  - Giới hạn số request HTTP đồng thời và số request mỗi giây
  - Điều tiết gửi bằng số đoạn dự tính thay vì chỉ số công việc
  - Áp lực ngược khi tốc độ tạo tin vượt khả năng gửi
  - Công bằng giữa người nhận và chống một tenant chiếm hết lượt
  - Dùng chung hạn mức khi có nhiều worker
  - Ước lượng độ trễ hàng đợi và thời gian hoàn tất đợt gửi
  - Tôn trọng hạn mức mà không lách bằng xoay sender hoặc tài khoản
  - Đo lỗi throttling để điều chỉnh cấu hình có căn cứ
- level1: Lập lịch và ưu tiên
  level2:
  - Gửi ngay, hẹn giờ và lịch nhắc định kỳ trong ứng dụng
  - Lịch do ứng dụng quản lý khác lịch do nhà cung cấp hỗ trợ
  - Lưu thời gian UTC và xử lý múi giờ của người nhận
  - Khoảng giờ không gửi và ngoại lệ theo mục đích thông báo
  - Ưu tiên OTP, cảnh báo khẩn và tin thông thường
  - Hạn chế bỏ đói công việc ưu tiên thấp
  - Gộp nhiều sự kiện thành một thông báo phù hợp
  - Cooldown để tránh bão cảnh báo và gửi lặp cùng nội dung
  - Hủy, hoãn hoặc thay thế tin còn chờ trước thời điểm gửi
  - Khôi phục lịch sau khi ứng dụng ngừng hoạt động
  - Tránh nhiều scheduler tạo cùng công việc
- level1: Định tuyến và dự phòng
  level2:
  - Chọn tuyến theo thị trường, sender và mục đích gửi
  - Đánh giá chất lượng bằng DLR, độ trễ và dữ liệu đối soát
  - Phân biệt mất dịch vụ với một người nhận không giao được
  - Cấu hình nhà cung cấp chính và điều kiện dùng dự phòng
  - Giữ nguyên mã thông báo khi có nhiều lần gửi qua nhiều đối tác
  - Rủi ro gửi trùng khi chuyển tuyến trước khi biết kết quả lần đầu
  - Duy trì thời hạn, tùy chọn nhận và giới hạn chi phí khi đổi tuyến
  - Không chuyển tuyến để vượt qua hủy nhận hoặc yêu cầu đăng ký sender
  - Giới hạn nhà cung cấp được phép dùng theo tenant
  - Khôi phục tuyến chính theo từng đợt thay vì dồn tải đột ngột
  - Chuyển kênh email, push hoặc ứng dụng khi có điều kiện phù hợp
  - Công bố rõ kết quả còn chưa xác định trong trạng thái nghiệp vụ
- level1: Gửi hàng loạt
  level2:
  - Chiến dịch, danh sách người nhận và công việc giao từng tin
  - Tách thông báo giao dịch khỏi chiến dịch có mục đích khác
  - Chụp danh sách đích và loại bỏ bản ghi trùng
  - Kiểm tra lại quyền nhận tại thời điểm chuẩn bị gửi
  - Phân trang và tạo lô mà không nạp toàn bộ dữ liệu vào bộ nhớ
  - Cá nhân hóa mẫu và tính lại số đoạn cho từng người nhận
  - Điều phối lô theo hạn mức nhà cung cấp và ngân sách chiến dịch
  - Checkpoint để tiếp tục khi worker dừng giữa chừng
  - Tạm dừng, hủy hoặc khôi phục chiến dịch
  - Một đích lỗi không làm dừng toàn bộ tập người nhận
  - Gửi thử vào danh sách kiểm thử trước khi mở rộng
  - Báo cáo riêng số tin tiếp nhận, số tin giao và số người phản hồi
- level1: Đăng ký và quyền nhận
  level2:
  - Quyền nhận tin theo mục đích giao dịch, nhắc lịch và quảng bá
  - Lưu bằng chứng đăng ký với nguồn, thời điểm và phạm vi
  - Tùy chọn loại tin, tần suất và khoảng giờ nhận
  - Hủy nhận qua phản hồi SMS hoặc kênh phù hợp với loại sender
  - Từ khóa hủy nhận theo thị trường và nhà cung cấp đang dùng
  - Danh sách không gửi và thứ tự ưu tiên khi có nhiều cấu hình
  - Đồng bộ yêu cầu hủy nhận do nhà cung cấp xử lý
  - Tránh gửi lại cho người đã hủy khi thử lại hoặc đổi nhà cung cấp
  - Quy trình đăng ký lại và xác nhận số còn thuộc người dùng
  - Kiểm soát danh sách nhập từ nguồn bên ngoài
  - Xác minh yêu cầu đăng ký thương hiệu, mẫu và giờ gửi theo quốc gia
  - Theo dõi thay đổi chính sách và lưu nguồn kiểm chứng hiện hành
- level1: OTP qua SMS
  level2:
  - OTP qua SMS giải quyết bước xác minh nào trong ứng dụng
  - Phân biệt xác minh quyền kiểm soát số với xác minh danh tính
  - Tách dịch vụ gửi SMS khỏi dịch vụ sinh và kiểm tra mã
  - Lựa chọn dịch vụ Verify được quản lý hoặc triển khai nghiệp vụ riêng
  - Sinh mã bằng nguồn ngẫu nhiên mật mã
  - Lưu dữ liệu kiểm chứng mã bằng cơ chế bảo vệ phù hợp
  - Thời hạn mã, số lần nhập sai và trạng thái đã sử dụng
  - Ràng buộc mã với tài khoản, phiên và mục đích thao tác
  - Chính sách gửi lại và xử lý mã cũ, mã mới
  - Giới hạn yêu cầu theo số điện thoại, tài khoản, thiết bị và địa chỉ IP
  - Chống dò mã, SMS pumping và lạm dụng phát sinh cước
  - Không ghi OTP vào log, tracing hoặc thông báo lỗi
  - Mã đến trễ, đến sai thứ tự và trải nghiệm nhập mã
  - SIM swap, số tái cấp, lừa đảo và giới hạn bảo mật của SMS
  - Phương thức xác thực thay thế và quy trình khôi phục tài khoản
  - Không coi delivered là bằng chứng người dùng đã xác minh thành công
- level1: Bảo mật và dữ liệu riêng tư
  level2:
  - Bảo vệ API key, secret và tài khoản quản trị nhà cung cấp
  - Cấp quyền tối thiểu và tách credential theo môi trường
  - Luân phiên khóa và thu hồi khi nghi ngờ bị lộ
  - HTTPS, kiểm tra chứng chỉ và cấu hình kết nối tin cậy
  - Xác thực webhook theo đúng cơ chế từng nhà cung cấp
  - Chống phát lại webhook khi hợp đồng có timestamp hoặc định danh sự kiện
  - Giới hạn endpoint gửi để không trở thành cổng phát SMS công khai
  - Phân quyền theo tenant và ngăn gửi tới đích ngoài phạm vi
  - Che số điện thoại, nội dung riêng tư và mã xác minh trong log
  - Mã hóa dữ liệu lưu trữ và quản lý quyền đọc lịch sử tin
  - Giảm dữ liệu nhạy cảm gửi qua SMS vốn không mã hóa đầu cuối
  - Bảo vệ URL chứa mã hoặc thông tin nhận diện người dùng
  - Ngăn giả mạo mẫu, chèn nội dung và sử dụng sender trái phép
  - Giới hạn quốc gia, ngân sách và cảnh báo hành vi gửi bất thường
  - Quản lý thời hạn lưu, xóa dữ liệu và dấu vết truy cập
- level1: Chi phí và đối soát
  level2:
  - Đơn vị tính cước theo đoạn và khác số thông báo nghiệp vụ
  - Ảnh hưởng của Unicode, biến mẫu và URL tới số đoạn
  - Giá theo quốc gia, tuyến, loại sender và hợp đồng
  - Phí thuê số, đăng ký, nhà mạng và các khoản bổ sung
  - Ước lượng chi phí theo kịch bản trước khi mở chiến dịch
  - Lưu giá dự tính, tiền tệ và thời điểm áp dụng
  - Chi phí của tin thất bại hoặc tin không có DLR theo hợp đồng
  - Giới hạn ngân sách theo tenant, ngày và chiến dịch
  - Cảnh báo số dư thấp và thay đổi chi tiêu bất thường
  - Đối chiếu mã tin, số đoạn và hóa đơn nhà cung cấp
  - Xử lý sai lệch chi phí dự tính với chi phí thực tế
  - Đo chi phí trên một kết quả nghiệp vụ thay vì chỉ một lần gọi API
  - Tối ưu nội dung mà không làm sai ý nghĩa hoặc giảm khả năng đọc
- level1: Kiểm thử
  level2:
  - Unit test chuẩn hóa số và kiểm tra vùng mặc định
  - Kiểm thử GSM-7, bảng mở rộng, Unicode và số đoạn
  - Kiểm thử ranh giới độ dài với tiếng Việt, emoji và ký tự ẩn
  - Kiểm thử thay biến làm thay đổi bảng mã hoặc số đoạn
  - Giả lập API tiếp nhận thành công, lỗi tham số và lỗi xác thực
  - Giả lập timeout sau khi nhà cung cấp có thể đã nhận tin
  - Kiểm thử DLR đến trước response, đến trùng và lệch thứ tự
  - Kiểm thử chữ ký webhook qua reverse proxy
  - Kiểm thử trạng thái kết thúc không bị callback cũ ghi lùi
  - Kiểm thử inbox, outbox và quyền nhận việc của nhiều worker
  - Kiểm thử retry, rate limit, lịch gửi bằng đồng hồ giả
  - Kiểm thử hủy nhận trong lúc chiến dịch đang chạy
  - Kiểm thử gửi dự phòng không tạo bản trùng thiếu kiểm soát
  - Kiểm thử OTP hết hạn, sai nhiều lần và yêu cầu gửi lại
  - SMSC giả lập cho phiên SMPP và kết quả submit chưa xác định
  - Tài khoản test hoặc sandbox khác phép thử giao tin qua mạng thật
  - Danh sách số kiểm thử, hạn mức chi phí và ngăn gửi nhầm môi trường
- level1: Quan sát hệ thống
  level2:
  - Chỉ số yêu cầu nhận vào, chờ gửi và lỗi trước khi submit
  - Tách tỷ lệ API tiếp nhận với tỷ lệ DLR báo giao tin
  - Đo độ trễ chờ xử lý, gọi API và nhận biên nhận
  - Theo dõi số tin thiếu DLR hoặc còn trạng thái chưa xác định
  - Độ dài hàng đợi và tuổi công việc cũ nhất
  - Thống kê mã lỗi theo nhà cung cấp, tuyến và quốc gia
  - Theo dõi số đoạn, cước phát sinh và ngân sách còn lại
  - Correlation ID liên kết sự kiện, lần thử gửi, provider ID và webhook
  - Log có cấu trúc không làm lộ số điện thoại hoặc OTP
  - Tracing xuyên dịch vụ, hàng đợi và HTTP client
  - Cảnh báo giảm chất lượng giao tin khác cảnh báo mất kết nối
  - Không phụ thuộc duy nhất SMS để báo sự cố của chính kênh SMS
  - Dashboard theo mục tiêu nghiệp vụ và khả năng đối soát
- level1: Triển khai và mở rộng
  level2:
  - Cấu hình riêng credential, sender, callback và thị trường cho mỗi môi trường
  - Chuẩn bị tên miền, TLS và đường vào webhook
  - Tái tạo đúng URL công khai khi đứng sau reverse proxy
  - Mở rộng worker gửi độc lập thành phần tiếp nhận DLR
  - Kho dữ liệu và hàng đợi bền vững thay cho bộ nhớ tiến trình
  - Hạn mức dùng chung giữa nhiều bản sao ứng dụng
  - Pool HTTP, executor và giới hạn tài nguyên theo thông lượng mục tiêu
  - Triển khai cuốn chiếu với callback tương thích phiên bản cũ, mới
  - Graceful shutdown và xử lý công việc đã nhận nhưng chưa gửi xong
  - Readiness và liveness không tạo thêm SMS hay gọi API trả phí
  - Kịch bản khôi phục khi cơ sở dữ liệu, queue hoặc đối tác gián đoạn
  - Kiểm tra sau triển khai bằng số kiểm thử đã đăng ký
- level1: Vận hành và thay đổi
  level2:
  - Runbook cho gián đoạn đối tác, số dư thấp và giao tin giảm
  - Tạm dừng gửi theo tenant, sender, quốc gia hoặc chiến dịch
  - Điều tra bằng mã tin, mốc thời gian và trạng thái gốc
  - Đối soát định kỳ khi callback thiếu hoặc bị lỗi
  - Phát lại công việc thất bại với quyền hạn và nhật ký rõ ràng
  - Khôi phục outbox, lịch gửi và tiến độ chiến dịch
  - Sao lưu cấu hình đăng ký, trạng thái gửi và dữ liệu cần truy vết
  - Thay credential, sender hoặc callback URL có kiểm chứng
  - Theo dõi thay đổi API, SDK, metadata số và quy tắc tuyến truyền
  - Nâng phiên bản theo từng đợt và so sánh chất lượng gửi
  - Dọn tệp tạm, dữ liệu webhook và lịch sử theo thời hạn
  - Diễn tập sự cố, chuyển tuyến và khôi phục nhà cung cấp chính
- level1: Chẩn đoán sự cố
  level2:
  - HTTP thành công nhưng tin bị từ chối trong response nghiệp vụ
  - API đã nhận nhưng tin không tới do sender hoặc tuyến không hợp lệ
  - Tin giao chậm vì thiết bị, SMSC hoặc hàng đợi ứng dụng
  - DLR báo delivered nhưng người nhận chưa thấy nội dung
  - Tiếng Việt hoặc emoji làm tăng số đoạn và chi phí bất ngờ
  - Tin hiện ký tự lỗi do cấu hình bảng mã không khớp
  - Tin ghép thiếu phần hoặc nội dung không đúng thứ tự
  - Nhóm thuê bao không nhận do hạn chế nhà mạng hoặc thị trường
  - Webhook không tới do TLS, URL, chữ ký hoặc phản hồi không đúng hợp đồng
  - Callback cũ làm trạng thái bị ghi lùi
  - Tin gửi hai lần sau timeout, worker dừng hoặc chuyển nhà cung cấp
  - OTP hết hạn trước khi tới và người dùng yêu cầu gửi liên tục
  - Số đúng định dạng nhưng không còn hoạt động hoặc đã được tái cấp
  - Lỗi SMPP bind, enquire_link, throttling và cửa sổ yêu cầu đầy
  - Chiến dịch ngừng vì hết số dư, chạm hạn mức hoặc sai mẫu
  - Chuẩn bị bằng chứng để làm việc với nhà cung cấp mà không lộ bí mật
- level1: Thực hành tổng hợp
  level2:
  - Chuẩn hóa số Việt Nam và quốc tế bằng libphonenumber
  - Xây bộ tính bảng mã, số đoạn và chi phí dự tính
  - Thiết kế mẫu SMS giao dịch với tiếng Việt và dữ liệu biến đổi
  - Tạo HTTP adapter gửi qua cổng SMS giả lập
  - Tích hợp một nhà cung cấp trong môi trường kiểm thử có hạn mức
  - Xây controller Spring Boot nhận DLR có xác thực
  - Xử lý callback đến trước response, trùng và sai thứ tự
  - Xây outbox, worker gửi và bảng trạng thái có đối soát
  - Thử nghiệm timeout, kết quả chưa xác định và chống gửi trùng
  - Xây giới hạn tốc độ theo tài khoản, sender và số đoạn
  - Tạo chiến dịch có checkpoint, hủy nhận và giới hạn ngân sách
  - Xây quy trình OTP có giới hạn gửi lại và kiểm tra mã
  - Thực nghiệm phiên SMPP với SMSC giả lập khi có nhu cầu tích hợp
  - Diễn tập chuyển nhà cung cấp mà không gửi lại mù
  - Hoàn thiện dashboard, báo cáo chi phí và hướng dẫn xử lý sự cố
