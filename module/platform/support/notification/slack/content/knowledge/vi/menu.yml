menu:
- level1: Tổng quan thông báo Slack
  level2:
  - Slack là gì và vai trò của kênh thông báo trong hệ thống
  - Bài toán cảnh báo vận hành, kết quả tác vụ và cập nhật nghiệp vụ
  - Quan hệ giữa ứng dụng nguồn, bộ gửi, Slack app và người nhận
  - Phân biệt thông báo một chiều với bot hội thoại hoặc ứng dụng tương tác
  - Hành trình từ sự kiện nghiệp vụ đến thông điệp trong Slack
  - Phân biệt Slack chấp nhận thông điệp với người nhận đã đọc hoặc xử lý
  - Khi nào dùng Slack và khi nào cần kênh thông báo khác
  - Kiến thức nền và trình tự học từ webhook đến bộ gửi có thể vận hành
- level1: Mô hình Slack
  level2:
  - Workspace, Enterprise organization và phạm vi cài đặt ứng dụng
  - Channel công khai, channel riêng tư và hội thoại trực tiếp
  - Bot user, thành viên và danh tính của bên gửi
  - Channel ID, user ID, team ID và enterprise ID
  - Message, thread, reply và timestamp ts
  - Slack Connect và phạm vi người có thể nhìn thấy thông báo
  - Phân biệt cấu hình ứng dụng, quyền cài đặt và quyền trong hội thoại
  - Ảnh hưởng của gói dịch vụ, chính sách quản trị và lưu giữ dữ liệu
- level1: Chọn cơ chế gửi
  level2:
  - Incoming Webhook cho thông báo đến một đích được cấu hình
  - Web API với bot token cho định tuyến và quản lý thông điệp
  - So sánh webhook, chat.postMessage và chat.postEphemeral
  - Phân biệt API gửi đi với Events API và Socket Mode nhận sự kiện
  - Khi nào chỉ cần Java Slack SDK và khi nào cần Bolt for Java
  - Tiêu chí chọn channel, thread hoặc tin nhắn trực tiếp
  - Giới hạn của tích hợp legacy và định hướng dùng Slack app hiện đại
- level1: Tạo và cài đặt app
  level2:
  - Chuẩn bị workspace và channel dành cho môi trường phát triển
  - Tạo Slack app bằng cấu hình trực tiếp hoặc App Manifest
  - Thiết lập bot identity và thông tin hiển thị
  - Bật Incoming Webhooks khi chọn cơ chế webhook
  - Khai báo OAuth scopes theo tính năng thực sự cần
  - Cài đặt app vào workspace và xác định quyền được cấp
  - Thêm app vào channel đích và kiểm tra tư cách thành viên
  - Cài đặt lại hoặc cấp lại quyền khi thay đổi scopes
  - Tách app, tài khoản đích và bí mật giữa các môi trường
- level1: Token và quyền
  level2:
  - Bot token, user token và app-level token có vai trò khác nhau
  - Phân biệt OAuth client secret, signing secret và webhook URL
  - chat:write và điều kiện gửi với danh tính bot
  - chat:write.public và phạm vi gửi đến channel công khai chưa tham gia
  - Scopes cho hội thoại trực tiếp, tra cứu người dùng và tải file
  - Nguyên tắc cấp quyền tối thiểu và tránh đọc lịch sử khi không cần
  - auth.test và kiểm tra workspace, danh tính của token
  - Quyền OAuth không thay thế tư cách thành viên hoặc chính sách quản trị
  - Token bị thu hồi, hết hạn hoặc mất hiệu lực sau thay đổi cài đặt
- level1: Định tuyến người nhận
  level2:
  - Dùng ID ổn định thay vì phụ thuộc tên channel hoặc tên hiển thị
  - Ánh xạ loại sự kiện, môi trường và mức độ nghiêm trọng sang đích gửi
  - Gửi đến channel riêng tư và điều kiện app được truy cập
  - conversations.open và gửi thông báo trực tiếp theo quyền được cấp
  - Phân biệt user ID với conversation ID khi gọi API
  - Tra cứu người dùng theo email và đánh giá phạm vi quyền bổ sung
  - Channel đổi tên, bị lưu trữ hoặc app bị xóa khỏi channel
  - Cache ánh xạ đích gửi và điều kiện làm mới
  - Ràng buộc workspace, tenant và người nhận để tránh gửi nhầm
- level1: Incoming Webhook
  level2:
  - Cấu trúc webhook URL và lý do phải bảo vệ như bí mật
  - Gửi HTTP POST với JSON và Content-Type phù hợp
  - Tạo payload text và Block Kit cho webhook
  - Phân biệt HTTP status với body văn bản ok hoặc mã lỗi
  - Channel, username, icon gắn với cấu hình webhook và giới hạn ghi đè
  - Thread reply bằng thread_ts và điều kiện biết timestamp của tin cha
  - Webhook không cung cấp trực tiếp timestamp tin mới trong phản hồi chuẩn
  - Giới hạn cập nhật, xóa và quản lý thông điệp khi chỉ có webhook URL
  - Webhook bị thu hồi, channel bị lưu trữ và lỗi payload
  - Gửi bằng HTTP client Java hoặc Slack.send trong Java Slack SDK
- level1: Web API gửi tin
  level2:
  - chat.postMessage và cấu trúc request, response
  - Authorization Bearer token và gửi JSON
  - channel, text, blocks và nội dung thông báo
  - Phân biệt HTTP 200 với ok=false trong JSON của Web API
  - Lưu channel và ts từ phản hồi thành công
  - response_metadata, warnings và thông tin chẩn đoán
  - unfurl_links, unfurl_media và kiểm soát xem trước liên kết
  - chat.postEphemeral và giới hạn của thông báo không bền vững
  - Phân biệt danh tính bot với tùy chỉnh username hoặc icon theo quyền
  - Kiểm tra tham số, loại token và phạm vi quyền của từng method
  - Message metadata, liên kết nghiệp vụ và phạm vi dữ liệu thành viên workspace có thể đọc
- level1: Định dạng văn bản
  level2:
  - plain_text, mrkdwn và khác biệt với Markdown thông thường
  - Escaping ký tự &, <, > và dữ liệu do người dùng cung cấp
  - In đậm, in nghiêng, code, trích dẫn và xuống dòng
  - Liên kết, nhãn hiển thị và permalink của thông điệp
  - Mention người dùng, nhóm người dùng và channel bằng định danh
  - Kiểm soát @here, @channel, @everyone và tránh thông báo hàng loạt ngoài ý muốn
  - Emoji, Unicode, tiếng Việt và nội dung đa ngôn ngữ
  - Định dạng ngày giờ và múi giờ của người nhận
  - text, blocks và markdown_text theo khả năng của method và SDK
  - Giới hạn độ dài, nội dung bị cắt và cách chia thông báo
- level1: Block Kit
  level2:
  - Block, element, composition object và thứ tự hiển thị
  - Section, header, context, divider và image block
  - Text object plain_text hoặc mrkdwn theo từng vị trí
  - Fields, accessory và bố cục thông tin cô đọng
  - Actions, button và liên kết đến thao tác nghiệp vụ
  - block_id, action_id, value và định danh thành phần tương tác
  - Giới hạn số block, độ dài text và loại phần tử theo surface
  - Top-level text, nội dung cho trình đọc màn hình và bản xem trước thông báo
  - Alt text, tính dễ đọc và không dùng màu làm tín hiệu duy nhất
  - Block Kit Builder, validation và kiểm tra nhiều kiểu màn hình
  - Phân biệt Block Kit với legacy attachments và file đính kèm
- level1: Thread và vòng đời tin
  level2:
  - Gửi tin cha và phản hồi theo thread_ts
  - Phân biệt ts của từng tin với timestamp tin gốc của thread
  - Lưu timestamp dưới dạng chuỗi để tránh mất độ chính xác
  - reply_broadcast và ảnh hưởng đến mức độ hiển thị
  - Cập nhật tin của ứng dụng bằng chat.update
  - Xóa tin bằng chat.delete theo danh tính và quyền tương ứng
  - chat.getPermalink để liên kết đến thông báo đã gửi
  - Thông báo tiến trình, kết quả cuối và tránh ghi đè trạng thái mới bằng trạng thái cũ
  - Giới hạn cập nhật tin ephemeral và thông điệp do danh tính khác gửi
  - Tin bị xóa, channel bị lưu trữ và xử lý tham chiếu không còn hợp lệ
- level1: File và hình ảnh
  level2:
  - Chọn liên kết báo cáo, image block hoặc file được lưu trong Slack
  - files:write và điều kiện chia sẻ file vào hội thoại
  - Lấy upload URL bằng files.getUploadURLExternal
  - Gửi dữ liệu file đến upload URL và kiểm tra kết quả từng bước
  - Hoàn tất, đặt tiêu đề và chia sẻ bằng files.completeUploadExternal
  - FilesUploadV2Request trong Java Slack SDK và luồng upload tương ứng
  - Tải file vào thread và liên hệ với thông báo cha
  - Quản lý kích thước, stream, file tạm và lỗi giữa các bước upload
  - Quyền truy cập ảnh hoặc liên kết ngoài và nguy cơ lộ dữ liệu
  - Di chuyển khỏi files.upload đã ngừng hoạt động
- level1: Java Slack SDK
  level2:
  - Thêm slack-api-client bằng Gradle và quản lý phiên bản phụ thuộc
  - Slack, SlackConfig và phạm vi tái sử dụng đối tượng
  - MethodsClient cho lời gọi Web API đồng bộ
  - AsyncMethodsClient và CompletableFuture cho lời gọi bất đồng bộ
  - ChatPostMessageRequest và builder của các payload API
  - Payload, WebhookResponse và gửi Incoming Webhook
  - Builder của Block Kit thay vì ghép JSON bằng chuỗi
  - Phân biệt IOException, SlackApiException và response có ok=false
  - Cấu hình timeout, proxy và hành vi HTTP client
  - Cơ chế hàng chờ, rate limit và MetricsDatastore của SDK
  - Giới hạn phối hợp của bộ nhớ trong JVM khi chạy nhiều instance
  - Đóng tài nguyên, executor và chờ hoàn tất tác vụ khi ứng dụng dừng
- level1: Tích hợp Spring Boot
  level2:
  - Cấu hình bean cho Slack client và adapter gửi thông báo
  - '@ConfigurationProperties cho thông tin môi trường và đích gửi'
  - Đọc token, webhook URL từ biến môi trường hoặc kho bí mật
  - Validation cấu hình và phát hiện thiếu quyền, thiếu đích gửi
  - Thiết kế SlackNotificationService và kết quả gửi có cấu trúc
  - Tạo template thông báo từ dữ liệu nghiệp vụ
  - Tách lỗi Slack khỏi kết quả giao dịch nghiệp vụ chính
  - '@Async, executor có giới hạn và xử lý ngoại lệ của tác vụ nền'
  - Sự kiện sau commit và giới hạn khi ứng dụng lỗi trước lúc gửi
  - Profile phát triển, kiểm thử và production với đích gửi tách biệt
  - Bolt adapter và khả năng tương thích Servlet khi bổ sung tương tác
- level1: Kiến trúc bộ gửi
  level2:
  - Tách mô hình thông báo nghiệp vụ khỏi payload riêng của Slack
  - Port/adapter cho Slack và các kênh thông báo khác
  - Transactional outbox để ghi nhận thông báo cùng giao dịch dữ liệu
  - Worker đọc outbox hoặc hàng đợi và điều phối gửi
  - Trạng thái chờ gửi, đang gửi, thành công, thất bại và hết hạn
  - Định danh thông báo, số lần thử và lịch sử kết quả
  - Quyền sở hữu tác vụ, lease và chống nhiều worker xử lý đồng thời
  - Lưu workspace, channel, ts và tham chiếu tài nguyên đã tạo
  - Ranh giới giữa hàng đợi bền vững của ứng dụng với hàng đợi SDK
  - Mở rộng nhiều instance mà vẫn giữ hạn mức theo workspace và channel
- level1: Độ tin cậy khi gửi
  level2:
  - Phân biệt gửi ít nhất một lần với bảo đảm không có thông báo lặp
  - Timeout sau khi Slack tiếp nhận và kết quả gửi chưa xác định
  - Khóa chống lặp theo sự kiện, người nhận và mục đích thông báo
  - Giới hạn của chống lặp cục bộ khi chưa lưu được kết quả gửi
  - Phân loại lỗi tạm thời, lỗi vĩnh viễn và lỗi cần sửa cấu hình
  - Retry có exponential backoff, jitter và giới hạn thời gian
  - Phối hợp retry của HTTP client, SDK và worker để tránh nhân số lần thử
  - Dead-letter queue, cách ly payload lỗi và điều kiện phát lại
  - Kiểm tra thời hạn hữu ích trước mỗi lần gửi lại
  - Chỉ ghi nhận gửi thành công sau khi xác minh phản hồi đúng cơ chế API
  - Giữ thứ tự các bản cập nhật thuộc cùng một thông báo
- level1: Rate limit và điều tiết
  level2:
  - Hạn mức theo method, app, workspace và channel
  - Khác biệt giới hạn gửi tin với giới hạn đọc lịch sử hoặc phản hồi
  - HTTP 429, Retry-After và thời điểm được gửi lại
  - Giới hạn tốc độ, số lời gọi đồng thời và kích thước hàng chờ
  - Phối hợp nhiều instance bằng trạng thái điều tiết dùng chung
  - Chia sẻ hạn mức giữa các tác vụ và ưu tiên thông báo quan trọng
  - Gộp thông báo, debounce và tạo bản tổng hợp để giảm nhiễu
  - Backpressure khi tốc độ phát sinh vượt khả năng gửi
  - Đối chiếu hạn mức hiện hành theo method và loại phân phối ứng dụng
  - Giới hạn của AsyncMethodsClient khi trạng thái rate limit chỉ lưu trong một JVM
- level1: Lỗi và kết quả gửi
  level2:
  - Đọc HTTP status, error, warnings và response_metadata
  - invalid_auth, token_revoked, account_inactive và token không hợp lệ
  - missing_scope, no_permission và quyền bị hạn chế
  - channel_not_found, not_in_channel và is_archived của Web API
  - invalid_blocks, invalid_arguments và nội dung vượt giới hạn
  - invalid_payload, no_service, channel_is_archived và lỗi Incoming Webhook
  - ratelimited, HTTP 429 và lỗi dịch vụ Slack tạm thời
  - Phân biệt lỗi DNS, TLS, proxy, connect timeout và đọc phản hồi
  - Chuẩn hóa kết quả gửi mà vẫn giữ mã lỗi gốc và thông tin chẩn đoán
  - Lỗi hoàn tất upload, hủy lịch gửi và cập nhật thông điệp không còn tồn tại
- level1: Thiết kế nội dung
  level2:
  - Tiêu đề, tóm tắt, mức độ nghiêm trọng và hành động tiếp theo
  - Nội dung tối thiểu giúp người nhận hiểu sự kiện mà không mở nhiều liên kết
  - Template cho cảnh báo, kết quả tác vụ, báo cáo và thay đổi trạng thái
  - Liên kết đến nguồn dữ liệu hoặc trang nghiệp vụ có thẩm quyền
  - Chọn bản tin mới, cập nhật tin cũ hoặc thêm phản hồi trong thread
  - Định tuyến theo nhóm phụ trách và tránh gửi cùng nội dung đến quá nhiều nơi
  - Chính sách mention theo mức độ khẩn cấp và trách nhiệm xử lý
  - Ngôn ngữ, múi giờ và dữ liệu được phép hiển thị cho từng người nhận
  - Đăng ký nhận, tắt thông báo, giờ yên lặng và tùy chọn theo loại sự kiện
  - Phân biệt cơ chế gửi của ứng dụng với thiết lập thông báo, DND của người dùng Slack
- level1: Lập lịch thông báo
  level2:
  - Phân biệt scheduler của ứng dụng với chat.scheduleMessage
  - post_at, Unix timestamp và chuyển đổi múi giờ
  - Giới hạn thời gian, số bản tin và payload theo method hiện hành
  - Lưu scheduled_message_id khác với ts của thông điệp đã gửi
  - chat.scheduledMessages.list và theo dõi lịch đã tạo
  - chat.deleteScheduledMessage và điều kiện hủy trước lúc phát
  - Đổi lịch bằng quy trình hủy, tạo lại và xử lý lỗi giữa hai bước
  - Thông báo hết hạn, trạng thái nghiệp vụ thay đổi và điều kiện bỏ gửi
  - Quản lý lịch trùng sau retry hoặc khi nhiều instance cùng lập lịch
- level1: Tương tác thông báo
  level2:
  - Khi nào cần nút xác nhận, nhận xử lý hoặc mở trang nghiệp vụ
  - Bật interactivity và liên kết action_id với bộ xử lý
  - Payload block_actions và thông tin người dùng, workspace, thông điệp
  - Xác nhận tiếp nhận trong thời hạn Slack yêu cầu trước khi xử lý lâu
  - Phân biệt acknowledgment kỹ thuật với xác nhận nghiệp vụ
  - response_url, cập nhật thông điệp gốc và giới hạn sử dụng
  - Xác minh quyền người thao tác trước khi thay đổi dữ liệu nghiệp vụ
  - Chống nhấp lặp, thao tác đồng thời và cập nhật trạng thái cũ
  - Tắt hoặc thay nút sau khi hoàn tất xử lý
  - Phản hồi riêng cho người thao tác mà không làm nhiễu channel
- level1: Events API và Socket Mode
  level2:
  - Nhận sự kiện để hỗ trợ phản hồi, theo dõi tương tác hoặc vòng đời thông báo
  - Chỉ đăng ký loại sự kiện và scopes cần cho tính năng
  - HTTP Request URL, url_verification và xác minh chữ ký
  - Event ID, retry header và xử lý sự kiện lặp
  - Phản hồi sớm rồi chuyển công việc dài sang hàng đợi bền vững
  - Socket Mode với app-level token và connections:write
  - Envelope acknowledgment của Socket Mode khác với xác minh HTTP request
  - Reconnect, vòng đời kết nối và xử lý nhiều instance
  - Bolt for Java để định tuyến event, action và acknowledgment
  - Socket Mode nhận dữ liệu không thay thế Web API gửi thông báo
  - Tránh vòng lặp khi ứng dụng xử lý chính thông điệp do mình gửi
- level1: OAuth và nhiều workspace
  level2:
  - Phân biệt app một workspace với ứng dụng được cài ở nhiều workspace
  - OAuth v2, redirect URI, state và bước trao đổi authorization code
  - Lưu installation theo workspace hoặc enterprise và ngữ cảnh cài đặt
  - Chọn đúng bot token, webhook và đích gửi cho từng installation
  - Phân tách cấu hình, hạn mức và dữ liệu giữa các tenant
  - Token rotation, thời hạn access token và lưu refresh token an toàn
  - Đồng bộ thao tác làm mới token khi nhiều worker cùng sử dụng
  - App bị gỡ, quyền bị thu hồi và dừng tác vụ gửi của installation
  - Thay đổi scopes, cài đặt lại và cập nhật token tương ứng
  - Chính sách quản trị, Slack Connect và giới hạn khi phân phối ứng dụng
- level1: Bảo mật tích hợp
  level2:
  - Bảo vệ bot token, webhook URL, signing secret và OAuth client secret
  - Không đưa bí mật vào mã nguồn, payload hiển thị hoặc nhật ký
  - Xác minh X-Slack-Signature bằng raw body và signing secret
  - Kiểm tra timestamp và chống phát lại request đến endpoint HTTP
  - Phân biệt chữ ký hợp lệ với quyền thực hiện hành động nghiệp vụ
  - Giới hạn workspace, channel và người nhận trong cấu hình được phép
  - Ngăn mention hoặc liên kết ngoài ý muốn từ dữ liệu người dùng
  - Che dữ liệu nhạy cảm trong log, stub, ảnh và file báo cáo
  - Bảo vệ response_url, upload URL và liên kết truy cập có thời hạn
  - Luân chuyển bí mật, thu hồi quyền và xử lý sự cố lộ thông tin
  - TLS, proxy, giới hạn đầu vào và quyền truy cập endpoint tương tác
- level1: Quan sát hệ thống
  level2:
  - Correlation ID từ sự kiện nghiệp vụ đến từng lần gọi Slack
  - Đo số thông báo chờ, gửi thành công, lỗi, hết hạn và bị loại trùng
  - Đo thời gian trong hàng đợi, thời gian API và độ trễ toàn hành trình
  - Theo dõi 429, Retry-After, retry, dead-letter và mức sử dụng hạn mức
  - Phân loại lỗi theo method, workspace và mã lỗi với cardinality được kiểm soát
  - Lưu channel, ts hoặc file ID làm bằng chứng phản hồi gửi
  - Phân biệt đã gửi, đã tương tác và chưa có bằng chứng người dùng đã đọc
  - Micrometer, tracing và log có cấu trúc trong Spring Boot
  - Cảnh báo khi Slack lỗi mà không phụ thuộc duy nhất vào chính kênh Slack
- level1: Kiểm thử
  level2:
  - Kiểm thử template, escaping, mention và payload Block Kit
  - Mock HTTP bằng WireMock hoặc MockWebServer thay cho gửi thật trong kiểm thử tự động
  - Kiểm tra webhook HTTP 200 với body ok và các mã lỗi văn bản
  - Kiểm tra Web API HTTP 200 nhưng ok=false
  - Kiểm thử rate limit, Retry-After và chính sách retry
  - Giả lập mất phản hồi sau khi máy chủ tiếp nhận để kiểm tra khả năng gửi lặp
  - Kiểm thử outbox, lease và nhiều worker xử lý cùng tác vụ
  - Kiểm thử upload nhiều bước, timeout và lỗi hoàn tất file
  - Kiểm thử chữ ký, timestamp, event lặp và quyền của người thao tác
  - Kiểm thử tenant isolation, token rotation và ngừng gửi khi app bị gỡ
  - Kiểm tra hiển thị và quyền truy cập trong workspace thử nghiệm có đích nhận rõ ràng
  - Tách bí mật, dữ liệu và kết quả kiểm thử khỏi môi trường production
- level1: Triển khai và vận hành
  level2:
  - Quản lý cấu hình đích gửi, bí mật và phiên bản Slack SDK theo môi trường
  - Cấp tài nguyên cho worker, executor, connection pool và hàng đợi
  - Ước lượng thông lượng theo workspace, channel và khả năng chịu tải của Slack
  - Graceful shutdown và bảo toàn tác vụ chưa hoàn tất
  - Health check của ứng dụng và kiểm tra phụ thuộc Slack có giới hạn
  - Chạy nhiều instance với lease, rate limiter và token store dùng chung
  - Phục hồi backlog sau downtime mà không gây bão thông báo
  - Xử lý payload lỗi, điều kiện phát lại và lưu lịch sử thao tác vận hành
  - Theo dõi Slack API changelog, thư viện phụ thuộc và phương thức bị thay thế
  - Quy trình đổi channel, thay webhook, xoay token và rollback cấu hình
- level1: Chẩn đoán và chuyển đổi
  level2:
  - Webhook phản hồi thành công nhưng tin không nằm ở channel mong đợi
  - Bot gửi được channel công khai nhưng lỗi ở channel riêng tư
  - HTTP 200 nhưng thông báo thất bại do ok=false
  - Tin bị lặp do retry, worker đồng thời hoặc mất kết quả gửi
  - Block không hiển thị đúng do loại text, surface hoặc giới hạn payload
  - Ảnh không tải do quyền truy cập, URL hết hạn hoặc Slack không truy cập được
  - Thread reply thành tin mới do nhầm channel, ts hoặc thread_ts
  - Tương tác báo lỗi do acknowledgment chậm hoặc cấu hình Request URL
  - Chữ ký không khớp do body bị chuyển đổi, sai secret hoặc lệch thời gian
  - Lỗi 429 kéo dài do retry lồng nhau hoặc nhiều instance dùng trạng thái riêng
  - Chuyển legacy integration sang Slack app với scopes và danh tính rõ ràng
  - Chuyển files.upload sang luồng external upload và kiểm thử hồi quy
- level1: Bài tập tổng hợp
  level2:
  - Gửi thông báo tác vụ bằng Incoming Webhook từ ứng dụng Java
  - Gửi và lưu kết quả chat.postMessage bằng Java Slack SDK
  - Tạo thông báo Block Kit có nội dung dễ đọc và fallback phù hợp
  - Theo dõi tiến trình bằng một tin cha cùng các cập nhật trong thread
  - Tải báo cáo bằng upload V2 và chia sẻ đúng channel
  - Xây bộ gửi Spring Boot với outbox, retry, chống lặp và giới hạn tốc độ
  - Tạo thông báo có nút nhận xử lý với xác minh quyền người thao tác
  - Định tuyến nhiều workspace mà tách biệt token, dữ liệu và hạn mức
  - Diễn tập Slack lỗi, token bị thu hồi, channel bị lưu trữ và phục hồi backlog
  - Hoàn thiện kiểm thử, metrics và quy trình vận hành cho kênh Slack
