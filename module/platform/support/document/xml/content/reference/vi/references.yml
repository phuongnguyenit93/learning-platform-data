references:
  - title: "W3C — XML 1.0 (Fifth Edition)"
    url: "https://www.w3.org/TR/xml/"
    description: "Chuẩn cú pháp XML, well-formedness, element, attribute, entity và encoding."
  - title: "W3C — Namespaces in XML 1.0"
    url: "https://www.w3.org/TR/xml-names/"
    description: "Quy tắc sử dụng namespace URI và prefix để phân biệt tên trong XML."
  - title: "W3C — XML Schema Definition Language (XSD) 1.1"
    url: "https://www.w3.org/TR/xmlschema11-1/"
    description: "Chuẩn mô tả ràng buộc cấu trúc, nội dung, kiểu và hợp lệ của XML."
  - title: "Oracle Java SE 25 — Module java.xml"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.xml/module-summary.html"
    description: "Tổng quan JAXP APIs cho DOM, SAX, StAX, schema validation, XPath và XSLT."
  - title: "Oracle Java SE 25 — javax.xml.xpath"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.xml/javax/xml/xpath/package-summary.html"
    description: "API XPath 1.0 trong JDK để lựa chọn node, đọc attribute và đánh giá biểu thức."
  - title: "Oracle Java SE 25 — javax.xml.transform"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.xml/javax/xml/transform/package-summary.html"
    description: "API Transformer và serialization để xuất hoặc biến đổi XML trong Java."
  - title: "Oracle — JAXP Security Guide"
    url: "https://docs.oracle.com/en/java/javase/25/security/java-api-xml-processing-jaxp-security-guide.html"
    description: "Các cấu hình JAXP giới hạn external resources, entity expansion và xử lý XML không tin cậy."
  - title: "OWASP — XML External Entity Prevention Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html"
    description: "Khuyến nghị phòng chống XXE cho DOM, SAX, StAX và kiểm soát DTD/external entities."