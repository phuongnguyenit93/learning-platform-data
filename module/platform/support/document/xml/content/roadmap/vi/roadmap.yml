roadmap:
- id: xml-cu-phap-co-ban
  title: XML & cú pháp cơ bản
  purpose: Hiểu cấu trúc tài liệu XML và quy tắc để dữ liệu được biểu diễn nhất quán.
  objectives:
  - Phân biệt XML với HTML và JSON theo mục đích
  - Viết XML gồm declaration, root, element và attribute
  - Kiểm tra well-formedness và ký tự escape
- id: namespaces-cau-truc
  title: Namespaces & cấu trúc
  purpose: Dùng namespace và quy ước đặt tên để tránh xung đột khi ghép tài liệu từ nhiều hệ thống.
  objectives:
  - Khai báo xmlns và namespace prefix
  - Phân biệt element với attribute và text node
  - Đọc cấu trúc phân cấp của XML document
- id: dom-sax-stax
  title: DOM, SAX & StAX
  purpose: Chọn mô hình phân tích cú pháp theo kích thước tài liệu và kiểu xử lý cần thực hiện.
  objectives:
  - Phân biệt DOM tree với SAX event và StAX stream
  - Đọc XML bằng JAXP DOM hoặc StAX
  - Nhận diện đánh đổi bộ nhớ và truy cập tuần tự
- id: xpath-trich-xuat-du-lieu
  title: XPath & trích xuất dữ liệu
  purpose: Tìm đúng node và thuộc tính thay vì duyệt thủ công toàn bộ cây XML.
  objectives:
  - Viết XPath theo đường dẫn và điều kiện lọc
  - Lấy text, attribute và tập node cần dùng
  - Xử lý namespace khi truy vấn bằng XPath
- id: xsd-kiem-tra-hop-le
  title: XSD & kiểm tra hợp lệ
  purpose: Định nghĩa hợp đồng tài liệu để phát hiện sai cấu trúc hoặc kiểu dữ liệu.
  objectives:
  - Phân biệt well-formed và valid XML
  - Mô tả element, type và cardinality trong XSD
  - Xác thực XML với SchemaFactory và Validator
- id: tao-chuyen-doi-xml
  title: Tạo & chuyển đổi XML
  purpose: Sinh, xuất và biến đổi tài liệu XML mà vẫn bảo toàn encoding và cấu trúc cần thiết.
  objectives:
  - Tạo document và ghi XML bằng Transformer
  - Đặt encoding, output và định dạng đầu ra
  - Dùng XSLT để chuyển đổi cấu trúc tài liệu
- id: bao-mat-xu-ly-xml
  title: Bảo mật xử lý XML
  purpose: Ngăn parser tải tài nguyên không tin cậy hoặc tiêu tốn tài nguyên ngoài kiểm soát.
  objectives:
  - Nhận diện tấn công XXE và entity expansion
  - Chặn DTD, external entities khi không cần
  - Giới hạn kích thước và tài nguyên lúc parse
- id: kiem-thu-tich-hop
  title: Kiểm thử & tích hợp
  purpose: Đảm bảo XML được xử lý đúng khi tích hợp các dịch vụ có schema và namespace khác nhau.
  objectives:
  - Kiểm thử XML sai cú pháp và sai XSD
  - So sánh nội dung theo node thay vì whitespace
  - Xử lý encoding, thông báo lỗi và interoperability
