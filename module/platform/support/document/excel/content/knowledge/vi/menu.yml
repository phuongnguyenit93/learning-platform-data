  - Tái sử dụng kiểu dáng, phông chữ và định dạng số
  - Giảm thao tác auto-size, gộp ô và tính lại công thức không cần thiết
  - Đọc dữ liệu nguồn theo lô và tránh truy vấn lặp cho từng hàng
  - Giới hạn xử lý đồng thời và tránh chia sẻ workbook giữa các luồng
  - Đo tốc độ, mức dùng bộ nhớ và dung lượng tệp theo dữ liệu thực
  - Thử nghiệm các mức tải và nhận diện điểm nghẽn
  - Đặt giới hạn tài nguyên và xử lý khi vượt ngưỡng
- level1: Bảo mật
  level2:
  - Xem tệp tải lên là dữ liệu không đáng tin cậy
  - Kiểm tra kích thước, định dạng thực và nguồn nhận tệp
  - Nguy cơ ZIP bomb trong XLSX và giới hạn giải nén
  - Giới hạn số sheet, hàng, cột, độ dài ô và thời gian xử lý
  - Ngăn dữ liệu không tin cậy trở thành công thức hoặc liên kết nguy hiểm
  - 'Macro, đối tượng nhúng và tham chiếu ngoài: chính sách tiếp nhận'
  - Phân biệt bảo vệ ô hoặc sheet với mã hóa tệp
  - Mở và ghi tệp được mã hóa trong phạm vi thư viện hỗ trợ
  - Quản lý mật khẩu, tệp tạm và dữ liệu nhạy cảm trong nhật ký
  - Cập nhật thư viện và kiểm tra lỗ hổng của phụ thuộc
- level1: Tích hợp ứng dụng
  level2:
  - Thiết kế dịch vụ nhập và xuất Excel độc lập với giao diện gọi
  - Nhận tệp qua MultipartFile trong ứng dụng Spring khi có nhu cầu
  - Trả tệp tải xuống với Content-Type, Content-Disposition và tên Unicode
  - Lựa chọn trả byte array, tài nguyên tệp hoặc luồng phản hồi
  - Giới hạn tải lên, thời gian chờ và kích thước phản hồi
  - Xử lý đồng bộ so với tác vụ nền cho báo cáo lớn
  - Lưu trữ tệp cục bộ hoặc kho đối tượng và quản lý thời hạn truy cập
  - Quyền truy cập, phạm vi dữ liệu và kiểm tra người tải báo cáo
  - Dọn tệp sau khi hoàn tất, hết hạn hoặc tác vụ thất bại
- level1: Giao dịch và vận hành
  level2:
  - Ranh giới giao dịch khi nhập dữ liệu từ workbook
  - 'Nhập toàn bộ hoặc theo lô: lựa chọn mức độ nhất quán'
  - Nhận diện lần nhập trùng và thiết kế xử lý lặp an toàn
  - Ghi nhận số dòng đã đọc, hợp lệ, thành công và thất bại
  - Phân loại lỗi tệp, lỗi dữ liệu, lỗi hệ thống và lỗi lưu trữ
  - Cơ chế thử lại với lỗi tạm thời và tránh nhân đôi dữ liệu
  - Mã tác vụ, tiến độ và khả năng đối chiếu kết quả nhập hoặc xuất
  - Nhật ký có ngữ cảnh và số liệu vận hành cho tác vụ Excel
- level1: Kiểm thử
  level2:
  - Kiểm thử bộ chuyển đổi kiểu và ánh xạ cột bằng dữ liệu nhỏ
  - Tạo workbook trong bộ nhớ cho kiểm thử đọc và ghi
  - Mở lại tệp xuất để kiểm tra giá trị, kiểu ô và cấu trúc
  - Kiểm thử ô thiếu, hàng rỗng, Unicode và số có số 0 đầu
  - Kiểm thử ngày giờ, số lớn, công thức và ô lỗi
  - Kiểm thử ràng buộc dữ liệu, tên vùng, kiểu dáng và thiết lập in
  - Kiểm thử tệp hỏng, tệp mã hóa và giới hạn tài nguyên
  - Kiểm thử tệp lớn và xác minh dọn tài nguyên sau lỗi
  - Kiểm tra tương thích và bố cục bằng ứng dụng bảng tính thực tế
  - So sánh nội dung có ý nghĩa thay vì so sánh byte của toàn bộ XLSX
- level1: Xử lý sự cố
  level2:
  - Tệp không mở được vì nội dung không khớp phần mở rộng
  - Thông báo Excel đã sửa tệp và cách khoanh vùng thành phần lỗi
  - Mất số 0 đầu hoặc sai độ chính xác khi đọc và ghi số
  - Sai ngày do định dạng, hệ ngày hoặc chuyển đổi múi giờ
  - Công thức hiển thị sai hoặc kết quả chưa được tính lại
  - Vượt giới hạn kiểu dáng hoặc tên sheet không hợp lệ
  - Hết bộ nhớ, đầy đĩa tạm hoặc tệp tạm chưa được xóa
  - Lỗi phông chữ và auto-size trong môi trường không có giao diện
  - Phân biệt lỗi dữ liệu nguồn với lỗi thư viện và lỗi môi trường
- level1: Thực hành tổng hợp
  level2:
  - Xuất danh sách dữ liệu có tiêu đề, kiểu ô và định dạng nhất quán
  - Nhập danh sách có kiểm tra từng dòng và báo cáo lỗi chi tiết
  - Tạo báo cáo nhiều sheet từ một mô hình dữ liệu chung
  - Điền mẫu báo cáo có vùng chi tiết, công thức và phần tổng kết
  - Tạo workbook có danh sách lựa chọn và cảnh báo dữ liệu
  - Đọc tệp lớn theo sự kiện và ghi kết quả theo luồng
  - Thiết kế tác vụ nhập theo lô có xử lý lặp an toàn
  - Hoàn thiện bộ tiêu chí nghiệm thu về dữ liệu, bố cục và tài nguyên
