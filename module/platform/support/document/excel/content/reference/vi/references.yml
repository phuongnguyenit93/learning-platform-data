references:
  - title: "Apache POI - Spreadsheet Overview"
    url: "https://poi.apache.org/components/spreadsheet/"
    description: "Tổng quan HSSF cho .xls, XSSF cho .xlsx và SXSSF để xuất bảng tính lớn."
  - title: "Apache POI - Spreadsheet Quick Guide"
    url: "https://poi.apache.org/components/spreadsheet/quick-guide.html"
    description: "Ví dụ Java tạo, đọc và ghi Workbook, Sheet, Row, Cell, style và data validation."
  - title: "Apache POI - Spreadsheet HOWTO"
    url: "https://poi.apache.org/components/spreadsheet/how-to.html"
    description: "Hướng dẫn API UserModel, SAX event reading và SXSSF streaming với file tạm."
  - title: "Apache POI - Formula Evaluation"
    url: "https://poi.apache.org/components/spreadsheet/eval.html"
    description: "Cập nhật giá trị cache, tính lại công thức và giới hạn FormulaEvaluator."
  - title: "Apache POI - HSSF/XSSF Limitations"
    url: "https://poi.apache.org/components/spreadsheet/limitations.html"
    description: "Các hạn chế khi thao tác chart, macro và pivot table của HSSF/XSSF."
  - title: "Apache POI - Security Guidance"
    url: "https://poi.apache.org/security.html"
    description: "Rủi ro file không tin cậy, tài nguyên, bộ nhớ, ngoại lệ và tệp tạm khi parse."
  - title: "Apache POI - Configuration"
    url: "https://poi.apache.org/components/configuration.html"
    description: "Tùy chọn giới hạn xử lý XML/ZIP và cấu hình an toàn cho tệp Office."
  - title: "Microsoft - Excel Specifications and Limits"
    url: "https://support.microsoft.com/en-us/excel/excel-specifications-and-limits?app=wp"
    description: "Giới hạn hàng, cột, ký tự trong ô và định dạng của Excel hiện đại."