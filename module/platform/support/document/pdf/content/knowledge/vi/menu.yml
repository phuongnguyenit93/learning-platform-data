  - Bộ kiểm thử tệp hỏng, tệp có mật khẩu và tài liệu rất lớn
  - Kiểm tra đầy đủ quy trình tạo, tải xuống và mở bằng trình xem
  - Thực hành xây bộ kiểm thử hồi quy bằng JUnit
- level1: Chẩn đoán lỗi
  level2:
  - Lỗi không tìm thấy font và ký tự không có glyph
  - Chữ tiếng Việt sai dấu hoặc trích xuất thành ký tự lạ
  - Nội dung bị cắt, tràn lề hoặc mất dòng cuối trang
  - Trang trắng và content stream không hiển thị
  - Ảnh ngược hướng, mất trong suốt hoặc sai màu
  - Biểu mẫu có giá trị nhưng không hiển thị khi mở
  - Bookmark và liên kết hỏng sau khi ghép hoặc đổi trang
  - Chữ ký báo thay đổi sau khi đóng dấu hoặc tối ưu
  - PDF mở được nhưng không đạt hồ sơ tiêu chuẩn đã chọn
  - Lỗi cross-reference, trailer và dữ liệu cuối tệp
  - OutOfMemoryError khi kết xuất ảnh hoặc ghép hồ sơ lớn
  - Luồng đóng sớm, tệp bị khóa và đầu ra ghi dở
  - Khác biệt font, tài nguyên và đường dẫn trên Linux
  - Rút gọn tài liệu lỗi và kiểm tra bằng PDFDebugger
  - Lập báo cáo tái hiện lỗi với đầu vào đã khử dữ liệu nhạy cảm
- level1: Vận hành
  level2:
  - Đóng gói font, mẫu và cấu hình trong ứng dụng
  - Môi trường Java headless và các phụ thuộc hệ điều hành
  - Cài OCR, bộ font và dữ liệu ngôn ngữ trong container
  - Phân quyền và hạn mức thư mục tạm
  - Cấu hình bộ nhớ, CPU và giới hạn tiến trình
  - Theo dõi thời gian xử lý, kích thước đầu ra và tỷ lệ lỗi
  - Log có mã tài liệu và mã công việc, không lộ nội dung riêng tư
  - Theo dõi phiên bản thư viện và cảnh báo lỗ hổng
  - Nâng cấp thư viện bằng bộ tài liệu hồi quy
  - Chính sách lưu giữ, dọn dẹp và truy vết kết quả
  - Thực hành triển khai dịch vụ PDF có đo lường và giới hạn tài nguyên
- level1: Thực hành tổng hợp
  level2:
  - Tạo tài liệu kỹ thuật từ Markdown có mục lục và khối mã
  - Xuất hóa đơn tiếng Việt với bảng dài và mã QR
  - Tạo báo cáo có biểu đồ, ảnh và phân trang tự động
  - Điền mẫu hợp đồng, làm phẳng và ký số theo đúng thứ tự
  - Ghép bộ hồ sơ có bookmark và số hồ sơ liên tục
  - Chuyển hồ sơ quét thành PDF tìm kiếm được và đánh giá OCR
  - Trích xuất dữ liệu hóa đơn kèm vị trí nguồn trên trang
  - Tạo bản công khai sau khi xóa dữ liệu nhạy cảm và kiểm chứng
  - Chuẩn bị hồ sơ PDF/A và báo cáo xác minh độc lập
  - Xây dịch vụ xuất PDF hàng loạt với giới hạn tài nguyên
