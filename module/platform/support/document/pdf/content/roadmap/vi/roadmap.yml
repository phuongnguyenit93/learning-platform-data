roadmap:
- id: pdf-cau-truc
  title: PDF & Cấu trúc
  purpose: Hiểu cách PDF lưu trang, văn bản và tài nguyên để chọn đúng thao tác xử lý.
  objectives:
  - Phân biệt PDF có text và PDF dạng scan
  - Xác định page, font và metadata
  - Nhận diện giới hạn khi trích xuất text
- id: pdfbox-setup
  title: PDFBox Setup
  purpose: Thiết lập môi trường Java và chọn công cụ phù hợp với bài toán PDF.
  objectives:
  - Thêm Apache PDFBox vào Maven hoặc Gradle
  - Mở và đóng PDDocument an toàn
  - Phân biệt PDFBox với Apache FOP
- id: tao-pdf-co-ban
  title: Tạo PDF cơ bản
  purpose: Tạo tài liệu PDF bằng mã Java với nội dung và nhiều trang.
  objectives:
  - Tạo PDDocument và PDPage
  - Ghi văn bản bằng content stream
  - Lưu tệp và mở lại để xác nhận
- id: layout-fonts
  title: Layout & Fonts
  purpose: Dàn trang dễ đọc và hỗ trợ dữ liệu tiếng Việt, hình ảnh, bảng biểu.
  objectives:
  - Nhúng font hỗ trợ Unicode
  - Đặt vị trí text, hình và ngắt trang
  - Thử tạo báo cáo từ XSL-FO với FOP
- id: doc-trich-xuat
  title: Đọc & Trích xuất
  purpose: Đọc văn bản và thông tin của PDF mà không giả định thứ tự text luôn đúng.
  objectives:
  - Dùng PDFTextStripper lấy text
  - Đọc số trang và metadata
  - Giải thích khi cần OCR cho PDF scan
- id: ghep-tach-render
  title: Ghép, Tách & Render
  purpose: Biến đổi tài liệu và tạo ảnh xem trước từ các trang PDF.
  objectives:
  - Ghép hai tệp PDF thành một
  - Tách hoặc chọn phạm vi trang
  - Render trang sang PNG để kiểm tra
- id: forms-bao-ve
  title: Forms & Bảo vệ
  purpose: Làm việc với biểu mẫu và áp dụng kiểm soát truy cập cho tài liệu nhạy cảm.
  objectives:
  - Đọc và điền trường AcroForm
  - Thử mã hóa PDF bằng mật khẩu
  - Kiểm tra quyền và không log dữ liệu nhạy cảm
- id: qa-hieu-nang
  title: QA & Hiệu năng
  purpose: Kiểm chứng PDF tạo ra có thể mở, sử dụng đúng mục đích và xử lý an toàn.
  objectives:
  - Kiểm tra font, bố cục và dữ liệu sau lưu
  - Đánh giá PDF/A khi cần lưu trữ dài hạn
  - Thử tệp lớn và giới hạn CPU, bộ nhớ
