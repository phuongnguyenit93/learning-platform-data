references:
  - title: "Apache Beam — Basics of the Beam Model"
    url: "https://beam.apache.org/documentation/basics/"
    description: "Graph DAG, PCollection, PTransform, dependency và parallel processing trên batch/stream."
  - title: "Apache Beam — Programming Guide"
    url: "https://beam.apache.org/documentation/programming-guide/"
    description: "Ghép các transforms, branching pipelines, nguồn/đích dữ liệu, windowing và runners cho Java SDK."
  - title: "Apache Beam — Test Your Pipeline"
    url: "https://beam.apache.org/documentation/pipelines/test-your-pipeline/"
    description: "Unit test và end-to-end test cho Java pipeline bằng TestPipeline, PAssert và DirectRunner."
  - title: "Microsoft Learn — TPL Dataflow"
    url: "https://learn.microsoft.com/en-us/dotnet/standard/parallel-programming/dataflow-task-parallel-library"
    description: "Mô hình block nguồn/đích, message passing, graph scheduling, buffering và degree of parallelism."
  - title: "TensorFlow — tf.Graph"
    url: "https://www.tensorflow.org/api_docs/python/tf/Graph"
    description: "Biểu diễn computation bằng dataflow graph gồm operations và tensors truyền giữa operations."
  - title: "Oracle Java — Flow API"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/Flow.html"
    description: "Publisher, Subscriber, Processor và demand-based flow control/backpressure trong Java."
  - title: "Apache Flink — Documentation"
    url: "https://nightlies.apache.org/flink/flink-docs-stable/"
    description: "Ví dụ xử lý stateful computations trên bounded và unbounded data streams."