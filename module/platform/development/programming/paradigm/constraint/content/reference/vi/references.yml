references:
  - title: "MiniZinc — The MiniZinc Handbook"
    url: "https://docs.minizinc.dev/en/stable/index.html"
    description: "Tài liệu nền tảng về khai báo biến, mô hình hóa constraint satisfaction và optimization độc lập solver."
  - title: "Choco Solver — Declaring Variables"
    url: "https://choco-solver.org/docs/modeling/variables/"
    description: "Giải thích biến nguyên, Boolean, miền giá trị và cách khai báo bằng Java Model."
  - title: "Choco Solver — Handling Constraints"
    url: "https://choco-solver.org/docs/modeling/constraints/"
    description: "Cách khai báo, post và kiểm tra ràng buộc, bao gồm AllDifferent cùng cơ chế propagator."
  - title: "Choco Solver — Search Strategies"
    url: "https://choco-solver.org/docs/solving/strategies/"
    description: "Tổng quan constraint propagation, lựa chọn biến, nhánh tìm kiếm và backtracking khi giải CSP."
  - title: "Google OR-Tools — CP-SAT Solver"
    url: "https://developers.google.com/optimization/cp/cp_solver"
    description: "Hướng dẫn CP-SAT, biến nguyên, constraints, CpModel, CpSolver và trạng thái nghiệm bằng Java."
  - title: "Google OR-Tools — Solving a CP Problem"
    url: "https://developers.google.com/optimization/cp/cp_example"
    description: "Ví dụ từ biến quyết định đến hard constraints và objective để tìm nghiệm tối ưu."
  - title: "Google OR-Tools — Employee Scheduling"
    url: "https://developers.google.com/optimization/scheduling/employee_scheduling"
    description: "Ví dụ thực tế bài toán phân ca, xung đột và các ưu tiên phân công với đoạn mã Java."
  - title: "Google OR-Tools — CP-SAT Troubleshooting"
    url: "https://github.com/google/or-tools/blob/stable/ortools/sat/docs/troubleshooting.md"
    description: "Hướng dẫn xử lý mô hình vô nghiệm, đọc status và tìm ràng buộc gây xung đột."
