references:
  - title: "Reactive Streams — JVM Specification"
    url: "https://github.com/reactive-streams/reactive-streams-jvm"
    description: "Hợp đồng Publisher, Subscriber, Subscription; request(n), terminal signals và non-blocking backpressure."
  - title: "Spring — Project Reactor"
    url: "https://spring.io/projects/reactor/"
    description: "Giới thiệu Reactor, hai kiểu Mono/Flux và vị trí trong hệ sinh thái Spring."
  - title: "Reactor Core — Getting Started"
    url: "https://projectreactor.io/docs/core/release/reference/gettingStarted.html"
    description: "Khởi tạo Reactor với Java và các khái niệm nền để xây dựng reactive pipeline."
  - title: "Reactor Core — Creating and Subscribing"
    url: "https://projectreactor.io/docs/core/release/reference/coreFeatures/simple-ways-to-create-a-flux-or-mono-and-subscribe-to-it.html"
    description: "Tạo Mono/Flux, subscribe, BaseSubscriber, demand và các lựa chọn backpressure."
  - title: "Reactor Core — Threading and Schedulers"
    url: "https://projectreactor.io/docs/core/release/reference/coreFeatures/schedulers.html"
    description: "subscribeOn, publishOn, boundedElastic và cách tránh blocking luồng non-blocking."
  - title: "Reactor Core — Hot Versus Cold"
    url: "https://projectreactor.io/docs/core/release/reference/advancedFeatures/reactor-hotCold.html"
    description: "Khác biệt nguồn hot/cold, share, replay và quan sát kết quả ở nhiều subscriber."
  - title: "Reactor Core — Handling Errors"
    url: "https://projectreactor.io/docs/core/release/reference/coreFeatures/error-handling.html"
    description: "Tín hiệu lỗi kết thúc chuỗi, onErrorResume, timeout và các chiến lược retry."
  - title: "Reactor Core — Testing"
    url: "https://projectreactor.io/docs/core/release/reference/testing.html"
    description: "Kiểm thử chuỗi và thời gian ảo với StepVerifier, TestPublisher, PublisherProbe."
  - title: "Spring Framework — WebFlux"
    url: "https://docs.spring.io/spring/reference/web/webflux.html"
    description: "Ứng dụng HTTP reactive non-blocking, Reactor Mono/Flux và tích hợp Reactive Streams."