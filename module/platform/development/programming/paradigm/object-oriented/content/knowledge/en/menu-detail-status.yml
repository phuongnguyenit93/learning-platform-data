      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Replacing Collaborators at Runtime**

      This lesson examines replacing a collaborator while the program continues running. `CheckoutService` uses the `DiscountPolicy` contract to switch among no discount, VIP discounts, and promotions without recreating the service; this differs from mutating a policy's own state. Learners distinguish selecting a policy once in the constructor, replacing it through a method, and passing one with each request while preserving the contract, consistent results within each checkout, and safety when multiple threads share the service.

      ## 2. Questions Learners Should Be Able to Answer

      ### Replacing References and Choosing Scope

      1. Why does a field of type DiscountPolicy allow the same CheckoutService to use NoDiscount and PercentageDiscount?
      2. How does replacing a collaborator with a new object differ from changing properties on the same shared collaborator?
      3. When are the three approaches of a fixed constructor dependency, runtime setter replacement, and per-request policy parameters appropriate?
      4. Why might a singleton with a shared setter for customer-specific policies apply another customer's discount?

      ### Correctness During Hot Swaps

      1. How does capturing DiscountPolicy in a local variable at the start of checkout keep discount() and code() consistent?
      2. Which reference-replacement and visibility issues do AtomicReference.get/set address, and which business coordination responsibilities do they not replace?
      3. Why must the old Gateway not be closed immediately after a swap if earlier requests are still using it?
      4. Which conditions for discount values, VND units, and error behavior must every new implementation satisfy?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Swapping policies | Predict the amount and policy code on Receipt before and after calls to setDiscountPolicy. |
      | Choosing collaborator scope | Analyze global configuration, user-session, and per-request cases to recommend a constructor, setter, or parameter. |
      | Maintaining consistent snapshots | Explain capturing one DiscountPolicy per checkout and AtomicReference's role during concurrent updates. |
      | Checking contracts and lifecycles | Identify faulty policies that return negative discounts or discounts exceeding the subtotal, and the risk of closing a collaborator still in flight. |
  - slug: composition-006
    title: Constructor or Method Dependency Injection
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Constructor or Method Dependency Injection
    problemSolved: At what scope should an external collaborator be supplied?
    mechanism: Determine whether a dependency is mandatory or task-specific.
    applicationValue: Reduce coupling and test without sending real notifications.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Constructor or Method Dependency Injection**

      This lesson demonstrates dependency injection in plain Java: supplying collaborators externally instead of hard-coding `new` inside a domain class. `OrderNotifier` receives the required `NotificationSender` through its constructor; `AlertService` receives a sender through a method so it can change on each call. Learners compare constructor, method-parameter, and setter injection; distinguish DI, DIP, and IoC; use interfaces appropriately; and avoid null, hidden dependency creation, or closing resources they do not own.

      ## 2. Questions Learners Should Be Able to Answer

      ### Ways to Supply Dependencies

      1. Why does OrderNotifier creating EmailSender with new make it harder to replace the implementation and write fakes?
      2. When should NotificationSender be passed to the constructor and held in a final field throughout the service lifecycle?
      3. When is a method parameter the appropriate place to supply a request-specific dependency?
      4. How does setter injection differ from method-parameter injection in storing state and when readiness is checked?

      ### Designing Abstractions and Understanding Limits

      1. How does Dependency Injection differ from the Dependency Inversion Principle and Inversion of Control?
      2. Why can accepting the NotificationSender interface reduce coupling to implementations without requiring an interface for every class?
      3. Why does supplying a sender through the constructor and then creating another with new inside notifyPaid defeat the intent of DI?
      4. Does constructor injection automatically guarantee thread safety or transfer resource ownership to the service?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Implementing constructor injection | Analyze or create OrderNotifier with a required sender, Objects.requireNonNull, and correct use of the supplied dependency. |
      | Choosing method injection | Design AlertService to send email/SMS with a sender parameter on each call. |
      | Substituting fakes in tests | Use RecordingSender to verify content, recipient, and call counts without sending real notifications. |
      | Distinguishing principles | Explain DI, DIP, and IoC through the relationships among the notifier, abstraction, and composition root. |
  - slug: composition-007
    title: Ownership and Lifecycle of Contained Objects
    status: WRITTEN
    difficult: ADVANCED
    focus: Ownership and Lifecycle of Contained Objects
    problemSolved: Who manages state and closes contained resources?
    mechanism: Define owners and access rights before coding.
    applicationValue: Preserve invariants and avoid file/connection leaks.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Ownership and Lifecycle of Contained Objects**

      This lesson clarifies three often-confused concepts: ownership in a domain model, access paths through Java references, and responsibility for closing system resources. `Order` manages `Line` through a line-adding API and a read-only list to protect invariants; the example of `CsvExporter` opening its own `BufferedWriter` shows that the owner must close the resource using AutoCloseable/try-with-resources. Learners understand why GC does not replace cleanup and why `private final` or List.copyOf may be insufficient when elements remain mutable.

      ## 2. Questions Learners Should Be Able to Answer

      ### Ownership and Data Protection

      1. How does ownership of a component in the Order/Line model differ from multiple variables holding references to one instance?
      2. Why must Order expose addLine for adding lines instead of directly returning its internal mutable List?
      3. What does List.copyOf protect about a list, and what risks remain if its Line elements or objects supplied by callers are still mutable?
      4. When should a component be shared, and when should it be created or controlled by its owner?

      ### Domain and Resource Lifecycles

      1. When an object is removed from Order, does the JVM immediately reclaim its memory, and why?
      2. In the example where CsvExporter opens BufferedWriter itself, who must call close, and why should try-with-resources be used?
      3. If a caller injects a writer into a service as a shared resource, may that service close it on its own?
      4. Why do final fields and the garbage collector not replace a strategy for managing aliases and cleanup?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Designing ownership | Define who creates, modifies, shares, removes, and closes Order/Line components or collaborators. |
      | Preserving aggregate invariants | Analyze a getter that exposes a mutable List and fix it with immutable value objects, copies, or a restricted API. |
      | Distinguishing lifecycles | Explain the difference between removing a component relationship in the domain and the conditions for GC of an object on the heap. |
      | Cleaning up resources responsibly | Design an AutoCloseable owner using try-with-resources and compare owned resources with borrowed ones. |
  - slug: composition-008
    title: Refactoring Inheritance to Composition
    status: WRITTEN
    difficult: ADVANCED
    focus: Refactoring Inheritance to Composition
    problemSolved: How can extends be removed without breaking clients or contracts?
    mechanism: Refactor incrementally based on observable behavior.
    applicationValue: Improve the separation of domain logic and persistence and make testing easier.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Refactoring Inheritance to Composition**

      This lesson guides a controlled architectural refactoring when the domain class `OrderService` extends the storage class `OrderStore` solely to reuse save/find. In the new design, `OrderRepository`, supplied through the constructor, handles storage, while the service retains its domain API and delegates to the repository. Learners must do more than replace extends with a field: they need to inventory callers and subtype assignments, document behavior and errors, migrate incrementally, write fake/integration tests, and handle API changes before removing inheritance.

      ## 2. Questions Learners Should Be Able to Answer

      ### Evaluating the Current Inheritance Relationship

      1. Why is OrderService extends OrderStore an incorrect is-a relationship, and which infrastructure methods does it expose?
      2. How does the new design separate responsibilities among OrderService, OrderRepository, and InMemoryOrderRepository?
      3. Which call replaces super.save through composition + delegation while preserving domain responsibilities?
      4. When should inheritance be retained because a subclass is a valid subtype or a framework provides clear inheritance hooks?

      ### Migration Planning and Testing

      1. Before removing extends, which assignments of OrderService to OrderStore variables and which callers using inherited methods must be reviewed?
      2. Which inputs, exceptions, call ordering, transactions, and side effects must be recorded to preserve behavior?
      3. Why can a fake repository demonstrate service interactions without proving the transactions and persistence of the real adapter?
      4. When replacing protected hooks or inherited state, how should responsibilities be moved and invariants preserved?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Detecting inheritance used for code reuse | Identify signs of coupling and misplaced API responsibilities in OrderService extends OrderStore. |
      | Designing the composition version | Sketch OrderRepository, its in-memory implementation, and OrderService receiving the repository through its constructor. |
      | Planning migration | List caller/subtype uses, contracts, and incremental migration steps before removing extends. |
      | Verifying behavior | Design tests for valid/invalid orders, save call counts, stored data, and required integration cases. |
- slug: relationships
  title: Relationships
  childs:
  - slug: relationships-001
    title: Associations Between Objects
    status: WRITTEN
    difficult: BASIC
    focus: Associations Between Objects
    problemSolved: Which objects does an association connect, and how do links change?
    mechanism: Ask which objects are actually linked at runtime.
    applicationValue: Model instance relationships correctly, including assignment, transfer, and removal APIs.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Associations Between Objects**

      Understand associations as relationships between specific objects and how to represent those links in Java. Through the Ticket–Agent example, learners distinguish references, navigability, multiplicity, and lifecycle ownership so they can change links while preserving business rules.

      ## 2. Questions Learners Must Be Able to Answer

      ### Associations and Actual Object Links

      1. How does a relationship between two classes differ from the current link between a Ticket and an Agent, and what changes when the assignee changes?
      2. Why is the `Ticket.assignee` field only a reference, rather than proof that Agent owns Ticket's lifecycle?
      3. In the Ticket–Agent diagram, how should the `0..1` and `0..*` multiplicities near each end be interpreted?

      ### Implementing and Maintaining Links

      1. When transferring a ticket from Lan to Minh in a bidirectional model, which sides must `changeAssignee()` update, and why?
      2. When is storing only `Ticket → Agent` and using a repository for reverse queries preferable to storing both directions?
      3. If a Student–Course link has its own enrollment date or status, why should an `Enrollment` object be considered instead of two separate Sets?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Recognize associations | Identify class-level relationships and links between specific instances in a Ticket assignment scenario. |
      | Read cardinality and navigability | Correctly interpret `0..1`/`0..*` constraints and which end can navigate to the other. |
      | Maintain link consistency | Analyze the steps for removing the old link, changing the reference, and adding the new link when transferring an assignee. |
      | Choose storage directions | Explain when a single association field suffices and when a reverse link or repository query is needed. |
      | Protect relationship APIs | Recognize exposed mutable Sets, unstable equals/hashCode rules, and missing association objects when links have attributes. |
  - slug: relationships-002
    title: Temporary Dependencies and Persistent Associations
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Temporary Dependencies and Persistent Associations
    problemSolved: How does a dependency within one operation differ from an association stored as state?
    mechanism: Ask whether a collaborator is needed for an operation or a relationship must be stored.
    applicationValue: Avoid confusing service dependencies with business state and lifecycles.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Temporary Dependencies and Persistent Associations**

      Distinguish using a collaborator during an operation from an association retained as part of business state. This lesson helps learners choose method parameters, fields, constructor injection, and appropriate UML notation without inferring object lifetimes from variable scope or dependency names.

      ## 2. Questions Learners Must Be Able to Answer

      ### Dependencies and Associations in Models

      1. Between `Ticket.assignee` and the `MessageSender sender` parameter of a notification operation, which represents business state and which supports behavior during the call?
      2. What different information do a dashed dependency line and a solid association line convey in UML?
      3. After `notifyAssignee()` finishes, why can't we conclude that `ConsoleSender` has been garbage-collected?

      ### Choosing Collaborators and Testing

      1. When `NotificationService` receives `MessageSender` through constructor injection and stores it in a field, why does a design dependency still exist even though the reference is retained?
      2. Which questions about later queries, business-domain state, and parameter-passing costs help determine whether to use a parameter, field, or repository?
      3. How does testing a dependency used during one operation differ from testing an assignee association across multiple operations?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Classify relationships from code | Distinguish a sender's method-level dependency from the association between a ticket and its assignee. |
      | Read UML representations | Identify the dependency arrow's direction and the solid line denoting a stateful association. |
      | Evaluate constructor injection | Explain why an injected field can represent a service dependency without implying business ownership. |
      | Choose where to hold references | Design collaborator passing through parameters or stored associations based on needs across calls. |
      | Write focused tests | Specify different assertions for correct calls to a fake sender and for Ticket correctly retaining/removing an association after an operation. |
  - slug: relationships-003
    title: Aggregation and Composition
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Aggregation and Composition
    problemSolved: When does a part belong exclusively to a whole?
    mechanism: Ask who owns the part and whether it can exist independently.
    applicationValue: Protect ownership and avoid accidentally deleting shared parts.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Aggregation and Composition**

      Interpret whole–part relationships correctly: aggregation groups parts that can exist independently, while composition ties a part to one owner under the domain contract. Through Team–Employee and Order–LineItem, learners identify ownership, sharing restrictions, removal/transfer operations, and the distinction from garbage collection or JPA cascading.

      ## 2. Questions Learners Must Be Able to Answer

      ### Ownership and Lifecycle Semantics

      1. Why is a `List` field or a `new` expression insufficient to establish aggregation or composition, and which business question must be answered first?
      2. How does deleting a team or removing a member in Team–Employee differ from deleting an Order containing its own LineItem instances?
      3. Which end of a UML relationship holds the hollow or filled diamond, and how many composites may own a part at the same time?

      ### Implementation and Persistence

      1. How can Order's API prevent a LineItem from being attached to two orders simultaneously without exposing a directly mutable collection?
      2. Why are `CascadeType.REMOVE` or `orphanRemoval` appropriate only when domain rules require deleting the part, especially for employees shared by multiple teams?
      3. Which behaviors should tests verify to distinguish an Employee's independent existence from a LineItem's lifecycle under an Order?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Analyze whole–part relationships | Choose aggregation, composition, or ordinary association based on independent existence, sharing, and ownership transfer. |
      | Read UML notation | Place hollow/filled diamonds at the whole end and describe restrictions on part ownership. |
      | Design composition | Describe an Order API that creates, updates, and removes LineItem through its owner and rejects invalid states. |
      | Avoid deleting shared entities | Evaluate the risks of cascade REMOVE and orphanRemoval for Team–Employee versus Order–LineItem. |
      | Verify lifecycle contracts | Propose tests showing that removing a member does not delete Employee, that LineItem is exclusive to one owner, and that deleting Order handles data according to policy. |
  - slug: relationships-004
    title: 'Multiplicity: One-to-One, One-to-Many, and Many-to-Many'
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: 'Multiplicity: One-to-One, One-to-Many, and Many-to-Many'
    problemSolved: What cardinality constraints do 1–1, 1–N, and N–N impose?
    mechanism: Ask how many B instances each A can have, and how many A instances each B can have.
    applicationValue: Enforce cardinality, uniqueness, and association-object rules.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Multiplicity: One-to-One, One-to-Many, and Many-to-Many**

      Determine valid multiplicities at both ends of a relationship instead of inferring them from field or collection types. This lesson covers 1–1, 1–N, and N–N models, choosing an association object/registry when enrollments have their own data, and enforcing constraints on null, cardinality, identity, and link transfers.

      ## 2. Questions Learners Must Be Able to Answer

      ### Reading Multiplicities and Constraints

      1. In UML `Department "1" -- "0..*" Employee`, what does each end's notation say about the number of objects at that end for one object at the opposite end?
      2. How does mandatory 1–1 differ from `0..1`, and why does declaring `Profile profile` not enforce system-wide uniqueness?
      3. Why does `List<Task>` not establish whether a relationship is 1–N or N–N without considering the Task → Project end?

      ### Choosing Structures and Protecting Invariants

      1. In a Student–Course N–N model, how does `EnrollmentRegistry` prevent duplicate enrollment ID pairs, and what are its limitations when the demonstration runs only in memory?
      2. When an enrollment has its own `status`, `grade`, and `enrolledOn`, why does an Enrollment class represent it more clearly than two mirrored Sets?
      3. For a Team requiring 1 to 5 members with distinct IDs, which cases must add, remove, and initialization operations reject?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Translate requirements into multiplicities | Correctly label `1`, `0..1`, `0..*`, `1..*`, and min..max ranges at both ends of a diagram. |
      | Distinguish relationship types | Describe valid cardinalities for 1–1, 1–N, and N–N separately from ownership/navigability. |
      | Design N–N representations | Choose a registry or Enrollment association class when a relationship has its own identity and attributes. |
      | Enforce cardinality limits | Propose invariants and add/remove/transfer operations that preserve uniqueness, minima/maxima, and null constraints. |
      | Test business scenarios | Analyze duplicate enrollment, a Team exceeding capacity, or removal of its last member according to the defined policy. |
  - slug: relationships-005
    title: Association Direction and Navigability
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Association Direction and Navigability
    problemSolved: In which direction can one object navigate to the other end?
    mechanism: Ask which direction queries need and whether a reverse field is necessary.
    applicationValue: Reduce redundant stored state and unnecessary reverse links.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Association Direction and Navigability**

      Determine which objects must be directly accessible from each side of an association, and store only the navigation paths required by business queries. Through Order–Customer and Team–Member, this lesson explains that navigability is independent of multiplicity/ownership, the cost of maintaining bidirectional links, and how repositories can support reverse lookups.

      ## 2. Questions Learners Must Be Able to Answer

      ### Navigability and UML

      1. How do association, multiplicity, and navigability differ in the Order–Customer relationship?
      2. Why does an association arrow from Order to Customer not mean that data flows only in one direction or that Customer is created after Order?
      3. Why shouldn't an association without an arrow in a UML diagram automatically be interpreted as bidirectional?

      ### Designing Object Graphs

      1. If Order knows its Customer but Customer does not retain its Orders, how can a purchase-history screen find the orders?
      2. When Team and Member must both navigate to each other, which changes must occur during a team transfer to keep both sides consistent?
      3. Why does adding a reverse link increase maintenance costs, reference-cycle risks, and serialization errors without necessarily changing multiplicity?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Read navigation paths | Analyze association arrow directions, multiplicity labels, and direct accessibility from each object. |
      | Choose a minimal reference graph | Explain when `Order.customer` suffices and reverse access belongs in a repository/query service. |
      | Design bidirectional links when needed | Identify the Team–Member update entry point and synchronization steps for adding, removing, and transferring members. |
      | Distinguish UML dependencies | Explain how a dashed dependency arrow differs from a navigability arrow on a solid association line. |
      | Detect redundant-storage problems | Recognize mutable collections, mutually calling setters, JSON recursion, and the mistaken assumption that JPA mappedBy synchronizes both sides automatically. |
  - slug: relationships-006
    title: Bidirectional Relationships and Data Consistency
    status: WRITTEN
    difficult: ADVANCED
    focus: Bidirectional Relationships and Data Consistency
    problemSolved: How can both sides reflect the same relationship through changes and failures?
    mechanism: Ask what invariant both sides must satisfy and where updates belong.
    applicationValue: Prevent inconsistent object graphs/JPA data and partial updates.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Bidirectional Relationships and Data Consistency**

      Protect invariants when two objects store information about the same link, including during addition, transfer, and unassignment. This lesson uses Employee–Department to establish a single update entry point, validate before mutation, preserve the previous state on failure, and distinguish the JPA owning side from business-domain ownership.

      ## 2. Questions Learners Must Be Able to Answer

      ### Invariants and Change Operations

      1. For `Employee.department` and `Department.employees`, which invariant must hold on both sides after every operation?
      2. When transferring an employee from A to B, why must B's capacity be checked before removing the link to A, changing the reference, and adding the link to B?
      3. Why can independent setters, getters exposing mutable Sets, or helpers calling each other unconditionally lead to inconsistent data or infinite recursion?

      ### JPA, Failures, and Testing

      1. In JPA/Hibernate, how does the foreign-key owning side differ from the domain owner responsible for invariants, and does `mappedBy` automatically update both sides of the object graph?
      2. When changing a link encounters a business error or two competing requests, how should the original state be preserved and transactions/synchronization considered?
      3. Why must tests check both sides after success/failure and use `flush`, `clear`, and reload before concluding that the database persisted the correct data?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | State bidirectional invariants | Write an equivalence condition between the `Employee.department` reference and membership in `Department.employees`. |
      | Design a single update entry point | Simulate an idempotent `moveTo` operation with validation before mutation, then removal of the old link, reassignment, and addition of the new link in order. |
      | Encapsulate collections | Distinguish live immutable views from snapshots and prevent callers from corrupting state through getters. |
      | Analyze the JPA owning side | Identify the side writing the foreign key, the side using `mappedBy`, and the need to synchronize the whole object graph within a transaction. |
      | Test consistency | Specify assertions for adding/transferring/removing links, full-department errors, data after flush/reload, and the limits of single-threaded tests. |
      | Recognize hazards | Detect hashCode depending on mutable fields, JSON recursion, incorrect cascading deletes, or concurrent updates without locking. |
  - slug: relationships-007
    title: Dependency Cycles and How to Break Them
    status: WRITTEN
    difficult: ADVANCED
    focus: Dependency Cycles and How to Break Them
    problemSolved: How do design, wiring, and runtime cycles arise and get broken?
    mechanism: Draw directed dependency graphs, find misplaced responsibilities, and verify after refactoring.
    applicationValue: Reduce coupling and initialization errors while keeping business flows testable.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Dependency Cycles and How to Break Them**

      Analyze dependency graphs at the class, call-flow, Spring bean, package, and module levels to find cycles that actually cause coupling or initialization errors. This lesson shows how to break cycles by assigning responsibilities to a coordinator, shared policy, Dependency Inversion, or clearly bounded events, then verify changes to behavior and the graph.

      ## 2. Questions Learners Must Be Able to Answer

      ### Identifying the Type of Cycle

      1. What distinct risks can the `OrderService → ShippingService → OrderService` cycle cause for constructor wiring, runtime calls, tests, and transactions?
      2. Why is `Parent ↔ Child` in an object graph not inherently a design flaw or memory leak, unlike potentially problematic module/build cycles and recursive call cycles?

      ### Refactoring Around Responsibilities

      1. How does designing `CheckoutCoordinator` to use `OrderRepository` and `ShippingGateway` in one direction move orchestration responsibility out of the service pair?
      2. When should a shared `DiscountPolicy` be extracted, an interface moved to the domain layer, or `OrderPlaced` emitted instead of making a direct call?
      3. Why might `@Lazy`, `ObjectProvider`, or setter injection merely postpone a bean-cycle problem, and how can tests confirm that the runtime cycle has actually been broken?

      ### Verifying Operational Limitations

      1. If saving an order succeeds but calling shipping or publishing an event fails, which problems do transactions, retry/idempotency, and a transactional outbox address?
      2. How can build/import graphs, Spring wiring, and business interaction order all be checked instead of only verifying that the application starts?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Classify cycle types | Distinguish directed dependency cycles, constructor cycles, runtime recursion, object reference cycles, and project/module cycles. |
      | Redraw collaboration flows | Replace the Order–Shipping cycle with a coordinator and independent ports that do not call back into one another. |
      | Choose cycle-breaking techniques | Explain when extracting a policy, applying dependency inversion, or using a domain event is more appropriate. |
      | Analyze operational consequences | Identify transaction boundaries, retries, outboxes, and idempotency needs when splitting a processing flow. |
      | Test after refactoring | Propose checks for save/request-shipment order, application-context wiring, and cycles reappearing at different levels. |
      | Evaluate temporary workarounds | Explain why deferring bean creation with `@Lazy` does not fix an existing logical call cycle. |
  - slug: relationships-008
    title: Reading Relationship Notation in Class Diagrams
    status: WRITTEN
    difficult: BASIC
    focus: Reading Relationship Notation in Class Diagrams
    problemSolved: What do UML line styles, arrowheads, diamonds, and multiplicities mean?
    mechanism: Interpret line styles, endpoints, multiplicity, and role labels together, then compare them with Java.
    applicationValue: Read and communicate class models accurately before coding.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Reading Relationship Notation in Class Diagrams**

      Read UML class diagrams as descriptions of contracts between types rather than guessing from a single arrow. This lesson combines six relationship notations—association, dependency, aggregation, composition, generalization, and realization—with multiplicity, navigability, role names, and their corresponding Java implementations.

      ## 2. Questions Learners Must Be Able to Answer

      ### Recognizing Relationship Symbols

      1. How do solid lines, dashed lines, open arrowheads, hollow triangles, hollow diamonds, and filled diamonds distinguish the six UML relationships?
      2. Why does a hollow triangle on a solid line pointing to a superclass differ from a hollow triangle on a dashed line pointing to an interface?
      3. How should `0..1`, `0..*`, and `1..*` at both ends of a diagram be read without reversing the quantities?

      ### Reading Complete Diagrams and Comparing with Java

      1. In the Order–Customer, Order–OrderLine, and CheckoutService–PaymentGateway models, what fields, ownership relationships, dependencies, or `implements` declarations does each relationship suggest?
      2. Why can't Java ownership or deletion behavior be inferred from `List<Child>` alone, and why must the diamond be placed at the whole end?
      3. What do `+`, `-`, `#`, `~`, underlined static members, italic abstract members, and the `{ordered}`/`{unique}` constraints mean when comparing the diagram with Java?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Classify UML symbols | Name and explain all six connector types based on line styles, arrowheads, and diamonds. |
      | Read multiplicity placement correctly | Interpret cardinality labels from the perspective of an object at the opposite end. |
      | Map UML to Java | Sketch fields, parameters, extends, implements, or owner APIs suggested by each relationship in the example diagram. |
      | Explain constraints | Distinguish role names, visibility, static/abstract, ordered/unique, and conditions that code must enforce. |
      | Detect incorrect inferences | Explain why an association line without an arrow may leave navigability unspecified and why composition does not mean the JVM automatically deletes a part. |
- slug: class-design
  title: Class Design
  childs:
  - slug: class-design-001
    title: Identifying Each Class's Responsibilities
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Identifying Each Class's Responsibilities
    problemSolved: Who owns each invariant, policy, and workflow?
    mechanism: Move from use cases to responsibilities
    applicationValue: Keep one owner for each rule
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Identifying Each Class's Responsibilities**

      OOP design begins by determining what each class must know, what it must do, and which kinds of changes affect it. This lesson helps learners turn a use case into a clear responsibility map and avoid putting SQL, business rules, user interfaces, and notifications into one class.

      A book-borrowing example distinguishes BookCopy, Loan, LoanPolicy, LoanRepository, and LoanService. Learners identify which component has enough data to protect invariants, how to use CRC Cards to examine collaborators, and why correctly assigned responsibilities still require transactions when books are borrowed concurrently.

      ## 2. Questions Learners Should Be Able to Answer

      ### Defining Responsibilities and Boundaries

      1. How do knowing and doing responsibilities differ from a class's list of methods?
      2. In the book-copy borrowing use case, who owns the due-date conditions, borrowing limits, loan status, and data storage?
      3. Why is SRP evaluated by the reasons a group of responsibilities might change rather than the number of methods?
      4. When creating CRC Cards for LoanService and LoanPolicy, what indicates that both classes own the same rule?

      ### Coordination, Testing, and Change

      1. Why does LoanService consult the repository and policy before creating a Loan instead of running SQL, calculating due dates, or modifying internal state itself?
      2. If storage changes from LinkedHashMap to SQL, which components must change and which should remain unchanged?
      3. How can the due-date policy be tested with a fixed Clock without accessing a database?
      4. Why does checking the number of loans and then saving, as in the example, fail to guarantee atomicity when multiple requests run concurrently?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Map responsibilities | Correctly identify who owns data, invariants, rules, orchestration, and persistence in a book-borrowing request. |
      | Apply SRP and Information Expert | Explain why Loan, LoanPolicy, and LoanService belong where they do based on reasons for change and availability of information. |
      | Describe collaboration using CRC | Write Class–Responsibilities–Collaborators cards for the main classes and identify classes taking on out-of-scope work. |
      | Design class contracts | Propose constructors and book-borrowing APIs with validation, protected state, and only the necessary exposed behaviors. |
      | Test responsibilities independently | Create scenarios for unavailable book copies, exceeded limits, and invalid due dates, and identify the appropriate test for each owner. |
      | Evaluate concurrency boundaries | Explain the non-atomic check-then-write step and the locking/transaction boundaries needed in a real implementation. |
  - slug: class-design-002
    title: Cohesion Within a Class
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Cohesion Within a Class
    problemSolved: Do the fields/methods serve the same responsibility?
    mechanism: Evaluate internal meaning rather than size
    applicationValue: Group related invariants and reasons for change
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Cohesion Within a Class**

      This lesson develops the ability to recognize cohesion among fields, methods, and invariants within a class. When one class calculates totals, writes to storage, and sends receipts, unrelated requirements still force changes to the same class and make even simple calculations difficult to test.

      Using LegacyCheckoutService and CohesionDemo, learners separate Cart, OrderRepository, ReceiptSender, and CheckoutService by responsibility. The lesson also explains the limitations of LCOM and method–field matrices, and why a coordinator with many collaborators can still be cohesive.

      ## 2. Questions Learners Should Be Able to Answer

      ### Analyzing a Class Internally

      1. How does high cohesion differ from having few methods or having every method read the same field?
      2. Why is LegacyCheckoutService considered to have low cohesion when it calculates totals, saves orders, and sends emails in one class?
      3. What independent responsibility groups can a method × field matrix reveal, and why is that insufficient to draw conclusions about business responsibilities?
      4. Why must the LCOM variant or measurement tool be specified when using metrics to evaluate a class?

      ### Controlled Refactoring

      1. In CohesionDemo, why does Cart keep addLine, total, isEmpty, and snapshot in the same class?
      2. Does a CheckoutService that invokes a repository and sender in one workflow necessarily lack cohesion?
      3. When splitting a class, how can Cart's invariants be preserved without exposing mutable lists to callers?
      4. What issues involving concurrent snapshot/total operations, receipt-delivery failures, and transactions still need attention after responsibilities are separated correctly?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Diagnose cohesion | Evaluate a class by its purpose, invariants, and groups of reasons for change rather than line count. |
      | Analyze methods and fields | Build a method–field matrix, detect independent clusters, and compare them against business responsibilities. |
      | Reorganize a multi-responsibility class | Propose Cart, repository, sender, and coordinator classes with concise, clear APIs and appropriate separation of change. |
      | Test behavior after refactoring | Test Cart.total, validation, snapshot, and save → send ordering using fakes without starting real I/O. |
      | Balance cohesion and coupling | Identify when splitting into too many pass-through classes needlessly increases dependencies. |
      | Identify risks beyond cohesion | Point out transaction, notification atomicity, and thread-safety issues that require separate solutions. |
  - slug: class-design-003
    title: Coupling Between Classes
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Coupling Between Classes
    problemSolved: How far do changes to details in other classes propagate?
    mechanism: Depend on stable contracts
    applicationValue: Change providers or tests without modifying business logic
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Coupling Between Classes**

      This lesson helps learners recognize dependencies at the source-code, runtime, and business-change levels. A CheckoutService that instantiates CardProcessor and SmtpMailer itself and knows external endpoints and formats is difficult to adapt to a new provider and difficult to test safely.

      Using PaymentGateway, ReceiptSender, and constructor injection, learners reduce dependencies on frequently changing details while preserving necessary business contracts. The examples also distinguish DIP from DI, a useful interface from a facade that exposes its SDK, event-based coupling, and the cost of handling distributed failures.

      ## 2. Questions Learners Should Be Able to Answer

      ### The Nature and Types of Coupling

      1. How can source-code, runtime, and change coupling differ for CheckoutService?
      2. Why do few imports or the mere presence of an interface fail to prove low coupling?
      3. What risks do data coupling, control coupling, stamp coupling, and external coupling introduce when contracts are designed too broadly?
      4. How do fan-in, fan-out, CBO, and package cycles help identify areas for review, and what are their limitations?

      ### Isolating Change and Testing

      1. Why does passing PaymentGateway and ReceiptSender through a constructor make checkout testable with fakes?
      2. How does DIP differ from DI, and does a constructor accepting a concrete class necessarily comply with DIP?
      3. How can tests prove that no receipt is sent if the gateway throws an exception before payment succeeds?
      4. Why do successful payment followed by failed receipt delivery still require state tracking and retry/idempotency despite reduced coupling?
      5. What dependencies remain in messages passed through an event broker even when two modules do not import each other?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Identify actual coupling | Diagram CheckoutService dependencies on providers/SMTP and identify where details are known and where provider changes have an impact. |
      | Design stable contracts | Define PaymentGateway.charge and ReceiptSender.send around behavior instead of copying SDK steps directly into interfaces. |
      | Apply DI and DIP appropriately | Move dependency creation outside the service and distinguish injection mechanisms from dependency direction toward abstractions. |
      | Test interchangeable collaborators | Use fakes that record orderId, amountCents, email, and paymentId to verify correct checkout behavior. |
      | Evaluate module coupling | Identify import cycles and event-schema dependencies, and propose appropriate contract boundaries. |
      | Analyze failure side effects | Explain the risks of successful payment followed by failed notification and the need for retry/idempotency. |
  - slug: class-design-004
    title: Separating Data, Business Logic, and External Interactions
    status: WRITTEN
    difficult: ADVANCED
    focus: Separating Data, Business Logic, and External Interactions
    problemSolved: How are the domain, use cases, and I/O separated?
    mechanism: Design around boundaries of change
    applicationValue: Isolate HTTP/DB/email from the domain
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Separating Data, Business Logic, and External Interactions**

      A checkout flow may receive data, calculate prices, save orders, and send notifications. This lesson separates request DTOs, domain entities/value objects, policies, application services, ports, and adapters so that each component has a verifiable responsibility.

      In SeparationOfConcernsDemo, OrderLine performs validation, Order protects the total amount, StandardPricingPolicy applies SAVE10, CheckoutService coordinates the flow, and the repository/gateway provides I/O. Learners also recognize the risk of saving an order successfully but failing to send a receipt, and the actual scope of transactions and outbox patterns.

      ## 2. Questions Learners Should Be Able to Answer

      ### Assigning Component Responsibilities

      1. What distinct responsibilities belong to the request DTO, OrderLine, Order, PricingPolicy, CheckoutService, repository port, and adapter?
      2. Why does separating data from I/O not mean moving all entity behavior into a service?
      3. Which components should reject empty SKUs, nonpositive quantities, and overflow in the total amount?
      4. Why does a domain class that directly calls JDBC or SMTP violate the dependency boundaries?

      ### Testing and Integration Consistency

      1. How is SAVE10 applied and rounded to cents in the example that reduces 315.00 to 283.50?
      2. Why must an unsupported promotion code be rejected before calling repository.save or sending a receipt?
      3. If saving succeeds and the gateway subsequently fails, why can't @Transactional on the DB undo SMTP operations?
      4. What guarantees do outbox, retry, and idempotency support, and why do they still result in eventual consistency?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Group responsibilities | Classify each checkout type as an input DTO, domain component, policy, application component, port, or I/O adapter. |
      | Protect domain invariants | Identify where to validate order lines, compute subtotals with Math.addExact, and reject policies returning invalid amounts. |
      | Design dependency flow | Diagram controller → command → service → domain/port → adapter and show the direction of source-code dependencies. |
      | Verify prices | Calculate totals and SAVE10 discounts in cents by hand and compare them with the Java 17 example. |
      | Test workflows without I/O | Use fake repositories/gateways to prove that nothing is saved or sent when data or promotions are invalid. |
      | Design handling for post-save failures | Propose outbox-based notifications after commit, retry handling, and correctly persisted order states. |
  - slug: class-design-005
    title: Naming Classes, Fields, and Methods
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Naming Classes, Fields, and Methods
    problemSolved: Which names communicate meaning, units, and side effects?
    mechanism: Treat names as commitments
    applicationValue: Reduce API misunderstandings and rename/mapping errors
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Naming Classes, Fields, and Methods**

      Naming is part of an OOP contract. Readers should be able to tell what a class is responsible for, what data and units a field represents, and whether a method queries data or produces side effects without first opening its implementation.

      This lesson uses ShoppingCart, CartSnapshot, CheckoutService, and OrderRepository to illustrate Java conventions, accurate insert/findById semantics, readable boolean names, and explicitly named units. Learners also examine JavaBeans/record/JSON/JPA constraints when renaming public APIs to avoid breaking clients, mappings, or binary compatibility.

      ## 2. Questions Learners Should Be Able to Answer

      ### Names That Reflect Responsibilities and Meaning

      1. Why do DataManager.process(x) and flag force users to guess the responsibilities and state involved?
      2. Which Java elements use UpperCamelCase, lowerCamelCase, and UPPER_SNAKE_CASE conventions?
      3. Why are remainingSeats, balanceCents, and retryDelayMillis safer than number, balance, or delay without units?
      4. What distinct semantics should findById, requireById, insert, createOrder, and placeOrder convey?
      5. Why shouldn't a getter with side effects or network calls be treated as a cheap query merely because its name starts with get?

      ### API Design and Renaming

      1. What do ShoppingCart.snapshot() and OrderRepository.insert() in NamingDemo communicate about data immutability and duplicate orderId values?
      2. Why is a record accessor named customerId() rather than the default JavaBeans-style getter getCustomerId()?
      3. Why can renaming a getter, field, or public API affect JSON, JPA, reflection, Spring, and binary clients?
      4. When renaming createOrder to placeOrder, which usages, contracts, migrations, and tests must be checked?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Choose names following Java conventions | Name classes/interfaces/records, methods, fields, parameters, enums, and constants according to suitable conventions. |
      | Clarify data meaning | Replace ambiguous names with names expressing the domain, units, and state, such as balanceCents or registrationClosed. |
      | Communicate API effects | Distinguish find/require, insert/upsert, get/fetch, and create/enqueue by their promised results or side effects. |
      | Design consistently named models | Read and revise the ShoppingCart–CartSnapshot–CheckoutService APIs so callers understand responsibilities, snapshots, and duplicate IDs. |
      | Review framework boundaries | Distinguish record accessors from JavaBeans conventions and identify renaming risks for JSON/JPA/reflection. |
      | Plan safe renames | List callers, contracts, IDE renames, deprecated wrappers, tests, and source/binary compatibility issues. |
  - slug: class-design-006
    title: Entities, Value Objects, and Services
    status: WRITTEN
    difficult: ADVANCED
    focus: Entities, Value Objects, and Services
    problemSolved: Is an object distinguished by identity, value, or behavior?
    mechanism: Distinguish identity from value
    applicationValue: Place equality and domain rules in the right objects
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Entities, Value Objects, and Services**

      This lesson helps learners choose classes by business meaning: an Entity has an identity that persists through changes, Value Objects are equal by value and are generally immutable, and a Service contains coordination rules that do not naturally belong to a single object.

      The Account, Money, and TransferService example clarifies Account's UUID, Money's Currency and minorUnits, and transfers between two entities. The lesson also distinguishes Domain Services from Application Services and warns against equating framework @Entity/@Service annotations with domain roles or treating in-memory operations as atomic banking transactions.

      ## 2. Questions Learners Should Be Able to Answer

      ### Identity, Equality, and Immutability

      1. Why aren't two Account objects with the same balance necessarily the same Entity, while two Money objects with equal minorUnits/currency can be equal?
      2. When an Account's balance changes but its UUID remains the same, what makes it the same entity?
      3. Why can a hashCode based on mutable attributes break object lookup in a HashSet?
      4. Why does a record's component-based equals not automatically guarantee deep immutability?
      5. How must Money.plus and Money.minus check currencies, amount signs, and numeric overflow?

      ### Assigning Behavior and Transactions

      1. Which rules should Account.withdraw and Money.plus enforce, and how should TransferService coordinate two Account objects?
      2. How do Domain Services differ from Application Services in their rules, repositories, permissions, and transactions?
      3. Why do two separate saves of Account objects not automatically form one atomic transaction?
      4. Do @Entity in JPA and @Service in Spring automatically determine whether a class is a Domain Entity or Domain Service?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Distinguish three roles | Classify Account, Money, TransferService, and DTOs by identity, value, or coordination behavior. |
      | Design entity equality | Establish UUID-based identity rules and discuss exceptions for database-assigned IDs or JPA proxies. |
      | Create immutable Value Objects | Design Money using minorUnits/Currency, component-based equals, and overflow-detecting operations. |
      | Protect balances within Entities | Explain how Account.deposit/withdraw check positive amounts, matching currencies, and nonnegative balances. |
      | Place services in the appropriate layer | Separate transfer rules involving two accounts from loading, saving, and opening transactions in an application service. |
      | Identify demo limitations | Explain why in-memory preflight checks do not prevent race conditions, lost updates, or one-sided commit failures. |
  - slug: class-design-007
    title: Rich Domain Models and Data-Only Models
    status: WRITTEN
    difficult: ADVANCED
    focus: Rich Domain Models and Data-Only Models
    problemSolved: Should rules live in an entity or a service/data class?
    mechanism: Choose rich or anemic models based on evidence
    applicationValue: Protect state transitions and avoid unrestricted setters
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Rich Domain Models and Data-Only Models**

      This lesson guides the placement of business rules: keep state transitions within the entity whose data must be protected, or use data-only DTOs/projections when the task only requires carrying data. The focus is how well invariants are protected, not the number of getters and setters.

      In RichVsAnemicDemo, Order owns addItem, confirm, cancel, and total calculations from OrderLine; the application service only loads, saves, and sends notifications. Learners understand why rich models still need bounded responsibilities, when simple records/CRUD suffice, and why ORM transactions and concurrency must still be designed separately.

      ## 2. Questions Learners Should Be Able to Answer

      ### Choosing Models Based on Invariants

      1. Why can OrderData with public setters for status and total amounts violate order invariants?
      2. How do Rich Domain Models differ from Anemic Domain Models in rule placement, permission to modify state, and the risk of duplicated validation?
      3. Which operations must Order.addItem and Order.confirm reject after an order reaches CONFIRMED?
      4. Why isn't a Quantity record with a validating constructor and a plus method necessarily an anemic model?
      5. When are DTOs, projections, reports, or simple CRUD operations a good fit for data-only models?

      ### Separating Orchestration and System Guarantees

      1. What roles do OrderLine, Order, repository, notifier, and application service play in RichVsAnemicDemo?
      2. Why shouldn't an entity open JDBC connections or send SMTP messages merely to qualify as rich?
      3. When Order state is persisted with JPA, where should transactions, optimistic locking, and lost updates be checked?
      4. What steps help replace public setters with addItem/confirm while maintaining compatibility and the ability to test existing behavior?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Compare two models | Identify where rules are implemented and the consequences for invariants when multiple callers update Order. |
      | Build rich entities | Design addItem, confirm, cancel, and totalCents on Order with explicit DRAFT/CONFIRMED/CANCELLED states. |
      | Protect data and totals | Prevent nonpositive quantities, negative prices, incorrect SKU aggregation, arithmetic overflow, and exposure of mutable collections. |
      | Keep services focused | Separate domain behavior from repositories, notifiers, transactions, and use-case orchestration. |
      | Choose data-only models deliberately | Distinguish rich entities from request DTOs, report projections, or CRUD models without complex invariants. |
      | Plan refactoring | Define a state machine, add tests, migrate callers, restrict setters, and check ORM/concurrency behavior. |
  - slug: class-design-008
    title: Separating Queries from State-Changing Commands
    status: WRITTEN
    difficult: ADVANCED
    focus: Separating Queries from State-Changing Commands
    problemSolved: Is a method reading or updating state?
    mechanism: Reading and writing express different intentions
    applicationValue: Prevent hidden side effects and race/retry issues
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Separating Queries from State-Changing Commands**

      This lesson helps learners write APIs in which reading data does not silently change business state, while write commands explicitly communicate their intent, validity conditions, and side effects. The getAvailableQuantity example, which both checks and deducts stock, shows how a getter can introduce bugs from a mere UI refresh.

      Through Stock and AccountDemo, learners distinguish canReserve/balance/snapshot from reserve/deposit/withdraw; they also learn how CQS differs from CQRS architecture, why atomicity matters with competing requests, and why retried commands need idempotency.

      ## 2. Questions Learners Should Be Able to Answer

      ### Classifying Queries and Commands

      1. Why does getAvailableQuantity(requested) violate query expectations when it also deducts stock?
      2. How do canReserve, availableUnits, and snapshot differ from reserve, deposit, and withdraw in observable behavior?
      3. Why is createOrder still a command when it returns OrderId, and why doesn't CQS require every command to return void?
      4. How does method-level CQS differ from architectural CQRS and its read models?
      5. How do logging, memoization, lazy loading, and remote queries make the boundary around queries conditional?

      ### Concurrency and Retries

      1. Why doesn't canReserve(2) returning true guarantee that reserve(2) will succeed if another request intervenes?
      2. What does synchronized in AccountDemo guarantee within one JVM, and what does it not guarantee when data spans multiple machines?
      3. When deposit(100) or sendEmail is retried, how do duplicate side effects differ from repeating a query?
      4. Where must an idempotency key be checked and recorded atomically to prevent duplicate processing across multiple instances?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Identify API effects | Classify methods as queries or commands by actual state changes, regardless of name prefixes or return types. |
      | Design clear queries | Propose balance, snapshot, and canReserve methods that return data without modifying domain state or exposing mutable collections. |
      | Design valid commands | Write reserve/withdraw methods that validate at write time and preserve invariants on both success and failure paths. |
      | Distinguish CQS/CQRS | Explain when method-level separation is sufficient and the costs of separate read/write models. |
      | Analyze TOCTOU | Identify races between queries and commands and propose atomic updates or locks/transactions at the owner. |
      | Check idempotency | Compare setStatus with deposit and design a retry scenario using request IDs without duplicate effects. |
  - slug: class-design-009
    title: Limiting Deep Object-Chain Access
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Limiting Deep Object-Chain Access
    problemSolved: Does the caller know too much about an object's structure?
    mechanism: Ask nearby collaborators to perform behavior
    applicationValue: Reduce coupling when deep structures change
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Limiting Deep Object-Chain Access**

      A chain such as loan.getMember().getMembershipPlan().getDailyLateFeeCents() forces calling code to know the details of multiple objects and calculate late fees itself. This lesson helps learners assess actual coupling, move behavior to the appropriate owner, or pass data through a Value Object instead of traversing deep object graphs.

      DemeterDemo uses Loan.calculateLateFeeCents, Member.lateFeeFor, and MembershipPlan.feeFor to keep responsibilities with nearby collaborators at each level. Learners also distinguish chains that expose internals from DTOs, fluent APIs, and Streams, and recognize that changing Java call chains alone does not resolve N+1 queries, lazy loading, or transactions.

      ## 2. Questions Learners Should Be Able to Answer

      ### Law of Demeter and Behavior Ownership

      1. Which internal decisions does the Loan → Member → MembershipPlan chain force LoanReturnService to depend on?
      2. Under the Law of Demeter, which kinds of direct objects should a method exchange messages with?
      3. Why does calling loan.calculateLateFeeCents(days) reduce the service's knowledge of the underlying structure?
      4. When is an independent policy that receives a loan snapshot better than placing every algorithm inside Loan?
      5. Why might adding many forwarding getters to Order merely conceal a navigation chain without assigning responsibility correctly?

      ### Design Boundaries and Validation

      1. Why are chains involving String.trim().toLowerCase(), builders, or Streams not automatically violations of LoD?
      2. Does Optional.map across multiple objects reduce coupling, or does it merely reduce null checks?
      3. If MembershipPlan changes its fee calculation to account for free days and a fee cap, what should services outside Loan need to change?
      4. If a getter uses a lazy JPA relationship that causes N+1 queries or LazyInitializationException, is moving the chain inside one method enough to fix the issue?
      5. Why can fees based on the current membership plan differ from fees based on the plan at borrowing time, and which interpretation must the model commit to?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Recognize harmful message chains | Find caller chains that navigate deep into multiple entities to calculate rules and identify coupling to internal structure. |
      | Apply Tell, don't ask | Propose Loan.calculateLateFeeCents and nearby collaborating methods instead of scattering formulas across services. |
      | Place rules or Value Objects appropriately | Choose MembershipPlan.feeFor, a domain policy, or ShippingAddress based on who owns the information. |
      | Analyze exceptions to LoD | Distinguish chains of business objects from DTOs, Money value objects, Streams, and fluent builders with clear contracts. |
      | Preserve behavior | Test Basic/Premium daily fees, errors from returning a loan twice, and the effects of changing membership plans. |
      | Recognize persistence risks | Explain how projection/fetch strategies address N+1 queries and lazy loading beyond shortening Java call chains. |
