  - slug: oop-basic-001
    title: What Is OOP, and How Does It Help Organize Programs?
    status: WRITTEN
    difficult: BASIC
    focus: What Is OOP, and How Does It Help Organize Programs?
    problemSolved: Why use OOP to organize a system?
    mechanism: From isolated functions to responsibilities
    applicationValue: Establish business responsibility boundaries
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **What Is OOP, and How Does It Help Organize Programs?**

      This lesson explains why systems with many business operations need clear responsibility boundaries and how OOP organizes collaborating objects. Through BankAccount and an order-placement flow, learners develop a basis for identifying where rules belong, the limits of encapsulation, and the value of designs that accommodate change.

      ## 2. Questions Learners Should Be Able to Answer

      ### The Problem of Program Organization

      1. Why do scattered business rules become a risk as a program grows?
      2. How does OOP organize data, behavior, and responsibility into collaborating objects?
      3. How do the business identity, state, and behavior of BankAccount differ?

      ### Evaluating Design and Its Limits

      1. Why does a BankAccount with withdraw() still fail to protect its balance if external code can modify balance?
      2. Why should Order, InventoryService, PaymentGateway, and CheckoutService have distinct responsibilities in an order-placement process?
      3. When is a simple sequence of functions more appropriate than creating many objects, and why does private alone not resolve concurrency conflicts?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Recognize organizational problems | Identify scattered rules, tangled dependencies, or difficult-to-test logic in an account or ordering scenario. |
      | Model objects | Identify the identity, state, behavior, and responsibility of BankAccount or Order from concrete requirements. |
      | Trace invariants | Correctly predict successful and failed withdrawals and explain why the balance remains unchanged when a withdrawal is rejected. |
      | Assign responsibilities | Outline the roles of Order, inventory, payment, and orchestration components in a use case. |
      | Recognize limitations | Explain why encapsulation does not replace transactions, locking, idempotency, or security. |
  - slug: oop-basic-002
    title: Objects, State, Behavior, and Responsibility
    status: WRITTEN
    difficult: BASIC
    focus: Objects, State, Behavior, and Responsibility
    problemSolved: How does an object maintain its state and rules?
    mechanism: From data to behavior that protects data
    applicationValue: Build objects that maintain invariants
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Objects, State, Behavior, and Responsibility**

      This lesson clarifies four interconnected aspects of an object with a business lifecycle. The Order example helps learners determine who owns state, which behaviors may change it, and why mandatory rules must be enforced at the appropriate boundary.

      ## 2. Questions Learners Should Be Able to Answer

      ### The Nature of Objects and State

      1. How are object identity, state, behavior, and responsibility related within an Order?
      2. Why can two Order instances both be in DRAFT with the same total and still be different objects?
      3. What is the difference between stored state and the value calculated by total() from order lines?

      ### Rules and Responsibility Assignment

      1. Why is calling confirm() more appropriate than freely allowing setStatus(CONFIRMED) in an order model?
      2. How and why should state be preserved when confirm() is called on an empty order or addLine() is called after confirmation?
      3. If state-transition rules belong in Order, who should handle persistence, notifications, and orchestration?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Analyze the model | Identify identity, state, behavior, and responsibility in the Order example; distinguish them using concrete data. |
      | Define rules | List invariants for quantities, unit prices, and DRAFT/CONFIRMED/CANCELLED states before writing methods. |
      | Predict the lifecycle | Create a before/after state table for addLine(), confirm(), cancel(), and rejected operations. |
      | Design a behavioral API | Propose methods that express business intent while limiting exposed setters and mutable collections. |
      | Assign collaboration roles | Explain the roles of Order, OrderService, Repository, and NotificationService in order confirmation. |
  - slug: oop-basic-003
    title: 'Classes, Types, and Instances: Foundational Concepts'
    status: WRITTEN
    difficult: BASIC
    focus: 'Classes, Types, and Instances: Foundational Concepts'
    problemSolved: How do class, type, instance, and reference differ?
    mechanism: From variable names to identity and type
    applicationValue: Read Java runtime models accurately
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Classes, Types, and Instances: Foundational Concepts**

      This lesson teaches learners to read an object-creation statement accurately and predict which variables refer to the same instance. Through ClickCounter, learners distinguish declared types from runtime classes, understand reference assignment, compare identity, and distinguish instance members from static members.

      ## 2. Questions Learners Should Be Able to Answer

      ### Classes, Types, Instances, and References

      1. In CounterView view = new ClickCounter(...), which parts are the declared type, implementation class, new instance, and reference variable?
      2. Why can view, first, and general all refer to one object yet directly invoke different sets of methods?
      3. What is the difference between new ClickCounter(...), assigning y = x, and calling y.click()?

      ### Interpreting Results and Type Restrictions

      1. How can you predict the results of == and equals() for two ClickCounter objects containing identical data?
      2. Why does view.click() fail to compile while view.value() is valid, even though the runtime object has click()?
      3. How do null, instance fields, and static fields affect object counts, method invocation, and shared state?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Read Java declarations | Correctly identify the class, declared type, runtime instance, and reference in object-creation and assignment expressions. |
      | Model references | Diagram multiple variables pointing to one instance or multiple instances, then predict values after click() or reference reassignment. |
      | Check callable methods | Identify which statements compile and which do not when using CounterView, ClickCounter, and Object, and explain why. |
      | Compare identity | Correctly predict ==, default equals(), and null cases, distinguishing identity from business value. |
      | Distinguish data scope | Explain how per-instance state in instance fields differs from static members belonging to the class. |
  - slug: oop-basic-004
    title: Object Interactions and Method Calls
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Object Interactions and Method Calls
    problemSolved: How do objects collaborate and pass results/errors?
    mechanism: From individual calls to collaboration sequences
    applicationValue: Design collaborations and method contracts
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Object Interactions and Method Calls**

      This lesson moves from identifying objects to tracing a real interaction. Through LendingService, Member, Book, and Loan, learners analyze the caller, receiver, parameters, before/after state, return values, and error paths to design safe method contracts.

      ## 2. Questions Learners Should Be Able to Answer

      ### Interaction and Call Mechanics

      1. In service.borrow(an, javaBook), who are the caller and receiver, and which objects receive subsequent calls?
      2. What does Java's pass-by-value copying of references mean for reassign(localBook) and lendTo(member)?
      3. How is this determined when executing LendingService.borrow(), Member.ensureActive(), and Book.lendTo()?

      ### Contracts, Results, and Errors

      1. How do return values, side effects, and void methods differ in the book-borrowing example?
      2. Why can an IllegalStateException prevent creation of a Loan without automatically rolling back every earlier side effect?
      3. Which preconditions, postconditions, and invariants must a lendTo() contract specify, and why must the business call path be protected?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Trace the sequence | Correctly diagram the main → LendingService → Member → Book → Loan flow and its return values. |
      | Identify the receiver | Identify the object referenced by this, which methods read or modify state, and where exceptions arise. |
      | Predict parameter passing | Explain why reassigning a reference parameter does not change the caller's variable but can mutate a shared object. |
      | Analyze errors | Describe the call stack and exception propagation when a book has already been borrowed, including effects on state. |
      | Specify contracts | Write preconditions, postconditions, and error responses for lendTo() or returnBy(), then propose test cases. |
  - slug: oop-basic-005
    title: Encapsulation, Abstraction, Inheritance, and Polymorphism
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Encapsulation, Abstraction, Inheritance, and Polymorphism
    problemSolved: How do the four mechanisms protect and extend behavior?
    mechanism: From language mechanisms to design contracts
    applicationValue: Apply encapsulation, abstraction, inheritance, and polymorphism
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Encapsulation, Abstraction, Inheritance, and Polymorphism**

      This lesson applies four OOP concepts to the same shopping-cart and discount-policy problem. Learners distinguish the design problem each mechanism solves and trace how DiscountPolicy maintains a shared contract while selecting different calculations at runtime.

      ## 2. Questions Learners Should Be Able to Answer

      ### Distinguishing the Four Mechanisms

      1. How does encapsulation differ from abstraction when Cart protects items while CheckoutService uses DiscountPolicy?
      2. Why might private/final and getters/setters still fail to protect cart invariants?
      3. When does an extends relationship represent a valid subtype, and when is composition more appropriate?

      ### Polymorphism and Execution Contracts

      1. How does dispatch select the PercentageDiscount or FixedDiscount formula through the common discountFor() call?
      2. Why does combining final discountFor() with protected calculateDiscount() preserve a shared validation step, and what happens if a policy violates discount limits?
      3. How do overloading, overriding, static hiding, and private methods differ in how Java selects an implementation?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Protect data | Design Cart with a valid item-addition path and a returned list that prevents direct modification of internal state. |
      | Design abstraction | Define the DiscountPolicy contract, including inputs, outputs, and valid discount-amount rules. |
      | Evaluate inheritance | Explain is-a relationships, substitutability, and why an abstract class or interface is appropriate for a given need. |
      | Predict polymorphism | Correctly calculate the 450000/420000 amounts from the same checkout flow and identify the overridden method invoked. |
      | Recognize misuse | Recommend composition instead of an inappropriate extends relationship and detect subclass contract violations. |
  - slug: oop-basic-006
    title: 'OOP and Procedural Programming: Decomposing a Problem'
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: 'OOP and Procedural Programming: Decomposing a Problem'
    problemSolved: Should the problem be divided by functions or object responsibilities?
    mechanism: From paradigm preferences to trade-offs
    applicationValue: Evaluate cohesion and coupling across organizational approaches
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **OOP and Procedural Programming: Decomposing a Problem**

      This lesson compares two solutions to the same shopping-cart problem, both yielding 405.000 VND. Learners see how the placement of data, rules, and behavior differs, then assess cohesion, coupling, invariants, and testing costs instead of merely counting classes.

      ## 2. Questions Learners Should Be Able to Answer

      ### Two Ways to Decompose the Same Business Operation

      1. Given the same requirement for a 10% cart discount, which steps/functions would procedural thinking start with, and which objects/responsibilities would OOP thinking start with?
      2. Why do CartProcedures.calculateTotal(data) and cart.total() both return 405000 while organizing code differently?
      3. Can procedural design protect data and invariants, and what boundaries does it need to do so?

      ### Evaluating Changes and Trade-offs

      1. How does adding DiscountPolicy or a new payment type affect the structure of each approach?
      2. How do cohesion, coupling, testability, and code comprehension costs help compare the two ways of decomposing the problem?
      3. Why are CSV/pipeline tasks often suited to simple functions while an order lifecycle often suits a state-owning object?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Decompose requirements | Specify inputs, outputs, and rules, and propose both procedural and OOP code organizations for the same cart. |
      | Compare implementations | Trace both code samples and demonstrate the same result of 405000 from an initial 450000 with a 10% discount. |
      | Evaluate boundaries | Identify who may modify state and propose where to enforce rules to prevent unchecked updates. |
      | Analyze changes | Compare the impact of adding discount variants, changing persistence, or generating invoices in each design. |
      | Choose a suitable structure | Justify using functions, objects, or a hybrid model based on cohesion, coupling, and testing. |
  - slug: oop-basic-007
    title: Class-Based OOP and Prototype-Based OOP
    status: WRITTEN
    difficult: ADVANCED
    focus: Class-Based OOP and Prototype-Based OOP
    problemSolved: Is a method found through a class or a prototype chain?
    mechanism: From fixed classes to dynamic delegation
    applicationValue: Understand OOP models beyond Java
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Class-Based OOP and Prototype-Based OOP**

      This lesson extends the familiar Java OOP model with JavaScript's prototype mechanism. Learners analyze two approaches to behavior lookup, how methods and state are shared, and the risks of changes to the prototype chain, while distinguishing prototype-based OOP from the design pattern for creating copies.

      ## 2. Questions Learners Should Be Able to Answer

      ### Class Models and Prototype Chains

      1. How does Java's method selection through class relationships, declared types, and runtime overrides differ from JavaScript's property lookup through a prototype chain?
      2. What relationship does Object.create(proto) establish, and why does it not automatically copy all properties from proto?
      3. Why does express.quote(2) find the method on deliveryBehavior while this still refers to express?

      ### Shared State and Easily Confused Terms

      1. Why does changing standard.feePerKg change economy's result but not express's result?
      2. What happens when a mutable tags array is placed on a prototype and shared by multiple objects?
      3. How do JavaScript class/extends and Constructor.prototype relate to [[Prototype]], and how does the Prototype Design Pattern differ from prototype-based OOP?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Analyze class-based OOP | Trace quote()/variableFee() in Java and explain dispatch in StandardDelivery/ExpressDelivery. |
      | Trace prototype chains | Identify the express → standard → deliveryBehavior lookup path and predict this, baseFee, and feePerKg. |
      | Explain shadowing | Predict economy's change from 25000 → 27000 and express's unchanged 64000 after updating the prototype. |
      | Fix shared-data bugs | Detect the mutable tags bug on the prototype and implement a separate array for each instance. |
      | Distinguish mechanisms | Distinguish Object.create, JavaScript class, [[Prototype]], constructor.prototype, and the Prototype Design Pattern. |
  - slug: oop-basic-008
    title: When to Use OOP and When to Avoid It
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: When to Use OOP and When to Avoid It
    problemSolved: When is OOP worth the design cost?
    mechanism: From a model that can be used to a model that should be used
    applicationValue: Avoid overengineering and choose useful abstractions
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **When to Use OOP and When to Avoid It**

      This lesson helps learners choose a suitable structure for each type of requirement based on state with a lifecycle, invariants, collaboration responsibilities, and behavioral variations. Through Order, shipping policies, and a total-revenue calculation, learners evaluate both the benefits and costs of OOP while avoiding unnecessary classes/interfaces and forwarding layers.

      ## 2. Questions Learners Should Be Able to Answer

      ### When OOP Adds Real Value

      1. Which signs of state spanning multiple operations, invariants, and collaboration make Order a good fit for OOP?
      2. When are the ShippingPolicy contract and its different implementations more valuable than a fixed fee-calculation function?
      3. Why might a pure function express the calculation of total revenue from a list of Sale objects more clearly?

      ### Costs, Risks, and Evaluation

      1. What forms of overengineering appear as multiple forwarding layers, an interface with one implementation, or a deep inheritance chain?
      2. Why do private and business classes alone not solve concurrency, transactions, idempotency, or payment correctness?
      3. How can you distinguish maintainability benefits from performance and validate performance claims with a profiler or benchmark?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Classify requirements | Analyze an Order with a lifecycle and a one-pass revenue report to choose an appropriate object or function. |
      | Design state | Identify invariants and predict the DRAFT → SUBMITTED → PAID state transitions in the order example. |
      | Evaluate variations | Explain when ShippingPolicy/polymorphism is useful and when a lambda/simple function suffices. |
      | Recognize costs | Detect forwarding layers, behaviorless models, or inappropriate extends relationships and suggest ways to reduce complexity. |
      | Validate decisions | Justify choices based on expected change, testing, correctness, and performance measurements rather than class counts. |
- slug: class
  title: Classes
  childs:
  - slug: class-001
    title: 'Class Structure: Fields and Methods'
    status: WRITTEN
    difficult: BASIC
    focus: 'Class Structure: Fields and Methods'
    problemSolved: How do fields and methods work together?
    mechanism: Identify class components and responsibilities
    applicationValue: Understand class structure and maintain valid state
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Class Structure: Fields and Methods**

      Understand that a class consists of fields, constructors, and methods, and distinguish state from behavior. Through `InventoryItem`, learners see why fields must be protected by the `restock()`/`sell()` API, how a constructor establishes a valid initial state, and how the total inventory value is calculated from current data.

      ## 2. Questions Learners Must Be Able to Answer

      ### Identifying Class Structure

      1. How do instance fields, static fields, parameters, and local variables differ in where they are declared, who owns them, and their lifetimes?
      2. In `InventoryItem`, what roles do the constructor, `this.sku`, `getQuantity()`, `restock()`, and `sell()` play, respectively?
      3. Why are `sku` and `unitPriceVnd` declared `final`, while `quantity` needs to be updated?

      ### Designing and Protecting State

      1. Why is calling `restock()`/`sell()` safer and clearer than exposing a setter for `quantity`?
      2. When `sell(20)` is called with only 12 items remaining, which exception is thrown, and what should happen to `quantity`?
      3. Why is the total inventory value calculated by a method, and why is `Math.multiplyExact` needed?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Identify components | Correctly identify fields, constructors, methods, parameters, return types, modifiers, and `this` in the `InventoryItem` code. |
      | Design behavior | Propose `private` fields, a validating constructor, and restocking/selling methods that prevent negative quantities. |
      | Distinguish individual/shared state | Explain why two instances have independent quantities while `MAX_QUANTITY` is a shared rule. |
      | Predict execution and errors | Calculate inventory before and after calls and demonstrate that state remains unchanged when validation fails. |
  - slug: class-002
    title: Declaring Classes and Creating Instances
    status: WRITTEN
    difficult: BASIC
    focus: Declaring Classes and Creating Instances
    problemSolved: How do `new` and aliases create or reference instances?
    mechanism: Trace aliases and instance state
    applicationValue: Distinguish definitions, objects, and references
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Declaring Classes and Creating Instances**

      Distinguish a class declaration from instances created with `new`, and understand reference variables and constructors. The `Workshop` example helps learners reason about independent objects, aliases that share an object, `null`, `==` comparisons, and the causes of initialization errors.

      ## 2. Questions Learners Must Be Able to Answer

      ### Declaration and Initialization

      1. Why does `class Workshop` only define a type, while `new Workshop(...)` actually creates an instance?
      2. Where does the constructor validate the name and capacity, and when does Java provide a default no-argument constructor?
      3. How do an unassigned local variable and a reference field that defaults to `null` differ when used?

      ### References and Identity

      1. Why does `Workshop alias = spring` not create a new instance, while `new Workshop("Spring Boot", 1)` creates a separate one?
      2. When `alias.register()` is called, how do the available seats for `spring` and `java` change?
      3. What do `alias == spring` and `separate == spring` check, and how does that differ from comparing content with `equals()`?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Declare a valid class | Write a `Workshop` with a constructor and a `Main.java` that follow the rules for public classes and filenames. |
      | Ensure a valid initial state | Validate the name and capacity in the constructor and identify constructor calls with missing arguments. |
      | Diagram reference relationships | Correctly represent `java`, `spring`, `alias`, and `separate` in a variable-and-object diagram. |
      | Predict results | Explain the results of `register()`, `remainingSeats()`, and `==` across object creation and assignment steps. |
  - slug: class-003
    title: Instance Members and Shared Members
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Instance Members and Shared Members
    problemSolved: Who owns instance and static members?
    mechanism: Determine state ownership and lifecycle
    applicationValue: Choose the right ownership for individual and shared state
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Instance Members and Shared Members**

      Choose instance members when data belongs to an individual object and `static` members when data or behavior truly belongs to the class. The `TicketWallet` example shows how a shared counter differs from individual state, along with the limitations involving class loaders, concurrency, persistence, and static method hiding.

      ## 2. Questions Learners Must Be Able to Answer

      ### Instance and Static Members

      1. Why do two `TicketWallet` instances have different `ownedTickets` values but see the same `totalSold`?
      2. How can a static method access an instance field when it has no `this`?
      3. How do `static`, `final`, and `public` differ, and why can a `static final List` still contain mutable data?

      ### Lifecycle, Polymorphism, and Concurrency

      1. Why are static fields not automatically synchronized across JVMs, class loaders, or application restarts?
      2. In `Animal pet = new Dog()`, why do `pet.sound()` and `pet.group()` select different implementations?
      3. How does a race condition arise in `totalSold += quantity`, and what part of the problem does `AtomicInteger` address?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Choose ownership | Decide which fields and methods in the ticket wallet problem should be instance, static, or static final members. |
      | Predict data | Correctly calculate the tickets in each wallet and the total tickets sold after multiple calls. |
      | Explain dispatch | Distinguish instance method overriding from static method hiding using the `Animal`/`Dog` example. |
      | Recognize shared-state risks | Identify JVM/class loader boundaries, data persistence limitations, and non-atomic updates. |
  - slug: class-004
    title: Member Access Levels
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Member Access Levels
    problemSolved: Where can members be accessed from?
    mechanism: Design access boundaries
    applicationValue: Keep APIs minimal and protect data
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Member Access Levels**

      Design access boundaries for fields, methods, and constructors using the four levels: `private`, package-private, `protected`, and `public`. The focus is on preserving business invariants through public APIs and correctly applying `protected` rules when a subclass is in a different package.

      ## 2. Questions Learners Must Be Able to Answer

      ### The Four Access Levels

      1. What do the four access levels permit within the same class, the same package, a subclass in another package, and a non-subclass in another package?
      2. Why can `ExchangeStudent` call `this.addCredits()` but not `other.addCredits()` when other has type `Student`?
      3. Why is `vn.edu.school.domain.audit` not automatically in the same package as `vn.edu.school.domain`?

      ### API Design and Language Restrictions

      1. Why must `credits` be protected while `getCredits()` may be public?
      2. Which access modifiers can a top-level class use, and why can an override not reduce visibility?
      3. When should you choose a private constructor, a package-private helper, or a protected extension point?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Interpret access permissions | Analyze whether statements in `StudentAudit`, `ExchangeStudent`, and `StudentViewer` are valid. |
      | Apply protected access correctly | Explain which receivers are valid for a protected method when inheriting across packages. |
      | Design a minimal interface | Keep data private, expose only necessary getters and operations, and choose the narrowest access level. |
      | Identify compilation errors | Fix invalid modifiers on top-level classes or overrides that reduce access. |
  - slug: class-005
    title: Method Parameters, Return Values, and Side Effects
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Method Parameters, Return Values, and Side Effects
    problemSolved: What does a method receive, return, and modify?
    mechanism: Predict state before and after calls
    applicationValue: Define method contracts and side effects
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Method Parameters, Return Values, and Side Effects**

      Interpret method contracts in terms of parameters, arguments, return types, side effects, and errors. Learners must explain Java pass-by-value, including copying a reference value that points to a mutable object, and design APIs that do not expose internal state.

      ## 2. Questions Learners Must Be Able to Answer

      ### Inputs, Outputs, and Passing Values

      1. How does a parameter differ from an argument, and how does `return result` differ from `System.out.println(result)`?
      2. Why does `update(int, StringBuilder)` not change the caller's `score` variable, why can it change the contents of `note`, and why does reassigning `note` not change the caller's reference?
      3. Why does Java not allow overloading based only on the return type, and what positional restriction applies to varargs?

      ### Side Effects and Safe Contracts

      1. Why can a `void` method still have side effects, and why is a getter that does not modify fields not necessarily a pure function?
      2. In `JobCounter`, what are the results and states after `addJobs(-1)`, an overflow, or `completeOne()` when no jobs remain?
      3. Why can a getter that returns a mutable `List` break encapsulation, and what does `List.copyOf` protect?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Analyze methods | Identify inputs, return values, side effects, exceptions, and validity conditions for specific signatures and logic. |
      | Predict pass-by-value behavior | Explain results involving primitives, `StringBuilder`, List, and parameter reassignment. |
      | Design contracts | Write update operations that validate before modifying state and return meaningful `boolean`/`void` results. |
      | Protect internal data | Choose defensive copies or read-only APIs when returning mutable collections. |
  - slug: class-006
    title: Read-Only and Mutable Members
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Read-Only and Mutable Members
    problemSolved: Who can change data, and how?
    mechanism: Distinguish reading, reassignment, and mutation
    applicationValue: Use `final`, getters, copies, and business operations
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Read-Only and Mutable Members**

      Distinguish data that is read-only to external code, `final` fields that cannot be reassigned, and truly immutable objects. Through `Product`, `Course`, and `Inventory`, choose getters, validating setters, business operations, and defensive copies according to the rules for changing data.

      ## 2. Questions Learners Must Be Able to Answer

      ### What Read-Only and Final Mean

      1. How does `private final String sku` differ from `private int available` when external code can only read the latter through a getter?
      2. Why does `final List` not make the list immutable, and why can `getItems().clear()` still change its contents?
      3. How do a read-only API, a `static final` constant, a mutable object, and an immutable object differ?

      ### Designing Mutable Data

      1. When is a validating setter appropriate, and when should operations such as `reserve()`/`restock()` be used instead?
      2. How do `Collections.unmodifiableList`, `List.copyOf`, and an `ArrayList` copy differ?
      3. Why might a record containing a List component still need a defensive copy to protect its data?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Choose mutation permissions | Propose fields, getters, setters, or operations for SKUs, names, prices, and inventory. |
      | Identify vulnerabilities | Explain how a getter returning a mutable List can allow internal state to be modified. |
      | Create APIs that return safe data | Apply `List.copyOf` or an appropriate copy and explain the limitations of shallow copying. |
      | Validate constraints | Predict responses to negative prices and orders exceeding available stock. |
  - slug: class-007
    title: Referencing the Current Object
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Referencing the Current Object
    problemSolved: Which object does `this` refer to?
    mechanism: Always identify the current instance
    applicationValue: Initialize and call methods on the correct receiver, with valid chaining
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Referencing the Current Object**

      Use `this` to refer to the object receiving a call, distinguish fields from shadowing parameters, delegate between constructors, and return an instance for method chaining. The lesson also explains the limitations of static contexts, inner classes, and the risk of exposing an object too early from its constructor.

      ## 2. Questions Learners Must Be Able to Answer

      ### Referencing the Current Object

      1. In `this.username = username`, what does each side refer to, and why can `username = username` leave the field as `null`?
      2. Why do `lan.completeLesson()` and `minh.completeLesson()` yield different values of `this`?
      3. What do `return this`, `this == other`, and alias assignment reveal about object identity?

      ### Constructors and Special Contexts

      1. How does `this(...)` differ from `this.field` and `super(...)`, and what do Java 17/21 require about the position of a constructor call?
      2. Why is `this` unavailable inside a static method even though a static method can process an object passed to it?
      3. What risks arise when `this` is passed to a listener inside the constructor, and which object does `OuterClass.this` refer to?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Fix shadowing | Change `value = value` to `this.value = value` and predict the field's value. |
      | Chain constructors | Write overloaded constructors using `this(...)` according to Java 17/21 rules. |
      | Track the same instance | Explain method chaining, `return this`, and the results of reference comparisons. |
      | Distinguish contexts | Recognize static contexts, `OuterClass.this`, and the risk of this-escape in constructors. |
  - slug: class-008
    title: Designing a Class with a Bank Account Example
    status: WRITTEN
    difficult: ADVANCED
    focus: Designing a Class with a Bank Account Example
    problemSolved: How can transactions preserve the balance invariant?
    mechanism: Assess correctness and the limits of the model
    applicationValue: Combine encapsulation, invariants, and error checks
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Designing a Class with a Bank Account Example**

      Combine class structure, constructors, encapsulation, method contracts, and invariants in a single-threaded `BankAccount` model. Learners design deposits, withdrawals, and transfers with validation before updates, and distinguish an in-memory simulation from safe, secure, and auditable transactions in a real banking system.

      ## 2. Questions Learners Must Be Able to Answer

      ### Model and Invariants

      1. Why are accountNumber/holderName declared `private final` while `balanceVnd` is `private long`?
      2. Which conditions must the constructor, `deposit()`, `withdraw()`, and `transferTo()` check before changing a balance?
      3. Why can `transferTo()` read the `private` field of a destination belonging to the same class, and why must it calculate the destination balance before subtracting from the source balance?

      ### Edge Cases and Limitations

      1. What should the result and state be when `withdraw` exceeds the balance, a transfer targets `this`, or a `long` addition overflows?
      2. Why does the example use `long` for VND, while fractional amounts or multiple currencies often require BigDecimal and rounding rules?
      3. Why are two in-memory field assignments insufficient to guarantee atomic transactions, thread safety, authorization, and audit trails?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Map requirements to a class | Design fields, a constructor, getters, and `deposit`, `withdraw`, and `transferTo` operations with clear responsibilities. |
      | Protect balances | Check for positive amounts, sufficient funds, a valid destination, and overflow before updating. |
      | Simulate transactions | Calculate two account balances after each step and verify that internal transfers preserve the total amount. |
      | Verify edge cases | Identify expected exceptions and confirm balances remain unchanged when validation fails. |
      | Recognize architectural limitations | Explain when database transactions, concurrency control, authorization, and transaction logging are needed. |
- slug: object
  title: Objects
