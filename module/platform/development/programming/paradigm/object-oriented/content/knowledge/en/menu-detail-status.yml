  - slug: language-mechanics-001
    title: Generic Types and Parameterized Classes
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Generic Types and Parameterized Classes
    problemSolved: How do generic classes and methods provide type safety?
    mechanism: Separate algorithms from concrete types without sacrificing type safety
    applicationValue: Reuse typed APIs and reduce casts
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Generic Types and Parameterized Classes**

      Understand the role of **Java generics** in type contracts and class/method reuse. Using `Box<T>`, `Pair<K,V>`, and `InMemoryRepository<ID,T>`, distinguish generic declarations, type parameters, type arguments, inference, and generic methods; recognize the limitations of invariance, wildcards, type erasure, and the risks of raw types.

      ## 2. Questions Learners Should Be Able to Answer

      ### Structure and Use of Generic Types

      1. In `Box<T>`, `Box<String>`, and `new Box<>("Java")`, which is a type parameter declaration, which is a type argument, and what does the compiler infer?
      2. Why does `Pair<K,V>` represent two independent types, while `InMemoryRepository<ID,T>.findById(ID)` preserves the `Optional<T>` result type?
      3. How does the method `<R> Box<R> map(...)` differ from the class's `T`, and why must a static method declare its own type parameter?

      ### Type Safety and Limitations

      1. Why can't `List<Integer>` be assigned to `List<Number>`, and why is `Box<Integer>` not a `Box<Number>`?
      2. What types can be read or written through `List<? extends Number>` and `List<? super Integer>`, and how does PECS guide the design of `copyAll`?
      3. How does type erasure affect `new T()`, `instanceof List<String>`, overloading, and `static T`?
      4. How can a raw `List` add an `Integer` to a `List<String>`, and where could this cause heap pollution and a `ClassCastException`?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Declaring generic structures | Write `Box<T>`, `Pair<K,V>`, and typed repositories whose getters, setters, and queries preserve type arguments. |
      | Organizing generic methods | Use `<R>`, static `<T>`, and diamond inference without manual casts. |
      | Choosing type-safe APIs | Identify where bounds or wildcards are needed and explain assignments rejected due to invariance. |
      | Recognizing erasure boundaries | Explain generic operations that cannot compile and replace `new T()` with a suitable factory/Supplier. |
      | Verifying contracts | Identify compile-time errors, unchecked warnings, null policies, and runtime behavior in the examples. |
  - slug: language-mechanics-002
    title: Type Parameter Bounds
    status: WRITTEN
    difficult: ADVANCED
    focus: Type Parameter Bounds
    problemSolved: Which capabilities does T require?
    mechanism: Require only the capabilities generic T truly needs
    applicationValue: Specify precise bounds in algorithm signatures
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Type Parameter Bounds**

      Declare **bounded type parameters** so algorithms accept only types with the required capabilities. The lesson examines `<T extends Number>`, intersection `&`, `Comparable<? super T>`, the recursive bound `<E extends Enum<E>>`, and the effects of erasure while distinguishing bounds on `T` from use-site wildcards.

      ## 2. Questions Learners Should Be Able to Answer

      ### Upper Bounds and Generic Algorithms

      1. Why can `NumberBox<T extends Number>` call `doubleValue()` while `Box<T>` cannot?
      2. Why must a class bound precede interfaces in `<T extends Number & Comparable<? super T>>`, while commas separate distinct type parameters?
      3. Why does `Comparable<? super T>` allow `Employee`, which inherits `Comparable<Person>`, to be used with the `max` function?
      4. Why does a `Number` bound not automatically provide the `+` operator for `T` or guarantee exact monetary calculations and non-null values?

      ### Wildcards, Recursive Bounds, and Runtime

      1. When the result must preserve `T`, should a bounded generic method or the wildcard `? extends Number` be used, and why?
      2. When is `? super Integer` appropriate for a write destination, and why does Java disallow `<T super Integer>`?
      3. What does `<E extends Enum<E>>` express, and is an incorrect enum constant name detected at compile time or runtime?
      4. Which bound does erasure select from an intersection bound, and why are `new T()` and `instanceof T` restricted?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Designing valid bounds | Declare `<T extends Number & Comparable<? super T>>` for `NumericRange` and validate it. |
      | Supporting valid subtypes | Explain and run `max(List<Employee>)` when Employee compares through Person. |
      | Choosing between T and wildcards | Write appropriate signatures for a function returning the exact element type and one that only reads numbers. |
      | Recognizing type-system errors | Distinguish compile-time errors, erasure, null data, and runtime invariant checks. |
  - slug: language-mechanics-003
    title: Type Relationships in Generic Constructs
    status: WRITTEN
    difficult: ADVANCED
    focus: Type Relationships in Generic Constructs
    problemSolved: How do assignments and reads/writes work with List<T>?
    mechanism: Reason from source/destination and subtyping
    applicationValue: Choose wildcards/PECS according to data flow
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Type Relationships in Generic Constructs**

      Understand **type relationships between generic declarations and parameterized types**: Java uses invariance for concrete type arguments but supports use-site variance through `?`, `? extends`, and `? super`. Through `GenericTypeRelationsDemo`, determine valid assignments, read/write capabilities, PECS, wildcard capture, generic inheritance, and the differences from array covariance.

      ## 2. Questions Learners Should Be Able to Answer

      ### Subtypes, Invariance, and Wildcards

      1. Why is `ArrayList<Integer>` a `List<Integer>`, while `List<Integer>` is not a `List<Number>`?
      2. When a reference has type `List<?>`, `List<? extends Number>`, or `List<? super Integer>`, which read types and `add` operations does the compiler guarantee?
      3. Why is `List<?>` not equivalent to `List<Object>`, and why does a wildcard not make a collection immutable?

      ### Designing and Verifying Type Relationships

      1. Why does `<T> copy(List<? super T> dst, List<? extends T> src)` allow copying from `Integer` to `Number`?
      2. Why does `StringStore extends MemoryStore<String>` implement `Store<String>` but not become a `Store<Object>`?
      3. In `swapFirstTwo(List<?>)`, how does the `<T>` helper solve wildcard capture?
      4. Array covariance can cause an `ArrayStoreException` at runtime; at what stage does generic invariance reject the analogous assignment?
      5. How can type erasure and raw types cause name clashes or heap pollution?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Predicting type validity | Correctly classify assignments involving `List<Integer>`, `List<Number>`, wildcards, and `Store<T>`. |
      | Choosing producer/consumer signatures | Refine sum/copy/seed APIs according to their data-reading and data-writing roles. |
      | Handling wildcard capture | Use a generic helper to swap values of the same element type without unchecked casts. |
      | Explaining type errors | Distinguish compile-time errors, `ArrayStoreException`, heap pollution, and list mutability. |
  - slug: language-mechanics-004
    title: Static Types, Runtime Types, and Type Checking
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Static Types, Runtime Types, and Type Checking
    problemSolved: What is decided by the compiler versus runtime?
    mechanism: Separate compile-time types from runtime objects
    applicationValue: Handle dispatch, casts, and validation correctly
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Static Types, Runtime Types, and Type Checking**

      Distinguish a **statically typed language** from runtime polymorphism in Java. Through `Notification`, learners distinguish a variable's static type from the object's actual class, explain how overloads are selected by static types and overrides dispatched by runtime objects, recognize `var` as type inference, and apply runtime validation at data/JSON/reflection boundaries instead of unchecked casts.

      ## 2. Questions Learners Should Be Able to Answer

      ### Static Types and Dynamic Behavior

      1. With `Notification n = new EmailNotification()`, what type does the compiler see, and which `format()` implementation does the JVM invoke?
      2. Why is `describe(Object)` selected when a variable has type `Object` despite holding a `String`, while `describe((String)value)` selects a different overload?
      3. Can a string later be assigned to `var count = 10`, and how does this differ from dynamic typing?
      4. How does static method hiding differ from runtime dispatch of overridden instance methods?

      ### Runtime Checks and API Design

      1. Why can `(String) Integer.valueOf(42)` lead to a `ClassCastException`, while pattern matching with `instanceof` handles inputs of unknown type more safely?
      2. Generics check type arguments at compile time, so why can't `instanceof List<String>` be used when receiving JSON?
      3. What does Class<T>.isInstance/cast validate, and why must empty emails, negative amounts, and business authorization still be checked?
      4. When is `instanceof` appropriate for classification at a boundary, and when should interfaces and polymorphism be used instead?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Distinguishing type systems | Explain how statically typed Java supports dynamic dispatch and how it differs from Python/JavaScript. |
      | Predicting dispatch | Interpret overload(Object/String) results, overridden `format()`, and static method hiding correctly. |
      | Using safe type checks | Classify `Object` with pattern matching via `instanceof`/`Class.cast`, without unchecked downcasts. |
      | Validating external data | Convert `List<?>` to `List<String>` with per-element checks while still validating business rules. |
  - slug: language-mechanics-005
    title: Operators, Properties, and Language Conventions
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Operators, Properties, and Language Conventions
    problemSolved: How do expressions, fields, and properties behave?
    mechanism: Analyze result types and permissions to update state
    applicationValue: Calculate and encapsulate according to Java rules
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Operators, Properties, and Language Conventions**

      Use operators, numeric promotion, short-circuit evaluation, fields/accessors, and Java conventions to build meaningful OOP APIs while avoiding calculation errors, overflow, and state leaks. The lesson distinguishes `==` from value equality, JavaBeans properties from fields, `record` accessors from getters, and `final`, `static`, and `var` from genuine immutability.

      ## 2. Questions Learners Should Be Able to Answer

      ### Operators and Expression Evaluation

      1. Why does `5 / 2` evaluate to 2 before assignment to a double, while `(double)5/2` yields 2.5?
      2. How do precedence, associativity, and evaluation order differ in `"Tổng: " + 1 + 2` and `x = y = z`?
      3. Why can `byte value = 127; value += 1` become negative, while `Math.addExact` throws on overflow when it matters?
      4. Why does `&&` preserve a null guard while `&` still evaluates the right operand, and how do `>>` and `>>>` differ when shifting negative numbers?

      ### Fields, Properties, and Behavior

      1. For String, arrays, and records, when should `==`, `equals`, `Arrays.equals`, or BigDecimal's `compareTo` be used?
      2. How do fields, JavaBeans properties (`getX/isX`), local variables, and record component accessors `x()` differ?
      3. Why does a `final List` remain mutable, and when are `List.copyOf` or domain behaviors needed instead of setters?
      4. How do the `Product` record and `CartLine.increaseQuantity()` control unit prices and quantities?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Evaluating expressions correctly | Predict integer division, numeric promotion, short-circuiting, bit shifts, `?:`, and narrowing with `+=`. |
      | Protecting calculations | Apply Math.addExact/multiplyExact, VND currency units, and appropriate decimal representations. |
      | Designing encapsulation | Distinguish fields, getters/setters, record accessors, `final`, and mutable data. |
      | Verifying effects | Write a quantity-increase API with validation and test that failures leave state unchanged. |
  - slug: language-mechanics-006
    title: Equality and Hash Code Contracts
    status: WRITTEN
    difficult: ADVANCED
    focus: Equality and Hash Code Contracts
    problemSolved: What constitutes equal values and compatible hashes?
    mechanism: Define stable domain identity and value equality
    applicationValue: Enable hash collections to recognize valid keys
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Equality and Hash Code Contracts**

      Define **value equality** or identity deliberately through `equals(Object)` and `hashCode()` so `HashSet`/`HashMap` recognize keys correctly. The lesson covers reflexivity, symmetry, transitivity, hash collisions, immutable keys, fields participating in equality, arrays/records/BigDecimal, and pitfalls involving inheritance or JPA entities with generated IDs.

      ## 2. Questions Learners Should Be Able to Answer

      ### Equals and Hash Contracts

      1. How does `==` between references differ from `equals` on `CustomerId` and a `Comparable` comparison returning 0?
      2. What are the five properties of `equals(Object)`, and why does `equals(a,b)` being true require equal hash codes while equal hash codes do not prove equality?
      3. Why do `HashSet.add` and `HashMap.get` need both `hashCode` and `equals` to handle collisions?
      4. Why must equality based on `tenantId` + `customerId` have a hash consistent with the same identity semantics?

      ### Lifecycle and Data Structure Pitfalls

      1. What happens if a key's `username` changes after `Map.put`, even when equals/hashCode use the same field?
      2. Why can `Point.equals(ColoredPoint)` violate symmetry, and how can `final`/composition help avoid the problem?
      3. Does a record containing an array automatically use `deepEquals`, and when are `Arrays.equals` + `Arrays.hashCode` and defensive copying needed?
      4. Why do `BigDecimal("1.0")` and `BigDecimal("1.00")` differ in a HashSet but potentially count as one value in a TreeSet?
      5. For a JPA entity with a database-generated ID and proxy, why is there no single equals/hashCode formula for every lifecycle?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Writing safe value objects | Implement immutable `CustomerId`/`ProductKey` values with equals/hashCode based on a consistent set of identity fields. |
      | Verifying hash collections | Show that an equal-valued new key can retrieve an entry from `HashMap` and adding it to `HashSet` does not increase the element count. |
      | Detecting risks | Identify mutable keys, hash collisions, symmetry violations caused by inheritance, and comparator differences. |
      | Handling special types | Choose appropriate equality/hash behavior for arrays, records, and BigDecimal, and evaluate ORM entities across their lifecycles. |
      | Testing contracts | Design tests for reflexivity, symmetry, transitivity, null handling, hash consistency, and key stability. |
  - slug: language-mechanics-007
    title: Object String Representations and Diagnostics
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Object String Representations and Diagnostics
    problemSolved: What data should be included when logging an object?
    mechanism: Separate diagnostic text from public APIs and schemas
    applicationValue: Provide safe, traceable diagnostics without exposing secrets
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Object String Representations and Diagnostics**

      Design **`toString()` as a diagnostic representation** to help developers track IDs and state without exposing secrets or incurring I/O costs. Through `Order` and `OrderDiagnostic`, the lesson distinguishes developer-facing strings from DTOs, APIs, and customer messages, and examines `Object.toString`, records/arrays/collections, logging, stack traces, and recursion errors caused by bidirectional relationships.

      ## 2. Questions Learners Should Be Able to Answer

      ### Object Representations and Safe Data

      1. Why is Object's `ClassName@hexHash` neither a reliable memory address nor a business ID?
      2. How do `println(order)` and `String.valueOf(order)` use `toString`, and how does that differ from directly calling `nullRef.toString()`?
      3. Why should `Order.toString` include `orderId`, `status`, `itemCount`, and `traceId` but omit email addresses and tokens?
      4. Why might the automatically generated toString of `record Credentials` expose passwords, and why do arrays need `Arrays.toString/deepToString`?

      ### Diagnostics and Side Effects

      1. Why can `Parent`/`Child` objects printing each other cause `StackOverflowError`, and how does representing relationships by ID help?
      2. Why shouldn't `toString` query a repository, traverse a large graph, or become an API's JSON/schema format?
      3. How does logging with levels, suppliers/placeholders, and a passed Throwable differ from simply concatenating message strings?
      4. Which tests confirm that diagnostics include useful fields without exposing secrets, even as formatting changes?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Overriding toString deliberately | Create concise, non-null, side-effect-free diagnostics with an appropriate allowlist of fields. |
      | Controlling sensitive data | Distinguish fields safe to log from email addresses/tokens that must be omitted and write leak-prevention tests. |
      | Recognizing recursion and performance costs | Identify reference cycles, lazy loading, large lists, and shallow-snapshot mitigations. |
      | Separating representation purposes | Design separate DTOs, public views, and structured logs instead of parsing or serializing `toString`. |
  - slug: language-mechanics-008
    title: Exceptions, Failure States, and Method Contracts
    status: WRITTEN
    difficult: ADVANCED
    focus: Exceptions, Failure States, and Method Contracts
    problemSolved: What does failure mean, and what state remains?
    mechanism: Design failure paths alongside successful paths
    applicationValue: Define method contracts, failure atomicity, and appropriate retries
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Exceptions, Failure States, and Method Contracts**

      Design **method contracts** covering preconditions, postconditions, invariants, side effects, and failure semantics. Through `StockService.reserve`, distinguish `Reserved/Rejected` for expected business outcomes, `IllegalArgumentException` for invalid inputs, and infrastructure exceptions for failures; understand checked/unchecked exceptions, propagation/causes, try-with-resources, and state protection during failures and concurrent operations.

      ## 2. Questions Learners Should Be Able to Answer

      ### Results, Exceptions, and Contracts

      1. Why do OUT_OF_STOCK, negative quantities, and unavailable databases require results or exceptions with different meanings?
      2. What do preconditions, postconditions, invariants, failure contracts, and atomicity say about the state after `reserve`?
      3. When should `boolean`, `Optional`, a sealed `ReserveResult`, or a domain exception be chosen?
      4. Which compile-time rules distinguish checked from unchecked exceptions, and how do `throw` and `throws` differ?

      ### Propagation, Atomicity, and Substitution

      1. Why does `new RuntimeException(e.getMessage())` lose the cause, and at which layer should exceptions be translated?
      2. How does try-with-resources preserve primary and suppressed exceptions, and why is cleanup not the same as rollback?
      3. If a balance has already been debited before sending email throws an exception, does catching the exception undo the debit, and what must transactions/outboxes/idempotency address?
      4. Under LSP, how can adding a checked exception or changing the meaning of Optional.empty in an override break a contract?
      5. Why is retrying after a timeout not always safe, and how should `InterruptedException` be handled or the interrupt status restored?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Writing clear contracts | Describe inputs, results, rejection behavior, and state that remains unchanged after failure. |
      | Classifying failures at the right layer | Design meaningful Result/Optional values or exceptions without masking database failures as missing data. |
      | Preserving causes and resources | Wrap exceptions with their causes, use try-with-resources, and distinguish suppressed exceptions. |
      | Preserving state | Test success, rejection, and invalid arguments, verifying that no unintended state changes occur. |
      | Evaluating distributed-system risks | Explain transactions, optimistic locking, retries, and idempotency when side effects are involved. |
  - slug: language-mechanics-009
    title: Language Differences When Implementing the Same OOP Design
    status: WRITTEN
    difficult: ADVANCED
    focus: Language Differences When Implementing the Same OOP Design
    problemSolved: Which design aspects must remain consistent across languages?
    mechanism: Prioritize responsibilities and invariants over syntax
    applicationValue: Port OOP behavior with parity tests
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Language Differences When Implementing the Same OOP Design**

      Compare how **the same `ShippingPolicy` model** is represented in Java, Kotlin, Python, TypeScript, and C#, identifying differences in nominal/structural typing, records/data classes/protocols/interfaces, equality/nullability semantics, integers/decimals, and runtime validation. The focus is on preserving the shipping-fee contract when porting code rather than copying classes one by one.

      ## 2. Questions Learners Should Be Able to Answer

      ### The Same Requirements Across Five Languages

      1. Which shared roles represent the rules `standard = 20.000 VND` and `express = 35.000 + 8.000 × ceil(grams/1000)`?
      2. How do Java/Kotlin/C# declare nominal interface contracts, and how does this differ from Python Protocol and TypeScript structural typing?
      3. How do Java records, Kotlin data classes, Python frozen dataclasses, TypeScript Readonly, and C# readonly record structs differ in reference/value behavior and deep immutability?
      4. Why does Python `bool` require a separate check despite inheriting from int, while TypeScript JSON/number values require runtime validation?

      ### Porting Designs While Preserving Correctness

      1. Why do Java/Kotlin/C# use integer division, Python use `//`, and TypeScript use `Math.ceil` when calculating fees for positive weights?
      2. Why should Java record `equals`, Kotlin `==`/`===`, Python `==`/`is`, JS `===`, and C# record equality not be translated mechanically?
      3. Which tests ensure that 1, 1000, 1001, 1200, and 100000 grams and error cases behave consistently across implementations?
      4. When can a single-method interface be replaced with a function type/callable while preserving the policy/service boundary?

      ## 3. Expected Learning Outcomes

      | Competency | Expected outcome |
      | --- | --- |
      | Comparing language mechanisms | Explain nominal/structural typing, nullability, and runtime checks across all five languages. |
      | Preserving shipping-fee contracts | Implement/test the standard/express formulas and reject weights outside 1–100000 grams. |
      | Distinguishing equality and mutability | Identify differences in reference/value semantics, readonly/final, and mutable collections when porting code. |
      | Porting with verification | Build a parity-test matrix for boundary weights, unsupported codes, and JSON data with incorrect types. |
- slug: design-pitfalls
  title: Design Pitfalls
  childs:
  - slug: design-pitfalls-001
    title: Classes with Too Many Responsibilities
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Classes with Too Many Responsibilities
    problemSolved: Which classes have too many reasons to change?
    mechanism: Evaluate cohesion through reasons for change.
    applicationValue: Separate modules along verifiable responsibilities.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Classes with Too Many Responsibilities**

      A large class is not necessarily poorly designed; the God Class problem arises when one class has multiple unrelated reasons to change, such as pricing, data persistence, notifications, and validation. This lesson helps identify responsibility boundaries based on policies and side effects, separate use-case orchestration from calculators/repositories/notifiers, and use characterization tests to preserve business results during refactoring. Adding more classes helps only if it reduces coupling without making the process harder to understand.

      ## 2. Questions Learners Must Be Able to Answer

      ### Identifying Real Responsibilities

      1. Why are line counts or method counts insufficient to classify a class as a God Class?
      2. When OrderManager must change because of pricing rules, SQL, and email, which distinct reasons for change have been combined?
      3. What does SRP say about related reasons for change, and why is a multi-step use case not necessarily a God Class?
      4. What signs in code, git history, and unit tests reveal high coupling or low cohesion?

      ### Separating Classes While Preserving Behavior

      1. In the ordering process, which responsibilities belong in PlaceOrderUseCase, PriceCalculator, the repository, and the notifier?
      2. Why does splitting a God Class into many forwarding-only classes, or moving everything into Utils, fail to solve the problem?
      3. If order persistence succeeds but notification delivery fails, which transaction boundaries need consideration when separating classes?
      4. Which inputs, results, exceptions, and side effects should be recorded before refactoring to prevent regressions?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Analyze God Classes | Identify when OrderManager or UserManager needs separation based on responsibilities and reasons for change, rather than length alone. |
      | Redesign boundaries | Sketch how PlaceOrderUseCase coordinates PriceCalculator, the repository, and the notifier, each with specific responsibilities. |
      | Preserve business contracts | Create characterization tests for pricing results, persistence operations, and failure flows when moving code. |
      | Evaluate refactoring outcomes | Identify cases where wrappers, Utils, or too many small classes only change the structure without reducing coupling. |
  - slug: design-pitfalls-002
    title: Exposed State and Broken Invariants
    status: WRITTEN
    difficult: ADVANCED
    focus: Exposed State and Broken Invariants
    problemSolved: Who controls invariants and aliases?
    mechanism: State invariants, then trace every mutation path.
    applicationValue: Keep data valid through all operations and failures.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Exposed State and Broken Invariants**

      This lesson focuses on protecting object invariants throughout the entire lifecycle, not merely validating data at construction. The SeatInventory example requires reserved seats to stay between 0 and capacity and rejects invalid operations without changing existing state. Collection and record examples show how private/final fields or an unmodifiable view may still expose mutation paths through aliases. Learners examine state-changing paths, constructors, subclasses, and concurrent access to design behavior-oriented APIs and test invariants.

      ## 2. Questions Learners Must Be Able to Answer

      ### Invariants and Encapsulation

      1. How does the invariant requiring reserved to remain between 0 and capacity differ from the precondition requiring positive seats in reserve()?
      2. Why do private and final fields fail to protect state when a getter returns the mutable list itself or a constructor retains an external alias?
      3. How does Collections.unmodifiableList(view) differ from a defensive snapshot created with List.copyOf when the original list is later modified?
      4. How can independent start/end setters violate the requirement that start precede end?

      ### Update Paths and Testing

      1. Under concurrent access, what kind of single operation must SeatInventory.reserve use to check available seats and update the count?
      2. Why is a record containing a mutable List not deeply immutable, and how can a protected field allow validation to be bypassed?
      3. When a reservation or schedule update is rejected, which postconditions should tests verify?
      4. How do invariants, immutability, and thread safety differ, even though they often occur together?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Specify and verify invariants | Express 0 <= reserved <= capacity and predict state after valid and rejected reservation/cancellation cases. |
      | Close unauthorized mutation paths | Fix LeakyCart or BrokenTeam with business methods, defensive copies, and appropriate alias boundaries. |
      | Design atomic updates | Propose synchronized or another synchronization mechanism to make seat check-and-update operations race-free. |
      | Test failure cases | Write tests for invalid inputs, capacity violations, and unauthorized mutations through collections or independent setters. |
  - slug: design-pitfalls-003
    title: Excessive Getters and Setters Without Behavior
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Excessive Getters and Setters Without Behavior
    problemSolved: Who owns the state-transition rules?
    mechanism: Tell an object to perform the right behavior.
    applicationValue: Make domain APIs harder to misuse.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Excessive Getters and Setters Without Behavior**

      This lesson distinguishes business objects consisting only of getters/setters from objects that enforce their own behavioral rules. For the Order lifecycle, replacing setStatus with confirm, ship, and cancel, and getLines().add with addLine, lets the state owner validate transitions, amounts, and line items. The lesson also notes that getters/setters can be appropriate for DTOs, transaction scripts, JPA entities, and simple data classes; the choice must reflect actual invariants and transaction boundaries.

      ## 2. Questions Learners Must Be Able to Answer

      ### From Data to Behavior

      1. Why does an Order class exposing only getStatus/setStatus while services perform every state check suggest an anemic domain model?
      2. Which rules governing the DRAFT → CONFIRMED → SHIPPED lifecycle and CANCELLED should live in Order methods?
      3. Does renaming setStatus to changeStatus solve the problem if any state can still be assigned?
      4. Where does Tell, Don't Ask place business decisions, and does it prohibit all queries/getters?

      ### Context and Verification

      1. Why can a DTO, report row, or simple transaction script legitimately retain a data-oriented design?
      2. Before removing setters from a JPA entity with many callers, which mappings, use cases, and persistence contracts must be checked?
      3. Which tests verify that confirm/ship/cancel reject invalid transitions and preserve state after an error?
      4. Why is encapsulating state inside Order insufficient to guarantee concurrency safety, transactions, or idempotency?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Build business-oriented APIs | Replace setStatus/setItems with confirm, ship, cancel, and addLine, with explicit preconditions and postconditions. |
      | Trace lifecycles | Predict valid and forbidden Order state transitions and why they are rejected. |
      | Distinguish object types | Analyze Entities, Value Objects, DTOs, and Application Services to decide where logic, getters, and setters belong. |
      | Refactor and test safely | Test success/failure paths and review callers/JPA mappings before restricting setters. |
  - slug: design-pitfalls-004
    title: Inheritance Used Only to Reuse a Few Methods
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Inheritance Used Only to Reuse a Few Methods
    problemSolved: Does the subtype honor the parent contract?
    mechanism: Choose is-a by meaning, not code reuse.
    applicationValue: Preserve LSP and eliminate unwanted inherited methods.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Inheritance Used Only to Reuse a Few Methods**

      This lesson explains that `extends` is a commitment that a subtype can substitute for its parent, not merely a shortcut for borrowing a few methods. `Inventory extends HashMap` unintentionally exposes put, clear, and other operations that can violate inventory rules; a composition-based version keeps Map internal and permits only validated restock/reserve operations. Learners distinguish composition from delegation, assess the risks of protected hooks and constructor-time overriding, and use inheritance only when the superclass contract genuinely fits.

      ## 2. Questions Learners Must Be Able to Answer

      ### Valid Types and Contracts

      1. Why does extending a formatting utility merely to call its method create a false is-a relationship for PricingService?
      2. Which APIs inherited when Inventory extends HashMap can bypass stock-count invariants?
      3. What does the Liskov Substitution Principle require if every Inventory is treated as a Map?
      4. What risks arise if a base constructor calls an overridable method before subclass fields are initialized?

      ### Redesign and Verification

      1. How does keeping Map private inside Inventory and exposing restock/reserve change the responsibility boundary?
      2. In this example, how does composition describe the object structure, and which calls illustrate delegation?
      3. When a subclass truly is a subtype with documented extension points, why can inheritance still be appropriate?
      4. Which tests prove that reserve cannot make stock negative even if clients attempt to bypass validation?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Recognize misleading inheritance | Explain why Inventory extends HashMap or Service extends Utility creates incorrect APIs/contracts. |
      | Propose composition | Design Inventory with a private Map and invariant-preserving restock/reserve methods. |
      | Verify substitutability | Explain which LSP conditions must hold before using extends. |
      | Test exposed behavior | Test put/clear access paths, reserving more than available stock, and state protection after refactoring. |
  - slug: design-pitfalls-005
    title: Overusing Casts and Type Checks
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Overusing Casts and Type Checks
    problemSolved: How can shared behavior replace type branching?
    mechanism: Ask which behavior belongs to each subtype.
    applicationValue: Extend implementations without modifying callers.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Overusing Casts and Type Checks**

      This lesson identifies code that repeatedly uses `instanceof`, downcasting, or getClass() to select different implementations of the same behavior, then moves those algorithms into implementations of a shared interface such as ShippingPolicy. Learners still recognize legitimate type checks at untrusted-data boundaries, for optional capabilities, or in closed subtype hierarchies. The lesson emphasizes that casting does not change an object's runtime type, generics help preserve type safety, and contract tests must verify behavior rather than class names.

      ## 2. Questions Learners Must Be Able to Answer

      ### Casting and Polymorphism

      1. How do static types, runtime types, and dynamic dispatch differ when an Animal reference holds a Dog?
      2. Why might the compiler accept a cast from an Animal reference holding a Cat to Dog, even though it throws ClassCastException at runtime?
      3. What problem with responsibility distribution is revealed when many services branch on shipping types using instanceof?
      4. How does moving fee calculation into ShippingPolicy and its implementations change Checkout's role?

      ### Legitimate Exceptions and Boundaries

      1. When receiving an Object from JSON, a plugin, or a legacy API, why is type checking a necessary safeguard?
      2. When a subtype has an additional scan capability, why might a capability check be appropriate?
      3. How do generics or Class<T>.cast make conversions safer than unchecked casts?
      4. Why should checking the PAID state be modeled as a state rule rather than overusing state-specific subclasses?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Explain casting and runtime behavior | Predict the results of upcasting, downcasting, and ClassCastException cases. |
      | Refactor type branching | Replace shipping-fee branches with multiple ShippingPolicy implementations. |
      | Choose appropriate type checks | Classify instanceof usage at data boundaries, in sealed hierarchies, for capabilities, and in repeated branching. |
      | Verify contracts | Propose a shared test suite for every ShippingPolicy to ensure consistent results and behavior. |
  - slug: design-pitfalls-006
    title: Oversized Interfaces or Too Many Abstraction Layers
    status: WRITTEN
    difficult: ADVANCED
    focus: Oversized Interfaces or Too Many Abstraction Layers
    problemSolved: Which contract does a client actually need?
    mechanism: Design around client capabilities.
    applicationValue: Reduce API coupling and stub implementations.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Oversized Interfaces or Too Many Abstraction Layers**

      This lesson contrasts two pitfalls: a fat interface that forces clients to depend on unused operations, and excessive abstraction layers that merely forward calls. In the document-management example, PreviewService needs only DocumentReader, while EditorialService needs editing operations; segregation by client means a read-only source need not throw UnsupportedOperationException for save. Learners apply ISP to meaningful contracts, distinguish it from SRP/LSP/DIP, audit layers of indirection, and retain concrete classes when no useful variation boundary exists.

      ## 2. Questions Learners Must Be Able to Answer

      ### Contracts Matched to Client Needs

      1. Why does a DocumentManager exposing read, save, delete, and email make PreviewService depend on too broad an API?
      2. How does forcing ReadOnlyDocumentSource to throw UnsupportedOperationException for save affect the contract and LSP?
      3. How does splitting DocumentReader/DocumentWriter according to client needs differ from creating one interface per method?
      4. Does a default method that throws an unsupported-operation error really solve the fat-interface problem?

      ### Avoiding Useless Abstraction Layers

      1. When PreviewFacade → Provider → Factory merely forwards methods, which readability and change costs increase?
      2. How do client–method and implementation–capability matrices reveal appropriate ISP boundaries?
      3. When is a DocumentRepository combining Reader and Writer justified for a client that needs consistent operations?
      4. Why does restricting methods through an interface not automatically enforce authorization at an API boundary?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Analyze fat interfaces | Build a client-usage matrix identifying operations not needed by PreviewService and EditorialService. |
      | Segregate contracts with justification | Propose DocumentReader/DocumentWriter and assign implementations according to their capabilities without fake stubs. |
      | Evaluate abstraction layers | Identify pure forwarding classes with no policy, validation, or change boundary and simplify the call flow. |
      | Preserve compatibility | List affected clients and plan migration when replacing DocumentManager's public contract with smaller interfaces. |
  - slug: design-pitfalls-007
    title: Circular Dependencies and Deep Object Navigation
    status: WRITTEN
    difficult: ADVANCED
    focus: Circular Dependencies and Deep Object Navigation
    problemSolved: Are there cycles or excessive knowledge of the object graph?
    mechanism: Draw dependency and ownership graphs.
    applicationValue: Keep dependencies unidirectional and reduce ripple effects.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Circular Dependencies and Deep Object Navigation**

      This lesson distinguishes cycles in service/module dependency graphs from deep navigation through an object's internal structure. In the OrderService and ShippingService example, mutual calls complicate initialization and testing, while scattering `order.getCustomer().getAddress().getCity()` throughout business logic makes clients depend too heavily on internal representations. Learners use unidirectional dependencies, pass narrowly scoped ShipmentRequest/DTO data, move behavior to its proper owner, and introduce events/abstractions only when timing and consistency contracts can be preserved.

      ## 2. Questions Learners Must Be Able to Answer

      ### Recognizing Coupling in Graphs and Code

      1. By what criterion does the OrderService → ShippingService → OrderService graph form a dependency cycle?
      2. Why can constructor injection between two mutually dependent Spring beans cause initialization errors?
      3. How does deep object navigation differ from calling a fluent API or reading a DTO in a mapper?
      4. What limit does the Law of Demeter suggest for a service's knowledge of objects inside its collaborators?

      ### Breaking Cycles and Preserving Responsibilities

      1. Which reverse dependency is removed by passing ShipmentRequest and DeliveryAddress to ShippingService?
      2. How does moving behavior such as eligibleForShipping to the data-owning object differ from adding another getter that exposes the entire object graph?
      3. Why does merely extracting two interfaces while retaining A → BPort → B → APort → A fail to break the dependency cycle?
      4. If direct calls are replaced by an OrderPaid event, which timing, duplicate-delivery, and failure conditions need definition?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Draw and detect cycles | Diagram dependencies before and after changes among OrderService, ShippingService, and DeliveryGateway. |
      | Reduce deep navigation | Design ShipmentRequest or focused domain methods instead of getCustomer/getAddress/getCity chains in business logic. |
      | Plan cycle removal | Propose a unidirectional orchestration flow or extract a policy with clear ownership and evaluate its contract. |
      | Avoid superficial refactoring | Identify cycles that persist after introducing interfaces and risks of using events merely to avoid direct calls. |
  - slug: design-pitfalls-008
    title: Hard-to-Control Shared State
    status: WRITTEN
    difficult: ADVANCED
    focus: Hard-to-Control Shared State
    problemSolved: Who modifies shared state, and through what mechanism?
    mechanism: Separate visibility, atomicity, and transactions.
    applicationValue: Avoid races, cross-request leaks, and lost updates.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Hard-to-Control Shared State**

      This lesson explains failures that arise when multiple references can modify the same state, both without parallel threads through aliasing and with concurrency through check-then-act operations. Using shared counters/quotas, learners distinguish volatile, synchronized, atomic operations, concurrent collections, transactions, and idempotency; no single keyword fixes every boundary. The lesson also warns about Spring static/singleton services retaining request data and distinguishes state within one JVM from state in a database/cluster.

      ## 2. Questions Learners Must Be Able to Answer

      ### Sources of Sharing and Observable Failures

      1. How does shared mutable state differ from shared immutable data or shared objects that cannot be modified?
      2. In the example where two threads check and decrease a quota, how does a race condition violate the invariant?
      3. Why is a mutable List aliased by multiple objects still risky even with only one thread?
      4. Why can a Spring singleton service storing userId/currentOrder in fields leak information between requests?

      ### Choosing Protection Mechanisms

      1. How does volatile guarantee visibility without making a check-then-update operation atomic?
      2. Which scenarios can synchronized and AtomicInteger handle, and what else is required for invariants spanning multiple fields?
      3. Why does ConcurrentHashMap not automatically turn a multi-operation read-modify-write sequence into one business transaction?
      4. What changes when state is stored in a database or across multiple nodes rather than within one JVM?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Identify owners and aliases | List reference paths that can mutate shared state through static fields, singletons, or collections. |
      | Analyze race conditions | Predict incorrect check-then-act outcomes and design an atomic quota-update path. |
      | Choose tools for the right scope | Explain the limitations of volatile, synchronized, AtomicInteger, ConcurrentHashMap, and transactions/optimistic locking. |
      | Test concurrency | Design tests with coordinated threads to verify invariants and check aliasing without relying on chance. |
  - slug: design-pitfalls-009
    title: Mutable Objects Breaking Equality or Hashing
    status: WRITTEN
    difficult: ADVANCED
    focus: Mutable Objects Breaking Equality or Hashing
    problemSolved: How do mutable keys affect lookup and sorting?
    mechanism: Keep identities stable across mutations.
    applicationValue: Keep Map/Set/cache behavior correct.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Mutable Objects Breaking Equality or Hashing**

      This lesson examines subtle failures when mutable attributes used by equals/hashCode or Comparator change while an object serves as a key/Set element. `HashMap.get()` may fail to find the very same key reference after its hash changes; `TreeSet` faces a similar risk when the sorting order changes. Learners distinguish mutable entities from stable identities, use immutable CustomerId values as keys, protect records containing Lists/arrays, and examine which fields ORM or Lombok includes in equality contracts.

      ## 2. Questions Learners Must Be Able to Answer

      ### Collection Behavior and Contracts

      1. Why might HashMap fail to find the same object after a field used by hashCode is changed?
      2. What compatibility requirement do equals and hashCode impose on two objects considered equal?
      3. Why can HashSet sometimes appear to contain two entries referring to the same object after a mutable key's hash changes?
      4. What different risks arise for TreeMap/TreeSet when a field used by Comparator changes?

      ### Designing Stable Keys

      1. Why is a CustomerId record containing an immutable String better suited as a key than a CustomerProfile with a mutable displayName?
      2. Is a record containing a List or byte[] automatically deeply immutable, and does it automatically compare arrays by contents? Why or why not?
      3. For a JPA entity whose ID is generated after persistence, what must be considered when designing equals/hashCode and deciding where to use the object as a key?
      4. Why can't ConcurrentHashMap, Lombok-generated hashes, or cached hash values automatically fix a mutable key with a broken contract?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Explain failure mechanisms | Trace hash buckets and predict lookup behavior when MutableCustomerKey's code changes. |
      | Design stable keys | Separate immutable CustomerId from mutable CustomerProfile so lookups still work after displayName changes. |
      | Verify value objects | Identify risks in records containing Lists/arrays and add suitable defensive copying/equality behavior. |
      | Evaluate collections and ORM | Test equals-hash contracts and HashMap/HashSet/TreeSet lookups, and review JPA IDs and Lombok-selected fields. |
  - slug: design-pitfalls-010
    title: Overusing Design Patterns and Premature Abstraction
    status: WRITTEN
    difficult: ADVANCED
    focus: Overusing Design Patterns and Premature Abstraction
    problemSolved: When do patterns start adding value?
    mechanism: Demand evidence before extracting an abstraction.
    applicationValue: Reduce change costs and unnecessary intermediary classes.
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Overusing Design Patterns and Premature Abstraction**

      This lesson helps determine when an abstraction or Design Pattern genuinely reduces the cost of change and when it merely adds indirection. Starting with one simple shipping-fee rule and moving to two confirmed STANDARD/EXPRESS policies, learners observe when Strategy begins to offer value; KISS, YAGNI, DRY, and SOLID are interpreted in context rather than as slogans. The goal is to gather evidence of change, lock in existing behavior with tests, and then extract the appropriate stable boundary rather than creating a generic framework, factory, or interface for a need that does not yet exist.

      ## 2. Questions Learners Must Be Able to Answer

      ### Evaluating the Need for Abstraction

      1. Why might a simple delivery-fee rule need only one validated function instead of an interface/factory system?
      2. How does overusing a pattern at the wrong scale differ from abstracting prematurely around an incorrectly predicted variation point?
      3. How are KISS, YAGNI, and DRY misunderstood when only duplicate line counts or class counts are considered?
      4. Why should two formulas that both use 5% but serve independent business rules not necessarily be merged into one abstraction?

      ### When to Introduce Strategy

      1. When STANDARD and EXPRESS have independently changing algorithms, which boundary does FeePolicy address?
      2. Before extracting FeePolicy, which inputs, the 500000 VND threshold, exceptions, and boundary cases should be recorded to preserve existing behavior?
      3. What signs indicate that an interface/provider/factory chain merely forwards calls and creates maintenance friction?
      4. When can an early abstraction be justified by a public API or clearly established security/external-dependency boundary?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Recognize overengineering | Analyze multilayer designs and identify abstractions lacking a real contract or direction of change. |
      | Evaluate when Strategy is warranted | Compare SimpleCheckout with PolicyCheckout when there is only one policy and after EXPRESS is added. |
      | Preserve results during refactoring | Propose regression tests around fee thresholds and weight boundaries before/after extracting FeePolicy. |
      | Make design decisions | Present evidence of need, stable/variable boundaries, and operating costs before adding a pattern. |
- slug: testing
  title: Testing
  childs:
  - slug: testing-001
    title: Testing Public Behavior and Object Contracts
    status: WRITTEN
    difficult: ADVANCED
    focus: Testing Public Behavior and Object Contracts
    problemSolved: What does an object promise its client, including on failure?
    mechanism: Specify promises before writing tests
    applicationValue: Test public behavior without locking in implementations
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Testing Public Behavior and Object Contracts**

      Testing an object means verifying the promises its API makes to clients, rather than field names, synchronization techniques, or the number of private helpers. Using SeatInventory, the lesson establishes preconditions, success/failure postconditions, and invariants governing reserved seats.

      Learners apply the same contract suite to MonitorSeatInventory and AtomicSeatInventory; inspect snapshots, test reserve/cancel sequences, check SeatSnapshot value equality, and distinguish atomicity guarantees for one object within a JVM from database transactions.

      ## 2. Questions Learners Should Be Able to Answer

      ### Contracts from the Client's Perspective

      1. What promises about zero, negative values, insufficient seats, and exceptions are missing from a tryReserve(int) signature?
      2. How do SeatInventory preconditions, success postconditions, failure postconditions, and invariants differ?
      3. Why is asserting only that tryReserve(7) returns false insufficient without comparing snapshots before and after?
      4. When replacing MonitorSeatInventory with AtomicSeatInventory, what must remain unchanged, and what is merely an implementation detail?
      5. Why should the private reserved field not be exposed or a setter added just to construct test states?

      ### Operation Sequences, Values, and Concurrency

      1. What bugs might the sequence reserve(4) → rejected reserve(7) → cancel(2) → reserve(8) reveal that isolated method tests could miss?
      2. How should SeatSnapshot record equality and hashCode be tested for safe use in a HashSet?
      3. What guarantees can concurrent reserve tests on one instance establish, and what do they not prove about multiple JVMs or a DB?
      4. How do state-based assertions differ from interaction-based assertions for observable effects?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Specify contracts | State SeatInventory preconditions, postconditions, invariants, and failure semantics explicitly. |
      | Design tests from public APIs | Build Given–When–Then cases for reserve/cancel/snapshot without inspecting private fields. |
      | Protect failure paths | Compare snapshots before and after rejected reservations/cancellations and verify that capacity is never exceeded. |
      | Reuse contract suites | Run the same factory-based tests against MonitorSeatInventory and AtomicSeatInventory. |
      | Test sequences and value equality | Use state-sequence tables, boundary cases, and SeatSnapshot equals/hashCode checks. |
      | Define concurrency evidence | Explain the value and limitations of a single-JVM CountDownLatch test compared with DB integration tests. |
  - slug: testing-002
    title: Testing Constructors and Invalid States
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Testing Constructors and Invalid States
    problemSolved: Under what conditions is an object initialized validly?
    mechanism: Test object-creation boundaries
    applicationValue: Prevent invalid objects and aliasing from escaping
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Testing Constructors and Invalid States**

      Constructors/factories are boundaries that ensure only valid domain objects are exposed. Through Invoice, LineItem, and Wallet, the lesson tests required parameters, cross-field constraints, customer-ID normalization, overflow-safe arithmetic, and failures that must not expose invalid state.

      JUnit Jupiter parameterized tests cover discount boundaries from 0 to subtotal, null/blank values, List.copyOf, and mutations of the source list. The lesson also warns about builders/records, virtual methods called in constructors, and side effects emitted before validation finishes.

      ## 2. Questions Learners Should Be Able to Answer

      ### Constructing Valid and Immutable Objects

      1. Why must an Invoice constructor validate the item list, discountVnd, and total instead of simply assigning fields?
      2. What different outcomes are required at discount=0, discount=subtotal, and discount=subtotal+1?
      3. How does List.copyOf protect against changes to the source ArrayList, and why is it not equivalent to a deep copy?
      4. Which arithmetic errors do Math.multiplyExact/Math.addExact catch that ordinary long arithmetic might miss?
      5. Why does a constructor throwing an exception not automatically roll back external side effects already produced before it completed?

      ### Alternative Construction Paths and Testing Strategies

      1. Which invariants must record compact constructors and build() preserve, even when builder setters accept fields individually?
      2. Why can calling an overridable method or letting this escape from a constructor expose a subclass before initialization finishes?
      3. In ONLINE/OFFLINE appointments, which start/end/link/location combinations must be rejected even if each individual field is valid?
      4. When errors originate from JSON or legacy database records, which boundary should be tested instead of using reflection to corrupt private state?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Build constructor test matrices | List valid/invalid/boundary cases and cross-field constraints for Invoice or Appointment. |
      | Verify postconditions | Check trimmed customerId, subtotal, discount, total, and line count after successful construction. |
      | Test rejection paths | Use correctly typed assertThrows checks for null, blank values, invalid quantities, excessive discounts, and overflow. |
      | Test aliasing | Modify the source list after construction and attempt mutation through an accessor to show that the Invoice snapshot remains unaffected. |
      | Test builders/records | Confirm that record compact constructors and Builder.build cannot create objects that violate invariants. |
      | Distinguish internal/external constructor failures | Identify pre-validation side effects, this-escape risks, and transaction/concurrency limitations. |
  - slug: testing-003
    title: Testing Invariants and State Transitions
    status: WRITTEN
    difficult: ADVANCED
    focus: Testing Invariants and State Transitions
    problemSolved: How are state/invariants and transitions preserved across commands?
    mechanism: Think in state machines and failure paths
    applicationValue: Preserve invariants of mutable entities
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Testing Invariants and State Transitions**

      For objects with lifecycles, a test showing that one deposit succeeds does not prove that a wallet always remains valid. This lesson constructs an ACTIVE/FROZEN/CLOSED Wallet state machine, distinguishes snapshot invariants from rules that apply over time, and tests both valid transitions and prohibited operations.

      Learners verify that failures leave snapshots unchanged, test exact withdraw/close thresholds, detect overflow on deposit, and exercise freeze/resume/close sequences. The lesson also introduces reference models and property-based testing, explaining why invariants spanning two wallets or multithreaded operations need testing at a broader boundary.

      ## 2. Questions Learners Should Be Able to Answer

      ### State Machines and Invariants

      1. How does a state invariant such as balanceVnd >= 0 differ from the rule that withdrawals are prohibited while FROZEN?
      2. Which conditions permit ACTIVE → FROZEN, FROZEN → ACTIVE, and ACTIVE → CLOSED transitions in Wallet?
      3. Why must CLOSED always have balance=0 and reject resume/deposit under the example contract?
      4. What are state coverage, transition coverage, invalid-transition coverage, and sequence coverage?
      5. Why does checking only assertThrows on a rejected withdrawal fail to prove the invariant remains protected?

      ### Boundaries, Test Sequences, and Reference Models

      1. How should the boundary values 0, -1, balance, balance+1, and Long.MAX_VALUE be tested?
      2. How does an independent reference model enable comparison of command sequences against a real Wallet?
      3. What preconditions are needed for the property that depositing x and then withdrawing x restores the original balance?
      4. Why does individual validity of Accounts A and B not prove that transfers preserve their combined balance?
      5. What evidence about lost updates and transactions is still missing from sequential tests or a concurrency test that passes only once?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Model lifecycles | Diagram ACTIVE/FROZEN/CLOSED with guards, starting/ending states, and allowed commands. |
      | Connect invariants to tests | Express balance>=0, CLOSED=>balance=0, and unchanged state after failure as assertions. |
      | Test state transitions | Create cases for valid and forbidden transitions, boundaries, and multistep sequences. |
      | Protect failure paths | Compare Snapshots before/after operations that violate preconditions or cause overflow. |
      | Use reference models | Generate commands with a seed, compare expected statuses/balances/errors, and record sequences that cause regressions. |
      | Identify broader test boundaries | Explain when integration tests are needed for transfers, DB transactions, and concurrency. |
  - slug: testing-004
    title: Testing Multiple Implementations of One Interface
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Testing Multiple Implementations of One Interface
    problemSolved: Do interface implementations exhibit the same behavior?
    mechanism: Design reusable tests
    applicationValue: Test multiple adapters/implementations with one suite
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Testing Multiple Implementations of One Interface**

      This lesson focuses on organizing one shared test suite when multiple classes implement the same interface instead of maintaining separate, inconsistent suites. The IntSet interface has HashIntSet and TreeIntSet implementations; both promise the same add/remove/contains/size behavior despite different storage mechanisms.

      Learners use JUnit 5 @ParameterizedTest, @MethodSource, and Supplier<IntSet> to create independent fixtures for each implementation; test duplicate additions, removal followed by re-addition, MIN/MAX values, and independence between instances. Implementation-specific and integration tests remain necessary when an implementation has DB or cache contracts.

      ## 2. Questions Learners Should Be Able to Answer

      ### Defining a Shared Contract

      1. Why must HashIntSet and TreeIntSet provide identical add/remove/contains/size semantics despite different internal structures?
      2. What two boolean values should consecutive IntSet.add(7) calls return, and how should size change?
      3. Are 0, negative numbers, Integer.MIN_VALUE, and Integer.MAX_VALUE included in the example's valid input domain?
      4. Why shouldn't iteration order or the HashSet/TreeSet implementation class be tested when the interface does not expose them?

      ### Reusing JUnit Tests and Testing Implementations

      1. How do @MethodSource variants(), Supplier<IntSet>, and @ParameterizedTest create independent test runs?
      2. Why must each test call factory.get() instead of sharing one mutable set?
      3. What bug can independentInstances detect if an implementation accidentally uses static storage?
      4. When LinkedHashIntSet is added, should the factory list change or should every test case be duplicated?
      5. When moving to JdbcRepository, what transaction, mapping, and real-resource checks are missing from the contract suite?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Specify the IntSet contract | Define duplicate-add, absent-element removal, non-mutating contains, and size based on distinct elements. |
      | Create parameterized suites | Declare an @MethodSource that supplies a name and Supplier<IntSet> for each implementation. |
      | Cover multiple implementations | Run the same tests on HashIntSet, TreeIntSet, and a new implementation. |
      | Test state and boundaries | Test add/remove/re-add, negative numbers, MIN/MAX values, and independent instances. |
      | Avoid coupling tests to storage | Do not assert HashSet/TreeSet iteration order unless the contract specifies it. |
      | Add implementation-specific tests | Distinguish shared contract checks from implementation-specific transaction/cache/TTL/integration tests. |
  - slug: testing-005
    title: Testing Subtype Substitutability
    status: WRITTEN
    difficult: ADVANCED
    focus: Testing Subtype Substitutability
    problemSolved: Can the subtype truly substitute for its supertype?
    mechanism: Compare abstraction preconditions and postconditions
    applicationValue: Detect LSP violations beyond compiler checks
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Testing Subtype Substitutability**

      Correctly implementing or extending a type does not prove that a subtype can substitute for its supertype. This lesson turns the Liskov Substitution Principle into assertions about preconditions, postconditions, invariants, exceptions, side effects, and observable client expectations.

      In the example, DiscountPolicy accepts subtotal values from 0–1.000.000 and returns a valid discount: NoDiscount, TenPercentDiscount, and TieredDiscount pass the shared suite, but MinimumOnlyDiscount deliberately rejects subtotals below 50.000 and therefore violates the contract. Learners use boundary tests, seeded data, and the Checkout client to demonstrate the violation even though the Java code compiles.

      ## 2. Questions Learners Should Be Able to Answer

      ### Subtype Contracts

      1. What does LSP require when Checkout uses a new DiscountPolicy through the same interface?
      2. Why may a subtype not strengthen preconditions, even though it may accept a wider range of valid inputs?
      3. Over what input domain must the postconditions 0 <= discount <= subtotal and discount(0)=0 hold for every policy?
      4. Why can't all policies be required to return the same discount amount if the contract specifies only a range?
      5. How can a RuntimeException on a valid subtotal or an undisclosed side effect break substitutability?

      ### Test Design and Limitations

      1. On which inputs does MinimumOnlyDiscount fail, and which boundary tests detect the failure immediately?
      2. Why test 49.999/50.000/50.001 as well as seeded random samples instead of choosing only average values?
      3. How can a policy that depends on the number of prior calls violate the consistency clients rely on?
      4. When a read-only subtype cannot perform writes, how should interfaces be split by capability instead of throwing UnsupportedOperationException?
      5. Why doesn't a passing contract suite mathematically prove LSP for every input, state, and environment?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Specify abstraction contracts | Define DiscountPolicy's input domain, outputs, exceptions, determinism, and side effects explicitly. |
      | Diagnose LSP violations | Identify subtypes that strengthen preconditions or weaken postconditions despite matching method signatures. |
      | Build substitution tests | Invoke different policies through the shared interface from Checkout and a common assertion suite. |
      | Cover thresholds and seeded data | Test 0/1/max, values immediately below/above 50.000, and reproducible random samples. |
      | Distinguish shared behavior from concrete results | Allow policies to calculate different discounts while satisfying every promised invariant. |
      | Propose suitable abstractions | Detect interfaces that mix read/write capabilities and determine when to split their contracts. |
  - slug: testing-006
    title: Fakes, Stubs, Mocks, and Collaborators
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Fakes, Stubs, Mocks, and Collaborators
    problemSolved: Which kind of test double should replace a collaborator?
    mechanism: Choose fakes/stubs/mocks to match the goal
    applicationValue: Test logic without real infrastructure calls
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Fakes, Stubs, Mocks, and Collaborators**

      Unit tests for CheckoutService should not charge real money, modify actual inventory, or send real emails. This lesson distinguishes collaborators of the SUT from test doubles—dummies, stubs, fakes, mocks, and spies—each chosen according to the information a test must supply or observe.

      In CheckoutDemo, FakeInventory maintains state, StubPaymentGateway controls acceptance/decline, and MockReceiptSender records send counts. Learners verify outcomes, remaining inventory, and notification effects; Mockito tests add verifyNoInteractions without confusing verify(decrease) with proof that actual data was persisted.

      ## 2. Questions Learners Should Be Able to Answer

      ### Roles of Test Doubles

      1. How does a collaborator differ from a fake/stub/mock in the CheckoutService design?
      2. Which data and side effects can StubPaymentGateway, FakeInventory, and MockReceiptSender control or observe?
      3. How does a spy differ from a pure mock, and when is a dummy useful?
      4. Why can a single Mockito mock serve as a stub via when(...) and also verify interactions?

      ### Outcomes, Interactions, and Integration

      1. In a successful checkout, which assertions prove that stock decreases from 3 to 1 and a receipt is sent exactly once for 500.000 VND?
      2. When the gateway returns false or stock is insufficient, what must be verified as unchanged or not invoked?
      3. Why doesn't verify(inventory).decrease(...) prove that stock was actually deducted?
      4. When do ArgumentCaptor, verifyNoInteractions, times, or never protect contracts involving real side effects?
      5. Which limitations of FakeInventory mean unit tests cannot replace DB, concurrency, and payment integration tests?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Choose test doubles | Distinguish dummies, stubs, fakes, mocks, and spies by their role in a particular scenario. |
      | Construct a real CheckoutService | Inject replaceable collaborators through the constructor rather than mocking the SUT itself. |
      | Verify state | Use FakeInventory to check stock levels after success, decline, or out-of-stock outcomes. |
      | Verify side effects | Record email/orderId/amount and assert exactly one send or no send according to the outcome. |
      | Use Mockito selectively | Apply when, verify, times, never, and verifyNoInteractions at observable boundaries. |
      | Define unit-test scope | Explain how fakes differ from real DB/payment implementations and why separate integration tests are needed. |
  - slug: testing-007
    title: Designing for Replaceable Dependencies in Tests
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Designing for Replaceable Dependencies in Tests
    problemSolved: How can tests control I/O, time, and dependencies?
    mechanism: Design for replaceable dependencies
    applicationValue: Isolate services for reproducible tests
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Designing for Replaceable Dependencies in Tests**

      Testability begins with class design: when CheckoutService creates its own gateway, reads the real clock, and sends email internally, tests are difficult to isolate and reproduce. This lesson introduces test seams using ports, constructor injection, a composition root, and a controllable Clock.

      JUnit tests the PaymentGateway, ReceiptSender, and CheckoutService example with Result(accepted, checkedAt) using StubGateway, RecordingSender, and Clock.fixed. Learners show that invalid inputs do not invoke dependencies, a declined payment does not send receipts, exceptions propagate, and constructors reject null dependencies.

      ## 2. Questions Learners Should Be Able to Answer

      ### Designing Dependency Substitution Points

      1. Why does constructing an HTTP client, payment adapter, and Clock.systemUTC inside CheckoutService make unit tests hard to run independently?
      2. How do PaymentGateway/ReceiptSender interfaces and constructor injection divide responsibilities between the service and composition root?
      3. Do DI and DIP require Spring, and when should an interface not be created for every class?
      4. How does Clock.fixed make assertions about Result.checkedAt more stable than Instant.now?
      5. Which dependency lifecycles suit constructor injection versus method injection?

      ### Verifying Behavior with Test Doubles

      1. What side effects must CheckoutService avoid before validating a blank orderId and amountVnd<=0?
      2. What can five unit tests establish using StubGateway responses of true/false/exception and RecordingSender?
      3. Why must a gateway error not cause a notification to be sent, while a declined result must retain checkedAt from the injected Clock?
      4. How should a fresh fake/spy for each test avoid shared static state?
      5. Why does a test seam not itself prove that real adapters handle timeouts, retries, transactions, or successful email delivery?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Identify hard-to-control dependencies | Find hidden network, clock, environment, database, or singleton dependencies in business logic. |
      | Design ports and a composition root | Define PaymentGateway/ReceiptSender and supply implementations at the creation boundary. |
      | Use constructor injection | Pass required dependencies, reject null values, and avoid constructing adapters within services. |
      | Fix time in tests | Use Clock.fixed to assert checkedAt and deadline logic independently of execution time. |
      | Test failure scenarios | Use stubs/spies to prove invalid inputs, declines, or gateway exceptions never send receipts. |
      | Separate unit and integration testing | Identify real network/DB behavior that must be checked at the adapter or system level. |
  - slug: testing-008
    title: Avoiding Tests Tightly Coupled to Internals
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Avoiding Tests Tightly Coupled to Internals
    problemSolved: Which assertions express contracts versus implementation details?
    mechanism: Distinguish real effects from details
    applicationValue: Avoid false failures on valid refactorings
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Avoiding Tests Tightly Coupled to Internals**

      A brittle test fails when HashMap, a private helper, or the number of PriceCatalog calls changes even though client-visible results do not. This lesson helps distinguish promised behavior from algorithms that may be replaced during refactoring.

      In QuoteContractDemo, PerLineService and GroupedService produce the same prices, shipping fees, and free-shipping threshold of 500.000 despite different lookup counts. Learners distinguish lookup counts from meaningful side effects such as charging, sending, or publishing after commit; the contract's obligations determine when interactions warrant assertions.

      ## 2. Questions Learners Should Be Able to Answer

      ### Recognizing Brittle Tests

      1. Why do tests that reflect private fields or verify calculator call counts often fail after refactoring that preserves results?
      2. Despite different lookup counts in PerLineService and GroupedService, which Quote values must remain the same?
      3. At exactly 500.000 VND, what shipping charge and total are required by the contract?
      4. When does the number of price lookups per SKU become a testable API requirement rather than an implementation detail?
      5. Why does mocking every Money, OrderLine, or Address often lengthen tests while proving little about business rules?

      ### Identifying Interactions Worth Testing

      1. Why is not sending a receipt after a declined payment a meaningful side-effect assertion?
      2. When is InOrder useful for verifying validation before charging or publishing after commit?
      3. How do a fake Clock and Supplier<UUID> keep tests independent of real time and generated IDs?
      4. Why must Quote tests still cover quantities exceeding int, missing SKUs, and long overflow even when code is only being refactored?
      5. What real cache, network, or persistence issues remain untested by unit tests using FakeCatalog?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Classify assertions | Distinguish contract-based assertions from those that unnecessarily lock in implementation details. |
      | Write refactoring-resilient tests | Run the same Quote behavior suite on PerLineService and GroupedService despite different lookup counts. |
      | Protect boundary values | Verify subtotal, shipping, and total at the 500.000 threshold and reject invalid inputs/overflow. |
      | Verify only required side effects | Assert payment, receipt, or event interactions when they are genuine business commitments. |
      | Isolate nondeterministic data | Inject a Clock or ID generator in reproducible tests instead of asserting real time. |
      | Choose the right testing level | Identify network/cache/DB behavior that simple fakes cannot reproduce. |
  - slug: testing-009
    title: Regression Testing During Design Changes
    status: WRITTEN
    difficult: ADVANCED
    focus: Regression Testing During Design Changes
    problemSolved: Does refactoring preserve observable behavior?
    mechanism: Use independent oracles, baselines, and CI
    applicationValue: Prevent regressions at boundaries and wiring points
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Regression Testing During Design Changes**

      OOP refactoring can change classes, Strategy, dependency injection, or algorithms without intending to change observable behavior. This lesson establishes a contract-based regression suite for before-and-after comparisons, with a baseline, independent specifications, and testing levels matched to risk.

      In the example, LegacyCheckout and RefactoredCheckout use ShippingRule: members receive free shipping, while nonmembers qualify at subtotal=100.000 cents; BrokenShippingRule uses > instead of >=, failing at the exact threshold. Learners combine requirement-derived example tests, differential testing with a fixed seed, and the invariant total=merchandise amount+shipping fee.

      ## 2. Questions Learners Should Be Able to Answer

      ### Contracts to Preserve After Refactoring

      1. Which changes to classes, DI, or Strategy are permitted without changing Invoice results or failure semantics?
      2. Why can tests that only compare before and after versions preserve an existing bug in the original?
      3. What different kinds of evidence do specification examples, differential tests, and invariant tests provide?
      4. How should nonmember shipping fees differ at 99.999, 100.000, and 100.001 cents?
      5. Which condition does BrokenShippingRule get wrong even though both classes still implement PriceQuoteService?

      ### Reproducible Regression Strategies

      1. Why are baselines, boundary tests, and no-side-effect guarantees needed before moving business logic into ShippingRule?
      2. Why are fixed random seeds and recorded failing inputs important in differential testing?
      3. What integration tests must supplement unit tests when interfaces/wiring, transactions, or serialization change?
      4. When a business rule genuinely changes, how should expected values and approvals be managed differently from a pure refactoring?
      5. Why must CI fail when a production implementation breaks its contract instead of swallowing AssertionError as an intentionally faulty demo might?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Establish regression contracts | Record inputs, Invoice outputs, errors, and side effects that may change or must be preserved. |
      | Build an independent oracle | Derive expectations from requirements for members, nonmembers, thresholds, and out-of-domain inputs. |
      | Compare two designs | Run old and new PriceQuoteService implementations against the same cases and fixed-seed sample data. |
      | Catch boundary defects | Detect > in place of >= at exactly subtotal 100.000 cents. |
      | Plan refactoring tests | Run the baseline, make small refactorings, then execute contract/unit tests, integration tests, and CI appropriate to the changes. |
      | Manage contract changes | Distinguish bugs/regressions from new requirements and update tests with review rather than arbitrarily changing expectations. |
  - slug: testing-010
    title: Testing Interactions Among Multiple Objects
    status: WRITTEN
    difficult: ADVANCED
    focus: Testing Interactions Among Multiple Objects
    problemSolved: Do multiple objects collaborate under the right conditions and in the right order?
    mechanism: Analyze workflow branches and consequences
    applicationValue: Prevent incorrect charging, emailing, or inventory release
    summary: |-
      # 0. Learning Orientation

      ## 1. Lesson Purpose

      **Testing Interactions Among Multiple Objects**

      Inventory, PaymentGateway, and ReceiptSender may each be correct independently while CheckoutService still coordinates them incorrectly: charging before reserving, failing to release on decline, sending a receipt before payment, or charging twice. This lesson tests interaction contracts across meaningful business branches and call ordering.

      Using JUnit 5 + Mockito and CheckoutCollaborationTest with InMemoryInventory, learners apply verify, never, InOrder, and verifyNoInteractions while asserting PAID/DECLINED/OUT_OF_STOCK outcomes and stock state. The lesson distinguishes gateway failures from email failures after charging and explains why real payment workflows need idempotency, reconciliation, and an outbox.

      ## 2. Questions Learners Should Be Able to Answer

      ### Collaboration Contracts and Ordering

      1. In which order must CheckoutService invoke reserve, charge, and send on success?
      2. Which collaborators must not be called when the outcome is OUT_OF_STOCK?
      3. How do a false return and a thrown RuntimeException from PaymentGateway differ in outcome, release, and exception behavior?
      4. Why must a sender failure after a successful charge not automatically trigger another charge or release inventory?
      5. Which call-order relationships are genuine contract requirements that warrant Mockito InOrder?

      ### Interaction Tests and State Verification

      1. What kinds of expectations do Mockito when, verify, never, verifyNoInteractions, and InOrder establish?
      2. Why should CheckoutService itself not be mocked, and why is verifying only gateway.charge without checking the final result insufficient?
      3. With 5 items in InMemoryInventory, what stock remains after a checkout for 2 items succeeds or is declined?
      4. Why does a mock recording a release call not prove that stock was restored, and what further evidence can a fake provide?
      5. What uncertain states can payment gateway timeouts and real email-delivery failures create that require reconciliation, idempotency, or an outbox?

      ## 3. Expected Learning Outcomes

      | Competency | Expected Outcome |
      | --- | --- |
      | Build workflow branch tables | Specify permitted interactions for PAID, DECLINED, OUT_OF_STOCK, and gateway/sender exceptions. |
      | Verify business ordering | Use InOrder to verify reserve → charge → send or reserve → charge → release as appropriate. |
      | Prevent invalid side effects | Use verifyNoInteractions/never for out-of-stock, failed charges, or sender failures. |
      | Verify outcomes and data | Assert enum outcomes, correctly typed exceptions, and each collaborator's arguments. |
      | Test real in-memory collaboration | Use InMemoryInventory/RecordingSender to verify stock changing from 5→3 or being restored to 5. |
      | Identify production limitations | Explain why a gateway exception does not prove that no money was charged and why safe retries are necessary. |
