    problemSolved: Khi thêm biến thể, sửa phần lõi bao nhiêu?
    mechanism: Xác định phần ổn định và biến thiên
    applicationValue: Thêm policy giảm hồi quy vào ShippingService
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Đóng-mở: mở rộng hành vi với thay đổi có kiểm soát**

      Hiểu OCP là đặt trục biến thiên sau hợp đồng ổn định để bổ sung implementation mà không sửa thuật toán điều phối theo từng biến thể. OpenClosedDemo dùng ShippingPolicy, ShippingService và Map đăng ký Standard/Express/SameDay; ví dụ RemoteAreaSurcharge dùng composition/decorator. Bài nhấn mạnh hợp đồng phí không âm, kết quả khác null, chỗ phải thay đổi ở composition root và những trường hợp switch đơn giản vẫn hợp lý.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Điểm mở rộng và phần cần ổn định

      1. Vì sao thêm SameDayShipping bằng một ShippingPolicy mới không đòi sửa ShippingService.quote nhưng vẫn phải đăng ký mã vào Map?
      2. Với Order subtotal 150.000 VND, cân nặng 1.200 g, vì sao Standard, Express, SameDay báo 20.000, 51.000, 70.000 VND?
      3. ShippingService kiểm tra policy không tồn tại, trả null hoặc phí âm để giữ hợp đồng nào?
      4. Vì sao câu nói OCP cấm mọi sửa đổi code là sai khi bản thân hợp đồng nền tảng thay đổi?

      ### Mở rộng và đánh đổi

      1. RemoteAreaSurcharge bọc ExpressShipping làm tổng phí 56.000 VND bằng cơ chế composition nào?
      2. Khi nào chọn Strategy/Decorator thay vì thêm nhánh if/else vào cùng hàm, và khi nào switch vẫn dễ bảo trì hơn?
      3. Nếu một plugin feeFor thay đổi Order hoặc dùng sai đơn vị tiền, thêm class mới có thực sự mở rộng an toàn không?
      4. Quy trình refactor và contract test nào giúp giữ biểu phí cũ, bổ sung policy mới và phát hiện không có cấu hình đăng ký?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Tìm trục biến thiên | Phân biệt chính sách giao hàng thay đổi độc lập với phần xác thực và điều phối ổn định. |
      | Cài policy thay thế | Viết ShippingPolicy và implementation mới, đăng ký ở composition root, giữ ShippingService.quote. |
      | Kiểm chứng ví dụ | Tính được 20.000/51.000/70.000 VND và phụ phí decorator nâng Express lên 56.000 VND. |
      | Giữ hợp đồng của phần mở rộng | Kiểm tra khác null, phí không âm, đúng VND, lỗi mã không hỗ trợ và không sửa input. |
      | Đánh giá chi phí abstraction | Chọn interface, decorator hay switch từ tần suất biến thể, độ phức tạp wiring và test. |
  - slug: solid-004
    title: 'Thay thế Liskov: bảo toàn hợp đồng của kiểu cha'
    status: WRITTEN
    difficult: ADVANCED
    focus: 'Thay thế Liskov: bảo toàn hợp đồng của kiểu cha'
    problemSolved: Subtype có còn đáp ứng lời hứa của supertype?
    mechanism: Viết tiền/hậu điều kiện, test chung
    applicationValue: Tương thích hành vi giữa các policy
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Thay thế Liskov: bảo toàn hợp đồng của kiểu cha**

      Hiểu LSP là khả năng thay một subtype cho supertype mà caller vẫn nhận các bảo đảm hành vi đã công bố, mạnh hơn việc Java chấp nhận extends/implements. Bài đặt precondition, postcondition, invariant, exception và side effect vào DiscountPolicy, so sánh FixedDiscount và ThresholdDiscount hợp lệ với BadVipDiscount siết điều kiện và BadFixedDiscount giảm vượt subtotal. Contract test phải áp dụng chung cho mọi implementation.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng và ví dụ discount

      1. Vì sao cùng implements DiscountPolicy không đủ để bảo đảm CheckoutService.total tính đúng khi nhận một implementation mới?
      2. Tiền điều kiện của discountFor với subtotal khác null, không âm khác gì hậu điều kiện discount nằm trong 0..subtotal?
      3. Với subtotal 25.00, vì sao FixedDiscount(10) cho tổng 15.00, ThresholdDiscount cho 25.00?
      4. Vì sao BadVipDiscount ném UnsupportedOperationException dưới ngưỡng 100 là siết tiền điều kiện?
      5. Vì sao BadFixedDiscount trả 50 cho đơn 25 làm yếu hậu điều kiện và khiến tổng -25?

      ### Kiểm chứng và thiết kế quan hệ kiểu

      1. Khi contract chung không hứa setter độc lập, ví dụ Rectangle/Square còn vi phạm LSP theo cùng lập luận cũ không?
      2. Ngoài kết quả, lỗi, bất biến, thứ tự và tác dụng phụ nào cần bảo toàn nếu client được phép dựa vào?
      3. Vì sao cùng một bộ kiểm thử cho tất cả DiscountPolicy phải bao gồm subtotal 0, 25, 100, 250 và dữ liệu âm/null?
      4. Nếu subtype không hỗ trợ một hành vi hợp lệ của interface, khi nào cần chia lại contract hoặc dùng composition?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phát biểu LSP thực dụng | Nêu đúng precondition không mạnh hơn, postcondition không yếu hơn, invariant và lỗi/side effect phải phù hợp. |
      | Phân tích đối chứng | Phân loại Fixed/Threshold hợp lệ và BadVip/BadFixed vi phạm với subtotal 25.00. |
      | Xây kiểm thử hợp đồng | Thiết kế cùng một contract test cho mọi policy, cả giá trị biên và đầu vào bị từ chối. |
      | Đánh giá subtype thiết kế sai | Giải thích rủi ro Rectangle/Square với setter độc lập và đề xuất interface bất biến hoặc composition. |
      | Bảo vệ client qua abstraction | Phát hiện compile đúng nhưng semantics sai, không vá bằng instanceof riêng cho từng subtype. |
  - slug: solid-005
    title: 'Phân tách giao diện: hợp đồng phù hợp từng bên sử dụng'
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: 'Phân tách giao diện: hợp đồng phù hợp từng bên sử dụng'
    problemSolved: Client có phải thấy API nó không dùng?
    mechanism: Thiết kế từ nhu cầu client
    applicationValue: ReadOnlyArchive không giả vờ ghi/xóa
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phân tách giao diện: hợp đồng phù hợp từng bên sử dụng**

      Hiểu ISP từ nhu cầu client: DownloadService chỉ cần DocumentReader, ImportService chỉ cần DocumentWriter, công việc dọn dữ liệu cần DocumentDeleter. Bài cho thấy ReadOnlyArchive không nên implements hợp đồng ghi/xóa rồi ném UnsupportedOperationException, trong khi InMemoryStore hoàn toàn có thể đảm nhận nhiều interface. Người học lựa chọn ranh giới API, test bằng lambda/fake và phân biệt giới hạn kiểu Java với phân quyền thực.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng theo nhu cầu

      1. Vì sao một DocumentStorage chứa findById, save, delete không phù hợp với ReadOnlyArchive chỉ đọc?
      2. DownloadService và ImportService nên nhận interface nào để compiler chỉ cho phép thao tác thực sự cần?
      3. Vì sao InMemoryStore implements cả DocumentReader, DocumentWriter, DocumentDeleter không vi phạm ISP?
      4. Khi nào tạo một DocumentAdmin interface tổng hợp là có lý do và khi nào tách từng method quá vụn?

      ### Tác động và kiểm thử

      1. Trong IspDemo, vì sao cùng DownloadService đọc được tài liệu D01 từ mainStore và A01 từ ReadOnlyArchive?
      2. Làm cách nào dùng lambda DocumentWriter để test ImportService mà không cần stub cả API đọc/xóa?
      3. Vì sao việc inject DocumentReader không thay thế các kiểm tra authorization tại REST/Spring endpoint?
      4. Nếu một public interface đang được nhiều module sử dụng, làm sao chuyển client dần mà giữ các semantics và tương thích?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phát hiện fat interface | Chỉ ra sự ép buộc khiến ReadOnlyArchive phải ném lỗi cho save/delete hợp lệ theo hợp đồng rộng. |
      | Tách API theo client | Thiết kế DocumentReader, DocumentWriter, DocumentDeleter và inject đúng dịch vụ. |
      | Dùng nhiều vai trò hợp lệ | Giải thích InMemoryStore hỗ trợ nhiều interface nhưng archive chỉ công bố năng lực đọc. |
      | Kiểm thử client đơn giản | Viết fake/lambda của từng interface để kiểm tra tải hoặc nhập tài liệu độc lập. |
      | Phân biệt API và an ninh | Nêu đúng giới hạn compile-time so với quyền thực thi trong ứng dụng. |
  - slug: solid-006
    title: 'Đảo ngược phụ thuộc: phụ thuộc vào sự trừu tượng'
    status: WRITTEN
    difficult: ADVANCED
    focus: 'Đảo ngược phụ thuộc: phụ thuộc vào sự trừu tượng'
    problemSolved: Nghiệp vụ đang import công nghệ hay port?
    mechanism: Abstraction thuộc phía dùng
    applicationValue: Thay JDBC/REST mà không đổi use case
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Đảo ngược phụ thuộc: phụ thuộc vào sự trừu tượng**

      Hiểu DIP là đảo hướng phụ thuộc mã nguồn: quy tắc CustomerSpendingService sử dụng PurchaseReader do phía use case định nghĩa, còn JdbcPurchaseReader và InMemoryPurchaseReader thực hiện port. Bài giải thích khác biệt dependency build-time với luồng gọi runtime, tránh rò rỉ ResultSet/SDK vào API nghiệp vụ và chỉ ra cách test service bằng fake, adapter bằng integration test, ứng dụng bằng wiring test.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hướng phụ thuộc và port

      1. Vì sao CustomerSpendingService tự tạo JdbcPurchaseReader làm quy tắc tổng doanh thu phụ thuộc hạ tầng?
      2. Trong sơ đồ service → PurchaseReader ← adapter, mũi tên dependency mã nguồn khác gì hướng gọi tại runtime?
      3. Port findByCustomer nên trả List Purchase theo nghiệp vụ thay vì ResultSet hay ResponseEntity vì sao?
      4. Điều gì làm composition root được phép biết adapter cụ thể mà lớp use case không nên import?

      ### Hợp đồng và kiểm thử

      1. Trong DipDemo, vì sao KH01 có tổng 330.000 VND khi giao dịch 100.000 bị refunded, còn KH02 ra 0?
      2. PurchaseReader trả null, trả giao dịch sai customerId hoặc nuốt lỗi DB thành danh sách rỗng sẽ làm sai hợp đồng thế nào?
      3. Khi thay in-memory bằng JDBC, loại test nào kiểm tra được phép cộng của service và loại nào cần database để kiểm tra SQL?
      4. Khi nào port thực sự có lợi và khi nào tạo interface cho một helper thuần chỉ làm hệ thống phức tạp hơn?
      5. Vì sao constructor injection với tham số kiểu JdbcPurchaseReader vẫn chưa đủ đạt DIP?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Vẽ đúng hướng dependency | Thể hiện được service → port ← adapter và nơi bootstrap tạo kết nối. |
      | Thiết kế port đúng domain | Định nghĩa PurchaseReader không lộ DataSource/ResultSet hoặc DTO công nghệ vào application. |
      | Trace kết quả DipDemo | Tính đúng tổng 330.000 VND cho KH01 và 0 cho khách không có giao dịch. |
      | Phân loại và test rủi ro | Dùng fake test nghiệp vụ, integration test adapter JDBC và wiring test chọn bean. |
      | Đánh giá ý nghĩa abstraction | Nhận diện biên công nghệ thay đổi thật và tránh interface sao chép hạ tầng. |
  - slug: solid-007
    title: Phân biệt đảo ngược phụ thuộc và tiêm phụ thuộc
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Phân biệt đảo ngược phụ thuộc và tiêm phụ thuộc
    problemSolved: DIP và DI khác nhau cụ thể ở đâu?
    mechanism: Tách dependency graph khỏi wiring
    applicationValue: Lắp ghép/test được và đúng hướng module
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phân biệt đảo ngược phụ thuộc và tiêm phụ thuộc**

      Phân biệt DIP là nguyên lý hướng phụ thuộc mã nguồn với DI là cách cung cấp dependency từ bên ngoài; IoC rộng hơn và Spring chỉ là một cơ chế wiring. Qua CheckoutService/PaymentGateway/DemoBankAdapter, người học thấy constructor nhận concrete adapter là DI nhưng vẫn coupling; muốn đạt DIP, service phải phụ thuộc port nghiệp vụ, adapter implement port và composition root lắp ghép. Bài minh họa fake gateway, test input và lỗi reply.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### DIP, DI, IoC và ownership

      1. Vì sao CheckoutWithDiButWithoutDip truyền DemoBankAdapter qua constructor vẫn là DI nhưng chưa đạt DIP?
      2. CheckoutService → PaymentGateway ← DemoBankAdapter khác gì với CheckoutService → DemoBankAdapter ở mức source dependency?
      3. Composition root và Spring @Bean có thể biết implementation cụ thể vì sao, và có cần Spring để thực hiện DI thủ công không?
      4. Vì sao PaymentGateway chứa DTO từ bank SDK vẫn gây coupling dù chữ ký tham số trông là interface?

      ### Kiểm thử và triển khai

      1. Trong DipDiDemo, PaymentGateway nhận ORD-001 và 150.000 VND trả transaction ID nào và Receipt có các trường gì?
      2. Fake PaymentGateway giúp kiểm tra request, số lần gọi và response bất thường mà không gọi ngân hàng ra sao?
      3. Constructor, setter, field injection khác nhau thế nào về tính bắt buộc dependency và trạng thái khởi tạo?
      4. Vì sao @Autowired hoặc dùng service locator không tự giải quyết DIP hay một contract thanh toán thiếu idempotency?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân biệt ba khái niệm | Diễn đạt rõ DIP là hướng dependency, DI là wiring, IoC là khái niệm điều khiển rộng hơn. |
      | Tách port và adapter | Viết CheckoutService nhận PaymentGateway, DemoBankAdapter triển khai interface thuộc phía nghiệp vụ. |
      | Cấu hình đúng nơi | Dùng main hoặc Spring @Bean để chọn implementation mà service không import SDK. |
      | Test bằng fake | Xác nhận gateway nhận orderId/amount đúng, trả transactionId hợp lệ và input sai bị chặn trước call. |
      | Đánh giá injection | Chọn constructor cho dependency bắt buộc và chỉ ra DI không tự bảo đảm DIP. |
  - slug: solid-008
    title: Cân bằng các nguyên tắc với độ phức tạp thực tế
    status: WRITTEN
    difficult: ADVANCED
    focus: Cân bằng các nguyên tắc với độ phức tạp thực tế
    problemSolved: Khi nào abstraction có lợi hơn code đơn giản?
    mechanism: Kiểm chứng đánh đổi qua ca thực tế
    applicationValue: Giảm độ phức tạp không có giá trị
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Cân bằng các nguyên tắc với độ phức tạp thực tế**

      Biết cân bằng SRP/OCP/LSP/ISP/DIP trước áp lực thay đổi thật và chi phí abstraction. Bài chuyển từ SimpleCheckout chỉ có Standard (30.000 VND, miễn phí từ 500.000) sang DeliveryFeePolicy khi xuất hiện Express có công thức 50.000 cộng 5.000 mỗi kilogram làm tròn lên. Người học phải cân nhắc if/switch, policy, registry, KISS, YAGNI và kiểm chứng change surface, test, khả năng đọc hiểu thay vì đếm class.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Áp dụng đúng nhu cầu

      1. Vì sao SimpleCheckout một class với công thức vận chuyển cố định có thể tốt hơn một hệ thống policy/registry khi chưa có biến thể?
      2. Khi Standard và Express thay đổi độc lập, điều gì khiến DeliveryFeePolicy bắt đầu có giá trị?
      3. Với Order(600.000 VND, 1.500 g), vì sao Standard có tổng 600.000 còn Express có tổng 660.000 VND?
      4. Trong DeliveryDemo, tính đúng số kilogram làm tròn lên mà không cộng 999 gây overflow bằng cách nào?

      ### Chi phí thiết kế và kiểm chứng

      1. Khi nào giữ if/switch rõ ràng còn hợp lý hơn Strategy, factory hoặc plugin loader?
      2. Phân biệt độ phức tạp nghiệp vụ vốn có, độ phức tạp do implementation và độ phức tạp dự phòng tương lai ra sao?
      3. KISS, YAGNI và DRY khuyên điều gì và vì sao hai rule giống cú pháp chưa chắc nên gộp?
      4. Thay vì đếm interface, cần đánh giá change surface, rủi ro hồi quy, chi phí vận hành và test thế nào?
      5. Tại sao việc thêm policy mới vẫn có thể cần sửa enum/cấu hình đăng ký mà không vi phạm OCP về phần tính tổng?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Chọn mức abstraction | So sánh SimpleCheckout với DeliveryFeePolicy dựa trên sự xuất hiện của các quy tắc độc lập. |
      | Kiểm chứng phí vận chuyển | Dự đoán Standard miễn phí và Express 60.000 VND cho đơn 600.000 VND/1.500 g. |
      | Nhận diện thiết kế quá mức | Phát hiện interface một triển khai, kế thừa sâu và plugin dự phòng chưa có nhu cầu. |
      | Đánh giá bằng bằng chứng | Dùng change surface, readability, testability và lỗi hồi quy để chọn ranh giới có ích. |
      | Refactor giữ hành vi | Lập trình tự ghi test hiện trạng, tách policy và kiểm tra lại kết quả/exception/tác dụng phụ. |
- slug: design-patterns
  title: Mẫu thiết kế
  childs:
  - slug: design-patterns-001
    title: 'Mẫu thiết kế: vấn đề, bối cảnh và đánh đổi'
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: 'Mẫu thiết kế: vấn đề, bối cảnh và đánh đổi'
    problemSolved: Vì sao cần pattern?
    mechanism: Vấn đề trước tên mẫu
    applicationValue: Quyết định dựa trên bối cảnh
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Mẫu thiết kế: vấn đề, bối cảnh và đánh đổi**

      Nhận diện mẫu thiết kế như giải pháp có bối cảnh, không phải danh sách tên hay quy tắc bắt buộc. Qua module checkout với các chính sách chiết khấu, bài hướng dẫn so sánh switch với Strategy theo biến thể thực tế, hợp đồng, chi phí gián tiếp, kiểm thử và ghi quyết định thiết kế thay vì áp pattern theo khẩu hiệu.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Bài toán và điều kiện lựa chọn

      1. Design Pattern khác một thư viện hoặc đoạn mã sao chép được ở điểm nào, và vì sao phải mô tả vấn đề trước khi chọn tên mẫu?
      2. Những thay đổi, ràng buộc hợp đồng, tần suất biến thể và chi phí tổ chức nào quyết định pattern có phù hợp?
      3. Với ba chính sách giảm giá ổn định, điều kiện nào khiến switch tập trung đủ tốt và điều kiện nào khiến Strategy đáng dùng?

      ### So sánh giải pháp và xác minh

      1. Vì sao lựa chọn một pattern có thể giảm coupling nhưng tăng indirection, chi phí wiring và khó debug?
      2. Adapter khác Decorator và Factory Method khác static factory ở mục đích thực tế nào?
      3. Một ADR và bộ contract tests cho chiết khấu nên ghi quyết định, kết quả, giới hạn và dấu hiệu xem xét lại ra sao?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phát biểu bài toán | Viết mô tả vấn đề chọn thuật toán chiết khấu theo thay đổi và điều kiện thành công, không mở đầu bằng tên pattern. |
      | Đối chiếu lựa chọn | So sánh switch và Strategy về điểm thay đổi, số abstraction, kiểm thử và tracing. |
      | Phân biệt ý định | Chọn đúng Adapter, Decorator, Strategy hoặc factory theo thay đổi cần giải quyết. |
      | Kiểm tra contract | Đề xuất test cho discount không âm, không vượt subtotal và xử lý biến thể không hợp lệ. |
      | Ghi quyết định | Soạn ADR ngắn nêu bối cảnh, phương án, đánh đổi và điều kiện xem xét lại. |
  - slug: design-patterns-002
    title: Factory Method và Abstract Factory
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Factory Method và Abstract Factory
    problemSolved: Tạo một Product hay cả họ?
    mechanism: Tạo đúng product/họ
    applicationValue: Giảm phụ thuộc loại object cụ thể
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Factory Method và Abstract Factory**

      Phân biệt hai hướng tách việc tạo sản phẩm khỏi code sử dụng. Factory Method đặt điểm tạo một loại sản phẩm trong Creator để subclass override; Abstract Factory cung cấp cả họ sản phẩm liên quan như Button và Checkbox của cùng theme. Bài còn chỉ rõ sự khác biệt với simple/static factory, dependency injection và việc kiểm soát vòng đời hoặc lỗi khởi tạo.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hai cấu trúc tạo đối tượng

      1. Creator, Concrete Creator và Product phối hợp thế nào khi EmailCampaign hoặc SmsCampaign override createSender()?
      2. Abstract Factory tạo Button và Checkbox đồng bộ cho Light/Dark UI bằng các interface và factory cụ thể như thế nào?
      3. Factory Method khác Abstract Factory ở cơ chế thay đổi, số loại sản phẩm và quan hệ inheritance/composition ra sao?

      ### Áp dụng, hợp đồng và đánh đổi

      1. Vì sao static Sender create(Channel) chỉ là simple factory chứ chưa phải Factory Method theo GoF?
      2. Khi thêm một theme mới so với thêm một loại component UI mới, Abstract Factory cần thay đổi những phần nào?
      3. Lỗi tạo object, null, lifecycle và kiểm thử family consistency nên được kiểm soát tại ranh giới nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện Factory Method | Chỉ ra Creator sở hữu quy trình gửi tin và subclass override điểm tạo Sender trong ví dụ campaign. |
      | Dựng Abstract Factory | Phác thảo UiFactory tạo hai product cùng theme, client không cần biết class cụ thể. |
      | Phân loại factory | So sánh simple factory, static factory, GoF Factory Method, Abstract Factory với DI. |
      | Phân tích mở rộng | Dự đoán chi phí khi thêm họ Light/Dark mới và khi thêm loại UI Product. |
      | Kiểm chứng contract | Nêu test Creator dùng fake product và test concrete factory tạo cả họ product nhất quán. |
  - slug: design-patterns-003
    title: Builder và việc tạo đối tượng phức tạp
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Builder và việc tạo đối tượng phức tạp
    problemSolved: Tạo object nhiều ràng buộc?
    mechanism: Dựng đủ trạng thái hợp lệ
    applicationValue: Khởi tạo hợp lệ, dễ đọc
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Builder và việc tạo đối tượng phức tạp**

      Làm chủ quy trình tạo Order có nhiều tùy chọn và ràng buộc bằng fluent Builder. Người học thấy cách khai báo trường bắt buộc, kiểm tra trước và tại build(), áp mặc định, dùng BigDecimal/List.copyOf để bảo vệ dữ liệu, và cân nhắc dùng constructor, record, static factory hoặc staged builder khi phù hợp.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Builder và trạng thái khởi tạo

      1. Vì sao constructor nhiều tham số và việc dùng setter liên tiếp khó biểu diễn ràng buộc cho một Order nhiều tùy chọn?
      2. Fluent Builder cho phép nhập trường bắt buộc, thêm line item và gọi build() theo luồng nào?
      3. Kiểm tra độc lập nên làm khi cấu hình, còn bất biến liên trường và tính hoàn chỉnh phải kiểm ở giai đoạn nào?

      ### Bất biến, lựa chọn và kiểm thử

      1. Vì sao Builder mutable vẫn có thể tạo Order immutable và List.copyOf giúp tránh aliasing sau build()?
      2. Fluent Builder, staged Builder và Director khác nhau về độ phức tạp và yêu cầu trình tự như thế nào?
      3. Một ReportConfig cho CSV/PDF với giới hạn biểu đồ và khoảng ngày nên được test những trường hợp mặc định/lỗi nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Thiết kế API tạo object | Viết luồng Order.builder(required...).addItem(...).build() đọc rõ ý nghĩa từng trường. |
      | Bảo vệ invariant | Phân loại validation từng bước và validation liên trường ở build() để không tạo product thiếu dữ liệu. |
      | Kiểm tra defensive copy | Chứng minh thay đổi builder/list gốc sau build không sửa danh sách item của Order đã tạo. |
      | Lựa chọn kỹ thuật | Giải thích trường hợp chỉ cần record/constructor và khi staged Builder hoặc Director thực sự có ích. |
      | Thiết kế test | Lập test cho required fields, defaults, BigDecimal, tổ hợp không hợp lệ và tái sử dụng Builder. |
  - slug: design-patterns-004
    title: Singleton và rủi ro trạng thái dùng chung
    status: WRITTEN
    difficult: ADVANCED
    focus: Singleton và rủi ro trạng thái dùng chung
    problemSolved: Một instance có an toàn?
    mechanism: Scope khác thread safety
    applicationValue: Tránh rò request/race
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Singleton và rủi ro trạng thái dùng chung**

      Hiểu Singleton chỉ kiểm soát số lượng và điểm truy cập instance trong một phạm vi nhất định, không tự làm object thread-safe. Qua static holder, enum counter, AtomicLong và bean Spring, bài phân biệt việc khởi tạo, đồng bộ thao tác, phạm vi request, dependency injection và vòng đời tài nguyên.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Phạm vi instance và an toàn đồng thời

      1. Một instance trong static Singleton, mỗi class loader, Spring singleton bean và toàn cụm ứng dụng khác nhau thế nào?
      2. Vì sao holder hoặc enum giúp khởi tạo an toàn nhưng không biến mutable currentOrder hay total++ thành thao tác thread-safe?
      3. Trong hai request đồng thời, việc lưu user/order/amount trong field singleton có thể tạo xen kẽ sai lệch ra sao?

      ### Thiết kế thay thế và bảo đảm

      1. Khi nào AtomicLong, ConcurrentHashMap hoặc lock phù hợp với dữ liệu chia sẻ, và tại sao vẫn không thay thế transaction?
      2. Constructor injection với MailClient fake giải quyết phụ thuộc ẩn getInstance() trong unit test như thế nào?
      3. Tại sao singleton bean inject một prototype ShoppingCart không tự tạo cart mới cho mỗi HTTP request?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Xác định scope | Nêu phạm vi instance Java class loader, IoC container, process và phân tán mà không khẳng định một object toàn cầu. |
      | Mô phỏng race | Chỉ ra trình tự hai request làm rò rỉ/sai trạng thái currentUser, currentOrder trong service dùng chung. |
      | Sửa quyền sở hữu trạng thái | Chuyển dữ liệu request sang tham số/biến cục bộ và chọn dependency đúng scope. |
      | Chọn đồng bộ | Phân biệt AtomicLong bảo vệ phép tăng với các bất biến nhiều bước cần khóa/transaction. |
      | Cải thiện kiểm thử | Thay global getInstance bằng constructor injection, test riêng và cơ chế quản lý lifecycle. |
  - slug: design-patterns-005
    title: Adapter và tích hợp giao diện khác nhau
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Adapter và tích hợp giao diện khác nhau
    problemSolved: SDK khác contract ra sao?
    mechanism: Map cả ý nghĩa và lỗi
    applicationValue: Bảo vệ domain khỏi vendor API
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Adapter và tích hợp giao diện khác nhau**

      Hiểu Adapter như một ranh giới giữa PaymentGateway của ứng dụng và LegacyPaymentSdk không tương thích, không phải bộ đổi tên phương thức. Bài dùng BigDecimal USD → long cents chính xác, ánh xạ trạng thái approved/declined, phân biệt timeout chưa biết kết quả và cảnh báo retry thanh toán có thể gây giao dịch trùng.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng Target và ánh xạ SDK

      1. Target, Adapter, Adaptee và Client đảm nhận vai trò gì trong luồng CheckoutService → PaymentGateway → LegacyPaymentApi?
      2. Vì sao 12.34 USD đổi thành 1234 cents bằng movePointRight(2).longValueExact() an toàn hơn dùng double và phép ép long?
      3. Khi legacy trả mã "00" hoặc "05", Adapter cần chuyển thành PaymentReceipt có ý nghĩa nghiệp vụ như thế nào?

      ### Lỗi và thiết kế tích hợp

      1. Vì sao timeout thanh toán không được tự coi là DECLINED hay tự retry vô điều kiện?
      2. Object Adapter dùng composition khác Class Adapter kế thừa ở khả năng thay SDK và dùng fake cho test ra sao?
      3. Adapter khác Facade và Decorator ở ý định gì, và những trường hợp pending/response lỗi cần hợp đồng gì?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Vẽ luồng chuyển đổi | Mô tả Target PaymentGateway, Adaptee SDK và chuyển đổi dữ liệu/trạng thái trong LegacyPaymentAdapter. |
      | Kiểm tra tính chính xác tiền | Dự đoán kết quả 12.34 USD→1234 cents và từ chối số không biểu diễn nguyên cent. |
      | Phân biệt lỗi | Thiết kế kết quả approved/declined/unknown khi SDK trả mã hoặc timeout. |
      | Giảm phụ thuộc vendor | Xác định vì sao CheckoutService chỉ nên biết PaymentGateway chứ không nhận LegacyReply. |
      | Xác minh tích hợp | Thiết kế fake LegacyPaymentApi và test mapping, lỗi, timeout, idempotency/reconciliation. |
  - slug: design-patterns-006
    title: Decorator và bổ sung hành vi
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Decorator và bổ sung hành vi
    problemSolved: Bọc thêm hành vi theo thứ tự?
    mechanism: Thứ tự bọc là hành vi
    applicationValue: Ghép hành vi mà không sửa lõi
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Decorator và bổ sung hành vi**

      Khám phá cách một MessageChannel bọc một MessageChannel khác cùng hợp đồng để thêm prefix, giới hạn chiều dài, đếm lời gọi mà không sửa ConsoleChannel. Bài nhấn mạnh thứ tự lớp bọc, định nghĩa lần gửi thành công, exception và lựa chọn decorator so với proxy, inheritance hoặc một helper đơn giản.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Cấu trúc và composition

      1. Component, Concrete Component, base Decorator và Concrete Decorator được xác định ra sao trong MessageChannel?
      2. Một PrefixDecorator hoặc CountingDecorator có thể giữ cùng interface và delegate thao tác send() như thế nào?
      3. Vì sao BufferedInputStream bọc InputStream là ví dụ rõ về bổ sung hành vi mà client vẫn dùng read()?

      ### Thứ tự, contract và giới hạn

      1. Khi đặt PrefixDecorator trước hay sau LengthLimitDecorator giới hạn 12 code points, vì sao có chuỗi được chấp nhận dù kết quả vượt giới hạn?
      2. CountingDecorator tăng bộ đếm sau khi delegate trả về bình thường thì đang đếm điều gì, và không chứng minh điều gì về giao hàng?
      3. Vì sao AtomicInteger không tự khiến toàn bộ decorator chain thread-safe, và khi nào không đáng tạo nhiều wrapper?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Đọc cấu trúc bọc | Chỉ ra delegate của từng MessageChannel và giữ nguyên contract send() qua các lớp wrapper. |
      | Dự đoán thứ tự | Mô phỏng hai thứ tự Prefix/LengthLimit để xác định độ dài thông điệp được kiểm tra. |
      | Kiểm thử riêng từng lớp | Tạo fake channel và quan sát delegate, prefix, lỗi giới hạn và số lần đếm sau success. |
      | Phân biệt pattern | Giải thích Decorator khác Adapter/Proxy/inheritance ở mục tiêu bổ sung hành vi cùng interface. |
      | Đánh giá chi phí | Chọn giữ helper hoặc ít wrapper khi chain làm call path khó theo dõi và phụ thuộc thứ tự. |
  - slug: design-patterns-007
    title: Facade và đơn giản hóa cách sử dụng
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Facade và đơn giản hóa cách sử dụng
    problemSolved: Client biết quá nhiều subsystem?
    mechanism: Đơn giản phía client, không giấu rủi ro
    applicationValue: Ranh giới module gọn
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Facade và đơn giản hóa cách sử dụng**

      Học cách tạo một điểm vào cấp cao cho use case báo giá, thay vì để nhiều client tự ghép Catalog, Inventory, Discount và Shipping. Bài giải thích Facade ẩn trình tự, không làm mất độ phức tạp bên dưới, không tự tạo transaction phân tán hay giảm latency, và cần test kết quả cùng nhánh lỗi.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Ranh giới Facade

      1. Tại sao controller tự gọi lần lượt Catalog, Inventory, Discount và Shipping dẫn đến coupling và lặp trình tự?
      2. Facade quote(sku, quantity, member) có thể ẩn bước nào mà vẫn giữ riêng trách nhiệm Catalog/Inventory?
      3. Nếu phí vận chuyển được miễn khi tiền hàng sau giảm đạt ngưỡng, vì sao thứ tự tính toán phải nằm trong hợp đồng?

      ### Giới hạn và kiểm chứng

      1. Vì sao quote kiểm tra tồn kho chưa phải reserve/order và không tự bảo đảm inventory lúc đặt hàng thật?
      2. Facade khác Adapter, Decorator và application service ở mục đích/boundary thế nào?
      3. Lợi ích đơn giản hóa API có thể đánh đổi bằng God Facade, latency và sai lệch transaction ra sao?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Thiết kế API use case | Đề xuất CheckoutFacade.quote nhận input đủ dùng và trả Quote thay vì lộ API subsystem. |
      | Phân tích chuỗi bước | Chỉ ra thứ tự tìm sản phẩm, xác minh tồn, giảm giá rồi tính shipping trong flow báo giá. |
      | Phân biệt ranh giới | Giải thích quote không cấp quyền giữ hàng hoặc giải quyết consistency khi nhiều request cạnh tranh. |
      | So sánh pattern | Đặt Facade cạnh Adapter/Decorator và nêu khác biệt về ý định đơn giản hóa API. |
      | Kiểm thử kết quả | Nêu test thành viên, nonmember, SKU sai, hết hàng, discount và phí giao đúng. |
  - slug: design-patterns-008
    title: Strategy và thay thế thuật toán
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Strategy và thay thế thuật toán
    problemSolved: Thay thuật toán nào?
    mechanism: Biến thể có chủ sở hữu
    applicationValue: Đa hình thuật toán theo hợp đồng
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Strategy và thay thế thuật toán**

      Thực hành thay thuật toán tính chiết khấu bằng đối tượng cùng hợp đồng DiscountStrategy được Checkout sử dụng qua composition. Bài đi từ nhánh điều kiện, interface, concrete strategies và lambda đến contract test, lựa chọn tại composition root, BigDecimal có giới hạn hai chữ số và kiểm soát lựa chọn strategy từ dữ liệu người dùng.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Vai trò và điểm thay đổi

      1. Context, Strategy interface và Concrete Strategies phối hợp thế nào để Checkout không phụ thuộc từng chính sách giảm giá?
      2. Vì sao composition giúp chọn DiscountStrategy khác nhau khi tạo Checkout hoặc chuyển đổi lúc chạy?
      3. Lambda có thể đóng vai trò Strategy khi nào, và trường hợp thuật toán phức tạp nào nên tạo class riêng?

      ### Hợp đồng và lựa chọn an toàn

      1. DiscountStrategy cần cam kết những điều kiện nào về subtotal, discount và BigDecimal scale?
      2. Vì sao đổi strategy qua setter trong singleton nhiều request có thể tạo race condition giữa đơn hàng?
      3. Khi policy key lấy từ HTTP, vì sao chỉ nên ánh xạ sang registry strategy đã đăng ký thay vì phản chiếu class tùy ý?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Dựng cấu trúc | Vẽ Checkout → DiscountStrategy → các concrete strategies và mô tả chiều dependency. |
      | Thay biến thể | Mô phỏng việc lắp policy khác vào Context không cần sửa thuật toán checkout. |
      | Kiểm tra contract | Thiết kế contract tests bảo đảm discount không âm, không vượt subtotal và biểu diễn đúng hai chữ số. |
      | Sử dụng lambda hợp lý | Giải thích một functional interface Strategy dùng lambda được khi xử lý ngắn. |
      | Đánh giá concurrency/config | Lựa chọn strategy bất biến theo request và registry hữu hạn khi đầu vào bên ngoài quyết định biến thể. |
  - slug: design-patterns-009
    title: State và hành vi theo trạng thái
    status: WRITTEN
    difficult: ADVANCED
    focus: State và hành vi theo trạng thái
    problemSolved: Đổi state nào hợp lệ?
    mechanism: Transition theo luật
    applicationValue: Giữ invariant vòng đời
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **State và hành vi theo trạng thái**

      Đưa vòng đời đơn hàng từ các nhánh kiểm tra rải rác vào State objects có quy tắc chuyển trạng thái rõ. Bài dạy Context Order, OrderState và các state CREATED/PAID/SHIPPED/CANCELLED, test ma trận trạng thái × thao tác, hạn chế public setStatus và ranh giới lưu trạng thái, transaction, xử lý đồng thời.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Trạng thái, lệnh và phép chuyển

      1. CREATED, PAID, SHIPPED, CANCELLED khác các thao tác confirmPayment(), markShipped(), cancel() và guard ở đâu?
      2. Context Order ủy quyền cho OrderState như thế nào và vì sao private state tốt hơn public setStatus()?
      3. Điều gì xảy ra khi gọi cancel() từ PAID hoặc markShipped() từ CREATED trong ví dụ OrderStateDemo?

      ### Chọn State và giữ đúng nghiệp vụ

      1. State khác Strategy ở nguồn quyết định đổi hành vi và việc chuyển trạng thái như thế nào?
      2. Khi nào enum + switch ngắn là đủ, khi nào nhiều quy tắc/transition khiến State Pattern đáng dùng?
      3. Hai request confirm/cancel đồng thời hoặc phát event trước DB commit có thể gây sai lệch nào; test matrix cần bao phủ gì?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Mô hình hóa state machine | Vẽ bảng CREATED/PAID/SHIPPED/CANCELLED với từng thao tác hợp lệ hay bị từ chối. |
      | Thiết kế ranh giới | Dùng command methods của Order và giấu việc chuyển state trong Context/State hợp lệ. |
      | Dự đoán kết quả | Theo dõi CREATED→PAID→SHIPPED và lỗi thao tác không hợp lệ mà không tự ý đổi trạng thái. |
      | Kiểm tra vòng đời | Thiết kế test các transition hợp lệ và tất cả nhánh invalid trong ma trận. |
      | Đánh giá tính nhất quán | Giải thích nhu cầu optimistic locking, transaction/outbox khi state gắn dữ liệu bền và event. |
  - slug: design-patterns-010
    title: Observer và thông báo thay đổi
    status: WRITTEN
    difficult: ADVANCED
    focus: Observer và thông báo thay đổi
    problemSolved: Ai nhận sự kiện và lúc nào?
    mechanism: Phát sau thay đổi, quản lý lifecycle
    applicationValue: Giảm coupling giữa publisher/listeners
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Observer và thông báo thay đổi**

      Bài học mô hình hóa quan hệ Publisher–Listener qua OrderStatusChanged bất biến, subscribe/unsubscribe và nhiều phản ứng phụ khi đơn đổi trạng thái. Người học nắm thời điểm phát, không phát khi không đổi, xử lý lỗi listener, memory leak, reentrancy, đồng bộ vs async và ranh giới transaction/outbox khi mở rộng sang message broker.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Luồng publish và quan hệ listener

      1. Subject, Listener, Event payload và Subscription đóng vai trò gì khi OrderService chuyển CREATED→PAID?
      2. Vì sao nên mô tả oldStatus/newStatus trong event và không phát khi trạng thái giữ nguyên?
      3. Push model khác Pull model ở coupling và nguy cơ đọc trạng thái đã thay đổi thêm lần nữa như thế nào?

      ### Lỗi, vòng đời và dữ liệu bền

      1. Vì sao quên unsubscribe listener được Subject giữ bằng strong reference có thể gây memory leak?
      2. Tại sao Observer callback không mặc định chạy async và thứ tự dispatch/reentrancy có thể khiến xử lý sự kiện sai?
      3. Vì sao phát event trước commit DB hoặc retry qua broker cần outbox, eventId và xử lý idempotent?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Thiết kế event contract | Đề xuất OrderStatusChanged chứa mã đơn, old/new status và data tối thiểu, không phát no-op. |
      | Quản lý đăng ký | Mô tả subscribe trả handle rồi close/unsubscribe để tránh callback trùng và giữ tham chiếu lâu. |
      | Dự đoán dispatch | Phân tích thứ tự callback, lỗi listener, reentrant emit và ảnh hưởng của handler chậm. |
      | Phân biệt event flow | So sánh Observer đồng bộ trong JVM, event bus và pub/sub qua broker. |
      | Kiểm tra consistency | Đề xuất contract test và giải thích thời điểm publish, outbox, duplicate eventId và idempotent consumer. |
  - slug: design-patterns-011
    title: Template Method và khung thuật toán
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Template Method và khung thuật toán
    problemSolved: Bước workflow nào giữ cố định?
    mechanism: Ổn định trước, mở rộng điểm nhỏ
    applicationValue: Tái sử dụng khung ổn định
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Template Method và khung thuật toán**

      Phân tích khung generate() cố định ở SalesReportTemplate và các bước header(), row(), footer() biến thiên cho báo cáo Text/Markdown. Bài dạy phân biệt phương thức final, primitive operation, hook tùy chọn, kiểm tra thứ tự và rủi ro kế thừa khi gọi override trong constructor hoặc tạo quá nhiều điểm mở rộng.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Bước bất biến và bước có thể thay

      1. Template Method giữ thứ tự validate→calculateTotal→render như thế nào khi các subclass cung cấp định dạng riêng?
      2. Bước chung, protected abstract primitive operation và hook tùy chọn khác nhau về nhiệm vụ và cách override?
      3. Vì sao generate() có thể khai báo final để subclass không viết lại cả workflow?

      ### Giới hạn kế thừa và kiểm chứng

      1. Vì sao gọi configure() overridable trong constructor superclass có thể gặp field của subclass chưa được khởi tạo?
      2. Khi có nhiều trục thay đổi như format, ngôn ngữ, kênh xuất, vì sao Strategy/composition có thể giảm bùng nổ subclass?
      3. Contract tests nào chứng minh thứ tự bước, hook mặc định, tổng doanh thu và dữ liệu đầu vào không bị thay đổi?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện khung thuật toán | Xác định method generate() và các bước cố định/abstract/hook của SalesReportTemplate. |
      | Dự đoán dispatch | Giải thích cách Text và Markdown subclass ghi đè format nhưng không thay thứ tự tổng thể. |
      | Bảo vệ invariant | Đề xuất final template, dữ liệu bất biến và tránh gọi hook từ constructor chưa hoàn tất. |
      | So sánh cơ chế | Đối chiếu Template Method inheritance với Strategy composition và Factory Method điểm tạo object. |
      | Kiểm thử workflow | Nêu test thứ tự các bước và kết quả của subclass có hoặc không có optional hook. |
  - slug: design-patterns-012
    title: Command và đóng gói yêu cầu
    status: WRITTEN
    difficult: ADVANCED
    focus: Command và đóng gói yêu cầu
    problemSolved: Ai thực thi và hoàn tác lệnh?
    mechanism: Yêu cầu là một đơn vị thực thi
    applicationValue: Tách nguồn gọi khỏi xử lý
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Command và đóng gói yêu cầu**

      Hiểu cách biến một yêu cầu thành object để tách nguồn gọi (UI, phím tắt, scheduler) khỏi TaskBoard thực hiện. Ví dụ AddTaskCommand, CompleteTaskCommand và CommandManager làm rõ Receiver/Invoker, lưu trạng thái trước khi thay đổi, undo/redo stacks, xử lý thất bại và giới hạn lệnh có hiệu ứng ngoài tiến trình.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Vai trò và quản lý lệnh

      1. Command, Concrete Command, Receiver và Invoker khác nhau thế nào trong TaskBoard và CommandManager?
      2. Vì sao AddTaskCommand cần nhớ mã công việc đã thêm, còn CompleteTaskCommand phải lưu giá trị done trước đó?
      3. UndoStack và RedoStack cần thay đổi tại thời điểm nào để thao tác lỗi không làm mất lịch sử?

      ### Tính đúng đắn và ranh giới

      1. Undo một thao tác gửi email hay thanh toán thật khác với hoàn tác field trong bộ nhớ như thế nào?
      2. Command cần lưu tham số, trạng thái và version nào để replay/redo không gây tác dụng phụ sai khi Receiver đã đổi?
      3. Khi nào Runnable/lambda là đủ và khi nào command object có identity, history, queue hoặc retry thực sự tạo giá trị?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân biệt vai trò | Vẽ luồng Invoker→Command→Receiver và giải thích UI không giữ business logic. |
      | Mô phỏng undo/redo | Theo dõi AddTask và CompleteTask để khôi phục đúng trạng thái trước thao tác. |
      | Quản lý lịch sử | Phân tích khi nào push/pop undo/redo stack sau khi execute, undo hoặc redo thành công. |
      | Giới hạn hiệu ứng phụ | Giải thích vì sao network command cần idempotency, transaction hoặc compensation, không thể undo bằng cách đảo field. |
      | Đánh giá pattern | Chọn Command hay Runnable/lambda theo yêu cầu lịch sử, audit, xếp hàng và chi phí lớp. |
  - slug: design-patterns-013
    title: Khi mẫu thiết kế làm hệ thống phức tạp hơn cần thiết
    status: WRITTEN
    difficult: ADVANCED
    focus: Khi mẫu thiết kế làm hệ thống phức tạp hơn cần thiết
    problemSolved: Abstraction nào thật sự đáng có?
    mechanism: Đủ đơn giản nhưng giữ contract
    applicationValue: Giảm indirection vô ích
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Khi mẫu thiết kế làm hệ thống phức tạp hơn cần thiết**

      Củng cố cách chống abstraction quá sớm qua ví dụ ba mức phí giao hàng cố định. Bài so sánh enum đơn giản với Strategy+Factory+Registry, chỉ rõ các chi phí nhận thức, kiểm thử, DI và debug, đồng thời nêu dấu hiệu nhu cầu thay đổi thật, YAGNI/KISS/DRY, giữ port hữu ích và quy trình giảm lớp an toàn theo test hành vi.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Đánh giá giá trị của abstraction

      1. Vì sao ba mức phí cố định STANDARD/EXPRESS/PRIORITY chưa cần Strategy, Factory và Facade chỉ chuyển tiếp?
      2. Những chi phí nhận thức, điều hướng, bảo trì và kiểm thử nào xuất hiện khi một request phải đi qua nhiều lớp bọc?
      3. YAGNI, KISS, DRY và Rule of Three gợi ý điều gì khi chưa có nhiều biến thể thực tế?

      ### Thay đổi yêu cầu và refactor an toàn

      1. Khi EXPRESS bắt đầu tính thêm 8000 VND/kg và nhiều đội làm thuật toán, những bằng chứng nào ủng hộ Strategy?
      2. Vì sao một interface chỉ có một implementation như PaymentGateway vẫn có thể là ranh giới hạ tầng cần giữ?
      3. Khi xóa God Factory hoặc các lớp chỉ forward, cần những contract tests/compatibility checks nào để không phá khách hàng?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Đánh giá overengineering | Chỉ ra lớp Factory/Strategy/Facade thừa trong sơ đồ báo giá có ba hằng phí. |
      | Thiết kế đủ nhu cầu | Đề xuất enum hoặc cấu hình đơn giản cho bảng phí ổn định, có validation và test. |
      | Nhận diện điểm tách | Giải thích khi biến thể trở thành thuật toán độc lập thì Strategy bắt đầu có lợi hơn chi phí. |
      | Giữ boundary hữu ích | Phân biệt adapter/port PaymentGateway bảo vệ miền nghiệp vụ với interface chỉ forward không có giá trị. |
      | Lập kế hoạch refactor | Thiết kế bước giảm indirection có test giữ output, lỗi, side effect, API và concurrency. |
- slug: language-mechanics
  title: Cơ chế ngôn ngữ
  childs:
  - slug: language-mechanics-001
    title: Kiểu tổng quát và lớp có tham số kiểu
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Kiểu tổng quát và lớp có tham số kiểu
    problemSolved: Generic class/method giúp an toàn kiểu ra sao?
    mechanism: Tách thuật toán khỏi kiểu cụ thể nhưng giữ type safety
    applicationValue: Tái sử dụng typed API, giảm cast
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Kiểu tổng quát và lớp có tham số kiểu**

      Hiểu vai trò của **Java generics** trong hợp đồng kiểu và tái sử dụng lớp/phương thức. Từ `Box<T>`, `Pair<K,V>` và `InMemoryRepository<ID,T>`, phân biệt generic declaration, type parameter, type argument, inference và generic method; nhận diện giới hạn về invariance, wildcard, type erasure và rủi ro raw type.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Cấu trúc và sử dụng generic type

      1. Trong `Box<T>`, `Box<String>` và `new Box<>("Java")`, đâu là khai báo tham số kiểu, đâu là đối số kiểu và compiler suy luận gì?
      2. Vì sao `Pair<K,V>` biểu diễn hai kiểu độc lập, còn `InMemoryRepository<ID,T>.findById(ID)` giữ được kết quả `Optional<T>`?
      3. Phương thức `<R> Box<R> map(...)` khác gì `T` của class và vì sao static method phải khai báo type parameter riêng?

      ### An toàn kiểu và giới hạn

      1. Vì sao `List<Integer>` không gán được cho `List<Number>` và `Box<Integer>` không phải `Box<Number>`?
      2. `List<? extends Number>` và `List<? super Integer>` cho phép đọc/ghi theo kiểu nào, và PECS hỗ trợ thiết kế `copyAll` ra sao?
      3. Type erasure ảnh hưởng `new T()`, `instanceof List<String>`, overload và `static T` thế nào?
      4. Raw `List` thêm `Integer` vào `List<String>` có thể gây heap pollution và `ClassCastException` ở đâu?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Khai báo cấu trúc tổng quát | Viết `Box<T>`, `Pair<K,V>` và repository typed sao cho getter/setter/query bảo toàn type argument. |
      | Tổ chức generic method | Sử dụng `<R>`, static `<T>` và diamond inference mà không cần cast thủ công. |
      | Chọn API đúng kiểu | Chỉ ra nơi cần bound hoặc wildcard; giải thích phép gán bị từ chối bởi invariance. |
      | Nhận diện ranh giới erasure | Giải thích các thao tác generic không được biên dịch, thay `new T()` bằng factory/Supplier phù hợp. |
      | Kiểm chứng hợp đồng | Xác định compile-time error, unchecked warning, null policy và runtime behavior trong ví dụ. |
  - slug: language-mechanics-002
    title: Ràng buộc tham số kiểu
    status: WRITTEN
    difficult: ADVANCED
    focus: Ràng buộc tham số kiểu
    problemSolved: T cần những năng lực nào?
    mechanism: Chỉ đòi năng lực thực sự cần cho generic T
    applicationValue: Chữ ký thuật toán có bound chính xác
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Ràng buộc tham số kiểu**

      Khai báo **bounded type parameter** để thuật toán chỉ nhận các kiểu có năng lực cần dùng. Bài đào sâu `<T extends Number>`, intersection `&`, `Comparable<? super T>`, ràng buộc đệ quy `<E extends Enum<E>>` và ảnh hưởng của erasure, đồng thời phân biệt bound của `T` với wildcard tại nơi sử dụng.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Upper bound và thuật toán generic

      1. Vì sao `NumberBox<T extends Number>` gọi được `doubleValue()` nhưng `Box<T>` không gọi được?
      2. Vì sao class bound phải đứng trước interface trong `<T extends Number & Comparable<? super T>>`, còn dấu phẩy chỉ phân cách những type parameter khác nhau?
      3. Tại sao `Comparable<? super T>` cho phép `Employee` kế thừa `Comparable<Person>` được dùng trong hàm `max`?
      4. Vì sao bound kiểu `Number` không tự cung cấp toán tử `+` cho `T` hay bảo đảm tiền chính xác và non-null?

      ### Wildcard, đệ quy và runtime

      1. Khi kết quả phải giữ nguyên `T`, chọn bounded generic method hay wildcard `? extends Number` và vì sao?
      2. Trường hợp nào dùng `? super Integer` như đích ghi và vì sao Java không cho `<T super Integer>`?
      3. `<E extends Enum<E>>` mô tả điều gì; sai tên enum constant được phát hiện lúc biên dịch hay chạy?
      4. Erasure của intersection bound chọn bound nào, và vì sao `new T()` hoặc `instanceof T` bị hạn chế?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Thiết kế bound hợp lệ | Khai báo `<T extends Number & Comparable<? super T>>` cho `NumericRange` và kiểm tra tính hợp lệ. |
      | Giữ subtype hợp lệ | Giải thích và chạy `max(List<Employee>)` khi Employee so sánh thông qua Person. |
      | Chọn giữa T và wildcard | Viết chữ ký phù hợp cho hàm trả đúng element type và hàm chỉ đọc số. |
      | Nhận diện lỗi hệ thống kiểu | Phân biệt lỗi compile time, erasure, dữ liệu null và kiểm tra invariant runtime. |
  - slug: language-mechanics-003
    title: Quan hệ kiểu của các cấu trúc tổng quát
    status: WRITTEN
    difficult: ADVANCED
    focus: Quan hệ kiểu của các cấu trúc tổng quát
    problemSolved: List<T> gán và đọc/ghi thế nào?
    mechanism: Suy luận từ nguồn/đích và subtype
    applicationValue: Chọn wildcard/PECS đúng dữ liệu
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Quan hệ kiểu của các cấu trúc tổng quát**

      Hiểu **quan hệ kiểu giữa generic declarations và parameterized types**: Java dùng invariance đối với type argument cụ thể nhưng cho phép use-site variance qua `?`, `? extends`, `? super`. Qua `GenericTypeRelationsDemo`, suy ra phép gán hợp lệ, khả năng đọc/ghi, PECS, wildcard capture, generic inheritance và khác biệt với array covariance.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Subtype, invariance và wildcard

      1. Vì sao `ArrayList<Integer>` là `List<Integer>` nhưng `List<Integer>` không là `List<Number>`?
      2. Khi tham chiếu là `List<?>`, `List<? extends Number>` hoặc `List<? super Integer>`, compiler bảo đảm kiểu đọc và phép `add` nào?
      3. Vì sao `List<?>` không đồng nghĩa `List<Object>` và wildcard không làm collection immutable?

      ### Thiết kế và kiểm chứng type relationships

      1. Vì sao `<T> copy(List<? super T> dst, List<? extends T> src)` cho phép `Integer` sang `Number`?
      2. Vì sao `StringStore extends MemoryStore<String>` triển khai `Store<String>` nhưng không thành `Store<Object>`?
      3. Trong `swapFirstTwo(List<?>)`, helper `<T>` giải quyết vấn đề wildcard capture như thế nào?
      4. Array covariance có thể gây `ArrayStoreException` lúc chạy, còn generic invariance chặn loại phép gán tương đương ở giai đoạn nào?
      5. Type erasure và raw types gây ra name clash hoặc heap pollution ra sao?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Dự đoán tính hợp lệ | Phân loại đúng phép gán `List<Integer>`, `List<Number>`, các wildcard và `Store<T>`. |
      | Chọn chữ ký producer/consumer | Sửa các API sum/copy/seed theo vai trò đọc và ghi dữ liệu. |
      | Xử lý wildcard capture | Dùng helper generic để hoán đổi giá trị cùng element type mà không cast thiếu kiểm chứng. |
      | Giải thích lỗi kiểu | Phân biệt compile error, `ArrayStoreException`, heap pollution và mutability của danh sách. |
  - slug: language-mechanics-004
    title: Kiểu tĩnh, kiểu động và kiểm tra kiểu
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Kiểu tĩnh, kiểu động và kiểm tra kiểu
    problemSolved: Compiler và runtime quyết định điều gì?
    mechanism: Tách kiểu compile time khỏi object runtime
    applicationValue: Dispatch/cast/validation chính xác
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Kiểu tĩnh, kiểu động và kiểm tra kiểu**

      Phân biệt **statically typed language** với runtime polymorphism trong Java. Qua `Notification`, người học phân biệt static type của biến và class thực tế của object, giải thích overload chọn theo kiểu tĩnh, override dispatch theo object, `var` là suy luận kiểu, đồng thời đặt runtime validation tại ranh giới dữ liệu/JSON/reflection thay cho cast mù.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Kiểu tĩnh và hành vi động

      1. Với `Notification n = new EmailNotification()`, compiler thấy kiểu gì, JVM gọi implementation `format()` nào?
      2. Vì sao `describe(Object)` được chọn khi biến có kiểu `Object` dù đang chứa `String`, nhưng `describe((String)value)` chọn overload khác?
      3. `var count = 10` có cho phép gán tiếp chuỗi không; điều đó khác dynamic typing như thế nào?
      4. Static method hiding khác runtime dispatch của instance override ra sao?

      ### Kiểm tra khi chạy và thiết kế API

      1. Vì sao `(String) Integer.valueOf(42)` có thể dẫn đến `ClassCastException`, còn `instanceof` pattern xử lý input không biết kiểu an toàn hơn?
      2. Generics kiểm tra type argument tại compile time nhưng vì sao không thể `instanceof List<String>` khi nhận JSON?
      3. Class<T>.isInstance/cast xác nhận điều gì và vì sao vẫn phải kiểm tra email trống, amount âm hoặc quyền nghiệp vụ?
      4. Khi nào `instanceof` là phân loại ở boundary, khi nào thay bằng interface và polymorphism?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân biệt hệ thống kiểu | Giải thích Java kiểu tĩnh vẫn có dynamic dispatch và phân biệt với Python/JavaScript. |
      | Dự đoán dispatch | Đọc đúng kết quả overload(Object/String), override `format()` và static hiding. |
      | Dùng kiểm tra kiểu an toàn | Phân loại `Object` bằng pattern `instanceof`/`Class.cast`, không downcast thiếu kiểm chứng. |
      | Kiểm tra dữ liệu ngoài | Chuyển `List<?>` sang `List<String>` được kiểm tra từng phần tử và vẫn xác thực quy tắc nghiệp vụ. |
  - slug: language-mechanics-005
    title: Toán tử, thuộc tính và quy ước của ngôn ngữ
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Toán tử, thuộc tính và quy ước của ngôn ngữ
    problemSolved: Biểu thức, field/property hoạt động ra sao?
    mechanism: Phân tích kiểu kết quả và quyền cập nhật trạng thái
    applicationValue: Tính toán và đóng gói đúng quy tắc Java
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Toán tử, thuộc tính và quy ước của ngôn ngữ**

      Sử dụng toán tử, numeric promotion, short-circuit, field/accessor và quy ước Java để xây API OOP rõ nghĩa, tránh sai số, overflow và rò rỉ trạng thái. Bài phân biệt `==` với value equality, JavaBeans property với field, `record` accessor với getter, cũng như `final`, `static`, `var` và tính bất biến thực sự.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Toán tử và đánh giá biểu thức

      1. Vì sao `5 / 2` nhận 2 trước khi gán vào double và `(double)5/2` ra 2.5?
      2. Precedence, associativity và evaluation order là ba khái niệm khác nhau ra sao trong `"Tổng: " + 1 + 2` và `x = y = z`?
      3. Vì sao `byte value = 127; value += 1` có thể âm, còn `Math.addExact` ném khi tràn số quan trọng?
      4. Vì sao `&&` giữ được null guard nhưng `&` vẫn đánh giá vế phải; `>>` khác `>>>` khi dịch số âm?

      ### Field, property và hành vi

      1. Với String, array và record, khi nào dùng `==`, `equals`, `Arrays.equals` và so sánh BigDecimal bằng `compareTo`?
      2. Field, JavaBeans property (`getX/isX`), local variable và record component accessor `x()` khác nhau thế nào?
      3. Vì sao `final List` vẫn mutable và khi nào cần `List.copyOf`/hành vi nghiệp vụ thay setter?
      4. `Product` record cùng `CartLine.increaseQuantity()` kiểm soát đơn giá và quantity như thế nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Tính biểu thức đúng | Dự đoán chia nguyên, promotion, short-circuit, bit shift, `?:` và `+=` narrowing. |
      | Bảo vệ phép tính | Áp dụng Math.addExact/multiplyExact, đơn vị VND và số thập phân thích hợp. |
      | Thiết kế đóng gói | Phân biệt field, getter/setter, record accessor, `final` và dữ liệu mutable. |
      | Kiểm chứng tác động | Viết API tăng quantity có validate và test state giữ nguyên khi lỗi. |
  - slug: language-mechanics-006
    title: Hợp đồng so sánh bằng và mã băm
    status: WRITTEN
    difficult: ADVANCED
    focus: Hợp đồng so sánh bằng và mã băm
    problemSolved: Thế nào là cùng giá trị và hash phù hợp?
    mechanism: Định nghĩa domain identity/value equality ổn định
    applicationValue: Hash collection nhận diện key hợp lệ
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Hợp đồng so sánh bằng và mã băm**

      Định nghĩa **value equality** hoặc identity có chủ đích qua `equals(Object)` và `hashCode()` để `HashSet`/`HashMap` nhận biết key đúng. Bài làm rõ phản xạ/đối xứng/bắc cầu, hash collision, key bất biến, field tham gia equality, array/record/BigDecimal và bẫy inheritance hoặc entity JPA generated ID.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng equals và hash

      1. `==` giữa hai reference khác gì `equals` của `CustomerId` và comparison `Comparable` trả 0?
      2. Năm tính chất của `equals(Object)` là gì; tại sao `equals(a,b)` true buộc hash bằng nhau nhưng hash bằng nhau không chứng minh equals?
      3. Vì sao `HashSet.add`, `HashMap.get` cần cả `hashCode` và `equals` để xử lý collision?
      4. Tại sao equality theo `tenantId` + `customerId` phải có hash nhất quán với đúng ngữ nghĩa định danh?

      ### Các bẫy vòng đời và cấu trúc dữ liệu

      1. Điều gì xảy ra nếu thay `username` của key sau `Map.put`, dù equals/hashCode được tính từ cùng field?
      2. Vì sao `Point.equals(ColoredPoint)` có thể không đối xứng và `final`/composition giúp hạn chế lỗi?
      3. Record chứa array có tự `deepEquals` không và khi nào cần `Arrays.equals` + `Arrays.hashCode` cùng defensive copy?
      4. Tại sao `BigDecimal("1.0")` khác `BigDecimal("1.00")` trong HashSet nhưng có thể được TreeSet xem là một giá trị?
      5. Với JPA entity có ID do DB cấp và proxy, tại sao không có một công thức equals/hashCode dùng cho mọi lifecycle?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Viết value object an toàn | Cài `CustomerId`/`ProductKey` bất biến với equals/hashCode theo tập field định danh nhất quán. |
      | Kiểm chứng hash collection | Chứng minh key mới nhưng bằng giá trị tra được `HashMap`, thêm vào `HashSet` không tăng số phần tử. |
      | Phát hiện rủi ro | Chỉ ra mutable key, hash collision, lỗi symmetry do inheritance và sự khác biệt comparator. |
      | Xử lý kiểu đặc biệt | Chọn đúng equality/hash cho array, record, BigDecimal và đánh giá entity ORM theo lifecycle. |
      | Kiểm thử hợp đồng | Lập test reflexive/symmetric/transitive/null/hash consistency và key stability. |
  - slug: language-mechanics-007
    title: Biểu diễn chuỗi và thông tin chẩn đoán của đối tượng
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Biểu diễn chuỗi và thông tin chẩn đoán của đối tượng
    problemSolved: Object nên được ghi log bằng dữ liệu nào?
    mechanism: Tách diagnostic text với public API/schema
    applicationValue: Chẩn đoán an toàn, có trace và không lộ secret
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Biểu diễn chuỗi và thông tin chẩn đoán của đối tượng**

      Thiết kế **`toString()` như biểu diễn chẩn đoán** giúp người phát triển theo dõi ID/trạng thái nhưng tránh lộ bí mật và chi phí I/O. Qua `Order` và `OrderDiagnostic`, bài phân biệt chuỗi cho developer với DTO/API/customer message, tìm hiểu `Object.toString`, record/array/collection, logging, stack trace và lỗi đệ quy do quan hệ hai chiều.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Biểu diễn đối tượng và dữ liệu an toàn

      1. Vì sao `ClassName@hexHash` của Object không phải địa chỉ bộ nhớ hay ID nghiệp vụ đáng tin?
      2. `println(order)` hoặc `String.valueOf(order)` dùng `toString` ra sao và khác gọi trực tiếp `nullRef.toString()` như thế nào?
      3. Trong `Order.toString`, tại sao nên giữ `orderId`, `status`, `itemCount`, `traceId` mà không ghi email/token?
      4. Vì sao `record Credentials` tự sinh toString có thể lộ password và array cần `Arrays.toString/deepToString`?

      ### Chẩn đoán và tác dụng phụ

      1. Vì sao hai object `Parent`/`Child` tự in nhau có thể gây `StackOverflowError`, và cách hiển thị quan hệ bằng ID giúp gì?
      2. Tại sao `toString` không nên query repository, duyệt graph lớn hoặc trở thành định dạng JSON/schema của API?
      3. Logging có level, supplier/placeholder và truyền Throwable khác gì chỉ nối chuỗi message?
      4. Test nào xác nhận chẩn đoán đủ trường hữu ích nhưng không lộ secret, ngay cả khi format thay đổi?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Override toString có chủ đích | Tạo diagnostic gọn, không null, không side effect với allowlist field phù hợp. |
      | Kiểm soát dữ liệu nhạy cảm | Phân biệt trường được phép log và email/token cần loại bỏ; viết test không rò rỉ. |
      | Nhận diện recursion và hiệu năng | Chỉ ra vòng tham chiếu, lazy loading, list lớn và biện pháp snapshot cạn. |
      | Phân biệt đích biểu diễn | Thiết kế DTO/public view/structured log riêng thay vì parse hoặc serialize `toString`. |
  - slug: language-mechanics-008
    title: Ngoại lệ, trạng thái lỗi và hợp đồng phương thức
    status: WRITTEN
    difficult: ADVANCED
    focus: Ngoại lệ, trạng thái lỗi và hợp đồng phương thức
    problemSolved: Failure có ý nghĩa gì và state ra sao?
    mechanism: Thiết kế đường lỗi ngay cùng đường thành công
    applicationValue: Method contract, failure atomicity và retry đúng
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Ngoại lệ, trạng thái lỗi và hợp đồng phương thức**

      Thiết kế **method contract** bao gồm tiền/hậu điều kiện, invariant, side effect và failure semantics. Qua `StockService.reserve`, phân biệt `Reserved/Rejected` cho kết quả nghiệp vụ dự kiến, `IllegalArgumentException` cho đầu vào sai, exception hạ tầng cho sự cố; hiểu checked/unchecked, propagation/cause, try-with-resources và bảo vệ trạng thái khi lỗi/đồng thời.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Kết quả, ngoại lệ và hợp đồng

      1. Vì sao OUT_OF_STOCK, quantity âm và database unavailable cần kết quả hoặc exception có ý nghĩa khác nhau?
      2. Precondition, postcondition, invariant, failure contract và atomicity nói gì về trạng thái sau `reserve`?
      3. Khi nào nên chọn `boolean`, `Optional`, sealed `ReserveResult` hoặc domain exception?
      4. Checked exception khác unchecked ở quy tắc compile-time nào và `throw` khác `throws` ra sao?

      ### Propagation, nguyên tử và thay thế

      1. Vì sao `new RuntimeException(e.getMessage())` mất cause và nên translate exception ở tầng nào?
      2. Try-with-resources giữ primary/suppressed exception thế nào và vì sao cleanup không đồng nghĩa rollback?
      3. Nếu đã trừ balance rồi email ném lỗi, bắt exception có tự hoàn tác không; transaction/outbox/idempotency cần giải quyết điều gì?
      4. Trong override theo LSP, việc thêm checked exception hoặc đổi nghĩa Optional.empty có thể phá hợp đồng như thế nào?
      5. Vì sao timeout không luôn retry an toàn và `InterruptedException` cần xử lý/khôi phục interrupt ra sao?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Viết hợp đồng rõ ràng | Mô tả đầu vào, kết quả, từ chối và trạng thái giữ nguyên khi thất bại. |
      | Phân loại lỗi đúng tầng | Thiết kế Result/Optional hoặc exception có lý do; không che DB failure thành kết quả không tồn tại. |
      | Giữ nguyên nhân và tài nguyên | Wrap exception có cause, dùng try-with-resources và phân biệt suppressed exceptions. |
      | Bảo đảm trạng thái | Viết test thành công/từ chối/đối số sai, xác minh không thay đổi state ngoài ý muốn. |
      | Đánh giá rủi ro phân tán | Nêu transaction, optimistic lock, retry và idempotency khi có side effect. |
  - slug: language-mechanics-009
    title: Khác biệt ngôn ngữ khi hiện thực cùng một thiết kế OOP
    status: WRITTEN
    difficult: ADVANCED
    focus: Khác biệt ngôn ngữ khi hiện thực cùng một thiết kế OOP
    problemSolved: Thiết kế nào phải giữ giữa các ngôn ngữ?
    mechanism: Ưu tiên trách nhiệm và invariant trước cú pháp
    applicationValue: Chuyển hành vi OOP với test parity
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Khác biệt ngôn ngữ khi hiện thực cùng một thiết kế OOP**

      So sánh cách **cùng một mô hình `ShippingPolicy`** được thể hiện bằng Java, Kotlin, Python, TypeScript và C#, nhận diện khác biệt nominal/structural typing, record/data class/protocol/interface, semantics equality/nullability, số nguyên/decimal và runtime validation. Trọng tâm là giữ hợp đồng phí vận chuyển đúng khi port code thay vì sao chép từng class.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Cùng yêu cầu qua năm ngôn ngữ

      1. Quy tắc `standard = 20.000 VND`, `express = 35.000 + 8.000 × ceil(grams/1000)` được biểu diễn bằng cùng những vai trò nào?
      2. Java/Kotlin/C# khai báo hợp đồng interface theo kiểu nominal thế nào, khác Python Protocol và TypeScript structural typing ra sao?
      3. Java record, Kotlin data class, Python frozen dataclass, TypeScript Readonly, C# readonly record struct khác nhau về reference/value và bất biến sâu như thế nào?
      4. Vì sao Python `bool` cần kiểm tra riêng dù kế thừa int, còn TypeScript JSON/number cần runtime validation?

      ### Port thiết kế và giữ tính đúng đắn

      1. Vì sao Java/Kotlin/C# dùng chia nguyên, Python dùng `//`, TypeScript dùng `Math.ceil` trong bài tính trọng lượng dương?
      2. Vì sao Java record `equals`, Kotlin `==`/`===`, Python `==`/`is`, JS `===` và C# record equality không được dịch máy móc?
      3. Những test nào bảo đảm mức 1, 1000, 1001, 1200, 100000 gram cùng trường hợp lỗi giữ nguyên hành vi giữa các triển khai?
      4. Khi nào thay interface một-method bằng function type/callable mà vẫn giữ đúng ranh giới policy và service?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | So sánh cơ chế ngôn ngữ | Nêu được nominal/structural typing, nullability và runtime checks của năm ngôn ngữ. |
      | Giữ hợp đồng phí vận chuyển | Viết/kiểm thử công thức standard/express và từ chối gram ngoài 1–100000. |
      | Phân biệt equality và mutability | Chỉ ra khác biệt reference/value, readonly/final và collection mutable khi chuyển code. |
      | Port có kiểm chứng | Lập bảng ca parity cho các trọng lượng biên, mã không hỗ trợ và dữ liệu JSON sai kiểu. |
- slug: design-pitfalls
  title: Lỗi thiết kế
  childs:
  - slug: design-pitfalls-001
    title: Lớp ôm quá nhiều trách nhiệm
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Lớp ôm quá nhiều trách nhiệm
    problemSolved: Lớp nào ôm nhiều lý do thay đổi?
    mechanism: Xét cohesion theo lý do thay đổi.
    applicationValue: Tách module theo trách nhiệm kiểm chứng được.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Lớp ôm quá nhiều trách nhiệm**

      Một lớp lớn chưa chắc đã sai; lỗi God Class xuất hiện khi một lớp cùng chịu nhiều lý do thay đổi như tính giá, lưu dữ liệu, gửi thông báo và xác thực. Bài học giúp xác định ranh giới trách nhiệm theo chính sách và hiệu ứng phụ, tách use case điều phối khỏi calculator/repository/notifier, và dùng characterization tests để giữ kết quả nghiệp vụ khi refactor. Việc tạo thêm lớp chỉ có ích nếu giảm coupling mà không làm mất tính dễ hiểu của quy trình.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Nhận diện trách nhiệm thật

      1. Vì sao số dòng hoặc số phương thức không đủ kết luận một class là God Class?
      2. Khi cùng OrderManager phải sửa vì quy tắc giá, SQL và email, những lý do thay đổi nào đang bị gộp?
      3. SRP nói về lý do thay đổi liên quan nhau như thế nào, và vì sao một use case có nhiều bước chưa chắc là God Class?
      4. Những dấu hiệu nào trong code, git history và unit tests cho thấy coupling cao hoặc cohesion thấp?

      ### Tách lớp và giữ hành vi

      1. Trong quy trình đặt hàng, phần nào nên ở PlaceOrderUseCase, PriceCalculator, repository và notifier?
      2. Vì sao tách God Class thành hàng loạt lớp chỉ forwarding hoặc chuyển tất cả vào Utils chưa giải quyết lỗi?
      3. Nếu lưu đơn thành công nhưng thông báo thất bại, ranh giới giao dịch nào cần được xem xét khi tách lớp?
      4. Cần ghi nhận đầu vào, kết quả, exception và side effect nào trước khi refactor để tránh hồi quy?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân tích God Class | Dựa trên trách nhiệm và lý do thay đổi, chỉ ra dấu hiệu cần tách của OrderManager hoặc UserManager mà không dựa thuần độ dài. |
      | Thiết kế lại ranh giới | Phác họa PlaceOrderUseCase phối hợp PriceCalculator, repository, notifier với trách nhiệm cụ thể. |
      | Giữ hợp đồng nghiệp vụ | Lập characterization tests cho kết quả giá, thao tác lưu và luồng thất bại khi di chuyển code. |
      | Đánh giá kết quả refactor | Chỉ ra trường hợp wrapper, Utils hoặc quá nhiều lớp nhỏ chỉ đổi hình thức mà không giảm coupling. |
  - slug: design-pitfalls-002
    title: Trạng thái công khai và mất điều kiện bất biến
    status: WRITTEN
    difficult: ADVANCED
    focus: Trạng thái công khai và mất điều kiện bất biến
    problemSolved: Ai kiểm soát invariant và alias?
    mechanism: Nêu invariant rồi tìm mọi đường mutation.
    applicationValue: Dữ liệu hợp lệ qua mọi thao tác và thất bại.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Trạng thái công khai và mất điều kiện bất biến**

      Bài học tập trung vào cách đối tượng bảo vệ điều kiện bất biến qua suốt vòng đời, không chỉ kiểm tra dữ liệu khi được tạo. Ví dụ SeatInventory yêu cầu số chỗ đặt từ 0 đến sức chứa, từ chối thao tác sai mà giữ trạng thái cũ; các ví dụ collection và record cho thấy private/final hay unmodifiable view có thể vẫn để lộ đường sửa qua alias. Người học xem cả đường thay đổi trạng thái, constructor, subclass và truy cập đồng thời để thiết kế API có hành vi và kiểm thử invariant.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Bất biến và encapsulation

      1. Invariant reserved nằm trong khoảng từ 0 tới capacity khác gì với tiền điều kiện seats dương trong reserve()?
      2. Vì sao field private và final vẫn chưa bảo vệ trạng thái nếu getter trả chính list mutable hay constructor giữ alias ngoài?
      3. Khác nhau giữa Collections.unmodifiableList(view) và defensive snapshot bằng List.copyOf khi list gốc vẫn được sửa là gì?
      4. Setter start/end độc lập có thể phá điều kiện start trước end như thế nào?

      ### Các đường cập nhật và kiểm thử

      1. SeatInventory.reserve phải xử lý kiểm tra đủ chỗ và cập nhật như một thao tác nào khi có nhiều luồng?
      2. Vì sao record chứa List mutable chưa phải immutable sâu và protected field có thể mở đường bỏ qua validation?
      3. Khi reserve hoặc cập nhật lịch bị từ chối, test nên xác minh những hậu điều kiện nào?
      4. Invariant, immutability và thread safety khác nhau ở điều gì dù thường cùng xuất hiện?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Viết và kiểm chứng invariant | Biểu diễn 0 <= reserved <= capacity, dự đoán trạng thái sau các ca đặt/hủy chỗ hợp lệ và bị từ chối. |
      | Đóng các đường sửa trái phép | Sửa LeakyCart hoặc BrokenTeam bằng phương thức nghiệp vụ, bản sao phòng vệ và ranh giới alias phù hợp. |
      | Thiết kế atomic update | Đề xuất synchronized/biện pháp đồng bộ để check-and-update chỗ ngồi không race condition. |
      | Kiểm thử thất bại | Viết ca thử cho input sai, vượt sức chứa và lỗi sửa lén qua collection hay setter độc lập. |
  - slug: design-pitfalls-003
    title: Getter, setter tràn lan nhưng thiếu hành vi
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Getter, setter tràn lan nhưng thiếu hành vi
    problemSolved: Ai sở hữu quy tắc chuyển trạng thái?
    mechanism: Tell object làm đúng hành vi.
    applicationValue: API domain khó bị lạm dụng.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Getter, setter tràn lan nhưng thiếu hành vi**

      Bài học phân biệt đối tượng nghiệp vụ chỉ chứa getters/setters với đối tượng tự giữ quy tắc hành vi. Với vòng đời Order, việc thay setStatus bằng confirm, ship, cancel và thay getLines().add bằng addLine giúp nơi sở hữu trạng thái tự kiểm tra chuyển trạng thái, tiền và danh sách dòng hàng. Bài cũng chỉ rõ DTO, transaction script, JPA entity và lớp dữ liệu đơn giản vẫn có thể dùng getter/setter hợp lý; lựa chọn phải dựa trên invariant và ranh giới giao dịch thực tế.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Từ dữ liệu đến hành vi

      1. Vì sao class Order chỉ có getStatus/setStatus để toàn bộ service tự kiểm tra trạng thái là dấu hiệu anemic domain model?
      2. Quy tắc nào của vòng đời DRAFT → CONFIRMED → SHIPPED và CANCELLED nên nằm trong phương thức Order?
      3. Đổi tên setStatus thành changeStatus có giải quyết lỗi không nếu vẫn cho gán mọi trạng thái?
      4. Tell, Don't Ask yêu cầu đặt quyết định nghiệp vụ ở đâu và có cấm hoàn toàn truy vấn/getter không?

      ### Bối cảnh và kiểm chứng

      1. Vì sao DTO, report row hoặc transaction script đơn giản có thể giữ thiết kế thiên dữ liệu mà không sai?
      2. Trước khi xóa setter của JPA entity có nhiều caller, cần kiểm tra mapping, use case và hợp đồng persistence nào?
      3. Những test nào xác nhận confirm/ship/cancel không cho phép chuyển trạng thái sai và giữ state sau lỗi?
      4. Vì sao đóng gói trạng thái bên trong Order chưa đủ để bảo đảm concurrency, transaction hoặc idempotency?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Xây dựng API theo nghiệp vụ | Chuyển setStatus/setItems thành confirm, ship, cancel, addLine với precondition và hậu điều kiện rõ. |
      | Truy vết vòng đời | Dự đoán các chuyển trạng thái hợp lệ/bị cấm trong Order và lý do bị từ chối. |
      | Phân biệt loại object | Phân tích Entity, Value Object, DTO và Application Service để quyết định nơi chứa logic, getter và setter. |
      | Refactor và kiểm thử an toàn | Lập test cho đường thành công/thất bại và rà soát caller/JPA mapping trước khi hạn chế setter. |
  - slug: design-pitfalls-004
    title: Kế thừa chỉ để dùng lại vài phương thức
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Kế thừa chỉ để dùng lại vài phương thức
    problemSolved: Subtype có đúng hợp đồng cha?
    mechanism: Chọn is-a theo nghĩa, không theo code reuse.
    applicationValue: Bảo toàn LSP và bỏ các method kế thừa không mong muốn.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Kế thừa chỉ để dùng lại vài phương thức**

      Bài học chỉ ra `extends` là cam kết kiểu con có thể thay thế lớp cha, không đơn thuần là phím tắt lấy vài phương thức. `Inventory extends HashMap` vô tình công khai put, clear và các thao tác có thể phá quy tắc tồn kho; phiên bản composition giữ Map bên trong và chỉ cho gọi restock/reserve qua validation. Người học phân biệt composition với delegation, đánh giá rủi ro protected hooks/constructor override và chỉ dùng kế thừa khi hợp đồng superclass thật sự phù hợp.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Đúng kiểu và đúng hợp đồng

      1. Vì sao PricingService extends một tiện ích định dạng chỉ để gọi method tạo ra quan hệ is-a giả?
      2. Inventory extends HashMap thừa hưởng những API nào có thể bỏ qua invariant số lượng tồn kho?
      3. Liskov Substitution Principle yêu cầu điều gì nếu mọi Inventory đều được xem như một Map?
      4. Rủi ro nào xảy ra nếu constructor base gọi một method có thể override trước khi trường subclass được khởi tạo?

      ### Sửa thiết kế và kiểm chứng

      1. Giữ Map private trong Inventory và công khai restock/reserve thay đổi ranh giới trách nhiệm như thế nào?
      2. Trong ví dụ này composition chỉ cấu trúc thành phần còn delegation biểu hiện qua những lời gọi nào?
      3. Khi một subclass thật sự là subtype với extension points được tài liệu hóa, vì sao inheritance vẫn có thể thích hợp?
      4. Cần kiểm thử gì để chứng minh reserve không thể làm số lượng âm dù client cố bypass validation?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện kế thừa giả | Phân tích tại sao Inventory extends HashMap hoặc Service extends Utility tạo API/hợp đồng sai. |
      | Đề xuất composition | Thiết kế Inventory có Map private và method restock/reserve giữ invariant. |
      | Kiểm chứng tính thay thế | Giải thích điều kiện phải thỏa LSP trước khi chấp nhận extends. |
      | Test hành vi bị lộ | Tạo ca kiểm tra đường put/clear, reserve quá tồn kho và bảo vệ trạng thái sau refactor. |
  - slug: design-pitfalls-005
    title: Lạm dụng ép kiểu và kiểm tra kiểu
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Lạm dụng ép kiểu và kiểm tra kiểu
    problemSolved: Type branching thay thế bằng hành vi chung ra sao?
    mechanism: Hỏi hành vi nào thuộc subtype.
    applicationValue: Mở rộng implementation không sửa caller.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Lạm dụng ép kiểu và kiểm tra kiểu**

      Bài học nhận diện code liên tục kiểm tra `instanceof`, downcast hoặc getClass() để lựa chọn cách tính cùng một hành vi, từ đó chuyển thuật toán về những implementation đáp ứng một interface chung như ShippingPolicy. Người học vẫn phân biệt các kiểm tra kiểu chính đáng ở boundary dữ liệu không tin cậy, capability tùy chọn hoặc tập subtype đóng. Bài nhấn mạnh cast không đổi loại đối tượng runtime, generics giữ an toàn kiểu và bộ contract tests phải kiểm tra hành vi thay vì tên class.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Ép kiểu và đa hình

      1. Kiểu tĩnh, kiểu runtime và dynamic dispatch khác nhau như thế nào khi tham chiếu Animal giữ một Dog?
      2. Vì sao cast tham chiếu Animal chứa Cat sang Dog có thể được compiler chấp nhận nhưng lại ném ClassCastException?
      3. Nhiều nhánh instanceof theo loại vận chuyển xuất hiện ở nhiều service cho thấy vấn đề gì về phân bố hành vi?
      4. Đưa tính phí vào ShippingPolicy và implementation cụ thể thay đổi vai trò của Checkout như thế nào?

      ### Ngoại lệ hợp lý và ranh giới

      1. Khi nhận Object từ JSON, plugin hoặc legacy API, vì sao kiểm tra kiểu là điều kiện bảo vệ cần thiết?
      2. Khi một subtype có năng lực scan bổ sung, vì sao một kiểm tra capability có thể hợp lý?
      3. Generics hoặc Class<T>.cast bảo vệ việc chuyển kiểu khác với unchecked cast ra sao?
      4. Vì sao việc kiểm tra trạng thái PAID nên được mô hình thành quy tắc trạng thái thay vì lạm dụng subclass theo state?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Giải thích cast/runtime | Dự đoán kết quả của upcast, downcast và trường hợp ClassCastException. |
      | Refactor type branching | Chuyển nhánh tính phí vận chuyển thành ShippingPolicy có nhiều implementation. |
      | Chọn kiểm tra kiểu phù hợp | Phân loại các ca instanceof cho boundary dữ liệu, sealed hierarchy, capability và branching lặp. |
      | Kiểm tra hợp đồng | Đề xuất cùng bộ test cho mọi ShippingPolicy, đảm bảo kết quả và hành vi nhất quán. |
  - slug: design-pitfalls-006
    title: Giao diện quá lớn hoặc quá nhiều lớp trừu tượng
    status: WRITTEN
    difficult: ADVANCED
    focus: Giao diện quá lớn hoặc quá nhiều lớp trừu tượng
    problemSolved: Contract nào client thật sự cần?
    mechanism: Thiết kế theo client capability.
    applicationValue: Giảm API coupling và implementation stub.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Giao diện quá lớn hoặc quá nhiều lớp trừu tượng**

      Bài học đối chiếu hai lỗi: fat interface buộc client phụ thuộc thao tác không sử dụng và quá nhiều tầng abstraction chỉ chuyển lời gọi. Trong ví dụ quản lý tài liệu, PreviewService chỉ cần DocumentReader còn EditorialService cần thao tác sửa; tách theo client giúp một nguồn chỉ đọc không phải ném UnsupportedOperationException cho save. Người học áp dụng ISP theo hợp đồng có nghĩa, phân biệt với SRP/LSP/DIP, kiểm toán số tầng gián tiếp và giữ class cụ thể khi không có ranh giới biến động hữu ích.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng đúng theo client

      1. Vì sao DocumentManager chứa read, save, delete và email khiến PreviewService phụ thuộc quá rộng?
      2. ReadOnlyDocumentSource phải ném UnsupportedOperationException cho save ảnh hưởng thế nào tới hợp đồng và LSP?
      3. DocumentReader/DocumentWriter theo client khác gì với việc tách mỗi method thành một interface?
      4. Default method ném lỗi không hỗ trợ có thật sự chữa được vấn đề fat interface không?

      ### Tránh tầng trừu tượng vô ích

      1. Khi PreviewFacade → Provider → Factory chỉ forward method, những chi phí đọc hiểu và thay đổi nào tăng lên?
      2. Ma trận client–method và implementation–capability giúp tìm ranh giới ISP cụ thể ra sao?
      3. Khi nào một DocumentRepository kết hợp Reader và Writer hợp lý cho một client cần thao tác nhất quán?
      4. Vì sao việc hạn chế method qua interface không tự tạo kiểm soát authorization ở API boundary?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân tích fat interface | Lập client usage matrix chỉ ra thao tác không cần của PreviewService và EditorialService. |
      | Tách hợp đồng có căn cứ | Đề xuất DocumentReader/DocumentWriter và chỉ định implementation đúng khả năng mà không viết stub giả. |
      | Đánh giá abstraction layers | Chỉ ra lớp forward thuần không mang chính sách, validation hay boundary thay đổi để giản lược luồng. |
      | Giữ tính tương thích | Lập danh sách client và migration khi thay hợp đồng công khai từ DocumentManager sang interface nhỏ. |
  - slug: design-pitfalls-007
    title: Phụ thuộc vòng và truy cập sâu vào đối tượng
    status: WRITTEN
    difficult: ADVANCED
    focus: Phụ thuộc vòng và truy cập sâu vào đối tượng
    problemSolved: Có cycle hoặc knowledge về object graph quá sâu?
    mechanism: Vẽ dependency và ownership graph.
    applicationValue: Giữ phụ thuộc một chiều và giảm ripple.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phụ thuộc vòng và truy cập sâu vào đối tượng**

      Bài học phân biệt vòng phụ thuộc trong đồ thị service/module với chuỗi truy cập sâu vào cấu trúc object. Trong bài toán OrderService và ShippingService, gọi ngược nhau làm khởi tạo và test khó, còn `order.getCustomer().getAddress().getCity()` rải khắp nghiệp vụ khiến client biết quá nhiều biểu diễn nội bộ. Người học dùng hướng phụ thuộc một chiều, truyền ShipmentRequest/DTO hẹp, chuyển hành vi về đúng chủ sở hữu và chỉ dùng event/abstraction khi bảo toàn được hợp đồng thời gian và tính nhất quán.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Nhận diện coupling qua đồ thị và mã

      1. Đồ thị OrderService → ShippingService → OrderService là vòng phụ thuộc theo tiêu chí nào?
      2. Vì sao constructor injection của hai Spring bean đòi nhau có thể gây lỗi khởi tạo?
      3. Deep object navigation khác với việc gọi fluent API hoặc đọc DTO trong mapper ở điểm nào?
      4. Law of Demeter gợi ý giới hạn tri thức của một service về các object bên trong collaborator ra sao?

      ### Phá vòng và giữ trách nhiệm

      1. Truyền ShipmentRequest và DeliveryAddress cho ShippingService giúp bỏ phụ thuộc ngược nào?
      2. Đưa hành vi như eligibleForShipping vào object sở hữu dữ liệu khác gì tạo thêm getter trả nguyên object graph?
      3. Vì sao chỉ trích hai interface nhưng giữ A → BPort → B → APort → A không giải quyết vòng phụ thuộc?
      4. Nếu thay lời gọi trực tiếp bằng event OrderPaid, những điều kiện về timing, duplicate và failure cần định nghĩa?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Vẽ và phát hiện cycle | Vẽ đồ thị phụ thuộc trước/sau giữa OrderService, ShippingService và DeliveryGateway. |
      | Giảm truy cập sâu | Thiết kế ShipmentRequest hoặc phương thức domain hẹp thay chuỗi getCustomer/getAddress/getCity trong nghiệp vụ. |
      | Lập kế hoạch phá cycle | Đề xuất luồng điều phối một chiều hoặc tách policy có chủ sở hữu rõ và đánh giá hợp đồng. |
      | Chống refactor hình thức | Chỉ ra vòng tồn tại sau khi đổi sang interface, hay rủi ro khi dùng event chỉ để né gọi trực tiếp. |
  - slug: design-pitfalls-008
    title: Trạng thái dùng chung khó kiểm soát
    status: WRITTEN
    difficult: ADVANCED
    focus: Trạng thái dùng chung khó kiểm soát
    problemSolved: Ai sửa shared state và bằng cơ chế gì?
    mechanism: Tách visibility, atomicity và transaction.
    applicationValue: Tránh race, rò request và mất cập nhật.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Trạng thái dùng chung khó kiểm soát**

      Bài học giải thích nguồn gốc lỗi khi nhiều tham chiếu có quyền sửa cùng một trạng thái, cả khi không có thread song song do aliasing và khi có concurrency do check-then-act. Qua counter/hạn mức dùng chung, người học phân biệt volatile, synchronized, atomic, concurrent collection, transaction và idempotency; không có từ khóa nào tự sửa mọi ranh giới. Bài còn cảnh báo static/singleton service Spring giữ dữ liệu request và sự khác biệt giữa trạng thái trong một JVM với database/cluster.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Nguồn chia sẻ và lỗi quan sát

      1. Shared mutable state khác gì với chia sẻ dữ liệu immutable hoặc shared object không cho sửa?
      2. Trong ví dụ hai thread kiểm tra và giảm hạn mức, race condition làm invariant bị sai như thế nào?
      3. Vì sao cùng một List mutable được nhiều object giữ alias vẫn nguy hiểm ngay cả khi một thread?
      4. Vì sao một Spring singleton service giữ userId/currentOrder trong field có thể làm rò thông tin giữa request?

      ### Chọn cơ chế bảo vệ

      1. volatile bảo đảm visibility nhưng không làm phép kiểm tra rồi cập nhật trở thành nguyên tử như thế nào?
      2. synchronized và AtomicInteger giúp được tình huống nào, còn invariant gồm nhiều field đòi hỏi gì thêm?
      3. Vì sao ConcurrentHashMap không tự biến read-modify-write nhiều thao tác thành một transaction nghiệp vụ?
      4. Điều gì thay đổi khi trạng thái nằm ở database hoặc nhiều node thay vì chỉ trong một JVM?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện owner và alias | Liệt kê đường tham chiếu có thể sửa trạng thái chung qua static, singleton hoặc collection. |
      | Phân tích race condition | Dự đoán kết quả sai của check-then-act và xây đường cập nhật hạn mức nguyên tử. |
      | Chọn công cụ đúng phạm vi | Giải thích giới hạn của volatile, synchronized, AtomicInteger, ConcurrentHashMap, transaction/optimistic locking. |
      | Kiểm thử concurrency | Thiết kế ca thử có điều phối thread và xác nhận invariant, đồng thời kiểm tra aliasing không phụ thuộc ngẫu nhiên. |
  - slug: design-pitfalls-009
    title: Đối tượng có thể thay đổi làm sai phép so sánh hoặc mã băm
    status: WRITTEN
    difficult: ADVANCED
    focus: Đối tượng có thể thay đổi làm sai phép so sánh hoặc mã băm
    problemSolved: Key mutable ảnh hưởng lookup/sort thế nào?
    mechanism: Giữ định danh ổn định giữa các mutation.
    applicationValue: Giữ Map/Set/cache hoạt động đúng.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Đối tượng có thể thay đổi làm sai phép so sánh hoặc mã băm**

      Bài học đi vào lỗi tinh vi khi thuộc tính mutable tham gia equals/hashCode hoặc Comparator thay đổi trong lúc object đang được dùng làm key/Set element. `HashMap.get()` có thể không tìm được chính tham chiếu key do hash thay đổi; `TreeSet` có rủi ro tương tự khi thứ tự sắp xếp đổi. Người học phân biệt entity mutable với identity ổn định, dùng CustomerId bất biến làm key, phòng vệ record chứa List/array và kiểm tra trường do ORM hoặc Lombok đưa vào hợp đồng equality.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Cơ chế collection và hợp đồng

      1. Vì sao HashMap có thể không tìm được cùng object sau khi field dùng tính hashCode bị sửa?
      2. equals và hashCode yêu cầu điều kiện tương thích nào đối với hai object được coi bằng nhau?
      3. Vì sao HashSet đôi lúc có thể chứa biểu hiện hai entry cùng tham chiếu sau khi key mutable đổi hash?
      4. TreeMap/TreeSet có rủi ro khác gì nếu field dùng cho Comparator thay đổi?

      ### Thiết kế khóa ổn định

      1. Vì sao CustomerId record chứa String bất biến phù hợp làm key hơn CustomerProfile có displayName thay đổi?
      2. Record có List hoặc byte[] tự bất biến sâu và tự so sánh array theo nội dung không, vì sao?
      3. Với JPA entity có ID sinh sau persist, phải cân nhắc cách thiết kế equals/hashCode và vị trí dùng key như thế nào?
      4. Vì sao ConcurrentHashMap, Lombok-generated hash hoặc cache mã băm không tự cứu key mutable sai hợp đồng?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Giải thích cơ chế thất bại | Truy vết bucket hash và dự đoán hành vi tra cứu khi MutableCustomerKey đổi mã. |
      | Thiết kế key ổn định | Phân tách CustomerId immutable khỏi CustomerProfile mutable, giữ lookup sau đổi displayName. |
      | Kiểm tra value object | Chỉ ra rủi ro với record chứa List/array và bổ sung defensive copy/equality thích hợp. |
      | Đánh giá collection/ORM | Lập test equals-hash contract và lookup HashMap/HashSet/TreeSet, rà soát JPA ID và fields Lombok chọn. |
  - slug: design-pitfalls-010
    title: Lạm dụng mẫu thiết kế và trừu tượng hóa quá sớm
    status: WRITTEN
    difficult: ADVANCED
    focus: Lạm dụng mẫu thiết kế và trừu tượng hóa quá sớm
    problemSolved: Pattern tạo giá trị từ khi nào?
    mechanism: Đòi bằng chứng trước khi trích abstraction.
    applicationValue: Giảm chi phí thay đổi và lớp trung gian vô ích.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Lạm dụng mẫu thiết kế và trừu tượng hóa quá sớm**

      Bài học giúp lựa chọn lúc nào abstraction hoặc Design Pattern thật sự giảm chi phí thay đổi và lúc nào nó chỉ thêm indirection. Từ một quy tắc phí vận chuyển đơn giản đến hai chính sách STANDARD/EXPRESS được xác nhận, người học quan sát thời điểm Strategy bắt đầu có giá trị; KISS, YAGNI, DRY và SOLID được hiểu theo bối cảnh thay vì slogan. Mục tiêu là tìm bằng chứng thay đổi, khóa hành vi cũ bằng tests rồi trích đúng ranh giới ổn định, tránh tạo generic framework, factory hay interface cho một nhu cầu chưa có.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Đánh giá nhu cầu abstraction

      1. Vì sao một chính sách phí giao hàng đơn giản có thể chỉ cần một hàm có validation thay vì hệ interface/factory?
      2. Khác nhau giữa lạm dụng pattern vì sai quy mô và trừu tượng hóa quá sớm vì đoán sai điểm biến thiên là gì?
      3. KISS, YAGNI và DRY bị hiểu lệch thế nào nếu chỉ đếm số dòng trùng hoặc số lớp?
      4. Vì sao hai công thức cùng 5% nhưng phục vụ hai quy tắc nghiệp vụ độc lập chưa chắc nên gom vào một abstraction?

      ### Khi nào nên đưa Strategy vào

      1. Khi STANDARD và EXPRESS có thuật toán thay đổi độc lập, FeePolicy giải quyết ranh giới nào?
      2. Trước khi trích FeePolicy, cần ghi nhận input, ngưỡng 500000 VND, exception và ca biên nào để giữ hành vi cũ?
      3. Những dấu hiệu nào cho thấy chuỗi interface/provider/factory chỉ forwarding và tạo ma sát cho người bảo trì?
      4. Trong trường hợp API công khai hay ranh giới security/external dependency đã rõ, khi nào abstraction sớm có căn cứ?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện overengineering | Phân tích sơ đồ nhiều tầng và chỉ ra abstraction không có hợp đồng hoặc chiều thay đổi thực. |
      | Đánh giá thời điểm Strategy | So sánh SimpleCheckout với PolicyCheckout khi mới một chính sách và khi thêm EXPRESS. |
      | Giữ kết quả khi refactor | Đề xuất regression tests ở ngưỡng phí và biên trọng lượng trước/sau khi tách FeePolicy. |
      | Ra quyết định thiết kế | Nêu bằng chứng nhu cầu, ranh giới ổn định/biến thiên và chi phí vận hành trước khi thêm pattern. |
- slug: testing
  title: Kiểm thử
  childs:
  - slug: testing-001
    title: Kiểm thử hành vi công khai và hợp đồng đối tượng
    status: WRITTEN
    difficult: ADVANCED
    focus: Kiểm thử hành vi công khai và hợp đồng đối tượng
    problemSolved: Đối tượng hứa gì với client và khi thất bại?
    mechanism: Viết cam kết trước test
    applicationValue: Test public behavior không khóa implementation
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Kiểm thử hành vi công khai và hợp đồng đối tượng**

      Kiểm thử một đối tượng là kiểm chứng lời hứa của API với client, thay vì tên field, cách đồng bộ hay số private helper. Từ SeatInventory, bài học xác lập tiền điều kiện, hậu điều kiện thành công/thất bại và invariant về số chỗ đã đặt.

      Người học thực hành cùng contract suite cho MonitorSeatInventory và AtomicSeatInventory; quan sát snapshot, thử chuỗi reserve/cancel, kiểm tra value equality của SeatSnapshot và phân biệt bảo đảm atomic của một object trong JVM với transaction ở database.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng nhìn từ phía client

      1. Một chữ ký tryReserve(int) còn thiếu các cam kết nào về giá trị 0, số âm, hết chỗ và exception?
      2. Precondition, success postcondition, failure postcondition và invariant của SeatInventory khác nhau thế nào?
      3. Vì sao chỉ assert tryReserve(7) trả false mà không so sánh snapshot trước/sau là chưa đủ?
      4. Khi thay MonitorSeatInventory bằng AtomicSeatInventory, những điều gì cần giữ nguyên và điều gì chỉ là implementation detail?
      5. Vì sao không nên mở private field reserved hoặc thêm setter để dựng trạng thái kiểm thử?

      ### Chuỗi hành vi, giá trị và đồng thời

      1. Chuỗi reserve(4) → reserve(7 bị từ chối) → cancel(2) → reserve(8) cho thấy lỗi nào mà test từng method có thể bỏ sót?
      2. Record SeatSnapshot cần được kiểm tra equality và hashCode thế nào để dùng an toàn trong HashSet?
      3. Kiểm thử nhiều thread cùng reserve trên một instance xác nhận giới hạn nào và chưa chứng minh gì về nhiều JVM/DB?
      4. State-based assertion khác interaction-based assertion ở những hiệu ứng quan sát được nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Đặc tả contract | Viết rõ precondition, postcondition, invariant và failure semantics cho SeatInventory. |
      | Thiết kế test từ API công khai | Dựng Given–When–Then cho reserve/cancel/snapshot mà không nhìn private field. |
      | Bảo vệ đường lỗi | So sánh snapshot trước và sau khi từ chối đặt/hủy, xác nhận không vượt capacity. |
      | Tái sử dụng contract suite | Chạy cùng test qua factory đối với MonitorSeatInventory và AtomicSeatInventory. |
      | Kiểm tra chuỗi và value equality | Dùng bảng state sequence, boundary cases và equals/hashCode của SeatSnapshot. |
      | Phân định bằng chứng concurrency | Nêu được giá trị và giới hạn của CountDownLatch test một JVM so với integration test DB. |
  - slug: testing-002
    title: Kiểm thử hàm khởi tạo và trạng thái không hợp lệ
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Kiểm thử hàm khởi tạo và trạng thái không hợp lệ
    problemSolved: Object được khởi tạo hợp lệ theo những điều kiện nào?
    mechanism: Kiểm tra biên tạo object
    applicationValue: Không công bố object sai hoặc aliasing
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Kiểm thử hàm khởi tạo và trạng thái không hợp lệ**

      Constructor/factory là ranh giới bảo đảm chỉ công bố đối tượng miền hợp lệ. Qua Invoice, LineItem và Wallet, bài học kiểm tra tham số bắt buộc, điều kiện liên trường, chuẩn hóa mã khách hàng, số học không tràn và thất bại không để lộ trạng thái sai.

      JUnit Jupiter parameterized tests giúp bao phủ ranh giới giảm giá từ 0 đến subtotal, null/blank, List.copyOf và mutation của danh sách nguồn. Bài học còn cảnh báo builder/record, virtual method gọi trong constructor và side effect đã phát trước khi validation hoàn tất.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Dựng object hợp lệ và bất biến

      1. Tại sao constructor Invoice cần kiểm tra danh sách hàng, discountVnd và tổng tiền thay vì chỉ gán field?
      2. Giới hạn discount=0, discount=subtotal và discount=subtotal+1 phải cho những kết quả khác nhau nào?
      3. List.copyOf bảo vệ cách sử dụng ArrayList nguồn ra sao và tại sao không đồng nghĩa deep copy?
      4. Phép Math.multiplyExact/Math.addExact bắt lỗi số học nào mà phép long thông thường có thể bỏ qua?
      5. Vì sao constructor hoàn tất không đồng nghĩa toàn bộ side effect ngoài hệ thống đã tự rollback nếu constructor ném lỗi?

      ### Đường khởi tạo khác và chiến lược test

      1. Compact constructor của record và phương thức build() cần duy trì invariant nào, kể cả khi setter của builder chấp nhận từng field?
      2. Vì sao gọi method overrideable hoặc để this thoát ra khỏi constructor có thể khiến subclass bị quan sát khi chưa khởi tạo?
      3. Trong lịch hẹn ONLINE/OFFLINE, tổ hợp start/end/link/location nào phải bị từ chối dù từng field riêng lẻ có giá trị hợp lệ?
      4. Khi lỗi đến từ JSON hoặc dữ liệu database cũ, nên kiểm thử đúng boundary nào thay vì dùng reflection phá private state?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Lập ma trận constructor | Liệt kê valid/invalid/boundary và các điều kiện liên trường của Invoice hoặc Appointment. |
      | Xác nhận postcondition | Kiểm tra customerId đã trim, subtotal, discount, total và line count sau tạo thành công. |
      | Thử đường từ chối | Dùng assertThrows đúng loại cho null, blank, quantity sai, discount vượt tổng và overflow. |
      | Kiểm tra aliasing | Sửa list nguồn sau tạo, thử sửa accessor để chứng minh snapshot của Invoice không bị ảnh hưởng. |
      | Kiểm thử builder/record | Xác nhận record compact constructor và Builder.build không mở đường tạo object vi phạm invariant. |
      | Phân biệt lỗi trong/ngoài constructor | Chỉ ra side effect trước validation, nguy cơ this escape và giới hạn transaction/concurrency. |
  - slug: testing-003
    title: Kiểm thử điều kiện bất biến và chuyển trạng thái
    status: WRITTEN
    difficult: ADVANCED
    focus: Kiểm thử điều kiện bất biến và chuyển trạng thái
    problemSolved: State/invariant và transition được giữ qua các lệnh thế nào?
    mechanism: Nhìn theo state machine và đường lỗi
    applicationValue: Bảo toàn invariant của entity mutable
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Kiểm thử điều kiện bất biến và chuyển trạng thái**

      Với object có vòng đời, một test kiểm đúng một phép nạp tiền chưa chứng minh ví luôn hợp lệ. Bài học xây state machine Wallet ACTIVE/FROZEN/CLOSED, phân biệt invariant theo snapshot với quy tắc qua thời gian, và kiểm thử cạnh hợp lệ lẫn thao tác bị cấm.

      Người học kiểm tra lỗi không đổi snapshot, chính xác ngưỡng withdraw/close, overflow khi deposit và chuỗi freeze/resume/close. Bài cũng hướng dẫn reference model, property-based testing và lý giải tại sao bất biến hai ví hoặc thao tác nhiều thread phải được kiểm thử ở boundary lớn hơn.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Máy trạng thái và invariant

      1. State invariant như balanceVnd >= 0 khác với quy tắc FROZEN không cho rút tiền như thế nào?
      2. Trong Wallet, những điều kiện nào cho ACTIVE → FROZEN, FROZEN → ACTIVE và ACTIVE → CLOSED?
      3. Vì sao trạng thái CLOSED luôn phải có balance=0 và không được resume/deposit theo hợp đồng ví dụ?
      4. Thế nào là state coverage, transition coverage, invalid-transition coverage và sequence coverage?
      5. Tại sao chỉ dùng assertThrows khi withdraw bị từ chối chưa chứng minh invariant vẫn được bảo vệ?

      ### Giới hạn, chuỗi test và mô hình tham chiếu

      1. Các ngưỡng 0, -1, balance, balance+1 và Long.MAX_VALUE nên được test thế nào?
      2. Reference model độc lập giúp so sánh chuỗi lệnh với Wallet thật bằng cách nào?
      3. Property-based test cần tiền đề gì cho tính chất nạp x rồi rút x quay về số dư cũ?
      4. Vì sao Account A và B riêng lẻ hợp lệ chưa chứng minh tổng tiền được bảo toàn khi chuyển tiền?
      5. Test tuần tự hay một concurrency test pass một lần còn thiếu bằng chứng nào về lost update và transaction?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Mô hình hóa vòng đời | Vẽ ACTIVE/FROZEN/CLOSED với guard, trạng thái đầu/cuối và các lệnh được phép. |
      | Liên kết invariant với test | Biến balance>=0, CLOSED=>balance=0 và thất bại không đổi state thành assertion. |
      | Kiểm tra chuyển trạng thái | Tạo case cho cạnh hợp lệ, cạnh cấm, boundary và chuỗi nhiều bước. |
      | Bảo vệ đường lỗi | So sánh Snapshot trước/sau khi thao tác vi phạm precondition hoặc overflow. |
      | Dùng reference model | Tạo lệnh có seed, so sánh expected status/balance/lỗi và ghi lại chuỗi gây regression. |
      | Xác định ranh giới lớn | Giải thích khi nào cần integration test cho chuyển tiền, DB transaction và concurrency. |
  - slug: testing-004
    title: Kiểm thử các cách thực hiện cùng một giao diện
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Kiểm thử các cách thực hiện cùng một giao diện
    problemSolved: Những implementation của interface có cùng hành vi không?
    mechanism: Thiết kế test có thể tái sử dụng
    applicationValue: Thử nhiều adapter/implementation bằng một suite
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Kiểm thử các cách thực hiện cùng một giao diện**

      Bài học tập trung vào cách tổ chức thực tế một bộ test dùng chung khi có nhiều class implements cùng interface, tránh viết hai bộ test không đồng đều. Interface IntSet có HashIntSet và TreeIntSet; cùng chung lời hứa add/remove/contains/size dù lưu trữ khác nhau.

      Người học dùng JUnit 5 @ParameterizedTest, @MethodSource và Supplier<IntSet> để tạo fixture độc lập cho từng implementation, thử thêm trùng, xóa rồi thêm lại, các số MIN/MAX và tính độc lập giữa hai instance. Test riêng và integration test vẫn cần khi implementation có hợp đồng về DB hoặc cache.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Xác định một contract chung

      1. Vì sao HashIntSet và TreeIntSet phải cho cùng ngữ nghĩa add/remove/contains/size dù có cấu trúc khác nhau?
      2. IntSet.add(7) gọi hai lần phải trả hai boolean thế nào và size thay đổi ra sao?
      3. Những giá trị 0, số âm, Integer.MIN_VALUE và Integer.MAX_VALUE có thuộc miền input của ví dụ không?
      4. Tại sao thứ tự duyệt tập hợp và class HashSet/TreeSet không được test khi interface không công bố?

      ### Tái sử dụng JUnit và kiểm thử riêng

      1. @MethodSource variants() kết hợp Supplier<IntSet> và @ParameterizedTest tạo các lượt test riêng thế nào?
      2. Vì sao mỗi test phải gọi factory.get() thay vì cùng chia sẻ một set mutable?
      3. Test independentInstances có thể phát hiện lỗi nào nếu implementation vô tình dùng storage static?
      4. Khi thêm LinkedHashIntSet, cần thay đổi factory danh sách hay nhân bản toàn bộ ca test?
      5. Khi chuyển sang JdbcRepository, contract suite còn thiếu kiểm tra loại nào về transaction, mapping và tài nguyên thực?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Viết contract IntSet | Diễn đạt add trùng, remove không tồn tại, contains không mutate và size theo số phần tử phân biệt. |
      | Tạo parameterized suite | Khai báo @MethodSource cung cấp tên và Supplier<IntSet> cho mỗi implementation. |
      | Bao phủ nhiều implementation | Chạy cùng test trên HashIntSet, TreeIntSet và một implementation mới. |
      | Kiểm tra state và biên | Thử add/remove/re-add, số âm, MIN/MAX và độc lập giữa các instance. |
      | Giữ test không phụ thuộc storage | Không assert thứ tự HashSet/TreeSet nếu hợp đồng không quy định. |
      | Chọn test đặc thù bổ sung | Phân biệt kiểm thử hợp đồng chung với transaction/cache/TTL/integration cho một implementation. |
  - slug: testing-005
    title: Kiểm thử tính thay thế của kiểu con
    status: WRITTEN
    difficult: ADVANCED
    focus: Kiểm thử tính thay thế của kiểu con
    problemSolved: Subtype có thực sự thay kiểu cha được không?
    mechanism: So pre/postcondition của abstraction
    applicationValue: Phát hiện vi phạm LSP ngoài khả năng compiler
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Kiểm thử tính thay thế của kiểu con**

      Khả năng implements hoặc extends đúng kiểu không chứng minh kiểu con dùng thay được kiểu cha. Bài học chuyển Liskov Substitution Principle thành các assertion về tiền điều kiện, hậu điều kiện, invariant, exception, tác dụng phụ và kỳ vọng quan sát của client.

      Ví dụ DiscountPolicy chấp nhận subtotal 0–1.000.000 và trả discount hợp lệ: NoDiscount, TenPercentDiscount, TieredDiscount đều qua cùng suite, nhưng MinimumOnlyDiscount cố tình loại subtotal dưới 50.000 nên vi phạm hợp đồng. Người học dùng test biên, dữ liệu seed và client Checkout để chứng minh lỗi dù Java vẫn biên dịch.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng subtype

      1. LSP yêu cầu gì khi dùng một DiscountPolicy mới trong Checkout qua cùng interface?
      2. Vì sao kiểu con không được siết tiền điều kiện nhưng có thể nới lỏng phạm vi input hợp lệ?
      3. Những hậu điều kiện 0 <= discount <= subtotal và discount(0)=0 phải đúng cho mọi policy trong miền nào?
      4. Vì sao không thể yêu cầu mọi policy trả cùng số tiền giảm nếu hợp đồng chỉ định một khoảng giá trị?
      5. RuntimeException ở subtotal hợp lệ và side effect ngầm có thể phá khả năng thay thế ra sao?

      ### Thiết kế kiểm thử và giới hạn

      1. MinimumOnlyDiscount sai ở input nào và test ở biên nào bắt được ngay?
      2. Vì sao test cả giá trị 49.999/50.000/50.001 và các mẫu random có seed thay vì chỉ chọn trung bình?
      3. Một policy phụ thuộc vào số lần gọi trước có thể vi phạm tính nhất quán mà client dựa vào như thế nào?
      4. Khi một subtype chỉ đọc không thể thực hiện write, nên chia interface theo khả năng nào thay vì để nó ném UnsupportedOperationException?
      5. Vì sao contract suite PASS chưa phải chứng minh toán học LSP trên mọi input, trạng thái và môi trường?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Viết contract của abstraction | Chỉ rõ miền input, output, exception, determinism và side effect của DiscountPolicy. |
      | Chẩn đoán vi phạm LSP | Nhận diện subtype tăng precondition hoặc giảm postcondition dù implements đúng chữ ký. |
      | Xây dựng test thay thế | Gọi nhiều policy qua interface cùng với client Checkout và bộ assertion chung. |
      | Bao phủ ngưỡng và dữ liệu có seed | Test 0/1/max, ngay trước/sau 50.000 và tập mẫu ngẫu nhiên tái lập được. |
      | Phân biệt hành vi chung với kết quả cụ thể | Cho phép các policy tính discount khác nhau nhưng đều tuân invariant đã hứa. |
      | Đề xuất abstraction phù hợp | Phát hiện interface ghi/đọc bị trộn và xác định trường hợp cần tách hợp đồng. |
  - slug: testing-006
    title: Fake, stub, mock và đối tượng cộng tác
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Fake, stub, mock và đối tượng cộng tác
    problemSolved: Thay collaborator bằng loại test double nào?
    mechanism: Chọn fake/stub/mock theo mục tiêu
    applicationValue: Test logic mà không gọi hạ tầng thật
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Fake, stub, mock và đối tượng cộng tác**

      Unit test CheckoutService không nên thu tiền thật, thay kho dữ liệu thật hoặc gửi email thật. Bài học phân biệt collaborator của SUT với test double: dummy, stub, fake, mock và spy; mỗi loại được chọn theo thông tin test cần chủ động cung cấp hoặc quan sát.

      Ví dụ CheckoutDemo dùng FakeInventory để giữ trạng thái, StubPaymentGateway để điều khiển accept/decline và MockReceiptSender để ghi số lần gửi. Người học xác nhận cả kết quả, số hàng tồn và hiệu ứng thông báo; test với Mockito bổ sung verifyNoInteractions nhưng không nhầm verify(decrease) với dữ liệu thực đã được lưu.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Vai trò của test double

      1. Collaborator khác với fake/stub/mock ở chỗ nào trong thiết kế CheckoutService?
      2. StubPaymentGateway, FakeInventory và MockReceiptSender giúp kiểm soát/quan sát những dữ liệu hay tác dụng phụ nào?
      3. Spy khác mock thuần và dummy được dùng khi nào?
      4. Vì sao cùng một Mockito mock có thể vừa stub khi dùng when(...), vừa verify tương tác?

      ### Kết quả, tương tác và tích hợp

      1. Trong checkout thành công, những assertion nào chứng minh kho từ 3 còn 1 và gửi biên nhận đúng một lần với 500.000 VND?
      2. Khi gateway trả false hoặc kho thiếu hàng, cần xác minh điều gì không thay đổi hoặc không được gọi?
      3. Vì sao verify(inventory).decrease(...) không chứng minh tồn kho đã thật sự được trừ?
      4. Khi nào ArgumentCaptor, verifyNoInteractions, times hoặc never bảo vệ một hợp đồng có tác dụng phụ thực?
      5. Những giới hạn nào của FakeInventory khiến unit test không thể thay thế DB/concurrency/payment integration test?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Lựa chọn test double | Phân biệt dummy, stub, fake, mock, spy theo vai trò trong một tình huống cụ thể. |
      | Dựng CheckoutService thật | Tiêm collaborator thay thế qua constructor và tránh mock chính SUT. |
      | Kiểm chứng state | Dùng FakeInventory kiểm tra số lượng kho sau success/decline/out-of-stock. |
      | Kiểm chứng tác dụng phụ | Ghi nhận email/orderId/amount và assert đúng một lần hoặc không gửi theo outcome. |
      | Sử dụng Mockito vừa đủ | Áp dụng when, verify, times, never và verifyNoInteractions cho ranh giới quan sát được. |
      | Xác định phạm vi unit test | Giải thích chỗ fake khác implementation DB/payment thật và cần test tích hợp riêng. |
  - slug: testing-007
    title: Thiết kế để thay thế phụ thuộc khi kiểm thử
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Thiết kế để thay thế phụ thuộc khi kiểm thử
    problemSolved: Làm sao làm chủ I/O, thời gian và dependency trong test?
    mechanism: Thiết kế từ khả năng thay thế phụ thuộc
    applicationValue: Cô lập service, tăng tính tái lập
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Thiết kế để thay thế phụ thuộc khi kiểm thử**

      Khả năng kiểm thử bắt đầu từ thiết kế lớp: nếu CheckoutService tự new gateway, lấy thời gian thật và gửi email bên trong, test khó cô lập và khó tái lập. Bài học giới thiệu test seam bằng port, constructor injection, composition root và Clock có thể cố định.

      Ví dụ PaymentGateway, ReceiptSender và CheckoutService với Result(accepted, checkedAt) được JUnit kiểm tra qua StubGateway, RecordingSender, Clock.fixed. Người học chứng minh input sai không gọi dependency, cổng từ chối không gửi biên nhận, exception được truyền lên và constructor từ chối dependency null.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Thiết kế điểm thay thế phụ thuộc

      1. Vì sao tự tạo HTTP client, payment adapter và Clock.systemUTC trong CheckoutService làm unit test khó chạy độc lập?
      2. Interface PaymentGateway/ReceiptSender và constructor injection chia trách nhiệm giữa service và composition root thế nào?
      3. DI với DIP có cần framework Spring không và khi nào không nên tạo interface cho mọi class?
      4. Clock.fixed giúp kiểm tra Result.checkedAt ổn định hơn Instant.now như thế nào?
      5. Constructor injection và method injection thích hợp cho những vòng đời dependency nào?

      ### Kiểm chứng bằng test doubles

      1. CheckoutService cần kiểm tra orderId blank và amountVnd<=0 trước khi phát sinh tác dụng phụ nào?
      2. StubGateway trả true/false/exception và RecordingSender giúp khẳng định những điều gì qua 5 unit tests?
      3. Vì sao gateway lỗi không được khiến sender gửi thông báo, còn kết quả từ chối phải giữ checkedAt từ Clock đã tiêm?
      4. Fake/spy sạch theo từng test cần bảo vệ khỏi shared static state ra sao?
      5. Vì sao test seam không tự chứng minh adapter thật xử lý timeout, retry, giao dịch hoặc email thành công?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện dependency khó kiểm soát | Tìm network, clock, environment, database hoặc singleton ẩn trong nghiệp vụ. |
      | Thiết kế port và composition root | Tạo PaymentGateway/ReceiptSender và cung cấp implementation ở ranh giới khởi tạo. |
      | Dùng constructor injection | Truyền dependency bắt buộc, kiểm tra null và tránh tự khởi tạo adapter trong service. |
      | Khóa thời gian trong test | Sử dụng Clock.fixed để assert checkedAt và logic hạn chót không phụ thuộc thời điểm chạy. |
      | Thử kịch bản thất bại | Dùng stub/spy để chứng minh input sai, decline hoặc gateway exception không gửi receipt. |
      | Phân tách unit với integration | Chỉ ra những hành vi network/DB thật cần được kiểm ở cấp adapter hoặc hệ thống. |
  - slug: testing-008
    title: Tránh kiểm thử phụ thuộc quá chặt vào chi tiết bên trong
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Tránh kiểm thử phụ thuộc quá chặt vào chi tiết bên trong
    problemSolved: Assert nào thuộc contract, assert nào chỉ bám nội bộ?
    mechanism: Phân biệt hiệu ứng thật với detail
    applicationValue: Refactor hợp lệ không làm test đỏ giả
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Tránh kiểm thử phụ thuộc quá chặt vào chi tiết bên trong**

      Một bài test giòn đỏ khi đổi HashMap, private helper hoặc số lần gọi PriceCatalog dù kết quả client không đổi. Bài học hướng dẫn xác định đâu là hành vi được hứa và đâu chỉ là thuật toán có thể thay thế khi refactor.

      QuoteContractDemo có PerLineService và GroupedService cho cùng kết quả giá, phí vận chuyển và ngưỡng miễn phí 500.000, dù số lần lookup khác nhau. Người học phân biệt lookup count với tác dụng phụ có nghĩa như charge, send hoặc publish sau commit; thay đổi nghĩa vụ contract sẽ quyết định khi nào tương tác cần được assert.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Nhận diện brittle test

      1. Vì sao test phản chiếu private field hoặc verify số lần gọi calculator dễ đỏ khi refactor không đổi kết quả?
      2. Hai cách tính PerLineService và GroupedService khác số lần lookup nhưng cần giữ những giá trị Quote nào?
      3. Đúng ngưỡng 500.000 VND, phí vận chuyển và tổng cần là bao nhiêu theo hợp đồng?
      4. Trong trường hợp nào số lần tra giá mỗi SKU chuyển từ detail thành yêu cầu API có thể kiểm thử?
      5. Vì sao mock toàn bộ Money, OrderLine hoặc Address thường làm test dài mà ít chứng minh quy tắc?

      ### Phân biệt tương tác cần kiểm tra

      1. Vì sao không gửi receipt khi thanh toán bị từ chối là side effect đáng verify?
      2. Khi nào InOrder có ích cho xác thực trước thanh toán hoặc publish sau commit?
      3. Clock giả và Supplier<UUID> giúp test tránh phụ thuộc thời gian/ID thực như thế nào?
      4. Tại sao test Quote vẫn cần boundary quantity vượt int, SKU không tồn tại và overflow long dù code chỉ được refactor?
      5. Unit test với FakeCatalog chưa kiểm được những vấn đề nào của cache, network hoặc persistence thật?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân loại assertion | Chỉ ra assertion bám hợp đồng và assertion khóa chi tiết cài đặt không cần thiết. |
      | Viết test bền với refactor | Chạy cùng Quote behavior suite trên PerLineService và GroupedService dù lookup count khác nhau. |
      | Bảo vệ giá trị biên | Kiểm tra subtotal, shipping, total tại ngưỡng 500.000 và input/overflow bất hợp lệ. |
      | Chỉ verify side effect cần thiết | Lựa chọn verify của payment, receipt hoặc event khi đúng là cam kết nghiệp vụ. |
      | Tách dữ liệu bất định | Tiêm Clock hoặc ID generator trong bài toán cần tái lập thay vì assert thời gian thật. |
      | Chọn đúng tầng kiểm thử | Nêu phần network/cache/DB mà fake đơn giản không mô phỏng. |
  - slug: testing-009
    title: Kiểm thử hồi quy khi thay đổi thiết kế
    status: WRITTEN
    difficult: ADVANCED
    focus: Kiểm thử hồi quy khi thay đổi thiết kế
    problemSolved: Refactor có giữ nguyên hành vi quan sát được không?
    mechanism: Dùng oracle độc lập, baseline và CI
    applicationValue: Ngăn hồi quy tại boundary và wiring
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Kiểm thử hồi quy khi thay đổi thiết kế**

      Refactor OOP có thể thay class, Strategy, dependency injection hoặc thuật toán mà không chủ định đổi hành vi quan sát được. Bài học xác lập regression suite theo hợp đồng trước/sau thay đổi, có baseline, đặc tả độc lập và kiểm tra cấp test tương ứng với rủi ro.

      Ví dụ LegacyCheckout và RefactoredCheckout dùng ShippingRule: thành viên miễn phí, khách thường miễn phí từ subtotal=100.000 cent; BrokenShippingRule dùng > thay vì >= khiến ca đúng ngưỡng bị lỗi. Người học phối hợp test ví dụ lấy từ yêu cầu, differential testing với seed cố định và invariant tổng=tiền hàng+phí.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng cần giữ sau refactor

      1. Những thay đổi class, DI hoặc Strategy nào được phép mà không đổi Invoice hay failure semantics?
      2. Tại sao test so sánh before và after đơn thuần có thể giữ nguyên một bug có sẵn ở bản cũ?
      3. Specification example, differential test và invariant test cung cấp những loại bằng chứng khác nhau nào?
      4. Ở ngưỡng 99.999, 100.000 và 100.001 cent, phí vận chuyển của khách thường phải khác nhau ra sao?
      5. BrokenShippingRule sai ở điều kiện nào dù cả hai class vẫn implements PriceQuoteService?

      ### Chiến lược regression có thể tái lập

      1. Vì sao cần baseline, test biên và cam kết no-side-effect trước khi tách nghiệp vụ sang ShippingRule?
      2. Tại sao random seed cố định và input gây lỗi được ghi lại quan trọng với differential test?
      3. Thay đổi interface/wiring, transaction hoặc serialization cần bổ sung cấp integration test nào bên cạnh unit test?
      4. Khi business rule thật sự thay đổi, phải quản lý expected value và phê duyệt khác refactor thuần ra sao?
      5. Vì sao CI phải thất bại khi production implementation vi phạm hợp đồng thay vì nuốt AssertionError như demo lỗi cố ý?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Xác lập regression contract | Ghi lại input, Invoice output, error và side effect được phép thay đổi hoặc phải giữ. |
      | Tạo oracle độc lập | Chọn expectation từ yêu cầu cho member, non-member, ngưỡng và input ngoài miền. |
      | So sánh hai thiết kế | Chạy PriceQuoteService cũ/mới cùng trường hợp và dữ liệu mẫu có seed cố định. |
      | Bắt lỗi tại biên | Phát hiện sai sót > thay cho >= đúng subtotal 100.000 cent. |
      | Lập kế hoạch kiểm thử refactor | Chạy baseline, refactor nhỏ, contract/unit, rồi integration và CI theo phạm vi thay đổi. |
      | Quản lý thay đổi hợp đồng | Phân biệt bug/regression với yêu cầu mới và cập nhật test có review thay vì sửa expected tùy ý. |
  - slug: testing-010
    title: Kiểm thử tương tác giữa nhiều đối tượng
    status: WRITTEN
    difficult: ADVANCED
    focus: Kiểm thử tương tác giữa nhiều đối tượng
    problemSolved: Nhiều object gọi nhau đúng điều kiện và thứ tự chưa?
    mechanism: Phân tích workflow theo nhánh và hậu quả
    applicationValue: Ngăn thu tiền/gửi mail/hoàn tồn kho sai
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Kiểm thử tương tác giữa nhiều đối tượng**

      Từng Inventory, PaymentGateway và ReceiptSender có thể đúng riêng nhưng CheckoutService vẫn điều phối sai: charge trước reserve, quên release khi từ chối, gửi biên nhận trước khi thanh toán hoặc charge hai lần. Bài học kiểm thử hợp đồng tương tác theo các nhánh và thứ tự nghiệp vụ có ý nghĩa.

      Qua JUnit 5 + Mockito và CheckoutCollaborationTest dùng InMemoryInventory, người học dùng verify, never, InOrder, verifyNoInteractions đồng thời assert outcome PAID/DECLINED/OUT_OF_STOCK và trạng thái hàng tồn. Bài phân biệt lỗi từ gateway với email thất bại sau charge và giải thích vì sao quy trình thanh toán thật cần idempotency, reconciliation và outbox.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng phối hợp và thứ tự

      1. CheckoutService phải gọi reserve, charge, send theo thứ tự nào khi thành công?
      2. Trường hợp OUT_OF_STOCK phải không gọi những collaborator nào?
      3. PaymentGateway trả false và ném RuntimeException khác nhau thế nào về outcome, release và exception?
      4. Tại sao sender lỗi sau charge thành công không được tự động charge lại hoặc release hàng?
      5. Những lời gọi nào có thứ tự thực sự thuộc hợp đồng để dùng Mockito InOrder?

      ### Test tương tác và kiểm chứng trạng thái

      1. Mockito when, verify, never, verifyNoInteractions và InOrder kiểm chứng những loại kỳ vọng nào?
      2. Vì sao không nên mock chính CheckoutService hoặc chỉ verify gateway.charge mà bỏ qua kết quả cuối?
      3. Với InMemoryInventory còn 5 sản phẩm, checkout mua 2 thành công hoặc bị từ chối dẫn đến số tồn nào?
      4. Vì sao mock cho biết release đã gọi nhưng không chứng minh số hàng được khôi phục, và fake hỗ trợ bằng chứng nào?
      5. Timeout ở payment gateway và lỗi gửi mail thực có thể tạo những trạng thái nào cần reconciliation, idempotency hoặc outbox?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Lập bảng nhánh workflow | Nêu tương tác được phép khi PAID, DECLINED, OUT_OF_STOCK và ngoại lệ từ gateway/sender. |
      | Kiểm chứng thứ tự nghiệp vụ | Dùng InOrder xác minh reserve → charge → send hay reserve → charge → release khi cần. |
      | Chặn tác dụng phụ không hợp lệ | Dùng verifyNoInteractions/never khi hết hàng, charge lỗi hoặc sender đã thất bại. |
      | Kiểm tra outcome và dữ liệu | Assert enum outcome, exception đúng loại và tham số từng collaborator. |
      | Thử phối hợp thật trong bộ nhớ | Dùng InMemoryInventory/RecordingSender để xác nhận tồn kho 5→3 hoặc được hoàn về 5. |
      | Nhận diện giới hạn production | Giải thích tại sao exception gateway không khẳng định giao dịch chưa thu tiền và vì sao cần retry an toàn. |
- slug: refactoring
  title: Tái cấu trúc
  childs:
  - slug: refactoring-001
    title: Nhận diện dấu hiệu cần cải thiện thiết kế
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Nhận diện dấu hiệu cần cải thiện thiết kế
    problemSolved: Những dấu hiệu nào thực sự gây chi phí bảo trì?
    mechanism: Đo lường chi phí trước khi thay thiết kế
    applicationValue: Phân loại smell từ bằng chứng thay đổi
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Nhận diện dấu hiệu cần cải thiện thiết kế**

      Bài giúp chẩn đoán khi một thiết kế OOP khiến việc sửa đổi và kiểm thử trở nên tốn kém. Từ các dấu hiệu Long Method, Large Class, Duplicate Code, Shotgun Surgery, Divergent Change, Feature Envy và Speculative Generality, người học học cách đưa ra giả thuyết dựa trên trách nhiệm, lịch sử thay đổi và hợp đồng công khai trước khi quyết định refactor.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Nhận diện dấu hiệu và chi phí thay đổi

      1. Divergent Change khác Shotgun Surgery thế nào khi theo dõi một class và một lý do thay đổi qua nhiều class?
      2. Vì sao Long Method hay Duplicate Code chưa tự chứng minh cần tách/gộp, và những bằng chứng nào giúp kết luận?
      3. Một class vừa pricing, định dạng và lưu dữ liệu có thể biểu hiện những code smell nào?

      ### Chọn can thiệp có chứng cứ

      1. Làm sao dùng tần suất sửa, bug hồi quy, dependency và setup test để xếp ưu tiên vùng cần xem xét?
      2. Trong DesignSmellsDemo, tách PricingRules và QuoteFormatter giúp phân định những lý do thay đổi nào?
      3. Những trường hợp nào abstraction mới làm mã phức tạp hơn và nên giữ code hiện tại?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân loại code smell | Chỉ ra Long Method, Feature Envy, Primitive Obsession và Speculative Generality trên ví dụ cụ thể. |
      | Phân biệt mô hình thay đổi | Giải thích Divergent Change và Shotgun Surgery bằng vị trí phải chỉnh khi có yêu cầu mới. |
      | Thu thập bằng chứng | Lập giả thuyết từ lịch sử diff, lỗi và bài test thay vì chỉ số dòng. |
      | Đề xuất refactor | Chọn phép tách/đổi kiểu/di chuyển thích hợp với vấn đề được chứng minh. |
      | Bảo vệ hành vi | Đối chiếu đầu ra trước/sau ở sáu ca tính giá và những input không hợp lệ. |
  - slug: refactoring-002
    title: Đổi tên để làm rõ ý định
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Đổi tên để làm rõ ý định
    problemSolved: Làm sao đặt tên diễn tả đúng ý định/hợp đồng?
    mechanism: Diễn đạt mục đích tại nơi sử dụng
    applicationValue: Đổi tên đúng ý định và kiểm tra compatibility
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Đổi tên để làm rõ ý định**

      Bài dạy Rename for Intent như một refactor chỉ đổi định danh và giữ nguyên kết quả, ngoại lệ, luồng tính toán. Với phép tính đơn hàng, tên phương thức, field, biến, boolean và đơn vị VND được làm rõ; người học còn kiểm tra ảnh hưởng lên API công khai, Jackson, JPA, reflection và IDE Rename Symbol.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Chọn tên đúng hợp đồng

      1. Vì sao `Calc.f(items, true)` khó hiểu và `calculatePayableAmountVnd` mô tả kết quả rõ hơn như thế nào?
      2. Nên đặt tên boolean, số tiền, timeout và phương thức validate theo ngữ nghĩa thật ra sao?
      3. Khi nào một tên mới quá dài, sai miền nghiệp vụ hoặc đổi nghĩa cờ thay vì chỉ rename?

      ### Đổi tên và kiểm chứng tương thích

      1. Trong RenameForIntentDemo, tại sao `Before.f` và `After.calculatePayableAmountVnd` phải giữ đúng 95.000 và 125.000 VND?
      2. IDE Rename Symbol giúp gì so với thay chuỗi thủ công và vì sao vẫn cần review diff?
      3. Khi đổi property JSON, getter JavaBean, JPA, bean name hoặc public API, cần kiểm tra những hợp đồng ngoài mã nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phát hiện tên mơ hồ | Đánh giá tên class, method, field, boolean và đơn vị dựa trên vai trò thật. |
      | Thực hiện rename | Dùng IDE Rename Symbol và rà soát các điểm gọi/override. |
      | Dự đoán hành vi | Chứng minh phép tính cũ/mới cùng số tiền và exception. |
      | Phân biệt phạm vi biến đổi | Chỉ ra việc đổi boolean sang enum hoặc đảo nghĩa cờ vượt quá rename. |
      | Kiểm chứng tương thích | Liệt kê trường hợp cần serialization, JPA, reflection hoặc consumer tests. |
  - slug: refactoring-003
    title: Tách phương thức và tách lớp
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Tách phương thức và tách lớp
    problemSolved: Khi nào tách method hay class để tăng cohesion?
    mechanism: Tách theo lý do thay đổi thực tế
    applicationValue: Trích các bước pricing và format với contract giữ nguyên
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Tách phương thức và tách lớp**

      Bài hướng dẫn Extract Method đặt tên cho các bước xử lý có ý nghĩa và Extract Class đưa nhóm dữ liệu/hành vi có trách nhiệm riêng vào đối tượng mới. Qua checkout, PricingPolicy, ReceiptFormatter và CheckoutService, người học tách tính toán khỏi định dạng mà vẫn giữ tổng tiền, validation, exception và side effect theo hợp đồng trước đó.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Phân biệt mức tách

      1. Khi nào tách một khối thành calculateSubtotal thay vì đưa toàn bộ nhóm pricing sang class mới?
      2. Vì sao chiều dài hàm không đủ để kết luận cần Extract Method hay Extract Class?
      3. Nhóm field/method thường thay đổi cùng nhau giúp xác định cohesion và trách nhiệm riêng thế nào?

      ### Bảo toàn hợp đồng

      1. Khi tách method, phải xử lý biến cục bộ, input/output và tác dụng phụ thế nào để tránh đổi kết quả?
      2. Điều gì thay đổi về thứ tự ném exception nếu chuyển validation trước phép tính gây overflow?
      3. Các test nào xác minh CheckoutService mới giữ subtotal, discount, shipping, total và receipt như bản cũ?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Tách phương thức | Đưa các bước tính subtotal, discount, shipping thành method với tham số và kết quả rõ. |
      | Tách lớp có trách nhiệm | Phân chia PricingPolicy, ReceiptFormatter và CheckoutService. |
      | Đánh giá thiết kế | Chỉ ra nơi tăng cohesion và giảm phụ thuộc sau khi tách. |
      | Phát hiện regression | Kiểm tra thứ tự validation, side effect và exception trước/sau refactor. |
      | Xác minh tính tương đương | Đọc ca VIP 570.000 VND, miễn phí shipping và input sai của hai phiên bản. |
  - slug: refactoring-004
    title: Di chuyển hành vi về đối tượng chịu trách nhiệm
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Di chuyển hành vi về đối tượng chịu trách nhiệm
    problemSolved: Hành vi thuộc về object nào?
    mechanism: Đưa quy tắc về nơi sở hữu thông tin
    applicationValue: Phân bố OrderLine/Order/CheckoutService đúng trách nhiệm
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Di chuyển hành vi về đối tượng chịu trách nhiệm**

      Bài giải thích Move Method khi một service truy vấn quá nhiều chi tiết của domain object để tính toán thay nó. Qua OrderLine.subtotalVnd, Order.subtotalVnd/payableVnd và CheckoutService, người học đưa hành vi dựa vào dữ liệu sở hữu về đúng đối tượng, nhưng giữ I/O thu tiền trong lớp điều phối và xét khi domain service/policy phù hợp hơn.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Xác định chủ sở hữu hành vi

      1. Vì sao việc CheckoutService liên tục duyệt line.priceVnd và quantity là dấu hiệu Feature Envy?
      2. Tại sao thành tiền thuộc OrderLine, tổng/giảm VIP trong ví dụ thuộc Order còn gọi PaymentGateway thuộc service?
      3. Khi giảm giá phụ thuộc nhiều hệ thống/coupon, vì sao không nhất thiết chuyển mọi logic về Order?

      ### Thực hiện di chuyển và kiểm thử

      1. OrderLine dùng Math.multiplyExact và Order dùng Math.addExact bảo vệ quy tắc gì?
      2. Vì sao List.copyOf(lines) và OrderLine record bảo vệ trạng thái khi di chuyển phép tính vào Order?
      3. Những test nào chứng minh CheckoutService vẫn gửi đúng 207.000 VND một lần và giữ hành vi từ chối thanh toán?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phát hiện Feature Envy | Chỉ ra service đọc quá nhiều dữ liệu của Order/OrderLine để tự ra quyết định. |
      | Chọn chủ sở hữu | Phân bổ subtotalVnd cho OrderLine, payableVnd cho Order và charge cho service/gateway. |
      | Thiết kế API giàu hành vi | Cho caller yêu cầu order.payableVnd thay vì duyệt cấu trúc list. |
      | Chặn dữ liệu không hợp lệ | Áp dụng record validation, snapshot list và phép số học Exact. |
      | Bảo vệ hành vi bên ngoài | Đọc/viết test cho số tiền, rounding, overflow, số lần gọi gateway và lỗi đầu vào. |
  - slug: refactoring-005
    title: Đóng gói trường dữ liệu và cấu trúc nội bộ
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Đóng gói trường dữ liệu và cấu trúc nội bộ
    problemSolved: Các đường nào làm lộ và phá trạng thái nội bộ?
    mechanism: Giới hạn quyền sửa state
    applicationValue: Bảo vệ invariant qua encapsulation và snapshot
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Đóng gói trường dữ liệu và cấu trúc nội bộ**

      Bài giúp tái cấu trúc class phơi public field hoặc getter trả collection nội bộ thành API thao tác có kiểm tra. LeakyCart được thay bằng ShoppingCart có putLine, changeQuantity, removeLine, lines snapshot và totalCents; qua đó người học phân biệt live view, structural copy và immutable element cùng vấn đề migration public API.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Representation exposure và bảo vệ bất biến

      1. Vì sao public final List vẫn cho client phá invariant và private list kèm getter trả gốc chưa giải quyết vấn đề?
      2. Trong ShoppingCart, tại sao quantity bằng 0 phải xóa dòng và giá/số lượng sai phải bị chặn trước put?
      3. Các đường rò qua constructor, getter và phần tử MutableLine khác nhau thế nào?

      ### Snapshot và refactor hợp đồng

      1. List.copyOf kết hợp LineSnapshot record chặn kiểu mutation nào, khác unmodifiableList ra sao?
      2. Math.multiplyExact và Math.addExact bảo vệ totalCents trước lỗi tính toán nào?
      3. Khi đổi public field sang private hoặc đổi LinkedHashMap sang Map khác, compatibility/thứ tự quan sát cần kiểm tra gì?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện rò rỉ | Chỉ ra alias của field/getter/element cho phép sửa state ngoài validation. |
      | Thiết kế API an toàn | Cài putLine, changeQuantity, removeLine kèm invariant SKU/price/quantity. |
      | Trả snapshot đúng hợp đồng | So sánh List.copyOf, unmodifiable view và copy từng element mutable. |
      | Kiểm chứng không đổi state khi lỗi | Mô tả test exception, snapshot cũ và phép tính totalCents. |
      | Đánh giá migration | Nêu thay đổi source compatibility, thứ tự list, serialization và concurrency. |
  - slug: refactoring-006
    title: Thay điều kiện theo loại bằng đa hình
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Thay điều kiện theo loại bằng đa hình
    problemSolved: Các nhánh theo loại nào nên thay bằng polymorphism?
    mechanism: Thay điều kiện lặp bằng hợp đồng
    applicationValue: Chiến lược DeliveryPolicy và dynamic dispatch
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Thay điều kiện theo loại bằng đa hình**

      Bài hướng dẫn Replace Conditional with Polymorphism khi cùng phép switch theo loại giao hàng lặp ở nhiều nghiệp vụ. DeliveryService chuyển sang hợp đồng DeliveryPolicy với StandardPolicy, ExpressPolicy và PickupPolicy; lựa chọn nằm ở registry, còn dynamic dispatch chạy công thức theo implementation mà vẫn giữ phí, ETA và quy tắc input.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Đánh giá điều kiện và đa hình

      1. Khi nào switch theo DeliveryType thực sự tạo conditional complexity cần refactor?
      2. Vì sao ba class chỉ được gọi qua if/else trong service chưa đạt mục tiêu đa hình?
      3. DeliveryPolicy, registry và dynamic dispatch phân chia trách nhiệm lựa chọn/chạy công thức thế nào?

      ### Kiểm chứng và giới hạn

      1. Ở ngưỡng STANDARD 499.999 và 500.000 VND, phí/ETA phải được giữ thế nào sau refactor?
      2. Khi thêm SAME_DAY, code nào cần đăng ký và phần tính phí của DeliveryService nào không phải sửa?
      3. Khi nào switch ngắn hay enum-specific method dễ hiểu hơn hệ class Strategy?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện điều kiện lặp | Tìm discriminator được switch/if ở nhiều nơi và mô tả chi phí thêm loại. |
      | Trích hợp đồng đa hình | Thiết kế DeliveryPolicy.quote và implementation riêng cho STANDARD/EXPRESS/PICKUP. |
      | Thiết kế registry | Ánh xạ enum sang policy, fail-fast khi thiếu implementation. |
      | Giải thích dispatch | Theo dấu lời gọi policy.quote tới đúng class runtime. |
      | Kiểm chứng hợp đồng | So sánh fee/ETA cũ-mới ở bốn kịch bản và ba input sai. |
  - slug: refactoring-007
    title: Thay kế thừa bằng kết hợp
    status: WRITTEN
    difficult: ADVANCED
    focus: Thay kế thừa bằng kết hợp
    problemSolved: Quan hệ nào nên chuyển từ extends sang collaborator?
    mechanism: Chọn has-a khi is-a không đúng
    applicationValue: Kết hợp AlertService/MessageChannel và Decorator
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Thay kế thừa bằng kết hợp**

      Bài phân tích lúc subclass extends một class chỉ để tái dùng vài method và trở nên phụ thuộc vào API cha. CriticalAlert không phải EmailSender; thiết kế chuyển thành AlertService chứa MessageChannel, hỗ trợ Email/SMS và RetryingChannel decorator. Người học kiểm tra interface, DI constructor, retry hợp đồng và khả năng tương thích khi bỏ extends.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Quan hệ và trách nhiệm

      1. Tại sao CriticalAlert extends EmailSender là quan hệ is-a không phù hợp dù send chạy được?
      2. Một subclass override rồi ném UnsupportedOperationException có thể gây vấn đề LSP như thế nào?
      3. Composition, Strategy, Decorator và constructor injection liên hệ nhưng khác trách nhiệm ở đâu?

      ### Chuyển đổi có kiểm chứng

      1. AlertService dùng MessageChannel qua constructor giúp chuyển email/SMS và fake trong test như thế nào?
      2. RetryingChannel maxAttempts bằng 3 thực hiện tối đa mấy lần gửi và chỉ retry ngoại lệ nào?
      3. Nếu caller đã dùng CriticalAlert như EmailSender, bỏ extends ảnh hưởng compatibility gì và cần chuyển đổi ra sao?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Đánh giá is-a/has-a | Chỉ ra quan hệ kế thừa chỉ để mượn send là sai ngữ nghĩa nghiệp vụ. |
      | Tái cấu trúc bằng composition | Thiết kế AlertService nhận MessageChannel và ủy quyền hành vi gửi. |
      | Chọn Strategy/Decorator | Thay adapter email/SMS và ghép RetryingChannel mà không sửa AlertService. |
      | Kiểm thử retry có điều kiện | Dự đoán số lần gửi khi lỗi DeliveryException và khi gặp IllegalArgumentException. |
      | Rà soát tương thích | Phát hiện caller phụ thuộc extends và đề xuất adapter/migration phù hợp. |
  - slug: refactoring-008
    title: Gộp hoặc loại bỏ trừu tượng không cần thiết
    status: WRITTEN
    difficult: ADVANCED
    focus: Gộp hoặc loại bỏ trừu tượng không cần thiết
    problemSolved: Những abstraction nào là tầng chuyển tiếp thừa?
    mechanism: Xét giá trị abstraction, tránh đếm lớp
    applicationValue: Loại middle man nhưng giữ IO boundaries
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Gộp hoặc loại bỏ trừu tượng không cần thiết**

      Bài đánh giá lúc interface/class/method trung gian chỉ forward, không có ranh giới, hợp đồng hoặc biến thể thật. Thông qua PricingPort → PricingAdapter → PricingEngine và SimplifiedCheckout, người học chọn Remove Middle Man, Inline Class/Method hoặc Collapse Hierarchy nhưng bảo vệ interface quan trọng như PaymentGateway, Clock, Repository và API public.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Phát hiện abstraction thừa

      1. Khi nào OrderFacade, PricingAdapter hay GreetingPortImpl chỉ là middle man không thêm hợp đồng?
      2. Vì sao interface chỉ có một implementation vẫn nên giữ nếu đại diện ranh giới DB/network/clock?
      3. Inline Method, Inline Class, Remove Middle Man và Collapse Hierarchy phù hợp với vấn đề nào khác nhau?

      ### Gộp có căn cứ và an toàn

      1. Tại sao không thể xóa type đang được DI, reflection, plugin hoặc client thư viện sử dụng mà không xem xét compatibility?
      2. Các case ngưỡng 99.999, 100.000, 100.001 cent bảo vệ việc gộp checkout ra sao?
      3. Vì sao kiểm thử differential 1.000 đầu vào vẫn cần oracle specification độc lập để tránh giữ lại cùng một lỗi?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Đánh giá giá trị abstraction | Đối chiếu contract riêng, ranh giới IO, coupling và số client thật trước khi xóa. |
      | Chọn phép đơn giản hóa | Phân biệt Inline Class/Method, Remove Middle Man, Collapse Hierarchy. |
      | Đơn giản hóa luồng gọi | Giảm chuỗi forward về Checkout → SimplifiedCheckout khi không mất trách nhiệm. |
      | Bảo vệ interface quan trọng | Giải thích giữ PaymentGateway, Clock hay Repository khi chúng cô lập phụ thuộc ngoài. |
      | Kiểm tra tương đương | Dùng case hợp đồng và differential test có seed để xác minh phí/tổng/ngoại lệ. |
  - slug: refactoring-009
    title: Cải thiện thiết kế từng bước với kiểm thử bảo vệ
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Cải thiện thiết kế từng bước với kiểm thử bảo vệ
    problemSolved: Refactor từng bước thế nào để hành vi không đổi?
    mechanism: Mỗi vòng đổi nhỏ đều có bằng chứng
    applicationValue: Safety-net tests cho ngưỡng, lỗi và hiệu ứng
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Cải thiện thiết kế từng bước với kiểm thử bảo vệ**

      Bài tổ chức refactoring thành các vòng nhỏ: xác định public contract, bổ sung characterization/specification tests, đổi tên hoặc tách method/class, chạy kiểm thử và xem diff sau từng bước. SafeRefactoringDemo so sánh LegacyCheckout và CheckoutService qua kết quả định giá, ngưỡng VIP 500.000, shipping 700.000, exception, overflow và receipt; bài cũng phân biệt refactor với bug fix/feature.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng và test bảo vệ

      1. Refactoring, bug fix và feature change khác nhau ở điều gì được phép thay đổi?
      2. Characterization test giúp gì với code cũ chưa có tài liệu, và vì sao expected từ code cũ chưa đủ?
      3. Tại sao test kiểm private helper đã gọi mấy lần thường cản trở refactor hợp lệ?

      ### Quy trình từng bước và ranh giới

      1. Thay >= bằng > ở ngưỡng VIP 500.000 hoặc shipping 700.000 sẽ bị ca biên nào phát hiện?
      2. Theo vòng Rename → Extract Method → PricingPolicy → ReceiptFormatter → CheckoutService, mỗi bước cần kiểm chứng gì?
      3. Khi checkout có database, gateway hoặc email, ngoài unit test cần bảo vệ những side effect, transaction và lỗi tích hợp nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân loại thay đổi | Tách refactor giữ hành vi khỏi bug fix và thay đổi hợp đồng. |
      | Thiết kế safety-net test | Ghi yêu cầu, expected độc lập, ca thường, ngưỡng, invalid input và overflow. |
      | Tái cấu trúc theo vòng ngắn | Thực hiện mỗi phép rename/extract nhỏ rồi compile/test và review diff. |
      | Phát hiện lỗi biên | Dùng test 500.000 và 700.000 bắt sai khác giữa >= và >. |
      | Bảo vệ hiệu ứng ngoài | Nêu kiểm thử gateway, repository, thông báo và integration khi có transaction. |
      | Đánh giá test hợp đồng | Bỏ ràng buộc vào private helper, ưu tiên output và side effect public. |
- slug: practice
  title: Thực hành
  childs:
  - slug: practice-001
    title: Bài tập lớp và đối tượng qua tài khoản ngân hàng
    status: WRITTEN
    difficult: BASIC
    focus: Bài tập lớp và đối tượng qua tài khoản ngân hàng
    problemSolved: Class, instance, chuyển tiền an toàn trong RAM?
    mechanism: Giữ dữ liệu trong lớp và kiểm tra trước khi thay.
    applicationValue: Củng cố class-object, encapsulation, invariant, test.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Bài tập lớp và đối tượng qua tài khoản ngân hàng**

      Luyện chuyển yêu cầu quản lý tài khoản thành lớp `BankAccount` với trạng thái riêng, constructor, phép nạp/rút/chuyển tiền và hợp đồng từ chối giao dịch sai. Bài thực hành giúp kiểm tra encapsulation bằng tình huống số dư không được âm, tràn `long` và lỗi chuyển tiền phải giữ nguyên số dư hai phía trong mô hình đơn luồng.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Lớp, đối tượng và hợp đồng tài khoản

      1. Với hai `BankAccount` khác nhau và một biến alias, vì sao sửa số dư qua alias chỉ ảnh hưởng tài khoản mà nó cùng tham chiếu?
      2. Những quy tắc nào constructor và các phương thức `deposit`, `withdraw`, `transferTo` phải kiểm tra để bảo vệ số dư và dữ liệu định danh?
      3. Vì sao `balanceVnd` cần là instance field `private`, còn `static` hoặc `setBalanceVnd` công khai sẽ làm hỏng ý nghĩa mô hình?

      ### Kiểm chứng giao dịch và giới hạn

      1. Trong `transferTo`, cần tính trước những giá trị nào để tràn số ở tài khoản nhận không làm tài khoản gửi bị trừ một nửa?
      2. Những ca JUnit nào chứng minh giao dịch sai bị từ chối và số dư hai phía không thay đổi?
      3. Vì sao code chuyển tiền đơn luồng trong bộ nhớ chưa bảo đảm atomicity khi có concurrency, lỗi tiến trình hoặc database?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Mô hình hóa BankAccount | Tạo được hai instance có mã, chủ sở hữu, số dư độc lập và giải thích đúng alias/identity. |
      | Bảo vệ số dư qua hành vi | Triển khai nạp/rút với tiền dương, số dư đủ và `Math.addExact` để phát hiện overflow. |
      | Thiết kế chuyển tiền thất bại an toàn | Tính số dư dự kiến của nguồn/đích trước khi cập nhật và xác định kết quả nếu receiver overflow. |
      | Kiểm thử invariant | Viết test cho giao dịch hợp lệ, dữ liệu xấu, số tiền bằng 0, tự chuyển và trạng thái giữ nguyên sau exception. |
      | Xác định ranh giới an toàn | Giải thích rõ vì sao bản mô phỏng cần locking hoặc database transaction trong tình huống thực tế. |
  - slug: practice-002
    title: Bài tập đóng gói quy tắc của đơn hàng
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Bài tập đóng gói quy tắc của đơn hàng
    problemSolved: Order bảo vệ trạng thái và tổng tiền thế nào?
    mechanism: Đổi trạng thái qua hành vi, không mở field tùy ý.
    applicationValue: Thiết kế aggregate Order có API an toàn.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Bài tập đóng gói quy tắc của đơn hàng**

      Thực hành biến `Order` thành đối tượng tự bảo vệ dòng hàng, tổng tiền và trạng thái DRAFT/PLACED/CANCELLED, thay vì để mã bên ngoài chỉnh collection hay trạng thái tùy ý. Người học sẽ thiết kế API hành vi, kiểm tra tiền/số lượng trước khi commit thay đổi và dùng các ca kiểm thử để xác nhận bất biến đơn hàng.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Encapsulation và vòng đời Order

      1. Vì sao một `public List` hoặc getter trả Map/collection mutable khiến bên ngoài có thể phá invariant của đơn hàng?
      2. Những chuyển trạng thái nào được phép giữa DRAFT, PLACED và CANCELLED, và vì sao `place()` phải từ chối đơn rỗng?
      3. Order và OrderLine nên chia trách nhiệm kiểm tra dữ liệu, sở hữu dòng hàng và tính tổng tiền như thế nào?

      ### Tính tiền và xử lý lỗi

      1. Vì sao `setLine()` nên kiểm tra map ứng viên và tổng tiền trước khi cập nhật map thật?
      2. Khi đổi số lượng, vượt giới hạn tổng, overflow hoặc thao tác sau `place()`, kết quả lỗi và trạng thái còn lại phải được kiểm thử thế nào?
      3. Vì sao snapshot `List.copyOf(...)` của record với component String/primitive bảo vệ ví dụ, nhưng record chứa phần tử mutable chưa chắc bất biến sâu?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Thiết kế API nghiệp vụ | Xây các phương thức setLine/changeQuantity/removeLine/place/cancel thay cho setter trạng thái và tổng tiền tùy ý. |
      | Cưỡng chế trạng thái Order | Phân tích những thao tác hợp lệ ở DRAFT và các thao tác bị chặn khi PLACED hoặc CANCELLED. |
      | Bảo vệ giá trị dòng hàng | Đặt validation cho SKU, giá, số lượng của OrderLine và tránh lộ collection nội bộ. |
      | Ngăn cập nhật một nửa | Tính tổng ứng viên có kiểm tra overflow trước khi thay đổi dòng hàng thật. |
      | Kiểm thử vòng đời | Liệt kê hoặc viết test cho đặt đơn rỗng, đổi dữ liệu sau đặt hàng, hủy lặp, giới hạn giá và dữ liệu getter. |
  - slug: practice-003
    title: Bài tập giao diện và đa hình thanh toán
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Bài tập giao diện và đa hình thanh toán
    problemSolved: Nhiều PaymentMethod cùng một API hoạt động thế nào?
    mechanism: Lập trình theo contract, thay implementation.
    applicationValue: Áp dụng đa hình runtime và tách processor.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Bài tập giao diện và đa hình thanh toán**

      Rèn interface `PaymentMethod` và runtime polymorphism với thanh toán thẻ, chuyển khoản và ví điện tử. Bài học tập trung vào hợp đồng giao dịch, việc `PaymentProcessor` gọi implementation theo kiểu thực tế, sự khác nhau giữa điều phối và logic thanh toán, cùng cách kiểm thử từ chối mà không mất số dư ví.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng chung và đa hình

      1. Vì sao `PaymentProcessor` chỉ cần gọi `PaymentMethod.pay(request)` mà không phải `if` hoặc `instanceof` phân biệt ba phương thức?
      2. Trong lời gọi `method.pay(request)`, kiểu khai báo interface và loại object runtime quyết định hành vi thế nào?
      3. Vì sao CardPayment, BankTransferPayment và EWalletPayment có thể giữ field và điều kiện duyệt riêng mà vẫn tuân một interface?

      ### Tính đúng và mở rộng

      1. Khi ví không đủ tiền, PaymentResult phải biểu diễn trạng thái, phí, tổng đã trả và số dư còn lại thế nào?
      2. Khi thêm QRPayment với phí và giới hạn riêng, thành phần nào cần bổ sung và vì sao có thể giữ nguyên PaymentProcessor?
      3. Tại sao `Math.addExact`, số tiền nguyên VND và kiểm thử lỗi cần thiết, nhưng demo này vẫn chưa phải hệ thống thanh toán có transaction/idempotency thật?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Xây dựng đa hình qua interface | Định nghĩa PaymentMethod và truyền các implementation vào PaymentProcessor qua constructor. |
      | Dự đoán dynamic dispatch | Giải thích lớp cụ thể nào thực hiện pay khi tham chiếu mang kiểu PaymentMethod. |
      | Kiểm tra kết quả thanh toán | Dự đoán PaymentResult cho thành công/từ chối, phí và số tiền đã trả mà không sửa sai số dư. |
      | Mở rộng implementation | Thêm ý tưởng QRPayment và test mà không thêm nhánh tính phí trong processor. |
      | Nhận biết giới hạn mô phỏng | Phân biệt test trong bộ nhớ với transaction, bảo mật, webhook và đối soát của hệ thống thật. |
  - slug: practice-004
    title: Bài tập chọn kế thừa hay kết hợp
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Bài tập chọn kế thừa hay kết hợp
    problemSolved: Khi nào is-a phù hợp, khi nào dùng collaborator?
    mechanism: Chọn quan hệ theo ngữ nghĩa và tiền/hậu điều kiện.
    applicationValue: Giữ hợp đồng thay thế, giảm hierarchy cứng.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Bài tập chọn kế thừa hay kết hợp**

      Thực hành chọn inheritance theo quan hệ is-a và hợp đồng có thể thay thế, hoặc composition khi một đối tượng sử dụng cộng tác viên có nhiệm vụ riêng. Ví dụ Shape/Circle/Rectangle và ReportPublisher/ReportFormatter/ReportSink giúp đánh giá Liskov Substitution, giảm hierarchy phình to và chứng minh khả năng thay thế bằng test.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Lựa chọn inheritance/composition

      1. Vì sao Circle và Rectangle có thể được dùng qua Shape.area(), còn ReportPublisher không phải một loại CsvFormatter?
      2. Điều gì khác nhau giữa `implements ReportFormatter` và ReportPublisher giữ một field `ReportFormatter`?
      3. Khi SavingsAccount làm chặt điều kiện rút tiền hoặc Square phá quy tắc setter Rectangle, hợp đồng thay thế của lớp cha bị ảnh hưởng thế nào?

      ### Thay đổi thành phần và kiểm thử

      1. Trong ReportPublisher, làm thế nào thay CsvFormatter bằng TextFormatter và thay ReportSink mà không sửa logic điều phối?
      2. Vì sao tổ hợp nhiều lớp con theo loại báo cáo, định dạng và nơi lưu dễ bùng nổ số lượng subclass?
      3. Những contract test nào chứng minh Shape subtype trả diện tích phù hợp và publisher làm việc với formatter/sink giả?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân biệt quan hệ is-a/has-a | Chọn kế thừa cho Shape và composition cho publisher với lập luận về trách nhiệm và hợp đồng. |
      | Đánh giá khả năng thay thế | Chỉ ra trường hợp override thu hẹp tiền điều kiện/làm yếu hậu điều kiện gây vi phạm LSP. |
      | Tổ chức cộng tác viên | Thiết kế constructor injection cho ReportFormatter và ReportSink, thay implementation tại composition root. |
      | Giảm kết dính | Giải thích vì sao không nên kế thừa chỉ để tái sử dụng vài phương thức. |
      | Kiểm chứng lựa chọn | Đề xuất test chung cho subtype Shape và test publisher thay formatter mà không đổi caller. |
  - slug: practice-005
    title: Bài tập đối tượng giá trị và so sánh bằng
    status: WRITTEN
    difficult: ADVANCED
    focus: Bài tập đối tượng giá trị và so sánh bằng
    problemSolved: Giá trị bằng nhau và collection key chính xác ra sao?
    mechanism: Chuẩn hóa trước khi so sánh và lưu collection.
    applicationValue: Sử dụng value object bất biến đúng equals/hash/ordering.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Bài tập đối tượng giá trị và so sánh bằng**

      Thiết kế `Sku` và `Money` như value object có biểu diễn chuẩn tắc, bất biến và ngữ nghĩa so sánh đúng. Bài thực hành tập trung vào khác biệt identity/value equality, chuẩn hóa `BigDecimal` theo scale, hợp đồng `equals`/`hashCode`/`compareTo`, rủi ro mutable key và giới hạn so sánh mặc định của record có array.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Chuẩn hóa giá trị và bình đẳng

      1. Vì sao `new Sku(" ab-01 ")` phải bằng `new Sku("AB-01")` và việc chuẩn hóa bằng `Locale.ROOT` cần thực hiện lúc nào?
      2. Vì sao `BigDecimal("12.3")` và `BigDecimal("12.30")` có thể khác `equals` dù `compareTo` bằng 0; Money khắc phục bằng scale 2 thế nào?
      3. Vì sao USD 12.30 không bằng EUR 12.30 và không thể cộng tiền khác đơn vị mà không có chính sách chuyển đổi?

      ### Collection và dữ liệu mutable

      1. Nếu hai object bằng nhau theo `equals` nhưng hash khác nhau, `HashSet` và `HashMap` có thể gặp lỗi gì?
      2. Khi dùng `TreeSet`, điều gì xảy ra nếu `compareTo == 0` không nhất quán với `equals`?
      3. Vì sao record có array component hoặc key có trường mutable không tự trở thành value object an toàn, và cần dùng defensive copy ở những ranh giới nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Thiết kế giá trị chuẩn tắc | Cài đặt Sku chuẩn hóa uppercase/trim và Money chuẩn hóa BigDecimal scale 2 ngay khi khởi tạo. |
      | Phân tích các hợp đồng bằng nhau | Giải thích vai trò của `==`, `equals`, `hashCode` và quy tắc equal implies same hash. |
      | Sử dụng collection đúng | Dự đoán số phần tử của HashSet/TreeSet với nhiều dạng nhập số tiền tương đương. |
      | Ngăn key biến đổi | Phát hiện lỗi khi object key bị sửa sau khi đưa vào HashMap, chọn immutable field hoặc object thay thế. |
      | Kiểm thử giá trị biên | Đề xuất test số âm, scale 3 không thể giữ nguyên, currency khác, SKU không hợp lệ và collection chứa array. |
  - slug: practice-006
    title: Bài tập nhận diện lỗi thiết kế
    status: WRITTEN
    difficult: ADVANCED
    focus: Bài tập nhận diện lỗi thiết kế
    problemSolved: Đâu là bug, code smell và trách nhiệm bị đặt sai?
    mechanism: Review theo bằng chứng, hậu quả và test.
    applicationValue: Có phương pháp review và phân trách nhiệm.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Bài tập nhận diện lỗi thiết kế**

      Luyện đọc Java dưới góc nhìn người review: phân biệt bug hành vi, code smell, vi phạm hợp đồng và lựa chọn thiết kế có chủ ý. Từ đoạn checkout trộn Order, payment và doanh số, bài học yêu cầu phát hiện bằng chứng cụ thể, đề xuất tách trách nhiệm, bảo vệ dòng tiền và chứng minh cải thiện bằng kiểm thử.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Phát hiện vấn đề từ bằng chứng

      1. Vì sao một chương trình chạy được với vài input chưa đủ chứng minh nó không có bug hoặc code smell?
      2. Trong đoạn checkout chứa `List<long[]>`, logic VIP, payment và tổng doanh số dùng chung, những dấu hiệu nào chỉ ra rò rỉ quy tắc, dữ liệu thiếu nghĩa và coupling?
      3. Những câu hỏi nào về owner trạng thái, dependency ẩn, long overflow và if/instanceof giúp phân biệt lỗi thực tế với lựa chọn thiết kế chấp nhận được?

      ### Tách trách nhiệm và giữ hợp đồng

      1. Vì sao Order/OrderLine, PaymentGateway, SalesLedger và CheckoutService cần vai trò riêng trong phương án refactor?
      2. Khi refactor thêm validation và kiểm tra overflow, vì sao cần ghi rõ đây là thay đổi hợp đồng thay vì khẳng định mọi hành vi trước/sau giống hệt?
      3. Những test nào chứng minh cả kết quả thanh toán và các side effect ghi ledger, đồng thời không ghi doanh số nếu thanh toán bị từ chối?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Review code có bằng chứng | Nêu tình huống cụ thể, hậu quả quan sát được và loại vấn đề thay vì chỉ nhận xét 'code xấu'. |
      | Phân chia trách nhiệm | Đề xuất Order tính tiền, CheckoutService điều phối, PaymentGateway trả kết quả và SalesLedger ghi nhận. |
      | Xác định lỗi số học/nghiệp vụ | Phát hiện thiếu validation, overflow và cập nhật doanh số sai sau giao dịch từ chối. |
      | Bảo vệ hành vi bằng test | Lập kiểm thử khách thường/VIP, chấp nhận/từ chối, lỗi dữ liệu và tương tác ledger. |
      | Phân biệt refactor và thay luật | Giải thích khi nào validation/exception mới là thay đổi quan sát được phải được công bố, kiểm thử. |
  - slug: practice-007
    title: Bài tập tái cấu trúc đoạn mã thủ tục thành mô hình đối tượng
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Bài tập tái cấu trúc đoạn mã thủ tục thành mô hình đối tượng
    problemSolved: Giữ phép tính gốc khi tách chính sách thế nào?
    mechanism: Đổi từng bước, kiểm tra equivalence và lỗi biên.
    applicationValue: Tái cấu trúc có test, giảm phụ thuộc vào magic string.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Bài tập tái cấu trúc đoạn mã thủ tục thành mô hình đối tượng**

      Chuyển hàm tính tiền thủ tục sang mô hình gồm Order, DiscountPolicy, ShippingPolicy, CheckoutService và Receipt trong khi giữ kết quả của các trường hợp đầu vào hợp lệ. Bài này luyện các bước refactor có kiểm thử hồi quy, đa hình cho chính sách VIP và ranh giới rõ giữa dữ liệu, phép giảm giá, phí giao và điều phối.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Phân rã logic thủ tục

      1. Trong một hàm dùng magic string loại khách và giao hàng, vì sao cần tách Order, DiscountPolicy, ShippingPolicy, CheckoutService và Receipt?
      2. Vì sao CheckoutService chọn chính sách qua interface/constructor injection thay vì rải chuỗi điều kiện VIP vào từng phép tính?
      3. Những quy tắc nào xác định giảm 10% cho VIP, làm tròn xuống VND và tính phí vận chuyển sau khi đã giảm giá?

      ### Đảm bảo tương đương và thay đổi

      1. Vì sao ca VIP có tạm tính 1.100.000 VND phải kiểm tra ngưỡng miễn phí dựa trên số tiền sau giảm chứ không phải trước giảm?
      2. Khi refactor thêm enum, `Math.multiplyExact` hoặc kiểm tra đầu vào, trường hợp nào là giữ nguyên kết quả cũ và trường hợp nào là thay hợp đồng lỗi?
      3. Khi bổ sung PREMIUM giảm 15%, nên thêm/chỉnh thành phần nào và những test hồi quy nào cần giữ nguyên?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Thiết kế lại trách nhiệm | Vẽ quan hệ Order, DiscountPolicy, ShippingPolicy, CheckoutService, Receipt từ đoạn code thủ tục. |
      | Giữ phép tính nhất quán | Dự đoán tạm tính, chiết khấu, mức miễn phí giao và tổng trả với dữ liệu REGULAR/VIP. |
      | Áp dụng Strategy | Thay thuật toán chiết khấu bằng implementation đăng ký ngoài CheckoutService. |
      | Tái cấu trúc an toàn | Thực hiện hoặc giải thích từng bước Extract Class, Encapsulate Field, Introduce Strategy cùng test trước/sau. |
      | Kiểm thử thay đổi | Lập ma trận ca sát ngưỡng, data invalid và overflow, phân biệt regression với thay hợp đồng. |
  - slug: practice-008
    title: 'Dự án tổng hợp: phân tích yêu cầu và tình huống sử dụng'
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: 'Dự án tổng hợp: phân tích yêu cầu và tình huống sử dụng'
    problemSolved: Ai cần gì, trong phạm vi nào, nghiệm thu ra sao?
    mechanism: Hỏi rõ giả định, luồng thất bại và tiêu chí đo.
    applicationValue: Đặt yêu cầu/test làm cơ sở thiết kế.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Dự án tổng hợp: phân tích yêu cầu và tình huống sử dụng**

      Khởi đầu dự án thư viện bằng phân tích yêu cầu và use case trước khi thiết kế class. Bài thực hành chốt phạm vi MVP, tác nhân, các quy tắc mượn/trả giả định, luồng chính/ngoại lệ, Given–When–Then và bảng truy vết FR/BR/NFR tới thiết kế và kiểm thử để không tự phát minh chính sách nghiệp vụ.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Làm rõ yêu cầu và phạm vi

      1. Những câu hỏi nào cần hỏi nhân viên thư viện để xác định 'tối đa 3 lượt mượn' là số phiếu đang mở, thay vì tự suy ra số lượt theo tháng?
      2. Phân biệt nhu cầu người dùng, FR, BR, NFR, giả định cần xác nhận và use case qua tình huống bản sách đang bị mượn?
      3. Vì sao nhân viên thư viện là tác nhân trực tiếp của MVP còn Member có thể mới là người hưởng lợi chứ chưa dùng giao diện?

      ### Use case và nghiệm thu

      1. Use case mượn sách cần actor, trigger, tiền điều kiện, luồng chính, luồng thất bại và hậu điều kiện nào?
      2. Đối với bản sách, thành viên, phiếu mượn và giới hạn 3 phiếu mở/14 ngày, cần xác định invariant nào trước khi viết code?
      3. Làm sao gắn mã yêu cầu với use case, class chịu trách nhiệm và test Given–When–Then để phát hiện thay đổi thiếu bao phủ?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân tích phạm vi MVP | Viết danh sách trong/ngoài phạm vi, vai trò tác nhân và giả định nghiệp vụ cần xác nhận. |
      | Cấu trúc yêu cầu có thể kiểm chứng | Phân loại FR/BR/NFR với ID và ví dụ tiêu chí nghiệm thu. |
      | Đặc tả use case mượn trả | Xây luồng thành công, nhánh từ chối, trạng thái trước/sau cho tác nhân thủ thư. |
      | Định nghĩa kịch bản kiểm thử | Soạn Given–When–Then cho phiếu mở, quá hạn, bản sách đã mượn và ngày trả không hợp lệ. |
      | Lập truy vết | Liên kết yêu cầu, use case, lớp/contract đề xuất với ca test để đánh giá ảnh hưởng khi chính sách đổi. |
  - slug: practice-009
    title: 'Dự án tổng hợp: thiết kế lớp và quan hệ'
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: 'Dự án tổng hợp: thiết kế lớp và quan hệ'
    problemSolved: Class nào quản lý đầu sách, bản sách, phiếu và invariant?
    mechanism: Xác định identity và chủ sở hữu invariant.
    applicationValue: Chuyển yêu cầu sang mô hình object có quan hệ rõ.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Dự án tổng hợp: thiết kế lớp và quan hệ**

      Từ yêu cầu thư viện đã xác định, thiết kế các lớp `Book`, `BookCopy`, `Member`, `Loan`, `LibraryService` và `LoanPolicy` với trách nhiệm và quan hệ phù hợp. Bài học phân biệt đầu sách ISBN với từng bản vật lý, quản lý phiếu mượn theo trạng thái và bảo vệ invariant liên đối tượng trước khi chọn mô hình cài đặt Java.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Nhận diện các thực thể và trách nhiệm

      1. Vì sao một đầu sách có ISBN không đồng nhất với một BookCopy vật lý có `copyId` và trạng thái mượn riêng?
      2. Vì sao cần tạo `Loan` ghi thành viên, bản sách, ngày mượn, dueOn, ngày trả thay vì chỉ lưu memberId trên BookCopy?
      3. Quy tắc nào thuộc nội bộ `Loan`/`BookCopy`, quy tắc nào phải được `LibraryService` kiểm tra trên nhiều đối tượng?

      ### Quan hệ và invariant

      1. Những quan hệ nào giữa Loan–Member–BookCopy là association và vì sao không nên diễn giải sai quyền sở hữu vòng đời?
      2. Làm thế nào bảo vệ giới hạn ba phiếu mở, ngăn phiếu thứ hai trên cùng BookCopy và chặn thành viên có phiếu quá hạn?
      3. Vì sao thay hạn mượn từ 14 lên 21 ngày nên chạm `LoanPolicy` thay vì rải sửa từng class, và cần test những gì khi thay?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Tách Book và BookCopy | Phác thảo class và khóa định danh cho đầu sách, bản vật lý cùng ISBN nhưng trạng thái riêng. |
      | Mô hình hóa Loan | Thiết kế trường, trạng thái và hành vi của phiếu mượn, giữ lịch sử qua nhiều lần mượn. |
      | Phân trách nhiệm | Xác định quy tắc nội tại và invariant liên đối tượng nằm ở service/policy. |
      | Đọc và vẽ quan hệ | Giải thích association, aggregation/composition trong sơ đồ theo ràng buộc domain đã đặt. |
      | Đánh giá hành vi | Đề xuất test mượn trùng bản, thành viên vượt giới hạn, quá hạn và trả hai lần. |
  - slug: practice-010
    title: 'Dự án tổng hợp: hiện thực và kiểm thử hành vi'
    status: WRITTEN
    difficult: ADVANCED
    focus: 'Dự án tổng hợp: hiện thực và kiểm thử hành vi'
    problemSolved: Mượn/trả đúng trong các trường hợp lỗi/ngày biên thế nào?
    mechanism: Quan sát trạng thái sau từng nhánh thành công/lỗi.
    applicationValue: Kiểm tra luồng nghiệp vụ có nhiều thực thể.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Dự án tổng hợp: hiện thực và kiểm thử hành vi**

      Hiện thực thiết kế thư viện bằng Java 17 và kiểm thử JUnit Jupiter cho các use case mượn/trả. Bài học nhấn mạnh mượn theo `copyId`, chính sách tối đa ba phiếu mở và 14 ngày, Clock được tiêm để kiểm thử mốc thời gian, cùng bất biến trạng thái khi giao dịch bị từ chối hoặc xử lý trên nhiều đối tượng.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Thực hiện luồng mượn và trả

      1. Vì sao thao tác mượn phải dùng `copyId` thay vì ISBN khi hai bản sách cùng đầu sách có trạng thái khác nhau?
      2. Trong `borrow`, những điều kiện Member, BookCopy, phiếu mở, quá hạn và `BorrowingPolicy` phải được kiểm tra trước khi tạo Loan?
      3. Vì sao dueOn cần được tính và chốt lúc mở phiếu, còn Loan và BookCopy không cho caller set trạng thái tùy ý?

      ### Kiểm thử và giới hạn đồng thời

      1. JUnit cần kiểm tra gì sau một lượt trả sai ngày hoặc trả hai lần để chứng minh cả Loan và BookCopy không bị thay đổi một nửa?
      2. Việc tiêm `Clock` hỗ trợ test ngày trả, quá hạn và chính sách 14 ngày chính xác ra sao?
      3. Vì sao `synchronized` trên một BorrowingService chỉ giải quyết cạnh tranh cùng một instance JVM và không thay thế transaction hoặc unique constraint khi dùng database/nhiều JVM?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Cài đặt nghiệp vụ thư viện | Tổ chức Book, BookCopy, Member, Loan và BorrowingService theo lớp/contract đã thiết kế. |
      | Bảo vệ điều kiện mượn trả | Kiểm tra hoạt động của thành viên, số phiếu mở, quá hạn, AVAILABLE và trạng thái Loan. |
      | Test ngày xác định | Sử dụng Clock/test clock để kiểm tra hạn 14 ngày, return date và hành vi quá hạn. |
      | Test lỗi không làm đổi trạng thái | Viết assertion về Loan/BookCopy sau borrow/return bị từ chối và trả lần thứ hai. |
      | Nhận diện mức atomicity | Giải thích giới hạn `synchronized` trong RAM so với transaction và ràng buộc duy nhất ở DB. |
  - slug: practice-011
    title: 'Dự án tổng hợp: thay đổi yêu cầu và đánh giá thiết kế'
    status: WRITTEN
    difficult: ADVANCED
    focus: 'Dự án tổng hợp: thay đổi yêu cầu và đánh giá thiết kế'
    problemSolved: Thay policy mới mà không phá dueOn cũ thế nào?
    mechanism: Giữ hợp đồng lịch sử và chứng minh tác động bằng test.
    applicationValue: Đánh giá OOP khi chính sách và hợp đồng thay đổi.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Dự án tổng hợp: thay đổi yêu cầu và đánh giá thiết kế**

      Tiếp tục đúng dự án thư viện bằng yêu cầu CR-01 tăng giới hạn 3 lên 5 phiếu mở, CR-02 sách tham khảo có hạn 7 ngày, cùng CR-03 giữ nguyên hạn trả đã chốt của phiếu cũ. Bài thực hành yêu cầu thay policy theo loại sách, viết ma trận nghiệm thu trước/sau và đánh giá thiết kế dựa trên bằng chứng từ code/test.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Thay chính sách nhưng giữ lịch sử

      1. Vì sao `BorrowingPolicy.termsFor(Member, BookCopy)` phải nhận loại bản sách khi sách NORMAL và REFERENCE có hạn mượn khác nhau?
      2. Khi đổi giới hạn từ 3 lên 5 và hạn sách tham khảo thành 7 ngày, những quy tắc nào chỉ áp dụng cho Loan mới?
      3. Vì sao tính lại `Loan.dueOn()` bằng policy hiện hành ở mỗi lần truy vấn sẽ làm sai lịch sử giao dịch cũ?

      ### Đánh giá thay đổi và kiểm thử

      1. Trong ma trận CH-01 đến CH-10, làm sao kiểm chứng phiếu cũ giữ hạn, sách tham khảo có hạn 7 ngày và quá hạn tiếp tục chặn mượn mới?
      2. Vì sao phải phân biệt thay contract API của policy với sửa implementation cụ thể và cập nhật caller/test liên quan?
      3. Nếu quản lý bổ sung 'sách tham khảo không gia hạn, sách thường gia hạn một lần tối đa 7 ngày', cần làm rõ những trường hợp nào và không mở `setDueOn` công khai?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân tích CR và tác động | Xác định thay đổi ở policy, loại sách, use case, dữ liệu lưu và test mà không sửa trạng thái lịch sử tùy tiện. |
      | Bảo toàn snapshot giao kèo | Giải thích và kiểm tra `dueOn` cũ không đổi khi áp RevisedPolicy cho Loan mới. |
      | Điều chỉnh thuật toán chính sách | Mô tả termsFor theo Member/BookCopy với 5 lượt mở, NORMAL 14 ngày, REFERENCE 7 ngày. |
      | Viết ma trận nghiệm thu | Đề xuất test theo ngày hiệu lực, giới hạn mới, quá hạn, phiếu cũ và các loại bản sách. |
      | Đánh giá thiết kế bằng chứng | Chấm các tiêu chí có dẫn class, test, contract cụ thể thay cho đếm số lượng class/pattern. |
      | Phân tích yêu cầu gia hạn mới | Nêu giới hạn lượt gia hạn, ngày hạn, trạng thái Loan và phép kiểm tra từ policy trước khi thiết kế API. |
