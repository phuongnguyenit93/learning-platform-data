    focus: Phản ví dụ hình chữ nhật và hình vuông
    problemSolved: Vì sao Square không thay được mutable Rectangle?
    mechanism: Từ trực giác hình học sang contract tests
    applicationValue: Nhận diện hậu điều kiện bị phá qua ví dụ thực
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phản ví dụ hình chữ nhật và hình vuông**

      Bài học dùng phản ví dụ Rectangle–Square để chứng minh một quan hệ đúng trong hình học chưa chắc phù hợp với API mutable. Qua DemoBad và DemoGood, người học thấy setter độc lập bị phá, nhận diện xung đột invariant, thử contract tests và lựa chọn interface nhỏ hoặc value object bất biến để thiết kế lại.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Phân tích sai lệch Rectangle–Square

      1. Hợp đồng setWidth() và setHeight() của Mutable Rectangle cam kết điều gì về chiều còn lại?
      2. Vì sao gọi setWidth(5) rồi setHeight(3) cho Rectangle trả diện tích 15, còn Square subclass trả 9?
      3. Tại sao Square đổi cả hai cạnh vi phạm postcondition, còn ném lỗi khi hai cạnh khác nhau lại siết precondition?

      ### Thiết kế lại và kiểm thử

      1. Vì sao chỉ dùng lời nói hình học is-a không đủ để quyết định extends cho API có setter độc lập?
      2. Shape chỉ công bố name()/area() và các record RectShape/SquareShape bất biến tránh xung đột như thế nào?
      3. Các contract tests nào phát hiện setter làm thay đổi chiều không liên quan, và vì sao chuỗi instanceof trong client chưa sửa được hợp đồng sai?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Theo dõi thực thi | Mô phỏng hai lời gọi setWidth(5), setHeight(3) và giải thích chênh lệch diện tích 15 so với 9. |
      | Chỉ ra vi phạm | Xác định postcondition của setter bị phá và precondition bị siết khi Square từ chối kích thước hợp lệ. |
      | Kiểm thử thay thế | Viết kiểm tra chiều còn lại không đổi sau từng setter và quan sát Rectangle PASS/Square FAIL. |
      | Thiết kế lại abstraction | Đề xuất Shape chỉ đọc cùng hai loại hình bất biến có phương thức thay kích thước riêng. |
      | Lựa chọn ranh giới | Giải thích khi nào có thể dùng contract Scalable chung hoặc tách RectangleResizer/SquareResizer theo khả năng. |
- slug: polymorphism
  title: Đa hình
  childs:
  - slug: polymorphism-001
    title: Đa hình và nhiều cách thực hiện cùng một thao tác
    status: WRITTEN
    difficult: BASIC
    focus: Đa hình và nhiều cách thực hiện cùng một thao tác
    problemSolved: Một lời gọi hoạt động khác nhau vì sao?
    mechanism: Hành vi đi theo runtime object
    applicationValue: Client không lặp công thức
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Đa hình và nhiều cách thực hiện cùng một thao tác**

      Nhận diện đa hình qua cùng lời gọi ShippingPolicy.quote(Parcel) nhưng các đối tượng EconomyShipping, StandardShipping và ExpressShipping thực thi công thức riêng. Bài giải thích vai trò của kiểu tham chiếu và kiểu runtime, cách CheckoutService chỉ phụ thuộc vào hợp đồng báo giá, cùng yêu cầu mọi implementation giữ quy tắc đầu vào, kết quả và lỗi.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Lời gọi chung và hành vi khác nhau

      1. Vì sao ba class giao hàng có thể cùng được lưu dưới kiểu ShippingPolicy và cùng nhận lời gọi quote(Parcel)?
      2. Kiểu khai báo của biến policy và lớp runtime của đối tượng ảnh hưởng khác nhau thế nào đến lời gọi quote?
      3. Với kiện 1.500 g nội thành, vì sao Economy, Standard và Express lần lượt báo 20.000, 25.000 và 95.000 VND?

      ### Hợp đồng và nơi chọn strategy

      1. Vì sao chỉ trùng tên quote mà không khai báo implements ShippingPolicy thì chưa đủ để Java dùng như một subtype?
      2. Điều gì sẽ xảy ra nếu implementation báo giá âm hoặc trả thời gian dự kiến không hợp lệ dù code biên dịch?
      3. Khi nào Map hoặc switch tại bước chọn gói là hợp lý, và khi nào chuỗi điều kiện lặp ở nhiều service làm mất lợi ích đa hình?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện dynamic dispatch | Truy vết ba lượt quote đến ba implementation tương ứng từ cùng biến ShippingPolicy. |
      | Kiểm chứng công thức | Tính lại phí và thời gian của ba gói với kiện 1.500 g nội thành. |
      | Thiết kế client chung | Dùng CheckoutService nhận ShippingPolicy mà không cài công thức của từng gói. |
      | Đánh giá hợp đồng | Kiểm tra kết quả quote khác null, phí không âm, ngày dự kiến dương và đầu vào hợp lệ. |
      | Mở rộng strategy | Chỉ đúng nơi đăng ký một implementation mới và các contract tests cần thêm. |
  - slug: polymorphism-002
    title: Đa hình kiểu con qua giao diện hoặc lớp cha
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Đa hình kiểu con qua giao diện hoặc lớp cha
    problemSolved: Subtype qua interface hoặc superclass là gì?
    mechanism: Một kiểu chung nhiều class
    applicationValue: Dùng subtype theo API chung
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Đa hình kiểu con qua giao diện hoặc lớp cha**

      Làm rõ đa hình kiểu con với interface implements và superclass extends. Qua NotificationSender và Report, người học thấy tham chiếu kiểu cha có thể mang nhiều object khác nhau, một final method ở superclass vẫn gọi được hook override, cùng giới hạn upcasting/downcasting và generic collection invariant.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Kiểu cha và thực thi

      1. Vì sao NotificationDispatcher dùng được EmailSender hoặc PushSender mà không chứa nhánh theo loại kênh?
      2. Report.preview() được khai báo final nhưng gọi SalesReport.content() và AuditReport.content() khác nhau như thế nào?
      3. Khi một Device reference trỏ Printer, tại sao upcasting không tạo object mới và không cho gọi trực tiếp printPage()?

      ### Ép kiểu và hợp đồng subtype

      1. Trong trường hợp nào ép Device xuống Printer tạo ClassCastException và khi nào kiểm tra instanceof là thích hợp?
      2. Vì sao danh sách chỉ chứa EmailSender không tự gán được cho List khai báo phần tử NotificationSender trong Java?
      3. Khi thêm SmsSender, những cam kết về đầu vào Notification, trạng thái DeliveryResult và lỗi phải giữ ra sao?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân tích subtype | Phân biệt quan hệ implements và extends, kiểu tĩnh/runtime trong lời gọi qua biến cha. |
      | Theo dõi override từ superclass | Giải thích vì sao Report.preview final vẫn thực thi content do subclass cung cấp. |
      | Ép kiểu an toàn | Chẩn đoán compile error và ClassCastException rồi đặt instanceof tại điểm cần chức năng subtype. |
      | Dùng collection đa hình | Duyệt List các NotificationSender và giải thích khác biệt generic invariant với wildcard extends. |
      | Giữ khả năng thay thế | Nêu những ràng buộc hành vi chung khi dùng nhiều kênh gửi thông báo. |
  - slug: polymorphism-003
    title: Phân giải phương thức tĩnh và phân giải động
    status: WRITTEN
    difficult: ADVANCED
    focus: Phân giải phương thức tĩnh và phân giải động
    problemSolved: Compiler và JVM quyết định ở bước nào?
    mechanism: Chọn signature rồi chọn implementation
    applicationValue: Debug lời gọi chính xác
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phân giải phương thức tĩnh và phân giải động**

      Phân tích một lời gọi Java theo hai giai đoạn: compiler tìm và chọn chữ ký overload từ kiểu tĩnh của receiver, đối số; sau đó JVM chọn thân override của method instance dựa trên object runtime. Dispatcher/SmartDispatcher cho phép kiểm chứng cast receiver, static hiding, field resolution, super, constructor và ý nghĩa các opcode gọi method.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Compile time và runtime

      1. Vì sao general.dispatch(sms) gọi SmartDispatcher.dispatch(Event) còn specific.dispatch(sms) gọi bản SmsEvent?
      2. Cast receiver từ SmartDispatcher về Dispatcher khiến tập overload mà compiler nhìn thấy thay đổi thế nào?
      3. Vì sao với choose(long), choose(Integer), choose(int...), đối số literal 5 chọn overload long?
      4. Overloading có tự dùng lớp runtime của đối số để tìm chữ ký cụ thể hơn sau khi chương trình chạy không?

      ### Thành viên đặc biệt và quan sát JVM

      1. Static method hiding và field lookup khác với instance method overriding ở bước quyết định nào?
      2. Lời gọi this.run() và super.run() khác nhau ra sao, đặc biệt khi method lớp cha gọi hook subclass?
      3. Tại sao không nên gọi hook overridable từ constructor superclass?
      4. invokedynamic khác ý nghĩa với dispatch OOP của invokevirtual hay invokeinterface thế nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Giải dispatch hai pha | Lập bảng chính xác chữ ký compile time và implementation runtime cho các lời gọi Dispatcher. |
      | Phân tích cast receiver | Dự đoán output specific.dispatch(sms) trước/sau ép kiểu receiver. |
      | Chẩn đoán overload | Giải thích widening, boxing, varargs và ambiguity với null. |
      | Phân biệt hiding | Dự đoán lời gọi static và field theo kiểu tĩnh mà không nhầm với override. |
      | Liên hệ bytecode | Nêu nhóm lời gọi của invokestatic, invokevirtual, invokeinterface, invokespecial và phân biệt invokedynamic. |
  - slug: polymorphism-004
    title: Ghi đè và lựa chọn phương thức khi chạy
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Ghi đè và lựa chọn phương thức khi chạy
    problemSolved: Làm sao override đúng và an toàn?
    mechanism: Giữ quy trình và mở hook
    applicationValue: Mở rộng hook và giữ invariant
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Ghi đè và lựa chọn phương thức khi chạy**

      Đi sâu vào overriding đúng chữ ký và hợp đồng. RuntimeDispatchDemo giữ kiểm tra khoảng cách và tổng phí trong DeliveryPlan.quote final, cho lớp con thay đổi distanceFee qua hook, có thể tận dụng super.distanceFee. Bài cũng giải thích covariant return, visibility, checked exception và bẫy dispatch đến subclass trong constructor lớp cha.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Override và quy trình chung

      1. Vì sao StandardPlan.quote(3) là 16.000 VND, ExpressPlan.quote(3) là 26.000 VND dù cùng gọi quote?
      2. Final quote() không override được nhưng vì sao vẫn gọi được ExpressPlan.distanceFee()?
      3. Khi nào covariant return hợp lệ và vì sao giảm access hay mở rộng checked exception không phù hợp sẽ bị từ chối?
      4. super.distanceFee() đóng vai trò gì khi ExpressPlan muốn cộng thêm 5.000 VND?

      ### Bảo vệ invariant và construction

      1. Vì sao constructor Parent có thể in null khi nó gọi describe() bị Child override?
      2. Với một subclass mới, cần bảo toàn những quy tắc nào về distanceKm, phụ phí không âm và overflow?
      3. Nếu method ở lớp con đổi tham số thành kiểu khác, vì sao nó trở thành overload thay vì override?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Viết override hợp lệ | Cài @Override đúng chữ ký, quyền truy cập, return type và checked exception. |
      | Đọc Template Method | Truy vết từ final quote sang hook distanceFee để tính phí Standard/Express. |
      | Dùng super đúng mục đích | Kết hợp thuật toán cha và phụ phí con mà không lặp validation hoặc side effect. |
      | Phát hiện bẫy constructor | Giải thích output null trước khi field subclass được khởi tạo và đề xuất tránh hook sớm. |
      | Giữ contract khi mở rộng | Chỉ ra invariant được bảo vệ tại lớp nền và điều kiện hook phải đáp ứng. |
  - slug: polymorphism-005
    title: Phân biệt ghi đè với nạp chồng
    status: WRITTEN
    difficult: ADVANCED
    focus: Phân biệt ghi đè với nạp chồng
    problemSolved: Cùng tên khi nào overload hay override?
    mechanism: Tách tham số khỏi implementation
    applicationValue: Tránh gọi nhầm chữ ký
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phân biệt ghi đè với nạp chồng**

      Phân biệt overloading cùng tên khác tham số với overriding cùng chữ ký tương thích ở supertype. DispatchDemo minh họa hai pha compiler chọn overload rồi JVM chọn override; các ca null, cast, widening/boxing/varargs và @Override giúp người học debug chính xác code nhiều phương thức cùng tên.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Chữ ký và hai giai đoạn

      1. Vì sao đổi riêng return type hoặc tên tham số không tạo overload hợp lệ?
      2. Trong DispatchDemo, tại sao formatter.format(animalReference) chạy SpecialFormatter: Animal nhưng formatter.format(dog) chạy Formatter: Dog?
      3. Cast (Animal) dog thay đổi lựa chọn overload như thế nào dù vẫn là object Dog?
      4. Vì sao ChildHandler chỉ thêm handle(String) không làm lời gọi qua BaseHandler tự dùng overload ấy?

      ### Các ca dễ nhầm

      1. show(null) chọn String thay Object trong trường hợp nào và khi nào mơ hồ giữa String với Integer?
      2. Tại sao literal 10 chọn show(long) khi đồng thời có show(Integer) và show(int...) ở ví dụ?
      3. Static, private, final method và constructor được overload hay override với ràng buộc nào?
      4. Dùng @Override và DispatchContractCheck xác nhận chữ ký thực sự được ghi đè bằng cách nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân loại method trùng tên | Viết được hai chữ ký overload và một override hợp lệ, giải thích return type không phân biệt overload. |
      | Dự đoán kết quả | Tái tạo năm dòng output DispatchDemo theo kiểu tĩnh của argument và runtime receiver. |
      | Giải cast và null | Phân tích most-specific, ambiguity và thay đổi overload khi ép kiểu. |
      | Phân biệt conversion | Giải thích pha widening, boxing, varargs trong overload resolution. |
      | Kiểm chứng override | Dùng @Override và kiểm tra ngắn để phát hiện chữ ký lạc khỏi hợp đồng. |
  - slug: polymorphism-006
    title: Phân biệt che khuất thành viên với ghi đè
    status: WRITTEN
    difficult: ADVANCED
    focus: Phân biệt che khuất thành viên với ghi đè
    problemSolved: Field/static cùng tên có override không?
    mechanism: Phân biệt hiding với overriding
    applicationValue: Tránh field/static lookup gây lỗi
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phân biệt che khuất thành viên với ghi đè**

      Chỉ rõ một class con khai báo thành viên trùng tên với cha có thể là field hiding, static hiding hoặc instance override. Demo Parent/Child cho thấy field được chọn theo kiểu tĩnh, static theo tên class còn describe theo runtime. Bài giải thích hai field cùng tên có trạng thái độc lập và vì sao nên đóng gói dữ liệu rồi expose hành vi có hợp đồng.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Trùng tên nhưng khác quy tắc

      1. Vì sao Parent parentView trỏ Child nhưng parentView.label và childView.label trả hai field khác nhau?
      2. Tại sao parentView.kind() không dùng dynamic dispatch còn parentView.describe() có?
      3. Phương thức secretLabel() ở SecureChild có override private method cùng tên trong SecureBase không và vì sao?
      4. Trong Child.inspect(), this.label, super.label, this.describe() và super.describe() lấy member từ đâu?

      ### Trạng thái và thiết kế API

      1. Khi gán CounterChild.count và CounterBase.count qua hai tham chiếu, vì sao số liệu giữ độc lập?
      2. Field final có thể bị hide trong subclass thế nào, còn final instance method chặn override ra sao?
      3. Vì sao nên dùng environment() getter được override thay vì public field environment trùng tên?
      4. Khi hai interface cùng khai báo VERSION hoặc default action(), những mơ hồ cần giải quyết là gì?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện hiding | Phân loại chính xác field hiding, static hiding, private method riêng và override. |
      | Dự đoán kết quả Demo | Giải thích được các dòng parentView.label, kind, describe, report và inspect. |
      | Theo dõi hai field độc lập | Mô phỏng cập nhật count của Parent/Child qua cast mà không nhầm là một biến. |
      | Dùng super hợp lệ | Phân biệt super.field, super.method và giới hạn truy cập private. |
      | Chỉnh thiết kế trạng thái | Đề xuất private field và phương thức overridable để biểu diễn hành vi runtime. |
  - slug: polymorphism-007
    title: Phạm vi đa hình của phương thức và thuộc tính
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Phạm vi đa hình của phương thức và thuộc tính
    problemSolved: Member nào thực sự được dynamic dispatch?
    mechanism: Định nghĩa rõ phạm vi polymorphism
    applicationValue: Ưu tiên method cho hành vi biến thiên
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phạm vi đa hình của phương thức và thuộc tính**

      Xác định các thành viên Java có hoặc không có đa hình động: instance overridable, abstract, interface/default method đối chiếu với field, static, private, final, constructor và overload. PolymorphismScopeDemo minh họa cùng VipTicket có giá trị field khác nhau khi đổi kiểu tham chiếu, trong khi display/getDisplayName override theo runtime; chính sách DiscountPolicy biến dữ liệu thành hành vi có hợp đồng.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Ranh giới member

      1. Với Ticket ticket trỏ VipTicket, vì sao ticket.display() là VIP-method nhưng ticket.label là Ticket-field?
      2. Vì sao cast sang VipTicket đổi field được nhìn thấy nhưng không đổi object runtime?
      3. Vì sao ticket.showInternalNote() và showField() vẫn dùng private method hoặc field của Ticket?
      4. Getter getDisplayName() có thể override như thế nào dù Person.name vẫn là field private của lớp cha?

      ### Thiết kế điểm mở rộng

      1. Abstract method, method interface và default method có thể dispatch vào class thực tế ra sao?
      2. Final, static, private method và constructor không cung cấp runtime polymorphism như instance overridable vì sao?
      3. super.header() khác với lời gọi header() từ Report.render() trên MonthlyReport ở điểm nào?
      4. Vì sao chuyển field Discount.percent sang DiscountPolicy.apply() giúp client nhận đúng quy tắc giảm giá?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Lập ma trận polymorphic members | Phân loại phương thức overridable và các member không được override theo runtime. |
      | Giải thích Ticket/VipTicket | Dự đoán đúng output display, label, code, category, showInternalNote, showField và bothFields. |
      | Thiết kế getter | Viết getter Employee override để mở rộng tên hiển thị trên dữ liệu private của Person. |
      | Chọn behavior thay field | Dùng DiscountPolicy.apply để tính kết quả 90.000 và 100.000 VND từ cùng giá ban đầu. |
      | Phân tích cast và super | Giải thích được cast chỉ đổi kiểu tĩnh và super không tạo đối tượng cha thứ hai. |
  - slug: polymorphism-008
    title: Duck typing và đa hình theo khả năng
    status: WRITTEN
    difficult: ADVANCED
    focus: Duck typing và đa hình theo khả năng
    problemSolved: Cần hợp đồng kiểu hay chỉ method giống tên?
    mechanism: Thiết kế từ capability
    applicationValue: Tích hợp theo năng lực qua adapter
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Duck typing và đa hình theo khả năng**

      Mở rộng tư duy đa hình từ cây kế thừa danh từ sang những khả năng độc lập mà client cần, đồng thời phân biệt Java nominal typing với duck typing động ở Python. Qua WildDuck, RobotDuck, SqueakyToy, interface Quackable/Swimmable/Rechargeable và method reference toy::quack, bài minh họa cách adapter kết nối class có cùng hành vi nhưng chưa implements interface và khi nào instanceof chỉ kiểm tra vai trò tùy chọn.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Kiểu cấu trúc và kiểu danh nghĩa

      1. Vì sao Python make_sound có thể gọi quack trên class khác họ, còn Java không tự gán SqueakyToy vào Quackable dù method cùng tên?
      2. WildDuck implements Quackable, Swimmable có tự là subtype của một AmphibiousVoice extends cả hai interface không?
      3. Quackable q = toy::quack khác phép gán trực tiếp q = toy về quan hệ kiểu và đối tượng adapter thế nào?
      4. Reflection Java khác duck typing động và structural typing được kiểm tra khi biên dịch ra sao?

      ### Thiết kế theo năng lực

      1. Vì sao runActivity gọi quack cho cả ba participant nhưng chỉ WildDuck được bơi và RobotDuck được sạc?
      2. Khi swimmingLesson luôn đòi khả năng bơi, vì sao nên nhận Swimmable thay vì Object và cast?
      3. Instanceof ở hoạt động tùy chọn khác ra sao với kiểm tra kiểu lặp chỉ để thay thế hành vi quack?
      4. Vì sao các class có cùng method signature vẫn có thể khác nhau về side effect, lỗi và hợp đồng?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Giải thích nominal typing | Chỉ ra Java yêu cầu quan hệ implements/extends hoặc adapter chứ không tự coi method cùng tên là subtype. |
      | Mô hình hóa capability | Tách Quackable, Swimmable, Rechargeable theo đúng khả năng từng đối tượng. |
      | Dùng method reference | Viết toy::quack làm Quackable mà không sửa class SqueakyToy. |
      | Chọn optional capability | Dùng instanceof tại ranh giới thích hợp và nhận interface trực tiếp khi tính năng bắt buộc. |
      | Đánh giá integration | Giải thích giới hạn reflection và lý do cần contract test cho adapter. |
  - slug: polymorphism-009
    title: Đa hình thay cho điều kiện kiểm tra từng loại
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Đa hình thay cho điều kiện kiểm tra từng loại
    problemSolved: Khi nào đổi if/instanceof thành strategy?
    mechanism: Chọn đối tượng một nơi, gọi contract mọi nơi
    applicationValue: Giảm coupling khi thêm loại mới
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Đa hình thay cho điều kiện kiểm tra từng loại**

      Áp dụng polymorphism vào bài toán refactor nhiều nhánh if/else hoặc instanceof theo tên dịch vụ vận chuyển. ShippingPolicy và QuoteService tách công thức khỏi code điều phối, factory/switch ở ranh giới chịu trách nhiệm lựa chọn implementation. Bài cũng dạy giữ kiểm thử hồi quy và contract test để thay cấu trúc mà không đổi giá, lỗi hay đơn vị.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Nhận diện cơ hội refactor

      1. Nếu cùng nhánh STANDARD/EXPRESS/ECO xuất hiện ở nhiều service, rủi ro nào phát sinh khi thêm SAME_DAY?
      2. Vì sao QuoteService chỉ dùng ShippingPolicy làm giảm phụ thuộc vào concrete classes?
      3. Với Parcel 1.500 g, 3 km, làm sao tính đúng 18.000, 41.000 và 12.500 VND của ba implementation?
      4. Vì sao mọi policy trả quote hợp lệ vẫn cần contract test dù compiler bảo đảm chữ ký?

      ### Ranh giới của đa hình

      1. Tại sao switch ở selectPolicy để đổi mã đầu vào thành implementation vẫn hợp lý?
      2. Khi nào if theo trạng thái đơn giản hoặc instanceof để xử lý dữ liệu hỗn hợp tốt hơn tạo hàng loạt subclass?
      3. Quy trình refactor từng bước phải so sánh những kết quả và trường hợp biên nào trước khi xóa các nhánh cũ?
      4. Vì sao một policy trả âm hoặc tự đổi tiền VND sang đơn vị khác có thể vi phạm LSP dù QuoteService giữ nguyên?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phát hiện điều kiện theo loại | Xác định được chuỗi nhánh lặp nhiều nơi và rủi ro bỏ sót xử lý khi thêm gói. |
      | Refactor thành strategy | Đưa công thức vào ShippingPolicy implementations; giữ QuoteService chỉ gọi quote. |
      | Đặt boundary chọn kiểu | Lựa chọn rõ factory, switch hay Map registry ở đầu vào mà không nhân bản công thức. |
      | Kiểm thử hồi quy | Xác minh ba kết quả 18.000/41.000/12.500 VND và loại SameDay 58.000 VND. |
      | Đánh giá tradeoff | Biện minh lúc điều kiện nhỏ, enum/sealed hoặc instance checking vẫn phù hợp. |
  - slug: polymorphism-010
    title: Ví dụ nhiều phương thức thanh toán
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Ví dụ nhiều phương thức thanh toán
    problemSolved: Một pay có thể có trạng thái nào?
    mechanism: Phân biệt kết quả và giới hạn an toàn
    applicationValue: Thanh toán mô phỏng dễ mở rộng/test
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Ví dụ nhiều phương thức thanh toán**

      Tổng hợp kỹ thuật đa hình vào checkout Java mô phỏng. PaymentMethod có name/pay được triển khai riêng bởi CardPayment, WalletPayment và BankTransferPayment; cùng CheckoutService gọi pay nhưng thu được PAID, DECLINED hoặc PENDING với ý nghĩa khác nhau. Người học dùng RecordingPayment kiểm tra luồng gọi, mở rộng COD và nhận diện giới hạn của demo trong xử lý tiền thật.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Runtime polymorphism trong thanh toán

      1. Vì sao CheckoutService không cần instanceof CardPayment hoặc WalletPayment mà vẫn gọi đúng implementation pay?
      2. Với WalletPayment bắt đầu 150.000 VND, vì sao sau 120.000 VND còn 30.000 và lần trả thêm 40.000 bị từ chối?
      3. Tại sao BankTransferPayment phải trả PENDING sau khi tạo hướng dẫn thay vì mặc định PAID?
      4. Thêm CashOnDeliveryPayment trả PENDING tác động đến CheckoutService và danh sách chọn phương thức ra sao?

      ### Kiểm thử và giới hạn thực tế

      1. RecordingPayment phải ghi những thông tin gì để chứng minh CheckoutService gọi đúng một lần và truyền nguyên request?
      2. Nếu implementation trả null, CheckoutService trong ví dụ phát hiện bằng cách nào?
      3. Vì sao synchronized trên WalletPayment chỉ bảo vệ instance trong một JVM thay vì nhiều máy?
      4. Trong thanh toán thật, timeout, chuyển khoản chờ xác nhận và retry gây rủi ro gì nếu không có idempotency hay lưu bền vững?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Trace đa hình checkout | Xác định đúng class runtime chạy pay và tái hiện ba kết quả thẻ, ví, chuyển khoản. |
      | Hiểu trạng thái thanh toán | Phân biệt PAID/DECLINED/PENDING, dự đoán số dư 30.000 VND và lần từ chối tiếp theo. |
      | Mở rộng method | Tạo COD implements PaymentMethod và xác minh service vẫn gọi pay mà không cần nhánh mới. |
      | Test bằng fake | Dùng RecordingPayment xác nhận số lần gọi, request và status trả về của CheckoutService. |
      | Chỉ ra giới hạn demo | Giải thích yêu cầu idempotency, persistence, trạng thái chưa chắc chắn và concurrency trong hệ thống thực. |
- slug: composition
  title: Kết hợp
  childs:
  - slug: composition-001
    title: Ghép đối tượng để xây dựng hành vi
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Ghép đối tượng để xây dựng hành vi
    problemSolved: Hành vi lớn hình thành từ các object phối hợp ra sao?
    mechanism: Phối hợp object qua interface/field.
    applicationValue: Phân chia trách nhiệm, thay formatter/transport dễ dàng.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Ghép đối tượng để xây dựng hành vi**

      Bài học giải thích cách xây dựng một chức năng hoàn chỉnh từ các đối tượng có trách nhiệm nhỏ và hợp đồng rõ. Trong ví dụ gửi thông báo đơn hàng, `OrderNotifier` điều phối `MessageFormatter` và `Transport`; thay thành phần giúp đổi cách định dạng, kênh gửi hoặc thêm lớp audit mà không sửa thuật toán điều phối. Người học còn phân biệt việc ghép đối tượng với quyền sở hữu độc quyền và kiểm chứng tương tác bằng fake thay cho dịch vụ gửi thật.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Cấu trúc và luồng phối hợp

      1. Vì sao một lớp tự định dạng, gửi và kiểm tra mọi kênh thông báo sẽ khó mở rộng và kiểm thử?
      2. Trong OrderNotifier, MessageFormatter và Transport chịu trách nhiệm nào và dữ liệu đi qua chúng theo thứ tự gì?
      3. Composition khác inheritance ở quan hệ has-a/uses-a và is-a như thế nào?
      4. Đoạn code nào là việc giữ tham chiếu thành phần, đoạn nào thật sự thực hiện delegation?

      ### Thay thế, kiểm thử và giới hạn

      1. Thay PlainFormatter bằng CompactFormatter hoặc EmailTransport bằng SmsTransport có cần sửa OrderNotifier không, vì sao?
      2. Strategy và Decorator đóng vai trò gì trong các ví dụ Formatter và AuditedTransport?
      3. Vì sao hai notifier cùng giữ một Transport không đồng nghĩa cả hai cùng sở hữu độc quyền transport?
      4. Nếu Transport ném lỗi sau khi gửi một phần, composition có tự rollback hoặc bảo đảm gửi đúng một lần không?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân tách trách nhiệm | Vẽ quan hệ giữa OrderNotifier, MessageFormatter và Transport và xác định đúng nơi validation, định dạng, gửi thông báo. |
      | Tổ hợp hành vi | Ghép formatter và transport khác nhau để giải thích đầu ra email, SMS hoặc thành phần decorator thêm audit. |
      | Kiểm thử qua ranh giới | Dùng RecordingTransport/fake để xác nhận recipient, content, số lần send và đường lỗi. |
      | Đánh giá vòng đời thành phần | Phân tích trường hợp hai notifier dùng chung transport và xác định nơi quản lý tài nguyên, concurrency. |
  - slug: composition-002
    title: Quan hệ “có một” và quan hệ “là một”
    status: WRITTEN
    difficult: BASIC
    focus: Quan hệ “có một” và quan hệ “là một”
    problemSolved: Đâu là is-a, has-a, association hay ownership mạnh?
    mechanism: Chọn quan hệ theo hợp đồng và vòng đời.
    applicationValue: Mô hình quan hệ đúng và bảo toàn subtype contract.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Quan hệ “có một” và quan hệ “là một”**

      Bài học cung cấp tiêu chí lựa chọn quan hệ kiểu con và quan hệ sử dụng thành phần trong mô hình đối tượng. Ví dụ `Car extends Vehicle` đồng thời giữ `PowerSource` cho thấy is-a có ý nghĩa phân loại, còn has-a mô tả phụ thuộc để phối hợp chức năng. Người học cần xét tính thay thế theo hợp đồng, phân biệt association, aggregation, composition sở hữu mạnh, và tránh suy ra quyền sở hữu hay tự động đóng resource chỉ vì có field tham chiếu.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Phân loại quan hệ trong mô hình

      1. Khi nào câu nói X là một Y đủ cơ sở cho extends hoặc implements, và tại sao còn cần kiểm chứng hợp đồng hành vi?
      2. Vì sao Car có thể là Vehicle nhưng lại có hoặc sử dụng PowerSource thay vì extends PowerSource?
      3. Association, aggregation và composition theo nghĩa UML khác nhau ở khía cạnh chia sẻ và vòng đời như thế nào?
      4. Interface Payable thể hiện quan hệ subtype và hợp đồng theo nghĩa nào?

      ### Bảo toàn mô hình và tài nguyên

      1. Vì sao private final field hay collection không tự chứng minh thành phần chỉ có một owner?
      2. Trong ví dụ Order và OrderLine, List.copyOf bảo vệ được phần nào và khi nào phải quan tâm đến phần tử mutable?
      3. Khi truyền cùng Engine cho nhiều owner, garbage collector có tự đóng hoặc hủy Engine ngay khi một owner biến mất không?
      4. Làm sao phát hiện thiết kế sai như Order extends Customer hay PaymentService extends DatabaseClient?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân tích quan hệ loại và thành phần | Chỉ ra các mũi tên extends/implements và has-a trong ví dụ Vehicle, Car, Bicycle, PowerSource. |
      | Kiểm chứng LSP | Đánh giá hành vi của subtype qua lời gọi dùng kiểu Vehicle hoặc Payable và chỉ ra trường hợp vi phạm hợp đồng. |
      | Phân biệt mức sở hữu | Đề xuất quan hệ association, aggregation hoặc composition cho đơn hàng, thành viên đội và service dùng chung. |
      | Bảo vệ trạng thái | Giải thích giới hạn của final/List.copyOf và cách cô lập dữ liệu mutable hoặc quản lý close đúng owner. |
  - slug: composition-003
    title: Ủy quyền công việc cho đối tượng khác
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Ủy quyền công việc cho đối tượng khác
    problemSolved: Ai giao việc, ai làm, ai chịu trách nhiệm kết quả?
    mechanism: Nhìn theo luồng lời gọi và responsibility.
    applicationValue: API cộng tác có đường lỗi và luồng rõ.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Ủy quyền công việc cho đối tượng khác**

      Bài học tập trung vào chính luồng ủy quyền công việc thay vì chỉ nhìn sơ đồ có field tham chiếu. `TicketRouter` nhận yêu cầu, kiểm tra dữ liệu, nhờ `TicketClassifier` chọn hàng chờ và `AssignmentPort` ghi nhận phân công; router vẫn chịu trách nhiệm trình tự và kết quả trả về. Người học biết đánh giá hợp đồng delegate, tránh tầng forwarding vô nghĩa, phân biệt Strategy/Adapter/Decorator/Proxy/Facade và kiểm thử cả đường thành công lẫn thất bại.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Vai trò và trách nhiệm khi ủy quyền

      1. Trong luồng TicketRouter.route, ai là delegator, ai phân loại và ai ghi nhận Assignment?
      2. Vì sao field classifier và assignments là cấu trúc has-a, còn lệnh classify/assign mới thể hiện delegation?
      3. Router phải tiếp tục giữ trách nhiệm nào khi phần chuyên môn được giao cho collaborator?
      4. Delegation và forwarding thuần túy khác nhau ở giá trị mà lớp trung gian cung cấp như thế nào?

      ### Hợp đồng, thay thế và lỗi

      1. Vì sao classifier trả null hoặc port báo lỗi không được biến thành kết quả phân công thành công giả?
      2. Đổi SeverityClassifier sang BillingKeywordClassifier kiểm chứng điều gì về hợp đồng và sự ghép nối?
      3. Strategy, Adapter, Decorator và Proxy có thể sử dụng delegation với các mục đích khác nhau ra sao?
      4. Khi hai router chia sẻ MemoryAssignmentPort dùng ArrayList, việc ghi đồng thời và vòng đời có những rủi ro nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Truy vết quy trình giao việc | Mô tả đúng trình tự validate → classify → assign → trả Assignment từ sequence diagram hoặc code TicketRouter. |
      | Xác định contract delegate | Liệt kê đầu vào/đầu ra hợp lệ, hành vi null, failure và phạm vi bền vững cần yêu cầu ở AssignmentPort. |
      | Kiểm thử tương tác | Dùng RecordingAssignments để xác nhận router gọi đúng delegate, đúng thứ tự và không gọi assign khi classifier lỗi. |
      | Đánh giá thiết kế lớp trung gian | So sánh TicketRouter với BareRouter và nêu khi nào lớp chuyển tiếp thêm giá trị thực. |
  - slug: composition-004
    title: Tái sử dụng bằng kết hợp và bằng kế thừa
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Tái sử dụng bằng kết hợp và bằng kế thừa
    problemSolved: Nên tái sử dụng bằng extends hay ghép các vai trò?
    mechanism: Đánh giá các chiều thay đổi trước khi chọn reuse.
    applicationValue: Giảm phình cây lớp khi nhiều biến thể độc lập.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Tái sử dụng bằng kết hợp và bằng kế thừa**

      Bài học đặt hai chiến lược tái sử dụng lên cùng tình huống tạo và phân phối báo cáo. `AbstractReport` cung cấp khung render và hook buildBody cho subtype có quan hệ is-a thật; `ReportPublisher` ghép `Formatter` và `Destination` khi cách định dạng và nơi xuất thay đổi độc lập. Người học học cách tránh cây lớp phình to, áp dụng LSP, dùng Strategy/Decorator hợp lý và kiểm thử với fake, đồng thời xem xét trạng thái dùng chung, ngoại lệ và concurrency.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### So sánh hai cơ chế tái sử dụng

      1. Trong phương án AbstractReport/SalesReport, phần nào được kế thừa và hook nào được override?
      2. Trong phương án ReportPublisher, Formatter và Destination thay đổi độc lập tạo được những tổ hợp nào?
      3. Vì sao kế thừa phù hợp với is-a và hợp đồng ổn định nhưng dễ tạo coupling khi nhiều chiều biến thể giao nhau?
      4. Phát biểu composition over inheritance có phải lệnh cấm extends trong mọi trường hợp không?

      ### Mở rộng và kiểm chứng

      1. Quan hệ Bird/Penguin vi phạm hợp đồng fly như thế nào và được liên hệ với LSP ra sao?
      2. Strategy chọn thuật toán và Decorator bọc thêm hành vi trong hệ báo cáo khác nhau thế nào?
      3. Vì sao ReportPublisher chứa final Formatter/Destination không mặc nhiên bảo đảm các collaborator được chia sẻ an toàn giữa các luồng?
      4. Nếu Formatter ném ngoại lệ hoặc Destination chỉ ghi một phần rồi lỗi, phía Publisher tự bảo đảm điều gì và không bảo đảm điều gì?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Chọn cách tái sử dụng | So sánh thiết kế AbstractReport và ReportPublisher theo is-a, chiều biến thể, chi phí đổi mã và khả năng thay thế. |
      | Phát hiện hierarchy sai | Chỉ ra nguyên nhân một cây các lớp định dạng × kênh xuất dễ phình to và đề xuất Formatter/Destination riêng. |
      | Thiết kế Strategy/Decorator | Ghép MarkdownFormatter với MemoryArchive hoặc LoggingDestination mà không thay ReportPublisher. |
      | Kiểm chứng ranh giới | Viết hoặc phân tích fake Formatter/Destination xác nhận thứ tự format → deliver và tác động khi một bước thất bại. |
  - slug: composition-005
    title: Thay đổi đối tượng cộng tác khi chạy
    status: WRITTEN
    difficult: ADVANCED
    focus: Thay đổi đối tượng cộng tác khi chạy
    problemSolved: Thay collaborator lúc chạy mà giữ nhất quán thế nào?
    mechanism: Phân biệt snapshot mỗi call với mutable global state.
    applicationValue: Chuyển policy và kiểm soát concurrent requests.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Thay đổi đối tượng cộng tác khi chạy**

      Bài học đi sâu vào trường hợp collaborator được thay khi chương trình vẫn chạy. `CheckoutService` dùng hợp đồng `DiscountPolicy` để đổi giữa không giảm giá, VIP và khuyến mãi mà không tạo lại service; lựa chọn này khác với sửa trạng thái chính policy. Người học phân biệt chọn một lần ở constructor, thay bằng phương thức, hoặc truyền policy theo từng yêu cầu; đồng thời phải giữ contract, kết quả nhất quán trong mỗi lần checkout và tính an toàn khi nhiều thread dùng chung service.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Đổi tham chiếu và chọn phạm vi

      1. Vì sao field có kiểu DiscountPolicy cho phép chọn NoDiscount và PercentageDiscount trong cùng CheckoutService?
      2. Thay một collaborator bằng object mới khác gì sửa thuộc tính của cùng collaborator đang được chia sẻ?
      3. Ba cách constructor cố định, setter thay runtime và truyền policy per-request phù hợp với ngữ cảnh nào?
      4. Vì sao một singleton dùng setter chung cho policy riêng từng khách hàng có thể trả mức giảm của khách khác?

      ### Tính đúng đắn của hot swap

      1. Chụp DiscountPolicy vào biến local ở đầu checkout giúp giữ tính nhất quán giữa discount() và code() như thế nào?
      2. AtomicReference.get/set giải quyết những vấn đề visibility và thay tham chiếu nào, nhưng không thay thế điều phối nghiệp vụ nào?
      3. Vì sao không thể đóng ngay Gateway cũ chỉ sau khi hoán đổi nếu request trước vẫn dùng nó?
      4. Những điều kiện giá trị giảm, đơn vị VND và phạm vi lỗi nào mọi implementation mới phải đáp ứng?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Hoán đổi policy | Dự đoán số tiền và mã chính sách trên Receipt trước/sau các lần gọi setDiscountPolicy. |
      | Chọn phạm vi collaborator | Phân tích trường hợp cấu hình toàn cục, phiên người dùng và per-request để đề xuất constructor, setter hoặc tham số. |
      | Giữ snapshot nhất quán | Giải thích cách chụp một DiscountPolicy cho mỗi checkout và vai trò AtomicReference khi cập nhật đồng thời. |
      | Kiểm tra contract và lifecycle | Xác định policy lỗi trả giảm âm/vượt subtotal và rủi ro đóng một collaborator còn in-flight. |
  - slug: composition-006
    title: Tiêm phụ thuộc qua hàm khởi tạo hoặc phương thức
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Tiêm phụ thuộc qua hàm khởi tạo hoặc phương thức
    problemSolved: Cấp collaborator từ ngoài ở phạm vi nào?
    mechanism: Xác định dependency bắt buộc hay theo từng tác vụ.
    applicationValue: Giảm coupling, test không cần gửi thông báo thật.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Tiêm phụ thuộc qua hàm khởi tạo hoặc phương thức**

      Bài học chỉ rõ dependency injection trong Java thuần: cung cấp collaborator từ ngoài thay vì hard-code `new` trong lớp nghiệp vụ. `OrderNotifier` nhận `NotificationSender` bắt buộc qua constructor; `AlertService` nhận sender qua phương thức để thay theo mỗi lần gọi. Người học so sánh constructor, method parameter và setter injection; phân biệt DI, DIP, IoC, sử dụng interface phù hợp và tránh null, phụ thuộc bị tạo lén hoặc đóng tài nguyên không thuộc sở hữu.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Các phương thức cấp dependency

      1. Vì sao OrderNotifier tự new EmailSender khiến việc đổi implementation và viết fake khó khăn?
      2. Khi nào NotificationSender nên được truyền vào constructor và giữ final trong suốt vòng đời service?
      3. Khi nào tham số phương thức là nơi phù hợp để cấp dependency riêng của một yêu cầu?
      4. Setter injection khác method parameter injection ở khả năng lưu trạng thái và thời điểm kiểm tra tính sẵn sàng như thế nào?

      ### Thiết kế abstraction và giới hạn

      1. Dependency Injection khác Dependency Inversion Principle và Inversion of Control như thế nào?
      2. Tại sao truyền interface NotificationSender có thể giảm phụ thuộc implementation nhưng không phải lớp nào cũng bắt buộc có interface?
      3. Vì sao cung cấp sender qua constructor rồi tự new sender khác trong notifyPaid làm sai ý định DI?
      4. Constructor injection có tự bảo đảm thread safety hoặc chuyển quyền sở hữu tài nguyên cho service không?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Viết constructor injection | Phân tích hoặc tạo OrderNotifier nhận sender bắt buộc, Objects.requireNonNull và dùng đúng dependency được cấp. |
      | Chọn method injection | Thiết kế AlertService gửi email/SMS theo từng lời gọi bằng tham số sender. |
      | Thay fake trong kiểm thử | Dùng RecordingSender xác nhận nội dung, recipient và số lượt gọi mà không gửi thông báo thật. |
      | Phân biệt các nguyên tắc | Giải thích DI, DIP, IoC qua mối quan hệ notifier, abstraction và composition root. |
  - slug: composition-007
    title: Quyền sở hữu và vòng đời đối tượng được chứa
    status: WRITTEN
    difficult: ADVANCED
    focus: Quyền sở hữu và vòng đời đối tượng được chứa
    problemSolved: Ai quản lý state và đóng tài nguyên được chứa?
    mechanism: Đặt owner và quyền truy cập trước khi code.
    applicationValue: Giữ invariant và tránh leak file/connection.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Quyền sở hữu và vòng đời đối tượng được chứa**

      Bài học làm rõ ba ý thường bị nhập nhằng: quyền sở hữu trong mô hình nghiệp vụ, đường truy cập bằng reference Java và trách nhiệm đóng tài nguyên hệ thống. `Order` quản lý `Line` qua API thêm dòng và danh sách chỉ đọc để bảo vệ invariant; ví dụ `CsvExporter` tự mở `BufferedWriter` cho thấy owner phải đóng resource bằng AutoCloseable/try-with-resources. Người học hiểu vì sao GC không thay thế cleanup, còn `private final` hay List.copyOf có thể chưa đủ khi phần tử vẫn mutable.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Sở hữu và bảo vệ dữ liệu

      1. Quyền sở hữu một thành phần trong mô hình Order/Line khác gì với việc nhiều biến giữ tham chiếu tới một instance?
      2. Vì sao Order phải cho thêm dòng qua addLine thay vì trả trực tiếp List mutable nội bộ?
      3. List.copyOf bảo vệ được danh sách nhưng còn rủi ro gì nếu các phần tử Line hoặc đối tượng caller truyền vào vẫn mutable?
      4. Khi nào một thành phần nên được chia sẻ, khi nào nên được tạo/kiểm soát bởi owner?

      ### Vòng đời nghiệp vụ và tài nguyên

      1. Đối tượng rời khỏi Order có bị JVM thu hồi bộ nhớ ngay lập tức không, vì sao?
      2. Trong ví dụ CsvExporter tự mở BufferedWriter, ai phải gọi close và vì sao nên dùng try-with-resources?
      3. Nếu writer được caller tiêm vào service như tài nguyên dùng chung, service có được tự đóng nó không?
      4. Vì sao final field và garbage collector không thay thế chiến lược quản lý alias và cleanup?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Thiết kế ownership | Lập quy tắc ai tạo, sửa, chia sẻ, loại bỏ và đóng thành phần Order/Line hoặc collaborator. |
      | Giữ invariant của tổng thể | Phân tích bug getter lộ mutable List và sửa bằng immutable value object, copy hoặc API giới hạn. |
      | Phân biệt vòng đời | Mô tả khác nhau giữa xóa quan hệ thành phần trong domain và điều kiện GC của object trên heap. |
      | Dọn resource đúng trách nhiệm | Thiết kế owner AutoCloseable dùng try-with-resources và so sánh resource owned với borrowed. |
