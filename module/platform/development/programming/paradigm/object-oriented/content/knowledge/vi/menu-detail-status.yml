    status: WRITTEN
    difficult: BASIC
    focus: Danh tính, trạng thái và hành vi của đối tượng
    problemSolved: Đối tượng nào tồn tại và nó có thể thay đổi thế nào?
    mechanism: Nhìn object như một instance có vòng đời.
    applicationValue: Mô hình identity, trạng thái và hành vi có điều kiện.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Danh tính, trạng thái và hành vi của đối tượng**

      Bài xác định object Java qua danh tính, trạng thái quan sát được và hành vi có hợp đồng. Ví dụ hai Order được tạo riêng, alias cùng instance và các chuyển DRAFT → CONFIRMED → CANCELLED giúp phân biệt identity Java với ID nghiệp vụ, đồng thời giải thích vì sao object phải bảo vệ invariant qua phương thức.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Nhận diện object

      1. Danh tính, trạng thái và hành vi trả lời ba câu hỏi khác nhau nào về một Order?
      2. Vì sao hai lần new Order tạo hai instance dù customer và state giống nhau?
      3. Cùng orderId trong database có chứng minh hai tham chiếu Java là cùng một instance không?

      ### Hành vi và ranh giới

      1. Vì sao alias.addItem làm first thay đổi mà second vẫn giữ dữ liệu cũ?
      2. Khi nào confirm, cancel bị từ chối và invariant của Order được giữ ra sao?
      3. Private field, final class và List.copyOf bảo vệ những khía cạnh nào khác nhau?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện instance | Vẽ sơ đồ first, second, alias và dự đoán phép ==. |
      | Truy vết trạng thái | Mô tả cùng một Order đổi trạng thái qua addItem, confirm, cancel. |
      | Phân định identity | Giải thích sự khác nhau giữa identity JVM và mã đơn hàng. |
      | Phân tích hợp đồng | Chỉ ra precondition và postcondition của confirm/cancel. |
      | Bảo vệ state | Đánh giá getter danh sách và lý do dùng snapshot với String bất biến. |
  - slug: object-002
    title: Tham chiếu, giá trị và cách truyền đối tượng
    status: WRITTEN
    difficult: BASIC
    focus: Tham chiếu, giá trị và cách truyền đối tượng
    problemSolved: Java sao chép gì khi gán hoặc truyền object?
    mechanism: Tách giá trị biến khỏi đối tượng được tham chiếu.
    applicationValue: Dự đoán chính xác mutation và reassignment.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Tham chiếu, giá trị và cách truyền đối tượng**

      Bài phân biệt biến primitive chứa giá trị trực tiếp với biến tham chiếu chứa giá trị tham chiếu tới object. Qua Student, Wallet, Account và Box, người học thấy Java luôn truyền tham số theo giá trị; phương thức có thể sửa đối tượng chung nhưng gán lại tham số cục bộ không thay biến của caller.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Phép gán và tham chiếu

      1. Gán b = a cho int và cho Student thực chất sao chép những giá trị gì?
      2. Vì sao b.deposit ảnh hưởng object của a nhưng b = new Wallet không thay a?
      3. Final có ngăn StringBuilder.append thay đổi nội dung object không?

      ### Tham số Java

      1. Vì sao gọi depositTo làm Account thay đổi mà Java vẫn pass-by-value?
      2. Tại sao replaceLocally và swap không thể hoán đổi biến tham chiếu của caller?
      3. Vì sao clone mảng hai chiều còn chia sẻ những hàng int[] bên trong?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Dự đoán phép gán | Phân biệt kết quả với int và Student khi sửa biến hoặc field. |
      | Giải thích pass-by-value | Vẽ hai biến caller/parameter nhận cùng giá trị tham chiếu. |
      | Phân tích phương thức | Theo dấu depositTo, replaceLocally, swap và Box.modify. |
      | Thiết kế an toàn | Trả instance mới hoặc clone mảng khi cần tránh sửa dữ liệu của caller. |
      | Nhận diện sao chép nông | Chỉ ra các mảng con còn dùng chung sau matrix.clone. |
  - slug: object-003
    title: Nhiều tham chiếu cùng trỏ đến một đối tượng
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Nhiều tham chiếu cùng trỏ đến một đối tượng
    problemSolved: Ai đang giữ cùng một tham chiếu object?
    mechanism: Vẽ đồ thị tham chiếu tới từng đối tượng.
    applicationValue: Nhận diện các mutation lan qua alias.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Nhiều tham chiếu cùng trỏ đến một đối tượng**

      Bài làm rõ aliasing khi nhiều biến, field, collection hoặc tham số cùng trỏ một instance. Qua Student, Employee/Address, Box và List, người học lần theo tác động của setter, gán lại biến, sao chép container và giới hạn của chia sẻ mutable object giữa nhiều luồng.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Những đường alias

      1. Vì sao second = first không tạo thêm Student và setter qua second đổi kết quả của first?
      2. Sau b = new Student hoặc b = null thì a còn tham chiếu object ban đầu không?
      3. Vì sao incrementBoth(box, box) tăng cùng một Box hai lần?

      ### Aliasing qua object khác

      1. Hai Employee được new riêng vẫn có thể dùng chung Address như thế nào?
      2. new ArrayList<>(original) làm list độc lập nhưng còn chia sẻ Student phần tử ra sao?
      3. Aliasing tự nó khác race condition giữa nhiều thread ở điểm nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Vẽ graph tham chiếu | Đếm instance và các biến trỏ tới chúng sau từng lệnh. |
      | Truy vết alias | Dự đoán field của Student và Address khi sửa qua đường khác. |
      | Phân biệt gán lại | Giải thích b = null, b = new Student và group.set(0,s). |
      | Nhận diện share sâu | Kiểm tra reference của container và element sau shallow copy. |
      | Đề xuất ownership | Dùng DTO bất biến/snapshot khi cần giới hạn quyền thay đổi. |
  - slug: object-004
    title: Phân biệt cùng đối tượng với bằng nhau về giá trị
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Phân biệt cùng đối tượng với bằng nhau về giá trị
    problemSolved: Cùng đối tượng hay bằng nhau theo hợp đồng?
    mechanism: Định nghĩa ý nghĩa equality của entity/value object.
    applicationValue: Chọn phép so sánh và hash thích hợp.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phân biệt cùng đối tượng với bằng nhau về giá trị**

      Bài phân biệt == so sánh identity của reference với equals theo hợp đồng lớp. Qua Point, Book, String, array, BigDecimal và record, người học xây dựng equals/hashCode nhất quán, so sánh entity với value object và nhận biết nguy cơ khi thay field của key mutable trong HashMap.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Identity và equality

      1. Vì sao hai Book cùng ISBN vẫn equals false nếu chỉ kế thừa Object.equals?
      2. String mới, String literal và record Point cho kết quả ==, equals khác nhau thế nào?
      3. Khi so sánh mảng nhiều chiều hoặc BigDecimal khác scale, nên dùng API nào?

      ### Hợp đồng hash

      1. Các tính chất phản xạ, đối xứng, bắc cầu, nhất quán của equals yêu cầu gì?
      2. Vì sao equals true bắt buộc hashCode bằng nhau nhưng hashCode bằng nhau không đủ chứng minh equals?
      3. Thay field tham gia hash sau khi đưa MutableKey vào map có thể khiến lookup lỗi vì sao?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Dự đoán equality | Giải thích ==/equals của Book, Point, String và record. |
      | Triển khai equals | Viết đúng equals(Object) với @Override và kiểm tra null/kiểu. |
      | Triển khai hashCode | Dùng đúng field equality và thử hành vi HashSet/HashMap. |
      | Chọn so sánh chuyên biệt | Áp dụng Objects.equals, Arrays.deepEquals và BigDecimal.compareTo phù hợp. |
      | Giữ key ổn định | Chỉ ra và sửa lỗi MutableKey đổi hash khi đang nằm trong HashMap. |
  - slug: object-005
    title: Đối tượng có thể thay đổi và đối tượng bất biến
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Đối tượng có thể thay đổi và đối tượng bất biến
    problemSolved: State của instance có thể thay đổi sau khởi tạo không?
    mechanism: Xét toàn bộ đường làm thay đổi object graph.
    applicationValue: Thiết kế mutable có kiểm soát hoặc immutable an toàn.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Đối tượng có thể thay đổi và đối tượng bất biến**

      Bài đối chiếu mutable StringBuilder/ArrayList với immutable String/LocalDate, sau đó thực hành MutableCart và ImmutableCart. Người học thấy thay biến reference không làm thay immutable object; final hay record không tự đảm bảo deep immutability và snapshot phải bảo vệ cả phần tử mutable.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Mutable và immutable

      1. String.concat và StringBuilder.append thay đổi instance nào?
      2. Vì sao final List, final class và record không tự bảo đảm bất biến sâu?
      3. MutableCart.addProduct và ImmutableCart.withAddedProduct khác nhau ở instance và số item như thế nào?

      ### Thiết kế chia sẻ

      1. List.copyOf làm cấu trúc list ổn định nhưng MutableTask phần tử có còn đổi được không?
      2. Collections.unmodifiableList và List.copyOf phản ánh cập nhật nguồn theo cách nào?
      3. Khi dùng immutable config giữa nhiều luồng vì sao cần safe publication?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân loại object | So sánh String với StringBuilder theo thay đổi tại chỗ. |
      | Truy vết Cart | Giải thích empty, one, two của ImmutableCart và alias MutableCart. |
      | Bảo vệ phần tử | Xác định khi nào cần copy list và dùng phần tử immutable. |
      | Phân biệt modifier | Giải thích giới hạn của final và record. |
      | Chọn chiến lược | Đánh đổi mutable có kiểm soát với immutable trả bản mới. |
  - slug: object-006
    title: Sao chép nông và sao chép sâu
    status: WRITTEN
    difficult: ADVANCED
    focus: Sao chép nông và sao chép sâu
    problemSolved: Bản sao còn chia sẻ đối tượng con nào?
    mechanism: Sao chép đúng phần mutable của đồ thị.
    applicationValue: Áp dụng shallow/deep copy theo ownership.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Sao chép nông và sao chép sâu**

      Bài phân biệt gán alias với shallow copy chỉ tạo outer object và deep copy các thành phần cần độc lập. Qua Customer/Address, List<Item>, mảng nhiều chiều và Node graph chứa vòng, người học chọn copy constructor, clone hoặc IdentityHashMap để tránh lỗi chia sẻ mutable state và bảo toàn shared references.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Mức sao chép

      1. Gán alias, shallowCopy(Customer) và deepCopy(Customer) tạo số object thế nào?
      2. Object.clone, int[].clone và Product[].clone giữ phần tử/tham chiếu khác nhau thế nào?
      3. Vì sao sao chép List<Item> rồi sửa Item có thể làm list nguồn quan sát thay đổi?

      ### Đồ thị và ownership

      1. Vì sao int[][].clone vẫn chia sẻ mảng hàng con?
      2. Khi có vòng A → B → A, tại sao cần seen bằng IdentityHashMap và ghi bản sao trước khi đệ quy?
      3. Vì sao deep copy toàn bộ entity, socket hay ORM object có thể sai ngữ nghĩa?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân biệt mức copy | Dùng == và mutation chứng minh alias, shallow và deep Customer. |
      | Sao chép collection | Tạo list mới rồi copy từng Item mutable khi cần. |
      | Sao chép mảng lồng | Clone từng hàng int[] và dự đoán output khi sửa. |
      | Bảo toàn graph | Giải thích visited mapping giữ đúng chu trình và shared reference. |
      | Thiết kế defensive copy | Bảo vệ ScoreReport bằng clone khi nhận và trả mảng. |
  - slug: object-007
    title: Chia sẻ đối tượng và tác động của thay đổi trạng thái
    status: WRITTEN
    difficult: ADVANCED
    focus: Chia sẻ đối tượng và tác động của thay đổi trạng thái
    problemSolved: Thay đổi ở object chung xuất hiện ở đâu, khi nào?
    mechanism: Lần theo đối tượng và thời điểm đọc lại.
    applicationValue: Phân biệt live state, snapshot và owner cập nhật.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Chia sẻ đối tượng và tác động của thay đổi trạng thái**

      Bài theo dõi TemperaturePolicy được MobileControl và WallDisplay cùng tham chiếu, làm rõ state đang sống so với snapshot đã chụp. Người học giải thích vì sao việc gán controller mới không thay reference của wall, UI cần render/event mới và các cập nhật đồng thời có thể đòi AtomicInteger hoặc immutable range công bố qua volatile.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Theo dõi tác động

      1. Vì sao MobileControl.changeTarget(24) làm WallDisplay thấy 24 ở lần render tiếp theo?
      2. Vì sao oldRenderedText và oldHistory không tự đổi theo policy?
      3. Sau khi mobile nhận replacement mới vì sao wall còn target 24 nhưng replacement trở thành 19?

      ### Thiết kế hợp đồng chia sẻ

      1. Live object, snapshot và independent copy khác nhau về quyền quan sát/cập nhật thế nào?
      2. Thay object trong registry hoặc sửa policy có tự trigger mọi UI render không?
      3. Vì sao volatile count chưa làm count++ nguyên tử, khi nào cần AtomicInteger?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Vẽ quan hệ tham chiếu | Xác định Policy #1 và #2 được các controller/view giữ. |
      | Theo dõi state | Lập bảng trước/sau changeTarget và render của WallDisplay. |
      | Phân biệt snapshot | Giải thích dữ liệu cũ của String và List.copyOf(history). |
      | Thiết kế API chia sẻ | Đề xuất owner mutation cùng query, snapshot và thông báo refresh. |
      | Đánh giá concurrency | Chọn nguyên tử cho Counter hoặc thay volatile immutable TemperatureRange. |
  - slug: object-008
    title: Giá trị rỗng và đối tượng chưa tồn tại
    status: WRITTEN
    difficult: BASIC
    focus: Giá trị rỗng và đối tượng chưa tồn tại
    problemSolved: Không có reference, object rỗng hay lỗi tìm dữ liệu?
    mechanism: Chọn kiểu biểu diễn đúng lý do vắng mặt.
    applicationValue: Tránh NPE và thiết kế absence rõ ràng.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Giá trị rỗng và đối tượng chưa tồn tại**

      Bài làm rõ biến local chưa được gán, tham chiếu null, object thực có chuỗi hoặc collection rỗng và entity không tìm thấy. Với CustomerRepository/Optional, người học lựa chọn kiểm tra đầu vào bắt buộc, API tra cứu tùy chọn, collection rỗng và xử lý lỗi nguồn dữ liệu mà không vô tình nhầm các trạng thái vắng mặt.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Null và object hiện hữu

      1. Customer c; khác Customer c = null như thế nào ở lúc biên dịch và lúc chạy?
      2. null, chuỗi rỗng, chuỗi blank và List.of() biểu diễn những trạng thái khác nhau nào?
      3. Nếu first = null nhưng alias còn giữ Box, object đã biến mất hoặc bị GC chưa?

      ### Thiết kế API vắng mặt

      1. findById trả Optional.empty khi không thấy ID khác lỗi database ở ý nghĩa nào?
      2. Objects.requireNonNull, Objects.equals, Optional và collection rỗng thích hợp những tình huống nào?
      3. Vì sao unboxing Integer null, dereference null và Optional.empty().get có các kiểu lỗi khác nhau?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân biệt absence | Tách biến local chưa gán, tham chiếu null và object có field null. |
      | Dự đoán lỗi | Chỉ ra compile error, NullPointerException và NoSuchElementException. |
      | Viết kiểm tra an toàn | Áp dụng short-circuit, Objects.equals và requireNonNull. |
      | Thiết kế API tìm kiếm | Trả Optional.empty cho not found, collection rỗng cho 0 phần tử và báo lỗi DB riêng. |
      | Giải thích lifetime | Lý giải gán biến null không xóa những object còn reachable. |
  - slug: object-009
    title: Theo dõi tương tác của các đối tượng trong một tình huống
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Theo dõi tương tác của các đối tượng trong một tình huống
    problemSolved: Ai gọi ai và trạng thái đổi như thế nào trong checkout?
    mechanism: Kết hợp call graph, log, state và ngoại lệ.
    applicationValue: Truy vết Cart, Inventory, PaymentGateway, Order và Notifier.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Theo dõi tương tác của các đối tượng trong một tình huống**

      Bài tổng hợp qua checkout giữa Cart, Inventory, PaymentGateway, OrderService, Order và Notifier. Người học dùng bảng trạng thái, call stack, log và UML sequence diagram để giải thích đối tượng nào nhận lời gọi, truyền tham chiếu nào, thay đổi tồn kho ở đâu, xử lý PaymentDeclinedException và giới hạn của bù trừ trong mô hình đơn luồng.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Luồng thành công

      1. Main gọi checkout trên instance nào và Cart.total có tự sửa Inventory không?
      2. Reserve, pay, tạo Order, notifier.send và return order diễn ra theo thứ tự nào?
      3. Vì sao inventory trong main thấy stock còn 3 dù OrderService gọi reserve?

      ### Nhánh lỗi và quan sát

      1. Khi PaymentGateway(false) vì sao release trả kho từ 3 lên 5, không tạo Order hoặc gửi thông báo?
      2. Sequence diagram, call stack và bảng state cung cấp thông tin bổ sung nào cho log?
      3. Khi payment timeout hoặc có checkout đồng thời, vì sao bản bù trừ trong bộ nhớ chưa đủ?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Xác định trách nhiệm | Liệt kê sáu đối tượng, trạng thái và phương thức trong luồng checkout. |
      | Truy vết lời gọi | Lập bảng caller/callee, tham số, kết quả và delta tồn kho. |
      | Vẽ sequence diagram | Diễn tả nhánh thành công và exception dẫn đến release. |
      | Tính trạng thái cuối | Giải thích tồn cuối 3 ở thành công và 5 ở thanh toán bị từ chối. |
      | Debug có bằng chứng | Đặt breakpoint và so call stack với trace; nêu giới hạn transaction/idempotency. |
- slug: lifecycle
  title: Vòng đời
  childs:
  - slug: lifecycle-001
    title: Tạo đối tượng và cấp phát tài nguyên
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Tạo đối tượng và cấp phát tài nguyên
    problemSolved: '`new` tạo instance khác gì gán tham chiếu, còn file/socket phải đóng thế nào?'
    mechanism: 'Phân tích hai vòng đời: bộ nhớ và tài nguyên.'
    applicationValue: Hiểu ranh giới instance và resource khi bắt đầu vòng đời.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Tạo đối tượng và cấp phát tài nguyên**

      Nhận ra đối tượng Java, biến tham chiếu và tài nguyên bên ngoài JVM có cách hình thành, sử dụng và kết thúc khác nhau. Bài học giúp dự đoán hệ quả của `new`, gán alias, mở file và chuyển giao quyền sở hữu tài nguyên trước khi xây dựng các lớp có vòng đời an toàn.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Tạo đối tượng và trạng thái ban đầu

      1. Với các biến `first`, `alias` và `second`, làm thế nào xác định có bao nhiêu đối tượng được tạo và phép gán nào chỉ sao chép tham chiếu?
      2. Khi thực thi `new`, các trường instance nhận giá trị mặc định và được khởi tạo bằng initializer, constructor ra sao; vì sao không thể suy vị trí vật lý tuyệt đối từ mô hình heap/stack?

      ### Vòng đời tài nguyên và cách phòng lỗi

      1. Vì sao `reader = null` hoặc gọi `System.gc()` không đủ để đóng file dù đối tượng có thể trở thành ứng viên GC?
      2. Khi `try-with-resources` gặp lỗi trong thân `try` và trong `close()`, ngoại lệ chính, suppressed exception và thứ tự đóng được xác định như thế nào?
      3. Nếu constructor mở tài nguyên rồi ném exception hoặc một registry `static` giữ listener, cần xử lý ownership và tham chiếu ra sao?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân tích tham chiếu và instance | Dự đoán kết quả `==`, alias và thay đổi trạng thái trong ví dụ `Customer` có hai instance và ba biến tham chiếu. |
      | Giải thích các bước khởi tạo | Phân biệt cấp phát object, giá trị mặc định của field, initializer và constructor với biến local chưa gán. |
      | Tách tài nguyên heap và ngoài heap | Chỉ ra trong tình huống đọc file phần nào được GC xử lý và phần nào phải gọi `close()` đúng thời điểm. |
      | Sử dụng try-with-resources | Viết đoạn đọc tệp có tự động đóng stream và xử lý việc xóa tệp tạm riêng; giải thích suppressed exception. |
      | Phân tích đối tượng còn reachable | Xác định vì sao alias, cache hoặc registry sống lâu có thể giữ object và cách loại tham chiếu không còn cần. |
  - slug: lifecycle-002
    title: Hàm khởi tạo và thiết lập trạng thái hợp lệ
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Hàm khởi tạo và thiết lập trạng thái hợp lệ
    problemSolved: Constructor bảo vệ invariant và dữ liệu mutable ra sao?
    mechanism: Bắt đầu từ hợp đồng trạng thái trước khi gán field.
    applicationValue: Tạo object hợp lệ, bảo vệ trạng thái và các tiền điều kiện.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Hàm khởi tạo và thiết lập trạng thái hợp lệ**

      Thiết kế constructor bảo vệ bất biến của lớp ngay khi khởi tạo thành công, thay vì để đối tượng ở trạng thái tạm thời sai. Bài học sử dụng ràng buộc sức chứa, email duy nhất, defensive copy, `final` và compact constructor của `record` để kiểm tra tính nhất quán của dữ liệu.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Bất biến và kiểm tra đầu vào

      1. Làm thế nào xác định invariant cho `CourseEnrollment` từ mã khóa học, sức chứa và danh sách email, rồi tổ chức bước kiểm tra trước khi gán field?
      2. Vì sao mọi constructor overload và phương thức tạo đối tượng mới phải dẫn về cùng quy tắc bảo vệ invariant?

      ### Bảo vệ trạng thái và lỗi khởi tạo

      1. Khi caller thay đổi một `List` đã truyền vào constructor, khác biệt giữa giữ trực tiếp list và dùng `List.copyOf()` là gì; giới hạn sao chép nông nằm ở đâu?
      2. Constructor ném `IllegalArgumentException` thì phép gán bên gọi và những side effect ngoài JVM phát sinh trước đó có hành vi gì?
      3. Tại sao `final`, `record` hay kiểm tra dữ liệu vẫn không cho phép công bố `this` trước khi quá trình khởi tạo hoàn tất?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Xây dựng invariant | Liệt kê các trạng thái hợp lệ/không hợp lệ của đăng ký khóa học và thiết kế validation phù hợp. |
      | Kiểm tra nhiều đường khởi tạo | Giải thích cách constructor hai tham số, ba tham số và `withStudent()` cùng từ chối vượt sức chứa hoặc email trùng. |
      | Bảo vệ dữ liệu mutable | Phân tích hoặc sửa một lớp giữ list đầu vào bằng defensive copy và tránh lộ collection có thể sửa. |
      | Đánh giá tính bất biến | Phân biệt `private final`, immutable collection và việc phần tử bên trong vẫn có thể mutable. |
      | Dự đoán lỗi constructor | Giải thích kết quả tạo object thành công/thất bại và nhận diện side effect hoặc `this` escape không được rollback tự động. |
  - slug: lifecycle-003
    title: Khởi tạo mặc định, tham số và nhiều cách khởi tạo
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Khởi tạo mặc định, tham số và nhiều cách khởi tạo
    problemSolved: Default/no-arg/overload và `this`/`super` được chọn thế nào?
    mechanism: Xem mọi overload như một đường tới invariant chung.
    applicationValue: Xây dựng API constructor rõ nghĩa, không lỗi chuỗi khởi tạo.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Khởi tạo mặc định, tham số và nhiều cách khởi tạo**

      Phân biệt constructor mặc định do compiler sinh, constructor không tham số tự viết, constructor có tham số và các overload. Bài học giúp lựa chọn cách tạo dễ đọc, đảm bảo `final` field và invariant qua `this(...)`/`super(...)`, đồng thời xử lý lỗi biên dịch khi chữ ký khởi tạo không phù hợp.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Các loại constructor và overload

      1. Trong điều kiện nào compiler tự sinh default constructor, và vì sao khai báo `Ticket(int)` khiến `new Ticket()` không còn hợp lệ nếu không viết no-arg?
      2. Java phân giải overload bằng danh sách tham số ra sao, và khi nào `null` hoặc nhiều chữ ký kiểu tham chiếu tạo lời gọi mơ hồ?

      ### Chuỗi khởi tạo và thiết kế API

      1. `this(...)` khác `super(...)` thế nào; vì sao constructor con cần gọi được constructor cha phù hợp và không thể tạo chuỗi `this(...)` vòng tròn?
      2. Khi nào overload trở nên khó đọc và nên dùng static factory có tên hay Builder thay cho nhiều tham số cùng kiểu?
      3. Vì sao setter sau khi tạo không tương đương chạy lại constructor, và field `final` phải được gán ra sao trên mỗi đường khởi tạo?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Chẩn đoán default/no-arg | Dự đoán các lệnh `new` biên dịch thành công hay lỗi sau khi thêm constructor có tham số. |
      | Thiết kế overload hợp lệ | Viết các overload rõ nghĩa và phát hiện cặp chữ ký mơ hồ khi truyền `null`. |
      | Điều phối constructor chaining | Mô phỏng chuỗi gọi `this(...)` và `super(...)`, chỉ ra nơi kiểm tra invariant chung. |
      | Đảm bảo khởi tạo trường | Sửa ví dụ gán nhầm tham số cho chính nó hoặc bỏ sót phép gán trường `final`. |
      | Chọn giao diện tạo phù hợp | Giải thích bằng tình huống khi constructor, static factory có tên hoặc Builder giúp lời gọi rõ ràng hơn. |
  - slug: lifecycle-004
    title: Thứ tự khởi tạo trong quan hệ kế thừa
    status: WRITTEN
    difficult: ADVANCED
    focus: Thứ tự khởi tạo trong quan hệ kế thừa
    problemSolved: Static, instance initializer và constructor cha/con chạy theo thứ tự nào?
    mechanism: Dự đoán bằng trace thực thi thay vì chỉ nhìn thứ tự khai báo.
    applicationValue: Đọc đúng hành vi kế thừa và tránh kết quả khởi tạo bất ngờ.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Thứ tự khởi tạo trong quan hệ kế thừa**

      Dự đoán thứ tự khởi tạo thực tế khi lớp con kế thừa lớp cha, bao gồm `static` initializer, instance field, initialization block và constructor. Bài học giúp truy vết output, sửa lỗi `super(...)` và tránh gọi phương thức override khi trạng thái lớp con còn mang giá trị mặc định.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Trình tự lớp cha và lớp con

      1. Khi chạy `new Child()` lần đầu và lần thứ hai, phần `static` của Parent/Child và phần instance nào được chạy, theo thứ tự văn bản nào?
      2. Vì sao `new Child()` tạo một đối tượng Child có phần trạng thái kế thừa chứ không tự sinh thêm một instance Parent riêng?

      ### Constructor chaining và lỗi khởi tạo

      1. Điều gì xảy ra khi lớp cha chỉ có constructor có tham số nhưng lớp con không gọi `super(argument)`?
      2. Tại sao một override của lớp con được gọi trong constructor cha có thể quan sát giá trị `0`/`null` dù lớp con khai báo field initializer khác?
      3. Khi phép khởi tạo thất bại giữa chuỗi constructor, phần code nào đã chạy và vì sao không được coi object là khởi tạo thành công?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Truy vết khởi tạo | Lập bảng log đúng thứ tự `static`, instance initializer và constructor cho hai lần tạo đối tượng kế thừa. |
      | Phân biệt class/instance initialization | Giải thích vì sao `static` thường chạy một lần mỗi lần khởi tạo lớp, còn phần instance chạy mỗi lần `new`. |
      | Sửa lời gọi constructor cha | Chọn `super(...)` hợp lệ khi cha không có no-arg truy cập được và lý giải lỗi biên dịch. |
      | Phân tích dynamic dispatch sớm | Dự đoán giá trị field con khi override chạy trong constructor cha và sửa thiết kế bằng helper không thể override. |
      | Đánh giá chain nhiều cấp | Mô phỏng trình tự từ tổ tiên tới lớp cụ thể mà không giả định có nhiều instance riêng biệt. |
  - slug: lifecycle-005
    title: Hàm tạo tĩnh, Factory và Builder
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Hàm tạo tĩnh, Factory và Builder
    problemSolved: Khi nào dùng static factory, Factory hoặc Builder?
    mechanism: Chọn mức trừu tượng tạo đối tượng theo bài toán.
    applicationValue: Thiết kế cách tạo object và lựa chọn implementation linh hoạt.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Hàm tạo tĩnh, Factory và Builder**

      Chọn cơ chế tạo đối tượng theo yêu cầu API: constructor trực tiếp, static factory có tên, Factory lựa chọn implementation hoặc Builder cấu hình nhiều tùy chọn. Bài học phân biệt Simple Factory với Factory Method pattern và nhận ra việc trả về object có sẵn, bean do Spring quản lý hoặc bản sao được bảo vệ.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Các cơ chế tạo đối tượng

      1. Vì sao `Temperature.celsius(...)` và `fahrenheit(...)` diễn đạt ý nghĩa rõ hơn hai constructor cùng danh sách kiểu tham số?
      2. Static factory có bắt buộc tạo instance mới không, và nó khác Factory riêng cũng như Factory Method pattern có thể override ở điểm nào?

      ### Thiết kế Builder và tích hợp

      1. Một Builder mutable thu thập giá trị ở những bước nào; khi gọi `build()`, phải xác thực và sao chép danh sách ra sao để object kết quả không bị sửa theo Builder?
      2. Trong tình huống nào chọn constructor, factory chọn `Notifier` theo kênh hoặc Builder cho `SearchRequest`, và mỗi cách có chi phí thiết kế gì?
      3. Vì sao trong ứng dụng Spring không nên `new` tùy tiện các service cần injection/proxy, và một factory chọn bean sẵn có khác gì tạo đối tượng mới?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Lựa chọn mẫu khởi tạo | Ghép tình huống hai đơn vị nhiệt độ, chọn kênh thông báo, và nhiều tham số tùy chọn với cách tạo thích hợp. |
      | Phân biệt thuật ngữ Factory | Giải thích bằng code vai trò của static factory, Simple Factory và Factory Method dùng subclass. |
      | Thiết kế Builder có kiểm tra | Tạo luồng fluent `builder(...).page(...).addTag(...).build()` với validation và bản sao collection ở kết quả. |
      | Kiểm soát danh tính và chia sẻ | Phân tích API factory trả cached instance so với instance mới mà không dựa sai vào `==` để so sánh giá trị. |
      | Xác định giới hạn tích hợp | Nhận diện Builder không tự thread-safe và factory chọn bean Spring được quản lý thay vì khởi tạo lại service. |
  - slug: lifecycle-006
    title: Thời gian tồn tại, khả năng truy cập và giải phóng bộ nhớ
    status: WRITTEN
    difficult: ADVANCED
    focus: Thời gian tồn tại, khả năng truy cập và giải phóng bộ nhớ
    problemSolved: Scope, GC roots, weak reference và object retention có quan hệ gì?
    mechanism: Lần theo đường từ roots đến object và chính sách retention.
    applicationValue: Tránh giữ object vô hạn, chủ động giới hạn cache/listener.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Thời gian tồn tại, khả năng truy cập và giải phóng bộ nhớ**

      Hiểu lifetime của object thông qua các đường tham chiếu từ GC roots, thay vì nhầm scope của biến với thời điểm thu gom. Bài học cung cấp cách phân tích strong/weak/soft/phantom reference, cache, listener, `ThreadLocal`, chu trình tham chiếu và sử dụng heap dump để tìm đối tượng bị giữ quá lâu.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Reachability và lifetime

      1. Vì sao `a = null`, ra khỏi scope và GC thu hồi bộ nhớ là ba sự kiện khác nhau; một alias hoặc registry `static` ảnh hưởng tới object thế nào?
      2. GC roots và đồ thị object quyết định khả năng truy cập ra sao; vì sao hai object chỉ trỏ lẫn nhau mà không có đường root vẫn có thể bị thu gom?

      ### Tham chiếu đặc biệt và chẩn đoán

      1. Khác biệt giữa strong, soft, weak và phantom references là gì, và vì sao `WeakReference.get()` sau khi bỏ strong reference không có kết quả cố định?
      2. Một cache không giới hạn, listener không unregister hoặc `ThreadLocal` trong thread pool có thể gây retention bằng những đường nào?
      3. Khi heap tăng dài hạn, làm sao dùng heap dump, retained graph và GC roots để tìm nơi đang giữ object thay vì dựa vào `System.gc()`?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Vẽ đồ thị tham chiếu | Xác định object nào còn reachable qua alias, collection hoặc static field sau từng phép gán/xóa. |
      | Phân biệt thời điểm vòng đời | Giải thích được object eligible for GC, đã thu hồi, đã close resource là những trạng thái độc lập. |
      | Phân tích weak reference | Dự đoán các kết quả có thể của `WeakReference` mà không giả định GC có lịch cố định. |
      | Phát hiện giữ tham chiếu quá lâu | Xác định và đề xuất loại bỏ retention từ cache, listener hoặc `ThreadLocal` gắn với luồng sống dài. |
      | Điều tra memory leak | Đề xuất quy trình dùng heap dump/GC root path để kiểm chứng nguyên nhân object bị giữ. |
  - slug: lifecycle-007
    title: Thu gom rác và quản lý bộ nhớ thủ công
    status: WRITTEN
    difficult: ADVANCED
    focus: Thu gom rác và quản lý bộ nhớ thủ công
    problemSolved: GC xử lý heap đến đâu, khi nào cần quản lý native memory?
    mechanism: Dựa trên số liệu và hợp đồng API, không kỳ vọng GC tất định.
    applicationValue: Tách giám sát heap, native memory và chính sách GC thực tế.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Thu gom rác và quản lý bộ nhớ thủ công**

      Phân định việc GC tự thu hồi bộ nhớ object Java với trách nhiệm ứng dụng quản lý bộ nhớ native và tài nguyên OS. Bài học giới thiệu reachability, các pha GC ở mức khái niệm, những ngộ nhận về `System.gc()`/`finalize()`, FFM `Arena` ở JDK 22+ và công cụ quan sát heap, metaspace, off-heap.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Cơ chế quản lý bộ nhớ

      1. Vì sao GC có thể thu hồi một chu trình object không còn reachable nhưng không thể thu hồi cache vẫn bị tham chiếu dù dữ liệu đã hết ích lợi?
      2. GC ở mức khái niệm tìm object còn sống, thu hồi và có thể di chuyển object như thế nào; vì sao không nên suy diễn lịch chạy GC từ `System.gc()`?

      ### Heap, native memory và điều tra

      1. Java heap, stack, metaspace, direct/native memory và file descriptor thuộc những cơ chế quản lý khác nhau ra sao?
      2. Với JDK 22+, vòng đời bộ nhớ cấp phát qua `Arena.ofConfined()` và `Arena.close()` khác gì object heap thông thường?
      3. Khi gặp `Java heap space`, `Metaspace`, lỗi direct buffer hoặc process RSS tăng, cần dùng những chỉ số/công cụ nào để khoanh vùng thay vì mặc định kết luận heap leak?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Giải thích phạm vi GC | Chỉ ra phần GC có thể thu hồi và phần phải đóng/giải phóng theo hợp đồng API. |
      | Phân tích bộ nhớ còn giữ | Giải thích bằng cache hoặc đồ thị roots tại sao GC chạy nhiều mà retained heap không giảm. |
      | Nhận biết giới hạn API | Phân biệt `System.gc()` là gợi ý, `finalize()` không đáng tin và `Arena` cần JDK 22 trở lên. |
      | Phân loại sự cố bộ nhớ | Tách heap pressure, class-loader/metaspace, direct buffer và native thread/resource issues từ triệu chứng. |
      | Thiết kế bước chẩn đoán | Lựa chọn GC log, `jcmd`, JFR, NMT hoặc heap dump theo vấn đề cần chứng minh. |
  - slug: lifecycle-008
    title: Đóng tài nguyên và giới hạn của hàm hủy
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Đóng tài nguyên và giới hạn của hàm hủy
    problemSolved: Đóng resource theo ownership và xử lý exception khi close thế nào?
    mechanism: Chủ động quản lý quyền sở hữu, cleanup và lỗi.
    applicationValue: Hoàn trả file, JDBC, socket đúng lúc và đúng người sở hữu.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Đóng tài nguyên và giới hạn của hàm hủy**

      Đóng đúng thời điểm những tài nguyên có quyền sở hữu rõ ràng như stream, JDBC connection và socket. Bài học làm rõ `AutoCloseable`/`Closeable`, try-with-resources, thứ tự đóng ngược, suppressed exceptions và lý do `finalize()` hay `Cleaner` không thay thế cho `close()`.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Đóng tài nguyên và exception

      1. Vì sao object Java không còn reachable vẫn có thể để file descriptor hay JDBC connection bị giữ, kể cả khi GC hoạt động?
      2. Với `try (A a = ...; B b = ...)`, tài nguyên đóng theo thứ tự nào khi thân `try` ném lỗi hoặc bước khởi tạo B thất bại?
      3. Nếu cả xử lý chính và `close()` cùng lỗi, khi nào ngoại lệ bị suppressed và cần đọc `getSuppressed()` ra sao?

      ### Hợp đồng ownership và giới hạn

      1. `AutoCloseable` khác `Closeable` ở hợp đồng ngoại lệ và tính an toàn khi đóng nhiều lần như thế nào?
      2. Khi nhận một reader chỉ để mượn hoặc `Connection` do pool cung cấp, ai được phép đóng và `close()` có ý nghĩa gì?
      3. Vì sao `finalize()`, `Cleaner` và `System.gc()` không thể bảo đảm cleanup đúng hạn; một lớp tự triển khai `AutoCloseable` cần lưu ý trạng thái và thread-safety nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Viết phạm vi tài nguyên an toàn | Tổ chức `try-with-resources` cho file hoặc các tài nguyên JDBC lồng nhau đúng quyền sở hữu. |
      | Dự đoán thứ tự cleanup | Xác định thứ tự đóng ngược và cách đóng tài nguyên đã mở nếu bước khai báo tiếp theo ném lỗi. |
      | Phân tích lỗi kép | Chỉ ra primary exception và suppressed exceptions từ một ví dụ xử lý và đóng cùng thất bại. |
      | Thiết kế hợp đồng close | Phân biệt `AutoCloseable`, `Closeable`, idempotence và ngăn dùng resource đã đóng. |
      | Đánh giá trách nhiệm sở hữu | Xác định khi nào phải đóng, chỉ mượn, hoặc trả connection về pool mà không nhầm với GC/finalization. |
  - slug: lifecycle-009
    title: Tránh để đối tượng chưa khởi tạo xong bị sử dụng
    status: WRITTEN
    difficult: ADVANCED
    focus: Tránh để đối tượng chưa khởi tạo xong bị sử dụng
    problemSolved: Làm sao ngăn `this escape`, callback sớm và công bố giữa các thread?
    mechanism: Khởi tạo xong, rồi kích hoạt và công bố có đồng bộ.
    applicationValue: Ngăn dùng object dở dang, giảm lỗi đồng thời khó tái hiện.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Tránh để đối tượng chưa khởi tạo xong bị sử dụng**

      Nhận diện và ngăn tham chiếu `this` thoát khỏi constructor khi trạng thái còn chưa sẵn sàng, kể cả trong callback đồng bộ và khi lớp cha gọi override. Bài học liên hệ constructor exception, thread start, Java Memory Model, final-field semantics và safe publication để thiết kế factory tạo xong rồi mới đăng ký hoặc kích hoạt.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Phát hiện sử dụng object quá sớm

      1. Những thao tác nào như đăng ký listener, giữ `this` trong registry, truyền lambda hay start thread trong constructor có thể làm lộ object trước khi khởi tạo hoàn tất?
      2. Tại sao callback đăng ký ngay hoặc override của lớp con được gọi trong constructor cha có thể đọc field `null`/`0` dù field khai báo initializer hoặc `final`?

      ### Công bố an toàn và xử lý lỗi

      1. Vì sao constructor ném lỗi sau khi đã lưu `this` vào registry vẫn có thể để lại object dở dang, và cách đăng ký sau khi tạo thành công cần xử lý lỗi ra sao?
      2. `Thread.start()` và ghi/đọc `volatile` tạo quan hệ happens-before nào; vì sao vẫn phải đồng bộ thay đổi mutable sau khi công bố?
      3. Final-field semantics hỗ trợ điều gì và không bảo đảm điều gì khi object hoặc collection lồng nhau là mutable?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện this escape | Khoanh vùng các chỗ constructor công bố `this` qua listener, static collection, callback hoặc task. |
      | Truy vết lỗi khởi tạo sớm | Dự đoán `null`, `0` hoặc exception khi callback/override được gọi trước phần initializer của lớp con. |
      | Thiết kế factory an toàn | Chuyển thao tác register/start sang sau khi constructor trả thành công và nêu phương án cleanup nếu đăng ký thất bại. |
      | Giải thích safe publication | Phân tích quan hệ happens-before từ `Thread.start()` hoặc volatile và giới hạn đối với mutable state. |
      | Kiểm tra hợp đồng final | Giải thích vì sao field `final` không cứu được `this escape` hoặc bảo đảm immutable sâu. |
- slug: encapsulation
  title: Đóng gói
  childs:
  - slug: encapsulation-001
    title: Ẩn thông tin và ranh giới của đối tượng
    status: WRITTEN
    difficult: BASIC
    focus: Ẩn thông tin và ranh giới của đối tượng
    problemSolved: Ai được biết/sửa trạng thái và qua hợp đồng nào?
    mechanism: Xác định quyền sở hữu và ranh giới public.
    applicationValue: Giấu chi tiết Map, giới hạn đường thay đổi giỏ hàng.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Ẩn thông tin và ranh giới của đối tượng**

      Bài học giúp phân định dữ liệu và quyết định triển khai mà đối tượng cần giữ riêng với những hành vi thực sự nên công khai. Qua ShoppingCart, người học thấy vì sao field private, API có ý nghĩa và snapshot an toàn phải đi cùng nhau để caller không sửa giỏ hàng ngoài quy tắc.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Nguyên tắc và ranh giới

      1. Đóng gói, ẩn thông tin và access control giải quyết những câu hỏi khác nhau như thế nào?
      2. Vì sao chuyển một field sang private vẫn chưa đủ nếu getter làm lộ danh sách mutable?
      3. Những gì trong hợp đồng public cần giữ ổn định khi thay List bằng Map?

      ### Thiết kế và kiểm chứng ShoppingCart

      1. Vì sao addItem và changeQuantity bảo vệ giỏ tốt hơn việc trả Map nội bộ hoặc đặt tổng tiền tùy ý?
      2. Tại sao ShoppingCart tính và kiểm tra tràn trước khi put, và lỗi bị từ chối ảnh hưởng trạng thái ra sao?
      3. List.copyOf(lines.values()) tạo loại snapshot nào và điều kiện gì ở CartLine khiến nó an toàn?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân định ranh giới | Chỉ ra trạng thái, hành vi công khai và chi tiết triển khai cần ẩn trong một lớp giỏ hàng. |
      | Phân biệt khái niệm | Giải thích bằng ví dụ khác nhau giữa encapsulation, information hiding và bốn modifier truy cập Java. |
      | Thiết kế API | Đề xuất addItem, changeQuantity, removeItem thay cho quyền sửa collection và setTotal. |
      | Dự đoán hành vi | Giải thích kết quả snapshot trước/sau changeQuantity và ngoại lệ khi sửa snapshot. |
      | Kiểm tra bảo vệ invariant | Viết ca thử số lượng âm, SKU trùng và tràn long, xác minh giỏ giữ trạng thái khi từ chối. |
  - slug: encapsulation-002
    title: Điều kiện bất biến của đối tượng
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Điều kiện bất biến của đối tượng
    problemSolved: Trạng thái nào hợp lệ xuyên suốt vòng đời?
    mechanism: Mô hình hóa trạng thái hợp lệ trước khi viết mutator.
    applicationValue: Chứng minh được quy tắc kho hàng ở mọi thao tác.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Điều kiện bất biến của đối tượng**

      Bài học định nghĩa invariant là điều kiện của một trạng thái đối tượng hợp lệ và hướng dẫn chứng minh nó đúng sau khởi tạo, mỗi thao tác thành công và cả khi bị từ chối. Ví dụ StockItem kiểm soát onHand, reserved, available thông qua reserve, release, ship và restock.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Bản chất invariant

      1. Invariant khác precondition, postcondition và immutability ở đâu?
      2. Vì sao reserved không âm riêng lẻ vẫn chưa đủ bảo đảm reserved không vượt onHand?
      3. Đối tượng mutable có thể giữ invariant trong suốt vòng đời bằng cách nào?

      ### Chứng minh các thao tác và trường hợp lỗi

      1. Với onHand bằng 10 và reserved bằng 4, vì sao reserve(7) phải thất bại và trạng thái sau lỗi cần ra sao?
      2. Vì sao ship phải cập nhật cả reserved và onHand, còn restock nên dùng Math.addExact?
      3. Khi nhiều thread cùng reserve, điều gì khiến kiểm tra hợp lệ riêng lẻ không còn bảo đảm invariant?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Diễn đạt invariant | Viết điều kiện 0 ≤ reserved ≤ onHand và suy ra available từ hai trường. |
      | Phân biệt hợp đồng | Phân loại một quy tắc cụ thể thành invariant, tiền điều kiện hoặc hậu điều kiện. |
      | Phân tích chuyển trạng thái | Tính trạng thái StockItem sau các thao tác reserve, ship, release và restock hợp lệ. |
      | Phát hiện lỗi | Chỉ ra cập nhật trước kiểm tra trong unsafeReserve và sửa thành kiểm tra trước, ghi sau. |
      | Thiết kế kiểm thử | Lập ca biên, exception và overflow, xác minh trạng thái vẫn hợp lệ sau thất bại. |
      | Giới hạn đồng thời | Giải thích vì sao cùng một khóa phải bảo vệ mọi đường đọc/ghi hoặc cần transaction ở tầng dữ liệu. |
  - slug: encapsulation-003
    title: Kiểm soát truy cập và thay đổi trạng thái
    status: WRITTEN
    difficult: BASIC
    focus: Kiểm soát truy cập và thay đổi trạng thái
    problemSolved: Mã Java nào được truy cập và thao tác trạng thái?
    mechanism: Giảm quyền truy cập và gom cập nhật ở nơi sở hữu.
    applicationValue: Áp dụng modifier cùng API Wallet có kiểm tra.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Kiểm soát truy cập và thay đổi trạng thái**

      Bài học biến nguyên tắc đóng gói thành lựa chọn mức truy cập Java và các phương thức cập nhật có kiểm tra. Với Wallet, người học thực hành bảo vệ số dư, lịch sử giao dịch, nhánh thiếu tiền và hiểu giới hạn giữa quyền truy cập ở mức ngôn ngữ với phân quyền người dùng.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Visibility trong Java

      1. private, package-private, protected và public cho phép truy cập trong những phạm vi nào?
      2. Vì sao protected ở lớp con khác package có giới hạn theo đối tượng tham chiếu và top-level class không dùng private?
      3. Quy tắc least visibility hỗ trợ ổn định hợp đồng public ra sao?

      ### Kiểm soát Wallet và ranh giới trách nhiệm

      1. Deposit xử lý tràn số bằng Math.addExact trước khi gán số dư như thế nào?
      2. Withdraw trả false khi thiếu tiền thay vì ném lỗi ảnh hưởng hợp đồng API ra sao?
      3. Vì sao snapshot lịch sử và private balance không tự bảo đảm thread safety hoặc kiểm tra quyền người dùng?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Áp dụng mức truy cập | Chọn và giải thích modifier cho field, helper, API công khai và thành phần cộng tác cùng package. |
      | Phân tích Wallet | Theo dấu deposit, withdraw, balanceCents và history để xác định đường thay đổi trạng thái. |
      | Kiểm chứng nhánh lỗi | Dự đoán kết quả nạp tiền tràn, rút vượt số dư và sửa snapshot lịch sử. |
      | Phân biệt các lớp bảo vệ | Giải thích khác biệt giữa Java access control, authentication/authorization và đồng bộ đa luồng. |
      | Đề xuất API thay thế | Thay setBalance không kiểm tra bằng deposit/withdraw có điều kiện. |
  - slug: encapsulation-004
    title: Getter, setter và phương thức thể hiện ý định
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Getter, setter và phương thức thể hiện ý định
    problemSolved: Nên công khai getter, setter hay hành vi?
    mechanism: Xem lời gọi như một yêu cầu có hợp đồng.
    applicationValue: Thiết kế API phù hợp cho Account, Booking, DTO và value object.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Getter, setter và phương thức thể hiện ý định**

      Bài học giúp quyết định khi nào nên dùng getter, setter có validation, command theo nghiệp vụ hoặc value object bất biến. Qua BankAccount, Profile, Booking và Money, người học xác định quyền quan sát, quyền sửa độc lập, cập nhật nhiều field cùng lúc và ranh giới giữa DTO với domain model.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Lựa chọn API đúng ngữ nghĩa

      1. Khi nào setDisplayName hợp lý nhưng setBalance hoặc setStatus dễ làm rối quy tắc nghiệp vụ?
      2. Getter tính toán như getItemCount khác getter trả field hay mutable collection ở điểm nào?
      3. Vì sao lệnh reschedule(start, end) bảo vệ cặp thời điểm tốt hơn hai setter độc lập?

      ### Hợp đồng, framework và tính bất biến

      1. Phân biệt query và command; vì sao canWithdraw không thay kiểm tra cuối trong withdraw khi chạy đồng thời?
      2. Quy ước JavaBeans, record và yêu cầu framework có luôn buộc domain object mở public setter không?
      3. Vì sao Money.plus tạo instance mới phù hợp với value object bất biến?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân loại phương thức | Giải thích vai trò getter, setter, command, query và constructor trong API lớp. |
      | Thiết kế BankAccount | Đề xuất deposit, withdraw, renameOwner, close và các quy tắc trước khi thay đổi. |
      | Đánh giá setter | Chọn setter có kiểm tra cho thuộc tính độc lập và hành vi nghiệp vụ cho trạng thái liên kết. |
      | Bảo vệ getter | Chọn giá trị tính toán hoặc snapshot và phát hiện getter phơi dữ liệu mutable/bí mật. |
      | Cập nhật nguyên khối | Thiết kế reschedule kiểm tra cả start/end trước khi gán. |
      | Tách mô hình | Phân biệt DTO/JavaBean phục vụ binding với domain model sở hữu luật; giải thích Money.plus. |
  - slug: encapsulation-005
    title: Kiểm tra đầu vào tại ranh giới đối tượng
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Kiểm tra đầu vào tại ranh giới đối tượng
    problemSolved: Dữ liệu nào được phép đi vào hoặc thay đổi object?
    mechanism: Kiểm tra giá trị thực sẽ lưu trước khi commit.
    applicationValue: Validate constructor, mutator và quan hệ nhiều field.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Kiểm tra đầu vào tại ranh giới đối tượng**

      Bài học chỉ ra nơi dữ liệu đi vào trạng thái do object sở hữu và trách nhiệm kiểm tra ở constructor, factory, mutator và hành vi nghiệp vụ. Các ví dụ CourseEnrollment, Reservation, Scores và CourseCode minh họa chuẩn hóa rồi validate, kiểm tra quan hệ nhiều field, copy dữ liệu mutable và phân tầng validation.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Quy tắc đầu vào và tính nhất quán

      1. Vì sao chỉ validate ở controller không đủ bảo vệ CourseEnrollment khi đối tượng được tạo từ batch job hoặc service khác?
      2. Phân biệt đối số sai với hành động không hợp lệ ở trạng thái hiện tại và chọn ngoại lệ tương ứng như thế nào?
      3. Vì sao cần chuẩn hóa mã rồi xác thực chính giá trị sẽ được lưu?

      ### Cập nhật an toàn và quyền sở hữu dữ liệu

      1. Với reconfigure(1, 5), vì sao gán capacity trước có thể làm Reservation hỏng dù có ném exception?
      2. Vì sao Scores clone mảng đầu vào trước khi validate và tiếp tục clone khi getter trả dữ liệu?
      3. DTO, domain object, service và database lần lượt sở hữu những kiểm tra nào; phần nào cần transaction/locking?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Thiết kế validation | Cài kiểm tra courseCode, credits thuộc 1..30 ở constructor và changeCredits. |
      | Phân biệt quy tắc | Xếp null/format/range/quan hệ-field/trạng thái hiện tại vào vị trí kiểm tra phù hợp. |
      | Cập nhật an toàn | Sửa reconfigure để validate toàn bộ trạng thái mới rồi mới gán. |
      | Chuẩn hóa có kiểm soát | Giải thích và hiện thực CourseCode record với strip và kiểm tra định dạng. |
      | Chặn lách validation | Phát hiện aliasing của Scores, áp dụng clone ở đầu vào và đầu ra. |
      | Giới hạn validation | Giải thích trường hợp cần ràng buộc duy nhất trong DB hoặc phối hợp check-update khi đồng thời. |
  - slug: encapsulation-006
    title: Ngăn lộ dữ liệu nội bộ có thể thay đổi
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Ngăn lộ dữ liệu nội bộ có thể thay đổi
    problemSolved: Tham chiếu nào cho phép caller sửa dữ liệu bên trong?
    mechanism: Theo dấu quyền sửa qua mọi tham chiếu chia sẻ.
    applicationValue: Chặn inbound/outbound aliasing của list và array.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Ngăn lộ dữ liệu nội bộ có thể thay đổi**

      Bài học tập trung vào hai đường rò rỉ mutable reference: đối tượng giữ chính dữ liệu mà caller truyền vào và getter trả dữ liệu nội bộ ra ngoài. Với EnrollmentBook và Attachment, người học thử sửa list và mảng từ cả hai phía, rồi dùng bản sao hoặc snapshot phù hợp để giữ quyền cập nhật trong lớp.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Nhận diện aliasing

      1. Inbound aliasing khác outbound aliasing thế nào trong UnsafeClassroom?
      2. Vì sao private final List vẫn có thể bị caller làm thay đổi bằng input.add hoặc getStudents().clear?
      3. Một List.copyOf chứa phần tử mutable có còn nguy cơ rò rỉ trạng thái nào?

      ### Lựa chọn hợp đồng đọc an toàn

      1. Vì sao EnrollmentBook lưu bản sao đầu vào và getStudents trả List.copyOf, còn Attachment clone byte[] ở cả hai chiều?
      2. Unmodifiable view, structural snapshot và bản sao ArrayList cho phép caller sửa và quan sát thay đổi khác nhau ra sao?
      3. Khi list rất lớn hoặc bị cập nhật đa luồng, cần cân nhắc gì thay vì sao chép mù quáng?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phát hiện đường rò | Vẽ hoặc giải thích các tham chiếu chia sẻ giữa caller, field private và getter. |
      | Chặn rò rỉ đầu vào | Sao chép list ở constructor, kiểm tra giới hạn sức chứa và không trùng học viên. |
      | Chặn rò rỉ đầu ra | Trả snapshot List.copyOf hoặc clone mảng và chứng minh caller sửa không ảnh hưởng nội bộ. |
      | Phân biệt cách trả | Dự đoán output của unmodifiableList và List.copyOf khi backing list thay đổi. |
      | Kiểm tra giới hạn | Chỉ ra shallow copy không bảo vệ mutable element và snapshot cần đồng bộ khi có race. |
  - slug: encapsulation-007
    title: Sao chép phòng vệ và biểu diễn bất biến
    status: WRITTEN
    difficult: ADVANCED
    focus: Sao chép phòng vệ và biểu diễn bất biến
    problemSolved: Bản sao nào đủ để dữ liệu quan sát không đổi?
    mechanism: Sao chép đúng dữ liệu thuộc quyền sở hữu, tránh clone entity tùy tiện.
    applicationValue: Tạo EventSnapshot với phần tử bất biến thật sự.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Sao chép phòng vệ và biểu diễn bất biến**

      Bài học đào sâu cách lựa chọn giữa defensive copy tại ranh giới và biểu diễn immutable. Với SafeReminder, Instant và EventSnapshot, người học sao chép Date cả khi nhận/trả, chuyển phần tử AttendeeDraft thành giá trị bất biến và hiểu vì sao một list chỉ đọc chưa đủ nếu phần tử vẫn mutable.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Chiến lược sao chép và biểu diễn

      1. final Date khác Instant bất biến thế nào và vì sao SafeReminder phải copy ở cả constructor lẫn getter?
      2. Shallow copy, deep copy có chủ đích và List.copyOf phân biệt nhau ở container lẫn phần tử như thế nào?
      3. Vì sao tạo snapshot giá trị tài khoản hoặc hóa đơn thường đúng hơn clone nguyên entity định danh?

      ### Xây dựng snapshot ổn định

      1. EventSnapshot chặn việc form đổi Date, rename AttendeeDraft và thêm người sau xác nhận ra sao?
      2. Vì sao List.copyOf kết hợp Attendee bất biến cho phép trả getAttendees mà không cần sao chép mỗi lần?
      3. Bất biến của snapshot đã tạo có tự giải quyết việc sao chép trong lúc dữ liệu bị cập nhật đa luồng hoặc công bố tham chiếu không?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Bảo vệ kiểu Date | Viết constructor/getter tạo new Date từ getTime và dự đoán kết quả sau khi caller gọi setTime. |
      | Chọn kiểu immutable | Giải thích tại sao Instant có thể được chia sẻ và reschedule nên trả Reminder mới. |
      | Phân tích mức sao chép | Xác định tham chiếu phần tử mutable còn chia sẻ khi copy list nông. |
      | Thiết kế snapshot | Chuyển dữ liệu EventSnapshot từ AttendeeDraft mutable sang Attendee bất biến và chốt danh sách. |
      | Đánh giá chi phí và đồng thời | Nêu điều kiện cần đồng bộ khi chụp dữ liệu và khi công bố snapshot mới. |
  - slug: encapsulation-008
    title: Đóng gói hành vi thay vì chỉ bao bọc dữ liệu
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Đóng gói hành vi thay vì chỉ bao bọc dữ liệu
    problemSolved: Ai chịu trách nhiệm thực thi luật nghiệp vụ?
    mechanism: Yêu cầu đối tượng thực hiện hành động thay vì thao túng field.
    applicationValue: Thiết kế Order theo vòng đời, tách entity và service.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Đóng gói hành vi thay vì chỉ bao bọc dữ liệu**

      Bài học chuyển tư duy từ lớp chỉ chứa field và setter sang đối tượng chịu trách nhiệm cho hành động hợp lệ. EncapsulatedOrderDemo minh họa Order tự kiểm tra addLine, confirm, cancel, suy ra tổng tiền từ OrderLine và bảo vệ danh sách, đồng thời phân biệt trách nhiệm của entity với application service.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Mô hình giàu hành vi

      1. Vì sao OrderData dù có private field vẫn cho phép đơn xác nhận rỗng hoặc tổng âm?
      2. Tell, Don't Ask gợi ý điều gì khi code bên ngoài liên tục getStatus rồi setStatus?
      3. Vì sao total nên tính từ lines và trạng thái cần chuyển qua confirm/cancel thay vì setter?

      ### Vòng đời và kiến trúc

      1. Với DRAFT, CONFIRMED, CANCELLED, những thao tác nào được phép hoặc bị từ chối trong EncapsulatedOrderDemo?
      2. Vì sao Order không nên trực tiếp gọi cổng thanh toán hay gửi thông báo khi application service điều phối use case?
      3. Những ca kiểm thử nào chứng minh thao tác thất bại không làm sửa trạng thái hay list nội bộ?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện mô hình thiếu hành vi | Phân tích thiết kế get-if-set và chỉ ra luật nghiệp vụ bị phân tán. |
      | Thiết kế state machine | Liệt kê chuyển DRAFT → CONFIRMED → CANCELLED và các chuyển trái phép. |
      | Cài đặt hành vi | Đề xuất addLine, confirm, cancel và requireDraft kèm điều kiện kiểm tra trước mutation. |
      | Giữ nguồn dữ liệu nhất quán | Giải thích vì sao getTotal tính từ dòng hàng và getLines trả snapshot an toàn. |
      | Phân chia trách nhiệm | Đặt luật đơn hàng tại entity, truy vấn DB/thanh toán/phát sự kiện tại service/adapter. |
      | Kiểm thử hành vi | Mô tả test xác nhận đơn rỗng, sửa đơn đã xác nhận và sửa list qua getter. |
  - slug: encapsulation-009
    title: Ví dụ bảo vệ số dư và trạng thái đơn hàng
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Ví dụ bảo vệ số dư và trạng thái đơn hàng
    problemSolved: Các nguyên tắc hoạt động ra sao trên Account và Order?
    mechanism: Đối chiếu thành công, thất bại và giới hạn của mô hình.
    applicationValue: Kiểm chứng bất biến số dư và chuyển trạng thái bằng Java chạy được.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Ví dụ bảo vệ số dư và trạng thái đơn hàng**

      Bài học kết hợp các kỹ thuật đóng gói vào hai trường hợp thực hành: Account không cho số dư âm và Order chỉ chuyển trạng thái theo quy trình CREATED, PAID, SHIPPED hoặc CANCELLED. Người học kiểm tra nhánh thành công, thất bại, overflow, snapshot danh sách và giới hạn của synchronized trong bộ nhớ.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Bảo vệ số dư Account

      1. Vì sao Account dùng private balanceCents và synchronized deposit/withdraw thay cho setter?
      2. Điều gì xảy ra với số dư khi withdraw vượt số dư hoặc deposit làm tràn long?
      3. Synchronized trên cùng instance giải quyết tình huống nào và vì sao không thay transaction giữa hai tài khoản hoặc database?

      ### Bảo vệ vòng đời Order

      1. Vì sao OrderStatus dùng enum vẫn cần markPaid, ship, cancel có điều kiện trạng thái?
      2. Các lời gọi ship khi CREATED, cancel khi SHIPPED, markPaid khi CANCELLED cần giữ trạng thái ra sao?
      3. List.copyOf(items) kết hợp OrderItem record ngăn những đường sửa nào; điều gì thay đổi nếu OrderItem mutable?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Theo dõi trạng thái tài khoản | Tính số dư sau nạp/rút và xác định kết quả true/false của withdraw. |
      | Xử lý trường hợp biên | Giải thích exception số tiền âm, tràn long và chứng minh số dư không đổi khi thao tác thất bại. |
      | Kiểm tra state machine | Vẽ các cạnh CREATED → PAID → SHIPPED và CREATED → CANCELLED với hành vi tương ứng. |
      | Bảo vệ collection | Chứng minh sửa danh sách đầu vào hoặc gọi clear trên items không phá Order đã tạo. |
      | Đánh giá phạm vi đồng bộ | Phân biệt synchronized trong một instance với giao dịch nhiều tài khoản, lưu trữ và phân quyền. |
      | Mở rộng có điều kiện | Đề xuất thêm hạn mức rút hoặc DELIVERED, bao gồm ca từ chối không thay đổi các field. |
- slug: abstraction
  title: Trừu tượng
  childs:
  - slug: abstraction-001
    title: Trừu tượng hóa và chọn đặc điểm thiết yếu
    status: WRITTEN
    difficult: BASIC
    focus: Trừu tượng hóa và chọn đặc điểm thiết yếu
    problemSolved: Đặc điểm, hành vi nào thiết yếu cho use case?
    mechanism: Mô hình theo mục đích
    applicationValue: Giảm dữ liệu và phụ thuộc dư thừa
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Trừu tượng hóa và chọn đặc điểm thiết yếu**

      Một đối tượng ngoài đời có rất nhiều đặc điểm, nhưng mỗi chức năng phần mềm chỉ cần một phần trong số đó. Bài học giúp người học xuất phát từ câu hỏi nghiệp vụ để chọn dữ liệu, hành vi và quy tắc phù hợp, tránh buộc mọi caller mang theo một mô hình quá lớn hoặc hiểu công thức nội bộ.

      Qua bài toán báo phí giao hàng, người học thấy lý do QuoteInput chỉ chứa cân nặng và quãng đường, ShippingPricing công bố hành vi báo phí, còn chính sách tiêu chuẩn và giao nhanh giữ thuật toán riêng. Cùng một kiện hàng có thể cần góc nhìn khác khi theo dõi vận chuyển.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Xác định bản chất theo ngữ cảnh

      1. Vì sao không thể có một tập thuộc tính thiết yếu cố định cho mọi bài toán liên quan đến kiện hàng?
      2. Nếu chuyển từ báo phí sang theo dõi vận chuyển, dữ liệu và hành vi cần công bố sẽ thay đổi thế nào?
      3. Khi nào một thông tin đang được bỏ qua trở thành đầu vào bắt buộc do quy tắc nghiệp vụ thay đổi?

      ### Thiết kế hợp đồng và kiểm chứng

      1. Vì sao QuoteInput chỉ cần weightGrams và distanceKm trong công thức minh họa, còn ShippingPricing nên công bố hành vi quoteFee?
      2. Caller của ShippingPricing cần biết những cam kết gì về đơn vị, giá trị hợp lệ, làm tròn và lỗi?
      3. So với một EverythingShipment có nhiều trường không liên quan, thiết kế đầu vào theo use case giảm loại phụ thuộc nào?
      4. Vì sao một lớp cụ thể hoặc record vẫn có thể thể hiện trừu tượng hóa mà không cần abstract class hay interface?
      5. Với 1.001 gram và 0 km, làm thế nào suy luận phí tiêu chuẩn từ hợp đồng làm tròn cân nặng trong bài?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân tích yêu cầu theo use case | Lập bảng giữ hoặc bỏ từng thuộc tính của kiện hàng và giải thích quyết định bằng quy tắc nghiệp vụ cụ thể. |
      | Thiết kế dữ liệu đầu vào tối thiểu | Phác thảo record hoặc class cho báo phí hay theo dõi, với tên trường, đơn vị và validation tương ứng. |
      | Xây dựng hợp đồng hành vi | Đề xuất API có phương thức và kiểu kết quả thể hiện mục đích nghiệp vụ, thay vì bắt caller thực hiện thuật toán. |
      | Phân tách hợp đồng với chính sách thực hiện | Chỉ ra vai trò của ShippingPricing, StandardPricing, ExpressPricing và composition trong ví dụ. |
      | Đánh giá mức trừu tượng | Phát hiện mô hình quá rộng hoặc hợp đồng Object mơ hồ và đề xuất ranh giới API cụ thể hơn. |
      | Kiểm tra kết quả theo quy tắc | Tính được phí cho trường hợp biên làm tròn khối lượng và đối chiếu với đầu ra minh họa. |
  - slug: abstraction-002
    title: Phân biệt trừu tượng với đóng gói
    status: WRITTEN
    difficult: BASIC
    focus: Phân biệt trừu tượng với đóng gói
    problemSolved: Công bố khả năng khác bảo vệ trạng thái ra sao?
    mechanism: Tách điều được thấy và quyền được sửa
    applicationValue: Giữ đúng ranh giới API và invariant
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phân biệt trừu tượng với đóng gói**

      Bài học giúp người học nhận ra hai câu hỏi thiết kế khác nhau: đối tượng cần công bố khả năng nào cho người dùng và đối tượng phải kiểm soát những đường thay đổi trạng thái nào. Có interface chưa chắc đã bảo vệ dữ liệu; có private chưa chắc API đã diễn đạt đúng trách nhiệm.

      Bằng SeatInventory và InMemorySeatInventory, người học phân biệt hợp đồng đặt ghế mà BookingService sử dụng với kiểm tra sức chứa, trường private và bản sao lịch sử nhằm bảo vệ bất biến. Các ví dụ SafeAccount và collection mutable cho thấy vì sao getter/setter hay access modifier đơn lẻ chưa đủ.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Vai trò riêng của hai nguyên lý

      1. Trong ví dụ đặt ghế, SeatInventory thể hiện abstraction ở đâu còn InMemorySeatInventory thực hiện encapsulation ở đâu?
      2. Vì sao BookingService có thể đổi từ InMemorySeatInventory sang SoldOutInventory mà không cần biết cấu trúc lưu ghế?
      3. Một lớp không có interface riêng vẫn có thể cung cấp abstraction tốt theo những điều kiện nào?

      ### Bảo vệ trạng thái và nhận diện lỗi

      1. Vì sao khai báo private balance nhưng cho phép setBalance nhận số âm vẫn là đóng gói yếu?
      2. Vì sao trả trực tiếp một List mutable có thể làm hỏng bất biến dù trường giữ List là private final?
      3. Khi nào nên dùng List.copyOf, và vì sao bản sao collection không tự bảo đảm bất biến sâu của phần tử mutable?
      4. Mức truy cập private, package-private, protected và public ảnh hưởng ra sao đến ranh giới kiểm soát?
      5. Vì sao việc reserve kiểm tra rồi giảm ghế trong ví dụ không tự động an toàn khi chạy nhiều luồng?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân biệt mục tiêu thiết kế | Phân loại tình huống thuộc abstraction, encapsulation hoặc cả hai, kèm giải thích theo trách nhiệm và invariant. |
      | Phân tích phụ thuộc ở client | Giải thích vì sao BookingService chỉ dùng hợp đồng SeatInventory và dự đoán ảnh hưởng khi thay implementation. |
      | Bảo vệ bất biến | Viết hoặc sửa constructor và phương thức reserve, deposit, withdraw để ngăn giá trị không hợp lệ. |
      | Phát hiện lộ trạng thái mutable | Chỉ ra đường sửa nội bộ qua getter List và đề xuất snapshot hoặc API chỉ đọc phù hợp. |
      | Đánh giá quyền truy cập | Chọn phạm vi truy cập cho trạng thái và thao tác công khai, nêu được lý do bảo vệ hợp đồng. |
      | Nhận diện giới hạn kỹ thuật | Giải thích vì sao interface/private không thay cho đồng bộ hoặc transaction khi có cạnh tranh cập nhật. |
  - slug: abstraction-003
    title: Hợp đồng sử dụng và chi tiết thực hiện
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Hợp đồng sử dụng và chi tiết thực hiện
    problemSolved: Caller dựa được vào lời hứa nào?
    mechanism: Thiết kế dựa trên cam kết có thể kiểm tra
    applicationValue: Thay implementation an toàn theo ngữ nghĩa
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Hợp đồng sử dụng và chi tiết thực hiện**

      Bài học giúp người học phân biệt lời hứa mà caller có quyền dựa vào với thuật toán, lưu trữ hoặc dịch vụ bên ngoài có thể thay đổi. Khớp chữ ký Java chưa đủ: giá trị trả về, lỗi, đơn vị, tác dụng phụ và thời điểm đánh giá đều góp phần tạo hợp đồng hành vi.

      Ví dụ LeavePolicy dùng chính sách nghỉ phép thông thường và thử việc để cho thấy hai implementation có thể trả quyết định khác nhau nhưng vẫn giữ cam kết chung: không duyệt quá số ngày còn, không trả null và không âm thầm trừ quota. Người học cũng thực hành cách kiểm chứng hợp đồng và cách ly client khi provider thay đổi.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Thiết lập hợp đồng từ góc nhìn caller

      1. Với LeavePolicy.evaluate, những điều kiện đầu vào, kết quả, lỗi và side effect nào thuộc hợp đồng chung?
      2. Tại sao @Override và kiểu trả về LeaveDecision không đủ để bảo đảm một implementation tuân thủ ngữ nghĩa?
      3. Vì sao APPROVED trong ví dụ chỉ là kết quả đánh giá một snapshot, chưa đồng nghĩa đơn nghỉ đã được lưu hoặc trừ ngày phép?

      ### Khả năng thay thế và kiểm thử

      1. Vì sao chính sách thường có thể chấp thuận 3/5 ngày, chính sách thử việc từ chối 3/5 ngày mà cả hai vẫn hợp lệ?
      2. Implementation trả null, duyệt 6/5 ngày hoặc tự trừ ngày phép vi phạm chính xác cam kết nào?
      3. Contract test chung khác gì kiểm thử LeaveReviewService bằng một fake policy?
      4. Khi chuyển implementation sang REST/HTTP, caller có thể cần biết thêm giới hạn nào về timeout, lỗi hệ thống, độ mới dữ liệu và retry?
      5. Những thay đổi nào phá hợp đồng dù chữ ký evaluate vẫn giữ nguyên?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Đặc tả hợp đồng hành vi | Viết rõ miền giá trị LeaveRequest, tính non-null của LeaveDecision, quy tắc chung và cam kết không side effect. |
      | Tách vai trò client/provider | Vẽ phụ thuộc LeaveReviewService → LeavePolicy và chỉ ra các chính sách là implementation có thể thay thế. |
      | Phân tích tính thay thế | Phân loại các kết quả APPROVED, EXCEEDS_TRIAL_LIMIT, null và thay đổi quota theo đúng hoặc sai hợp đồng. |
      | Xây dựng contract test | Đề xuất ca kiểm tra kết quả khác null, không phê duyệt vượt phép, từ chối null và không thay đổi dữ liệu. |
      | Kiểm thử client độc lập | Chọn một policy giả tuân thủ hợp đồng để kiểm tra đường chuyển request và nhận quyết định. |
      | Đánh giá thay đổi triển khai | Liệt kê các thuộc tính có thể quan sát khi chuyển từ in-memory sang HTTP và xác định cam kết cần cập nhật. |
  - slug: abstraction-004
    title: Tiền điều kiện, hậu điều kiện và cam kết hành vi
    status: WRITTEN
    difficult: ADVANCED
    focus: Tiền điều kiện, hậu điều kiện và cam kết hành vi
    problemSolved: Điều gì phải đúng trước và sau lời gọi?
    mechanism: Lập luận bằng điều kiện và bất biến
    applicationValue: Kiểm chứng trạng thái và tính thay thế
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Tiền điều kiện, hậu điều kiện và cam kết hành vi**

      Một API chỉ đáng tin khi mô tả rõ trạng thái cần có trước lời gọi, kết quả sau khi thành công và điều phải giữ trong suốt vòng đời đối tượng. Bài học dùng SeatInventory để chuyển quy tắc đặt/trả ghế thành các cam kết có thể tính toán, viết mã và kiểm thử.

      Người học phân biệt lỗi đầu vào với thiếu ghế, kiểm tra bảo toàn trạng thái khi thất bại, phát hiện implementation tăng tiền điều kiện trái hợp đồng và nhận ra giới hạn khi chạy đa luồng hoặc bất đồng bộ.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Diễn đạt cam kết kiểm chứng được

      1. Tiền điều kiện, hậu điều kiện và bất biến khác nhau thế nào với thao tác reserve(n) và release(n)?
      2. Từ capacity = 10 và available = 10, sau reserve(3) rồi release(1) phải bảo đảm những giá trị nào?
      3. Tại sao hậu điều kiện “số ghế được cập nhật” yếu hơn công thức available_after = available_before - n?
      4. Khi reserve(9) lúc còn 8 ghế, API minh họa phải báo lỗi gì và giữ trạng thái như thế nào?

      ### Thay thế, lỗi và điều kiện chạy

      1. Vì sao một implementation chỉ nhận reserve(n) với n từ 2 trở lên vi phạm hợp đồng chấp nhận reserve(1)?
      2. Làm thế nào viết contract test để kiểm tra trạng thái trước và sau lời gọi, kể cả đường exception?
      3. Vì sao assert trong Java không thích hợp làm cơ chế bảo vệ duy nhất cho tham số API public?
      4. Điều gì thay đổi trong cam kết nếu reserve là xử lý async hoặc nhiều luồng cùng đặt ghế?
      5. Vì sao check available() rồi reserve(1) ở hai lời gọi riêng không đủ bảo đảm tính nguyên tử?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Đặc tả tiền và hậu điều kiện | Viết quy tắc thành công, ngoại lệ và công thức trạng thái trước/sau cho reserve và release. |
      | Chứng minh bất biến | Phân tích constructor, cập nhật và các nhánh thất bại để kiểm tra 0 ≤ available ≤ capacity. |
      | Cài đặt theo hợp đồng | Chọn thứ tự validate trước khi sửa trạng thái và giải thích vì sao lỗi không được trừ ghế một phần. |
      | Phân tích tương thích LSP | Phát hiện lớp con siết tiền điều kiện hoặc làm yếu hậu điều kiện và đưa ra cách thiết kế đúng. |
      | Tạo phép thử hành vi | Thiết kế ca biên cho đủ ghế, thiếu ghế, n không dương, trả vượt ghế và kiểm tra trạng thái giữ nguyên khi lỗi. |
      | Nêu phạm vi bảo đảm | Phân biệt kết quả sync, async, cập nhật đa luồng và giới hạn của transaction hoặc synchronized theo phạm vi hệ thống. |
  - slug: abstraction-005
    title: Lớp trừu tượng và phương thức trừu tượng
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Lớp trừu tượng và phương thức trừu tượng
    problemSolved: Làm sao chia sẻ quy trình và buộc lớp con bổ sung bước riêng?
    mechanism: Xác định phần chung và điểm mở rộng
    applicationValue: Tái sử dụng logic nền qua kế thừa có chủ đích
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Lớp trừu tượng và phương thức trừu tượng**

      Bài học hướng dẫn dùng abstract class để chia sẻ trạng thái, constructor và quy trình ổn định giữa các lớp cùng họ, còn abstract method xác định bước buộc lớp con thực hiện. Đây là cơ chế Java cụ thể để xây dựng hợp đồng kế thừa và đa hình mà không lặp mã kiểm tra chung.

      Qua ShippingPlan, người học theo dõi quote() final kiểm tra dữ liệu, gọi extraFee() được override ở EconomyShipping hoặc ExpressShipping, rồi cộng tổng phí. Bài học cũng làm rõ constructor lớp trừu tượng, lỗi biên dịch, giới hạn override và thời điểm nên chọn interface thay cho kế thừa.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Cú pháp và vòng đời đối tượng

      1. Vì sao không thể new ShippingPlan trực tiếp nhưng có thể khai báo biến ShippingPlan nhận EconomyShipping?
      2. Lớp abstract có thể chứa constructor, field, phương thức có thân và không có abstract method không?
      3. Khi tạo lớp con, constructor lớp cha xử lý trạng thái chung vào thời điểm nào?
      4. Vì sao không nên gọi phương thức có thể override từ constructor lớp cha?

      ### Quy trình chung và ghi đè

      1. Vì sao quote() được đánh dấu final còn extraFee() được khai báo abstract trong ví dụ tính phí?
      2. Khi biến kiểu ShippingPlan trỏ tới ExpressShipping, Java quyết định extraFee() nào sẽ chạy?
      3. Những lỗi biên dịch nào xảy ra nếu lớp concrete không implement abstract method, giảm quyền truy cập hoặc đổi sai chữ ký override?
      4. Khi nào abstract class có lợi hơn interface và khi nào dùng composition sẽ rõ nghĩa hơn?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện cú pháp hợp lệ | Phân biệt khai báo abstract class/method hợp lệ với abstract có body, abstract final hoặc khởi tạo abstract trực tiếp. |
      | Tạo lớp nền dùng chung | Thiết kế abstract class giữ constructor, state được bảo vệ và phương thức chung cho họ đối tượng có quan hệ kế thừa thực. |
      | Hiện thực điểm biến thiên | Override đúng phương thức extraFee và label với chữ ký, quyền truy cập, kiểu trả về phù hợp. |
      | Giải thích Template Method | Mô phỏng đường gọi quote → kiểm tra → extraFee runtime → cộng phí và lý do cố định quy trình bằng final. |
      | Kiểm tra vòng đời khởi tạo | Phân tích rủi ro lời gọi override trước khi field lớp con được khởi tạo đầy đủ. |
      | Chọn công cụ trừu tượng | So sánh abstract class, interface và composition dựa trên yêu cầu chia sẻ trạng thái/quy trình, giới hạn đơn kế thừa. |
  - slug: abstraction-006
    title: Phân biệt lớp cụ thể với lớp trừu tượng
    status: WRITTEN
    difficult: BASIC
    focus: Phân biệt lớp cụ thể với lớp trừu tượng
    problemSolved: Lớp nào new được, kiểu tham chiếu và object khác nhau thế nào?
    mechanism: Phân tích kiểu khai báo so với kiểu runtime
    applicationValue: Hiểu quy tắc Java và đa hình lúc chạy
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phân biệt lớp cụ thể với lớp trừu tượng**

      Bài học làm rõ vai trò của kiểu tham chiếu và lớp thực tế được khởi tạo trong một cây kế thừa. Lớp trừu tượng mô tả phần chung và những điểm chưa hoàn thiện; lớp cụ thể đáp ứng đầy đủ các phương thức còn thiếu để tạo đối tượng, khi constructor và phạm vi truy cập cho phép.

      Ví dụ NotificationChannel với EmailChannel, SmsChannel cho phép quan sát hành vi send() chung final gọi deliver() riêng của từng lớp con. Người học từ đó phân biệt abstract ở cấp lớp và method, đọc được kết quả đa hình và phát hiện lỗi biên dịch khi triển khai thiếu.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Phân biệt kiểu lớp và đối tượng

      1. Với NotificationChannel channel = new SmsChannel(), kiểu khai báo và kiểu đối tượng thực tế là gì?
      2. Lớp trừu tượng khác lớp cụ thể ở khả năng new trực tiếp và nghĩa vụ thực hiện abstract method như thế nào?
      3. Vì sao một abstract class không có abstract method vẫn không được tạo instance trực tiếp?
      4. Một lớp concrete có bắt buộc tự viết phương thức mới nếu mọi phương thức đã có implementation được kế thừa không?

      ### Theo dõi hành vi và chọn cấu trúc

      1. Tại sao send() final vẫn có thể dẫn đến cách gửi email hoặc SMS khác nhau?
      2. Constructor của NotificationChannel chạy ra sao khi new EmailChannel, và vì sao không nên gọi hook overridable từ constructor?
      3. Khi nào interface Trackable thích hợp hơn việc ép nhiều kiểu khác họ kế thừa chung một abstract class?
      4. Lỗi gì xảy ra nếu lớp con quên override deliver(), override sai tên hoặc khai báo phương thức abstract là private?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Xác định khả năng khởi tạo | Phân loại class abstract, concrete và final, giải thích điều kiện hợp lệ của biểu thức new. |
      | Đọc kiểu tham chiếu và runtime | Giải thích đối tượng được tạo từ SmsChannel, còn biến NotificationChannel công bố bề mặt sử dụng chung. |
      | Theo dõi đa hình động | Mô phỏng send() kiểm tra dữ liệu rồi dispatch deliver() theo từng đối tượng cụ thể. |
      | Hoàn thiện lớp con | Viết subclass triển khai đúng abstract method và sử dụng @Override để kiểm chứng chữ ký. |
      | Đánh giá constructor lớp cha | Dự đoán thứ tự khởi tạo và nhận diện nguy cơ gọi phương thức override quá sớm. |
      | Lựa chọn quan hệ OOP | Đề xuất abstract class, interface, concrete class hoặc composition từ các nhu cầu chia sẻ hành vi thực tế. |
  - slug: abstraction-007
    title: Mức trừu tượng phù hợp với bài toán
    status: WRITTEN
    difficult: ADVANCED
    focus: Mức trừu tượng phù hợp với bài toán
    problemSolved: Khi nào cần thêm interface hoặc giữ class đơn giản?
    mechanism: Quyết định theo biến thể thực tế và thử nghiệm
    applicationValue: Giảm chi phí thiết kế, tiến hóa đúng nhu cầu
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Mức trừu tượng phù hợp với bài toán**

      Trừu tượng hóa chỉ có ích khi làm hành vi nghiệp vụ rõ ràng và chi phí thay đổi hợp lý. Bài học giúp người học nhận ra thiết kế quá thấp khiến caller tự lặp logic, còn thiết kế quá cao khiến một chức năng đơn giản phải đi qua nhiều tầng class, factory và generic khó hiểu.

      Qua chính sách phí gửi xe, người học biết bắt đầu với ParkingFeeCalculator cụ thể cho một công thức, sau đó trích xuất ParkingFeePolicy khi xuất hiện hai chính sách tính phí cần dùng chung trong ParkingCheckout. Các ca 15, 16, 75, 76 phút cho thấy việc nâng mức trừu tượng phải bảo toàn hành vi.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Nhận diện mức thiết kế

      1. Vì sao để UI, REST controller và batch job tự tính phí gửi xe là mức trừu tượng quá thấp?
      2. Khi chỉ có một công thức cố định, vì sao một class ParkingFeeCalculator có API rõ có thể đủ tốt?
      3. Những dấu hiệu nào cho thấy hệ thống factory, registry, AbstractRateEngine quá tổng quát so với yêu cầu hiện tại?

      ### Tiến hóa theo nhu cầu thực tế

      1. Khi nào việc xuất hiện HourlyPolicy và FlatPerVisitPolicy tạo lý do thực sự để giới thiệu ParkingFeePolicy?
      2. ParkingCheckout phụ thuộc policy qua constructor giúp thay đổi điều gì mà không sửa logic checkout?
      3. Vì sao dùng Object hoặc Map cho đầu vào có thể làm hợp đồng trở nên mơ hồ dù nhìn có vẻ tái sử dụng cao?
      4. Làm thế nào chuyển từ calculator sang nhiều policy mà vẫn giữ các kết quả phí ở mốc 15, 16, 75 và 76 phút?
      5. Khi nào composition phù hợp hơn kế thừa nhiều tầng trong bài toán nhiều chính sách?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Chẩn đoán thiết kế thiếu hoặc thừa trừu tượng | Nêu dấu hiệu phân tán công thức hoặc tầng trung gian không có trách nhiệm rõ, gắn với hậu quả cụ thể. |
      | Chọn API khởi đầu vừa đủ | Đề xuất lớp cụ thể với phương thức calculateVnd và ràng buộc tham số, kết quả minh bạch. |
      | Nhận diện điểm biến thiên thật | Giải thích thời điểm cần trích xuất ParkingFeePolicy khi checkout phục vụ hai công thức khác nhau. |
      | Thiết kế composition | Mô tả quan hệ ParkingCheckout chứa ParkingFeePolicy và cách truyền implementation tương ứng. |
      | Bảo toàn hành vi khi refactor | Lập bảng kiểm tra phí ở các mốc 0, 15, 16, 75, 76 phút và giá trị lỗi cho đầu vào âm. |
      | Đánh giá chi phí thiết kế | So sánh mức dễ đọc, số phụ thuộc, độ ổn định của hợp đồng và chi phí thêm biến thể trước khi tạo abstraction mới. |
  - slug: abstraction-008
    title: Rò rỉ chi tiết thực hiện qua giao diện sử dụng
    status: WRITTEN
    difficult: ADVANCED
    focus: Rò rỉ chi tiết thực hiện qua giao diện sử dụng
    problemSolved: API đang bắt caller biết chi tiết backend nào?
    mechanism: Xem API từ góc nhìn caller, che những chi tiết không cần biết
    applicationValue: Bảo vệ ranh giới module khi đổi công nghệ
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Rò rỉ chi tiết thực hiện qua giao diện sử dụng**

      Một API trông trừu tượng nhưng vẫn có thể buộc caller hiểu HashMap, SQLException, transaction hoặc thứ tự dữ liệu tình cờ của implementation. Bài học giúp phát hiện khi chi tiết triển khai đi xuyên qua hợp đồng sử dụng, khiến mã bên ngoài khó đổi backend và dễ phá bất biến.

      Qua LeakyBookStore và BookCatalog, người học chuyển từ getInternalBooks().get(isbn) sang findByIsbn và searchByTitle có ngữ nghĩa rõ, phân biệt kết quả không tìm thấy với lỗi hệ thống, đồng thời xét những thuộc tính hành vi cần công bố như thứ tự kết quả, độ mới dữ liệu và vòng đời Stream.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Nhận diện chi tiết bị lộ

      1. Vì sao getInternalBooks() trả HashMap khiến caller phụ thuộc triển khai và có thể sửa trạng thái nội bộ?
      2. Nếu thay HashMap mutable bằng unmodifiableMap, vấn đề đóng gói và vấn đề rò rỉ abstraction đã được xử lý đến đâu?
      3. Khi nào Path hoặc IOException là phần hợp đồng hợp lý, thay vì dấu hiệu leaky abstraction?

      ### Thiết kế lại API và giữ ngữ nghĩa

      1. BookCatalog nên công bố hành vi tìm kiếm nào để LibraryService độc lập với HashMap, SQL hoặc HTTP?
      2. Vì sao Optional.empty khi không thấy sách phải khác với thất bại khi truy vấn database?
      3. Các thuộc tính tìm kiếm nào cần giữ nhất quán giữa implementation, như so khớp hoa/thường, thứ tự ISBN và giới hạn số kết quả?
      4. Một Stream phụ thuộc connection đang mở đặt ra trách nhiệm vòng đời nào cho caller và adapter?
      5. Khi nào dùng kiểu Page/Pageable của Spring là ranh giới hợp lý, và khi nào nó tạo phụ thuộc framework không cần thiết?
      6. Các bước chuyển dần client khỏi API rò rỉ là gì để không làm hỏng tương thích sử dụng?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phát hiện API rò rỉ | Chỉ ra trong ví dụ những chỗ công bố HashMap, ResultSet, SQLException hoặc phụ thuộc session ngoài phạm vi caller. |
      | Phân biệt rò implementation với đóng gói kém | Phân tích độc lập việc lộ cấu trúc dữ liệu và cho phép sửa collection mutable. |
      | Thiết kế hợp đồng theo nghiệp vụ | Viết phác thảo findByIsbn và searchByTitle với kiểu kết quả, điều kiện đầu vào và lỗi có ý nghĩa rõ ràng. |
      | Bảo vệ dữ liệu trả về | Chọn List.copyOf khi phù hợp, giải thích giới hạn của sao chép nông và phần tử mutable. |
      | Giữ hành vi thay thế được | Xây ca kiểm tra tìm theo ISBN, chữ hoa/thường, thứ tự, limit và phân biệt không có dữ liệu với lỗi backend. |
      | Quản lý lỗi và tài nguyên | Mô tả cách adapter ánh xạ SQLException có giữ cause và cách đóng Stream phụ thuộc connection. |
      | Lập lộ trình sửa API | Xác định nhu cầu caller, thêm API nghiệp vụ, chuyển mã gọi, loại đường truy cập cũ và kiểm thử hợp đồng. |
- slug: interface
  title: Giao diện
  childs:
  - slug: interface-001
    title: Giao diện như một hợp đồng và một vai trò
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Giao diện như một hợp đồng và một vai trò
    problemSolved: Chữ ký khác lời hứa hành vi ra sao?
    mechanism: Thiết kế từ lời hứa
    applicationValue: Xác định contract tin cậy
    summary: |-
      # 0. Định hướng học tập
      ## 1. Mục đích của bài học
      **Giao diện như một hợp đồng và một vai trò**

      Xem interface Java như một lời hứa mà bên sử dụng có thể dựa vào và như một vai trò một đối tượng có thể đảm nhiệm. Bài dùng DeliveryChannel, EmailChannel và SmsChannel để thấy lợi ích của kiểu tham chiếu interface, nhưng đồng thời phân biệt việc compiler kiểm tra chữ ký với việc hệ thống phải tự bảo vệ hợp đồng hành vi. Đây là nền tảng để thay thế, kiểm thử và tiến hóa implementation mà không gây bất ngờ cho client.
      ## 2. Những câu hỏi người học phải tự trả lời được
      ### Bản chất hợp đồng và vai trò
      1. Vì sao một interface có thể mô tả khả năng của nhiều lớp khác họ thay vì danh tính của từng class?
      2. DeliveryChannel.deliver(Notice) bảo đảm điều gì ở cấp chữ ký, và những tiền điều kiện, hậu điều kiện, lỗi hoặc tác dụng phụ nào phải được ghi rõ thêm?
      3. Nếu SmsChannel đồng thời implements DeliveryChannel và HealthCheck, hai biến kiểu interface tham chiếu tới bao nhiêu đối tượng, và mỗi biến được phép gọi phương thức nào?
      ### Hành vi có thể thay thế và giới hạn
      1. Vì sao BrokenChannel trả null vẫn biên dịch nhưng không đạt hợp đồng, và có thể kiểm chứng vi phạm bằng cách nào?
      2. Vì sao một channel không có chức năng thu hồi không nên bị buộc implements revoke(), và khi nào cần tách vai trò?
      3. Khi sửa ý nghĩa DeliveryReceipt hoặc thêm method vào interface công khai, những client và implementation nào có thể bị ảnh hưởng?
      ## 3. Sau khi học xong, người học phải đạt được điều gì?
      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Xác định hợp đồng hành vi | Viết được điều kiện đầu vào, kết quả khác null, lỗi và side effects cho DeliveryChannel ngoài chữ ký Java. |
      | Phân tích vai trò và kiểu tĩnh | Giải thích được vì sao cùng SmsChannel có hai vai trò nhưng channel.isHealthy() không hợp lệ qua biến DeliveryChannel. |
      | Đánh giá khả năng thay thế | Chỉ ra BrokenChannel vi phạm hậu điều kiện dù implements đúng chữ ký và đề xuất phép kiểm tra hành vi. |
      | Thiết kế abstraction theo nhu cầu | Phân biệt Sender với Revocable, xác định đúng API client cần mà không ép lớp hỗ trợ hành vi không có. |
      | Giải thích sự tiến hóa contract | Phân tích được rủi ro khi đổi signature hoặc semantics của receipt dù mã có thể vẫn biên dịch. |
  - slug: interface-002
    title: Khai báo và thực hiện giao diện
    status: WRITTEN
    difficult: BASIC
    focus: Khai báo và thực hiện giao diện
    problemSolved: Implements và override đúng như thế nào?
    mechanism: Chuyển contract thành mã chạy
    applicationValue: Biên dịch và thực thi đúng giao diện
    summary: |-
      # 0. Định hướng học tập
      ## 1. Mục đích của bài học
      **Khai báo và thực hiện giao diện**

      Luyện viết interface và class implements hợp lệ bằng ví dụ ShippingFeePolicy gồm hai chính sách phí giao hàng. Bài kết nối quy tắc cú pháp (public abstract, @Override, chữ ký, static) với việc chạy đa hình và kiểm tra nghĩa vụ thực thi, giúp người học tạo một implementation mới mà dịch vụ báo phí vẫn dùng được.
      ## 2. Những câu hỏi người học phải tự trả lời được
      ### Khai báo và tương thích ở thời điểm biên dịch
      1. Trong interface Greeter, method greet không có thân mang modifier ngầm nào, và tại sao VietnameseGreeter phải khai báo public khi override?
      2. Điều gì xảy ra nếu class concrete thiếu một abstract method, đổi danh sách tham số hoặc thu hẹp quyền truy cập?
      3. Vì sao không thể new ShippingFeePolicy(), và static validateInputs được gọi bằng tên nào?
      ### Đa hình và kiểm chứng ví dụ phí giao hàng
      1. ShippingQuoteService nhận ShippingFeePolicy qua constructor và JVM chọn EconomyShipping hay ExpressShipping như thế nào tại lời gọi calculate?
      2. Với quãng đường 10 km và đơn 300.000 VND, giải thích kết quả phí Economy 35.000 VND và Express 70.000 VND; điều gì thay đổi khi Economy gặp đơn 600.000 VND?
      3. Làm sao thêm SameDayShipping mà không sửa ShippingQuoteService, đồng thời giữ kiểm tra dữ liệu âm và phép tính tránh tràn số?
      4. Vì sao bộ kiểm tra chung vẫn cần thiết dù cả hai implementation đã biên dịch thành công?
      ## 3. Sau khi học xong, người học phải đạt được điều gì?
      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Khai báo và hiện thực đúng cú pháp | Viết interface, concrete class implements và @Override đúng chữ ký/visibility; chẩn đoán được lỗi compile minh họa. |
      | Vận hành đa hình | Chạy ShippingQuoteService với hai policy và giải thích tuyến gọi calculate theo instance thực tế. |
      | Xử lý điều kiện hợp đồng | Áp dụng validateInputs, Math.multiplyExact và Math.addExact để từ chối đầu vào âm, overflow. |
      | Mở rộng bằng implementation mới | Bổ sung SameDayShipping và tính đúng phí 63.000 VND cho 4 km mà không sửa code service. |
      | Kiểm tra nhiều implementation | Viết được kiểm tra chung cho phí không âm và quãng đường âm bị từ chối, phân biệt syntax và behavior. |
  - slug: interface-003
    title: Lập trình dựa trên giao diện
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Lập trình dựa trên giao diện
    problemSolved: Service nên phụ thuộc vào ai?
    mechanism: Đảo hướng dependency
    applicationValue: Giảm coupling, tăng khả năng test
    summary: |-
      # 0. Định hướng học tập
      ## 1. Mục đích của bài học
      **Lập trình dựa trên giao diện**

      Hiểu cách đặt dependency theo hợp đồng PaymentGateway để CheckoutService không tự tạo hoặc phân nhánh theo cổng thanh toán cụ thể. Bài có SimulatedCardGateway, PrepaidWalletGateway, constructor injection, composition root và RecordingGateway, qua đó người học quan sát việc thay implementation, kiểm thử service độc lập và đánh giá ranh giới hợp đồng thanh toán.
      ## 2. Những câu hỏi người học phải tự trả lời được
      ### Hướng phụ thuộc và cách lắp ghép
      1. Vì sao đặt new CardGateway trực tiếp trong CheckoutService làm việc thay nhà cung cấp và kiểm thử khó hơn?
      2. Constructor injection, composition root và Dependency Inversion Principle liên quan với nhau như thế nào, và vì sao DI không đồng nghĩa với interface?
      3. Kiểu khai báo PaymentGateway cho phép gọi những thao tác nào, và JVM dispatch tới cổng thẻ/ví theo tiêu chí nào?
      ### Thực hành checkout và độ tin cậy
      1. Với ví có 50.000 cents, vì sao thanh toán 30.000 cents đầu thành công, lần kế tiếp cùng số tiền thất bại và số dư còn 20.000?
      2. RecordingGateway giúp xác minh orderId, amountCents và số lần gọi như thế nào mà không kết nối cổng thật?
      3. Khi thiết kế hợp đồng charge, vì sao timeout không đủ để kết luận giao dịch thất bại và retry không kiểm soát có thể thu tiền hai lần?
      4. Lúc nào abstraction nhỏ như Iterable/List phù hợp hơn class cụ thể, và lúc nào thêm interface chỉ tạo cấu trúc không cần thiết?
      ## 3. Sau khi học xong, người học phải đạt được điều gì?
      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Đảo hướng phụ thuộc | Refactor ví dụ CheckoutService từ new concrete gateway sang constructor nhận PaymentGateway và chọn implementation bên ngoài. |
      | Dự đoán runtime đa hình | Giải thích kết quả card/wallet và đối tượng nào thực thi charge mà không dùng instanceof trong service. |
      | Thiết kế fake để thử client | Tạo RecordingGateway và xác nhận yêu cầu được chuyển nguyên vẹn, gọi đúng một lần. |
      | Nêu giới hạn của contract thanh toán | Mô tả được precondition, success/failure, timeout, side effects, idempotency và các giới hạn của demo so với hệ thống thật. |
      | Chọn abstraction tối thiểu | Biện minh việc nhận PaymentGateway hay Iterable/List từ nhu cầu client và tránh interface thừa. |
  - slug: interface-004
    title: Một đối tượng đảm nhận nhiều giao diện
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Một đối tượng đảm nhận nhiều giao diện
    problemSolved: Một instance mang nhiều vai trò thế nào?
    mechanism: Tách kiểu tham chiếu khỏi object
    applicationValue: Tái sử dụng instance qua vai trò
    summary: |-
      # 0. Định hướng học tập
      ## 1. Mục đích của bài học
      **Một đối tượng đảm nhận nhiều giao diện**

      Làm rõ cách Java cho một class thực hiện nhiều interface độc lập mà vẫn chỉ tạo một instance với trạng thái chung. OfficeMachine đảm nhiệm Printable, Scannable và StatusReadable; từ đó người học phân biệt kiểu tĩnh với kiểu runtime, chọn vai trò phù hợp cho client và xử lý các dạng trùng phương thức, composition hoặc interface gộp.
      ## 2. Những câu hỏi người học phải tự trả lời được
      ### Nhiều tham chiếu, một đối tượng
      1. Khi printPort, scanPort và monitorPort cùng nhận một OfficeMachine, có bao nhiêu object được tạo và vì sao kết quả status thấy cả hai bộ đếm?
      2. Vì sao printer.scan() không biên dịch dù đối tượng đằng sau hỗ trợ Scannable?
      3. Khi nào nên truyền riêng Printable và Scannable, khi nào cần MultiFunctionDevice extends cả hai?
      ### Cú pháp đa giao diện và xung đột
      1. Hai interface cùng có abstract log(String) khác với hai method overload hoặc hai default label() độc lập thế nào?
      2. Java xử lý hai default label() xung đột ra sao, và cú pháp LocalLabel.super.label() có vai trò gì?
      3. Vì sao implements nhiều interface không phải đa kế thừa field/constructor và khi nào composition với PrintEngine, ScanEngine phù hợp?
      4. Với một Printable không phải Scannable, việc ép kiểu thiếu kiểm tra có thể dẫn tới lỗi gì?
      ## 3. Sau khi học xong, người học phải đạt được điều gì?
      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Mô phỏng alias và trạng thái chung | Theo dõi một OfficeMachine qua ba tham chiếu và giải thích printed=1, scanned=1 sau các thao tác. |
      | Thiết kế API theo vai trò | Chọn Printable, Scannable hoặc MultiFunctionDevice đúng với yêu cầu cùng/khác thiết bị. |
      | Xử lý xung đột phương thức | Phân biệt abstract method trùng chữ ký, overload khác tham số và default collision; viết override phân giải khi cần. |
      | Đánh giá kế thừa và composition | Giải thích được một superclass trực tiếp, nhiều interfaces, và chuyển chức năng sang các engine hợp thành. |
      | Nhận diện cast không an toàn | Dự đoán compile error khi gọi ngoài interface và ClassCastException nếu ép kiểu không được đối tượng hỗ trợ. |
  - slug: interface-005
    title: Chọn giao diện hay lớp trừu tượng
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Chọn giao diện hay lớp trừu tượng
    problemSolved: Khi nào cần chung state và thuật toán?
    mechanism: Chọn cơ chế trừu tượng hóa
    applicationValue: Tránh kế thừa gượng ép
    summary: |-
      # 0. Định hướng học tập
      ## 1. Mục đích của bài học
      **Chọn giao diện hay lớp trừu tượng**

      Học cách quyết định giữa interface, abstract class và composition dựa trên trách nhiệm nghiệp vụ, không dựa trên thói quen thêm lớp. Ví dụ DeliveryFeePolicy là hợp đồng chung, WeightDistancePolicy chia sẻ trạng thái/thuật toán cho họ tính phí theo cân nặng, còn StorePickupPolicy trực tiếp implements interface; từ đó nhận ra điểm mở rộng, invariant và nguy cơ kế thừa gượng ép.
      ## 2. Những câu hỏi người học phải tự trả lời được
      ### Ranh giới giữa hợp đồng và chia sẻ implementation
      1. Những khác biệt về constructor, instance fields, default methods và khả năng implements/extends nhiều kiểu ảnh hưởng thế nào đến lựa chọn?
      2. Vì sao StorePickupPolicy nên implements DeliveryFeePolicy trực tiếp thay vì kế thừa WeightDistancePolicy?
      3. Trong WeightDistancePolicy, final quoteVnd() và protected abstract feePerChargedKgVnd() chia trách nhiệm bảo vệ thuật toán và tùy biến ra sao?
      ### Quyết định theo tình huống
      1. Với Parcel(1200 gram, 5 km), cơ chế làm tròn kg và công thức tạo ra phí 19.000, 33.500 và 0 VND như thế nào?
      2. Khi hai lớp chỉ dùng chung thao tác kiểm tra code mà không cùng họ nghiệp vụ, vì sao CodeValidator theo composition thích hợp hơn một abstract superclass?
      3. Khi nào default method của interface đủ để chia sẻ hành vi, và khi nào vẫn cần trạng thái/constructor trong abstract class?
      4. Vì sao không nên khai báo một interface riêng cho mọi class hoặc dùng abstract class chỉ để tái sử dụng vài dòng code?
      ## 3. Sau khi học xong, người học phải đạt được điều gì?
      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | So sánh công cụ trừu tượng hóa | Lập bảng chọn interface/abstract class/composition theo contract, field, constructor, khả năng kết hợp và biến thiên. |
      | Thiết kế họ policy hợp lý | Giải thích cấu trúc DeliveryFeePolicy, WeightDistancePolicy, Standard/Express và StorePickup không ép kế thừa không đúng nghĩa. |
      | Bảo vệ thuật toán chia sẻ | Xác định final method, constructor validation và protected extension point; tính đúng phí với Parcel trong ví dụ. |
      | Chọn composition khi phù hợp | Thiết kế hai lớp không cùng họ dùng CodeValidator mà không buộc extends một base class giả tạo. |
      | Đánh giá rủi ro bảo trì | Phát hiện kế thừa chiếm mất superclass, default method giả định trạng thái hoặc lớp nền quá rộng. |
  - slug: interface-006
    title: Giao diện nhỏ và phân tách vai trò
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Giao diện nhỏ và phân tách vai trò
    problemSolved: Client có phụ thuộc method không dùng?
    mechanism: Tập trung nhu cầu từng client
    applicationValue: Giữ ranh giới API theo client
    summary: |-
      # 0. Định hướng học tập
      ## 1. Mục đích của bài học
      **Giao diện nhỏ và phân tách vai trò**

      Vận dụng Interface Segregation Principle để thay một DocumentManager quá rộng bằng các hợp đồng đọc, ghi và xuất bản đúng nhu cầu client. Bài minh họa SearchService, EditorService, PublicationService, SnapshotCatalog và InMemoryDocuments, nhấn mạnh tách theo trách nhiệm thực tế để giảm phụ thuộc và tránh phương thức không được hỗ trợ.
      ## 2. Những câu hỏi người học phải tự trả lời được
      ### Nhận diện và phân tách hợp đồng
      1. Tại sao ReadOnlyArchive phải ném UnsupportedOperationException cho save/delete/publish là dấu hiệu hợp đồng quá rộng?
      2. ISP nói gì về trách nhiệm của client, và vì sao kích thước interface không thể đánh giá đơn thuần bằng số phương thức?
      3. Dựa trên nhu cầu SearchService, EditorService và PublicationService, nên định nghĩa và inject các interface nào?
      4. Vì sao class implements DocumentReader và DocumentWriter không có nghĩa nó tự động implements DocumentEditor extends hai interface đó?
      ### Tác động và kiểm chứng
      1. SnapshotCatalog có thể thay InMemoryDocuments ở SearchService như thế nào mà không phải cung cấp API ghi?
      2. Vì sao cấp DocumentReader theo kiểu tham chiếu chỉ giới hạn API trong Java chứ không thay thế authorization thực tế?
      3. Lập quy trình chuyển client từ DocumentManager lớn sang vai trò nhỏ khi dự án còn nhiều người sử dụng mà vẫn giữ tương thích?
      4. Lợi ích và giới hạn của việc tạo fake bằng lambda cho DocumentReader là gì khi thêm abstract method mới?
      ## 3. Sau khi học xong, người học phải đạt được điều gì?
      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phát hiện vi phạm ISP | Chỉ ra method client không dùng và implementation buộc ném UnsupportedOperationException trong DocumentManager. |
      | Tách API theo nhu cầu | Thiết kế DocumentReader, DocumentWriter, DocumentPublisher và gán dependency đúng cho ba service. |
      | Giữ implementation linh hoạt | Giải thích tại sao một InMemoryDocuments vẫn implements nhiều vai trò còn SnapshotCatalog chỉ hỗ trợ đọc. |
      | Lập kế hoạch migration | Xác định nhóm client, tạo contract nhỏ, chuyển phụ thuộc từng bước và dùng test để kiểm tra semantics. |
      | Đánh giá an toàn và khả năng thử nghiệm | Tạo fake DocumentReader để kiểm tra tìm kiếm, đồng thời phân biệt giới hạn kiểu với quyền bảo mật thực tế. |
  - slug: interface-007
    title: Thành viên mặc định và giới hạn tùy ngôn ngữ
    status: WRITTEN
    difficult: ADVANCED
    focus: Thành viên mặc định và giới hạn tùy ngôn ngữ
    problemSolved: Java hỗ trợ thành viên và phân giải default ra sao?
    mechanism: Phân tích giới hạn compiler/runtime
    applicationValue: Tránh sai cú pháp và API evolution
    summary: |-
      # 0. Định hướng học tập
      ## 1. Mục đích của bài học
      **Thành viên mặc định và giới hạn tùy ngôn ngữ**

      Nắm các loại thành viên hợp lệ của Java interface theo phiên bản và cách JVM/Java compiler xử lý default, static, private method và public static final fields. Qua Named, User, Invoice và những trường hợp class thắng interface, interface chuyên biệt hơn, xung đột hai default, người học tránh lỗi cú pháp, hiểu giới hạn của Object và không áp đặt quy tắc Java sang TypeScript, Kotlin hay C#.
      ## 2. Những câu hỏi người học phải tự trả lời được
      ### Modifier, dữ liệu và giới hạn Java
      1. Java hiểu các method chỉ có chữ ký, field khai báo trực tiếp, default method, static method và private helper trong interface thế nào?
      2. Vì sao User không thể gọi Named.isValidName như static method kế thừa, và private normalize không trở thành API cho implementation?
      3. Vì sao final List trong interface không bảo đảm nội dung bất biến, và đâu là vị trí phù hợp để lưu instance state?
      4. Tại sao interface không thể định nghĩa default toString() ghi đè phương thức public của Object?
      ### Dispatch, evolution và ngôn ngữ
      1. Khi class có method thích hợp, interface con override default của interface cha, hoặc hai interface độc lập cùng default, Java phân giải từng trường hợp ra sao?
      2. Trong Demo.java, tại sao Invoice phải override label() còn User có thể kế thừa default, và các dòng output được tạo như thế nào?
      3. Java 8, Java 9 và Java 17 bổ sung những khả năng interface nào và điều gì khiến ví dụ không chạy trên phiên bản cũ?
      4. Vì sao interface của TypeScript không cấp default implementation ở runtime giống Java?
      ## 3. Sau khi học xong, người học phải đạt được điều gì?
      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện thành viên hợp lệ | Phân loại abstract, default, static, private và field; chỉ ra lỗi constructor, instance field, protected method trong interface. |
      | Dự đoán phương thức được chạy | Giải thích class wins, interface chuyên biệt hơn, hai default độc lập và viết override với InterfaceName.super khi hợp lệ. |
      | Phân biệt static/final và state | Gọi đúng Named.isValidName và phát hiện public static final List vẫn có thể chứa phần tử mutable. |
      | Kiểm tra tương thích theo phiên bản | Xác định yêu cầu Java 8/9/17 cho default/static, private helper và sealed interface. |
      | So sánh ranh giới liên ngôn ngữ | Nêu đúng khác biệt cài đặt runtime của Java interface với hợp đồng kiểu của TypeScript và giới hạn ngôn ngữ khác. |
  - slug: interface-008
    title: Thay thế cách thực hiện mà giữ hợp đồng
    status: WRITTEN
    difficult: ADVANCED
    focus: Thay thế cách thực hiện mà giữ hợp đồng
    problemSolved: Hai implementation có thật sự tương đương?
    mechanism: Chứng minh substitutability bằng test
    applicationValue: Thay adapter mà giữ semantics
    summary: |-
      # 0. Định hướng học tập
      ## 1. Mục đích của bài học
      **Thay thế cách thực hiện mà giữ hợp đồng**

      Phân biệt thay implementation thành công ở cấp kiểu với thay thế an toàn ở cấp hành vi. Hai PriceCatalog dùng HashMap và TreeMap có thuật toán, độ phức tạp khác nhau nhưng phải thống nhất đầu vào SKU, giá bằng 0, thứ tự listSkus, snapshot, lỗi và thao tác cập nhật; cùng bộ contract test kiểm chứng những cam kết mà CheckoutQuoteService dựa vào.
      ## 2. Những câu hỏi người học phải tự trả lời được
      ### Hợp đồng có thể quan sát
      1. Vì sao hai lớp đều implements PriceCatalog vẫn có thể không thay thế được nhau về nghiệp vụ?
      2. Các cam kết nào của putPrice, findPrice, remove và listSkus phải giữ giống nhau giữa HashMapPriceCatalog với TreeMapPriceCatalog?
      3. Vì sao OptionalLong.empty() khác OptionalLong.of(0), và vì sao HashMap cần sắp xếp khi listSkus cam kết tăng dần?
      4. Khi priceVnd × quantity vượt long, CheckoutQuoteService xử lý thế nào để tránh báo giá sai?
      ### Kiểm thử và thay hạ tầng
      1. Cùng một hàm verify(PriceCatalog) cần những ca kiểm thử nào để bắt lỗi thứ tự, ghi đè, snapshot và đầu vào sai?
      2. Theo LSP, một implementation không được siết chặt tiền điều kiện hay làm yếu hậu điều kiện bằng những cách nào?
      3. Nếu đổi catalog trong memory sang database/cache/HTTP, những cam kết về commit, consistency, lỗi mạng và concurrency cần được định nghĩa lại hoặc duy trì?
      4. Vì sao đổi implementation lúc khởi động không tự di chuyển dữ liệu cũ hoặc thay mọi dependency đã được tạo khi chương trình đang chạy?
      ## 3. Sau khi học xong, người học phải đạt được điều gì?
      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Viết behavioral contract cụ thể | Đặc tả SKU hợp lệ, giá không âm, OptionalLong, thứ tự tăng dần và snapshot bất biến. |
      | Đối chiếu hai cách lưu | Giải thích HashMap tự sort keys còn TreeMap giữ thứ tự và dự đoán cùng output trong Main.java. |
      | Xây contract tests dùng chung | Tạo verify chạy được cho nhiều PriceCatalog, gồm SKU vắng/giá 0, cập nhật, xóa, snapshot và lỗi. |
      | Phát hiện vi phạm LSP | Chỉ ra BrokenCatalog hoặc danh sách đảo thứ tự vẫn biên dịch nhưng sai bảo đảm hành vi. |
      | Đánh giá thay thế hạ tầng | Nêu rủi ro consistency, transaction, migration state, thread safety và tác động lên hợp đồng client. |
  - slug: interface-009
    title: Thiết kế giao diện thanh toán hoặc lưu trữ
    status: WRITTEN
    difficult: ADVANCED
    focus: Thiết kế giao diện thanh toán hoặc lưu trữ
    problemSolved: Tách thanh toán/lưu dữ liệu và xử lý gọi lặp thế nào?
    mechanism: Thiết kế failure handling và idempotency
    applicationValue: Tích hợp nhiều ranh giới có kiểm soát
    summary: |-
      # 0. Định hướng học tập
      ## 1. Mục đích của bài học
      **Thiết kế giao diện thanh toán hoặc lưu trữ**

      Tổng hợp các nguyên tắc interface vào quy trình checkout mô phỏng: PaymentGateway đảm nhiệm thu tiền, PaymentRepository tìm/lưu kết quả, CheckoutService phối hợp qua constructor injection. Bài cung cấp PaymentCommand/PaymentResult, fake test và mô phỏng requestId lặp, đồng thời chỉ ra giới hạn của synchronized, lưu RAM và nguy cơ thu tiền trùng khi giao dịch thực xảy ra lỗi giữa các bước.
      ## 2. Những câu hỏi người học phải tự trả lời được
      ### Phân định ranh giới nghiệp vụ
      1. Vì sao nên tách PaymentGateway và PaymentRepository thay vì gộp thanh toán, lưu trữ, email vào một interface lớn?
      2. PaymentCommand và PaymentResult kiểm soát dữ liệu requestId, orderId, amountCents, status và providerReference như thế nào?
      3. CheckoutService nhận hai dependency qua constructor và chọn adapter thật/giả ở đâu, thay vì tự new client SQL hay nhà cung cấp?
      ### Luồng xử lý và tình huống lỗi
      1. Vì sao ba lời gọi pay với hai requestId trong demo chỉ gọi DemoGateway hai lần, và phạm vi bảo đảm của kết quả lặp là gì?
      2. Khi cùng requestId nhưng orderId hoặc số tiền khác, CheckoutService làm gì và vì sao phải kiểm tra trước khi trả kết quả cũ?
      3. Nếu gateway đã thu tiền nhưng repository.save thất bại, điều gì khiến retry có thể thu hai lần dù dùng synchronized và ConcurrentHashMap?
      4. Với hệ thống thật, vì sao cần idempotency ở gateway, unique constraint bền vững, trạng thái UNKNOWN/PENDING và reconciliation?
      5. FakeGateway có thể kiểm tra logic checkout nào, và phần tích hợp/provider thực tế nào vẫn cần kiểm thử độc lập?
      ## 3. Sau khi học xong, người học phải đạt được điều gì?
      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân tách hợp đồng theo trách nhiệm | Thiết kế riêng PaymentGateway và PaymentRepository với DTO/record hợp lệ, giữ CheckoutService chỉ điều phối. |
      | Trace luồng checkout | Dự đoán APPROVED, DECLINED, lượt requestId trùng và số lần gọi gateway của demo. |
      | Kiểm tra logic bằng fake | Tạo FakeGateway và xác minh lệnh lặp không gọi lại gateway, yêu cầu khác nội dung bị từ chối. |
      | Phân tích failure window | Mô tả đường đi gateway charge thành công rồi save thất bại và giải thích rủi ro double charge. |
      | Phác thảo nâng cấp production | Đề xuất phối hợp provider idempotency key, lưu bền vững, uniqueness, recovery và trạng thái chưa xác định. |
- slug: inheritance
  title: Kế thừa
  childs:
  - slug: inheritance-001
    title: Lớp cha, lớp con và quan hệ kế thừa
    status: WRITTEN
    difficult: BASIC
    focus: Lớp cha, lớp con và quan hệ kế thừa
    problemSolved: Kiểu con có thực sự là kiểu cha?
    mechanism: Kiểm tra is-a và khả năng thay thế.
    applicationValue: Thiết lập quan hệ subtype có hợp đồng rõ.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Lớp cha, lớp con và quan hệ kế thừa**

      Bài học đặt nền tảng để nhận biết khi nào một loại đối tượng thực sự là phiên bản chuyên biệt của loại khác. Qua ví dụ nhân viên và phiếu lương, người học học cách phân định hợp đồng chung ở superclass với dữ liệu, cách tính riêng ở subclass; từ đó dùng đa hình mà vẫn giữ đúng kỳ vọng của client. Quan hệ is-a phải được kiểm chứng bằng hành vi thay thế được, không chỉ bằng việc hai lớp có mã giống nhau.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Bản chất quan hệ kế thừa

      1. Trong một cặp lớp, dấu hiệu nào cho thấy lớp con thỏa quan hệ is-a với lớp cha?
      2. Một lần tạo đối tượng lớp con có tạo hai đối tượng độc lập cha và con hay không, và vì sao?
      3. Vì sao có thể gán đối tượng lớp con cho biến kiểu lớp cha nhưng không gọi tùy tiện phương thức chỉ riêng lớp con?

      ### Thiết kế và kiểm chứng

      1. Trong ví dụ tính lương, phần nào thuộc Employee và phần nào thuộc mỗi loại nhân viên cụ thể?
      2. Khi gọi phương thức tính lương qua tham chiếu Employee, điều gì quyết định implementation chạy?
      3. Làm sao phát hiện một mô hình kế thừa sai hợp đồng và nên cân nhắc composition trong trường hợp nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện quan hệ is-a | Giải thích đúng lớp cha, lớp con và chiều extends trong sơ đồ Vehicle/Car hoặc Employee và hai loại nhân viên. |
      | Phân định trách nhiệm lớp | Chỉ ra trạng thái, hành vi chung và công thức tính lương riêng cần đặt tại superclass/subclass. |
      | Dự đoán đa hình | Dự đoán phương thức thực thi khi gọi qua biến kiểu Employee trỏ tới SalariedEmployee hoặc HourlyEmployee. |
      | Đánh giá hợp đồng kế thừa | Phân tích ví dụ Bird/Penguin hoặc trường hợp is-a giả và đề xuất composition khi subclass phá kỳ vọng của client. |
  - slug: inheritance-002
    title: Kế thừa trạng thái và hành vi
    status: WRITTEN
    difficult: BASIC
    focus: Kế thừa trạng thái và hành vi
    problemSolved: State và behavior của cha tồn tại/sử dụng thế nào?
    mechanism: Phân biệt hiện diện state với quyền nhìn thấy nó.
    applicationValue: Giữ dữ liệu chung và invariant trong superclass.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Kế thừa trạng thái và hành vi**

      Bài học giải thích một đối tượng lớp con chứa phần trạng thái do superclass định nghĩa nhưng lớp con không nhất thiết được truy cập trực tiếp từng field. Người học phân biệt việc dùng nguyên hành vi, bổ sung hành vi và override; đồng thời hiểu vì sao method được phân phối động còn field hiding dựa theo kiểu biểu thức. Đây là cơ sở để thiết kế API giữ invariant thay vì phơi bày dữ liệu cho subclass sửa tùy ý.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Trạng thái và hành vi

      1. Vì sao field private của lớp cha vẫn là một phần trạng thái đối tượng lớp con dù mã lớp con không được đọc trực tiếp?
      2. Trong ví dụ Employee/SalesEmployee, phương thức nào được dùng nguyên, phương thức nào được override, và phương thức nào được bổ sung?
      3. Điểm khác nhau giữa field hiding và method overriding khi biến kiểu Parent tham chiếu object Child là gì?

      ### Bảo vệ hợp đồng và triển khai

      1. Vì sao không nên chuyển mọi field chung thành protected chỉ để subclass tiện sử dụng?
      2. Điều kiện nào cho phép override hợp lệ mà vẫn giữ hợp đồng hành vi lớp cha?
      3. Thiết kế Account và lớp con thế nào để phép cập nhật trạng thái luôn qua kiểm tra hợp lệ?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Giải thích cấu trúc object | Vẽ hoặc mô tả đúng phần field của lớp cha và phần field riêng lớp con trong một object duy nhất. |
      | Phân loại hành vi | Phân loại các method của subclass thành kế thừa nguyên, bổ sung, override dựa trên code. |
      | Dự đoán truy cập và dispatch | Dự đoán kết quả ví dụ Parent/Child có field trùng tên và phương thức cùng tên. |
      | Giữ invariant | Đề xuất API có kiểm tra thay cho truy cập trực tiếp protected mutable field. |
  - slug: inheritance-003
    title: Mở rộng hành vi của lớp cha
    status: WRITTEN
    difficult: INTERMEDIATE
