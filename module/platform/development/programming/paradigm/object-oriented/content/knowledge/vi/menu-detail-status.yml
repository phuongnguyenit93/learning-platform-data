    problemSolved: Bỏ extends thế nào mà không phá client và contract?
    mechanism: Refactor từng bước theo hành vi quan sát được.
    applicationValue: Cải thiện phân lớp nghiệp vụ, lưu trữ và khả năng test.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Chuyển thiết kế kế thừa sang kết hợp**

      Bài học hướng dẫn một phép chuyển kiến trúc có kiểm soát khi lớp nghiệp vụ `OrderService` extends lớp lưu trữ `OrderStore` chỉ để dùng lại save/find. Thiết kế mới giao lưu trữ cho `OrderRepository` được truyền vào constructor, còn service giữ API nghiệp vụ và ủy quyền cho repository. Người học không chỉ thay cú pháp extends bằng field: cần kiểm kê caller và subtype assignments, chốt hành vi cùng lỗi, chuyển từng bước, viết fake/integration tests và xử lý thay đổi API trước khi gỡ kế thừa.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Đánh giá quan hệ kế thừa hiện tại

      1. Vì sao OrderService extends OrderStore sai về quan hệ is-a và làm lộ những phương thức hạ tầng nào?
      2. Thiết kế mới phân tách trách nhiệm của OrderService, OrderRepository và InMemoryOrderRepository như thế nào?
      3. Composition + delegation thay cách gọi super.save bằng lời gọi nào mà vẫn giữ trách nhiệm nghiệp vụ?
      4. Khi nào vẫn nên giữ inheritance vì subclass là subtype đúng hoặc framework có hook kế thừa rõ ràng?

      ### Kế hoạch chuyển đổi và kiểm thử

      1. Trước khi bỏ extends, phải rà soát những nơi gán OrderService vào biến OrderStore và những caller dùng method kế thừa nào?
      2. Đầu vào, ngoại lệ, thứ tự gọi, transaction và side effect nào cần được ghi nhận để bảo toàn hành vi?
      3. Vì sao fake repository có thể chứng minh tương tác service nhưng chưa chứng minh transaction và persistence của adapter thật?
      4. Thay protected hook hoặc trạng thái kế thừa cần di chuyển trách nhiệm và bảo toàn invariant bằng cách nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phát hiện kế thừa để mượn code | Chỉ ra dấu hiệu coupling và API không đúng trách nhiệm trong OrderService extends OrderStore. |
      | Thiết kế phiên bản composition | Phác thảo OrderRepository, triển khai in-memory và OrderService nhận repository qua constructor. |
      | Lập kế hoạch migration | Liệt kê caller/subtype usages, hợp đồng và các bước chuyển từng phần trước khi gỡ extends. |
      | Kiểm chứng hành vi | Thiết kế test cho đơn hợp lệ/lỗi, số lần gọi save, dữ liệu lưu và các ca integration cần bảo đảm. |
- slug: relationships
  title: Quan hệ
  childs:
  - slug: relationships-001
    title: Liên kết giữa các đối tượng
    status: WRITTEN
    difficult: BASIC
    focus: Liên kết giữa các đối tượng
    problemSolved: Association nối object nào, đổi link ra sao?
    mechanism: Hỏi object nào thực sự liên kết tại thời điểm chạy.
    applicationValue: Mô hình đúng quan hệ instance, API phân công/chuyển/gỡ.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Liên kết giữa các đối tượng**

      Nắm được association là quan hệ giữa các đối tượng cụ thể và cách biểu diễn mối liên hệ đó trong Java. Thông qua ví dụ Ticket–Agent, người học cần tách bạch tham chiếu, chiều truy cập, số lượng và quyền sở hữu vòng đời, từ đó thay đổi liên kết mà vẫn giữ đúng quy tắc nghiệp vụ.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Bản chất association và liên kết thực tế

      1. Một quan hệ giữa hai lớp khác gì liên kết hiện tại giữa hai object Ticket và Agent; khi đổi người phụ trách thì thành phần nào thay đổi?
      2. Vì sao field `Ticket.assignee` chỉ là tham chiếu mà không chứng minh Agent sở hữu vòng đời Ticket?
      3. Trong sơ đồ Ticket–Agent, bội số `0..1` và `0..*` đặt gần từng đầu phải được đọc như thế nào?

      ### Triển khai và duy trì liên kết

      1. Khi chuyển ticket từ Lan sang Minh trong mô hình hai chiều, `changeAssignee()` cần cập nhật những phía nào và vì sao?
      2. Khi nào chỉ lưu chiều `Ticket → Agent` và dùng repository để truy vấn ngược sẽ phù hợp hơn lưu hai chiều?
      3. Trong trường hợp liên kết Student–Course có ngày đăng ký hoặc trạng thái riêng, vì sao nên xét một đối tượng `Enrollment` thay cho hai Set rời nhau?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện association | Chỉ ra được quan hệ kiểu lớp và các link giữa instance cụ thể trong tình huống phân công Ticket. |
      | Đọc cardinality và navigability | Diễn giải đúng giới hạn `0..1`/`0..*` và đầu nào có thể đi tới đầu nào của quan hệ. |
      | Giữ nhất quán liên kết | Phân tích các bước gỡ link cũ, đổi tham chiếu, thêm link mới khi chuyển người phụ trách. |
      | Lựa chọn chiều lưu trữ | Lý giải khi nào một field liên kết đủ, khi nào mới cần chiều ngược hoặc truy vấn repository. |
      | Bảo vệ API quan hệ | Nhận diện lỗi lộ Set có thể sửa, quy tắc equals/hashCode không ổn định hoặc thiếu đối tượng trung gian cho liên kết có thuộc tính. |
  - slug: relationships-002
    title: Sự phụ thuộc tạm thời và liên kết lâu dài
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Sự phụ thuộc tạm thời và liên kết lâu dài
    problemSolved: Phụ thuộc trong một thao tác khác association lưu trạng thái thế nào?
    mechanism: Hỏi cần một công cụ để làm việc hay một quan hệ phải được lưu.
    applicationValue: Tránh nhầm dependency dịch vụ với trạng thái và vòng đời nghiệp vụ.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Sự phụ thuộc tạm thời và liên kết lâu dài**

      Phân biệt quan hệ sử dụng một cộng tác viên trong một thao tác với association được giữ như một phần trạng thái nghiệp vụ. Bài học giúp lựa chọn tham số phương thức, field, constructor injection và ký hiệu UML phù hợp, đồng thời tránh suy đoán vòng đời object từ phạm vi biến hoặc tên dependency.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Phụ thuộc và liên kết trong mô hình

      1. Giữa `Ticket.assignee` và tham số `MessageSender sender` của thao tác thông báo, quan hệ nào là trạng thái nghiệp vụ và quan hệ nào phục vụ hành vi tại thời điểm gọi?
      2. Đường dependency nét đứt và association nét liền trên UML truyền đạt thông tin khác nhau ra sao?
      3. Vì sao sau khi `notifyAssignee()` kết thúc không thể suy ra `ConsoleSender` đã bị GC thu gom?

      ### Lựa chọn cộng tác viên và kiểm thử

      1. Khi `NotificationService` được inject `MessageSender` qua constructor và giữ field, vì sao vẫn tồn tại dependency về thiết kế dù tham chiếu được lưu lâu?
      2. Những câu hỏi nào về nhu cầu truy vấn về sau, trạng thái miền nghiệp vụ và chi phí truyền tham số giúp chọn tham số, field hoặc repository?
      3. Kiểm thử một dependency dùng trong thao tác và kiểm thử association đổi người phụ trách qua nhiều thao tác khác nhau ở những điểm nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân loại quan hệ từ code | Phân biệt method-level dependency của sender với association giữa ticket và người phụ trách. |
      | Đọc biểu diễn UML | Chỉ đúng hướng của mũi tên dependency và đường liền biểu thị liên kết có trạng thái. |
      | Đánh giá constructor injection | Giải thích một field được tiêm có thể là phụ thuộc dịch vụ, không tự trở thành quan hệ sở hữu nghiệp vụ. |
      | Lựa chọn nơi giữ tham chiếu | Thiết kế việc truyền cộng tác viên qua tham số hoặc lưu liên kết theo yêu cầu sử dụng qua nhiều lần gọi. |
      | Viết kiểm thử có mục tiêu | Nêu assertion khác nhau cho fake sender được gọi đúng và việc Ticket duy trì/gỡ association đúng sau thao tác. |
  - slug: relationships-003
    title: Tập hợp và hợp thành
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Tập hợp và hợp thành
    problemSolved: Khi nào part thuộc riêng một whole?
    mechanism: Hỏi ai là chủ và part có tồn tại độc lập không.
    applicationValue: Bảo vệ ownership và tránh xóa nhầm phần tử chia sẻ.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Tập hợp và hợp thành**

      Đọc đúng quan hệ toàn thể–bộ phận: aggregation nhóm những thành phần có thể độc lập, còn composition gắn part với một owner theo hợp đồng miền nghiệp vụ. Qua Team–Employee và Order–LineItem, người học xác định quyền sở hữu, giới hạn chia sẻ, thao tác xóa/chuyển và ranh giới với GC hoặc cascade của JPA.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Ý nghĩa ownership và vòng đời

      1. Vì sao một field `List` hoặc lệnh `new` không đủ chứng minh aggregation hay composition, và câu hỏi nghiệp vụ nào phải được trả lời trước?
      2. Trong Team–Employee, thao tác xóa nhóm hoặc loại thành viên khác gì xóa Order có các LineItem thuộc riêng đơn hàng?
      3. Trong UML, hình thoi rỗng và đặc nằm ở phía nào, và composition ràng buộc một part với bao nhiêu composite tại cùng thời điểm?

      ### Cài đặt và persistence

      1. Làm sao API của Order ngăn LineItem bị gắn đồng thời vào hai đơn và không lộ collection có thể chỉnh sửa trực tiếp?
      2. Vì sao `CascadeType.REMOVE` hoặc `orphanRemoval` chỉ phù hợp khi chính quy tắc domain yêu cầu xóa part, đặc biệt với nhân viên được nhiều nhóm dùng chung?
      3. Kiểm thử những hành vi nào để phân biệt sự tồn tại độc lập của Employee với vòng đời thuộc một Order của LineItem?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân tích whole–part | Dựa vào khả năng tồn tại độc lập, chia sẻ và đổi chủ để chọn aggregation, composition hoặc association thường. |
      | Đọc ký pháp UML | Đặt đúng hình thoi rỗng/đặc ở phía whole và phát biểu hạn chế ownership của part. |
      | Thiết kế composition | Mô tả API Order tạo, sửa, xóa LineItem qua owner và từ chối trạng thái không hợp lệ. |
      | Tránh xóa nhầm entity chia sẻ | Đánh giá nguy cơ cascade REMOVE, orphanRemoval trên Team–Employee so với Order–LineItem. |
      | Kiểm chứng hợp đồng vòng đời | Đề xuất test xóa thành viên không xóa Employee, và test LineItem độc quyền, kiểm tra dữ liệu khi xóa Order theo chính sách. |
  - slug: relationships-004
    title: 'Số lượng: một-một, một-nhiều và nhiều-nhiều'
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: 'Số lượng: một-một, một-nhiều và nhiều-nhiều'
    problemSolved: 1–1, 1–N, N–N ràng buộc số lượng nào?
    mechanism: Hỏi mỗi A có bao nhiêu B và mỗi B có bao nhiêu A.
    applicationValue: Cưỡng chế số lượng, duy nhất và luật của liên kết trung gian.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Số lượng: một-một, một-nhiều và nhiều-nhiều**

      Xác định bội số hợp lệ ở cả hai đầu quan hệ thay vì suy từ kiểu field hay collection. Bài học hướng dẫn mô hình 1–1, 1–N và N–N, lựa chọn association object/registry cho lần đăng ký có dữ liệu riêng, đồng thời bảo vệ các ràng buộc về null, số lượng, danh tính và chuyển liên kết.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Đọc bội số và ràng buộc

      1. Với UML `Department "1" -- "0..*" Employee`, mỗi ký hiệu ở một đầu nói gì về số đối tượng ở đầu đó cho một object phía đối diện?
      2. Trường hợp 1–1 bắt buộc khác `0..1` thế nào, và vì sao khai báo `Profile profile` không tự bảo vệ tính duy nhất trên toàn hệ thống?
      3. Vì sao `List<Task>` không cho biết quan hệ là 1–N hay N–N nếu chưa xét đầu Task → Project?

      ### Chọn cấu trúc và bảo vệ invariant

      1. Trong mô hình Student–Course N–N, cách `EnrollmentRegistry` ngăn một cặp ID đăng ký trùng ra sao và giới hạn gì khi demo chỉ chạy trong bộ nhớ?
      2. Khi bản thân lần đăng ký có `status`, `grade`, `enrolledOn`, vì sao lớp Enrollment biểu diễn rõ hơn hai Set phản chiếu?
      3. Với Team phải có 1 đến 5 thành viên không trùng ID, thao tác thêm, xóa và khởi tạo cần từ chối tình huống nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Dịch yêu cầu thành multiplicity | Điền đúng `1`, `0..1`, `0..*`, `1..*`, khoảng min..max ở từng đầu trên sơ đồ. |
      | Phân biệt các kiểu quan hệ | Diễn đạt số lượng hợp lệ cho 1–1, 1–N, N–N và tách khỏi ownership/navigability. |
      | Thiết kế biểu diễn N–N | Lựa chọn registry hoặc Enrollment làm lớp trung gian khi quan hệ có định danh và thuộc tính riêng. |
      | Cưỡng chế giới hạn cardinality | Đề xuất invariant và thao tác thêm/gỡ/chuyển bảo vệ tính duy nhất, tối thiểu/tối đa và null. |
      | Kiểm tra tình huống nghiệp vụ | Phân tích kết quả đăng ký trùng, Team vượt sức chứa hoặc xóa thành viên cuối cùng theo chính sách đã định. |
  - slug: relationships-005
    title: Hướng liên kết và khả năng điều hướng
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Hướng liên kết và khả năng điều hướng
    problemSolved: Đứng ở một object có thể đi tới đầu kia theo chiều nào?
    mechanism: Hỏi truy vấn cần đi từ phía nào và có cần field ngược không.
    applicationValue: Giảm trạng thái lưu dư và tránh thêm chiều liên kết vô cớ.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Hướng liên kết và khả năng điều hướng**

      Xác định đối tượng cần truy cập trực tiếp từ phía nào của association và chỉ lưu đường đi đáp ứng truy vấn nghiệp vụ. Thông qua Order–Customer và Team–Member, bài học làm rõ navigability độc lập với multiplicity/ownership, chi phí lưu liên kết hai chiều và khả năng dùng repository để tìm phía ngược.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hướng điều hướng và UML

      1. Khác biệt giữa association, multiplicity và navigability trong quan hệ Order–Customer là gì?
      2. Vì sao mũi tên liên kết từ Order tới Customer không có nghĩa dữ liệu chỉ chạy một chiều hoặc Customer được tạo sau Order?
      3. Khi sơ đồ UML không ghi mũi tên association, vì sao không nên mặc định đó chắc chắn là quan hệ hai chiều?

      ### Thiết kế object graph

      1. Nếu Order biết Customer nhưng Customer không giữ các Order, màn hình lịch sử mua hàng có thể tìm đơn bằng cách nào?
      2. Khi Team và Member đều cần tìm nhau, những thay đổi nào phải diễn ra trong một thao tác chuyển nhóm để hai phía nhất quán?
      3. Vì sao việc bổ sung chiều ngược làm tăng chi phí bảo trì, khả năng chu trình tham chiếu và lỗi serialize dù không nhất thiết làm đổi multiplicity?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Đọc đường điều hướng | Phân tích chiều mũi tên association, nhãn bội số và khả năng truy cập trực tiếp từ từng object. |
      | Chọn đồ thị tham chiếu tối giản | Lý giải khi nào `Order.customer` đủ và chiều ngược nên đặt ở repository/query service. |
      | Thiết kế hai chiều khi cần | Xác định cổng cập nhật Team–Member và các bước đồng bộ khi thêm, gỡ, chuyển. |
      | Phân biệt UML dependency | Chỉ ra mũi tên dependency nét đứt khác mũi tên navigability trên đường association liền. |
      | Phát hiện lỗi do lưu dư | Nhận diện collection mutable, hai setter gọi ngược, JSON recursion và ngộ nhận JPA mappedBy tự đồng bộ. |
  - slug: relationships-006
    title: Quan hệ hai chiều và giữ dữ liệu nhất quán
    status: WRITTEN
    difficult: ADVANCED
    focus: Quan hệ hai chiều và giữ dữ liệu nhất quán
    problemSolved: Làm sao giữ hai chiều cùng phản ánh một quan hệ khi có thay đổi/lỗi?
    mechanism: Hỏi invariant hai phía và ranh giới cập nhật là gì.
    applicationValue: Ngăn object graph/JPA lệch dữ liệu hoặc cập nhật nửa chừng.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Quan hệ hai chiều và giữ dữ liệu nhất quán**

      Bảo vệ invariant khi hai object giữ thông tin về cùng một mối liên kết, kể cả lúc thêm, chuyển và hủy phân công. Bài học dùng Employee–Department để tổ chức cổng cập nhật duy nhất, kiểm tra trước khi sửa, giữ trạng thái cũ khi thất bại và đối chiếu owning side JPA với quyền quản lý nghiệp vụ.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Bất biến và thao tác thay đổi

      1. Với `Employee.department` và `Department.employees`, invariant nào phải đúng ở cả hai phía sau mỗi thao tác?
      2. Khi chuyển nhân viên từ A sang B, vì sao phải kiểm tra sức chứa B trước ba bước gỡ A, đổi tham chiếu và thêm B?
      3. Tại sao hai setter độc lập, getter trả Set có thể sửa hoặc hai helper gọi ngược vô điều kiện dễ gây lệch dữ liệu hoặc đệ quy vô hạn?

      ### JPA, lỗi và kiểm thử

      1. Trong JPA/Hibernate, owning side của khóa ngoại khác domain owner giữ invariant ở điểm nào và `mappedBy` có tự cập nhật hai phía object graph không?
      2. Khi thay đổi liên kết gặp lỗi nghiệp vụ hoặc có hai request cạnh tranh, cần giữ trạng thái ban đầu và xét transaction/đồng bộ ra sao?
      3. Vì sao test cần kiểm tra cả hai phía sau ca thành công/thất bại và dùng `flush`, `clear`, reload trước khi kết luận dữ liệu DB đã lưu đúng?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phát biểu invariant hai chiều | Viết điều kiện tương đương giữa tham chiếu `Employee.department` và membership trong `Department.employees`. |
      | Thiết kế cổng cập nhật duy nhất | Mô phỏng `moveTo` idempotent, xác thực trước, gỡ cũ, gán mới và thêm mới đúng thứ tự. |
      | Đóng gói collection | Phân biệt immutable view live và snapshot, ngăn caller phá trạng thái qua getter. |
      | Phân tích owning side JPA | Xác định phía ghi khóa ngoại, phía `mappedBy`, và yêu cầu đồng bộ cả object graph trong transaction. |
      | Kiểm thử tính nhất quán | Nêu các assertion cho thêm/chuyển/gỡ, lỗi phòng đầy, dữ liệu sau flush/reload và giới hạn test đơn luồng. |
      | Nhận biết điểm nguy hiểm | Phát hiện hashCode phụ thuộc field mutable, JSON recursion, cascade xóa sai hoặc cập nhật thiếu khóa đồng thời. |
  - slug: relationships-007
    title: Vòng phụ thuộc và cách phá vòng
    status: WRITTEN
    difficult: ADVANCED
    focus: Vòng phụ thuộc và cách phá vòng
    problemSolved: Vòng thiết kế, wiring, runtime xuất hiện và được phá thế nào?
    mechanism: Vẽ đồ thị cạnh có hướng, tìm trách nhiệm sai và kiểm tra sau refactor.
    applicationValue: Giảm coupling và lỗi khởi tạo, giữ luồng nghiệp vụ kiểm thử được.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Vòng phụ thuộc và cách phá vòng**

      Phân tích đồ thị phụ thuộc ở cấp lớp, luồng gọi, Spring bean, package và module để tìm chu trình thực sự gây coupling hoặc lỗi khởi tạo. Bài học hướng dẫn phá vòng theo trách nhiệm bằng coordinator, policy chung, Dependency Inversion hoặc event có ranh giới rõ; sau đó xác nhận hành vi và đồ thị đã đổi.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Nhận diện đúng loại chu trình

      1. Vòng `OrderService → ShippingService → OrderService` có thể gây những rủi ro riêng nào về constructor wiring, lời gọi runtime, test và transaction?
      2. Vì sao `Parent ↔ Child` trong object graph không mặc nhiên là lỗi thiết kế hoặc memory leak, khác với vòng module/build và vòng gọi đệ quy?

      ### Refactor theo trách nhiệm

      1. Thiết kế `CheckoutCoordinator` dùng `OrderRepository` và `ShippingGateway` một chiều chuyển trách nhiệm orchestration ra khỏi cặp service thế nào?
      2. Khi nào nên trích `DiscountPolicy` dùng chung, đưa interface về tầng domain hoặc phát `OrderPlaced` thay cho lời gọi trực tiếp?
      3. Vì sao `@Lazy`, `ObjectProvider` hay setter injection có thể chỉ trì hoãn lỗi bean cycle, và làm sao kiểm tra vòng runtime thực sự đã được phá?

      ### Kiểm chứng giới hạn vận hành

      1. Nếu lưu order thành công nhưng gọi shipping hoặc gửi event thất bại, transaction, retry/idempotency và transactional outbox giải quyết khía cạnh nào?
      2. Làm sao kiểm tra lại cả đồ thị build/import, wiring Spring và thứ tự tương tác nghiệp vụ thay vì chỉ thử ứng dụng khởi động?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân loại các dạng vòng | Phân biệt directed dependency cycle, constructor cycle, runtime recursion, object reference cycle và project/module cycle. |
      | Vẽ lại luồng cộng tác | Chuyển Order–Shipping thành coordinator với các cổng độc lập không gọi ngược. |
      | Chọn kỹ thuật phá vòng | Giải thích theo tình huống việc trích policy, dependency inversion hay domain event phù hợp hơn. |
      | Phân tích hậu quả vận hành | Nhận diện cần transaction boundary, retry, outbox và idempotency khi chia cắt luồng xử lý. |
      | Kiểm thử sau refactor | Đề xuất kiểm tra thứ tự save/request shipment, wiring context và không tái xuất hiện chu trình ở nhiều cấp. |
      | Đánh giá giải pháp tạm | Nêu vì sao trì hoãn bean bằng `@Lazy` không sửa một vòng gọi logic vốn tồn tại. |
  - slug: relationships-008
    title: Đọc ký hiệu quan hệ trong sơ đồ lớp
    status: WRITTEN
    difficult: BASIC
    focus: Đọc ký hiệu quan hệ trong sơ đồ lớp
    problemSolved: Mỗi loại nét, đầu mũi tên, hình thoi, bội số trong UML nghĩa là gì?
    mechanism: Đọc kết hợp nét, đầu đường, bội số, role và đối chiếu với Java.
    applicationValue: Đọc và truyền đạt mô hình lớp chính xác trước khi viết code.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Đọc ký hiệu quan hệ trong sơ đồ lớp**

      Đọc sơ đồ lớp UML như một bản mô tả hợp đồng giữa các kiểu thay vì đoán theo một dấu mũi tên. Bài học tích hợp sáu ký hiệu association, dependency, aggregation, composition, generalization, realization cùng bội số, chiều điều hướng, tên vai trò và cách hiện thực tương ứng trong Java.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Nhận diện ký hiệu quan hệ

      1. Đường liền, nét đứt, mũi tên mở, tam giác rỗng, hình thoi rỗng và hình thoi đặc khác nhau thế nào khi nhận diện sáu quan hệ UML?
      2. Vì sao tam giác rỗng trên đường liền trỏ tới superclass khác tam giác rỗng trên nét đứt trỏ tới interface?
      3. Đọc `0..1`, `0..*`, `1..*` ở hai đầu sơ đồ bằng cách nào để không đảo ngược số lượng?

      ### Đọc trọn sơ đồ rồi đối chiếu Java

      1. Trong mô hình Order–Customer, Order–OrderLine và CheckoutService–PaymentGateway, mỗi quan hệ gợi ý field, ownership, dependency hay `implements` nào?
      2. Vì sao không thể kết luận quyền sở hữu hoặc lệnh xóa Java chỉ từ `List<Child>`, và hình thoi phải được đặt bên whole ra sao?
      3. Ý nghĩa của `+`, `-`, `#`, `~`, static gạch dưới, abstract in nghiêng và các constraint `{ordered}`/`{unique}` khi đối chiếu bản vẽ với Java là gì?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân loại ký hiệu UML | Gọi đúng tên và ý nghĩa của sáu loại đường nối bằng đặc điểm nét, mũi tên và hình thoi. |
      | Đọc đúng điểm đặt bội số | Diễn giải các nhãn cardinality từ góc nhìn object phía đối diện. |
      | Đối chiếu UML với Java | Phác thảo field, tham số, extends, implements hoặc API owner từ từng loại quan hệ trong sơ đồ mẫu. |
      | Giải thích các ràng buộc | Phân biệt role name, visibility, static/abstract, ordered/unique và điều kiện phải được code cưỡng chế. |
      | Phát hiện suy luận sai | Chỉ ra tại sao đường association không mũi tên có thể chưa xác định navigability và vì sao composition không có nghĩa JVM tự xóa part. |
- slug: class-design
  title: Thiết kế lớp
  childs:
  - slug: class-design-001
    title: Xác định trách nhiệm của từng lớp
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Xác định trách nhiệm của từng lớp
    problemSolved: Ai sở hữu từng invariant, policy và workflow?
    mechanism: Đi từ use case tới trách nhiệm
    applicationValue: Giữ một owner cho mỗi quy tắc
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Xác định trách nhiệm của từng lớp**

      Thiết kế OOP bắt đầu từ việc xác định mỗi lớp phải biết gì, làm gì và chịu tác động của những loại thay đổi nào. Bài học giúp đi từ use case tới một bản đồ trách nhiệm rõ, tránh một lớp ôm SQL, quy tắc nghiệp vụ, giao diện và thông báo.

      Ví dụ mượn sách phân biệt BookCopy, Loan, LoanPolicy, LoanRepository và LoanService. Người học nhận ra nơi có đủ dữ liệu để bảo vệ invariant, cách dùng CRC Card để kiểm tra cộng tác viên và vì sao phân chia đúng vẫn cần transaction khi mượn sách đồng thời.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Xác lập trách nhiệm và ranh giới

      1. Trách nhiệm knowing và doing khác danh sách phương thức của class như thế nào?
      2. Trong use case mượn bản sách, ai sở hữu điều kiện hạn trả, giới hạn mượn, trạng thái lượt mượn và nơi lưu dữ liệu?
      3. Vì sao SRP được đánh giá theo lý do thay đổi của một nhóm trách nhiệm thay vì đếm số method?
      4. Khi tạo CRC Card cho LoanService và LoanPolicy, dấu hiệu nào cho biết hai lớp đang giữ cùng một quy tắc?

      ### Điều phối, kiểm thử và thay đổi

      1. Vì sao LoanService hỏi repository và policy rồi tạo Loan thay vì tự chạy SQL, tự tính hạn trả hoặc chỉnh trạng thái nội bộ?
      2. Nếu chuyển lưu trữ từ LinkedHashMap sang SQL, thành phần nào phải đổi và thành phần nào nên giữ nguyên?
      3. Làm thế nào test chính sách hạn trả bằng Clock cố định mà không cần truy cập database?
      4. Vì sao chuỗi kiểm tra số lượt mượn rồi save trong ví dụ chưa bảo đảm nguyên tử khi nhiều request chạy đồng thời?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Lập bản đồ trách nhiệm | Liệt kê đúng owner của dữ liệu, invariant, quy tắc, orchestration và persistence từ một yêu cầu mượn sách. |
      | Áp dụng SRP và Information Expert | Giải thích vị trí của Loan, LoanPolicy và LoanService theo lý do thay đổi và nơi có đủ thông tin. |
      | Mô tả cộng tác bằng CRC | Viết thẻ Class–Responsibilities–Collaborators cho các lớp chính và phát hiện lớp đang gánh việc ngoài phạm vi. |
      | Thiết kế hợp đồng lớp | Đề xuất constructor và API mượn sách có validation, bảo vệ trạng thái và chỉ công bố hành vi cần thiết. |
      | Kiểm thử riêng từng trách nhiệm | Tạo tình huống thiếu bản sách, vượt giới hạn, ngày trả không hợp lệ và chỉ ra test phù hợp từng owner. |
      | Đánh giá biên concurrency | Giải thích điểm kiểm tra–ghi không nguyên tử và ranh giới khóa/giao dịch cần có khi triển khai thật. |
  - slug: class-design-002
    title: Tính gắn kết bên trong lớp
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Tính gắn kết bên trong lớp
    problemSolved: Các field/method có phục vụ cùng trách nhiệm không?
    mechanism: Đánh giá ngữ nghĩa nội bộ thay vì kích cỡ
    applicationValue: Gom invariant và thay đổi có liên quan
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Tính gắn kết bên trong lớp**

      Bài học rèn cách nhận diện tính gắn kết của field, method và invariant trong cùng một lớp. Khi một class vừa tính tiền, ghi kho dữ liệu và gửi biên nhận, các yêu cầu không liên quan vẫn buộc sửa cùng class và khiến phép tính đơn giản khó kiểm thử.

      Qua LegacyCheckoutService và CohesionDemo, người học tách Cart, OrderRepository, ReceiptSender và CheckoutService theo trách nhiệm. Bài học cũng giải thích giới hạn của LCOM, ma trận method–field và vì sao coordinator có nhiều cộng tác viên vẫn có thể cohesive.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Phân tích nội bộ lớp

      1. Cohesion cao khác với việc lớp có ít method hoặc mọi method cùng đọc một field như thế nào?
      2. Vì sao LegacyCheckoutService được xem là gắn kết thấp khi tính tổng, lưu đơn và gửi email trong một class?
      3. Ma trận method × field giúp phát hiện những nhóm trách nhiệm độc lập nào và vì sao nó chưa đủ để kết luận về nghiệp vụ?
      4. Tại sao phải ghi rõ biến thể LCOM hoặc công cụ đo khi dùng metric để đánh giá lớp?

      ### Refactor có kiểm soát

      1. Trong CohesionDemo, vì sao Cart vẫn giữ addLine, total, isEmpty và snapshot cùng một lớp?
      2. CheckoutService gọi repository và sender theo một workflow thì có phải thiếu cohesion không?
      3. Khi tách class, làm thế nào giữ bất biến của Cart và tránh đưa danh sách mutable cho caller?
      4. Những giới hạn nào về snapshot/total đồng thời, lỗi gửi biên nhận và transaction vẫn cần xử lý sau khi tách đúng trách nhiệm?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Chẩn đoán cohesion | Đánh giá một class theo mục tiêu, invariant và các nhóm lý do thay đổi, không dựa vào số dòng. |
      | Phân tích method và field | Tạo ma trận method–field, phát hiện cụm độc lập và đối chiếu lại với trách nhiệm nghiệp vụ. |
      | Tổ chức lại lớp đa trách nhiệm | Đề xuất Cart, repository, sender và coordinator với API ngắn, rõ và phân chia đúng thay đổi. |
      | Kiểm thử hành vi sau refactor | Kiểm tra Cart.total, validation, snapshot và thứ tự save → send qua fake mà không khởi động I/O thật. |
      | Cân bằng cohesion với coupling | Phát hiện trường hợp tách quá nhiều lớp chỉ chuyển tiếp lời gọi khiến số phụ thuộc tăng vô ích. |
      | Nêu rủi ro ngoài phạm vi cohesion | Chỉ ra transaction, tính nguyên tử thông báo và thread safety cần giải quyết riêng. |
  - slug: class-design-003
    title: Mức phụ thuộc giữa các lớp
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Mức phụ thuộc giữa các lớp
    problemSolved: Chi tiết thay đổi ở class khác lan truyền đến đâu?
    mechanism: Hướng vào hợp đồng ổn định
    applicationValue: Thay provider/test không kéo sửa business logic
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Mức phụ thuộc giữa các lớp**

      Bài học giúp nhận diện những phụ thuộc ở mức mã nguồn, runtime và thay đổi nghiệp vụ. Một CheckoutService tự tạo CardProcessor, SmtpMailer, biết endpoint và định dạng bên ngoài sẽ khó thay provider và khó chạy test an toàn.

      Thông qua PaymentGateway, ReceiptSender và constructor injection, người học giảm phụ thuộc vào chi tiết dễ đổi mà vẫn giữ hợp đồng nghiệp vụ cần thiết. Các ví dụ còn phân biệt DIP với DI, một interface có ích với một facade lộ SDK, coupling theo event và chi phí xử lý lỗi phân tán.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Bản chất và loại phụ thuộc

      1. Phụ thuộc mã nguồn, runtime và change coupling có thể khác nhau thế nào đối với CheckoutService?
      2. Tại sao số import ít hoặc có sẵn interface chưa chứng minh coupling thấp?
      3. Data coupling, control coupling, stamp coupling và external coupling tạo những rủi ro nào khi hợp đồng bị thiết kế quá rộng?
      4. Fan-in, fan-out, CBO và chu trình package giúp tìm điểm cần review nhưng có giới hạn gì?

      ### Cách ly biến động và kiểm thử

      1. Vì sao truyền PaymentGateway và ReceiptSender qua constructor giúp test checkout bằng fake?
      2. DIP khác DI thế nào, và một constructor nhận lớp concrete đã chắc tuân DIP chưa?
      3. Làm sao chứng minh gửi biên nhận không xảy ra nếu gateway ném lỗi trước khi thanh toán thành công?
      4. Vì sao payment thành công nhưng gửi biên nhận lỗi vẫn cần trạng thái, retry/idempotency dù đã giảm coupling?
      5. Thông điệp qua event broker còn phụ thuộc những yếu tố nào dù hai module không import nhau?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện coupling thực | Vẽ phụ thuộc CheckoutService với provider/SMTP và chỉ ra nơi biết chi tiết, nơi bị ảnh hưởng khi provider thay đổi. |
      | Thiết kế contract ổn định | Đề xuất PaymentGateway.charge và ReceiptSender.send theo hành vi thay vì bê nguyên các bước SDK vào interface. |
      | Áp dụng DI và DIP có lý do | Chuyển khởi tạo dependency ra khỏi service và phân biệt cơ chế inject với hướng phụ thuộc vào abstraction. |
      | Kiểm thử thay thế collaborator | Dùng fake ghi nhận orderId, amountCents, email và paymentId để xác minh đúng checkout. |
      | Đánh giá coupling module | Nhận diện chu trình import, dependency theo schema event và đề xuất ranh giới contract phù hợp. |
      | Phân tích tác dụng phụ khi lỗi | Giải thích rủi ro thanh toán thành công nhưng thông báo thất bại và yêu cầu retry/idempotency. |
  - slug: class-design-004
    title: Tách dữ liệu, nghiệp vụ và tương tác bên ngoài
    status: WRITTEN
    difficult: ADVANCED
    focus: Tách dữ liệu, nghiệp vụ và tương tác bên ngoài
    problemSolved: Domain, use case và I/O được phân ranh thế nào?
    mechanism: Thiết kế theo ranh giới thay đổi
    applicationValue: Cô lập HTTP/DB/email khỏi domain
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Tách dữ liệu, nghiệp vụ và tương tác bên ngoài**

      Một luồng checkout có thể cùng nhận dữ liệu, tính tiền, lưu đơn và gửi thông báo. Bài học phân chia request DTO, domain entity/value object, policy, application service, port và adapter để mỗi phần giữ một trách nhiệm có thể kiểm chứng.

      Ví dụ SeparationOfConcernsDemo tạo OrderLine có validation, Order bảo vệ tổng tiền, StandardPricingPolicy áp SAVE10, CheckoutService điều phối, còn repository/gateway cung cấp I/O. Người học cũng nhận biết rủi ro lưu đơn thành công nhưng gửi receipt thất bại và phạm vi thực tế của transaction/outbox.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Định vị các thành phần

      1. Request DTO, OrderLine, Order, PricingPolicy, CheckoutService, repository port và adapter đảm nhận những trách nhiệm khác nhau nào?
      2. Vì sao tách dữ liệu khỏi I/O không có nghĩa đẩy toàn bộ hành vi của entity vào service?
      3. Lỗi SKU rỗng, quantity không dương và tổng tiền tràn số nên bị chặn ở những thành phần nào?
      4. Vì sao một class domain tự gọi JDBC hoặc SMTP làm sai ranh giới phụ thuộc?

      ### Kiểm thử và tính nhất quán khi tích hợp

      1. SAVE10 được áp dụng và làm tròn theo đơn vị cent thế nào trong ví dụ tính 315.00 thành 283.50?
      2. Tại sao mã ưu đãi không hỗ trợ phải bị từ chối trước khi gọi repository.save và gửi biên nhận?
      3. Nếu save thành công rồi gateway lỗi, vì sao @Transactional trên DB không hoàn tác được SMTP?
      4. Outbox, retry và idempotency hỗ trợ bảo đảm gì, và vì sao chúng vẫn tạo eventual consistency?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân nhóm trách nhiệm | Phân loại từng kiểu trong checkout thành input DTO, domain, policy, application, port hoặc I/O adapter. |
      | Bảo vệ domain invariant | Xác định nơi validate dòng hàng, tính subtotal bằng Math.addExact và từ chối policy trả số tiền không hợp lệ. |
      | Thiết kế luồng phụ thuộc | Vẽ controller → command → service → domain/port → adapter và chỉ rõ hướng phụ thuộc mã nguồn. |
      | Kiểm chứng kết quả giá | Tính tay tổng và giảm SAVE10 theo cent, đối chiếu với ví dụ Java 17. |
      | Test workflow không cần I/O | Dùng fake repository/gateway để chứng minh không lưu/gửi khi dữ liệu hoặc khuyến mãi sai. |
      | Thiết kế xử lý lỗi sau lưu | Đề xuất thông báo sau commit bằng outbox, cách retry và trạng thái đơn được lưu đúng. |
  - slug: class-design-005
    title: Đặt tên lớp, thuộc tính và phương thức
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Đặt tên lớp, thuộc tính và phương thức
    problemSolved: Tên nào phản ánh nghĩa, đơn vị và side effect?
    mechanism: Đặt tên như một lời cam kết
    applicationValue: Giảm hiểu sai API và lỗi rename/mapping
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Đặt tên lớp, thuộc tính và phương thức**

      Đặt tên là một phần của hợp đồng OOP. Người đọc cần đoán được class chịu trách nhiệm gì, field biểu diễn dữ liệu và đơn vị nào, method đang truy vấn hay gây tác dụng phụ gì mà không phải mở ngay phần thân.

      Bài học sử dụng ShoppingCart, CartSnapshot, CheckoutService và OrderRepository để minh họa convention Java, tính trung thực của insert/findById, khả năng đọc tên boolean và dữ liệu đơn vị rõ. Người học còn xét giới hạn JavaBeans/record/JSON/JPA khi rename public API để tránh làm hỏng client, mapping hoặc binary compatibility.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Tên theo trách nhiệm và ngữ nghĩa

      1. Vì sao DataManager.process(x) và flag khiến người dùng phải đoán trách nhiệm và trạng thái?
      2. Quy tắc UpperCamelCase, lowerCamelCase và UPPER_SNAKE_CASE dùng cho các thành phần Java nào?
      3. Tại sao remainingSeats, balanceCents và retryDelayMillis an toàn hơn number, balance hoặc delay thiếu đơn vị?
      4. findById, requireById, insert, createOrder và placeOrder cần mô tả các ngữ nghĩa khác nhau nào?
      5. Vì sao một getter có tác dụng phụ hoặc gọi mạng không được coi là truy vấn rẻ chỉ vì tên bắt đầu bằng get?

      ### Thiết kế API và đổi tên

      1. ShoppingCart.snapshot() và OrderRepository.insert() trong NamingDemo nói gì về bất biến dữ liệu và trùng orderId?
      2. Vì sao record accessor là customerId() thay vì getter JavaBeans mặc định getCustomerId()?
      3. Tại sao đổi tên getter, field hoặc API public có thể ảnh hưởng JSON, JPA, reflection, Spring và client nhị phân?
      4. Khi đổi createOrder thành placeOrder, cần kiểm tra usage, contract, migration và phép thử nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Chọn tên Java đúng convention | Đặt tên class/interface/record, method, field, parameter, enum và hằng số theo quy ước phù hợp. |
      | Làm rõ ý nghĩa dữ liệu | Đổi những tên mơ hồ sang tên có domain, đơn vị và trạng thái như balanceCents hay registrationClosed. |
      | Diễn đạt tác động API | Phân biệt find/require, insert/upsert, get/fetch và create/enqueue theo kết quả hoặc side effect được cam kết. |
      | Thiết kế mô hình có tên nhất quán | Đọc và sửa API ShoppingCart–CartSnapshot–CheckoutService để caller hiểu trách nhiệm, snapshot và duplicate ID. |
      | Review ranh giới framework | Phân biệt record accessor với JavaBeans và chỉ ra nguy cơ đổi tên với JSON/JPA/reflection. |
      | Lập kế hoạch rename an toàn | Liệt kê caller, contract, IDE rename, wrapper deprecated, test và vấn đề source/binary compatibility. |
  - slug: class-design-006
    title: Đối tượng thực thể, đối tượng giá trị và dịch vụ
    status: WRITTEN
    difficult: ADVANCED
    focus: Đối tượng thực thể, đối tượng giá trị và dịch vụ
    problemSolved: Phân biệt đối tượng bằng identity, value hay behavior?
    mechanism: Phân biệt danh tính với giá trị
    applicationValue: Đặt equality và domain rules đúng chủ thể
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Đối tượng thực thể, đối tượng giá trị và dịch vụ**

      Bài học giúp lựa chọn class theo ý nghĩa nghiệp vụ: Entity có danh tính ổn định qua thay đổi, Value Object bằng nhau theo giá trị và thường bất biến, Service chứa quy tắc phối hợp không thuộc tự nhiên về một đối tượng đơn lẻ.

      Ví dụ Account, Money và TransferService làm rõ UUID của Account, Currency và minorUnits của Money, chuyển tiền qua hai entity. Bài cũng phân biệt Domain Service với Application Service và cảnh báo không đồng nhất @Entity/@Service của framework với vai trò miền hoặc coi thao tác in-memory như giao dịch ngân hàng nguyên tử.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Định danh, equality và bất biến

      1. Vì sao hai Account có cùng số dư chưa chắc là cùng Entity, trong khi hai Money cùng minorUnits/currency có thể bằng nhau?
      2. Khi Account đổi số dư mà UUID giữ nguyên, điều gì khiến nó vẫn là cùng một thực thể?
      3. Tại sao hashCode dựa trên thuộc tính có thể thay đổi có thể làm hỏng việc tìm object trong HashSet?
      4. Record có equals theo thành phần nhưng vì sao không mặc nhiên bảo đảm deep immutability?
      5. Money.plus và Money.minus phải kiểm tra currency, dấu tiền và tràn số như thế nào?

      ### Phân vai hành vi và transaction

      1. Account.withdraw và Money.plus nên giữ quy tắc nào, còn TransferService cần phối hợp hai Account ra sao?
      2. Domain Service khác Application Service ở phạm vi quy tắc, repository, quyền và transaction như thế nào?
      3. Vì sao hai lần save Account riêng không tự thành một giao dịch nguyên tử?
      4. @Entity trong JPA và @Service trong Spring có tự quyết định class là Domain Entity hoặc Domain Service không?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân biệt ba vai trò | Phân loại Account, Money, TransferService và DTO theo danh tính, giá trị hoặc hành vi phối hợp. |
      | Thiết kế entity equality | Lập quy tắc identity theo UUID và nêu ngoại lệ khi ID do database cấp muộn hoặc có proxy JPA. |
      | Tạo Value Object bất biến | Đề xuất Money bằng minorUnits/Currency, dùng equals theo thành phần và phép toán phát hiện tràn. |
      | Bảo vệ số dư trong Entity | Chỉ rõ Account.deposit/withdraw kiểm tra số dương, cùng loại tiền và số dư không âm. |
      | Đặt service đúng tầng | Tách luật chuyển giữa hai account khỏi việc tải, lưu và mở transaction của application service. |
      | Xác định giới hạn demo | Giải thích vì sao preflight in-memory chưa ngăn race condition, mất cập nhật hoặc lỗi commit một phía. |
  - slug: class-design-007
    title: Mô hình giàu hành vi và mô hình chỉ chứa dữ liệu
    status: WRITTEN
    difficult: ADVANCED
    focus: Mô hình giàu hành vi và mô hình chỉ chứa dữ liệu
    problemSolved: Quy tắc nên ở entity hay ở service/data class?
    mechanism: Chọn mức rich/anemic có căn cứ
    applicationValue: Bảo vệ chuyển trạng thái, tránh setter tùy tiện
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Mô hình giàu hành vi và mô hình chỉ chứa dữ liệu**

      Bài học hướng dẫn chọn nơi lưu quy tắc nghiệp vụ: đặt chuyển trạng thái ngay trong entity có dữ liệu cần bảo vệ hay dùng data-only DTO/projection khi bài toán chỉ mang dữ liệu. Trọng tâm là mức độ bảo vệ invariant, không phải số getter/setter.

      Qua RichVsAnemicDemo, Order sở hữu addItem, confirm, cancel và tính tổng từ OrderLine; application service chỉ tải, lưu và thông báo. Người học hiểu vì sao một rich model cần giới hạn trách nhiệm, khi nào record/CRUD đơn giản đủ, và tại sao ORM transaction cùng concurrency vẫn phải được thiết kế riêng.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Lựa chọn mô hình dựa trên invariant

      1. Vì sao OrderData cho phép setter trạng thái và tổng tiền công khai có thể phá các bất biến của đơn hàng?
      2. Rich Domain Model khác Anemic Domain Model về nơi đặt rule, quyền sửa state và nguy cơ nhân bản validation thế nào?
      3. Order.addItem và Order.confirm phải từ chối thao tác nào sau khi đơn ở CONFIRMED?
      4. Vì sao một record Quantity có constructor kiểm tra và method plus không nhất thiết là mô hình thiếu hành vi?
      5. Khi nào DTO, projection, báo cáo hoặc CRUD đơn giản phù hợp với data-only model?

      ### Tách orchestration và đảm bảo hệ thống

      1. Trong RichVsAnemicDemo, OrderLine, Order, repository, notifier và application service có vai trò gì?
      2. Vì sao entity không nên tự mở JDBC hoặc gửi SMTP chỉ để được gọi là rich?
      3. Khi trạng thái Order được lưu trong JPA, cần kiểm tra transaction, optimistic locking hoặc lost update ở đâu?
      4. Những bước nào giúp chuyển từ setter công khai sang addItem/confirm mà giữ tương thích và kiểm thử được hành vi cũ?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | So sánh hai mô hình | Chỉ ra nơi quy tắc đang nằm và hệ quả đối với invariant khi nhiều caller cập nhật Order. |
      | Xây dựng rich entity | Thiết kế addItem, confirm, cancel, totalCents trên Order với trạng thái DRAFT/CONFIRMED/CANCELLED rõ. |
      | Bảo vệ dữ liệu và tổng tiền | Ngăn quantity không dương, giá âm, cộng gộp SKU sai, tràn số và lộ collection mutable. |
      | Giữ service đúng nhiệm vụ | Tách domain behavior khỏi repository, notifier, transaction và use case orchestration. |
      | Lựa chọn data-only có lý do | Phân biệt rich entity với request DTO, report projection hoặc một CRUD không có invariant phức tạp. |
      | Lập lộ trình refactor | Định nghĩa state machine, bổ sung test, chuyển caller, thu hẹp setter và kiểm tra ORM/concurrency. |
  - slug: class-design-008
    title: Tách truy vấn khỏi thao tác thay đổi trạng thái
    status: WRITTEN
    difficult: ADVANCED
    focus: Tách truy vấn khỏi thao tác thay đổi trạng thái
    problemSolved: Method đang đọc hay cập nhật trạng thái?
    mechanism: Đọc và ghi là hai ý định khác nhau
    applicationValue: Chống side effect ẩn và race/retry
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Tách truy vấn khỏi thao tác thay đổi trạng thái**

      Bài học giúp người học viết API mà việc đọc dữ liệu không âm thầm thay đổi trạng thái nghiệp vụ, còn lệnh ghi thể hiện rõ ý định, điều kiện hợp lệ và tác dụng phụ. Ví dụ getAvailableQuantity vừa kiểm tra vừa trừ kho cho thấy vì sao một getter có thể tạo lỗi chỉ do UI refresh.

      Qua Stock và AccountDemo, người học phân biệt canReserve/balance/snapshot với reserve/deposit/withdraw; hiểu CQS khác kiến trúc CQRS, tính nguyên tử khi nhiều yêu cầu cạnh tranh và nhu cầu idempotency khi một command được retry.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Phân loại truy vấn và lệnh

      1. Vì sao getAvailableQuantity(requested) vừa trừ tồn kho vi phạm kỳ vọng về query?
      2. canReserve, availableUnits, snapshot khác reserve, deposit, withdraw ở hành vi quan sát được như thế nào?
      3. Tại sao createOrder trả OrderId vẫn là command và CQS không buộc mọi command phải có kiểu void?
      4. CQS ở cấp method khác CQRS ở cấp kiến trúc và read model như thế nào?
      5. Logging, memoization, lazy loading và truy vấn từ xa làm ranh giới query trở nên có điều kiện ra sao?

      ### Đồng thời và retry

      1. Vì sao canReserve(2) trả true không bảo đảm reserve(2) thành công nếu request khác chen vào?
      2. AccountDemo sử dụng synchronized trong một JVM bảo đảm gì và chưa bảo đảm gì khi dữ liệu nằm trên nhiều máy?
      3. Khi deposit(100) hoặc sendEmail bị retry, lỗi lặp side effect khác query lặp thế nào?
      4. Idempotency key cần được kiểm tra và ghi nhận nguyên tử ở đâu để tránh xử lý lặp trên nhiều instance?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện hiệu ứng API | Phân loại method query/command theo thay đổi state thực tế, bất kể tiền tố tên hoặc return type. |
      | Thiết kế query rõ | Đề xuất balance, snapshot, canReserve trả dữ liệu không thay đổi state miền và không lộ collection mutable. |
      | Thiết kế command hợp lệ | Viết reserve/withdraw có validate ngay lúc ghi và giữ invariant trên đường thành công lẫn thất bại. |
      | Phân biệt CQS/CQRS | Giải thích khi nào chỉ cần phân tách method và chi phí khi thêm read/write model riêng. |
      | Phân tích TOCTOU | Chỉ ra race giữa query và command rồi đề xuất atomic update hoặc lock/transaction ở owner. |
      | Kiểm tra idempotency | So sánh setStatus với deposit, xây tình huống retry có request ID không gây hiệu ứng lặp. |
  - slug: class-design-009
    title: Giới hạn việc truy cập sâu vào chuỗi đối tượng
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Giới hạn việc truy cập sâu vào chuỗi đối tượng
    problemSolved: Caller có biết quá sâu cấu trúc object không?
    mechanism: Yêu cầu hành vi từ cộng tác viên gần
    applicationValue: Giảm coupling khi thay cấu trúc sâu
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Giới hạn việc truy cập sâu vào chuỗi đối tượng**

      Một chuỗi loan.getMember().getMembershipPlan().getDailyLateFeeCents() buộc mã gọi biết chi tiết nhiều đối tượng và tự nhân phí phạt. Bài học giúp người học đánh giá mức coupling thực tế, đưa hành vi về chủ thể phù hợp hoặc chuyển dữ liệu qua Value Object thay vì đào sâu đồ thị object.

      Ví dụ DemeterDemo sử dụng Loan.calculateLateFeeCents, Member.lateFeeFor và MembershipPlan.feeFor để giữ trách nhiệm ở từng tầng gần nhau. Người học cũng phân biệt chain gây rò rỉ với DTO, fluent API, Stream và nhận ra rằng đổi chain Java không tự giải quyết N+1 query, lazy loading hay transaction.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Law of Demeter và nơi sở hữu hành vi

      1. Chuỗi Loan → Member → MembershipPlan khiến LoanReturnService phụ thuộc vào những quyết định nội bộ nào?
      2. Law of Demeter gợi ý những loại đối tượng trực tiếp nào một method nên trao đổi thông điệp?
      3. Vì sao gọi loan.calculateLateFeeCents(days) làm giảm mức hiểu biết của service về cấu trúc phía sau?
      4. Khi nào một policy độc lập nhận loan snapshot tốt hơn việc nhét mọi thuật toán vào Loan?
      5. Vì sao thêm hàng loạt getter chuyển tiếp trên Order có thể chỉ che dấu chuỗi truy cập mà chưa đặt đúng trách nhiệm?

      ### Giới hạn và kiểm chứng thiết kế

      1. Vì sao chuỗi String.trim().toLowerCase(), builder hay Stream không tự là vi phạm LoD?
      2. Optional.map qua nhiều object có giảm coupling không hay chỉ giảm thao tác kiểm tra null?
      3. Nếu MembershipPlan đổi cách tính phí theo số ngày miễn và trần tiền, service ngoài Loan nên phải sửa những gì?
      4. Getter có lazy relation JPA gây N+1 hoặc LazyInitializationException thì rút chuỗi vào một method có đủ để xử lý không?
      5. Vì sao mức phí theo gói hiện tại khác phí theo gói ở thời điểm mượn và mô hình phải cam kết trường hợp nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận biết message chain nguy hiểm | Tìm chuỗi caller đi sâu vào nhiều entity để tính rule và xác định coupling đến cấu trúc nội bộ. |
      | Áp dụng Tell, don't ask | Đề xuất Loan.calculateLateFeeCents và các method cộng tác gần nhau thay cho công thức rải trong service. |
      | Đặt rule hoặc VO đúng nơi | Chọn MembershipPlan.feeFor, domain policy hoặc ShippingAddress dựa trên nơi sở hữu thông tin. |
      | Phân tích ngoại lệ LoD | Phân biệt chuỗi business object với DTO, Money value object, Stream và fluent builder có hợp đồng rõ. |
      | Đảm bảo hành vi giữ nguyên | Kiểm tra phí Basic/Premium theo ngày, lỗi trả hai lần và tác động của việc đổi gói thành viên. |
      | Nhận diện rủi ro persistence | Giải thích cách projection/fetch strategy mới xử lý N+1/lazy ngoài việc thu ngắn chuỗi Java. |
- slug: modeling
  title: Mô hình hóa
  childs:
  - slug: modeling-001
    title: Thu thập tình huống sử dụng và quy tắc nghiệp vụ
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Thu thập tình huống sử dụng và quy tắc nghiệp vụ
    problemSolved: Ai đạt mục tiêu gì theo điều kiện nào?
    mechanism: Phỏng vấn và biến yêu cầu mơ hồ thành luật kiểm chứng được
    applicationValue: Xác lập use case, invariant, acceptance criteria
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Thu thập tình huống sử dụng và quy tắc nghiệp vụ**

      Chuyển câu chuyện người dùng về đăng ký khóa học thành **use case** có actor, trigger, luồng chính/ngoại lệ, tiền/hậu điều kiện; diễn đạt **business rule** bằng BR-ID và tình huống kiểm chứng được. Từ đó xác định invariant và chủ sở hữu quy tắc trước khi thiết kế Java API, đồng thời phân biệt giả định minh họa với chính sách thực tế được stakeholder chấp thuận.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Khám phá và xác nhận yêu cầu

      1. Vì sao yêu cầu “sinh viên đăng ký khóa học” chưa đủ để quyết định class và method, và phải hỏi thêm những điều kiện nghiệp vụ nào?
      2. Use case, business rule, non-functional requirement và technical constraint khác nhau ở câu hỏi chúng trả lời như thế nào?
      3. Vì sao phải xác định actor, system boundary, rule owner và nguồn dữ liệu đáng tin trước khi phác thảo domain model?

      ### Luồng, bất biến và kiểm chứng

      1. Với UC-01, từng BR-01 đến BR-06 được thể hiện bằng luồng từ chối và trạng thái không đổi ra sao?
      2. Vì sao đăng ký trùng và retry cùng một yêu cầu có thể cần hai chính sách khác nhau?
      3. Để bảo vệ giới hạn sức chứa khi có hai request cạnh tranh, `synchronized` trong một JVM khác transaction/unique constraint ở nhiều node ra sao?
      4. Ma trận BR → class/API → acceptance test và Given–When–Then giúp phát hiện yêu cầu thiếu kiểm chứng thế nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Đặc tả use case | Viết UC đăng ký học có actor, precondition, happy path, ít nhất ba exception path và postcondition thất bại. |
      | Chuẩn hóa business rule | Đặt BR-ID, owner, điều kiện và phản ví dụ cụ thể cho active/prerequisite/duplicate/capacity. |
      | Truy vết quy tắc | Ánh xạ từng BR tới phương thức `Course.enroll`, persistence và Given–When–Then hoặc JUnit. |
      | Đánh giá ranh giới an toàn | Giải thích vì sao atomicity khi cùng tranh chỗ không được chứng minh bằng một kiểm tra `if` đơn lẻ. |
  - slug: modeling-002
    title: Nhận diện đối tượng từ yêu cầu
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Nhận diện đối tượng từ yêu cầu
    problemSolved: Khái niệm nào xứng đáng thành object?
    mechanism: Phản biện class ứng viên bằng danh tính và trách nhiệm
    applicationValue: Phân biệt entity/VO/service và vòng đời
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Nhận diện đối tượng từ yêu cầu**

      Biến mô tả mượn sách thành **đối tượng ứng viên** bằng danh từ–động từ–ràng buộc, rồi đánh giá theo danh tính, trách nhiệm và vòng đời. Bài chỉ ra lý do phải phân biệt `BookTitle`, `BookCopy` và `Loan`, đồng thời phân vai entity, value object, domain policy, service điều phối, repository và DTO đúng yêu cầu.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Chắt lọc đối tượng từ yêu cầu

      1. Vì sao danh từ “sách”, “ngày mượn” hay động từ “kiểm tra” không tự động cần mỗi từ một class?
      2. Với đầu sách, bản vật lý và lượt mượn, yếu tố ID, vòng đời và lịch sử nào chứng minh chúng nên được tách riêng?
      3. Làm sao phân biệt entity với value object, policy với application service và actor với domain object?

      ### Đặt quan hệ và thử mô hình

      1. Multiplicity giữa `BookCopy` và `Loan` mô tả lịch sử khác gì invariant tối đa một Loan active?
      2. Vì sao `LoanPolicy` tính hạn trả, `BorrowingService` điều phối còn `LoanRepository` lưu/tải?
      3. Khi thêm giữ chỗ, gia hạn hoặc lịch sử sửa chữa, điều kiện nào cho thấy cần class mới thay vì field bổ sung?
      4. Những rủi ro đồng thời nào demo in-memory không thể tự đảm bảo?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Tạo danh sách ứng viên có lý do | Trích khái niệm, thuộc tính, hành vi và constraint rồi giải thích vì sao mỗi candidate được giữ hay loại. |
      | Phân loại vai trò miền | Chọn entity, value object, policy, service, repository/port cho trường hợp thư viện. |
      | Vẽ quan hệ đúng nghĩa | Phân biệt `BookTitle`, `BookCopy`, `Loan` và ghi multiplicity lịch sử kèm invariant active riêng. |
      | Thử thay đổi yêu cầu | Mô phỏng các luồng mượn/trả, phân tích khi có Reservation hoặc Renewal và cập nhật model phù hợp. |
  - slug: modeling-003
    title: Phân chia trách nhiệm và đối tượng cộng tác
    status: WRITTEN
    difficult: ADVANCED
    focus: Phân chia trách nhiệm và đối tượng cộng tác
    problemSolved: Đối tượng nào sở hữu rule và nhờ ai?
    mechanism: Giao việc nơi có thông tin, giảm coupling
    applicationValue: Giữ logic đúng owner và luồng cộng tác
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phân chia trách nhiệm và đối tượng cộng tác**

      Giao **trách nhiệm biết/làm** cho đúng đối tượng sở hữu thông tin hoặc invariant và xác định cộng tác viên cần thiết. Qua `Member`, `BookCopy`, `Loan`, `LendingService`, người học phân biệt quy tắc cục bộ ở entity với quy trình nhiều đối tượng do service điều phối; hiểu low coupling, high cohesion và giới hạn transaction.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Giao nhiệm vụ đúng nơi

      1. Vì sao giới hạn số lượt mượn thuộc trách nhiệm của `Member`, trạng thái sẵn sàng thuộc `BookCopy`, còn việc đóng phiếu thuộc `Loan`?
      2. Điều gì sai khi service tự đọc các field và sửa `Member` bằng setter thay vì gọi `recordBorrow()`?
      3. Những câu hỏi của Information Expert, Controller, Low Coupling và High Cohesion dẫn tới các quyết định thiết kế nào?

      ### Cộng tác và tính nhất quán

      1. `LendingService.lend` phải điều phối những lời gọi nào theo thứ tự để tránh sửa trạng thái khi đầu vào không hợp lệ?
      2. Khi quy tắc phụ thuộc nhiều aggregate, nên chọn domain policy/service hay ép vào một entity; căn cứ là gì?
      3. Vì sao thay state của Member và BookCopy qua các method riêng chưa bảo đảm atomicity, và DB transaction/idempotency giải quyết rủi ro nào?
      4. Đổi công cụ thông báo hoặc nơi lưu có nên buộc đổi domain class hay không, và điểm cộng tác nào giúp tránh điều đó?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân trách nhiệm | Xác định owner của quota, availability, phiếu mượn và orchestration mà không nhân bản quy tắc. |
      | Thiết kế thông điệp rõ nghĩa | Đề xuất API `ensureCanBorrow`, `recordBorrow`, `markBorrowed`, `close` thay cho setter trực tiếp. |
      | Kiểm tra coupling/cohesion | Phát hiện God Object, chuỗi `get...get...set` và phụ thuộc hạ tầng chảy vào domain. |
      | Phân tích giao dịch | Chỉ ra các điểm dễ lệch khi update nhiều entity và chọn transaction boundary thích hợp. |
  - slug: modeling-004
    title: 'Thẻ CRC: lớp, trách nhiệm và cộng tác'
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: 'Thẻ CRC: lớp, trách nhiệm và cộng tác'
    problemSolved: Diễn tập trách nhiệm qua thẻ thế nào?
    mechanism: Thử các luồng và sửa thẻ trước khi code
    applicationValue: Kiểm tra phân vai bằng role-play
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Thẻ CRC: lớp, trách nhiệm và cộng tác**

      Sử dụng **thẻ CRC (Class–Responsibilities–Collaborators)** để role-play các tình huống đăng ký lớp học, xác định lớp nào có trách nhiệm nghiệp vụ nào và cần nhờ ai. Bài tập trung vào mẫu thẻ, diễn tập luồng thành công/thất bại, chuyển nghĩa vụ thành API/UML/test và thay đổi bộ thẻ khi xuất hiện danh sách chờ hoặc thanh toán.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Viết thẻ và diễn tập

      1. Ba vùng trên một thẻ CRC diễn đạt điều gì, và vì sao responsibility nên mô tả nghĩa vụ thay vì chỉ liệt kê getter/setter?
      2. Với `Student`, `Workshop`, `Enrollment`, `RegistrationService`, `WorkshopRepository`, `RegistrationNotifier`, vì sao các collaborator khác nhau?
      3. Khi role-play đăng ký trùng hoặc hết chỗ, thẻ nào ra quyết định cuối cùng và những lời gọi nào phải được bỏ qua?

      ### Từ thẻ sang thiết kế và thay đổi

      1. Làm sao chuyển CRC thành class diagram, `Workshop.enroll`, `withdraw` và các test theo trách nhiệm?
      2. Yêu cầu waitlist theo thời gian, thanh toán hay lịch trùng buộc bổ sung trách nhiệm hoặc collaborator ở đâu?
      3. Vì sao thẻ CRC không tự chứng minh transaction, concurrency safety, idempotency hoặc quyền người gọi?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Soạn CRC có nội dung | Tạo thẻ Class/Responsibilities/Collaborators riêng cho ít nhất bốn vai trò đăng ký học. |
      | Diễn tập tình huống | Giải thích chuỗi lời gọi success, duplicate, full-capacity, withdrawal và điểm dừng sau lỗi. |
      | Phát hiện trách nhiệm sai | Chỉ ra rule trùng giữa service và entity hoặc domain phụ thuộc SQL/SMTP. |
      | Nối sang implementation | Ánh xạ responsibility thành Java method và test xác nhận số chỗ hoặc không gửi thông báo khi bị từ chối. |
  - slug: modeling-005
    title: 'Sơ đồ lớp: thành viên và quan hệ'
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: 'Sơ đồ lớp: thành viên và quan hệ'
    problemSolved: Lớp có thành viên/quan hệ/bội số gì?
    mechanism: Đọc ký pháp, bội số và chọn đúng quan hệ
    applicationValue: Làm rõ cấu trúc và quyền sở hữu
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Sơ đồ lớp: thành viên và quan hệ**

      Đọc, thiết kế và kiểm tra **UML class diagram** theo mức miền hoặc implementation: tên lớp, field, operation, visibility, bội số, hướng liên kết, association, aggregation, composition, inheritance, realization và dependency. Qua `Order`–`OrderLine`–`Customer`–`Product`, người học liên hệ ký pháp với Java và lý giải nơi phải bảo vệ invariant bằng code/test.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Ký pháp thành viên và quan hệ

      1. Ký hiệu UML `+`, `-`, `#`, `~`, kiểu thuộc tính/phương thức và static khác cách khai báo Java thế nào?
      2. Association, aggregation, composition, generalization, realization và dependency khác nhau về ownership/lifecycle/cách sử dụng ra sao?
      3. Vì sao `Order` sở hữu `OrderLine` bằng composition nhưng chỉ liên kết với `Customer` và `Product`?
      4. Đầu hình thoi, tam giác rỗng và mũi tên dependency đặt về phía nào và có nghĩa gì?

      ### Bội số, code và giới hạn sơ đồ

      1. Multiplicity `0..*`, `1`, `0..1` được đọc từ phía đối diện thế nào và Java `List` có tự enforce bội số không?
      2. Vì sao `new B()` hoặc một field tham chiếu B chưa đủ để kết luận A composition B?
      3. Đối chiếu `PaymentGateway` interface với implementation và `CheckoutService` qua đường realization/dependency thế nào?
      4. Khi sơ đồ hứa hẹn trạng thái đơn hợp lệ, code và test cần bảo vệ những điều gì mà UML không tự thực thi?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Giải mã UML | Đọc chính xác visibility, attribute, operation, association role/multiplicity và các loại đường quan hệ. |
      | Chuyển UML sang Java | Phác thảo `Order`/`OrderLine` và API add/confirm theo quan hệ sở hữu chính xác. |
      | Phân biệt quan hệ | Biện minh composition cho OrderLine và association cho Product/Customer bằng vòng đời. |
      | Review bất biến mô hình | Chỉ ra bội số/ownership sai và cách xác nhận bằng constructor, API, test và constraint. |
  - slug: modeling-006
    title: 'Sơ đồ đối tượng: các thể hiện tại một thời điểm'
    status: WRITTEN
    difficult: BASIC
    focus: 'Sơ đồ đối tượng: các thể hiện tại một thời điểm'
    problemSolved: Instance/link nào đang tồn tại tại t0/t1?
    mechanism: Phân biệt loại, instance và dữ liệu tại một thời điểm
    applicationValue: Minh họa aliasing và snapshot
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Sơ đồ đối tượng: các thể hiện tại một thời điểm**

      Hiểu **UML Object Diagram** là snapshot các instance, giá trị slot và link tại một thời điểm, khác class diagram mô tả kiểu/quan hệ cho nhiều object. Qua `Order`–`OrderItem`–`Product`–`Customer`, người học mô tả t0/t1, aliasing và liên kết nhiều đường đến cùng một instance.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Đọc một snapshot cụ thể

      1. `o01:Order` và `code = "O-001"` khác `Order` và `code: String` về ý nghĩa nào?
      2. Vì sao một snapshot t0 có một item không có nghĩa class Order chỉ được có một item?
      3. Link giữa `o01`, `i01`, `p01`, `c01` biểu diễn dữ liệu gì, và mũi tên minh họa Mermaid có phải method call không?

      ### So sánh thời điểm và danh tính

      1. Sau khi thêm `i02`, object nào/đường liên kết nào mới, object nào vẫn giữ nguyên tại t1?
      2. Vì sao hai order cùng tham chiếu `c01` cần một hộp Customer và hai link, còn hai object cùng tên Lan phải dùng hai hộp?
      3. Muốn xác nhận snapshot phù hợp multiplicity và invariant, phải biết phạm vi sơ đồ đã lược bỏ link nào và kiểm chứng trong code/test thế nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Đọc object graph | Nêu đúng object identity, slot values và link trên snapshot t0/t1. |
      | Vẽ snapshot có căn cứ | Vẽ cùng một order trước/sau addItem, đúng số instance và đường tham chiếu. |
      | Phát hiện alias | Giải thích `==` cho hai tham chiếu chung instance khác với hai object cùng giá trị. |
      | Kiểm chứng snapshot | Chỉ ra trạng thái có thể vi phạm một multiplicity được đặc tả đầy đủ và viết assertion tương ứng. |
  - slug: modeling-007
    title: 'Sơ đồ tuần tự: thứ tự tương tác'
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: 'Sơ đồ tuần tự: thứ tự tương tác'
    problemSolved: Ai gọi ai, theo thứ tự nào?
    mechanism: Xét thứ tự message và nhánh thất bại
    applicationValue: Ngăn side effect sai thứ tự
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Sơ đồ tuần tự: thứ tự tương tác**

      Dùng **UML Sequence Diagram** để mô tả thứ tự message giữa actor, endpoint, service, repository, policy và domain object trong use case mượn sách. Bài cho thấy lifeline, activation, call/return, `alt`/`opt`/`loop`/`par`, nhánh thất bại và các side effect như `save()` cần xuất hiện sau validation.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Đọc và vẽ tương tác

      1. Trục ngang, trục dọc, lifeline, activation, call message và return message diễn giải điều gì; khoảng cách dọc có phải thời lượng thực không?
      2. Điều gì phân biệt nhánh `alt`, tùy chọn `opt`, vòng `loop` và song song `par`?
      3. Trong use case mượn sách, thứ tự `isOnLoan`, `countActive`, `ensureEligible`, `dueDate`, tạo `Loan`, `save` giải quyết trách nhiệm nào?

      ### Nhánh lỗi và đồng bộ

      1. Khi bản sách đã mượn hoặc member đạt hạn mức, những message nào nhất thiết không được gửi nữa?
      2. Vì sao một mũi tên bất đồng bộ hoặc khung `critical` trên diagram không tự tạo queue hoặc DB transaction?
      3. Nếu `save` xảy ra trước `ensureEligible` hoặc `notifySuccess` trước `charge`, hậu quả cần kiểm tra là gì?
      4. Spy repository có thể xác minh những thứ tự call mang tính hợp đồng nào mà không phụ thuộc toàn bộ implementation?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Đọc sequence diagram | Xác định actor, participant, message, return, activation và các control fragment. |
      | Vẽ cả hai luồng | Mô tả nhánh thành công và ít nhất hai nhánh từ chối không gọi `save()`. |
      | Đối chiếu Java | So khớp thứ tự lời gọi trong `BorrowService.borrow()` với thứ tự mũi tên. |
      | Kiểm tra tác dụng phụ | Thiết kế spy/điều kiện để khẳng định lưu/thông báo không xảy ra trước khi rule được đáp ứng. |
  - slug: modeling-008
    title: 'Sơ đồ trạng thái: chuyển trạng thái hợp lệ'
    status: WRITTEN
    difficult: ADVANCED
    focus: 'Sơ đồ trạng thái: chuyển trạng thái hợp lệ'
    problemSolved: Event nào cho phép đổi state?
    mechanism: Xét trạng thái, event, guard, effect
    applicationValue: Bảo vệ chuyển trạng thái nghiệp vụ
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Sơ đồ trạng thái: chuyển trạng thái hợp lệ**

      Mô hình hóa vòng đời một đối tượng bằng **state**, **event**, **guard**, **transition** và **effect**, thay vì cho caller gán `status` tùy ý. Bài dùng đơn hàng từ `DRAFT` đến `DELIVERED` hoặc `CANCELLED`, bảng transition, Java enum + RULES, guard số tiền/mã vận đơn và kiểm tra trạng thái giữ nguyên khi lỗi.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### State machine và chuyển trạng thái

      1. State, event, guard, effect và transition có vai trò khác nhau thế nào trong cạnh `PACKING --SHIP--> SHIPPED`?
      2. Vì sao `DRAFT` có thể cancel nhưng `PAID` trong ví dụ không được phép cancel bằng cùng một event?
      3. Ký hiệu initial/final state mô tả điều gì và vì sao final không có nghĩa xóa object khỏi RAM/DB?
      4. Khi không có cạnh hoặc guard sai, API nên xử lý thế nào để trạng thái và lịch sử không bị đổi?

      ### Triển khai và kiểm chứng

      1. Vì sao `Order.submit`, `confirmPayment`, `ship` cần method có tên thay cho setter `setStatus`?
      2. Callback thanh toán trùng, hai request SHIP cạnh tranh và email sau commit đòi idempotency, optimistic locking hoặc outbox ở đâu?
      3. Khi trạng thái thanh toán và giao hàng tương đối độc lập, vì sao một enum kết hợp có thể phình to và phải xét ràng buộc liên chiều?
      4. Test chuyển trạng thái nên bao phủ những cạnh hợp lệ, guard lỗi và event cấm nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Xây state machine | Vẽ trạng thái bắt đầu/kết thúc, event, guard và effect cho luồng Order. |
      | Xác định bảng chuyển | Liệt kê cạnh hợp lệ và từ chối trạng thái/event không có trong bảng. |
      | Thiết kế cập nhật an toàn | Kiểm tra payment/tracking trước khi đổi state, giữ nguyên lịch sử sau lỗi. |
      | Kiểm chứng vòng đời | Đề xuất positive/negative transition tests và giải thích concurrency/idempotency cần bảo vệ ở persistence. |
  - slug: modeling-009
    title: Đối chiếu mô hình với mã và tình huống thực tế
    status: WRITTEN
    difficult: ADVANCED
    focus: Đối chiếu mô hình với mã và tình huống thực tế
    problemSolved: Mô hình và code có thực thi đúng BR?
    mechanism: Kiểm chứng hai chiều và cập nhật đồng bộ theo thay đổi
    applicationValue: Truy vết rule qua API, test và persistence
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Đối chiếu mô hình với mã và tình huống thực tế**

      Kiểm tra **hai chiều** từ use case/business rule đến UML, Java API, test và dữ liệu vận hành, rồi từ code/test phát hiện mô hình sai lệch. Qua thư viện mượn/trả `BookCopy`, bài truy vết BR-01…BR-07, phân biệt Loan lịch sử với Loan active và kiểm chứng giới hạn 3 lượt, 14 ngày, trả một lần cùng tranh chấp đồng thời.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Kiểm tra mô hình với nghiệp vụ

      1. Vì sao association `BookCopy 1 -- 0..* Loan` thể hiện lịch sử nhưng chưa bảo đảm tối đa một Loan active?
      2. Những mismatch nào xảy ra nếu dùng ISBN thay copy ID, đếm toàn bộ Loan thay vì Loan active hoặc xóa phiếu khi trả?
      3. UC-BORROW và UC-RETURN đòi tiền/hậu điều kiện và bất biến BR-01…BR-07 nào?

      ### Kiểm chứng triển khai và thay đổi

      1. Từng BR được bảo vệ bởi API `Library.borrow`, `Loan.returnOn`, `isAvailable`, `Clock` và bài test nào?
      2. Vì sao lock `synchronized` cùng một `Library` chỉ bảo vệ một JVM, còn nhiều node cần transaction/unique active-copy index?
      3. Giới hạn 3 active Loan/member được kiểm soát ra sao khi unique index chỉ bảo vệ mỗi copy?
      4. Nếu thay chính sách cho giáo viên được mượn 6 bản, cần cập nhật rule, model, Java, test và dữ liệu cũ theo thứ tự suy nghĩ nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Lập traceability | Tạo bảng UC/BR → class, API, constraint và test có căn cứ. |
      | Phát hiện model drift | Giải thích sai lệch về identity, multiplicity, active-vs-history, due date và trách nhiệm. |
      | Kiểm chứng hai chiều | Nêu test success, rejection, return-history và các trường hợp cạnh tranh bản cuối. |
      | Đề xuất nơi bảo vệ rule | Phân biệt validation trong model với transaction/unique constraint tại nơi lưu trữ chung. |
      | Quản lý thay đổi nghiệp vụ | Xác định phần model/code/test/policy cần cập nhật khi rule thay đổi sau vận hành. |
- slug: solid
  title: SOLID
  childs:
  - slug: solid-001
    title: Mục đích và phạm vi áp dụng SOLID
    status: WRITTEN
    difficult: BASIC
    focus: Mục đích và phạm vi áp dụng SOLID
    problemSolved: SOLID cần để giải quyết điều gì và ở phạm vi nào?
    mechanism: Nhìn thay đổi và contract
    applicationValue: Có khung đánh giá năm nguyên tắc
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Mục đích và phạm vi áp dụng SOLID**

      Hiểu SOLID là năm nguyên tắc định hướng thiết kế OOP nhằm giảm tác động dây chuyền của thay đổi, tăng khả năng kiểm thử và giữ hợp đồng hành vi. Bài đặt SRP, OCP, LSP, ISP, DIP vào cùng tình huống checkout gồm chính sách giảm giá, lưu đơn và gửi biên nhận, đồng thời làm rõ SOLID không tự bảo đảm giao dịch nguyên tử, bảo mật hay tính đúng nghiệp vụ và không đòi mỗi class có interface.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Ý nghĩa, phạm vi và mối liên hệ

      1. Vì sao CheckoutService tự tính giảm giá, viết SQL, gửi SMTP và dựng JSON sẽ chịu nhiều nhóm yêu cầu thay đổi không liên quan?
      2. Mỗi chữ S, O, L, I, D giải quyết câu hỏi thiết kế nào, và LSP hỗ trợ tính mở rộng OCP ra sao?
      3. Vì sao interface nhỏ giúp ISP và DIP nhưng chưa đủ bảo đảm class có trách nhiệm đơn hoặc implementation thay thế an toàn?
      4. Trong SolidScopeDemo, những phần nào bảo vệ bất biến, những phần nào điều phối và những phần nào chỉ là adapter?

      ### Quyết định áp dụng và rủi ro

      1. Với Order gồm BOOK 15.000 cent và hai PEN 2.500 cent, vì sao giảm 10% ra 2.000 cent và tổng còn 18.000 cent?
      2. Khi nào một Money value object hoặc CRUD đơn giản chưa cần policy interface riêng?
      3. Nếu lưu đơn thành công nhưng gửi biên nhận thất bại, vì sao SOLID không tự giải quyết transaction, outbox và idempotency?
      4. Làm thế nào đo lợi ích SOLID bằng chi phí thay đổi, test và mức rõ ràng, thay vì số lượng interface?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Diễn giải năm nguyên tắc | Ghép đúng S/O/L/I/D với ranh giới trách nhiệm, biến thể, hợp đồng thay thế, nhu cầu client và hướng phụ thuộc. |
      | Đọc thiết kế checkout | Chỉ được vai trò Order/OrderLine, DiscountPolicy, CheckoutService, repository và sender trong SolidScopeDemo. |
      | Kiểm chứng hợp đồng | Giải thích giới hạn giảm 0..subtotal, các phép tính 20.000/2.000/18.000 cent và kiểm tra policy sai. |
      | Chọn phạm vi áp dụng | So sánh mô hình đơn giản với policy/port có giá trị khi quy tắc hay tích hợp biến động. |
      | Nhận diện vấn đề ngoài SOLID | Nêu được vì sao transaction, concurrency, security và consistency cần giải pháp bổ sung. |
  - slug: solid-002
    title: 'Trách nhiệm đơn: một nhóm lý do thay đổi'
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: 'Trách nhiệm đơn: một nhóm lý do thay đổi'
    problemSolved: Một nhóm trách nhiệm và actor thay đổi là gì?
    mechanism: Nhóm theo lý do thay đổi
    applicationValue: Cohesion cao, tách I/O khỏi Invoice
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Trách nhiệm đơn: một nhóm lý do thay đổi**

      Nắm SRP là một nhóm lý do thay đổi nhất quán theo trách nhiệm và actor, không phải một method mỗi class. Bài dùng Invoice với bất biến vòng đời và tổng tiền; ReceiptFormatter, InvoiceRepository, NotificationSender chứa chi tiết trình bày/lưu trữ/giao tiếp; InvoiceWorkflow chỉ phối hợp use case. Người học xác định cohesion, coupling và tách lớp có căn cứ dựa trên áp lực thay đổi thật.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Trách nhiệm và bất biến hóa đơn

      1. Vì sao Invoice.addLine(), totalCents() và issue() thuộc cùng nhóm trách nhiệm mặc dù có nhiều method?
      2. Đổi logo PDF, schema SQL, provider email và điều kiện phát hành hóa đơn đại diện cho những nhóm thay đổi khác nhau nào?
      3. Vì sao InvoiceWorkflow có ba dependency vẫn có thể tuân SRP nếu nhiệm vụ của nó là điều phối một use case?
      4. Trong SrpDemo, vì sao INV-9 có tổng 35.000 VND và bị từ chối phát hành lần thứ hai?

      ### Phân chia và kiểm thử có kiểm soát

      1. Nếu tách addLine, total, issue thành ba service riêng, nguy cơ suy giảm đóng gói và tăng indirection là gì?
      2. Khi lưu hoặc gửi thông báo bị lỗi sau invoice.issue(), trách nhiệm của Invoice, Workflow và hạ tầng cần được giữ thế nào?
      3. Phân biệt entity, value object, application service, formatter và adapter bằng loại quy tắc mà mỗi thành phần sở hữu ra sao?
      4. Làm thế nào dùng những tình huống thay đổi thật và test domain độc lập DB/SMTP để đánh giá ranh giới SRP?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Xác định lý do thay đổi | Nhóm đúng quy tắc miền Invoice và tách các biến động PDF/DB/email ra adapter tương ứng. |
      | Bảo vệ bất biến | Giải thích điều kiện không phát hành hóa đơn rỗng, không sửa sau phát hành và tính tổng không tràn số. |
      | Dự đoán kết quả SrpDemo | Tái hiện total 35.000, repository lưu một hóa đơn, sender gửi một lần và duplicate issue bị từ chối. |
      | Phân biệt coordinator với god class | Lý giải nhiều dependency vẫn hợp SRP khi cùng phục vụ điều phối một use case. |
      | Đề xuất refactor có lý do | Vạch vùng thay đổi theo cohesion/coupling và kiểm thử riêng domain, formatter, integration. |
