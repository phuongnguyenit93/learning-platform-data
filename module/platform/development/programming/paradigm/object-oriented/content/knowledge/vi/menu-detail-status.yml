    applicationValue: Xây điểm mở rộng cho biến thể nghiệp vụ.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Mở rộng hành vi của lớp cha**

      Bài học chuyển từ nhận biết kế thừa sang thực hành mở rộng hành vi lớp cha cho một biến thể cụ thể. Ví dụ giao hàng ưu tiên cho thấy khi nào subclass dùng lại phần tính phí nền qua super, khi nào bổ sung quy tắc và khi nào cần giữ một quy trình cố định bằng Template Method. Người học còn xem xét rủi ro khi thay thế logic cha hoặc mở rộng một quan hệ is-a không phù hợp.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Cơ chế mở rộng

      1. Khi ExpressShippingFee kế thừa ShippingFee, hành vi nào được tái sử dụng qua super.calculate(distanceKm) và phụ phí nào do lớp con bổ sung?
      2. Khác nhau giữa kế thừa nguyên method, override, overload và static hiding trong ví dụ của bài là gì?
      3. super.method() giúp mở rộng hành vi ra sao, và super(...) phục vụ mục đích nào khác?

      ### Thiết kế an toàn

      1. Khi nào nên gọi super.method(), khi nào override thay thế hoàn toàn hợp lý, và cần giữ hợp đồng nào?
      2. Template Method cố định trình tự chung trong lớp cha nhưng vẫn cho phép subclass tùy biến những điểm nào?
      3. Vì sao nên tránh gọi method có thể override từ constructor lớp cha?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Mở rộng một hành vi | Viết hoặc phân tích override dùng super để cộng thêm phí ưu tiên mà không làm mất tính toán chung. |
      | Phân biệt các cơ chế | Xác định đúng override, overload, static hiding và lời gọi super trong mã minh họa. |
      | Thiết kế điểm mở rộng | Đề xuất một quy trình Template Method có bước bất biến và hook chuyên biệt cho lớp con. |
      | Đánh giá an toàn | Chỉ ra nguy cơ phá hợp đồng hay gọi method của subclass quá sớm khi khởi tạo. |
  - slug: inheritance-004
    title: Ghi đè phương thức và gọi hành vi lớp cha
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Ghi đè phương thức và gọi hành vi lớp cha
    problemSolved: Override và super quyết định phương thức chạy thế nào?
    mechanism: Theo dõi lời gọi runtime và cam kết contract.
    applicationValue: Bảo đảm dispatch và xử lý super đúng.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Ghi đè phương thức và gọi hành vi lớp cha**

      Bài học đi sâu vào quy tắc ghi đè phương thức instance, cách Java chọn implementation theo kiểu đối tượng thực tế và ý nghĩa chính xác của super.method(). Các ví dụ tính phí nhiều tầng cho phép người học lần theo chuỗi gọi, kiểm tra mức truy cập, kiểu trả về, checked exception và @Override. Mục tiêu thực hành là mở rộng logic lớp cha nhưng vẫn giữ hợp đồng nghiệp vụ và tránh lỗi đệ quy hay hành vi sai trong constructor.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Quy tắc override và dispatch

      1. Một phương thức mới được coi là override khi nào, và @Override giúp phát hiện sai chữ ký như thế nào?
      2. Java lựa chọn phương thức nào khi biến kiểu A thực tế trỏ tới C trong chuỗi A → B → C?
      3. Vì sao method static, private và final không tuân theo overriding instance thông thường?

      ### super và hợp đồng hành vi

      1. Điều gì xảy ra khi gọi super.fee(...) trong override, và vì sao lời gọi này khác super(...)?
      2. Vì sao gọi method() thay cho super.method() từ chính override có thể gây đệ quy?
      3. Những giới hạn về quyền truy cập, kiểu trả về và checked exception nào phải giữ khi override?
      4. Constructor lớp cha gọi phương thức override có thể quan sát trạng thái subclass nào chưa sẵn sàng?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Kiểm tra override hợp lệ | Chỉ ra lỗi chữ ký, giảm visibility hoặc khai báo checked exception không hợp lệ trong ví dụ Java. |
      | Truy vết lời gọi | Dự đoán kết quả chương trình A/B/C khi override từng cấp gọi super. |
      | Bảo toàn quy tắc nghiệp vụ | Phân tích override có gọi super và kiểm tra các điều kiện biên mà chỉ đúng cú pháp chưa bảo đảm. |
      | Phát hiện rủi ro khởi tạo | Giải thích lỗi khi constructor superclass dispatch đến method của subclass trước khi field initializer chạy. |
  - slug: inheritance-005
    title: Khả năng truy cập thành viên được kế thừa
    status: WRITTEN
    difficult: ADVANCED
    focus: Khả năng truy cập thành viên được kế thừa
    problemSolved: Ai được truy cập member nào ở package nào?
    mechanism: Suy từ modifier, package, kiểu qualifier.
    applicationValue: Thiết kế API phù hợp phạm vi truy cập.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Khả năng truy cập thành viên được kế thừa**

      Bài học giúp đọc và viết mã kế thừa đúng luật truy cập thành viên trong Java, đặc biệt với subclass nằm ở package khác. Trọng tâm là phân biệt thành viên thuộc trạng thái đối tượng với quyền truy cập hợp lệ từ từng vị trí mã; protected không cho phép subclass ngoài package truy cập member trên mọi biến kiểu superclass. Người học vận dụng quy tắc này để chọn public/protected/private vừa đủ và tránh phá invariant của lớp cha.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Quy tắc truy cập trong Java

      1. public, protected, package-private và private khác nhau thế nào khi lớp con ở cùng package hoặc khác package?
      2. Vì sao trong subclass khác package, this.number và b.number hợp lệ nhưng a.number với a kiểu superclass lại không hợp lệ?
      3. Field private của superclass có còn trong object subclass, và vì sao subclass không thể truy cập trực tiếp?

      ### Thiết kế và lỗi biên dịch

      1. Khi override, subclass có thể mở rộng visibility hoặc thu hẹp visibility được không?
      2. Constructor được gọi từ subclass theo điều kiện truy cập nào, và vì sao nó không phải member được kế thừa?
      3. Vì sao protected field dễ làm lộ invariant, và thiết kế API thao tác trạng thái thay thế ra sao?
      4. Package con và JPMS exports ảnh hưởng khả năng dùng public API như thế nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Xác định quyền truy cập | Đánh giá một biểu thức truy cập member có biên dịch không từ modifier, package, subclass và kiểu của qualifier. |
      | Giải thích protected qua package | Phân tích ví dụ Document/ManagedDocument hoặc A/B và chỉ ra chính xác dòng hợp lệ, không hợp lệ. |
      | Kiểm tra hợp đồng override | Sửa ví dụ subclass giảm visibility thành quyền truy cập cho phép. |
      | Bảo vệ trạng thái | Thiết kế private field và public/protected operation có validation thay cho protected mutable field. |
  - slug: inheritance-006
    title: Khởi tạo lớp con và chuỗi khởi tạo lớp cha
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Khởi tạo lớp con và chuỗi khởi tạo lớp cha
    problemSolved: new Child chạy các bước khởi tạo theo thứ tự nào?
    mechanism: Truy vết vòng đời và trạng thái chưa sẵn sàng.
    applicationValue: Khởi tạo subclass nhất quán và an toàn.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Khởi tạo lớp con và chuỗi khởi tạo lớp cha**

      Bài học mô tả đầy đủ quá trình tạo một đối tượng lớp con: chọn constructor bằng this/super, khởi tạo class theo static khi cần, thiết lập giá trị mặc định và chạy initializer/constructor từ superclass đến subclass. Qua chương trình in thứ tự, người học phân biệt constructor chaining với overriding và nhận ra tình huống method override bị gọi trước khi trạng thái lớp con hoàn tất. Việc hiểu thứ tự này giúp duy trì invariant và xử lý lỗi khởi tạo đúng chỗ.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Luồng khởi tạo

      1. super(args), this(args) và lời gọi super() ngầm định khác nhau thế nào?
      2. Nếu lớp cha chỉ có constructor nhận tham số mà con không gọi super(args), chương trình mắc lỗi gì?
      3. Khi lần đầu tạo Child trong chuỗi Parent → Middle → Child, các bước static initialization, instance field initializer, instance block và constructor chạy theo thứ tự nào?

      ### Các tình huống cần kiểm chứng

      1. Giá trị field của Child là gì khi constructor Parent gọi một method override trước khi initializer Child chạy?
      2. this(...) có khiến instance initializer của Child chạy lại nhiều lần không, vì sao?
      3. Nếu constructor cha ném exception, quá trình tạo object và phần khởi tạo của con tiếp tục ra sao?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Truy vết constructor | Dự đoán thứ tự log của ví dụ Parent/Middle/Child khi new Child(). |
      | Sửa lỗi khởi tạo | Thêm lời gọi super(args) đúng trong subclass khi superclass không có constructor không tham số. |
      | Phân tích trạng thái sớm | Giải thích tại sao method override gọi từ constructor cha có thể thấy null hoặc 0. |
      | Bảo toàn invariant | Đề xuất constructor kiểm tra dữ liệu theo trách nhiệm từng lớp và tránh gọi hook override quá sớm. |
  - slug: inheritance-007
    title: Thành viên không thể ghi đè và lớp không thể kế thừa
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Thành viên không thể ghi đè và lớp không thể kế thừa
    problemSolved: Khi nào cấm extends hoặc override?
    mechanism: Chọn phần mở/phần khóa có chủ đích.
    applicationValue: Cố định invariant, quy trình và phạm vi subtype.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Thành viên không thể ghi đè và lớp không thể kế thừa**

      Bài học làm rõ ba nghĩa của final khi gắn lên class, instance method và biến, tập trung vào ảnh hưởng của class/method đối với kế thừa. Ví dụ xử lý thanh toán cố định phần kiểm tra chung và chỉ mở hook charge cho subclass chứng minh cách khóa quy trình nhưng vẫn cho phép chuyên biệt hóa. Người học cũng biết khi nào final là rào chắn cần thiết, khi nào sealed hay composition phù hợp hơn để không đóng API quá sớm.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Ngữ nghĩa final

      1. final method có được lớp con sử dụng không, và vì sao không thể override?
      2. final class ngăn hành động nào nhưng vẫn cho phép khởi tạo đối tượng hoặc implements interface ra sao?
      3. Khác nhau giữa final trên class, method và biến tham chiếu là gì?
      4. Vì sao private/static method không phải điểm override dù không viết final?

      ### Quyết định thiết kế

      1. Trong PaymentProcessor, vì sao nên khóa process() và mở charge() cho từng kênh thanh toán?
      2. abstract và final xung đột như thế nào khi áp vào cùng class hoặc method?
      3. Khi nào một sealed class với permits phù hợp hơn final class, và cần cân nhắc gì khi đóng khả năng kế thừa?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Xác định lỗi biên dịch | Nhận diện class extends final class hoặc override final method và nêu lý do bị từ chối. |
      | Phân biệt vị trí final | Giải thích đúng ý nghĩa của final class, final method và final variable trong code. |
      | Thiết kế điểm cố định/mở | Phân định process() bất biến và charge() chuyên biệt trong luồng PaymentProcessor. |
      | Lựa chọn mức mở rộng | So sánh final class với sealed và composition theo nhu cầu đóng/mở API. |
  - slug: inheritance-008
    title: Kế thừa đơn, kế thừa đa và xung đột hành vi
    status: WRITTEN
    difficult: ADVANCED
    focus: Kế thừa đơn, kế thừa đa và xung đột hành vi
    problemSolved: Ghép interface và giải quyết default conflict thế nào?
    mechanism: Giải va chạm hợp đồng trước khi ghép.
    applicationValue: Dùng nhiều capability mà không đa kế thừa state.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Kế thừa đơn, kế thừa đa và xung đột hành vi**

      Bài học giải thích vì sao một Java class chỉ có một superclass trực tiếp nhưng có thể thực thi nhiều interface. Người học phân biệt việc kế thừa state/implementation từ class với việc ghép các hợp đồng và default method từ interface. Qua các tình huống trùng default method, bài cung cấp thứ tự ưu tiên class → interface cụ thể hơn → override giải quyết xung đột; đồng thời cảnh báo xung đột hợp đồng ngữ nghĩa dù chữ ký biên dịch được.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Một superclass, nhiều interface

      1. Vì sao Java không cho phép class extends hai superclass và chuyện state/constructor chung gây khó ở đâu?
      2. implements nhiều interface khác với đa kế thừa class ở khía cạnh trạng thái và hợp đồng ra sao?
      3. Default method trong interface cung cấp hành vi gì nhưng không làm interface thành superclass chứa state instance?

      ### Giải quyết xung đột

      1. Khi class có method cùng chữ ký với interface default method, implementation nào được ưu tiên?
      2. Khi interface con cung cấp default method cụ thể hơn interface cha, bản nào được chọn?
      3. Hai default method độc lập trùng chữ ký buộc lớp implement xử lý thế nào bằng override hoặc Interface.super.method()?
      4. Vì sao hai interface cùng chữ ký nhưng khác đơn vị trả về có thể sai thiết kế dù Java không báo xung đột?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Mô hình hóa giới hạn Java | Phân loại cú pháp extends nhiều class và implements nhiều interface thành hợp lệ hoặc lỗi. |
      | Dự đoán default method | Dự đoán kết quả các ví dụ class wins và most specific interface. |
      | Khắc phục xung đột | Viết override rõ ràng khi hai interface độc lập cung cấp default method trùng tên. |
      | Đánh giá kết hợp API | Phân tích xung đột tên, hằng số và ý nghĩa hợp đồng; đề xuất composition khi phù hợp. |
  - slug: inheritance-009
    title: Mixin, trait và tái sử dụng hành vi tùy ngôn ngữ
    status: WRITTEN
    difficult: ADVANCED
    focus: Mixin, trait và tái sử dụng hành vi tùy ngôn ngữ
    problemSolved: Lớp không cùng cha chia sẻ hành vi bằng cơ chế nào?
    mechanism: Tách capability khỏi quan hệ họ hàng lớp.
    applicationValue: Tái sử dụng behavior ngang cây lớp khi phù hợp.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Mixin, trait và tái sử dụng hành vi tùy ngôn ngữ**

      Bài học mở rộng góc nhìn tái sử dụng hành vi cho các lớp không cùng nhánh kế thừa nghiệp vụ. Trong Java, ví dụ Article và SupportTicket cùng implements Taggable cho thấy default method có thể tái sử dụng một quy trình bằng cách gọi thao tác cốt lõi do mỗi lớp tự thực hiện. Bài cũng so sánh khái niệm mixin và trait trong nhiều ngôn ngữ, nhấn mạnh không suy diễn tính năng lưu state hay quy tắc xung đột của ngôn ngữ khác sang Java.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Dùng chung hành vi bằng interface

      1. Vì sao Article và SupportTicket cùng dùng Taggable.addTags() dù không chung superclass nghiệp vụ?
      2. Một interface default method có thể chứa kiểu state nào và vì sao không tự lưu field instance cho từng object?
      3. Vì sao gọi addTag() lặp trong addTags() có nguy cơ cập nhật dở dang khi dữ liệu giữa chừng không hợp lệ?

      ### Lựa chọn và giới hạn

      1. Khi hai interface độc lập có default greet(), lớp implement giải quyết xung đột bằng cách nào?
      2. Mixin và trait trong các ngôn ngữ khác có phải lúc nào cũng có cùng khả năng lưu state, ghép hành vi và xử lý xung đột không?
      3. Khi nào Java nên chọn default method, abstract superclass hoặc composition/delegate để tái sử dụng hành vi?
      4. Làm sao thiết kế default method chỉ dựa vào hợp đồng đã khai báo, không giả định trạng thái nội bộ của lớp implement?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Thiết kế hành vi chia sẻ | Giải thích và tái hiện mô hình Taggable.addTag/addTags cho hai lớp nghiệp vụ khác nhau. |
      | Phân tích tính nguyên tử | Dự đoán trạng thái sau khi addTags() thất bại ở phần tử thứ ba và đề xuất validation hoặc rollback ở lớp thực thi. |
      | Xử lý va chạm default | Viết override giải quyết hai interface độc lập có default method cùng chữ ký. |
      | So sánh kỹ thuật | Chọn default method, abstract class hoặc composition và nêu giới hạn state, coupling tương ứng. |
  - slug: inheritance-010
    title: Giới hạn và chi phí của cây kế thừa sâu
    status: WRITTEN
    difficult: ADVANCED
    focus: Giới hạn và chi phí của cây kế thừa sâu
    problemSolved: Cây lớp sâu gây rủi ro gì và giảm sâu thế nào?
    mechanism: Đánh giá chi phí thay đổi trên toàn phân cấp.
    applicationValue: Giảm coupling và rủi ro hồi quy ở thiết kế lớn.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Giới hạn và chi phí của cây kế thừa sâu**

      Bài học đánh giá chi phí thực tế của nhiều tầng kế thừa, từ đọc hiểu chuỗi override đến sự phụ thuộc ngầm khi superclass thay đổi. Ví dụ tính phí giao hàng minh họa cách một đổi nhỏ ở base class ảnh hưởng nhánh sâu; bài đồng thời phân biệt chi phí bảo trì/kiểm thử với kết luận thiếu căn cứ về hiệu năng runtime. Người học luyện cách đo mức ảnh hưởng, giữ contract quan sát được và chuyển sang composition/strategy khi các biến thể độc lập làm cây lớp phình to.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Phụ thuộc qua cây lớp

      1. Trong cây StandardDelivery → CityDelivery → PriorityCityDelivery, làm sao truy vết kết quả quote() qua các tầng override?
      2. Fragile base class phát sinh thế nào khi lớp cha thay đổi cách gọi một protected hook?
      3. Vì sao constructor lớp tổ tiên gọi method override ở lớp lá có thể nhìn thấy trạng thái chưa khởi tạo?

      ### Chi phí và tái cấu trúc

      1. Những chi phí bảo trì, kiểm thử và kết hợp biến thể nào thường tăng theo độ sâu cây kế thừa?
      2. Vì sao không thể khẳng định cứ nhiều tầng extends thì JVM tự động chạy chậm hơn?
      3. Khi nào mô hình is-a/LSP vẫn biện minh cho kế thừa, và dấu hiệu nào gợi ý chuyển sang strategy hoặc composition?
      4. Muốn giảm chiều sâu mà không làm đổi hành vi quan sát được, cần lập danh sách và kiểm tra những trường hợp nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Truy vết luồng override | Vẽ chuỗi lời gọi và tính kết quả cho DepthCostDemo hoặc biến thể HolidayPriorityDelivery. |
      | Nhận diện coupling | Giải thích một thay đổi base class có thể tạo hồi quy tại subclass nào và tại sao. |
      | Đánh giá chi phí chính xác | Phân biệt rủi ro bảo trì/kiểm thử với đo hiệu năng runtime cần benchmark. |
      | Đề xuất refactor an toàn | Lập danh sách hành vi, exception và side effect cần giữ rồi đề xuất composition/strategy thay cho cây biến thể sâu. |
- slug: subtyping
  title: Kiểu con
  childs:
  - slug: subtyping-001
    title: Phân biệt kế thừa mã với quan hệ kiểu con
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Phân biệt kế thừa mã với quan hệ kiểu con
    problemSolved: Code reuse khác subtype ở điểm nào?
    mechanism: Từ trùng code sang quan hệ vai trò
    applicationValue: Chọn kế thừa hay composition đúng nghĩa
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phân biệt kế thừa mã với quan hệ kiểu con**

      Bài học đặt hai quyết định thiết kế cạnh nhau: tái sử dụng xử lý đã có và cho phép một kiểu thay thế kiểu khác. Qua NotificationSender, MessagePreparation và AbstractReport, người học biết khi nào cần implements/extends để công bố vai trò, khi nào dùng composition/delegation để chia sẻ thuật toán mà không tạo quan hệ kiểu con sai nghĩa.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hai mục tiêu và cơ chế Java

      1. Kế thừa mã giải quyết nhu cầu nào, còn quan hệ subtype giải quyết nhu cầu nào trong một hệ thống thông báo?
      2. Vì sao EmailSender và SmsSender cùng dùng MessagePreparation nhưng chỉ là subtype của NotificationSender, không là subtype của helper?
      3. Trong AbstractReport/SalesReport, extends tạo đồng thời những mối quan hệ nào và method render() final giữ vai trò gì?

      ### Khả năng thay thế và lựa chọn thiết kế

      1. Tại sao một subclass biên dịch hợp lệ vẫn có thể phá tiền điều kiện, hậu điều kiện hoặc tác dụng phụ mà client của supertype trông đợi?
      2. Điều gì xảy ra khi Square extends Rectangle với hai setter độc lập, và vì sao đó không chỉ là lỗi tái sử dụng code?
      3. Khi nào default method của interface mang lại code dùng chung, và khi nào nên dùng helper/composition thay cho superclass?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân biệt mục tiêu | Chỉ ra riêng phần tái sử dụng mã, quan hệ subtype danh nghĩa và yêu cầu thay thế về hành vi trong một thiết kế. |
      | Phân tích quan hệ | Đọc được implements, extends và liên kết has-a trong sơ đồ NotificationSender–Sender–MessagePreparation. |
      | Đánh giá extends | Giải thích được vì sao SalesReport kế thừa render() hợp lý nhưng CsvExporter không nên kế thừa TextEscaper chỉ để dùng escape(). |
      | Kiểm tra hợp đồng | Xác định được một trường hợp subtype làm sai cam kết đầu vào, đầu ra hoặc trạng thái dù chữ ký đúng. |
      | Lựa chọn cơ chế | Đề xuất dùng interface, abstract class, default method hoặc composition với lý do về vai trò và mức phụ thuộc. |
  - slug: subtyping-002
    title: Quan hệ “là một” và tính thay thế
    status: WRITTEN
    difficult: ADVANCED
    focus: Quan hệ “là một” và tính thay thế
    problemSolved: Kiểu con có giữ vai trò kiểu cha không?
    mechanism: Từ is-a bằng tên sang is-a bằng hợp đồng
    applicationValue: Đặt nền tảng LSP và behavioral substitutability
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Quan hệ “là một” và tính thay thế**

      Bài học chuyển từ quan hệ kiểu Java sang khả năng thay thế trong chương trình thật. Với ShippingPolicy, StandardShipping và ExpressShipping, người học phân biệt sự khác nhau được phép về thuật toán với hành vi vi phạm hợp đồng, đồng thời kiểm tra precondition, postcondition, invariant và các dấu hiệu quan hệ is-a bị chọn sai.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Subtyping và hợp đồng chung

      1. Khi Dog extends Animal, compiler bảo đảm điều gì và những cam kết hành vi nào vẫn cần developer kiểm chứng?
      2. Vì sao StandardShipping báo 40000 VND và ExpressShipping báo 66000 VND cho cùng Parcel vẫn có thể cùng đáp ứng ShippingPolicy?
      3. ShippingPolicy cam kết gì về Parcel hợp lệ, phí không âm, null, overflow và side effect?

      ### Khả năng thay thế trong thực tế

      1. Vì sao VeryLocalShipping từ chối một tuyến 10 km hợp lệ có thể phá LSP, còn trả phí khác nhau thì không?
      2. Tiền điều kiện, hậu điều kiện và bất biến thay đổi ra sao khi subtype thực sự giữ đúng hợp đồng supertype?
      3. Khi nào Car có Engine nên là composition, và khi nào client cần kiểm tra contract tests thay vì chỉ hỏi tên miền is-a?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện subtype | Phân biệt được quan hệ extends/implements được compiler xác nhận và khả năng thay thế theo hợp đồng. |
      | Đọc ví dụ báo giá | Giải thích nguồn gốc 40000/66000 VND và chứng minh cả hai implementation dùng chung hợp đồng ShippingPolicy. |
      | Phát hiện vi phạm | Chỉ ra precondition bị siết, postcondition yếu đi hoặc side effect không được hứa trong implementation. |
      | Phân tích is-a/has-a | Đề xuất is-a hay composition dựa trên nghĩa vụ công khai thay vì chỉ sự giống nhau trong tên lớp. |
      | Kiểm thử substitutability | Đề xuất tình huống cho verifyContract(ShippingPolicy) về null, kết quả không âm, đầu vào giữ nguyên và phạm vi hợp lệ. |
  - slug: subtyping-003
    title: Tương thích kiểu theo tên và theo cấu trúc
    status: WRITTEN
    difficult: ADVANCED
    focus: Tương thích kiểu theo tên và theo cấu trúc
    problemSolved: Java có cần khai báo implements không?
    mechanism: Từ trùng chữ ký sang danh tính kiểu
    applicationValue: Bảo đảm quan hệ kiểu rõ ràng, tích hợp adapter
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Tương thích kiểu theo tên và theo cấu trúc**

      Bài học giải thích vì sao Java không xem hai class là tương thích chỉ nhờ trùng tên/chữ ký phương thức. Qua MessageSender và LegacySmsSdk, người học thấy cần quan hệ extends/implements đúng, sử dụng adapter hoặc method reference khi tích hợp SDK cũ, đồng thời phân biệt nominal typing của Java với structural typing ở TypeScript.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Quan hệ nominal và structural

      1. Vì sao EmailSender có thể gán cho MessageSender còn LegacySmsSdk có cùng send(String,String) lại không thể?
      2. Structural typing khác nominal typing ở đâu, và tại sao cùng chữ ký send(...) chưa chứng minh cùng ý nghĩa nghiệp vụ?
      3. Quan hệ extends/implements gián tiếp được Java công nhận như thế nào khi một class thực hiện interface được kế thừa?

      ### Tích hợp và giới hạn chuyển kiểu

      1. SmsSenderAdapter giúp sử dụng LegacySmsSdk trong NotificationService thế nào mà không biến SDK thành subtype của MessageSender?
      2. Vì sao legacy::prefix có thể được gán cho functional interface nhưng legacy không tự trở thành subtype của interface?
      3. Khi nào một phép cast qua Object gây ClassCastException, và vì sao List<EmailSender> không gán trực tiếp thành List<MessageSender>?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Chẩn đoán lỗi kiểu | Giải thích được trường hợp incompatible types do hai class có API giống nhau nhưng không có quan hệ subtype nominal. |
      | Thiết kế adapter | Phác thảo SmsSenderAdapter implements MessageSender và ủy quyền send(...) cho LegacySmsSdk. |
      | So sánh hai hệ kiểu | Phân tích ngắn ví dụ TypeScript structurally compatible và Java yêu cầu quan hệ kiểu tường minh. |
      | Dùng functional interface | Nhận diện chuyển đổi hợp lệ qua lambda/method reference mà không đánh đồng với structural subtyping của object gốc. |
      | Phân tích giới hạn | Dự đoán trường hợp cast runtime lỗi, hai record có cùng fields vẫn khác kiểu, và generic List invariance. |
  - slug: subtyping-004
    title: Kiểu khai báo và kiểu thực tế của đối tượng
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Kiểu khai báo và kiểu thực tế của đối tượng
    problemSolved: Kiểu biến khác kiểu object ra sao?
    mechanism: Từ một biến sang hai góc nhìn type/runtime
    applicationValue: Hiểu compile-time vs runtime dispatch
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Kiểu khai báo và kiểu thực tế của đối tượng**

      Bài học giúp dự đoán kết quả khi biến tham chiếu có kiểu khai báo là interface nhưng đổi qua nhiều implementation runtime. Qua CardPayment/EWalletPayment và ví dụ overload/override, người học phân biệt thao tác compiler cho phép gọi, thân method được dispatch khi chạy và các trường hợp field, static method không tuân theo dispatch động.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hai kiểu trong một tham chiếu

      1. Trong PaymentMethod method = new CardPayment("1234"), kiểu khai báo và kiểu thực tế là gì, và mỗi kiểu quyết định điều gì?
      2. Vì sao gán method = new EWalletPayment(...) không đổi kiểu khai báo nhưng thay kết quả description()/pay()?
      3. Tại sao không gọi được lastFourDigits() trực tiếp qua PaymentMethod dù runtime object là CardPayment?

      ### Phân giải lời gọi và giới hạn

      1. Vì sao Animal a = new Dog() rồi a.sound() gọi bản override của Dog, nhưng inspect(a) lại chọn overload Animal?
      2. Field hiding và static method hiding khác instance method overriding như thế nào?
      3. Điều gì xảy ra với instanceof, getClass(), method call khi tham chiếu bằng null hoặc khi collection chứa nhiều subtype?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện hai loại kiểu | Ghi đúng declared type và runtime class của từng biến trong chuỗi gán CardPayment/EWalletPayment. |
      | Dự đoán đa hình | Chỉ ra method override của implementation nào được gọi qua PaymentMethod trong từng thời điểm. |
      | Phân biệt overload và override | Dự đoán output Woof/Overload: Animal/Overload: Dog từ ví dụ DispatchRulesDemo và giải thích. |
      | Chẩn đoán thành viên | Phát hiện method không nằm trong API kiểu khai báo và giải thích field/static hiding khác dispatch động. |
      | Thiết kế phụ thuộc | Đề xuất tham số interface cho CheckoutService khi code chỉ cần hành vi thanh toán chung. |
  - slug: subtyping-005
    title: Chuyển từ kiểu con sang kiểu cha
    status: WRITTEN
    difficult: BASIC
    focus: Chuyển từ kiểu con sang kiểu cha
    problemSolved: Sang supertype mất gì ở API nhìn thấy?
    mechanism: Từ lớp cụ thể sang hợp đồng chung
    applicationValue: Dùng đa hình qua API supertype
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Chuyển từ kiểu con sang kiểu cha**

      Bài học tập trung vào phép chuyển tham chiếu từ subtype sang supertype trong Java. Qua PremiumCustomer, Customer, Auditable và các interface thanh toán, người học chứng minh upcast không tạo bản sao, không đổi runtime object, nhưng thu hẹp API được nhìn thấy ở thời điểm biên dịch để client phụ thuộc đúng khả năng cần dùng.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Cơ chế upcasting

      1. Trong PremiumCustomer premium và Customer asCustomer = premium, Java tạo bao nhiêu object và asCustomer giữ góc nhìn kiểu nào?
      2. Vì sao asCustomer.tier() gọi bản override PREMIUM còn asCustomer.points() không biên dịch?
      3. Có thể upcast một Taxi sang những supertype nào qua extends và implements, và vì sao cast tường minh thường không cần?

      ### Ứng dụng và những ngộ nhận

      1. Làm sao List<Customer> chứa cả Customer và PremiumCustomer mà vẫn chọn đúng tier() theo runtime type?
      2. Vì sao upcasting sang PaymentProcessor/RefundProcessor giúp giới hạn API theo khả năng nhưng không tạo cơ chế phân quyền bảo mật?
      3. Vì sao List<PremiumCustomer> không tự trở thành List<Customer>, và khi nào dùng List<? extends Customer>?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Lần theo tham chiếu | Vẽ được các biến premium/asCustomer/asAuditable/asObject cùng tham chiếu một PremiumCustomer. |
      | Dự đoán kết quả | Giải thích được output tier, greeting, auditLabel và so sánh identity trong ví dụ Customer. |
      | Kiểm tra API tĩnh | Phân loại lời gọi hợp lệ/không hợp lệ qua Customer và Auditable mà không hiểu nhầm là xóa dữ liệu lớp con. |
      | Áp dụng supertype | Thiết kế hàm nhận Customer hoặc interface PaymentProcessor để dùng đa hình mà không cần class cụ thể. |
      | Đối chiếu generic | Giải thích List invariance và lựa chọn wildcard đọc subtype phù hợp mà không ép kiểu danh sách sai. |
  - slug: subtyping-006
    title: Ép về kiểu con và kiểm tra kiểu
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Ép về kiểu con và kiểm tra kiểu
    problemSolved: Cast xuống khi nào hợp lệ?
    mechanism: Từ ép kiểu tùy tiện sang kiểm tra khả năng
    applicationValue: Tránh ClassCastException, dùng type check đúng
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Ép về kiểu con và kiểm tra kiểu**

      Bài học xử lý chiều chuyển kiểu có rủi ro: một tham chiếu supertype chưa bảo đảm object thực tế thuộc subtype mong muốn. Qua Vehicle, ElectricCar và Bicycle, người học dùng instanceof, pattern matching và getClass() đúng mục đích, dự đoán ClassCastException, null và giới hạn kiểm tra generic do type erasure.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Ép kiểu và xác nhận subtype

      1. Khi nào (Dog) animal thành công hoặc ném ClassCastException nếu animal trỏ Dog hay Cat?
      2. instanceof Car khác v.getClass() == Car.class thế nào nếu v là ElectricCar?
      3. Java 17 dùng instanceof Car car và flow scoping ra sao để chỉ gọi API subtype sau khi kiểm tra đúng?

      ### Lỗi và lựa chọn thiết kế

      1. Cast null sang Dog trả kết quả gì, còn gọi method trên giá trị đó sẽ gây lỗi nào?
      2. Vì sao không thể dùng instanceof List<String> nhưng có thể dùng List<?> trong bối cảnh type erasure?
      3. Khi hành vi là move() chung cho Vehicle, vì sao nên dùng override thay cho chuỗi instanceof theo từng loại?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Dự đoán cast | Phân biệt lỗi compile-time với ClassCastException runtime và kết quả cast null qua các tình huống Animal/Dog/Cat. |
      | Sử dụng instanceof | Viết nhánh pattern matching để gọi Car.openTrunk() hoặc Bicycle.ringBell() an toàn từ Vehicle. |
      | Kiểm tra class | Dự đoán chính xác instanceof Car, instanceof ElectricCar và getClass()==Car.class với ElectricCar. |
      | Giải thích generics runtime | Nêu được giới hạn của instanceof List<String> và rủi ro unchecked cast trong Java. |
      | Đề xuất abstraction | Thay chuỗi kiểm tra loại phương tiện chỉ nhằm gọi move() bằng method đa hình trên Vehicle. |
  - slug: subtyping-007
    title: Giữ đúng hợp đồng khi mở rộng kiểu
    status: WRITTEN
    difficult: ADVANCED
    focus: Giữ đúng hợp đồng khi mở rộng kiểu
    problemSolved: Subtype giữ lời hứa nào của contract?
    mechanism: Từ @Override hợp lệ sang kiểm chứng correctness
    applicationValue: Mở rộng implementation mà vẫn đúng nghiệp vụ
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Giữ đúng hợp đồng khi mở rộng kiểu**

      Bài học biến nguyên tắc LSP thành tiêu chí có thể kiểm chứng khi thêm implementation cho DiscountPolicy. Ví dụ NoDiscount, PercentageDiscount và các policy cố tình sai làm rõ việc giữ miền đầu vào, giới hạn số tiền trả, tác động phụ, ngoại lệ và cách kiểm thử cùng một hợp đồng trên mọi subtype.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Các điều kiện hợp đồng

      1. Vì sao DiscountPolicy phải chấp nhận mọi subtotalVnd không âm, kể cả 0, và kết quả phải nằm trong đoạn [0, subtotalVnd]?
      2. Subtype có thể thay đổi thuật toán như PercentageDiscount mà vẫn giữ đúng tiền điều kiện, hậu điều kiện và bất biến như thế nào?
      3. Trong ví dụ DiscountDemo, vì sao 105 VND giảm 20% còn phải trả 84 VND, và cách tính nào tránh tràn long?

      ### Nhận diện sai lệch và kiểm chứng

      1. WrongMinimumDiscount tự từ chối hóa đơn nhỏ và WrongSurcharge tăng tiền phải trả đã vi phạm các phần nào của hợp đồng?
      2. Vì sao một subtype ném UnsupportedOperationException bất ngờ hoặc tạo side effect ngoài cam kết không tự nhiên trở thành hợp lệ chỉ vì compiler chấp nhận?
      3. Bộ verifyContract cần những đầu vào biên, trường hợp lỗi và phép kiểm tra kết quả nào để phát hiện implementation vi phạm?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Đặc tả contract | Viết được precondition, postcondition, invariant, exception và side effect của payableVnd(). |
      | Theo dõi phép tính | Dự đoán kết quả các chính sách không giảm và giảm 20% với 1000, 105 và subtotal 0. |
      | Phát hiện LSP violation | Chỉ ra vi phạm của WrongMinimumDiscount, WrongSurcharge và ví dụ ReadOnlyAccount giả vờ hỗ trợ withdraw(). |
      | Sửa implementation | Đề xuất chính sách khuyến mãi dưới ngưỡng trả nguyên subtotal thay vì từ chối đầu vào hợp lệ. |
      | Thiết kế kiểm thử chung | Xây tình huống contract tests cho 0, giá trị nhỏ, Long.MAX_VALUE, số âm và phạm vi kết quả. |
  - slug: subtyping-008
