references:
  - title: "Oracle — java.util.concurrent Package"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/package-summary.html"
    description: "Executor, Future, thread pool, atomic, đồng bộ và các công cụ concurrent trong Java."
  - title: "Oracle — Java Language Specification: Threads and Locks"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-17.html"
    description: "Memory model, synchronization, happens-before và quy tắc quan sát shared state."
  - title: "Oracle — Java Tutorials: Concurrency"
    url: "https://docs.oracle.com/javase/tutorial/essential/concurrency/"
    description: "Khái niệm thread, deadlock, liveness và high-level concurrency (tài liệu nền tảng JDK 8)."
  - title: "Go — The Go Memory Model"
    url: "https://go.dev/ref/mem"
    description: "Quan hệ happens-before và điều kiện đọc/ghi giữa các goroutine."
  - title: "Go — Concurrency Patterns: Pipelines and Cancellation"
    url: "https://go.dev/blog/pipelines"
    description: "Mẫu pipeline, channel, fan-out và hủy để tránh rò rỉ goroutine."
  - title: "Python — asyncio Documentation"
    url: "https://docs.python.org/3/library/asyncio.html"
    description: "Viết concurrent I/O bằng async/await, event loop, task và đồng bộ."
  - title: "Rust Book — Fearless Concurrency"
    url: "https://doc.rust-lang.org/book/ch16-00-concurrency.html"
    description: "Ownership, thread, message passing và shared state an toàn trong Rust."