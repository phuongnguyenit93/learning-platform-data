roadmap:
- id: dong-thoi-vs-song-song
  title: Đồng thời vs Song song
  purpose: Nắm được mô hình thực thi xen kẽ và sự khác biệt với chạy song song thực sự.
  objectives:
  - Phân biệt concurrency và parallelism qua ví dụ.
  - Phân loại tác vụ CPU-bound và I/O-bound.
- id: task-thread-lap-lich
  title: Task, Thread & Lập lịch
  purpose: Hiểu các đơn vị công việc và cách runtime lập lịch thực thi đồng thời.
  objectives:
  - Giải thích task, thread, process và event loop.
  - Tạo hai tác vụ và quan sát thứ tự chạy không cố định.
- id: shared-state-data-race
  title: Shared State & Data Race
  purpose: Nhận diện sự sai lệch khi nhiều tác vụ cùng đọc/ghi trạng thái thay đổi.
  objectives:
  - Tái hiện lỗi tăng bộ đếm dùng chung không an toàn.
  - Phân biệt race condition và data race.
- id: dong-bo-memory-model
  title: Đồng bộ & Memory Model
  purpose: Giữ dữ liệu nhất quán và thiết lập thứ tự quan sát giữa các tác vụ.
  objectives:
  - Áp dụng mutex/lock hoặc atomic cho đoạn tới hạn.
  - Giải thích happens-before và tránh đồng bộ thừa.
- id: message-passing
  title: Message Passing
  purpose: Giảm chia sẻ trạng thái bằng trao đổi thông điệp giữa tác vụ độc lập.
  objectives:
  - Tạo pipeline producer–consumer qua queue/channel.
  - So sánh message passing với shared-memory concurrency.
- id: async-await-futures
  title: Async/Await & Futures
  purpose: Viết tác vụ bất đồng bộ không chặn luồng khi chờ I/O.
  objectives:
  - Chạy hai tác vụ I/O bằng async/await hoặc Future.
  - Phân biệt bất đồng bộ với tạo thêm luồng CPU.
- id: huy-backpressure
  title: Hủy & Backpressure
  purpose: Điều phối vòng đời tác vụ và tránh hệ thống quá tải khi tốc độ không cân bằng.
  objectives:
  - Dùng timeout và cancellation để kết thúc công việc không cần thiết.
  - Giới hạn hàng đợi/số tác vụ đồng thời khi producer quá nhanh.
- id: deadlock-liveness
  title: Deadlock & Liveness
  purpose: Nhận biết chương trình có thể bị kẹt dù không xuất hiện lỗi dữ liệu.
  objectives:
  - Minh họa deadlock do khóa chéo hoặc chờ vòng.
  - Giải thích starvation, livelock và chiến lược phòng tránh.
- id: kiem-thu-hieu-nang
  title: Kiểm thử & Hiệu năng
  purpose: Kiểm chứng tính đúng đắn khi thứ tự thực thi thay đổi và đo hiệu quả.
  objectives:
  - Stress-test tác vụ chia sẻ trạng thái và kiểm tra race.
  - So sánh độ trễ/throughput với số tác vụ đồng thời khác nhau.
