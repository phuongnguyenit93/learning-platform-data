references:
  - title: "Oracle Java SE 25 — java.lang.reflect"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/reflect/package-summary.html"
    description: "Reflection API để đọc type, field, method, constructor và thao tác runtime trong phạm vi quyền truy cập."
  - title: "Oracle Java SE 25 — java.lang.annotation"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/annotation/package-summary.html"
    description: "API annotation, retention policy, target và cách gắn metadata vào thành phần chương trình."
  - title: "Java Language Specification SE 25 — Annotation Interfaces"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-9.html#jls-9.6"
    description: "Đặc tả khai báo annotation interface và các giới hạn, quy tắc áp dụng metadata."
  - title: "Oracle Java SE 25 — com.sun.source.tree"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/jdk.compiler/com/sun/source/tree/package-summary.html"
    description: "API biểu diễn nguồn Java dưới dạng abstract syntax trees phục vụ đọc và phân tích mã."
  - title: "Oracle Java SE 25 — javax.annotation.processing"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.compiler/javax/annotation/processing/package-summary.html"
    description: "Cách triển khai annotation processor, Filer, Messager và môi trường xử lý compile-time."
  - title: "Oracle Java SE 25 — javax.lang.model"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.compiler/javax/lang/model/package-summary.html"
    description: "Mô hình Element và TypeMirror để phân tích declarations và types trong annotation processing."
  - title: "Oracle Java SE 25 — javac Command"
    url: "https://docs.oracle.com/en/java/javase/25/docs/specs/man/javac.html"
    description: "Tùy chọn cấu hình annotation processing, đường dẫn processor và tích hợp với bước biên dịch."
  - title: "Oracle Java SE 25 — Proxy"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/reflect/Proxy.html"
    description: "Dynamic proxy cho interface và InvocationHandler để xử lý các lời gọi phương thức."
  - title: "Oracle Java SE 25 — ClassFile"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/classfile/ClassFile.html"
    description: "Class-File API của Java để parse, tạo và biến đổi class file kể từ JDK 24."
  - title: "Oracle Java SE 25 — java.lang.instrument"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.instrument/java/lang/instrument/package-summary.html"
    description: "Java agents và biến đổi bytecode, cùng rủi ro tin cậy khi can thiệp runtime."