references:
  - title: "Dev.java – Java Language Basics"
    url: "https://dev.java/learn/language/constructs/basics/"
    description: "Tổng quan variables, operators, statements, blocks và control flow trong Java."
  - title: "Dev.java – Primitive Type Variables"
    url: "https://dev.java/learn/language/constructs/basics/primitive-types/"
    description: "Khai báo, khởi tạo, gán và biểu diễn trạng thái qua biến Java."
  - title: "Dev.java – Expressions, Statements and Blocks"
    url: "https://dev.java/learn/language/constructs/basics/expressions-statements-blocks/"
    description: "Phân biệt biểu thức, câu lệnh và khối mã, bao gồm phép gán và thứ tự thực hiện."
  - title: "Dev.java – Control Flow Statements"
    url: "https://dev.java/learn/language-basics/controlling-flow/"
    description: "if, switch, các vòng lặp, break và continue để điều khiển trình tự thực thi."
  - title: "Dev.java – Creating Arrays"
    url: "https://dev.java/learn/language/constructs/basics/arrays/"
    description: "Khai báo, cập nhật phần tử và duyệt dữ liệu mảng bằng vòng lặp."
  - title: "Dev.java – Defining Methods"
    url: "https://dev.java/learn/language/oop/classes-objects/defining-methods/"
    description: "Khai báo method, tham số, return type, void và method body."
  - title: "Dev.java – Catching and Handling Exceptions"
    url: "https://dev.java/learn/catching-and-handling-exceptions/"
    description: "try/catch/finally và luồng thực thi khi phát sinh ngoại lệ."
  - title: "Java SE 26 JLS – Blocks and Statements"
    url: "https://docs.oracle.com/en/java/javase/26/docs/specs/jls/jls-14.html"
    description: "Ngữ nghĩa thực thi câu lệnh, block, điều kiện, vòng lặp và chuyển luồng."
  - title: "Java SE 26 JLS – Expressions"
    url: "https://docs.oracle.com/en/java/javase/26/docs/specs/jls/jls-15.html"
    description: "Ngữ nghĩa biểu thức, phép gán, side effect và thứ tự đánh giá."
  - title: "Java SE 26 JLS – Method Declarations"
    url: "https://docs.oracle.com/javase/specs/jls/se26/html/jls-8.html"
    description: "Định nghĩa method và cách truyền tham số, trả kết quả trong Java."