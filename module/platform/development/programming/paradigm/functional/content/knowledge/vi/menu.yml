menu:
- level1: Mô hình tư duy
  level2:
  - Lập trình hàm là gì và tổ chức chương trình quanh ý tưởng nào?
  - Vấn đề của trạng thái thay đổi và phụ thuộc khó quan sát
  - Nhìn chương trình như quá trình biến đổi dữ liệu qua các hàm
  - 'Bản đồ thuật ngữ: hàm thuần, bất biến, hàm bậc cao và hợp thành'
  - So sánh cách giải một bài toán bằng mệnh lệnh và bằng hàm
  - Quan hệ giữa lập trình hàm, khai báo và hướng đối tượng
  - Phân biệt phong cách lập trình hàm với việc chỉ sử dụng lambda
  - Ngôn ngữ hàm thuần túy và ngôn ngữ hỗ trợ nhiều phong cách
  - Lộ trình học từ phép biến đổi đơn giản đến thiết kế ứng dụng
- level1: Hàm và biểu thức
  level2:
  - Miền xác định, miền giá trị và ý nghĩa của chữ ký hàm
  - Phân biệt hàm toán học, hàm trong chương trình và phương thức
  - Biểu thức tạo giá trị và câu lệnh điều khiển thực thi
  - Đầu vào tường minh, giá trị trả về và phụ thuộc từ bên ngoài
  - Hàm toàn phần (total function) và hàm bộ phận (partial function)
  - Thiết kế miền đầu vào để biểu diễn điều kiện hợp lệ
  - Hàm đồng nhất (identity), hàm hằng và vai trò khi hợp thành
  - Hàm không tham số, hàm nhiều tham số và cách biểu diễn đầu vào
  - Hàm ẩn danh, hàm có tên và lựa chọn theo khả năng đọc
  - Phạm vi từ vựng (lexical scope) và cách tra cứu biến
  - Giá trị hàm, danh tính đối tượng và ý nghĩa của so sánh hàm
- level1: Tính thuần khiết
  level2:
  - 'Hàm thuần (pure function): kết quả phụ thuộc đầu vào và không gây tác dụng phụ'
  - Tính xác định và vì sao kết quả ổn định chưa đủ để một hàm thuần
  - Tính trong suốt tham chiếu (referential transparency) và phép thay thế biểu thức
  - Tác dụng phụ khi thay đổi dữ liệu, ghi I/O hoặc ném ngoại lệ
  - Phụ thuộc ẩn từ đồng hồ, số ngẫu nhiên, cấu hình và biến toàn cục
  - Đưa phụ thuộc ẩn thành tham số để kiểm soát hành vi
  - Phân biệt thay đổi cục bộ có kiểm soát và thay đổi quan sát được
  - Tác dụng phụ khi đọc dữ liệu thay đổi và tính không ổn định của môi trường
  - Ranh giới giữa tính thuần khiết về mô hình và hành vi thực thi
  - Lợi ích đối với suy luận, tái sử dụng và kiểm thử
  - Nhận diện tác dụng phụ bị che giấu trong getter, callback và pipeline
- level1: Dữ liệu bất biến
  level2:
  - Bất biến (immutability) là gì và khác biến chỉ được gán một lần ra sao?
  - Bất biến nông, bất biến sâu và đồ thị đối tượng
  - Bí danh tham chiếu (aliasing) và thay đổi qua một đường truy cập khác
  - Thiết kế đối tượng giá trị và quy tắc bằng nhau theo giá trị
  - Sao chép phòng vệ khi nhận hoặc trả về dữ liệu có thể thay đổi
  - Tập hợp chỉ đọc, tập hợp không cho sửa và dữ liệu thực sự bất biến
  - Tạo phiên bản dữ liệu mới thay vì sửa dữ liệu cũ
  - Cấu trúc dữ liệu bền vững (persistent data structure) và chia sẻ cấu trúc
  - Chi phí sao chép, chia sẻ cấu trúc và tuổi thọ phiên bản cũ
  - Cập nhật dữ liệu lồng nhau và giới hạn của sao chép thủ công
  - Ống kính dữ liệu (lens) và quy tắc truy xuất–cập nhật
  - Lựa chọn bất biến toàn phần hoặc thay đổi cục bộ có đóng gói
- level1: Hàm bậc cao
  level2:
  - Hàm là giá trị hạng nhất (first-class function) nghĩa là gì?
  - Hàm bậc cao (higher-order function) nhận hoặc trả về hàm
  - Truyền hành vi qua tham số thay cho nhánh điều kiện cố định
  - Trả về hàm để chuyên biệt hóa một hành vi
  - 'Closure: hàm cùng môi trường được nắm giữ'
  - Nắm giữ giá trị, nắm giữ tham chiếu và tác động của dữ liệu khả biến
  - Hàm tạo hàm và cấu hình hành vi theo từng ngữ cảnh
  - Hàm bậc cao trong lọc, sắp xếp, kiểm tra và xử lý lỗi
  - Phân biệt callback với bất đồng bộ và với tính thuần khiết
  - Tránh che giấu phụ thuộc hoặc làm tuổi thọ dữ liệu kéo dài trong closure
- level1: Hợp thành hàm
  level2:
  - Hợp thành hàm (composition) và điều kiện khớp kiểu đầu vào–đầu ra
  - Hướng hợp thành và cách đọc một chuỗi phép biến đổi
  - Pipeline dữ liệu và tách các bước theo trách nhiệm
  - Tính kết hợp và vai trò của hàm đồng nhất
  - Hàm nhiều tham số và các trở ngại khi hợp thành trực tiếp
  - 'Currying: biểu diễn hàm nhiều đầu vào bằng chuỗi hàm một đầu vào'
  - Áp dụng một phần (partial application) và khác biệt với currying
  - Đổi thứ tự tham số để thuận tiện chuyên biệt hóa và tái sử dụng
  - Kết hợp các điều kiện bằng and, or và not
  - Kết hợp phép chiếu, phép so sánh và quy tắc sắp xếp
  - Hợp thành có thể thất bại và nhu cầu nối kết quả trong một ngữ cảnh
  - Cân bằng giữa chia hàm nhỏ, tên gọi rõ ràng và độ dài pipeline
- level1: Kiểu và mô hình dữ liệu
  level2:
  - Kiểu dữ liệu như tập giá trị và hợp đồng của phép biến đổi
  - Kiểu tích (product type) để kết hợp nhiều thành phần dữ liệu
  - Kiểu tổng (sum type) để biểu diễn các lựa chọn loại trừ nhau
  - Mô hình hóa trạng thái nghiệp vụ bằng kiểu thay cho nhiều cờ boolean
  - Làm trạng thái không hợp lệ khó biểu diễn bằng thiết kế kiểu
  - Phân biệt kiểu nguyên thủy, đối tượng giá trị và định danh nghiệp vụ
  - Kiểu đệ quy để biểu diễn danh sách, cây và biểu thức
  - So khớp mẫu (pattern matching) và xử lý đủ các trường hợp
  - Kiểu tham số (parametric polymorphism) và hàm tổng quát
  - Kiểu hàm, quan hệ biến thiên và giới hạn của tính tổng quát
  - Type class như cách mô tả hành vi theo kiểu và các lựa chọn biểu diễn
  - Mô hình dữ liệu tường minh thay cho null, mã lỗi và giá trị đặc biệt
- level1: Đệ quy
  level2:
  - Đệ quy là gì và mối liên hệ với định nghĩa dữ liệu
  - Trường hợp cơ sở, bước đệ quy và điều kiện kết thúc
  - Đệ quy trên số, danh sách, cây và kiểu tổng
  - Suy luận đúng đắn bằng bất biến và quy nạp
  - Đệ quy đuôi (tail recursion) và điều kiện tối ưu hóa lời gọi đuôi
  - Giới hạn ngăn xếp trong Java và nguy cơ StackOverflowError
  - Chuyển đệ quy thành vòng lặp với trạng thái tường minh
  - Trampoline để điều khiển các bước tính toán không tăng ngăn xếp
  - Chia để trị, cây lời gọi và chi phí lặp lại phép tính
  - Memoization để tái sử dụng kết quả và điều kiện áp dụng
  - Khi nào dùng đệ quy, phép gấp hoặc vòng lặp để dễ hiểu hơn
- level1: Biến đổi tập hợp
  level2:
  - Ánh xạ (map) để biến đổi từng phần tử và giữ cấu trúc
  - Lọc (filter) theo điều kiện mà không sửa nguồn
  - Làm phẳng (flatten) và flatMap trên dữ liệu lồng nhau
  - Phân biệt một–một, một–nhiều và nhiều–một trong phép biến đổi
  - Kết hợp hai dãy theo vị trí bằng zip và chính sách khi lệch độ dài
  - Chọn, bỏ và cắt dãy theo số lượng hoặc điều kiện
  - Tìm phần tử và kiểm tra tồn tại, tất cả hoặc không có
  - Khử trùng, sắp xếp và ảnh hưởng của quy tắc bằng nhau
  - Nhóm, phân hoạch và lập chỉ mục theo khóa
  - Tích Descartes và mở rộng nhiều tổ hợp dữ liệu
  - Giữ thứ tự, thay đổi thứ tự và ảnh hưởng đến ý nghĩa kết quả
  - Kết hợp nhiều phép biến đổi thành một luồng xử lý có thể đọc được
- level1: Gấp và tích lũy
  level2:
  - Phép gấp (fold) để rút cấu trúc dữ liệu về một kết quả
  - Gấp trái, gấp phải và hướng kết hợp phần tử
  - Giá trị khởi đầu và vai trò của kết quả khi tập rỗng
  - Phân biệt fold, reduce và tích lũy có thay đổi bộ chứa
  - Thiết kế trạng thái tích lũy bằng dữ liệu có ý nghĩa
  - Scan để giữ các kết quả tích lũy trung gian
  - Biểu diễn đếm, tổng, tìm cực trị và gom nhóm bằng phép gấp
  - Tính kết hợp và điều kiện chia nhỏ công việc để tổng hợp
  - Phép gấp trên cây và các kiểu dữ liệu đệ quy
  - Tác dụng phụ trong hàm tích lũy và nguy cơ chia sẻ trạng thái
  - Lựa chọn phép gấp chuyên biệt thay vì một bộ tích lũy quá nhiều trách nhiệm
- level1: Đánh giá và tính lười
  level2:
  - Đánh giá sớm (eager evaluation) và đánh giá lười (lazy evaluation)
  - Trì hoãn phép tính bằng hàm không tham số hoặc cấu trúc dữ liệu
  - Call-by-value, call-by-name và call-by-need
  - Khi nào một phép tính thực sự được kích hoạt?
  - Đánh giá ngắn mạch và tránh tính phần kết quả không cần thiết
  - Dãy vô hạn và điều kiện tiêu thụ hữu hạn
  - Tính lại nhiều lần, ghi nhớ kết quả và sự khác nhau về ngữ nghĩa
  - Tác dụng phụ bị trì hoãn và cách thay đổi thứ tự quan sát
  - Giữ tham chiếu trong chuỗi lười và nguy cơ tăng bộ nhớ
  - Giải phóng tài nguyên khi phép tính trì hoãn kết thúc hoặc bị hủy
  - Lựa chọn đánh giá sớm hay lười theo chi phí và yêu cầu rõ ràng
- level1: Nền tảng hình thức
  level2:
  - Lambda calculus và vai trò mô hình hóa phép tính bằng hàm
  - Biến, biểu thức lambda và phép áp dụng
  - Biến tự do, biến bị ràng buộc và phạm vi tên
  - Đổi tên biến bằng alpha-conversion
  - Thay thế biểu thức bằng beta-reduction
  - Eta-conversion và các điều kiện áp dụng
  - Thứ tự rút gọn, kết thúc và biểu thức không kết thúc
  - Mã hóa giá trị và lựa chọn bằng hàm ở mức khái niệm
  - Điểm bất động và cách biểu diễn đệ quy
  - Liên hệ lambda calculus với lambda có kiểu trong ngôn ngữ thực tế
- level1: Đại số và quy luật
  level2:
  - Vì sao cần quy luật khi thiết kế các phép biến đổi tổng quát?
  - Tính đóng, kết hợp, giao hoán và lũy đẳng của phép toán
  - 'Semigroup: phép kết hợp có tính kết hợp'
  - 'Monoid: bổ sung phần tử đơn vị để xử lý cả trường hợp rỗng'
  - Ví dụ từ số, chuỗi, danh sách và phép kết hợp điều kiện
  - Phép toán không giao hoán và sự cần thiết giữ thứ tự
  - Phép toán số thực và giới hạn khi dựa vào tính kết hợp
  - Hàm đồng cấu (homomorphism) và bảo toàn cấu trúc khi biến đổi
  - Quy luật như cơ sở tái cấu trúc và xử lý song song
  - Phân biệt cấu trúc đại số, giao diện API và cách cài đặt cụ thể
- level1: Functor
  level2:
  - Bài toán biến đổi giá trị nằm trong một ngữ cảnh
  - Functor và phép map bảo toàn ngữ cảnh
  - Quy luật đồng nhất và quy luật hợp thành
  - Ánh xạ trên danh sách, giá trị tùy chọn và kết quả có thể lỗi
  - Phân biệt map với vòng lặp gây tác dụng phụ
  - Functor lồng nhau và biến đổi qua nhiều lớp ngữ cảnh
  - Phân biệt một API có tên map với một Functor tuân thủ quy luật
  - Nhận diện lợi ích thực tế của Functor mà không lạm dụng thuật ngữ
- level1: Applicative
  level2:
  - Kết hợp nhiều phép tính độc lập có cùng ngữ cảnh
  - Đưa giá trị thuần vào ngữ cảnh bằng pure
  - Áp dụng hàm trong ngữ cảnh và vai trò của ap
  - Nâng hàm nhiều tham số bằng map2 hoặc các phép tương đương
  - Nhận diện các quy luật của Applicative
  - Tích lũy nhiều lỗi kiểm tra thay vì dừng ở lỗi đầu tiên
  - Traverse và sequence để chuyển đổi giữa cấu trúc với ngữ cảnh
  - Độc lập về dữ liệu và lý do Applicative không tự bảo đảm chạy song song
  - Quan hệ giữa Applicative, Functor và việc kết hợp ngữ cảnh
- level1: Monad
  level2:
  - Bài toán phép tính sau phụ thuộc kết quả của phép tính trước
  - Monad và phép nối kết flatMap hoặc bind
  - Đưa giá trị vào ngữ cảnh và tránh tạo lớp bọc thừa
  - Quy luật đơn vị trái, đơn vị phải và tính kết hợp
  - Phân biệt map, flatMap và flatten theo kiểu dữ liệu
  - Nối các bước có thể thiếu giá trị hoặc thất bại
  - Nối lựa chọn nhiều kết quả bằng danh sách
  - Ngữ cảnh Reader cho cấu hình và phụ thuộc chỉ đọc
  - Ngữ cảnh State để chuyển trạng thái tường minh
  - Ngữ cảnh Writer để tích lũy dữ liệu kèm kết quả
  - Kết hợp nhiều ngữ cảnh và nhận diện độ phức tạp phát sinh
  - Phân biệt Monad với bất đồng bộ, tác dụng phụ và một kiểu lớp cụ thể
- level1: Lỗi và giá trị thiếu
  level2:
  - Biểu diễn sự vắng mặt bằng kiểu tùy chọn thay cho null
  - Phân biệt không có kết quả, đầu vào không hợp lệ và lỗi thực thi
  - Mô hình Result hoặc Either để trả về thành công hay thất bại
  - Thiết kế kiểu lỗi có cấu trúc và giữ thông tin nghiệp vụ
  - Biến đổi kết quả thành công mà không làm mất lỗi
  - Dừng ở lỗi đầu tiên hoặc tích lũy mọi lỗi độc lập
  - Phục hồi lỗi, cung cấp mặc định và lựa chọn nhánh thay thế
  - Nâng hàm có thể ném ngoại lệ thành hàm trả về kết quả
  - Đặt ranh giới chuyển đổi giữa kiểu lỗi và ngoại lệ
  - Thu thập kết quả khi xử lý nhiều phần tử có thể thất bại
  - Tránh nuốt lỗi hoặc biến mọi thất bại thành giá trị thiếu
- level1: Trạng thái và tác dụng phụ
  level2:
  - Biểu diễn chuyển trạng thái bằng hàm nhận trạng thái cũ và trả trạng thái mới
  - Tách kết quả nghiệp vụ khỏi trạng thái cập nhật
  - Truyền cấu hình và dịch vụ phụ thuộc qua đầu vào tường minh
  - Thay thế đồng hồ và nguồn ngẫu nhiên bằng phụ thuộc có thể kiểm soát
  - Mô tả thao tác I/O như dữ liệu trước khi thực thi
  - Kiểu IO và sự khác nhau giữa dựng mô tả với chạy tác vụ
  - Thứ tự tác dụng phụ khi hợp thành các bước
  - Quản lý tài nguyên với các giai đoạn cấp phát, sử dụng và giải phóng
  - Xử lý ngoại lệ và hủy tác vụ trong vòng đời tài nguyên
  - Thay đổi cục bộ có đóng gói bên trong một giao diện thuần
  - Phân biệt kiểm soát tác dụng phụ với loại bỏ mọi thay đổi trong hệ thống
  - Giới hạn của việc mô hình hóa tác dụng phụ bằng kiểu trong Java
- level1: Thiết kế bằng hàm
  level2:
