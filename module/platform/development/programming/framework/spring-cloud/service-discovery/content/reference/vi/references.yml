references:
  - title: "Spring Cloud Commons — Common Abstractions"
    url: "https://docs.spring.io/spring-cloud-commons/reference/spring-cloud-commons/common-abstractions.html"
    description: "Giải thích DiscoveryClient, ReactiveDiscoveryClient, ServiceInstance, ServiceRegistry, SimpleDiscoveryClient và health indicators."
  - title: "Spring Cloud Netflix — Eureka Discovery"
    url: "https://docs.spring.io/spring-cloud-netflix/reference/spring-cloud-netflix.html"
    description: "Hướng dẫn tạo Eureka Server, đăng ký và khám phá Eureka Client, service metadata và heartbeat."
  - title: "Spring Cloud Consul — Service Discovery"
    url: "https://docs.spring.io/spring-cloud-consul/reference/discovery.html"
    description: "Cấu hình service registration, Consul discovery, health checks, metadata và quản lý trạng thái instance."
  - title: "Spring Cloud Kubernetes — DiscoveryClient"
    url: "https://docs.spring.io/spring-cloud-kubernetes/reference/discovery-client.html"
    description: "Cách lấy Kubernetes Services, endpoints và ServiceInstance bằng DiscoveryClient và thiết lập namespace."
  - title: "Kubernetes — DNS for Services and Pods"
    url: "https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/"
    description: "Tài liệu DNS native để tìm Kubernetes Service theo tên và namespace mà không cần địa chỉ Pod cố định."
  - title: "Spring Cloud Commons — LoadBalancer"
    url: "https://docs.spring.io/spring-cloud-commons/reference/spring-cloud-commons/loadbalancer.html"
    description: "Giải thích Spring Cloud LoadBalancer chọn instance từ Service Discovery và kiểm tra sức khỏe instance."
  - title: "Spring Cloud Netflix — Configuration Properties"
    url: "https://docs.spring.io/spring-cloud-netflix/reference/configprops.html"
    description: "Tra cứu thuộc tính Eureka client về registry fetch, heartbeat, service URL, instance ID và metadata."
