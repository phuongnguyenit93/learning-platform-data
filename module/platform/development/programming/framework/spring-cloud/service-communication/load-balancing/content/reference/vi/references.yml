references:
  - title: "Spring Cloud Commons — Spring Cloud LoadBalancer"
    url: "https://docs.spring.io/spring-cloud-commons/reference/spring-cloud-commons/loadbalancer.html"
    description: "Abstraction, Round Robin/Random, ServiceInstanceListSupplier, caching, retry, health check, hint/zone và Micrometer."
  - title: "Spring Cloud Commons — Common Abstractions"
    url: "https://docs.spring.io/spring-cloud-commons/reference/spring-cloud-commons/common-abstractions.html"
    description: "DiscoveryClient và ví dụ @LoadBalanced RestTemplate, RestClient.Builder, WebClient.Builder."
  - title: "Spring Guides — Client-Side Load-Balancing"
    url: "https://spring.io/guides/gs/spring-cloud-loadbalancer/"
    description: "Hướng dẫn thực hành Spring Boot với nhiều service instances, custom supplier và kiểm tra phân phối request."
  - title: "Spring Cloud OpenFeign — Reference"
    url: "https://docs.spring.io/spring-cloud-openfeign/reference/spring-cloud-openfeign.html"
    description: "Tích hợp Feign với discovery/LoadBalancer và phân biệt @FeignClient(name) với cấu hình URL tĩnh."
  - title: "Spring Cloud Kubernetes — LoadBalancer"
    url: "https://docs.spring.io/spring-cloud-kubernetes/reference/load-balancer.html"
    description: "Cấu hình client-side LoadBalancer trên Kubernetes theo pod hoặc service và giới hạn discovery."
  - title: "Spring Cloud Commons — Configuration Properties"
    url: "https://docs.spring.io/spring-cloud-commons/reference/configprops.html"
    description: "Các thuộc tính cache TTL, health-check interval, retry và Micrometer statistics cho LoadBalancer."