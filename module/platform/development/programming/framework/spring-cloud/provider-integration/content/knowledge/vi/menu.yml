  - Transactional outbox và bù trừ khi không có giao dịch xuyên dịch vụ
  - Circuit breaker, giới hạn đồng thời và suy giảm chức năng
  - Dừng ứng dụng an toàn khi còn thông điệp hoặc yêu cầu đang xử lý
- level1: Bảo vệ dữ liệu
  level2:
  - TLS, xác minh chứng chỉ và kết nối qua proxy
  - Private endpoint, DNS riêng và đường mạng tới dịch vụ
  - Mã hóa phía máy chủ, phía ứng dụng và quản lý khóa
  - Phân loại dữ liệu, giới hạn quyền đọc và che thông tin nhạy cảm
  - Giới hạn thời gian, phạm vi và quyền của URL hoặc token chia sẻ
  - Kiểm tra chữ ký webhook, token sự kiện và chống phát lại
  - Xoay vòng khóa, thu hồi quyền và ứng phó khi lộ thông tin xác thực
  - Lưu vết truy cập, vị trí dữ liệu và chính sách lưu giữ
- level1: Quan sát hệ thống
  level2:
  - Health indicator, readiness và liveness cho phụ thuộc đám mây
  - Đo độ trễ, tỷ lệ lỗi, throttling và số lần retry
  - Theo dõi tuổi thông điệp, lượng tồn đọng và dead-letter và thời gian xử lý
  - Liên kết trace qua HTTP, hàng đợi và xử lý nền
  - Nhật ký có cấu trúc, correlation ID và request ID của nhà cung cấp
  - Tích hợp CloudWatch, Azure Monitor hoặc Google Cloud Observability theo thư viện phù hợp
  - Giới hạn số giá trị nhãn metric và chi phí dữ liệu quan sát
  - Thiết kế cảnh báo gắn với chất lượng phục vụ và cách xử lý
- level1: Kiểm thử tích hợp
  level2:
  - Phân biệt unit test, kiểm thử hợp đồng và kiểm thử trên dịch vụ thật
  - Mock giao diện nghiệp vụ và giả lập client ở ranh giới thích hợp
  - Dùng Testcontainers để quản lý dịch vụ hoặc môi trường giả lập
  - LocalStack cho những API AWS được hỗ trợ
  - Azurite cho Storage và giới hạn các dịch vụ Azure được giả lập
  - Emulator Google Cloud và cấu hình endpoint theo từng dịch vụ
  - Chờ điều kiện bất đồng bộ và kiểm thử timeout có tính xác định
  - Kiểm thử thiếu quyền, token hết hạn, throttling và đứt kết nối
  - Kiểm thử gửi trùng, xử lý lại và tương thích schema thông điệp
  - Tạo tài nguyên kiểm thử biệt lập và dọn dẹp sau mỗi lần chạy
- level1: Triển khai ứng dụng
  level2:
  - Tách việc cấp phát tài nguyên khỏi thao tác xử lý nghiệp vụ
  - Mô tả hạ tầng bằng mã và truyền đầu ra cấu hình cho ứng dụng
  - Đóng gói JAR hoặc container và kiểm tra điều kiện môi trường chạy
  - Cấp danh tính cho ứng dụng trên máy ảo, container và Kubernetes
  - Cấp quyền CI/CD bằng liên kết danh tính thay cho khóa dài hạn
  - Cấu hình mạng, DNS, egress và endpoint riêng khi triển khai
  - Thứ tự khởi tạo tài nguyên, cấp quyền và đưa ứng dụng vào phục vụ
  - Triển khai thử, kiểm tra kết nối và rollback thay đổi tích hợp
  - Đóng listener và client đúng vòng đời khi ứng dụng dừng
- level1: Hiệu năng và chi phí
  level2:
  - Tái sử dụng client, connection pool và HTTP transport
  - Giới hạn thread, kết nối và bộ đệm trong luồng bất đồng bộ
  - Batching, prefetch và điều tiết tốc độ theo tài nguyên xử lý
  - Truyền dữ liệu dạng luồng để giới hạn bộ nhớ
  - Phân trang, bộ nhớ đệm và giảm số lần gọi dịch vụ
  - Lựa chọn region và đánh giá độ trễ, lưu lượng liên vùng
  - Ước lượng chi phí theo thao tác, dung lượng và truyền dữ liệu
  - Giám sát hạn ngạch, đặt ngân sách và phát hiện tăng chi phí
  - Đo tải bằng dịch vụ thật trước khi điều chỉnh cấu hình sản xuất
- level1: Đa đám mây
  level2:
  - Phân biệt dùng nhiều nhà cung cấp và khả năng chuyển đổi nhà cung cấp
  - So sánh mô hình lưu trữ đối tượng, thông điệp, bí mật và dữ liệu
  - Định nghĩa hợp đồng theo nhu cầu nghiệp vụ thay vì tên SDK
  - Lựa chọn cấu hình và adapter bằng profile hoặc điều kiện bean
  - Bảo toàn tính năng riêng khi một abstraction chung không đủ
  - Chuyển dữ liệu, danh tính, endpoint và quy trình vận hành
  - Kiểm thử cùng hợp đồng trên nhiều adapter
  - Đánh giá chi phí di chuyển, độ nhất quán và kế hoạch chuyển đổi
- level1: Xử lý sự cố
  level2:
  - Không tạo được bean do điều kiện auto-configuration hoặc dependency thiếu
  - Không tìm thấy danh tính hoặc chọn nhầm tài khoản, tenant, project
  - Phân biệt lỗi xác thực, thiếu quyền và tài nguyên không tồn tại
  - Sai region, endpoint, DNS hoặc kết nối private network
  - Lỗi timeout, TLS, proxy và cạn connection pool
  - Nguồn cấu hình không nạp hoặc bí mật xoay vòng chưa có hiệu lực
  - Thông điệp không được nhận, không được xác nhận hoặc bị xử lý lặp
  - Throttling, vượt hạn ngạch và điểm nóng trên partition
  - Lỗi tương thích SDK, classpath, Netty hoặc mô hình blocking/reactive
  - Khoanh vùng bằng request ID và thu thập bằng chứng đã che bí mật
- level1: Nâng cấp tích hợp
  level2:
  - Theo dõi vòng đời Spring Boot, Spring Cloud và thư viện nhà cung cấp
  - Đọc release note, migration guide và thay đổi cấu hình trước nâng cấp
  - Phân biệt thay đổi artifact, package và API công khai
  - Chuyển từ bootstrap hoặc cơ chế cấu hình cũ khi phiên bản yêu cầu
  - Thay thế thư viện hoặc connector đã ngừng bảo trì
  - Xác minh thay đổi mặc định của danh tính, retry và listener
  - Kiểm thử hồi quy hành vi và tương thích dữ liệu đang lưu
  - Nâng cấp theo giai đoạn và chuẩn bị phương án quay lại
- level1: Thực hành tổng hợp
  level2:
  - Kết nối đầu tiên tới một dịch vụ bằng danh tính có quyền tối thiểu
  - Xây dựng kho tài liệu với lưu trữ đối tượng và URL truy cập tạm thời
  - Xử lý tệp bất đồng bộ qua sự kiện, hàng đợi và tiến trình xử lý
  - Nạp cấu hình và xoay vòng bí mật mà không ghi khóa vào mã
  - Phối hợp cơ sở dữ liệu với hàng đợi bằng outbox và xử lý lũy đẳng
  - Mô phỏng lỗi quyền, timeout, thông điệp trùng và phục hồi
  - Thay adapter nhà cung cấp và kiểm thử lại hợp đồng nghiệp vụ
  - Triển khai môi trường thử, đo tải và quan sát toàn bộ luồng
  - Viết hướng dẫn chạy, sơ đồ tài nguyên và quy trình xử lý sự cố
  - Đánh giá kết quả tích hợp và dọn dẹp toàn bộ tài nguyên thực hành
