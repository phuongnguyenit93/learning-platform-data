menu:
- level1: Định hướng
  level2:
  - Tích hợp nhà cung cấp đám mây là gì và giải quyết vấn đề nào
  - Vị trí của tích hợp nhà cung cấp trong hệ sinh thái Spring Cloud
  - Phân biệt nhà cung cấp, dịch vụ được quản lý, SDK, starter và adapter
  - Bản đồ AWS, Azure, Google Cloud, OCI và Alibaba Cloud
  - Từ yêu cầu nghiệp vụ đến lựa chọn dịch vụ và cách tích hợp
  - Kiến thức cần có về Spring Boot, cấu hình, HTTP và xử lý bất đồng bộ
  - Lộ trình học từ kết nối đầu tiên đến tích hợp có thể vận hành
- level1: Nền tảng đám mây
  level2:
  - Tài khoản, subscription, project, tenancy và ranh giới tài nguyên
  - Region, availability zone, endpoint và vị trí lưu trữ dữ liệu
  - Phân biệt API quản lý tài nguyên và API truy cập dữ liệu
  - Mô hình trách nhiệm chia sẻ giữa ứng dụng và nhà cung cấp
  - Tính nhất quán, độ trễ và sự cố từng phần khi gọi dịch vụ từ xa
  - Hạn ngạch, giới hạn tốc độ và mô hình tính phí theo mức sử dụng
  - Phân tách tài nguyên phát triển, kiểm thử và sản xuất
- level1: Kiến trúc tích hợp
  level2:
  - Luồng xử lý từ mã nghiệp vụ qua Spring đến SDK và dịch vụ
  - Auto-configuration, điều kiện tạo bean và cơ chế tùy chỉnh client
  - Chọn starter, template, repository hay SDK trực tiếp theo nhu cầu
  - Phân biệt client đồng bộ, bất đồng bộ và mô hình reactive
  - Đặt giao diện nghiệp vụ và adapter nhà cung cấp ở ranh giới phù hợp
  - Vòng đời client, khả năng dùng chung và đóng tài nguyên
  - Chuyển đổi dữ liệu, ngoại lệ và thông tin yêu cầu tại ranh giới tích hợp
  - Giới hạn của tính di động giữa các nhà cung cấp
- level1: Khởi tạo dự án
  level2:
  - Chọn tổ hợp Java, Spring Boot, Spring Cloud và thư viện nhà cung cấp
  - Đọc ma trận tương thích và xác định đơn vị bảo trì từng dự án
  - Quản lý phiên bản bằng BOM trong Maven và Gradle
  - Phân tích dependency tree và xử lý xung đột SDK, HTTP client, Netty
  - Thêm đúng starter và giới hạn các tích hợp được kích hoạt
  - Tổ chức cấu hình và adapter theo từng môi trường
  - Thực hiện kết nối tối thiểu và xác minh danh tính đang sử dụng
  - Ghi lại phiên bản, tài nguyên và điều kiện chạy ví dụ có thể tái lập
- level1: Cấu hình ứng dụng
  level2:
  - Binding cấu hình dịch vụ bằng ConfigurationProperties
  - Thứ tự ưu tiên giữa tệp cấu hình, biến môi trường và nguồn từ xa
  - Nạp cấu hình bằng Config Data và spring.config.import khi được hỗ trợ
  - Phân biệt tham số cấu hình, bí mật và định danh tài nguyên
  - Chọn hành vi khi nguồn cấu hình bắt buộc hoặc tùy chọn bị lỗi
  - Kiểm tra giá trị cấu hình và phát hiện sai endpoint từ lúc khởi động
  - Tách cấu hình toàn cục với cấu hình riêng của từng dịch vụ
  - Nạp lại cấu hình, xoay vòng bí mật và giới hạn cập nhật bean đang chạy
- level1: Danh tính và quyền
  level2:
  - Phân biệt xác thực ứng dụng và phân quyền truy cập tài nguyên
  - Chuỗi tìm thông tin xác thực và thứ tự lựa chọn danh tính
  - Danh tính người phát triển tại máy cục bộ và danh tính ứng dụng khi triển khai
  - Danh tính được quản lý, vai trò và token ngắn hạn
  - Liên kết danh tính OIDC cho CI/CD và workload identity
  - Thiết kế quyền tối thiểu theo hành động và phạm vi tài nguyên
  - Truy cập khác tài khoản, subscription hoặc project
  - Hết hạn token, làm mới thông tin xác thực và thời gian hệ thống
  - Giữ khóa bí mật ngoài mã nguồn, ảnh container và nhật ký
- level1: Nền tảng AWS
  level2:
  - Spring Cloud AWS của AWSpring và ranh giới với AWS SDK for Java
  - Chọn BOM, starter và thế hệ AWS SDK phù hợp
  - DefaultCredentialsProvider và chuỗi tìm region
  - Hồ sơ AWS CLI, AWS IAM Identity Center và phát triển cục bộ
  - Vai trò IAM cho EC2, ECS và EKS theo môi trường triển khai
  - STS AssumeRole và truy cập tài nguyên khác tài khoản
  - Tùy chỉnh client theo dịch vụ, HTTP transport và endpoint
  - Thiết lập kết nối AWS giả lập bằng LocalStack
- level1: Cấu hình AWS
  level2:
  - Chọn Parameter Store hay Secrets Manager theo loại dữ liệu
  - Nạp Parameter Store bằng Config Data
  - Nạp Secrets Manager bằng Config Data
  - Ánh xạ đường dẫn, tiền tố và khóa bí mật vào thuộc tính Spring
  - Phân quyền đọc tham số, bí mật và khóa KMS liên quan
  - Nguồn cấu hình bắt buộc, optional và lỗi lúc khởi động
  - Nạp lại cấu hình và xoay vòng bí mật theo khả năng phiên bản
  - Kiểm thử quyền truy cập và xử lý cấu hình bị thiếu
- level1: Amazon S3
  level2:
  - Bucket, object key, metadata và mô hình truy cập đối tượng
  - Cấu hình S3 client, S3Template và Spring Resource
  - Thao tác tải lên, tải xuống, liệt kê và xóa đối tượng S3
  - Truyền dữ liệu dạng luồng và tải lên nhiều phần
  - Tạo URL ký sẵn và giới hạn quyền truy cập theo thời gian
  - Phân trang, điều kiện ghi và kiểm soát ghi đè
  - Mã hóa, versioning và vòng đời đối tượng
  - S3-compatible endpoint, path-style access và khác biệt với AWS S3
  - Sự kiện S3 và phối hợp xử lý tệp qua hàng đợi
- level1: Amazon SQS
  level2:
  - Standard queue, FIFO queue và phạm vi bảo đảm thứ tự
  - Gửi và nhận thông điệp bằng SqsTemplate
  - Xử lý thông điệp bằng SqsListener và listener container
  - Ánh xạ payload, header và chuyển đổi JSON
  - Visibility timeout, long polling và gia hạn thời gian xử lý
  - Chế độ xác nhận và thời điểm xóa thông điệp
  - Xử lý trùng lặp, message group và deduplication
  - Retry, dead-letter queue và phát lại thông điệp lỗi
  - Batch, mức song song, backpressure và dừng listener an toàn
- level1: Amazon SNS và SES
  level2:
  - Topic, subscription và mô hình phân phối thông báo SNS
  - Phát thông báo bằng SnsTemplate và thuộc tính thông điệp
  - Lọc subscription và phân phối SNS đến nhiều SQS queue
  - Xác minh chữ ký, xác nhận subscription và xử lý thông báo HTTP
  - Phân quyền publish, subscribe và phối hợp topic policy với queue policy
  - Tích hợp Amazon SES với cơ chế gửi thư của Spring
  - Danh tính gửi thư, sandbox và xử lý lỗi chuyển phát
  - Chọn SNS, SQS hay SES theo mục đích giao tiếp
