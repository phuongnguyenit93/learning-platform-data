  - Phân biệt Query và Scan khi thiết kế truy cập
  - Ghi có điều kiện, khóa lạc quan và lựa chọn tính nhất quán
  - Giới hạn giao dịch, dung lượng và xử lý throttling
  - Kết nối RDS qua JDBC và quản lý pool kết nối
  - Xác thực RDS bằng IAM khi được hỗ trợ và làm mới kết nối
  - Tích hợp dịch vụ AWS chưa có starter bằng SDK trong adapter riêng
