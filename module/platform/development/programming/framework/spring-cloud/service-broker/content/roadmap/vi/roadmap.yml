roadmap:
- id: vai-tro-service-broker
  title: Vai trò Service Broker
  purpose: Hiểu giao thức điều khiển dịch vụ giữa cloud platform và broker, khác với message broker.
  objectives:
  - Vẽ luồng platform → broker → dịch vụ được quản lý.
  - Phân biệt service offering, plan, instance và binding.
- id: khoi-tao-spring-broker
  title: Khởi tạo Spring Broker
  purpose: Dựng ứng dụng Spring Boot hỗ trợ Open Service Broker API mà không tự viết toàn bộ HTTP endpoint.
  objectives:
  - Cấu hình spring-cloud-starter-open-service-broker và web starter.
  - Chạy ứng dụng và xác nhận đường dẫn /v2/catalog.
- id: catalog-service-plans
  title: Catalog & Service Plans
  purpose: Công bố dịch vụ và gói cấu hình để platform hiển thị đúng marketplace.
  objectives:
  - Khai báo Catalog gồm ServiceDefinition và Plan.
  - Kiểm tra ID, tên, bindable và plan_updateable phù hợp.
- id: provision-service-instance
  title: Provision Service Instance
  purpose: Xây vòng đời tạo tài nguyên theo yêu cầu của platform.
  objectives:
  - Triển khai createServiceInstance trong ServiceInstanceService.
  - Lưu instance ID, plan và trạng thái tài nguyên để truy xuất.
- id: update-deprovision
  title: Update & Deprovision
  purpose: Quản lý thay đổi hoặc xóa tài nguyên một cách nhất quán qua nhiều yêu cầu.
  objectives:
  - Triển khai update/delete khi chức năng được hỗ trợ.
  - Kiểm tra idempotency và tránh xóa nhầm tài nguyên.
- id: binding-credentials
  title: Binding & Credentials
  purpose: Cấp quyền truy cập tài nguyên cho ứng dụng sử dụng dịch vụ.
  objectives:
  - Triển khai create/delete bằng ServiceInstanceBindingService.
  - Cấp credentials riêng cho binding và thu hồi khi unbind.
- id: async-last-operation
  title: Async & Last Operation
  purpose: Theo dõi thao tác provisioning/binding dài mà không phải giữ HTTP request chờ.
  objectives:
  - Trả trạng thái in-progress và lưu operation ID khi hỗ trợ async.
  - Triển khai getLastOperation cho luồng polling của platform.
- id: api-security-errors
  title: API Security & Errors
  purpose: Bảo vệ endpoint quản trị và trả phản hồi theo đúng hợp đồng OSB API.
  objectives:
  - Bật HTTPS và bảo vệ /v2/** bằng Spring Security.
  - Kiểm tra API-version header và mã lỗi khi tài nguyên xung đột.
- id: contract-tests-van-hanh
  title: Contract Tests & Vận hành
  purpose: Xác nhận broker tương thích với platform và đủ thông tin để xử lý sự cố.
  objectives:
  - Test catalog, provision, bind, unbind và deprovision qua API.
  - Giám sát log, lỗi, retry và trạng thái operation sau restart.
