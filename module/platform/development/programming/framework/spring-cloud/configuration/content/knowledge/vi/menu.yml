menu:
- level1: Định hướng
  level2:
  - Cấu hình tập trung là gì và giải quyết vấn đề nào
  - Vì sao cấu hình cần tách khỏi mã nguồn và gói triển khai
  - 'Các khái niệm: nguồn cấu hình, môi trường, profile, label và bí mật'
  - Vị trí của Spring Cloud Config trong hệ sinh thái Spring Cloud
  - Phân biệt cấu hình ứng dụng, Service Discovery và quản lý bí mật
  - Phân biệt thay đổi lúc khởi động, làm mới khi chạy và triển khai lại
  - Kiến thức nền và trình tự học từ cấu hình cục bộ đến phân tán
- level1: Nền tảng cấu hình
  level2:
  - Spring Environment và các lớp PropertySource
  - Đọc cấu hình bằng Environment, @Value và @ConfigurationProperties
  - Binding kiểu dữ liệu, Duration, danh sách và cấu trúc lồng nhau
  - Relaxed binding và ánh xạ tên thuộc tính sang biến môi trường
  - Giá trị mặc định, placeholder và tham chiếu giữa các thuộc tính
  - Kiểm tra ràng buộc cấu hình bằng Bean Validation
  - YAML nhiều tài liệu và spring.config.activate.on-profile
  - Cấu hình chung, cấu hình theo môi trường và dữ liệu nghiệp vụ
  - Phân biệt khóa không tồn tại, giá trị rỗng và giá trị mặc định
- level1: Kiến trúc Config
  level2:
  - Vai trò của Config Server, Config Client và kho cấu hình
  - Luồng nạp cấu hình từ kho lưu trữ đến Spring Environment
  - Bộ ba application, profile và label trong truy vấn cấu hình
  - EnvironmentRepository và mô hình Environment phía máy chủ
  - Ranh giới giữa cấu hình riêng Config Server và cấu hình phục vụ client
  - Nạp lúc khởi động khác phát hiện và áp dụng thay đổi khi chạy
  - Các điểm có thể lỗi giữa client, Config Server và kho lưu trữ
  - Chọn Config Server hay nạp trực tiếp từ Consul, Zookeeper hoặc Vault
- level1: Chuẩn bị môi trường
  level2:
  - Chọn tổ hợp Java, Spring Boot và Spring Cloud Release Train tương thích
  - Quản lý phiên bản bằng Spring Cloud BOM trong Maven và Gradle
  - Thêm đúng starter cho Config Server, Config Client và Actuator
  - Dựng kho Git cấu hình cùng ứng dụng client tối thiểu
  - Tách profile chạy cục bộ, kiểm thử và sản xuất
  - Chạy nhiều client và hạ tầng hỗ trợ bằng Docker Compose
  - Kiểm tra dependency, tự cấu hình và điều kiện tái lập thí nghiệm
- level1: Thiết kế kho cấu hình
  level2:
  - Quy ước tên application.yml và tệp theo tên ứng dụng
  - Tổ chức tệp theo ứng dụng, profile và thư mục
  - Chọn YAML hoặc properties và thống nhất quy ước đặt khóa
  - Chia cấu hình dùng chung với cấu hình riêng từng dịch vụ
  - Thiết kế cấu trúc cho nhiều nhóm và nhiều môi trường
  - Chọn một kho Git hay nhiều kho theo ranh giới sở hữu
  - Giữ bí mật, tệp nhị phân và dữ liệu lớn ngoài kho cấu hình
  - Đặt giá trị mặc định an toàn và ghi rõ đơn vị của tham số
  - Tài liệu hóa khóa cấu hình và trách nhiệm bảo trì
- level1: Profile và label
  level2:
  - Phân biệt Spring profile với Git branch, tag và commit
  - Kích hoạt một hoặc nhiều profile phía client
  - Quy tắc kết hợp cấu hình mặc định và cấu hình theo profile
  - Chọn label và cấu hình nhánh mặc định phía máy chủ
  - Dùng tag hoặc commit để xác định phiên bản cấu hình
  - Xử lý label chứa dấu gạch chéo trong API của Config Server
  - 'Nhiều label: hành vi dự phòng và hỗ trợ theo phiên bản'
  - Tách môi trường triển khai khỏi chiến lược phân nhánh mã nguồn
- level1: Config Server
  level2:
  - Khởi tạo máy chủ với @EnableConfigServer
  - Cấu hình cổng, context path và tiền tố đường dẫn máy chủ
  - Kết nối kho Git bằng spring.cloud.config.server.git.uri
  - Kiểm tra cấu hình được phân giải qua yêu cầu HTTP đầu tiên
  - Cấu hình accept-empty và hành vi khi không tìm thấy ứng dụng
  - Cấu hình ghi đè phía máy chủ bằng server.overrides
  - Đánh giá phạm vi sử dụng Config Server nhúng trong ứng dụng khác
  - Đọc trạng thái sức khỏe và xác minh kết nối kho cấu hình
- level1: API cấu hình
  level2:
  - Truy vấn Environment theo /{application}/{profile}/{label}
  - Đọc propertySources, profiles, label, version và state trong phản hồi
  - Phân biệt thứ tự nguồn trong phản hồi và giá trị cuối cùng phía client
  - Truy xuất cấu hình dưới dạng YAML hoặc properties
  - Phục vụ tệp cấu hình thuần văn bản và giới hạn sử dụng
  - Placeholder và phân giải giá trị trong nội dung được trả về
  - Kiểm tra mã HTTP khi thiếu tài nguyên, lỗi xác thực hoặc lỗi kho
  - Kiểm chứng API bằng curl mà không làm lộ giá trị bí mật
- level1: Kho Git
  level2:
  - Kết nối Git cục bộ, HTTPS và SSH
  - Xác thực kho riêng bằng token, khóa SSH và cấu hình bí mật bên ngoài
  - JGit, known_hosts và xử lý khóa máy chủ SSH
  - Clone khi khởi động hay khi nhận yêu cầu đầu tiên
  - Thư mục clone, basedir và quyền ghi trong container
  - search-paths và placeholder theo ứng dụng, profile hoặc label
  - Ánh xạ nhiều repository bằng mẫu tên ứng dụng và profile
  - refresh-rate và đánh đổi giữa độ mới dữ liệu với số lần fetch
  - Xử lý bản sao Git bị thay đổi và tùy chọn force-pull
  - Dọn nhánh đã xóa và kiểm soát bản tham chiếu cũ
  - Kiểm chứng hành vi khi Git mất kết nối nhưng đã có bản sao cục bộ
- level1: Nguồn lưu trữ khác
  level2:
  - Native backend với classpath và hệ thống tệp
  - Thiết lập search-locations và đường dẫn file trên Windows hoặc Linux
  - 'Phân biệt native backend với kho Git có URI file:'
  - Đóng gói cấu hình cùng ứng dụng hoặc gắn thư mục bên ngoài container
  - 'JDBC backend: mô hình khóa theo application, profile và label'
  - Redis backend và cách tổ chức dữ liệu cấu hình
  - Vault, CredHub và kho bí mật làm backend của Config Server
  - 'Kho đối tượng và dịch vụ tham số đám mây: hỗ trợ theo phiên bản'
  - Đánh giá độ bền dữ liệu, quyền truy cập và sao lưu từng backend
- level1: Kho tổng hợp
  level2:
  - Khi nào cần kết hợp nhiều EnvironmentRepository
  - Khai báo composite profile và danh sách repository
  - Thứ tự repository và xử lý trùng khóa bằng order
  - Kết hợp Git cho cấu hình thường với kho bí mật
  - Phạm vi áp dụng application, profile và label ở từng backend
  - failOnCompositeError và đánh đổi khi chỉ một nguồn bị lỗi
  - Kiểm chứng nguồn gốc giá trị sau khi tổng hợp
- level1: Config Client
  level2:
  - 'Kết nối Config Server bằng spring.config.import=configserver:'
  - 'optional:configserver: và hành vi khi máy chủ không truy cập được'
  - Địa chỉ trong import so với spring.cloud.config.uri
  - Ánh xạ spring.application.name và cấu hình name, profile, label
  - Quá trình nạp profile mặc định rồi nạp profile được kích hoạt
  - Nạp nhiều nguồn import và xác định thứ tự áp dụng
  - Giới hạn thời gian kết nối và thời gian đọc phản hồi
  - Fail-fast, thư viện retry và chính sách giãn cách thử lại
  - Tham số retry khi import được đặt trong tệp theo profile
  - Tắt Config Client đúng phạm vi và chạy ứng dụng độc lập
- level1: Thứ tự ưu tiên
  level2:
  - Ưu tiên nguồn cấu hình theo cơ chế Config Data
  - Thứ tự giữa tệp cục bộ, nguồn import và cấu hình theo profile
  - Đối chiếu biến môi trường, system property và tham số dòng lệnh
  - Phân biệt ưu tiên phía Config Server với ưu tiên phía client
  - Tác động của server.overrides lên giá trị client nhận được
  - allowOverride, overrideNone và overrideSystemProperties trong bootstrap cũ
  - Giải thích một giá trị bằng nguồn gốc thay vì đoán theo tên tệp
  - Trùng khóa giữa nhiều kho và nhiều hệ thống cấu hình
  - Thiết kế quy tắc ghi đè rõ ràng và kiểm thử bằng ví dụ xung đột
- level1: Bootstrap cũ
  level2:
  - Vai trò của bootstrap context và application context
  - Khi nào bootstrap.yml được đọc và cách kích hoạt cơ chế cũ
  - Phân biệt bootstrap.yml, application.yml và spring.config.import
  - Config-first và discovery-first trong mô hình bootstrap
  - Tìm Config Server qua Service Discovery và chi phí khởi động
  - Vòng phụ thuộc giữa Config Server, Discovery Server và ứng dụng
  - Chuyển sang Config Data mà không nạp trùng nguồn cấu hình
- level1: Làm mới cấu hình
  level2:
  - Chu trình thay đổi kho, nạp lại Environment và cập nhật bean
  - Gọi POST /actuator/refresh và đọc các khóa được báo thay đổi
  - Phân biệt cập nhật kho Git với làm mới ứng dụng client
  - EnvironmentChangeEvent và quá trình rebind ConfigurationProperties
  - '@Value trên singleton thông thường và giá trị đã được khởi tạo'
  - Thay đổi cấu hình ghi log và giới hạn áp dụng động
  - Khóa bị xóa, giá trị rỗng và những trường hợp không cập nhật như dự kiến
  - Tham số cần khởi động lại như cổng, bean condition và lựa chọn hạ tầng
  - Xử lý cấu hình mới không hợp lệ mà không làm hỏng luồng đang chạy
  - Phân biệt cập nhật tạm qua Actuator env với thay đổi nguồn bền vững
- level1: RefreshScope
  level2:
  - '@RefreshScope, scoped proxy và khởi tạo bean theo nhu cầu'
  - Làm mất hiệu lực bộ đệm scope và thời điểm tạo lại bean
  - Đặt RefreshScope trên @Bean hay trên lớp cấu hình
  - Bean phụ thuộc giữ tham chiếu cũ và cách kiểm chứng
  - Đóng tài nguyên cũ khi bean được tạo lại
  - Giới hạn với constructor binding, record và bean không thể làm mới
  - DataSource, connection pool và danh sách never-refreshable
  - Tính nhất quán khi nhiều luồng đọc cấu hình đang thay đổi
  - Giới hạn làm mới trong Spring AOT và native image
- level1: Spring Cloud Bus
  level2:
  - Vai trò của Bus trong lan truyền thay đổi tới nhiều client
  - Chọn starter Bus với RabbitMQ hoặc Kafka
  - Cấu hình broker và kết nối trên Config Server cùng các client
  - POST /actuator/busrefresh và phạm vi làm mới từ xa
  - Định danh spring.cloud.bus.id và lỗi trùng ID giữa các instance
  - Địa chỉ đích cho toàn hệ thống, một dịch vụ hoặc một instance
  - Phân biệt busrefresh với busenv và tính bền vững của thay đổi
  - Sự kiện trễ, bị xử lý lặp hoặc bỏ lỡ và cách đối soát trạng thái
  - 'Giới hạn của Bus: không tạo giao dịch cập nhật đồng thời mọi client'
  - Bảo vệ endpoint Bus, kết nối broker và nội dung sự kiện
- level1: Webhook cấu hình
  level2:
  - Luồng Git push đến /monitor rồi phát sự kiện làm mới
  - Kích hoạt spring-cloud-config-monitor và điều kiện sử dụng Bus
  - Ánh xạ tệp thay đổi sang ứng dụng bị ảnh hưởng
  - Thay đổi application.yml và phạm vi tác động tới các client
  - Tích hợp GitHub hoặc GitLab và xác minh webhook theo phiên bản
  - Kiểm soát yêu cầu lặp, nguồn gửi và phạm vi đường dẫn
  - Phân biệt nhận webhook thành công với client đã áp dụng cấu hình
- level1: Mã hóa cấu hình
  level2:
  - Phân biệt mã hóa khi lưu trữ, TLS và kiểm soát quyền đọc
  - Cơ chế {cipher} trong giá trị cấu hình
  - Dùng /encrypt và /decrypt với dữ liệu được truyền đúng định dạng
  - Mã hóa đối xứng bằng encrypt.key
  - Mã hóa bất đối xứng bằng keystore, alias và cặp khóa
  - Giải mã phía Config Server so với giải mã phía client
  - Xử lý ciphertext hỏng, thiếu khóa và giá trị giải mã không hợp lệ
  - Xoay vòng khóa và đọc cấu hình cũ trong giai đoạn chuyển đổi
  - Giữ khóa giải mã ngoài repository và kiểm soát endpoint mật mã
- level1: Bảo mật
  level2:
  - Ranh giới tin cậy giữa client, Config Server, kho Git và broker
  - Xác thực truy cập Config Server bằng Spring Security
  - Phân quyền đọc cấu hình theo ứng dụng và môi trường
  - Không dùng application, profile hoặc label thay cho kiểm soát quyền
  - TLS, mTLS, truststore và xác minh chứng thư máy chủ
  - Quản lý token Git, mật khẩu broker và thông tin xác thực client
  - Giới hạn exposure, quyền truy cập và CSRF cho từng endpoint quản trị
  - Che bí mật trong Actuator env, configprops, log và thông báo lỗi
  - Kiểm soát lịch sử Git và xử lý khi bí mật đã bị commit
- level1: Vault Config
  level2:
  - Phân biệt Spring Cloud Vault trực tiếp với Vault backend của Config Server
  - Nạp bí mật bằng spring.config.import=vault://
  - KV v1, KV v2 và cách ánh xạ context theo ứng dụng, profile
  - Lựa chọn đường dẫn tường minh và tiền tố thuộc tính để tránh trùng khóa
  - Xác thực bằng token hoặc danh tính workload phù hợp môi trường
  - Policy tối thiểu, namespace và ranh giới truy cập bí mật
  - Vòng đời token, lease và thông tin xác thực động
  - Phân biệt gia hạn bí mật với làm mới bean đang sử dụng bí mật
- level1: Consul Config
  level2:
  - Nạp cấu hình từ Consul KV bằng spring.config.import
  - Context dùng chung, context ứng dụng và context theo profile
  - prefix, default-context và profile-separator
  - Giá trị KV rời so với khối YAML hoặc properties
  - data-key và cách tổ chức cấu hình nhiều tài liệu
  - Config Watch, truy vấn chờ thay đổi và sự kiện làm mới
  - ACL token, kết nối an toàn và hành vi khi Consul lỗi
  - Tách chức năng Consul Config khỏi Consul Service Discovery
- level1: Zookeeper Config
  level2:
  - Nạp cấu hình từ Zookeeper bằng spring.config.import
  - Cấu trúc znode cho cấu hình chung, ứng dụng và profile
  - root, default-context và profile-separator
  - Chọn context tường minh và thứ tự nguồn thuộc tính
  - Theo dõi namespace cấu hình và kích hoạt quá trình làm mới
  - Kết nối Curator, tái kết nối và lỗi đọc cấu hình
  - ACL, xác thực và ranh giới với Zookeeper Service Discovery
- level1: Độ sẵn sàng
  level2:
  - Chạy nhiều Config Server cùng nguồn cấu hình
  - Cân bằng tải, địa chỉ ổn định và discovery-first
  - Nhiều URI trong Config Client so với nhiều vị trí Config Data import
  - Chuyển máy chủ khi timeout khác khi sai quyền hoặc sai cấu hình
  - Sự cố kho Git, Vault hoặc broker và ảnh hưởng tới từng luồng
  - Ứng dụng đã chạy so với ứng dụng vừa khởi động khi mất nguồn cấu hình
  - Tránh đồng loạt retry và refresh sau khi hạ tầng phục hồi
  - Đồng nhất phiên bản cấu hình giữa các Config Server
  - Đặt tiêu chí phục hồi và kiểm chứng bằng thí nghiệm gây lỗi
- level1: Quản trị thay đổi
  level2:
  - Quyền sở hữu khóa cấu hình và quy trình review bằng pull request
  - Kiểm tra cú pháp, kiểu dữ liệu và ràng buộc trước khi hợp nhất
  - Tương thích cấu hình giữa phiên bản ứng dụng cũ và mới
  - Thêm khóa, đổi tên khóa và loại bỏ khóa theo giai đoạn
  - Phát hành cấu hình bằng commit hoặc tag có thể truy vết
  - Triển khai thử trên một nhóm client trước khi mở rộng
  - Đổi đồng thời nhiều khóa và giới hạn về tính nguyên tử phân tán
  - Quay lại cấu hình trước và xác minh giá trị thực trên client
  - Ranh giới giữa cấu hình động và hệ thống quản lý feature flag
- level1: Quan sát hệ thống
  level2:
  - Theo dõi health của Config Server và các repository
  - Phân biệt ứng dụng đang sống với cấu hình đã được nạp thành công
  - Đo độ trễ, lỗi và số lần truy vấn cấu hình
  - Quan sát thời gian fetch Git, truy cập backend và retry
  - Ghi nhận phiên bản nguồn cùng lần làm mới gần nhất mà không lộ bí mật
  - Đối chiếu Environment, configprops và giá trị bean đang sử dụng
  - Theo dõi Bus, webhook và client bỏ lỡ thay đổi
  - Cảnh báo lỗi nạp cấu hình, sai phiên bản và cập nhật không hội tụ
- level1: Kiểm thử
  level2:
  - Kiểm thử binding và validation bằng ApplicationContextRunner
  - Kiểm thử thứ tự ưu tiên với nhiều PropertySource
  - Dựng kho Git tạm có branch, tag, commit và profile
  - Kiểm thử API Config Server bằng dữ liệu cấu hình đã biết
  - Kiểm thử Config Client với máy chủ thật hoặc HTTP giả lập
  - Kiểm thử refresh, rebind và vòng đời bean RefreshScope
  - Kiểm thử Bus nhiều instance và địa chỉ đích
  - Dùng Testcontainers cho broker, Vault, Consul hoặc Zookeeper
  - Gây lỗi timeout, mất quyền, label thiếu và ciphertext không hợp lệ
  - Giữ kiểm thử độc lập, che bí mật và dọn tài nguyên sau khi chạy
- level1: Chẩn đoán sự cố
  level2:
  - Không có spring.config.import hoặc Config Client không được kích hoạt
  - Sai tên ứng dụng, profile, label hoặc vị trí tệp cấu hình
  - Máy chủ trả cấu hình nhưng giá trị phía client không đúng dự kiến
  - Lỗi clone hoặc fetch Git do token, SSH, proxy hay quyền thư mục
  - Cấu hình chưa cập nhật vì bản sao Git hoặc chu kỳ refresh-rate
  - Lỗi khởi động do optional, fail-fast, retry hoặc timeout
  - POST refresh thành công nhưng bean vẫn giữ giá trị cũ
  - Bus không lan truyền vì trùng ID, sai đích hoặc mất kết nối broker
  - Webhook nhận được nhưng không ánh xạ đúng ứng dụng
  - Lỗi giải mã, keystore, chứng thư hoặc quyền truy cập bí mật
  - Consul Watch, Zookeeper watcher hoặc Vault lease không hoạt động như dự kiến
  - Thu thập nguồn gốc thuộc tính và khoanh vùng từng chặng
- level1: Mở rộng và nâng cấp
  level2:
  - Khi nào cần EnvironmentRepository tùy chỉnh
  - Triển khai findOne và ánh xạ Environment cùng PropertySource
  - Tích hợp repository tùy chỉnh vào composite và thứ tự Ordered
  - Mở rộng nhận diện tệp thay đổi qua PropertyPathNotificationExtractor
  - Phạm vi tùy chỉnh ConfigDataLocationResolver và ConfigDataLoader
  - Đánh giá thay đổi hành vi giữa các phiên bản Config Server và Client
  - Chuyển cơ chế bootstrap cũ và hướng dẫn Actuator lỗi thời
  - 'Tích hợp ConfigMap, Secret hoặc configtree: ranh giới với module Kubernetes'
  - Đánh giá nâng cấp, kiểm thử hồi quy và phương án quay lại
- level1: Thực hành tổng hợp
  level2:
  - Dựng Config Server cùng hai client dùng cấu hình chung và riêng
  - Thử nhiều profile và label rồi giải thích giá trị được chọn
  - Tạo xung đột giữa Git, biến môi trường và tham số dòng lệnh
  - Thay đổi cấu hình và so sánh refresh, RefreshScope với khởi động lại
  - Lan truyền thay đổi bằng Bus tới một dịch vụ hoặc một instance
  - Tự động kích hoạt làm mới từ webhook của kho Git
  - Kết hợp Git với kho bí mật và kiểm thử phân quyền
  - Gây lỗi Config Server, kho nguồn và broker rồi kiểm chứng phục hồi
  - Phát hành thử, quay lại cấu hình và đối chiếu trạng thái mọi client
  - Viết hướng dẫn vận hành cùng bằng chứng cấu hình không lộ bí mật
