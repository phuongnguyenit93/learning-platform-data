references:
  - title: "Spring — Spring Cloud Config Project"
    url: "https://spring.io/projects/spring-cloud-config/"
    description: "Giới thiệu Config Server/Client, cấu hình tập trung và nguyên tắc externalized configuration."
  - title: "Spring Cloud Config — Config Server"
    url: "https://docs.spring.io/spring-cloud-config/reference/server.html"
    description: "Tạo Config Server bằng @EnableConfigServer và cung cấp cấu hình qua HTTP API."
  - title: "Spring Cloud Config — Environment Repository"
    url: "https://docs.spring.io/spring-cloud-config/reference/server/environment-repository.html"
    description: "Quy tắc application/profile/label, thứ tự PropertySource và cách nạp cấu hình chung, riêng."
  - title: "Spring Cloud Config — Git Backend"
    url: "https://docs.spring.io/spring-cloud-config/reference/server/environment-repository/git-backend.html"
    description: "Git URI, labels, cloneOnStart, đồng bộ repository và hành vi khi backend không khả dụng."
  - title: "Spring Cloud Config — Config Client"
    url: "https://docs.spring.io/spring-cloud-config/reference/client.html"
    description: "Sử dụng spring.config.import, optional, fail-fast, retry, profile và client security."
  - title: "Spring Cloud Config — Encryption and Decryption"
    url: "https://docs.spring.io/spring-cloud-config/reference/server/encryption-and-decryption.html"
    description: "Mã hóa secret dạng {cipher}, endpoint /encrypt và /decrypt, cùng rủi ro khóa bảo mật."
  - title: "Spring Cloud Config — Security"
    url: "https://docs.spring.io/spring-cloud-config/reference/server/security.html"
    description: "HTTPS, xác thực client, phân quyền theo application và bảo vệ thông tin cấu hình."
  - title: "Spring Cloud Config — Push Notifications and Bus"
    url: "https://docs.spring.io/spring-cloud-config/reference/server/push-notifications-and-bus.html"
    description: "Webhook /monitor, Spring Cloud Bus và phát sự kiện cập nhật cấu hình tới ứng dụng."
  - title: "Spring Cloud Commons — Refresh Scope"
    url: "https://docs.spring.io/spring-cloud-commons/reference/spring-cloud-commons/application-context-services.html"
    description: "EnvironmentChangeEvent, rebind cấu hình, @RefreshScope và Actuator /refresh."
  - title: "Spring Cloud Config — Health Indicator"
    url: "https://docs.spring.io/spring-cloud-config/reference/server/health-indicator.html"
    description: "Theo dõi trạng thái EnvironmentRepository và kiểm tra ứng dụng, profile, label tùy chọn."