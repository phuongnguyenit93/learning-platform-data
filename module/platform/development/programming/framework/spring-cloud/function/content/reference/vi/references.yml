references:
  - title: "Spring Cloud Function — Introduction"
    url: "https://docs.spring.io/spring-cloud-function/reference/spring-cloud-function/introduction.html"
    description: "Mục tiêu tách business logic khỏi runtime, functional model và các adapter HTTP, streaming, serverless."
  - title: "Spring Cloud Function — Programming Model"
    url: "https://docs.spring.io/spring-cloud-function/reference/spring-cloud-function/programming-model.html"
    description: "Supplier, Function, Consumer, FunctionCatalog, type conversion, function composition và routing."
  - title: "Spring Cloud Function — Functional Bean Definitions"
    url: "https://docs.spring.io/spring-cloud-function/reference/functional.html"
    description: "Khai báo, nhận diện và vận hành functional bean trong ứng dụng Spring Boot."
  - title: "Spring Cloud Function — Standalone Web Applications"
    url: "https://docs.spring.io/spring-cloud-function/reference/spring-cloud-function/standalone-web-applications.html"
    description: "Xuất hàm thành HTTP endpoint, phương thức HTTP, đường dẫn và content type hỗ trợ."
  - title: "Spring Cloud Function — Standalone Streaming Applications"
    url: "https://docs.spring.io/spring-cloud-function/reference/spring-cloud-function/standalone-streaming-applications.html"
    description: "Kết hợp Spring Cloud Stream để tiếp nhận và xử lý thông điệp qua broker."
  - title: "Spring Cloud Function — Deploying a Packaged Function"
    url: "https://docs.spring.io/spring-cloud-function/reference/spring-cloud-function/deploying-a-packaged.html"
    description: "Đóng gói, nạp và gọi hàm từ JAR thông qua function deployer và FunctionCatalog."
  - title: "Spring Cloud Function — AWS Lambda Adapter"
    url: "https://docs.spring.io/spring-cloud-function/reference/adapters/aws-intro.html"
    description: "Triển khai functional bean lên AWS Lambda qua FunctionInvoker, package, handler và routing."
  - title: "Spring Cloud Function — Microsoft Azure Functions"
    url: "https://docs.spring.io/spring-cloud-function/reference/adapters/azure-intro.html"
    description: "Tích hợp Spring Cloud Function với Azure Functions, cách triển khai và cấu hình adapter."
  - title: "Spring Cloud Function — Google Cloud Functions"
    url: "https://docs.spring.io/spring-cloud-function/reference/adapters/gcp-intro.html"
    description: "Sử dụng Spring Cloud Function adapter khi thực thi Java functions trên Google Cloud."