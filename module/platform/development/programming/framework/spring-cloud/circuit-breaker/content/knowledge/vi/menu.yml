  - 'fallbackUri với forward: và xử lý phản hồi dự phòng'
  - Chuyển HTTP status được chọn thành lỗi để kích hoạt ngắt mạch
  - Truyền nguyên nhân fallback và tránh lộ chi tiết nội bộ
  - Ranh giới phối hợp với Retry filter, timeout và LoadBalancer
- level1: Registry và sự kiện
  level2:
  - CircuitBreakerRegistry và vòng đời các instance có tên
  - Lấy lại cùng instance so với tạo registry độc lập
  - Đọc cấu hình, trạng thái và snapshot thống kê
  - Sự kiện thành công, lỗi, lời gọi chậm và bị từ chối
  - Lắng nghe chuyển trạng thái và tránh đăng ký listener lặp
  - Quản lý dung lượng bộ đệm sự kiện và chi phí xử lý
  - Chuyển trạng thái thủ công, reset và tác động tới thống kê
  - Mở rộng registry hoặc event consumer mà không chặn đường xử lý chính
- level1: Các hiện thực khác
  level2:
  - Đối chiếu hiện thực được hỗ trợ trong đúng Spring Cloud Release Train
  - SpringRetryCircuitBreakerFactory và SpringRetryConfigBuilder
  - CircuitBreakerRetryPolicy, DefaultRetryState và stateful retry
  - Tùy chỉnh RetryPolicy, thời gian mở mạch và RetryListener
  - Phân biệt ngữ nghĩa Spring Retry với cửa sổ tỷ lệ lỗi Resilience4j
  - 'Spring Framework Retry: điều kiện Spring Framework 7 và phiên bản tương thích'
  - FrameworkRetryCircuitBreakerFactory và giới hạn ứng dụng reactive
  - Đánh giá tích hợp Sentinel hoặc hiện thực bên ngoài theo artifact thực tế
  - Kiểm thử hợp đồng và giới hạn khi đổi nhà cung cấp
- level1: Quan sát hệ thống
  level2:
  - Tích hợp Actuator, resilience4j-micrometer và hệ thống thu thập số liệu
  - Đọc số lời gọi thành công, lỗi và bị từ chối
  - Theo dõi tỷ lệ lỗi, lời gọi chậm và thời gian thực thi
  - Quan sát trạng thái, số lần chuyển mạch và thời gian giữ OPEN
  - Phân biệt số liệu tác vụ gốc với số liệu fallback và retry
  - Health indicator của bộ ngắt mạch và ảnh hưởng tới readiness
  - Tránh dùng lỗi một phụ thuộc tùy chọn để làm hỏng liveness
  - Kiểm soát số lượng nhãn và ID trong metrics
  - Dashboard và cảnh báo dựa trên tác động phục vụ thực tế
- level1: Thiết kế ranh giới
  level2:
  - Chọn một bộ ngắt mạch theo phụ thuộc hay theo thao tác
  - Không dùng một ID chung cho các hệ thống độc lập
  - Cân nhắc tách thao tác đọc, ghi và nhóm độ trễ khác nhau
  - Quản lý tenant mà không tạo số instance không giới hạn
  - Trạng thái riêng mỗi replica và hiệu ứng thăm dò đồng loạt
  - Quan hệ với Service Discovery, cân bằng tải và instance bị lỗi
  - Đặt ngưỡng phù hợp lưu lượng thấp và lưu lượng cao
  - Hệ thống nhiều tầng gọi và chiến lược tránh lỗi lan truyền
  - Giới hạn Circuit Breaker cục bộ so với bảo vệ toàn hệ thống
- level1: Hiệu năng
  level2:
  - Chi phí thống kê theo kích thước cửa sổ và số instance
  - Tính an toàn luồng và phạm vi đồng bộ hóa của Resilience4j
  - Năng lực phục vụ, độ trễ và ước lượng số lời gọi đồng thời
  - Thread pool, hàng đợi và connection pool khi phụ thuộc chậm
  - Chi phí log sự kiện và metrics trên đường xử lý chính
  - Đo overhead với tải bình thường, lỗi liên tục và mạch mở
  - Điều chỉnh ngưỡng bằng số liệu thay vì sao chép cấu hình mẫu
- level1: Kiểm thử
  level2:
  - Kiểm thử chuỗi kết quả để xác minh CLOSED chuyển sang OPEN
  - Kiểm thử minimumNumberOfCalls và trường hợp chưa đủ mẫu
  - Kiểm thử lời gọi chậm độc lập với lời gọi lỗi
  - Kiểm thử cửa sổ theo số lượng và theo thời gian
  - Kiểm thử OPEN không thực thi Supplier hoặc Publisher gốc
  - Kiểm thử HALF_OPEN phục hồi thành công và mở lại khi lỗi
  - Kiểm thử recordExceptions, ignoreExceptions và predicate
  - Kiểm thử fallback, timeout và tác vụ vẫn chạy sau khi hết hạn
  - Kiểm thử nhiều luồng, Bulkhead đầy và hàng đợi bị từ chối
  - Dùng StepVerifier cho lỗi, subscription và thời gian trong luồng reactive
  - Kiểm thử tích hợp bằng HTTP giả lập và registry được cô lập
- level1: Vận hành
  level2:
  - Triển khai cấu hình ngắt mạch theo profile và phạm vi dịch vụ
  - Chạy thử ở chế độ chỉ quan sát khi hiện thực hỗ trợ
  - Phát hành thử ngưỡng mới trên một nhóm replica
  - Giám sát tải phục hồi khi nhiều bộ ngắt mạch cùng HALF_OPEN
  - Quy trình ép OPEN, reset và trả lại chế độ tự động có kiểm soát
  - Bảo vệ endpoint quản trị và quyền thay đổi cấu hình
  - Đối chiếu cấu hình mong muốn với instance đang tồn tại
  - Viết quy trình xử lý sự cố cùng điều kiện xác nhận phục hồi
- level1: Chẩn đoán sự cố
  level2:
  - Bộ ngắt mạch không mở vì chưa đủ mẫu hoặc cấu hình sai ID
  - HTTP trả lỗi nhưng vẫn được ghi nhận là thành công
  - Mạch mở quá sớm do nhiều thao tác dùng chung thống kê
  - Đã hết thời gian OPEN nhưng chưa có lời gọi thăm dò
  - HALF_OPEN giữ quá lâu vì lời gọi chưa hoàn tất
  - Fallback luôn chạy do TimeLimiter mặc định hoặc hàng đợi đầy
  - Annotation không có hiệu lực vì self-invocation hoặc thiếu AOP
  - Reactive pipeline không được bao đúng hoặc bị đăng ký nhiều lần
  - Không có metrics hay health indicator do thiếu phụ thuộc hoặc exposure
  - Feign hoặc Gateway sinh tên khác khóa cấu hình mong đợi
  - Mất ngữ cảnh log, tracing hoặc thông tin xác thực khi chuyển thread
  - Retry nhiều lớp, rò rỉ tác vụ và fallback gây quá tải thứ cấp
- level1: Chuyển đổi tích hợp
  level2:
  - Đọc ma trận tương thích trước khi nâng cấp Spring Cloud hoặc Resilience4j
  - Phân biệt cấu hình Hystrix cũ với Spring Cloud CircuitBreaker
  - Ánh xạ mục đích timeout, isolation và fallback khi rời Hystrix
  - Chuyển từ API nhà cung cấp trực tiếp sang abstraction khi phù hợp
  - Chuyển giữa annotation và factory mà giữ nguyên ranh giới bảo vệ
  - Kiểm tra thay đổi mặc định của TimeLimiter, Bulkhead và quy tắc đặt tên
  - Kiểm thử hồi quy số liệu, luồng xử lý và ngữ nghĩa fallback
- level1: Thực hành tổng hợp
  level2:
  - Dựng dịch vụ phụ thuộc có chế độ thành công, lỗi và phản hồi chậm
  - Đo chuỗi CLOSED, OPEN, HALF_OPEN rồi phục hồi
  - So sánh ngắt mạch theo tỷ lệ lỗi và theo tỷ lệ lời gọi chậm
  - Bảo vệ lời gọi blocking và luồng WebClient với cùng mục tiêu nghiệp vụ
  - Thiết kế fallback đọc dữ liệu cũ có thông tin độ mới
  - Gây timeout rồi chứng minh trạng thái tác vụ thực tế phía phụ thuộc
  - Cô lập hai phụ thuộc bằng Bulkhead và ID ngắt mạch riêng
  - Thay thứ tự Retry với Circuit Breaker rồi so sánh thống kê
  - Tích hợp Feign hoặc Gateway và xác minh cấu hình theo tên
  - Chạy thử nhiều replica, dựng dashboard và viết báo cáo phục hồi
