  - Customizer sau khi tạo bộ ngắt mạch và bộ lắng nghe sự kiện
  - Tùy chỉnh ExecutorService và vòng đời tài nguyên
  - Phân biệt lớp bao Spring Cloud với CircuitBreaker gốc của Resilience4j
- level1: Cấu hình
