  - Chuyển HTTP status thành lỗi trước khi Circuit Breaker ghi nhận
  - Xử lý timeout, kết nối bị từ chối và lỗi phân giải tên
  - Phân biệt lỗi khi đang thực thi với lời gọi bị từ chối ngay
  - Đối chiếu tỷ lệ lỗi của bộ ngắt mạch với kết quả fallback
- level1: Lời gọi đồng bộ
  level2:
  - Bao lời gọi RestClient hoặc RestTemplate bằng factory.run
  - Đặt ranh giới ngắt mạch quanh đúng thao tác từ xa
  - Phân biệt lỗi tạo yêu cầu với lỗi nhận phản hồi
  - Truyền tham số và ánh xạ kết quả mà không tạo ID theo từng yêu cầu
  - Xử lý exception wrapper và xác định nguyên nhân gốc
  - Luồng thực thi khi có TimeLimiter hoặc thread-pool Bulkhead
  - Bảo toàn ngữ cảnh log, tracing và thông tin xác thực
  - Kiểm chứng rằng OPEN không gọi lại hệ thống phụ thuộc
- level1: Luồng reactive
  level2:
  - Đánh giá lười và thời điểm đăng ký thực thi Mono hoặc Flux
  - Bao WebClient bằng ReactiveCircuitBreakerFactory
  - Đơn vị ghi nhận của một subscription so với từng phần tử Flux
  - Đặt ranh giới bao bên ngoài Publisher chứa lời gọi thật
  - Lỗi phát sinh trước khi tạo Publisher và lỗi phát trên luồng
  - Ảnh hưởng của nhiều subscription tới số lần gọi và thống kê
  - Thứ tự onErrorResume, retryWhen, timeout và Circuit Breaker
  - Hủy subscription và giới hạn hủy tác vụ phía hệ thống phụ thuộc
  - Reactor Context khác ThreadLocal khi chuyển luồng
  - Tránh block trên event loop và chọn scheduler cho tác vụ blocking
- level1: Phương án dự phòng
  level2:
  - Fallback là gì và những tình huống phù hợp
  - Trả dữ liệu đã lưu với dấu hiệu độ mới rõ ràng
  - Trả kết quả suy giảm chức năng mà vẫn đúng hợp đồng
  - Từ chối thao tác quan trọng thay vì tạo kết quả thành công giả
  - Phân biệt fallback cho lỗi gọi, timeout và mạch đang mở
  - Tránh fallback gọi lại chính hệ thống đang lỗi
  - Giới hạn thời gian và bảo vệ tài nguyên của fallback
  - Xử lý fallback tiếp tục thất bại và giữ nguyên nguyên nhân lỗi
  - Đo tỷ lệ dùng fallback mà không che mất sự cố thực tế
- level1: TimeLimiter
  level2:
  - Ranh giới giữa ngắt mạch và giới hạn thời gian
  - timeoutDuration và cancelRunningFuture
  - Deadline tổng thể khác connect timeout và read timeout
  - Ngưỡng lời gọi chậm không tự dừng lời gọi đang chạy
  - Phối hợp TimeLimiter với Future hoặc CompletionStage
  - Giới hạn interrupt và tác vụ HTTP tiếp tục chạy sau timeout
  - Giới hạn thời gian trong luồng reactive và xử lý cancellation
  - Bật hoặc tắt TimeLimiter toàn cục, theo nhóm hoặc instance khi được hỗ trợ
  - Thiết kế ngân sách thời gian qua nhiều lớp gọi dịch vụ
- level1: Bulkhead
  level2:
  - Cô lập tài nguyên để một phụ thuộc lỗi không chiếm hết năng lực
  - SemaphoreBulkhead và giới hạn maxConcurrentCalls
  - ThreadPoolBulkhead, kích thước thread pool và hàng đợi hữu hạn
  - maxWaitDuration và hành vi khi hết chỗ
  - Tích hợp tự động khi resilience4j-bulkhead có trên classpath
  - Chọn mặc định và cấu hình riêng qua BulkheadProvider
  - 'Bulkhead trong reactive: khả năng hỗ trợ theo phiên bản'
  - Phân biệt BulkheadFullException với CallNotPermittedException
  - Đặt giới hạn theo từng phụ thuộc và phối hợp với HTTP connection pool
- level1: Phối hợp chính sách
  level2:
  - Thứ tự bao Circuit Breaker và Retry thay đổi mẫu thống kê
  - Thử lại lỗi tạm thời và bỏ qua lỗi nghiệp vụ hoặc mạch đang mở
  - Backoff, jitter và ngân sách số lần thử
  - Tính lũy đẳng khi thử lại yêu cầu có tác dụng phụ
  - Phối hợp Retry với timeout tổng thể và timeout từng lần thử
  - Rate Limiter giới hạn tốc độ khác Bulkhead giới hạn đồng thời
  - Thứ tự Rate Limiter, Bulkhead, TimeLimiter và Circuit Breaker
  - Tránh nhiều lớp retry nhân số yêu cầu qua Gateway, client và SDK
  - Phân biệt bộ đệm HTTP, cache nghiệp vụ và dữ liệu fallback
  - Vẽ chuỗi thực thi và kiểm chứng thứ tự bằng sự kiện
- level1: Annotation và AOP
  level2:
