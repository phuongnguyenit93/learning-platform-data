  - Chọn Java, Spring Boot và Spring Cloud Release Train tương thích
  - Quản lý phiên bản bằng Spring Cloud BOM trong Maven hoặc Gradle
  - Chọn starter Resilience4j cho ứng dụng blocking hoặc reactive
  - Phân biệt starter Spring Cloud với starter Resilience4j trực tiếp
  - Chuẩn bị ứng dụng gọi và dịch vụ có thể chủ động gây lỗi
  - Thêm Actuator, Micrometer và phụ thuộc cần cho từng thí nghiệm
  - Kiểm tra classpath, tự cấu hình và hiện thực CircuitBreakerFactory
  - Tổ chức profile và cấu hình để tái lập hành vi
- level1: API chung
