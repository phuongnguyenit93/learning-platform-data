  - Đặt tên instance và liên kết với cấu hình YAML
  - Chữ ký fallbackMethod và cách chọn theo kiểu ngoại lệ
  - Giới hạn self-invocation, proxy và phạm vi phương thức
  - Thứ tự aspect khi kết hợp Retry, Bulkhead và TimeLimiter
  - Kiểu trả về đồng bộ, bất đồng bộ và reactive
  - Tránh bao cùng thao tác hai lần qua factory và annotation
- level1: OpenFeign
