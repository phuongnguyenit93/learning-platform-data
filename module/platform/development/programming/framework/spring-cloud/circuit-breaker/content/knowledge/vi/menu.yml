  - Thực thi Supplier bằng run và đọc kết quả
  - Truyền hàm fallback nhận Throwable
  - ReactiveCircuitBreakerFactory và ReactiveCircuitBreaker
  - Trang trí Mono hoặc Flux qua API chung
  - Phạm vi cấu hình có thể dùng chung giữa các hiện thực
  - Tính năng đặc thù cần truy cập API của nhà cung cấp
- level1: Tích hợp Resilience4j
  level2:
  - Resilience4JCircuitBreakerFactory và các thành phần được phối hợp
