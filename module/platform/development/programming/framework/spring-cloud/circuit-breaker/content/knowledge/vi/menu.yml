menu:
- level1: Tổng quan
  level2:
  - Circuit Breaker là gì và ngăn lỗi lan truyền như thế nào
  - Phụ thuộc từ xa, lỗi từng phần và hiệu ứng sụp đổ dây chuyền
  - Thất bại nhanh và duy trì khả năng phục vụ khi hệ thống phụ thuộc lỗi
  - 'Các khái niệm: lời gọi, lỗi, ngưỡng, trạng thái và phương án dự phòng'
  - Phân biệt Circuit Breaker, timeout, retry, Bulkhead và Rate Limiter
  - Vai trò của Spring Cloud CircuitBreaker và thư viện hiện thực
  - Khi nào cần ngắt mạch và khi nào nên trả lỗi trực tiếp
  - Kiến thức nền và trình tự học từ một lời gọi đến hệ thống nhiều dịch vụ
- level1: Mô hình trạng thái
  level2:
  - 'CLOSED: cho phép lời gọi và ghi nhận kết quả'
  - 'OPEN: từ chối lời gọi và lỗi CallNotPermittedException'
  - 'HALF_OPEN: cho phép một số lời gọi thăm dò phục hồi'
  - Điều kiện chuyển từ CLOSED sang OPEN
  - Thời gian chờ trước khi thử phục hồi
  - Giới hạn lời gọi và điều kiện kết thúc HALF_OPEN
  - Chuyển trạng thái tự động so với chuyển khi có lời gọi mới
  - FORCED_OPEN, DISABLED và METRICS_ONLY trong Resilience4j
  - Trạng thái cục bộ trong từng tiến trình và ảnh hưởng khi khởi động lại
- level1: Cửa sổ thống kê
  level2:
  - Cửa sổ theo số lời gọi và theo khoảng thời gian
  - slidingWindowSize và lượng dữ liệu được lưu
  - minimumNumberOfCalls và thời điểm đủ mẫu để đánh giá
  - Tính failureRateThreshold từ các lời gọi được ghi nhận
  - slowCallDurationThreshold và phân loại lời gọi chậm
  - slowCallRateThreshold khác ngưỡng tỷ lệ lỗi
  - Lời gọi vừa chậm vừa lỗi được ghi nhận như thế nào
  - Mẫu thống kê trong HALF_OPEN khác cửa sổ ở CLOSED
  - Cửa sổ thống kê không phải giới hạn số lời gọi đồng thời
- level1: Chuẩn bị môi trường
