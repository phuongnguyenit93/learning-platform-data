  - Tùy chỉnh tên bằng CircuitBreakerNameResolver
  - Ánh xạ tên sinh ra với khóa cấu hình Resilience4j
  - Khai báo fallback và fallbackFactory để đọc nguyên nhân lỗi
  - Phạm vi bật nhóm cấu hình và lựa chọn theo từng Feign client
  - Phối hợp timeout, ErrorDecoder và chính sách retry của Feign
  - Kiểm chứng ngắt mạch khi dùng Service Discovery và LoadBalancer
- level1: Gateway
  level2:
