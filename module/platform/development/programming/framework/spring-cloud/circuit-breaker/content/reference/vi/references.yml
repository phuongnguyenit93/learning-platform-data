references:
  - title: "Spring Cloud Commons — Circuit Breaker"
    url: "https://docs.spring.io/spring-cloud-commons/reference/spring-cloud-circuitbreaker.html"
    description: "API CircuitBreakerFactory, run và fallback, ReactiveCircuitBreakerFactory với Reactor Mono/Flux."
  - title: "Spring Cloud CircuitBreaker — Reference"
    url: "https://docs.spring.io/spring-cloud-circuitbreaker/reference/"
    description: "Tổng quan mô hình abstraction và các implementation CircuitBreaker được Spring Cloud hỗ trợ."
  - title: "Spring Cloud CircuitBreaker — Resilience4j Starters"
    url: "https://docs.spring.io/spring-cloud-circuitbreaker/reference/spring-cloud-circuitbreaker-resilience4j/starters.html"
    description: "Artifact starter dành cho ứng dụng blocking và reactive, quy tắc auto-configuration."
  - title: "Resilience4j — CircuitBreaker"
    url: "https://resilience4j.readme.io/docs/circuitbreaker"
    description: "Các trạng thái CLOSED, OPEN, HALF_OPEN, sliding window, ngưỡng lỗi và slow-call rate."
  - title: "Spring Cloud CircuitBreaker — Default Configuration"
    url: "https://docs.spring.io/spring-cloud-circuitbreaker/reference/spring-cloud-circuitbreaker-resilience4j/default-configuration.html"
    description: "Thiết lập Resilience4JCircuitBreakerFactory, ReactiveResilience4JCircuitBreakerFactory và TimeLimiter bằng Customizer."
  - title: "Spring Cloud CircuitBreaker — Properties Configuration"
    url: "https://docs.spring.io/spring-cloud-circuitbreaker/reference/spring-cloud-circuitbreaker-resilience4j/circuit-breaker-properties-configuration.html"
    description: "Cấu hình mặc định, groups, instances, ngưỡng breaker và TimeLimiter qua application properties."
  - title: "Spring Cloud CircuitBreaker — Bulkhead Pattern"
    url: "https://docs.spring.io/spring-cloud-circuitbreaker/reference/spring-cloud-circuitbreaker-resilience4j/bulkhead-pattern-supporting.html"
    description: "Giới thiệu cách kết hợp semaphore/thread-pool bulkhead với circuit breaker cho blocking và reactive flows."
  - title: "Spring Cloud CircuitBreaker — Collecting Metrics"
    url: "https://docs.spring.io/spring-cloud-circuitbreaker/reference/spring-cloud-circuitbreaker-resilience4j/collecting-metrics.html"
    description: "Hướng dẫn kích hoạt Spring Boot Actuator và resilience4j-micrometer để thu thập metrics."
  - title: "Resilience4j — Retry"
    url: "https://resilience4j.readme.io/docs/retry"
    description: "Các tham số retry như số lần thử, wait duration và predicate để tránh thử lại không kiểm soát."
