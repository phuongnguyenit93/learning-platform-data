  - Chuẩn hóa cách viết expression giữa các module
  - Ghi tài liệu về context, bean và biến mà expression cần
  - Quản lý expression như mã nguồn có phiên bản và review
  - Thiết kế điểm thay thế khi biểu thức không còn phù hợp
- level1: Thực hành tổng hợp
  level2:
  - Đánh giá property của root object và xử lý null-safe
  - Lọc và chiếu danh sách object bằng selection và projection
  - Tham chiếu bean để tính giá trị cấu hình có kiểm soát
  - Xây expression điều kiện với Elvis và toán tử ba ngôi
  - Dùng variable và function trong một EvaluationContext tối thiểu
  - Bind dữ liệu chuỗi vào object qua conversion và validation
  - Tích hợp SpEL vào @Value hoặc annotation cache
  - Đo interpreted expression và compiled expression trên cùng dữ liệu
  - Thiết kế allowlist cho expression do người dùng cung cấp
  - 'Hồ sơ hoàn chỉnh: cú pháp, context, kiểm thử, bảo mật và hiệu năng'
