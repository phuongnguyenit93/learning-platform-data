references:
  - title: "Spring - SpEL Evaluation"
    url: "https://docs.spring.io/spring-framework/reference/core/expressions/evaluation.html"
    description: "SpelExpressionParser, EvaluationContext, type conversion và hướng dẫn bảo mật biểu thức."
  - title: "Spring - SpEL Language Reference"
    url: "https://docs.spring.io/spring-framework/reference/core/expressions/language-ref.html"
    description: "Tổng quan cú pháp literal, toán tử, truy cập đối tượng và tập hợp."
  - title: "Spring - SpEL Operators"
    url: "https://docs.spring.io/spring-framework/reference/core/expressions/language-ref/operators.html"
    description: "Toán tử số học, so sánh, logic, between, matches và instanceof."
  - title: "Spring - Properties and Indexers"
    url: "https://docs.spring.io/spring-framework/reference/core/expressions/language-ref/properties-arrays.html"
    description: "Truy cập Java bean properties, arrays, collections và map indexes."
  - title: "Spring - SpEL Variables"
    url: "https://docs.spring.io/spring-framework/reference/core/expressions/language-ref/variables.html"
    description: "Biến #name, #root và #this trong evaluation context."
  - title: "Spring - SpEL Functions"
    url: "https://docs.spring.io/spring-framework/reference/core/expressions/language-ref/functions.html"
    description: "Đăng ký và sử dụng hàm tùy biến qua context."
  - title: "Spring - Collection Selection"
    url: "https://docs.spring.io/spring-framework/reference/core/expressions/language-ref/collection-selection.html"
    description: "Lọc collection bằng .?[...] và chọn phần tử đầu/cuối."
  - title: "Spring - Collection Projection"
    url: "https://docs.spring.io/spring-framework/reference/core/expressions/language-ref/collection-projection.html"
    description: "Biến đổi collection bằng phép projection .![...]."
  - title: "Spring - Safe Navigation"
    url: "https://docs.spring.io/spring-framework/reference/core/expressions/language-ref/operator-safe-navigation.html"
    description: "Truy cập null-safe và giới hạn trong các biểu thức kết hợp."
  - title: "Spring - Expression Templating"
    url: "https://docs.spring.io/spring-framework/reference/core/expressions/language-ref/templating.html"
    description: "Sử dụng ParserContext và cú pháp template #{...}."
  - title: "Spring - Bean Definition Expressions"
    url: "https://docs.spring.io/spring-framework/reference/core/expressions/beandef.html"
    description: "Sử dụng SpEL với bean definitions và các context objects có sẵn."
  - title: "Spring 6.2 - Using @Value"
    url: "https://docs.spring.io/spring-framework/reference/6.2/core/beans/annotation-config/value-annotations.html"
    description: "Phân biệt @Value SpEL với property placeholders và conversion support."