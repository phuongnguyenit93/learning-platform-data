- level1: RSocket
  level2:
  - RSocket và nhu cầu giao tiếp phản ứng hai chiều
  - Fire-and-forget, request-response, request-stream và request-channel
  - Backpressure ở mức giao thức và khác biệt với HTTP
  - RSocketRequester, RSocketStrategies và codec
  - Route, metadata và định dạng dữ liệu
  - '@MessageMapping và handler trả về Mono, Flux'
  - Thiết lập kết nối, vòng đời và xử lý lỗi
  - Điều kiện lựa chọn RSocket so với WebClient, SSE hoặc WebSocket
- level1: Tích hợp hệ sinh thái
  level2:
  - Giữ hợp đồng Publisher xuyên controller, dịch vụ và truy cập dữ liệu
  - Phân biệt JDBC, JPA chặn với driver dữ liệu reactive
  - R2DBC và các thư viện Spring Data reactive trong kiến trúc tổng thể
  - ReactiveTransactionManager và ngữ cảnh giao dịch theo subscription
  - TransactionalOperator, @Transactional reactive và cùng một chuỗi thực thi
  - Hủy hoặc lỗi trong giao dịch và trách nhiệm giải phóng kết nối
  - ReactiveAdapterRegistry và tích hợp thư viện reactive khác
  - Kotlin suspend, Flow và ranh giới chuyển đổi với Reactor
  - Giới hạn tách chuỗi bằng subscribe hoặc chuyển sang API mệnh lệnh
- level1: Tích hợp bảo mật
  level2:
  - SecurityWebFilterChain và điểm tích hợp Spring Security
  - Phân biệt filter bảo mật reactive với Servlet Filter
  - Truy cập Principal và ReactiveSecurityContextHolder
  - Lan truyền ngữ cảnh xác thực trong chuỗi reactive
  - Thứ tự CORS, preflight và filter bảo mật
  - CSRF, session và lựa chọn theo cách xác thực thực tế
  - Giới hạn kích thước nội dung, thời hạn và dữ liệu nhạy cảm trong log
  - Phân biệt bảo mật WebFlux với thiết kế hệ thống OAuth2 chuyên sâu
- level1: Kiểm thử Reactor
  level2:
  - StepVerifier và kịch bản tín hiệu mong đợi
  - Kiểm tra dữ liệu, complete, error và thời hạn verify
  - Điều khiển request ban đầu và thenRequest
  - Kiểm tra cancel và công việc dọn dẹp
  - withVirtualTime và tạo publisher sau khi thiết lập thời gian ảo
  - TestPublisher cho các kịch bản nguồn có kiểm soát
  - PublisherProbe để xác nhận nhánh dự phòng được đăng ký
  - Kiểm tra Reactor Context
  - Kiểm tra retry, timeout và các phần tử bị loại bỏ
  - Phát hiện lệnh chặn bằng BlockHound khi môi trường hỗ trợ
- level1: Kiểm thử WebFlux
  level2:
  - WebTestClient với controller, router hoặc ApplicationContext
  - Phân biệt kiểm thử không máy chủ với kết nối máy chủ thật
  - Kiểm tra status, header, cookie và nội dung JSON
  - Kiểm tra body rỗng, lỗi validation và ProblemDetail
  - Kiểm tra Flux, SSE và luồng không kết thúc bằng StepVerifier
  - Kiểm thử WebClient với máy chủ HTTP giả có hành vi thực tế
  - Mô phỏng kết nối chậm, ngắt kết nối và timeout
  - Kiểm chứng filter, profile, codec và cấu hình bảo mật
  - Giới hạn những gì kiểm thử giả lập chứng minh về mạng và backpressure
- level1: Quan sát và gỡ lỗi
  level2:
  - Theo dõi chuỗi tín hiệu bằng log và các toán tử doOn
  - Phân biệt stack trace lúc lắp ghép với lúc thực thi
  - checkpoint, Hooks.onOperatorDebug và ReactorDebugAgent
  - Mã tương quan, Reactor Context và tích hợp MDC
  - Observation và số liệu phía máy chủ, phía WebClient
  - Quan sát Scheduler, hàng đợi, pool kết nối và bộ đệm
  - Micrometer cho chuỗi Reactor và tránh nhãn có quá nhiều giá trị
  - Giới hạn log body, chi phí quan sát và bảo vệ thông tin nhạy cảm
  - Nhận diện dropped error, rò rỉ bộ đệm và chuỗi không được đăng ký
- level1: Hiệu năng và tải
  level2:
  - Đo độ trễ, thông lượng, số luồng và bộ nhớ
  - Nhận diện lệnh chặn nằm sâu trong thư viện phụ thuộc
  - Chọn giới hạn flatMap concurrency theo tài nguyên phía sau
  - Điều chỉnh prefetch, buffer và kích thước connection pool
  - Ảnh hưởng collectList, cache và replay tới bộ nhớ
  - Kiểm thử phía nhận chậm và nguồn phát nhanh
  - Giới hạn hàng đợi, timeout và cơ chế từ chối khi quá tải
  - So sánh reactive với MVC hoặc luồng ảo trên cùng tải thực tế
  - Đóng kết nối đang hoạt động và dừng ứng dụng có kiểm soát
- level1: Thực hành tổng hợp
  level2:
  - Thiết kế luồng tổng hợp dữ liệu từ nhiều dịch vụ HTTP
  - Xây cùng một hợp đồng bằng controller và endpoint hàm
  - Xử lý kết quả rỗng, lỗi từng dịch vụ và dữ liệu dự phòng
  - Giới hạn đồng thời, thời hạn và số lần thử lại
  - Cung cấp NDJSON hoặc SSE với vòng đời kết nối rõ ràng
  - Thực nghiệm callback, nguồn hot và backpressure có giới hạn
  - Kiểm chứng lỗi, hủy, tài nguyên và ngữ cảnh theo từng yêu cầu
  - Đo tải và giải thích lựa chọn reactive bằng bằng chứng
