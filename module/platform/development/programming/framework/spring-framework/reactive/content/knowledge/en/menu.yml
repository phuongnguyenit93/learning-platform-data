menu:
- level1: Tổng quan
  level2:
  - Lập trình phản ứng là gì và vì sao Spring hỗ trợ
  - Phân biệt đồng bộ, bất đồng bộ, chặn và không chặn
  - Luồng dữ liệu, tín hiệu và xử lý theo sự kiện
  - Điều tiết nhu cầu (backpressure) giữa bên phát và bên nhận
  - Quan hệ giữa Reactive Streams, Reactor, Reactor Netty và WebFlux
  - So sánh mô hình xử lý của Spring MVC và Spring WebFlux
  - Khi nào reactive phù hợp và khi nào làm tăng độ phức tạp
  - Phân biệt khả năng chịu tải với tốc độ một yêu cầu
  - Lộ trình từ chuỗi Reactor đến ứng dụng reactive hoàn chỉnh
- level1: Reactive Streams
  level2:
  - Vai trò của Publisher, Subscriber, Subscription và Processor
  - Trình tự onSubscribe, onNext, onError và onComplete
  - request(n) và số phần tử đang được yêu cầu
  - Tín hiệu kết thúc, hủy đăng ký và quy tắc không phát null
  - Tuần tự tín hiệu trong một subscription
  - Đăng ký nhiều lần và trạng thái riêng của mỗi bên nhận
  - Quan hệ với java.util.concurrent.Flow và các bộ chuyển đổi
  - Giới hạn bảo đảm của giao thức khi nguồn không thể giảm tốc
- level1: Mono và Flux
  level2:
  - Mono biểu diễn kết quả từ không đến một phần tử
  - Flux biểu diễn chuỗi từ không đến nhiều phần tử
  - Phân biệt chuỗi rỗng, chuỗi lỗi và chuỗi không kết thúc
  - Mono<Void> biểu diễn hoàn tất mà không mang dữ liệu
  - Phân biệt lắp ghép chuỗi với thực thi khi đăng ký
  - Toán tử trả về publisher mới và yêu cầu nối đúng chuỗi
  - subscribe, Disposable và quyền kiểm soát subscription
  - Vì sao WebFlux thường là bên thực hiện subscribe
- level1: Tạo nguồn dữ liệu
  level2:
  - Tạo dữ liệu có sẵn bằng just, fromIterable và range
  - justOrEmpty cho giá trị có thể thiếu
  - Trì hoãn tính toán bằng defer, fromSupplier và fromCallable
  - Tạo tín hiệu hoàn tất, lỗi và never
  - Nguồn theo thời gian bằng interval và delay
  - Chuyển CompletableFuture thành Mono và xem xét thời điểm khởi chạy
  - Phát đồng bộ từng phần tử bằng generate
  - Tích hợp API callback qua create và xử lý yêu cầu hủy
  - Phân biệt tạo publisher với bọc một lệnh chặn đã thực thi
- level1: Biến đổi dữ liệu
  level2:
  - map cho biến đổi đồng bộ một phần tử
  - flatMap cho công việc trả về publisher
  - concatMap để xử lý tuần tự và giữ thứ tự
  - flatMapSequential để kết hợp đồng thời nhưng phát theo thứ tự
  - switchMap để chuyển sang công việc mới nhất
  - filter, filterWhen và xử lý giá trị không hợp lệ
  - handle cho logic phát có điều kiện
  - collectList, collectMap, reduce và scan
  - then, thenReturn và hệ quả loại bỏ giá trị đầu vào
  - transform và transformDeferred để tái sử dụng chuỗi xử lý
- level1: Ghép và chia luồng
  level2:
  - concat và merge cho các nguồn có quan hệ thời gian khác nhau
  - zip để ghép giá trị tương ứng từ nhiều nguồn
  - combineLatest và dữ liệu cập nhật liên tục
  - when, and và phối hợp tín hiệu hoàn tất
  - defaultIfEmpty và switchIfEmpty
  - Ảnh hưởng của nguồn empty hoặc Mono<Void> trong zip
  - firstWithValue và firstWithSignal
  - buffer, window và groupBy
  - Nguy cơ giữ dữ liệu, nhóm không được tiêu thụ và bộ nhớ tăng
- level1: Backpressure
  level2:
  - Theo dõi nhu cầu từ downstream về upstream
  - Những cách đăng ký yêu cầu không giới hạn
  - Điều khiển request bằng BaseSubscriber
  - limitRate và sự khác biệt với giới hạn yêu cầu theo thời gian
  - Prefetch và concurrency trong toán tử kết hợp
  - buffer và window làm thay đổi đơn vị nhu cầu
  - Lựa chọn buffer có giới hạn, drop, latest hoặc báo lỗi
  - Xử lý tràn và quan sát dữ liệu bị loại bỏ
  - Giới hạn điều tiết xuyên HTTP, bộ đệm mạng và phía khách
- level1: Luồng thực thi
  level2:
  - Reactor không tự tạo luồng mới cho mọi Mono hoặc Flux
  - Mô hình event loop và tác hại của lệnh chặn
  - publishOn thay đổi nơi xử lý các toán tử phía sau
  - subscribeOn điều khiển quá trình đăng ký với nguồn
  - Vị trí đổi Scheduler và chi phí chuyển luồng
  - single, parallel và boundedElastic
  - Cô lập lệnh chặn bằng fromCallable kết hợp boundedElastic
  - Giới hạn số luồng, hàng đợi và áp lực lên tài nguyên đích
  - Luồng ảo với boundedElastic và điều kiện phiên bản, cấu hình
  - Trạng thái dùng chung và tính an toàn luồng giữa nhiều subscription
- level1: Lỗi và thử lại
  level2:
  - onError là tín hiệu kết thúc chuỗi
  - onErrorReturn và giá trị thay thế cố định
  - onErrorResume và chuyển sang nguồn dự phòng
  - onErrorMap để chuyển đổi lỗi kỹ thuật thành lỗi nghiệp vụ
  - doOnError chỉ quan sát và không phục hồi chuỗi
  - Vị trí xử lý lỗi trong từng phần tử so với toàn chuỗi
  - timeout và phân biệt hết thời gian với lỗi kết nối
  - retry, retryWhen và việc đăng ký lại vào nguồn
  - Giới hạn thử lại, thời gian lùi và nhiễu ngẫu nhiên
  - Tính lũy đẳng, tác dụng phụ và nguy cơ lặp thao tác ghi
  - Giới hạn onErrorContinue và trường hợp nên xử lý cục bộ
- level1: Hủy và tài nguyên
  level2:
  - Lan truyền cancel khi bên nhận không cần thêm dữ liệu
  - Hủy không đồng nghĩa với dừng công việc bên ngoài ngay lập tức
  - doOnCancel, doOnTerminate và doFinally
  - using và usingWhen cho vòng đời tài nguyên
  - Dọn dẹp khi hoàn tất, lỗi hoặc hủy đăng ký
  - Giải phóng phần tử bị loại bỏ với doOnDiscard
  - Tránh subscribe lồng nhau làm mất liên kết lỗi và hủy
  - Quản lý Scheduler, subscription và tài nguyên tự tạo
- level1: Reactor Context
  level2:
  - Vì sao ThreadLocal không đủ cho chuỗi đổi luồng
  - Context và ContextView gắn với subscription
  - Ghi ngữ cảnh bằng contextWrite
  - Đọc ngữ cảnh bằng deferContextual
  - Hướng truyền ngữ cảnh và ảnh hưởng vị trí toán tử
  - Cô lập ngữ cảnh trong các chuỗi con
  - Truyền mã tương quan và thông tin yêu cầu
  - Tích hợp truyền ngữ cảnh và giới hạn với MDC, thư viện ngoài
- level1: Nguồn nóng và lạnh
  level2:
  - Phân biệt nguồn cold với nguồn hot
  - Dữ liệu tạo lúc lắp ghép và lúc đăng ký
  - Chia sẻ subscription bằng share và publish
  - ConnectableFlux, connect, autoConnect và refCount
  - cache, replay và giới hạn lưu giữ dữ liệu
  - Sinks.One và Sinks.Many
  - Unicast, multicast và replay theo nhu cầu sử dụng
  - tryEmit, emit và xử lý phát đồng thời, tràn bộ đệm
  - Vòng đời bên nhận, đăng ký muộn và nguy cơ rò rỉ
