  - Phát hành và đăng ký nhận thông điệp
  - Gửi một chiều và gửi yêu cầu chờ phản hồi
  - Luồng dữ liệu liên tục và kiểm soát tốc độ nhận
  - Liên kết về thời gian, địa chỉ và cấu trúc dữ liệu
  - Thứ tự, trùng lặp, thất lạc và các mức bảo đảm giao nhận
  - Lựa chọn mô hình theo độ trễ, độ bền và yêu cầu nghiệp vụ
- level1: Thiết lập
