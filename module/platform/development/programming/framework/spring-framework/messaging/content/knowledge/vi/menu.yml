menu:
- level1: Tổng quan
  level2:
  - Thông điệp là gì và bài toán giao tiếp giữa các thành phần
  - Vì sao ứng dụng cần cơ chế gửi và nhận thông điệp
  - Vị trí của spring-messaging trong Spring Framework
  - 'Bản đồ thuật ngữ: bên gửi, bên nhận, kênh, đích và bộ môi giới'
  - Quan hệ giữa thông điệp, lệnh, sự kiện và yêu cầu
  - Phân biệt gọi hàm trực tiếp, HTTP và giao tiếp bằng thông điệp
  - Phân biệt sự kiện ApplicationContext và thông điệp liên tiến trình
  - Phạm vi của spring-messaging, spring-jms và spring-websocket
  - Phân biệt Spring Framework, Spring Boot và các dự án tích hợp
  - Lộ trình học từ trừu tượng nền tảng đến các giao thức
- level1: Mô hình trao đổi
