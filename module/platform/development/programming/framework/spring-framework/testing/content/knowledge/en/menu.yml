  - JSONPath, so sánh JSON và kiểm tra body trống
  - expectAll để tổng hợp nhiều phép xác nhận
  - returnResult để truy cập ExchangeResult
  - FluxExchangeResult và dữ liệu streaming
  - StepVerifier để xác nhận phần tử, hoàn tất, lỗi và hủy
  - Đặt giới hạn chờ cho luồng không kết thúc
  - Kiểm tra tác động của backpressure theo phạm vi bài
  - Phân biệt lỗi giao thức HTTP với lỗi trong luồng Publisher
  - Tiêu thụ hoặc giải phóng body và tài nguyên liên quan
- level1: RestTestClient
  level2:
  - RestTestClient từ Spring Framework 7 và quan hệ với RestClient
  - Kiểm thử HTTP đồng bộ bằng API dành cho assertion
  - Bind tới controller, ApplicationContext hoặc router function MVC
  - Bind tới máy chủ thật để kiểm tra từ đầu đến cuối
  - Chuẩn bị URI, header và body trước exchange
  - Xác nhận status, header, DTO và JSON
  - Tích hợp assertion theo kiểu AssertJ
  - Chọn RestTestClient, WebTestClient hay MockMvc theo phiên bản và mô hình
- level1: Kiểm thử HTTP client
  level2:
  - Ranh giới cần kiểm chứng của RestClient, RestTemplate hoặc WebClient
  - MockRestServiceServer và cơ chế thay request factory
  - Gắn mock server vào đúng client hoặc builder được ứng dụng dùng
  - Đặt kỳ vọng URI, method, header và body gửi ra
  - Tạo phản hồi thành công, lỗi và dữ liệu không hợp lệ
  - ExpectedCount, thứ tự yêu cầu và verify
  - Reset kỳ vọng giữa các bài kiểm thử
  - MockMvcClientHttpRequestFactory cho luồng client tới MVC trong tiến trình
  - Mock web server để chạy cấu hình HTTP client thật
  - Mô phỏng timeout, mất kết nối và giới hạn tầng truyền tải
  - Kiểm tra tuần tự hóa, giải tuần tự hóa và ánh xạ lỗi
  - Tránh giả lập chuỗi fluent của client quá sâu
- level1: Bất đồng bộ và song song
  level2:
  - Kiểm soát executor và tác vụ nền trong kiểm thử
  - Đợi điều kiện với giới hạn thay vì Thread.sleep cố định
  - Latch, barrier và Future cho thứ tự có thể kiểm soát
  - Đồng hồ thay thế và thời gian ảo cho mã hỗ trợ
  - Tách kiểm thử tác vụ bất đồng bộ khỏi kiểm thử lịch kích hoạt
  - Cấu hình chạy song song của công cụ thực thi
  - Điều kiện TestContext phù hợp để chạy song song
  - Tránh chạy song song khi dùng @DirtiesContext hoặc mock dùng chung không an toàn
  - Cô lập database, thư mục, cổng và tài nguyên chia sẻ
  - Ngữ cảnh giao dịch hoặc request không tự truyền sang luồng khác
  - Thu hồi executor và xác nhận không còn tác vụ sau kiểm thử
- level1: Hạ tầng kiểm thử
  level2:
  - Chọn tài nguyên thật, bản nhúng hoặc dịch vụ mô phỏng
  - Container kiểm thử cho cơ sở dữ liệu và broker
  - Vòng đời hạ tầng ngoài so với context cache
  - Đăng ký địa chỉ động sau khi tài nguyên sẵn sàng
  - Phân biệt container đã chạy với dịch vụ đã sẵn sàng
  - Cổng ngẫu nhiên do máy chủ cấp thay vì tự đoán cổng trống
  - Dữ liệu có tên hoặc khóa riêng cho từng bộ kiểm thử
  - Khôi phục dữ liệu và đóng tài nguyên khi khởi tạo thất bại
  - Không phụ thuộc dịch vụ sản xuất hoặc Internet công khai
  - Kiểm chứng tương thích bằng cùng loại hạ tầng với môi trường chạy
- level1: Công cụ và phạm vi
  level2:
  - Spring Test cung cấp cơ chế nào, thư viện assertion cung cấp gì
  - '@SpringBootTest thuộc Spring Boot và phạm vi nạp ứng dụng'
  - Test slice của Spring Boot khác với @ContextConfiguration
  - Phân biệt @TestConfiguration với cấu hình Spring Framework thông thường
  - Spring Security Test là tích hợp riêng khi cần xác nhận xác thực và phân quyền
  - Reactor Test bổ sung kiểm chứng luồng phản ứng
  - Testcontainers bổ sung quản lý hạ tầng thật
  - Chọn công cụ bổ sung theo rủi ro thay vì dùng mọi công cụ cho mọi bài
- level1: Mở rộng và AOT
  level2:
  - '@TestExecutionListeners và quy tắc merge với listener mặc định'
  - Thứ tự listener và đối xứng callback trước hoặc sau
  - Viết listener riêng để quản lý tài nguyên dùng chung
  - TestContextBootstrapper khi cần thay cơ chế khởi tạo
  - ContextCustomizerFactory và đóng góp vào khóa cache
  - Annotation override bean riêng với hạ tầng BeanOverride
  - AOT processing cho kiểm thử tích hợp Spring
  - Giới hạn cấu hình động trong chế độ AOT hoặc native image
  - '@DisabledInAotMode và điều kiện kiểm thử theo môi trường'
  - Chỉ mở rộng hạ tầng khi cấu hình có sẵn không đáp ứng
- level1: Chất lượng và CI
  level2:
  - Tách bài kiểm thử nhanh với bài cần hạ tầng
  - Chạy nhất quán bằng IDE và công cụ build
  - Đồng bộ JUnit, Spring Test, Mockito và phiên bản Java
  - Bộ dữ liệu có thể tái tạo và hạt giống ngẫu nhiên được ghi nhận
  - Giảm số context khác nhau mà không làm mất phạm vi xác nhận
  - Lưu báo cáo, log và bằng chứng khi CI thất bại
  - Phân biệt lỗi sản phẩm, lỗi kiểm thử và lỗi hạ tầng
  - Điều tra kiểm thử chập chờn thay vì lặp lại để che lỗi
  - Coverage dòng mã khác với kiểm chứng hành vi và rủi ro
  - Rà soát chi phí bảo trì khi tái cấu trúc mã ứng dụng
- level1: Chẩn đoán kiểm thử
  level2:
  - Failed to load ApplicationContext và nguyên nhân đầu tiên
  - Thiếu bean, trùng bean hoặc thiếu dependency kiểm thử
  - Profile và property không đúng thứ tự ưu tiên
  - Context failure threshold là hệ quả của lần nạp thất bại trước
  - Mock không được tiêm vào đối tượng thật sự được gọi
  - Spy sau AOP proxy và verify nhầm đối tượng
  - 404 do thiếu mapping khác với 404 do nghiệp vụ
  - 415, 406 và lỗi message converter
  - 401 hoặc 403 do cấu hình bảo mật và dữ liệu yêu cầu
  - Giao dịch rollback che lỗi flush hoặc dữ liệu kiểm thử bị rò
  - Bài chạy riêng đạt nhưng cả bộ thất bại do trạng thái dùng chung
  - Timeout do tác vụ nền, khóa dữ liệu hoặc hạ tầng chưa sẵn sàng
- level1: Thực hành tổng hợp
  level2:
  - Xây dựng ma trận rủi ro cho một luồng tạo tài nguyên
  - Kiểm thử đơn vị dịch vụ bằng phụ thuộc được kiểm soát
  - Kiểm thử cấu hình bean và một hành vi đi qua proxy
  - Kiểm thử repository thật với SQL và ràng buộc dữ liệu
  - Kiểm thử HTTP thành công, validation và ánh xạ lỗi
  - Kiểm chứng client gọi dịch vụ ngoài bằng phản hồi có kiểm soát
  - Bổ sung một tình huống bất đồng bộ và một lỗi hạ tầng
  - So sánh kết quả mô phỏng với HTTP qua máy chủ thật
  - Chạy cả bộ độc lập với thứ tự và tổng hợp bằng chứng
