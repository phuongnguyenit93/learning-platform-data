references:
  - title: "Spring Framework — Email Integration"
    url: "https://docs.spring.io/spring-framework/reference/integration/email.html"
    description: "Hướng dẫn MailSender, SimpleMailMessage, JavaMailSender, MimeMessageHelper, HTML và attachment trong Spring Framework."
  - title: "Spring Framework Javadoc — JavaMailSender"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/mail/javamail/JavaMailSender.html"
    description: "Interface gửi email hỗ trợ MIME, callback preparation và cách mock sender khi kiểm thử."
  - title: "Spring Framework Javadoc — MimeMessageHelper"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/mail/javamail/MimeMessageHelper.html"
    description: "Tạo email HTML, chọn encoding, nội dung multipart, inline resources và attachments."
  - title: "Spring Framework Javadoc — JavaMailSenderImpl"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/mail/javamail/JavaMailSenderImpl.html"
    description: "Implementation SMTP của JavaMailSender với host, port, credentials và cấu hình JavaMail Session."
  - title: "Spring Framework Javadoc — SimpleMailMessage"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/mail/SimpleMailMessage.html"
    description: "Đối tượng thông điệp plain text có from, to, cc, bcc, subject và text."
  - title: "Spring Boot — Sending Email"
    url: "https://docs.spring.io/spring-boot/reference/io/email.html"
    description: "Starter mail, tự động cấu hình JavaMailSender và thuộc tính timeout tránh chờ vô hạn."
  - title: "IETF RFC 5321 — Simple Mail Transfer Protocol"
    url: "https://www.rfc-editor.org/rfc/rfc5321.html"
    description: "Tiêu chuẩn về SMTP, mail envelope, trao đổi với server và mã phản hồi."
  - title: "IETF RFC 5322 — Internet Message Format"
    url: "https://www.rfc-editor.org/rfc/rfc5322.html"
    description: "Tiêu chuẩn cú pháp email gồm header From/To/Subject và message body."
  - title: "IETF RFC 2045 — MIME Part One"
    url: "https://www.rfc-editor.org/rfc/rfc2045.html"
    description: "Định nghĩa MIME-Version, content types, transfer encoding và định dạng thông điệp nhiều thành phần."