  - Giới hạn quyền của tài khoản tự động hóa
  - Đối chiếu dữ liệu JMX với logs và traces
  - Xử lý server không phản hồi hoặc dữ liệu cũ
  - Thiết kế cảnh báo dựa trên ngưỡng và xu hướng
- level1: Thực hành
  level2:
  - Export một bean Spring bằng MBeanExporter
  - Phơi bày resource bằng @ManagedResource
  - Tạo attribute đọc–ghi bằng @ManagedAttribute
  - Phơi bày operation có tham số bằng @ManagedOperation
  - Đặt ObjectName bằng naming strategy
  - Kiểm tra registration policy với hai bean trùng tên
  - Phát và nhận AttributeChangeNotification
  - Tạo proxy local để đọc và gọi MBean
  - Kết nối remote qua JSR-160 trong môi trường thử nghiệm
  - Kết hợp JMX với Spring Boot Actuator
  - Thử lỗi proxy AOP và khắc phục bằng target-class proxy
  - Viết kiểm thử xác nhận management interface
  - Thiết lập checklist bảo mật cho remote JMX
- level1: Đánh giá thiết kế
  level2:
  - Xác định mục tiêu quản trị trước khi tạo MBean
