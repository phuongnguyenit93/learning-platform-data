  - Đánh giá attribute, operation và notification theo tác động
  - Xác minh exporter thực sự dùng đúng MBeanServer
  - Kiểm tra hành vi local, remote, proxy và lỗi mạng
  - Rà soát ảnh hưởng của AOP, transaction và proxy
  - Đánh giá khả năng kiểm thử, quan sát và tự động hóa
