      | Phát hiện lẫn request | Giải thích demo latch khiến request An đọc dữ liệu Bình và đề xuất API không lưu currentUser. |
      | Thiết kế request DTO | Dựng RequestSnapshot chỉ chứa dữ liệu cần thiết và truyền qua controller, service, worker. |
      | Đánh giá request scope | Giải thích proxy target và trường hợp @Async không có request context hợp lệ. |
      | Kiểm thử ranh giới | Lập test hai request đồng thời và kiểm tra không rò dữ liệu hoặc ThreadLocal giữa các lần xử lý. |
  - slug: bean-state-005
    title: Phép kiểm tra rồi cập nhật và thao tác nhiều bước cần bảo vệ
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Nguyên tử cho check-then-act.
    problemSolved: Hai request cùng vượt qua kiểm tra tồn kho.
    mechanism: CAS/lock/conditional UPDATE và unique key. 2 đặt chỗ cùng 1 suất; CAS/DB update.
    applicationValue: Bảo vệ cả quyết định nghiệp vụ.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phép kiểm tra rồi cập nhật và thao tác nhiều bước cần bảo vệ**

      Một quyết định nghiệp vụ như giữ suất hay trừ tồn kho bao gồm kiểm tra và thay đổi trạng thái; các lệnh atomic riêng lẻ không tự làm cả workflow nguyên tử. Bài học xác định invariant, dựng interleaving xác định và chọn CAS, lock hay conditional UPDATE tại DB.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Bản chất thao tác nhiều bước

      1. Vì sao hai request cùng thấy available=1 có thể đều báo đặt thành công?
      2. Vì sao get() rồi getAndDecrement() trên AtomicInteger vẫn cho remaining=-1?
      3. Một invariant gồm available và reserved đòi hỏi cả reader lẫn writer được bảo vệ thế nào?

      ### Chọn phạm vi cập nhật nguyên tử

      1. Khi nào vòng compareAndSet đủ cho một biến và khi nào cần cùng lock cho nhiều trường?
      2. Vì sao @Transactional với SELECT rồi UPDATE chưa chắc loại được race ở mức isolation thông dụng?
      3. Cập nhật SQL có điều kiện, unique constraint và affected rows giúp chặn lỗi nghiệp vụ nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện check-then-act | Vẽ được lịch hai luồng vượt qua bước kiểm tra trước khi cập nhật và chỉ rõ invariant bị vi phạm. |
      | Thực hành CAS | Giải thích vòng CAS chỉ một request trừ thành công từ remaining=1. |
      | Bảo vệ nhiều trường | Dùng cùng monitor để giữ available + reserved bất biến và trả snapshot nhất quán. |
      | Thiết kế thao tác DB | Chọn UPDATE có điều kiện và kiểm tra số hàng cập nhật; nêu giới hạn của transaction đơn thuần. |
      | Kiểm thử lỗi và retry | Đề xuất test concurrent, xung đột DB, idempotency key và rollback khi INSERT thất bại. |
  - slug: bean-state-006
    title: Chọn synchronized, Lock hoặc atomic theo phạm vi bất biến
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Chọn atomic, monitor, Lock.
    problemSolved: Khóa/cập nhật không bao trọn invariant.
    mechanism: Một monitor/Lock hoặc snapshot CAS. 100 lần tranh 10 suất qua 3 primitive.
    applicationValue: Chọn công cụ theo invariant cụ thể.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Chọn synchronized, Lock hoặc atomic theo phạm vi bất biến**

      Sau khi nhận diện trạng thái cần bảo vệ, developer phải chọn primitive phù hợp với phạm vi invariant và hành vi chờ khóa. Bài học so sánh atomic/CAS cho một giá trị, synchronized cho nhóm trường, ReentrantLock khi cần timeout/interrupt, và AtomicReference cho snapshot bất biến.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Phân loại invariant

      1. Quy tắc nào cho phép dùng AtomicInteger, quy tắc nào bắt buộc bảo vệ một cặp available/reserved?
      2. Vì sao hai AtomicInteger độc lập không cung cấp snapshot nguyên tử của hai trường?

      ### Khóa và hành vi chờ

      1. Khi nào synchronized đơn giản hơn ReentrantLock và khi nào cần tryLock, lockInterruptibly hoặc Condition?
      2. Vì sao unlock của ReentrantLock phải nằm trong finally sau khi lấy khóa thành công?

      ### Giới hạn và đo lường

      1. Snapshot qua AtomicReference + CAS có đánh đổi gì khi nhiều writer tranh chấp?
      2. Khi cùng một bản ghi được cập nhật từ ba replica, cơ chế đồng bộ cần nằm ở đâu?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Chọn primitive | Lập bảng ánh xạ invariant một giá trị, nhiều trường, snapshot immutable và dữ liệu phân tán đến cơ chế phù hợp. |
      | Dùng CAS có điều kiện | Giải thích compareAndSet tránh kiểm tra-rồi-trừ sai với quota một biến. |
      | Tạo vùng khóa đúng | Viết getter và updater cùng dùng một monitor/lock, luôn nhả ReentrantLock trong finally. |
      | Đánh giá tùy chọn khóa | Chọn tryLock timeout hoặc lockInterruptibly khi có yêu cầu từ chối chờ/hủy. |
      | Kiểm chứng kết quả | Dự đoán và giải thích output 10 lượt thành công trong 100 lần tranh chấp của atomic/monitor/lock. |
  - slug: bean-state-007
    title: Không giữ khóa khi chờ nhập xuất hoặc chờ tác vụ phụ thuộc
    status: WRITTEN
    difficult: ADVANCED
    focus: Vùng khóa ngắn, tránh chờ vòng.
    problemSolved: Contended lock, deadlock, stale result.
    mechanism: I/O ngoài khóa, version check, timeout. Quick task vượt slow task; version guard.
    applicationValue: Phát hiện deadlock và rút ngắn critical section.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Không giữ khóa khi chờ nhập xuất hoặc chờ tác vụ phụ thuộc**

      Giữ monitor hoặc ReentrantLock trong lúc chờ HTTP, DB hay Future có thể làm mọi request khác đợi lâu hoặc tạo deadlock. Bài học định vị vùng khóa ngắn, tái hiện vòng chờ và dùng snapshot/version guard để tránh kết quả cũ ghi đè trạng thái mới sau khi bỏ khóa.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Chờ và deadlock

      1. Tại sao một lời gọi HTTP trong synchronized khiến cả thao tác nhanh trên cùng guard bị nghẽn?
      2. Vòng chờ nào xuất hiện nếu thread A giữ guard rồi Future.get chờ B cũng cần guard?
      3. Vì sao executor một worker có thể deadlock khi task A submit B rồi tự chờ kết quả?

      ### Tách I/O khỏi critical section

      1. Vì sao phải kiểm tra phiên bản sau khi làm việc ngoài khóa trước khi commit kết quả?
      2. Khi nào có thể hợp nhất kết quả, khi nào nên retry hoặc báo conflict?

      ### Xử lý sự cố

      1. Object.wait hoặc Condition.await khác Thread.sleep/Future.get về việc nhả khóa thế nào?
      2. Khi timeout/cancel, cần kiểm tra interrupt, cleanup và side effect bên ngoài ra sao?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân tích nghẽn khóa | Chỉ ra chính xác monitor/worker mà các thread chờ và phân biệt contention với circular wait. |
      | Thiết kế vùng khóa ngắn | Vẽ luồng snapshot dưới khóa, I/O ở ngoài, rồi kiểm tra và ghi kết quả dưới khóa. |
      | Tái hiện qua latch | Giải thích output [quick] rồi [quick, slow] của bài thực hành LockBoundaryDemo. |
      | Ngăn ghi đè state mới | Áp dụng version guard để từ chối kết quả dựa trên snapshot đã hết hiệu lực và kiểm chứng trạng thái cuối. |
  - slug: bean-state-008
    title: Phân biệt phạm vi bean với cơ chế đồng bộ
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Scope và vòng đời của bean.
    problemSolved: Đổi scope nhưng vẫn chia sẻ object.
    mechanism: Chọn scope theo lifecycle, đồng bộ theo state. getBean, ObjectProvider và prototype.
    applicationValue: Phân biệt cấp phát instance với synchronization.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phân biệt phạm vi bean với cơ chế đồng bộ**

      Bean scope quyết định vòng đời và cách lấy instance, còn synchronization bảo vệ truy cập đồng thời. Bài học đối chiếu singleton/prototype/request/session, thử ObjectProvider và race condition để tránh quyết định đổi scope như một phương án chữa lỗi thread safety thiếu căn cứ.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### So sánh scope

      1. Singleton trong Spring được định nghĩa theo bean definition và container như thế nào?
      2. Inject prototype vào constructor singleton có tạo instance mới ở mỗi method call không?
      3. ObjectProvider lấy prototype mới khi nào, và request/session scope khác gì về vòng đời?

      ### Thiết kế an toàn theo state

      1. Vì sao hai prototype vẫn có thể tranh cùng static field hoặc database record?
      2. Vì sao @Async, @Scheduled hoặc @Transactional không tự biến mutable state thành an toàn luồng?
      3. Khi nào nên đổi scope và khi nào cần stateless design, atomic, lock hoặc cơ chế DB?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Giải thích scope | Phân biệt singleton, prototype, request, session và giới hạn sharing của từng scope. |
      | Kiểm chứng lifecycle | Giải thích output demo: hai getBean prototype khác nhau nhưng prototype inject một lần vào singleton được giữ lại. |
      | Phân loại rủi ro concurrency | Xác định state chung trong field, static, dependency, DB dù các instance bean khác nhau. |
      | Chọn giải pháp đúng | Lập luận khi nào ObjectProvider, request scope hoặc lock/atomic giải quyết đúng nhu cầu. |
  - slug: bean-state-009
    title: Theo dõi trạng thái bị chia sẻ qua đối số và giá trị trả về
    status: WRITTEN
    difficult: ADVANCED
    focus: Alias qua input, return, async.
    problemSolved: Mutable alias rò sang caller/task.
    mechanism: Ownership rõ, immutable DTO, copy đúng boundary. View vs copy; payload đổi sau submit.
    applicationValue: Lần theo reference và sửa alias không mong muốn.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Theo dõi trạng thái bị chia sẻ qua đối số và giá trị trả về**

      Một bean stateless bề ngoài vẫn có thể mutate hoặc phát tán object do caller truyền vào, và giá trị trả về có thể lộ backing collection. Bài học lần theo alias, ownership và escape qua parameter, field, return và task async; thực hành defensive copy và kiểm thử thời điểm đọc/ghi.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Reference và ownership

      1. Java pass-by-value có nghĩa gì khi tham số chứa giá trị tham chiếu đến mutable object?
      2. Theo sơ đồ caller → parameter → field → return, thao tác nào giữ lại hoặc tiết lộ cùng object?

      ### Snapshot và giá trị trả về

      1. Collections.unmodifiableList khác List.copyOf thế nào khi list nguồn thay đổi?
      2. Vì sao shallow snapshot không đủ nếu phần tử là MutableItem và caller còn nắm alias?
      3. Đối số local trong service có chắc độc lập với dữ liệu từ cache hoặc session không?

      ### Bất đồng bộ và kiểm chứng

      1. Sau submit ExecutorService, vì sao caller còn có thể thay đổi Payload trước khi worker đọc?
      2. Quan hệ happens-before từ latch và Future.get bảo đảm điều gì, và không bảo đảm điều gì về object mutable?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Lần theo alias | Vẽ object graph cụ thể và phân biệt reference equality với value equality. |
      | Thiết kế API an toàn | Xác định chỗ cần defensive copy cho input, return và các phần tử mutable lồng nhau. |
      | Kiểm chứng snapshot | Giải thích output khác nhau của unmodifiable view và List.copyOf snapshot. |
      | Tái hiện race async | Dự đoán worker đọc after thay vì before khi caller đổi cùng Payload trước lúc mở latch. |
      | Xây quy tắc ownership | Viết contract không giữ mutable input, trả immutable result, hoặc chuyển quyền sở hữu task rõ ràng. |
- slug: task-executor
  title: TaskExecutor
  childs:
  - slug: task-executor-001
    title: TaskExecutor là hợp đồng thực thi tác vụ của Spring
    status: WRITTEN
    difficult: BASIC
    focus: TaskExecutor và Runnable.
    problemSolved: Submit không có nghĩa hoàn tất.
    mechanism: TaskExecutor và Runnable. Dùng latch đọc kết quả.
    applicationValue: Chọn contract giao tác vụ.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **TaskExecutor là hợp đồng thực thi tác vụ của Spring**

      Từ một service gửi tác vụ, người học cần hiểu `TaskExecutor` là hợp đồng tách công việc cần làm khỏi cách tạo thread, queue và pool. Bài này xây dựng nền để đọc `execute(Runnable)`, chọn abstraction đúng và không nhầm nộp việc với hoàn tất nghiệp vụ.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Bản chất hợp đồng

      1. Vì sao Spring cung cấp `TaskExecutor` dù JDK đã có `Executor`?
      2. `execute(Runnable)` cam kết điều gì và không bảo đảm những gì?
      3. `SyncTaskExecutor` và `ThreadPoolTaskExecutor` cùng một interface nhưng khác hành vi ra sao?

      ### Kết quả và tài nguyên

      1. Khi `execute` trả `void`, caller làm cách nào chờ task hoàn tất đúng lúc?
      2. Vì sao queue còn chỗ có thể khiến pool chưa mở rộng tới `maxPoolSize`?
      3. Tại sao service nên inject bean executor thay vì tạo một pool mới cho từng request?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Đọc hợp đồng | Giải thích `TaskExecutor` kế thừa `Executor`, nhận `Runnable` và không có Future từ `execute`. |
      | Chọn chiến lược | Phân loại đồng bộ, thread riêng, pool và adapter theo nhu cầu thực thi. |
      | Chờ completion | Phân tích ví dụ latch và chỉ đọc kết quả khi task hoàn tất. |
      | Tách trách nhiệm | Thiết kế service nhận `TaskExecutor` qua constructor, để Spring quản lý cấu hình/vòng đời pool. |
      | Nhận diện rủi ro | Phân biệt acceptance với durability, lỗi worker và rejection lúc giao việc. |
  - slug: task-executor-002
    title: execute(Runnable) không mặc nhiên bảo đảm chạy trên luồng khác
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: SyncTaskExecutor và CallerRunsPolicy.
    problemSolved: Pool không luôn chạy khác caller khi overload.
    mechanism: SyncTaskExecutor và CallerRunsPolicy. So sánh Thread với latch.
    applicationValue: Xác minh thread và overload.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **execute(Runnable) không mặc nhiên bảo đảm chạy trên luồng khác**

      Việc gọi `execute(Runnable)` không chứng minh tác vụ chắc chắn chạy trên thread khác. Bài này cho người học công cụ phân biệt thời điểm submit/start/finish và nhận biết `CallerRunsPolicy` làm request thread trực tiếp chạy việc khi pool bão hòa.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Thread và completion

      1. Tại sao tên interface không đủ kết luận task dùng thread khác?
      2. Điều gì quyết định thứ tự in khi dùng `SyncTaskExecutor` so với pool?
      3. Vì sao chỉ đo latency hoặc đọc log chưa chứng minh task đã hoàn tất?

      ### Quá tải và kiểm thử

      1. Pool với một worker và queue một slot cần điều kiện nào để `CallerRunsPolicy` kích hoạt?
      2. Chính sách `AbortPolicy` khác gì về đường lỗi và caller latency?
      3. Dùng `Thread.currentThread()` với `CountDownLatch` thế nào để kiểm chứng thay vì `sleep`?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân biệt thời điểm | Mô tả dispatch, bắt đầu, hoàn tất và đường caller-runs trong một trace. |
      | Kiểm tra thread | Viết phép so sánh đối tượng `Thread` và tín hiệu latch đúng thời điểm. |
      | Dự đoán overload | Dự đoán output của ví dụ JDK dùng CallerRunsPolicy khi bão hòa có chủ đích. |
      | Thiết kế chính sách | Giải thích ảnh hưởng của rejection handler đến off-thread, latency và context. |
      | Kiểm thử an toàn | Dùng timeout hữu hạn và phân biệt lỗi submit với exception worker. |
  - slug: task-executor-003
    title: AsyncTaskExecutor và các phương thức submit()
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: AsyncTaskExecutor.submit và Future.
    problemSolved: isDone không bảo đảm thành công.
    mechanism: AsyncTaskExecutor.submit và Future. get kết quả và cause exception.
    applicationValue: Kiểm soát kết quả/lỗi.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **AsyncTaskExecutor và các phương thức submit()**

      Nếu business code cần biết tác vụ đã hoàn tất, nhận kết quả hoặc bắt lỗi từ worker, `execute` không đủ. `AsyncTaskExecutor` bổ sung hai overload `submit` và `Future`; bài học hướng dẫn cách sử dụng chúng cùng timeout, interruption, cancellation và quan sát exception chính xác.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Lựa chọn API

      1. Vì sao biến kiểu `TaskExecutor` không có method `submit`?
      2. `submit(Runnable)` và `submit(Callable)` khác nhau như thế nào về kiểu Future và giá trị `get()`?
      3. Vì sao `isDone()` đúng không có nghĩa nghiệp vụ đã thành công?

      ### Failure và vòng đời

      1. Làm sao tách `TaskRejectedException` tại submit khỏi `ExecutionException` ở get?
      2. `Future.get(timeout)` và `cancel(true)` giới hạn điều gì, không tự rollback điều gì?
      3. Vì sao bỏ qua Future có thể khiến exception của task không được quan sát?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Chọn overload | Viết đúng `submit(Runnable)` hoặc `submit(Callable)` theo nhu cầu. |
      | Quan sát kết quả | Gọi `Future.get` với timeout, kiểm chứng giá trị null hoặc dữ liệu trả về. |
      | Phân tích lỗi | Bắt `ExecutionException`, kiểm tra `getCause()` và phân biệt rejection tại submit. |
      | Quản lý hủy | Giải thích `cancel`, interrupt, timeout và tính không bền vững của task trong RAM. |
      | Thiết kế giám sát | Xác định owner cần theo dõi completion, failure và queue thay vì bỏ Future. |
  - slug: task-executor-004
    title: Nhận CompletableFuture qua submitCompletable() khi phiên bản hỗ trợ
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: submitCompletable và CompletionStage.
    problemSolved: join và cancel không dừng mọi I/O.
    mechanism: submitCompletable và CompletionStage. thenCombine và exceptionally.
    applicationValue: Thiết kế pipeline composition.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Nhận CompletableFuture qua submitCompletable() khi phiên bản hỗ trợ**

      Khi cần phối hợp các công việc bất đồng bộ, `submitCompletable` trong Spring 6.0+ cung cấp `CompletableFuture` với các stage kết hợp dữ liệu và phục hồi lỗi. Bài này tập trung vào ranh giới phiên bản, overload, thread chạy continuation và lỗi có thể xuất hiện ngay tại submit hoặc sau đó.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### API theo phiên bản

      1. Cần xác minh những gì để gọi được `AsyncTaskExecutor.submitCompletable`?
      2. Vì sao overload Runnable có kết quả null còn Callable có giá trị kiểu cụ thể?
      3. Với Spring 5.x, dùng `supplyAsync` hoặc `runAsync` kèm executor thế nào?

      ### Composition và lỗi

      1. Chọn `thenApply`, `thenCombine`, `thenCompose` hoặc `exceptionally` dựa vào quan hệ các bước ra sao?
      2. Vì sao `thenApplyAsync` không truyền executor có thể chạy ngoài Spring pool?
      3. `CompletionException`, rejection và lỗi trong continuation khác nhau ở giai đoạn nào?
      4. Tại sao `orTimeout` hoặc `CompletableFuture.cancel(true)` không bảo đảm dừng I/O đang chạy?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Kiểm tra compatibility | Xác định mốc Spring 6.0 và kiểu `AsyncTaskExecutor` có hai overload. |
      | Ghép pipeline | Dùng `thenCombine` và `thenApply` tạo kết quả từ các future độc lập. |
      | Xử lý lỗi | Áp dụng `handle`/`exceptionally` và bắt rejection tại thời điểm submit. |
      | Chọn execution context | Truyền executor cho stage Async khi cần giữ cùng pool và giới hạn tải. |
      | Tránh starvation | Giải thích rủi ro chặn worker đợi task con trong cùng pool. |
  - slug: task-executor-005
    title: Tiêm bộ thực thi qua interface để tách khỏi cách triển khai
    status: WRITTEN
    difficult: BASIC
    focus: '@Bean, @Qualifier và @Profile.'
    problemSolved: DI không tự truyền context.
    mechanism: '@Bean, @Qualifier và @Profile. Đổi profile và fake executor.'
    applicationValue: Tách service khỏi implementation.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Tiêm bộ thực thi qua interface để tách khỏi cách triển khai**

      Một service chỉ cần gửi `Runnable` không nên mang trách nhiệm quản trị pool và thread. Bài này đưa ra constructor injection qua `TaskExecutor`, lựa chọn bean bằng `@Qualifier`, chuyển profile pool/sync và cách dùng fake executor để test service không phụ thuộc timing.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Dependency injection

      1. Vì sao inject interface ổn định hơn việc service tự `new ThreadPoolTaskExecutor`?
      2. Hai profile dùng cùng bean name nhưng đổi implementation được cấu hình như thế nào?
      3. Vì sao `@Qualifier` cần thiết khi có nhiều executor cùng kiểu?

      ### Kiểm thử và ranh giới

      1. Fake executor lưu `Runnable` cho phép kiểm thử hành vi submit ra sao?
      2. Khi nào nên đổi dependency thành `AsyncTaskExecutor` hoặc `TaskScheduler`?
      3. DI có giải quyết hộ transaction, ThreadLocal hoặc thread safety của singleton không?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Tách cấu hình | Thiết kế service giữ field `TaskExecutor` và cấu hình pool trong Spring. |
      | Chọn đúng bean | Thêm qualifier theo tên vai trò và giải thích tránh injection ambiguity. |
      | Thay implementation | Dùng profile chuyển giữa pool và đồng bộ mà không sửa logic service. |
      | Kiểm thử xác định | Thu Runnable vào fake executor và chủ động thực thi, kiểm tra side effect/latch. |
      | Xác định giới hạn | Giải thích ranh giới lỗi, shutdown, context và shared state sau DI. |
  - slug: task-executor-006
    title: Phân biệt TaskExecutor với TaskScheduler
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: TaskScheduler, @Scheduled và @Async.
    problemSolved: fixedDelay callback không đợi async worker.
    mechanism: TaskScheduler, @Scheduled và @Async. Dự đoán mốc fixed-rate và fixed-delay.
    applicationValue: Chọn cơ chế thời gian.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phân biệt TaskExecutor với TaskScheduler**

      `TaskExecutor` thực thi công việc được giao, còn `TaskScheduler` quyết định thời điểm một callback phải chạy. Bài này giúp người học đọc fixed-rate, fixed-delay, cron và cách kết hợp `@Scheduled` với `@Async` mà không hiểu sai completion của công việc nền.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng về thời gian

      1. Tại sao `execute(Runnable)` không thể trực tiếp mô tả cron hoặc fixed-delay?
      2. Fixed-rate và fixed-delay khác nhau thế nào khi tác vụ chạy lâu hơn chu kỳ?
      3. `@EnableScheduling`, `TaskScheduler` và timezone có vai trò gì trong lịch định kỳ?

      ### Điều phối cùng executor

      1. Nếu callback scheduled chỉ submit `@Async` rồi trả về, fixed-delay đo theo mốc nào?
      2. `ScheduledFuture` của callback dispatch chứng minh điều gì, không chứng minh điều gì?
      3. Vì sao nhiều replica Spring có thể cùng thực hiện lịch nếu thiếu khóa phân tán?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Chọn abstraction | Phân loại tình huống cần executor hay scheduler theo điểm kích hoạt. |
      | Phân tích nhịp | Dự đoán mốc fixed rate/delay với job lâu hơn khoảng lập lịch. |
      | Đọc cấu hình | Giải thích cron, timezone và hai annotation enable độc lập. |
      | Quan sát completion | Phân biệt kết thúc callback với kết thúc tác vụ do callback gửi đi. |
      | Xử lý chồng lấp | Đề xuất in-flight control, idempotency hoặc điều phối phân tán khi cần. |
  - slug: task-executor-007
    title: TaskRejectedException và hợp đồng khi không nhận được tác vụ
    status: WRITTEN
    difficult: ADVANCED
    focus: TaskRejectedException và reject handlers.
    problemSolved: Discard có thể mất task im lặng.
    mechanism: TaskRejectedException và reject handlers. Dựng saturation và kiểm tra reject.
    applicationValue: Bảo vệ hợp đồng nhận việc.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **TaskRejectedException và hợp đồng khi không nhận được tác vụ**

      Pool có giới hạn có thể từ chối nhiệm vụ khi worker/queue đầy hoặc khi shutdown. Nếu application vẫn xác nhận đã nhận công việc, người dùng có thể mất job không thể phục hồi. Bài này dạy cách phân biệt rejection với lỗi thực thi và chọn chính sách xử lý quá tải đúng hợp đồng nghiệp vụ.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Nguyên nhân và policy

      1. Điều kiện nào khiến `ThreadPoolTaskExecutor` không thể nhận thêm task?
      2. So sánh `AbortPolicy`, `CallerRunsPolicy`, `DiscardPolicy` và `DiscardOldestPolicy` theo nguy cơ mất việc?
      3. Tại sao `execute()` không ném lỗi có thể vẫn dẫn đến mất task với discard policy?

      ### Kiểm thử và reliability

      1. Làm sao dùng một worker, queue một slot và latch để tạo rejection chắc chắn?
      2. Lúc nào API có thể trả 202, 429 hoặc 503 mà không hứa sai về việc được nhận?
      3. Vì sao retry và queue trong RAM không tự bảo đảm durable delivery hay idempotency?
      4. Metric nào phân biệt saturation, shutdown và backlog?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Dự đoán saturation | Giải thích thứ tự core, queue, max và điều kiện từ chối. |
      | Chọn policy | Đánh giá trade-off của bốn rejection handlers đối với latency và mất job. |
      | Viết test overload | Dùng latch dàn dựng rejection và bắt `TaskRejectedException` đúng boundary. |
      | Thiết kế giao thức nhận việc | Chọn fail-fast, retry hữu hạn hoặc durable queue/outbox theo nghiệp vụ. |
      | Quan sát vận hành | Nêu active threads, queue depth, rejection rate và thời gian chờ cần theo dõi. |
