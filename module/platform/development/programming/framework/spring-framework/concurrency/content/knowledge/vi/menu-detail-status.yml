    title: Chụp ngữ cảnh ở bên gửi rồi khôi phục trạng thái cũ bằng try-finally
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Thời điểm snapshot và finally.
    problemSolved: Mutable map cần copy.
    mechanism: previous và finally. CallerRuns và nested scope.
    applicationValue: Nested context được restore.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Chụp ngữ cảnh ở bên gửi rồi khôi phục trạng thái cũ bằng try-finally**

      Việc chụp context tại submit tạo snapshot đúng cho một task, còn khôi phục previous tại execution thread giúp giữ trạng thái của outer scope. Bài học đào sâu thứ tự capture → install → run → restore trong finally, kể cả CallerRunsPolicy, nested decorator, task lỗi và caller thay đổi context trước lúc worker chạy.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Thời điểm và dữ liệu

      1. Vì sao capture bên trong run lại đọc nhầm context của worker thay vì caller?
      2. Caller đổi requestId sau submit; worker phải thấy ID nào và vì sao?
      3. Vì sao giữ tham chiếu HashMap mutable không phải snapshot độc lập?

      ### Khôi phục scope

      1. Vì sao chỉ remove ở cuối task có thể phá scope ngoài khi callback chạy inline?
      2. previous phải được lấy trên thread nào và xử lý ra sao nếu nó null?
      3. CallerRunsPolicy làm thay đổi giả định về thread thực thi như thế nào?

      ### Thử nghiệm

      1. Bạn dùng CountDownLatch để khóa worker trước khi đổi context trên caller như thế nào?
      2. Khi FutureTask ghi lỗi vào Future, vì sao finally của wrapper vẫn cần chạy?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Snapshot thời điểm submit | Dùng latch để chứng minh worker thấy giá trị đã chụp dù caller thay đổi. |
      | Nested restoration | Khôi phục context trước callback trên direct executor. |
      | Sao chép phòng vệ | Chọn String bất biến hoặc bản copy của map cần truyền. |
      | Test lỗi | Xác nhận worker trở lại baseline khi task ném exception. |
  - slug: execution-context-005
    title: Truyền mã liên kết yêu cầu và ngữ cảnh ghi nhật ký
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Correlation ID và MDC.
    problemSolved: ID không cấp quyền.
    mechanism: MDC map, HTTP headers. Filter → worker → downstream.
    applicationValue: Log và header cùng ID.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Truyền mã liên kết yêu cầu và ngữ cảnh ghi nhật ký**

      Correlation ID nối log của HTTP request, executor và downstream service dù luồng xử lý chuyển thread. Bài học phân biệt correlation ID, request ID, job ID và distributed trace IDs, rồi trình bày servlet filter, MDC snapshot, TaskDecorator, headers và messaging metadata. Nó còn chỉ rõ validation và hạn chế đưa PII, token hay ID do client kiểm soát vào phân quyền.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Định danh và tin cậy

      1. Correlation ID khác request ID, job ID, trace ID, span ID và idempotency key thế nào?
      2. Vì sao X-Correlation-ID không tự tạo một W3C trace hợp lệ?
      3. Những vấn đề gì phát sinh khi nhận header dài hoặc chứa ký tự điều khiển từ client?

      ### Đường truyền context

      1. MDC phải được capture và restore qua ThreadPoolTaskExecutor như thế nào?
      2. Khi CompletableFuture chuyển sang commonPool, mã correlation có tự đi theo không?
      3. Muốn Service B có cùng correlation ID, Service A phải truyền gì qua HTTP hoặc message headers?

      ### Kiểm chứng

      1. Bạn kiểm tra filter, response header và worker MDC trên hai request khác nhau ra sao?
      2. Vì sao không nên dùng correlation ID làm authorization hoặc high-cardinality metrics label?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Định nghĩa ID | Phân biệt các loại ID và xác thực/chuẩn hóa header tại ingress. |
      | Truyền MDC | Cấu hình decorator copy/restore MDC và xác minh log worker. |
      | Liên kết downstream | Đưa correlation ID vào HTTP/message metadata và kiểm tra bên nhận. |
      | Hạn chế dữ liệu | Giữ token/PII khỏi log và không dùng correlation ID cấp quyền. |
  - slug: execution-context-006
    title: ContextPropagatingTaskDecorator và điều kiện tích hợp thư viện ngữ cảnh
    status: WRITTEN
    difficult: ADVANCED
    focus: Micrometer accessor và registry.
    problemSolved: Không copy mọi ThreadLocal.
    mechanism: ContextSnapshot.Scope. Có/không accessor.
    applicationValue: Custom tenant được capture.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **ContextPropagatingTaskDecorator và điều kiện tích hợp thư viện ngữ cảnh**

      Spring 6.1+ cung cấp ContextPropagatingTaskDecorator dựa trên Micrometer Context Propagation. Bài học nhấn mạnh điều kiện cần: dependency runtime, ContextRegistry và ThreadLocalAccessor cho đúng loại dữ liệu, cùng executor được cấu hình thực sự nhận task. Ví dụ custom tenant trong @Async giúp phân biệt decorator, accessor, registry và các giới hạn với MDC, tracing, Reactor, SecurityContext, transaction.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Thành phần Micrometer

      1. Cần phiên bản Spring nào và dependency runtime nào để khởi tạo ContextPropagatingTaskDecorator?
      2. ContextRegistry, ThreadLocalAccessor, ContextSnapshotFactory và Scope khác trách nhiệm ra sao?
      3. Vì sao custom ThreadLocal vẫn null nếu không có accessor đã đăng ký?

      ### Cấu hình và giới hạn

      1. Khi nào cần ContextRegistry riêng và làm sao đảm bảo decorator dùng đúng factory?
      2. @Async phải chọn bean và đi qua proxy nào để thực sự chạy decorator?
      3. Vì sao một decorator không tự truyền transaction hoặc mọi CompletableFuture stage?

      ### Xác minh tích hợp

      1. Bạn phân biệt lỗi thiếu jar, thiếu accessor, sai registry và sai executor bằng các kiểm tra nào?
      2. Cần kiểm thử worker reuse, context vắng mặt và mutable object ra sao?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Kiểm tra dependencies | Xác minh spring-core và io.micrometer:context-propagation trong runtime. |
      | Tạo accessor | Đăng ký getter/setter/reset cho custom ThreadLocal trong registry tương ứng. |
      | Cấu hình executor | Gắn ContextPropagatingTaskDecorator cho @Async đúng bean. |
      | Kiểm chứng | Thử task có/không accessor, task sau clear và exception cleanup. |
  - slug: execution-context-007
    title: Đánh giá chi phí trang trí với số lượng tác vụ rất nhỏ
    status: WRITTEN
    difficult: ADVANCED
    focus: Overhead tiny task.
    problemSolved: Benchmark ít mẫu nhiễu.
    mechanism: JMH, JFR và metrics. 20 và 30000 tasks.
    applicationValue: Giải thích chênh lệch đo.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Đánh giá chi phí trang trí với số lượng tác vụ rất nhỏ**

      TaskDecorator thêm wrapper, snapshot, ThreadLocal operations và allocation cho mỗi task; với workload cực ngắn chi phí có thể đáng kể. Bài học phân biệt số lượng task ít với nhiều tiny tasks, cách tách overhead decorator khỏi scheduling/queue/JIT/GC, và khi nào dùng JMH. Người học biết thiết kế benchmark công bằng, diễn giải nhiễu và tối ưu mà vẫn giữ context đúng.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Phân tích chi phí

      1. Những thao tác nào xảy ra trên submitter, worker và executor khi bọc task?
      2. Vì sao elapsed của một batch không thể coi là riêng chi phí TaskDecorator?
      3. Tại sao đo 5 hoặc 20 task chưa đủ đưa ra kết luận phần trăm ổn định?

      ### Thiết kế benchmark

      1. Bạn cần cố định executor, task body, warm-up và logging như thế nào khi so ba mode?
      2. JMH giúp tránh những lỗi microbenchmark nào so với một vòng đo nanoTime?
      3. Làm sao kiểm chứng đủ task được hoàn thành trước khi phân tích throughput?

      ### Lựa chọn tối ưu

      1. Khi nào batching, context tối thiểu hoặc chạy trực tiếp phù hợp với tiny tasks?
      2. Vì sao bỏ propagation có thể làm tracing sai dù throughput cải thiện?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân rã overhead | Tách chi phí capture/wrapper khỏi queue và execution. |
      | Đo có đối chứng | Tổ chức warm-up, nhiều lượt, nhiều cỡ batch và đối chiếu dao động. |
      | Công cụ đo | Đề xuất JMH, JFR, allocation profiler và p95/p99. |
      | Giữ semantics | Chứng minh context vẫn đúng trước khi tối ưu hoặc gom task. |
  - slug: execution-context-008
    title: Không giữ toàn bộ đối tượng request sau khi yêu cầu đã kết thúc
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Servlet request lifetime.
    problemSolved: Không giữ HttpServletRequest.
    mechanism: Immutable snapshot, storage key. Request đóng trước worker.
    applicationValue: Job chỉ cần DTO.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Không giữ toàn bộ đối tượng request sau khi yêu cầu đã kết thúc**

      HttpServletRequest thuộc vòng đời Servlet; đưa request hoặc ServletRequestAttributes vào lambda, Future, queue có thể kéo dài tham chiếu và làm worker truy cập object sau khi hết hiệu lực. Bài học phân biệt controller return với Servlet async completion, minh họa retention của object graph và thay raw request bằng DTO bất biến, job ID hoặc storage key cho file upload.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Lifecycle và tham chiếu

      1. Trong request đồng bộ và Servlet async do MVC quản lý, thời điểm hoàn tất khác nhau thế nào?
      2. Vì sao giữ reference tới request trong lambda có thể giữ cả object graph dù request đã kết thúc?
      3. RequestContextHolder hoặc request-scoped proxy có thể hoạt động sau response không?

      ### Thiết kế snapshot

      1. Bạn xác thực và trích xuất những ID nào trước khi giao việc cho worker?
      2. Vì sao record có byte array hoặc mutable collection chưa bất biến sâu?
      3. Khi xử lý upload lâu, vì sao nên lưu file ở storage rồi enqueue storage key?

      ### Vận hành và kiểm thử

      1. Làm thế nào dùng fake request và latch để bắt lỗi đọc sau lifecycle?
      2. Khi trả 202 rồi ứng dụng crash, cần gì để theo dõi và retry job?
      3. Tại sao WeakReference và System.gc không đủ làm assertion chống giữ reference?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân biệt lifecycle | Giải thích controller return và Servlet async completion. |
      | Rà soát retention | Tìm capture request trực tiếp hoặc gián tiếp trong task/callback/queue. |
      | Tạo input an toàn | Xây immutable DTO và storage key thay cho request/upload stream. |
      | Kiểm chứng bằng test | Dùng latch cho worker chạy sau khi request mô phỏng đã đóng. |
  - slug: execution-context-009
    title: Phân biệt ngữ cảnh bảo mật cần bộ hỗ trợ riêng với ThreadLocal tùy ý
    status: WRITTEN
    difficult: ADVANCED
    focus: SecurityContext propagation.
    problemSolved: Context không thay authorization.
    mechanism: DelegatingSecurityContext wrappers. Alice và Bob trong pool.
    applicationValue: Principal sạch sau task.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phân biệt ngữ cảnh bảo mật cần bộ hỗ trợ riêng với ThreadLocal tùy ý**

      SecurityContextHolder quản lý SecurityContext/Authentication có ý nghĩa identity, quyền và lifecycle; đây không phải ThreadLocal user ID tùy ý dùng làm log metadata. Bài học dùng các wrapper DelegatingSecurityContext cho Runnable, ExecutorService và Spring @Async; so sánh fixed context với capture per submit, thử Alice/Bob trên cùng worker và phân biệt propagation với authorization.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Khác biệt của security

      1. SecurityContextHolder, Authentication và ThreadLocal userId khác nhau ở vai trò nào?
      2. Vì sao worker đọc principal cũ nguy hiểm hơn việc đọc null?
      3. MODE_GLOBAL và MODE_INHERITABLETHREADLOCAL gây nguy cơ gì trong server đa người dùng?

      ### Wrapper chuyên dụng

      1. Các DelegatingSecurityContext wrapper tương ứng với Runnable, ExecutorService và AsyncTaskExecutor nào?
      2. Constructor có SecurityContext cố định khác việc capture context khi submit ra sao?
      3. Vì sao cùng một SecurityContext mutable không phải snapshot sâu giữa các thread?

      ### Kiểm thử và quyền

      1. Làm sao chứng minh Alice rồi Bob có đúng principal trên cùng worker và raw task sau đó sạch?
      2. Một @Async được bảo vệ có làm thenApplyAsync trên commonPool tự được bảo vệ không?
      3. Tại sao quyền resource phải kiểm tra tại thời điểm thực thi thay vì chỉ dựa auth.getName?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Chọn API Security | Dùng đúng DelegatingSecurityContext wrapper theo loại executor. |
      | Phân biệt chế độ | Không tạo singleton executor gắn context cố định của một user. |
      | Kiểm tra isolation | Test Alice/Bob trên một worker rồi xác minh raw task không thấy user cũ. |
      | Kiểm tra phân quyền | Tách audit ID khỏi authorization hiện hành và policy tài nguyên. |
  - slug: execution-context-010
    title: Không dùng InheritableThreadLocal như giải pháp chung cho nhóm luồng tái sử dụng
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Inheritance khi tạo thread.
    problemSolved: Không kế thừa mỗi submit.
    mechanism: childValue và per-task wrapper. Tenant A rồi tenant B.
    applicationValue: Worker B không thừa A.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Không dùng InheritableThreadLocal như giải pháp chung cho nhóm luồng tái sử dụng**

      InheritableThreadLocal sao chép giá trị khi tạo child thread, không mỗi lần nộp task. Bài học tái hiện worker kế thừa tenant-A rồi vẫn đọc A khi request B submit, giải thích ảnh hưởng của lazy worker, prestart, pool expansion và childValue chia sẻ mutable reference. Người học chuyển sang immutable parameters hoặc wrapper per-task và biết giới hạn của Spring Security inheritance mode.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Thời điểm kế thừa

      1. InheritableThreadLocal.childValue được chạy khi nào và mặc định trả loại tham chiếu gì?
      2. Vì sao caller đổi sang tenant-B không cập nhật worker đã được tạo dưới tenant-A?
      3. Prestart worker và pool resize làm kết quả đọc context có thể thay đổi ra sao?

      ### Rủi ro

      1. Vì sao clone trong childValue không giải quyết propagation theo lần submit?
      2. ThreadLocal.remove ở caller có thể xóa context worker hay không?
      3. Tại sao không được truyền transaction, request hoặc SecurityContext bằng inheritance mù quáng?

      ### Thay thế và kiểm chứng

      1. Bạn sẽ tái hiện stale value bằng single-thread executor như thế nào?
      2. Wrapper per-task phải capture, install, restore trong finally theo thứ tự nào?
      3. Khi nào nên truyền tenantId bằng tham số thay vì TaskDecorator?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Giải thích inheritance | Mô tả thời điểm tạo child thread và giá trị mutable được kế thừa. |
      | Tái hiện sai lệch | Chứng minh task B còn thấy tenant-A trên một worker được dùng lại. |
      | Sửa theo task | Dùng immutable parameter hoặc wrapper capture/restore tại submit. |
      | Chọn tích hợp Spring | Nêu ranh giới TaskDecorator và wrapper SecurityContext chuyên dụng. |
- slug: transactions-events
  title: Giao dịch và sự kiện
  childs:
  - slug: transactions-events-001
    title: Giao dịch thông thường gắn với luồng không tự truyền vào tác vụ @Async
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Nhận diện transaction gắn thread.
    problemSolved: Nghĩ transaction tự truyền qua @Async.
    mechanism: TransactionSynchronizationManager, @Async. Spring/H2 quan sát hai worker trước commit.
    applicationValue: Chẩn đoán thread boundary. Đo active tx và visible rows tại worker.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Giao dịch thông thường gắn với luồng không tự truyền vào tác vụ @Async**

      Trong Spring imperative, transaction do `PlatformTransactionManager` quản lý thường gắn với thread hiện tại. Nếu caller gọi một phương thức `@Async` qua Spring proxy và executor thực sự chuyển việc sang worker, transaction cùng JDBC connection của caller không được truyền theo. Vì vậy worker có thể không đọc được bản ghi chưa commit; worker tự mở transaction cũng không đồng nghĩa tham gia transaction gốc.

      Bài học xây dựng khả năng quan sát ranh giới thật bằng `TransactionSynchronizationManager`, thread name, Spring/JDBC/H2 và các Future được phối hợp có chủ đích. Từ kết quả caller commit/rollback và listener sau commit, người học biết vì sao phải thiết kế thời điểm giao việc thay vì trông cậy vào tốc độ thread.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Thread-bound transaction và đường gọi qua proxy

      1. Spring gắn transaction và JDBC resource với thread qua cơ chế nào, và `@Async` thay đổi thread thực thi ở điểm nào?
      2. Tại sao `TransactionSynchronizationManager.isActualTransactionActive()` có thể đúng ở caller nhưng sai tại worker?
      3. Trường hợp self-invocation hoặc `SyncTaskExecutor` có thể làm ta kết luận sai rằng transaction được truyền xuyên thread như thế nào?

      ### Commit visibility và transaction riêng

      1. Worker dùng transaction riêng với `Propagation.REQUIRED` có nhìn được row caller chưa commit dưới `READ_COMMITTED` không, và vì sao?
      2. Đặt `Future.get()` trong transaction caller để chờ worker có thể tạo rủi ro deadlock hoặc cạn connection bằng cách nào?
      3. Vì sao `@TransactionalEventListener(AFTER_COMMIT)` sửa được một phần lỗi timing nhưng cần outbox khi task phải tồn tại qua crash?

      ### Kiểm chứng bằng Spring/H2

      1. Trong demo hai worker queries trước caller commit, các giá trị transaction-active và visible-row nào chứng minh hai thread độc lập?
      2. Khi caller rollback, cần đối chiếu row và callback `AFTER_COMMIT` như thế nào để không suy luận từ thứ tự log ngẫu nhiên?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Truy vết transaction theo thread | Vẽ ranh giới T1 caller và worker, xác định lúc bind/unbind transaction resource và lúc method async thực thi. |
      | Phân biệt hai giao dịch | Giải thích tại sao worker `@Transactional` có thể tạo T2 nhưng không được thừa hưởng dữ liệu chưa commit của T1. |
      | Chẩn đoán lỗi đọc trước commit | Đọc output Spring/H2 và chỉ ra nguyên nhân query worker thấy 0 row, sau commit mới thấy 1 row. |
      | Chọn điểm giao việc an toàn | Đề xuất after-commit listener hoặc outbox theo yêu cầu timing và độ bền, không giữ transaction mở để chờ Future. |
  - slug: transactions-events-002
    title: Tạo ranh giới giao dịch mới trong bean xử lý khi nghiệp vụ yêu cầu
    status: WRITTEN
    difficult: ADVANCED
    focus: Tạo transaction do worker sở hữu.
    problemSolved: Dùng REQUIRES_NEW như cơ chế đổi thread.
    mechanism: REQUIRED, REQUIRES_NEW, TransactionTemplate. H2 parent rollback, worker commit.
    applicationValue: Đặt local transaction mới đúng lúc. Phân biệt outcome A/B qua DB.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Tạo ranh giới giao dịch mới trong bean xử lý khi nghiệp vụ yêu cầu**

      Một async worker đôi khi cần ghi một nhóm kết quả như một unit of work nguyên tử. Bài này hướng dẫn tách bean giao việc bất đồng bộ khỏi bean xử lý có `@Transactional` hoặc `TransactionTemplate`, đồng thời chỉ rõ `REQUIRED` mở transaction mới nếu worker chưa có transaction và `REQUIRES_NEW` chỉ cần khi phải tách khỏi transaction đang có trong chính thread đó.

      Ví dụ Spring JDBC/H2 cho thấy transaction B ở worker commit trong khi transaction A của caller rollback. Kết quả ấy có thể đúng cho audit độc lập, nhưng nguy hiểm với shipping/payment phụ thuộc một order chưa commit; vì vậy phải đánh giá propagation, connection pool, self-invocation, failure và thời điểm dispatch.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Thiết kế ranh giới transaction tại worker

      1. Khi nào worker nên có transaction riêng và khi nào nghiệp vụ đòi hai thao tác ở cùng một transaction?
      2. Vì sao mẫu `AsyncGateway → TransactionalWorker` với hai Spring bean giúp bảo đảm `@Async` và `@Transactional` cùng đi qua proxy?
      3. Nếu thread worker chưa có transaction, `Propagation.REQUIRED` khác `REQUIRES_NEW` ra sao; khi nào sự khác biệt mới quan trọng?
      4. `NESTED` dùng savepoint khác transaction vật lý độc lập như thế nào?

      ### Lỗi giao dịch, lock và giới hạn tài nguyên

      1. Trong demo, tại sao `callerRowsAfterRollback=0` nhưng `workerRowsAfterCallerRollback=1` là kết quả hợp lệ?
      2. Vì sao caller giữ DB connection rồi `Future.get()` chờ worker có thể khiến pool thiếu connection hoặc phát sinh deadlock?
      3. Nếu worker ném RuntimeException, catch rồi nuốt lỗi, hoặc timeout Future, những kết quả commit/rollback nào vẫn có thể xảy ra?
      4. Khi caller tạo dữ liệu mà worker chỉ được xử lý sau commit, cần phối hợp after-commit/outbox như thế nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Tổ chức bean/proxy hợp lệ | Thiết kế dispatcher `@Async` và writer `@Transactional` ở hai bean khác nhau, xác minh transaction active ngay trong worker. |
      | Chọn propagation có lý do | So sánh REQUIRED, REQUIRES_NEW, NESTED trong tình huống có/không có transaction trên cùng thread và hậu quả connection. |
      | Đối chiếu rollback độc lập | Giải thích sáu dòng output H2 của demo caller rollback/worker commit, không gộp chúng thành global transaction. |
      | Xây chính sách thất bại | Đặt giới hạn queue, timeout, retry/idempotency và điểm dispatch sau commit khi job phụ thuộc dữ liệu gốc. |
  - slug: transactions-events-003
    title: Thời điểm commit của bên gửi và nguy cơ bên nhận đọc dữ liệu chưa hoàn tất
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Bảo đảm thứ tự producer commit.
    problemSolved: Publish trước commit hoặc đọc replica lag.
    mechanism: Isolation READ_COMMITTED, AFTER_COMMIT. Immediate listener vs after-commit visibility.
    applicationValue: Không cho consumer chạy quá sớm. Test separate connection, commit và rollback.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Thời điểm commit của bên gửi và nguy cơ bên nhận đọc dữ liệu chưa hoàn tất**

      `repository.save()` hoặc một câu SQL đã chạy không có nghĩa transaction bên gửi đã commit. Nếu producer phát event trước commit và consumer truy vấn bằng connection khác, consumer có thể thấy row chưa tồn tại hoặc phiên bản cũ; producer rollback còn có thể để lại một thông báo sai. Bài học minh họa lỗi này bằng timeline và demo Spring/H2 có listener tức thời đọc `false`, còn listener `AFTER_COMMIT` đọc `true`.

      Người học phân biệt mốc ghi/commit/xử lý event, cách `@EventListener` khác `@TransactionalEventListener`, và sự khác biệt giữa publish sau commit với outbox có thể phục hồi qua crash. Bài còn xét replica lag, consumer idempotency, event version và retry có giới hạn.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Thứ tự commit và mức nhìn thấy dữ liệu

      1. Ba mốc thực thi SQL, transaction commit thành công và consumer xử lý event khác nhau thế nào?
      2. Vì sao `@EventListener` mặc định có thể đọc dữ liệu chưa commit trên cùng connection trong khi consumer độc lập ở `READ_COMMITTED` không thấy?
      3. Consumer đọc replica hoặc transaction có snapshot cũ sau commit có thể vẫn thấy dữ liệu cũ do đâu?
      4. Vì sao gửi event ngay sau `save()` trước khi transactional proxy kết thúc chưa tạo quan hệ after-commit?

      ### Chọn after-commit, outbox và phương án đối soát

      1. Demo H2 cho ba output immediate=false, afterCommit=true, afterTx=true bằng thứ tự cơ chế nào?
      2. `AFTER_COMMIT` loại bỏ lớp lỗi nào khi producer rollback, và khoảng trống crash nào nó chưa giải quyết?
      3. Outbox ghi order và event intent trong cùng transaction giúp gì, và tại sao consumer vẫn cần event ID/version/idempotency?
      4. Nếu consumer nhận event hợp lệ nhưng đọc replica chậm, khi nào nên dùng snapshot payload, primary read hoặc bounded retry?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân tích race trước commit | Vẽ timeline producer INSERT/publish/COMMIT và consumer query từ connection độc lập, dự đoán kết quả dưới READ_COMMITTED. |
      | Kiểm chứng isolation | Giải thích demo Spring/H2 immediate listener false và after-commit true, không coi kết quả cùng connection là bằng chứng consumer độc lập. |
      | Thiết kế event an toàn | Lựa chọn transaction-bound listener cho timing và outbox cho durability, có xử lý duplicate/out-of-order. |
      | Đánh giá dữ liệu sau commit | Đề xuất read policy hoặc event snapshot/version khi consumer dùng replica, cache hoặc projection có lag. |
  - slug: transactions-events-004
    title: Không truyền EntityManager hoặc phiên ORM sang luồng xử lý khác
    status: WRITTEN
    difficult: ADVANCED
    focus: Giữ ORM context đúng owner.
    problemSolved: Chia sẻ provider EM/Session qua thread.
    mechanism: EntityManager proxy, persistence context. Hibernate/ORM ID đến OrderReader DTO.
    applicationValue: Ngăn sai lifecycle ORM. Xác minh worker transaction, DTO/lazy.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Không truyền EntityManager hoặc phiên ORM sang luồng xử lý khác**

      Hibernate `Session` và provider `EntityManager` thực giữ identity map, dirty-checking, lazy loading và transaction resources theo unit of work; chúng không thread-safe để chuyền qua `@Async`. Bài này tách rõ factory chia sẻ được, persistence context do worker sở hữu, đối tượng JPA managed/detached và một điểm dễ nhầm: field `@PersistenceContext` trong singleton repository thường là **shared proxy của Spring**, không phải Session thực duy nhất.

      Qua ứng dụng Spring ORM/Hibernate/H2, người học chuyển một ID sang worker, gọi `OrderReader` transactional qua proxy, map thành `OrderView` bất biến rồi trả qua Future. Điều này cũng giải thích tại sao OSIV, `readOnly=true`, entity lazy và việc hủy Future không biến Session cũ thành thread-safe.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Vòng đời ORM và quyền sở hữu context

      1. `EntityManagerFactory` và Hibernate `SessionFactory` chia sẻ được theo cách nào mà một `EntityManager`/`Session` thực lại không?
      2. Shared `@PersistenceContext` proxy trong Spring singleton khác underlying provider EntityManager ở đâu?
      3. Vì sao `@PersistenceContext(type=EXTENDED)` và một Session thực được giữ trong singleton nguy hiểm khi bị nhiều thread truy cập?
      4. Managed entity, lazy proxy và JPA stream có thể hỏng thế nào khi người gọi chuyển sang worker khác?

      ### Thiết kế và kiểm chứng worker JPA

      1. Tại sao worker nên nhận ID, tự mở transaction qua bean `OrderReader` và trả DTO thay vì trả entity?
      2. `OpenEntityManagerInView` hoặc `@Transactional(readOnly=true)` có sửa được việc dùng chung EntityManager thực không, và vì sao?
      3. Trong ví dụ Hibernate/H2, bốn output kiểm tra ID, field, worker thread và transaction active chứng minh những ranh giới nào?
      4. Vì sao gửi async trước commit có thể gây not-found dù mọi repository đã dùng shared proxy đúng cách?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân biệt ORM resources | Giải thích lifecycle của EMF, Spring shared EM proxy, underlying EM, Hibernate Session và persistence context. |
      | Nhận diện handoff không an toàn | Tìm nơi truyền provider EM/Session, managed entity, lazy collection hoặc cursor qua executor và lý giải lỗi có thể xảy ra. |
      | Thiết kế worker transactional | Cho caller commit, gửi ID, worker load bằng `@Transactional` qua bean khác và tạo DTO đã materialize. |
      | Kiểm thử lazy, race và cleanup | Xác minh worker dùng context riêng, xử lý lazy mapping đúng transaction và không giữ resource sau completion. |
  - slug: transactions-events-005
    title: Truyền mã định danh hoặc dữ liệu bất biến thay cho thực thể đang gắn phiên
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Xây payload độc lập với entity.
    problemSolved: Payload mutable/lazy và stale update.
    mechanism: ID, immutable snapshot, @Version. Mutable record, deep snapshot, CAS version.
    applicationValue: Giữ contract dữ liệu theo thời điểm. Test ID/snapshot/version theo timeline.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Truyền mã định danh hoặc dữ liệu bất biến thay cho thực thể đang gắn phiên**

      Truyền reference của một JPA entity cho worker không tự clone trạng thái, tách session hay giữ nguyên thời điểm sự kiện. Bài học thiết kế hợp đồng dữ liệu rõ ràng qua ranh giới thread và event: truyền **ID để re-fetch state hiện tại**, **immutable snapshot cho historical fact**, hoặc **ID + version** khi phải từ chối thao tác lỗi thời.

      Các ví dụ Java 17 về reference mutable, `record`, `List.copyOf`, CAS version và mẫu Spring/JPA loader cho thấy vì sao immutable nông khác deep immutability, transaction worker phải riêng, và event chỉ hợp lệ sau commit. Người học cũng xem xét tenant scope, serialization, outbox/idempotency và optimistic locking cho update cạnh tranh.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Lựa chọn ngữ nghĩa dữ liệu qua ranh giới async

      1. Truyền một managed entity reference khác truyền ID hoặc snapshot immutable về lifetime, lazy association và trạng thái nhìn thấy thế nào?
      2. Trong tình huống order đổi từ CREATED sang CANCELLED trước khi worker chạy, ID re-fetch và snapshot tại event có thể đưa ra hai kết quả nào?
      3. Khi nào ID+expectedVersion hoặc hybrid ID/version/snapshot cần thiết để không ghi đè dữ liệu mới?
      4. Vì sao record chứa `List<MutableLine>` và `List.copyOf` chưa bảo đảm deep immutability?

      ### Transaction, tính đúng đắn và kiểm thử

      1. Caller nên materialize các lazy fields ở đâu trước khi tạo event snapshot; worker cần transactional loader nào khi chỉ nhận ID?
      2. `@Version` đọc trước flush có thể không phản ánh revision đã commit như thế nào?
      3. Vì sao kiểm tra version chỉ bằng if trong Java chưa ngăn check-then-act race với DB/external API?
      4. Với hệ multi-tenant hoặc cần gửi qua broker, payload nên có metadata tối thiểu nào để kiểm soát quyền, dedup và schema evolution?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Chọn hợp đồng payload | Quyết định ID/fresh state, snapshot/historical state hoặc ID+version cho ba tình huống khác nhau và nêu hệ quả. |
      | Tạo snapshot bất biến | Map entity/lazy association thành nested record/List.copyOf của immutable elements trong transaction hợp lệ. |
      | Bảo vệ stale update | Phân tích `@Version`, CAS và SQL conditional UPDATE; xác định lúc cần DB atomic check hoặc downstream idempotency. |
      | Kiểm thử cách truyền dữ liệu | Chạy mô phỏng mutable reference vs snapshot và kiểm tra kết quả giữ nguyên sau khi nguồn thay đổi. |
      | Giữ scope dữ liệu an toàn | Bổ sung tenantId/eventId/version khi cần, tránh chuyển entity và secret vào broker/event. |
  - slug: transactions-events-006
    title: '@TransactionalEventListener cho xử lý gắn với kết quả giao dịch'
    status: WRITTEN
    difficult: ADVANCED
    focus: Ràng buộc listener theo outcome.
    problemSolved: Tưởng AFTER_COMMIT có transaction mới/durability.
    mechanism: TransactionPhase, fallbackExecution. Callback 4 phases và TransactionTemplate.
    applicationValue: Chọn đúng phase sự kiện. Test commit/rollback/no-tx/fallback.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **@TransactionalEventListener cho xử lý gắn với kết quả giao dịch**

      `@TransactionalEventListener` gắn listener với **outcome của transaction chứa lời gọi publish**, mặc định `AFTER_COMMIT` và còn ba pha `BEFORE_COMMIT`, `AFTER_ROLLBACK`, `AFTER_COMPLETION`. Bài này đi sâu hành vi khi không có transaction (`fallbackExecution`), transaction lồng nhau/`REQUIRES_NEW`, thứ tự callback, Spring proxy và sự khác biệt với listener `@EventListener`.

      Người học xác định vì sao callback sau commit vẫn có thể nhìn thấy resource cũ nhưng không còn lượt commit tiếp, nên write DB mới thường cần `REQUIRES_NEW` trong bean khác. Việc thêm `@Async` chỉ chuyển body listener sang executor khi cấu hình phù hợp; nó không truyền transaction cũ hoặc tạo durable delivery. Bài cũng giới thiệu reactive transaction/`TransactionalEventPublisher` và phép thử thật theo phase.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Phân biệt các pha và điều kiện nhận event

      1. Bốn `TransactionPhase` BEFORE_COMMIT, AFTER_COMMIT, AFTER_ROLLBACK và AFTER_COMPLETION kích hoạt theo outcome nào?
      2. `@EventListener` thường khác `@TransactionalEventListener` ra sao khi producer rollback?
      3. Phát event ngoài transaction với `fallbackExecution=false` sẽ thế nào; bật true làm thay đổi semantic after-commit ra sao?
      4. Event được publish trong inner `REQUIRES_NEW` rồi outer rollback gắn với transaction nào, và vì sao?

      ### Tài nguyên sau commit và async listener

      1. Tại sao gọi repository write trực tiếp ở callback `AFTER_COMMIT` có thể không được commit dù transaction chính đã thành công?
      2. Khi nào listener cần gọi bean khác có `@Transactional(REQUIRES_NEW)`, và vì sao điều đó vẫn không tạo durability qua crash?
      3. `@Async` trên transactional listener khác cấu hình multicaster async ở bước đăng ký transaction synchronization như thế nào?
      4. Transaction reactive trong Spring 6.1+ cần context/event source khác ThreadLocal imperative ra sao?

      ### Kiểm thử hành vi đúng pha

      1. Với `TransactionTemplate` và test không bao ngoài bởi test transaction rollback mặc định, bạn sẽ chứng minh callback nào chạy ở commit/rollback/no-transaction bằng cách nào?
      2. Vì sao `@Order` và latch không thay thế guarantee về thứ tự hoàn tất giữa nhiều worker hoặc broker?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân loại transaction listener | Chọn phase đúng cho validation, notification, audit rollback và cleanup, giải thích được giới hạn. |
      | Kiểm soát hậu commit DB write | Đặt `REQUIRES_NEW` trong Spring bean đúng proxy để ghi sau commit mà không dựa vào resource cũ. |
      | Kết hợp async và transaction event | Diễn giải thời điểm đăng ký synchronization so với lúc body được executor chạy, kiểm soát rejection/exception. |
      | Thiết kế integration test | Dùng `TransactionTemplate`, latch và commit/rollback thật để xác nhận phase, fallback và trường hợp no-tx. |
      | Phân biệt độ bền sự kiện | Giải thích vì sao phase listener không thay thế outbox và vì sao reactive transaction cần cơ chế publication riêng. |
  - slug: transactions-events-007
    title: Sự kiện nội bộ bất đồng bộ không thay thế hàng đợi bền vững
    status: WRITTEN
    difficult: ADVANCED
    focus: Bảo đảm ý định event có thể replay.
    problemSolved: Queue RAM mất task, ack sai, duplicate.
    mechanism: ApplicationEventPublisher, outbox, ACK. Local async event, outbox relay và dedupe.
    applicationValue: Tạo nền delivery đáng tin. Fault-injection crash và consumer retry.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Sự kiện nội bộ bất đồng bộ không thay thế hàng đợi bền vững**

      Spring `ApplicationEventPublisher` và `@Async @EventListener` rất hữu ích để tách bean và trì hoãn xử lý bên trong JVM, nhưng việc callback được submit chưa phải bằng chứng message đã được lưu hoặc side effect đã hoàn tất. Bài phân loại lỗi khi queue trong RAM bị mất, executor rejection, listener thất bại, JVM crash sau commit, broker ACK bị mất và consumer xử lý lại event.

      Từ đó người học thiết kế transactional outbox hoặc event publication registry bền vững, relay chỉ đánh dấu SENT sau producer confirmation, và consumer idempotent theo `eventId`. Bài cũng so sánh Spring Modulith publication registry, broker được cấu hình độ bền, backpressure, DLQ và monitoring end-to-end.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Local event và durability

      1. `ApplicationEventPublisher.publishEvent()` cam kết điều gì, và tại sao `@EventListener` thông thường khác `@Async @EventListener` về thread thực thi?
      2. Vì sao executor queue lớn hoặc listener `AFTER_COMMIT` không đủ giúp event tồn tại khi JVM chết giữa DB commit và dispatch?
      3. Khi nào local best-effort event chấp nhận được, và khi nào business event cần outbox/registry/broker có persistence?
      4. Spring Modulith event publication registry bổ sung điều gì so với Spring Framework core và cần cấu hình recovery nào?

      ### Outbox, broker và duplicate

      1. Outbox record và domain data phải được ghi trong cùng transaction để tránh dual-write gap như thế nào?
      2. Vì sao relay phải nhận broker confirm trước khi đánh dấu SENT; nếu chết sau publish nhưng trước mark-SENT sẽ xảy ra gì?
      3. Consumer nhận lại một event sau khi DB side effect đã commit nhưng trước ACK phải dùng dedupe/transaction ra sao?
      4. Độ bền broker phụ thuộc queue persistence, acknowledgement, retention và replication khác nhau thế nào?

      ### Quan sát và xử lý lỗi

      1. Khi executor hoặc broker quá tải, backpressure/retry/DLQ nên được thiết kế theo tín hiệu nào?
      2. Những metric nào phân biệt event đã publish, outbox backlog, broker ACK và business side effect đã hoàn tất?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân biệt cơ chế event | So sánh local synchronous, async event, transactional event và durable outbox theo failure window và cam kết. |
      | Thiết kế outbox relay | Vẽ luồng domain transaction → outbox → broker confirm → consumer ACK có retry/lease đúng điểm. |
      | Ngăn duplicate side effect | Đề xuất eventId ổn định, unique processed-events marker và idempotency cho DB/external API. |
      | Kiểm thử crash/recovery | Xây matrix các cửa sổ lỗi (trước listener, sau broker send, trước ACK), dự đoán trạng thái và cách replay. |
      | Định nghĩa monitoring đáng tin | Chọn số outbox pending, oldest age, retry, DLQ, consumer lag và độ trễ đến side effect cuối. |
  - slug: transactions-events-008
    title: Không giả định hai tác vụ trên hai luồng có thể rollback cùng nhau
    status: WRITTEN
    difficult: ADVANCED
    focus: Đánh giá atomicity nhiều giao dịch.
    problemSolved: Đợi Future rồi tưởng rollback toàn cục.
    mechanism: Future, local transaction, saga. ThreadLocal audit, JDBC orphan và compensation.
    applicationValue: Không hứa all-or-nothing xuyên worker. Test T1/T2 rollback riêng, idempotency.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Không giả định hai tác vụ trên hai luồng có thể rollback cùng nhau**

      Hai phương thức được gắn `@Transactional` không tự dùng chung transaction khi chúng chạy trên hai thread. Nếu worker T2 đã commit audit/shipping còn caller T1 rollback, side effect của T2 không bị hoàn tác; `CompletableFuture.allOf().join()` chỉ đợi completion chứ không hợp nhất commit. Bài trình bày mô phỏng `ThreadLocal` Java 17 và anti-pattern Spring JDBC về audit mồ côi để kiểm chứng hệ quả.

      Người học xác định khi nào phải ghi hai bảng trong **một transaction đồng bộ**, khi nào nên phát event sau commit và dùng outbox, và khi workflow phân tán phải chấp nhận eventual consistency, saga/compensation và idempotency. Bài cũng nhấn mạnh XA/JTA chỉ là một kiến trúc coordinator riêng, không tự xuất hiện từ annotation.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hai ranh giới commit và lỗi rollback chung

      1. Vì sao `@Transactional` trên caller T1 và worker T2 không tạo một transaction ACID chung chỉ vì dùng cùng DataSource?
      2. Trong Java `ThreadLocal` demo, điều gì chứng minh worker không thừa hưởng transaction nhưng đã commit audit khi caller rollback?
      3. Nếu `CompletableFuture.allOf(f1,f2).join()` ném lỗi sau khi f1 commit, thao tác nào có thể rollback và thao tác nào không?
      4. `Propagation.REQUIRED`, `REQUIRES_NEW`, `NESTED` và ngoại lệ self-invocation ảnh hưởng kết luận rollback như thế nào?

      ### Lựa chọn local atomicity hoặc phối hợp phân tán

      1. Khi ghi order và audit phải cùng thành công hoặc thất bại, tại sao một method transactional cùng thread là phương án phù hợp?
      2. Listener `AFTER_COMMIT` giải quyết quan hệ với commit gốc nhưng không bảo đảm durable job bằng cách nào?
      3. Outbox giải quyết tính atomic của event intent và domain data ra sao, và vì sao cần consumer idempotent?
      4. Saga compensation khác rollback DB vật lý ở đâu, và khi nào JTA/XA mới là phương án cần phân tích riêng?

      ### Kiểm tra thực tế

      1. Vì sao foreign key có thể làm worker bị chặn hoặc ném lỗi mà vẫn không tạo transaction chung?
      2. Nên kiểm thử bốn kết cục T1/T2 commit/rollback cùng các trạng thái failure sau HTTP 202 bằng cách nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện rollback độc lập | Vẽ hai transaction trên hai thread và phân tích trạng thái còn lại khi T1 rollback, T2 commit. |
      | Phân biệt Future với commit | Chỉ ra `join()`, cancellation, timeout và lỗi Future không đảo ngược database commit đã hoàn tất. |
      | Thiết kế local atomic transaction | Giữ các ghi cần all-or-nothing trong cùng transaction/resource, tránh truyền Connection/EntityManager qua worker. |
      | Chọn orchestration sau commit | Đề xuất outbox, idempotency và trạng thái job bền vững cho workflow nhiều bước. |
      | Giải thích compensation | Mô tả saga với các hành động bù trừ và giới hạn so với rollback vật lý hoặc XA/JTA. |
- slug: task-scheduler
  title: TaskScheduler
  childs:
  - slug: task-scheduler-001
    title: TaskScheduler biểu diễn lập lịch tách khỏi môi trường thực thi
    status: WRITTEN
    difficult: BASIC
    focus: Hợp đồng lịch vs thực thi.
    problemSolved: Tưởng scheduler tự tách worker.
    mechanism: TaskScheduler, Trigger. Instant / Duration / Trigger. Backend quyết định worker.
    applicationValue: Mô tả đúng đường scheduling.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **TaskScheduler biểu diễn lập lịch tách khỏi môi trường thực thi**

      `TaskScheduler` cung cấp hợp đồng lập lịch độc lập với loại backend và cách quản lý worker. Bài học này xây nền tảng để phân biệt thời điểm kích hoạt với nơi thực thi `Runnable`, dùng đúng `Instant`, `Duration` và `Trigger`, đồng thời nhận diện giới hạn của lịch chỉ nằm trong JVM và nguy cơ callback giữ scheduler thread quá lâu.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng lập lịch và thực thi

      1. `TaskScheduler` khác `TaskExecutor` ở câu hỏi cốt lõi nào và vì sao một interface lập lịch không cam kết có một worker pool thứ hai?
      2. Với `ThreadPoolTaskScheduler`, callback thực sự chạy trên loại thread nào và vì sao callback I/O chậm có thể gây trễ cho lịch khác?
      3. Phân biệt vai trò `ThreadPoolTaskScheduler`, `ConcurrentTaskScheduler` và `DefaultManagedTaskScheduler` theo nguồn backend và quyền sở hữu thế nào?

      ### Mốc thời gian và kiểu lịch

      1. Khi nào dùng `schedule(Runnable, Instant)`, `scheduleAtFixedRate`, `scheduleWithFixedDelay` hay `schedule(Runnable, Trigger)`?
      2. Trong `TriggerContext`, `lastScheduledExecution`, `lastActualExecution` và `lastCompletion` biểu diễn những mốc nào?
      3. Vì sao cron theo 09:00 địa phương không thể luôn thay bằng chu kỳ `Duration.ofHours(24)`?

      ### Lỗi, giám sát và vòng đời

      1. Một `ScheduledFuture` periodic khác handle one-shot ở cách kiểm tra hoàn tất như thế nào?
      2. Vì sao ba replica có thể kích hoạt cùng một lịch và cần thêm cơ chế nào nếu side effect không được trùng?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân tách hai trách nhiệm | Vẽ đường đi `TaskScheduler → backend → Runnable` và chỉ ra ranh giới lập lịch so với thực thi. |
      | Lựa chọn chữ ký API | Ánh xạ yêu cầu one-shot, fixed-rate, fixed-delay và cron sang đúng phương thức `TaskScheduler`. |
      | Phân tích context của Trigger | Giải thích đúng planned, actual và completion khi scheduler chạy muộn. |
      | Chẩn đoán scheduler thread | Dự đoán ảnh hưởng của callback blocking tới lịch khác trên pool một worker. |
      | Nhận diện giới hạn vận hành | Nêu chính sách cho lỗi, cancel, timezone, multi-replica và lịch cần khôi phục sau restart. |
  - slug: task-scheduler-002
    title: schedule() để chạy một lần tại thời điểm chỉ định
    status: WRITTEN
    difficult: BASIC
    focus: Một lần theo Instant.
    problemSolved: Nhầm LocalDateTime hoặc tưởng durable.
    mechanism: schedule(Runnable, Instant). Thời điểm tuyệt đối. Thực thi one-shot đúng hạn khả thi.
    applicationValue: One-shot Future hoàn tất/hủy.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **schedule() để chạy một lần tại thời điểm chỉ định**

      `TaskScheduler.schedule(Runnable, Instant)` tạo một lịch one-shot theo thời điểm tuyệt đối và trả handle để quan sát/hủy. Bài giúp người học chuyển giờ địa phương thành `Instant` đúng múi giờ, hiểu ý nghĩa mốc đã quá khứ và độ trễ thực thi, đồng thời quản lý lỗi, cancellation và persistence của từng reminder hay deadline.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Đăng ký một lần và mốc thời gian

      1. `schedule(Runnable, Instant)` khác lịch periodic ở số lần callback được lập lịch như thế nào?
      2. Nếu `Instant` đã thuộc quá khứ, scheduler sẽ xử lý ra sao và nghiệp vụ có thể áp chính sách bổ sung nào?
      3. Muốn chạy lúc 09:00 tại Việt Nam, vì sao phải ghép `LocalDateTime` với `ZoneId` trước khi tạo `Instant`?

      ### Handle, lỗi và cancellation

      1. Vì sao `ScheduledFuture.getDelay()` không chứng minh one-shot đã bắt đầu hoặc hoàn tất?
      2. Phân biệt rejection khi đăng ký lịch với exception bên trong `Runnable`, và nhận biết chúng qua đường nào?
      3. Vì sao `cancel(false)` không có nghĩa callback đang chạy đã dừng hoặc giao dịch xa đã rollback?

      ### Độ tin cậy và kiểm thử

      1. Khi nào một lịch một lần trong RAM sẽ bị mất sau restart hoặc bị tạo nhiều bản trên các replica?
      2. Cách dùng `Future.get(timeout)` và hủy lịch cách xa tương lai giúp kiểm thử one-shot xác định như thế nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Tạo lịch one-shot | Viết lời gọi `schedule(task, Instant)` và xác định kết quả là handle, không phải kết quả nghiệp vụ. |
      | Xử lý múi giờ | Chuyển một local date/time kèm `ZoneId` thành `Instant` và nhận biết DST gap/overlap. |
      | Quan sát trạng thái | Phân biệt waiting, running, succeeded, failed và cancelled qua Future và business status. |
      | Kiểm chứng bằng code | Dùng one-shot `get(timeout)` và test cancel-before-start mà không phụ thuộc `Thread.sleep`. |
      | Thiết kế persistence | Xác định khi nào cần job ID, trạng thái bền vững, idempotency và cluster claim. |
  - slug: task-scheduler-003
    title: scheduleAtFixedRate() và lịch theo chu kỳ
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Nhịp fixed-rate.
    problemSolved: Nhầm fixed-rate luôn overlap.
    mechanism: scheduleAtFixedRate. Start time + period. Nhịp định kỳ, không hard real-time.
    applicationValue: Vẽ planned và actual cadence.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **scheduleAtFixedRate() và lịch theo chu kỳ**

      Fixed-rate xác định nhịp dự kiến từ thời điểm bắt đầu và `Duration period`, nên các lượt có thể chạy sát nhau khi tác vụ chậm. Bài này giúp phân tích đúng sự khác biệt giữa planned và actual start, thiết kế periodic jobs không vô tình overlap khi có delegation, và kiểm soát lỗi, cancellation, tải nền trong Spring.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Mốc fixed-rate và overload

      1. Với period 5 giây và task mất 8 giây, mốc dự kiến với thời gian bắt đầu thực tế khác nhau thế nào?
      2. Vì sao một periodic registration trên `ScheduledThreadPoolExecutor` không overlap chính nó dù có nhiều worker?
      3. Lúc nào dùng overload có `Instant startTime`, và overload chỉ nhận `Duration` bắt đầu lượt đầu khi nào?

      ### So sánh các chiến lược

      1. Với task mất 3 giây, fixed-rate 5 giây và fixed-delay 5 giây dẫn đến các mốc thực thi khác nhau ra sao?
      2. Vì sao fixed-rate 24 giờ không bảo đảm lịch hàng ngày tại cùng giờ địa phương khi có DST?
      3. Nếu mỗi tick chỉ gọi một service `@Async` rồi trả về, business jobs có còn được bảo đảm không overlap không?

      ### Trạng thái, lỗi và metrics

      1. Vì sao không được dùng `ScheduledFuture.get()` như kết quả một tick của lịch lặp?
      2. Một unchecked exception trong periodic JDK task khác ErrorHandler mặc định của Spring `ThreadPoolTaskScheduler` thế nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Mô phỏng nhịp thời gian | Vẽ nominal start times và actual starts của fixed-rate khi một run dài hơn period. |
      | Chọn overload | Cấu hình `Duration` dương và `Instant` startTime phù hợp với initial delay. |
      | Giới hạn overlap | Chứng minh same-handle JDK không overlap và xác định nguồn overlap do delegation, registration khác hay replicas. |
      | Quản lý lỗi và hủy | Dùng `ScheduledFuture.cancel` đúng ý nghĩa, phân biệt lỗi một run với trạng thái cả chuỗi. |
      | Thiết kế observability | Đề xuất metric tick, run success/failure, duration và start lag để kiểm tra tải thật. |
  - slug: task-scheduler-004
    title: scheduleWithFixedDelay() và khoảng nghỉ sau khi hoàn tất
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Nghỉ sau completion.
    problemSolved: Nhầm delegate completion là job completion.
    mechanism: scheduleWithFixedDelay. Completion + delay. Delay phụ thuộc callback completion.
    applicationValue: Đo delay với latch.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **scheduleWithFixedDelay() và khoảng nghỉ sau khi hoàn tất**

      Fixed-delay đặt thời gian nghỉ sau khi callback trước kết thúc, phù hợp polling khi muốn tránh chạy dồn. Bài giúp người học tính thời điểm bắt đầu lượt kế theo thời gian xử lý thực tế, phân biệt completion của callback với completion của job được giao sang executor khác, và tránh treo lịch vì I/O không có timeout.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Thời điểm tính delay

      1. Vì sao task chạy 7 giây với delay 5 giây khiến hai mốc bắt đầu cách nhau ít nhất khoảng 12 giây?
      2. Overload `scheduleWithFixedDelay(Runnable, Duration)` kích hoạt lượt đầu khi nào so với overload có `Instant`?
      3. Fixed-delay khác fixed-rate, cron và một cơ chế throttle sự kiện ở điểm nào?

      ### Ranh giới hoàn tất và overlap

      1. Nếu Runnable chỉ gửi `CompletableFuture` sang worker rồi trả về, delay được tính từ lúc nào?
      2. Vì sao một registration fixed-delay không overlap callback nhưng nhiều pod hay nhiều registrations vẫn có thể overlap nghiệp vụ?
      3. Với `SimpleAsyncTaskScheduler` dùng virtual threads, fixed-delay có đặc điểm thread nào cần tránh nhầm với các loại lịch khác?

      ### Thất bại và kiểm chứng

      1. Vì sao một API call treo vô hạn có thể khiến fixed-delay không tạo lượt tiếp theo?
      2. Dùng latch và `System.nanoTime()` thế nào để xác nhận delay được tính sau khi run trước hoàn tất?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Diễn giải fixed-delay | Tính earliest next start từ mốc completion và delay, phân biệt với fixed-rate. |
      | Cấu hình đúng lần đầu | Sử dụng `Duration` và `Instant startTime` đúng với yêu cầu bắt đầu. |
      | Phát hiện overlap sai nghĩa | Phân biệt thời điểm callback trả về với khi business Future thật sự xong. |
      | Bảo vệ vòng đời polling | Thiết kế timeout, failure policy, checkpoint và cancellation để không giữ một suất mãi. |
      | Tạo kiểm thử deterministic | Dùng latch làm rõ mốc kết thúc của lượt đầu và xác minh ngưỡng nghỉ cho lượt thứ hai. |
  - slug: task-scheduler-005
    title: ScheduledFuture để theo dõi và hủy lịch
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Handle và cancellation.
    problemSolved: Gọi periodic get như tick result.
    mechanism: ScheduledFuture. Delay còn lại / trạng thái Future. Cancel không kill business effect.
    applicationValue: Đọc trạng thái cancel và per-run result.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **ScheduledFuture để theo dõi và hủy lịch**

      `ScheduledFuture` là handle kiểm soát một lịch trong JVM, không phải trạng thái bền vững của nghiệp vụ. Bài này giúp hiểu rõ `getDelay`, `isDone`, `isCancelled`, `get` và `cancel(false/true)` cho one-shot và periodic, tránh nhầm hủy lịch với dừng worker hoặc rollback side effect, đồng thời tổ chức registry và shutdown an toàn.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Future của một lần và cả chuỗi

      1. Vì sao `isDone()==false` vẫn có thể đúng sau hàng chục lần periodic task hoàn tất thành công?
      2. Khác biệt giữa `get()` của one-shot và periodic `ScheduledFuture` là gì, và vì sao `get()` của periodic có thể chờ mãi?
      3. Khi nào `schedule(Runnable, Trigger)` có thể trả `null` và phải xử lý ra sao?

      ### Hủy và theo dõi tác vụ

      1. Điều gì khác nhau giữa `cancel(false)` và `cancel(true)` khi một callback đã bắt đầu?
      2. Vì sao `isCancelled()==true` hoặc `isDone()==true` không đủ để kết luận nghiệp vụ thành công hay I/O đã dừng?
      3. Khi `TaskUtils` suppress exception trong repeating job, cần quan sát thất bại của từng lượt bằng cơ chế nào?

      ### Vòng đời và registry

      1. Làm thế nào giữ và thay handle theo job ID trong một JVM mà không đăng ký trùng không kiểm soát?
      2. Vì sao hủy một ScheduledFuture khác với shutdown cả scheduler và khác với hủy ở tất cả replica?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Giải thích trạng thái Future | Lập bảng isDone/isCancelled cho waiting, success, failure và cancellation của one-shot/periodic. |
      | Hủy đúng ngữ nghĩa | Chọn cancel(false/true) theo khả năng interrupt và giải thích phần side effect vẫn có thể tồn tại. |
      | Quan sát một lượt chạy | Thiết kế per-run status/metric thay vì lấy kết quả của cả periodic Future. |
      | Quản lý handle | Tổ chức registry theo business ID, chống race replace/cancel và dọn handle không còn dùng. |
      | Kiểm thử graceful stop | Dùng latch tách thời điểm Future đã hủy khỏi thời điểm worker thật sự thoát. |
  - slug: task-scheduler-006
    title: Clock của scheduler và ý nghĩa thời gian sử dụng
    status: WRITTEN
    difficult: ADVANCED
    focus: Clock, timezone, TriggerContext.
    problemSolved: DST sai giờ, fake clock sai mục tiêu.
    mechanism: Clock, CronTrigger. Instant, zone, monotonic elapsed. Clock không advance executor queue.
    applicationValue: Cron fixed clock tạo Instant mong đợi.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Clock của scheduler và ý nghĩa thời gian sử dụng**

      Bài tập trung vào cách Spring tính lịch bằng `Clock` và `TriggerContext`, phân biệt `Instant`, `Duration`, `LocalDateTime`, `ZoneId` và đồng hồ đo elapsed time. Người học học cách kiểm chứng cron với fixed clock, tránh lệch giờ do timezone/DST và hiểu vì sao thay `Clock` không tạo một virtual-time scheduler có khả năng điều khiển queue thực.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Nguồn thời gian và kiểu dữ liệu

      1. `TaskScheduler.getClock()`/`ThreadPoolTaskScheduler.setClock()` có vai trò gì và không kiểm soát được điều gì?
      2. Phân biệt `Instant`, `Duration`, `LocalDateTime`, `ZonedDateTime`, `ZoneId` và `System.nanoTime()` khi lập lịch hoặc đo duration?
      3. Vì sao `Clock.withZone(UTC)` không tự dịch chuyển `Instant` của một `Clock.fixed`?

      ### Cron, TriggerContext và timezone

      1. `lastScheduledExecution`, `lastActualExecution` và `lastCompletion` khác nhau thế nào khi callback bị trễ?
      2. Cùng biểu thức cron 09:00, một `CronTrigger` dùng zone UTC và một trigger dùng `Asia/Ho_Chi_Minh` tạo ra `Instant` khác thế nào?
      3. Vì sao lịch có DST gap/overlap cần chính sách nghiệp vụ và idempotency theo business date?

      ### Kiểm thử và giới hạn

      1. Dùng `SimpleTriggerContext(Clock.fixed(...))` kiểm chứng thời điểm kế tiếp mà không mở worker thật ra sao?
      2. Tại sao tạo `Clock.offset` mới không tự làm delayed queue của `ThreadPoolTaskScheduler` chạy một giờ tương lai?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Chọn kiểu thời gian | Lựa chọn Instant/Duration/ZoneId phù hợp với mốc tuyệt đối, chu kỳ và lịch dân sự. |
      | Kiểm chứng timezone | Chuyển local 09:00 HCM sang UTC và so sánh cron có zone tường minh với zone mặc định. |
      | Đọc TriggerContext | Phân biệt scheduled, actual, completion và dự đoán lịch tiếp theo của trigger lenient/fixed. |
      | Test bằng clock giả | Viết test `CronTrigger.nextExecution` với `Clock.fixed`, tách khỏi test thực thi bằng worker. |
      | Tránh lỗi clock và metrics | Dùng monotonic time cho elapsed duration, giải thích DST, time shift và giới hạn không real-time. |
  - slug: task-scheduler-007
    title: Phân biệt luồng kích hoạt lịch với luồng thực thi công việc
    status: WRITTEN
    difficult: ADVANCED
    focus: Scheduler callback vs worker job.
    problemSolved: CallerRuns block scheduler, overlap job.
    mechanism: TaskScheduler + TaskExecutor. Trigger lag + queue wait. Hai pool, hai queue, hai Future.
    applicationValue: Tách metric trigger và worker.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phân biệt luồng kích hoạt lịch với luồng thực thi công việc**

      `ThreadPoolTaskScheduler` thường chạy callback trên chính scheduler threads; tách xử lý nghiệp vụ sang `TaskExecutor` chỉ xảy ra khi kiến trúc chủ động delegate. Bài giúp người học thiết kế hai pool có giới hạn, đo riêng trigger lag với worker queue wait, kiểm soát overlap, rejection và shutdown mà không suy rằng callback hoàn tất là job đã xong.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Ranh giới thread và callback

      1. Vì sao `ThreadPoolTaskScheduler` poolSize=1 có thể làm trễ job B khi callback A đang chặn I/O?
      2. Trong mô hình scheduler callback gọi `TaskExecutor.execute(...)`, Future của scheduler biểu diễn completion của phần nào?
      3. Tăng scheduler poolSize khác với thêm một bounded worker pool về trách nhiệm và tài nguyên như thế nào?

      ### Backpressure và overlap

      1. Vì sao fixed-delay của callback delegate không bảo đảm khoảng nghỉ sau khi business job hoàn tất?
      2. Khi worker pool dùng `CallerRunsPolicy`, điều gì có thể xảy ra với scheduler thread lúc executor bão hòa?
      3. Một `AtomicBoolean` single-flight guard chống overlap ở phạm vi nào và vì sao vẫn cần chính sách rejection rõ?

      ### Observability, context và lifecycle

      1. Phân biệt scheduling lag, dispatch latency, worker queue wait và business execution duration như thế nào?
      2. Khi tắt hai pool, nên ngăn các callback mới và xử lý các job đã submit theo trình tự nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Mô hình hóa hai pool | Vẽ đường từ trigger tới callback, queue worker và business completion. |
      | Ngăn business overlap | Thiết kế single-flight guard an toàn với finally và nhánh submit bị rejection. |
      | Phân tích overload | Giải thích hậu quả của AbortPolicy, CallerRunsPolicy và DiscardPolicy với scheduler callback. |
      | Đo lường đúng tầng | Thiết kế metric riêng cho trigger lag, callback duration, queue wait, job result và cancellation. |
      | Quản lý context và shutdown | Phân biệt Future scheduler với Future worker, xác định propagation và thứ tự stop/drain. |
  - slug: task-scheduler-008
    title: Chọn lập lịch trực tiếp hay annotation theo mức cần điều khiển
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Annotation vs dynamic API.
    problemSolved: Tưởng property hot-reload hoặc direct tạo durability.
    mechanism: '@Scheduled / Schedule API. Property / trigger / runtime start-stop. Ai đăng ký, ai giữ handle và sửa lịch.'
    applicationValue: Chọn annotation hay programmatic từ tình huống.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Chọn lập lịch trực tiếp hay annotation theo mức cần điều khiển**

      Cả `@Scheduled` và API `TaskScheduler` có thể dùng cùng scheduler nhưng cho mức điều khiển khác nhau. Bài hướng tới quyết định theo yêu cầu nghiệp vụ: lịch cấu hình cố định dùng annotation; lịch có job ID, start/replace/cancel động cần quản lý handle bằng code hoặc job store. Bài cũng nêu rủi ro property không hot reload, nhiều replica và tính bền vững sau restart.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Khi nào dùng cách nào

      1. Những dấu hiệu nào cho thấy `@Scheduled` phù hợp hơn lập lịch bằng code trực tiếp?
      2. Khi mỗi khách hàng có một job ID và có thể thay đổi/hủy lịch lúc runtime, vì sao `TaskScheduler` programmatic thuận tiện hơn?
      3. Vì sao annotation và direct scheduling không mặc nhiên khác nhau về backend, tốc độ hoặc tính bền vững?

      ### Cấu hình và điều khiển runtime

      1. Vai trò của `@EnableScheduling` đối với annotated methods khác lời gọi `TaskScheduler.schedule(...)` trực tiếp như thế nào?
      2. Vì sao sửa property cron trên runtime không tự bảo đảm một method `@Scheduled` được reschedule ngay?
      3. Một dynamic registry hủy và đăng ký lại handle có thể gặp race/overlap nào?

      ### Quá tải, vận hành và độ tin cậy

      1. Tại sao thay annotation bằng direct API không tự sửa scheduler saturation, lỗi task hoặc queue không giới hạn?
      2. Khi nào một lịch cần job store, idempotency và cluster coordination dù nó được khai báo bằng cách nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Chọn abstraction theo yêu cầu | Lập ma trận `@Scheduled` so với direct API dựa trên tính ổn định của lịch, ID và quyền cancel. |
      | Cấu hình annotation | Viết annotation cron/fixed-delay với zone hoặc property và giải thích yêu cầu `@EnableScheduling`. |
      | Điều khiển lịch động | Thiết kế start/replace/stop theo job ID với ScheduledFuture và quản lý race. |
      | Phân biệt lifecycle | Giải thích giới hạn của registry in-memory đối với restart và nhiều instance. |
      | Đánh giá vận hành | Đề xuất test wiring, cancellation, overload, timezone và job durability tương ứng từng cách. |
- slug: scheduler-selection
  title: Chọn scheduler
  childs:
  - slug: scheduler-selection-001
    title: ThreadPoolTaskScheduler dựa trên ScheduledExecutorService
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: ThreadPoolTaskScheduler dựa trên ScheduledExecutorService.
    problemSolved: Lập lịch JDK qua Spring và callback ở đâu. In-memory scheduler không phải durable queue.
    mechanism: ThreadPoolTaskScheduler, ScheduledThreadPoolExecutor. ScheduledFuture, native pool và error policy.
    applicationValue: Chọn scheduler có API và lifecycle rõ ràng. Kiến trúc wrapper và hợp đồng lịch.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **ThreadPoolTaskScheduler dựa trên ScheduledExecutorService**

      Lựa chọn `ThreadPoolTaskScheduler` chỉ đúng khi hiểu nó triển khai `TaskScheduler` trên `ScheduledThreadPoolExecutor` và thực thi callback ngay trên scheduler worker. Bài học cung cấp kiến trúc, API hẹn một lần/định kỳ/trigger, cơ chế lỗi, cancellation và lifecycle để lập lịch có thể quan sát và không đánh đồng với một worker pool độc lập.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Cấu trúc scheduler và các kiểu lịch

      1. `ThreadPoolTaskScheduler`, `TaskScheduler`, `ScheduledExecutorService` và `ScheduledThreadPoolExecutor` liên hệ với nhau như thế nào?
      2. Vì sao một callback blocking có thể làm trễ lịch khác dù thời điểm kích hoạt đã tới?
      3. Các API `schedule`, `scheduleAtFixedRate`, `scheduleWithFixedDelay` và `CronTrigger` xác định mốc chạy kế tiếp khác nhau ra sao?

      ### Future, lỗi và vận hành

      1. `ScheduledFuture` của one-shot khác handle của lịch lặp ở khả năng dùng `get()` như thế nào?
      2. Vì sao một lỗi trong periodic Runnable thuần JDK có thể dừng các lượt tiếp theo nhưng Spring `ErrorHandler` lại có thể cho lịch tiếp tục?
      3. Khi cấu hình pool size, shutdown và remove-on-cancel, cần quan sát những giới hạn nào về thread, delayed queue và độ bền lịch?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Đọc kiến trúc scheduling | Vẽ đường đi Spring TaskScheduler tới ScheduledThreadPoolExecutor và chỉ ra thread chạy Runnable. |
      | Lựa chọn loại lịch | Giải thích và viết lịch một lần, fixed rate, fixed delay hoặc cron theo mục đích nghiệp vụ. |
      | Kiểm chứng scheduler | Dùng ScheduledFuture và CountDownLatch quan sát callback đã chạy, không nhầm với lần lặp tiếp theo. |
      | Thiết kế lỗi và vòng đời | So sánh xử lý exception của JDK/Spring và chọn error handler, hủy, shutdown có kiểm soát. |
  - slug: scheduler-selection-002
    title: poolSize mặc định và ảnh hưởng của công việc chạy lâu
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: poolSize mặc định và ảnh hưởng của công việc chạy lâu.
    problemSolved: Một job dài giữ bao nhiêu scheduler workers. Tăng pool không tối ưu downstream vô hạn.
    mechanism: setPoolSize, fixedDelay/fixedRate/cron, metrics. Latches so sánh pool=1 và pool=2.
    applicationValue: Giảm trễ các job độc lập. Resource sizing và scheduler starvation.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **poolSize mặc định và ảnh hưởng của công việc chạy lâu**

      `poolSize=1` là cấu hình mặc định của `ThreadPoolTaskScheduler`, nhưng scheduler được Spring chọn trong từng môi trường có thể khác. Bài học phân tích hiện tượng job dài giữ scheduler worker, đo scheduling delay và quyết định khi nào tăng pool, tách lịch quan trọng hoặc offload sang executor để giảm ảnh hưởng giữa các công việc.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Mặc định và phân tích nghẽn

      1. `poolSize` mặc định bằng bao nhiêu đối với `ThreadPoolTaskScheduler`, và vì sao không được áp giá trị này cho mọi scheduler của Spring Boot hoặc Jakarta EE?
      2. Khi job A chiếm scheduler một thread, job B đến hạn bị trễ theo cơ chế nào, và dữ liệu nào chứng minh đây là scheduler starvation?
      3. `fixedDelay`, `fixedRate` và cron phản ứng khác nhau ra sao khi runtime dài hơn khoảng lịch?

      ### Cấu hình và điều chỉnh dựa trên dữ liệu

      1. Tại sao `spring.task.scheduling.pool.size` có thể không tác động lên bean scheduler tự định nghĩa hoặc khi Boot dùng virtual threads?
      2. Trong demo so sánh pool 1 và pool 2 bằng latch, điều gì chứng minh task nhanh có thể bắt đầu trong lúc task chậm còn bị chặn?
      3. Khi nào tăng `poolSize`, tách scheduler, hoặc chuyển job nặng sang `TaskExecutor`, và cần kiểm soát overlap/backpressure gì?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Giải thích pool mặc định | Phân biệt cấu hình bean Spring, fallback `@EnableScheduling` và scheduler do Boot auto-configure. |
      | Tái hiện starvation | Dùng latch giữ một callback, theo dõi callback thứ hai ở pool 1 so với pool 2. |
      | Chẩn đoán schedule lateness | Đề xuất phép đo thời điểm dự kiến, actual start, runtime và resource contention. |
      | Chọn chiến lược sizing | Lập quyết định tăng pool hoặc cô lập job dựa vào CPU, I/O, tần suất và SLO. |
  - slug: scheduler-selection-003
    title: Công việc thông thường chạy trên luồng của ThreadPoolTaskScheduler
    status: WRITTEN
    difficult: BASIC
    focus: Công việc thông thường chạy trên luồng của ThreadPoolTaskScheduler.
    problemSolved: Callback chạy trên chính scheduler thread. ScheduledFuture không theo dõi child task.
    mechanism: TaskScheduler, ScheduledFuture, @Scheduled. Hai callbacks tranh một scheduler worker.
    applicationValue: Không nhầm scheduling với offload mặc định. Execution boundary và đơn vị được theo dõi.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Công việc thông thường chạy trên luồng của ThreadPoolTaskScheduler**

      Với `ThreadPoolTaskScheduler`, một callback đồng bộ thông thường được chạy trên chính scheduler thread. Bài này làm rõ vị trí thực thi thay vì chỉ bàn về số worker: từ API `TaskScheduler` tới `@Scheduled`, `ScheduledFuture` và thí nghiệm hai task tranh cùng một thread, để tránh tưởng rằng scheduler tự offload công việc nặng.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Luồng thực thi và ScheduledFuture

      1. Vì sao `ThreadPoolTaskScheduler` không tự chuyển thân `Runnable` sang một `ThreadPoolTaskExecutor` khác?
      2. Khi `poolSize=1`, task B đến hạn trong lúc task A chặn worker sẽ diễn ra thế nào?
      3. `ScheduledFuture.get(timeout)` của one-shot xác nhận điều gì, và vì sao không dùng nó để chờ một lần tick của periodic schedule?

      ### Tích hợp và giới hạn

      1. Trong Spring, `@EnableScheduling` và `@EnableAsync` khác nhau ở hạ tầng nào được bật?
      2. Làm thế nào sử dụng latch và tên thread có prefix để kiểm tra hai callback dùng một scheduler worker?
      3. Nếu callback chỉ `execute` một job khác rồi return, việc hoàn tất callback khác hoàn tất nghiệp vụ ở điểm nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Xác định thread chạy | Vẽ execution path của ThreadPoolTaskScheduler và nhận diện worker giữ callback. |
      | Kiểm thử pool một thread | Giữ task đầu bằng CountDownLatch, chứng minh task hai không chạy trước khi release rồi hoàn tất đúng. |
      | Dùng handle đúng | Phân biệt `get` của one-shot và trạng thái của một ScheduledFuture định kỳ. |
      | Thiết kế offload | Chỉ rõ khi nào cần submit sang TaskExecutor và cách theo dõi task nghiệp vụ được bàn giao. |
  - slug: scheduler-selection-004
    title: ConcurrentTaskScheduler thích nghi bộ lập lịch JDK
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: ConcurrentTaskScheduler thích nghi bộ lập lịch JDK.
    problemSolved: Tái sử dụng ScheduledExecutorService JDK. Adapter không tự tạo concurrency.
    mechanism: ConcurrentTaskScheduler, Trigger, delegate. Spring bean bọc JDK executor và CronTrigger.
    applicationValue: Tích hợp backend JDK đang có. Adapter pattern và ownership.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **ConcurrentTaskScheduler thích nghi bộ lập lịch JDK**

      Khi đã có một `ScheduledExecutorService` JDK, `ConcurrentTaskScheduler` cho phép sử dụng nó qua API Spring `TaskScheduler`, bao gồm `Instant`, `Duration` và `Trigger`. Bài này dành cho tình huống tích hợp scheduler sẵn có: phân biệt adapter với pool mới, chọn constructor/delegate đúng và làm rõ ai chịu trách nhiệm shutdown, error handling, cancellation.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Cơ chế adapter và delegate

      1. `ConcurrentTaskScheduler` chuyển lời gọi Spring `TaskScheduler` tới `ScheduledExecutorService` như thế nào?
      2. Constructor nhận một delegate khác constructor hai delegate ở đường `execute` và đường `schedule` ra sao?
      3. Vì sao tên `ConcurrentTaskScheduler` không bảo đảm có nhiều worker hay lịch bền vững?

      ### Trigger, cấu hình và vòng đời

      1. `schedule(Runnable, Trigger)` bổ sung khả năng gì mà JDK ScheduledExecutorService không cung cấp trực tiếp?
      2. Spring chọn bean scheduler nào cho `@Scheduled` khi có nhiều scheduler, và làm thế nào tránh đăng ký một lịch hai lần?
      3. Ai phải gọi `shutdown` khi backend do ứng dụng tạo, và vì sao không được tự đóng scheduler do container quản lý?
      4. Khác biệt nào giữa exception của periodic task thuần JDK và adapter có Spring error handler?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Ánh xạ API | Đối chiếu `schedule`/fixed rate/fixed delay của JDK với `TaskScheduler` Spring. |
      | Tạo adapter đúng ownership | Mô tả cấu hình JDK backend + ConcurrentTaskScheduler, dùng constructor và lifecycle tương ứng. |
      | Phân tích Trigger | Giải thích cách Spring tính và reschedule lần kích hoạt tiếp theo, gồm cron/zone. |
      | Kiểm tra lỗi và hủy | Xác minh ScheduledFuture, rejection và shutdown tại đúng delegate thay vì suy từ tên adapter. |
  - slug: scheduler-selection-005
    title: DefaultManagedTaskScheduler trong môi trường Jakarta EE
    status: WRITTEN
    difficult: ADVANCED
    focus: DefaultManagedTaskScheduler trong môi trường Jakarta EE.
    problemSolved: Managed scheduler trong Jakarta EE container. Managed không tự bảo đảm exactly-once.
    mechanism: DefaultManagedTaskScheduler, JNDI. Kiểm thử JNDI/server và resource type.
    applicationValue: Tuân ownership của Jakarta EE runtime. Container-managed resource và JNDI lookup.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **DefaultManagedTaskScheduler trong môi trường Jakarta EE**

      `DefaultManagedTaskScheduler` là lựa chọn chuyên biệt khi triển khai vào Jakarta EE application server có `ManagedScheduledExecutorService` qua JNDI. Bài học hướng dẫn phân định trách nhiệm Spring và container, kiểm tra resource và namespace Jakarta, cấu hình lịch cũng như kiểm thử thực trên server; nó không phải scheduler mặc định cho ứng dụng Spring Boot standalone.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Runtime và resource được quản lý

      1. Vì sao ứng dụng chạy trong Jakarta EE server có thể cần managed scheduler thay cho một thread pool tự tạo?
      2. `DefaultManagedTaskScheduler` tìm resource JNDI mặc định nào, và nó khác `DefaultManagedTaskExecutor` như thế nào?
      3. Spring 6 và namespace `jakarta.enterprise.concurrent` đặt ra yêu cầu tương thích gì với server còn dùng `javax`?

      ### Cấu hình và quản lý lifecycle

      1. Khi nào `afterPropertiesSet()` thực hiện lookup JNDI, và tại sao không gọi tay trong `@Bean` Spring-managed?
      2. Nếu server dùng tên JNDI tùy chỉnh, cần cấu hình `setJndiName` và chứng minh type resource được trả về ra sao?
      3. Ai sở hữu thread, context và quyền shutdown của ManagedScheduledExecutorService, và vì sao app không tự gọi shutdown?

      ### Kiểm chứng và giới hạn đảm bảo

      1. Vì sao một unit test chỉ dùng JDK ScheduledExecutorService không chứng minh integration của DefaultManagedTaskScheduler?
      2. Cần quan sát JNDI, naming/classloader/security context, lỗi và lịch kích hoạt nào trong integration test trên server thật?
      3. Vì sao managed scheduling vẫn không tự cung cấp durable execution hoặc chạy đúng một lần trên toàn cụm?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Chọn theo môi trường deploy | Phân biệt Jakarta managed scheduler với local ThreadPoolTaskScheduler bằng quyền sở hữu runtime. |
      | Cấu hình JNDI | Thiết kế bean TaskScheduler dùng tên mặc định hoặc resource riêng, phát hiện lỗi lookup. |
      | Lập kế hoạch integration test | Liệt kê bằng chứng resource type, context propagation, policy shutdown và lịch thực chạy trên server. |
      | Đánh giá độ bền | Phân biệt managed executor với job store/cluster coordination và nêu yêu cầu bổ sung cho retry/idempotency. |
