      ### Hai tầng task

      1. `@Async` proxy và `CompletableFuture.supplyAsync` tạo hai submission tại những điểm nào?
      2. Tại sao có hai task wrapper nhưng business method chỉ có thể chạy một lần?
      3. Ở Spring 6.x, vì sao việc interceptor chờ target Future bằng `get()` có thể giữ worker ngoài?

      ### Refactor an toàn

      1. Với một worker và queue, inner task cùng pool bị kẹt theo đồ thị chờ nào?
      2. Trong trường hợp nào nên giữ `@Async` với `completedFuture`, khi nào bỏ annotation và dùng `supplyAsync(..., executor)`?
      3. Nếu hai client đã trả Future, vì sao orchestrator chỉ cần `thenCombine` mà không tạo outer worker?

      ### Kiểm chứng production

      1. Bạn đếm submissions, business executions và outer/inner thread nào để phát hiện double scheduling?
      2. Vì sao timeout/cancel ở caller không bảo đảm giải phóng worker hoặc remote I/O bên trong?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Vẽ call graph dispatch | Chỉ rõ hai điểm submit và khả năng chờ Future ngầm trong Spring interceptor. |
      | Loại bỏ tầng thừa | Chọn một owner thực thi thay vì wrapper worker đợi inner worker. |
      | Phân biệt số lần chạy | Đo submissions và business side effects riêng bằng counting executor. |
      | Kiểm thử saturation | Tái hiện nguy cơ same-pool bằng executor nhỏ và timeout hữu hạn. |
  - slug: completable-future-composition-010
    title: Tránh chờ tác vụ con trên chính nhóm luồng đã cạn
    status: WRITTEN
    difficult: ADVANCED
    focus: Parent chờ child.
    problemSolved: Child thiếu worker. Wait hay compose.
    mechanism: Parent chờ child. Test pool nhỏ timeout.
    applicationValue: Future có thể kẹt.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Tránh chờ tác vụ con trên chính nhóm luồng đã cạn**

      Pool starvation deadlock xảy ra khi parent giữ mọi worker để chờ các child đang xếp hàng đợi chính worker ấy. Bài học phân tích quan hệ worker–queue–Future, sửa blocking bằng composition, và chẩn đoán trường hợp Spring @Async tạo chờ ngầm.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Đồ thị chờ

      1. Vì sao parent submit child vào pool một worker rồi gọi `get()` có thể không bao giờ tiến triển?
      2. Khi N parent giữ N worker chờ N child, tình huống khác CPU saturation và lock deadlock ra sao?
      3. Vì sao `maxPoolSize` cao vẫn vô ích nếu queue rộng nhận task trước khi mở worker mới?

      ### Sửa đúng cấu trúc

      1. `thenCompose` làm phẳng quan hệ child như thế nào để worker không phải `join()` chờ?
      2. Khi nào `allOf(...).thenApply` đọc các Future đã hoàn tất mà không gây worker starvation?
      3. Spring async interceptor có thể tạo điểm chờ ẩn nào nếu method `@Async` trả future con chạy cùng executor?

      ### Test và vận hành

      1. Bạn tái hiện starvation bằng pool nhỏ và timeout hữu hạn mà không làm suite treo ra sao?
      2. Thread dump và metric queue/active worker cần cho thấy những gì để xác định deadlock?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Vẽ dependency graph | Nêu chính xác chu trình parent chờ child và child chờ worker của parent. |
      | Hiểu cấu hình pool | Giải thích core, max, queue và rejection tác động đến tiến triển ra sao. |
      | Viết nonblocking chain | Sửa `thenApply(...join())` thành `thenCompose` phù hợp. |
      | Chẩn đoán và kiểm thử | Dùng deadline, latch, thread dump và executor metrics để chứng minh lỗi rồi kiểm tra cách sửa. |
- slug: exception-handling
  title: Xử lý ngoại lệ
  childs:
  - slug: exception-handling-001
    title: Ngoại lệ xảy ra khi gửi tác vụ khác với ngoại lệ trong lúc chạy
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Reject trước worker hay lỗi trong worker.
    problemSolved: Accepted nghĩa là succeeded.
    mechanism: TaskExecutor và rejection policy.
    applicationValue: Tạo rejection có latch và phân biệt failure. Executor bão hòa khi nhận request.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Ngoại lệ xảy ra khi gửi tác vụ khác với ngoại lệ trong lúc chạy**

      Bài học mở đầu phân biệt **submission failure** khi executor từ chối tác vụ với **execution failure** sau khi worker đã nhận việc. Việc xác định đúng thời điểm và API giúp đặt đúng `catch`, giữ nguyên thông tin lỗi và lựa chọn phản hồi nghiệp vụ đáng tin cậy.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Biên tiếp nhận công việc

      1. Với một pool giới hạn worker và queue, làm sao tạo tình huống `TaskRejectedException` bằng latch có kiểm soát?
      2. Tại sao `execute()` trả về bình thường không khẳng định nhiệm vụ đã thành công hoặc đã được lưu bền vững?
      3. `AbortPolicy`, `CallerRunsPolicy` và `DiscardPolicy` tạo ra khác biệt gì cho caller khi executor quá tải?

      ### Lỗi khi đã thực thi

      1. Nếu một task `submit(Callable)` ném `IllegalStateException`, lỗi sẽ đến caller qua kênh nào?
      2. Vì sao lỗi thực thi có thể xuất hiện ngay trong lời `execute()` khi policy là `CallerRunsPolicy`?
      3. API đã trả `202 Accepted` mà worker lỗi sau đó thì hệ thống cần cơ chế nào để báo trạng thái cuối?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân biệt giai đoạn lỗi | Phân loại một sự kiện thành rejection, execution failure hoặc lỗi validation của caller theo timeline cụ thể. |
      | Tái hiện saturation | Thiết kế pool core/max bằng 1, queue bằng 1 và latch chứng minh task thứ ba bị từ chối. |
      | Chọn điểm bắt lỗi | Đặt catch ở submitter, Future observer hoặc void handler đúng hợp đồng của từng API. |
      | Đánh giá rejection policy | Giải thích tác động tới latency, mất việc và tín hiệu acceptance của ba policy thông dụng. |
      | Xác lập trạng thái nghiệp vụ | Nêu cách phân biệt accepted, running, succeeded, failed và rejected ở biên dịch vụ. |
  - slug: exception-handling-002
    title: ExecutionException, CompletionException và nguyên nhân gốc
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Wrapper của lỗi khi lấy Future.
    problemSolved: isDone nghĩa là success.
    mechanism: Future.get và CompletableFuture.join.
    applicationValue: Unwrap wrapper có giới hạn và giữ root cause. get/join báo lỗi domain.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **ExecutionException, CompletionException và nguyên nhân gốc**

      Bài này tập trung vào cách `Future.get()` và `CompletableFuture.join()` bộc lộ lỗi dưới hai loại wrapper khác nhau. Học viên cần đọc cause chain có giới hạn, không đánh đồng timeout/cancellation với lỗi tính toán, và giữ bối cảnh khi phân loại exception.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng Future và CompletableFuture

      1. Cùng một `CompletableFuture.failedFuture(root)`, `get()` và `join()` ném những wrapper gì?
      2. Tại sao `isDone()==true` không chứng minh Future đã thành công?
      3. Với `get(timeout, unit)`, `TimeoutException`, `InterruptedException` và `CancellationException` khác lỗi execution ở điểm nào?

      ### Đọc nguyên nhân đúng

      1. Nếu có hai tầng `CompletionException` và `ExecutionException`, làm sao lấy cause gốc mà không gỡ nhầm exception domain?
      2. Vì sao logging nên giữ full Throwable, stack trace và suppressed exceptions thay vì chỉ in `ex.getMessage()`?
      3. Trong `allOf`, một cause của Future tổng có cho biết toàn bộ các nhánh đã thất bại không?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Đối chiếu wrapper | Dự đoán đúng lỗi checked của `get()` và unchecked của `join()` trên một future thất bại. |
      | Gỡ wrapper có kiểm soát | Xây helper chỉ tháo hai wrapper async đã biết và có điều kiện dừng rõ. |
      | Phân loại trạng thái | Phân biệt execution, rejection, cancellation, waiting timeout và interrupt. |
      | Kiểm thử root cause | Viết assertion với failedFuture và submit để xác minh exception/cause chính xác. |
      | Ghi nhận lỗi đầy đủ | Trình bày cách log cả ranh giới async, loại exception gốc và thông tin chẩn đoán an toàn. |
  - slug: exception-handling-003
    title: AsyncUncaughtExceptionHandler cho phương thức @Async trả về void
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Exception từ void không có Future.
    problemSolved: Handler tự truyền lỗi về caller.
    mechanism: AsyncUncaughtExceptionHandler.
    applicationValue: Xác minh handler nhận Throwable và Method. Notification void thất bại.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **AsyncUncaughtExceptionHandler cho phương thức @Async trả về void**

      Một method Spring `@Async` trả `void` không tạo Future để caller nhận lỗi từ worker. Bài này làm rõ khi nào `AsyncUncaughtExceptionHandler` được gọi, ý nghĩa `Throwable`, `Method`, `params`, cách kiểm thử qua proxy và cách không đánh đồng handler với retry.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Đường đi của lỗi void

      1. Vì sao try/catch tại caller không nhận lỗi target của `@Async void` sau khi executor đã nhận task?
      2. Handler khác gì với việc `@Async` bị từ chối lúc submit hoặc self-invocation bỏ qua proxy?
      3. Nếu đổi thành `CompletableFuture<Void>`, caller có thêm khả năng quan sát trạng thái gì?

      ### Dữ liệu và kiểm thử handler

      1. Handler nhận ba đối số nào và tại sao không nên log toàn bộ `params`?
      2. Bạn sẽ dùng `CountDownLatch` kiểm thử `Method`, exception type và số argument thế nào?
      3. Vì sao handler mặc định ghi log không tự retry, rollback hay bảo đảm delivery?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Mô tả kênh lỗi | Vẽ đường gọi qua proxy, worker, handler và phân biệt rejection ở caller. |
      | Đọc metadata exception | Sử dụng tên method, exception type và correlation ID được phép trong log/metric. |
      | Đối chiếu return type | Giải thích lựa chọn void so với CompletableFuture khi caller cần biết completion. |
      | Kiểm thử handler | Xây test Spring context với latch có timeout, xác nhận lỗi được gửi tới handler đúng một lần. |
      | Đánh giá vận hành | Nhận diện việc cần job status, metric và chính sách xử lý side effect riêng. |
  - slug: exception-handling-004
    title: Cấu hình bộ xử lý ngoại lệ bằng AsyncConfigurer
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Lắp handler và executor đúng context.
    problemSolved: Một bean handler bất kỳ tự được chọn.
    mechanism: AsyncConfigurer và EnableAsync.
    applicationValue: Kiểm tra proxy và qualifier được chọn. Spring bean có recorder và executor.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Cấu hình bộ xử lý ngoại lệ bằng AsyncConfigurer**

      Bài này đi vào **cấu hình Spring**, dùng `AsyncConfigurer` chọn executor mặc định và khai báo `AsyncUncaughtExceptionHandler`. Trọng tâm là bean lifecycle, `@EnableAsync`, qualifier và rủi ro một dependency/proxy được khởi tạo quá sớm.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Wiring Spring Async

      1. `getAsyncExecutor()` và `getAsyncUncaughtExceptionHandler()` cấu hình hai trách nhiệm độc lập nào?
      2. Vì sao có thể chỉ override handler nhưng vẫn chọn bean bằng `@Async("backgroundExecutor")`?
      3. Tại sao một bean `AsyncUncaughtExceptionHandler` tùy ý chưa bảo đảm interceptor đã sử dụng nó?

      ### Bootstrap và xác minh

      1. Vì sao cấu hình `AsyncConfigurer` có thể được khởi tạo sớm, và `ObjectProvider` giúp hoãn lấy recorder ra sao?
      2. Self-invocation hoặc đối tượng tạo bằng `new` tác động thế nào tới `@Async` proxy?
      3. Bạn sẽ kiểm thử riêng handler của void, exception của Future và rejection tại submitter như thế nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Cấu hình handler | Tạo `@Configuration @EnableAsync implements AsyncConfigurer` với handler xác định. |
      | Phân giải executor | Chỉ rõ default executor, bean name và qualifier khi có nhiều executor. |
      | Giữ lifecycle an toàn | Giải thích nguy cơ khởi tạo sớm recorder và dùng `ObjectProvider` khi xử lý lỗi. |
      | Xác minh wiring | Dùng ApplicationContext và bean proxy để kiểm tra handler cùng executor thật. |
      | Thiết kế logging | Định nghĩa metric/log với dữ liệu cho phép và fallback tối thiểu khi handler lỗi. |
  - slug: exception-handling-005
    title: exceptionally(), handle() và whenComplete()
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Ba semantics của stage phụ thuộc.
    problemSolved: whenComplete tự fallback.
    mechanism: exceptionally, handle, whenComplete.
    applicationValue: Dự đoán trạng thái stage gốc và stage mới. Pipeline CompletableFuture nhiều bước.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **exceptionally(), handle() và whenComplete()**

      Ba API của `CompletableFuture` có mục đích khác nhau: `exceptionally` phục hồi lỗi, `handle` ánh xạ success/failure và `whenComplete` quan sát kết quả. Bài giúp dự đoán đúng stage phụ thuộc, callback tự lỗi và hành vi thread.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng ba toán tử

      1. API nào chỉ chạy trên failure, API nào chạy cả hai trạng thái và API nào có thể đổi kiểu kết quả?
      2. Vì sao `completedFuture(null)` vẫn thành công và điều kiện nào xác định failure trong callback?
      3. Phục hồi bằng `exceptionally` có thay đổi trạng thái của source Future hay không?

      ### Sắp thứ tự stage

      1. Khi observer `whenComplete` tự ném lỗi ở nhánh success và nhánh đã failed, nguyên nhân nào được ưu tiên?
      2. Đặt `exceptionally` trước hoặc sau `thenApply` thay đổi kết quả cuối thế nào?
      3. Callback không hậu tố Async có thể chạy trên thread nào và vì sao không nên block lâu?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | So sánh API | Lập bảng nhánh callback, giá trị trả về, cùng kiểu hay đổi kiểu và cách truyền lỗi. |
      | Dự đoán pipeline | Tính outcome của stage nguồn và stage sau recovery theo từng thứ tự operator. |
      | Xử lý lỗi observer | Đối chiếu exception priority của whenComplete trên source thành công và source thất bại. |
      | Phân loại null/cancel | Kiểm tra success-null khác failure và cancellation kích hoạt exceptional branch. |
      | Kiểm thử xác định | Dùng completedFuture/failedFuture để xác minh callback counts và kết quả không cần sleep. |
  - slug: exception-handling-006
    title: Phân biệt phục hồi bằng giá trị thay thế với chỉ quan sát lỗi
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Lỗi nguồn và giá trị suy giảm.
    problemSolved: Fallback nghĩa là backend khỏe.
    mechanism: whenComplete trước fallback, Outcome.
    applicationValue: Đo lỗi nguồn và trạng thái cuối riêng. Đọc dữ liệu có cache fallback.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phân biệt phục hồi bằng giá trị thay thế với chỉ quan sát lỗi**

      Trọng tâm của bài này là **quyết định nghiệp vụ**: ghi nhận lỗi nguồn khác với dùng fallback để tiếp tục. Học viên thiết kế pipeline đo lỗi trước và sau phục hồi, đánh dấu kết quả suy giảm, và không nhầm timeout/cancel với việc side effect đã dừng.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Quan sát trước khi phục hồi

      1. Vì sao đặt `whenComplete` trước hoặc sau `exceptionally` khiến số lần lỗi backend quan sát khác nhau?
      2. Đối với một dịch vụ đọc cache, khi nào fallback hợp lệ và khi nào lỗi phải truyền tiếp?
      3. Bạn sẽ biểu diễn kết quả `degraded` thế nào để HTTP caller không hiểu nó là dữ liệu primary?

      ### Bảo toàn chứng cứ và vòng đời

      1. `exceptionally` có tự retry không, và khi nào dùng `exceptionallyCompose` thay cho `join()` blocking?
      2. Timeout hoặc cancellation có bảo đảm worker và thao tác remote ngừng không?
      3. Nên đo `primary_failure_total`, `fallback_success_total`, `final_request_failure_total` ở những ranh giới nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Thiết kế telemetry boundary | Đặt observer ở nguồn và kết quả cuối với metric phân biệt hai loại thất bại. |
      | Chọn fallback | Lập chính sách cache/degraded theo lỗi tạm thời, dữ liệu còn hạn và quyền truy cập. |
      | Biểu diễn kết quả | Dùng Outcome có trạng thái và nguồn kết quả thay vì biến lỗi thành success giả. |
      | Kết hợp fallback async | Sử dụng exceptionallyCompose khi dự phòng trả một stage khác. |
      | Kiểm thử semantics | Xác minh upstream vẫn lỗi, fallback mới thành công, và side effect không tự bị dừng. |
  - slug: exception-handling-007
    title: Không bỏ qua Future rồi đánh mất lỗi nghiệp vụ
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Bỏ Future làm mất tín hiệu nghiệp vụ.
    problemSolved: 202 tự bảo đảm job bền vững.
    mechanism: submit, whenComplete, job ledger.
    applicationValue: Giữ hoặc trả handle và ghi terminal status. Invoice nền có job ID.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Không bỏ qua Future rồi đánh mất lỗi nghiệp vụ**

      `Future` lưu kết quả và exception, nhưng một lời `submit()` trả thành công chưa phải nghiệp vụ hoàn tất. Nếu không có owner lưu, trả tiếp hoặc quan sát Future, lỗi có thể bị mất khỏi luồng ứng dụng. Bài liên hệ completion với job status, HTTP 202 và durability.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Quan sát Future đúng cách

      1. Vì sao `ExecutorService.submit` có thể giữ lỗi trong FutureTask mà không có stack trace từ worker uncaught handler?
      2. `Future.isDone()` có chỉ ra task đã thành công hay chưa, và làm sao kiểm tra trạng thái terminal?
      3. Điều gì xảy ra khi chỉ gắn `thenAccept` mà không quan sát exceptional completion?

      ### Ownership và trạng thái bền vững

      1. Trả HTTP 202 kèm job ID cần những bằng chứng tiếp nhận nào để không báo thành công giả?
      2. Khi JVM crash hoặc có nhiều replica, vì sao Future in-memory không thay được job ledger/outbox?
      3. Observer `whenComplete` tự thất bại thì việc bỏ stage mới tạo có nguy cơ gì?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Tìm Future bị bỏ quên | Phát hiện lời gọi submit/supplyAsync/Async mà kết quả không có owner. |
      | Xử lý terminal outcomes | Đặt observer hoặc trả Future, phân loại success, failed, cancelled, timed-out, rejected. |
      | Thiết kế API nền | Phân biệt async HTTP response với 202 kèm job ID có tra trạng thái. |
      | Thiết kế job state | Mô tả PENDING, RUNNING, SUCCEEDED, FAILED và cách đối soát sau restart. |
      | Kiểm thử failure visibility | Viết test chứng minh exception trong Future vẫn được báo đúng cause sau completion. |
  - slug: exception-handling-008
    title: Giới hạn bắt lỗi bằng TaskDecorator khi tác vụ được bọc trong Future
    status: WRITTEN
    difficult: ADVANCED
    focus: Lỗi nằm trong FutureTask không thoát run.
    problemSolved: Decorator catch bắt mọi lỗi.
    mechanism: TaskDecorator, FutureTask, afterExecute.
    applicationValue: Chứng minh khác biệt raw Runnable và FutureTask. MDC và metrics tại task boundary.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Giới hạn bắt lỗi bằng TaskDecorator khi tác vụ được bọc trong Future**

      `TaskDecorator` bọc Runnable thực tế, đôi khi là `FutureTask` hoặc callback nội bộ. Vì `FutureTask.run()` giữ exception thay vì ném ra wrapper, `catch` của decorator không thấy mọi lỗi. Bài làm rõ cơ chế và vị trí quan sát đáng tin hơn.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### FutureTask và decorator

      1. Vì sao một `FutureTask.run()` có thể trả bình thường dù `Callable.call()` ném `IllegalArgumentException`?
      2. Đường `execute(rawRunnable)` và `submit(Callable)` khác nhau thế nào khi decorator có try/catch?
      3. Tại sao `r instanceof Future<?>` không được bảo đảm nếu decorator đã tạo Runnable wrapper?

      ### Quan sát lỗi và context

      1. Khi nào `Future.get()` trong decorator an toàn và khi nào có thể block/deadlock worker?
      2. Với `@Async void`, `@Async CompletableFuture` và rejection, mỗi loại cần kênh lỗi nào?
      3. Cần snapshot và restore `ThreadLocal`/MDC ở đâu để pool tái sử dụng worker không rò context?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Giải thích cơ chế wrapper | Vẽ luồng từ FutureTask.run đến exceptional state và Future.get. |
      | Tái hiện bằng JDK | Chứng minh decorator catch thấy direct Runnable failure nhưng không thấy lỗi lưu trong FutureTask. |
      | Đặt observer đúng ranh giới | Chọn Future callback/get, void handler hoặc catch tại submitter. |
      | Đánh giá afterExecute | Giải thích vì sao Throwable hoặc instanceof Future có thể không thể hiện failure đã được wrap. |
      | Thiết kế TaskDecorator an toàn | Sử dụng finally để restore MDC/ThreadLocal và đo callback duration đúng scope. |
  - slug: exception-handling-009
    title: Xác định chính sách thử lại có giới hạn và tính an toàn khi chạy lại
    status: WRITTEN
    difficult: ADVANCED
    focus: Retry có thể tăng tải và tạo side effect trùng.
    problemSolved: Timeout nghĩa là chưa commit.
    mechanism: maxAttempts, backoff, key, outbox.
    applicationValue: Đếm attempts và chống duplicate đồng thời. Payment và workflow có idempotency.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Xác định chính sách thử lại có giới hạn và tính an toàn khi chạy lại**

      Retry phải vượt lỗi tạm thời nhưng không được nhân đôi tác dụng phụ hoặc tạo retry storm. Bài này thiết kế số attempts, deadline, backoff, jitter, Retry-After và idempotency key với tình huống kết quả không chắc chắn, nhiều instance và crash.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Quyết định có retry không

      1. Vì sao timeout sau khi gửi thanh toán chưa chứng minh server chưa commit?
      2. `maxAttempts=3` của Spring Retry khác `maxRetries=3` trong Spring Framework 7 như thế nào?
      3. Per-attempt timeout, overall deadline, backoff cap và jitter phối hợp để hạn chế tải ra sao?

      ### Idempotency và kiểm thử

      1. Tại sao cùng một logical operation phải giữ idempotency key qua tất cả attempts?
      2. Atomic claim, request fingerprint và trạng thái IN_PROGRESS xử lý concurrent duplicate như thế nào?
      3. Bạn sẽ kiểm thử timeout sau commit, crash và hai request cùng key sao cho side effect không trùng?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân loại lỗi | Phân nhóm transient, permanent, ambiguous outcome và quyết định retry đúng từng loại. |
      | Tính ngân sách | Đếm tổng attempts, backoff và thời hạn còn lại khi có nhiều tầng retry. |
      | Thiết kế idempotency | Mô tả key ổn định, payload hash, atomic claim, provider idempotency và reconciliation. |
      | Viết bounded retry | Kiểm thử max attempts, lỗi không retry và exhaustion bằng fake sleeper. |
      | Đánh giá môi trường phân tán | Phân tích lợi ích và giới hạn của outbox, job store, distributed coordination. |
      | Phòng retry storm | Chọn rate/bulkhead/circuit breaker, Retry-After và quan sát metric retry. |
- slug: timeout-cancellation
  title: Hết hạn và hủy
  childs:
  - slug: timeout-cancellation-001
    title: Phân biệt thời gian chờ trong hàng đợi, thời gian chạy và thời gian bên gọi chờ
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Phân tách timeline và budget.
    problemSolved: Ba khoảng thời gian dễ bị cộng trùng. Queue size không đo tuổi task.
    mechanism: Tính queue/runtime/get bằng t0–t4.
    applicationValue: Đo và chẩn đoán executor latency.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phân biệt thời gian chờ trong hàng đợi, thời gian chạy và thời gian bên gọi chờ**

      Khi một tác vụ được giao cho ThreadPoolTaskExecutor, độ trễ không đến từ một nơi duy nhất. Bài học xây dựng ba phép đo queue wait, execution time và caller wait trên các mốc thời gian khác nhau, giúp tìm đúng nút thắt, đặt deadline và đọc metric mà không đếm trùng thời gian.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Phân định vòng đời tác vụ và bên gọi

      1. Queue wait, execution time và caller wait bắt đầu và kết thúc ở những mốc nào, và vì sao không cộng cả ba để tính submit-to-finish?
      2. Vì sao caller gọi get muộn có thể chờ gần 0 ms dù task mất hàng trăm mili giây?
      3. Trường hợp task bị reject hoặc bị hủy trước start phải được phân loại ra sao trong thống kê?

      ### Đo lường, deadline và điều tra nghẽn

      1. Khi queue wait cao nhưng runtime thấp, em sẽ kiểm tra những yếu tố executor nào trước?
      2. Vì sao queue size bằng 0 không chứng minh hệ thống không quá tải?
      3. Dùng System.nanoTime và một deadline chung như thế nào để không vô tình đặt lại timeout ở mỗi bước?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân tích timeline | Vẽ t0–t4, tính riêng queue wait, runtime và caller wait cho một kịch bản có lần get gọi muộn. |
      | Thiết kế instrumentation | Chỉ rõ điểm capture timestamp tại submit, worker start/end và caller get; phân loại accepted/rejected/cancelled. |
      | Chẩn đoán độ trễ | Giải thích nguyên nhân khác nhau của queue wait cao và runtime cao, lựa chọn số liệu cần kiểm tra. |
      | Phân bổ deadline | Tính remaining budget từ một mốc chung và dự đoán hành vi khi get timeout mà task còn ở queue. |
  - slug: timeout-cancellation-002
    title: Future.get(timeout) không tự dừng công việc nền
    status: WRITTEN
    difficult: BASIC
    focus: Tách thời gian đợi khỏi vòng đời job.
    problemSolved: Caller timeout có dừng task không?. TimeoutException không là CANCELLED.
    mechanism: Demo latch timeout rồi get kết quả.
    applicationValue: Trả trạng thái chờ trung thực.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Future.get(timeout) không tự dừng công việc nền**

      Future.get(timeout) là cơ chế chờ có hạn của caller, không phải cơ chế dừng worker. Bài giúp tránh báo hủy sai, tránh retry tạo tác dụng phụ trùng và lựa chọn giao thức theo dõi job khi thời gian xử lý vượt thời gian chờ HTTP.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Ý nghĩa của phép chờ có hạn

      1. Khi get(timeout) ném TimeoutException, trạng thái Future và worker có thể là những trạng thái nào?
      2. ExecutionException, InterruptedException và CancellationException từ Future khác TimeoutException về ý nghĩa gì?
      3. Vì sao kiểm tra isDone ngay sau timeout có thể thấy true mà không mâu thuẫn?

      ### Ứng xử sau khi caller hết chờ

      1. Trong demo CountDownLatch, làm sao chứng minh task tiếp tục rồi trả kết quả sau khi get đã timeout?
      2. Khi nào nên chờ lại, yêu cầu hủy hay trả HTTP 202 kèm jobId?
      3. Nếu tác vụ có side effect bên ngoài, vì sao retry ngay sau timeout là rủi ro và cần thông tin gì để đối soát?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Giải thích hợp đồng Future | Phân biệt kết thúc lần chờ với kết thúc thực thi và lập bảng kết quả/ngoại lệ của get. |
      | Kiểm chứng hành vi | Dùng latch chạy ví dụ timeout trước rồi giải phóng worker để lấy lại kết quả thật. |
      | Chọn phản hồi API | Chọn thông điệp và trạng thái job phù hợp khi HTTP caller timeout nhưng task còn chạy. |
      | Giảm rủi ro retry | Thiết kế jobId và idempotency key để ngăn hai side effect từ một yêu cầu logic. |
  - slug: timeout-cancellation-003
    title: orTimeout() và completeOnTimeout() không mặc nhiên dừng thao tác đang chạy
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: First completion wins và upstream/copy.
    problemSolved: Timeout làm Future đổi trạng thái ra sao?. Fallback không hủy I/O thật.
    mechanism: Demo orTimeout/fallback khi worker còn chờ.
    applicationValue: Chọn timeout lỗi hay fallback.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **orTimeout() và completeOnTimeout() không mặc nhiên dừng thao tác đang chạy**

      orTimeout và completeOnTimeout thay đổi chính trạng thái CompletableFuture, trong khi supplier hoặc I/O có thể tiếp tục chạy. Bài giúp chọn timeout lỗi hay fallback đúng mục đích, quan sát kết quả đến muộn và giữ một future gốc riêng nếu cần theo dõi thao tác thật.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Completion semantics và lỗi timeout

      1. orTimeout và completeOnTimeout trả về Future mới hay chính đối tượng đang gọi, và điều đó ảnh hưởng gì khi cấu hình nhiều deadline?
      2. get(timeout), orTimeout và completeOnTimeout khác nhau ra sao khi hết hạn?
      3. Khi timeout thắng, join, get, isDone và isCompletedExceptionally phản ánh trạng thái nào?

      ### Kết quả muộn và điều phối tài nguyên

      1. Vì sao future đã trả fallback không còn nhận giá trị thật đến sau, dù worker vẫn chạy?
      2. Có thể dùng copy của CompletableFuture như thế nào để tách future phản hồi khỏi future theo dõi operation?
      3. Bài test dùng latch kiểm chứng điều gì về worker chưa hoàn tất và vì sao phải đặt timeout HTTP/JDBC riêng?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Chọn API timeout | Giải thích và áp dụng đúng get(timeout), orTimeout, completeOnTimeout trong ba nhu cầu phản hồi khác nhau. |
      | Kiểm chứng completion race | Tạo hai kịch bản latch để chứng minh fallback/lỗi timeout thắng nhưng supplier còn chạy. |
      | Thiết kế hai luồng quan sát | Tách response future và upstream future, gắn metric cho operation thật thay vì chỉ cho future phản hồi. |
      | Phòng lỗi production | Xác định retry trùng, tài nguyên còn bị giữ và thời điểm cần timeout của client I/O. |
  - slug: timeout-cancellation-004
    title: Future.cancel(true) và cơ chế ngắt có tính hợp tác
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Signal, cooperate, cleanup.
    problemSolved: cancel(true) gửi interrupt đến đâu?. cancel true không rollback side effect.
    mechanism: Demo FutureTask và interruptible task.
    applicationValue: Hủy hợp tác, không ngộ nhận side effect.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Future.cancel(true) và cơ chế ngắt có tính hợp tác**

      Hủy Future không đồng nghĩa giết Java thread. Bài tập trung vào FutureTask và cancel(true), giải thích interrupt hợp tác, trường hợp task còn trong queue hoặc chạy CPU và cách kiểm thử riêng trạng thái Future, việc dừng code và cleanup.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng FutureTask và interrupt

      1. cancel(false) và cancel(true) khác nhau thế nào khi task chưa bắt đầu và khi đang chạy?
      2. Tại sao isCancelled và isDone không đủ chứng minh worker đã rời phương thức hay side effect đã rollback?
      3. Vòng lặp CPU phải kiểm tra tín hiệu gì nếu muốn hỗ trợ cancel(true)?

      ### Dừng hợp tác, cleanup và test

      1. Khi CountDownLatch.await bị interrupt, worker phải xử lý InterruptedException và tài nguyên trong finally như thế nào?
      2. Vì sao task có thể vẫn chạy sau khi cancel(true) trả true, và demo không hợp tác chứng minh điểm nào?
      3. Cần các latch nào để xác minh task queued bị hủy trước khi body chạy và task running đã nhận interrupt?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Giải thích cancellation | Diễn giải khác biệt giữa trạng thái Future, yêu cầu interrupt và worker termination với các race có thể xảy ra. |
      | Viết code hợp tác | Bổ sung kiểm tra cờ ngắt và finally cleanup vào một Runnable hoặc Callable. |
      | Kiểm thử hủy | Dùng CountDownLatch và Future.get để xác nhận hủy trước start, hủy khi running và CancellationException. |
      | Lựa chọn ranh giới nghiệp vụ | Xác định side effect nào không được coi là đã hoàn tác chỉ vì cancel. |
  - slug: timeout-cancellation-005
    title: CompletableFuture.cancel() không bảo đảm ngắt luồng xử lý
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Future completion không là worker termination.
    problemSolved: Vì sao CF cancel không ngắt supplier?. Boolean true không điều khiển interrupt.
    mechanism: Demo CF cancelled nhưng supplier chưa xong.
    applicationValue: Tách cancellation state khỏi worker.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **CompletableFuture.cancel() không bảo đảm ngắt luồng xử lý**

      CompletableFuture.cancel(true) không điều khiển interrupt của supplier theo cách FutureTask.cancel(true) có thể làm. Bài giúp đọc đúng completion state, theo dõi worker thật, hiểu dependent stages và thiết kế token hủy khi cần dừng công việc trong Spring.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Đặc thù hủy CompletableFuture

      1. Vì sao tham số mayInterruptIfRunning không có tác dụng điều khiển worker trong CompletableFuture chuẩn?
      2. Sau cancel, join và isCancelled nói gì về future, và vì sao không chứng minh Supplier đã thoát?
      3. Dependent stage sẽ được thông báo hủy/lỗi như thế nào so với operation bên dưới?

      ### Thiết kế cancellation hợp tác

      1. Làm thế nào dùng latch chứng minh CompletableFuture đã cancelled nhưng supplier chưa quan sát interrupt?
      2. Một cancellation token dùng chung giữa dispatcher và worker cần bảo đảm thuộc tính thread-safety nào?
      3. Trong Spring @Async hoặc nhiều replica, cần lưu yêu cầu hủy và quan sát worker dừng ra sao?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân biệt Future implementations | So sánh cancel(true) của CompletableFuture và FutureTask ở mức trạng thái kết quả và interrupt. |
      | Kiểm chứng bằng thử nghiệm | Dùng latch đo độc lập trạng thái Future và thời điểm worker rời finally. |
      | Thiết kế token hủy | Phác thảo flag atomic/volatile và các checkpoint ở các bước xử lý. |
      | Đánh giá giới hạn | Giải thích vì sao token không tự hủy I/O hay hoàn tác side effect, đề xuất timeout và trạng thái job phù hợp. |
  - slug: timeout-cancellation-006
    title: Xử lý InterruptedException và bảo toàn tín hiệu ngắt phù hợp
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Propagate hoặc restore-then-exit.
    problemSolved: InterruptedException làm gì với cờ ngắt?. Interrupt không bắt mọi I/O phải dừng.
    mechanism: Thử flag sau InterruptedException và cleanup.
    applicationValue: Không nuốt interrupt và giữ thread.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Xử lý InterruptedException và bảo toàn tín hiệu ngắt phù hợp**

      InterruptedException là tín hiệu điều khiển quan trọng khi worker chờ trên API blocking. Bài giúp phân biệt truyền tiếp exception, khôi phục interrupt flag rồi thoát và biểu diễn hủy nghiệp vụ, tránh làm mất tín hiệu dẫn đến task tiếp tục giữ pool hoặc thực hiện bước đã không còn hợp lệ.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Cờ ngắt và hợp đồng của API blocking

      1. Thread.currentThread().isInterrupted và Thread.interrupted khác nhau ở tác động lên interrupt flag thế nào?
      2. Vì sao sleep hoặc await thường xóa cờ interrupt khi ném InterruptedException?
      3. Future.cancel(true), caller bị interrupt khi get và worker nhận InterruptedException là ba sự kiện khác nhau ở điểm nào?

      ### Xử lý lỗi ở ranh giới phương thức

      1. Khi nào nên khai báo throws InterruptedException và khi nào phải khôi phục cờ rồi rời Runnable?
      2. Vì sao catch rồi nuốt exception hoặc restore flag xong lại lặp blocking vô hạn là sai?
      3. Trong Spring @Async, shutdown và task I/O, cần quan sát cleanup và transaction sau interrupt như thế nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Đọc trạng thái ngắt | Dự đoán giá trị cờ interrupt trước/sau blocking method và hai API kiểm tra cờ. |
      | Chọn chiến lược propagation | Viết nhánh catch truyền tiếp hoặc restore-then-exit phù hợp hợp đồng của từng method. |
      | Sửa lỗi worker | Nhận diện code nuốt InterruptedException và chỉnh để dọn tài nguyên, trả lại quyền kiểm soát. |
      | Kiểm thử interrupt | Dùng latch chờ worker bắt đầu và xác nhận tín hiệu ngắt, cleanup và trạng thái Future riêng. |
  - slug: timeout-cancellation-007
    title: Đặt timeout riêng cho truy cập cơ sở dữ liệu hoặc lời gọi mạng
    status: WRITTEN
    difficult: ADVANCED
    focus: End-to-end deadline và downstream dependency.
    problemSolved: Timeout I/O nằm ở tầng nào?. Query timeout phụ thuộc driver/protocol.
    mechanism: HTTP slow server, JDBC configuration.
    applicationValue: Giới hạn chờ DB/HTTP thật.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Đặt timeout riêng cho truy cập cơ sở dữ liệu hoặc lời gọi mạng**

      Timeout của Future hoặc HTTP response không thay thế timeout ở nơi đang chờ database, connection pool hay remote HTTP server. Bài học thiết kế ngân sách deadline đi qua nhiều tầng, cấu hình Hikari/JDBC/JdbcTemplate/HTTP client và phân tích trường hợp provider đã xử lý nhưng client không nhận được phản hồi.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Timeout của kết nối và truy vấn database

      1. Timeout chờ lấy connection trong pool khác với Statement.setQueryTimeout và transaction timeout thế nào?
      2. JdbcTemplate và Spring @Transactional có thể giới hạn điều gì, và điều gì vẫn tùy database/driver?
      3. Lỗi timeout ở JDBC có đồng nghĩa chắc chắn transaction bên ngoài hoặc remote side effect chưa xảy ra không?

      ### HTTP timeout và ngân sách end-to-end

      1. Connect timeout khác request/response timeout như thế nào trong Java HttpClient?
      2. Vì sao Future.orTimeout không làm một HTTP call đồng bộ đang chạy tự động kết thúc?
      3. Cách tính thời gian còn lại từ một deadline chung giúp phân bổ budget cho kết nối, query, retry ra sao?

      ### Kiểm thử và vận hành

      1. Bài demo HTTP server trả chậm cần assert kết quả nào mà không dựa trên số mili giây chính xác?
      2. Cần quan sát những số liệu nào để biết timeout đang giữ worker/connection và tạo retry storm?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân loại timeout đa tầng | Lập sơ đồ connect, pool-acquire, SQL query, HTTP request và transaction timeout với hậu quả riêng. |
      | Cấu hình dependency | Chỉ ra API và nơi đặt timeout cho Hikari, JdbcTemplate và java.net.http.HttpClient theo bài. |
      | Tính timeout budget | Chia deadline tổng cho nhiều bước mà không reset thời gian mỗi lần retry. |
      | Thiết kế phục hồi | Xử lý trạng thái kết quả không chắc chắn bằng idempotency, query status và reconciliation. |
  - slug: timeout-cancellation-008
    title: Ngăn công việc hết giá trị tiếp tục tạo tác dụng phụ
    status: WRITTEN
    difficult: ADVANCED
    focus: Atomicity, fencing, idempotency.
    problemSolved: Công việc hết hiệu lực vẫn ghi được không?. Check-then-act còn race nếu thiếu atomicity.
    mechanism: Latch check-then-act và conditional commit.
    applicationValue: Chặn ghi lỗi của worker cũ.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Ngăn công việc hết giá trị tiếp tục tạo tác dụng phụ**

      Kết quả đã hết giá trị không đồng nghĩa thao tác cũ đã ngừng tác động tới hệ thống. Bài tiến từ cancellation token đến race check-then-act, fencing token và conditional commit, để ngăn một worker cũ ghi đè dữ liệu mới hoặc phát side effect sau khi quyền thực thi không còn hợp lệ.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Giá trị nghiệp vụ và race

      1. Làm sao phân biệt caller timeout, job cancelled, deadline expired và quyền tạo side effect còn hợp lệ?
      2. Vì sao kiểm tra cờ cancelled ngay trước ghi không bảo đảm an toàn nếu có interleaving giữa check và act?
      3. Kịch bản latch chứng minh lỗ hổng check-then-act bằng thứ tự sự kiện nào?

      ### Fencing và ranh giới commit

      1. Fencing token hoặc generation được kiểm tra nguyên tử tại nơi commit giúp chống worker cũ như thế nào?
      2. Khi ghi database, optimistic locking, conditional update hoặc outbox bảo vệ những thuộc tính nào?
      3. Khi side effect ở dịch vụ ngoài đã gửi, vì sao local cancel/interrupt không đủ và cần idempotency/reconciliation?

      ### Kiểm chứng thiết kế

      1. Nên quan sát side-effect count, version và trạng thái job nào để phân biệt future cancelled với hiệu lực nghiệp vụ?
      2. Khi nào chính sách chỉ chấp nhận phiên bản mới nhất không thích hợp cho các nghiệp vụ bắt buộc hoàn thành?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân tích race condition | Dùng timeline và latch chỉ ra cửa sổ lỗi giữa kiểm tra tính hợp lệ và ghi side effect. |
      | Thiết kế commit có điều kiện | Mô tả điều kiện version/fencing token ở thao tác update nguyên tử và dự đoán kết quả worker cũ. |
      | Đảm bảo tính đúng nghiệp vụ | Chọn idempotency key, outbox hoặc reconciliation cho hệ thống có remote side effects. |
      | Đánh giá chính sách cancel | Phân biệt quyền ngừng response với quyền hủy tác động đã commit và mô hình trạng thái phù hợp. |
  - slug: timeout-cancellation-009
    title: Kiểm tra hủy trước khi bắt đầu và hủy khi tác vụ đang chạy
    status: WRITTEN
    difficult: ADVANCED
    focus: State machine và race ở handoff.
    problemSolved: Hủy lúc queued và running khác nhau thế nào?. isDone không xác nhận worker stopped.
    mechanism: Test queued cancel và running cancel.
    applicationValue: Thiết kế handle và pha hủy an toàn.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Kiểm tra hủy trước khi bắt đầu và hủy khi tác vụ đang chạy**

      Một yêu cầu hủy có thể đến khi task còn nằm trong queue, vừa được worker nhận hoặc đã đi sâu vào phần xử lý. Bài thiết kế và kiểm thử riêng các pha này, so sánh FutureTask với CompletableFuture, đồng thời làm rõ race, cancellation token và handle của dispatcher trong Spring.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Ranh giới QUEUED và RUNNING

      1. Nếu cancel xảy ra trước lúc task bắt đầu, body có được chạy không và task đã hủy có tự rời queue ngay không?
      2. cancel(false) và cancel(true) tác động ra sao khi task đã running?
      3. Ở ranh giới chuyển QUEUED sang RUNNING, vì sao kết quả cancel có thể cạnh tranh với thời điểm worker được chọn?

      ### Quan sát kết quả thực thi

      1. Tại sao isCancelled hoặc isDone chỉ xác nhận trạng thái Future, không chứng minh side effect đã dừng?
      2. Dùng token và handle của dispatcher như thế nào để tách cancellation requested khỏi worker stopped?
      3. Khác biệt giữa CompletableFuture.cancel và FutureTask.cancel ảnh hưởng lựa chọn handle trong Spring ra sao?

      ### Kiểm thử các pha

      1. Dùng một single-thread executor, latch giữ task đầu và barrier sau task bị cancel thế nào để chứng minh task queued không chạy?
      2. Dùng tín hiệu started/finished nào để kiểm chứng task running đã xử lý interrupt?
      3. Trong integration test Spring, làm sao cô lập executor, tránh self-invocation và không phụ thuộc Thread.sleep để đoán lịch chạy?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân tích state machine | Mô tả các pha SUBMITTED, QUEUED, RUNNING và tác động của yêu cầu hủy ở từng pha. |
      | Thiết kế job handle | Kết hợp Future, cancellation token và trạng thái job để quan sát cancellation request so với xác nhận dừng. |
      | Kiểm thử deterministic | Viết hai kịch bản hủy trước start và hủy khi đang chạy bằng latch, barrier, future.get và timeout. |
      | Xử lý race và side effects | Chỉ ra điểm cần kiểm tra trước tác động nghiệp vụ và giới hạn của cancel khi ghi đã commit. |
