      3. Vì sao không nên nhúng taskId hoặc userId vào tên một worker có thể được tái sử dụng?

      ### Chẩn đoán qua log

      1. Executor của @Async và scheduler của @Scheduled có luôn cùng prefix không và cách kiểm chứng là gì?
      2. Nếu đổi Thread.currentThread().setName trong task, bạn cần làm gì trong finally để tránh ảnh hưởng task sau?
      3. Tên thread, MDC và traceId giúp liên kết log như thế nào mà không dùng tên thread làm cơ chế phân quyền?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Cấu hình prefix | Đặt tên riêng cho ThreadPoolTaskExecutor và ThreadPoolTaskScheduler. |
      | Tùy chỉnh factory | Tạo ThreadFactory với AtomicInteger và trả Thread mới chưa start. |
      | Kiểm chứng runtime | Giải thích kết quả demo @Async, scheduler, Spring executor và JDK factory. |
      | Dọn context | Chỉ ra cách restore tên/MDC trong finally để tránh lẫn log giữa task. |
  - slug: thread-pool-010
    title: Phân biệt giá trị mặc định của Framework với cấu hình do ứng dụng cung cấp
    status: WRITTEN
    difficult: ADVANCED
    focus: Nguồn default.
    problemSolved: Cấu hình nào hiệu lực?. Nhầm class default với Boot.
    mechanism: Đọc getter Boot.
    applicationValue: Cấu hình nào hiệu lực?. Đọc getter Boot.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phân biệt giá trị mặc định của Framework với cấu hình do ứng dụng cung cấp**

      Bài tổng hợp các lớp nguồn cấu hình khác nhau: default của class Spring, executor được annotation lựa chọn, auto-config của Spring Boot và cấu hình tường minh của ứng dụng. Người học phải chứng minh cấu hình đang có hiệu lực dựa trên bean thật cùng phiên bản Java/Boot.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Class default và bean selection

      1. ThreadPoolTaskExecutor mới tạo trực tiếp có mặc định core/max/queue nào và vì sao khác Boot auto-config?
      2. Khi @EnableAsync xử lý @Async, cơ chế chọn TaskExecutor duy nhất, tên taskExecutor và fallback diễn ra thế nào?
      3. Tên applicationTaskExecutor có vai trò riêng gì trong một số tích hợp như Spring MVC async?

      ### Boot, profiles và virtual threads

      1. Khi ứng dụng tự khai báo Executor bean, Boot auto-config có thể back off như thế nào?
      2. Vì sao đổi spring.task.execution.pool.core-size trong properties không chắc ảnh hưởng bean tự cấu hình bằng setter?
      3. Với Java 21 virtual threads, vì sao cần kiểm tra runtime class thay vì diễn giải pool-size như platform pool?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân loại nguồn mặc định | So sánh Framework class defaults với auto-config platform pool của Boot. |
      | Xác minh bean chọn | Theo @Async qualifier, AsyncConfigurer và TaskScheduler để xác định executor cụ thể. |
      | Chạy hai cấu hình | Giải thích getter core/max/queue/scheduler khác nhau trong demo Boot custom/default. |
      | Đánh giá môi trường | Kiểm tra Java/Boot version, profiles, virtual threads và bean runtime trước khi kết luận. |
- slug: resource-configuration
  title: Cấu hình tài nguyên
  childs:
  - slug: resource-configuration-001
    title: Tách bộ thực thi cho các nhóm công việc có đặc điểm khác nhau
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Cách ly nhóm tác vụ.
    problemSolved: Tưởng nhiều bean tên khác là đã cách ly toàn tài nguyên.
    mechanism: Nhiều executor và @Async qualifier. Nhóm nào cần pool riêng.
    applicationValue: FAST chạy khi SLOW còn bị latch giữ.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Tách bộ thực thi cho các nhóm công việc có đặc điểm khác nhau**

      Một executor dùng chung có thể để tác vụ HTTP chậm chiếm toàn bộ worker và hàng đợi, khiến phép tính nhanh phải chờ. Bài này giúp thiết kế ranh giới thực thi riêng cho nhóm FAST, SLOW và batch, cấu hình bean Spring theo mục đích, rồi kiểm chứng bằng CountDownLatch rằng công việc nhanh vẫn hoàn tất trong khi worker chậm đang chờ. Người học đồng thời đánh giá những giới hạn còn chia sẻ như CPU, heap, JDBC và quota bên ngoài.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Cơ chế cách ly và lựa chọn nhóm

      1. Vì sao tác vụ tính toán hai mili giây vẫn có thể trả kết quả muộn khi hai worker của executor chung đang chờ network?
      2. Điều kiện nào khiến tách executor có ý nghĩa hơn việc tạo thêm một pool cho mọi method?
      3. Tách fastExecutor và slowExecutor bảo vệ được tài nguyên nào, còn những tài nguyên chung nào vẫn có thể làm cả hai nhóm nghẽn?

      ### Cấu hình, kiểm chứng và quá tải

      1. Spring chọn bean nào cho @Async có tên và vì sao lời gọi this.method() có thể bỏ qua cấu hình đó?
      2. Cần bố trí CountDownLatch và Future theo thứ tự nào để chứng minh FAST chạy xong khi SLOW vẫn bị giữ?
      3. Khi slowExecutor đầy queue, AbortPolicy và CallerRunsPolicy gây hậu quả khác nhau ra sao cho thread gọi và SLO?
      4. Khi shutdown hoặc lỗi Future, cần quan sát và dọn tài nguyên như thế nào để không mất việc quan trọng?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Nhận diện head-of-line blocking | Vẽ luồng ba nhóm công việc và giải thích vì sao FAST chờ trong một executor chung. |
      | Thiết kế cách ly executor | Chọn nhóm cần pool riêng dựa trên CPU/I/O, deadline và tài nguyên dùng chung; chỉ ra phần không được cách ly. |
      | Định tuyến Spring @Async | Khai báo bean có tên rõ, gọi qua proxy và xác minh đúng pool bằng prefix thread hoặc bean identity. |
      | Kiểm chứng thực thi | Dùng latch giữ nhóm SLOW, dùng Future chờ FAST hữu hạn và giải thích từng quan sát. |
      | Thiết kế backpressure và lifecycle | Chọn queue/rejection/shutdown theo hậu quả nghiệp vụ, giải thích đường failure và retry. |
  - slug: resource-configuration-002
    title: Chọn số luồng cho tác vụ nặng CPU và tác vụ thường chờ nhập xuất
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Sizing worker theo bản chất tải.
    problemSolved: Lấy số CPU làm kích cỡ mọi I/O pool.
    mechanism: CPU budget và W/C heuristic. Cấp bao nhiêu worker cho CPU và I/O.
    applicationValue: Throughput, CPU quota, JDBC pending và rejection.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Chọn số luồng cho tác vụ nặng CPU và tác vụ thường chờ nhập xuất**

      Số lõi CPU không trực tiếp quyết định số worker phù hợp cho mọi tác vụ. Bài học giúp tách CPU-bound, blocking I/O và non-blocking I/O, dùng ngân sách CPU cùng tỷ lệ chờ/tính toán để đề xuất cấu hình ban đầu, rồi kiểm tra giới hạn connection và hiện tượng executor xếp queue trước khi mở rộng tới max. Các thí nghiệm Java 17 cho thấy kết quả và từ chối có kiểm soát, không dùng thời gian sleep làm benchmark.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Bản chất công việc và công thức sizing

      1. Tại sao tăng từ bốn lên bốn mươi worker có thể làm tác vụ thuần CPU chậm đi dù lượng việc không đổi?
      2. Tác vụ JDBC blocking và tác vụ WebFlux non-blocking khác nhau thế nào về số thread bị giữ?
      3. Với P=4, U=0,8, W=80 ms và C=20 ms, heuristic sizing cho giá trị nào và giới hạn áp dụng của nó là gì?
      4. Dùng Little's Law cho phạm vi toàn hệ thống khác gì với việc tính số worker đang bận?

      ### Đưa sizing vào Spring và xác nhận

      1. Tại sao maxPoolSize lớn không giúp mở rộng vượt core nếu queueCapacity còn rộng?
      2. Khi có nhiều executor CPU-bound trong một JVM, cần chia tổng ngân sách CPU như thế nào?
      3. Phải đo những chỉ số nào của executor và dependency trước khi tăng blockingIoExecutor?
      4. Trong thí nghiệm Java 17, latch và queue một vị trí chứng minh rejection bằng cách nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân loại workload | Đối chiếu CPU time, blocking I/O và event-loop để chọn cách cấp phát thread thích hợp. |
      | Tính điểm bắt đầu | Tính P×U×(1+W/C), diễn giải kết quả như giả thuyết và nêu giới hạn connection/CPU. |
      | Cấu hình pool theo nhóm | Tạo cpuExecutor và blockingIoExecutor có bounded queue và tên bean rõ ràng. |
      | Kiểm chứng độ bão hòa | Phân tích throughput, p95/p99, CPU quota, queue depth và JDBC pending khi thay số worker. |
      | Thử nghiệm quá tải | Dự đoán và xác nhận hành vi từ chối với một worker đang bị giữ bằng CountDownLatch. |
  - slug: resource-configuration-003
    title: Giới hạn theo số kết nối cơ sở dữ liệu hoặc dịch vụ đích
    status: WRITTEN
    difficult: ADVANCED
    focus: Bảo vệ DB và HTTP.
    problemSolved: Tăng worker khi DB connection đã cạn.
    mechanism: HikariCP, Semaphore và HTTP pool. Cấp bao nhiêu slot cho từng dependency.
    applicationValue: Hikari pending, timeout và permit giới hạn.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Giới hạn theo số kết nối cơ sở dữ liệu hoặc dịch vụ đích**

      Một executor có nhiều thread vẫn có thể dừng tiến triển vì pool JDBC hoặc dịch vụ HTTP chỉ cấp một số slot hữu hạn. Bài này đào sâu HikariCP, transaction dài, connection acquisition, quota per-instance và cluster, semaphore/bulkhead và HTTP/2 multiplexing. Người học học cách đặt giới hạn sát tài nguyên, giải phóng permit đúng cả khi lỗi, và xác định nguyên nhân bằng metrics thay vì tăng connection hoặc worker theo cảm tính.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Ngân sách tài nguyên và giao dịch

      1. maximumPoolSize và connectionTimeout của HikariCP giới hạn những sự kiện nào, và vì sao không tương đương SQL mỗi giây?
      2. Một transaction mở trong lúc gọi HTTP chậm ảnh hưởng thế nào tới connection active/pending?
      3. Lập ngân sách kết nối từ giới hạn database, phần dự phòng, số datasource và số replica cực đại ra sao?
      4. Vì sao giới hạn bốn task reportDbExecutor không đảm bảo luôn còn tám connection cho luồng khác?

      ### Dịch vụ HTTP và cách bảo vệ đúng ranh giới

      1. HTTP connection count khác request in-flight và rate quota như thế nào, nhất là khi có HTTP/2?
      2. Trong ví dụ Semaphore hai permit, latch và tryAcquire chứng minh giới hạn hoạt động như thế nào?
      3. Tại sao không thể release semaphore trong finally ngay sau khi trả một Mono chưa subscribe?
      4. Cần nhìn metric nào để phân biệt connection leak, query/lock chậm và quá tải dịch vụ đích?
      5. Với năm pod mỗi pod có sáu permit, làm sao tránh nhầm giới hạn cục bộ với hạn mức toàn cluster?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Lập ngân sách kết nối | Tính tổng trần connections theo datasource và replica, kèm dự phòng cho workload khác. |
      | Chẩn đoán HikariCP | Phân tích active, idle, pending, acquisition timeout, transaction length và DB lock wait. |
      | Đặt bulkhead đúng biên | Bao lời gọi blocking bằng permit và finally; giải thích cách giữ permit tới terminal/cancel khi reactive. |
      | Phân biệt giới hạn HTTP | Chọn connection pool, request concurrency hay rate limiter theo hợp đồng của downstream. |
      | Thiết kế ứng phó sự cố | Đề xuất timeout, retry budget, transaction scope và test đa instance để bảo vệ dependency. |
  - slug: resource-configuration-004
    title: Chọn sức chứa hàng đợi theo bộ nhớ và thời gian chờ cho phép
    status: WRITTEN
    difficult: ADVANCED
    focus: Giới hạn queue theo ngân sách.
    problemSolved: Tăng queue để che overload bền vững.
    mechanism: Retained heap, queue wait, core-queue-max. Queue tối đa bao nhiêu task.
    applicationValue: Heap retained, queue p99 và task rejection.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Chọn sức chứa hàng đợi theo bộ nhớ và thời gian chờ cho phép**

      QueueCapacity là một quyết định về bộ nhớ và độ trễ, không chỉ là tham số tránh rejection. Bài học hướng dẫn đo retained heap của task đang chờ, chia ngân sách queue từ SLO, ước tính Q_memory và Q_time, rồi dùng giá trị nhỏ hơn làm ứng viên thử tải. Người học cũng hiểu queue-before-grow của ThreadPoolExecutor, sự khác biệt SynchronousQueue, hậu quả khi tải đến vượt năng lực xử lý, và cách kiểm chứng bằng chương trình Java 17 có latch.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Bộ nhớ và thời gian chờ

      1. Một Runnable xếp hàng có thể giữ những object graph nào ngoài bản thân phần tử queue?
      2. Từ 20 MiB ngân sách heap và 96 KiB retained/task, tính Q_memory như thế nào?
      3. Từ thông lượng hiệu dụng 80 task/s và ngân sách wait 0,2 giây, ước lượng Q_time ra sao và vì sao không bảo đảm p99?
      4. Vì sao phải lấy min(Q_memory,Q_time) thay vì chọn queue theo dung lượng heap lớn nhất?

      ### Hành vi executor và xử lý overload

      1. corePoolSize, queueCapacity, maxPoolSize quyết định thứ tự nhận task và rejection ra sao?
      2. SynchronousQueue ở queueCapacity=0 khác hàng đợi có một vị trí thế nào?
      3. Nếu λ_in lớn hơn tốc độ hoàn thành lâu dài, việc tăng queue chỉ thay đổi thời gian chạm trần như thế nào?
      4. Một Future.get(timeout) có đặt timeout cho thời gian tác vụ tồn tại trong queue không?
      5. Trong BoundedQueueDemo, tại sao task thứ tư bị từ chối chính xác khi worker đầu đang chờ latch?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Ước lượng retained memory | Nhận diện payload bị closure giữ và tính giới hạn task từ ngân sách MiB/KiB. |
      | Tính ngân sách queue wait | Suy ra giới hạn thời gian từ SLO, dùng throughput đã đo và phân biệt mean với p99. |
      | Đặt queueCapacity có căn cứ | Tính Q_candidate theo cả bộ nhớ và độ trễ, giải thích vai trò core/max và SynchronousQueue. |
      | Kiểm thử overload | Dùng latch và bounded queue chứng minh các trạng thái queued/rejected có thứ tự xác định. |
      | Thiết kế xử lý quá tải | Chọn backpressure, deadline, cancellation và job persistence đúng hậu quả nghiệp vụ. |
  - slug: resource-configuration-005
    title: Phân biệt giới hạn đồng thời với giới hạn số yêu cầu theo thời gian
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Phân biệt rate và concurrency.
    problemSolved: Đồng nhất mười permit với mười RPS.
    mechanism: Semaphore, fixed/sliding window, token bucket. Dùng giới hạn đồng thời hay số lượt theo thời gian.
    applicationValue: In-flight, quota window và mã lỗi 429/503.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phân biệt giới hạn đồng thời với giới hạn số yêu cầu theo thời gian**

      Concurrency limit và rate limit giải quyết hai vấn đề khác nhau nhưng thường bị đặt cùng một tên “giới hạn tải”. Bài này giúp người học phân biệt số operation in-flight với số lượt được cấp theo thời gian, so sánh semaphore/bulkhead với fixed window, sliding window và token bucket, rồi dùng Little's Law để giải thích tại sao cùng RPS có thể tạo số request đang chạy rất khác. Nội dung còn hướng dẫn đặt mã HTTP 429/503, quyết định local/global quota và kiểm thử hai lớp độc lập.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hai đại lượng và các thuật toán

      1. Tại sao Semaphore(10) không đồng nghĩa tối đa mười request mỗi giây?
      2. Định luật Little giải thích quan hệ giữa request rate, thời gian xử lý và in-flight trung bình ra sao?
      3. Fixed window có thể tạo burst ở ranh giới hai cửa sổ như thế nào?
      4. Token bucket khác sliding window ở ý nghĩa refill, burst capacity và thời điểm cấp quyền ra sao?
      5. Tại sao ThreadPoolTaskExecutor chỉ giới hạn worker/queue mà chưa phải rate limiter?

      ### Ranh giới Spring và trường hợp phân tán

      1. Permit nên được lấy và trả ở mốc nào nếu muốn giới hạn operation thật sự đang chạy thay vì task còn trong queue?
      2. Cần dùng cơ chế gì khi API đối tác giới hạn requests/giây trên toàn cluster nhưng mỗi pod đang giữ rate state cục bộ?
      3. Khi nào 429 diễn đạt lỗi hợp đồng quota tốt hơn 503 do server bão hòa?
      4. Thiết kế hai test nào để riêng rẽ chứng minh concurrency cap và time-window quota?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân biệt loại giới hạn | Nêu đại lượng, đơn vị, phạm vi và sự kiện lấy/trả quyền của concurrency so với rate. |
      | Áp dụng định luật Little | Tính in-flight trung bình từ throughput và thời gian giữ tài nguyên mà không coi đó là hard cap. |
      | Chọn thuật toán rate | Giải thích burst biên fixed window và cấu hình cơ bản của token bucket, sliding window. |
      | Kết hợp Spring bulkhead và rate | Đặt semaphore/Resilience4j ở đúng boundary, xử lý overload qua 429/503 và timeout. |
      | Kiểm chứng nhiều instance | Tính tổng cap/quota cục bộ, đề xuất state chia sẻ và test kiểm soát timing. |
  - slug: resource-configuration-006
    title: Ước lượng công suất rồi kiểm chứng bằng phép đo tải
    status: WRITTEN
    difficult: ADVANCED
    focus: Đo và xác nhận công suất.
    problemSolved: Lấy HTTP 202 làm bằng chứng job hoàn tất.
    mechanism: Little-style sizing, k6, goodput. Cấu hình nào đáp ứng SLO ở tải mục tiêu.
    applicationValue: Offered/accepted/completed, p95/p99 và dropped iterations.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Ước lượng công suất rồi kiểm chứng bằng phép đo tải**

      Một bảng cấu hình thread/queue mới chỉ là giả thuyết năng lực. Bài học chuyển các đại lượng arrival, accepted, completed, worker time và queue wait thành phép ước lượng định lượng, sau đó thiết kế thử tải có warm-up, steady state, burst, overload và phục hồi. Người học sử dụng k6 constant-arrival-rate, đối chiếu goodput với p95/p99, dropped iterations và đặc biệt không nhầm HTTP 202 với job đã hoàn tất.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Mô hình hóa công suất

      1. Offered rate, accepted rate và completed throughput khác nhau như thế nào khi executor đang quá tải?
      2. Với 100 job/s, S=80 ms và worker utilization mục tiêu 70%, vì sao điểm xuất phát là mười hai worker?
      3. Công suất lý tưởng m/S khác công suất đáp ứng SLO dưới tải thực ở đâu?
      4. Dự báo backlog từ burst có ý nghĩa gì và vì sao queue chứa đủ chưa chứng minh đạt deadline?

      ### Thiết kế và diễn giải load test

      1. Vì sao k6 constant-arrival-rate giúp bộc lộ overload mà vòng kín theo thời gian response có thể che đi?
      2. Cần theo dõi dropped_iterations và tài nguyên load generator để tránh kết luận sai như thế nào?
      3. Nếu endpoint trả HTTP 202 rất nhanh nhưng task hoàn tất rất chậm, chỉ số nào phải bổ sung?
      4. Làm sao phân biệt queue saturation, CPU quota và JDBC pending qua biểu đồ cùng timestamp?
      5. Những điều kiện nào chứng minh một cấu hình vừa đủ tại tải mục tiêu nhưng vẫn phục hồi sau burst?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Xây dựng giả thuyết capacity | Tính busyWorkers≈λ×S, đề xuất thread count theo utilization và giải thích giả định. |
      | Thiết kế workload kiểm thử | Lập các pha warm-up, baseline, steady, burst, overload, recovery cùng tiêu chí SLO. |
      | Sử dụng k6 đúng đơn vị | Cấu hình constant-arrival-rate, đọc actual iterations và dropped_iterations. |
      | Đo công suất hữu ích | Đối chiếu accepted/completed, job end-to-end p95/p99, rejection, CPU và dependency saturation. |
      | Ra quyết định tuning | Chỉ ra bottleneck, thử một thay đổi có đối chứng và xác nhận kết quả có thể lặp lại. |
  - slug: resource-configuration-007
    title: Cấu hình bằng @Bean hoặc namespace task trong XML
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Cấu hình bean Java hoặc XML.
    problemSolved: Chỉ có bean mà quên enable annotation.
    mechanism: '@Bean, task namespace, annotation-driven. Tạo và inject executor/scheduler bằng cách nào.'
    applicationValue: Bean type, XML/Java parity và Future.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Cấu hình bằng @Bean hoặc namespace task trong XML**

      Spring Framework cho phép định nghĩa tài nguyên thực thi và lên lịch bằng @Bean hoặc task namespace trong XML. Bài học đối chiếu TaskExecutor với TaskScheduler, chỉ rõ việc tạo bean khác việc bật @Async/@Scheduled, và xây một ví dụ trong đó cùng WorkService chạy qua Java config hoặc XML context. Người học cũng kiểm chứng bean name, DI, lifecycle, shutdown và lỗi khai báo trùng tài nguyên giữa hai đường cấu hình.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Bean resource và kích hoạt annotation

      1. TaskExecutor khác TaskScheduler ở thời điểm nhận và kích hoạt công việc như thế nào?
      2. Khác biệt giữa khai báo ThreadPoolTaskExecutor bean và @EnableAsync là gì?
      3. Các phần tử task:executor, task:scheduler và task:annotation-driven đảm nhiệm phần việc riêng nào trong XML?
      4. pool-size="2-4" và queue-capacity="8" ánh xạ ra sao sang cấu hình core/max/queue của Java?

      ### Wiring và kiểm chứng hai cách khai báo

      1. Cùng một WorkService có thể nhận TaskExecutor từ @Bean hoặc từ <constructor-arg> của XML bằng cách nào?
      2. Vì sao cần tránh vừa import XML vừa khai báo Java bean trùng id trong cùng context?
      3. Điều gì xảy ra khi @Async gọi nội bộ this.method() dù executor bean đã tồn tại?
      4. Làm sao kiểm tra bean và cấu hình shutdown mà không mặc định việc đã submit sẽ hoàn tất?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân biệt abstraction | Chọn TaskExecutor cho thực thi tác vụ và TaskScheduler cho kích hoạt có lịch. |
      | Tạo tài nguyên Java | Khai báo @Bean ThreadPoolTaskExecutor/TaskScheduler với core, max, queue, tên và lifecycle. |
      | Tạo tài nguyên XML | Viết task namespace/schema và cấu hình executor, scheduler, annotation-driven hợp lệ. |
      | Chứng minh DI độc lập cấu hình | Chạy cùng service với hai context, quan sát bean type và Future completion. |
      | Phát hiện lỗi wiring | Xử lý thiếu enable annotation, self-invocation, duplicate bean và khác biệt shutdown. |
  - slug: resource-configuration-008
    title: Đưa tham số ra cấu hình ngoài và kiểm tra giá trị không hợp lệ
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Externalize và validate pool.
    problemSolved: Chỉ validate từng số mà quên max lớn hơn core.
    mechanism: '@ConfigurationProperties, @AssertTrue, Environment. Khóa nào bind vào bean và giá trị nào bị từ chối.'
    applicationValue: Startup failure case, effective property values.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Đưa tham số ra cấu hình ngoài và kiểm tra giá trị không hợp lệ**

      Các thông số core/max/queue thường thay đổi theo môi trường; nếu hard-code và không validate, một cấu hình sai có thể chỉ gây sự cố khi tăng tải. Bài học giải thích Spring Boot @ConfigurationProperties với record và Jakarta Bean Validation, kiểm tra quan hệ max>=core, cơ chế profile/CLI/environment override, và đường Environment thủ công cho Spring Framework thuần. Người học thực hành trường hợp valid/invalid, đọc lỗi startup và phân biệt validation cấu hình với quá tải runtime.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Binding, ràng buộc và nguồn giá trị

      1. Vì sao @ConfigurationProperties record thuận tiện hơn nhiều @Value rời rạc cho một executor?
      2. Cần kiểm tra những miền giá trị nào của core, max, queue và keepAlive, và vì sao max>=core là ràng buộc liên trường?
      3. Trong ví dụ Spring Boot, @Validated cùng @Min/@Max/@AssertTrue cần dependency nào để chạy validation thật?
      4. Placeholder APP_IO_CORE_POOL_SIZE và relaxed-binding env key APP_EXECUTOR_IO_COREPOOLSIZE khác nhau như thế nào?

      ### Đảm bảo khởi động và hiệu lực cấu hình

      1. Cấu hình queueCapacity=0 có hợp lệ về API không và ứng dụng có thể cấm nó theo chính sách riêng khi nào?
      2. Khi CLI, profile và application.yml cung cấp cùng một khóa, phải tìm giá trị hiệu lực cuối như thế nào?
      3. Spring Framework thuần dùng Environment/getRequiredProperty khác Boot auto binding ở đâu?
      4. Muốn chứng minh cấu hình sai khiến context không khởi động, test cần kiểm tra điều gì thay vì chỉ gọi một getter?
      5. Vì sao sửa YAML sau khi bean đã khởi tạo chưa có nghĩa executor được cập nhật động?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Thiết kế schema cấu hình | Tổ chức prefix, default và kiểu cho core/max/queue/keepAlive, phân biệt nguồn cấu hình. |
      | Thực hiện validation | Áp dụng @Min, @Max, @NotBlank và kiểm tra max>=core bằng @AssertTrue. |
      | Ánh xạ Spring Boot properties | Bind record qua @EnableConfigurationProperties và tạo ThreadPoolTaskExecutor. |
      | Hỗ trợ Spring thuần | Đọc Environment và fail-fast khi thiếu hoặc sai kiểu/quan hệ. |
      | Kiểm thử cấu hình sai | Chạy context với giá trị invalid, quan sát startup failure và xác minh runtime bean dùng giá trị cuối. |
  - slug: resource-configuration-009
    title: Phân biệt cấu hình Spring Framework với tự động cấu hình Spring Boot
    status: WRITTEN
    difficult: ADVANCED
    focus: Phân biệt Framework với Boot.
    problemSolved: Đổi spring.task.* và tưởng custom bean tự đổi.
    mechanism: Auto-config conditions, bean naming, virtual threads. Bean nào được tạo, được chọn và nhận property nào.
    applicationValue: Bean listing, conditions report, thread prefix.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Phân biệt cấu hình Spring Framework với tự động cấu hình Spring Boot**

      Spring Framework tạo và quản lý bean theo cấu hình ứng dụng; Spring Boot có thể tự tạo executor/scheduler khi thỏa điều kiện. Bài này giúp lần theo @Async/@Scheduled tới bean thực, phân biệt taskExecutor và applicationTaskExecutor, kiểm tra @ConditionalOnMissingBean và condition report, nhận diện trường hợp custom executor làm Boot back off, và đối chiếu virtual threads với pool platform threads. Người học học cách xác định nguồn cấu hình có hiệu lực và lifecycle thay vì phỏng đoán từ application.yml.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Phân tầng và điều kiện auto-configuration

      1. Bốn việc tạo bean, bật annotation, chọn executor và đặt pool size khác nhau như thế nào?
      2. Trong Spring Framework thuần, @EnableAsync tìm executor mặc định theo cơ chế nào khi không có bean được chỉ định?
      3. Khi một custom Executor xuất hiện, @ConditionalOnMissingBean của Boot có thể khiến applicationTaskExecutor biến mất như thế nào?
      4. Vai trò của bean taskExecutor và applicationTaskExecutor khác nhau ra sao với @Async và Spring MVC async?

      ### Truy nguồn cấu hình và hành vi runtime

      1. Vì sao đổi spring.task.execution.pool.core-size không tự thay bean domainExecutor được tạo bằng setter?
      2. Condition evaluation report và ApplicationContext bean listing giúp xác định nguyên nhân auto-config back off ra sao?
      3. Khi bật virtual threads trên Java 21+, loại executor/scheduler có thể đổi và property nào không còn đúng nghĩa pool platform threads?
      4. Bean do Spring quản lý khác local Executors.newFixedThreadPool ở trách nhiệm shutdown ra sao?
      5. Bạn kiểm tra đường annotation tới thread và transaction boundary như thế nào khi production khác môi trường test?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân biệt trách nhiệm Spring/Boot | Giải thích bean definition của Framework và auto-configuration theo điều kiện của Boot. |
      | Truy executor thực tế | Đối chiếu @Async qualifier, AsyncConfigurer, taskExecutor và applicationTaskExecutor theo integration. |
      | Phân tích điều kiện Boot | Dùng beans/conditions report xác định custom Executor làm auto-config back off hay không. |
      | Giải thích virtual threads | So sánh SimpleAsyncTaskExecutor/virtual scheduler với ThreadPoolTaskExecutor và các giới hạn downstream. |
      | Kiểm chứng hiệu lực và vòng đời | Quan sát runtime class/core/max/thread prefix, property source và chính sách shutdown. |
- slug: overload-rejection
  title: Quá tải và từ chối
  childs:
  - slug: overload-rejection-001
    title: Những tình huống bộ thực thi từ chối tác vụ
    status: WRITTEN
    difficult: BASIC
    focus: Khi nào task bị từ chối?.
    problemSolved: Nhầm lỗi chạy task với reject.
    mechanism: core → queue → max → reject; shutdown. Bão hòa do I/O, burst, shutdown.
    applicationValue: Giải thích tình huống rejection và chẩn đoán.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Những tình huống bộ thực thi từ chối tác vụ**

      Bài học giúp người đọc nhận ra chính xác lúc nào lời gọi gửi việc đến `ThreadPoolTaskExecutor` không được chấp nhận. Khi nắm thứ tự core → queue → max, trường hợp queue không chờ và trạng thái shutdown, người học có thể xác định nguyên nhân thay vì tăng số luồng theo cảm tính.

      Phần thực nghiệm và các tình huống I/O, retry, starvation còn cho thấy việc không có exception không đồng nghĩa tác vụ đã chạy, đồng thời đặt nền cho các chính sách xử lý cụ thể trong chương.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Điều kiện phát sinh từ chối

      1. Vì sao pool thường đưa task vào queue sau khi đạt core thay vì lập tức tăng đến `maxPoolSize`?
      2. Trong cấu hình core=2, max=4, queueCapacity=2, khi sáu task chưa kết thúc thì task thứ bảy sẽ đi qua nhánh nào?
      3. Tại sao executor đã shutdown vẫn có thể từ chối một task dù hàng đợi chưa đầy?
      4. Khi `queueCapacity=0` sử dụng `SynchronousQueue`, điều kiện nào cho phép nhận thêm task và khi nào phải từ chối?

      ### Phân biệt hiện tượng khi vận hành

      1. Vì sao CPU thấp nhưng `activeCount` cao và queue đầy vẫn có thể dẫn đến rejection?
      2. Làm cách nào phân biệt một task đã được nhận rồi ném exception với một task bị từ chối ngay lúc submit?
      3. Tại sao tăng queue lên mức rất lớn có thể che tín hiệu từ chối nhưng khiến thời gian chờ và RAM tăng?

      ### Kiểm chứng và xử lý an toàn

      1. Dùng `CountDownLatch` như thế nào để giữ worker bận và chứng minh task mới bị từ chối một cách xác định?
      2. Khi nhận lỗi từ chối, cần đo những chỉ số nào và lựa chọn phản hồi nào để tránh retry storm hoặc mất job?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Mô tả admission | Vẽ và giải thích chính xác trình tự core, queue, max, rejection cho một cấu hình executor hữu hạn. |
      | Dự đoán sự cố | Tính được mốc task bắt đầu bị từ chối khi worker bị giữ, kể cả với queueCapacity bằng 0. |
      | Phân loại nguyên nhân | Tách bão hòa, shutdown, lỗi trong worker, timeout và starvation bằng tín hiệu quan sát phù hợp. |
      | Kiểm chứng hành vi | Dựng được thí nghiệm Java 17 có latch và đối chiếu exception tại nơi submit. |
      | Đề xuất ứng xử | Giải thích lựa chọn fail-fast, backpressure hoặc lưu job bền vững theo yêu cầu không mất việc. |
  - slug: overload-rejection-002
    title: RejectedExecutionHandler và TaskRejectedException
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: JDK và Spring báo rejection thế nào?.
    problemSolved: Handler silent drop che tín hiệu.
    mechanism: RejectedExecutionHandler; TaskRejectedException. Bốn handler và @Async submit.
    applicationValue: Chọn handler, catch đúng lớp ngoại lệ.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **RejectedExecutionHandler và TaskRejectedException**

      Bài này làm rõ `RejectedExecutionHandler` quyết định làm gì với task mà JDK `ThreadPoolExecutor` không nhận, còn `TaskRejectedException` thể hiện sự từ chối qua hợp đồng Spring. Phân biệt hai lớp này giúp đặt `catch` đúng vị trí và tránh nhầm rejection đồng bộ với exception của nghiệp vụ trong một `Future`.

      Qua các policy JDK, ví dụ Spring và `@Async`, người học học cách chọn semantics báo lỗi, chạy trên caller hoặc bỏ việc theo hậu quả thật đối với job và người chờ.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng JDK và Spring

      1. Khi nào `ThreadPoolExecutor` gọi `RejectedExecutionHandler` và handler nhận loại task nào?
      2. `TaskRejectedException` liên quan thế nào tới `RejectedExecutionException`, và trường hợp nào tầng Spring chuyển đổi ngoại lệ?
      3. Tại sao không thể mặc nhiên áp dụng bốn handler JDK cho mọi triển khai `TaskExecutor` của Spring?

      ### Policy và Future

      1. Bốn chính sách `AbortPolicy`, `CallerRunsPolicy`, `DiscardPolicy` và `DiscardOldestPolicy` khác nhau về cách tiếp nhận hoặc bỏ task ra sao?
      2. Khi `submit` tạo `FutureTask`, vì sao một handler trả về bình thường vẫn có thể làm `Future` chờ mãi?
      3. Trong trường hợp executor đã shutdown, `CallerRunsPolicy` có đảm bảo chạy task hay báo lỗi không?

      ### Sử dụng trong ứng dụng

      1. Tại sao caller của phương thức `@Async` cần xử lý rejection riêng với lỗi hoàn tất bất đồng bộ của Future?
      2. Một custom rejection handler chỉ ghi counter rồi trả về sẽ tạo rủi ro hợp đồng tiếp nhận nào?
      3. Bạn sẽ instrument và kiểm thử handler thế nào để phân biệt refused, caller-runs và silently dropped?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Giải thích API | Phân biệt đúng vị trí và phạm vi của `RejectedExecutionHandler`, `RejectedExecutionException` và `TaskRejectedException`. |
      | So sánh policy | Lập bảng hệ quả của bốn handler đối với caller, worker, queue và Future. |
      | Xử lý hai đường lỗi | Viết mã bắt rejection tại submit và theo dõi exception của task đã nhận qua Future/CompletableFuture. |
      | Cấu hình Spring | Chọn và cấu hình `setRejectedExecutionHandler` trên đúng bean `ThreadPoolTaskExecutor`. |
      | Kiểm thử hợp đồng | Dùng pool hữu hạn và latch để chứng minh kết quả của handler mà không dựa vào lịch chạy may rủi. |
  - slug: overload-rejection-003
    title: AbortPolicy báo lỗi tại điểm gửi tác vụ
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Abort tác vụ mới ở đâu?.
    problemSolved: Nuốt exception rồi trả accepted.
    mechanism: AbortPolicy; catch tại submit. 1 worker và 1 queue slot; Abort.
    applicationValue: Viết fail-fast và tái hiện rejection.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **AbortPolicy báo lỗi tại điểm gửi tác vụ**

      `AbortPolicy` giúp biến tình trạng pool hết sức chứa thành ngoại lệ quan sát được ngay tại lời gọi `execute` hoặc `submit`. Bài này cần thiết vì đặt `try/catch` bên trong task bị từ chối không bao giờ có tác dụng: task đó chưa được chạy.

      Người học thực hành trường hợp worker bận và queue đầy có `CountDownLatch`, so sánh exception JDK và Spring, rồi quyết định cách phản hồi HTTP hoặc đánh dấu job khi nhiệm vụ chưa được tiếp nhận.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Fail-fast tại ranh giới gửi việc

      1. Vì sao `AbortPolicy` ném exception trên caller mà không dừng cả pool hoặc huỷ các task đã nhận?
      2. Trường hợp nào `AbortPolicy` ném vì shutdown dù queue chưa đầy?
      3. Vì sao khối `catch` đặt trong thân Runnable không thể bắt rejection của chính Runnable đó?

      ### Thực nghiệm Java và Spring

      1. Với core=max=1 và queueCapacity=1, bạn dùng hai latch thế nào để task thứ ba chắc chắn bị từ chối?
      2. JDK `execute` ném kiểu nào, còn `ThreadPoolTaskExecutor` của Spring ném kiểu nào?
      3. Nếu `submit` bị từ chối, liệu caller có luôn nhận được một `Future` trước khi exception xuất hiện không?

      ### Quyết định sau lỗi

      1. Làm cách nào phân biệt `TaskRejectedException` lúc nộp với `ExecutionException` từ một `Callable` đã chạy?
      2. Khi API trả `202 Accepted`, vì sao việc đã bị AbortPolicy từ chối là dấu hiệu hợp đồng sai?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Bắt đúng exception | Viết `catch(TaskRejectedException)` ở caller Spring và không nhầm với exception trong worker. |
      | Tái hiện rejection | Chạy được kịch bản latch với một worker và một queue slot, dự đoán stdout và trạng thái queue. |
      | Phân biệt vòng đời task | Chỉ ra được các task đã được nhận vẫn tiếp tục, dù task mới bị AbortPolicy từ chối. |
      | Quyết định phản hồi | Chọn phản hồi 429/503 hoặc phương án lưu bền vững theo lý do quá tải và cam kết nghiệp vụ. |
      | Chẩn đoán cấu hình | Giải thích vì sao tăng max nhưng giữ queue rất lớn chưa chắc cải thiện khả năng tiếp nhận. |
  - slug: overload-rejection-004
    title: CallerRunsPolicy chuyển công việc sang luồng gọi và thay đổi độ trễ
    status: WRITTEN
    difficult: ADVANCED
    focus: Caller bị chặn ra sao?.
    problemSolved: Chặn HTTP thread; deadlock; shutdown drop.
    mechanism: CallerRunsPolicy; thực thi inline. Worker bận, queue đầy, caller tự chạy.
    applicationValue: Đo latency caller và chọn policy.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **CallerRunsPolicy chuyển công việc sang luồng gọi và thay đổi độ trễ**

      `CallerRunsPolicy` có thể giải quyết việc pool bão hòa bằng cách chạy task ngay trên thread đang submit. Cách này làm producer chậm lại, nhưng cũng có thể đẩy một tác vụ blocking vào HTTP request thread, scheduler hoặc event-loop, khiến độ trễ tăng mạnh đúng lúc hệ thống quá tải.

      Bài học giúp phân tích cả mặt lợi và rủi ro: giới hạn worker không còn là giới hạn tổng task đang chạy, thread-local/transaction thay đổi theo nhánh xử lý, có thể tự deadlock khi task chờ một tín hiệu từ caller, và handler vẫn có thể bỏ task khi executor shutdown.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Ngữ nghĩa và cơ chế backpressure

      1. Điều kiện nào khiến `CallerRunsPolicy` gọi trực tiếp `Runnable.run()` trên thread gửi việc?
      2. Vì sao một producer tuần tự bị giảm tốc khi `execute()` phải chờ task inline kết thúc?
      3. Tại sao pool `maxPoolSize=4` vẫn có thể có nhiều hơn bốn công việc đang chạy nếu nhiều HTTP caller cùng bị caller-runs?

      ### Rủi ro về latency và thread context

      1. Độ trễ `execute()` và p95/p99 HTTP thay đổi thế nào khi một task nặng chạy trên request thread?
      2. Transaction, MDC, SecurityContext hoặc ThreadLocal có thể mang ngữ nghĩa khác gì giữa worker và caller-runs?
      3. Tình huống nào có thể deadlock khi task bị chạy inline rồi đợi một latch mà caller dự định mở sau lời gọi `execute()`?

      ### Shutdown và kiểm chứng

      1. `CallerRunsPolicy` xử lý task mới ra sao khi executor đã shutdown, và vì sao một Future có thể mãi pending?
      2. Bạn dùng latch và kiểm tra danh tính `Thread.currentThread()` như thế nào để chứng minh task thực thi trên caller?
      3. Khi nào nên thay CallerRuns bằng admission control hoặc AbortPolicy để giữ deadline và giới hạn tổng concurrency?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Diễn giải nhánh caller | Chứng minh bằng code task bão hòa chạy đồng bộ trên thread submit, phân biệt với worker thông thường. |
      | Phân tích ảnh hưởng | Ước lượng tác động lên latency, HTTP threads, số task song song và các metric chỉ đếm worker. |
      | Phòng deadlock | Nhận diện được reentrancy, khóa và latch phụ thuộc caller gây tự chặn. |
      | Bảo vệ context | Giải thích sự khác biệt ThreadLocal/transaction/security giữa hai đường thực thi và nêu biện pháp kiểm thử. |
      | Chọn đúng policy | Đưa ra quyết định CallerRuns, AbortPolicy hoặc concurrency cap dựa trên deadline và rủi ro mất việc khi shutdown. |
  - slug: overload-rejection-005
    title: DiscardPolicy, DiscardOldestPolicy và nguy cơ mất công việc
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Tác vụ nào bị bỏ?.
    problemSolved: Mất việc cũ hoặc mới không báo.
    mechanism: DiscardPolicy; DiscardOldestPolicy; queue.poll. A chạy, B chờ, C mới đến.
    applicationValue: Chỉ ra task/Future mất trong mỗi policy.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **DiscardPolicy, DiscardOldestPolicy và nguy cơ mất công việc**

      Hai chính sách discard tưởng giúp tránh exception khi pool quá tải, nhưng có thể khiến hệ thống tin đã nhận việc trong khi một job không bao giờ chạy. `DiscardPolicy` loại task mới; `DiscardOldestPolicy` lấy phần tử đầu hàng đợi rồi thử nhận task mới, không biết việc nào quan trọng hơn.

      Bài học dùng một worker và queue hữu hạn để quan sát task bị giữ lại hoặc bị bỏ, cùng trạng thái của `Future` liên quan. Nhờ vậy người học biết khi nào policy bỏ việc có thể được chấp nhận và khi nào phải thay bằng rejection minh bạch hoặc kho job bền vững.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Tác động của hai handler

      1. Trong tình huống A đang chạy, B chờ trong queue, C vừa đến lúc đầy, `DiscardPolicy` bỏ task nào và vì sao?
      2. Cùng tình huống đó, `DiscardOldestPolicy` thao tác `poll()` phần tử nào rồi thử gửi lại task nào?
      3. Vì sao gọi `DiscardOldest` không bảo đảm xóa task đến sớm nhất đối với queue có thứ tự ưu tiên?
      4. Điều gì xảy ra nếu DiscardOldest retry trên queue không có phần tử chờ như `SynchronousQueue`?

      ### Mất tín hiệu khi có Future

      1. Vì sao Future của task bị discard có thể còn `isDone()==false` dù lời gọi `submit` đã trả về?
      2. Vì sao `Future.get(timeout)` chỉ giới hạn thời gian chờ mà không phát lại task bị bỏ?
      3. `execute` trả về bình thường có đủ bằng chứng task đã accepted hoặc completed không?

      ### Chính sách nghiệp vụ

      1. Trong trường hợp cache refresh có thể bỏ, ứng dụng cần định nghĩa những tín hiệu và điều kiện nào trước khi dùng policy drop?
      2. Nếu phải giữ job thanh toán hay đơn hàng, bạn chọn phản hồi hoặc cơ chế bền vững nào thay cho DiscardPolicy?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Dự đoán task thất lạc | Dùng cấu hình một worker và queue một chỗ để chỉ ra task mới hay task cũ bị loại cho từng policy. |
      | Giải thích Future pending | Chứng minh việc `poll` khỏi queue không tự cancel một `FutureTask` và nêu hậu quả cho người chờ. |
      | Thiết kế quan sát loss | Phân biệt các metric submitted, accepted, dropped, replaced, started và completed. |
      | Chọn policy có trách nhiệm | Đánh giá khi nào việc drop được phép và đề xuất AbortPolicy hoặc durable job khi không chấp nhận mất việc. |
      | Kiểm thử kiểm soát | Chạy ví dụ latch có `Future.isDone()`, `cancel(false)` và bounded wait để không làm suite treo. |
  - slug: overload-rejection-006
    title: Không để Future chờ vô hạn do chính sách loại bỏ không hoàn tất tác vụ
    status: WRITTEN
    difficult: ADVANCED
    focus: Future có kết thúc không?.
    problemSolved: Future treo hoặc side effect sau timeout.
    mechanism: FutureTask; cancel; get timeout; orTimeout. Future của task bị drop vẫn pending.
    applicationValue: Thiết kế đường terminal state cho future.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Không để Future chờ vô hạn do chính sách loại bỏ không hoàn tất tác vụ**

      Khi executor loại một `FutureTask` mà không chạy hoặc hủy, `submit` vẫn có thể trả Future còn pending mãi. Bài học đưa người học từ việc nhận diện silent discard sang thiết kế một hợp đồng **có kết thúc ở mọi nhánh**: thành công, thực thi lỗi, rejection, cancellation, timeout và shutdown.

      Các ví dụ Java/Spring cho thấy `get(timeout)` chỉ ngừng chờ, còn `CompletableFuture.orTimeout()` hoàn tất exceptionally trên chính future nhưng không dừng side effect đã bắt đầu. Từ đó người học biết khi nào cần cancel hoặc completeExceptionally và vì sao phải theo dõi job bền vững khi có retry.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Vòng đời và trạng thái Future

      1. Vì sao một `FutureTask` bị DiscardPolicy bỏ có thể vẫn báo `isDone()==false` vô thời hạn?
      2. Sự khác biệt nào giữa Future đang queue, đang chạy, completed, cancelled và bị thất lạc không có terminal state?
      3. `DiscardOldestPolicy` có thể khiến Future của tác vụ cũ bị mồ côi như thế nào?

      ### Timeout, cancellation và lỗi

      1. `future.get(timeout)` khác `CompletableFuture.orTimeout()` về trạng thái cuối của đối tượng Future ra sao?
      2. Vì sao `Future.cancel(true)` không bảo đảm worker dừng ngay hoặc rollback một side effect đã ghi?
      3. Một gateway Spring nên hoàn tất `CompletableFuture` ra sao khi `ThreadPoolTaskExecutor.execute` từ chối, khi task thành công và khi body ném lỗi?

      ### Khôi phục và kiểm thử

      1. Nếu một future đã timeout nhưng task vẫn tiếp tục ghi database, phải thiết kế idempotency hoặc trạng thái job thế nào?
      2. Khi `shutdownNow()` trả về task đang chờ, trường hợp nào bạn có thể cancel Future và trường hợp nào wrapper không thể xử lý bằng cast đơn giản?
      3. Dùng latch và bounded `get` như thế nào để chứng minh không còn người chờ Future vô hạn?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân tích trạng thái | Vẽ vòng đời Future với accepted, pending, done, failed, cancelled và silent discard. |
      | Giới hạn chờ | Chọn và giải thích đúng `get(timeout)`, `orTimeout`, `cancel` và `completeExceptionally` theo khả năng tác động lên task thật. |
      | Viết gateway rõ kết quả | Tách nhánh submit-rejected khỏi execution-failed để Future đạt trạng thái terminal quan sát được. |
      | Kiểm thử orphan Future | Dựng thí nghiệm một worker, một queue, latch, `get(timeout)` và assertions về `isDone`/`isCancelled`. |
      | Xử lý vòng đời bền vững | Giải thích vì sao timeout trong RAM không thay thế durable job state, retry idempotent hay shutdown recovery. |
  - slug: overload-rejection-007
    title: Chọn trả lỗi, hạn chế nhận thêm hoặc lưu công việc bền vững
    status: WRITTEN
    difficult: ADVANCED
    focus: Nên nhận job theo hợp đồng nào?.
    problemSolved: Hứa durable nhưng chỉ queue RAM.
    mechanism: 429/503/202; semaphore; outbox. API report, multi-tenant, broker sau DB commit.
    applicationValue: Chọn admission hoặc durable job theo SLO.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Chọn trả lỗi, hạn chế nhận thêm hoặc lưu công việc bền vững**

      Bài này chuyển trọng tâm từ handler của một executor sang hợp đồng nhận việc của cả dịch vụ. Khi tốc độ đến vượt khả năng xử lý, ứng dụng phải quyết định trả 429/503, giảm số việc được tiếp nhận bằng rate/concurrency/backlog limit, hoặc ghi job vào DB/broker trước khi phản hồi 202.

      Người học cũng theo dõi các cửa sổ crash giữa commit DB và publish broker, hiểu transactional outbox, trạng thái job, lease/ack, retry và idempotency để phân biệt 'đã nhận bền vững' với 'đang chờ trong RAM'.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng HTTP và tiếp nhận

      1. Tại sao request đã đến server không có nghĩa công việc được chấp nhận hoặc hoàn thành?
      2. Trong trường hợp nào `429 Too Many Requests` phù hợp hơn `503 Service Unavailable`?
      3. Khi nào API có thể trả `202 Accepted` và cần cung cấp job ID/trạng thái gì để hợp đồng đáng tin?

      ### Bảo vệ capacity

      1. Rate limit, semaphore giới hạn concurrent requests và queue backlog limit bảo vệ ba tài nguyên nào khác nhau?
      2. Vì sao tăng queue dài có thể làm job hết deadline dù chưa xuất hiện rejection?
      3. Nếu triển khai sáu replica, vì sao `Semaphore(10)` trên từng instance không tạo ra giới hạn toàn cụm là 10?

      ### Durability và recovery

      1. Vì sao ghi job vào DB rồi publish broker ở transaction riêng có thể gây mất thông điệp sau crash?
      2. Transactional outbox khép kín khoảng trống giữa job và event bằng cách ghi dữ liệu nào cùng transaction?
      3. Khi publisher phát lại message hoặc worker chết sau side effect nhưng trước ack, idempotency và lease giải quyết những rủi ro gì?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Thiết kế HTTP contract | Chọn đúng 429, 503 hoặc 202 và giải thích ranh giới client nhận trách nhiệm xử lý. |
      | Đặt admission cap | Thiết kế rate limit, concurrency permit và queue budget dựa trên SLO/deadline. |
      | Lưu công việc bền vững | Phác họa mô hình jobs + outbox + publisher + worker + status endpoint. |
      | Xử lý idempotency | Đề xuất ràng buộc tenant/idempotency key, dedupe, retry và chuyển trạng thái có điều kiện. |
      | Đánh giá crash window | Phân tích các lỗi trước/sau commit, publish, side effect và ack; nêu phương án phục hồi. |
      | Đo hiệu quả vận hành | Xác định chỉ số ingress, queue, job age, outbox lag, retry và tỉ lệ terminal state. |
  - slug: overload-rejection-008
    title: Không lặp gửi lại tức thời làm quá tải nghiêm trọng hơn
    status: WRITTEN
    difficult: ADVANCED
    focus: Khi nào được retry?.
    problemSolved: Thử lại nóng; trùng side effect.
    mechanism: Exponential backoff; jitter; retry budget. Retry storm, 429/503, timeout remote.
    applicationValue: Tính lịch retry có giới hạn và idempotent.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Không lặp gửi lại tức thời làm quá tải nghiêm trọng hơn**

      Khi thread pool hoặc dependency đã quá tải, vòng lặp retry tức thời tiêu thêm chính CPU, queue slot và connection đang thiếu. Bài này giúp người học hiểu vòng phản hồi retry storm, dự đoán hệ số khuếch đại từ nhiều tầng, rồi chuyển sang backoff có jitter và điểm dừng rõ ràng.

      Phần Java/Spring thực hành `ScheduledExecutorService`, `TaskScheduler` cùng retry budget để không giữ worker khan hiếm chỉ để ngủ, đồng thời nhấn mạnh idempotency nếu một lời gọi từ xa có thể đã tạo side effect trước khi timeout.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Cơ chế khuếch đại tải

      1. Vì sao vòng `catch(TaskRejectedException)` rồi submit lại ngay có thể làm hệ thống càng khó phục hồi?
      2. Nếu mỗi tầng client, gateway và service cùng thử tối đa ba lần, tối đa bao nhiêu attempt có thể tới tầng thấp nhất và vì sao?
      3. Tại sao lỗi do shutdown, lỗi dữ liệu không hợp lệ và lỗi tạm thời của downstream không nên dùng chung chính sách retry?

      ### Backoff, jitter và ngân sách

      1. Bạn tính dãy exponential backoff có trần cho base=200ms như thế nào?
      2. Vì sao các client cùng exponential backoff nhưng không jitter vẫn gây thundering herd?
      3. `maxAttempts`, deadline end-to-end và retry budget toàn dịch vụ khác nhau ở giới hạn nào?
      4. Khi nhận HTTP `Retry-After`, cần phối hợp hướng dẫn của server với jitter và deadline ra sao?

      ### Điều phối trong Spring

      1. Vì sao `Thread.sleep()` để backoff trong worker đang bão hòa có thể làm giảm throughput thực?
      2. Làm sao sử dụng `TaskScheduler` hoặc durable job retry để thử lại sau delay mà không giữ work thread?
      3. Vì sao retry một khoản thanh toán bị timeout cần giữ nguyên idempotency key và kiểm tra trạng thái từ xa?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Giải thích retry storm | Mô tả vòng khuếch đại tải và tính worst-case attempts khi nhiều tầng cùng retry. |
      | Tính backoff | Xây dựng delay có exponential cap và full/equal jitter trong khoảng đúng. |
      | Đặt giới hạn | Xác định maxAttempts, deadline và retry budget để có terminal failure rõ. |
      | Tách scheduler và worker | Thiết kế cơ chế retry có delay mà không sleep ngay trên worker đang quá tải. |
      | Phòng side effect trùng | Chọn retryable errors và sử dụng idempotency key, trạng thái job và reconciliation. |
      | Kiểm thử an toàn | Kiểm tra khoảng thời gian retry, giới hạn lượt thử, shutdown, retry exhaustion và dồn tải bằng test điều phối. |
  - slug: overload-rejection-009
    title: Thực nghiệm nhóm luồng và hàng đợi cùng đạt giới hạn
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Làm sao đo sự bão hòa thật?.
    problemSolved: Test flaky do sleep và không cleanup.
    mechanism: 'CountDownLatch; active; queue; completed. core=1, max=2, queue=1, task #4 reject.'
    applicationValue: Dự đoán stdout, assert metric và task count.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Thực nghiệm nhóm luồng và hàng đợi cùng đạt giới hạn**

      Bài thực nghiệm đưa các quy tắc core → queue → max → reject thành kết quả có thể quan sát và tự kiểm tra. Thay vì dựa vào `Thread.sleep()` khiến test lúc đạt lúc trượt, chương trình Java 17 dùng `CountDownLatch` giữ hai worker hoạt động, một task chờ và gửi task thứ tư để buộc `AbortPolicy` từ chối.

      Người học dự đoán và kiểm chứng `activeCount`, `queueSize`, số task hoàn thành, rồi thay đổi cấu hình để hiểu tại sao pool và queue phải cùng hết sức chứa. Cấu hình Spring `ThreadPoolTaskExecutor` và `@Async` bổ sung điểm áp dụng vào môi trường thực tế.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Thiết kế trạng thái saturation

      1. Với core=1, max=2 và queueCapacity=1, những task nào sẽ chạy, chờ, mở rộng worker và bị reject nếu không task nào kết thúc?
      2. Vì sao queue đầy chưa đủ chứng minh rejection khi pool vẫn còn khả năng mở thêm worker?
      3. Vì sao pool đạt max cũng chưa đủ nếu hàng đợi còn slot?

      ### Kiểm thử có kiểm soát

      1. `CountDownLatch` xác nhận task đầu đã chạy và giữ hai worker ở thời điểm thử rejection như thế nào?
      2. Vì sao chỉ dùng `Thread.sleep(100)` không bảo đảm task thứ tư luôn bị từ chối?
      3. Trước khi nộp task thứ tư, bạn sẽ kiểm tra `getActiveCount()` và `getQueue().size()` bằng giá trị nào?
      4. Vì sao sau khi thả latch và `awaitTermination`, số task hoàn thành là ba chứ không phải bốn?

      ### Mở rộng thực nghiệm với Spring

      1. Lỗi nào ném từ JDK AbortPolicy và lỗi nào xuất hiện từ `ThreadPoolTaskExecutor` của Spring?
      2. Khi thay AbortPolicy bằng CallerRunsPolicy hoặc DiscardPolicy, dự đoán stdout và task count thay đổi ra sao?
      3. Bạn sửa thử core, max hoặc queueCapacity như thế nào để tìm task đầu tiên bị từ chối mà vẫn giữ điều kiện test lặp lại?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Dự đoán acceptance | Lập bảng nhận việc theo core, max, queue và chỉ rõ task đầu tiên bị từ chối. |
      | Viết test ổn định | Dựng hai worker bị giữ bằng latch, một queue slot, rồi assert ngoại lệ tại submit. |
      | Đối chiếu metric | Xác nhận `active=2`, `queued=1`, một task rejected và ba task completed ở thí nghiệm Java 17. |
      | Chuyển sang Spring | Ánh xạ kịch bản JDK sang bean `ThreadPoolTaskExecutor` và loại `TaskRejectedException` phù hợp. |
      | Kiểm tra edge case | Thay đổi từng thông số và giải thích queue=0, queue lớn hoặc handler khác làm phép thử đổi kết quả. |
- slug: task-submission
  title: Gửi và nhận tác vụ
  childs:
  - slug: task-submission-001
    title: Gửi Runnable không có kết quả bằng execute()
    status: WRITTEN
    difficult: BASIC
    focus: Giao tác vụ ra sao?.
    problemSolved: execute trả void là đã xử lý.
    mechanism: Executor.execute, TaskExecutor.
    applicationValue: Chạy trực tiếp, qua pool và xử lý rejection. Nền tảng gửi việc.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Gửi Runnable không có kết quả bằng execute()**

      Một `Runnable` chỉ mô tả công việc, còn `Executor.execute()` quyết định cách thực thi. Bài này giúp người học phân biệt giao tác vụ với hoàn tất tác vụ, vì sao API `void` vẫn có thể chạy đồng bộ trên caller, qua pool hoặc bị từ chối, và cách dùng `ThreadPoolTaskExecutor` trong Spring mà không gây hiểu nhầm về kết quả.

      Qua ví dụ direct executor, pool một worker, queue giới hạn và latch, người học nhận ra sự khác nhau giữa lỗi nộp việc và lỗi thực thi cùng trách nhiệm quản lý vòng đời executor.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng Runnable và Executor
      1. `Runnable.run()`, `Thread.start()` và `executor.execute(task)` quyết định nơi chạy và giá trị trả về khác nhau như thế nào?
      2. Vì sao `execute()` trả `void` không chứng minh công việc đã hoàn tất, và khi nào nó có thể chạy ngay trên thread gửi?
      3. Cần phối hợp bằng công cụ nào để kiểm chứng một `Runnable` đã chạy xong thay vì dùng `Thread.sleep()`?

      ### Cấu hình, lỗi và vòng đời Spring
      1. `corePoolSize`, `maxPoolSize` và `queueCapacity` khiến task được chạy, chờ hoặc từ chối theo thứ tự nào?
      2. Vì sao phải tách `TaskRejectedException` đồng bộ khỏi lỗi phát sinh trong worker?
      3. Khi gửi nhiều Runnable từ singleton Spring, cần bảo vệ trạng thái chung và context như thế nào?
      4. Trong trường hợp nào `execute` chưa đáp ứng nhu cầu quan sát mà phải dùng `Future` hoặc kho job bền vững?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Giải thích API thực thi | Dự đoán chính xác luồng chạy và giá trị trả về của `run`, `start`, direct executor và pool. |
      | Cấu hình TaskExecutor | Thiết lập pool có giới hạn worker/queue và xác định phản ứng với rejection. |
      | Quan sát task void | Viết ví dụ latch chờ hoàn tất và diễn giải riêng lỗi gửi so với lỗi worker. |
      | Chọn giải pháp phù hợp | Quyết định khi nào `execute` đủ dùng, khi nào cần kênh kết quả, bảo vệ trạng thái và lifecycle. |
  - slug: task-submission-002
    title: Gửi Runnable hoặc Callable qua submit()
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Nhận handle và kết quả thế nào?.
    problemSolved: submit trả Future là có kết quả.
    mechanism: AsyncTaskExecutor.submit, Callable.
    applicationValue: Lấy giá trị từ Callable và null từ Runnable. Kênh theo dõi kết quả.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Gửi Runnable hoặc Callable qua submit()**

      `submit()` cho bên gửi một `Future` để nhận kết quả hoặc theo dõi hoàn tất. Bài học phân biệt `Runnable` không trả giá trị với `Callable` có thể trả dữ liệu và checked exception; nêu vì sao `TaskExecutor` thuần không khai báo `submit` còn Spring `AsyncTaskExecutor` có khả năng này.

      Từ demo Spring context, người học lấy kết quả `null`, số nguyên và lỗi từ `Future.get()`, xử lý timeout có kiểm soát mà vẫn hiểu queue và worker không tự bền vững sau restart.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### API và kiểu kết quả
      1. `submit(Runnable)` và `submit(Callable)` tạo Future khác nhau thế nào về kết quả thành công?
      2. Vì sao khai báo biến là `TaskExecutor` rồi gọi `submit()` không biên dịch, còn `AsyncTaskExecutor` thì được?
      3. `Future.get()` đưa checked exception hoặc runtime exception từ task trở lại caller bằng cơ chế nào?

      ### Lỗi và phối hợp
      1. Làm sao tách `TaskRejectedException` lúc nộp với `ExecutionException` lúc lấy kết quả?
      2. Vì sao gọi `get()` ngay sau `submit` khiến request thread vẫn có thể bị block?
      3. Khi task A submit task B và chờ B trong cùng pool chỉ có một worker, điều gì có thể xảy ra?
      4. Khi timeout hoặc hủy, những side effect nào vẫn có thể tồn tại và ai chịu trách nhiệm quản lý Future?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Chọn kiểu tác vụ | Viết hai overload `submit` và dự đoán giá trị `null` hoặc kết quả có kiểu. |
      | Dùng abstraction Spring | Inject đúng `AsyncTaskExecutor` mà không phụ thuộc ép kiểu implementation. |
      | Lấy outcome | Đọc kết quả, `ExecutionException.getCause()` và xử lý hủy/timeout theo từng nhánh. |
      | Phân tích phụ thuộc | Vẽ được starvation deadlock khi worker chờ task con trong cùng pool. |
      | Bảo vệ vòng đời | Đề xuất owner cho Future, executor và cơ chế theo dõi nếu công việc cần bền vững. |
  - slug: task-submission-003
    title: Nhận kết quả, kiểm tra hoàn tất và nhận biết hủy qua Future
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Task đã xong hay bị hủy?.
    problemSolved: isDone đồng nghĩa success.
    mechanism: Future.isDone, get, cancel.
    applicationValue: Test task queued bị cancel. Diễn giải trạng thái task.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Nhận kết quả, kiểm tra hoàn tất và nhận biết hủy qua Future**

      Bài này dạy cách đọc trạng thái của `Future`: pending, success, failure và cancelled. `isDone()` chỉ xác nhận Future đã đi tới trạng thái cuối; `cancel(true)` chỉ yêu cầu dừng theo khả năng hợp tác, không hoàn tác side effect.

      Ví dụ Java 17 dùng worker duy nhất và latch chứng minh một Future đang chạy, một task chờ queue bị hủy và một task lỗi. Mục tiêu là diễn giải đúng từng tín hiệu trước khi ứng dụng Spring báo trạng thái kết quả.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Kết quả và trạng thái
      1. Vì sao `isDone() == true` không chứng minh task đã thành công?
      2. `get()` trả giá trị, `null` hoặc ném `ExecutionException` hay `CancellationException` trong những tình huống nào?
      3. Sau khi `Future.get()` trả về, quan hệ happens-before cho phép đọc dữ liệu task thế nào và không bảo vệ điều gì?

      ### Hủy và điều phối
      1. `cancel(false)` và `cancel(true)` khác nhau ra sao với task đang ở queue và task đang chạy?
      2. Vì sao `isCancelled` không có nghĩa worker, giao dịch hay HTTP request đã được hoàn tác?
      3. Dùng latch và pool một worker để chứng minh task chờ bị hủy trước lúc chạy như thế nào?
      4. Với nhiều Future, làm sao thu thập kết quả mà không nhầm thứ tự `get` với thứ tự kết thúc?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Đọc trạng thái Future | Lập bảng `isDone`, `isCancelled` và hành vi `get` cho bốn trạng thái. |
      | Xử lý kết quả cuối | Viết nhánh xử lý lỗi, timeout, cancellation và interrupt đúng hợp đồng. |
      | Đánh giá cancellation | Giải thích tác động thực tế của `cancel(true)` và giới hạn với side effect. |
      | Kiểm chứng bằng đồng bộ hóa | Tái hiện hủy tác vụ còn chờ bằng latch và đối chiếu kết quả. |
      | Đọc dữ liệu an toàn | Nêu điều kiện dùng `get` để công bố kết quả, phân biệt với bảo vệ trạng thái chia sẻ. |
  - slug: task-submission-004
    title: get() có giới hạn thời gian chờ
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Caller được chờ bao lâu?.
    problemSolved: Timeout hủy task.
    mechanism: get(timeout), deadline, orTimeout.
    applicationValue: Latch để timeout rồi lấy kết quả. Quản lý ngân sách chờ.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **get() có giới hạn thời gian chờ**

      `Future.get(timeout, unit)` giới hạn **một lần caller chờ kết quả** chứ không giới hạn tuổi của task tính từ lúc submit. Bài học giải thích nguyên nhân timeout, kết quả đến muộn, deadline chung và sự khác biệt giữa chờ Future, timeout I/O của worker với `CompletableFuture.orTimeout`.

      Ví dụ Spring `@Async` dùng latch để bắt buộc lần `get` đầu timeout, sau đó giải phóng worker và nhận kết quả từ chính Future ấy. Điều này giúp thiết kế thời hạn chờ cho request mà không coi timeout là cancellation.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng chờ kết quả
      1. Mốc bắt đầu của `get(500, MILLISECONDS)` là lúc submit hay lúc gọi `get`?
      2. Vì sao `TimeoutException` không có nghĩa task bị hủy hoặc worker đã dừng I/O?
      3. Trong demo Spring `@Async`, latch bảo đảm kết quả timeout rồi thành công ở lần gọi kế tiếp như thế nào?

      ### Deadline và chính sách lỗi
      1. Vì sao gọi ba lần `get(1, SECONDS)` không tự tạo deadline chung một giây?
      2. Làm sao dùng `System.nanoTime()` phân bổ ngân sách chờ còn lại giữa nhiều Future?
      3. `orTimeout` và `completeOnTimeout` khác `get(timeout)` ở tác động lên trạng thái Future như thế nào?
      4. Nếu servlet thread chờ Future trong pool đang quá tải, cần giới hạn những tài nguyên và side effect nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân tích timed get | Chỉ đúng phạm vi deadline và các exception của một lần lấy kết quả. |
      | Chứng minh kết quả đến muộn | Dùng hai latch điều khiển worker, quan sát timeout rồi nhận kết quả khi mở chốt. |
      | Thiết kế ngân sách chung | Viết phép tính deadline dựa trên `nanoTime` để tránh cộng dồn nhiều lần chờ. |
      | So sánh các tầng timeout | Phân biệt timeout caller, HTTP/JDBC trong worker, request và completion stage. |
      | Chọn xử lý hậu timeout | Lập kế hoạch fallback, cancel hoặc tiếp tục nền có xét idempotency và tài nguyên. |
  - slug: task-submission-005
    title: Khác biệt đường truyền ngoại lệ giữa execute() và submit()
    status: WRITTEN
    difficult: ADVANCED
    focus: Lỗi tới đâu?.
    problemSolved: afterExecute null là không lỗi.
    mechanism: FutureTask, TaskDecorator, afterExecute, AsyncUncaughtExceptionHandler.
    applicationValue: Đọc cause từ Future và observer đúng. Phát hiện và xử lý lỗi.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Khác biệt đường truyền ngoại lệ giữa execute() và submit()**

      Một `Runnable` thô chạy bằng `execute()` có thể ném lỗi tới `UncaughtExceptionHandler` của worker, trong khi `submit()` thường bọc task bằng `FutureTask` và giữ lỗi cho `Future.get()` ném `ExecutionException`. Bài này phân biệt lỗi khi nộp, lỗi khi chạy, wrapper và trường hợp executor đồng bộ/caller-runs.

      Phần Spring đi sâu vào `ThreadPoolTaskExecutor`, `TaskDecorator`, `afterExecute`, `@Async void` và phương thức async trả Future để tránh bỏ sót lỗi hoặc ghi nhận failure sai nơi.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Cơ chế lỗi và FutureTask
      1. Lỗi `RejectedExecutionException` lúc gửi khác lỗi do `run()` ném trong worker thế nào?
      2. Vì sao `submit` có thể lưu cause vào FutureTask dù `execute` với Runnable thô làm worker nhận uncaught exception?
      3. Tình huống `execute(new FutureTask<>(...))` chứng minh điều gì về vai trò wrapper?
      4. `CallerRunsPolicy` khiến try/catch tại caller thấy exception trong những trường hợp nào?

      ### Quan sát trong Spring
      1. Vì sao `afterExecute(task, null)` chưa chứng minh task gửi bằng `submit` thành công?
      2. Vì sao `TaskDecorator` có thể không bắt lỗi nghiệp vụ khi đối tượng chạy là FutureTask?
      3. `@Async void` dùng `AsyncUncaughtExceptionHandler` khác thế nào với `@Async` trả CompletableFuture?
      4. Kiểm thử hai đường lỗi bằng latch, Future và timeout như thế nào để giữ nguyên cause?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân loại lỗi | Xác định lỗi submission hoặc execution và thread quan sát chúng. |
      | Phân tích wrapper | Dự đoán đường lỗi của `execute`, `submit` và `execute(FutureTask)` trên pool thực. |
      | Chọn error observer | Giải thích giới hạn `afterExecute` và `TaskDecorator`, sử dụng Future hoặc handler phù hợp. |
      | Xử lý lỗi @Async | Thiết kế hai đường xử lý riêng cho `void` và Future/CompletableFuture. |
      | Kiểm thử exception | Thu thập đúng cause và dọn executor khi xảy ra lỗi hoặc timeout. |
  - slug: task-submission-006
    title: Thời điểm gửi tác vụ khác với thời điểm bắt đầu chạy
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Vì sao gửi rồi mà chưa chạy?.
    problemSolved: submit đồng nghĩa start.
    mechanism: ThreadPoolTaskExecutor, nanoTime, latch.
    applicationValue: Đo queue wait và execution time. Hiểu lịch chạy và tải.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Thời điểm gửi tác vụ khác với thời điểm bắt đầu chạy**

      Bài học phân biệt các mốc `submit`, `accept`, `return`, `start` và `finish`. Task có thể được nhận vào queue từ lâu trước khi worker rảnh; trái lại direct executor hoặc `CallerRunsPolicy` có thể thực thi ngay trên thread gửi.

      Người học sử dụng latch và `TaskDecorator` để đo queue wait, execution duration, end-to-end latency; từ đó phân tích tác động của `corePoolSize`, `maxPoolSize` và `queueCapacity` đối với SLA thực tế.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Timeline và lịch thực thi
      1. Các mốc `t_submit`, `t_accept`, `t_return`, `t_start` và `t_finish` phản ánh những sự kiện nào?
      2. Vì sao nhận Future không chứng minh task đã chạy và khi nào worker có thể start trước khi caller return?
      3. Với một worker và latch giữ task A, làm sao chứng minh task B được submit nhưng chưa bắt đầu?

      ### Queue và quan sát trong Spring
      1. Khi đã đạt `corePoolSize`, pool thường ưu tiên queue trước hay mở worker đến `maxPoolSize`?
      2. Vì sao TaskDecorator có thể đo queue wait nhưng không tự bắt được exception của task bọc trong FutureTask?
      3. Nếu đo thời gian chạy method `@Async` mà bỏ qua queue, dashboard sai lệch thế nào với latency người dùng?
      4. Khi nghiệp vụ yêu cầu thứ tự theo key, cần gì ngoài thứ tự `submit` vào pool nhiều worker?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Vẽ timeline | Chỉ ra submission duration, queue wait, run duration và end-to-end. |
      | Kiểm thử hàng đợi | Dùng latch giữ worker A để chứng minh B đã được nhận nhưng vẫn chờ. |
      | Phân tích pool | Dự đoán core/max/queue/rejection và tình trạng backlog khi tăng tải. |
      | Thiết kế đo lường | Cài TaskDecorator minh họa hai thời lượng, nêu giới hạn do wrapper và caller-runs. |
      | Chẩn đoán chậm | Dựa vào queue depth, pool size, wait time và downstream để xác định nguồn nghẽn. |
  - slug: task-submission-007
    title: Chụp dữ liệu đầu vào phù hợp trước khi chuyển sang luồng khác
    status: WRITTEN
    difficult: ADVANCED
    focus: Worker sẽ đọc dữ liệu phiên bản nào?.
    problemSolved: final reference là immutable.
    mechanism: List.copyOf, immutable record, @Async.
    applicationValue: Copy input rồi sửa nguồn, kiểm tra snapshot. Bảo đảm đầu vào có nghĩa.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Chụp dữ liệu đầu vào phù hợp trước khi chuyển sang luồng khác**

      Lambda capture biến `effectively final` chỉ giữ tham chiếu; nó không làm đối tượng mutable thành bất biến. Bài này dạy cách chọn một input snapshot **đủ dùng**, giữ quyền sở hữu, copy phòng vệ các collection và nested object khi chuyển request sang `Executor`, `@Async` hoặc `CompletableFuture`.

      Ví dụ Java và Spring MVC làm rõ snapshot theo thời điểm submit so với đọc dữ liệu mới lúc worker chạy, cùng nguy cơ chuyển trực tiếp request, entity, stream hoặc dữ liệu nhạy cảm có vòng đời không phù hợp.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Immutability và aliasing
      1. Vì sao biến `final` trỏ tới `ArrayList` vẫn có thể cho worker đọc dữ liệu mới sau submit?
      2. `List.copyOf` khác một `Collections.unmodifiableList` view ở điểm nào, và vì sao shallow copy có thể chưa đủ?
      3. Khi record giữ `List` phần tử mutable hoặc `byte[]`, cần defensive copy ở những ranh giới nào?
      4. Happens-before khi submit bảo đảm visibility gì và không bảo đảm isolation gì?

      ### Ranh giới Spring và dữ liệu nghiệp vụ
      1. Khi nào gửi immutable DTO chụp tại submit, khi nào chỉ gửi ID để worker tải trạng thái mới nhất?
      2. Vì sao không nên chuyển `HttpServletRequest`, `EntityManager` hoặc stream sang worker tùy ý?
      3. Nếu snapshot rất lớn hoặc có token bí mật, cần chọn dữ liệu và cách lưu trữ như thế nào?
      4. Dùng latch thế nào để test caller sửa nguồn sau submit mà worker vẫn đọc đúng snapshot cũ?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phát hiện mutable alias | Chỉ ra object được lambda chia sẻ và dự đoán dữ liệu worker sẽ thấy. |
      | Tạo immutable snapshot | Chuyển input thành record/DTO và copy list, nested object hoặc mảng đúng mức. |
      | Bảo vệ request boundary | Chỉ truyền dữ liệu phù hợp vào `@Async`, tránh giữ tài nguyên gắn thread/transaction. |
      | Lựa chọn thời điểm dữ liệu | So sánh snapshot/version với ID cần tải lại theo hợp đồng nghiệp vụ. |
      | Kiểm chứng isolation | Dùng latch tạo xen kẽ có kiểm soát và assert snapshot không đổi khi nguồn mutate. |
  - slug: task-submission-008
    title: Không đồng nhất tác vụ đã được nhận với nghiệp vụ đã hoàn thành
    status: WRITTEN
    difficult: ADVANCED
    focus: Khi nào nghiệp vụ thật sự thành công?.
    problemSolved: Accepted đồng nghĩa completed.
    mechanism: 202, jobId, status, outbox, idempotency.
    applicationValue: Thiết kế job-status API và kiểm chứng sau commit. Bảo đảm thông báo outcome có chứng cứ.
    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Không đồng nhất tác vụ đã được nhận với nghiệp vụ đã hoàn thành**

      Bài cuối của chương phân biệt executor đã **accepted** một task, Future đã **done**, HTTP `202 Accepted` và nghiệp vụ thật sự đạt `SUCCEEDED`. Những tuyên bố này cần những mức bằng chứng khác nhau. Người học xây hợp đồng job status rõ ràng, tránh trả “đã hoàn tất” chỉ vì việc submit không ném lỗi.

      Từ ví dụ trạng thái trong RAM tới thiết kế transactional outbox và idempotency, bài học nêu cửa sổ crash/retry, transaction rollback, side effect thành công nhưng status chưa ghi, và nguy cơ có nhiều replica.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Tiếp nhận và hoàn tất
      1. `ACCEPTED`, `QUEUED`, `RUNNING`, `SUCCEEDED` và `FAILED` khác nhau ở điều kiện quan sát nào?
      2. Vì sao `Future.isDone()` hay một method trả bình thường chưa chứng minh kết quả đã commit?
      3. HTTP `202 Accepted` cho phép API cam kết điều gì và cần trả job ID/status ra sao?
      4. Vì sao một task có thể bị báo FAILED sau khi side effect đã xảy ra?

      ### Phục hồi và tính nhất quán
      1. Vì sao `ConcurrentHashMap` lưu trạng thái job không đáp ứng restart hoặc nhiều replica?
      2. Transactional outbox khép cửa sổ lỗi giữa ghi DB và gửi broker như thế nào?
      3. Idempotency key, unique constraint và điều kiện chuyển state giúp ngăn xử lý trùng ra sao?
      4. Khi quan sát vận hành, vì sao jobs accepted không đồng nghĩa jobs succeeded?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Định nghĩa outcome nghiệp vụ | Viết tiêu chí `SUCCEEDED` dựa trên bằng chứng thực sự, khác terminal state của Future. |
      | Thiết kế API job | Phác thảo `POST` trả 202 và `jobId`, `GET` trả status và phản hồi rejection. |
      | Phân tích cửa sổ lỗi | Chỉ ra crash sau accepted, rollback trước commit và result đến trễ. |
      | Thiết kế durability | Vẽ DB transaction có job+outbox, worker idempotent và cập nhật trạng thái an toàn. |
      | Đánh giá observability | Tách accepted, queued, started, succeeded, failed, rejected và queue age. |
- slug: async-enablement
  title: Bật @Async
  childs:
  - slug: async-enablement-001
    title: Khai báo @EnableAsync trong lớp cấu hình
    status: WRITTEN
    difficult: BASIC
    focus: Bật annotation advice trong context.
    problemSolved: Annotation async đã được kích hoạt chưa?. Chỉ đặt @Async mà thiếu EnableAsync.
    mechanism: Nạp config và quan sát worker.
    applicationValue: Điểm khởi động cơ chế.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Khai báo @EnableAsync trong lớp cấu hình**

      Bật annotation-driven async đúng ApplicationContext và xác minh @EnableAsync thực sự làm proxy xử lý lời gọi qua executor.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Khai báo và phạm vi

      1. Trong Spring Framework, @EnableAsync phải được đặt ở đâu và tại sao nó cần được nạp vào đúng ApplicationContext?
      2. Việc bật @EnableAsync khác gì so với khai báo một ThreadPoolTaskExecutor bean hoặc tự gắn @Async lên service?
      3. Khi có root context và servlet child context, bạn kiểm tra phạm vi hiệu lực của cấu hình async như thế nào?

      ### Chạy và kiểm chứng

      1. Bạn sẽ cấu hình một executor có giới hạn và viết lời gọi qua proxy thế nào để chứng minh task thực sự chạy trên worker?
      2. Trong những trường hợp nào có @EnableAsync nhưng method vẫn chạy đồng bộ, và bạn phân biệt thiếu proxy với lỗi executor ra sao?
      3. Nếu Spring Boot đã auto-configure executor, những dữ liệu runtime nào cần kiểm tra trước khi kết luận @Async đang dùng pool nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Kích hoạt async trong Spring | Viết lớp @Configuration có @EnableAsync, đăng ký vào context và giải thích tác dụng của mỗi annotation. |
      | Tách cấu hình với thực thi | Dùng ThreadPoolTaskExecutor bean và @Async với qualifier, chỉ ra nơi bật interceptor và nơi chạy công việc. |
      | Xác minh đúng đường gọi | Tạo bài test gọi service qua Spring proxy, so sánh caller/worker và quan sát completion có thời hạn. |
      | Chẩn đoán cấu hình | Phân biệt lỗi context không nạp, self-invocation, bean không managed, executor lookup và rejection. |
  - slug: async-enablement-002
    title: Bean phải được container quản lý để annotation được xử lý
    status: WRITTEN
    difficult: BASIC
    focus: Managed bean và proxy boundary.
    problemSolved: Caller có đi qua proxy không?. new object và this.method bỏ qua proxy.
    mechanism: So sánh new với context.getBean.
    applicationValue: Điều kiện có hiệu lực thực tế.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Bean phải được container quản lý để annotation được xử lý**

      Tránh hiểu nhầm @Async là phép màu của Java annotation: container phải quản lý instance và lời gọi phải đi qua proxy thì advice mới có cơ hội chạy.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Bean và vòng đời

      1. Điều gì khác nhau giữa một object new trong controller và một object new được trả về từ @Bean về quyền quản lý của Spring?
      2. Một class đã có @Service nhưng chưa được component scan thì vì sao @Async vẫn chưa có hiệu lực?
      3. Bạn xác nhận bean đang được lấy từ đúng context và đã qua BeanPostProcessor bằng những cách nào?

      ### Đường gọi proxy

      1. Tại sao this.asyncMethod() vẫn có thể chạy đồng bộ dù instance là Spring bean?
      2. Ranh giới nào khiến private/final methods và @PostConstruct không thích hợp với proxy-based @Async?
      3. Bạn sẽ tách một self-invocation thành hai bean thế nào và kiểm chứng thread thực thi ra sao?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Phân biệt managed và unmanaged | Dựng cùng một service bằng new và qua ApplicationContext, giải thích khác biệt khi @Async chạy. |
      | Thiết kế ranh giới proxy | Tách caller và worker thành hai bean inject qua constructor, tránh lời gọi nội bộ. |
      | Chẩn đoán lifecycle | Nhận ra lỗi scope/context, constructor, @PostConstruct và hạn chế của proxy. |
      | Kiểm thử thực thi | Kiểm tra proxy và tên thread theo executor có prefix đặc trưng, dùng Future timeout thay vì sleep. |
  - slug: async-enablement-003
    title: Đặt @Async trên phương thức hoặc lớp
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: Method-level và class-level.
    problemSolved: Method nào được coi là async?. Class-level phủ getter trả String.
    mechanism: Test method/class override.
    applicationValue: Phạm vi tác vụ được đánh dấu.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Đặt @Async trên phương thức hoặc lớp**

      Chọn phạm vi áp dụng @Async đủ chính xác để tác vụ nền chạy đúng executor mà các API đồng bộ của service không bị thay đổi hợp đồng bất ngờ.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Vị trí annotation

      1. Khi nào nên đặt @Async ở từng method thay vì trên toàn bộ class service?
      2. Nếu class khai báo @Async với một executor và method có @Async với executor khác, cái nào được dùng và vì sao?
      3. Điều gì xảy ra nếu người khác thêm method trả String vào class được gắn @Async?

      ### Kiểm chứng hành vi

      1. Làm sao kiểm chứng method không gắn annotation vẫn thực thi đồng bộ trong cùng service?
      2. Bạn phân biệt lời gọi tới method qua proxy với lời gọi this.method() trong bài test placement như thế nào?
      3. Khi một API vừa có query đồng bộ vừa có command chạy nền, bạn tổ chức class và return type thế nào để giữ contract rõ ràng?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Đặt annotation có chủ đích | Thiết kế một service method-level async và một service class-level async theo nhu cầu. |
      | Xác định override | Dự đoán và kiểm chứng executor được chọn khi method-level và class-level qualifier cùng tồn tại. |
      | Bảo vệ return contract | Phát hiện method đồng bộ trả String/DTO có nguy cơ bị class-level async phủ lên. |
      | Kiểm chứng phạm vi | Viết test quan sát thread của method async, method thường và lời gọi self-invocation. |
  - slug: async-enablement-004
    title: Kiểu trả về void, Future và CompletableFuture
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: void, Future, CompletableFuture.
    problemSolved: Caller nhận lỗi/kết quả bằng cách nào?. get/join chặn và bỏ sót lỗi.
    mechanism: Test completion, exception, timeout.
    applicationValue: Hợp đồng quan sát công việc.
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Kiểu trả về void, Future và CompletableFuture**

      Lựa chọn void, Future hay CompletableFuture theo nhu cầu nhận kết quả, quan sát lỗi, phối hợp nhiều task và giới hạn thời gian chờ của caller.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Hợp đồng kết quả

      1. Vì sao method @Async không được trả trực tiếp String dù phần xử lý chỉ tạo một chuỗi?
      2. Method @Async void khác Future và CompletableFuture thế nào về kênh quan sát lỗi và completion?
      3. Vì sao target method có thể trả CompletableFuture.completedFuture mà handle caller nhận vẫn chưa hoàn thành?

      ### Composition, timeout và lỗi

      1. Khi bước sau cũng trả CompletableFuture, tại sao dùng thenCompose thay vì thenApply?
      2. Bạn phân biệt ExecutionException, CompletionException, timeout của caller và lỗi rejection khi submit như thế nào?
      3. Vì sao get(timeout), orTimeout và cancel của CompletableFuture không bảo đảm dừng I/O đang chạy hoặc rollback side effect?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | Chọn return type | Giải thích/thiết kế API async dùng void, Future và CompletableFuture cho ba nhu cầu cụ thể. |
      | Phối hợp completion | Ghép nhiều stage với thenApply, thenCompose, thenCombine/allOf và quan sát lỗi đúng chỗ. |
      | Xử lý exception | Viết code kiểm tra cause từ Future/get, CompletionException, và handler dành cho void. |
      | Thiết kế deadline | Phân biệt thời gian caller chờ với timeout I/O, cancellation hợp tác và task rejection. |
