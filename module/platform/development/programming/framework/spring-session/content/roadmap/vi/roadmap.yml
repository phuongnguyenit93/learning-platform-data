roadmap:
- id: nen-tang-http-session
  title: Nền tảng HTTP Session
  purpose: Hiểu mục đích quản lý trạng thái đăng nhập và giới hạn của session lưu trong một máy chủ.
  objectives:
  - Giải thích HttpSession và session ID trong ứng dụng web
  - Phân biệt session với cookie và dữ liệu phía client
  - Nhận diện vấn đề khi session chỉ lưu trong bộ nhớ ứng dụng
- id: kien-truc-spring-session
  title: Kiến trúc Spring Session
  purpose: Nắm cách Spring Session thay thế cơ chế lưu trữ session và cung cấp API thống nhất.
  objectives:
  - Giải thích vai trò SessionRepository và SessionRepositoryFilter
  - Mô tả luồng đọc, ghi và tìm session qua repository
  - Phân biệt phạm vi Servlet HttpSession với reactive WebSession
- id: tich-hop-spring-boot
  title: Tích hợp Spring Boot
  purpose: Biết cách bật Spring Session và cấu hình các thành phần cơ bản trong ứng dụng.
  objectives:
  - Chọn dependency Spring Session phù hợp với loại lưu trữ
  - Cấu hình kết nối kho lưu trữ cùng thời gian timeout
  - Kiểm tra session được quản lý bởi Spring Session sau khi khởi chạy
- id: session-luu-tren-redis
  title: Session lưu trên Redis
  purpose: Sử dụng Redis để chia sẻ trạng thái session giữa các instance của ứng dụng.
  objectives:
  - Thiết lập Spring Session Data Redis với Spring Boot
  - Quan sát session ID và dữ liệu session trong Redis
  - Giải thích cách lưu và hết hạn session khi sử dụng Redis
- id: session-luu-qua-jdbc
  title: Session lưu qua JDBC
  purpose: Hiểu phương án dùng cơ sở dữ liệu quan hệ để duy trì session.
  objectives:
  - Thiết lập Spring Session JDBC với DataSource và bảng session
  - Đọc cấu trúc lưu trữ session và các thuộc tính của session
  - So sánh lựa chọn JDBC với Redis theo nhu cầu vận hành
- id: cookie-va-vong-doi-session
  title: Cookie và vòng đời Session
  purpose: Kiểm soát cách định danh, tạo mới, cập nhật, hết hạn và xóa session.
  objectives:
  - Cấu hình tên, đường dẫn và thuộc tính bảo vệ session cookie
  - Phân biệt timeout, invalidation và logout
  - Kiểm tra hành vi khi session hết hạn hoặc bị xóa
- id: tich-hop-spring-security
  title: Tích hợp Spring Security
  purpose: Quản lý session người dùng đã đăng nhập và chính sách phiên đồng thời.
  objectives:
  - Giải thích cách SecurityContext gắn với session
  - Tìm session theo principal bằng repository có hỗ trợ index
  - Kiểm tra concurrent session control và kết thúc phiên từ xa
- id: session-phan-tan-va-realtime
  title: Session phân tán và realtime
  purpose: Nhận biết hành vi session khi triển khai nhiều instance và dùng giao tiếp kéo dài.
  objectives:
  - Giải thích lợi ích của shared session store khi scale nhiều instance
  - Phân biệt quản lý WebSession trong WebFlux với HttpSession Servlet
  - Mô tả cách hoạt động WebSocket ảnh hưởng thời gian sống session
- id: kiem-thu-va-van-hanh
  title: Kiểm thử và vận hành
  purpose: Xác minh tính đúng đắn, bảo mật và ổn định của cơ chế session trong thực tế.
  objectives:
  - Viết test cho tạo, truy cập, hết hạn và hủy session
  - Kiểm thử chuyển request giữa các instance và khi kho lưu trữ lỗi
  - Theo dõi lỗi lưu trữ, timeout và dữ liệu nhạy cảm trong session
