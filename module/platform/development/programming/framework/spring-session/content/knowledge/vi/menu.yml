  - Cấu hình maximumSessions và chính sách từ chối hoặc hết hạn phiên cũ
  - Tên principal trong chỉ mục phải khớp với danh tính dùng để tra cứu
  - Giới hạn getAllPrincipals và tránh suy diễn khả năng liệt kê người dùng
  - Phiên hoạt động, phiên bị đánh dấu hết hạn và phiên đã xóa khỏi kho
  - Đăng nhập đồng thời và giới hạn bảo đảm khi nhiều nút cùng xử lý
  - Tra cứu, hiển thị và thu hồi một phiên cụ thể của người dùng
  - SpringSessionBackedReactiveSessionRegistry và khả năng theo phiên bản
  - Bảo vệ chức năng quản lý phiên và hạn chế công bố thông tin thiết bị
- level1: Ghi nhớ và đăng xuất
  level2:
  - Cookie tồn tại lâu, phiên tồn tại lâu và đăng nhập ghi nhớ là các cơ chế khác nhau
  - SpringSessionRememberMeServices và điều chỉnh vòng đời phiên
  - Phối hợp remember-me với DefaultCookieSerializer được tùy chỉnh
  - Khoảng không hoạt động, gia hạn phiên và tuổi thọ tuyệt đối của đăng nhập
  - Đăng xuất phiên hiện tại và thu hồi mọi phiên của một người dùng
  - invalidate, xóa dữ liệu kho và xóa cookie hoặc định danh header
  - Đăng xuất đồng thời với các yêu cầu đang thực hiện
  - Đăng xuất cục bộ khác với đăng xuất tại nhà cung cấp danh tính
  - Phiên bị xóa, cookie còn lại và yêu cầu đăng nhập lại
  - Đổi mật khẩu, nghi ngờ lộ phiên và chính sách thu hồi theo yêu cầu
  - Kiểm chứng kết thúc phiên trên các nút và kết nối liên quan
- level1: Tích hợp WebSocket
  level2:
  - Vòng đời HttpSession và kết nối WebSocket không đồng nhất
  - Phạm vi tích hợp Spring WebSocket, STOMP và giới hạn với API WebSocket khác
  - AbstractSessionWebSocketMessageBrokerConfigurer và cấu hình tích hợp
  - HandshakeInterceptor và liên kết phiên với kết nối được mở
  - SessionRepositoryMessageInterceptor và cập nhật hoạt động khi nhận thông điệp
  - Thông điệp đến, heartbeat, thông điệp gửi đi và cách xác định không hoạt động
  - SessionDestroyedEvent và đóng kết nối gắn với phiên đã kết thúc
  - Một phiên có nhiều WebSocket trên nhiều nút
  - Phụ thuộc vào repository có sự kiện và độ trễ nhận thông báo
  - Kiểm thử hết hạn, đăng xuất và mất kết nối kho trong ứng dụng WebSocket
- level1: Đồng thời và nhất quán
  level2:
  - Nhiều yêu cầu cùng đọc một phiên và cập nhật từ các bản trạng thái khác nhau
  - Ghi đè mất thay đổi khi hai bên cập nhật cùng thuộc tính
  - Thay đổi thuộc tính khác nhau và ảnh hưởng của chính sách lưu
  - Đối tượng khả biến và ranh giới theo dõi thay đổi của repository
  - Đọc, kiểm tra rồi ghi không tự trở thành một giao dịch nguyên tử
  - Khóa trong một JVM không bảo vệ được mọi nút ứng dụng
  - Đổi định danh, xóa và gia hạn phiên khi có yêu cầu đồng thời
  - Tránh dùng phiên làm nguồn duy nhất cho số dư, tồn kho hoặc bất biến nghiệp vụ
  - Phối hợp qua thao tác nguyên tử hoặc lưu trạng thái tại hệ thống phù hợp
  - Phiên trên replica, độ trễ sao chép và dữ liệu cũ
  - Kiểm thử các lịch thực thi gây lỗi thay vì chỉ tăng số luồng
- level1: Triển khai nhiều nút
  level2:
  - Chia sẻ kho phiên giữa các bản chạy ứng dụng
  - Cân bằng tải, sticky session và khả năng chuyển yêu cầu sang nút khác
  - Namespace, tên cookie và cấu hình phải thống nhất trong cùng một ứng dụng
  - Tương thích lớp dữ liệu và serializer trên các nút
  - Redis Sentinel, Redis Cluster và lựa chọn theo yêu cầu kho
  - Nhân bản dữ liệu, chuyển đổi dự phòng và giới hạn mất cập nhật
  - JDBC, nhóm kết nối và tải bổ sung do mọi nút cùng truy cập
  - Rolling deployment và phiên được tạo bởi hai phiên bản cùng tồn tại
  - Tắt có trật tự và hoàn tất việc lưu phiên trước khi dừng
  - TLS sau reverse proxy và nhận biết đúng nguồn yêu cầu an toàn
  - Thử chuyển nút xử lý để chứng minh phiên không phụ thuộc một JVM
- level1: An toàn dữ liệu phiên
  level2:
  - Định danh phiên là bí mật và phải khó dự đoán
  - Sinh định danh, nguồn ngẫu nhiên và SessionIdGenerator theo phiên bản
  - Chống session fixation, đánh cắp phiên và sử dụng lại định danh đã thu hồi
  - HTTPS, cookie bảo vệ và tránh để lộ qua URL hoặc nhật ký
  - CSRF, SameSite và giới hạn của việc chỉ dựa vào cookie
  - Quyền truy cập Redis, cơ sở dữ liệu và phạm vi tài khoản dịch vụ
  - Cách ly môi trường, namespace và giới hạn tài nguyên lưu phiên
  - Kiểm soát dữ liệu được giải tuần tự hóa và hạn chế kiểu đối tượng
  - Tối thiểu hóa dữ liệu cá nhân và thời gian giữ lại
  - Bảo vệ bản sao lưu, kênh truyền và dữ liệu lưu trên thiết bị
  - Giới hạn tạo phiên để tránh làm cạn bộ nhớ hoặc dung lượng kho
  - Thiết kế hành vi an toàn khi không thể đọc hoặc ghi trạng thái xác thực
- level1: Chia sẻ giữa ứng dụng
  level2:
  - Chung kho lưu trữ không tự đồng nghĩa chung phiên hoặc chung đăng nhập
  - Cookie name, Domain, Path và điều kiện trình duyệt gửi cùng định danh
  - Namespace, repository và định dạng dữ liệu phải tương thích khi chủ động chia sẻ
  - Chia sẻ SecurityContext và yêu cầu tương thích kiểu principal
  - Ranh giới tin cậy khi nhiều ứng dụng có thể đọc, sửa cùng một phiên
  - Subdomain, site, origin và giới hạn của cơ chế cookie
  - SSO qua nhà cung cấp danh tính khác với dùng chung kho phiên
  - Cách ly tenant bằng thiết kế định danh, kho và kiểm tra quyền
  - Tránh dùng dữ liệu do một ứng dụng ghi làm bằng chứng cấp quyền không kiểm chứng
  - Lựa chọn tách phiên khi ứng dụng có vòng đời hoặc yêu cầu bảo mật khác nhau
- level1: Repository tùy chỉnh
  level2:
  - Khi nào cần tự xây repository thay vì dùng triển khai sẵn có
  - Thực hiện hợp đồng SessionRepository và vòng đời đối tượng Session
  - Phân biệt tạo trong bộ nhớ với lưu vào kho bền vững
  - Đọc không trả về phiên đã hết hạn và xử lý định danh không tồn tại
  - Lưu thay đổi, xóa thuộc tính và xóa phiên an toàn khi bị gọi lặp
  - Đổi định danh và giữ nhất quán dữ liệu, chỉ mục liên quan
  - Tùy chọn hỗ trợ FindByIndexNameSessionRepository
  - TTL, dọn dữ liệu và công bố sự kiện theo khả năng được cam kết
  - ReactiveSessionRepository và tuân thủ chuỗi xử lý không chặn
  - Bộ kiểm thử hợp đồng cho phiên, thời hạn, đồng thời và lỗi kho
- level1: Kiểm thử Servlet
  level2:
  - Kiểm thử logic nghiệp vụ độc lập với bộ lọc và kho phiên
  - MockMvc với đầy đủ filter Spring Session cần kiểm chứng
  - MockHttpSession và lý do không đủ để chứng minh phiên được lưu ngoài JVM
  - Tạo phiên qua yêu cầu HTTP và gửi lại cookie ở yêu cầu tiếp theo
  - Kiểm tra thuộc tính, đổi định danh, invalidate và cookie không hợp lệ
  - Đăng nhập, SecurityContext và thứ tự filter thực tế
  - Kiểm tra Secure, HttpOnly, SameSite, Path, Domain của Set-Cookie
  - Kiểm thử HeaderHttpSessionIdResolver và đường đi không dùng cookie
  - Phản hồi redirect, lỗi, commit sớm và yêu cầu bất đồng bộ
  - Kiểm tra hành vi khi repository ném lỗi
  - Cách ly namespace và dữ liệu thử nghiệm giữa các ca kiểm thử
- level1: Kiểm thử WebFlux
  level2:
  - WebTestClient và phạm vi kiểm thử WebSession
  - Kiểm thử WebSessionStore cùng ReactiveSessionRepository được cấu hình thật
  - StepVerifier cho tạo, đọc, lưu, xóa phiên
  - Gửi lại cookie hoặc header từ phản hồi trước
  - Kiểm tra phiên chỉ được phát hành khi đã bắt đầu
  - Đổi định danh, invalidate và khôi phục trạng thái ở yêu cầu tiếp theo
  - Kiểm tra SecurityContext và giới hạn phiên phản ứng theo phiên bản
  - Đảm bảo không dùng thao tác chặn trong luồng xử lý sự kiện
  - Lỗi, timeout, hủy chuỗi và tình trạng phiên đã được lưu hay chưa
  - Kiểm tra mốc thời gian logic và TTL backend theo các cơ chế khác nhau
- level1: Kiểm thử tích hợp
  level2:
  - Dùng Redis và cơ sở dữ liệu thử nghiệm gần với môi trường triển khai
  - Testcontainers, thông tin kết nối động và vòng đời tài nguyên kiểm thử
  - Hai bản chạy ứng dụng cùng đọc phiên qua một kho
  - Tạo phiên ở nút thứ nhất, cập nhật ở nút thứ hai rồi kiểm tra lại
  - Khởi động lại một nút và kiểm chứng trạng thái phiên còn hay mất
  - Kiểm thử idle timeout, cookie hết hạn và tác vụ cleanup độc lập
  - Xác nhận sự kiện tạo, xóa, hết hạn theo khả năng repository
  - Tra cứu theo principal và thu hồi nhiều phiên đăng nhập
  - Đăng nhập hoặc cập nhật cùng lúc để kiểm tra tranh chấp
  - Kiểm tra tương thích serializer giữa hai phiên bản ứng dụng
  - Mất kết nối, chuyển đổi dự phòng, eviction và phục hồi kho
  - WebSocket, đăng xuất và thời gian đóng các kết nối liên quan
- level1: Hiệu năng và giám sát
  level2:
  - Độ trễ tải, lưu phiên và phần chi phí trong một yêu cầu HTTP
  - Số phiên hoạt động, số phiên tạo mới và tốc độ hết hạn
  - Kích thước thuộc tính, chi phí serializer và lưu lượng truyền dữ liệu
  - Số lần truy cập kho do một yêu cầu đọc hoặc sửa phiên
  - Ảnh hưởng của FlushMode, SaveMode và việc đọc thuộc tính
  - Nhóm kết nối, luồng listener, thời gian chờ và mức bão hòa
  - Chỉ mục principal, tác vụ cleanup và chi phí dữ liệu phụ trợ
  - Phiên rất lớn, ghi thường xuyên và giới hạn tài nguyên
  - Metric, trace và ghi log tương quan mà không công bố định danh thô
  - Quan sát dữ liệu Redis hoặc JDBC mà không gây tải quét quá lớn
  - Đo chuẩn bằng tải đại diện cho đọc, ghi, đăng nhập và hết hạn
- level1: Vận hành và phục hồi
  level2:
  - 'Chẩn đoán mất phiên: cookie, định danh, filter, namespace hay dữ liệu kho'
  - Lỗi giải tuần tự hóa, không tìm thấy lớp và thay đổi cấu trúc thuộc tính
  - Lỗi JDBC schema, thiếu quyền, duplicate key và cạn kết nối
  - Redis từ chối cấu hình keyspace, listener ngừng nhận và chỉ mục còn sót
  - Timeout kho phiên và phân biệt lỗi xác thực với lỗi hạ tầng
  - Chính sách bộ nhớ Redis, eviction và rủi ro mất phiên đang hoạt động
  - Mất kết nối trong lúc ghi và kết quả cập nhật chưa xác định
  - Khôi phục từ bản sao lưu và nguy cơ phục hồi cả phiên đã thu hồi
  - Vệ sinh dữ liệu hết hạn, chỉ mục phụ và dữ liệu thử nghiệm theo phạm vi
  - Cảnh báo lỗi lưu phiên, công việc dọn dẹp tồn đọng và bất thường tạo phiên
  - Quy trình phục hồi, tiêu chí xác nhận và trường hợp cần đăng nhập lại
- level1: Nâng cấp và di chuyển
  level2:
  - Đối chiếu phiên bản Spring Session với Boot, Security, Data Redis và driver JDBC
  - Thay đổi dependency, starter và tên thuộc tính cấu hình giữa các dòng Boot
  - Servlet javax, jakarta và yêu cầu tương thích container
  - Chuyển serializer hoặc phiên bản Jackson mà vẫn đọc được dữ liệu cần giữ
  - Thay đổi lớp principal, SecurityContext và module hỗ trợ tuần tự hóa
  - Đổi repository cơ bản, có chỉ mục hoặc chuyển kho lưu trữ
  - Thay đổi định dạng khóa, namespace, tên cookie và kế hoạch chuyển tiếp
  - Phần mở rộng Hazelcast, MongoDB và thay đổi đơn vị duy trì
  - Rolling upgrade, rollback và kiểm thử tương thích phiên trước khi triển khai
- level1: Thực hành tích hợp
  level2:
  - Xây dựng ứng dụng lưu tùy chọn người dùng bằng HttpSession
  - Chuyển từ phiên trong bộ nhớ sang Redis và kiểm chứng qua hai nút
  - So sánh repository Redis cơ bản với repository có chỉ mục
  - Đăng nhập bằng Spring Security và kiểm tra đổi định danh phiên
  - Giới hạn số phiên, liệt kê phiên của người dùng và thu hồi theo yêu cầu
  - Thiết kế cookie hoặc header phiên cho một client cụ thể
  - Thay Redis bằng JDBC và kiểm chứng khác biệt về cleanup, sự kiện
  - Xây dựng bản WebFlux dùng ReactiveSessionRepository
  - Tích hợp WebSocket và kiểm tra hết hạn, đăng xuất
  - Tái hiện cập nhật đồng thời và đánh giá các chính sách lưu
  - Đổi serializer giữa hai bản ứng dụng rồi kiểm thử tương thích
  - Tạo sự cố kho, thu bằng chứng và thực hiện quy trình phục hồi
