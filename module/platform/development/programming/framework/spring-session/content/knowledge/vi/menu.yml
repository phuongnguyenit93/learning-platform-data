  - Phiên phân tán, định tuyến bám phiên (sticky session) và nhân bản của container
  - Spring Session, Spring Security và token JWT có trách nhiệm khác nhau
  - Lộ trình từ một phiên cục bộ đến quản lý phiên trên nhiều nút
