references:
  - title: "Spring AI — Getting Started"
    url: "https://docs.spring.io/spring-ai/reference/getting-started.html"
    description: "Cài đặt Spring AI, BOM, model provider và tương thích phiên bản Spring Boot."
  - title: "Spring AI — Chat Model API"
    url: "https://docs.spring.io/spring-ai/reference/api/chatmodel.html"
    description: "ChatModel, Prompt, ChatResponse và ChatOptions cho các provider."
  - title: "Spring AI — Chat Client API"
    url: "https://docs.spring.io/spring-ai/reference/api/chatclient.html"
    description: "Fluent ChatClient, call, stream, content, entity và response metadata."
  - title: "Spring AI — Prompts"
    url: "https://docs.spring.io/spring-ai/reference/api/prompt.html"
    description: "Prompt, role-based messages, templates và model options."
  - title: "Spring AI — Output Converters"
    url: "https://docs.spring.io/spring-ai/reference/api/structured-output/converters.html"
    description: "StructuredOutputConverter, Java object mapping và giới hạn chuyển đổi đầu ra."
  - title: "Spring AI — Tool Calling"
    url: "https://docs.spring.io/spring-ai/reference/api/tools.html"
    description: "Cách khai báo @Tool, thực thi tools và kiểm soát lời gọi từ model."
  - title: "Spring AI — Advisors API"
    url: "https://docs.spring.io/spring-ai/reference/api/advisors.html"
    description: "Advisor chain, can thiệp prompt/response và các điểm mở rộng."
  - title: "Spring AI — Embedding Model API"
    url: "https://docs.spring.io/spring-ai/reference/api/embeddings.html"
    description: "EmbeddingModel và vector biểu diễn dữ liệu làm cơ sở cho semantic search."
  - title: "Spring AI — Observability"
    url: "https://docs.spring.io/spring-ai/reference/observability/index.html"
    description: "Metrics, traces, token usage và lưu ý bảo vệ prompt/completion nhạy cảm."