references:
  - title: "Spring AI — Evaluation Testing"
    url: "https://docs.spring.io/spring-ai/reference/api/testing.html"
    description: "Evaluator, EvaluationRequest, RelevancyEvaluator, FactCheckingEvaluator và các ví dụ đánh giá phản hồi theo ngữ cảnh."
  - title: "Spring AI — Observability"
    url: "https://docs.spring.io/spring-ai/reference/observability/"
    description: "Micrometer observations, metrics/tracing cho ChatClient, advisor, chat model, tool, embedding và vector store; quyền riêng tư dữ liệu."
  - title: "Spring AI — Chat Client API"
    url: "https://docs.spring.io/spring-ai/reference/api/chatclient.html"
    description: "Luồng gọi ChatClient, SimpleLoggerAdvisor và gợi ý logging khi debug tương tác AI."
  - title: "Spring AI — Advisors API"
    url: "https://docs.spring.io/spring-ai/reference/api/advisors.html"
    description: "Chuỗi advisor trong call/stream, dữ liệu trong request/response và observability."
  - title: "Spring AI — Tool Calling"
    url: "https://docs.spring.io/spring-ai/reference/api/tools.html"
    description: "Luồng tool calling và telemetry đo thời lượng, metadata, rủi ro xuất tham số/kết quả tool."
  - title: "Spring Boot — Metrics"
    url: "https://docs.spring.io/spring-boot/reference/actuator/metrics.html"
    description: "Cấu hình Actuator/Micrometer, metrics endpoint và xuất OTLP/Prometheus."
  - title: "Spring Boot — Tracing"
    url: "https://docs.spring.io/spring-boot/reference/actuator/tracing.html"
    description: "Micrometer Tracing, OpenTelemetry, sampling, correlation và context propagation."
  - title: "Spring Boot — Actuator Endpoints"
    url: "https://docs.spring.io/spring-boot/reference/actuator/endpoints.html"
    description: "Quyền truy cập và exposure metrics/health/prometheus endpoints, lưu ý bảo mật khi mở monitoring."