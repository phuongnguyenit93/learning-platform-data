  - Asciidoctor không tìm thấy snippet
  - Plugin build không chạy đúng thứ tự dependency
  - Markdown include sai đường dẫn
  - Khác biệt hành vi giữa MockMvc và WebTestClient
  - Lỗi encoding hoặc ký tự Unicode trong tài liệu
  - Không tương thích phiên bản Spring Framework hoặc REST Assured
- level1: Nâng cấp
  level2:
  - Đọc yêu cầu phiên bản Spring REST Docs
  - Đối chiếu Spring Boot và Spring Framework tương thích
  - Chuyển giữa MockMvc, WebTestClient và REST Assured
  - Thay đổi API cấu hình hoặc package
  - Kiểm tra template và snippet sau khi nâng cấp
  - Kiểm tra output directory và plugin Asciidoctor
  - Đối chiếu URI, header và payload sau nâng cấp
  - Giữ tài liệu cũ có thể tái tạo trong giai đoạn chuyển tiếp
  - Xử lý thay đổi định dạng snippet
  - Chạy bộ test hồi quy trước khi phát hành
- level1: Thực hành tổng hợp
  level2:
  - Thiết lập dự án Spring MVC tạo tài liệu bằng MockMvc
  - Document CRUD resource với request và response fields
  - Document tìm kiếm với query parameters và phân trang
  - Document resource có path parameters và header
  - Document upload multipart bằng request parts
  - Document HATEOAS links và embedded resources
