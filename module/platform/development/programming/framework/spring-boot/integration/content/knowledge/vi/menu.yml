  - Không kết nối được do DNS, cổng, TLS hoặc quyền truy cập
  - Lỗi serializer, sai schema và không tương thích hợp đồng dữ liệu
  - Cạn pool, listener ngừng chạy và luồng bị chặn
  - Message mất, trùng hoặc sai thứ tự do hiểu sai acknowledge và commit
  - Job chạy trùng giữa các bản sao hoặc không khởi động lại được
  - Lỗi proxy AOP khi dùng @Transactional, @Async, @Retryable hoặc @Cacheable
  - Rà soát thay đổi phiên bản client, driver, broker và Spring Data
  - Kiểm thử tương thích khi nâng Spring Boot hoặc thêm starter bên thứ ba
- level1: Thực hành tổng hợp
  level2:
  - Xây dựng client HTTP khai báo với timeout, TLS và kiểm thử hợp đồng
  - Đọc dữ liệu từ SQL và gửi tới dịch vụ ngoài với ranh giới giao dịch rõ ràng
  - Xử lý dữ liệu reactive với R2DBC, WebClient và giới hạn tài nguyên
  - Tích hợp Redis cache với chính sách vô hiệu hóa sau cập nhật dữ liệu
  - Xây dựng luồng RabbitMQ hoặc Kafka có retry và dead-letter
  - Triển khai outbox, consumer chống trùng và đối soát sau lỗi
  - Xây dựng IntegrationFlow nhận tệp, kiểm tra, biến đổi và định tuyến
  - Lập lịch Quartz để khởi chạy batch có checkpoint và khả năng chạy lại
  - Gửi email qua hàng đợi với theo dõi kết quả và chống gửi trùng
  - Chuẩn bị dịch vụ thử nghiệm bằng Docker Compose hoặc Testcontainers
  - Quan sát một thao tác xuyên HTTP, cơ sở dữ liệu và broker
  - Mô phỏng lỗi từng phần và xác minh quy trình phục hồi dữ liệu
