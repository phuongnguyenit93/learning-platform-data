references:
  - title: "Spring Boot 3.3: Cấu hình bên ngoài (Externalized Configuration)"
    url: "https://docs.spring.io/spring-boot/3.3/reference/features/external-config.html"
    description: "Tài liệu chính về nguồn cấu hình, độ ưu tiên, Config Data, placeholder, liên kết kiểu và configtree:."
  - title: "Spring Boot 3.3: Profile"
    url: "https://docs.spring.io/spring-boot/3.3/reference/features/profiles.html"
    description: "Kích hoạt profile, profile mặc định, include, nhóm profile và giới hạn nơi khai báo."
  - title: "Spring Framework: Trừu tượng môi trường (Environment Abstraction)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/environment.html"
    description: "Quan hệ giữa Environment, nguồn thuộc tính và profile trong bộ chứa Spring."
  - title: "Spring Boot 3.3: Thuộc tính và cấu hình (Properties and Configuration)"
    url: "https://docs.spring.io/spring-boot/3.3/how-to/properties-and-configuration.html"
    description: "Các tình huống đặt và đọc cấu hình; phân biệt xử lý thuộc tính lúc dựng với placeholder của Spring."
  - title: "Spring Boot 3.3 API: ConfigurationProperties"
    url: "https://docs.spring.io/spring-boot/3.3/api/java/org/springframework/boot/context/properties/ConfigurationProperties.html"
    description: "Hợp đồng annotation, tiền tố khóa và liên kết qua setter hoặc constructor; khác biệt với @Value."
  - title: "Spring Boot 3.3 API: Binder"
    url: "https://docs.spring.io/spring-boot/3.3/api/java/org/springframework/boot/context/properties/bind/Binder.html"
    description: "API liên kết nguồn thuộc tính vào đối tượng, hỗ trợ giải placeholder và chuyển đổi kiểu."
  - title: "Spring Boot 3.3: Tạo metadata cấu hình bằng annotation processor"
    url: "https://docs.spring.io/spring-boot/3.3/specification/configuration-metadata/annotation-processor.html"
    description: "Cấu hình spring-boot-configuration-processor, mô tả khóa và giá trị mặc định phục vụ công cụ phát triển."
  - title: "Spring Boot 3.3: Kiểm thử ứng dụng Spring Boot"
    url: "https://docs.spring.io/spring-boot/3.3/reference/testing/spring-boot-applications.html"
    description: "Dùng ngữ cảnh kiểm thử Spring Boot và cấu hình theo tình huống để đối chiếu hành vi ứng dụng."
  - title: "Spring Boot 3.3: Actuator endpoint và che giá trị nhạy cảm"
    url: "https://docs.spring.io/spring-boot/3.3/reference/actuator/endpoints.html"
    description: "Vai trò của env/configprops, kiểm soát việc công bố endpoint và cơ chế che giá trị nhạy cảm."