references:
  - title: "Spring Boot 3.3: SpringApplication và vòng đời ứng dụng"
    url: "https://docs.spring.io/spring-boot/3.3/reference/features/spring-application.html"
    description: "Khởi động, sự kiện, runner, trạng thái hoạt động, thoát ứng dụng và lưu ý về virtual threads."
  - title: "Spring Boot 3.3 API: SpringApplication"
    url: "https://docs.spring.io/spring-boot/3.3/api/java/org/springframework/boot/SpringApplication.html"
    description: "Hợp đồng run/exit, chọn ngữ cảnh, đăng ký initializer/listener và thiết lập keep-alive."
  - title: "Spring Framework: Callback và vòng đời bean"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/factory-nature.html"
    description: "Phân biệt khởi tạo/hủy bean với các thao tác quản lý vòng đời thành phần."
  - title: "Spring Boot 3.3 API: ApplicationRunner"
    url: "https://docs.spring.io/spring-boot/3.3/api/java/org/springframework/boot/ApplicationRunner.html"
    description: "Thực hiện công việc lúc khởi động với ApplicationArguments và sắp thứ tự nhiều runner."
  - title: "Spring Framework 6.1 API: SmartLifecycle"
    url: "https://docs.spring.io/spring-framework/docs/6.1.21/javadoc-api/org/springframework/context/SmartLifecycle.html"
    description: "Tự khởi động, thứ tự phase và hợp đồng callback khi dừng bất đồng bộ."
  - title: "Spring Boot 3.3: Thực thi và lập lịch tác vụ"
    url: "https://docs.spring.io/spring-boot/3.3/reference/features/task-execution-and-scheduling.html"
    description: "Executor, scheduler do Boot cấu hình, tham số bộ thực thi và thay đổi khi bật virtual threads."
  - title: "Spring Boot 3.3 API: ApplicationAvailability"
    url: "https://docs.spring.io/spring-boot/3.3/api/java/org/springframework/boot/availability/ApplicationAvailability.html"
    description: "Đọc LivenessState, ReadinessState và liên hệ AvailabilityChangeEvent để cập nhật trạng thái."
  - title: "Spring Boot 3.3: Dừng có kiểm soát (Graceful Shutdown)"
    url: "https://docs.spring.io/spring-boot/3.3/reference/web/graceful-shutdown.html"
    description: "Bật graceful shutdown cho máy chủ web nhúng và cấu hình thời hạn chờ trong từng phase dừng."
  - title: "Spring Boot 3.3 API: ExitCodeGenerator"
    url: "https://docs.spring.io/spring-boot/3.3/api/java/org/springframework/boot/ExitCodeGenerator.html"
    description: "Cung cấp mã thoát ứng dụng và tích hợp với SpringApplication.exit."
  - title: "Spring Boot 3.3 API: BufferingApplicationStartup"
    url: "https://docs.spring.io/spring-boot/3.3/api/java/org/springframework/boot/context/metrics/buffering/BufferingApplicationStartup.html"
    description: "Ghi thời điểm và thời lượng từng bước khởi động, giới hạn bộ đệm và đọc dòng thời gian đã ghi."