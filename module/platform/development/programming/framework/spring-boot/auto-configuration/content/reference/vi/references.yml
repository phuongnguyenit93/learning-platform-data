references:
  - title: "Auto-configuration"
    url: "https://docs.spring.io/spring-boot/3.3/reference/using/auto-configuration.html"
    description: "Nguyên tắc cấu hình tự động, thay thế mặc định, loại trừ và quan sát báo cáo điều kiện."
  - title: "Creating Your Own Auto-configuration"
    url: "https://docs.spring.io/spring-boot/3.3/reference/features/developing-auto-configuration.html"
    description: "Tạo cấu hình tự động, đăng ký ứng viên, thiết kế điều kiện, starter và kiểm thử."
  - title: "AutoConfiguration"
    url: "https://docs.spring.io/spring-boot/3.3/api/java/org/springframework/boot/autoconfigure/AutoConfiguration.html"
    description: "API khai báo cấu hình tự động và quan hệ thứ tự before, after."
  - title: "AutoConfigurationImportSelector"
    url: "https://docs.spring.io/spring-boot/3.3/api/java/org/springframework/boot/autoconfigure/AutoConfigurationImportSelector.html"
    description: "API phục vụ tìm ứng viên, lựa chọn nhập và xử lý loại trừ cấu hình."
  - title: "ConditionalOnProperty"
    url: "https://docs.spring.io/spring-boot/3.3/api/java/org/springframework/boot/autoconfigure/condition/ConditionalOnProperty.html"
    description: "Quy tắc so khớp thuộc tính, havingValue và hành vi khi thiếu thuộc tính."
  - title: "ConditionalOnMissingBean"
    url: "https://docs.spring.io/spring-boot/3.3/api/java/org/springframework/boot/autoconfigure/condition/ConditionalOnMissingBean.html"
    description: "Điều kiện theo bean chưa tồn tại, kiểu bean và thời điểm xét các định nghĩa đã đăng ký."
  - title: "Conditions Evaluation Report (conditions)"
    url: "https://docs.spring.io/spring-boot/3.3/api/rest/actuator/conditions.html"
    description: "Cấu trúc báo cáo điều kiện qua điểm truy cập Actuator conditions."
  - title: "ApplicationContextRunner"
    url: "https://docs.spring.io/spring-boot/3.3/api/java/org/springframework/boot/test/context/runner/ApplicationContextRunner.html"
    description: "API tạo ngữ cảnh không có web để kiểm thử cấu hình với thuộc tính, bean và bộ nạp lớp được kiểm soát."