references:
  - title: "Testing"
    url: "https://docs.spring.io/spring-boot/3.3/reference/testing/index.html"
    description: "Tổng quan công cụ kiểm thử và spring-boot-starter-test trong Spring Boot 3.3."
  - title: "Testing Spring Boot Applications"
    url: "https://docs.spring.io/spring-boot/3.3/reference/testing/spring-boot-applications.html"
    description: "Ngữ cảnh kiểm thử, test slice, giả lập bean, kiểm thử web và dữ liệu trên Spring Boot 3.3."
  - title: "Testcontainers"
    url: "https://docs.spring.io/spring-boot/3.3/reference/testing/testcontainers.html"
    description: "Tích hợp Testcontainers và kết nối dịch vụ phục vụ kiểm thử trong Spring Boot 3.3."
  - title: "JUnit 5 User Guide"
    url: "https://docs.junit.org/5.10.2/user-guide/"
    description: "Vòng đời kiểm thử JUnit Jupiter, kiểm tra kết quả, ngoại lệ và kiểm thử với nhiều bộ dữ liệu."
  - title: "Mockito"
    url: "https://javadoc.io/static/org.mockito/mockito-core/5.11.0/org/mockito/Mockito.html"
    description: "Tạo đối tượng giả lập, thiết lập phản hồi và xác minh tương tác bằng Mockito."
  - title: "Transaction Management"
    url: "https://docs.spring.io/spring-framework/reference/testing/testcontext-framework/tx.html"
    description: "Giao dịch do bài kiểm thử quản lý, rollback và cách tránh kết quả thành công sai khi chưa flush."
  - title: "Context Caching"
    url: "https://docs.spring.io/spring-framework/reference/testing/testcontext-framework/ctx-management/caching.html"
    description: "Cơ chế tái sử dụng ngữ cảnh Spring và tác động của cấu hình đến tốc độ chạy kiểm thử."
  - title: "Testing in Java & JVM projects"
    url: "https://docs.gradle.org/current/userguide/java_testing.html"
    description: "Thực thi, lọc và đọc báo cáo kiểm thử trong dự án Java dùng Gradle."