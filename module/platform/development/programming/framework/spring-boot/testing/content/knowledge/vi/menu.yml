menu:
- level1: Bức tranh kiểm thử
  level2:
  - Kiểm thử tự động giải quyết vấn đề gì khi phát triển ứng dụng Spring Boot
  - Một ca kiểm thử gồm điều kiện ban đầu, hành động và kết quả mong đợi
  - Đơn vị được kiểm thử và các ranh giới phụ thuộc
  - Phân biệt unit test, test slice, integration test và kiểm thử đầu cuối
  - Ứng dụng chạy được, context khởi động được và nghiệp vụ đúng là các bằng chứng khác nhau
  - Vai trò của JUnit, Spring Test, Spring Boot Test, Mockito và Testcontainers
  - Kiểm thử hành vi quan sát được và tránh bám chặt cách hiện thực
  - Tính độc lập, lặp lại được và phản hồi nhanh của bộ kiểm thử
  - Trình tự học từ kiểm thử không có Spring đến tích hợp nhiều thành phần
- level1: Chiến lược kiểm thử
  level2:
  - Chọn cấp kiểm thử theo rủi ro và phạm vi cần chứng minh
  - Phân bổ unit test, slice test và integration test theo kiến trúc
  - Ma trận trường hợp thành công, đầu vào sai, biên và phụ thuộc lỗi
  - Phân biệt kiểm thử chức năng, hợp đồng, bảo mật và hiệu năng
  - Chọn thành phần thật, fake, stub, mock hoặc dịch vụ trong container
  - Arrange–Act–Assert và Given–When–Then để mô tả hành vi
  - Viết kiểm thử hồi quy trước hoặc cùng lúc sửa lỗi
  - Vòng lặp TDD và lựa chọn điểm áp dụng trong Spring Boot
  - Đặt tên ca kiểm thử theo tình huống và kết quả
  - Độ bao phủ mã nguồn, độ mạnh của assertion và giới hạn của các con số
  - Chi phí bảo trì và cách nhận diện kiểm thử giá trị thấp
- level1: Thiết lập kiểm thử
  level2:
  - Cấu trúc src/test/java, src/test/resources và cách tổ chức package
  - Dependency kiểm thử và phạm vi testImplementation, testRuntimeOnly
  - Spring Boot dependency management và tương thích thư viện kiểm thử
  - Starter kiểm thử chung và các module theo công nghệ ở từng dòng Spring Boot
  - JUnit Platform, Jupiter và Vintage trong quá trình phát hiện test
  - Cấu hình Gradle useJUnitPlatform và thực thi test bằng wrapper
  - Chạy một lớp, một phương thức hoặc một nhóm tag
  - Cấu hình IDE và đối chiếu với cách chạy trên dòng lệnh
  - Classpath, tài nguyên kiểm thử và khác biệt với môi trường ứng dụng
  - Đọc báo cáo lỗi, stack trace và xác định ca kiểm thử thực sự đã chạy
- level1: JUnit Jupiter
  level2:
  - '@Test, @DisplayName và cấu trúc lớp kiểm thử'
  - '@BeforeEach, @AfterEach, @BeforeAll và @AfterAll'
  - Vòng đời PER_METHOD, PER_CLASS và trạng thái dùng chung
  - '@Nested để nhóm các tình huống liên quan'
  - '@ParameterizedTest với nguồn dữ liệu đơn giản'
  - '@MethodSource, @CsvSource và @CsvFileSource'
  - Kiểm thử giá trị null, rỗng, biên và tổ hợp đầu vào
  - '@Tag và phân nhóm theo mục đích thực thi'
  - Assumption, điều kiện môi trường và lý do bỏ qua test
  - Timeout và khác biệt giữa giới hạn thời gian thông thường với preemptive timeout
  - Extension model, MockitoExtension và SpringExtension
  - '@TempDir cho tài nguyên tạm và dọn dữ liệu sau test'
- level1: Assertion
  level2:
  - Chọn kết quả quan sát được để xác nhận hành vi
  - JUnit assertions và nhóm nhiều điều kiện kiểm chứng
  - 'AssertJ: fluent assertions và thông điệp lỗi dễ đọc'
  - So sánh collection, thứ tự, phần tử trùng và tập rỗng
  - So sánh đối tượng theo thuộc tính và recursive comparison
  - Kiểm tra exception, nguyên nhân và thông điệp phù hợp
  - Kiểm tra thời gian, số thập phân và sai số được chấp nhận
  - JSON assertions, JSONPath và so sánh cấu trúc
  - Soft assertions và phạm vi sử dụng có kiểm soát
  - Tránh assertion luôn đúng, quá yếu hoặc phụ thuộc chi tiết không liên quan
- level1: Mockito
  level2:
  - Mock, stub, fake và spy trong thiết kế kiểm thử
  - '@Mock, @InjectMocks và khởi tạo qua MockitoExtension'
  - when–thenReturn, thenThrow và mô phỏng nhiều lần gọi
  - ArgumentMatchers, eq và quy tắc dùng matcher nhất quán
  - ArgumentCaptor để kiểm tra dữ liệu gửi đến phụ thuộc
  - verify, số lần gọi và thứ tự khi hành vi yêu cầu
  - doReturn, doThrow và giới hạn khi làm việc với spy
  - Strict stubbing và phát hiện cấu hình giả lập không được sử dụng
  - Mock phương thức void, final hoặc static theo khả năng phiên bản
  - Khép phạm vi static mock và tránh làm rò trạng thái giữa các test
  - Phân biệt mock đối tượng Java với thay thế bean trong Spring context
  - Giới hạn over-mocking và kiểm thử chỉ lặp lại mã hiện thực
- level1: Unit test nghiệp vụ
  level2:
  - Kiểm thử service bằng constructor injection mà không khởi động Spring
  - Giả lập repository và kiểm chứng quy tắc nghiệp vụ
  - Kiểm thử validator, mapper và phép biến đổi dữ liệu
  - Phân biệt lỗi đầu vào với lỗi phụ thuộc hoặc trạng thái nghiệp vụ
  - Kiểm thử biên, trạng thái chuyển tiếp và nhánh xử lý lỗi
  - Đưa Clock vào thiết kế để kiểm thử logic theo thời gian
  - Kiểm soát ngẫu nhiên, UUID và bộ sinh định danh
  - Kiểm tra tính lũy đẳng và hành vi khi thao tác bị gọi lại
  - Kiểm thử dữ liệu gửi ra ngoài thay vì chỉ đếm lời gọi
  - Giới hạn của unit test với transaction, proxy, validation và cấu hình Spring
- level1: Spring TestContext
  level2:
  - TestContext framework và vai trò của SpringExtension
  - Khởi tạo ApplicationContext, tiêm phụ thuộc và thực thi test
  - '@ContextConfiguration và khai báo cấu hình tối thiểu'
  - '@SpringJUnitConfig khi cần Spring nhưng không cần Spring Boot'
  - TestExecutionListener và các giai đoạn vòng đời kiểm thử
  - Context hierarchy và phạm vi cấu hình cha, con
  - Dependency injection vào test instance và constructor
  - Kế thừa cấu hình, lớp @Nested và annotation tổng hợp
  - 'Proxy Spring trong test: transaction, cache và method security'
  - Phân biệt lỗi tải context với lỗi assertion hoặc lỗi nghiệp vụ
- level1: Cấu hình môi trường test
  level2:
  - Tìm @SpringBootConfiguration và ảnh hưởng của cấu trúc package
  - Nested @Configuration và @TestConfiguration trong lớp kiểm thử
  - '@Import để bổ sung cấu hình hoặc bean cần thiết'
  - '@ActiveProfiles và application-test.yml'
  - '@TestPropertySource và properties trên annotation kiểm thử'
  - '@DynamicPropertySource cho port, URL và tài nguyên tạo động'
  - Thứ tự ưu tiên cấu hình và cách xác minh giá trị thực sự được dùng
  - '@ConfigurationProperties, binding và validation trong test'
  - Tách cấu hình kiểm thử khỏi secret và dịch vụ production
  - Điều khiển command-line arguments và thuộc tính khởi động theo phiên bản
  - Dùng cấu hình dùng chung mà vẫn giữ ranh giới từng nhóm test
- level1: Thay thế bean
  level2:
  - '@MockBean, @SpyBean và phạm vi áp dụng trong các dòng Spring Boot cũ'
  - '@MockitoBean, @MockitoSpyBean và phiên bản Spring Framework hỗ trợ'
  - Thay bean theo type, tên và qualifier khi có nhiều ứng viên
  - Thêm mock khi thiếu bean so với bắt buộc thay bean đã tồn tại
  - Spy bean thật, tác động phụ và cách stub an toàn
  - Reset mock giữa các ca kiểm thử và trạng thái dùng chung
  - '@TestBean hoặc @TestConfiguration để cung cấp fake, stub'
  - '@Primary, @Qualifier và giới hạn của việc bật bean definition overriding'
  - Bean bị mock và ảnh hưởng đến proxy transaction, cache hoặc security
  - Ảnh hưởng của khai báo mock tới khóa cache ApplicationContext
  - Chọn test double ở đúng ranh giới thay vì mock toàn bộ chuỗi nghiệp vụ
- level1: '@SpringBootTest'
  level2:
  - '@SpringBootTest tải ứng dụng theo cơ chế Spring Boot như thế nào'
  - webEnvironment MOCK, NONE, RANDOM_PORT và DEFINED_PORT
  - MOCK không đồng nghĩa có embedded server đang lắng nghe
  - '@AutoConfigureMockMvc với context đầy đủ'
  - '@AutoConfigureWebTestClient và điều kiện hỗ trợ của ứng dụng'
  - Khởi động server thật với RANDOM_PORT
  - '@LocalServerPort, management port và địa chỉ gọi trong test'
  - Chọn classes, properties và các tùy chọn khởi động cần kiểm chứng
  - ApplicationRunner, CommandLineRunner và tác động khi tải ứng dụng
  - Giao dịch trên luồng HTTP server khác với giao dịch của phương thức test
  - Kiểm tra context khởi động và kiểm tra hành vi ứng dụng
  - Tiêu chí dùng full context thay cho unit test hoặc test slice
- level1: Test slice
  level2:
  - Test slice giới hạn những bean và auto-configuration nào
  - Chọn @WebMvcTest, @WebFluxTest, @JsonTest hoặc slice dữ liệu
  - TypeExcludeFilter, component scan và nguyên nhân bean ngoài phạm vi xuất hiện
  - Bổ sung dependency cần thiết bằng import hoặc bean thay thế
  - Phân biệt cấu hình slice với context ứng dụng đầy đủ
  - '@OverrideAutoConfiguration và @ImportAutoConfiguration'
  - Include filter, exclude filter và phạm vi quét thành phần
  - '@AutoConfigureTestDatabase và chính sách thay thế DataSource'
  - Không chồng nhiều slice để tạo một context không rõ phạm vi
  - Ma trận chọn slice theo thành phần và bằng chứng cần thu được
- level1: Spring MVC
  level2:
  - '@WebMvcTest và phạm vi Controller, advice, converter, filter'
  - 'MockMvc: standaloneSetup và webAppContextSetup'
  - Gửi request với path variable, query parameter, header và body
  - Kiểm tra status, header, content type và nội dung phản hồi
  - JSONPath, JSON assertions và dữ liệu trả về
  - Bean Validation, binding lỗi và phản hồi đầu vào không hợp lệ
  - '@ControllerAdvice, exception handler và ProblemDetail'
  - Filter, interceptor, argument resolver và cấu hình MVC tùy chỉnh
  - Multipart, upload và giới hạn dữ liệu
  - Async request, asyncDispatch và xử lý phản hồi bất đồng bộ
  - MockMvcTester trong các phiên bản hỗ trợ
  - Giới hạn của MockMvc so với gọi server qua HTTP thật
- level1: Spring WebFlux
  level2:
  - '@WebFluxTest và thành phần web được đưa vào context'
  - WebTestClient gắn Controller, ApplicationContext hoặc server thật
  - Kiểm thử annotated Controller và functional endpoint
  - Gửi request và kiểm tra status, header, body
  - Kiểm tra Mono, Flux và dữ liệu nhiều phần tử
  - Validation, codec và xử lý lỗi của WebFlux
  - Filter Reactive và cấu hình phụ thuộc của slice
  - Kiểm thử streaming, SSE và giới hạn thời gian chờ
  - Kiểm tra Reactor Context được truyền trong chuỗi xử lý
  - Phân biệt lỗi ứng dụng với lỗi do block hoặc subscribe sai cách
  - Giới hạn của web slice khi cần kiểm chứng toàn bộ ứng dụng
- level1: Luồng Reactive
  level2:
  - reactor-test và kiểm thử publisher ngoài Spring context
  - 'StepVerifier: giá trị, hoàn tất và tín hiệu lỗi'
  - Kiểm tra thứ tự phần tử và dữ liệu bị loại bỏ
  - Virtual time cho delay, timeout và retry
  - Tạo publisher đúng thời điểm khi dùng withVirtualTime
  - TestPublisher để điều khiển dữ liệu và tín hiệu từ phụ thuộc
  - PublisherProbe để kiểm tra nhánh fallback được đăng ký
  - Kiểm thử demand, backpressure và cancellation
  - Kiểm thử Reactor Context và ranh giới chuyển scheduler
  - Giới hạn thời gian xác minh và dọn scheduler sau test
- level1: HTTP tích hợp
  level2:
  - Chọn kiểm thử HTTP thật khi cần kiểm chứng embedded server
  - TestRestTemplate, WebTestClient và RestTestClient theo dòng phiên bản
  - Cấu hình base URL từ RANDOM_PORT thay vì gắn cứng port
  - Kiểm tra hợp đồng status, header, JSON và thông báo lỗi
  - Cookie, session, redirect và nhiều request liên tiếp
  - Kiểm thử upload, download và phản hồi có kích thước lớn
  - Dữ liệu được commit trên server và chiến lược dọn sau test
  - Kiểm thử management endpoint trên port riêng
  - Phân biệt kiểm thử HTTP phía backend với kiểm thử đầu cuối qua trình duyệt
  - Giới hạn của mock web environment với filter container và cấu hình mạng
- level1: JSON và serialization
  level2:
  - '@JsonTest và phạm vi hỗ trợ serialization'
  - JacksonTester, JsonbTester, GsonTester hoặc BasicJsonTester theo thư viện
  - Kiểm tra JSON đầu ra theo cấu trúc và thuộc tính quan trọng
  - Deserialize đầu vào hợp lệ, thiếu trường, sai kiểu hoặc dư trường
  - Naming strategy, null, enum và định dạng ngày giờ
  - Custom serializer, deserializer, module và @JsonComponent
  - Round-trip serialization và giới hạn của việc chỉ kiểm tra hai chiều
  - Kiểm tra trường nhạy cảm không xuất hiện trong phản hồi
  - JSON fixture, charset và tính ổn định khi so sánh
  - Đối chiếu cấu hình mapper trong test với mapper ứng dụng thực tế
- level1: GraphQL và SOAP
  level2:
  - '@GraphQlTest và phạm vi resolver, controller được kiểm thử'
  - GraphQlTester cho query, mutation và biến đầu vào
  - Kiểm tra data path, GraphQL errors và nullability
  - ExecutionGraphQlServiceTester so với kiểm thử qua HTTP
  - HttpGraphQlTester và kiểm chứng transport, authentication
  - Kiểm thử subscription và dữ liệu phát ra
  - Kiểm thử resolver phụ thuộc service, DataLoader và ngữ cảnh
  - '@WebServiceClientTest cho ứng dụng SOAP client'
  - '@WebServiceServerTest và MockWebServiceClient theo phiên bản hỗ trợ'
  - Kiểm tra XML payload, SOAP fault và ánh xạ lỗi
  - Chọn kiểm thử hợp đồng hay tích hợp transport theo rủi ro
- level1: Spring Data JPA
  level2:
  - '@DataJpaTest và thành phần persistence được tự cấu hình'
  - Embedded database, database thật và @AutoConfigureTestDatabase
  - TestEntityManager với persist, flush, clear và find
  - Kiểm thử derived query, JPQL và native query
  - Phân biệt dữ liệu trong persistence context với dữ liệu đã ghi xuống database
  - Ràng buộc unique, foreign key và thời điểm phát sinh lỗi
  - Mapping quan hệ, cascade, orphan removal và lazy loading
  - Phân trang, sắp xếp, projection và dữ liệu tổng
  - Kiểm thử optimistic locking và xung đột cập nhật
  - H2 khác database production ở dialect, kiểu dữ liệu và hành vi SQL
  - Kiểm chứng migration và schema thay vì chỉ dựa vào tự tạo bảng
  - Giới hạn rollback mặc định đối với các hành vi cần commit thật
- level1: JDBC và dữ liệu SQL
  level2:
  - '@JdbcTest và kiểm thử JdbcTemplate'
  - '@DataJdbcTest cho Spring Data JDBC'
  - '@JooqTest và cấu hình DSLContext'
  - '@DataR2dbcTest và kiểm thử truy cập dữ liệu Reactive'
  - Kiểm tra row mapping, giá trị null và chuyển đổi kiểu
  - Kiểm tra câu lệnh SQL, điều kiện lọc và số dòng bị tác động
  - Generated key, batch update và ràng buộc database
  - Giao dịch JDBC so với giao dịch Reactive trong kiểm thử
  - Kiểm thử stored procedure hoặc tính năng riêng của database khi có sử dụng
  - Chọn slice hoặc full context để kiểm chứng cấu hình DataSource thực tế
- level1: Dữ liệu ngoài SQL
  level2:
  - '@DataMongoTest và kiểm thử document, mapping, query'
  - '@DataRedisTest với cache, TTL và cấu trúc dữ liệu được sử dụng'
  - '@DataElasticsearchTest và khác biệt của khả năng hỗ trợ theo phiên bản'
  - '@DataNeo4jTest cho quan hệ và truy vấn đồ thị'
  - '@DataCassandraTest, @DataCouchbaseTest hoặc @DataLdapTest khi ứng dụng có tích hợp'
  - Khởi tạo dịch vụ thật bằng container và cấu hình kết nối động
  - Dọn collection, key, index hoặc dữ liệu giữa các test
  - Eventual consistency, refresh index và chờ điều kiện quan sát được
  - Phiên bản dịch vụ, mapping và giới hạn của bản giả lập
  - Kiểm thử tính năng giao dịch theo khả năng của từng hệ lưu trữ
- level1: Giao dịch kiểm thử
  level2:
  - Test-managed transaction, transaction của ứng dụng và transaction của database
  - '@Transactional trên test và phạm vi rollback mặc định'
  - '@Rollback, @Commit và kiểm soát dữ liệu sau mỗi test'
  - TestTransaction để kết thúc và mở lại giao dịch có chủ đích
  - '@BeforeTransaction và @AfterTransaction'
  - Flush để quan sát lỗi SQL trước khi transaction kết thúc
  - REQUIRES_NEW và dữ liệu có thể được commit ngoài transaction của test
  - HTTP thật, @Async và lời gọi chạy ngoài luồng transaction của test
  - Preemptive timeout và rủi ro thao tác ngoài ngữ cảnh giao dịch
  - Kiểm thử after-commit event và tác vụ chỉ chạy sau commit
  - Giao dịch Reactive và khác biệt với cơ chế ThreadLocal
  - Chiến lược dọn dữ liệu khi rollback không bao phủ toàn bộ thao tác
- level1: Dữ liệu kiểm thử
  level2:
  - Fixture, object builder và dữ liệu có ý nghĩa theo từng tình huống
  - Tạo dữ liệu tối thiểu để quan sát một hành vi
  - '@Sql, @SqlGroup và thời điểm chạy script'
  - '@SqlConfig, transaction mode và script dọn dữ liệu'
  - Flyway, Liquibase và kiểm chứng nâng cấp schema
  - Tách dữ liệu kiểm thử khỏi seed data của ứng dụng
  - Định danh, thời gian, múi giờ và locale có thể lặp lại
  - Dữ liệu biên, ký tự Unicode, null và quan hệ không hợp lệ
  - Schema, database hoặc namespace riêng cho từng nhóm test
  - Tránh phụ thuộc thứ tự và dữ liệu còn lại từ test trước
  - Kiểm thử truy vấn với kích thước, phân bố và đặc điểm dữ liệu phù hợp
- level1: Testcontainers
  level2:
