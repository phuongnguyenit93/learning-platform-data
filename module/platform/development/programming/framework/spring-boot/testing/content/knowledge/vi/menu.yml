  - Clock, scheduler và kiểm thử tác vụ theo thời gian
  - Tách logic nghiệp vụ khỏi @Scheduled để kiểm thử độc lập
  - Kiểm soát việc tự chạy scheduler khi khởi động context test
  - Truyền SecurityContext, tenant và correlation ID sang tác vụ
  - Timeout, hủy tác vụ và dọn thread sau test
  - Kiểm thử Spring Batch job, step và tham số khi ứng dụng có sử dụng
  - Kiểm thử chạy lại, xử lý trùng và lỗi giữa chừng
  - Giới hạn của executor đồng bộ khi cần chứng minh hành vi đồng thời
