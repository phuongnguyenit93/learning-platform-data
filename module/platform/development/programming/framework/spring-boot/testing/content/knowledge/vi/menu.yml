  - '@DynamicPropertySource khi cần tự cung cấp cấu hình kết nối'
  - Phân biệt container dùng chung với dữ liệu dùng chung
  - Chọn image, ghim phiên bản và kiểm soát tính lặp lại
  - Mapped port, container network và URL từ ứng dụng đến dịch vụ
  - Wait strategy, readiness và kiểm tra dịch vụ thực sự sẵn sàng
  - Dọn tài nguyên, log container và chẩn đoán startup lỗi
  - Container reuse, context cache và giới hạn khi chạy song song
  - Chạy Testcontainers trên CI với quyền, tài nguyên và Docker phù hợp
  - Docker Compose trong test và lựa chọn theo khả năng hỗ trợ của Spring Boot
- level1: HTTP client và giả lập
