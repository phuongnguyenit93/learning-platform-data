  - HTTP stub server cho WebClient và client cần kiểm chứng transport
  - Kiểm tra URL, method, header, query, body và số lần gọi
  - Giả lập phản hồi thành công, dữ liệu sai và mã lỗi
  - Timeout, chậm phản hồi, ngắt kết nối và giới hạn retry
  - Fallback, circuit breaker và tránh gọi lặp ngoài dự kiến
  - Kiểm tra propagation của token, correlation ID và header cần thiết
  - Khởi động stub ở port động, reset expectation và dọn sau test
  - Giới hạn của mock tại lớp Java so với server giả lập qua HTTP
- level1: Messaging
  level2:
  - Phân biệt unit test listener với tích hợp qua broker thật
  - Giả lập producer, consumer hoặc adapter ở ranh giới nghiệp vụ
  - Embedded Kafka và Kafka trong Testcontainers
  - RabbitMQ trong container và công cụ kiểm thử của Spring AMQP
  - Topic, queue, consumer group và cách ly dữ liệu kiểm thử
  - Serialization, header, routing key và schema thông điệp
  - Chờ listener sẵn sàng trước khi gửi dữ liệu
  - Xác nhận xử lý bất đồng bộ bằng điều kiện có thời hạn
  - Retry, redelivery, dead-letter và kiểm tra lỗi không bị mất
  - Thông điệp trùng, tính lũy đẳng và tác động nghiệp vụ
  - Transaction, outbox và quan hệ giữa ghi database với gửi thông điệp
  - Dọn broker state, offset và tài nguyên sau từng nhóm test
