  - Cơ chế /error, BasicErrorController và ErrorAttributes trong Servlet
  - Trang lỗi HTML, whitelabel và phản hồi JSON mặc định
  - '@ExceptionHandler, @ControllerAdvice và @RestControllerAdvice'
  - ResponseStatusException, @ResponseStatus và lựa chọn mã HTTP
