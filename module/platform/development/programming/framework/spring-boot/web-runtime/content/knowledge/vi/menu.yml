  - Phân biệt lỗi binding, lỗi Bean Validation và lỗi nghiệp vụ
  - BindingResult trong MVC và điều kiện xử lý tại Controller
  - WebExchangeBindException và lỗi kiểm tra dữ liệu trong WebFlux
  - Kiểm tra phương thức và thay đổi cơ chế hỗ trợ theo phiên bản Spring
  - Tùy chỉnh thông báo lỗi và bản địa hóa
  - Thiết kế phản hồi lỗi theo trường mà không lộ dữ liệu đầu vào nhạy cảm
- level1: Xử lý lỗi
  level2:
