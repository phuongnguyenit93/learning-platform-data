  - Giới hạn kích thước header yêu cầu và cấu hình theo máy chủ
  - Giới hạn kết nối, hàng đợi chờ và số yêu cầu đồng thời
  - Thời gian chờ kết nối, keep-alive và giới hạn riêng của máy chủ
  - Mã hóa ký tự, URI và xử lý Unicode
  - Truyền cấu hình qua tệp, biến môi trường và tham số dòng lệnh
  - Đối chiếu thuộc tính hỗ trợ và giá trị mặc định theo phiên bản
- level1: Luồng Spring MVC
  level2:
  - Đường đi qua Servlet container, FilterChain và DispatcherServlet
  - Đăng ký DispatcherServlet và ánh xạ yêu cầu trong Spring Boot
  - HandlerMapping và lựa chọn Controller hoặc handler chức năng
  - HandlerAdapter và gọi phương thức xử lý yêu cầu
  - HandlerMethodArgumentResolver và tạo đối số đầu vào
  - HttpMessageConverter và xử lý nội dung yêu cầu, phản hồi
  - ViewResolver và dựng giao diện từ tên view
  - HandlerExceptionResolver và chuỗi xử lý ngoại lệ
  - RequestContext, ServletRequestAttributes và phạm vi dữ liệu theo yêu cầu
  - Thời điểm phản hồi được commit và giới hạn thay đổi status hoặc header
- level1: Tùy chỉnh MVC
  level2:
  - Những thành phần Spring Boot tự cấu hình cho Spring MVC
  - WebMvcConfigurer và bổ sung cấu hình mà vẫn giữ mặc định của Boot
  - Ảnh hưởng của @EnableWebMvc và WebMvcConfigurationSupport
  - Bổ sung formatter, converter và argument resolver
  - Tùy chỉnh HttpMessageConverter mà không làm mất bộ chuyển đổi mặc định
  - Đăng ký interceptor, view controller và resource handler
  - PathPatternParser, mẫu đường dẫn và lựa chọn chiến lược khớp đường dẫn
  - Xử lý dấu gạch chéo cuối, ký tự mã hóa và đường dẫn không khớp
  - Cấu hình content negotiation và tránh suy luận định dạng không mong muốn
  - Quan hệ giữa spring.mvc.*, spring.web.* và cấu hình bằng Java
- level1: Luồng Spring WebFlux
  level2:
  - Đường đi qua máy chủ reactive, HttpHandler và WebHandler
  - DispatcherHandler, HandlerMapping và HandlerAdapter
  - Controller dùng annotation và handler dùng RouterFunction
  - Mono, Flux và thời điểm thực thi sau khi có đăng ký
  - HandlerResultHandler và ghi kết quả vào phản hồi
  - ServerWebExchange và vòng đời yêu cầu reactive
  - HttpMessageReader, HttpMessageWriter và bộ codec
  - WebFilter, WebExceptionHandler và xử lý trước hoặc sau handler
  - Event loop và sự khác biệt với mô hình một luồng xử lý Servlet
  - Ranh giới hỗ trợ WebFlux trên máy chủ Servlet và trên Reactor Netty
- level1: Tùy chỉnh WebFlux
  level2:
  - Những thành phần Spring Boot tự cấu hình cho WebFlux
  - WebFluxConfigurer và bổ sung cấu hình giữ lại mặc định của Boot
  - Ảnh hưởng của @EnableWebFlux và cấu hình thay thế
  - CodecCustomizer và cấu hình codec ở mức ứng dụng
  - Tùy chỉnh formatter, argument resolver và nội dung phản hồi
  - Thiết lập spring.webflux.base-path và ánh xạ tài nguyên
  - ReactorResourceFactory và vòng đời tài nguyên HTTP dùng chung
  - Phân biệt cấu hình máy chủ reactive với cấu hình WebClient
  - Giới hạn dữ liệu được gom trong bộ nhớ khi đọc nội dung
  - Kiểm tra cấu hình thực tế khi thư viện bổ sung bean làm thay đổi mặc định
- level1: Định tuyến web
  level2:
  - '@Controller, @RestController và trách nhiệm của lớp tiếp nhận yêu cầu'
  - '@RequestMapping, HTTP method, consumes và produces'
  - Phân biệt định tuyến theo đường dẫn, header và query parameter
  - Biến đường dẫn, kiểu dữ liệu và trường hợp không khớp
  - RouterFunction, HandlerFunction và ServerResponse trong WebFlux.fn
  - Định tuyến chức năng với WebMvc.fn và phân biệt API với WebFlux.fn
  - Ghép route, nhóm đường dẫn và thứ tự lựa chọn handler
  - Kết hợp Controller và router chức năng trong một ứng dụng
  - ResponseEntity, mã trạng thái, header và phản hồi không có nội dung
  - Phân biệt 404, 405, 406 và 415 từ điều kiện định tuyến hoặc định dạng
  - Thiết kế URL nhất quán với context path và đường dẫn công khai
- level1: Dữ liệu yêu cầu
  level2:
  - Đọc path variable, query parameter, header và cookie
  - '@RequestBody, @ModelAttribute và cơ chế tạo đối tượng đầu vào'
  - Chuyển đổi kiểu dữ liệu và định dạng ngày giờ
  - Giá trị mặc định, tham số tùy chọn và dữ liệu bị thiếu
  - Ràng buộc trường dữ liệu và phòng tránh cập nhật thuộc tính ngoài ý muốn
  - Phân biệt lỗi đọc JSON với lỗi chuyển đổi tham số
  - Đọc HttpServletRequest trong MVC và ServerWebExchange trong WebFlux
  - Giới hạn đọc lại request body và cách dùng bộ bọc hoặc decorator
  - Truyền dữ liệu lớn theo luồng thay vì gom toàn bộ vào bộ nhớ
  - Không tin cậy tên tệp, header hoặc thuộc tính do máy khách cung cấp
- level1: JSON và codec
  level2:
  - Jackson, ObjectMapper và cấu hình tự động của Spring Boot
  - Tùy chỉnh spring.jackson.* và Jackson2ObjectMapperBuilderCustomizer
  - Đăng ký module, serializer và deserializer
  - HttpMessageConverter của MVC và codec của WebFlux
  - Quan hệ giữa cấu hình Jackson dùng chung và tùy chỉnh riêng từng stack
  - Quy ước đặt tên trường, ngày giờ, múi giờ và giá trị null
