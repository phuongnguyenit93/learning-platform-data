menu:
- level1: Tổng quan runtime
  level2:
  - Web runtime là gì và vai trò của Spring Boot khi phục vụ yêu cầu HTTP
  - Mối quan hệ giữa ứng dụng, Spring Framework và máy chủ web
  - Phân biệt Spring MVC, Spring WebFlux và máy chủ nhúng
  - Đường đi tổng quát từ kết nối mạng đến mã nghiệp vụ và phản hồi
  - Tự cấu hình của Spring Boot và phần hành vi do ứng dụng sở hữu
  - 'Tài nguyên khi chạy: kết nối, luồng, bộ nhớ, phiên và bộ đệm'
  - Lựa chọn mô hình web theo đặc điểm tác vụ và thư viện phụ thuộc
  - Kiến thức đầu vào và trình tự học từ khởi động đến vận hành ứng dụng
- level1: Nền tảng HTTP
  level2:
  - 'Cấu trúc yêu cầu và phản hồi: phương thức, URI, header và nội dung'
  - Ý nghĩa các nhóm mã trạng thái và cách lựa chọn phản hồi
  - Content-Type, Accept và thương lượng định dạng dữ liệu
  - Content-Length, truyền dữ liệu theo luồng và thời điểm hoàn tất phản hồi
  - Kết nối HTTP keep-alive và phân biệt kết nối với một yêu cầu
  - Phân biệt HTTP/1.1, HTTP/2 và yêu cầu TLS
  - Query parameter, form data, JSON và multipart
  - Cookie, phiên và tính không lưu trạng thái của HTTP
  - Yêu cầu an toàn, tính lũy đẳng và tác động khi thử lại
  - Phân biệt thời gian kết nối, thời gian chờ phản hồi và thời gian xử lý
- level1: Lựa chọn web stack
  level2:
  - WebApplicationType.NONE, SERVLET và REACTIVE
  - Cách Spring Boot suy luận loại ứng dụng từ classpath
  - spring-boot-starter-web và mô hình Servlet với Spring MVC
  - spring-boot-starter-webflux và mô hình reactive với Reactor
  - Hành vi khi đồng thời có Spring MVC và WebFlux trên classpath
  - Dùng WebClient trong ứng dụng MVC mà không đổi mô hình máy chủ
  - Thiết lập spring.main.web-application-type khi cần lựa chọn tường minh
  - ServletWebServerApplicationContext và ReactiveWebServerApplicationContext
  - Quan hệ giữa web stack và các máy chủ được hỗ trợ theo phiên bản
  - Đánh giá thư viện chặn luồng trước khi chọn mô hình reactive
- level1: Khởi động máy chủ
  level2:
  - Từ SpringApplication.run đến ApplicationContext của ứng dụng web
  - Vai trò của cấu hình tự động trong tạo WebServerFactory
  - ServletWebServerFactory và ReactiveWebServerFactory
  - Thời điểm tạo máy chủ, đăng ký handler và mở cổng lắng nghe
  - WebServerInitializedEvent và lấy cổng thực tế sau khởi động
  - Phân biệt máy chủ đã mở cổng với ứng dụng đã sẵn sàng phục vụ
  - ApplicationRunner, CommandLineRunner và ảnh hưởng tới thời gian sẵn sàng
  - Vòng đời máy chủ trong ApplicationContext và giải phóng tài nguyên
  - Phân biệt server.port=0, server.port=-1 và ứng dụng không có web server
  - Chẩn đoán thiếu WebServerFactory hoặc cổng đã được sử dụng
- level1: Máy chủ nhúng
  level2:
  - Tomcat, Jetty, Undertow và Reactor Netty trong Spring Boot
  - Máy chủ mặc định của từng starter và kiểm tra cây phụ thuộc
  - Thay máy chủ bằng cách loại phụ thuộc mặc định và thêm starter phù hợp
  - Đánh giá khả năng hỗ trợ Servlet hoặc reactive của từng máy chủ theo phiên bản
  - WebServerFactoryCustomizer và thời điểm áp dụng cấu hình
  - Thứ tự customizer và quan hệ với giá trị cấu hình server.*
  - Tùy chỉnh TomcatServletWebServerFactory và connector
  - Tùy chỉnh JettyServletWebServerFactory hoặc UndertowServletWebServerFactory
  - Tùy chỉnh NettyReactiveWebServerFactory và HttpServer
  - Ranh giới giữa thuộc tính Spring Boot và API riêng của máy chủ
  - Hệ quả của việc thay toàn bộ bean factory thay vì bổ sung customizer
- level1: Cấu hình máy chủ
  level2:
  - Cấu hình server.port, server.address và địa chỉ mạng lắng nghe
  - Phân biệt localhost, địa chỉ cụ thể và mọi giao diện mạng
  - server.servlet.context-path, spring.mvc.servlet.path và spring.webflux.base-path
