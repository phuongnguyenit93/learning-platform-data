  - Ordered, @Order và kiểm tra thứ tự thực tế
  - Đọc hoặc bổ sung header mà không tiêu thụ mất request body
  - ContentCachingRequestWrapper, ContentCachingResponseWrapper và giới hạn sử dụng
  - ServerHttpRequestDecorator, ServerHttpResponseDecorator và xử lý DataBuffer
  - Truyền mã tương quan và đo thời gian xử lý theo yêu cầu
  - Tránh đăng ký bộ lọc hai lần qua Spring Boot và Spring Security
  - Xử lý lỗi và giải phóng tài nguyên khi chuỗi xử lý bị ngắt
- level1: Đồng thời Servlet
