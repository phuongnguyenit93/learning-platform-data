  - Phân biệt cookie do máy chủ quản lý với cookie do ứng dụng tự tạo
  - Lưu phiên trong bộ nhớ và hệ quả khi khởi động lại máy chủ
  - Spring Session và lựa chọn kho phiên tương thích từng web stack
  - Cân bằng tải, giữ phiên trên một nút và kho phiên dùng chung
  - Tuần tự hóa dữ liệu phiên và rủi ro khi thay phiên bản ứng dụng
  - Phân biệt trạng thái phiên với dữ liệu gắn riêng cho từng yêu cầu
  - Giới hạn kích thước cookie và dữ liệu nhạy cảm trong phiên
- level1: Cache và nén HTTP
  level2:
  - Phân biệt bộ nhớ đệm HTTP với Spring Cache ở tầng nghiệp vụ
  - Cache-Control, Expires và chính sách cho dữ liệu tĩnh hoặc dữ liệu riêng tư
  - ETag, Last-Modified và yêu cầu có điều kiện
  - Phản hồi 304 Not Modified và tránh gửi lại nội dung không đổi
  - Vary và tính đúng đắn khi phản hồi thay đổi theo header
  - Cấu hình server.compression.enabled và loại nội dung được nén
  - Ngưỡng kích thước nén và tác động tới CPU, độ trễ
  - Phối hợp nén tại ứng dụng, reverse proxy và CDN
  - Không lưu đệm công khai phản hồi chứa thông tin cá nhân
  - Kiểm tra cache hoặc nén khi phản hồi được gửi theo luồng
- level1: TLS và HTTP/2
  level2:
  - TLS, chứng thư máy chủ, private key và chuỗi chứng thư
  - Cấu hình server.ssl.* với keystore JKS hoặc PKCS12
  - SSL bundle và cấu hình vật liệu tin cậy dùng chung trong Spring Boot
  - Dùng chứng thư PEM và áp dụng bundle cho máy chủ nhúng
  - Client authentication và truststore khi yêu cầu mTLS
  - Lựa chọn phiên bản TLS và bộ mã hóa được cho phép
  - Bật HTTP/2 và kiểm tra điều kiện hỗ trợ của máy chủ
  - Phân biệt h2, h2c và cơ chế thương lượng giao thức
  - Kết thúc TLS tại proxy so với kết nối TLS tới ứng dụng
  - Quản lý bí mật, thời hạn và khả năng nạp lại chứng thư theo máy chủ
  - Kiểm tra handshake, hostname, truststore và lỗi chuỗi chứng thư
- level1: Proxy và CORS
  level2:
  - Đường dẫn, host và giao thức công khai khi ứng dụng sau reverse proxy
  - Forwarded, X-Forwarded-* và server.forward-headers-strategy
  - Phân biệt xử lý header chuyển tiếp tại máy chủ với tại Spring Framework
  - Chỉ tin thông tin chuyển tiếp từ proxy được kiểm soát
  - Tạo redirect, liên kết tuyệt đối và cookie đúng địa chỉ công khai
  - Same-Origin Policy, origin và mục đích của CORS
  - Cấu hình CORS bằng WebMvcConfigurer hoặc WebFluxConfigurer
  - Preflight OPTIONS và thứ tự xử lý trước xác thực
  - Allowed origins, methods, headers và exposed headers
  - allowCredentials và giới hạn sử dụng origin ký tự đại diện
  - Phân biệt CORS với CSRF, lỗi định tuyến và lỗi từ proxy
  - Tránh cấu hình CORS trùng tại ứng dụng, gateway và Spring Security
- level1: Tích hợp bảo mật
  level2:
  - Ảnh hưởng của spring-boot-starter-security tới ứng dụng web
  - SecurityFilterChain của Servlet và SecurityWebFilterChain của reactive
  - Phân biệt điểm truy cập công khai, yêu cầu xác thực và yêu cầu quyền
  - Phân biệt 401, 403 và chuyển hướng đăng nhập trong web runtime
  - Phối hợp bảo mật với CORS, CSRF và cookie phiên
  - Xử lý lỗi bảo mật trước Controller và giới hạn của ControllerAdvice
  - Bảo vệ tài nguyên tĩnh, endpoint quản trị và thông tin chẩn đoán
  - Header bảo mật, HTTPS và tránh làm lộ dữ liệu qua phản hồi lỗi
  - Kiểm tra thứ tự bộ lọc để tránh đăng ký hoặc xử lý bảo mật hai lần
  - Ranh giới giữa cấu hình web runtime và thiết kế cơ chế xác thực chuyên sâu
- level1: HTTP client
  level2:
  - Phân biệt máy chủ nhận yêu cầu với client gọi dịch vụ khác
  - RestClient, RestTemplate và WebClient theo kiểu ứng dụng
  - Builder do Spring Boot quản lý và những tùy chỉnh được áp dụng
  - RestClientCustomizer, RestTemplateCustomizer và WebClientCustomizer
  - WebClient trong MVC và ảnh hưởng tới lựa chọn web application type
  - Kết nối HTTP dùng chung, connection pool và vòng đời tài nguyên client
  - Cấu hình thời gian kết nối, đọc và chờ lấy kết nối
  - Áp dụng SSL bundle và kiểm tra chứng thư máy chủ đích
  - Quan sát lời gọi HTTP và truyền trace qua builder được quản lý
  - Giới hạn kích thước phản hồi, giải phóng nội dung và xử lý lỗi từ dịch vụ đích
  - Tránh block() trên event loop và thử lại yêu cầu không lũy đẳng
  - Ranh giới giữa cấu hình client của Boot với tích hợp dịch vụ nghiệp vụ
- level1: Kết nối dài
  level2:
  - Phân biệt streaming HTTP, Server-Sent Events và WebSocket
  - Phát SSE bằng SseEmitter trong MVC và Flux trong WebFlux
  - Content-Type, nhịp giữ kết nối và bộ đệm tại proxy
  - Máy khách ngắt kết nối, hủy đăng ký và dọn tài nguyên
  - Cấu hình WebSocket trong ứng dụng Servlet
  - WebSocketHandler và WebSocketSession trong WebFlux
  - Phân biệt WebSocket thuần với STOMP và phạm vi hỗ trợ từng stack
  - Origin, bước bắt tay và xác thực kết nối WebSocket
  - Giới hạn kích thước thông điệp, hàng đợi gửi và máy khách đọc chậm
  - Tác động của timeout, cân bằng tải và graceful shutdown tới kết nối dài
  - Giới hạn phiên xác thực hoặc token khi kết nối tồn tại lâu
- level1: Mở rộng nền tảng web
  level2:
  - Jersey và JAX-RS như lựa chọn xử lý HTTP thay cho Spring MVC
  - Cấu hình ResourceConfig, Jersey servlet hoặc filter và đường dẫn ứng dụng
  - Quan hệ giữa Jersey, tài nguyên tĩnh và DispatcherServlet
  - Hỗ trợ Spring HATEOAS và liên kết tài nguyên trong phản hồi
  - GraphQL qua HTTP và WebSocket trong ứng dụng Spring Boot
  - Ranh giới giữa HTTP runtime với schema, resolver và mô hình dữ liệu GraphQL
  - RSocket và sự khác biệt với mô hình yêu cầu–phản hồi HTTP
  - RSocket qua TCP hoặc WebSocket và điều kiện dùng chung máy chủ web
  - Kiểm tra phụ thuộc, ánh xạ URL và phiên bản khi kết hợp nhiều nền tảng
  - Tránh thêm giao thức hoặc starter không phục vụ nhu cầu ứng dụng
- level1: Quan sát HTTP
  level2:
  - Access log của máy chủ và log xử lý yêu cầu của ứng dụng
  - Cấu hình access log theo Tomcat, Jetty, Undertow hoặc Reactor Netty
  - Mã tương quan, trace ID và liên kết yêu cầu với lời gọi dịch vụ phía sau
  - HTTP server metrics, thời gian phản hồi và số yêu cầu đang xử lý
  - Nhãn URI theo mẫu đường dẫn và tránh số lượng giá trị nhãn quá lớn
  - Quan sát lỗi được xử lý và phân biệt với lỗi đã ghi nhận tự động
  - Phân biệt log request body với quan sát an toàn metadata
  - Che Authorization, cookie, dữ liệu cá nhân và nội dung nhạy cảm
  - Kết nối Actuator, health và readiness với trạng thái web runtime
  - Tách cổng quản trị và đánh giá quyền truy cập endpoint
  - Giới hạn log chẩn đoán chi tiết trong môi trường production
- level1: Hiệu năng và giới hạn
  level2:
  - Phân biệt thông lượng, độ trễ, số yêu cầu đồng thời và mức sử dụng tài nguyên
  - Tìm điểm nghẽn ở luồng xử lý, event loop, connection pool hoặc dịch vụ phụ thuộc
  - Giới hạn kết nối, hàng đợi và khả năng từ chối khi quá tải
  - Phối hợp thời gian chờ giữa máy khách, proxy, máy chủ và dịch vụ phía sau
  - Bộ nhớ heap, direct memory và bộ đệm đọc hoặc ghi HTTP
  - Giới hạn request body, multipart, header và dữ liệu codec
  - Tác động của tuần tự hóa JSON, nén và ghi log tới chi phí mỗi yêu cầu
  - Phân biệt tối ưu luồng nền tảng, luồng ảo và mô hình reactive
  - Kiểm soát tải từ máy khách chậm hoặc kết nối giữ lâu
  - Đo tải với dữ liệu, mức đồng thời và thời gian chạy đại diện thực tế
  - Đọc thread dump, thống kê GC và quan sát event loop để xác minh giả thuyết
- level1: Dừng có kiểm soát
  level2:
  - Đóng ApplicationContext và vòng đời SmartLifecycle của máy chủ
  - server.shutdown và khác biệt mặc định theo phiên bản Spring Boot
  - Bật graceful shutdown và ngừng tiếp nhận yêu cầu mới
  - spring.lifecycle.timeout-per-shutdown-phase và thời gian chờ hoàn tất
  - Khác biệt cách từ chối kết nối giữa các máy chủ nhúng
  - Xử lý yêu cầu đang chạy, tác vụ bất đồng bộ và lời gọi dịch vụ phía sau
  - Đóng SSE, WebSocket và các luồng phản hồi dài hạn
  - Phối hợp readiness, gỡ khỏi cân bằng tải và tín hiệu SIGTERM
  - Phân biệt dừng từ IDE, tín hiệu hệ điều hành và tiến trình bị buộc kết thúc
  - Giải phóng bộ thực thi, connection pool, tài nguyên Reactor và tệp tạm
  - Kiểm chứng không mất yêu cầu khi triển khai thay phiên bản
- level1: Kiểm thử web runtime
  level2:
  - Phân biệt kiểm thử handler không mở cổng với kiểm thử HTTP qua máy chủ thật
  - '@WebMvcTest, MockMvc và phạm vi kiểm thử MVC'
  - '@WebFluxTest, WebTestClient và phạm vi kiểm thử reactive'
  - '@SpringBootTest với MOCK, RANDOM_PORT và DEFINED_PORT'
  - '@LocalServerPort và khám phá cổng do máy chủ cấp phát'
  - Kiểm thử mapping, status, header, JSON và content negotiation
  - Kiểm thử dữ liệu sai, Problem Details và phản hồi lỗi mặc định
  - Kiểm thử filter, interceptor, CORS và ranh giới Spring Security
  - Kiểm thử tải tệp, cookie, phiên và tài nguyên tĩnh
  - Kiểm thử async, streaming và máy khách ngắt kết nối
  - Kiểm thử cấu hình riêng máy chủ, proxy header, TLS và HTTP/2
  - Kiểm thử vòng đời khởi động, lỗi cổng và graceful shutdown
- level1: Triển khai ứng dụng
  level2:
  - Chạy executable JAR và phân biệt với triển khai WAR
  - SpringBootServletInitializer và ứng dụng Servlet trong container bên ngoài
  - Giới hạn đóng gói hoặc triển khai WebFlux theo máy chủ và phiên bản
  - Cấu hình cổng, địa chỉ lắng nghe và tài nguyên trong container
  - Đưa chứng thư, thư mục tạm và cấu hình môi trường ra ngoài gói ứng dụng
  - Reverse proxy, ingress và đường dẫn công khai khi có context path
  - Thư mục chỉ đọc, tài khoản tiến trình và quyền ghi tệp tạm
  - Startup probe, readiness, liveness và ranh giới với Actuator
  - Thời hạn dừng tiến trình và thời gian rút lưu lượng khỏi cân bằng tải
  - Giữ tương thích dữ liệu phiên khi nhiều phiên bản ứng dụng cùng tồn tại
  - Ranh giới giữa yêu cầu runtime với công cụ đóng gói và nền tảng triển khai
- level1: Gỡ lỗi và nâng cấp
  level2:
  - Ứng dụng chọn sai web stack do phụ thuộc bắc cầu
  - Không tạo được web server hoặc không có bean WebServerFactory
  - Ứng dụng chạy nhưng không truy cập được do port, address hoặc proxy
  - 404 do context path, servlet path, base path hoặc mapping sai
  - 405, 406 và 415 do phương thức hoặc định dạng không khớp
  - 400, 413 hoặc 431 do dữ liệu đầu vào và giới hạn kích thước
  - 500 do tuần tự hóa, template hoặc lỗi sau khi phản hồi đã commit
  - Chẩn đoán treo yêu cầu, cạn luồng, event loop bị chặn và timeout
  - Chẩn đoán mất phiên, cookie không được gửi và chuyển hướng sai giao thức
  - Đối chiếu điều kiện tự cấu hình khi thêm bean hoặc @EnableWebMvc/@EnableWebFlux
  - Rà soát thay đổi mặc định, thuộc tính đổi tên và hỗ trợ máy chủ khi nâng phiên bản
  - Xác minh bằng kiểm thử qua máy chủ thật sau khi thay web stack hoặc máy chủ
- level1: Thực hành tổng hợp
  level2:
  - Xây dựng REST API MVC với cấu hình máy chủ, validation và lỗi nhất quán
  - Xây dựng API WebFlux có dữ liệu theo luồng và kiểm soát mã chặn luồng
  - So sánh cùng một tác vụ trên MVC dùng luồng nền tảng, luồng ảo và WebFlux
  - Thay Tomcat bằng máy chủ khác và kiểm tra cấu hình thực tế
  - Phục vụ giao diện, tài nguyên có phiên bản và chính sách cache
  - Xây dựng luồng nhận tệp lớn với giới hạn kích thước và dọn tài nguyên
  - Triển khai HTTPS với SSL bundle và kiểm chứng HTTP/2
  - Đặt ứng dụng sau reverse proxy với chuyển tiếp header và CORS đúng phạm vi
  - Quan sát yêu cầu đi qua server và HTTP client bằng trace, metrics và log an toàn
  - Đo tải, điều chỉnh giới hạn tài nguyên và kiểm chứng hành vi quá tải
  - Triển khai thay phiên bản với graceful shutdown và yêu cầu đang xử lý
  - Xây dựng bộ kiểm thử tái hiện các lỗi web runtime thường gặp
