  - Cấu hình server.error.* và giới hạn hiển thị message, exception, stack trace
  - Lỗi khi phản hồi đã commit hoặc luồng dữ liệu đã bắt đầu
  - Thống nhất cấu trúc lỗi, mã nghiệp vụ và mã tương quan
- level1: Bộ lọc và interceptor
  level2:
