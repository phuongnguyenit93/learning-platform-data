  - Triển khai consumer có tính lặp an toàn với inbox hoặc khóa duy nhất
  - Đồng bộ cơ sở dữ liệu và RabbitMQ bằng transactional outbox
  - Xây dựng request–reply và quan sát timeout hoặc phản hồi đến muộn
  - Đo tác động của prefetch, concurrency và batching
  - Mô phỏng broker/consumer gián đoạn và kiểm chứng phục hồi
  - Thực hành đọc lại stream hoặc client AMQP 1.0 khi phiên bản phù hợp
  - Hoàn thiện kiểm thử tích hợp, tracing và bảng theo dõi vận hành
