  - Chi phí persistence, quorum replication và transaction
  - Đánh giá queue backlog, thông điệp ưu tiên và tải không đồng đều
  - Điều tiết producer, flow control và giới hạn tài nguyên broker
  - Kiểm thử tải kéo dài, tải đột biến và hành vi khi quá tải
