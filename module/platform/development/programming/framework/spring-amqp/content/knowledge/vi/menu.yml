  - Đối chiếu thay đổi mặc định của container, prefetch và xử lý lỗi
  - Đối chiếu delivery limit, priority và dead-letter của từng queue type
  - Di chuyển khỏi cấu hình classic queue mirroring cũ khi broker không còn hỗ trợ
  - Giữ tên exchange, queue, routing key và schema sự kiện tương thích
  - Chuyển từ XML namespace sang Java/annotation khi có nhu cầu
  - Đánh giá module AMQP 1.0 mà không trộn cấu hình AMQP 0.9.1
  - Kiểm thử hồi quy, phát hành từng phần và kế hoạch khôi phục
- level1: Thực hành tổng hợp
  level2:
