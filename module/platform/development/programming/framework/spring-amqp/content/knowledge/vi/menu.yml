  level2:
  - Đóng gói ứng dụng và quản lý cấu hình RabbitMQ theo môi trường
  - Readiness, liveness và quyết định khi broker chưa sẵn sàng
  - Khởi động topology và listener đúng thứ tự
  - Triển khai nhiều bản sao producer/consumer
  - Dừng an toàn, xử lý delivery đang chạy và rút consumer
  - Tự động mở rộng theo queue backlog và thời gian xử lý
  - Giới hạn CPU, bộ nhớ, connection và channel của ứng dụng
  - RabbitMQ cluster, quorum và tác động khi node mất kết nối
