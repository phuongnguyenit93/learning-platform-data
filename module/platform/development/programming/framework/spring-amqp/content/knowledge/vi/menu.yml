  - Outbox/inbox trong kiến trúc giao dịch phân tán
  - Saga và ranh giới điều phối nghiệp vụ qua thông điệp
  - Retry queue, DLQ và khu vực xử lý thông điệp lỗi
  - Spring Integration AMQP adapter và gateway khi cần luồng tích hợp
  - Spring Cloud Stream Rabbit binder và ranh giới so với Spring AMQP trực tiếp
  - Chọn queue, stream hoặc broker khác theo đặc điểm bài toán
- level1: Chẩn đoán sự cố
  level2:
  - Không kết nối được do địa chỉ, virtual host, TLS hoặc quyền truy cập
  - PRECONDITION_FAILED khi khai báo queue/exchange không khớp
  - Thông điệp mất do không có binding hoặc gửi sai exchange/routing key
  - Confirm ack nhưng không có consumer nhận thông điệp
  - Thông điệp nằm ở ready vì listener chưa chạy hoặc bị hủy
  - Unacked tăng liên tục do xử lý chậm, kẹt luồng hoặc thiếu ack
  - Lỗi unknown delivery tag và channel bị đóng
  - MessageConversionException, sai content type hoặc kiểu JSON
  - Retry/requeue vô hạn và DLQ không nhận được thông điệp
  - RPC timeout, correlation sai và phản hồi đến muộn
  - Hết channel, cạn executor hoặc publisher bị broker chặn
  - Phát lại nhiều thông điệp sau khi consumer khởi động lại
  - Quorum queue không khả dụng hoặc chạm delivery limit
  - Lệch thứ tự khi tăng consumer, dùng retry hoặc ưu tiên
  - Thu thập bằng chứng từ log ứng dụng, broker, metrics và tracing
