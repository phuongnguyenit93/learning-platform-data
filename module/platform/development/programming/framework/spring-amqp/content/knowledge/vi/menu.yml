  - Xử lý sự kiện trùng, đến muộn hoặc không còn phù hợp
  - Exactly-once ở cấp tác động nghiệp vụ và giới hạn bảo đảm của broker
  - Đối soát thông điệp, dữ liệu nghiệp vụ và tác vụ bị bỏ dở
  - Phát lại sự kiện và kiểm soát tác động lặp lên hệ thống ngoài
- level1: Thứ tự và đồng thời
  level2:
  - Phạm vi bảo đảm thứ tự của queue và channel
  - Nhiều producer, nhiều channel và thứ tự quan sát thực tế
  - Nhiều consumer, prefetch và hoàn tất xử lý không cùng thứ tự
  - Requeue, redelivery, priority và retry làm thay đổi thứ tự
  - Single Active Consumer cho yêu cầu tiêu thụ tuần tự
  - Phân vùng theo khóa nghiệp vụ qua nhiều queue
  - Định tuyến nhất quán theo aggregate hoặc khách hàng
  - Tăng concurrency của SMLC và DMLC đúng cơ chế
  - Giới hạn đồng thời theo tài nguyên cơ sở dữ liệu hoặc API phía sau
  - Version sự kiện và phát hiện sự kiện đến sai thứ tự
- level1: Phục hồi kết nối
  level2:
  - Spring AMQP recovery và automatic recovery của RabbitMQ Java Client
  - Mất connection so với lỗi chỉ đóng một channel
  - Heartbeat, phát hiện mất kết nối và thời gian phục hồi
  - Recovery interval, BackOff và giới hạn kết nối lại
  - Phục hồi consumer sau khi broker hoặc node khởi động lại
  - Khai báo lại exchange, queue và binding khi cần
  - Exclusive queue, AnonymousQueue và thay đổi tên sau phục hồi
  - Publish chưa có confirm và delivery chưa ack khi mất kết nối
  - Consumer bị broker hủy và xử lý queue biến mất
  - Blocked connection do giới hạn bộ nhớ hoặc dung lượng đĩa
  - Điều phối retry để tránh đồng loạt kết nối lại quá mức
  - Kiểm chứng trạng thái ứng dụng sau khi phục hồi
- level1: Nhiều broker và khách hàng
  level2:
  - Phân biệt cluster RabbitMQ với nhiều broker độc lập
  - Cấu hình nhiều địa chỉ kết nối và lựa chọn node
  - Nhiều ConnectionFactory, RabbitTemplate và container factory
  - AbstractRoutingConnectionFactory và chọn đích kết nối theo ngữ cảnh
  - Định tuyến gửi/nhận và tài nguyên tương ứng trên từng broker
  - Cô lập khách hàng bằng virtual host, tài khoản hoặc broker
  - RabbitAdmin phụ trách khai báo đúng tập tài nguyên
  - Connection name, metric và log cho từng broker hoặc khách hàng
  - Giới hạn số connection, channel và tài nguyên theo khách hàng
  - Đánh giá Shovel/Federation như cơ chế broker ngoài phạm vi RabbitTemplate
- level1: RabbitMQ Streams
  level2:
  - Khi nào dùng stream thay cho queue tiêu thụ thông thường
  - Phân biệt truy cập stream qua AMQP với native Stream protocol
  - spring-rabbit-stream và cấu hình Environment
  - Khai báo stream bằng QueueBuilder hoặc StreamAdmin theo cách kết nối
  - RabbitStreamTemplate và gửi thông điệp bất đồng bộ
  - StreamListenerContainer và StreamRabbitListenerContainerFactory
  - Đọc Spring Message hoặc thông điệp stream nguyên bản
  - Offset bắt đầu, theo dõi offset và đọc lại dữ liệu
  - Retention theo thời gian hoặc dung lượng
  - SuperStream, phân vùng và chọn khóa định tuyến
  - Single Active Consumer trong super stream
  - Giới hạn annotation, retry và tính năng so với container AMQP 0.9.1
- level1: AMQP 1.0
  level2:
  - Khác biệt mô hình connection, session, link và settlement với AMQP 0.9.1
  - RabbitMQ AMQP 1.0 qua spring-rabbitmq-client từ phiên bản 4.0
  - Cấu hình môi trường, kết nối và template của RabbitMQ AMQP 1.0
  - Listener RabbitMQ AMQP 1.0 và phạm vi tái sử dụng @RabbitListener
  - AMQP 1.0 tổng quát qua spring-amqp-client từ phiên bản 4.1
  - Qpid ProtonJ2, AmqpConnectionFactory và SingleAmqpConnectionFactory
  - AmqpClient và thao tác gửi/nhận dựa trên CompletableFuture
  - AmqpMessageListenerContainer, link credit và settlement thủ công
  - '@EnableAmqp, @AmqpListener và registry riêng của generic client'
  - Chuyển đổi thông điệp và tương thích với broker AMQP 1.0 mục tiêu
  - Phân biệt API, thuộc tính và mức hỗ trợ giữa hai module AMQP 1.0
  - Kế hoạch chuyển protocol và kiểm thử tương thích nghiệp vụ
- level1: Bảo mật
  level2:
  - Tài khoản RabbitMQ và quyền configure, write, read trên virtual host
  - Phân tách quyền producer, consumer và quản trị topology
  - TLS, trust store và xác minh danh tính broker
  - mTLS hoặc cơ chế xác thực khác theo khả năng client/broker
  - Quản lý mật khẩu, chứng chỉ và bí mật theo môi trường
  - Luân chuyển thông tin kết nối và khôi phục ứng dụng
  - Trusted packages, type headers và phòng tránh giải tuần tự không an toàn
  - Giới hạn nội dung, header và dữ liệu đầu vào không tin cậy
  - Mã hóa dữ liệu nghiệp vụ nhạy cảm khi yêu cầu bảo vệ đầu cuối
  - Che payload, token và thông tin nhận diện khỏi log
  - Cô lập management endpoint và cập nhật bản vá thư viện
- level1: Quan sát hệ thống
  level2:
  - RabbitMQ Management, Prometheus và số liệu của broker
  - Queue depth, ready, unacked và tốc độ publish/deliver/ack
  - Micrometer timer cho RabbitTemplate và listener
  - Micrometer Observation và tracing theo phiên bản hỗ trợ
  - Truyền trace context, correlationId và messageId
  - Phân biệt độ trễ chờ trong queue với thời gian xử lý
  - Theo dõi confirm nack, return, retry và dead-letter
  - Giám sát connection, channel, consumer và mức sử dụng executor
  - Listener idle events và sự kiện consumer thất bại
  - Giới hạn cardinality khi gắn nhãn theo queue hoặc khách hàng
  - Cảnh báo backlog, mất consumer, resource alarm và thông điệp poison
- level1: Kiểm thử
  level2:
