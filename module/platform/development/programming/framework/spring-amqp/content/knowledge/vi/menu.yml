  - Kiểm thử topology, converter và producer/consumer khác ngôn ngữ
  - Kiểm thử confirm, mandatory return và exchange không tồn tại
  - Kiểm thử ack, requeue, retry và DLQ bằng broker thật
  - Mô phỏng trùng lặp, mất kết nối và khởi động lại consumer
  - Kiểm thử giao dịch, outbox và tác động nghiệp vụ có tính lặp an toàn
  - Kiểm thử batch, RPC, stream và protocol theo phạm vi sử dụng
  - Đồng bộ chờ bằng điều kiện thay vì sleep cố định
  - Cô lập queue, dữ liệu và tài nguyên giữa các lượt kiểm thử
- level1: Hiệu năng
  level2:
  - Đo thông lượng, độ trễ và kích thước thông điệp thực tế
  - Chọn prefetch theo thời gian xử lý và dung lượng bộ nhớ
  - Tăng consumer concurrency theo năng lực hệ thống phía sau
  - Tối ưu channel cache, connection và executor
  - Publisher confirm bất đồng bộ và số publish đang chờ
  - Đánh giá batching, nén payload và chi phí chuyển đổi JSON
