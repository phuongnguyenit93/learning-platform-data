references:
  - title: "Spring AMQP — Project Overview"
    url: "https://spring.io/projects/spring-amqp"
    description: "Spring AMQP, spring-rabbit, RabbitTemplate, RabbitAdmin và listener containers."
  - title: "Spring Guide — Messaging with RabbitMQ"
    url: "https://spring.io/guides/gs/messaging-rabbitmq/"
    description: "Ví dụ Spring Boot publisher/consumer với exchange, queue, binding và RabbitTemplate."
  - title: "Spring AMQP — AmqpTemplate"
    url: "https://docs.spring.io/spring-amqp/reference/amqp/template.html"
    description: "API RabbitTemplate, convertAndSend, cơ chế gửi/nhận và xác nhận publisher."
  - title: "Spring AMQP — Annotation-driven Listener Endpoints"
    url: "https://docs.spring.io/spring-amqp/reference/amqp/receiving-messages/async-annotation-driven.html"
    description: "Sử dụng @RabbitListener, chuyển đổi payload và container listener."
  - title: "Spring AMQP — Resilience and Recovery"
    url: "https://docs.spring.io/spring-amqp/reference/amqp/resilience-recovering-from-errors-and-broker-failures.html"
    description: "Kết nối lại broker, khai báo topology, retry và xử lý lỗi."
  - title: "Spring AMQP — Testing Support"
    url: "https://docs.spring.io/spring-amqp/reference/testing.html"
    description: "Kiểm thử listener và publisher với spring-rabbit-test và broker thật."
  - title: "RabbitMQ — Exchanges"
    url: "https://www.rabbitmq.com/docs/exchanges"
    description: "Định tuyến message bằng exchange, binding và routing key."
  - title: "RabbitMQ — Consumer Acknowledgements and Publisher Confirms"
    url: "https://www.rabbitmq.com/docs/confirms"
    description: "Phân biệt consumer ack và publisher confirm, prefetch và redelivery."
  - title: "RabbitMQ — Dead Letter Exchanges"
    url: "https://www.rabbitmq.com/docs/dlx"
    description: "Dead-letter routing cho message bị reject, hết hạn hoặc vượt delivery-limit."