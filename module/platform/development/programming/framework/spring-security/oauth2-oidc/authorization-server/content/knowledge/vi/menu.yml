menu:
- level1: Tổng quan
  level2:
  - Vai trò của Authorization Server trong hệ sinh thái Spring Security
  - Phân biệt Authorization Server, Resource Server, OAuth2 Client và OpenID Provider
  - Quan hệ giữa OAuth 2.0, OAuth 2.1 và OpenID Connect 1.0
  - Phạm vi tính năng của Spring Authorization Server và phần ứng dụng phải tự xây dựng
  - Đánh giá lựa chọn tự xây Authorization Server hay sử dụng Identity Provider có sẵn
  - Các kịch bản đăng nhập tập trung, ủy quyền API và giao tiếp giữa dịch vụ
  - Ranh giới tin cậy giữa người dùng, client, trình duyệt và máy chủ
  - Yêu cầu kiến thức về Servlet Security, HTTP, TLS và mật mã
  - Bản đồ luồng xử lý và các thành phần cần triển khai
- level1: Giao thức và thuật ngữ
  level2:
  - Resource Owner, Client, Authorization Server và Resource Server
  - Authorization Grant, Authorization Request và Token Request
  - Authorization Code, Access Token, Refresh Token và ID Token
  - Scope, Claim, Audience, Resource và Subject
  - Public Client, Confidential Client và mô hình triển khai ứng dụng
  - Redirect URI, Issuer Identifier và Discovery Document
  - State, Nonce và PKCE trong các luồng có trình duyệt
  - Front Channel, Back Channel và điểm truyền dữ liệu nhạy cảm
  - Vòng đời authorization và mối liên hệ giữa token, consent, session
  - Các luồng cũ, tính năng không hỗ trợ và ranh giới tương thích giao thức
- level1: Khởi tạo dự án
  level2:
  - Chọn bộ phiên bản tương thích của Java, Spring Boot và Spring Security
  - Khai báo dependency Authorization Server bằng Maven hoặc Gradle
  - Tổ chức cấu trúc ứng dụng và các profile môi trường
  - Cấu hình tối thiểu để khởi chạy Authorization Server
  - Tạo tài khoản phát triển và client mẫu
  - Chuẩn bị khóa ký, issuer và cấu hình endpoint cho môi trường local
  - Chạy một vòng Authorization Code và xác minh token đầu tiên
  - Phân biệt cấu hình tự động của Spring Boot với các bean khai báo tường minh
  - Quản lý cấu hình nhạy cảm bằng biến môi trường và secret store
- level1: Kiến trúc xử lý
  level2:
  - SecurityFilterChain dành cho giao thức và dành cho đăng nhập ứng dụng
  - Thứ tự filter chain, securityMatcher và requestMatcher
  - OAuth2AuthorizationServerConfigurer và các điểm cấu hình giao thức
  - Pipeline Filter, AuthenticationConverter và AuthenticationProvider
  - AuthenticationManager và các loại AuthenticationToken trong Authorization Server
  - Xử lý phản hồi thành công, thất bại và OAuth2Error
  - SecurityContext, principal và thông tin authorization trong mỗi request
  - Vai trò của AuthorizationServerContext và issuer hiện hành
  - Quan hệ giữa repository, authorization service, consent service và token generator
  - Điểm mở rộng chuẩn và giới hạn của việc can thiệp filter nội bộ
- level1: Cấu hình máy chủ
  level2:
  - AuthorizationServerSettings và cấu hình issuer tường minh
  - Tùy chỉnh đường dẫn các endpoint OAuth2
  - Bật OpenID Connect và cấu hình các endpoint OIDC
  - Cấu hình theo Java DSL và thuộc tính Spring Boot
  - Đăng ký các bean hạ tầng bắt buộc và tùy chọn
  - Cấu hình JwtDecoder phục vụ các chức năng OIDC cần xác minh JWT
  - Xác định base URL khi có context path, reverse proxy và TLS termination
  - Cấu hình login entry point và xử lý request chưa xác thực
  - Kiểm tra cấu hình khởi động và phát hiện bean hoặc endpoint bị thiếu
- level1: Mô hình dữ liệu
  level2:
  - RegisteredClient và quan hệ giữa id nội bộ với client_id
  - ClientSettings và các chính sách áp dụng cho client
  - TokenSettings và chính sách phát hành, thời hạn của token
  - OAuth2Authorization và tập hợp token gắn với một authorization
  - OAuth2Authorization.Token, metadata và trạng thái hoạt động
  - OAuth2AuthorizationConsent và các quyền người dùng đã chấp thuận
  - RegisteredClientRepository và các thao tác tra cứu client
  - OAuth2AuthorizationService và truy xuất authorization theo token
  - OAuth2AuthorizationConsentService và vòng đời consent
- level1: Quản lý client
  level2:
  - Khai báo client bằng builder và repository
  - Thiết lập grant type, authentication method và scope cho từng client
  - Đăng ký redirect URI và post-logout redirect URI bằng danh sách cho phép
  - Cấu hình yêu cầu PKCE và yêu cầu consent
  - Cấu hình thời hạn authorization code, access token và refresh token
  - Chọn access token dạng JWT hoặc reference theo nhu cầu
  - Quản lý ngày hết hạn client secret và chính sách xoay secret
  - Tách cấu hình client theo môi trường và chủ sở hữu ứng dụng
  - Thiết kế quy trình cấp mới, cập nhật, vô hiệu hóa và thu hồi client
  - Bảo vệ API quản trị client và ghi nhận thay đổi cấu hình
- level1: Xác thực client
  level2:
  - Client Authentication Endpoint Filter và quá trình nhận diện client
  - client_secret_basic và client_secret_post
  - Mã hóa client secret bằng PasswordEncoder và lựa chọn thuật toán phù hợp
  - client_secret_jwt và xác minh client assertion
  - private_key_jwt và phân phối khóa công khai của client
  - Xác minh issuer, subject, audience, thời hạn và chống phát lại assertion
  - Client public với authentication method none và yêu cầu PKCE
  - tls_client_auth và self_signed_tls_client_auth
  - Tùy chỉnh converter, provider và validator cho xác thực client
  - Xử lý invalid_client và hạn chế rò rỉ thông tin định danh
- level1: Đăng nhập người dùng
  level2:
  - Tích hợp form login vào Authorization Server
  - Kết nối UserDetailsService, AuthenticationProvider và nguồn tài khoản
  - Khôi phục authorization request sau khi đăng nhập thành công
  - Xây dựng trang đăng nhập và xử lý lỗi xác thực
  - Chính sách session, cookie và chống session fixation
  - Tích hợp MFA và điều kiện hoàn thành xác thực trước khi cấp code
  - Xử lý tài khoản bị khóa, hết hạn hoặc bị vô hiệu hóa
  - Phân biệt phiên đăng nhập SSO với vòng đời access token và refresh token
  - Kiểm soát trải nghiệm đăng nhập lại và bảo vệ dữ liệu trên trang đăng nhập
- level1: Authorization Endpoint
  level2:
  - Tham số response_type, client_id, redirect_uri, scope và state
  - Kiểm tra client đã đăng ký và grant được phép sử dụng
  - Đối chiếu redirect_uri chính xác và chặn open redirect
  - Kiểm tra scope yêu cầu so với cấu hình client
  - Tiếp nhận code_challenge và code_challenge_method
  - Xử lý người dùng chưa đăng nhập và chuyển hướng đến login
  - Chuyển tiếp sang consent và xử lý lựa chọn của người dùng
  - Phát hành authorization code và trả phản hồi về client
  - Tùy chỉnh OAuth2AuthorizationEndpointConfigurer
  - Tùy chỉnh validation bằng OAuth2AuthorizationCodeRequestAuthenticationValidator
  - Trả lỗi đúng ngữ cảnh và tránh redirect về URI không hợp lệ
- level1: Consent
  level2:
  - Cấu hình requireAuthorizationConsent cho từng client
  - Mô hình quyền đã cấp trong OAuth2AuthorizationConsent
  - Tạo giao diện consent hiển thị client và các scope được yêu cầu
  - Phân biệt scope mới với scope đã được chấp thuận
  - Xử lý chấp thuận, từ chối và lựa chọn phạm vi quyền
  - Lưu consent và tra cứu consent trong các lần ủy quyền tiếp theo
  - Thu hồi consent và xác định tác động đến các authorization hiện có
  - Bảo vệ form consent, tham số điều hướng và nội dung hiển thị
- level1: Authorization Code và PKCE
  level2:
  - Toàn bộ chuỗi authorize, login, consent, callback và token
  - Trao đổi authorization code lấy token tại Token Endpoint
  - Ràng buộc code với client và redirect_uri
  - Thời hạn code và nguyên tắc chỉ sử dụng một lần
  - Tạo code_verifier và code_challenge theo phương thức S256
  - Xác minh PKCE tại bước đổi code và xử lý verifier không hợp lệ
  - Áp dụng PKCE cho ứng dụng public và confidential
  - Client public, khả năng cấp refresh token và giới hạn theo cấu hình, phiên bản
  - Bảo vệ state, callback và dữ liệu code trong trình duyệt
  - Phát hiện code interception, code injection và authorization code replay
- level1: Client Credentials
  level2:
  - Kịch bản cấp quyền cho dịch vụ không có người dùng
  - Đăng ký confidential client cho grant client_credentials
  - Xác thực client và gửi yêu cầu cấp access token
  - Giới hạn scope, audience và quyền của từng service account
  - Phân biệt subject là client với subject là người dùng
  - Thiết lập TTL, cache token phía client và chính sách xoay credential
  - Giới hạn phát hành ID Token và Refresh Token trong luồng này
- level1: Refresh Token
  level2:
  - Điều kiện phát hành refresh token theo grant và loại client
  - Cấu hình refreshTokenTimeToLive và reuseRefreshTokens
  - Đổi refresh token để cấp access token mới
  - Kiểm tra liên kết refresh token với client và authorization
  - Yêu cầu scope khi refresh và nguyên tắc không mở rộng quyền
  - Refresh token rotation và hiệu lực của token đã được thay thế
  - Thiết kế phát hiện tái sử dụng và thu hồi token family khi cần mở rộng
  - Xử lý đồng thời nhiều yêu cầu refresh và bảo đảm tính nhất quán
  - Thu hồi refresh token khi tài khoản, client hoặc chính sách thay đổi
- level1: Device Authorization
  level2:
  - Kịch bản thiết bị hạn chế nhập liệu và luồng xác thực trên thiết bị thứ hai
  - Bật Device Authorization Endpoint và Device Verification Endpoint
  - Phát hành device_code, user_code, verification_uri và thời hạn
  - Trang nhập user_code và xác nhận thiết bị cho người dùng
  - Đăng nhập, consent và phê duyệt hoặc từ chối yêu cầu thiết bị
  - Polling Token Endpoint bằng device_code
  - Xử lý authorization_pending, slow_down, access_denied và expired_token
  - Giới hạn số lần thử user_code, tốc độ polling và chống phishing
  - Tùy chỉnh converter, provider và response handler cho Device Flow
- level1: Token Exchange
  level2:
  - Mục đích của OAuth 2.0 Token Exchange và ranh giới tin cậy
  - Đăng ký grant token-exchange cho client được ủy quyền
  - Tham số subject_token, subject_token_type và requested_token_type
  - Đánh giá khả năng hỗ trợ actor_token, resource và audience theo phiên bản
  - Xác minh subject token, trạng thái token và chính sách đổi token
  - Giới hạn scope, audience và TTL của token được cấp sau trao đổi
  - Phân biệt delegation, impersonation và chính sách cho từng trường hợp
  - Tùy chỉnh provider và token customizer cho yêu cầu Token Exchange
  - Ngăn mở rộng đặc quyền, lạm dụng token trung gian và vòng lặp trao đổi
- level1: Token Endpoint
  level2:
  - Định dạng yêu cầu và phản hồi OAuth2 Token Endpoint
  - Điều phối provider theo grant_type
  - OAuth2TokenEndpointConfigurer và các điểm mở rộng
  - Tùy chỉnh accessTokenRequestConverter và AuthenticationProvider
  - Tùy chỉnh phản hồi thành công mà vẫn giữ cấu trúc giao thức
  - Chuẩn hóa invalid_request, invalid_grant, invalid_scope và unsupported_grant_type
  - Xử lý cache-control, dữ liệu nhạy cảm và truyền token qua HTTPS
  - Bảo vệ Token Endpoint bằng giới hạn tốc độ, timeout và chống lạm dụng
- level1: PAR
  level2:
  - Mục đích của Pushed Authorization Requests
  - Cấu hình Pushed Authorization Request Endpoint
  - Xác thực client và kiểm tra các tham số authorization được đẩy lên
  - Cấp request_uri và xử lý thời hạn yêu cầu
  - Sử dụng request_uri tại Authorization Endpoint
  - Áp dụng chính sách bắt buộc PAR cho từng client
  - Tùy chỉnh validation, provider và phản hồi lỗi của PAR
- level1: Token và claims
  level2:
  - OAuth2TokenGenerator và DelegatingOAuth2TokenGenerator
  - JwtGenerator, OAuth2AccessTokenGenerator và OAuth2RefreshTokenGenerator
  - OAuth2TokenContext, JwtEncodingContext và OAuth2TokenClaimsContext
  - OAuth2TokenCustomizer cho JWT và reference access token
  - Thiết lập iss, sub, aud, iat, exp, nbf, jti và scope
  - Đưa roles, authorities hoặc thông tin nghiệp vụ vào claims có kiểm soát
  - Tùy chỉnh claims theo client, grant type, principal và tenant
  - Áp dụng profile JWT access token phù hợp với Resource Server
  - Kiểm soát kích thước token, thông tin cá nhân và dữ liệu có thể thay đổi
  - Phân biệt các claims của access token với claims của ID Token
- level1: JWK và quản lý khóa
  level2:
  - JWK, JWK Set, JWKSource và khóa phục vụ ký token
  - Lựa chọn RSA, EC và thuật toán ký tương thích với client
  - JwtEncoder và tích hợp bộ tạo JWT
  - JWK Set Endpoint và các trường khóa công khai được phép công bố
  - kid và quá trình Resource Server lựa chọn khóa xác minh
  - Lưu khóa ổn định qua restart và chia sẻ khóa giữa các instance
  - Xoay khóa với giai đoạn chồng lấp cho token chưa hết hạn
  - Kiểm soát cache JWKS và xử lý client chưa cập nhật khóa
  - Tích hợp keystore, KMS hoặc HSM theo yêu cầu triển khai
  - Thu hồi khóa bị lộ, khôi phục khẩn cấp và kiểm toán truy cập khóa
- level1: DPoP
  level2:
  - Bearer token và DPoP-bound access token
  - Cấu trúc DPoP proof, khóa của client và public JWK
  - Xác minh htm, htu, iat, jti và chữ ký của DPoP proof
  - Ràng buộc access token với khóa bằng cnf.jkt
  - Cấu hình hỗ trợ DPoP tại Token Endpoint theo phiên bản sử dụng
  - Nonce, replay cache và giới hạn thời gian chấp nhận proof
  - Tác động của DPoP đến refresh token và vòng đời khóa client
  - Phối hợp với Resource Server để xác minh proof và token binding
- level1: mTLS
  level2:
  - Xác thực client bằng chứng thư X.509
  - Cấu hình tls_client_auth và self_signed_tls_client_auth
  - Ràng buộc access token với chứng thư client
  - Claim cnf.x5t#S256 và kiểm tra certificate binding
  - Thiết lập truststore, chuỗi chứng thư và chính sách chấp nhận chứng thư
  - Truyền danh tính chứng thư qua reverse proxy theo mô hình tin cậy
  - Gia hạn, thu hồi chứng thư và kiểm thử lỗi xác thực mTLS
- level1: Introspection
  level2:
  - Mục đích của OAuth2 Token Introspection
  - Xác thực và phân quyền client được phép introspect
  - Ý nghĩa của active và các thông tin trả về
  - Tra cứu token hết hạn, bị thu hồi hoặc không tồn tại
  - OAuth2TokenIntrospectionEndpointConfigurer và điểm tùy chỉnh
  - Lọc claims và hạn chế tiết lộ dữ liệu token cho client gọi introspection
  - Tích hợp Resource Server sử dụng opaque token
  - Đánh đổi giữa cache kết quả introspection và độ trễ thu hồi
- level1: Revocation
  level2:
  - Mục đích của OAuth2 Token Revocation
  - Tham số token, token_type_hint và xác thực client
  - Kiểm tra quyền sở hữu token trước khi thu hồi
  - Thu hồi access token, refresh token và authorization liên quan
  - OAuth2TokenRevocationEndpointConfigurer và điểm tùy chỉnh
  - Phản hồi khi token không tồn tại và tính lặp lại an toàn của thao tác
  - Giới hạn thu hồi tức thời đối với JWT được Resource Server xác minh cục bộ
  - Kết hợp TTL, introspection hoặc cơ chế bổ sung để thực thi thu hồi
- level1: Metadata và Discovery
  level2:
  - OAuth2 Authorization Server Metadata theo RFC 8414
  - OpenID Provider Configuration và OpenID Connect Discovery
  - Đường dẫn well-known và quan hệ với issuer
  - Các trường endpoints, grant_types_supported và response_types_supported
  - Công bố authentication methods, signing algorithms và khả năng PKCE
  - Tùy chỉnh metadata của Authorization Server và OpenID Provider
  - Kiểm tra metadata nhất quán với endpoint đã bật và tính năng thực tế
  - Discovery sau reverse proxy, custom domain và môi trường đa issuer
- level1: OIDC Core và ID Token
  level2:
  - Bật OIDC và xử lý scope openid
  - OIDC Authorization Code Flow và bộ token được phát hành
  - ID Token và các claims iss, sub, aud, exp, iat, auth_time
  - Nonce và bảo vệ liên kết giữa yêu cầu đăng nhập với ID Token
  - Ý nghĩa của azp, acr, amr và các claims xác thực mở rộng
  - Xử lý prompt, max_age, login_hint và các tham số theo mức hỗ trợ thực tế
  - Phân phối claims theo scope profile, email, address và phone
  - Định danh subject ổn định và thiết kế pairwise subject khi cần
  - Tùy chỉnh ID Token bằng OAuth2TokenCustomizer
  - Chính sách thuật toán ký ID Token theo cấu hình client
  - Phân biệt khả năng OIDC có sẵn với extension phải tự triển khai
- level1: OIDC UserInfo
  level2:
  - UserInfo Endpoint và yêu cầu access token hợp lệ
  - Cấu hình Resource Server và JwtDecoder phục vụ UserInfo
  - Lấy thông tin người dùng và kiểm tra subject của phản hồi
  - Ánh xạ claims theo scope được cấp
  - OidcUserInfoEndpointConfigurer và userInfoMapper
  - Kết nối nguồn hồ sơ người dùng và kiểm soát dữ liệu cá nhân
  - Tính nhất quán giữa UserInfo, ID Token và định danh tài khoản
  - Xử lý lỗi token, scope và người dùng không còn khả dụng
- level1: OIDC Logout
  level2:
  - RP-Initiated Logout và OIDC Logout Endpoint
  - id_token_hint, client_id, post_logout_redirect_uri và state
  - Kiểm tra post-logout redirect URI theo đăng ký client
  - Xác nhận logout và xử lý yêu cầu không đủ thông tin
  - OidcLogoutEndpointConfigurer và các điểm tùy chỉnh
  - Kết thúc phiên Authorization Server và dọn SecurityContext
  - SessionRegistry và theo dõi phiên phục vụ logout
  - Phân biệt logout phiên SSO, thu hồi token và đăng xuất từng ứng dụng
  - Đánh giá nhu cầu Front-Channel hoặc Back-Channel Logout và phần cần mở rộng
- level1: Đăng ký client động
  level2:
  - OAuth 2.0 Dynamic Client Registration và OIDC Client Registration
  - Bật endpoint đăng ký động theo phạm vi và phiên bản sử dụng
  - Bảo vệ đăng ký bằng initial access token và quyền đăng ký client
  - Kiểm tra redirect_uris, grant_types, response_types và authentication method
  - Kiểm tra jwks, jwks_uri và thuật toán do client khai báo
  - Cấp client_id, client_secret và metadata đăng ký
  - Registration access token và endpoint cấu hình client OIDC
  - Tùy chỉnh metadata converter, provider và chính sách đăng ký
  - Giới hạn đăng ký, phê duyệt client và phòng chống SSRF từ URL metadata
  - Quản lý vòng đời client đã đăng ký động và bảo vệ bí mật đăng ký
- level1: Lưu trữ JDBC
  level2:
  - Chuyển từ các thành phần in-memory sang lưu trữ bền vững
  - JdbcRegisteredClientRepository và schema client
  - JdbcOAuth2AuthorizationService và schema authorization
  - JdbcOAuth2AuthorizationConsentService và schema consent
  - Khởi tạo schema và quản lý migration bằng Flyway hoặc Liquibase
  - Tuần tự hóa principal, attributes và metadata của token
  - Cấu hình Jackson module cần thiết và kiểm soát deserialization
  - Transaction, connection pool và xử lý lỗi cơ sở dữ liệu
  - Index, truy vấn theo token và tác động của kích thước dữ liệu
  - Dọn authorization hết hạn, backup và khôi phục dữ liệu
- level1: Lưu trữ tùy chỉnh
  level2:
  - Thiết kế RegisteredClientRepository cho nguồn dữ liệu riêng
  - Triển khai OAuth2AuthorizationService và tra cứu theo từng loại token
  - Triển khai OAuth2AuthorizationConsentService
  - Lựa chọn JPA, Redis hoặc kho dữ liệu khác theo yêu cầu nhất quán
  - TTL, serialization và cập nhật metadata token trong kho tùy chỉnh
  - Kiểm soát truy cập đồng thời khi đổi code hoặc refresh token
  - Cache client, authorization và cơ chế vô hiệu hóa cache
  - Mã hóa dữ liệu nhạy cảm và kiểm thử tính tương thích giữa các instance
- level1: Mở rộng giao thức
  level2:
  - Đánh giá nhu cầu custom grant và tác động đến chuẩn giao thức
  - Khai báo AuthorizationGrantType và đăng ký grant cho client
  - Tạo AuthenticationToken và AuthenticationConverter cho grant mới
  - Tạo AuthenticationProvider và kiểm tra điều kiện cấp quyền
  - Tạo, lưu token bằng OAuth2TokenGenerator và OAuth2AuthorizationService
  - Chuẩn hóa OAuth2Error cho lỗi validation và lỗi cấp token
  - Đăng ký extension vào Token Endpoint và cập nhật metadata phù hợp
  - Tùy chỉnh endpoint bằng các extension point công khai
  - Kiểm thử bảo mật và tương thích của grant hoặc endpoint mở rộng
- level1: Liên kết danh tính
  level2:
  - Authorization Server đồng thời đóng vai trò OAuth2 Client với IdP bên ngoài
  - Tích hợp đăng nhập OIDC hoặc OAuth2 từ nhà cung cấp danh tính
  - Ánh xạ external principal sang tài khoản và subject nội bộ
  - Liên kết tài khoản có xác minh và ngăn account takeover
  - Cấp claims nội bộ từ danh tính bên ngoài theo chính sách
  - Truyền mức độ xác thực và yêu cầu MFA theo ngữ cảnh
  - Phân biệt token của IdP đầu nguồn với token do máy chủ nội bộ phát hành
  - Xử lý session và logout khi có nhiều miền xác thực
  - Giới hạn trách nhiệm giữa identity federation và phát hành token
- level1: Đa tenant
  level2:
  - Chọn mô hình một issuer hoặc nhiều issuer cho các tenant
  - Cấu hình và phân giải issuer theo khả năng hỗ trợ đa tenant
  - Phân giải tenant bằng cơ chế đáng tin cậy và kiểm tra host, path
  - Tách RegisteredClientRepository theo tenant
  - Tách authorization service và consent service theo tenant
  - Cô lập khóa ký, JWKS và chính sách token giữa các tenant
  - Tùy biến giao diện, consent và claims theo tenant
  - Quản lý vòng đời tenant và cấu hình domain
  - Kiểm thử ngăn truy cập chéo tenant, nhầm issuer và nhầm khóa
- level1: Tích hợp ứng dụng
  level2:
  - Tích hợp ứng dụng Spring OAuth2 Client qua issuer discovery
  - Tích hợp Resource Server xác minh JWT bằng issuer và JWKS
  - Tích hợp Resource Server qua introspection cho reference token
  - Thiết kế client SPA với PKCE và cân nhắc mô hình BFF
  - Đăng ký ứng dụng native với redirect URI và PKCE phù hợp
  - Tích hợp service-to-service bằng Client Credentials
  - Cấp audience và scope cho nhiều API hoặc gateway
  - Thực hiện SSO giữa nhiều client dùng chung Authorization Server
  - Kiểm tra hợp đồng claims, thuật toán và chính sách clock skew
  - Ranh giới lưu token, session và trách nhiệm bảo vệ của từng ứng dụng
- level1: Bảo vệ máy chủ
  level2:
  - Mô hình đe dọa và áp dụng OAuth 2.0 Security Best Current Practice
  - Bắt buộc HTTPS và cấu hình cookie Secure, HttpOnly, SameSite
  - CSRF theo từng endpoint và bảo vệ các thao tác có người dùng
  - CORS theo origin cụ thể và giới hạn trên các endpoint giao thức
  - Ngăn open redirect, authorization response injection và mix-up attack
  - Chống brute force, credential stuffing và enumeration
  - Chống phát lại code, client assertion, device code và DPoP proof
  - Bảo vệ secret, private key, token và thông tin cá nhân
  - Giới hạn scope, audience và đặc quyền quản trị theo least privilege
  - Kiểm soát SSRF từ jwks_uri, metadata và URL do client cung cấp
  - Thiết lập security headers và bảo vệ giao diện login, consent
  - Chính sách khi tài khoản bị khóa, credential bị lộ hoặc phiên bị xâm phạm
- level1: Triển khai và mở rộng
  level2:
  - Đóng gói ứng dụng và cấu hình môi trường production
  - Reverse proxy, load balancer và xác định public issuer ổn định
  - Tin cậy Forwarded headers từ proxy được phép
  - HTTPS termination, mTLS và cấu hình chứng thư
  - Chia sẻ dữ liệu client, authorization và consent giữa các instance
  - Quản lý session phân tán và tính nhất quán trải nghiệm SSO
  - Phân phối khóa ký ổn định và đồng bộ thời gian hệ thống
  - Xử lý cạnh tranh khi redeem code, rotate refresh token và thu hồi token
  - Scaling, connection pool, cache và giới hạn tài nguyên
  - Health check, readiness, graceful shutdown và rolling deployment
  - Kế hoạch backup, disaster recovery và ứng phó sự cố khóa ký
- level1: Quan sát và kiểm toán
  level2:
  - Ghi log sự kiện đăng nhập, consent, phát hành và thu hồi token
  - Ẩn token, secret, authorization code và dữ liệu cá nhân trong log
  - Correlation ID và truy vết xuyên Authorization Server, client, API
  - Metrics theo endpoint, grant type, client và kết quả xử lý
  - Theo dõi độ trễ, lỗi xác thực và tỷ lệ refresh token thất bại
  - Theo dõi tải cơ sở dữ liệu, pool kết nối và kho khóa
  - Audit thay đổi cấu hình client, tenant và chính sách token
  - Phát hiện bất thường và thiết lập cảnh báo lạm dụng endpoint
  - Chính sách lưu trữ, phân quyền truy cập và bảo toàn audit trail
- level1: Kiểm thử chức năng
  level2:
  - Chuẩn bị test profile, client fixture và khóa ký dành cho kiểm thử
  - Kiểm thử filter chain, endpoint matcher và cấu hình issuer
  - Kiểm thử Authorization Code, PKCE, login và consent
  - Kiểm thử Client Credentials, Refresh Token và token rotation
  - Kiểm thử Device Authorization và các trạng thái polling
  - Kiểm thử Token Exchange và giới hạn scope, audience
  - Kiểm thử JWT claims, reference token, introspection và revocation
  - Kiểm thử OIDC Discovery, ID Token, UserInfo và Logout
  - Kiểm thử client registration động, PAR và client authentication
  - Kiểm thử tích hợp bằng MockMvc, client thật và Testcontainers
  - Kiểm thử lưu trữ bền vững, restart và phối hợp nhiều instance
- level1: Kiểm thử bảo mật
  level2:
  - Negative test với redirect URI, scope, issuer và audience không hợp lệ
  - Kiểm thử PKCE thiếu, sai verifier, downgrade và code replay
  - Kiểm thử hết hạn code, token, client secret và chứng thư
  - Kiểm thử client assertion sai chữ ký, sai audience và bị phát lại
  - Kiểm thử DPoP, mTLS và các trường hợp token binding không khớp
  - Kiểm thử CSRF, CORS, session fixation và logout redirect
  - Kiểm thử cô lập tenant và quyền đăng ký, quản trị client
  - Kiểm thử xoay khóa, JWKS cache và token ký bằng khóa đã loại bỏ
  - Kiểm thử tải, rate limit và hành vi khi kho dữ liệu gián đoạn
  - Đánh giá conformance OAuth/OIDC và hồi quy sau thay đổi bảo mật
- level1: Chẩn đoán lỗi
  level2:
  - 'invalid_client: secret, authentication method, assertion và chứng thư'
  - 'invalid_grant: code hết hạn, dùng lại, sai PKCE hoặc refresh token'
  - invalid_scope, unauthorized_client và unsupported_grant_type
  - redirect_uri mismatch và lỗi post_logout_redirect_uri
  - Vòng lặp login, mất authorization request và sai thứ tự filter chain
  - Lỗi issuer, forwarded headers và discovery sau reverse proxy
  - Lỗi chữ ký JWT, thiếu kid, sai thuật toán hoặc JWKS không đồng bộ
  - Lỗi claims, audience và quyền truy cập tại Resource Server
  - Lỗi OIDC UserInfo, thiếu JwtDecoder và subject không nhất quán
  - Lỗi JDBC schema, serialization và khôi phục authorization
  - Lỗi Device Flow, PAR, Token Exchange và token binding
  - Quy trình tái hiện lỗi bằng log đã che dữ liệu và request tối thiểu
- level1: Nâng cấp và chuyển đổi
  level2:
  - Xác định phiên bản nền và ma trận tương thích dependency
  - Chuyển từ Spring Security OAuth cũ sang Authorization Server hiện hành
  - Phân biệt lịch sử Spring Authorization Server độc lập với tích hợp trong Spring Security
  - Cập nhật Java DSL, API bị deprecated và điểm mở rộng công khai
  - Chuyển schema, dữ liệu client, consent và authorization
  - Bảo toàn issuer, subject, khóa và hợp đồng claims khi nâng cấp
  - Duy trì token đang hoạt động trong giai đoạn chuyển tiếp
  - Kiểm thử hồi quy luồng OAuth/OIDC và khả năng tương tác client
  - Triển khai theo giai đoạn, theo dõi sự cố và lập phương án rollback
- level1: Thực hành tổng hợp
  level2:
  - Xây dựng Authorization Server tối thiểu với một OAuth2 Client
  - Bổ sung JDBC, custom login và consent page
  - Cấp JWT với roles, audience và chính sách scope cho API
  - Xây dựng client public dùng PKCE và client dịch vụ dùng Client Credentials
  - Hoàn thiện OIDC SSO, ID Token, UserInfo và Logout
  - Triển khai Device Flow, PAR và Token Exchange theo nhu cầu
  - Thực hành private_key_jwt, mTLS, DPoP và xoay khóa
  - Mở rộng custom grant hoặc lưu trữ tùy chỉnh có kiểm thử
  - Triển khai đa instance sau proxy với issuer và session ổn định
  - Hoàn thiện tài liệu kiến trúc, cấu hình, vận hành và xử lý sự cố
