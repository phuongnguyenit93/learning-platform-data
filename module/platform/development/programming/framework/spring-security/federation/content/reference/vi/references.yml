references:
  - title: "OpenID Connect Core 1.0 incorporating errata set 2"
    url: "https://openid.net/specs/openid-connect-core-1_0.html"
    description: "Vai trò OpenID Provider/Relying Party, ID Token, xác minh danh tính và tính ổn định của cặp issuer/sub."
  - title: "OpenID Connect Discovery 1.0 incorporating errata set 2"
    url: "https://openid.net/specs/openid-connect-discovery-1_0.html"
    description: "Khám phá cấu hình nhà cung cấp, issuer, endpoint và thông tin khóa; xác minh metadata trước khi tin cậy."
  - title: "Assertions and Protocols for the OASIS Security Assertion Markup Language (SAML) V2.0"
    url: "https://docs.oasis-open.org/security/saml/v2.0/saml-core-2.0-os.pdf"
    description: "Đặc tả Assertion, AuthnRequest, Response, NameID và điều kiện sử dụng thông điệp SAML."
  - title: "Profiles for the OASIS Security Assertion Markup Language (SAML) V2.0"
    url: "https://docs.oasis-open.org/security/saml/v2.0/saml-profiles-2.0-os.pdf"
    description: "Web Browser SSO, xác nhận bên nhận và các luồng Single Logout trong SAML."
  - title: "Metadata for the OASIS Security Assertion Markup Language (SAML) V2.0"
    url: "https://docs.oasis-open.org/security/saml/v2.0/saml-metadata-2.0-os.pdf"
    description: "Mô tả entity ID, vai trò IdP/SP, endpoint và khóa để cấu hình quan hệ tin cậy."
  - title: "Spring Security — SAML 2.0 Login Overview"
    url: "https://docs.spring.io/spring-security/reference/servlet/saml2/login/overview.html"
    description: "Luồng đăng nhập SAML trong ứng dụng Servlet, vai trò RelyingPartyRegistration và lựa chọn nhiều IdP; chọn phiên bản phù hợp dự án."
  - title: "Spring Security — Authenticating <saml2:Response>s"
    url: "https://docs.spring.io/spring-security/reference/servlet/saml2/login/authentication.html"
    description: "Xác minh phản hồi SAML, điều chỉnh sai lệch đồng hồ và ánh xạ thuộc tính thành quyền."
  - title: "Spring Security — Saml 2.0 Metadata"
    url: "https://docs.spring.io/spring-security/reference/servlet/saml2/metadata.html"
    description: "Đọc metadata của bên xác thực và công bố metadata của ứng dụng; API cụ thể phụ thuộc phiên bản."
  - title: "Spring Security — Performing Single Logout"
    url: "https://docs.spring.io/spring-security/reference/servlet/saml2/logout.html"
    description: "SAML Single Logout do ứng dụng hoặc IdP khởi xướng, điều kiện phối hợp và cấu hình chứng thư."
  - title: "Spring Security — OAuth2 Login: Advanced Configuration"
    url: "https://docs.spring.io/spring-security/reference/servlet/oauth2/login/advanced.html"
    description: "Tùy chỉnh đăng nhập qua nhà cung cấp OIDC, điểm chuyển hướng, thông tin người dùng và ánh xạ quyền."
  - title: "Spring Security — OIDC Logout"
    url: "https://docs.spring.io/spring-security/reference/servlet/oauth2/login/logout.html"
    description: "Phân biệt đăng xuất cục bộ với đăng xuất phối hợp tại nhà cung cấp OIDC."
