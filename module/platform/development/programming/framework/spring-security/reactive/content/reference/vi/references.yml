references:
  - title: "Spring Security: Bảo mật WebFlux (WebFlux Security)"
    url: "https://docs.spring.io/spring-security/reference/reactive/configuration/webflux.html"
    description: "Cấu hình SecurityWebFilterChain, ServerHttpSecurity và thứ tự lựa chọn nhiều chuỗi lọc."
  - title: "Spring Security API: AuthenticationWebFilter"
    url: "https://docs.spring.io/spring-security/reference/api/java/org/springframework/security/web/server/authentication/AuthenticationWebFilter.html"
    description: "Luồng chuyển yêu cầu thành Authentication, xác thực và xử lý kết quả thành công hoặc thất bại."
  - title: "Spring Security API: ReactiveSecurityContextHolder"
    url: "https://docs.spring.io/spring-security/reference/api/java/org/springframework/security/core/context/ReactiveSecurityContextHolder.html"
    description: "Đọc và thiết lập SecurityContext trong Reactor Context."
  - title: "Spring Security API: ServerSecurityContextRepository"
    url: "https://docs.spring.io/spring-security/reference/api/java/org/springframework/security/web/server/context/ServerSecurityContextRepository.html"
    description: "Hợp đồng nạp và lưu SecurityContext giữa các yêu cầu; liên hệ WebSession và chiến lược không lưu."
  - title: "Spring Security: Phân quyền yêu cầu HTTP (Authorize ServerHttpRequest)"
    url: "https://docs.spring.io/spring-security/reference/reactive/authorization/authorize-http-requests.html"
    description: "Quy tắc authorizeExchange theo đường dẫn, vai trò và thứ tự khai báo."
  - title: "Spring Security: Phân quyền phương thức phản ứng (EnableReactiveMethodSecurity)"
    url: "https://docs.spring.io/spring-security/reference/reactive/authorization/method.html"
    description: "Bảo vệ phương thức trả Mono/Flux bằng annotation và ngữ cảnh bảo mật phản ứng."
  - title: "Spring Security: Chống CSRF trong WebFlux"
    url: "https://docs.spring.io/spring-security/reference/reactive/exploits/csrf.html"
    description: "Cấu hình, lưu trữ và gửi CSRF token trong ứng dụng WebFlux."
  - title: "Spring Security: Tích hợp CORS trong WebFlux"
    url: "https://docs.spring.io/spring-security/reference/reactive/integrations/cors.html"
    description: "Tích hợp xử lý yêu cầu khác nguồn và yêu cầu kiểm tra trước với Spring Security."
  - title: "Spring Security: HTTP header bảo mật cho WebFlux"
    url: "https://docs.spring.io/spring-security/reference/reactive/exploits/headers.html"
    description: "Các header bảo mật mặc định và cách điều chỉnh theo ứng dụng."
  - title: "Spring Security: Tích hợp OAuth2 trong WebFlux (OAuth2 WebFlux)"
    url: "https://docs.spring.io/spring-security/reference/reactive/oauth2/index.html"
    description: "Phân biệt và cấu hình OAuth2 Resource Server, Client và Login trong ứng dụng phản ứng."
  - title: "Spring Security: Kiểm thử ứng dụng phản ứng (Reactive Test Support)"
    url: "https://docs.spring.io/spring-security/reference/reactive/test/index.html"
    description: "Điểm vào tài liệu kiểm thử bảo mật phương thức và HTTP, gồm WebTestClient, xác thực, CSRF và OAuth2."