references:
  - title: "Authorization Architecture"
    url: "https://docs.spring.io/spring-security/reference/servlet/authorization/architecture.html"
    description: "Quyền được cấp, vai trò và kiến trúc quyết định truy cập qua AuthorizationManager."
  - title: "Authorize HttpServletRequests"
    url: "https://docs.spring.io/spring-security/reference/servlet/authorization/authorize-http-requests.html"
    description: "Phân quyền yêu cầu Servlet theo đường dẫn, phương thức và thứ tự quy tắc."
  - title: "Method Security"
    url: "https://docs.spring.io/spring-security/reference/servlet/authorization/method-security.html"
    description: "Bảo vệ phương thức, biểu thức SpEL và tùy biến chính sách tại tầng dịch vụ."
  - title: "Domain Object Security (ACLs)"
    url: "https://docs.spring.io/spring-security/reference/servlet/authorization/acls.html"
    description: "Kiểm soát truy cập trên từng đối tượng nghiệp vụ bằng danh sách quyền."
  - title: "Authorize ServerHttpRequest"
    url: "https://docs.spring.io/spring-security/reference/reactive/authorization/authorize-http-requests.html"
    description: "Phân quyền yêu cầu WebFlux với authorizeExchange và ReactiveAuthorizationManager."
  - title: "EnableReactiveMethodSecurity"
    url: "https://docs.spring.io/spring-security/reference/reactive/authorization/method.html"
    description: "Bảo vệ phương thức Reactive và sử dụng ngữ cảnh bảo mật trong Reactor."
  - title: "Testing Method Security"
    url: "https://docs.spring.io/spring-security/reference/servlet/test/method.html"
    description: "Kiểm thử bảo vệ phương thức bằng người dùng và ngữ cảnh bảo mật giả lập."
  - title: "Spring MVC Test Integration"
    url: "https://docs.spring.io/spring-security/reference/servlet/test/mockmvc/index.html"
    description: "Tích hợp MockMvc để kiểm chứng chính sách truy cập qua yêu cầu HTTP."