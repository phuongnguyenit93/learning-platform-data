menu:
- level1: Bức tranh phân quyền
  level2:
  - Phân quyền giải quyết bài toán ai được làm gì trên tài nguyên nào
  - Phân biệt xác thực danh tính với quyết định cấp quyền
  - Chủ thể, tài nguyên, hành động và ngữ cảnh của một quyết định
  - Role, authority, permission, scope và quan hệ giữa các khái niệm
  - Phân quyền ở mức HTTP, phương thức và từng đối tượng dữ liệu
  - Nguyên tắc quyền tối thiểu, mặc định từ chối và kiểm tra mọi lần truy cập
  - Phân biệt chức năng authorization với vai trò OAuth2 Authorization Server
  - Ranh giới giữa cơ chế Spring Security và chính sách nghiệp vụ
  - Trình tự học từ mô hình quyền đến cấu hình, kiểm thử và vận hành
- level1: Mô hình kiểm soát truy cập
  level2:
  - 'RBAC: tổ chức quyền theo vai trò người dùng'
  - 'ABAC: quyết định theo thuộc tính chủ thể, tài nguyên và môi trường'
  - 'ReBAC: quyết định theo quan hệ sở hữu, thành viên và chia sẻ'
  - 'ACL: cấp quyền cho từng chủ thể trên từng đối tượng'
  - Phối hợp role, permission và điều kiện dữ liệu trong cùng chính sách
  - Phân quyền theo chức năng và phân quyền theo đối tượng
  - Leo thang đặc quyền theo chiều dọc và truy cập trái phép theo chiều ngang
  - Phân tách nhiệm vụ và kiểm soát hành động nhạy cảm
  - Ma trận chủ thể, hành động, tài nguyên để mô tả yêu cầu quyền
  - Chọn mô hình phù hợp và tránh tạo quá nhiều role
- level1: Authority và role
  level2:
  - Authentication, principal và tập GrantedAuthority được dùng khi kiểm tra quyền
  - SimpleGrantedAuthority và ý nghĩa chuỗi định danh quyền
  - 'hasAuthority và hasRole: quy tắc tiền tố ROLE_'
  - hasAnyAuthority, hasAnyRole và kiểm tra một trong nhiều quyền
  - Phân biệt tên vai trò nghiệp vụ với authority trong ứng dụng
  - Ánh xạ role, nhóm và quyền từ nguồn danh tính
  - GrantedAuthorityDefaults và phạm vi áp dụng tiền tố theo thành phần
  - Nhất quán quy ước tên quyền giữa cấu hình HTTP và method security
  - Anonymous, authenticated, remember-me và fully authenticated
  - Quyền đã lưu trong session hoặc token và thời điểm thay đổi có hiệu lực
- level1: Luồng quyết định
  level2:
  - Từ HTTP request hoặc lời gọi phương thức đến quyết định cấp quyền
  - SecurityContext và cách lấy Authentication tại thời điểm kiểm tra
  - AuthorizationManager và đối tượng được bảo vệ
  - Supplier<Authentication> và việc lấy danh tính theo nhu cầu
  - AuthorizationDecision, AuthorizationResult và API phù hợp phiên bản
  - Cho phép, từ chối, không đưa ra quyết định và cách xử lý mặc định
  - AuthorizationFilter và RequestMatcherDelegatingAuthorizationManager
  - Interceptor trước, sau phương thức và điểm thực thi chính sách
  - AccessDeniedException và đường đi của lỗi phân quyền
  - Phối hợp bảo vệ nhiều lớp mà không bỏ sót hoặc mâu thuẫn chính sách
- level1: Phân quyền HTTP
  level2:
  - Thiết lập SecurityFilterChain và authorizeHttpRequests
  - permitAll, denyAll và authenticated trong quy tắc truy cập
  - Áp dụng hasRole, hasAuthority cho nhóm endpoint
  - Thứ tự khai báo và quy tắc khớp đầu tiên
  - Quy tắc cụ thể trước quy tắc tổng quát
  - anyRequest làm chính sách kết thúc và lựa chọn mặc định từ chối
  - Phân biệt securityMatcher chọn filter chain với requestMatchers chọn quy tắc
  - Nhiều SecurityFilterChain, @Order và rủi ro request không khớp chain nào
  - permitAll so với bỏ qua filter chain bằng ignoring
  - Tài nguyên tĩnh, trang công khai và endpoint quản trị
  - Kiểm chứng một cấu hình HTTP tối thiểu bằng ma trận quyền
- level1: RequestMatcher
  level2:
  - RequestMatcher và thông tin request dùng để so khớp
  - So khớp đồng thời đường dẫn và HTTP method
  - PathPatternRequestMatcher, MvcRequestMatcher và AntPathRequestMatcher theo phiên bản
  - Biến đường dẫn, wildcard và khác biệt ngữ nghĩa từng kiểu matcher
  - RegexRequestMatcher và trường hợp cần biểu thức chính quy
  - Context path, servlet path, base path và địa chỉ thực được so khớp
  - Đường dẫn có dấu gạch chéo cuối, chữ hoa và ký tự mã hóa
  - Matcher theo header, tham số hoặc thuộc tính request có kiểm soát
  - AndRequestMatcher, OrRequestMatcher và NegatedRequestMatcher
  - RequestMatcher tùy chỉnh và tiêu chí không bỏ lọt endpoint
  - Kiểm thử matcher khi thay đổi route hoặc nâng phiên bản
- level1: Ngữ cảnh request
  level2:
  - Phân quyền theo DispatcherType REQUEST, FORWARD, INCLUDE, ERROR và ASYNC
  - Endpoint lỗi và tránh vòng lặp từ chối khi chuyển sang /error
  - Forward nội bộ và các request được thực thi lại
  - CORS preflight, OPTIONS và quan hệ với quy tắc phân quyền
  - Phân biệt lỗi CSRF với lỗi thiếu quyền
  - SecurityContext trong request bất đồng bộ và lời gọi sang luồng khác
  - AsyncContext, executor và giới hạn của việc truyền ngữ cảnh
  - Reverse proxy, đường dẫn viết lại và dữ liệu forwarded đáng tin cậy
  - HttpFirewall, chuẩn hóa đường dẫn và giới hạn của matcher
  - Tách phạm vi API, giao diện và quản trị qua các filter chain
- level1: Role hierarchy
  level2:
  - Quan hệ kế thừa role và bài toán quyền bao hàm
  - RoleHierarchy và RoleHierarchyImpl
  - Mô tả ADMIN bao hàm MANAGER, USER mà không nhân bản quyền
  - Đưa hierarchy vào AuthorizationManager theo phiên bản
  - Đưa hierarchy vào MethodSecurityExpressionHandler
  - Kiểm tra hiệu lực riêng ở mức HTTP và mức phương thức
  - Tránh chu trình, quyền bao hàm quá rộng và vai trò quản trị vượt dự kiến
  - Phân biệt kế thừa role với điều kiện sở hữu dữ liệu
  - Kiểm thử quyền trực tiếp, quyền suy ra và thay đổi hierarchy
- level1: Method security
  level2:
  - Vì sao bảo vệ service ngoài quy tắc HTTP ở Controller
  - Kích hoạt @EnableMethodSecurity và các nhóm annotation
  - '@PreAuthorize, @PostAuthorize, @PreFilter và @PostFilter'
  - securedEnabled, jsr250Enabled và phạm vi annotation được kích hoạt
  - '@Secured và danh sách authority được chấp nhận'
  - '@RolesAllowed, @PermitAll, @DenyAll và ngữ nghĩa JSR-250'
  - Annotation ở lớp, phương thức, interface và quy tắc kế thừa
  - Phối hợp nhiều annotation và xử lý khai báo xung đột
  - Phương thức không có annotation và chính sách bao phủ mặc định
  - Meta-annotation để đặt tên chính sách dễ đọc, tái sử dụng
- level1: Kiểm tra trước phương thức
  level2:
  - '@PreAuthorize và quyết định trước khi nghiệp vụ được thực thi'
  - Kiểm tra role, authority và trạng thái xác thực bằng SpEL
  - Tham chiếu authentication, principal và tên người dùng
  - 'Tham chiếu tham số bằng tên, #p0, #a0 hoặc #root.args'
  - 'Phát hiện tên tham số: -parameters, @P và tương thích phiên bản'
  - Kiểm tra thuộc tính của đối tượng đầu vào
  - Gọi bean chính sách từ biểu thức bằng @beanName
  - Kết hợp role với quyền sở hữu tài nguyên
  - Xử lý tham số null và chính sách từ chối rõ ràng
  - Ngăn giả mạo ownerId, tenantId hoặc thuộc tính quyền trong request
  - Đặt kiểm tra trước các thao tác ghi dữ liệu và tác động bên ngoài
- level1: Kiểm tra sau phương thức
  level2:
  - '@PostAuthorize và quyết định dựa trên returnObject'
  - Kiểm tra quyền sở hữu khi đối tượng chỉ có sau truy vấn
  - Phân biệt chưa thực thi nghiệp vụ với đã thực thi nhưng bị chặn kết quả
  - Giới hạn của @PostAuthorize với thao tác ghi và tác động không thể hoàn tác
  - Kết quả null, Optional và kiểu trả về cần kiểm chứng
  - Phối hợp @PreAuthorize với @PostAuthorize trên cùng nghiệp vụ
  - '@AuthorizeReturnObject và bảo vệ thành viên của đối tượng theo phiên bản'
  - Proxy đối tượng trả về, kiểu lồng nhau và giới hạn tương thích
  - DTO, ánh xạ dữ liệu và nguy cơ làm mất lớp kiểm tra quyền
  - Che dữ liệu khi bị từ chối và giới hạn không tiết lộ thông tin
- level1: Lọc dữ liệu phương thức
  level2:
  - '@PreFilter và lọc phần tử đầu vào trước khi xử lý'
  - filterObject, filterTarget và lựa chọn tham số cần lọc
  - '@PostFilter và lọc tập kết quả theo quyền của từng phần tử'
  - Collection, array, map, stream và khả năng hỗ trợ theo phiên bản
  - Chính sách loại bỏ phần tử so với từ chối toàn bộ thao tác
  - Nguy cơ cập nhật một phần khi lọc dữ liệu của yêu cầu hàng loạt
  - Giới hạn của lọc trong bộ nhớ với dữ liệu lớn
  - Phân trang, tổng số bản ghi và sai lệch khi lọc sau truy vấn
  - 'Lọc tại truy vấn so với @PostFilter: chọn lớp thực thi phù hợp'
  - Kiểm thử tập rỗng, phần tử không có quyền và dữ liệu hỗn hợp
- level1: Biểu thức và chính sách
  level2:
  - SecurityExpressionRoot và ngữ cảnh biểu thức bảo mật
  - WebSecurityExpressionRoot khác với ngữ cảnh method security
  - Phép toán logic, độ ưu tiên và tính dễ đọc của biểu thức
  - hasPermission cho đối tượng trực tiếp hoặc định danh đối tượng
  - DefaultMethodSecurityExpressionHandler và điểm tùy biến
  - Bean chính sách nghiệp vụ và tách biểu thức dài khỏi annotation
  - Biểu thức cho dữ liệu null, dữ liệu thiếu và điều kiện không xác định
  - Không đưa dữ liệu đầu vào không tin cậy thành mã SpEL
  - Tham số hóa meta-annotation theo khả năng của phiên bản
  - Ranh giới giữa kiểm tra quyền, kiểm tra tính hợp lệ và điều kiện nghiệp vụ
- level1: Proxy và giao dịch
  level2:
  - Spring AOP và điều kiện để method security được thực thi
  - Lời gọi qua Spring bean so với đối tượng tự tạo bằng new
  - Self-invocation và trường hợp gọi nội bộ bỏ qua proxy
  - JDK proxy, CGLIB và ảnh hưởng của interface, final, private
  - Thiết kế ranh giới service để mọi điểm vào đều được bảo vệ
  - Thứ tự interceptor bảo mật với @Transactional và các advice khác
  - '@PostAuthorize, rollback và tác động không nằm trong giao dịch'
  - '@Async, executor và truyền SecurityContext đúng phạm vi'
  - Cache kết quả phương thức và nguy cơ chia sẻ dữ liệu giữa người dùng
  - AspectJ như lựa chọn có chủ đích khi mô hình proxy không đáp ứng
- level1: AuthorizationManager tùy chỉnh
  level2:
  - Chọn AuthorizationManager khi quy tắc dựng sẵn không đủ
  - RequestAuthorizationContext và MethodInvocation làm ngữ cảnh quyết định
  - Hiện thực check hoặc authorize đúng hợp đồng phiên bản
  - AuthorityAuthorizationManager và AuthenticatedAuthorizationManager
  - AuthorizationManagers.allOf, anyOf và ngữ nghĩa khi không có quyết định
  - Kết hợp quyền tĩnh với điều kiện động từ nghiệp vụ
  - Đăng ký manager qua access ở mức HTTP
  - AuthorizationManagerBeforeMethodInterceptor và AuthorizationManagerAfterMethodInterceptor
  - Pointcut tùy chỉnh và phạm vi phương thức được áp dụng
  - AuthorizationManagerFactory và khả năng tùy biến ở dòng phiên bản hỗ trợ
  - Quản lý exception, dữ liệu thiếu và quyết định mặc định an toàn
- level1: PermissionEvaluator
  level2:
  - Đặt tên quyền theo hành động trên loại tài nguyên
  - Hợp đồng PermissionEvaluator và ngữ cảnh Authentication
  - hasPermission với đối tượng đã được tải
  - hasPermission với targetId, targetType và permission
  - Đăng ký PermissionEvaluator với expression handler
  - Tách kiểm tra quyền khỏi việc tải và cập nhật tài nguyên
  - Đối tượng không tồn tại, thiếu quyền và chính sách trả lỗi
  - Phân quyền sở hữu, quyền chia sẻ và quyền quản trị
  - Tránh truy vấn lặp cho mỗi phần tử khi kiểm tra tập dữ liệu
  - Kiểm thử evaluator độc lập và kiểm thử tích hợp qua proxy
- level1: Nền tảng ACL
  level2:
  - Khi nào cần ACL thay cho role hoặc cờ sở hữu đơn giản
  - Acl, AccessControlEntry, ObjectIdentity, Sid và Permission
  - PrincipalSid, GrantedAuthoritySid và phạm vi cấp quyền
  - BasePermission, permission mask và quyền tùy chỉnh
  - Grant, deny, thứ tự ACE và chính sách kiểm tra quyền
  - Kế thừa ACL từ đối tượng cha và giới hạn quyền lan truyền
  - 'Chủ sở hữu ACL và quyền trên đối tượng: hai khái niệm cần tách biệt'
  - Các bảng acl_sid, acl_class, acl_object_identity và acl_entry
  - Kiểu định danh đối tượng và tương thích với hạ tầng ACL
  - Thư viện ACL, DataSource và các thành phần cấu hình cần thiết
- level1: Triển khai ACL
  level2:
  - AclService, MutableAclService và JdbcMutableAclService
  - BasicLookupStrategy và cách tải ACL
  - AclAuthorizationStrategy và PermissionGrantingStrategy
  - Tạo ACL khi tạo mới đối tượng nghiệp vụ
  - Thêm, sửa, xóa ACE và kiểm soát người được phép chia sẻ
  - AclPermissionEvaluator và tích hợp hasPermission
  - Đổi chủ sở hữu, thay đổi ACL cha và cập nhật kế thừa
  - Xóa đối tượng, xóa ACL và tính nhất quán giao dịch
  - AclCache, vô hiệu hóa cache và nhiều instance
  - Audit thay đổi ACL và truy vết quyền được cấp
  - Kiểm thử quyền trực tiếp, quyền kế thừa và ACE từ chối
- level1: Quyền trên dữ liệu
  level2:
  - IDOR và yêu cầu kiểm tra quyền với từng định danh tài nguyên
  - Truy vấn theo ID kết hợp chủ sở hữu hoặc phạm vi được phép
  - Phân biệt quyền đọc, tạo, sửa, xóa, duyệt và xuất dữ liệu
  - Bảo vệ thao tác tạo mới khi tài nguyên chưa có định danh
  - Chặn thay đổi ownerId, tenantId và trường nhạy cảm bằng mass assignment
  - Cập nhật, xóa hàng loạt và tính nguyên tử khi có phần tử thiếu quyền
  - Phạm vi quyền cho tìm kiếm, đếm, phân trang và thống kê
  - Quyền trên tài nguyên cha, tài nguyên con và đường dẫn lồng nhau
  - Chia sẻ dữ liệu, ủy quyền tạm thời và giới hạn thời gian
  - Tránh khác biệt giữa thời điểm kiểm tra quyền với thời điểm sử dụng dữ liệu
  - Ràng buộc giao dịch, khóa và kiểm tra lại khi dữ liệu quyền thay đổi
  - Kết hợp kiểm tra ứng dụng với row-level security ở cơ sở dữ liệu
- level1: Cách ly tenant
  level2:
  - Tenant là ranh giới dữ liệu và quyền trong ứng dụng nhiều khách hàng
  - Xác định tenant từ nguồn đáng tin cậy
  - Kiểm chứng tenant trong URL, header hoặc dữ liệu đầu vào
  - Kết hợp tenant, subject, role và tài nguyên khi quyết định quyền
  - Người dùng có nhiều tenant và chuyển ngữ cảnh làm việc
  - Quản trị từng tenant so với quản trị toàn hệ thống
  - Áp dụng điều kiện tenant tại repository và truy vấn dữ liệu
  - Khóa cache chứa tenant để tránh lẫn quyền hoặc kết quả
  - Truyền ngữ cảnh tenant qua tác vụ nền và dọn ngữ cảnh sau xử lý
  - Kiểm thử truy cập chéo tenant với cùng ID và cùng tên người dùng
- level1: Chính sách động
  level2:
  - Kho quyền động và nguồn dữ liệu chuẩn của chính sách
  - Thiết kế kiểm tra theo chủ thể, tài nguyên, hành động và ngữ cảnh
  - Tách điểm thực thi chính sách khỏi thành phần quyết định chính sách
  - Tích hợp dịch vụ quyết định quyền bằng AuthorizationManager
  - 'OPA hoặc hệ thống ReBAC: tiêu chí lựa chọn và phạm vi tích hợp'
  - Gửi thuộc tính tối thiểu, xác minh dữ liệu và bảo vệ kênh gọi
  - Timeout, lỗi mạng, phản hồi không hợp lệ và chính sách từ chối
  - Cache quyết định có thời hạn và vô hiệu hóa khi quyền thay đổi
  - Phiên bản chính sách, triển khai thử và phương án quay lui
  - Lưu lý do quyết định và giải thích quyền mà không lộ dữ liệu nhạy cảm
- level1: HTTP trên WebFlux
  level2:
  - ServerHttpSecurity, SecurityWebFilterChain và authorizeExchange
  - pathMatchers, HTTP method và thứ tự quy tắc
  - anyExchange và phạm vi mặc định từ chối
  - SecurityWebExchangeMatcher và lựa chọn filter chain
  - ReactiveAuthorizationManager với AuthorizationContext
  - AuthorityReactiveAuthorizationManager và kiểm tra role, authority
  - Kết hợp quyết định bằng toán tử Reactor mà không cấp quyền ngoài dự kiến
  - ReactiveSecurityContextHolder và Reactor Context
  - Đọc dữ liệu quyền bằng API không chặn luồng
  - ExceptionTranslationWebFilter và phản hồi thiếu quyền
  - CORS, CSRF và phạm vi request trong ứng dụng Reactive
- level1: Method security Reactive
  level2:
  - Kích hoạt @EnableReactiveMethodSecurity theo phiên bản
  - Mono, Flux và thời điểm kiểm tra quyền khi đăng ký xử lý
  - '@PreAuthorize, @PostAuthorize và giới hạn hỗ trợ từng annotation'
  - ReactiveAuthorizationManager với MethodInvocation
  - Đưa danh tính vào Reactor Context và tránh phụ thuộc ThreadLocal
  - Gọi dịch vụ quyền bất đồng bộ trong quyết định Reactive
  - Kết quả rỗng, tín hiệu lỗi và ngữ nghĩa từ chối
  - Proxy, self-invocation và điều kiện để interceptor được áp dụng
  - Giới hạn block, subscribe thủ công và tác vụ tách khỏi chuỗi xử lý
  - Kiểm thử method security Reactive bằng StepVerifier
  - Ranh giới giữa bảo vệ phương thức và bảo vệ dữ liệu phát ra
- level1: Quyền từ OAuth2
  level2:
  - Ranh giới giữa xác minh token và quyết định cho phép truy cập
  - Scope thành authority SCOPE_ trong Resource Server
  - Ánh xạ role claim và kiểm soát tiền tố ROLE_
  - hasAuthority cho scope và hasRole cho vai trò đã chuẩn hóa
  - Phân biệt quyền ứng dụng với quyền của người dùng
  - Audience, issuer và tiền điều kiện trước khi dùng claim cấp quyền
  - Kết hợp scope với quyền sở hữu và tenant
  - Khác biệt authority từ OAuth2 Login với authority từ Bearer token
  - Không tin claim do client tự gửi hoặc token chưa được xác minh
  - Thay đổi quyền khi session hoặc access token còn hiệu lực
- level1: Phân quyền thông điệp
  level2:
  - Phân biệt bảo vệ HTTP handshake với bảo vệ thông điệp STOMP
  - '@EnableWebSocketSecurity và AuthorizationManager<Message<?>>'
  - MessageMatcherDelegatingAuthorizationManager và thứ tự quy tắc
  - simpDestMatchers, simpSubscribeDestMatchers và simpTypeMatchers
  - Phân biệt quyền gửi MESSAGE với quyền SUBSCRIBE
  - Quyền trên kênh cá nhân, topic dùng chung và dữ liệu theo tenant
  - Principal của phiên và giới hạn tin cậy header do client gửi
  - clientInboundChannel và ranh giới bảo vệ dữ liệu gửi ra
  - Origin, CSRF trong CONNECT và quan hệ với kiểm soát truy cập
  - Kiểm thử giả mạo người gửi, đăng ký sai kênh và thông điệp ngoài quy tắc
- level1: Xử lý từ chối
  level2:
  - Phân biệt chưa xác thực, thiếu quyền và tài nguyên không tồn tại
  - ExceptionTranslationFilter và chuyển lỗi bảo mật thành phản hồi HTTP
  - AuthenticationEntryPoint với người chưa xác thực
  - AccessDeniedHandler với người không có quyền
  - Phản hồi JSON cho API và điều hướng phù hợp giao diện web
  - Mã 401, 403, 404 và chính sách tránh tiết lộ sự tồn tại của dữ liệu
  - Phân biệt AccessDeniedException với lỗi CSRF hoặc lỗi nghiệp vụ
  - Xử lý lỗi từ method security qua lớp web mà vẫn giữ đúng mã trạng thái
  - MethodAuthorizationDeniedHandler và @HandleAuthorizationDenied theo phiên bản
  - Giá trị thay thế, che trường và giới hạn an toàn khi quyền bị từ chối
  - Thống nhất mã lỗi, thông điệp và correlation ID giữa các lớp
- level1: Sự kiện và audit
  level2:
  - AuthorizationEventPublisher và SpringAuthorizationEventPublisher
  - AuthorizationDeniedEvent và dữ liệu phục vụ điều tra
  - AuthorizationGrantedEvent và kiểm soát lượng sự kiện thành công
  - Đăng ký listener và xác minh vị trí sự kiện được phát
  - Audit gồm chủ thể, tenant, tài nguyên, hành động, quyết định và lý do
  - Phân biệt audit truy cập với lịch sử thay đổi quyền
  - Che dữ liệu cá nhân, token và thuộc tính nhạy cảm trong log
  - Liên kết quyết định HTTP, phương thức và truy vấn trong cùng lượt xử lý
  - Phát hiện hành vi dò tài nguyên, bị từ chối lặp lại và vượt phạm vi quyền
  - Chính sách lưu giữ, truy cập và tính toàn vẹn của bản ghi audit
- level1: Kiểm thử HTTP
  level2:
  - Chuyển ma trận quyền thành bộ ca cho phép và từ chối
  - spring-security-test, MockMvc và tích hợp filter chain thật
  - user(), anonymous() và cấu hình role, authority cho request
  - Kiểm thử người chưa xác thực, đúng quyền và thiếu quyền
  - Kiểm thử từng HTTP method trên cùng đường dẫn
  - Kiểm thử thứ tự matcher, wildcard, servlet path và đường dẫn sát biên
  - Kiểm thử nhiều filter chain và endpoint không được khai báo
  - csrf() và phân biệt tác động CSRF với quy tắc quyền
  - Kiểm thử FORWARD, ERROR, ASYNC và endpoint xử lý lỗi
  - WebTestClient, mockUser và quy tắc authorizeExchange
  - Kiểm chứng status, phản hồi lỗi và việc nghiệp vụ không bị thực thi
  - Giới hạn của mock Authentication so với kiểm thử toàn bộ chuỗi xác thực
- level1: Kiểm thử phương thức
  level2:
  - Gọi Spring bean qua proxy để kiểm chứng annotation có hiệu lực
  - '@WithMockUser và khác biệt giữa roles với authorities'
  - '@WithAnonymousUser cho tình huống không có người dùng đăng nhập'
  - '@WithUserDetails và dữ liệu người dùng trong ApplicationContext'
  - '@WithSecurityContext cho principal hoặc bộ quyền tùy chỉnh'
  - Kiểm thử biểu thức theo tham số, chủ sở hữu và thuộc tính đầu vào
  - Kiểm thử @PostAuthorize với kết quả đúng quyền, sai quyền và null
  - Kiểm thử @PreFilter, @PostFilter và nội dung tập dữ liệu sau lọc
  - Kiểm thử meta-annotation, role hierarchy và PermissionEvaluator
  - Kiểm thử self-invocation, giao dịch và tác động phụ của phương thức
  - Kiểm thử method security Reactive và Reactor Context
  - Kiểm thử manager tùy chỉnh với cho phép, từ chối, không có quyết định và lỗi
- level1: Kiểm thử dữ liệu và chính sách
  level2:
  - Bộ dữ liệu có nhiều người dùng, role, tenant và quan hệ chia sẻ
  - Kiểm thử IDOR bằng cách thay định danh tài nguyên
  - Kiểm thử tạo, sửa, xóa, tìm kiếm và xuất dữ liệu chéo phạm vi
  - Kiểm thử quyền sở hữu thay đổi trong quá trình xử lý
  - Kiểm thử thao tác hàng loạt có cả phần tử được phép và bị từ chối
  - Kiểm thử phân trang, số lượng tổng và dữ liệu bị che
  - Kiểm thử ACL trực tiếp, kế thừa, cache và thu hồi quyền
  - Kiểm thử dịch vụ chính sách khi timeout, lỗi hoặc trả dữ liệu không hợp lệ
  - Kiểm thử cache giữa tenant và hiệu lực sau khi quyền thay đổi
  - Kiểm thử hồi quy theo ma trận quyền khi thêm endpoint hoặc hành động mới
- level1: Sai sót và lỗ hổng
  level2:
  - Đăng nhập thành công nhưng thiếu kiểm tra quyền trên chức năng
  - Quy tắc permitAll quá rộng hoặc bị che bởi thứ tự matcher
  - Endpoint nằm ngoài mọi filter chain
  - Thiếu @EnableMethodSecurity hoặc gọi phương thức không qua proxy
  - Nhầm ROLE_ với SCOPE_ và ánh xạ quyền rộng hơn dữ liệu nguồn
  - Tin ownerId, tenantId, role hoặc trạng thái do client truyền
  - Ẩn nút trên giao diện nhưng thiếu kiểm soát tại server
  - GraphQL dùng chung endpoint và yêu cầu bảo vệ resolver, đối tượng, trường dữ liệu
  - Đường dẫn thay thế, HTTP method khác và lỗi chuẩn hóa request
  - Nhầm lọc kết quả với chặn thực thi hành động
  - Quyền cũ còn trong session, token hoặc cache sau khi bị thu hồi
  - Lỗi dịch vụ chính sách dẫn đến vô tình cho phép truy cập
  - Chính sách nhiều lớp mâu thuẫn và thiếu kiểm thử tình huống bị từ chối
- level1: Hiệu năng và vận hành
  level2:
  - Đo độ trễ kiểm tra quyền theo HTTP, phương thức và dữ liệu
  - Tránh N+1 khi PermissionEvaluator hoặc ACL kiểm tra nhiều đối tượng
  - Cache quyền, quan hệ và quyết định theo đúng phạm vi
  - Thiết kế khóa cache theo người dùng, tenant, tài nguyên và phiên bản chính sách
  - Thu hồi quyền, vô hiệu hóa cache và hiệu lực trên nhiều instance
  - Đồng bộ quyền từ nguồn danh tính mà vẫn giữ quyền nghiệp vụ nhất quán
  - Kiểm tra quyền trong tác vụ nền với danh tính thực thi rõ ràng
  - Rà soát quyền tích lũy, tài khoản quản trị và chính sách hết hạn
  - Giám sát tỷ lệ từ chối và lỗi quyết định quyền bất thường
  - Triển khai thay đổi chính sách có phiên bản, kiểm chứng và quay lui
  - AOT, native image và kiểm tra tương thích proxy, biểu thức theo phiên bản
- level1: Phiên bản và chuyển đổi
  level2:
  - Đối chiếu phiên bản Spring Boot, Spring Security và tính năng phân quyền
  - authorizeRequests so với authorizeHttpRequests và thay đổi cơ chế thực thi
  - FilterSecurityInterceptor so với AuthorizationFilter
  - AccessDecisionManager, AccessDecisionVoter và hướng chuyển sang AuthorizationManager
  - Chuyển @EnableGlobalMethodSecurity sang @EnableMethodSecurity
  - Chuyển WebSecurityConfigurerAdapter sang cấu hình bean
  - Chuyển antMatchers, mvcMatchers và RequestMatcher theo dòng phiên bản
  - WebExpressionAuthorizationManager khi chuyển cấu hình SpEL cũ
  - Thay đổi check, authorize, AuthorizationResult và cách kết hợp manager
  - Khả năng hỗ trợ @AuthorizeReturnObject, xử lý từ chối và annotation template
  - Kiểm chứng hierarchy, tiền tố role và annotation mặc định sau nâng phiên bản
  - Chuyển đổi theo giai đoạn với ma trận quyền làm chuẩn hồi quy
- level1: Thực hành tích hợp
  level2:
  - Dựng ma trận quyền cho ứng dụng quản lý tài liệu nhiều người dùng
  - Bảo vệ HTTP theo READ, WRITE, ADMIN và kiểm thử từng phương thức
  - Áp dụng role hierarchy và đối chiếu quyền ở HTTP với service
  - Kiểm tra chủ sở hữu bằng @PreAuthorize kết hợp bean chính sách
  - So sánh kiểm tra trước, kiểm tra sau và lọc danh sách
  - Triển khai PermissionEvaluator cho quyền đọc, sửa và chia sẻ
  - Triển khai ACL có kế thừa và thu hồi quyền chia sẻ
  - Cách ly dữ liệu hai tenant và kiểm thử thay đổi định danh
  - Tích hợp dịch vụ chính sách với timeout và cache có kiểm soát
  - Triển khai cùng chính sách trong WebFlux và kiểm chứng Reactor Context
  - Bảo vệ gửi, nhận thông điệp trên kênh STOMP cá nhân
  - Thu thập audit, kiểm thử hồi quy và tổng hợp bằng chứng cho từng quyết định quyền
