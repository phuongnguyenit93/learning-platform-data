menu:
- level1: Tổng quan
  level2:
  - Spring Security Test là gì và giải quyết vấn đề nào
  - Phân biệt kiểm thử xác thực, phân quyền và các cơ chế bảo vệ
  - Authentication, principal, authorities và SecurityContext trong một ca kiểm thử
  - Đối chiếu tầng HTTP, tầng phương thức và thành phần bảo mật riêng lẻ
  - Giả lập người dùng khác với chạy quy trình đăng nhập thật
  - Giả lập token khác với kiểm tra chữ ký hoặc introspection thật
  - Kiểm thử Servlet và Reactive dùng mô hình ngữ cảnh khác nhau
  - Hợp đồng cho phép, từ chối và tác dụng phụ cần quan sát
  - Vì sao mã HTTP thành công chưa đủ chứng minh cấu hình bảo mật đúng
  - Lộ trình học từ người dùng giả lập đến kiểm thử tích hợp đầu cuối
- level1: Chiến lược kiểm thử
  level2:
  - Xác định chính sách bảo mật cần chứng minh trước khi chọn công cụ
  - Phân biệt kiểm thử đơn vị, kiểm thử theo lát cắt, tích hợp và đầu cuối
  - Lập ma trận tài nguyên, hành động, danh tính và quyền
  - Ca chưa đăng nhập, đủ quyền, thiếu quyền và thông tin xác thực sai
  - Chọn giả lập ở lớp phụ thuộc mà không bỏ qua lớp đang kiểm tra
  - Phân biệt kiểm thử chính sách phân quyền với kiểm thử cơ chế xác thực
  - Kết hợp khẳng định trạng thái, nội dung, header và trạng thái bảo mật
  - Kiểm tra tác dụng phụ không xảy ra khi truy cập bị từ chối
  - Ca biên theo chủ sở hữu, tenant và trạng thái tài nguyên
  - Bằng chứng cần có để tránh kết quả đạt do cấu hình bị vô hiệu hóa
  - Giới hạn của kiểm thử ứng dụng so với đánh giá bảo mật tổng thể
- level1: Phụ thuộc và phiên bản
  level2:
  - Vai trò của spring-security-test, spring-test và bộ chạy kiểm thử
  - Khai báo phụ thuộc kiểm thử bằng Maven hoặc Gradle
  - Giữ phiên bản Spring Security Test phù hợp với runtime
  - Chọn tài liệu theo Spring Boot, Spring Framework và Spring Security
  - JUnit Jupiter, SpringExtension và TestContext Framework
  - Phân biệt static import của Servlet với Reactive
  - '@MockBean, @SpyBean và các API thay thế theo thế hệ Spring'
  - '@MockitoBean và @MockitoSpyBean khi phiên bản hỗ trợ'
  - Phụ thuộc bổ sung cho Reactor Test và kiểm thử WebFlux
  - Nhận diện cấu hình hoặc annotation cũ trước khi sao chép ví dụ
  - Không trộn mô hình SecurityFilterChain với cấu hình legacy không tương thích
- level1: Ngữ cảnh và vòng đời
  level2:
  - SecurityContextHolder và phạm vi ngữ cảnh trên luồng kiểm thử
  - TestSecurityContextHolder và vai trò trong kiểm thử web giả lập
  - WithSecurityContextTestExecutionListener thiết lập và dọn ngữ cảnh
  - Thời điểm TEST_METHOD so với TEST_EXECUTION
  - Quan hệ giữa khởi tạo danh tính với @BeforeEach
  - '@SecurityTestExecutionListeners trong phạm vi phù hợp'
  - Ngữ cảnh trống khác với AnonymousAuthenticationToken
  - Authentication.isAuthenticated khác với quyền thực hiện một hành động
  - Dọn ngữ cảnh sau test để tránh rò rỉ danh tính
  - Ngữ cảnh luồng test không tự đi qua HTTP đến máy chủ chạy thật
  - Phân biệt ngữ cảnh giả lập với dữ liệu được lưu qua nhiều request
  - Giữ vòng đời SecurityContext độc lập với dữ liệu nghiệp vụ của test
- level1: Annotation người dùng
  level2:
  - '@WithMockUser ở phương thức và ở lớp kiểm thử'
  - Tên người dùng, mật khẩu giả lập và kiểu principal mặc định
  - roles và tiền tố ROLE_ được bổ sung theo quy ước
  - authorities và tên quyền tường minh
  - Phân biệt ROLE_* với SCOPE_* trong điều kiện phân quyền
  - '@WithAnonymousUser để thay thế mặc định của lớp'
  - '@WithUserDetails và UserDetailsService thật trong context kiểm thử'
  - Chọn UserDetailsService theo tên bean khi có nhiều bean
  - Điều kiện tồn tại người dùng trước khi annotation được xử lý
  - Principal tùy chỉnh và giới hạn của @WithMockUser
  - setupBefore khi dữ liệu người dùng được tạo trong bước chuẩn bị
  - Annotation tổng hợp để dùng lại một danh tính kiểm thử
  - Giới hạn của annotation người dùng đối với đăng nhập, mật khẩu và token thật
- level1: SecurityContext tùy biến
  level2:
  - '@WithSecurityContext và hợp đồng của WithSecurityContextFactory'
  - Tạo principal có trường miền như userId hoặc tenantId
  - Tạo Authentication đúng loại mà ứng dụng mong đợi
  - Gán authorities rõ ràng theo chính sách kiểm thử
  - Tạo SecurityContext mới cho từng ca thay vì sửa đối tượng dùng chung
  - Tiêm bean cần thiết vào factory thông qua Spring
  - Tham số hóa annotation cho nhiều vai trò hoặc tenant
  - Chọn thời điểm thiết lập context phù hợp dữ liệu kiểm thử
  - Giữ factory đơn giản và tránh truy cập hệ thống bên ngoài ngoài ý muốn
  - Kiểm thử chính factory để tránh danh tính giả lập không hợp lệ
  - Phân biệt danh tính được giả lập với bước chuyển đổi danh tính ở runtime
- level1: Bảo mật phương thức
  level2:
  - Bật method security bằng cơ chế của phiên bản mục tiêu
  - Gọi Spring bean có proxy để đi qua lớp kiểm tra quyền
  - Kiểm tra @PreAuthorize với vai trò, authority và tham số phương thức
  - Kiểm tra @PostAuthorize theo đối tượng trả về
  - '@PreFilter, @PostFilter và dữ liệu được giữ hoặc loại bỏ'
  - '@Secured và @RolesAllowed khi được cấu hình hỗ trợ'
  - Biểu thức SpEL, tên tham số và tùy chọn biên dịch -parameters
  - Quyền theo chủ sở hữu, bean hỗ trợ hoặc PermissionEvaluator
  - Ngoại lệ khi thiếu Authentication hoặc không đủ quyền
  - Tự gọi phương thức trong cùng đối tượng và giới hạn của proxy
  - Không mock chính phương thức đang cần kiểm tra phân quyền
  - Xác minh nghiệp vụ chưa được thực hiện khi kiểm tra trước bị từ chối
  - Kiểm tra tác dụng phụ có thể đã xảy ra trước khi @PostAuthorize từ chối
- level1: Kiểm thử thành phần
  level2:
  - AuthenticationProvider với thông tin xác thực hợp lệ và không hợp lệ
  - AuthenticationManager và cơ chế chọn provider phù hợp
  - UserDetailsService với tài khoản tồn tại, thiếu hoặc bị vô hiệu hóa
  - PasswordEncoder và kiểm tra mật khẩu mà không so khớp chuỗi hash cố định
  - AuthorizationManager với yêu cầu được phép và bị từ chối
  - Bộ chuyển đổi Authentication hoặc authorities từ dữ liệu đầu vào
  - AuthenticationEntryPoint và phản hồi chưa xác thực
  - AccessDeniedHandler và phản hồi không đủ quyền
  - AuthenticationSuccessHandler và AuthenticationFailureHandler
  - Bộ xử lý đăng xuất và dữ liệu cần dọn
  - JwtAuthenticationConverter hoặc bộ chuyển đổi quyền tùy chỉnh
  - Đối chiếu unit test với ít nhất một ca đi qua cấu hình tích hợp thực
- level1: Thiết lập MockMvc
  level2:
  - MockMvc và giới hạn của việc không chạy máy chủ HTTP thật
  - webAppContextSetup và standaloneSetup khác nhau về phạm vi cấu hình
  - Nạp SecurityFilterChain cùng FilterChainProxy vào context kiểm thử
  - SecurityMockMvcConfigurers.springSecurity để kết nối hạ tầng kiểm thử
  - Vai trò của bộ xử lý TestSecurityContextHolder trong request
  - '@WebMvcTest và những bean bảo mật cần đưa vào lát cắt'
  - '@SpringBootTest kết hợp @AutoConfigureMockMvc'
  - '@Import cấu hình kiểm thử mà không thay chính sách cần xác minh'
  - defaultRequest và nguy cơ đặt sẵn danh tính cho mọi request
  - addFilters=false và lý do có thể làm kiểm thử phân quyền đạt sai
  - Phát hiện filter được gắn hai lần hoặc cấu hình thiếu filter
  - Xác minh một request thực sự đi qua chuỗi bảo mật mong đợi
- level1: Danh tính trên yêu cầu
  level2:
  - SecurityMockMvcRequestPostProcessors và phạm vi tác động
  - user với tên người dùng, mật khẩu giả lập và vai trò
  - user với UserDetails tùy chỉnh
  - anonymous để biểu diễn request chưa đăng nhập theo cơ chế anonymous
  - authentication với một Authentication cụ thể
  - securityContext với toàn bộ ngữ cảnh đã chuẩn bị
  - Kết hợp annotation người dùng và request post-processor có chủ ý
  - Danh tính mặc định khác với danh tính riêng của một request
  - Giữ đúng kiểu principal cho @AuthenticationPrincipal
  - Danh tính của request hiện tại khác với phiên đăng nhập đã được lưu
  - Tạo post-processor riêng cho quy ước kiểm thử ứng dụng
  - Không suy ra cơ chế xác thực đã hoạt động chỉ vì controller nhận được principal
- level1: Khẳng định kết quả
  level2:
  - SecurityMockMvcResultMatchers và kết quả bảo mật sau request
  - authenticated để kiểm tra sự hiện diện của người dùng đã xác thực
  - withUsername, withRoles và kiểm tra authorities theo API phù hợp
  - withAuthentication để kiểm tra loại token hoặc principal cụ thể
  - unauthenticated sau đăng nhập sai hoặc đăng xuất
  - HTTP 401, 403 và chuyển hướng đăng nhập theo cấu hình ứng dụng
  - Khẳng định Location, WWW-Authenticate và nội dung lỗi
  - Phân biệt người dùng vẫn xác thực nhưng bị cấm truy cập
  - Kiểm tra phản hồi không lộ dữ liệu tài nguyên bị bảo vệ
  - Xác minh trạng thái phiên, cookie hoặc repository khi cần
  - Tránh chỉ kiểm tra status mà bỏ qua nhánh nghiệp vụ thực sự chạy
- level1: Đăng nhập qua HTTP
  level2:
  - httpBasic tạo header xác thực cho request MockMvc
  - Thông tin đúng, sai và không có thông tin xác thực
  - formLogin và đường dẫn xử lý đăng nhập của ứng dụng
  - Tên trường người dùng, mật khẩu và cấu hình form tùy chỉnh
  - Mã trạng thái, chuyển hướng và kết quả Authentication sau đăng nhập
  - Tài khoản bị khóa, hết hạn hoặc bị vô hiệu hóa
  - Đăng nhập thành công khác với đăng nhập thất bại nhưng vẫn có phiên cũ
  - Request cache và quay lại tài nguyên ban đầu theo cấu hình
  - Remember-me và phạm vi cần kiểm tra bằng cookie thật
  - Kiểm tra bằng header hoặc form thực thay vì đưa sẵn người dùng vào context
  - Giữ bảo mật filter chain khi mock kho người dùng hoặc dịch vụ bên ngoài
  - Không dùng dữ liệu xác thực thật của môi trường triển khai trong bộ kiểm thử
- level1: Phân quyền HTTP
  level2:
  - Ma trận endpoint, HTTP method và danh tính
  - Tài nguyên công khai, tài nguyên cần đăng nhập và tài nguyên theo quyền
  - hasRole, hasAuthority và quy ước tiền tố
  - Quyền theo chủ sở hữu hoặc tenant trong tầng HTTP và nghiệp vụ
  - Cùng đường dẫn nhưng khác HTTP method có thể có chính sách khác nhau
  - RequestMatcher, context path và servlet path trong ca kiểm thử
  - Thứ tự rule và chính sách mặc định cho request không khớp
  - Nhiều SecurityFilterChain và lựa chọn chuỗi theo securityMatcher
  - Phát hiện endpoint lọt ra ngoài mọi chuỗi bảo mật
  - Ca đổi định danh tài nguyên để kiểm tra truy cập ngang quyền
  - Dispatch thông thường, lỗi hoặc bất đồng bộ khi ứng dụng có chính sách riêng
  - Phân biệt lỗi phân quyền với lỗi routing, binding hoặc validation
  - Xác minh không đọc hoặc ghi tài nguyên trái phép dù status đã đúng
- level1: CSRF
  level2:
  - Xác định request cần được bảo vệ theo cấu hình thực tế
  - Ca không có token, token hợp lệ và token không hợp lệ
  - csrf làm RequestPostProcessor cho MockMvc
  - Truyền CSRF token qua tham số hoặc header
  - useInvalidToken để kiểm tra nhánh từ chối trong MockMvc
  - Kết hợp CSRF với người dùng có và không có quyền
  - Phân biệt lỗi CSRF với lỗi xác thực hoặc phân quyền
  - Các endpoint được miễn CSRF và giới hạn của ngoại lệ
  - Token repository, cookie và phiên cần kiểm tra khi dùng cơ chế thật
  - Lấy token qua request thật để kiểm tra vòng đời phát và gửi lại
  - CSRF trì hoãn hoặc mã hóa token theo phiên bản và cấu hình
  - Không tắt CSRF chỉ để làm một bài kiểm thử đi qua
- level1: CORS và header bảo vệ
  level2:
  - Yêu cầu Origin và chính sách nguồn được phép
  - Preflight với OPTIONS, Access-Control-Request-Method và header yêu cầu
  - Nguồn, phương thức hoặc header không được phép
  - Access-Control-Allow-Origin và các header phản hồi cần đối chiếu
  - Credentials và điều kiện cấu hình khi dùng cookie
  - CORS cần được kiểm tra cùng thứ tự filter thực tế
  - Giới hạn của MockMvc hoặc WebTestClient so với thực thi chính sách trong trình duyệt
  - Kiểm tra header bảo vệ theo chính sách đã cấu hình
  - HSTS trong ngữ cảnh request bảo mật
  - CSP, chống nhúng khung và các tùy biến của ứng dụng
  - Đối chiếu header trên phản hồi thành công, lỗi và chuyển hướng
  - Phân biệt quyền đọc phản hồi từ trình duyệt với quyền gọi API trên máy chủ
- level1: Phiên và đăng xuất
  level2:
  - SecurityContextRepository và việc lưu ngữ cảnh giữa các request
  - Dùng MockHttpSession để kiểm tra tiếp nối phiên Servlet
  - Đăng nhập rồi truy cập tài nguyên bằng cùng phiên
  - Tách hai phiên hoặc hai người dùng trong cùng ca kiểm thử
  - Session fixation và thay đổi mã phiên theo chiến lược đã chọn
  - Chính sách tạo phiên trong ứng dụng stateful hoặc stateless
  - logout với URL, HTTP method và CSRF đúng cấu hình
  - Kiểm tra xóa Authentication, vô hiệu phiên và xử lý cookie
  - Gọi lại tài nguyên sau đăng xuất để xác minh bị từ chối
  - Remember-me sau đăng xuất hoặc sau khi phiên hết hạn
  - Số phiên đồng thời và phiên bị hết hiệu lực khi ứng dụng dùng chức năng này
  - Giới hạn của gắn sẵn SecurityContext khi cần chứng minh trạng thái đã được lưu
- level1: JWT với MockMvc
  level2:
  - jwt tạo Authentication cho kiểm thử phân quyền resource server
  - Tùy chỉnh subject, header và claims trong Jwt giả lập
  - scope, scp và ánh xạ mặc định thành authorities
  - Gán authorities tường minh cho từng ca kiểm thử
  - Giả lập JwtAuthenticationToken và principal đúng kiểu
  - Controller đọc Jwt qua @AuthenticationPrincipal
  - Kiểm tra claim nghiệp vụ như tenantId hoặc userId
  - Khi gán quyền trực tiếp làm bỏ qua bộ chuyển đổi quyền của ứng dụng
  - Gọi bộ chuyển đổi quyền thật để kiểm tra quy tắc ánh xạ riêng
  - Mock JwtDecoder để đi qua bước lấy bearer token nhưng kiểm soát kết quả giải mã
  - Kiểm tra token bị từ chối khi decoder trả lỗi
  - Phân biệt jwt helper, decoder giả lập và token được xác minh mật mã
  - Không dùng một Jwt giả lập để kết luận chữ ký hoặc hạn token đã được kiểm tra
- level1: JWT và token thực
  level2:
  - Gửi Authorization Bearer thật qua chuỗi filter
  - Dùng khóa kiểm thử độc lập để ký và kiểm tra token
  - Chữ ký sai, khóa không phù hợp và thuật toán không được chấp nhận
  - Issuer hợp lệ hoặc không khớp
  - Audience theo validator mà ứng dụng thực sự cấu hình
  - exp, nbf và khoảng lệch thời gian cho phép
  - Thay thế nguồn thời gian hoặc dữ liệu thời gian để kiểm thử ổn định
  - Claim thiếu, kiểu claim sai và token không đúng cấu trúc
  - JWK Set, lựa chọn kid và thay khóa trong hạ tầng kiểm thử
  - Tách lỗi tải khóa từ xa với lỗi giá trị token
  - Giữ bộ chuyển đổi authorities và validator thật trong kiểm thử tích hợp
  - Giới hạn cache khóa và phụ thuộc mạng trong ca xoay khóa
  - Xác minh cả phản hồi từ chối và việc nghiệp vụ không được gọi
- level1: Opaque token
  level2:
  - opaqueToken tạo BearerTokenAuthentication cho MockMvc
  - Tùy chỉnh principal, attributes và authorities
  - Kiểm tra quyền và truy cập token attributes ở controller
  - Giới hạn của helper không gọi introspection endpoint
  - Mock OpaqueTokenIntrospector để kiểm soát kết quả và lỗi
  - Gửi bearer token thật khi cần kiểm tra đường đi qua introspector
  - Phản hồi active=false, thiếu scope hoặc thiếu dữ liệu cần thiết
  - Timeout, lỗi HTTP và phản hồi introspection không hợp lệ
  - Ánh xạ attributes thành quyền theo cấu hình ứng dụng
  - Không suy ra introspection thật đã hoạt động từ một principal giả lập
