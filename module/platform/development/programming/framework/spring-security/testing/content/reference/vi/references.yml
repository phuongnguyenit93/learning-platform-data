    description: "Tổng quan tiện ích spring-security-test cho servlet, method security và MockMvc."
  - title: "Spring Security – MockMvc Setup"
    url: "https://docs.spring.io/spring-security/reference/servlet/test/mockmvc/setup.html"
    description: "Cấu hình MockMvc với springSecurity() để chạy qua security filter chain."
  - title: "Spring Security – Testing Method Security"
    url: "https://docs.spring.io/spring-security/reference/servlet/test/method.html"
    description: "Sử dụng @WithMockUser, @WithAnonymousUser và SecurityContext trong kiểm thử method security."
  - title: "Spring Security – Testing CSRF Protection"
    url: "https://docs.spring.io/spring-security/reference/servlet/test/mockmvc/csrf.html"
    description: "Tạo CSRF token hợp lệ hoặc không hợp lệ khi kiểm thử HTTP requests."
  - title: "Spring Security – Testing OAuth 2.0"
    url: "https://docs.spring.io/spring-security/reference/servlet/test/mockmvc/oauth2.html"
    description: "Kiểm thử OIDC login, OAuth2 login và JWT trong MockMvc."
  - title: "Spring Security – Reactive Test Support"
    url: "https://docs.spring.io/spring-security/reference/reactive/test/"
    description: "Hướng dẫn kiểm thử reactive method security và web security với WebTestClient."