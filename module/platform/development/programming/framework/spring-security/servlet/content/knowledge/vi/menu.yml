  - Ánh xạ LDAP group, UserDetailsContextMapper và bảo vệ kết nối LDAP
  - Pre-authentication và ranh giới tin cậy với proxy xác thực phía trước
  - RequestHeaderAuthenticationFilter và chống giả mạo header danh tính
  - 'X.509: chứng thư phía client và ánh xạ subject sang tài khoản'
  - JEE pre-authentication và danh tính do Servlet Container cung cấp
  - 'SAML2 Login: RelyingPartyRegistration, metadata và ánh xạ thuộc tính'
  - SAML2 Logout và quản lý chứng thư của hệ thống liên kết
  - 'CAS, JAAS và Kerberos: phạm vi tích hợp, dependency và điều kiện sử dụng'
- level1: Xác thực nâng cao
  level2:
