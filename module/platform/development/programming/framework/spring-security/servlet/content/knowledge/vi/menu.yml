  level2:
  - Vai trò Resource Server và phân biệt với ứng dụng đăng nhập OAuth2
  - oauth2ResourceServer và luồng tiếp nhận Bearer token
  - BearerTokenResolver và lựa chọn nguồn nhận token an toàn
  - 'JWT: chữ ký, issuer, thời hạn và kiểm tra audience'
  - JwtDecoder, JWK Set và thay đổi khóa ký
  - JwtAuthenticationConverter và JwtGrantedAuthoritiesConverter
  - Ánh xạ scope sang authority và tùy chỉnh claims về quyền
  - Opaque token và OpaqueTokenIntrospector
  - AuthenticationManagerResolver cho nhiều issuer với danh sách tin cậy
  - STATELESS, SecurityContextRepository và kiểm soát CSRF theo cách gửi token
  - Phản hồi lỗi Bearer, WWW-Authenticate và giới hạn tiết lộ thông tin
  - Giới hạn thu hồi JWT, thời gian sống token và kiểm thử token không hợp lệ
- level1: Tích hợp danh tính
