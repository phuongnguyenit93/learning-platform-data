  - Tích hợp cors với CorsConfigurationSource
  - 'CorsConfiguration: origins, methods, headers và exposedHeaders'
  - allowCredentials và giới hạn của origin ký tự đại diện
  - allowedOriginPatterns và kiểm soát tập nguồn được tin cậy
  - Kết hợp cấu hình CORS của Spring MVC với Spring Security
  - CORS cho nhiều SecurityFilterChain và các nhóm endpoint khác nhau
  - Quan hệ giữa CORS, cookie SameSite, CSRF và HTTPS
  - Chẩn đoán preflight bị từ chối, header thiếu và cấu hình lặp ở proxy
- level1: Bảo vệ HTTP
  level2:
  - Security headers mặc định và những rủi ro được giảm thiểu
  - Cache-Control và kiểm soát lưu đệm nội dung nhạy cảm
  - Strict-Transport-Security, HTTPS và điều kiện bật HSTS
  - X-Content-Type-Options và bảo vệ trước suy đoán kiểu nội dung
  - X-Frame-Options, CSP frame-ancestors và chống clickjacking
  - 'Content-Security-Policy: nguồn tài nguyên, nonce và chế độ báo cáo'
  - Referrer-Policy, Permissions-Policy và lựa chọn theo nhu cầu ứng dụng
  - HeaderWriter, DelegatingRequestMatcherHeaderWriter và header theo endpoint
  - 'Giới hạn của header bảo mật: vẫn cần mã hóa đầu ra và kiểm tra dữ liệu'
  - Yêu cầu HTTPS, cấu hình chuyển hướng và nguy cơ vòng lặp sau proxy
