  - StrictHttpFirewall so với DefaultHttpFirewall
  - HTTP method, header, hostname và các điều kiện được chấp nhận
  - Đường dẫn chứa dấu chấm phẩy, dấu gạch chéo mã hóa và ký tự bất thường
  - Sự khác biệt giữa từ chối yêu cầu nguy hiểm với trả lỗi thiếu quyền
  - RequestRejectedException và RequestRejectedHandler
  - Đánh giá tác động trước khi nới lỏng chính sách firewall
  - Kiểm thử đường dẫn bất thường qua proxy, container và bộ khớp bảo mật
