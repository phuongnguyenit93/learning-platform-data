references:
  - title: "Features"
    url: "https://docs.spring.io/spring-security/reference/features/index.html"
    description: "Tổng quan các nhóm khả năng xác thực, phân quyền và bảo vệ ứng dụng."
  - title: "Hello Spring Security"
    url: "https://docs.spring.io/spring-security/reference/servlet/getting-started.html"
    description: "Điểm bắt đầu tích hợp Spring Boot và quan sát hành vi bảo mật mặc định."
  - title: "Architecture"
    url: "https://docs.spring.io/spring-security/reference/servlet/architecture.html"
    description: "Bức tranh tích hợp Spring Security vào luồng xử lý yêu cầu Servlet."
  - title: "Servlet Authentication Architecture"
    url: "https://docs.spring.io/spring-security/reference/servlet/authentication/architecture.html"
    description: "Các khái niệm Authentication, SecurityContext và thành phần xác thực trong mô hình Servlet."
  - title: "Authorization Architecture"
    url: "https://docs.spring.io/spring-security/reference/servlet/authorization/architecture.html"
    description: "Quyền được cấp, vai trò và quyết định truy cập qua AuthorizationManager."
  - title: "Password Storage"
    url: "https://docs.spring.io/spring-security/reference/features/authentication/password-storage.html"
    description: "Vai trò PasswordEncoder và nguyên tắc lưu mật khẩu bằng hàm biến đổi một chiều."
  - title: "WebFlux Security"
    url: "https://docs.spring.io/spring-security/reference/reactive/configuration/webflux.html"
    description: "Điểm khởi đầu để phân biệt cách tích hợp bảo mật trong mô hình Reactive."
  - title: "Protection Against Exploits"
    url: "https://docs.spring.io/spring-security/reference/features/exploits/index.html"
    description: "Tổng quan các cơ chế bảo vệ trước tấn công, gồm CSRF và tiêu đề HTTP."
  - title: "CORS"
    url: "https://docs.spring.io/spring-security/reference/servlet/integrations/cors.html"
    description: "Quan hệ giữa xử lý CORS và lớp bảo mật trong ứng dụng web."