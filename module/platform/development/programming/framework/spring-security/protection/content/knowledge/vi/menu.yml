- level1: Đăng nhập và đăng xuất
  level2:
  - Login CSRF và ràng buộc hành động đăng nhập
  - Logout CSRF và lựa chọn phương thức thay đổi trạng thái
  - Token CSRF mới sau khi thay đổi trạng thái xác thực
  - Thông báo đăng nhập thất bại và giới hạn tiết lộ danh tính
  - Ranh giới của Spring Security với kiểm soát tần suất đăng nhập
  - Xác minh đích redirect và dữ liệu saved request
  - Đăng xuất phía máy chủ và dữ liệu còn lưu trên trình duyệt
  - Clear-Site-Data cùng các nhóm dữ liệu có thể yêu cầu xóa
  - Gắn HeaderWriterLogoutHandler khi phù hợp
  - Giới hạn hỗ trợ trình duyệt và yêu cầu kết nối an toàn
  - Phối hợp xóa cookie, session, cache và trạng thái frontend
  - Kiểm thử gửi lại yêu cầu đăng nhập hoặc đăng xuất từ trang cũ
- level1: WebSocket và STOMP
  level2:
  - Ranh giới bảo vệ tại HTTP handshake và tại lớp message
  - Khác biệt thực thi same-origin đối với WebSocket
  - Allowed origins trong cấu hình WebSocket hoặc SockJS
  - Kế thừa danh tính từ kết nối HTTP
  - '@EnableWebSocketSecurity và lớp kiểm tra message'
  - CSRF token trong STOMP CONNECT
  - Truyền token bằng STOMP headers
  - CsrfChannelInterceptor và thông tin token theo phiên
  - Phân biệt kiểm tra CONNECT với phân quyền SEND, SUBSCRIBE
  - SockJS fallback và nhu cầu iframe cùng origin
  - Miễn trừ CSRF lớp HTTP cho transport trong phạm vi có bảo vệ thay thế
  - Giới hạn khi dùng WebSocket thuần hoặc mô hình Reactive khác
  - Kiểm thử kết nối bị từ chối và truy cập message ngoài phạm vi
- level1: Tích hợp ứng dụng
  level2:
  - Ứng dụng render phía máy chủ và form có cookie phiên
  - SPA cùng origin qua reverse proxy
  - SPA khác origin với CORS và cookie
  - API có client chủ động gửi bearer token
  - Hệ thống cùng phục vụ trình duyệt và client máy–máy
  - Upload, download và trách nhiệm kiểm soát dữ liệu theo từng lớp
  - Đăng nhập liên kết với SameSite, redirect và các token giao thức
  - Phân biệt CSRF token với state, nonce và PKCE trong OAuth/OIDC
  - Trang nhúng, popup và tài nguyên bên thứ ba
  - Phối hợp headers giữa ứng dụng chính và endpoint quản trị
  - Thiết kế chính sách theo từng hành trình thay vì sao chép một cấu hình chung
  - Ghi lại giả thiết về client, thông tin xác thực và hạ tầng
- level1: Ranh giới bảo vệ
  level2:
  - Phạm vi tự động bảo vệ và trách nhiệm của mã ứng dụng
  - XSS và yêu cầu mã hóa đầu ra đúng ngữ cảnh
  - Nội dung HTML được phép nhập và nhu cầu làm sạch dữ liệu
  - SQL injection và truy vấn tham số hóa ở tầng dữ liệu
  - SSRF và kiểm soát đích kết nối ra ngoài
  - Path traversal khi đọc tệp và kiểm tra đường dẫn nghiệp vụ
  - Ràng buộc kích thước request, multipart và giới hạn tài nguyên
  - Rate limiting ở ứng dụng, gateway hoặc hạ tầng
  - Trình phân tích dữ liệu, deserialization và thư viện phụ thuộc
  - Phân quyền đối tượng tại service để bảo vệ dữ liệu nghiệp vụ
  - Giới hạn của CORS hoặc response header với client ngoài trình duyệt
  - Đặt từng lớp bảo vệ vào đúng mô hình nguy cơ của ứng dụng
- level1: Kiểm thử Servlet
  level2:
  - Tích hợp spring-security-test với MockMvc
  - Đảm bảo security filter chain thực sự tham gia bài kiểm thử
  - Phân biệt giả lập danh tính với cung cấp CSRF token
  - csrf() để gửi token hợp lệ trong tham số
  - csrf().asHeader() cho yêu cầu dùng header
  - csrf().useInvalidToken() cho ca dữ liệu token sai
  - Kiểm tra yêu cầu thiếu token và phương thức an toàn
  - Kiểm tra matcher miễn trừ cùng các endpoint vẫn phải bảo vệ
  - Kiểm tra header trên phản hồi thành công và phản hồi lỗi
  - Kiểm tra CORS preflight và origin bị từ chối
  - Kiểm tra HTTP redirect cùng HSTS của yêu cầu secure
  - Kiểm tra firewall và hành vi từ chối trước controller
  - Kiểm tra đổi session ID và dữ liệu sau đăng xuất
  - Giới hạn của kiểm thử giả lập với hành vi trình duyệt hoặc container
- level1: Kiểm thử Reactive
  level2:
  - Tích hợp spring-security-test với WebTestClient
  - Cấu hình security web filters trong bài kiểm thử
  - SecurityMockServerConfigurers.csrf() và token hợp lệ
  - Kiểm tra yêu cầu thiếu token hoặc giá trị không đúng
  - Kiểm tra CSRF repository dùng WebSession hoặc cookie
  - Kiểm tra việc lấy Mono<CsrfToken> và vòng đời session
  - Kiểm tra CORS preflight qua CorsWebFilter
  - Kiểm tra header cùng redirect trên ứng dụng WebFlux
  - Kiểm tra StrictServerWebExchangeFirewall khi được hỗ trợ
  - Đối chiếu filter giả lập với HTTP server thực
  - Giữ riêng cấu hình, dữ liệu và danh tính giữa các ca kiểm thử
- level1: Kiểm thử trình duyệt
  level2:
  - Xây dựng các trang thử ở cùng origin và khác origin
  - Quan sát cookie, request header và response header
  - Kiểm tra gửi form liên trang trong môi trường kiểm thử riêng
  - Kiểm tra CORS chặn đọc phản hồi cùng hành vi gửi yêu cầu
  - Kiểm tra cookie SameSite trên các hành trình thực tế
  - Kiểm tra iframe được phép và bị chặn
  - Kiểm tra script hợp lệ, script bị CSP chặn và báo cáo vi phạm
  - Kiểm tra nonce thay đổi giữa các phản hồi
  - Kiểm tra popup, tài nguyên nhúng và cô lập cross-origin
  - Kiểm tra đăng xuất, Back, Refresh và phiên hết hạn
  - Kiểm tra proxy, CDN cùng header mà trình duyệt thực sự nhận
  - Chọn bằng chứng gồm phản hồi, console và kết quả hành vi
- level1: Chẩn đoán lỗi
  level2:
  - Phân biệt 401, 403 và lỗi từ chối yêu cầu ở firewall
  - Tìm security chain thực sự xử lý endpoint
  - CSRF token thiếu do chưa được tạo hoặc chưa tải
  - Token không khớp do session, cookie hoặc cơ chế che giá trị
  - Token cũ sau đăng nhập, đăng xuất hoặc đổi phiên
  - Cookie không được gửi do Secure, SameSite, Domain hoặc Path
  - Preflight bị chặn trước khi xử lý CORS
  - CORS header trùng hoặc origin cấu hình không khớp
  - Header bị thiếu trên tài nguyên đã bỏ qua security chain
  - HSTS không xuất hiện do nhận diện sai HTTPS sau proxy
  - CSP làm hỏng chức năng hoặc nonce không khớp template
  - Firewall từ chối đường dẫn hoặc header hợp lệ của client
  - Thu thập log cần thiết mà không ghi token hay nội dung nhạy cảm
- level1: Vận hành và giám sát
  level2:
  - Quản lý cấu hình bảo vệ theo môi trường và phiên bản
  - Đối chiếu header thực tế sau mỗi lần triển khai
  - Chuyển CSP từ Report-Only sang thực thi có kiểm soát
  - Theo dõi lỗi CSRF và phân biệt lỗi tích hợp với yêu cầu bất thường
  - Theo dõi request bị firewall từ chối
  - Giới hạn dữ liệu lưu trong báo cáo CSP và log bảo mật
  - Phối hợp chính sách ứng dụng với CDN, proxy và gateway
  - Đánh giá thay đổi domain, subdomain và hạ tầng TLS
  - Triển khai chính sách HSTS theo phạm vi quản lý
  - Quản lý ngoại lệ theo endpoint và rà lại khi kiến trúc thay đổi
  - Kiểm thử hồi quy sau thay đổi frontend hoặc thư viện bên thứ ba
  - Duy trì cấu hình có thể giải thích bằng mô hình nguy cơ và bằng chứng
- level1: Nâng cấp và tương thích
  level2:
  - Đối chiếu mặc định bảo vệ giữa các dòng Spring Security
  - Chuyển cấu hình kế thừa cũ sang security chain và Lambda DSL
  - Thay đổi request matcher và ngữ nghĩa đường dẫn
  - Deferred token cùng cơ chế XOR trong các dòng hiện hành
  - Nâng cấu hình SPA theo API có trong phiên bản đích
  - Rà lại firewall Reactive và các tùy chọn mới
  - Đối chiếu API xử lý proxy của Spring Boot và Spring Framework
  - X-XSS-Protection cùng vai trò lịch sử của bộ lọc XSS trên trình duyệt
  - HPKP, Feature-Policy và các chính sách trình duyệt đã thay đổi
  - Chuyển cấu hình WebSocket cũ sang mô hình được hỗ trợ
  - Kiểm tra khả năng hỗ trợ header trên các trình duyệt mục tiêu
  - Lập kiểm thử hồi quy cho token, header, cookie và hành trình đăng nhập
- level1: Thực hành tổng hợp
  level2:
  - Thiết kế bảo vệ cho ứng dụng MVC có form và cookie phiên
  - Thiết kế CSRF cho SPA có bước đăng nhập và đăng xuất
  - Tách khu vực API bearer token khỏi khu vực dùng cookie
  - Cấu hình CORS theo origin của từng môi trường
  - Bảo vệ ứng dụng WebFlux với CSRF và header tương ứng
  - Thiết kế CSP cho trang dùng script nội bộ và dịch vụ bên ngoài
  - Cho phép nhúng một màn hình trong phạm vi đã xác định
  - Triển khai HTTPS qua reverse proxy và xác minh HSTS
  - Kiểm tra một ngoại lệ firewall bằng ca hợp lệ cùng ca bị từ chối
  - Bảo vệ STOMP CONNECT và kiểm tra message trên kết nối
  - Tái hiện phiên hết hạn cùng luồng lấy CSRF token mới
  - Hoàn thiện bộ kiểm thử giả lập, HTTP thực và trình duyệt
  - Đánh giá kết quả bằng mô hình nguy cơ, cấu hình và bằng chứng hành vi
