menu:
- level1: Tổng quan
  level2:
  - Project Reactor Core là gì và bài toán xử lý dữ liệu theo luồng
  - Vì sao cần lập trình phản ứng khi ứng dụng có nhiều tác vụ I/O
  - Phân biệt đồng bộ, bất đồng bộ, chặn và không chặn
  - Quan hệ giữa lập trình phản ứng, Reactive Streams và Project Reactor
  - Vai trò của Mono, Flux, toán tử, Scheduler và Context
  - Mô hình dữ liệu đi xuôi và nhu cầu truyền ngược trong chuỗi xử lý
  - Phân biệt chuỗi phản ứng với Java Stream và CompletableFuture
  - Phân biệt xử lý đồng thời với xử lý song song
  - Quan hệ của Reactor Core với Reactor Netty, Spring WebFlux và reactor-test
  - Khi nào nên dùng Reactor và khi nào cách xử lý tuần tự đã phù hợp
  - Kiến thức tiên quyết và lộ trình học từ mô hình tín hiệu đến thiết kế ứng dụng
- level1: Reactive Streams
  level2:
  - Hợp đồng giữa Publisher, Subscriber, Subscription và Processor
  - Trình tự onSubscribe, onNext và tín hiệu kết thúc
  - Ý nghĩa của onComplete, onError và tính duy nhất của tín hiệu kết thúc
  - Yêu cầu dữ liệu bằng request(n) và cơ chế điều tiết ngược (backpressure)
  - Nhu cầu hữu hạn, nhu cầu không giới hạn và quy tắc không phát vượt nhu cầu
  - Hủy đăng ký bằng cancel và giới hạn của việc hủy tác vụ đang chạy
  - Quy tắc không phát giá trị null và cách biểu diễn dữ liệu vắng mặt
  - Tuần tự hóa tín hiệu và an toàn khi nguồn phát từ nhiều luồng thực thi
  - Phân biệt giao thức Reactive Streams với mô hình Java Flow
  - Giới hạn bảo đảm của giao thức đối với bộ nhớ, tải hệ thống và tác động phụ
- level1: Thiết lập
  level2:
  - Khai báo reactor-core trong Gradle và Maven
  - Quản lý phiên bản đồng bộ bằng Reactor BOM
  - Sử dụng phiên bản Reactor do Spring Boot quản lý
  - Kiểm tra yêu cầu JDK và khác biệt API giữa các dòng phiên bản
  - Chuẩn bị JUnit Jupiter và reactor-test cho ví dụ thực hành
  - Tổ chức chương trình Java thuần sử dụng Mono và Flux
  - Viết chuỗi xử lý đầu tiên và quan sát kết quả
  - Đọc Javadoc, sơ đồ marble và bảng lựa chọn toán tử
  - Nhận diện API đã lỗi thời khi đọc ví dụ hoặc tài liệu cũ
- level1: Mono và Flux
  level2:
  - 'Mono<T>: không hoặc một giá trị rồi kết thúc'
  - 'Flux<T>: từ không đến nhiều giá trị, hữu hạn hoặc vô hạn'
  - Mono<Void> và hợp đồng chỉ biểu diễn việc hoàn thành
  - Phân biệt Mono<List<T>> với Flux<T>
  - Chuỗi rỗng, chuỗi lỗi và chuỗi không bao giờ kết thúc
  - Phân biệt kiểu Publisher khai báo với số lượng tín hiệu thực tế
  - Chuyển Mono thành Flux và Flux thành Mono theo đúng ngữ nghĩa
  - Ý nghĩa của next, single, singleOrEmpty và last
  - Kiểu generic, Tuple và mô hình dữ liệu trong chuỗi phản ứng
  - Tính bất biến của chuỗi toán tử và lỗi bỏ quên giá trị trả về
- level1: Đăng ký và thực thi
  level2:
  - Phân biệt giai đoạn lắp ráp, đăng ký và phát tín hiệu
  - Vì sao mô tả chuỗi chưa đồng nghĩa với thực hiện công việc
  - Các biến thể subscribe và trách nhiệm xử lý dữ liệu, lỗi, kết thúc
  - Disposable được trả về khi subscribe và cách quản lý vòng đời
  - BaseSubscriber và các điểm mở rộng hookOnSubscribe, hookOnNext, hookFinally
  - Chủ động điều khiển request và cancel trong BaseSubscriber
  - Nhiều lượt đăng ký và việc thực thi lặp lại nguồn
  - Phân biệt trạng thái theo từng đăng ký với trạng thái dùng chung
  - Vì sao subscribe lồng nhau dễ làm mất luồng lỗi và quyền hủy
  - Ai sở hữu việc subscribe ở biên ứng dụng và trong framework
- level1: Tạo nguồn cơ bản
  level2:
  - Tạo giá trị biết trước bằng just và thời điểm giá trị được tính
  - Biểu diễn giá trị có thể vắng mặt bằng justOrEmpty
  - Tạo Flux từ mảng, Iterable và khoảng số bằng range
  - Tạo Flux từ Java Stream và cung cấp Stream mới theo từng đăng ký
  - Tạo nguồn empty, error và never
  - Trì hoãn tính giá trị bằng fromSupplier và fromCallable
  - Biểu diễn tác vụ không có giá trị trả về bằng fromRunnable
  - Tạo lại Publisher theo từng đăng ký bằng defer
  - Phân biệt just, fromSupplier, fromCallable và defer
  - Chuyển Publisher tương thích sang Mono hoặc Flux bằng from
  - Tạo nguồn lỗi trễ bằng Supplier<Throwable>
- level1: Tạo nguồn tùy chỉnh
  level2:
  - Sinh dữ liệu đồng bộ từng bước bằng Flux.generate
  - Quản lý trạng thái theo đăng ký và dọn trạng thái trong generate
  - SynchronousSink và giới hạn số lần next trong một lượt sinh
  - Chuyển API callback hoặc listener sang Flux.create
  - FluxSink và các tín hiệu next, error, complete
  - Chọn Flux.push khi nguồn chỉ phát từ một luồng thực thi
  - Phân biệt create với push và với việc tự tạo luồng thực thi
  - Phản hồi nhu cầu bằng onRequest và kiểm tra trạng thái hủy
  - Dọn listener bằng onCancel và onDispose
  - Chọn OverflowStrategy khi nối nguồn không hỗ trợ backpressure
  - Tạo Mono từ callback bằng Mono.create và MonoSink
  - Tránh vòng lặp chặn và phát tín hiệu sau khi nguồn đã kết thúc
- level1: Biến đổi đồng bộ
  level2:
  - Biến đổi từng phần tử bằng map
  - Chuyển kiểu bằng cast và lọc theo kiểu bằng ofType
  - Gắn chỉ số bằng index và xử lý dữ liệu theo vị trí
  - Kết hợp lọc, biến đổi và kết thúc sớm bằng handle
  - Tránh trả về null trong map và sử dụng mapNotNull khi phù hợp
  - Thêm dữ liệu đầu hoặc cuối bằng startWith và concatWithValues
  - Tách và biểu diễn tín hiệu bằng materialize
  - Khôi phục chuỗi tín hiệu bằng dematerialize
  - Mở rộng dữ liệu dạng cây hoặc đồ thị bằng expand và expandDeep
  - Chọn biến đổi thuần và tách tác động phụ khỏi hàm ánh xạ
- level1: Biến đổi bất đồng bộ
  level2:
  - Vì sao gọi hàm trả về Publisher cần phép làm phẳng
  - Phân biệt map với flatMap khi kết quả là Mono hoặc Flux
  - Mono.flatMap và Mono.flatMapMany theo số lượng kết quả
  - Flux.flatMap và khả năng xen kẽ kết quả giữa các nguồn con
  - Giữ thứ tự bằng concatMap
  - Đăng ký đồng thời nhưng phát đúng thứ tự bằng flatMapSequential
  - So sánh flatMap, concatMap và flatMapSequential
  - Điều khiển concurrency và prefetch cho các nguồn con
  - Chuyển dữ liệu Iterable thành nhiều phần tử bằng flatMapIterable
  - Thay thế nguồn con cũ bằng switchMap
  - Phân biệt hủy nguồn con với hoàn tác tác động phụ đã thực hiện
  - Phạm vi xử lý lỗi ở nguồn cha và bên trong từng nguồn con
- level1: Lọc và lựa chọn
  level2:
  - Lọc đồng bộ bằng filter và bất đồng bộ bằng filterWhen
  - Loại phần tử trùng bằng distinct và distinctUntilChanged
  - Lấy hoặc bỏ số phần tử bằng take và skip
  - Lấy hoặc bỏ các phần tử cuối bằng takeLast và skipLast
  - Lấy hoặc bỏ theo điều kiện bằng takeWhile và skipWhile
  - Điều khiển điểm dừng bằng takeUntil và takeUntilOther
  - Bỏ dữ liệu theo nguồn kích hoạt bằng skipUntilOther
  - Chọn phần tử theo vị trí bằng elementAt
  - Lấy một phần tử bằng next, single và last với hợp đồng tương ứng
  - Lấy mẫu sự kiện bằng sample và sampleTimeout
  - Giữ sự kiện đầu mỗi khoảng thời gian bằng sampleFirst
  - Nhận diện dữ liệu bị loại, việc hủy nguồn và chi phí giữ trạng thái khi lọc
- level1: Phối hợp nhiều nguồn
  level2:
  - Nối tuần tự nhiều nguồn bằng concat và concatWith
  - Trộn dữ liệu theo thời điểm phát bằng merge và mergeWith
  - Đăng ký sớm nhưng giữ thứ tự nguồn bằng mergeSequential
  - Ghép theo vị trí bằng zip và zipWith
  - Kết hợp giá trị mới nhất bằng combineLatest
  - Phân biệt zip với combineLatest về thời điểm phát và dữ liệu được giữ
  - Kết hợp nguồn chính với giá trị phụ mới nhất bằng withLatestFrom
  - Kết hợp Mono phụ thuộc giá trị bằng zipWhen
  - Chọn nguồn thắng cuộc bằng firstWithSignal và firstWithValue
  - Phối hợp nguồn chứa nguồn bằng switchOnNext
  - Phối hợp tác vụ qua tín hiệu kết thúc bằng when, whenDelayError và and
  - Kết hợp theo khoảng tồn tại của phần tử bằng join và groupJoin
  - Ảnh hưởng của nguồn rỗng, lỗi hoặc vô hạn đến kết quả phối hợp
  - Trì hoãn lỗi bằng các biến thể DelayError khi cần thu nhận kết quả còn lại
- level1: Tổng hợp dữ liệu
  level2:
  - Thu toàn bộ phần tử bằng collectList và giới hạn bộ nhớ
  - Thu dữ liệu có sắp xếp bằng collectSortedList và sort
  - Tạo ánh xạ bằng collectMap và collectMultimap
  - Tùy biến bộ chứa bằng collect và Java Collector
  - Tính kết quả cuối bằng reduce và reduceWith
  - Phát kết quả trung gian bằng scan và scanWith
  - Đếm phần tử bằng count
  - Kiểm tra điều kiện bằng all, any, hasElement và hasElements
  - So sánh hai chuỗi bằng sequenceEqual
  - Xử lý đầu vào rỗng và chọn giá trị khởi tạo khi tổng hợp
  - Vì sao không thể thu toàn bộ một nguồn vô hạn vào bộ nhớ
- level1: Chia lô và phân nhóm
  level2:
  - Phân biệt buffer, window và groupBy theo kiểu dữ liệu đầu ra
  - Gom theo số lượng bằng buffer
  - Tạo các lô chồng lấn hoặc cách quãng bằng tham số skip
  - Gom theo thời gian và số lượng bằng bufferTimeout
  - Gom theo điều kiện bằng bufferUntil và bufferWhile
  - Gom theo tín hiệu mở hoặc đóng bằng bufferWhen
  - Chia thành các Flux con bằng window
  - Chọn biến thể window theo kích thước, thời gian hoặc điều kiện
  - Phân nhóm theo khóa bằng groupBy và tiêu thụ GroupedFlux
  - Nguy cơ treo hoặc tăng bộ nhớ khi số nhóm lớn và mức tiêu thụ không đủ
  - Quản lý nhu cầu, lỗi và hủy cho luồng cha cùng các luồng con
- level1: Rỗng và hoàn tất
  level2:
  - Biểu diễn không có kết quả mà không dùng null
  - Cấp giá trị mặc định bằng defaultIfEmpty
  - Chuyển sang nguồn dự phòng bằng switchIfEmpty
  - Dùng defer để trì hoãn công việc trong nhánh dự phòng
  - Bỏ dữ liệu và chỉ quan tâm kết thúc bằng ignoreElements
  - Chuyển tiếp sau hoàn tất bằng then, thenReturn và thenMany
  - Chờ tác vụ chỉ có tín hiệu kết thúc bằng thenEmpty
  - Giữ giá trị gốc và chờ công việc phụ bằng delayUntil
  - Vì sao zip hoặc zipWhen có thể không gọi hàm ghép khi nguồn rỗng
  - Chọn Optional hoặc singleOptional khi cần biểu diễn vắng mặt như một giá trị
- level1: Xử lý lỗi
  level2:
  - onError kết thúc nguồn và ý nghĩa của việc thay thế nguồn khi phục hồi
  - Phân biệt ngoại lệ ném khi lắp ráp với lỗi được phát trong chuỗi
  - Trả giá trị dự phòng bằng onErrorReturn
  - Chuyển nguồn khi lỗi bằng onErrorResume
  - Biến lỗi thành hoàn tất bằng onErrorComplete
  - Chuyển đổi ngoại lệ bằng onErrorMap và bảo toàn nguyên nhân
  - Quan sát lỗi bằng doOnError mà không thay đổi kết quả
  - Giới hạn phục hồi theo loại lỗi hoặc Predicate
  - Đặt xử lý lỗi bên trong flatMap để cô lập lỗi từng phần tử
  - Giới hạn và tác động lan truyền của onErrorContinue cùng onErrorStop
  - Phân biệt lỗi nghiệp vụ, lỗi hạ tầng và lỗi lập trình để chọn chính sách
  - Nhận diện lỗi nghiêm trọng và xử lý ngoại lệ qua tiện ích Exceptions
- level1: Thử lại và lặp lại
  level2:
  - Retry là đăng ký lại nguồn sau lỗi, không tiếp tục từ phần tử lỗi
  - Thử lại có giới hạn bằng retry
  - Mô tả chính sách bằng retryWhen và Retry
  - So sánh Retry.max, Retry.fixedDelay và Retry.backoff
  - Giới hạn số lần, lọc ngoại lệ và xử lý khi cạn lượt thử
  - Điều chỉnh backoff, jitter và Scheduler cho việc thử lại
  - Quan sát RetrySignal và các điểm mở rộng doBeforeRetry, doAfterRetry
  - Tạo lại công việc bằng defer để mỗi lần đăng ký thực hiện lần thử mới
  - Lặp sau hoàn tất bằng repeat và repeatWhen
  - Thực hiện lại khi Mono rỗng bằng repeatWhenEmpty
  - Phối hợp timeout với retry và xác định giới hạn cho từng lần hoặc toàn tác vụ
  - Tính lũy đẳng, tác động phụ lặp lại và hủy trong lúc đợi lần thử kế tiếp
- level1: Backpressure
  level2:
  - Phân biệt tốc độ nguồn, tốc độ tiêu thụ và nhu cầu đang chờ
  - Request được truyền và biến đổi qua chuỗi toán tử như thế nào
  - Điều khiển nhu cầu thủ công bằng BaseSubscriber
  - Request không giới hạn từ các cách subscribe thông dụng
  - Prefetch và cơ chế yêu cầu bổ sung của toán tử
  - Điều tiết request theo lô bằng limitRate
  - Giới hạn tổng nhu cầu bằng take(n, true) và phân biệt với điều tiết request theo lô
  - Đệm dữ liệu bằng onBackpressureBuffer và lựa chọn giới hạn dung lượng
  - Loại dữ liệu bằng onBackpressureDrop
  - Chỉ giữ giá trị mới nhất bằng onBackpressureLatest
  - Báo lỗi khi quá tải bằng onBackpressureError
  - Chọn chính sách khi nguồn ngoài không thể giảm tốc
  - Phân biệt backpressure với giới hạn mức đồng thời và giới hạn tần suất
  - Chi phí bộ nhớ, độ trễ và quan sát dữ liệu bị loại khi quá tải
- level1: Vòng đời và tác động phụ
  level2:
  - Quan sát dữ liệu bằng doOnNext mà không thay thế phép biến đổi
  - Quan sát đăng ký và nhu cầu bằng doOnSubscribe và doOnRequest
  - Phân biệt Mono.doOnSuccess với doOnNext khi Mono kết thúc rỗng
  - Quan sát hoàn tất và lỗi bằng doOnComplete và doOnError
  - Phân biệt doOnTerminate với doAfterTerminate
  - Xử lý hủy bằng doOnCancel
  - Dọn dẹp theo SignalType bằng doFinally
  - Quan sát tổng hợp tín hiệu bằng doOnEach
  - Thứ tự callback khi lắp nhiều toán tử quan sát trong chuỗi
  - Quản lý nhóm Disposable và thay thế tác vụ bằng Disposables
  - Giới hạn của cancel với tác vụ chặn và công việc bên ngoài Reactor
  - Phân biệt kết thúc luồng, hủy đăng ký và hoàn tác tác động phụ
- level1: Scheduler
  level2:
  - Scheduler là bộ lập lịch và đồng hồ cho tác vụ phản ứng
  - Phân biệt Scheduler, Worker, Thread và ExecutorService
  - Thực thi ngay trên luồng hiện tại bằng Schedulers.immediate
  - Chọn Schedulers.single cho công việc cần một luồng dùng chung
  - Chọn Schedulers.parallel cho công việc tính toán
  - Chọn Schedulers.boundedElastic cho tác vụ chặn cần cô lập
  - Giới hạn số luồng, hàng đợi và thời gian chờ trên boundedElastic
  - Chế độ boundedElastic dùng virtual thread trên Java 21 và điều kiện kích hoạt
  - Tạo Scheduler riêng bằng newSingle, newParallel và newBoundedElastic
  - Tích hợp ExecutorService bằng Schedulers.fromExecutorService
  - Phân biệt Scheduler dùng chung với Scheduler do ứng dụng sở hữu
  - Dọn Worker, Scheduler và quản lý vòng đời tài nguyên lập lịch
- level1: Chuyển luồng thực thi
  level2:
  - Luồng thực thi mặc định khi chưa chỉ định Scheduler
  - publishOn chuyển nơi xử lý tín hiệu cho phần chuỗi phía sau
  - subscribeOn điều khiển nơi đăng ký và tương tác với nguồn
  - So sánh publishOn với subscribeOn theo hướng truyền tín hiệu
  - Ảnh hưởng của vị trí publishOn trong chuỗi
