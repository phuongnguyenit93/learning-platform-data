    description: "Cách sinh truy vấn từ tên phương thức, query lookup và giới hạn theo data store."
  - title: "Spring Data Commons — Projections"
    url: "https://docs.spring.io/spring-data/commons/reference/repositories/projections.html"
    description: "Interface projection, DTO, nested/dynamic projection và xử lý null."
  - title: "Spring Data Commons — Query by Example"
    url: "https://docs.spring.io/spring-data/commons/reference/query-by-example.html"
    description: "Probe, Example, ExampleMatcher và khả năng lọc động."
  - title: "Spring Data Commons — Auditing"
    url: "https://docs.spring.io/spring-data/commons/reference/auditing.html"
