references:
  - title: "Spring Data Redis – Overview"
    url: "https://docs.spring.io/spring-data/redis/reference/redis.html"
    description: "Tổng quan template, repository, caching, messaging, transactions và pipelining."
  - title: "Spring Data Redis – Drivers"
    url: "https://docs.spring.io/spring-data/redis/reference/redis/drivers.html"
    description: "RedisConnectionFactory, Lettuce và kết nối Redis trong Spring."
  - title: "Spring Data Redis – RedisTemplate"
    url: "https://docs.spring.io/spring-data/redis/reference/redis/template.html"
    description: "RedisTemplate, StringRedisTemplate, ReactiveRedisTemplate và chiến lược serialization."
  - title: "Spring Data Redis – Repositories"
    url: "https://docs.spring.io/spring-data/redis/reference/repositories.html"
    description: "Ánh xạ Redis Hash qua repository, CRUD và giới hạn khi dùng transaction."
  - title: "Spring Data Redis – Time To Live"
    url: "https://docs.spring.io/spring-data/redis/reference/redis/redis-repositories/expirations.html"
    description: "TTL, @TimeToLive, keyspace notifications và sự kiện hết hạn."
  - title: "Spring Data Redis – Redis Cache"
    url: "https://docs.spring.io/spring-data/redis/reference/redis/redis-cache.html"
    description: "RedisCacheManager, TTL, key prefixes và serializers cho cache."
  - title: "Spring Data Redis – Pub/Sub Messaging"
    url: "https://docs.spring.io/spring-data/redis/reference/redis/pubsub.html"
    description: "Cơ chế publish/subscribe và RedisMessageListenerContainer."
  - title: "Spring Data Redis – Redis Streams"
    url: "https://docs.spring.io/spring-data/redis/reference/redis/redis-streams.html"
    description: "StreamOperations, listener containers và khác biệt với Pub/Sub."
  - title: "Spring Data Redis – Transactions"
    url: "https://docs.spring.io/spring-data/redis/reference/redis/transactions.html"
    description: "MULTI/EXEC, SessionCallback và transaction support trong RedisTemplate."
  - title: "Spring Data Redis – Pipelining"
    url: "https://docs.spring.io/spring-data/redis/reference/redis/pipelining.html"
    description: "executePipelined, giảm round-trip và giới hạn theo kết nối/cluster."