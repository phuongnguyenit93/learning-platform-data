references:
  - title: "Spring Data LDAP — Reference"
    url: "https://docs.spring.io/spring-data/ldap/reference/"
    description: "Tổng quan chính thức về repository LDAP và mô hình lập trình Spring Data."
  - title: "Spring Data LDAP — Configuration"
    url: "https://docs.spring.io/spring-data/ldap/reference/ldap/configuration.html"
    description: "Cấu hình ContextSource, LdapTemplate, @EnableLdapRepositories và những giới hạn repository."
  - title: "Spring Data LDAP — Usage"
    url: "https://docs.spring.io/spring-data/ldap/reference/ldap/usage.html"
    description: "Ví dụ ánh xạ entity với @Entry, DN, @Attribute và thao tác qua repository."
  - title: "Spring Data LDAP — Query Methods"
    url: "https://docs.spring.io/spring-data/ldap/reference/ldap/query-methods.html"
    description: "Finder methods, @Query, tham số và mã hóa dữ liệu đầu vào của LDAP filter."
  - title: "Spring LDAP — Object-Directory Mapping"
    url: "https://docs.spring.io/spring-ldap/reference/odm.html"
    description: "Giải thích chi tiết ODM annotations và cách ánh xạ entry LDAP sang Java."
  - title: "Spring LDAP — Testing"
    url: "https://docs.spring.io/spring-ldap/reference/testing.html"
    description: "Hướng dẫn kiểm thử với LDAP nhúng và dữ liệu thư mục độc lập."
