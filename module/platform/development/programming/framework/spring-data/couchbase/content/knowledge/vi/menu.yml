  level2:
  - ReactiveCouchbaseRepository và ReactiveCouchbaseTemplate
  - Mono, Flux và vòng đời đăng ký thực hiện thao tác
  - Tạo, đọc, sửa và xóa bằng chuỗi phản ứng
  - Truy vấn dẫn xuất và @Query với kiểu trả về phản ứng
  - Phối hợp nhiều thao tác bằng flatMap hoặc concatMap
  - Giới hạn số thao tác đồng thời để bảo vệ cluster
  - Áp lực ngược và giới hạn tại ranh giới SDK hoặc truy vấn
  - Phục hồi lỗi, thử lại và thời gian chờ trong chuỗi
  - Hủy đăng ký và khả năng hủy tác vụ đang thực hiện
  - Giao dịch phản ứng và truyền ngữ cảnh đúng vòng đời
  - Auditing phản ứng và xác định người thao tác từ ngữ cảnh
  - Tích hợp WebFlux và cô lập thư viện có thao tác chặn
- level1: Quan hệ và JOIN
  level2:
  - Nhúng tài liệu, tham chiếu khóa và phi chuẩn hóa theo nhu cầu
  - Quan hệ một–một, một–nhiều và nhiều–nhiều
  - JOIN, NEST và UNNEST trong truy vấn SQL++
  - ANSI JOIN giữa các collection theo trường dữ liệu
  - '@N1qlJoin và khai báo điều kiện liên kết entity'
  - Phạm vi tải liên kết và các tùy chọn phụ thuộc phiên bản
  - Chỉ mục phục vụ điều kiện JOIN
  - Chi phí nhiều truy vấn và phát hiện kiểu truy cập N+1
  - Dữ liệu liên kết thiếu, đã hết hạn hoặc đã bị xóa
  - Ranh giới toàn vẹn tham chiếu do ứng dụng chịu trách nhiệm
- level1: Vòng đời và auditing
  level2:
  - Các giai đoạn chuyển đổi, đọc và ghi tài liệu
  - Sự kiện ánh xạ và callback theo API của phiên bản sử dụng
  - Tách chuẩn hóa dữ liệu khỏi tác dụng phụ trong callback
  - Kiểm tra dữ liệu bằng Bean Validation tại ranh giới phù hợp
  - '@CreatedDate, @LastModifiedDate, @CreatedBy và @LastModifiedBy'
  - Kích hoạt @EnableCouchbaseAuditing và cung cấp AuditorAware
  - Vai trò trường @Version khi phân biệt tạo mới và cập nhật
  - Cấu hình thời gian và nguồn xác định người thao tác
  - EnableReactiveCouchbaseAuditing và ReactiveAuditorAware
  - Các đường ghi trực tiếp qua SDK hoặc truy vấn cần kiểm tra auditing
  - Sự kiện nghiệp vụ, sự kiện lưu trữ và độ tin cậy sau commit
- level1: Bộ nhớ đệm
  level2:
  - Phân biệt lưu trữ tài liệu và Spring Cache abstraction
  - CouchbaseCacheManager và kích hoạt @EnableCaching
  - '@Cacheable, @CachePut và @CacheEvict'
  - Thiết kế cache key, tên cache và tránh va chạm
  - Cấu hình thời hạn riêng cho từng cache
  - Định dạng giá trị cache và tương thích giữa phiên bản ứng dụng
  - Dữ liệu null, kết quả không tồn tại và chính sách lưu đệm
  - Vô hiệu hóa cache sau cập nhật và ranh giới giao dịch
  - Nhiều yêu cầu cùng nạp một khóa và nguy cơ cache stampede
  - Quan sát tỉ lệ trúng cache và kiểm thử dữ liệu cũ
- level1: Mở rộng bằng SDK
  level2:
  - Tiêu chí dùng SDK trực tiếp khi Repository hoặc Template chưa đáp ứng
  - Dùng chung Cluster, Bucket và Collection do Spring quản lý
  - Bộ đếm nguyên tử theo khóa và phạm vi sử dụng
  - Đọc từ bản sao và đánh đổi về độ mới dữ liệu
  - 'Full-Text Search: chỉ mục tìm kiếm và truy vấn qua SDK'
  - 'Analytics: phân tích dữ liệu và phân biệt với truy vấn phục vụ giao dịch'
  - Metadata, cảnh báo và số liệu của kết quả truy vấn
  - Thao tác nhiều tài liệu với giới hạn đồng thời
  - Chuyển kết quả SDK sang mô hình dữ liệu ứng dụng
  - Giữ nhất quán quy tắc mã hóa, TTL, CAS và ánh xạ khi kết hợp các API
- level1: Bảo mật
  level2:
  - Phân quyền RBAC theo bucket, scope, collection và dịch vụ
  - Tách tài khoản ứng dụng khỏi tài khoản quản trị
  - Quản lý mật khẩu, chuỗi kết nối và chứng chỉ bằng cấu hình bí mật
  - Kết nối mã hóa TLS và xác thực chứng chỉ
  - Ràng buộc tham số SQL++ và kiểm soát trường sắp xếp động
  - Xác minh tenant và ngăn truy cập nhầm collection
  - Field Level Encryption và điều kiện phụ thuộc cần bổ sung
  - '@Encrypted, CryptoManager và vòng đời khóa mã hóa'
  - Ảnh hưởng của trường mã hóa đến truy vấn và chỉ mục
  - Giới hạn dữ liệu nhạy cảm trong log, lỗi và kết quả trả về
- level1: Thiết kế ứng dụng
  level2:
  - Phân chia Controller, Service, Repository và lớp ánh xạ DTO
  - Đặt ranh giới aggregate, transaction và quyền sở hữu cập nhật
  - Tách mô hình API khỏi cấu trúc tài liệu lưu trữ
  - Repository fragment và cài đặt truy vấn tùy chỉnh bằng Template
  - Thiết kế thao tác tạo, sửa và xóa có tính lũy đẳng
  - Ràng buộc duy nhất trong nghiệp vụ và chiến lược theo khóa
  - Xóa mềm, lọc dữ liệu còn hiệu lực và tương tác với TTL
  - Phân quyền và tenant ở ranh giới dịch vụ
  - Phối hợp cập nhật dữ liệu với sự kiện bên ngoài một cách tin cậy
  - Quản lý nhiều bucket hoặc nhiều cluster mà không trộn cấu hình
- level1: Kiểm thử
  level2:
  - Phân lớp kiểm thử nghiệp vụ, ánh xạ và tích hợp dữ liệu
  - Giới hạn của mock khi xác minh ngữ nghĩa Couchbase
  - '@DataCouchbaseTest và cấu hình tài nguyên kiểm thử'
  - Khởi tạo CouchbaseContainer bằng Testcontainers
  - Cung cấp cấu hình kết nối động và chờ cluster sẵn sàng
  - Tạo scope, collection, chỉ mục và dữ liệu thử có thể tái lập
  - Kiểm thử CRUD, truy vấn dẫn xuất và @Query trên dữ liệu thực
  - Kiểm thử CAS bằng hai cập nhật cạnh tranh
  - Kiểm thử giao dịch thành công, rollback và thử lại
  - Kiểm thử TTL, độ bền và độ trễ cập nhật chỉ mục
  - StepVerifier cho Repository và Template phản ứng
  - Cô lập dữ liệu giữa các bài kiểm thử và dọn dẹp đúng phạm vi
  - Kiểm thử quyền truy cập, cấu hình sai và tính tương thích phiên bản
- level1: Xử lý lỗi
  level2:
  - Hệ thống ngoại lệ Spring Data và ngoại lệ gốc từ SDK
  - Tài liệu không tồn tại, khóa trùng và xung đột phiên bản
  - Lỗi ánh xạ, lỗi chuyển đổi và dữ liệu không hợp lệ
  - Không tìm thấy bucket, scope, collection hoặc chỉ mục
  - Lỗi xác thực, phân quyền, DNS và chứng chỉ
  - Phân biệt lỗi có thể thử lại với lỗi cần thay đổi đầu vào hoặc cấu hình
  - Thời gian chờ có kết quả xác định và chưa xác định
  - Tính lũy đẳng trước khi thử lại thao tác ghi
  - Giới hạn số lần thử, thời gian chờ tăng dần và ngân sách tổng
  - Xử lý lỗi giao dịch và kiểm tra khả năng đã commit
  - Chuyển lỗi dữ liệu thành phản hồi API phù hợp
  - Thu thập ngữ cảnh chẩn đoán mà không lộ thông tin bí mật
- level1: Quan sát và vận hành
  level2:
  - Kiểm tra kết nối và trạng thái sẵn sàng của ứng dụng
  - Phân biệt health check với độ sẵn sàng của từng dịch vụ Couchbase
  - Log SDK, thông tin chẩn đoán và endpoint kết nối
  - Đo độ trễ Key-Value, truy vấn, lỗi và số thao tác đang chờ
  - Theo dõi truy vấn chậm, request ID và ngữ cảnh truy vết
  - Quan sát tải chỉ mục, bộ nhớ, dung lượng và dịch vụ truy vấn
  - Hành vi ứng dụng khi failover, rebalance hoặc gián đoạn mạng
  - Quản lý thời gian khởi động và phục hồi kết nối
  - Dừng ứng dụng có kiểm soát và đóng tài nguyên SDK
  - Sao lưu, khôi phục và kiểm tra khả năng đọc lại dữ liệu ứng dụng
- level1: Hiệu năng
  level2:
  - Chọn truy cập theo khóa khi đã có định danh tài liệu
  - Đo đường cơ sở theo độ trễ, thông lượng và lượng dữ liệu truyền
  - Tối ưu chỉ mục theo điều kiện lọc và sắp xếp
  - Giảm số trường trả về và số tài liệu trung gian
  - Thay cập nhật toàn tài liệu bằng sub-document khi phù hợp
  - Kiểm soát kích thước trang và truy vấn đếm tổng
  - Tối ưu truy vấn tham số hóa và kế hoạch chuẩn bị theo API hỗ trợ
  - Giới hạn đồng thời và tránh làm đầy hàng đợi SDK
  - Đánh giá chi phí của REQUEST_PLUS, độ bền và giao dịch
  - Phân tích tài liệu lớn, khóa nóng và tải phân bố không đều
  - Đo với dữ liệu và topology đại diện trước khi chọn cấu hình
- level1: Tiến hóa và di trú
  level2:
  - Quản lý phiên bản tài liệu trong cơ sở dữ liệu không có lược đồ cứng
  - Đọc tương thích khi thêm, đổi tên hoặc thay kiểu trường
  - Thay đổi @TypeAlias, thông tin kiểu và tên lớp Java
  - Di trú tài liệu theo lô với tiến độ và khả năng chạy lại
  - Chuyển dữ liệu sang scope, collection hoặc bucket mới
  - Triển khai chỉ mục trước các truy vấn phụ thuộc
  - Đọc và ghi đồng thời trong giai đoạn chuyển đổi
  - Nâng Spring Boot, Spring Data Couchbase và Java SDK theo ma trận tương thích
  - Nhận diện API hoặc ví dụ cũ thuộc SDK và Spring Data thế hệ trước
  - Kiểm thử dữ liệu cũ, sao lưu và phương án khôi phục khi di trú lỗi
- level1: Bài thực hành
  level2:
  - Xây dựng CRUD khách hàng bằng Repository và Template
  - Thiết kế khóa đơn hàng và kiểm tra yêu cầu tạo lặp
  - Ánh xạ tài liệu lồng nhau và bộ chuyển đổi tiền tệ hoặc thời gian
  - Tạo bộ lọc động, sắp xếp và phân trang danh sách đơn hàng
  - Tạo chỉ mục và so sánh kế hoạch truy vấn trước và sau
  - Mô phỏng đọc sau ghi với nhiều mức nhất quán
  - Xử lý hai yêu cầu cập nhật cạnh tranh bằng CAS
  - Lưu phiên đăng nhập có TTL và kiểm tra làm mới thời hạn
  - Thực hiện giao dịch chuyển tiền giữa nhiều tài liệu
  - Xây dựng API WebFlux truy cập Couchbase theo chuỗi phản ứng
  - Kiểm thử bằng Testcontainers và đo tải theo một mẫu truy cập cụ thể
  - Di trú tài liệu sang phiên bản mới và xác minh dữ liệu sau chuyển đổi
