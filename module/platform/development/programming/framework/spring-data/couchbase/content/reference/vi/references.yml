references:
  - title: "Spring Data Couchbase – Couchbase Support"
    url: "https://docs.spring.io/spring-data/couchbase/reference/couchbase.html"
    description: "Tổng quan hỗ trợ mapping, repository, template, cấu hình và API reactive."
  - title: "Spring Data Couchbase – Installation & Configuration"
    url: "https://docs.spring.io/spring-data/couchbase/reference/couchbase/configuration.html"
    description: "Kết nối cluster, bucket, credentials và cấu hình Spring."
  - title: "Spring Data Couchbase – Modeling Entities"
    url: "https://docs.spring.io/spring-data/couchbase/reference/couchbase/entity.html"
    description: "Ánh xạ POJO/document, định danh và optimistic locking bằng @Version."
  - title: "Spring Data Couchbase – Template & Direct Operations"
    url: "https://docs.spring.io/spring-data/couchbase/reference/couchbase/template.html"
    description: "API CouchbaseTemplate, ReactiveCouchbaseTemplate, CRUD và tùy chọn truy vấn."
  - title: "Spring Data Couchbase – Couchbase Repositories"
    url: "https://docs.spring.io/spring-data/couchbase/reference/couchbase/repository.html"
    description: "Repository, derived queries, SQL++ và yêu cầu chỉ mục."
  - title: "Spring Data Couchbase – Collection Support"
    url: "https://docs.spring.io/spring-data/couchbase/reference/couchbase/collections.html"
    description: "Cấu hình scope và collection trên entity, repository và template."
  - title: "Spring Data Couchbase – Reactive Repositories"
    url: "https://docs.spring.io/spring-data/couchbase/reference/couchbase/reactiverepository.html"
    description: "Repository bất đồng bộ với Reactor Mono/Flux và cấu hình."
  - title: "Spring Data Couchbase – Transactions"
    url: "https://docs.spring.io/spring-data/couchbase/reference/couchbase/transactions.html"
    description: "Yêu cầu giao dịch, @Transactional và Couchbase transaction operator."
  - title: "Couchbase Java SDK – Key-Value Data Operations"
    url: "https://docs.couchbase.com/java-sdk/current/howtos/kv-operations.html"
    description: "Key-value CRUD, document expiry/TTL, CAS, durability và lỗi cập nhật đồng thời."