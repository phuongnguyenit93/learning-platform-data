  - Projection động với tham số Class<T>
  - Projection cho truy vấn theo tên, JPQL và native SQL
  - Phân biệt DTO trả kết quả truy vấn và DTO nhận dữ liệu cập nhật
- level1: Sắp xếp và phân trang
  level2:
