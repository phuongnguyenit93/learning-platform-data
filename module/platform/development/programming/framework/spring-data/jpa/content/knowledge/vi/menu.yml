  - So sánh offset scrolling và keyset scrolling
  - Thiết kế thứ tự sắp xếp và chỉ mục cho keyset
  - Ràng buộc về giá trị null và thuộc tính sắp xếp trong projection
  - Duyệt nhiều cửa sổ và quản lý vị trí tiếp tục
  - Đọc kết quả bằng Stream<T> trong phạm vi giao dịch
  - Đóng Stream, fetch size và thời gian giữ kết nối
  - Giới hạn số kết quả bằng Top, First hoặc Limit theo phiên bản
  - Truy vấn bất đồng bộ với @Async và giới hạn của JPA đồng bộ
- level1: Query by Example
  level2:
  - Mô hình probe, Example và ExampleMatcher
