  - So khớp chuỗi, phân biệt chữ hoa thường và giá trị null
  - matchingAll, matchingAny và tùy chỉnh theo thuộc tính
  - Xử lý giá trị mặc định của kiểu nguyên thủy trong probe
  - Tìm kiếm, đếm, kiểm tra tồn tại và phân trang bằng Example
  - Thực thi linh hoạt với fluent query của QueryByExampleExecutor
  - Giới hạn về điều kiện nhóm, quan hệ và truy vấn phức tạp
  - Lựa chọn Query by Example cho biểu mẫu tìm kiếm đơn giản
