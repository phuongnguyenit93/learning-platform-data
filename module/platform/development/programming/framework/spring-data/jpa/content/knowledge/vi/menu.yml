  - Interface projection mở với biểu thức và đánh đổi tối ưu
  - Projection lồng nhau và nguy cơ tải quan hệ ngoài dự kiến
  - Default method và wrapper cho thuộc tính có thể null
  - DTO theo constructor và lựa chọn constructor bằng @PersistenceCreator
