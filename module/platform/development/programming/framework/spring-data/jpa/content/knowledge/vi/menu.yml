menu:
- level1: Tổng quan
  level2:
  - Spring Data JPA là gì và giải quyết vấn đề truy cập dữ liệu nào
  - Mối liên hệ giữa Spring Data, JPA, Hibernate, JDBC và cơ sở dữ liệu
  - Entity, bảng, khóa định danh, Repository và giao dịch trong cùng một mô hình
  - Luồng xử lý từ lời gọi Repository đến câu SQL và kết quả trả về
  - So sánh Spring Data JPA với JDBC, Spring Data JDBC và R2DBC
  - Khi nên dùng JPA và khi nên chọn công cụ truy cập dữ liệu khác
  - Kiến thức Java, SQL và Spring cần có trước khi bắt đầu
  - Thứ tự học và mô hình nghiệp vụ xuyên suốt tài liệu
- level1: Khởi tạo
  level2:
  - Tạo ứng dụng Spring Boot với Spring Data JPA và trình điều khiển JDBC
  - Quản lý phiên bản Spring Boot, Spring Data và Hibernate bằng BOM
  - Cấu hình DataSource, thông tin kết nối và hồ sơ môi trường
  - Khởi tạo Entity, JpaRepository và dịch vụ nghiệp vụ đầu tiên
  - Chạy thử thao tác thêm, đọc, sửa và xóa dữ liệu
  - Phân biệt cơ sở dữ liệu nhúng và cơ sở dữ liệu dùng trong triển khai
  - Cấu hình ghi nhật ký SQL và tham số truy vấn theo môi trường
  - Tổ chức gói mã nguồn và phạm vi quét Entity, Repository
  - Kiểm tra kết nối, tạo schema thử nghiệm và lỗi khởi động thường gặp
- level1: Hạ tầng JPA
  level2:
  - Vai trò của DataSource, EntityManagerFactory và EntityManager
  - Persistence unit, PersistenceContext và vòng đời tài nguyên
  - Cơ chế tự cấu hình JPA của Spring Boot
  - Cấu hình @EnableJpaRepositories và @EntityScan
  - Cấu hình JPA bằng Java khi không dùng Spring Boot
  - Vai trò của JpaVendorAdapter và các thuộc tính nhà cung cấp
  - Cấu hình TransactionManager và liên kết với persistence unit
  - Chế độ khởi tạo Repository DEFAULT, LAZY và DEFERRED
  - Cấu hình XML, persistence.xml và phạm vi áp dụng trong hệ thống cũ
- level1: Repository
  level2:
  - Repository, CrudRepository và hợp đồng thao tác dữ liệu
  - ListCrudRepository, PagingAndSortingRepository và JpaRepository
  - Lựa chọn interface theo phiên bản và nhu cầu của ứng dụng
  - Kiểu Entity và kiểu khóa định danh trong khai báo Repository
  - Cơ chế tạo proxy và vai trò của SimpleJpaRepository
  - Chọn lọc phương thức bằng RepositoryDefinition và interface cơ sở
  - Ngăn tạo Repository trung gian bằng @NoRepositoryBean
  - Phân biệt phương thức CRUD kế thừa và phương thức truy vấn tự khai báo
  - Nhận diện Repository khi nhiều mô-đun Spring Data cùng tồn tại
- level1: Ánh xạ Entity
  level2:
  - '@Entity, @Table và quan hệ giữa tên Entity với tên bảng'
  - Yêu cầu về constructor, lớp Entity và khả năng tạo proxy
  - Chọn truy cập theo trường hoặc thuộc tính bằng @Access
  - '@Column, nullability, độ dài, precision và scale'
  - Phân biệt ràng buộc ánh xạ, Bean Validation và ràng buộc cơ sở dữ liệu
  - Loại trừ thuộc tính bằng @Transient và từ khóa transient
  - Ánh xạ thời gian bằng LocalDate, LocalDateTime, Instant và múi giờ
  - Ánh xạ enum bằng STRING, ORDINAL và rủi ro thay đổi thứ tự
  - Ánh xạ LOB, dữ liệu nhị phân và chi phí tải dữ liệu lớn
  - Quy tắc đặt tên vật lý, tên logic và tên trùng từ khóa SQL
- level1: Khóa định danh
  level2:
  - Khóa tự nhiên, khóa thay thế và tiêu chí lựa chọn
  - Khai báo @Id và các yêu cầu về tính ổn định của định danh
  - So sánh chiến lược sinh khóa AUTO, IDENTITY, SEQUENCE và TABLE
  - Cấu hình @SequenceGenerator và phân bổ giá trị khóa
  - Sinh khóa UUID và yêu cầu tương thích phiên bản JPA, Hibernate
  - Khóa do ứng dụng gán và cách Spring Data nhận diện Entity mới
  - Khóa ghép với @EmbeddedId và @IdClass
  - Định danh phụ thuộc với @MapsId
  - Thiết kế equals và hashCode cho khóa ghép
  - Tác động của chiến lược sinh khóa đến nhập dữ liệu theo lô
- level1: Kiểu giá trị
  level2:
  - Phân biệt Entity và đối tượng giá trị
  - Tái sử dụng nhóm thuộc tính bằng @Embeddable và @Embedded
  - Ghi đè ánh xạ bằng @AttributeOverride và @AssociationOverride
  - Tập hợp kiểu cơ bản và đối tượng giá trị với @ElementCollection
  - Cấu hình bảng tập hợp bằng @CollectionTable
  - Chuyển đổi dữ liệu bằng AttributeConverter và @Convert
  - Áp dụng autoApply và giới hạn của bộ chuyển đổi
  - Ánh xạ giá trị tiền tệ, mã nghiệp vụ và thời gian có quy tắc riêng
  - Lựa chọn kiểu chuẩn JPA hoặc kiểu đặc thù nhà cung cấp
- level1: Quan hệ đơn
  level2:
  - Phân biệt quan hệ đơn hướng, hai hướng và phía sở hữu
  - Ánh xạ nhiều-một bằng @ManyToOne và @JoinColumn
  - Ánh xạ một-một bằng @OneToOne
  - Quan hệ một-một dùng khóa chính chung với @MapsId
  - Vai trò của mappedBy và vị trí lưu khóa ngoại
  - Đồng bộ hai phía quan hệ bằng phương thức nghiệp vụ
  - optional, nullable, khóa ngoại và ràng buộc duy nhất
  - Lựa chọn LAZY hoặc EAGER cho quan hệ đơn
  - Xử lý tham chiếu không tồn tại và giới hạn tải lười theo nhà cung cấp
- level1: Quan hệ tập hợp
  level2:
  - Ánh xạ một-nhiều bằng @OneToMany
  - So sánh một-nhiều dùng khóa ngoại và bảng liên kết
  - Ánh xạ nhiều-nhiều bằng @ManyToMany và @JoinTable
  - Thay quan hệ nhiều-nhiều bằng Entity liên kết có thuộc tính riêng
  - Chọn List, Set và Map cho quan hệ tập hợp
  - Duy trì thứ tự bằng @OrderBy và @OrderColumn
  - Ánh xạ khóa Map bằng @MapKey và các biến thể phù hợp
  - CascadeType và phạm vi lan truyền từng thao tác
  - Phân biệt orphanRemoval, CascadeType.REMOVE và ON DELETE của cơ sở dữ liệu
  - Thêm, xóa và thay thế phần tử mà vẫn giữ nhất quán hai phía
  - Rủi ro xóa dây chuyền và cập nhật dư thừa ở quan hệ lớn
- level1: Kế thừa
  level2:
  - Lựa chọn kế thừa Entity hoặc kết hợp đối tượng
  - Chia sẻ thuộc tính bằng @MappedSuperclass
  - Chiến lược SINGLE_TABLE và cột phân biệt
  - Chiến lược JOINED và chi phí kết nối bảng
  - Chiến lược TABLE_PER_CLASS và truy vấn đa hình
  - Cấu hình @Inheritance, @DiscriminatorColumn và @DiscriminatorValue
  - Truy vấn theo lớp cha và xử lý lớp con
  - Đánh đổi giữa toàn vẹn dữ liệu, khả năng mở rộng và hiệu năng
- level1: Vòng đời Entity
  level2:
  - Các trạng thái transient, managed, detached và removed
  - Bộ nhớ đệm cấp một và định danh đối tượng trong PersistenceContext
  - persist, merge, remove, find và getReference
  - Dirty checking và thời điểm phát hiện thay đổi
  - Flush khác commit như thế nào
  - FlushModeType.AUTO, COMMIT và ảnh hưởng đến truy vấn
  - detach, clear, refresh và khi cần đồng bộ lại trạng thái
  - Vì sao merge trả về một đối tượng managed khác
  - Entity callback với @PrePersist, @PreUpdate, @PostLoad và các mốc liên quan
  - EntityListener, Bean Validation và giới hạn xử lý trong callback
  - Thiết kế equals, hashCode, toString và sử dụng Lombok an toàn với Entity
- level1: Thao tác CRUD
  level2:
  - save và cách lựa chọn persist hoặc merge
  - Nhận diện Entity mới qua thuộc tính version, id và Persistable
  - Cập nhật Entity managed mà không gọi save lặp lại
  - saveAll và sự khác biệt với câu lệnh chèn theo lô
  - findById, Optional và hợp đồng khi dữ liệu không tồn tại
  - getReferenceById, proxy và thời điểm kiểm tra sự tồn tại
  - findAll, findAllById và giới hạn khi đọc tập dữ liệu lớn
  - existsById, count và chi phí truy vấn
  - delete, deleteById, deleteAll và ảnh hưởng đến callback
  - flush, saveAndFlush và saveAllAndFlush
  - deleteAllInBatch, deleteAllByIdInBatch và trạng thái PersistenceContext
- level1: Truy vấn theo tên
  level2:
  - 'Cấu trúc tên phương thức: chủ ngữ, điều kiện và thứ tự'
  - 'Query lookup strategy: CREATE, USE_DECLARED_QUERY và CREATE_IF_NOT_FOUND'
  - Duyệt thuộc tính lồng nhau và phân giải tên bằng dấu gạch dưới
  - Tìm theo điều kiện bằng, so sánh, khoảng và thời gian
  - Xử lý null, boolean, In và NotIn
  - Tìm chuỗi bằng Like, Containing, StartingWith và EndingWith
  - Ký tự đại diện, escaping và khác biệt khi truyền null
  - Kết hợp And, Or và giới hạn biểu diễn điều kiện có nhóm
  - IgnoreCase, AllIgnoreCase và tác động đến chỉ mục
  - Distinct, countDistinct và ý nghĩa thực tế của phép đếm
  - Top, First, OrderBy và giới hạn số kết quả
  - existsBy, countBy, deleteBy và removeBy
  - Tên phương thức dành riêng và xung đột với thuộc tính tên id
  - Nhận biết tên phương thức quá dài và thời điểm chuyển cách truy vấn
- level1: JPQL
  level2:
  - JPQL truy vấn theo Entity và thuộc tính thay vì bảng và cột
  - Khai báo truy vấn bằng @Query
  - SELECT, WHERE, ORDER BY và biểu thức điều kiện
  - INNER JOIN, LEFT JOIN và điều kiện ON
  - Đường dẫn thuộc tính và các phép join phát sinh ngầm
  - JOIN FETCH và khác biệt với join phục vụ lọc dữ liệu
  - GROUP BY, HAVING và các hàm tổng hợp
  - Truy vấn con, EXISTS và điều kiện tương quan
  - DISTINCT, giá trị null và kết quả trùng do join
  - Biểu thức CASE, COALESCE, NULLIF và hàm chuẩn
  - Truy vấn đa hình với TYPE và TREAT
  - Constructor expression để trả về DTO
  - Hàm cơ sở dữ liệu, FUNCTION và giới hạn tính khả chuyển
- level1: SQL thuần
  level2:
  - Khi nào cần native SQL thay cho JPQL
  - Khai báo @Query với nativeQuery và khả năng dùng @NativeQuery theo phiên bản
  - Ánh xạ kết quả native query về Entity
  - Trả về dữ liệu vô hướng, interface projection và DTO
  - Ánh xạ phức tạp bằng @SqlResultSetMapping và @ConstructorResult
  - Phân trang native query và khai báo countQuery
  - Sắp xếp động, bộ phân tích truy vấn và giới hạn theo phiên bản
  - Truy vấn CTE, hàm cửa sổ và cú pháp riêng của cơ sở dữ liệu
  - Ràng buộc tham số an toàn và tránh ghép SQL từ đầu vào
  - Kiểm thử tính đúng đắn và khả năng chuyển cơ sở dữ liệu
- level1: Truy vấn đặt tên
  level2:
  - Định nghĩa JPQL bằng @NamedQuery và @NamedQueries
  - Định nghĩa SQL bằng @NamedNativeQuery
  - Quy ước tên Entity.phươngThức và cơ chế tìm truy vấn
  - Tổ chức truy vấn trong META-INF/orm.xml
  - Thứ tự lựa chọn giữa @Query, named query và truy vấn theo tên
  - Áp dụng query hints và giới hạn phụ thuộc nhà cung cấp
  - Sử dụng @Meta để bổ sung chú thích truy vấn khi được hỗ trợ
  - Phát hiện truy vấn sai lúc khởi tạo và lúc thực thi
- level1: Tham số và kết quả
  level2:
  - Ràng buộc tham số theo vị trí và theo tên với @Param
  - Biểu thức giá trị trong @Query và biến entityName
  - Truyền tập hợp, enum, thời gian và tham số có thể null
  - Phân biệt không truyền bộ lọc, lọc IS NULL và lọc bằng giá trị
  - Kiểu trả về đơn, Optional và nhiều kết quả
  - Collection, List, Set và hợp đồng thứ tự kết quả
  - Truy vấn vô hướng và ánh xạ giá trị tổng hợp
  - Nullability của tham số và kết quả theo phiên bản Spring Data
  - Xử lý kết quả rỗng và IncorrectResultSizeDataAccessException
  - Lựa chọn kiểu trả về theo mục đích sử dụng và chi phí truy vấn
- level1: Projection và DTO
  level2:
