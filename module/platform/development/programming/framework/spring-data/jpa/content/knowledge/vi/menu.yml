  - Thứ tự ổn định, khóa phụ và thay đổi dữ liệu giữa các trang
  - Giới hạn kích thước trang và kiểm soát thuộc tính được phép sắp xếp
  - Tích hợp Pageable, Sort với Spring MVC và quy tắc cấu hình
  - Ánh xạ Page<Entity> sang Page<DTO> và hợp đồng phản hồi
- level1: Cuộn và luồng
  level2:
