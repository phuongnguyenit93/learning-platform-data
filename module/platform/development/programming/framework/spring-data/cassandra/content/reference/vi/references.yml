references:
  - title: "Spring Data Cassandra — Connecting to Cassandra"
    url: "https://docs.spring.io/spring-data/cassandra/reference/cassandra/configuration.html"
    description: "Cấu hình CqlSession, kết nối keyspace, CassandraTemplate và repository support trong ứng dụng Spring."
  - title: "Spring Data Cassandra — Object Mapping"
    url: "https://docs.spring.io/spring-data/cassandra/reference/object-mapping.html"
    description: "Ánh xạ entity, @Table, @PrimaryKey, @PrimaryKeyClass và các cột partition/clustering key."
  - title: "Spring Data Cassandra — Repositories"
    url: "https://docs.spring.io/spring-data/cassandra/reference/repositories.html"
    description: "Hướng dẫn repository abstraction, CRUD, Cassandra-specific query methods và phương thức truy vấn."
  - title: "Spring Data Cassandra — Persisting Entities"
    url: "https://docs.spring.io/spring-data/cassandra/reference/cassandra/template.html"
    description: "Ví dụ CassandraTemplate và ReactiveCassandraTemplate, thao tác đọc/ghi, TTL, consistency và LWT."
  - title: "Apache Cassandra — Data Modeling"
    url: "https://cassandra.apache.org/doc/stable/cassandra/developing/data-modeling/intro.html"
    description: "Tài liệu chính thức về thiết kế dữ liệu theo truy vấn, partition key, clustering key, phân tán và đánh đổi."
