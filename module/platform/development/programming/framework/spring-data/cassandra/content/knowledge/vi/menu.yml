  - Nhận biết tạo mới bằng @Version hoặc Persistable
  - '@EnableReactiveCassandraAuditing và ReactiveAuditorAware'
  - Kiểm soát nguồn thời gian và người thao tác
  - Các đường ghi CQL trực tiếp cần kiểm tra phạm vi auditing
  - Tách sự kiện nghiệp vụ khỏi sự kiện ánh xạ dữ liệu
