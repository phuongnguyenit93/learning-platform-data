  - Giới hạn kích thước, số statement và thời gian chờ
  - Batch lỗi, kết quả chưa xác định và khả năng thử lại
  - So sánh batch với nhiều yêu cầu bất đồng bộ có giới hạn
  - Cập nhật bảng phi chuẩn hóa và các ràng buộc cần kiểm chứng
- level1: Bộ đếm
