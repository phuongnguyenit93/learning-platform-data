  - LWT, batch và phạm vi nguyên tử trong chuỗi phản ứng
  - Giữ ngữ cảnh auditing và mã theo dõi yêu cầu
  - Tích hợp WebFlux và kiểm tra đường đi không chặn
- level1: Dữ liệu thời gian
  level2:
  - Mẫu truy vấn sự kiện theo thiết bị, người dùng hoặc tenant
