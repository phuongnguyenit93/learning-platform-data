  - Lỗi xác thực, phân quyền, DNS và TLS
  - Unavailable, read timeout, write timeout và lỗi quá tải
  - Node lỗi, kết nối gián đoạn và kết quả ghi chưa xác định
  - Phân loại thao tác có thể thử lại theo tính lũy đẳng
