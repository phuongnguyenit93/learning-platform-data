  - Tính không lũy đẳng khi thử lại cập nhật counter
  - Counter batch và giới hạn phối hợp với thao tác thông thường
  - Giới hạn về TTL, timestamp và cập nhật có điều kiện
  - Xóa, tạo lại và vòng đời của dữ liệu counter
  - Chọn mô hình sự kiện để tổng hợp khi cần kiểm soát trùng lặp
  - Kiểm thử yêu cầu lặp, lỗi mạng và số đếm sau phục hồi
