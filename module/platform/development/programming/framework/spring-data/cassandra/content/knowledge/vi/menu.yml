  - Tổng hợp trước theo cửa sổ phục vụ truy vấn thống kê
  - Quan hệ giữa mẫu ghi, TTL và chiến lược compaction theo thời gian
  - Thiết kế lịch sử trạng thái và góc nhìn hiện tại ở bảng riêng
  - Kiểm thử phân bố tải, thay đổi múi giờ và ranh giới ngày
