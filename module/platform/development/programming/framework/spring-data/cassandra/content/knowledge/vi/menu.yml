  - Phối hợp Cassandra với hàng đợi hoặc hệ lưu trữ khác
  - Ranh giới của @Transactional và lựa chọn cơ chế bảo đảm dữ liệu
  - Tách phép tính nghiệp vụ khỏi tác dụng phụ lưu trữ
