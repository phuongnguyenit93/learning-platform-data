  - ApplicationEvent và EntityCallback trong vòng đời lưu trữ
  - BeforeConvertCallback và BeforeSaveCallback
  - Thay đổi entity trước chuyển đổi và điều chỉnh statement trước ghi
  - Thứ tự callback và giữ logic dễ kiểm thử
  - '@CreatedDate, @LastModifiedDate, @CreatedBy và @LastModifiedBy'
