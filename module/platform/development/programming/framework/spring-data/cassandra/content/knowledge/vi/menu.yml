  - Phối hợp tác vụ bằng thenCompose và thenCombine
  - Đọc tiếp các trang kết quả bất đồng bộ
  - Giới hạn số yêu cầu đang thực hiện
  - Luồng chạy callback và cô lập công việc chặn hoặc tốn CPU
  - Lỗi, thời gian chờ và hủy tác vụ
  - Phân biệt truy cập bất đồng bộ thực với bọc lời gọi chặn bằng @Async
  - Chuyển giữa CompletableFuture và Reactor tại ranh giới rõ ràng
- level1: Truy cập phản ứng
  level2:
  - ReactiveCassandraRepository và ReactiveCassandraTemplate
  - ReactiveCqlTemplate cho CQL cấp thấp
