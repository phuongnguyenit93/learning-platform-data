references:
  - title: "Spring Data R2DBC Reference"
    url: "https://docs.spring.io/spring-data/relational/reference/r2dbc.html"
    description: "Tổng quan về R2DBC, ánh xạ entity, template và repository của Spring Data."
  - title: "Spring Data R2DBC Repositories"
    url: "https://docs.spring.io/spring-data/relational/reference/r2dbc/repositories.html"
    description: "Cấu hình repository reactive, CRUD, kết quả Mono/Flux và truy cập nhiều database."
  - title: "Spring Data R2DBC Query Methods"
    url: "https://docs.spring.io/spring-data/relational/reference/r2dbc/query-methods.html"
    description: "Derived query, @Query, truy vấn tùy chỉnh, thao tác thay đổi dữ liệu."
  - title: "Spring Framework: Data Access with R2DBC"
    url: "https://docs.spring.io/spring-framework/reference/data-access/r2dbc.html"
    description: "Hướng dẫn DatabaseClient, ConnectionFactory, SQL và xử lý kết quả reactive."
  - title: "Spring Boot: SQL Databases"
    url: "https://docs.spring.io/spring-boot/reference/data/sql.html"
    description: "Cấu hình R2DBC và sử dụng Spring Data repositories trong Spring Boot."
  - title: "R2DBC Specification"
    url: "https://r2dbc.io/spec/"
    description: "Đặc tả Reactive Relational Database Connectivity và quy ước driver API."
  - title: "Spring Framework: Using @Transactional"
    url: "https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html"
    description: "Hành vi giao dịch khai báo, bao gồm phương thức trả về Publisher và Mono."