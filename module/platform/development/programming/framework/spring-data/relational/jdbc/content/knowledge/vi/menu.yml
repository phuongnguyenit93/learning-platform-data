  - Điều khiển thời gian bằng DateTimeProvider và quy ước múi giờ
  - Auditing với entity bất biến, đối tượng mới và nhiều nguồn ghi
  - Phân biệt auditing mặc định với lịch sử thay đổi đầy đủ
  - Kiểm thử thời gian và người thao tác một cách xác định
- level1: Schema và migration
  level2:
  - Thiết kế DDL từ aggregate và ánh xạ collection
  - Đặt khóa ngoại, chỉ mục, unique và check constraint
  - Phân biệt SQL initialization với migration có phiên bản
  - Quản lý thay đổi schema bằng Flyway hoặc Liquibase
  - Sinh Liquibase change set bằng LiquibaseChangeSetWriter
  - 'Giới hạn sinh chênh lệch schema: đổi tên và chuyển đổi dữ liệu'
  - Kiểm soát schema cũ, giá trị mặc định và backfill dữ liệu
  - Triển khai thay đổi schema tương thích nhiều phiên bản ứng dụng
- level1: Dialect và kết nối
  level2:
  - Vai trò của Dialect trong SQL sinh tự động và khả năng cơ sở dữ liệu
  - Phát hiện dialect từ metadata của kết nối
  - Khác biệt quoting, limit/offset, generated keys và kiểu dữ liệu
  - Tùy chỉnh hoặc đăng ký dialect theo SPI của phiên bản
  - 'Cấu hình pool: kích thước, thời gian chờ và vòng đời kết nối'
  - 'Nhiều DataSource: tách repository, template và transaction manager'
  - Định tuyến tenant hoặc nguồn đọc/ghi và ranh giới nhất quán
  - Kiểm chứng tính tương thích trên H2, PostgreSQL và MySQL
- level1: Tích hợp MyBatis
  level2:
  - Khi nào cần phối hợp Spring Data JDBC với MyBatis?
  - Cấu hình MyBatisJdbcConfiguration và SqlSessionFactory
  - Quy ước namespace, statement và MyBatisContext
  - Ủy quyền từng bước CRUD và xử lý generated keys
  - Ánh xạ kết quả và xử lý quan hệ bằng statement tùy chỉnh
  - Dùng chung DataSource, giao dịch và kiểm thử tính nhất quán
  - Đánh đổi giữa khả năng tùy biến SQL và chi phí bảo trì
- level1: Tính năng theo phiên bản
  level2:
  - Đọc release train, release notes và ma trận tương thích Spring Boot
  - Đối chiếu API đang dùng với tài liệu đúng phiên bản
  - Hỗ trợ sequence, @Sequence và dialect trong phiên bản có tính năng
  - Khóa ghép bằng @Id kết hợp @Embedded trong phiên bản hỗ trợ
  - 'Upsert bằng JdbcAggregateTemplate: yêu cầu dialect và giới hạn version'
  - 'AOT và native image: cấu hình, tối ưu repository và giới hạn'
  - Nhận diện tính năng thử nghiệm và kiểm chứng trước khi đưa vào tài liệu
  - Lập kiểm thử hồi quy khi nâng phiên bản Spring Data hoặc driver
- level1: Hiệu năng
  level2:
  - Đo số câu SQL, số lượt kết nối, thời gian và dung lượng kết quả
  - Nhận diện truy vấn lặp khi tải danh sách aggregate
  - Đo chi phí xóa–chèn lại entity con trong aggregate lớn
  - Chọn projection, SQL JOIN hoặc Single Query Loading theo số đo
  - Đọc execution plan và thiết kế chỉ mục theo điều kiện truy vấn
  - Tối ưu count query và phân trang sâu
  - Phân biệt saveAll, batch insert và batch update qua JDBC trực tiếp
  - Xử lý dữ liệu lớn theo lô và giữ giao dịch có kích thước phù hợp
  - Bộ nhớ, fetch size và thời gian giữ connection khi streaming
  - Cache ở tầng ứng dụng và chiến lược vô hiệu hóa khi ghi
- level1: Kiểm thử
  level2:
  - Chọn unit test, repository test và integration test theo mục tiêu
  - Kiểm thử quy tắc aggregate không cần cơ sở dữ liệu
  - Cấu hình @DataJdbcTest và phạm vi bean được nạp
  - Phân biệt @DataJdbcTest, @JdbcTest và @SpringBootTest
  - Testcontainers và cơ sở dữ liệu cùng loại với môi trường triển khai
  - '@AutoConfigureTestDatabase và kiểm soát thay thế DataSource'
  - Dữ liệu kiểm thử bằng migration, @Sql và fixture
  - Kiểm thử mapping, embedded, collection, converter và ID
  - Kiểm thử truy vấn suy diễn, @Query, projection và phân trang
  - Kiểm thử rollback giữa các bảng và nhiều repository
  - Kiểm thử optimistic locking, khóa bi quan và xung đột đồng thời
  - Kiểm thử callback, auditing và SQL ghi trực tiếp
  - Đo truy vấn và phát hiện hồi quy hiệu năng
  - Phân biệt rollback trong test với hành vi sau commit thực tế
- level1: Lỗi và chẩn đoán
  level2:
  - Phân loại DataAccessException và exception được dịch từ JDBC
  - Không tìm thấy repository, quét sai package hoặc trùng bean
  - Không nhận diện dialect và lỗi mở kết nối lúc khởi động
  - Sai tên bảng/cột, quoting và schema search path
  - Lỗi constructor, alias cột, null và kiểu dữ liệu
  - save chọn sai insert/update hoặc không lấy được generated key
  - Vi phạm khóa ngoại, unique constraint và dữ liệu con ngoài dự kiến
  - Kết quả đơn trả nhiều hàng hoặc truy vấn không có kết quả
  - Giao dịch không rollback, kết nối cạn và truy vấn bị treo
  - Phân biệt lỗi cú pháp SQL, lỗi mapping và xung đột đồng thời
  - Quy trình tái hiện lỗi tối thiểu bằng SQL log và integration test
- level1: Vận hành và bảo mật
  level2:
  - Bật SQL log, bind log và bảo vệ dữ liệu nhạy cảm
  - Quan sát connection pool, truy vấn chậm và lỗi cơ sở dữ liệu
  - Đặt timeout cho kết nối, truy vấn và giao dịch
  - Bind tham số để phòng SQL injection và kiểm soát SQL động
  - Cấp quyền tài khoản cơ sở dữ liệu theo nhu cầu tối thiểu
  - Quản lý thông tin đăng nhập, TLS và cấu hình theo môi trường
  - Retry lỗi tạm thời với thao tác an toàn và ranh giới giao dịch rõ ràng
  - Giới hạn auditing, log và sự kiện đối với yêu cầu truy vết nghiệp vụ
- level1: Chuyển đổi ứng dụng
  level2:
  - Chuyển từ JdbcTemplate sang repository theo từng ca sử dụng
  - 'Chuyển từ JPA: thay đổi tư duy về aggregate và vòng đời đối tượng'
  - Thay annotation JPA bằng metadata Spring Data JDBC phù hợp
  - Thiết kế lại quan hệ hai chiều, cascade và lazy loading
  - Thay dirty checking, flush và entity manager bằng thao tác ghi tường minh
  - Giữ mô hình đọc phức tạp bằng SQL hoặc thư viện chuyên dụng
  - Tiếp nhận schema có sẵn mà không thay đổi dữ liệu ngoài ý muốn
  - So sánh hành vi, SQL và hiệu năng trước và sau chuyển đổi
- level1: Thực hành tổng hợp
  level2:
  - Phân tích bài toán quản lý đơn hàng và xác định ranh giới aggregate
  - Xây schema Order, OrderItem và Customer cùng migration
  - Triển khai repository, converter và quy tắc nghiệp vụ
  - Tạo bộ lọc đơn hàng, phân trang và projection báo cáo
  - Thực nghiệm lưu entity con và quan sát SQL thực tế
  - Mô phỏng hai giao dịch cập nhật cùng đơn hàng
  - Bổ sung auditing và sự kiện sau commit
  - Kiểm thử với Testcontainers và đo chi phí truy vấn
  - Đánh giá thiết kế, xử lý lỗi và tiêu chí sẵn sàng triển khai
  - 'Bài tập mở rộng: xóa mềm, nhiều nguồn dữ liệu và nhập dữ liệu theo lô'
