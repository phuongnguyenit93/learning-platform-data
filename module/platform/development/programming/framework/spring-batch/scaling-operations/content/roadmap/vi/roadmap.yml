roadmap:
- id: do-tai-toi-uu-chunk
  title: Đo tải & tối ưu Chunk
  purpose: Đo tốc độ xử lý và xác định nút thắt trước khi tăng mức song song.
  objectives:
  - Đo throughput, thời gian Job và Step.
  - Thử commit interval/chunk size.
  - Nhận diện giới hạn I/O, CPU và database.
- id: multi-threaded-step
  title: Multi-threaded Step
  purpose: Tăng năng lực xử lý trong một Step bằng nhiều luồng phù hợp.
  objectives:
  - Cấu hình TaskExecutor cho Step.
  - Kiểm tra tính an toàn của thành phần chạy đồng thời.
  - Giới hạn concurrency theo connection pool.
- id: parallel-steps
  title: Parallel Steps
  purpose: Chạy song song các nhánh công việc độc lập trong một Job.
  objectives:
  - Chia công việc thành các Flow độc lập.
  - Cấu hình split và TaskExecutor.
  - Kiểm tra điểm đồng bộ và trạng thái kết thúc.
- id: local-chunking
  title: Local Chunking
  purpose: Xử lý nhiều chunk trên các luồng trong cùng một JVM khi phiên bản hỗ trợ.
  objectives:
  - Phân biệt local chunking với multi-threaded step.
  - Tổ chức worker xử lý chunk và transaction.
  - Đánh giá kết quả và an toàn khi xử lý lỗi.
- id: partitioning
  title: Partitioning
  purpose: Phân vùng dữ liệu để xử lý song song theo phạm vi không trùng lặp.
  objectives:
  - Tạo Partitioner và ExecutionContext.
  - Thiết lập gridSize và worker Step.
  - Kiểm tra phân vùng, tổng hợp và restart.
- id: remote-chunking
  title: Remote Chunking
  purpose: Phân phối chunk tới worker qua middleware khi cần mở rộng nhiều tiến trình.
  objectives:
  - Phân biệt vai trò manager và worker.
  - Mô tả luồng gửi, xử lý và xác nhận message.
  - Đánh giá yêu cầu giao nhận và khả năng mở rộng.
- id: retry-skip-restart
  title: Retry, Skip & Restart
  purpose: Đảm bảo Job chịu lỗi và tiếp tục an toàn sau gián đoạn.
  objectives:
  - Chọn lỗi retry, skip hoặc fail.
  - Thiết lập giới hạn và rollback thích hợp.
  - Kiểm thử restart và tránh ghi trùng.
- id: giam-sat-van-hanh
  title: Giám sát & vận hành
  purpose: Theo dõi Job quy mô lớn và điều chỉnh tài nguyên trong thực tế.
  objectives:
  - Xem trạng thái Job/Step trong JobRepository.
  - Theo dõi metrics, lỗi và thời lượng.
  - Xây quy trình cảnh báo, chạy lại và tối ưu.
