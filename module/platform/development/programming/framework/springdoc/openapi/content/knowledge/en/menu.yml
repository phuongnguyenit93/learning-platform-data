menu:
- level1: Tổng quan
  level2:
  - Springdoc OpenAPI là gì và giải quyết vấn đề tài liệu API như thế nào
  - Phân biệt đặc tả OpenAPI, Springdoc, Swagger Core và Swagger UI
  - Tài liệu dạng JSON hoặc YAML và giao diện tương tác
  - Quan hệ giữa mã Spring, siêu dữ liệu và hợp đồng API được sinh
  - Hướng tiếp cận code-first, design-first và phạm vi của Springdoc
  - Những thông tin có thể suy ra tự động và những thông tin cần bổ sung
  - Mô tả API khác với cài đặt hành vi hoặc bảo mật API
  - Vị trí của tài liệu API trong phát triển, kiểm thử và tích hợp
  - 'Bản đồ thuật ngữ: operation, parameter, request body, schema và response'
  - Lộ trình học từ API đầu tiên đến kiểm chứng và phát hành hợp đồng
- level1: Phiên bản và phụ thuộc
  level2:
  - Phân biệt phiên bản Spring Boot, Springdoc và đặc tả OpenAPI
  - Đọc ma trận tương thích trước khi chọn thư viện
  - Các nhánh Springdoc v1, v2, v3 và thế hệ Spring Boot tương ứng
  - Chọn starter cho Spring MVC hoặc WebFlux
  - Starter chỉ cung cấp đặc tả so với starter kèm giao diện
  - Khai báo phụ thuộc bằng Maven hoặc Gradle
  - Vai trò của Swagger annotations, Swagger Core và WebJars
  - Namespace javax và jakarta khi chuyển thế hệ Spring Boot
  - Tránh trộn Springfox, Springdoc và các thư viện Swagger không tương thích
  - Khóa phiên bản và kiểm tra cây phụ thuộc
  - Phân biệt tính năng dùng chung với tính năng chỉ có ở một nhánh
  - Chọn tài liệu hướng dẫn đúng phiên bản đang triển khai
- level1: HTTP và hợp đồng API
  level2:
  - Đường dẫn, phương thức HTTP và định danh một operation
  - Tham số đường dẫn, truy vấn, header và cookie
  - Kiểu nội dung qua Content-Type, Accept, consumes và produces
  - Mã trạng thái và ý nghĩa của phản hồi thành công hoặc thất bại
  - Biểu diễn JSON, form, multipart và dữ liệu nhị phân
  - Hợp đồng kiểu dữ liệu khác với quy tắc nghiệp vụ
  - Tính bắt buộc, giá trị rỗng và thuộc tính vắng mặt
  - Quy ước về phân trang, sắp xếp và lọc dữ liệu
  - Tính tương thích của hợp đồng đối với bên gọi API
- level1: Khởi động và vòng đời
  level2:
  - Tạo tài liệu cho một REST Controller tối thiểu
  - Đọc đặc tả tại /v3/api-docs
  - Đọc bản YAML tại /v3/api-docs.yaml
  - Mở Swagger UI và xác minh nguồn đặc tả đang được tải
  - Điều kiện để Springdoc nhận diện Controller và handler
  - Suy luận từ mapping, chữ ký phương thức và kiểu trả về
  - Vai trò của cấu hình tự động và các bean tùy biến
  - Thời điểm xây dựng tài liệu, bộ nhớ đệm và nạp trước
  - Chuỗi xử lý từ handler đến operation và schema
  - Kiểm tra đồng thời đặc tả sinh ra với phản hồi HTTP thực tế
  - Phân biệt đường dẫn API ứng dụng với đường dẫn tài liệu
- level1: Cấu trúc OpenAPI
  level2:
  - Trường openapi và phiên bản định dạng của đặc tả
  - 'Info: title, summary khi được hỗ trợ, description và version'
  - Contact, license, termsOfService và thông tin sở hữu API
  - Servers và biến cấu hình trong URL máy chủ
  - Paths, Path Item và Operation Object
  - Tags và cách tổ chức các operation theo chủ đề
  - Components và các thành phần dùng lại
  - Schema, parameter, response, requestBody và securityScheme trong components
  - Tham chiếu $ref và cách phân giải tham chiếu
  - externalDocs và liên kết đến tài liệu bổ sung
  - Phần mở rộng x-* và mục đích sử dụng
  - Phân biệt info.version với phiên bản OpenAPI và phiên bản route
  - Tài liệu JSON hoặc YAML khác cách diễn giải và hiển thị trên giao diện
- level1: Mô tả operation
  level2:
  - '@OpenAPIDefinition và thông tin tài liệu ở phạm vi ứng dụng'
  - '@Tag ở cấp Controller và operation'
  - '@Operation: summary, description, tags và deprecated'
  - operationId duy nhất, ổn định và ảnh hưởng đến bộ sinh mã phía gọi
  - Mô tả động cơ sử dụng, điều kiện trước và kết quả quan sát
  - Nội dung Markdown, khối mã và giới hạn hiển thị
  - Mô tả nhiều phương thức HTTP hoặc nhiều mapping trên một handler
  - Các handler dùng chung path nhưng khác consumes hoặc produces
  - Ẩn Controller hoặc operation bằng @Hidden
  - Ẩn một chi tiết tài liệu khác với vô hiệu hóa endpoint thực
  - Đặt siêu dữ liệu trên interface, lớp cơ sở và phương thức ghi đè
  - Kiểm tra thứ tự ưu tiên khi cấu hình và annotation cùng tác động
- level1: Tham số đầu vào
  level2:
  - '@Parameter và mối liên hệ với annotation binding của Spring'
  - Mô tả @PathVariable và yêu cầu bắt buộc của path parameter
  - Mô tả @RequestParam với giá trị mặc định và tùy chọn
  - Mô tả @RequestHeader và @CookieValue
  - Tên hiển thị, tên binding và cơ chế khám phá tên tham số
  - Vai trò của tùy chọn biên dịch -parameters
  - Schema của tham số số, Boolean, chuỗi, enum và ngày giờ
  - Danh sách giá trị, tham số lặp lại và cách truyền mảng
  - style, explode và tính tương thích với cơ chế binding thực tế
  - Đối tượng truy vấn và @ParameterObject
  - Giới hạn làm phẳng thuộc tính lồng nhau
  - Ẩn tham số hạ tầng như principal hoặc thông tin request
  - Tham số dùng lại thông qua components.parameters
  - Vì sao Authorization không nên chỉ được khai báo như header parameter thông thường
- level1: Nội dung yêu cầu
  level2:
  - Phân biệt @RequestBody của Spring với @RequestBody của Swagger annotations
  - Request Body Object và cờ required
  - Mô tả application/json bằng @Content và @Schema
  - Nhiều kiểu nội dung cho cùng một operation
  - Đối tượng, mảng, kiểu nguyên thủy và thân yêu cầu tùy chọn
  - application/x-www-form-urlencoded và binding dữ liệu form
  - Multipart gồm tệp, nhiều tệp và trường dữ liệu thông thường
  - '@RequestPart cho một phần JSON trong multipart'
  - Encoding Object và kiểu nội dung của từng phần
  - Ví dụ thân yêu cầu theo từng media type
  - Giới hạn giữa mô tả cấu trúc đầu vào với kiểm tra dữ liệu ở thời gian chạy
  - Chọn mô hình tài liệu rõ ràng cho yêu cầu PATCH và cập nhật từng phần
- level1: Schema cơ bản
  level2:
  - Schema Object và ánh xạ kiểu Java sang kiểu OpenAPI
  - '@Schema ở cấp lớp, thuộc tính và tham số'
  - Tên schema, mô tả, kiểu và format
  - Số nguyên, số thực, Boolean, chuỗi và kiểu bất kỳ
  - Ngày, giờ, thời lượng, UUID và các định dạng cần đối chiếu
  - Enum và giá trị được tuần tự hóa thực tế
  - Mảng, Collection và @ArraySchema
  - Map, khóa chuỗi và additionalProperties
  - Thuộc tính bắt buộc, requiredMode và khả năng nhận null
  - Giá trị mặc định khác với ví dụ minh họa
  - readOnly, writeOnly, accessMode và dữ liệu chỉ dùng cho một chiều trao đổi
  - Giới hạn độ dài, khoảng số, mẫu chuỗi và kích thước mảng
  - Ẩn thuộc tính khỏi tài liệu và tác động cần kiểm tra
  - Tránh trùng tên schema khi nhiều lớp có cùng tên đơn giản
- level1: Schema nâng cao
  level2:
  - DTO lồng nhau và các tham chiếu schema dùng chung
  - Generic, lớp bao phản hồi và nguy cơ mất thông tin kiểu
  - ResponseEntity, Optional và quy tắc bỏ lớp bao khi được hỗ trợ
  - Record, lớp bất biến và dữ liệu được suy ra từ accessor
  - Quan hệ đệ quy, vòng tham chiếu và mô hình cây
  - oneOf, anyOf, allOf và not theo điều kiện xác thực
  - Phân biệt phép hợp thành schema với kế thừa lớp Java
  - Đa hình, discriminator và ánh xạ giá trị sang schema
  - Kết hợp annotation với cấu hình Jackson cho các kiểu con
  - Kiểu chứa dữ liệu tự do và chính sách thuộc tính không khai báo
  - Thay thế schema suy luận bằng implementation hoặc thành phần dùng lại
  - Mô tả cấu trúc một cách độc lập với lớp entity lưu trữ
  - Kiểm tra schema đầu ra trước khi dùng bộ sinh mã phía gọi
- level1: Jackson và Validation
  level2:
  - Tên thuộc tính JSON và chiến lược đặt tên
  - '@JsonProperty, @JsonIgnore và cách đối chiếu với @Schema'
  - '@JsonValue, @JsonFormat và biểu diễn enum hoặc ngày giờ'
  - '@JsonView và các hình chiếu dữ liệu theo operation'
  - Khả năng nhận null trong Java khác với thuộc tính thiếu trong JSON
  - '@NotNull, @NotBlank, @Size và thông tin có thể suy ra'
  - '@Min, @Max, @Pattern và các ràng buộc miền giá trị'
  - '@Valid và cấu trúc dữ liệu lồng nhau'
  - Nhóm validation và giới hạn suy luận tự động của tài liệu
  - Serializer hoặc deserializer tùy chỉnh và schema cần bổ sung
  - Giữ nhất quán giữa cấu hình ObjectMapper với dữ liệu được mô tả
  - Vì sao annotation tài liệu không tự thực thi Bean Validation
- level1: Phản hồi và lỗi
  level2:
  - '@ApiResponse, @ApiResponses và tập mã trạng thái của operation'
  - Suy luận schema từ kiểu trả về của handler
  - Mô tả nhiều phản hồi thành công với nội dung khác nhau
  - Phản hồi không có thân như 204 và cách tránh schema suy luận sai
  - Header phản hồi như Location, ETag và thông tin phân trang
  - Phản hồi mảng, lớp bao dữ liệu và cấu trúc phân trang
  - Tải tệp, dữ liệu nhị phân và Content-Disposition
  - Phản hồi văn bản, JSON, XML và nhiều media type
  - Mô tả lỗi thống nhất bằng DTO hoặc ProblemDetail
  - '@ControllerAdvice, @ExceptionHandler và giới hạn suy luận lỗi'
  - Lỗi binding, validation, xác thực và phân quyền
  - Dùng lại responses trong components
  - Giữ nhất quán giữa mã trạng thái được ghi trong tài liệu và phản hồi thực
- level1: Ví dụ và liên kết
  level2:
  - '@ExampleObject và nhiều ví dụ cho một kiểu nội dung'
  - Ví dụ ở cấp tham số, schema và request hoặc response
  - Phân biệt example, examples và default theo vị trí khai báo
  - Ví dụ thành công, dữ liệu không hợp lệ và trường hợp biên
  - Tệp ví dụ bên ngoài và khả năng truy cập từ công cụ hiển thị
  - Link Object mô tả quan hệ giữa các operation
  - Biểu thức thời gian chạy trong liên kết phản hồi
  - Callback và webhook theo khả năng của phiên bản đặc tả
  - Đường dẫn tài liệu bổ sung và quy ước giữ ví dụ không chứa bí mật
- level1: Phân trang và truy vấn
  level2:
  - Pageable, Sort và cách chúng được thể hiện trong tài liệu
  - Kết hợp @ParameterObject với tham số phân trang
  - Tên page, size, sort và giá trị mặc định của ứng dụng
  - Chỉ số trang bắt đầu từ 0 hoặc 1 và hợp đồng thực tế
  - Nhiều tiêu chí sắp xếp và tham số sort lặp lại
  - Mô tả bộ lọc dạng DTO truy vấn
  - Page, Slice và DTO phân trang do ứng dụng sở hữu
  - Mô tả liên kết hoặc con trỏ cho phân trang cursor
  - Giới hạn kích thước trang và các ràng buộc lọc cần ghi rõ
  - Kiểm tra dữ liệu phân trang được tuần tự hóa thay vì dựa vào tên kiểu
- level1: Nhóm tài liệu
  level2:
  - Mục tiêu chia hợp đồng theo miền nghiệp vụ hoặc đối tượng sử dụng
  - GroupedOpenApi và định danh nhóm duy nhất
  - Lọc theo pathsToMatch và pathsToExclude
  - Lọc theo packagesToScan và packagesToExclude
  - Điều kiện về media type hoặc header khi được hỗ trợ
  - Khai báo nhóm bằng bean hoặc thuộc tính group-configs
  - Đường dẫn đặc tả theo nhóm và lựa chọn nhóm trên Swagger UI
  - Phân biệt nhóm tài liệu với @Tag và phiên bản API
  - Tùy biến áp dụng riêng cho một nhóm
  - Chồng lấn nhóm, operation bị thiếu và cách kiểm tra phạm vi
  - Giữ siêu dữ liệu dùng chung mà không làm sai hợp đồng từng nhóm
- level1: Tùy biến lập trình
  level2:
  - OpenAPI bean và mô hình đối tượng của Swagger Core
  - OpenApiCustomizer cho các thay đổi ở cấp tài liệu
  - Phạm vi của customizer mặc định và customizer gắn với nhóm
  - GlobalOpenApiCustomizer khi cần tác động các tài liệu nhóm
  - OperationCustomizer và thông tin HandlerMethod
  - Bổ sung header, mã lỗi hoặc extension theo quy ước ứng dụng
  - Tùy biến schema bằng ModelConverter khi suy luận mặc định chưa đủ
  - Thay thế kiểu dùng chung bằng cấu hình SpringDocUtils phù hợp phiên bản
  - Đọc annotation riêng của ứng dụng để sinh siêu dữ liệu
  - Thứ tự thực thi và nguy cơ ghi đè giữa các customizer
  - Giữ tên, operationId và tham chiếu ổn định khi sửa mô hình
  - Đăng ký components đồng bộ với mọi $ref được bổ sung
  - Tính lặp lại an toàn và tránh nhân đôi dữ liệu khi tài liệu được xây lại
  - Kiểm thử customizer độc lập với việc giao diện có hiển thị đẹp hay không
- level1: Swagger UI
  level2:
  - Vai trò của Swagger UI như công cụ đọc và gọi thử API
  - Đường dẫn giao diện, tài nguyên tĩnh và swagger-config
  - Nguồn đặc tả từ một URL hoặc danh sách tài liệu
  - Chọn nhóm mặc định và tổ chức danh sách nhóm
  - Sắp xếp tag, operation và mức mở rộng mặc định
  - Tìm kiếm, lọc và hiển thị mô hình schema
  - Try it out và việc tạo yêu cầu HTTP thật
  - supportedSubmitMethods và giới hạn gọi thử từ giao diện
  - Hiển thị request, cURL, response và thời gian phản hồi
  - Thiết lập giá trị mặc định khác với ép hành vi của API
  - Lưu trạng thái xác thực trên giao diện và rủi ro trên máy dùng chung
  - Request interceptor, response interceptor và giới hạn tùy biến
  - Giới hạn đặt cookie và các header do trình duyệt quản lý
  - Mở rộng giao diện bằng tài nguyên hoặc cấu hình phù hợp phiên bản
  - Phân biệt lỗi đặc tả với lỗi hiển thị hoặc gửi request của trình duyệt
- level1: Mô tả bảo mật
  level2:
  - Security Scheme Object và Security Requirement Object
  - '@SecurityScheme để đăng ký cơ chế xác thực'
  - '@SecurityRequirement và tên tham chiếu phải khớp scheme'
  - HTTP Basic và HTTP Bearer
  - bearerFormat như thông tin mô tả định dạng token
  - API key trong header, query hoặc cookie
  - OAuth2 và OpenID Connect như cơ chế được mô tả trong hợp đồng
  - Yêu cầu bảo mật ở cấp tài liệu và cấp operation
  - Ghi đè yêu cầu toàn cục cho endpoint công khai
  - Nhiều scheme cùng bắt buộc so với nhiều phương án thay thế
  - Danh sách scope và ý nghĩa đối với operation
  - Bảo mật được khai báo không tự tạo SecurityFilterChain hoặc kiểm tra token
  - Mô tả 401, 403 và các header liên quan đúng hành vi thực tế
- level1: OAuth2 và OIDC
  level2:
  - OAuth Flows Object và các URL thuộc cấu hình mô tả
  - Authorization Code và hỗ trợ PKCE của công cụ giao diện
  - Client Credentials và bối cảnh sử dụng phù hợp
  - Luồng cũ hoặc không còn được khuyến nghị cần được nhận diện riêng
  - Scope được công bố, scope được yêu cầu và scope được cấp thực tế
  - Khai báo OpenID Connect discovery URL
  - Cấu hình OAuth client trên Swagger UI
  - OAuth redirect URL khi đổi domain hoặc đường dẫn ứng dụng
  - Ranh giới giữa Swagger UI với authorization server và resource server
  - Giới hạn giữ client secret trong ứng dụng chạy trên trình duyệt
  - CORS, redirect URI và nguyên nhân đăng nhập thành công nhưng gọi API thất bại
  - Kiểm thử token, scope và hết hạn mà không đưa thông tin nhạy cảm vào ví dụ
- level1: Bảo vệ tài liệu
  level2:
  - Phân biệt quyền đọc đặc tả, quyền mở giao diện và quyền gọi API
  - Quy tắc truy cập cho /v3/api-docs, swagger-config và tài nguyên giao diện
  - Bảo vệ endpoint đặc tả theo nhóm
  - Cấu hình Spring Security tương ứng với Servlet hoặc Reactive
  - Tài liệu công khai so với tài liệu chỉ dùng trong mạng nội bộ
  - Tắt riêng Swagger UI hoặc endpoint OpenAPI theo môi trường
  - Ẩn operation không thay thế xác thực hoặc phân quyền
  - Cookie phiên, CSRF và thao tác gọi thử làm thay đổi trạng thái
  - CORS chỉ tác động truy cập từ trình duyệt, không thay quyền truy cập máy chủ
  - Loại bỏ token, dữ liệu cá nhân và địa chỉ hạ tầng khỏi nội dung công bố
  - Kiểm tra chính sách truy cập sau khi triển khai thực tế
- level1: WebFlux và route hàm
  level2:
  - Chọn starter WebFlux phù hợp với ứng dụng Reactive
  - Mono, Flux và cách biểu diễn kiểu dữ liệu trả về
  - Phân biệt danh sách JSON với luồng dữ liệu liên tục
  - Mô tả text/event-stream hoặc kiểu nội dung luồng phù hợp
  - Giới hạn gọi thử và hiển thị luồng trên giao diện
  - RouterFunction, handler và lý do cần bổ sung siêu dữ liệu
  - '@RouterOperation cho một route chức năng'
  - '@RouterOperations cho nhiều route trong một bean'
  - Liên kết beanClass, beanMethod và chữ ký handler
  - Nhận diện route bằng path, HTTP method, consumes và produces
  - operationId và schema cần khai báo rõ cho route không suy luận đủ
  - Kiểm tra tài liệu Reactive với WebTestClient hoặc công cụ tương đương
- level1: Tích hợp Spring
  level2:
  - Spring Data REST và endpoint được tạo từ repository
  - Kiểm soát những tài nguyên repository xuất hiện trong hợp đồng
  - Spring HATEOAS và các lớp bao chứa liên kết
  - Actuator và lựa chọn có công bố endpoint quản trị hay không
  - Management port khác cổng ứng dụng và tác động đến giao diện
  - Spring Cloud Function Web và siêu dữ liệu cho hàm
  - 'Kotlin: khả năng nhận null, data class và tham số mặc định'
  - Javadoc như nguồn bổ sung mô tả khi được cấu hình hỗ trợ
  - Điều kiện biên dịch hoặc phụ thuộc cho tính năng đọc Javadoc
  - Các annotation trên interface và Controller kế thừa
  - Kiểm tra tính năng tích hợp theo đúng thế hệ Springdoc đang sử dụng
- level1: Proxy và đường dẫn
  level2:
  - Context path, servlet path và đường dẫn tài liệu tùy chỉnh
  - Cấu hình springdoc.api-docs.path và đường dẫn giao diện
  - Server URL được suy ra từ request hoặc khai báo tường minh
  - Reverse proxy, gateway và đường dẫn bên ngoài khác đường dẫn nội bộ
  - Forwarded, X-Forwarded-* và thông tin về scheme, host, prefix
  - Chiến lược xử lý forwarded headers của Spring Boot
  - Ranh giới tin cậy đối với header do proxy chuyển tiếp
  - HTTPS ở bên ngoài với HTTP giữa proxy và ứng dụng
  - ServerBaseUrlCustomizer khi cần điều chỉnh URL sinh ra
  - swagger-config và các URL tài nguyên phải cùng truy cập được
  - Lỗi mixed content, sai base URL và chuyển hướng lặp
  - Đối chiếu đường dẫn trên local, môi trường thử nghiệm và production
- level1: Cấu hình và vận hành
  level2:
  - Tổ chức thuộc tính springdoc trong application.yml hoặc properties
  - Ghi đè cấu hình theo profile và biến môi trường
  - Thuộc tính bật hoặc tắt endpoint đặc tả
  - Thuộc tính bật hoặc tắt Swagger UI
  - Giới hạn package, path, media type và header được đưa vào tài liệu
  - Thông tin phiên bản ứng dụng và metadata theo môi trường
  - Bản địa hóa mô tả và khả năng phân giải placeholder
  - Quy tắc escape, xuống dòng và giữ nội dung Markdown dễ đọc
  - Nạp trước, bộ nhớ đệm và thời điểm cập nhật tài liệu
  - Tránh phụ thuộc dữ liệu biến động khi xây hợp đồng
  - Ghi nhận cấu hình hiệu lực và đối chiếu đặc tả sau khởi động
- level1: OpenAPI theo phiên bản
  level2:
  - Phân biệt khả năng của đặc tả với khả năng của Springdoc và giao diện
  - Chọn đầu ra OpenAPI 3.0 hoặc 3.1 theo nhánh được hỗ trợ
  - Quan hệ của Schema Object với JSON Schema trong từng phiên bản
  - nullable trong 3.0 và biểu diễn kiểu null trong 3.1
  - Khác biệt về kiểu kết hợp, ràng buộc số và từ khóa schema
  - $ref và các thuộc tính đi kèm theo ngữ cảnh cùng phiên bản
  - jsonSchemaDialect và từ khóa JSON Schema cần đối chiếu khi dùng 3.1
  - Callback, webhook và các thay đổi trong cấu trúc đặc tả
  - Đánh giá OpenAPI 3.2 theo hỗ trợ thực tế của toàn bộ bộ công cụ
  - Kiểm tra tương thích với parser, UI, bộ sinh mã và công cụ kiểm thử
  - Không nâng trường openapi đơn thuần khi nội dung chưa được chuyển đổi đúng
- level1: Xuất đặc tả và CI
  level2:
  - Tải JSON hoặc YAML từ endpoint tài liệu đang chạy
  - Phân biệt xuất hợp đồng với sinh mã phía gọi hoặc mã máy chủ
  - 'Nguyên lý plugin Springdoc: chạy ứng dụng rồi lấy đặc tả qua HTTP'
  - Tích hợp Maven plugin vào giai đoạn phù hợp của vòng đời build
  - Tích hợp Gradle plugin và các tác vụ chạy ứng dụng, sinh đặc tả
  - Cấu hình địa chỉ tài liệu, thư mục và tên tệp đầu ra
  - Profile riêng để xuất tài liệu mà vẫn khởi động đủ mapping cần thiết
  - Cấp cấu hình kiểm thử thay vì phụ thuộc dịch vụ production khi build
  - Xuất từng nhóm và xác minh đúng tập endpoint
  - Sắp xếp đầu ra ổn định và xử lý metadata biến động
  - Lưu hợp đồng cùng phiên bản phát hành và thông tin nguồn
  - Dừng CI khi không lấy được đặc tả hoặc tài liệu không hợp lệ
  - Phân biệt hợp đồng được xuất lúc build với tài liệu của ứng dụng đang triển khai
- level1: Kiểm thử hợp đồng
  level2:
  - Kiểm tra endpoint đặc tả trả đúng mã trạng thái và kiểu nội dung
  - Đọc đặc tả bằng parser tương thích phiên bản
  - Xác minh path, HTTP method, operationId và tag
  - Kiểm tra mọi tham chiếu $ref có thể được phân giải
  - Xác minh tham số bắt buộc, mặc định và quy tắc tuần tự hóa
  - Kiểm tra request, response và schema lỗi
  - Đối chiếu ví dụ với schema mà ví dụ thuộc về
  - Kiểm tra hợp đồng sinh ra bằng MockMvc trong ứng dụng Servlet
  - Kiểm tra hợp đồng sinh ra bằng WebTestClient trong ứng dụng Reactive
  - So sánh payload HTTP thực với schema thay vì chỉ kiểm tra annotation
  - Kiểm tra từng nhóm, profile và cấu hình bảo mật tài liệu
  - Ảnh chụp hợp đồng và so sánh ngữ nghĩa thay vì chỉ so sánh định dạng
  - Smoke test giao diện và thao tác gọi thử trên môi trường phù hợp
  - Giới hạn của kiểm tra hợp đồng khi chưa có kiểm thử quy tắc nghiệp vụ
- level1: Tương thích và phân phối
  level2:
  - Nhận diện thay đổi phá vỡ hợp đồng đối với bên sử dụng
  - Đổi tên, bỏ hoặc thêm thuộc tính bắt buộc
  - Thu hẹp enum, đổi kiểu, format hoặc mã trạng thái
  - Khác biệt giữa tương thích đầu vào và đầu ra
  - Giữ operationId và tên schema ổn định qua các lần phát hành
  - Đánh dấu deprecated và mô tả lộ trình thay thế
  - Phân phối đặc tả tĩnh độc lập với ứng dụng chạy
  - Công bố nhiều phiên bản hoặc nhiều nhóm trên một giao diện
  - Tổng hợp tài liệu nhiều dịch vụ và xử lý URL máy chủ
  - Phân biệt liệt kê nhiều đặc tả với hợp nhất các đặc tả thành một
  - Theo dõi nguồn gốc, quyền sở hữu và phiên bản của tài liệu công bố
- level1: Hiệu năng và native image
  level2:
  - Phạm vi quét và ảnh hưởng đến số handler, schema phải xử lý
  - Chi phí xây dựng tài liệu lần đầu và các lần đọc sau
  - Bộ nhớ đệm dùng chung và customizer phụ thuộc request
  - Nạp trước theo nhóm hoặc ngôn ngữ khi phiên bản hỗ trợ
  - Giới hạn kích thước ví dụ và mô tả để giữ tài liệu dễ tải
  - Đo hiệu năng endpoint tài liệu riêng với API nghiệp vụ
  - GraalVM native image và điều kiện hỗ trợ của phiên bản thư viện
  - AOT, reflection và các kiểu chỉ xuất hiện trong siêu dữ liệu
  - Runtime hints cho phần mở rộng tùy chỉnh khi cần thiết
  - Kiểm tra đặc tả và tài nguyên giao diện trên bản native thực tế
  - Đối chiếu kết quả native với bản chạy trên JVM
- level1: Tích hợp mở rộng
  level2:
  - Scalar như lựa chọn giao diện bên cạnh Swagger UI
  - Chọn starter và thuộc tính Scalar theo nhánh Springdoc hỗ trợ
  - Dùng chung đặc tả nhưng kiểm tra riêng khả năng hiển thị của từng giao diện
  - Khác biệt giữa cấu hình Springdoc với cấu hình của công cụ giao diện
  - MCP trong những nhánh Springdoc có cung cấp tích hợp
  - Điều kiện phụ thuộc và cơ chế bật tường minh của tích hợp MCP
  - Ánh xạ operation thành công cụ và yêu cầu metadata rõ ràng
  - Phạm vi endpoint được phép công bố cho bên gọi công cụ
  - Xác thực, phân quyền và hành vi gọi API thật qua MCP
  - Giới hạn tương thích giữa Springdoc, Spring AI và phiên bản giao thức
  - Giữ tích hợp mới thành phần tùy chọn có kiểm thử riêng
- level1: Di chuyển và nâng cấp
  level2:
  - Lập đặc tả đối chiếu trước khi đổi thư viện hoặc nâng phiên bản
  - Chuyển cấu hình Docket của Springfox sang GroupedOpenApi khi phù hợp
  - Thay @Api, @ApiOperation và @ApiParam bằng annotation OpenAPI tương ứng
  - Thay @ApiModel và @ApiModelProperty bằng mô tả @Schema
  - Đổi annotation response hoặc hidden đúng package và ngữ cảnh
  - Chuyển artifact và package từ Springdoc v1 sang v2
  - Kiểm tra thay đổi Spring Boot, Jakarta và phụ thuộc Swagger Core
  - Đối chiếu thuộc tính cấu hình và giá trị mặc định sau nâng cấp
  - Giữ operationId, tên schema và đường dẫn tài liệu ổn định khi có thể
  - So sánh ngữ nghĩa của đặc tả trước và sau khi chuyển đổi
  - Kiểm tra lại bảo mật, proxy, UI và xuất đặc tả trong CI
  - Tách lỗi tương thích thư viện khỏi thay đổi hợp đồng API có chủ ý
- level1: Chẩn đoán sự cố
  level2:
  - Không có endpoint /v3/api-docs do sai starter hoặc cấu hình tắt
  - Swagger UI trả 404 dù endpoint đặc tả vẫn hoạt động
  - Giao diện không tải được swagger-config hoặc tài nguyên tĩnh
  - Đặc tả rỗng do điều kiện quét hoặc bộ lọc nhóm
  - Operation biến mất do @Hidden, kế thừa hoặc mapping không được nhận diện
  - Trùng operationId, path hoặc handler cho cùng HTTP method
  - Tham số bị mất tên và cấu hình biên dịch -parameters
  - Schema thiếu trường do Jackson, generic hoặc kiểu trả về quá tổng quát
  - Schema trùng tên hoặc tham chiếu $ref bị hỏng
  - Mã lỗi hoặc kiểu nội dung bị suy luận khác phản hồi thực tế
  - Lỗi 401, 403, CSRF hoặc CORS khi gọi thử
  - Sai URL máy chủ sau proxy hoặc khi dùng management port
  - Lỗi message converter khi thay cấu hình mặc định của Spring
  - NoSuchMethodError, ClassNotFoundException và xung đột phiên bản
  - Quy trình thu hẹp lỗi bằng đặc tả JSON, mapping và log liên quan
- level1: Thực hành tổng hợp
  level2:
  - Tài liệu hóa một API CRUD với hợp đồng thành công và lỗi đầy đủ
  - Mô tả DTO có validation, enum, ngày giờ và thuộc tính chỉ đọc
  - Tạo yêu cầu multipart gồm tệp và thông tin JSON
  - Mô tả API phân trang, lọc và sắp xếp
  - Phân nhóm API công khai, nội bộ và quản trị
  - Bổ sung metadata dùng chung bằng customizer có kiểm thử
  - Mô tả Bearer hoặc OAuth2 rồi kiểm chứng bằng cấu hình bảo mật thực
  - Tài liệu hóa cùng một miền API trên MVC và WebFlux
  - Triển khai sau reverse proxy và kiểm tra đường dẫn gọi thử
  - Xuất đặc tả trong CI và phát hiện thay đổi phá vỡ hợp đồng
  - Chẩn đoán một lỗi schema hoặc mapping từ dữ liệu quan sát
  - Rà soát độ rõ của mô tả, tính đúng của ví dụ và khả năng dùng của bên tích hợp
  - Bài tập tổng hợp từ Controller đến hợp đồng được kiểm chứng và phát hành
