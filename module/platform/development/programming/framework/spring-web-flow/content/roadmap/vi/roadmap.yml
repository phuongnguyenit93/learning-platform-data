roadmap:
- id: tong-quan-web-flow
  title: Tổng quan Web Flow
  purpose: Hiểu khi nào nên mô hình hóa quy trình Web nhiều bước bằng flow có trạng thái.
  objectives:
  - Nhận diện quy trình có điểm bắt đầu và kết thúc rõ ràng.
  - Phân biệt flow nhiều request với controller xử lý request đơn lẻ.
  - Phác thảo các bước của một luồng đăng ký hoặc đặt chỗ.
- id: thiet-lap-vong-doi
  title: Thiết lập & Vòng đời
  purpose: Tích hợp bộ máy chạy flow vào Spring MVC và hiểu cách phiên thực thi được quản lý.
  objectives:
  - Cấu hình FlowRegistry và FlowExecutor theo phiên bản sử dụng.
  - Kết nối FlowHandlerAdapter và cơ chế định tuyến đến flow.
  - Giải thích khởi tạo, tạm dừng, tiếp tục và kết thúc flow.
- id: states-transitions
  title: States & Transitions
  purpose: Biểu diễn điều hướng bằng các trạng thái và chuyển tiếp khai báo trong flow definition.
  objectives:
  - Khai báo flow, view-state và end-state bằng XML.
  - Định nghĩa sự kiện và transition giữa các state.
  - Vẽ đường đi chính, nhánh quay lại và nhánh hủy.
- id: actions-decisions
  title: Actions & Decisions
  purpose: Gọi nghiệp vụ và chọn nhánh điều hướng dựa trên kết quả xử lý.
  objectives:
  - Sử dụng evaluate để gọi Spring-managed services.
  - Phân biệt action-state với decision-state.
  - Xử lý outcome, lỗi nghiệp vụ và các điểm gọi action.
- id: du-lieu-scopes
  title: Dữ liệu & Scopes
  purpose: Duy trì dữ liệu phù hợp qua nhiều request mà không làm rò rỉ trạng thái.
  objectives:
  - Phân biệt requestScope, viewScope, flowScope và conversationScope.
  - Khai báo biến flow và tham chiếu qua expression language.
  - Truyền input và trả output khi flow hoàn thành.
- id: forms-validation
  title: Forms & Validation
  purpose: Ràng buộc dữ liệu biểu mẫu và kiểm tra hợp lệ qua từng bước của flow.
  objectives:
  - Liên kết view-state với model và form fields.
  - Cấu hình binding, type conversion và validation.
  - Hiển thị lỗi và giữ dữ liệu khi người dùng sửa form.
- id: subflows-tai-su-dung
  title: Subflows & Tái sử dụng
  purpose: Tách quy trình con để giảm trùng lặp và giữ định nghĩa flow dễ bảo trì.
  objectives:
  - Gọi subflow-state từ flow cha.
  - Ánh xạ input và xử lý output hoặc outcome của subflow.
  - Chọn ranh giới tái sử dụng cho bước chung giữa nhiều flow.
- id: persistence-security
  title: Persistence & Security
  purpose: Bảo vệ dữ liệu và quyền truy cập khi quy trình kéo dài nhiều bước.
  objectives:
  - Nhận diện vòng đời persistence context do flow quản lý khi cần.
  - Giới hạn truy cập flow/state với Spring Security phù hợp.
  - Cân nhắc commit, hủy và tránh xử lý giao dịch lặp.
- id: kiem-thu-van-hanh
  title: Kiểm thử & Vận hành
  purpose: Xác nhận luồng điều hướng và trạng thái hoạt động ổn định khi thay đổi ứng dụng.
  objectives:
  - Viết flow execution tests cho event, state và outcome.
  - Thử nhánh thành công, lỗi validation, hủy và subflow.
  - Kiểm tra tương thích phiên bản và theo dõi flow khi chạy thực tế.
