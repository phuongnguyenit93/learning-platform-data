  - Validation khi ánh xạ và phân loại lỗi chuyển đổi XML
  - Vòng đời bộ ánh xạ, sử dụng đồng thời và các phụ thuộc có trạng thái
  - Kiểm tra chuyển đổi hai chiều bằng bộ dữ liệu biên của hợp đồng
- level1: Kiến trúc xử lý
