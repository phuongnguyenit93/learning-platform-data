  - Thành phần phụ thuộc cho máy chủ, máy khách, OXM, bảo mật và kiểm thử
  - Khởi tạo bằng Spring Boot hoặc cấu hình Spring độc lập
  - Tổ chức thư mục hợp đồng, mã được sinh, endpoint, dịch vụ và client
  - Quản lý phụ thuộc SAAJ, JAXB và triển khai Jakarta XML cần thiết
  - Cấu hình Maven hoặc Gradle để sinh mã trong vòng đời build
  - Tách cấu hình theo môi trường và quản lý URL dịch vụ
  - Đóng gói WSDL, XSD và tài nguyên ánh xạ vào ứng dụng
  - Kiểm tra khởi động và thực hiện một trao đổi SOAP tối thiểu
- level1: Sinh mã JAXB
  level2:
