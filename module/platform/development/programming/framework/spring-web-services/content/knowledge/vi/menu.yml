  - Thứ tự kiểm tra dữ liệu, xác minh bảo mật và thực hiện nghiệp vụ
  - Kiểm thử cả dữ liệu biên, dữ liệu sai và phản hồi vi phạm hợp đồng
- level1: Interceptor
