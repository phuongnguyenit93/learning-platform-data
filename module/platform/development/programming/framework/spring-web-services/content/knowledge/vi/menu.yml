  - EndpointMapping, EndpointAdapter và EndpointExceptionResolver
  - MessageContext, thông điệp yêu cầu, phản hồi và thuộc tính xử lý
  - Ranh giới giữa transport, giao thức SOAP và nghiệp vụ ứng dụng
- level1: Cấu hình máy chủ
