menu:
- level1: Tổng quan Spring-WS
  level2:
  - Spring Web Services là gì và giải quyết bài toán tích hợp SOAP như thế nào
  - Thông điệp, hợp đồng, endpoint và máy khách trong một lần trao đổi
  - Phân biệt Spring-WS với Spring MVC, REST và WebSocket
  - 'Spring-WS, JAX-WS và Apache CXF: mô hình lập trình và ranh giới trách nhiệm'
  - Thiết kế từ hợp đồng (contract-first) và thiết kế từ mã (contract-last)
  - Vì sao mô hình đối tượng Java không ánh xạ hoàn toàn sang XML
  - Mối liên hệ giữa XML, XSD, WSDL, SOAP và các chuẩn WS-*
  - Khi nào SOAP phù hợp và những đánh đổi về độ phức tạp, hiệu năng
  - Kiến thức tiên quyết và lộ trình từ hợp đồng đến dịch vụ được kiểm chứng
- level1: Nền tảng XML
  level2:
  - Tài liệu XML, phần tử, thuộc tính, nội dung văn bản và tính hợp lệ cú pháp
  - Namespace, URI, prefix và tên đầy đủ QName
  - Namespace mặc định và sự khác nhau giữa tên phần tử với tên thuộc tính
  - Khai báo XML, bảng mã và xử lý ký tự đặc biệt
  - Không có phần tử, phần tử rỗng và giá trị xsi:nil
  - Thứ tự phần tử, nội dung trộn và những khác biệt có ý nghĩa trong hợp đồng
  - DOM, SAX, StAX và lựa chọn cách xử lý XML
  - XPath, ngữ cảnh namespace và lựa chọn nút dữ liệu
  - XSLT, biến đổi cấu trúc và ranh giới với ánh xạ đối tượng
  - So sánh XML theo ngữ nghĩa thay vì so sánh chuỗi prefix và khoảng trắng
- level1: Giao thức SOAP
  level2:
  - SOAP Envelope, Header, Body và vai trò của từng thành phần
  - 'SOAP 1.1 và SOAP 1.2: namespace, kiểu nội dung và cách biểu diễn lỗi'
  - Payload ứng dụng và phong bì SOAP là hai lớp khác nhau
  - Header ứng dụng, header WS-* và HTTP header
  - mustUnderstand, actor, role và trách nhiệm xử lý header
  - SOAPAction trong SOAP 1.1 và tham số action trong SOAP 1.2
  - Trao đổi yêu cầu, phản hồi và thông điệp một chiều
  - SOAP qua HTTP và sự độc lập giữa thông điệp với phương tiện truyền tải
  - SOAP Fault, mã trạng thái HTTP và lỗi kết nối
  - Document/literal, RPC và ý nghĩa của kiểu liên kết trong WSDL
  - Đọc một yêu cầu, phản hồi SOAP hoàn chỉnh từ dữ liệu truyền thực tế
- level1: Thiết kế hợp đồng
  level2:
  - Xác định các thao tác nghiệp vụ và ranh giới dịch vụ
  - Thiết kế thông điệp yêu cầu, phản hồi trước khi viết endpoint
  - Hợp đồng dữ liệu và hợp đồng dịch vụ bổ sung cho nhau
  - 'Document/literal wrapped và bare: cấu trúc thông điệp và lựa chọn'
  - Tách mô hình trao đổi khỏi thực thể lưu trữ và mô hình nội bộ
  - Đặt tên namespace, phần tử và thao tác có tính ổn định
  - Quy định trường bắt buộc, giá trị thiếu và ngữ nghĩa mặc định
  - Thiết kế lỗi nghiệp vụ thành hợp đồng có cấu trúc
  - Định nghĩa giới hạn dữ liệu, kích thước thông điệp và yêu cầu bảo mật
  - Kiểm tra hợp đồng bằng ví dụ hợp lệ, không hợp lệ và phản hồi lỗi
- level1: Thiết kế XSD
  level2:
  - xs:schema, targetNamespace và elementFormDefault
  - Phần tử toàn cục, kiểu có tên và phạm vi tái sử dụng
  - simpleType, complexType và thuộc tính của cấu trúc dữ liệu
  - sequence, choice, all và ràng buộc thứ tự phần tử
  - minOccurs, maxOccurs và mô hình hóa danh sách
  - optional, nillable, default, fixed và sự khác biệt khi nhận dữ liệu
  - Ràng buộc kiểu bằng enumeration, pattern, độ dài và miền giá trị
  - Kiểu số, decimal, ngày giờ, múi giờ và ánh xạ phù hợp
  - xs:include, xs:import và phân chia schema theo namespace
  - Kiểu mở rộng, kiểu hạn chế và đánh đổi khi dùng kế thừa trong schema
  - xs:any, điểm mở rộng và giới hạn của khả năng tiến hóa hợp đồng
  - Phát hiện schema không hợp lệ và giải quyết tham chiếu giữa các tệp
  - Thiết kế schema theo khả năng tương tác của các nền tảng khác nhau
- level1: Đọc và công bố WSDL
  level2:
  - 'WSDL 1.1: types, message, portType, binding và service'
  - Operation, input, output, fault và liên hệ với các phần tử XSD
  - SOAP binding, transport, action và địa chỉ dịch vụ
  - Tách giao diện trừu tượng khỏi cấu hình địa chỉ triển khai
  - WSDL tĩnh và WSDL được tạo từ XSD
  - SimpleWsdl11Definition và sử dụng hợp đồng đã được phê duyệt
  - DefaultWsdl11Definition và quy ước nhận diện yêu cầu, phản hồi
  - Công bố XSD qua XsdSchema và tập hợp nhiều schema
  - Tên bean, URL WSDL và đường dẫn tài nguyên schema
  - Biến đổi địa chỉ WSDL sau reverse proxy và cấu hình đường dẫn bên ngoài
  - Kiểm chứng WSDL tải được cùng toàn bộ XSD được import
- level1: Khởi tạo dự án
