  - ActionCallback và thiết lập header ở phía máy khách
  - Phiên bản WS-Addressing và yêu cầu tương thích giữa hai phía
  - Phản hồi cùng kênh, phản hồi khác kênh và phạm vi hỗ trợ theo phiên bản
  - Kiểm soát đích ReplyTo, FaultTo do bên gửi thông điệp cung cấp
  - Phân biệt WS-Addressing với giao nhận tin cậy và điều phối giao dịch
- level1: Tệp đính kèm
  level2:
  - Dữ liệu nhị phân trong XML và chi phí biểu diễn base64
  - SOAP with Attachments, MTOM, XOP và các mục đích khác nhau
  - MIME multipart, Content-ID và liên kết dữ liệu với payload
  - MimeMessage, Attachment và truy cập tệp đính kèm
  - Jaxb2Marshaller, mtomEnabled và ánh xạ dữ liệu nhị phân
  - DataHandler, DataSource và các kiểu Jakarta Activation
  - Cấu hình message factory hỗ trợ tệp đính kèm theo phiên bản
  - Giới hạn kích thước, bộ đệm, tệp tạm và vòng đời luồng dữ liệu
  - Loại nội dung, tên tệp và kiểm tra dữ liệu nhận được
  - Kiểm chứng tương thích MTOM giữa máy chủ và máy khách
- level1: Bảo vệ xử lý XML
  level2:
  - Ranh giới tin cậy từ byte nhận được đến mô hình dữ liệu ứng dụng
  - DTD, external entity và điều kiện dẫn đến XXE
  - Ngăn phân giải tài nguyên ngoài tại parser, marshaller và transformer
  - Giới hạn độ sâu, số phần tử, độ dài và mở rộng thực thể
  - Schema import, XSLT import và truy cập tài nguyên ngoài không được kiểm soát
  - Dùng schema tin cậy, phân giải cục bộ và kiểm soát tài nguyên hợp đồng
  - Tránh ghép XPath hoặc XSLT từ dữ liệu không đáng tin
  - Giới hạn kích thước SOAP, multipart và dữ liệu sau giải nén
  - Xác minh cấu hình bảo vệ trên đúng implementation đang sử dụng
  - Kiểm thử parser từ chối dữ liệu nguy hiểm mà không lộ nội dung hệ thống
- level1: WS-Security
  level2:
  - Bảo mật tầng truyền tải và bảo mật thông điệp bảo vệ những phạm vi nào
  - WS-Security header, token, timestamp, chữ ký và mã hóa
  - Wss4jSecurityInterceptor và tích hợp Apache WSS4J
  - validationActions, securementActions và thứ tự thực hiện hành động
  - UsernameToken, PasswordText, PasswordDigest và giới hạn bảo vệ mật khẩu
  - CallbackHandler và lấy thông tin xác thực từ nguồn được quản lý
  - Timestamp, độ lệch đồng hồ, nonce và phát hiện phát lại
  - Xác minh chữ ký, chuỗi tin cậy và phần thông điệp thực sự được ký
  - Ký thông điệp gửi đi và lựa chọn các phần phải được bảo vệ
  - Mã hóa, giải mã, thứ tự ký và mã hóa giữa hai phía
  - Yêu cầu bảo mật bắt buộc, header bị thiếu và tránh đường đi bỏ qua xác minh
  - Phạm vi interceptor bảo mật phải nhất quán với cơ chế định tuyến
  - Lỗi xác minh, SOAP Fault và bảo vệ phản hồi theo khả năng hỗ trợ
- level1: Chứng chỉ và khóa
  level2:
  - Keystore, truststore, khóa riêng và chứng chỉ công khai
  - Định dạng lưu khóa, alias và lựa chọn khóa theo mục đích
  - CryptoFactoryBean và cấu hình Crypto cho WSS4J
  - Kiểm tra chuỗi chứng chỉ, thời hạn và mục đích sử dụng khóa
  - Khóa ký, khóa mã hóa và mối quan hệ giữa bên gửi với bên nhận
  - Quản lý mật khẩu kho khóa và tách bí mật khỏi mã nguồn
  - Luân chuyển chứng chỉ, giai đoạn chuyển tiếp và khôi phục cấu hình
  - Phân biệt chứng chỉ dùng cho TLS với chứng chỉ bảo vệ thông điệp
  - Kiểm thử chứng chỉ hết hạn, không tin cậy và thiếu khóa phù hợp
- level1: Tích hợp Spring Security
  level2:
  - SecurityFilterChain ở tầng HTTP và interceptor ở tầng SOAP
  - Xác thực HTTP Basic, TLS phía máy khách và WS-Security UsernameToken
  - UserDetailsService và callback xác minh danh tính cho WS-Security
  - Khác biệt giữa xác minh token với cơ chế lưu mật khẩu của ứng dụng
  - Kiểm chứng Authentication, SecurityContext và đường truyền danh tính
  - Phân quyền theo thao tác nghiệp vụ và bảo vệ lớp dịch vụ
  - Không dùng header nghiệp vụ chưa xác thực làm nguồn cấp quyền
  - Bảo vệ URL SOAP, WSDL, XSD và các tài nguyên quản trị theo mục đích
  - CSRF, yêu cầu SOAP POST và thiết kế ngoại lệ có phạm vi phù hợp
  - Phân biệt HTTP 401, HTTP 403 với SOAP Fault bảo mật
- level1: Truyền tải mở rộng
  level2:
  - Tách xử lý SOAP khỏi HTTP và kiểm tra transport được phiên bản hỗ trợ
  - Gửi, nhận SOAP qua JMS và cấu hình bên nghe thông điệp
  - BytesMessage, TextMessage và yêu cầu tương thích giữa hai phía
  - JMSReplyTo, correlation và ghép yêu cầu với phản hồi
  - Thông điệp một chiều, phản hồi và giới hạn thời gian chờ
  - Xác nhận JMS, giao dịch cục bộ và giới hạn đối với nghiệp vụ từ xa
  - Tổng quan transport email, XMPP và nhu cầu tích hợp chuyên biệt
  - HTTP server nhúng và lựa chọn môi trường triển khai phù hợp
  - Kiểm soát đích phản hồi khác kênh và các kết nối do thông điệp kích hoạt
- level1: Tương thích hợp đồng
  level2:
  - Tương thích cấu trúc, tương thích ngữ nghĩa và tương thích mã đã được sinh
  - Thêm phần tử tùy chọn và kiểm chứng hành vi của client cũ
  - Thay đổi kiểu, thứ tự, số lần xuất hiện và trường bắt buộc
  - Giá trị enum mới và giới hạn của mô hình JAXB được sinh trước đó
  - Chiến lược version theo namespace, endpoint hoặc hợp đồng công bố
  - Hỗ trợ song song hợp đồng cũ, mới và định tuyến rõ ràng
  - Chuyển đổi bằng XSLT và xác định giới hạn chuyển đổi hai chiều
  - Quản lý WSDL tĩnh, XSD dùng chung và bộ tạo tác hợp đồng
  - WS-I Basic Profile và kiểm chứng khả năng tương tác ngoài Java
  - Quy trình thông báo thay đổi, ngừng hỗ trợ và kiểm tra client phụ thuộc
- level1: Kiểm thử máy chủ
  level2:
  - Kiểm thử nghiệp vụ thuần và kiểm thử endpoint là các phạm vi khác nhau
  - MockWebServiceClient và tạo client từ ApplicationContext
  - RequestCreator, RequestCreators và tạo yêu cầu từ payload hoặc envelope
  - ResponseMatcher, ResponseMatchers và khai báo phản hồi mong đợi
  - So khớp XML, XPath và namespace trong dữ liệu phản hồi
  - Kiểm tra payload đúng XSD và các trường hợp không hợp lệ
  - Kiểm tra header, mustUnderstand và các loại SOAP Fault
  - Kiểm tra interceptor, mapping và hợp đồng chữ ký endpoint
  - Kiểm thử xác thực, phân quyền và đường đi bị từ chối
  - Lát cắt kiểm thử Spring Boot và cấu hình theo phiên bản đang dùng
  - Giới hạn của mock khi chưa đi qua HTTP server và bộ lọc thật
- level1: Kiểm thử máy khách
  level2:
  - MockWebServiceServer và gắn với WebServiceTemplate cần kiểm thử
  - RequestMatcher, RequestMatchers và kiểm tra thông điệp được gửi
  - So khớp payload, namespace, header và action của lời gọi
  - ResponseCreator, ResponseCreators và tạo phản hồi mô phỏng
  - Mô phỏng SOAP Fault, lỗi truyền tải và nội dung không đọc được
  - Kiểm tra marshalling, unmarshalling và ánh xạ lỗi về nghiệp vụ
  - Kiểm tra callback, interceptor và thông tin tương quan
  - Thứ tự kỳ vọng, xác nhận lời gọi đã diễn ra và phát hiện thiếu lời gọi
  - Tạo matcher, response tùy chỉnh cho quy tắc hợp đồng riêng
  - Kiểm thử logic thử lại và bảo đảm không lặp tác dụng nghiệp vụ
  - Những lỗi timeout, TLS, proxy cần kiểm thử thêm qua transport thật
- level1: Kiểm thử tích hợp
  level2:
  - Khởi động máy chủ và client với HTTP transport thực tế
  - Kiểm tra URL WSDL, XSD import và địa chỉ dịch vụ sau triển khai
  - Ma trận SOAP 1.1, SOAP 1.2, Content-Type và action
  - Kiểm tra HTTP status, SOAP Fault và phản hồi không phải XML
  - Trao đổi MTOM và xác nhận toàn vẹn dữ liệu nhị phân
  - Kiểm chứng chữ ký, mã hóa, UsernameToken và timestamp giữa hai phía
  - Kiểm tra từ chối thông điệp sai bảo mật trước khi chạy nghiệp vụ
  - Tương tác với client ngoài Java và các khác biệt trong mã được sinh
  - Mô phỏng kết nối chậm, lỗi giữa chừng và giới hạn kích thước
  - Kiểm thử hợp đồng cũ, mới bằng bộ thông điệp đã được lưu làm mẫu
- level1: Hiệu năng và vận hành
  level2:
  - 'Đo độ trễ theo từng lớp: transport, XML, bảo mật và nghiệp vụ'
  - Kích thước payload, JAXB, DOM và mức sử dụng bộ nhớ
  - Streaming, payload caching và các thao tác làm tiêu thụ luồng dữ liệu
  - Chi phí validation, biến đổi XSLT, ký và mã hóa
  - Tái sử dụng cấu hình client, JAXB context và nhóm kết nối
  - Giới hạn luồng servlet, số kết nối và số yêu cầu đang xử lý
  - Timeout theo giai đoạn và chính sách thử lại có kiểm soát
  - Đánh đổi giữa base64, MTOM và lưu tệp tạm
  - Giới hạn tải, áp lực tài nguyên và bảo vệ dịch vụ phụ thuộc
  - Reverse proxy, cân bằng tải và địa chỉ WSDL công bố bên ngoài
  - Tắt có trật tự, thu hồi kết nối và xử lý yêu cầu chưa hoàn tất
- level1: Quan sát và chẩn đoán
  level2:
  - Log, metric, trace và thông tin cần để theo dõi một lời gọi SOAP
  - Message tracing của Spring-WS ở phía máy chủ và máy khách
  - Phân biệt ghi payload với ghi toàn bộ SOAP envelope
  - Che dữ liệu cá nhân, token, thông tin xác thực và nội dung nhạy cảm
  - 'Không tìm thấy endpoint: kiểm tra URL, QName, mapping và action'
  - 'Lỗi JAXB: phần tử không mong đợi, thiếu context và khác namespace'
  - 'Lỗi adapter: chữ ký phương thức và kiểu tham số không được hỗ trợ'
  - Lỗi SOAP version, Content-Type, charset và nội dung HTML từ proxy
  - 'Lỗi WS-Security: đồng hồ, khóa, chứng chỉ và phần dữ liệu được bảo vệ'
  - Lỗi cạn kết nối, timeout và yêu cầu chờ không được giải phóng
  - Định danh tương quan và quy trình thu bằng chứng mà không làm lộ bí mật
- level1: Nâng cấp và di chuyển
  level2:
  - Đọc ma trận tương thích trước khi thay đổi JDK, Boot, Spring-WS hoặc WSS4J
  - Chuyển javax sang jakarta cho JAXB, SAAJ và Activation đúng phạm vi
  - Những package Java SE như javax.xml.transform vẫn giữ tên cũ
  - Đối chiếu mã được sinh, plugin sinh mã và implementation XML khi nâng cấp
  - Tên starter, cấu hình tự động và hỗ trợ kiểm thử khác nhau giữa các dòng Boot
  - Chuyển thư viện HTTP, cấu hình timeout và nhóm kết nối
  - Cấu hình WsConfigurer, API bị thay thế và khác biệt chữ ký mở rộng
  - Kiểm tra khả năng hỗ trợ của message factory và transport đang dùng
  - Giữ WSDL, XSD, payload mẫu và kiểm thử tương thích làm mốc xác nhận
- level1: Thực hành tổng hợp
  level2:
  - Thiết kế XSD, WSDL cho dịch vụ tra cứu và tạo lịch hẹn
  - Sinh lớp JAXB và hiện thực endpoint dựa trên hợp đồng
  - Công bố WSDL, XSD rồi tạo client gọi dịch vụ qua HTTP
  - Bổ sung header tương quan và kiểm chứng định tuyến
  - Xây dựng validation và SOAP Fault nghiệp vụ có detail theo schema
  - Bảo vệ một thao tác bằng WS-Security và phân quyền ở lớp dịch vụ
  - Trao đổi tệp đính kèm bằng MTOM và kiểm tra giới hạn dữ liệu
  - Viết kiểm thử mock cho máy chủ, máy khách và kiểm thử transport thực tế
  - Thêm phiên bản hợp đồng mới và kiểm chứng client cũ vẫn hoạt động
  - Đo tác động của kích thước payload, kết nối và bảo mật lên hiệu năng
  - Triển khai sau reverse proxy và chẩn đoán một lỗi kết nối hoặc hợp đồng
