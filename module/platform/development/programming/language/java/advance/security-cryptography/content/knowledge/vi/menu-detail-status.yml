  - slug: jar-xml-signatures-001
    title: 19.1 Chữ ký JAR, manifest, digest entry và chuỗi chứng thư của người ký
    status: WRITTEN
    difficult: INTERMEDIATE
    focus: ''
    problemSolved: ''
