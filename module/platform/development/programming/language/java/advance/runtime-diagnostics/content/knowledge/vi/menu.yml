  - 19.8 Bảo vệ cổng debug và giới hạn sử dụng debugger trên tiến trình đang phục vụ
- level1: 20. Crash và phân tích sau lỗi
  level2:
  - 20.1 Phân biệt exception Java, OutOfMemoryError, StackOverflowError và fatal VM error
  - 20.2 Thu hs_err_pid log với -XX:ErrorFile và giữ dữ liệu ngay sau sự cố
  - 20.3 Đọc header lỗi, problematic frame, current thread và danh sách thư viện
  - 20.4 Đối chiếu heap, thread, VM flags, hệ điều hành và tài nguyên tại thời điểm crash
  - 20.5 Phân biệt dấu hiệu lỗi trong native library, JVM hoặc mã được JIT biên dịch
  - 20.6 Core dump, executable và yêu cầu tương thích JDK hoặc kiến trúc khi phân tích
  - 20.7 Vai trò của jhsdb jstack, jmap, jinfo và clhsdb đối với core hoặc JVM
  - 20.8 Ảnh hưởng nghiêm trọng khi jhsdb attach trực tiếp vào tiến trình sống
  - 20.9 Phân biệt JVM tự ghi lỗi với tiến trình bị hệ điều hành chấm dứt
  - 20.10 Lập gói bằng chứng tối thiểu và tình huống tái hiện cho việc điều tra tiếp
- level1: 21. Thu thập khi vận hành
  level2:
  - 21.1 Thiết kế bộ dữ liệu nền gồm thông tin VM, GC log và JFR theo ngân sách tài nguyên
  - 21.2 Lập thứ tự thu thập theo triệu chứng và thời gian còn lại trước khi sự cố biến mất
  - 21.3 Ưu tiên bằng chứng ít ảnh hưởng rồi đánh giá nhu cầu dump hoặc cấu hình chi tiết
  - 21.4 Đặt điều kiện dừng, dung lượng tối đa và thời hạn giữ file chẩn đoán
  - 21.5 Quản lý truy cập heap dump, JFR, command line, system property và cổng quản lý
  - 21.6 Đặt tên file kèm PID, thời gian, phiên bản ứng dụng và hành động đã thực hiện
  - 21.7 Xử lý giới hạn quyền attach, filesystem chỉ đọc hoặc môi trường thiếu công cụ JDK
  - 21.8 Tránh làm mất bằng chứng khi restart và ghi rõ các tác động do lệnh chẩn đoán tạo ra
  - 21.9 Xác nhận phục hồi, so sánh với mốc bình thường và lưu kết luận có căn cứ
- level1: 22. Thực hành tổng hợp
  level2:
  - 22.1 Tạo ứng dụng mẫu với tên thread, chỉ số cơ bản và custom JFR event
  - 22.2 Chẩn đoán vòng lặp tốn CPU bằng jcmd, thread dump và JFR
  - 22.3 Tái hiện deadlock rồi dựng vòng chờ từ nhiều nguồn bằng chứng
  - 22.4 Tái hiện pool bão hòa và tách thời gian chờ hàng đợi khỏi thời gian chạy
  - 22.5 Tái hiện giữ tham chiếu trong collection và lần theo GC root trong heap dump
  - 22.6 So sánh bộ nhớ tiến trình, heap, NMT và direct buffer trong một tình huống tăng bộ nhớ
  - 22.7 Thu và phân tích GC log cùng JFR trong một giai đoạn cấp phát mạnh
  - 22.8 Điều tra pinning của virtual thread trong môi trường Java 21
  - 22.9 Đọc một fatal error log mẫu và phân loại bằng chứng cần bổ sung
  - 22.10 Viết báo cáo triệu chứng, giả thuyết, bằng chứng, thay đổi và kết quả kiểm chứng
