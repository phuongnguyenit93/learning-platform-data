menu:
- level1: 1. Mô hình chẩn đoán
  level2:
  - 1.1 Chẩn đoán lúc chạy là gì và khác gì với sửa lỗi từ mã nguồn
  - 1.2 Quan hệ giữa ứng dụng, JVM, JDK, hệ điều hành và tài nguyên máy
  - 1.3 Phân biệt lỗi chức năng, độ trễ, thông lượng, treo, thiếu bộ nhớ và JVM crash
  - 1.4 Bản đồ log, chỉ số, stack trace, thread dump, heap dump và bản ghi JFR
  - 1.5 Từ triệu chứng đến giả thuyết, bằng chứng và nguyên nhân gốc
  - 1.6 Phân biệt quan sát, profiling, debugging và thay đổi cấu hình đang chạy
  - 1.7 Chọn công cụ theo câu hỏi cần trả lời và mức ảnh hưởng cho phép
  - 1.8 Phạm vi API chuẩn Java 21, công cụ HotSpot và khả năng thay đổi theo phiên bản
- level1: 2. Phương pháp đo
  level2:
  - 2.1 Xác định tình huống tái hiện, tải đầu vào và tiêu chí hoàn thành chẩn đoán
  - 2.2 Lập mốc so sánh ở trạng thái bình thường và ghi lại điều kiện đo
  - 2.3 Phân biệt thời gian thực trôi qua, CPU time và thời gian chờ
  - 2.4 Chỉ số tức thời, bộ đếm tích lũy, tốc độ thay đổi và phân bố độ trễ
  - 2.5 Chọn khoảng lấy mẫu, thời lượng quan sát và cửa sổ xảy ra sự cố
  - 2.6 Đồng bộ timestamp, múi giờ và uptime khi ghép nhiều nguồn dữ liệu
  - 2.7 Nhận diện sai lệch do khởi động, JIT, GC, lấy mẫu và chính công cụ quan sát
  - 2.8 Kiểm chứng một thay đổi dưới cùng tải và ghi rõ giới hạn của kết luận
- level1: 3. Tiến trình và môi trường
  level2:
  - 3.1 Nhận diện đúng JVM bằng PID, lệnh khởi chạy, thời điểm bắt đầu và người sở hữu
  - 3.2 Dùng jcmd, jps và ProcessHandle để khám phá tiến trình; hiểu giới hạn thông tin trả về
  - 3.3 Thu thập phiên bản, nhà cung cấp JDK, kiến trúc và đối số JVM thực tế
  - 3.4 VM.command_line, VM.flags, VM.system_properties và VM.info
  - 3.5 Classpath, module path, thư viện native và cấu hình môi trường liên quan
  - 3.6 Phân biệt PID của container với PID trên máy chủ
  - 3.7 Đối chiếu giới hạn CPU, bộ nhớ và tài nguyên nhìn thấy từ JVM với môi trường triển khai
  - 3.8 Phân biệt thông tin có sẵn với thông tin nhạy cảm cần loại bỏ trước khi chia sẻ
- level1: 4. Công cụ jcmd
  level2:
  - 4.1 Mô hình gửi diagnostic command tới một JVM đang chạy
  - 4.2 Điều kiện cùng máy, quyền người dùng và khả năng attach
  - 4.3 Khám phá lệnh bằng help và đọc cú pháp, tùy chọn, mức Impact của từng lệnh
  - 4.4 Nhóm lệnh thông tin VM, luồng, heap, compiler, JFR và native memory
  - 4.5 Chọn đường dẫn đầu ra theo ngữ cảnh của JVM đích và kiểm tra dung lượng còn lại
  - 4.6 Phân biệt lệnh quan sát với lệnh có thể gây GC, dump hoặc thay đổi trạng thái
  - 4.7 Xử lý sai PID, tiến trình đã thoát, attach bị vô hiệu và công cụ không tương thích
  - 4.8 Vai trò bổ sung và trạng thái experimental của jstack, jmap, jinfo hoặc jstat
- level1: 5. Nhật ký và stack trace
  level2:
  - 5.1 Phân biệt nhật ký ứng dụng với JVM Unified Logging
  - 5.2 Ghi mức log, thread, thời gian và mã tương quan đủ để lần theo một thao tác
  - 5.3 java.util.logging với Logger, Handler, Formatter và cấu hình mức ghi
  - 5.4 Đọc exception, cause chain, suppressed exception và stack frame
  - 5.5 Thu thập lỗi không được bắt qua UncaughtExceptionHandler
  - 5.6 StackWalker và việc lấy ngăn xếp có mục đích trong mã chẩn đoán
  - 5.7 Cú pháp -Xlog với tag, level, decorator, file và xoay vòng nhật ký
  - 5.8 Khám phá tag khả dụng và đổi cấu hình ghi bằng VM.log
  - 5.9 Kiểm soát khối lượng log, dữ liệu bí mật và tác động của việc ghi đồng bộ
- level1: 6. MXBeans
  level2:
  - 6.1 ManagementFactory, platform MXBean và ranh giới giữa API chuẩn với phần mở rộng HotSpot
  - 6.2 RuntimeMXBean cho uptime, thông tin VM và đối số đầu vào
  - 6.3 MemoryMXBean, MemoryPoolMXBean và ý nghĩa used, committed, max, init
  - 6.4 GarbageCollectorMXBean cho số lần, thời gian GC và giới hạn của số liệu tổng
  - 6.5 ThreadMXBean cho số platform thread, CPU time, contention và phát hiện deadlock
  - 6.6 Kiểm tra khả năng hỗ trợ, trạng thái bật và giá trị không khả dụng của chỉ số
  - 6.7 OperatingSystemMXBean cho tải CPU, thời gian CPU và bộ nhớ của môi trường
  - 6.8 BufferPoolMXBean và ClassLoadingMXBean cho bộ đệm ngoài heap hoặc lớp được nạp
  - 6.9 Memory threshold notification và cách tránh xử lý nặng ngay trong callback
  - 6.10 HotSpotDiagnosticMXBean cho heap dump và VM option có thể quản lý
- level1: 7. JMX
  level2:
  - 7.1 MBeanServer, ObjectName, attribute, operation và notification
  - 7.2 Truy cập MXBean trực tiếp, qua MBeanServerConnection hoặc proxy
  - 7.3 JConsole để xem biểu đồ, thuộc tính và thao tác quản lý JVM
  - 7.4 Kết nối JMX cục bộ qua management agent và vai trò của Attach API
  - 7.5 Kết nối từ xa qua JMX connector, RMI registry và cấu hình cổng
  - 7.6 Xác thực, TLS và phân quyền đọc hoặc điều khiển trên kênh quản lý
  - 7.7 Xuất MBean cho chỉ số riêng của ứng dụng với kiểu dữ liệu phù hợp
  - 7.8 Quản lý kết nối, tần suất truy vấn và giới hạn cardinality của dữ liệu giám sát
- level1: 8. Thread dump
  level2:
  - 8.1 Thread dump cung cấp ảnh chụp gì và những gì không thể suy ra từ một ảnh
  - 8.2 Lấy stack bằng Thread.print, jstack hoặc cơ chế tín hiệu được hệ điều hành hỗ trợ
  - 8.3 Đọc tên thread, Java thread id, native id, trạng thái và các stack frame
  - 8.4 Phân biệt RUNNABLE, BLOCKED, WAITING và TIMED_WAITING
  - 8.5 Đọc monitor đang giữ, khóa đang chờ và ownable synchronizer
  - 8.6 Thu nhiều thread dump cách nhau một khoảng để xác định tiến triển
  - 8.7 Đối chiếu native thread id với số liệu CPU của hệ điều hành
  - 8.8 Phân biệt thread đang đợi công việc bình thường với thread đang chặn xử lý
  - 8.9 Nhận diện giới hạn của thread dump truyền thống đối với virtual thread
- level1: 9. Treo và tranh chấp
  level2:
  - 9.1 Phân biệt deadlock, livelock, starvation và thao tác chờ quá lâu
  - 9.2 Lần theo chuỗi chủ sở hữu khóa và dựng vòng chờ từ thread dump
  - 9.3 findMonitorDeadlockedThreads, findDeadlockedThreads và phạm vi platform thread
  - 9.4 Chẩn đoán synchronized, ReentrantLock, Condition, Object.wait và LockSupport.park
  - 9.5 Phân biệt tranh chấp monitor với việc chờ I/O hoặc chờ kết quả Future
  - 9.6 Thread pool bão hòa, hàng đợi tăng và tác vụ phụ thuộc lẫn nhau
  - 9.7 Đối chiếu số tác vụ đang chạy, đã hoàn thành, bị từ chối và độ dài hàng đợi
  - 9.8 Kết hợp thread dump với JFR JavaMonitorEnter, JavaMonitorWait và ThreadPark
  - 9.9 Kiểm chứng tiến triển sau sửa lỗi bằng số thao tác hoàn thành và thời gian chờ
- level1: 10. Virtual thread
  level2:
  - 10.1 Quan hệ giữa virtual thread, carrier thread và platform thread trong Java 21
  - 10.2 Vì sao số platform thread không đại diện cho tổng số virtual thread
  - 10.3 Lấy thread dump có virtual thread bằng Thread.dump_to_file với plain hoặc JSON
  - 10.4 Giới hạn ThreadMXBean và các công cụ chỉ quan sát platform thread
  - 10.5 Chẩn đoán pinning trên Java 21 bằng JFR và jdk.tracePinnedThreads
  - 10.6 Quan sát VirtualThreadPinned, VirtualThreadSubmitFailed và cấu hình event liên quan
  - 10.7 Phân biệt thiếu carrier, tài nguyên bên ngoài bão hòa và tác vụ tốn CPU
  - 10.8 Đối chiếu hành vi và công cụ theo phiên bản JDK khi phân tích virtual thread
- level1: 11. Heap và GC
  level2:
  - 11.1 Phân biệt heap, non-heap, bộ nhớ tiến trình và giới hạn -Xmx
  - 11.2 Đọc đồ thị heap theo thời gian và lượng dữ liệu còn sống sau chu kỳ thu gom
  - 11.3 Allocation rate, thời gian sống đối tượng và áp lực lên bộ thu gom
  - 11.4 Đọc GC log theo collector đang dùng thay vì áp một mô hình vùng nhớ cố định
  - 11.5 Phân biệt tần suất GC, tổng thời gian GC, pause time và thời gian tới safepoint
  - 11.6 Dùng GC.heap_info, MXBeans và jstat để đối chiếu tình trạng heap
  - 11.7 Giới hạn cột số liệu và định dạng experimental của jstat khi tự động hóa
  - 11.8 Phân biệt heap tăng do tải, giữ dữ liệu hợp lệ và giữ tham chiếu ngoài ý muốn
  - 11.9 Xác định bằng chứng cần có trước khi thay heap size hoặc tham số GC
- level1: 12. Heap dump và rò rỉ
  level2:
  - 12.1 Heap dump lưu dữ liệu gì và khác gì với class histogram hoặc bản ghi cấp phát
  - 12.2 Thu GC.class_histogram và hiểu số đối tượng, tổng byte theo lớp
  - 12.3 Thu HPROF bằng GC.heap_dump hoặc HotSpotDiagnosticMXBean
  - 12.4 HeapDumpOnOutOfMemoryError, HeapDumpPath và giới hạn của thu dump tự động
  - 12.5 Phân biệt đối tượng còn sống với toàn bộ đối tượng được ghi và khả năng kích hoạt GC
  - 12.6 Lập kế hoạch thời gian dừng, dung lượng đĩa và quyền truy cập file dump
  - 12.7 GC root, chuỗi tham chiếu và cách đối tượng bị giữ lại
  - 12.8 Phân biệt shallow size với retained size và vai trò của dominator
  - 12.9 So sánh bằng chứng qua thời gian thay vì kết luận rò rỉ từ một histogram
  - 12.10 Nhận diện collection, cache, listener, ThreadLocal hoặc class loader giữ dữ liệu
  - 12.11 Phân loại OutOfMemoryError theo thông báo và vùng tài nguyên thực sự cạn
- level1: 13. Bộ nhớ native
  level2:
  - 13.1 Phân biệt không gian địa chỉ reserved, bộ nhớ committed và RSS
  - '13.2 Nguồn bộ nhớ ngoài heap: thread stack, metaspace, code cache, direct buffer và thư viện native'
  - 13.3 Bật NativeMemoryTracking từ lúc khởi động với summary hoặc detail
  - 13.4 Dùng VM.native_memory để đọc báo cáo theo nhóm sử dụng bộ nhớ
  - 13.5 Thiết lập baseline rồi đọc summary.diff hoặc detail.diff
  - '13.6 Giới hạn NMT: phạm vi HotSpot và các cấp phát native không được theo dõi'
  - 13.7 Đối chiếu NMT với BufferPoolMXBean, số thread và số liệu hệ điều hành
  - 13.8 Chẩn đoán metaspace tăng, số lớp hoặc class loader tăng và khả năng unload
  - 13.9 Phân biệt lỗi tạo native thread, cấp phát trực tiếp thất bại và heap Java đầy
  - 13.10 Chi phí NMT, dữ liệu cần giữ và giới hạn bật lại sau khi đã tắt
- level1: 14. Thu bản ghi JFR
