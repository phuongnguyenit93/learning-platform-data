  - 18.7 Phân tích độ trễ tăng đồng thời với GC, safepoint, khóa hoặc I/O
  - 18.8 Phạm vi JVM quan sát được và bằng chứng cần lấy thêm từ hệ điều hành hoặc dịch vụ ngoài
  - 18.9 Kiểm chứng thay đổi bằng phân bố độ trễ và số thao tác thành công dưới cùng tải
- level1: 19. Debugging
  level2:
  - 19.1 Khi nào cần debugger để kiểm tra trạng thái mà log hoặc profiler chưa giải thích được
