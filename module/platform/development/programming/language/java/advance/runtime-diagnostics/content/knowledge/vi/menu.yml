  - 15.8 Phân tích khóa, trạng thái thread, thao tác file hoặc socket và ngoại lệ
  - 15.9 Đối chiếu kết quả phân tích tự động với bằng chứng và ngữ cảnh tải
  - 15.10 Giới hạn của lấy mẫu và ngưỡng event; tương quan thời gian không tự chứng minh quan hệ nhân quả
