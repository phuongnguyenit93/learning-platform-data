  - ModuleDescriptor và việc đọc thông tin khai báo
  - Kiểm tra nội dung mô-đun bằng jar --describe-module
- level1: Phụ thuộc mô-đun
  level2:
  - Quan hệ requires và khả năng đọc trực tiếp
  - requires transitive khi API công khai làm lộ kiểu của mô-đun khác
  - requires static cho phụ thuộc cần lúc biên dịch
  - Kết hợp static với transitive đúng mục đích
  - Mô-đun gốc và quá trình phân giải đồ thị
  - Phát hiện phụ thuộc thiếu hoặc có chu kỳ
  - Phân biệt mô-đun quan sát được với mô-đun được phân giải
  - Giới hạn tập mô-đun và bổ sung mô-đun gốc
  - Kiểm tra phụ thuộc thật của giao diện công khai
- level1: Ranh giới truy cập
  level2:
