  - Kiến thức cần có về generic, Stream, ngoại lệ và đa luồng
  - Thử nghiệm trên JDK được hỗ trợ và kiểm tra mức ngôn ngữ
  - Tra cứu hợp đồng API, mốc xuất hiện và tình trạng hỗ trợ
  - Lựa chọn tính năng theo nhu cầu thay vì áp dụng đồng loạt
