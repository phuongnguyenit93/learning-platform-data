  - Xuất package có chọn lọc bằng exports ... to
  - Package nội bộ và quan hệ giữa các package con
  - opens và quyền phản chiếu sâu vào thành viên
  - Mở package có chọn lọc bằng opens ... to
  - So sánh xuất API với mở phản chiếu
  - canAccess và trySetAccessible trong mã phản chiếu
  - Chẩn đoán IllegalAccessException và InaccessibleObjectException
  - Giới hạn phạm vi --add-exports hoặc --add-opens khi tích hợp
  - Thay phụ thuộc vào chi tiết nội bộ bằng hợp đồng được hỗ trợ
- level1: Biên dịch mô-đun
  level2:
