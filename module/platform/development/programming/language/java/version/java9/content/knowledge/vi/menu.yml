  - Chọn nhà cung cấp khi có nhiều phần triển khai
  - Xử lý không có dịch vụ hoặc ServiceConfigurationError
  - Khám phá dịch vụ theo ModuleLayer
  - Giữ mô-đun triển khai độc lập với mã sử dụng dịch vụ
