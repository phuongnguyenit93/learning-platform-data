menu:
  - level1: "Phạm vi và nền tảng"
    level2:
      - "Các thay đổi bền vững từ Java 18: UTF-8, Simple Web Server, Javadoc snippet, resolver SPI và reflection"
      - "Phân biệt API có từ trước với thay đổi được đưa vào Java 18, đặc biệt là MethodHandle"
      - "Đọc JEP, đặc tả Java SE và tài liệu JDK để xác định hợp đồng, chi tiết triển khai và giới hạn phiên bản"
      - "Chọn JDK hiện đại còn được hỗ trợ để thực hành các kiến thức của module"
      - "Xác minh java, javac, javadoc và jwebserver thuộc cùng bộ JDK bằng đường dẫn và thông tin phiên bản"
      - "Phân biệt phiên bản công cụ biên dịch, mức --release và hành vi của JVM chạy chương trình"
      - "Kiểm tra module java.base và jdk.httpserver trên JDK đầy đủ hoặc runtime image tùy biến"
      - "Tổ chức ví dụ tối thiểu với đầu vào, kết quả mong đợi, ngoại lệ và thông tin môi trường"
      - "Phân loại kết quả quan sát theo bảo đảm API, đặc tính hệ điều hành và hành vi riêng của bản JDK"
      - "Giới hạn nội dung ở API còn áp dụng; nhận diện tài liệu preview, incubator và cơ chế nội bộ cũ để tránh dùng sai"
  - level1: "UTF-8 mặc định"
    level2:
      - "JEP 400 và ý nghĩa của UTF-8 mặc định đối với tính di động của ứng dụng Java"
      - "Phân biệt byte, ký tự, code point và code unit khi đọc hoặc ghi tiếng Việt và emoji"
      - "Phân biệt biểu diễn của String trong Java với charset dùng tại ranh giới nhập xuất"
      - "Charset.defaultCharset() và các API thực sự sử dụng charset mặc định"
      - "StandardCharsets.UTF_8 và lý do khai báo charset rõ ràng trong hợp đồng dữ liệu"
      - "Đọc file.encoding và native.encoding để phân biệt lựa chọn của JVM với mã hóa môi trường"
      - "Giá trị UTF-8 và COMPAT của file.encoding: cấu hình khởi động được hỗ trợ và giới hạn sử dụng"
      - "Vì sao System.setProperty sau khi JVM khởi động không bảo đảm thay đổi charset mặc định"
      - "native.encoding là thông tin môi trường và không phải công tắc đổi mã hóa của ứng dụng"
      - "Console.charset(), System.console() và trường hợp chương trình không gắn với console"
      - "Phân biệt charset của System.in, System.out, System.err và charset mặc định khi làm việc với terminal"
      - "Đối chiếu stdout.encoding và stderr.encoding với tài liệu của đúng JDK đang dùng"
      - "Ảnh hưởng của terminal, IDE, chuyển hướng và pipe đến đường đi của dữ liệu văn bản"
      - "Charset.forName(), tên chuẩn, bí danh và lỗi UnsupportedCharsetException"
      - "UTF-8 mặc định không tự chuyển đổi dữ liệu hoặc tệp đã lưu bằng charset khác"
      - "BOM, ký tự thay thế và mojibake: các dấu hiệu giúp định vị lỗi mã hóa"
  - level1: "API văn bản"
    level2:
      - "String.getBytes() và new String(byte[]): nhận diện phụ thuộc vào charset mặc định"
      - "String.getBytes(Charset) và new String(byte[], Charset): định nghĩa rõ hai chiều chuyển đổi"
      - "InputStreamReader và OutputStreamWriter: lựa chọn constructor có charset cho luồng byte"
      - "FileReader và FileWriter: khai báo charset, chế độ append và trách nhiệm đóng tài nguyên"
      - "BufferedReader và BufferedWriter: lớp đệm không quyết định lại charset của luồng bên dưới"
      - "Files.readString() và Files.writeString(): UTF-8 đã là hợp đồng của overload không truyền charset"
      - "Files.newBufferedReader(), Files.newBufferedWriter() và overload charset tường minh"
      - "Files.readAllLines() và Files.lines(): chọn charset và đóng Stream đọc tệp đúng vòng đời"
      - "Scanner: xác định charset ở nơi tiếp nhận byte và phân biệt lỗi mã hóa với lỗi token hoặc locale"
      - "PrintStream và PrintWriter: constructor charset, flush và kiểm tra lỗi xuất dữ liệu"
      - "ByteArrayOutputStream.toString(): lựa chọn overload để tránh giải mã ngầm"
      - "Properties.load(InputStream) và store(OutputStream): hợp đồng ISO-8859-1 vẫn cần được hiểu đúng"
      - "Properties.load(Reader) và store(Writer): kiểm soát charset qua Reader và Writer"
      - "ResourceBundle và PropertyResourceBundle: đối chiếu quy tắc đọc tệp properties riêng của API"
      - "CharsetDecoder và CodingErrorAction.REPORT: phát hiện byte không hợp lệ thay vì thay thế âm thầm"
      - "CharsetEncoder: xử lý ký tự không biểu diễn được và surrogate không hợp lệ"
      - "Giải mã từng phần khi ký tự UTF-8 bị chia giữa các buffer"
      - "Biên dịch mã nguồn tiếng Việt với javac -encoding UTF-8 và phân biệt mã hóa nguồn với mã hóa dữ liệu"
  - level1: "Kiểm chứng mã hóa"
    level2:
      - "Lập bản đồ ranh giới byte và ký tự trong tệp, tài nguyên classpath, tiến trình con và phản hồi HTTP"
      - "Tạo bộ dữ liệu kiểm chứng gồm ASCII, tiếng Việt, emoji, ký tự tổ hợp và dòng rỗng"
      - "Kiểm tra round-trip bằng cả chuỗi và byte để phát hiện mất dữ liệu"
      - "Dùng giá trị byte và mã Unicode làm bằng chứng khi terminal hiển thị sai"
      - "Phân biệt lỗi đọc sai charset, ghi sai charset và mã hóa lặp hai lần"
      - "Kiểm thử UTF-8 hợp lệ, byte bị cắt, BOM và chuỗi đầu vào không thể giải mã"
      - "Xác nhận khác biệt giữa API thay thế ký tự lỗi và API báo ngoại lệ"
      - "Kiểm chứng đọc ghi khi file.encoding khác charset đã khai báo trong API"
      - "Chạy tiến trình JVM riêng để so sánh cấu hình charset khởi động một cách độc lập"
      - "Kiểm tra đầu ra trực tiếp, chuyển hướng ra tệp và truyền qua pipe trên Windows hoặc Linux"
      - "Đồng bộ UTF-8 giữa mã nguồn, tài nguyên, IDE và cấu hình build của dự án"
      - "Chuyển đổi tệp đầu vào có charset được xác định rõ sang UTF-8 và xác minh byte đầu ra"
      - "Xác định charset từ hợp đồng hoặc metadata thay vì suy đoán chỉ từ hình thức hiển thị"
      - "Kiểm tra dữ liệu tiếng Việt qua HTTP bằng Content-Type, charset và nội dung byte"
      - "Thiết kế kiểm thử hồi quy mã hóa chạy ổn định trên máy cá nhân và CI"
      - "Thực hành xây dựng bộ đọc ghi văn bản UTF-8 có kiểm tra lỗi và thông báo chẩn đoán"
  - level1: "Lệnh jwebserver"
    level2:
      - "Simple Web Server dùng cho phát triển, thử nghiệm và gỡ lỗi tài nguyên tĩnh"
      - "Khởi chạy bằng jwebserver hoặc java -m jdk.httpserver và kiểm tra trợ giúp của đúng JDK"
      - "Mặc định thư mục hiện tại, cổng 8000 và địa chỉ loopback khi khởi động máy chủ"
      - "Chọn thư mục phục vụ bằng -d hoặc --directory, xử lý đường dẫn chứa khoảng trắng"
      - "Chọn cổng bằng -p hoặc --port và chẩn đoán lỗi cổng đã được sử dụng"
      - "Chọn địa chỉ bằng -b hoặc --bind-address và phân biệt IPv4 với IPv6 loopback"
      - "Tác động của bind mọi giao diện đến khả năng truy cập từ mạng và phạm vi dữ liệu được chia sẻ"
      - "Điều chỉnh mức log none, info và verbose bằng -o hoặc --output"
      - "Đọc thông báo khởi động để xác nhận địa chỉ, cổng và đường dẫn tuyệt đối được phục vụ"
      - "Ánh xạ URI đến tệp và thư mục trong cây tài nguyên tĩnh"
      - "Tệp index, chuyển hướng đường dẫn thư mục và danh sách nội dung khi thiếu index"
      - "Hành vi với tệp ẩn, symbolic link và yêu cầu vượt ra ngoài thư mục gốc"
      - "GET và HEAD: kiểm tra status, header và sự khác biệt về response body"
      - "Phương thức HTTP không hỗ trợ: kiểm chứng 405 hoặc 501 theo lớp xử lý của máy chủ"
      - "MIME type tự nhận diện, kiểu mặc định và giới hạn khi không có khai báo charset phù hợp"
      - "Giới hạn HTTP/1.1, nội dung tĩnh và việc lựa chọn công cụ khác khi cần HTTPS hoặc xử lý ứng dụng"
      - "Dùng trình duyệt, curl hoặc curl.exe để kiểm tra 200, 404, HEAD và tên tệp có ký tự Unicode"
      - "Dừng máy chủ, giải phóng cổng và thực hành xem trước tài liệu HTML hoặc fixture cục bộ"
  - level1: "API SimpleFileServer"
    level2:
      - "Module jdk.httpserver và các API công khai trong com.sun.net.httpserver"
      - "Ba thành phần của SimpleFileServer: HttpServer, HttpHandler và Filter"
      - "createFileServer(): khởi tạo máy chủ và gọi start() tường minh"
      - "Điều kiện rootDirectory phải tuyệt đối, tồn tại, là thư mục và đọc được"
      - "InetSocketAddress: chọn loopback tường minh và tránh vô tình bind mọi giao diện"
      - "Dùng cổng 0 rồi đọc địa chỉ thực tế để tránh xung đột trong kiểm thử"
      - "OutputLevel.NONE, INFO và VERBOSE: cân bằng quan sát với dữ liệu xuất hiện trong log"
      - "createFileHandler(): tái sử dụng trình phục vụ tệp trong một HttpServer tự cấu hình"
      - "HttpContext và tiền tố đường dẫn: kiểm chứng cách URI được ánh xạ khi gắn file handler"
      - "createOutputFilter(): xuất log UTF-8 đến OutputStream và quản lý vòng đời luồng đích"
      - "HttpHandlers.handleOrElse(): phối hợp điều kiện request với file handler và handler tùy biến"
      - "Tách route kiểm tra trạng thái khỏi route phục vụ tài nguyên tĩnh trong ví dụ phát triển"
      - "Quản lý request body, response body và đóng HttpExchange trong handler tự viết"
      - "Thiết lập Executor trước khi start() và quản lý việc dừng các luồng do ứng dụng sở hữu"
      - "stop(delay): dừng máy chủ có kiểm soát và dọn tài nguyên khi kiểm thử kết thúc"
      - "Kiểm chứng IllegalArgumentException, NullPointerException và lỗi nhập xuất lúc tạo máy chủ"
      - "Dùng HttpClient kiểm tra header, status và byte phản hồi mà không phụ thuộc trình duyệt"
      - "Thực hành dựng máy chủ fixture độc lập với thư mục tạm, cổng động và cleanup xác định"
  - level1: "Javadoc snippet"
    level2:
      - "JEP 413 và vai trò của đoạn mã minh họa trong hợp đồng tài liệu API"
      - "Lựa chọn @snippet cho ví dụ nhiều dòng và @code cho định danh hoặc biểu thức ngắn"
      - "Cú pháp inline snippet: thuộc tính, dấu hai chấm, nội dung và dấu đóng"
      - "Quy tắc cân bằng dấu ngoặc nhọn trong nội dung inline snippet"
      - "Giới hạn của chuỗi kết thúc comment và Unicode escape trong comment chứa snippet"
      - "Xử lý thụt lề và khoảng trắng ngẫu nhiên để đoạn mã hiển thị đúng"
      - "Thuộc tính lang: nhận diện Java, properties và giới hạn hỗ trợ markup theo ngôn ngữ"
      - "Thuộc tính id và cách nhận diện snippet trong HTML được sinh ra"
      - "Thuộc tính có hoặc không có dấu nháy và giới hạn escape trong giá trị thuộc tính"
      - "External snippet với file: tách ví dụ khỏi comment tài liệu"
      - "External snippet với class: tham chiếu tệp nguồn Java theo tên lớp"
      - "Thư mục snippet-files theo package và phân biệt với thư mục doc-files"
      - "Cấu hình --snippet-path khi ví dụ được đặt trong cây nguồn độc lập"
      - "Chọn inline, external hoặc hybrid theo kích thước ví dụ và khả năng kiểm thử"
  - level1: "Markup và region"
    level2:
      - "Markup comment trong snippet và phần nội dung được loại khỏi đầu ra hiển thị"
      - "@highlight: làm nổi bật cả dòng hoặc phần văn bản được chọn"
      - "Thuộc tính type của @highlight và lựa chọn kiểu nhấn mạnh phù hợp"
      - "Chọn văn bản bằng substring và phân biệt với chọn bằng regex"
      - "Kiểm chứng regex khi tên biến là một phần của định danh khác"
      - "@link: nối phần mã minh họa đến lớp, field, constructor hoặc method đích"
      - "Tham chiếu method overload trong target của @link và kiểm tra liên kết được phân giải"
      - "@replace: thay đổi văn bản trình bày mà vẫn giữ mã nguồn có thể biên dịch"
      - "Placeholder, dấu ba chấm và ranh giới giữa mã chạy thật với mã được hiển thị"
      - "Dấu hai chấm ở cuối markup comment để áp dụng markup cho dòng tiếp theo"
      - "@start, @end và thuộc tính region để chọn một phần tệp nguồn bên ngoài"
      - "Region có tên và không tên khi áp dụng markup cho nhiều dòng"
      - "Region lồng nhau hoặc chồng lấn: đặt tên và xác định điểm kết thúc rõ ràng"
      - "Kết hợp region được trích xuất với markup highlight, link và replace"
      - "Dùng nhiều region trong một tệp ví dụ mà vẫn giữ từng đoạn có ngữ cảnh đầy đủ"
      - "Chẩn đoán region thiếu, sai tên, thiếu @end và giới hạn của markup cuối dòng"
      - "Hybrid snippet: quy tắc đối chiếu nội dung inline với nội dung external sau xử lý markup"
  - level1: "Kiểm chứng tài liệu"
    level2:
      - "Tổ chức lớp ví dụ có thể biên dịch và trích đúng region vào tài liệu API"
      - "Phân biệt javadoc kiểm tra cú pháp snippet với việc biên dịch hoặc chạy mã minh họa"
      - "Biên dịch ví dụ external bằng javac để phát hiện import, kiểu và lời gọi API sai"
