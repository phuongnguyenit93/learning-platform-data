      - "Cấu hình classpath hoặc module path cho ví dụ và liên kết API trong tài liệu"
      - "Dùng doclint, mức cảnh báo và mã thoát của javadoc để phát hiện lỗi tài liệu"
      - "Chẩn đoán tệp snippet không tìm thấy theo package, working directory và --snippet-path"
      - "Kiểm tra HTML thực tế để xác nhận thụt lề, ký tự đặc biệt, highlight và liên kết"
      - "Đối chiếu nội dung sao chép từ snippet với nội dung hiển thị và ý định của @replace"
      - "Đưa biên dịch ví dụ, chạy kiểm thử và tạo Javadoc vào quy trình CI"
      - "Giữ ví dụ đồng bộ với API khi đổi tên method, chữ ký hoặc hành vi ngoại lệ"
      - "Thực hành tài liệu hóa bộ đọc UTF-8 và máy chủ fixture bằng snippet được kiểm thử"
  - level1: "Hợp đồng InetAddress"
    level2:
      - "Phân giải hostname trong Java và vai trò của resolver hệ điều hành hoặc provider tùy biến"
      - "Phân biệt tra cứu tên, kết nối TCP, xác thực TLS và khả năng truy cập dịch vụ"
      - "InetAddress.getByName() và getAllByName(): kết quả một địa chỉ hoặc toàn bộ địa chỉ"
      - "Địa chỉ IPv4, IPv6 và thứ tự địa chỉ ảnh hưởng thế nào đến bên gọi"
      - "IP literal và hostname: các đường đi có thể không cần gọi resolver provider"
      - "InetAddress.getByAddress(): tạo đối tượng từ byte địa chỉ mà không tra cứu tên"
      - "getHostAddress(), getHostName() và getCanonicalHostName(): biểu diễn địa chỉ và tra cứu ngược"
      - "getLocalHost() và getLoopbackAddress(): phân biệt cấu hình hostname với địa chỉ loopback"
      - "UnknownHostException: phân biệt lỗi phân giải với lỗi xảy ra sau khi đã có địa chỉ"
      - "Cache kết quả thành công và thất bại trong InetAddress"
      - "networkaddress.cache.ttl và networkaddress.cache.negative.ttl: đọc hợp đồng trên JDK đang dùng"
      - "Security property và system property: cấu hình cache đúng cơ chế và trước lần sử dụng đầu tiên"
      - "java.net.preferIPv4Stack và java.net.preferIPv6Addresses: ảnh hưởng cần kiểm chứng theo JDK"
      - "Tên miền đổi địa chỉ, vòng đời JVM và tác động của cache đến khả năng quan sát"
      - "Quan sát thời gian phân giải và ngoại lệ mà không suy diễn mọi lần gọi đều tạo truy vấn DNS"
  - level1: "Resolver SPI"
    level2:
      - "JEP 418 và ba thành phần InetAddressResolver, InetAddressResolverProvider, Configuration"
      - "lookupByName(host, policy): hợp đồng trả Stream địa chỉ và báo UnknownHostException"
      - "lookupByAddress(byte[]): tra cứu ngược với độ dài 4 hoặc 16 byte và network byte order"
      - "LookupPolicy.characteristics(): đọc bitmask yêu cầu họ địa chỉ và thứ tự kết quả"
      - "LookupPolicy.of(): tổ hợp IPV4, IPV6, IPV4_FIRST và IPV6_FIRST hợp lệ"
      - "Lọc đúng họ địa chỉ và giữ thứ tự yêu cầu khi trả kết quả tra cứu thuận"
