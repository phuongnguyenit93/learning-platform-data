roadmap:
- id: lambda-voi-var
  title: Lambda với var
  purpose: Thêm thông tin vào tham số lambda mà vẫn suy luận kiểu.
  objectives:
  - Dùng var nhất quán cho các tham số lambda
  - Gắn annotation lên tham số khi cần
- id: chay-tep-nguon
  title: Chạy tệp nguồn
  purpose: Thử chương trình nhỏ với ít bước chuẩn bị.
  objectives:
  - Chạy chương trình bằng java Main.java
  - Chọn --source và truyền đối số đúng vị trí
- id: chuoi-va-tep
  title: Chuỗi và tệp
  purpose: Xử lý văn bản bằng các API ngắn gọn.
  objectives:
  - Dùng isBlank, strip, lines và repeat
  - Phân biệt strip với trim
  - Đọc và ghi tệp phù hợp kích thước bằng Files.readString/writeString
- id: tien-ich-ham
  title: Tiện ích hàm
  purpose: Viết điều kiện và chuyển đổi dữ liệu rõ hơn.
  objectives:
  - Kiểm tra Optional rỗng bằng isEmpty
  - Phủ định điều kiện bằng Predicate.not
  - Chuyển Collection thành mảng bằng hàm tạo mảng
- id: http-client
  title: HTTP Client
  purpose: Gọi dịch vụ mạng bằng API HTTP chuẩn.
  objectives:
  - Dùng HttpClient, HttpRequest và HttpResponse
  - Gửi đồng bộ bằng send và bất đồng bộ bằng sendAsync
  - Cấu hình timeout, xử lý lỗi và kiểm tra HTTP/2
- id: flight-recorder
  title: Flight Recorder
  purpose: Quan sát hành vi ứng dụng để tìm điểm nghẽn.
  objectives:
  - Tạo bản ghi JFR bằng jcmd hoặc tùy chọn JVM
  - Đọc sự kiện về CPU, bộ nhớ và đồng bộ hóa
- id: tls-va-mat-ma
  title: TLS và mật mã
  purpose: Sử dụng cơ chế bảo vệ kết nối và dữ liệu còn phù hợp.
  objectives:
  - Kiểm tra kết nối và tương thích TLS 1.3
  - Nhận diện trao đổi khóa X25519 và mã hóa ChaCha20-Poly1305
