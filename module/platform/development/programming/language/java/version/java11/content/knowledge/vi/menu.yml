  - Đối chiếu Since để phân biệt nguồn gốc API với cải tiến mới
  - Kiểm tra dependency, compiler plugin và công cụ bytecode
  - Đóng gói tài nguyên, service provider và metadata cần thiết
  - Chạy kiểm thử trên đúng JDK dự kiến triển khai
  - Quản lý truststore, locale, charset và tài nguyên hệ thống
  - Thay cấu hình phụ thuộc implementation bằng hợp đồng được hỗ trợ
  - Kiểm tra lỗi startup, linkage và nạp tài nguyên
- level1: Kiểm thử và tối ưu
  level2:
  - Chuỗi, mảng, khoảng chỉ số và các giá trị rỗng
  - Tệp Unicode, encoding sai và dữ liệu quá lớn
  - HTTP status, timeout, redirect và lỗi kết nối
  - Streaming body với bên nhận chậm và hủy giữa chừng
  - WebSocket phân mảnh, backpressure và đóng kết nối
  - TLS, XDH và ChaCha20 với đầu vào sai, dữ liệu bị sửa
  - JFR event, metadata và bản ghi không đầy đủ
  - So sánh allocation, throughput và độ trễ sau warm-up
  - Giữ môi trường, dữ liệu và cách đo có thể tái lập
  - Dựa vào nhiều nguồn bằng chứng trước khi xác định nguyên nhân
- level1: Thực hành
  level2:
  - Tiện ích một tệp xử lý văn bản Unicode
  - Đọc ghi cấu hình bằng Path.of, Files.readString, writeString
  - HTTP client tái sử dụng với timeout và xử lý response có kiểu
  - Upload, download tệp lớn bằng body streaming
  - Ghép nhiều yêu cầu bất đồng bộ có giới hạn đồng thời
  - WebSocket client xử lý phân mảnh và điều tiết nhận
  - Kết nối HTTPS với cấu hình chứng chỉ kiểm chứng được
  - Trao đổi khóa và mã hóa xác thực trong giao thức thử nghiệm
  - Quan sát cấu trúc nest và dynamic constant bằng bytecode
  - Ghi sự kiện nghiệp vụ và phân tích bản ghi JFR
  - Đo allocation và tác động của collector bằng tải đại diện
  - Bài tổng hợp trên JDK được hỗ trợ với kiến thức Java 11 còn áp dụng
