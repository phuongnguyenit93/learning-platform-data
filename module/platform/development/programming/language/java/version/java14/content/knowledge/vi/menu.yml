  - Kiểm tra mô-đun được nạp qua dịch vụ hoặc phản chiếu
  - Cấu trúc tài nguyên, thư viện native và đường dẫn khi phân phối
  - Chạy thử trên máy không cài sẵn JDK
- level1: Gói cài đặt
  level2:
