  - Phân biệt app image với gói cài đặt native
  - Đầu vào ứng dụng mô-đun và ứng dụng theo class path
  - Kiểm tra JDK cùng công cụ đóng gói theo hệ điều hành
  - Ràng buộc tạo gói trên nền tảng đích
  - Phân biệt đóng gói với việc biên dịch mã Java thành mã máy
  - Lập kế hoạch cập nhật runtime và phiên bản ứng dụng
