roadmap:
- id: giai-cau-truc-record
  title: Giải cấu trúc record
  purpose: Truy cập dữ liệu có cấu trúc bằng mẫu rõ ràng.
  objectives:
  - Khớp và tách các thành phần của record
  - Kết hợp mẫu lồng nhau và xử lý trường hợp null
- id: switch-theo-mau
  title: Switch theo mẫu
  purpose: Phân nhánh theo kiểu và cấu trúc dữ liệu an toàn hơn.
  objectives:
  - Dùng type pattern, record pattern và điều kiện when
  - Kiểm tra tính đầy đủ, thứ tự nhánh và case null
- id: tap-hop-co-thu-tu
  title: Tập hợp có thứ tự
  purpose: Thao tác thống nhất với thứ tự duyệt và hai đầu tập hợp.
  objectives:
  - Chọn SequencedCollection, SequencedSet hoặc SequencedMap
  - Truy cập hai đầu và dùng góc nhìn reversed
- id: luong-ao
  title: Luồng ảo
  purpose: Mở rộng số tác vụ đồng thời cho công việc chờ I/O.
  objectives:
  - Tạo luồng ảo và dùng executor cho từng tác vụ
  - Quản lý vòng đời, hủy tác vụ và giới hạn tài nguyên
  - Phân biệt tăng khả năng đồng thời với tăng tốc tính toán
- id: dong-goi-khoa-kem
  title: Đóng gói khóa KEM
  purpose: Chia sẻ khóa bí mật bằng cơ chế mật mã chuẩn.
  objectives:
  - Phân biệt khóa bí mật với thông điệp đóng gói
  - Dùng KEM để encapsulate và decapsulate khóa
- id: zgc-phan-the-he
  title: ZGC phân thế hệ
  purpose: Hiểu cơ chế thu gom hướng tới độ trễ thấp.
  objectives:
  - Giải thích vai trò thế hệ trẻ và già trong ZGC
  - Đọc GC log và đánh giá CPU, heap cùng độ trễ
