  - Kiểm thử tài nguyên HttpClient, Unicode và biên của API mới
  - Kiểm thử KEM bằng đối chiếu shared secret và xử lý encapsulation không hợp lệ
- level1: Đo lường hiệu năng
  level2:
  - Xây baseline trước khi thay đổi ngôn ngữ, executor hoặc collector
  - Phân loại workload CPU-bound, I/O-bound và hỗn hợp
  - Đo throughput cùng percentile latency và tỷ lệ lỗi
  - Mô hình hóa arrival rate, concurrency và thời gian chờ dependency
  - JMH cho microbenchmark API và phép biến đổi dữ liệu
  - Load test đầu cuối cho virtual thread và giới hạn tài nguyên
  - Warmup, JIT, GC và yếu tố gây sai lệch phép đo
  - So sánh mức dùng CPU, heap, native memory và số thread hệ điều hành
  - Phân tích pinning, lock contention và connection pool saturation
  - Đặt tiêu chí chấp nhận và kiểm tra hồi quy hiệu năng trong CI
- level1: Nâng cấp lên Java 21
  level2:
  - Lập danh mục ứng dụng, dependency, plugin và agent cần nâng cấp
  - Phân biệt chạy mã hiện có trên JDK 21 với biên dịch bằng --release 21
  - Nâng từ Java 17 lên Java 21 theo từng thay đổi có thể kiểm chứng
  - Phân tích dependency bằng jdeps và API có cảnh báo bằng jdeprscan
  - Thay truy cập JDK internal API bằng API được hỗ trợ
  - Rà soát reflection, annotation processing và bytecode generation
  - Kiểm tra UTF-8 mặc định, locale, timezone và hành vi môi trường
  - Đánh giá xung đột source khi lớp riêng bổ sung các phương thức trùng API collection mới
  - Tách nâng runtime khỏi chuyển đổi sang pattern hoặc virtual thread
  - Giữ tương thích hợp đồng dữ liệu, serialization và giao tiếp hệ thống
  - Triển khai theo giai đoạn, theo dõi hồi quy và chuẩn bị rollback
- level1: Build và CI
  level2:
  - Khai báo phiên bản JDK và toolchain có thể tái lập
  - Đồng bộ compile, test, integration test và đóng gói trên Java 21
  - Chạy ma trận CI với các runtime nằm trong phạm vi hỗ trợ
  - Kiểm tra artifact không tham chiếu API ngoài baseline Java 21
  - Cấu hình annotation processor và plugin phân tích mã
  - Biên dịch mẫu tài liệu bằng cú pháp Java 21 đã hoàn thiện
  - Tổ chức test cho bytecode, agent và thư viện tích hợp
  - Quản lý dependency lock, provenance và cập nhật bảo mật của JDK
- level1: Triển khai production
  level2:
  - Chọn runtime image và bản vá JDK 21 theo chính sách vận hành
  - Thiết lập CPU, memory limit và heap phù hợp trong container
  - Định cỡ connection pool và tài nguyên khi bật virtual thread
  - Kiểm tra mức dùng native memory, file descriptor và socket
  - Graceful shutdown với executor, HTTP client và tác vụ đang chạy
  - Cấu hình GC và quan sát theo workload đã đo
  - Thiết lập health check và cảnh báo lỗi tài nguyên
  - Canary deployment, kiểm tra tính tương thích và rollback
  - Runbook thu thập thread dump, JFR và GC log khi xảy ra sự cố
- level1: Thực hành tổng hợp
  level2:
  - Mô hình hóa miền dữ liệu bằng record và sealed interface
  - Xây bộ xử lý dữ liệu bằng record pattern lồng nhau và pattern switch
  - Thiết kế API thao tác hai đầu với SequencedCollection, Set và Map
  - Kiểm chứng reversed view và các hợp đồng bất biến
  - Xây dịch vụ gọi nhiều dependency bằng virtual thread và ExecutorService
  - Bổ sung timeout, cancellation, semaphore và context cho từng request
  - Tích hợp HttpClient có vòng đời tài nguyên rõ ràng
  - Thực hành KEM với provider và cặp khóa được hỗ trợ trên Java 21
  - So sánh G1 với Generational ZGC bằng tải đại diện
  - Hoàn thiện báo cáo JFR, kiểm thử hồi quy và hướng dẫn vận hành
