  - Giới hạn của ThreadMXBean khi quan sát virtual thread
  - Tương quan request ID, trace ID và tên task thay vì phụ thuộc carrier
  - Đọc GC log, heap usage và thông tin cấp phát
  - Phân tích JFR bằng công cụ tương thích với JDK 21
  - jfr view và các bảng tổng hợp sự kiện hữu ích
  - Bảo vệ dữ liệu nhạy cảm và kiểm soát overhead khi thu thập chẩn đoán
- level1: Agent và instrumentation
  level2:
