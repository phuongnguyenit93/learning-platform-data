  - Khai báo -javaagent hoặc -agentlib theo hướng dẫn của công cụ
  - Nhận diện thư viện kiểm thử hoặc quan sát đang tự attach agent
  - jdk.instrument.traceUsage để truy tìm việc dùng Instrumentation
  - Kiểm thử ứng dụng khi không cho phép dynamic agent loading
  - Kiểm tra tính tương thích của mocking, coverage, profiler và APM
  - Quản lý quyền nạp agent và cấu hình tường minh theo môi trường
