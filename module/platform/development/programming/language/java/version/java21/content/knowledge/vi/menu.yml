menu:
- level1: Tổng quan Java 21
  level2:
  - Vị trí của Java 21 trong nền tảng Java được duy trì hiện nay
  - Phạm vi ngôn ngữ, thư viện chuẩn, JVM và công cụ của JDK 21
  - Bản đồ tính năng đã hoàn thiện và có thể dùng không cần bật preview
  - Phân biệt phiên bản ngôn ngữ, API, bytecode và bản cập nhật JDK
  - Xác định yêu cầu tương thích khi ứng dụng vẫn chạy trên Java 21
  - Đọc Java SE Specification, API Specification và release notes chính thức
  - Lựa chọn tính năng theo bài toán thay vì thay đổi mã chỉ vì có cú pháp mới
- level1: Môi trường và toolchain
  level2:
  - Cài đặt bản cập nhật JDK 21 được nhà cung cấp duy trì
  - Kiểm tra java, javac, JAVA_HOME và phiên bản JVM thực thi
  - Quản lý nhiều JDK trên máy phát triển và trong môi trường CI
  - Cấu hình Java toolchain cho Maven và Gradle
  - Thiết lập javac --release 21 để kiểm soát ngôn ngữ, bytecode và API
  - Đồng bộ JDK giữa IDE, build tool, test runner và production
  - Tạo project Java 21 với classpath hoặc module path phù hợp
  - Cấu hình mã nguồn, tài nguyên và encoding nhất quán
  - Kiểm tra khả năng hỗ trợ JDK 21 của plugin, thư viện và annotation processor
- level1: Mô hình dữ liệu
  level2:
  - Ôn tập record như nền tảng để sử dụng Record Patterns
  - Thành phần record, accessor và constructor ảnh hưởng đến deconstruction
  - Thiết kế record có validation và giữ invariant của dữ liệu
  - Phân biệt record bất biến nông với dữ liệu thực sự bất biến
  - Sealed class, sealed interface và tập hợp kiểu con được phép
  - Kết hợp sealed hierarchy với record để mô hình hóa các biến thể dữ liệu
  - Type pattern với instanceof và phạm vi biến theo luồng điều khiển
  - Ranh giới giữa mô hình dữ liệu bằng record và đối tượng có hành vi, vòng đời
- level1: Record Patterns
  level2:
  - Cấu trúc cú pháp Record Patterns đã hoàn thiện trong Java 21
  - Kiểm tra kiểu và tách các component trong một lần matching
  - So sánh type pattern với record pattern trên cùng một record
  - Sử dụng record pattern trong biểu thức instanceof
  - Sử dụng record pattern trong nhãn case của switch
  - Khai báo component pattern bằng kiểu tường minh hoặc var
  - Record pattern lồng nhau để duyệt cấu trúc dữ liệu nhiều tầng
  - Xử lý record có giá trị null và component có thể null
  - Phạm vi, tên biến và điều kiện sử dụng biến sau matching
  - Accessor được gọi khi deconstruction và tác động của accessor tùy chỉnh
  - Xử lý MatchException khi quá trình matching không hoàn tất bình thường
- level1: Generics và patterns
  level2:
  - Record generic và kiểu của các component trong pattern
  - Type argument tường minh trong record pattern
  - Suy luận type argument từ kiểu của selector hoặc biểu thức instanceof
  - Suy luận kiểu với var trong các record pattern lồng nhau
  - Giới hạn type erasure và matching đòi hỏi unchecked conversion
  - Quan hệ giữa kiểu tĩnh, kiểu runtime và tính hợp lệ của pattern
  - Kết hợp record generic với sealed hierarchy
  - Nhận diện lỗi biên dịch do suy luận kiểu hoặc pattern không tương thích
- level1: Pattern switch
  level2:
  - Pattern Matching cho switch đã hoàn thiện trong Java 21
  - Switch statement và switch expression khi dùng pattern
  - Selector là reference type và các giới hạn kiểu trong Java 21
  - Type pattern cho class, interface, record và array
  - Kết hợp constant case và pattern case trong một switch
  - Guard bằng when để bổ sung điều kiện nghiệp vụ
  - Thứ tự đánh giá pattern và guard
  - Khai báo case null và case null, default
  - Qualified enum constant trong các switch phù hợp
  - Phạm vi pattern variable trong guard, nhánh và khối lệnh
  - Chuyển chuỗi instanceof hoặc if-else sang pattern switch có kiểm soát
- level1: Tính đầy đủ của switch
  level2:
  - Type coverage và điều kiện exhaustive của switch có pattern
  - Phân biệt yêu cầu exhaustive của switch statement và expression
  - Bao phủ sealed hierarchy mà không che mất biến thể chưa xử lý
  - Exhaustiveness với enum và qualified enum constant
  - Exhaustiveness với record pattern lồng nhau và record generic
  - Pattern dominance và các nhánh không thể tới
  - Ảnh hưởng của guard khi kiểm tra dominance và type coverage
  - Phân biệt default, pattern bao phủ toàn bộ kiểu và xử lý null
  - MatchException khi hierarchy thay đổi nhưng mã sử dụng chưa được biên dịch lại
  - Lựa chọn giữa kiểm tra đầy đủ lúc biên dịch và nhánh dự phòng theo nghiệp vụ
- level1: Sequenced Collections
  level2:
  - Encounter order và nhu cầu truy cập hai đầu collection
  - SequencedCollection, SequencedSet và SequencedMap trong Java 21
  - Quan hệ của List và Deque với SequencedCollection
  - getFirst, getLast và hành vi khi collection rỗng
  - addFirst, addLast, removeFirst và removeLast
  - reversed như một view có thứ tự ngược
  - Ảnh hưởng của reversed đến iterator, stream và thao tác hai đầu
  - Các thao tác tùy chọn và UnsupportedOperationException
  - Lựa chọn ArrayList, ArrayDeque hoặc LinkedList theo đặc tính thao tác
  - Thay thế mã xử lý phần tử đầu cuối bằng API biểu đạt đúng ý định
- level1: SequencedSet
  level2:
  - SequencedSet và sự kết hợp giữa tính duy nhất với encounter order
  - LinkedHashSet và thứ tự chèn của phần tử
  - addFirst, addLast và di chuyển vị trí phần tử đã tồn tại
  - Truy cập hoặc xóa phần tử ở hai đầu của set
  - Reversed view của SequencedSet
  - SortedSet, NavigableSet và thứ tự do comparator quyết định
  - Giới hạn addFirst, addLast trên các set có thứ tự sắp xếp
  - Thiết kế API nhận SequencedSet khi thứ tự là một phần của hợp đồng
- level1: SequencedMap
  level2:
  - SequencedMap và encounter order của các entry
  - LinkedHashMap theo insertion order hoặc access order
  - firstEntry, lastEntry và kết quả khi map rỗng
  - pollFirstEntry, pollLastEntry và thao tác lấy kèm xóa
  - putFirst, putLast và định vị lại entry
  - sequencedKeySet, sequencedValues và sequencedEntrySet
  - Reversed view và quan hệ thứ tự giữa map với các view
  - Ảnh hưởng của truy cập và cập nhật đến access-ordered LinkedHashMap
  - SortedMap, NavigableMap và giới hạn định vị entry tường minh
  - Entry snapshot từ các thao tác hai đầu và khả năng cập nhật giá trị
  - Ứng dụng map có thứ tự vào lịch sử truy cập, hàng đợi và bộ nhớ đệm
- level1: Views và tính bất biến
  level2:
  - Phân biệt view, bản sao, snapshot và collection bất biến
  - Thay đổi qua reversed view và tác động đến collection gốc
  - Reversed hai lần và cách kiểm tra thứ tự theo hợp đồng
  - Tạo unmodifiableSequencedCollection, unmodifiableSequencedSet và unmodifiableSequencedMap
  - Giới hạn của unmodifiable view khi dữ liệu gốc vẫn có thể thay đổi
  - Tạo sequenced set bằng Collections.newSequencedSetFromMap
  - Quy tắc equals, hashCode và thứ tự của List, Set, Map
  - Làm việc với collection immutable có hỗ trợ đọc hai đầu và reversed
  - Đánh giá thread safety và concurrent modification theo implementation
- level1: Virtual Threads
  level2:
  - Mô hình virtual thread, platform thread và carrier thread
  - Bài toán tăng khả năng xử lý đồng thời cho workload chờ I/O
  - Vòng đời mount, unmount và tiếp tục thực thi virtual thread
  - Quan hệ giữa số virtual thread với số luồng hệ điều hành
  - Khả năng tương thích với Thread API và mã blocking hiện có
  - Giới hạn của virtual thread đối với tác vụ CPU-bound
  - Trạng thái daemon và ảnh hưởng đến thời điểm JVM kết thúc
  - Chi phí stack, đối tượng thread và số lượng tác vụ còn sống
  - Vì sao không dùng thread pool để tái sử dụng virtual thread
  - Phân biệt concurrency, parallelism, throughput và latency
  - Tiêu chí chọn virtual thread cho một đường xử lý cụ thể
- level1: Thread API
  level2:
  - Tạo và khởi chạy bằng Thread.startVirtualThread
  - Thread.ofVirtual và builder cho virtual thread
  - Tạo thread chưa chạy bằng unstarted và khởi chạy bằng start
  - Đặt tên thread, số thứ tự và tạo ThreadFactory
  - Thread.ofPlatform khi cần cấu hình platform thread
  - Kiểm tra Thread.isVirtual và định danh thread trong chẩn đoán
  - Thread.currentThread và phân biệt danh tính virtual thread với carrier
  - Join, interrupt và phối hợp hoàn thành giữa các thread
  - Thiết lập UncaughtExceptionHandler và quan sát lỗi không được bắt
  - Kiểm soát việc kế thừa InheritableThreadLocal qua thread builder
- level1: Executor và tác vụ
  level2:
  - Executors.newVirtualThreadPerTaskExecutor và mô hình mỗi task một thread
  - Executors.newThreadPerTaskExecutor với ThreadFactory
  - Quản lý ExecutorService bằng try-with-resources
  - Submit Runnable, Callable và lấy kết quả qua Future
  - Phân biệt lỗi trong Future với lỗi chuyển tới uncaught exception handler
  - Chờ kết quả có timeout và xử lý ExecutionException
  - Hủy task bằng Future.cancel và giới hạn của interruption
  - Quản lý shutdown, shutdownNow và chờ kết thúc executor
  - Fan-out nhiều tác vụ bằng các API ExecutorService đã ổn định
  - Kết hợp virtual thread với CompletableFuture qua executor tường minh
  - Kiểm soát vòng đời tác vụ để tránh công việc chạy quá phạm vi request
- level1: Blocking I/O
  level2:
  - Cách virtual thread làm việc với socket và các thao tác chờ
  - Phân biệt I/O có thể unmount với thao tác còn chiếm carrier trên JDK 21
  - Thiết kế xử lý request theo phong cách tuần tự với blocking API
  - Tích hợp JDBC và xác minh khả năng tương thích của driver
  - Tích hợp HTTP client, file I/O và dịch vụ bên ngoài
  - Thiết lập connect timeout, read timeout và deadline nghiệp vụ
  - Truyền cancellation qua lời gọi I/O có hỗ trợ interruption
  - Đóng stream, socket, connection và tài nguyên khi task thất bại
  - Tránh chặn nhầm event-loop khi kết hợp với thư viện bất đồng bộ
  - Phân tích bottleneck ở dịch vụ phụ thuộc khi tăng mức đồng thời
- level1: Đồng bộ và pinning
  level2:
  - Thread safety và Java Memory Model vẫn áp dụng với virtual thread
  - Phân biệt lock contention, blocking và carrier pinning
  - Pinning khi blocking trong synchronized trên JDK 21
  - Pinning liên quan đến native call và giới hạn chẩn đoán
  - Phát hiện vùng giữ monitor lâu hoặc có I/O bên trong
  - Đánh giá ReentrantLock cho điểm nghẽn đã đo được trên JDK 21
  - Giữ synchronized cho vùng tới hạn phù hợp thay vì thay đồng loạt
  - Phân biệt giới hạn pinning của JDK 21 với cải tiến synchronized từ JDK 24
  - Condition, semaphore và primitive đồng bộ tương thích với virtual thread
  - Kiểm tra deadlock, starvation và tranh chấp tài nguyên ngoài thread
- level1: Context và ThreadLocal
  level2:
  - ThreadLocal trên virtual thread và phạm vi dữ liệu theo task
  - Chi phí bộ nhớ khi mỗi virtual thread giữ một bản sao dữ liệu
  - Giới hạn mô hình cache tài nguyên đắt tiền trong ThreadLocal
  - Dọn dữ liệu bằng remove trong finally khi có nhu cầu
  - InheritableThreadLocal và rủi ro sao chép context ngoài ý muốn
  - Truyền request context bằng tham số hoặc wrapper tường minh
  - Truyền MDC, tracing và security context qua executor phù hợp
  - Tích hợp thư viện cần thread affinity và nhận diện giới hạn
  - Ngăn lộ dữ liệu nhạy cảm qua context, log và task chạy nền
- level1: Giới hạn đồng thời
  level2:
  - Tách số lượng task khỏi giới hạn tài nguyên đang sử dụng
  - Semaphore để giới hạn số tác vụ đồng thời theo tài nguyên
  - Connection pool cơ sở dữ liệu khi dùng virtual thread
  - Rate limit, bulkhead và giới hạn gọi dịch vụ bên ngoài
  - Backpressure tại điểm tiếp nhận công việc
  - Giới hạn hàng đợi, bộ nhớ và số request đang chờ
  - Ngân sách timeout xuyên nhiều bước của một request
  - Xử lý overload và phục hồi khi dependency chậm
  - Phối hợp tác vụ CPU-bound với executor có mức song song phù hợp
- level1: HttpClient
  level2:
  - HttpClient triển khai AutoCloseable trong Java 21
  - Lựa chọn phạm vi sống của client và tái sử dụng connection
  - close và quá trình chờ hoàn tất request đã gửi
  - shutdown, shutdownNow, awaitTermination và isTerminated
  - Body handler trả stream và yêu cầu tiêu thụ hoặc đóng response body
  - send với virtual thread và sendAsync theo nhu cầu xử lý
  - Timeout, interruption và hủy yêu cầu HTTP
  - Đóng client đúng thứ tự khi ứng dụng graceful shutdown
  - Kiểm thử request chưa hoàn tất, lỗi mạng và rò rỉ tài nguyên
- level1: Chuỗi và Unicode
  level2:
  - String.indexOf với khoảng beginIndex và endIndex
  - String.splitWithDelimiters và giữ lại dấu phân tách
  - Pattern.splitWithDelimiters và tái sử dụng regular expression
  - Ảnh hưởng của limit và kết quả rỗng khi tách chuỗi
  - StringBuilder.repeat với code point hoặc CharSequence
  - StringBuffer.repeat và lựa chọn cấu trúc chuỗi phù hợp
  - Unicode 15.0 trong Java 21 và giới hạn của xử lý theo char
  - Character.isEmoji và các thuộc tính emoji liên quan
  - Kiểm thử supplementary code point, chuỗi rỗng và dữ liệu Unicode
- level1: Toán học và tiện ích
  level2:
  - Math.clamp và StrictMath.clamp để giới hạn giá trị trong khoảng
  - Chọn overload clamp cho số nguyên và số thực
  - NaN, signed zero và kiểm tra biên min, max của clamp
  - Collections.shuffle với RandomGenerator
  - Lựa chọn nguồn ngẫu nhiên cho kiểm thử có thể lặp lại
  - Phân biệt nguồn ngẫu nhiên mô phỏng với SecureRandom cho bảo mật
  - Đọc since, exception contract và đặc tính API trước khi thay mã tiện ích riêng
- level1: KEM
  level2:
  - Key Encapsulation Mechanism và vai trò chia sẻ khóa đối xứng
