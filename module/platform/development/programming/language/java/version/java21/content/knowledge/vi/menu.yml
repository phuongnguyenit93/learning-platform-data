  - Chọn thuật toán, độ dài khóa và xử lý đầu vào không hợp lệ
  - Quản lý SecureRandom, private key và dữ liệu nhạy cảm trong kiểm thử
  - Phân biệt API KEM với khả năng kháng lượng tử của thuật toán được chọn
  - Kết hợp KEM với giao thức có xác thực và mã hóa đối xứng theo thiết kế đã đánh giá
- level1: Generational ZGC
  level2:
  - Mục tiêu giảm độ trễ và mô hình young, old generation
  - Allocation rate, live set và lý do phân thế hệ
  - Các pha xử lý đồng thời và tác động đến ứng dụng
  - Cấu hình Generational ZGC trên đúng JDK 21
  - Xác minh collector thực tế bằng startup log và GC log
  - Thiết lập heap có đủ headroom cho thu gom đồng thời
  - Đánh giá pause time, allocation stall, CPU và throughput
  - Phân tích promotion, object lifetime và tải cấp phát
  - So sánh G1 với Generational ZGC trên workload đại diện
  - Đo đạc trước khi điều chỉnh số GC thread hoặc tham số chuyên sâu
  - Kiểm tra tùy chọn GC theo phiên bản khi nâng từ JDK 21 lên JDK mới
- level1: Quan sát runtime
  level2:
  - Thu thập Java Flight Recorder cho ứng dụng Java 21
