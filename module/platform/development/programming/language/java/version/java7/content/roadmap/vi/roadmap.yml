roadmap:
- id: cu-phap-project-coin
  title: Cú pháp Project Coin
  purpose: Viết mã ngắn và rõ hơn bằng các cải tiến cú pháp của Java 7.
  objectives:
  - Dùng số nhị phân và dấu _ trong số.
  - Dùng switch với String và khởi tạo generic bằng <>.
  - Nhận biết khi nào có thể dùng @SafeVarargs an toàn.
- id: multi-catch-va-nem-lai
  title: Multi-catch và ném lại
  purpose: Giảm lặp khi xử lý lỗi mà vẫn giữ thông tin kiểu ngoại lệ.
  objectives:
  - Gộp các ngoại lệ không có quan hệ kế thừa vào một catch.
  - Khai báo throws chính xác khi ném lại ngoại lệ.
- id: tu-dong-dong-tai-nguyen
  title: Tự động đóng tài nguyên
  purpose: Tránh rò rỉ tài nguyên bằng try-with-resources.
  objectives:
  - Dùng AutoCloseable trong try-with-resources.
  - Giải thích thứ tự đóng nhiều tài nguyên.
  - Phân biệt ngoại lệ chính và ngoại lệ bị giữ lại (suppressed).
- id: path-va-thao-tac-tep
  title: Path và thao tác tệp
  purpose: Làm việc với đường dẫn, tệp và thư mục bằng NIO.2.
  objectives:
  - Ghép và chuẩn hóa đường dẫn bằng Path.
  - Đọc, ghi, sao chép và di chuyển tệp bằng Files.
  - Xử lý IOException và đóng luồng sau khi dùng.
- id: duyet-cay-va-thuoc-tinh-tep
  title: Duyệt cây và thuộc tính tệp
  purpose: Xử lý cả cây thư mục và đọc thông tin tệp có kiểm soát.
  objectives:
  - Duyệt cây bằng Files.walkFileTree và FileVisitor.
  - Đọc BasicFileAttributes và xử lý lỗi truy cập.
- id: theo-doi-thu-muc
  title: Theo dõi thư mục
  purpose: Phản ứng khi nội dung thư mục thay đổi bằng WatchService.
  objectives:
  - Đăng ký sự kiện tạo, sửa, xóa và reset WatchKey.
  - Xử lý OVERFLOW bằng cách kiểm tra lại trạng thái thư mục.
- id: chia-viec-voi-fork-join
  title: Chia việc với Fork/Join
  purpose: Chạy song song bài toán tính toán bằng cách chia nhỏ và gộp kết quả.
  objectives:
  - Dùng RecursiveTask hoặc RecursiveAction với ForkJoinPool.
  - Chọn ngưỡng chia việc và ghép kết quả bằng join.
  - Đo với cách tuần tự và tránh I/O chặn trong tác vụ.
