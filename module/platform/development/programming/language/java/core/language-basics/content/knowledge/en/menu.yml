  - Nhận diện public, private và truy cập trong gói
  - Giới thiệu enum, record và interface ở mức đọc hiểu cú pháp
  - Từ chương trình chỉ có main tới chương trình có nhiều lớp
  - Đọc cú pháp generic như List<String> và ý nghĩa kiểm tra kiểu
  - Nhận diện lambda và tham chiếu phương thức trong lời gọi API
  - Nhận diện annotation @Override và @Deprecated
- level1: Package và import
  level2:
  - Package tổ chức tên kiểu và tránh trùng tên
  - Khai báo package và cấu trúc thư mục tương ứng
  - Tên đơn giản và tên đầy đủ của lớp
  - Import một kiểu và import theo yêu cầu bằng dấu *
  - Static import cho thành viên static
  - java.lang được import ngầm định
  - Import không tự động bao gồm package con
  - Xử lý hai lớp trùng tên và giới hạn của import
  - Phân biệt package, classpath và module ở mức định hướng
- level1: Lỗi và ngoại lệ
  level2:
  - Lỗi biên dịch, lỗi khi chạy và lỗi logic
  - Đọc thông báo javac và sửa từ lỗi gốc
  - Đọc stack trace và tìm vị trí phát sinh lỗi
  - try-catch để xử lý tình huống có thể thất bại
  - throw để báo lỗi và throws để khai báo khả năng phát sinh
  - Nhận diện checked exception và unchecked exception
  - finally và giới thiệu try-with-resources
  - assert để kiểm tra giả định nội bộ và bật bằng -ea
  - Không dùng assert thay kiểm tra dữ liệu đầu vào bắt buộc
- level1: Nhập xuất cơ bản
  level2:
  - System.out.print(), println() và printf()
  - Định dạng số, chuỗi, xuống dòng và ký hiệu % trong printf()
  - System.err cho thông báo chẩn đoán
  - Đọc đối số chương trình từ String[] args
  - Đọc dữ liệu console bằng Scanner
  - Phân biệt next(), nextInt() và nextLine()
  - Xử lý phần xuống dòng còn lại sau khi đọc số
  - Kiểm tra đầu vào và chuyển chuỗi thành số
  - Locale, dấu phân cách thập phân và trách nhiệm đóng nguồn nhập
- level1: Thực hành và chất lượng
  level2:
  - Phân tích bài toán thành dữ liệu vào, xử lý và kết quả
  - Viết mã giả và bảng theo dõi trước khi lập trình
  - Đặt tên rõ nghĩa, thụt lề và tránh số không giải thích
  - Chú thích lý do và viết tài liệu cho phương thức khi cần
  - Gỡ lỗi bằng breakpoint, chạy từng bước và xem giá trị biến
  - Kiểm tra trường hợp rỗng, biên, số âm, dữ liệu sai và giá trị lớn
  - Thực hành chương trình tính tiền với điều kiện và vòng lặp
  - Thực hành thống kê mảng và tách thành phương thức
  - Thực hành menu console với kiểm tra đầu vào
  - Tổng hợp lỗi thường gặp và tiêu chí tự đánh giá nền tảng
