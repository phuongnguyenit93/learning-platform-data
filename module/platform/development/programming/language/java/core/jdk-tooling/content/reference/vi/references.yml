references:
  - title: "JDK 25 Tool Specifications"
    url: "https://docs.oracle.com/en/java/javase/25/docs/specs/man/"
    description: "Danh mục lệnh JDK chính thức gồm javac, java, jar, jshell, jdeps, jlink, jpackage và jcmd."
  - title: "The Core JDK Tools - Dev.java"
    url: "https://dev.java/learn/jvm/tools/core/"
    description: "Hướng dẫn học và thực hành các công cụ JDK cơ bản."
  - title: "JDK 25 javac Command"
    url: "https://docs.oracle.com/en/java/javase/25/docs/specs/man/javac.html"
    description: "Tùy chọn biên dịch, classpath, output và --release của javac."
  - title: "JDK 25 jdeps Command"
    url: "https://docs.oracle.com/en/java/javase/25/docs/specs/man/jdeps.html"
    description: "Hướng dẫn phân tích phụ thuộc của class, JAR và module."
  - title: "JDK 25 jlink Command"
    url: "https://docs.oracle.com/en/java/javase/25/docs/specs/man/jlink.html"
    description: "Cách tạo custom runtime image từ các module và dependency."
  - title: "JDK 25 jpackage Command"
    url: "https://docs.oracle.com/en/java/javase/25/docs/specs/man/jpackage.html"
    description: "Tạo application image và bộ cài native theo nền tảng."
  - title: "JDK 25 jcmd Command"
    url: "https://docs.oracle.com/en/java/javase/25/docs/specs/man/jcmd.html"
    description: "Chẩn đoán tiến trình JVM, thread dump và Java Flight Recorder."