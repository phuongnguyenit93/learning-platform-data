menu:
- level1: Tổng quan
  level2:
  - Generics là gì và bài toán tái sử dụng mã an toàn kiểu
  - Vì sao dùng Object và ép kiểu dễ để lỗi đến lúc chạy
  - Quan hệ giữa kiểm tra kiểu lúc biên dịch và dữ liệu lúc chạy
  - Tham số kiểu, đối số kiểu, biến kiểu và kiểu tham số hóa
  - Generics kết hợp với lớp, giao diện, phương thức và collection
  - Phân biệt tính tổng quát về kiểu với kế thừa và đa hình
  - Lợi ích, giới hạn và trường hợp không cần generics
  - Kiến thức nền và trình tự học generics trong Java Core
- level1: Cú pháp cơ bản
  level2:
  - Khai báo một hoặc nhiều tham số kiểu
  - Quy ước tên T, E, K, V và cách đặt tên có nghĩa
  - Truyền đối số kiểu và tạo đối tượng kiểu tham số hóa
  - Toán tử diamond <> và khác biệt với raw type
  - Kiểu tham số hóa lồng nhau như Map<K,List<V>>
  - 'Chỉ dùng kiểu tham chiếu: primitive, kiểu bao và autoboxing'
  - Giá trị null, giới hạn thao tác trên T và kiểu Object mặc định
  - Đọc chữ ký generic và theo dõi nơi ràng buộc từng biến kiểu
- level1: Lớp và giao diện
  level2:
  - Thiết kế lớp lưu giữ giá trị Box<T>
  - Dùng T cho trường, tham số, giá trị trả về và constructor
  - Thiết kế lớp nhiều tham số kiểu với Pair<K,V>
  - Khai báo giao diện generic và hợp đồng theo kiểu
  - Triển khai giao diện bằng đối số kiểu cụ thể
  - Triển khai giao diện bằng tham số kiểu của lớp
  - Record generic và các thành phần được tham số hóa
  - Phân biệt kiểu khai báo generic với từng cách sử dụng kiểu đó
- level1: Phương thức generic
  level2:
  - Khai báo <T> trước kiểu trả về
  - Phương thức generic trong lớp generic hoặc lớp thông thường
  - Phân biệt phương thức có tham số kiểu riêng với phương thức dùng T của lớp
  - Quan hệ kiểu giữa nhiều đối số và giá trị trả về
  - Phương thức generic static và các hàm tiện ích
  - Truyền đối số kiểu tường minh khi gọi phương thức
  - Constructor generic và phân biệt với constructor của lớp generic
  - Thiết kế phương thức tạo đối tượng không phụ thuộc ép kiểu
- level1: Phạm vi biến kiểu
  level2:
  - Phạm vi tham số kiểu của lớp, giao diện và phương thức
  - Che khuất tên kiểu và vì sao nên tránh dùng lại tên T
  - Giới hạn dùng T của lớp trong trường và phương thức static
  - Phương thức static khai báo tham số kiểu riêng
  - Lớp thành viên bên trong và tham số kiểu của lớp bao
  - Lớp lồng static và tham số kiểu độc lập
  - Thành viên static dùng chung giữa các kiểu tham số hóa
- level1: Kế thừa generic
  level2:
  - Kế thừa lớp generic với đối số kiểu cố định
  - Kế thừa và chuyển tiếp tham số kiểu
  - Thêm tham số kiểu mới ở lớp con
  - Quan hệ giữa lớp generic và giao diện generic
  - Vì sao một lớp không thể kế thừa cùng giao diện với hai đối số kiểu khác nhau
  - Kiểu thành viên được thay thế thế nào qua các mức kế thừa
  - Kiểu trả về hiệp biến và hợp đồng phương thức
  - Generic với lớp abstract, lớp final và hệ phân cấp sealed
- level1: Giới hạn kiểu
  level2:
  - Giới hạn trên <T extends U> và các thao tác được phép trên T
  - Giới hạn bằng lớp hoặc giao diện
  - Nhiều giới hạn với <T extends A & B>
  - Quy tắc lớp đứng trước và các giới hạn phải tương thích
  - Giới hạn tham chiếu đến tham số kiểu khác
  - Kiểu giao và ý nghĩa đối với truy cập thành viên
  - <T extends Number> không cung cấp toán tử số học trên T
  - Giới hạn Throwable trong throws của phương thức generic
- level1: Quan hệ kiểu
  level2:
  - Kiểu con của đối số không tự tạo quan hệ kiểu con cho generic
  - Vì sao List<Integer> không phải List<Number>
  - List<Integer>, Collection<Integer> và quan hệ theo khai báo kế thừa
  - Tính bất biến của generic và tính hiệp biến của mảng
  - Lỗi kiểu mà tính bất biến giúp ngăn chặn
  - Phân biệt List<Object>, List<?> và raw List
  - Quan hệ kiểu giữa các wildcard có giới hạn
  - Tách quan hệ kiểu con khỏi phép ép kiểu và chuyển đổi không kiểm tra
- level1: Wildcard không giới hạn
  level2:
  - Dấu ? biểu diễn một kiểu chưa biết
  - List<?> khác với danh sách chứa Object
  - Đọc giá trị từ wildcard không giới hạn
  - Giới hạn thêm và thay phần tử qua List<?>
  - Vì sao vẫn có thể clear hoặc remove trên một số List<?>
  - Mỗi wildcard có thể đại diện cho một kiểu khác nhau
  - Các vị trí cú pháp không cho phép wildcard
- level1: Wildcard extends
  level2:
  - Ý nghĩa của ? extends T
  - Nhận List<T> và danh sách của các kiểu con
  - Đọc phần tử theo giới hạn trên
  - Vì sao không thể thêm một giá trị T tùy ý
  - Giới hạn thêm null không có nghĩa collection phải chấp nhận null
  - Wildcard extends không biến đối tượng nguồn thành bất biến
  - Áp dụng cho đầu vào cung cấp dữ liệu
- level1: Wildcard super
  level2:
  - Ý nghĩa của ? super T
  - Nhận collection của T hoặc kiểu cha của T
  - Thêm T và các đối tượng kiểu con của T
  - Vì sao giá trị đọc ra chỉ được bảo đảm là Object
  - Phân biệt giới hạn dưới của wildcard với giới hạn của tham số kiểu
  - Quan hệ giữa ? super Integer và ? super Number
  - Áp dụng cho đầu ra nhận dữ liệu
- level1: Quy tắc PECS
  level2:
  - Nguồn cung cấp dùng extends, đích nhận dữ liệu dùng super
  - Xác định vai trò đọc–ghi của từng tham số
  - Thiết kế hàm sao chép từ List<? extends T> sang List<? super T>
  - Khi cùng tham số vừa cung cấp vừa nhận dữ liệu
  - Khi dùng wildcard và khi phải đặt tên tham số kiểu
  - Ràng buộc nhiều đầu vào cùng chia sẻ một kiểu
  - Giới hạn khi trả về wildcard từ API
  - Đọc chữ ký Collections.copy, addAll và Comparator
- level1: Bắt giữ wildcard
  level2:
  - Phép chuyển đổi bắt giữ (capture conversion) giải quyết vấn đề gì
  - Đọc thông báo CAP#1 và capture of ?
  - Đặt tên kiểu chưa biết bằng phương thức hỗ trợ generic
  - Hoán đổi phần tử của List<?> bằng phương thức hỗ trợ
  - Vì sao hai wildcard giống cách viết vẫn có thể là hai kiểu khác nhau
  - Giới hạn trên và dưới của kiểu được bắt giữ
  - Wildcard lồng nhau và giới hạn của phép bắt giữ
  - Phân biệt giải quyết lỗi bằng capture với ép kiểu không kiểm tra
- level1: Suy luận kiểu
  level2:
  - Suy luận đối số kiểu từ tham số của lời gọi
  - Kiểu đích và ảnh hưởng của ngữ cảnh gán hoặc truyền đối số
  - Diamond và suy luận khi khởi tạo đối tượng
  - Truyền đối số kiểu tường minh để làm rõ lời gọi
  - Suy luận với nhiều đối số có các kiểu khác nhau
  - Giới hạn trên, giới hạn dưới và kiểu cha chung phù hợp
  - Poly expression, lời gọi lồng nhau và giới hạn lan truyền kiểu đích
  - var với diamond và trường hợp suy luận thành Object
  - Đọc và xử lý thông báo inference variable has incompatible bounds
- level1: Giới hạn đệ quy
  level2:
  - Giới hạn tham chiếu chính nó và mô hình F-bounded polymorphism
  - <T extends Comparable<T>> trong thuật toán so sánh
  - Vì sao thường cần Comparable<? super T>
  - Enum<E extends Enum<E>> và quan hệ với kiểu enum cụ thể
  - Mẫu tự tham chiếu trong builder có kế thừa
  - 'Giới hạn của kiểu tự tham chiếu: không tự bảo đảm mọi lớp con'
  - Khi giới hạn đệ quy làm API khó dùng và cách đơn giản hóa
- level1: Xóa kiểu
  level2:
  - Xóa kiểu (type erasure) là gì và lý do tương thích
  - Xóa tham số không có giới hạn về Object
  - Xóa tham số có giới hạn về giới hạn đứng đầu
  - Xóa kiểu trong chữ ký phương thức và kiểu mảng
  - Phép ép kiểu được trình biên dịch chèn vào khi đọc dữ liệu
  - Vì sao Box<String> và Box<Integer> dùng cùng lớp lúc chạy
  - Phân biệt xóa kiểu với tạo lớp chuyên biệt cho từng đối số kiểu
  - Thông tin chữ ký generic còn lưu trong class file
- level1: Ghi đè và cầu nối
  level2:
  - Thay thế tham số kiểu khi ghi đè phương thức
  - Chữ ký sau xóa kiểu và khái niệm subsignature
  - Phương thức cầu nối (bridge method) bảo toàn đa hình
  - Đối chiếu mã Java với bytecode bằng javap
  - Nhận diện phương thức bridge và synthetic qua reflection
  - Xung đột tên (name clash) do cùng chữ ký sau xóa kiểu
  - Vì sao không thể overload chỉ bằng List<String> và List<Integer>
  - Ảnh hưởng của bridge đến dấu vết lỗi ép kiểu lúc chạy
- level1: Kiểu thô
  level2:
  - Kiểu thô (raw type) là gì và vai trò trong mã trước generics
  - Phân biệt raw type với kiểu thông thường không có tham số kiểu
  - Chuyển từ kiểu tham số hóa sang raw type
  - Chuyển từ raw type về kiểu tham số hóa và cảnh báo unchecked
  - Kiểu của thành viên khi được truy cập qua raw type
  - Nguy cơ trộn dữ liệu sai kiểu và lỗi xuất hiện muộn
  - Raw type ở lớp bên trong và giới hạn kiểu tham số hóa một phần
  - Di chuyển API cũ sang generics theo từng ranh giới
- level1: Kiểu lúc chạy
  level2:
  - Kiểu có đầy đủ thông tin lúc chạy (reifiable type) là gì
  - Phân loại kiểu thông thường, raw type, wildcard không giới hạn và kiểu mảng
  - Vì sao List<String> không có đủ thông tin kiểu lúc chạy
  - 'Class literal: String.class, List.class và giới hạn của List<String>.class'
  - instanceof với List<?> và các trường hợp kiểu tham số hóa hợp lệ
  - Phân biệt kiểm tra kiểu tổng thể với xác minh kiểu của mọi phần tử
  - Giới hạn của mẫu kiểu và ép kiểu sau xóa kiểu
  - Không suy ra đối số kiểu tùy ý từ getClass() của đối tượng
- level1: Mảng generic
  level2:
  - Đối chiếu mảng kiểm tra kiểu lúc chạy với generic kiểm tra lúc biên dịch
  - Vì sao không thể trực tiếp tạo new T[]
  - Vì sao không thể trực tiếp tạo new List<String>[]
  - Khác biệt giữa khai báo biến mảng generic và biểu thức tạo mảng
  - Trường hợp mảng với List<?> có thể tạo hợp lệ
  - Dùng Collection<T> thay cho mảng khi phù hợp
  - Tạo mảng bằng IntFunction<T[]> hoặc thông tin Class
  - Giới hạn và cách khoanh vùng phép ép kiểu khi lưu trữ bằng Object[]
- level1: Varargs generic
  level2:
  - Ô nhiễm kiểu trong heap (heap pollution) và biến có kiểu tham số hóa
  - Varargs generic được biểu diễn bằng mảng
  - Cảnh báo tại nơi khai báo và nơi gọi phương thức varargs
  - Rủi ro ghi qua tham chiếu mảng kiểu cha
  - Rủi ro làm lộ mảng varargs ra bên ngoài
  - '@SafeVarargs và những phương thức hoặc constructor được phép dùng'
  - '@SafeVarargs là cam kết an toàn, không sửa thân phương thức'
  - Phân biệt cảnh báo unchecked, rawtypes và varargs
- level1: Giới hạn ngôn ngữ
  level2:
  - Không khởi tạo new T() và cách truyền Supplier<T>
  - Không dùng primitive làm đối số kiểu
  - Không dùng tham số kiểu của lớp trong ngữ cảnh static
  - Không khai báo lớp generic kế thừa Throwable
  - Phân biệt kiểu trong catch với tham số kiểu được dùng trong throws
  - Enum và kiểu annotation không được khai báo tham số kiểu
  - Không cung cấp giá trị mặc định cho tham số kiểu
  - Các giới hạn overload, instanceof và tạo mảng liên quan xóa kiểu
  - Phân biệt giới hạn ngôn ngữ với giới hạn của một API cụ thể
- level1: Lambda và API chuẩn
  level2:
  - Supplier<T>, Consumer<T>, Predicate<T> và Function<T,R>
  - Phương thức của API nhận ? super T hoặc ? extends R
  - Generic với Comparator và phép nối tiêu chí
  - Suy luận kiểu của lambda và tham chiếu phương thức
  - Phương thức generic và lựa chọn phương thức overload
  - Giới hạn dùng lambda cho hợp đồng phương thức tự khai báo generic
  - Đọc chữ ký map, flatMap và collect trong Stream
  - Generic trong Optional và quan hệ kiểu khi biến đổi dữ liệu
- level1: Phản chiếu kiểu
  level2:
  - Class<T> như thông tin kiểu được truyền tường minh
  - Class.cast, Class.isInstance và Class.asSubclass
  - Phân biệt java.lang.reflect.Type với Class<?>
  - 'ParameterizedType: raw type, owner type và actual type arguments'
  - 'TypeVariable: nơi khai báo và các giới hạn'
  - WildcardType và GenericArrayType
  - Đọc getGenericSuperclass, getGenericInterfaces và chữ ký thành viên
  - Lưu kiểu lồng nhau qua lớp con và mẫu type token
  - Giới hạn phục hồi T chưa được ràng buộc và chi phí xử lý siêu dữ liệu
- level1: Thiết kế API
  level2:
  - Chọn tham số kiểu ở cấp lớp hay cấp phương thức
  - Đặt tên và viết tài liệu cho quan hệ giữa các kiểu
  - Dùng kiểu chính xác khi cần giữ quan hệ đọc–ghi
  - Dùng wildcard cho đầu vào linh hoạt theo PECS
  - Tránh tham số kiểu chỉ xuất hiện một lần mà không tạo quan hệ cần thiết
  - Thiết kế kho lưu trữ nhiều kiểu với Class<T> làm khóa
  - Khoanh vùng cast không kiểm tra và nêu bất biến bảo đảm an toàn
  - Ảnh hưởng của đổi giới hạn và thứ tự giới hạn đến tương thích nhị phân
  - Cân bằng tính linh hoạt, độ dễ hiểu và khả năng suy luận kiểu
- level1: Kiểm thử và lỗi
  level2:
  - Viết mẫu mã phải biên dịch và mẫu mã phải bị từ chối
  - Bật javac -Xlint:unchecked, -Xlint:rawtypes và -Xlint:varargs
  - Đọc lỗi incompatible types, capture và incompatible bounds
  - Kiểm thử ranh giới raw type, reflection và ép kiểu
  - Kiểm thử heap pollution và thời điểm phát sinh ClassCastException
  - Đối chiếu chữ ký generic, chữ ký đã xóa và bridge trong class file
  - Giới hạn @SuppressWarnings và yêu cầu giải thích tính an toàn
  - Chi phí boxing và vì sao generics không tự chuyên biệt hóa mã cho primitive
- level1: Thực hành tổng hợp
  level2:
  - Xây dựng Box<T>, Pair<K,V> và giao diện lưu trữ generic
  - Viết hàm chọn phần tử lớn nhất với giới hạn Comparable
  - Thiết kế hàm sao chép đúng PECS
  - Sửa lỗi wildcard bằng phương thức bắt giữ
  - So sánh suy luận với diamond, var và đối số kiểu tường minh
  - Tái hiện raw type và heap pollution rồi sửa tại nguồn
  - Quan sát type erasure và bridge bằng javap
  - Xây dựng kho nhiều kiểu và type token cho cấu trúc lồng nhau
  - Lập bảng lựa chọn T, ?, extends, super và tự đánh giá tình huống
