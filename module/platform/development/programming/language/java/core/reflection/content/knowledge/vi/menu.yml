  - Tên biến cục bộ và thông tin debug không phải API core reflection thông thường
  - Generic bị xóa và metadata phụ thuộc nội dung class file
  - Không có API core reflection tự liệt kê mọi lớp trong classpath
  - Đổi tên, obfuscation và thay đổi nội bộ có thể làm hỏng liên kết theo chuỗi
  - Kiểm tra quyền và giới hạn dữ liệu đầu vào chọn lớp hoặc phương thức
  - Phân biệt reflection runtime với annotation processing lúc biên dịch
  - So sánh với interface, Strategy, ServiceLoader và code generation
  - Không dùng reflection chỉ để tránh thiết kế API rõ ràng
  - Đối chiếu hành vi khi dùng runtime hạn chế reflection hoặc biên dịch trước
- level1: Kiểm thử
  level2:
  - Fixture có public, protected, package-private và private member
  - Kiểm thử declared member khác inherited member
  - Kiểm thử tra cứu primitive, wrapper, overload và generic erasure
  - Kiểm thử invoke với null, varargs, mảng và sai kiểu
  - Kiểm thử lỗi mã đích được giữ qua InvocationTargetException
  - Kiểm thử runtime annotation, repeatable và type-use annotation
  - Kiểm thử non-static inner class, enum, record và sealed type
  - Kiểm thử quyền truy cập trong cùng và khác module
  - Kiểm thử metadata có và không có -parameters
  - Kiểm thử hai loader định nghĩa lớp cùng tên
  - Kiểm thử cache không giữ plugin đã hết vòng đời
- level1: Thực hành
  level2:
  - Xây dựng trình in cấu trúc một Class theo thứ tự ổn định
  - Viết công cụ gọi phương thức từ một hợp đồng đã xác thực
  - Tạo factory từ constructor có kiểu và thông báo lỗi rõ ràng
  - Đọc object graph có kiểm soát vòng tham chiếu
  - Xây dựng bộ ánh xạ dữ liệu nhỏ qua accessor hoặc record component
  - Xây dựng bộ kiểm tra annotation runtime đơn giản
  - Phân giải generic của một lớp con qua nhiều tầng kế thừa
  - Tạo proxy ghi thời gian xử lý và giữ nguyên ngoại lệ mã đích
  - So sánh gọi trực tiếp, Method.invoke và MethodHandle
  - Hoàn thiện ví dụ module hóa cùng bộ kiểm thử quyền truy cập
- level1: Tra cứu
  level2:
  - Bảng getX và getDeclaredX
  - Bảng Class, Member, Executable, Field, Method và Constructor
  - Bảng chuyển đổi được phép khi get, set, invoke hoặc newInstance
  - Bảng Class, Type, AnnotatedType và các loại generic
  - Bảng annotation trực tiếp, gián tiếp và được kế thừa
  - Bảng quyền truy cập theo modifier, package, nest và module
  - Bảng ngoại lệ reflection và thông tin cần kiểm tra
  - Tra cứu Javadoc và quy tắc ngôn ngữ theo từng thao tác
