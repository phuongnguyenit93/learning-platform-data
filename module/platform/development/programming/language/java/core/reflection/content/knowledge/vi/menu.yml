  - An toàn nhiều luồng khi công bố hoặc sử dụng metadata đã cache
  - Không chia sẻ khả năng truy cập private ngoài phạm vi cần thiết
  - Benchmark với warmup, lời gọi trực tiếp và workload thực tế
