    summary: |-
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **Ngắt, đóng từ luồng khác và hành vi phụ thuộc loại I/O**

      Interrupt, đóng channel từ thread khác, timeout và selector wakeup là các cơ chế khác nhau tùy loại I/O và hợp đồng API.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Khác biệt primitive

      1. Interrupt một InterruptibleChannel đang chặn có thể có kết quả gì?
      2. Đóng channel từ luồng khác khác Socket read timeout thế nào?

      ### Shutdown và kiểm chứng

      1. Vì sao `Future.cancel(true)` không chắc chặn được mọi blocking I/O?
      2. Khi nào dùng Selector.wakeup và thiết kế test tránh race như thế nào?

      ## 3. Sau khi học xong, người học phải đạt được điều gì?

      | Năng lực | Kết quả mong đợi |
      | --- | --- |
      | So sánh interrupt, close và timeout | Đối chiếu InterruptedIOException, ClosedByInterruptException và AsynchronousCloseException theo primitive. |
      | Dự đoán race khi read và close đồng thời | Dự đoán kết quả từ read/close race khi channel hoặc socket bị đóng đồng thời. |
      | Thiết kế kiểm thử shutdown có thời hạn | Mô tả phép test shutdown có đồng bộ, timeout và kiểm tra resource kết thúc. |
- slug: legacy-file-io
  title: File truyền thống
  childs:
  - slug: legacy-file-io-001
    title: File là biểu diễn đường dẫn, không phải nội dung tệp
    status: WRITTEN
    difficult: BASIC
    focus: ''
    problemSolved: ''
    mechanism: ''
    applicationValue: ''
    summary: |
      # 0. Định hướng học tập

      ## 1. Mục đích của bài học

      **File là biểu diễn đường dẫn, không phải nội dung tệp**

      Phân biệt đối tượng `java.io.File` trong JVM với tài nguyên thực trên đĩa để không nhầm thao tác đường dẫn, kiểm tra metadata và đọc/ghi byte. Đây là nền tảng để hiểu đúng các API I/O truyền thống.

      ## 2. Những câu hỏi người học phải tự trả lời được

      ### Bản chất biểu diễn đường dẫn

      1. Vì sao `new File("data/report.txt")` thành công ngay cả khi tệp chưa tồn tại?
      2. Đối tượng `File` chứa nội dung tệp hay chỉ mô tả pathname, và những phép truy vấn nào cần hệ thống tệp?

      ### Ranh giới với I/O thực

