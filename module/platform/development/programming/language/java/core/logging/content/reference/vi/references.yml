references:
  - title: "Java SE 25 — java.util.logging"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.logging/java/util/logging/package-summary.html"
    description: "Tài liệu API chính thức của JDK về Logger, Level, Handler, Filter và Formatter."
  - title: "Java SE 25 — Logger"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.logging/java/util/logging/Logger.html"
    description: "Cách tạo logger, kế thừa mức log, ghi thông điệp, tham số và Throwable."
  - title: "SLF4J User Manual"
    url: "https://slf4j.org/manual.html"
    description: "Giải thích logging facade, provider, placeholder, fluent logging API và MDC."
  - title: "Logback Manual"
    url: "https://logback.qos.ch/manual/"
    description: "Hướng dẫn cấu hình logger, appender, layout, rolling file, filters và MDC."
  - title: "Apache Log4j — Asynchronous Loggers"
    url: "https://logging.apache.org/log4j/2.x/manual/async.html"
    description: "Phân tích kiến trúc, cấu hình và đánh đổi khi ghi log bất đồng bộ."
  - title: "OWASP Logging Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
    description: "Khuyến nghị về sự kiện cần ghi, dữ liệu cần che giấu, chống log injection và bảo vệ log."
  - title: "OpenTelemetry — Logs Data Model"
    url: "https://opentelemetry.io/docs/specs/otel/logs/data-model/"
    description: "Mô hình dữ liệu log gồm timestamp, severity, attributes, trace ID và span ID."