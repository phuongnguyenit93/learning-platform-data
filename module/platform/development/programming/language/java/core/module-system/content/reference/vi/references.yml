  - title: "Oracle JDK 21 — java Command"
    url: "https://docs.oracle.com/en/java/javase/21/docs/specs/man/java.html"
    description: "Chạy module bằng --module và chỉ định module path."
  - title: "Oracle JDK 21 — jar Command"
    url: "https://docs.oracle.com/en/java/javase/21/docs/specs/man/jar.html"
    description: "Tạo và kiểm tra modular JAR, module descriptor."
  - title: "Oracle JDK 21 — jdeps Command"
    url: "https://docs.oracle.com/en/java/javase/21/docs/specs/man/jdeps.html"
