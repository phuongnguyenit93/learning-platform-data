menu:
- level1: Nền tảng
  level2:
  - Lưu trữ bền vững trên tệp là gì và giải quyết vấn đề nào
  - Phân biệt dữ liệu trong bộ nhớ và dữ liệu đã lưu bền vững
  - Phân biệt thao tác tệp, tuần tự hóa và cơ chế lưu trữ dữ liệu
  - Phân biệt tệp dữ liệu, tệp cấu hình, tệp xuất và nhật ký ứng dụng
  - Khi nào nên lưu bằng tệp và khi nào nên chọn cơ sở dữ liệu
  - Vòng đời từ tạo, đọc, cập nhật đến xóa dữ liệu trên tệp
  - Các yêu cầu về tính nguyên tử, nhất quán, cô lập và độ bền
  - Mối liên hệ giữa biểu diễn dữ liệu, bố cục tệp và khả năng phục hồi
  - Ranh giới bảo đảm của ứng dụng, hệ điều hành và thiết bị lưu trữ
  - Các thuật ngữ cốt lõi và trình tự học File Persistence
- level1: Hệ thống tệp
  level2:
  - Tệp, thư mục, đường dẫn và mục thư mục
  - Nội dung tệp và siêu dữ liệu của tệp
  - Phân biệt tên tệp, định danh tệp và đối tượng đang được mở
  - Tệp thông thường, liên kết tượng trưng và liên kết cứng
  - Phân vùng, ổ đĩa, điểm gắn và ranh giới hệ thống tệp
  - Quyền truy cập, chủ sở hữu và thuộc tính chỉ đọc
  - Ý nghĩa của kích thước và các dấu thời gian của tệp
  - Bộ đệm ứng dụng, bộ đệm hệ điều hành và bộ nhớ thiết bị
  - Ảnh hưởng của việc đổi tên hoặc xóa tệp đang mở
  - Những khác biệt hệ điều hành cần kiểm tra khi thiết kế lưu trữ
- level1: Mô hình lưu trữ
  level2:
  - Xác định đơn vị dữ liệu và khóa nhận diện cần lưu
  - Lựa chọn một tệp cho toàn bộ dữ liệu hoặc một tệp cho mỗi đối tượng
  - Lựa chọn tệp dữ liệu và tệp siêu dữ liệu đi kèm
  - Lựa chọn ghi thay thế, cập nhật tại chỗ và ghi nối tiếp
  - Xác định thứ tự bản ghi và cách tìm dữ liệu
  - Thiết kế bất biến nghiệp vụ cần giữ sau mỗi lần cập nhật
  - Xác định phạm vi giao dịch và khả năng thành công một phần
  - Thiết kế bản ghi xóa và vòng đời dữ liệu
  - Xác định mức tăng trưởng, kích thước tệp và số lượng tệp
  - Thiết kế chính sách phiên bản, kiểm chứng và phục hồi
- level1: Đường dẫn và định danh
  level2:
  - Phân biệt đường dẫn tuyệt đối và đường dẫn tương đối
  - Xác định thư mục gốc lưu trữ độc lập với thư mục làm việc
  - Ghép và phân giải đường dẫn bằng Path
  - Phân biệt chuẩn hóa đường dẫn và phân giải đường dẫn thực
  - Kiểm tra đường dẫn có nằm trong thư mục được phép
  - Ánh xạ khóa nghiệp vụ thành tên tệp an toàn
  - Xử lý Unicode, chữ hoa chữ thường và ký tự tên tệp
  - Xử lý liên kết tượng trưng khi truy cập dữ liệu
  - Phân biệt so sánh tên đường dẫn và kiểm tra cùng một tệp
  - Tránh phụ thuộc vào dấu phân cách và quy ước đường dẫn hệ điều hành
  - Xử lý rủi ro thay đổi tệp giữa lúc kiểm tra và lúc sử dụng
- level1: API tệp trong Java
  level2:
  - Vai trò của File, Path, Files và FileSystem
  - Tạo thư mục và tệp với điều kiện tồn tại tường minh
  - Lựa chọn tùy chọn mở để đọc, ghi, tạo và cắt ngắn tệp
  - Đọc và cập nhật thuộc tính tệp
  - Duyệt thư mục và đóng tài nguyên khi liệt kê tệp
  - Sao chép, di chuyển và đổi tên tệp
  - Xóa tệp và xử lý thư mục không rỗng
  - Phân loại IOException và các lỗi truy cập thường gặp
  - Phân biệt kiểm tra tồn tại trước và xử lý kết quả thao tác thực tế
  - Lựa chọn API theo yêu cầu bộ nhớ, hiệu năng và tính khả chuyển
- level1: Luồng và bảng mã
  level2:
  - Phân biệt luồng byte và luồng ký tự
  - Đọc ghi theo luồng thay vì nạp toàn bộ tệp vào bộ nhớ
  - Thiết kế bộ đệm và kích thước khối đọc ghi
  - Xử lý đọc chưa đủ dữ liệu và dấu kết thúc luồng
  - Lựa chọn bảng mã tường minh khi lưu văn bản
  - Xử lý BOM, ký tự xuống dòng và dòng cuối tệp
  - Phân biệt byte lỗi, ký tự lỗi và dữ liệu không đúng định dạng
  - Phân biệt flush, close và yêu cầu độ bền dữ liệu
  - Quản lý tài nguyên bằng try-with-resources
  - Xử lý lỗi khi đóng luồng mà vẫn giữ nguyên nguyên nhân chính
  - Đọc ghi dữ liệu nhị phân với quy ước kiểu và thứ tự byte rõ ràng
- level1: Truy cập theo vị trí
  level2:
  - Khi nào cần truy cập ngẫu nhiên thay vì đọc tuần tự
  - Đọc ghi với RandomAccessFile và con trỏ tệp
  - Vai trò của FileChannel và ByteBuffer
  - Quản lý position, limit và capacity của bộ đệm
  - Phân biệt vị trí của kênh và vị trí đọc ghi được chỉ định
  - Xử lý đọc ghi một phần và vòng lặp hoàn tất thao tác
  - Thiết kế truy cập bản ghi theo độ lệch byte
  - Thay đổi độ dài tệp và kiểm tra ranh giới truy cập
  - Lựa chọn bộ đệm trên heap và bộ đệm trực tiếp
  - Sao chép dữ liệu bằng kênh và xử lý giới hạn mỗi lần truyền
  - Đánh giá vai trò của truy cập tệp bất đồng bộ
- level1: Định dạng và bản ghi
  level2:
  - Lựa chọn văn bản, nhị phân và định dạng có cấu trúc
  - Lựa chọn JSON, CSV hoặc định dạng riêng theo kiểu truy cập
  - Thiết kế tiêu đề tệp với dấu nhận diện và phiên bản
  - Phân tách bản ghi bằng dấu kết thúc, độ dài hoặc kích thước cố định
  - Thiết kế bản ghi nhiều dòng và quy tắc thoát ký tự
  - Biểu diễn khóa, giá trị null và dữ liệu tùy chọn
  - Bảo toàn số thập phân, ngày giờ và định danh dài
  - Giới hạn độ dài bản ghi và kiểm tra tràn khi tính kích thước
  - Thiết kế mã kiểm tra cho bản ghi và khối dữ liệu
  - Phát hiện bản ghi chưa ghi xong và vùng dữ liệu chưa sử dụng
  - Đánh giá lưu đối tượng Java bằng ObjectOutputStream
  - Đánh giá tương thích và rủi ro khi đọc lại đối tượng Java
  - Tách bộ mã hóa dữ liệu khỏi cơ chế đọc ghi tệp
- level1: Tổ chức thư mục
  level2:
  - Thiết kế cấu trúc thư mục theo tập dữ liệu và loại đối tượng
  - Phân chia thư mục theo khóa băm để tránh tập trung quá nhiều tệp
  - Phân vùng dữ liệu theo thời gian hoặc phạm vi nghiệp vụ
  - Đặt tên tệp dữ liệu, tệp tạm, tệp khóa và tệp chỉ mục
  - Thiết kế tệp kê khai (manifest) cho một thế hệ dữ liệu
  - Phân biệt dữ liệu đang hoạt động và dữ liệu chờ công bố
  - Quản lý tệp không còn được tham chiếu
  - Giữ cấu trúc thư mục ổn định khi số lượng đối tượng tăng
  - Thiết kế kiểm kê dữ liệu mà không phải đọc toàn bộ nội dung
  - Kiểm tra tính nhất quán giữa manifest và các tệp thực tế
- level1: Ghi thay thế an toàn
  level2:
  - Rủi ro khi cắt ngắn tệp cũ trước khi ghi bản mới
  - Thiết kế ghi bản mới vào tệp tạm cùng khu vực lưu trữ
  - Ghi đủ nội dung và kiểm tra trước khi công bố
  - Phân biệt hoàn tất ghi nội dung và đổi tên công bố
  - Sử dụng yêu cầu di chuyển nguyên tử và kiểm tra khả năng hỗ trợ
  - Xử lý trường hợp di chuyển qua hai hệ thống tệp
  - Xác định chính sách khi thao tác nguyên tử không được hỗ trợ
  - Bảo vệ bản cũ khi bản mới ghi thất bại
  - Phối hợp ghi thay thế với người đọc đang mở tệp
  - Xử lý tệp tạm sót lại và xác định phiên bản đang có hiệu lực
  - Kiểm tra trạng thái thực sau khi kết quả đổi tên không rõ ràng
- level1: Độ bền dữ liệu
  level2:
  - Phân biệt nhìn thấy dữ liệu mới và dữ liệu tồn tại sau sự cố
  - Theo dõi đường đi từ bộ đệm Java tới thiết bị lưu trữ
  - Vai trò của FileChannel.force và FileDescriptor.sync
  - Phân biệt đồng bộ nội dung và đồng bộ siêu dữ liệu
  - Vai trò của tùy chọn SYNC và DSYNC khi mở tệp
  - Độ bền của thay đổi thư mục và giới hạn API khả chuyển
  - Thiết kế thời điểm xác nhận ghi thành công cho bên gọi
  - Lựa chọn đồng bộ từng bản ghi, từng khối hoặc theo chu kỳ
  - Phân biệt lỗi tiến trình, lỗi hệ điều hành và mất nguồn
  - Đánh giá bảo đảm trên hệ thống tệp và thiết bị thực tế
  - Lưu bằng chứng về cấu hình và mức bảo đảm độ bền đã kiểm chứng
- level1: Đồng thời trong tiến trình
  level2:
  - Phân biệt an toàn luồng và an toàn dữ liệu bền vững
  - Lựa chọn một luồng ghi và hàng đợi yêu cầu ghi
  - Đồng bộ thao tác đọc sửa ghi như một đơn vị nghiệp vụ
  - Sử dụng khóa đọc ghi theo phạm vi dữ liệu
  - Quản lý khóa theo đường dẫn hoặc khóa đối tượng
  - Tránh tạo hai khóa cho cùng một tệp qua các đường dẫn khác nhau
  - Phối hợp thay thế tệp với bộ nhớ đệm và người đọc
  - Phân biệt đọc ảnh chụp ổn định và đọc trạng thái đang thay đổi
  - Thiết kế thứ tự lấy khóa để tránh bế tắc (deadlock)
  - Xử lý hủy, timeout và lỗi trong vùng giữ khóa
  - Kiểm tra cập nhật đồng thời không làm mất thay đổi đã ghi
- level1: Khóa giữa tiến trình
  level2:
  - Phạm vi bảo vệ của khóa Java và khóa tệp hệ điều hành
  - Sử dụng FileLock với FileChannel
  - Phân biệt khóa chia sẻ và khóa độc quyền
  - Khóa toàn tệp và khóa theo vùng byte
  - Phân biệt chờ khóa và thử lấy khóa không chờ
  - Xử lý vùng khóa chồng lấn trong cùng JVM
  - Đánh giá sự tuân thủ khóa của các tiến trình truy cập
  - Quản lý vòng đời khóa khi đóng kênh hoặc tiến trình kết thúc
  - Thiết kế tệp khóa và giới hạn của khóa dựa trên sự tồn tại
  - Xử lý đổi tên và thay thế tệp đang được dùng làm đối tượng khóa
  - Kiểm chứng hành vi khóa trên Windows, Linux và hệ thống tệp từ xa
- level1: Nhật ký nối tiếp
  level2:
  - Mô hình lưu bằng cách nối thêm bản ghi thay đổi
  - Phân biệt nhật ký dữ liệu và nhật ký chẩn đoán ứng dụng
  - Thiết kế bản ghi tạo, cập nhật và xóa
  - Đánh số thứ tự và nhận diện bản ghi đã áp dụng
  - Ghi đầy đủ một bản ghi và đánh dấu ranh giới hợp lệ
  - Xử lý nhiều bên ghi mà không giả định mọi lần ghi nối là nguyên tử
  - Phát hiện và bỏ qua phần đuôi bị ghi dở khi phục hồi
  - Phát lại nhật ký để dựng trạng thái trong bộ nhớ
  - Chia nhật ký thành các phân đoạn
  - Xác định thời điểm chuyển phân đoạn và đóng phân đoạn cũ
  - Thiết kế xác nhận ghi theo mức độ bền đã chọn
- level1: Chỉ mục và tra cứu
  level2:
  - Phân biệt dữ liệu nguồn và chỉ mục có thể tái tạo
  - Ánh xạ khóa nghiệp vụ đến tệp, phân đoạn và độ lệch byte
  - Xây dựng chỉ mục trong bộ nhớ khi khởi động
  - Lưu chỉ mục trên đĩa để giảm thời gian khởi động
  - Tra cứu theo khóa, theo khoảng và theo thứ tự
  - Cập nhật chỉ mục khi bản ghi đổi vị trí hoặc bị xóa
  - Phối hợp ghi dữ liệu và cập nhật chỉ mục
  - Phát hiện chỉ mục cũ hoặc không khớp thế hệ dữ liệu
  - Xây dựng lại chỉ mục từ tệp nguồn có kiểm chứng
  - Đánh đổi giữa kích thước chỉ mục, bộ nhớ và số lần đọc tệp
- level1: Bản chụp và hợp nhất
  level2:
  - Bản chụp trạng thái (snapshot) và mục tiêu rút ngắn phục hồi
  - Chọn thời điểm tạo bản chụp nhất quán
  - Phối hợp bản chụp với vị trí đã áp dụng trong nhật ký
  - Ghi và công bố bản chụp như một thế hệ dữ liệu mới
  - Kiểm tra bản chụp trước khi thay thế bản đang sử dụng
  - Hợp nhất dữ liệu để loại bỏ phiên bản cũ và bản ghi xóa
  - Giữ khả năng đọc trong lúc xây dựng dữ liệu hợp nhất
  - Xử lý thay đổi mới phát sinh trong quá trình hợp nhất
  - Cập nhật manifest và chuyển thế hệ dữ liệu
  - Xóa phân đoạn cũ sau khi không còn người đọc hoặc bản sao lưu phụ thuộc
  - Đánh giá chi phí ghi lại và khoảng dung lượng tạm cần thiết
- level1: Giao dịch nhiều tệp
  level2:
  - Vì sao ghi thành công từng tệp chưa đủ cho giao dịch nhiều tệp
  - Xác định đơn vị thay đổi cần được công bố đồng thời
  - Dùng thế hệ dữ liệu và manifest để công bố một tập tệp
  - Thiết kế bản ghi chuẩn bị và dấu xác nhận hoàn tất
  - Nguyên tắc ghi nhật ký trước khi sửa dữ liệu gốc
  - Phân biệt phục hồi bằng áp dụng lại và bằng hoàn tác
  - Thiết kế thứ tự ghi, đồng bộ và công bố trạng thái
  - Phát hiện giao dịch chưa hoàn tất sau khi khởi động lại
  - Bảo đảm áp dụng lại hoặc hoàn tác có tính lũy đẳng
  - Phối hợp khóa với giao dịch cập nhật nhiều đối tượng
  - Đánh giá khi độ phức tạp giao dịch vượt phạm vi lưu trữ bằng tệp
- level1: Khôi phục sau sự cố
  level2:
  - Xác định các trạng thái có thể có sau mỗi điểm gián đoạn
  - Phân biệt tệp thiếu, tệp rỗng, tệp hỏng và tệp ghi dở
  - Quét và xác định phần dữ liệu hợp lệ có thể sử dụng
  - Kiểm tra bản chụp và lựa chọn chuỗi nhật ký cần phát lại
  - Phục hồi giao dịch chưa hoàn tất theo giao thức đã thiết kế
  - Xử lý tệp tạm, tệp mồ côi và thế hệ chưa được công bố
  - Giữ nguyên bằng chứng hỏng dữ liệu trước khi sửa chữa
  - Thiết kế chế độ chỉ đọc khi chưa thể bảo đảm tính nhất quán
  - Thực hiện phục hồi có thể chạy lại nhiều lần
  - Đối soát bất biến và chỉ mục trước khi mở lại quyền ghi
  - Báo cáo dữ liệu đã khôi phục và phần chưa thể xác nhận
- level1: Toàn vẹn dữ liệu
  level2:
  - Phân biệt lỗi cấu trúc, lỗi nội dung và lỗi nghiệp vụ
  - Kiểm tra dấu nhận diện, phiên bản và kích thước khai báo
  - Dùng mã kiểm tra (checksum) để phát hiện hỏng bản ghi và phân đoạn
  - Phân biệt phát hiện hỏng dữ liệu và chống sửa đổi có chủ đích
  - Đối chiếu số lượng bản ghi và tổng kiểm soát
