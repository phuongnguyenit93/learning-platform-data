menu:
- level1: Nền tảng ORM
  level2:
  - Ánh xạ đối tượng quan hệ (ORM) là gì và giải quyết vấn đề nào
  - Khác biệt giữa mô hình đối tượng và mô hình dữ liệu quan hệ
  - Phân biệt entity, đối tượng giá trị, DTO và bản ghi trong bảng
  - JPA là đặc tả và vai trò của Jakarta Persistence
  - Phân biệt JPA, Hibernate, JDBC và Spring Data JPA
  - Luồng xử lý từ thay đổi đối tượng đến câu SQL và giao dịch
  - Những kiến thức Java, SQL và giao dịch cần có
  - Đánh giá lợi ích, chi phí và giới hạn của ORM
  - Khi nào nên dùng JPA, JDBC hoặc phối hợp nhiều cách truy cập
  - Các thuật ngữ cốt lõi và trình tự học JPA
- level1: Kiến trúc JPA
  level2:
  - Vai trò của Persistence, EntityManagerFactory và EntityManager
  - Vai trò của provider trong triển khai đặc tả
  - Mối liên hệ giữa persistence unit, nguồn dữ liệu và mô hình entity
  - Ngữ cảnh lưu trữ (persistence context) và đơn vị công việc
  - Phân biệt quản lý entity và quản lý kết nối JDBC
  - Phân biệt cơ chế do ứng dụng quản lý và do môi trường quản lý
  - Giao dịch cục bộ và giao dịch JTA trong kiến trúc JPA
  - Phạm vi chuẩn JPA và tính năng mở rộng của provider
  - Kiểm tra phiên bản đặc tả cùng mức hỗ trợ thực tế
  - Ranh giới trách nhiệm giữa JPA và cơ sở dữ liệu
- level1: Persistence Unit
  level2:
  - Thiết kế một persistence unit cho một mô hình dữ liệu
  - Cấu trúc và vai trò của persistence.xml
  - Khai báo lớp entity, tệp ánh xạ và nguồn dữ liệu
  - Khởi tạo EntityManagerFactory trong Java SE
  - Tạo và đóng EntityManager do ứng dụng quản lý
  - Tiêm EntityManager bằng PersistenceContext trong môi trường quản lý
  - Phân biệt ngữ cảnh theo giao dịch và ngữ cảnh mở rộng
  - Lựa chọn kiểu giao dịch RESOURCE_LOCAL hoặc JTA
  - Phân biệt thuộc tính cấu hình chuẩn và thuộc tính riêng của provider
  - Quản lý nhiều persistence unit trong cùng ứng dụng
  - Quản lý vòng đời và giới hạn chia sẻ EntityManager giữa các luồng
- level1: Entity và định danh
  level2:
  - Điều kiện để một lớp trở thành entity
  - Vai trò của Entity, Table và tên entity
  - Constructor không tham số và khả năng khởi tạo entity
  - Phân biệt truy cập qua trường và qua thuộc tính
  - Thiết lập Access nhất quán trong mô hình ánh xạ
  - Phân biệt định danh Java, định danh entity và khóa chính
  - Thiết kế equals và hashCode theo vòng đời định danh
  - Tránh đưa quan hệ tải chậm vào equals, hashCode và toString
  - Xử lý entity trong Set khi khóa được sinh sau thời điểm tạo
  - Ràng buộc lớp entity và khả năng dùng đối tượng bất biến theo phiên bản
  - Phân biệt ánh xạ entity và ánh xạ DTO dạng record
- level1: Ánh xạ thuộc tính
  level2:
  - Ánh xạ thuộc tính cơ bản bằng Basic và Column
  - Khai báo tên cột, tính nullable và các thuộc tính ánh xạ
  - Phân biệt insertable, updatable và ràng buộc dữ liệu thực tế
  - Phân biệt trường không lưu với Transient và từ khóa transient
  - Ánh xạ số nguyên, số thập phân và precision, scale
  - Ánh xạ chuỗi, Unicode và giới hạn độ dài
  - Ánh xạ enum theo tên hoặc theo thứ tự
  - Ánh xạ dữ liệu nhị phân và nội dung lớn bằng Lob
  - Ánh xạ ngày giờ theo ngữ nghĩa của kiểu Java và SQL
  - Làm việc với kiểu thời gian cũ và Temporal khi cần
  - Đánh giá các kiểu đặc thù vượt phạm vi ánh xạ chuẩn
  - Ánh xạ một entity vào nhiều bảng bằng SecondaryTable
- level1: Kiểu giá trị
  level2:
  - Thiết kế đối tượng giá trị có ý nghĩa nghiệp vụ
  - Nhúng đối tượng giá trị bằng Embeddable và Embedded
  - Nhúng nhiều lần cùng kiểu và dùng AttributeOverride
  - Ghi đè ánh xạ quan hệ trong đối tượng nhúng
  - Phân biệt đối tượng nhúng và entity có định danh riêng
  - Ánh xạ cấu trúc nhúng lồng nhau
  - Biểu diễn null trong cấu trúc có nhiều thuộc tính
  - Chuyển đổi giá trị bằng AttributeConverter
  - Áp dụng converter tường minh và tự động
  - Đánh giá tương thích khi quy tắc chuyển đổi thay đổi
  - Giới hạn converter với định danh, phiên bản và kiểu ánh xạ đặc biệt
- level1: Khóa và chiến lược sinh
  level2:
  - Lựa chọn khóa nghiệp vụ và khóa thay thế
  - Ánh xạ khóa chính đơn bằng Id
  - Dùng khóa do ứng dụng cấp trước khi persist
  - Vai trò của GeneratedValue và chiến lược AUTO
  - Sinh khóa bằng IDENTITY và ảnh hưởng tới thời điểm chèn dữ liệu
  - Sinh khóa bằng SEQUENCE và cấu hình SequenceGenerator
  - Sinh khóa bằng TABLE và cấu hình TableGenerator
  - Sinh khóa UUID theo phiên bản đặc tả được sử dụng
  - Kiểm tra hỗ trợ chiến lược sinh theo hệ quản trị và provider
  - Phân biệt khóa đã cấp và dữ liệu đã được commit
  - Xử lý khoảng trống số thứ tự và kỳ vọng nghiệp vụ về mã định danh
- level1: Khóa ghép
  level2:
  - Khi nào cần khóa chính gồm nhiều thành phần
  - Ánh xạ khóa ghép bằng EmbeddedId
  - Ánh xạ khóa ghép bằng IdClass
  - Thiết kế equals và hashCode cho lớp khóa
  - Yêu cầu tương ứng giữa lớp khóa và thuộc tính entity
  - Ánh xạ khóa ngoại nhiều cột bằng JoinColumns
  - Định danh dẫn xuất từ entity liên quan
  - Sử dụng MapsId cho khóa chia sẻ hoặc khóa có thành phần liên kết
  - Truy vấn theo thành phần của khóa ghép
  - Đánh giá chi phí bảo trì khi khóa nghiệp vụ có thể thay đổi
- level1: Quan hệ thực thể
  level2:
  - Chuyển quan hệ nghiệp vụ thành liên kết giữa các entity
  - Phân biệt quan hệ đơn hướng và hai hướng
  - Phía sở hữu quan hệ và vai trò của mappedBy
  - Mối liên hệ giữa khóa ngoại, JoinColumn và bảng liên kết
  - Phân biệt tính bắt buộc của quan hệ và ràng buộc NOT NULL
  - Đồng bộ hai phía quan hệ bằng phương thức nghiệp vụ
  - Phân biệt thay đổi liên kết và thay đổi vòng đời entity
  - Thiết kế ranh giới đối tượng nghiệp vụ thay vì nối mọi bảng thành đồ thị
  - Phân biệt tải dữ liệu quan hệ và lan truyền thao tác
  - Kiểm chứng mô hình quan hệ qua SQL và dữ liệu thực tế
- level1: Quan hệ một-một
  level2:
  - Ánh xạ quan hệ một-một với khóa ngoại duy nhất
  - Lựa chọn phía sở hữu cho quan hệ hai hướng
  - Ánh xạ một-một với khóa chính chia sẻ
  - Sử dụng MapsId trong mô hình cha và phần mở rộng
  - Xử lý quan hệ tùy chọn và entity liên quan chưa tồn tại
  - Đánh giá việc tải quan hệ một-một theo chuẩn và provider
  - Cập nhật hoặc thay thế đối tượng liên quan đúng phía sở hữu
  - Lựa chọn một-một, đối tượng nhúng hoặc gộp cùng entity
- level1: Quan hệ một-nhiều
  level2:
  - Ánh xạ ManyToOne phía giữ khóa ngoại
  - Ánh xạ OneToMany hai hướng bằng mappedBy
  - Ánh xạ OneToMany đơn hướng qua cột khóa ngoại hoặc bảng liên kết
  - Thêm và bỏ phần tử mà vẫn đồng bộ hai phía
  - Di chuyển đối tượng con từ cha này sang cha khác
  - Phân biệt bỏ liên kết, đặt khóa ngoại null và xóa bản ghi con
  - Quản lý tập con lớn mà không tải toàn bộ vào bộ nhớ
  - Đánh giá thứ tự cập nhật và ràng buộc khóa ngoại
  - Ngăn lặp vô hạn khi biểu diễn đồ thị hai hướng
  - Kiểm thử thao tác lưu, chuyển và xóa đối tượng liên quan
- level1: Quan hệ nhiều-nhiều
  level2:
  - Ánh xạ ManyToMany qua JoinTable
  - Lựa chọn phía sở hữu và đồng bộ tập liên kết
  - Thiết kế khóa và ràng buộc duy nhất cho bảng liên kết
  - Thêm và xóa liên kết mà không xóa entity đầu kia
  - Đánh giá rủi ro lan truyền REMOVE trong quan hệ nhiều-nhiều
  - Khi nào cần chuyển bảng liên kết thành entity riêng
  - Ánh xạ quan hệ có thuộc tính như số lượng, trạng thái và thời điểm
  - Đánh giá chi phí tải và cập nhật tập liên kết lớn
- level1: Tập hợp và Map
  level2:
  - Phân biệt tập hợp entity và tập hợp giá trị
  - Ánh xạ giá trị cơ bản bằng ElementCollection
  - Ánh xạ tập đối tượng nhúng bằng CollectionTable
  - Lựa chọn List, Set, Collection và Map theo ngữ nghĩa dữ liệu
  - Phân biệt sắp xếp bằng OrderBy và lưu vị trí bằng OrderColumn
  - Xử lý phần tử trùng và ảnh hưởng của equals, hashCode
  - Ánh xạ khóa Map từ thuộc tính của đối tượng liên quan
  - Ánh xạ cột khóa Map và khóa Map là entity
  - Ghi đè thuộc tính của khóa và giá trị nhúng trong Map
  - Theo dõi thay đổi tập hợp và chi phí SQL khi cập nhật
  - Giữ quyền quản lý tập hợp khi entity đang được theo dõi
- level1: Kế thừa
  level2:
  - Phân biệt kế thừa Java và kế thừa trong mô hình lưu trữ
  - Tái sử dụng ánh xạ bằng MappedSuperclass
  - Ánh xạ hệ phân cấp bằng SINGLE_TABLE
  - Ánh xạ hệ phân cấp bằng JOINED
  - Ánh xạ hệ phân cấp bằng TABLE_PER_CLASS
  - Vai trò của cột phân biệt và giá trị phân biệt
  - Truy vấn đa hình và phạm vi entity được trả về
  - Giới hạn định danh và ánh xạ trong hệ phân cấp
  - Đánh giá ràng buộc cột, số phép nối và chi phí truy vấn
  - Lựa chọn kế thừa hoặc kết hợp đối tượng theo yêu cầu nghiệp vụ
- level1: Persistence Context
  level2:
  - Định danh duy nhất của entity trong cùng ngữ cảnh lưu trữ
  - Mối liên hệ giữa EntityManager và tập entity được quản lý
  - Phân biệt trạng thái trong bộ nhớ và trạng thái trong cơ sở dữ liệu
  - Tìm entity bằng find và hành vi khi entity đã được quản lý
  - Lấy tham chiếu bằng getReference và thời điểm cần truy cập dữ liệu
  - Kiểm tra entity được quản lý bằng contains
  - Tách một entity bằng detach và tách toàn bộ bằng clear
  - Đọc lại dữ liệu bằng refresh và ảnh hưởng đến thay đổi chưa đồng bộ
  - Phân biệt phạm vi persistence context và phạm vi giao dịch
  - Xử lý ngữ cảnh sống lâu và dữ liệu có thể đã cũ
  - Kiểm tra trạng thái tải bằng PersistenceUnitUtil và PersistenceUtil
- level1: Vòng đời entity
  level2:
  - Phân biệt entity mới, được quản lý, đã tách và chờ xóa
  - Lưu entity mới bằng persist
  - Theo dõi thay đổi entity đang được quản lý
  - Đánh dấu entity để xóa bằng remove
  - Chuyển trạng thái từ detached bằng merge
  - Phân biệt đối tượng nguồn và đối tượng trả về từ merge
  - Xử lý quan hệ tới entity mới chưa được lưu
  - Phân biệt cập nhật entity đang quản lý và hợp nhất đồ thị đã tách
  - Xử lý entity đã xóa hoặc entity không còn tồn tại trong cơ sở dữ liệu
  - Tác động của commit, rollback và đóng ngữ cảnh tới vòng đời entity
  - Thiết kế phương thức nghiệp vụ dựa trên trạng thái entity thực tế
- level1: Đồng bộ và flush
  level2:
  - Cơ chế phát hiện thay đổi và đồng bộ entity xuống cơ sở dữ liệu
  - Phân biệt persist, flush và commit
  - Khi nào provider có thể thực thi SQL trước commit
  - Vai trò của FlushModeType.AUTO và COMMIT
  - Ảnh hưởng của truy vấn đến thời điểm đồng bộ
  - Thực hiện flush tường minh để xác định lỗi sớm
  - Phân biệt thứ tự gọi phương thức và thứ tự SQL thực tế
  - Ảnh hưởng của chiến lược sinh khóa tới thao tác ghi
  - Xử lý lỗi ràng buộc khi flush
  - Phối hợp flush và clear khi xử lý nhiều entity
  - Xác minh dữ liệu sau khi đồng bộ mà không chỉ đọc từ ngữ cảnh cũ
- level1: Giao dịch
  level2:
  - Ranh giới giao dịch và tính đúng của thao tác nghiệp vụ
  - Điều khiển giao dịch cục bộ bằng EntityTransaction
  - Phối hợp begin, commit và rollback có xử lý lỗi
  - Kiểm tra trạng thái giao dịch và cờ rollback-only
  - Phân biệt giao dịch đang hoạt động và persistence context đang tồn tại
  - Gia nhập giao dịch JTA bằng joinTransaction khi phù hợp
  - Ngữ cảnh đồng bộ và không đồng bộ với giao dịch JTA
  - Quyền sở hữu giao dịch trong ứng dụng và trong môi trường quản lý
  - Xử lý entity trong bộ nhớ sau khi rollback
  - Tránh gọi hệ thống ngoài trong lúc giữ giao dịch cơ sở dữ liệu
  - Phân biệt bảo đảm JPA và mức cô lập do cơ sở dữ liệu cung cấp
  - Thiết kế một giao dịch cho toàn bộ thay đổi nghiệp vụ liên quan
- level1: Cascade và orphanRemoval
  level2:
  - Vai trò của cascade trong lan truyền thao tác vòng đời
  - Áp dụng PERSIST cho đồ thị có entity mới
  - Áp dụng MERGE khi hợp nhất đồ thị đã tách
  - Áp dụng REMOVE theo ranh giới sở hữu dữ liệu
  - Vai trò của REFRESH và DETACH khi lan truyền
  - Đánh giá phạm vi và rủi ro của CascadeType.ALL
  - Phân biệt cascade JPA và ON DELETE CASCADE của cơ sở dữ liệu
  - Vai trò của orphanRemoval trong quan hệ phù hợp
  - Phân biệt bỏ đối tượng con khỏi quan hệ và gọi remove
  - Phối hợp orphanRemoval với phía sở hữu và ràng buộc khóa ngoại
  - Kiểm thử đồ thị dùng chung để tránh xóa dữ liệu ngoài ý muốn
- level1: JPQL cơ bản
  level2:
  - JPQL truy vấn theo entity và thuộc tính thay vì tên bảng và cột
  - Tạo Query và TypedQuery qua EntityManager
  - Chọn entity, thuộc tính và nhiều biểu thức kết quả
  - Gán tham số theo tên và theo vị trí
  - Lọc dữ liệu với toán tử so sánh, logic và điều kiện NULL
  - Sử dụng LIKE, BETWEEN và IN theo ngữ nghĩa JPQL
  - Sắp xếp kết quả và xử lý giá trị bằng nhau
  - Thực hiện phép nối tường minh và truy cập đường dẫn quan hệ
  - Phân biệt INNER JOIN và LEFT JOIN trong truy vấn đối tượng
  - Đọc danh sách, một kết quả và xử lý không có hoặc có nhiều kết quả
  - Khai báo truy vấn có tên để quản lý và tái sử dụng
  - Áp dụng query hint và kiểm tra khả năng hỗ trợ
  - Đọc kết quả qua getResultStream và quản lý tài nguyên liên quan
- level1: JPQL nâng cao
  level2:
  - Tổng hợp dữ liệu bằng COUNT, SUM, AVG, MIN và MAX
  - Nhóm và lọc nhóm bằng GROUP BY và HAVING
  - Xử lý DISTINCT khi truy vấn entity và giá trị
  - Viết truy vấn con trong phạm vi chuẩn JPQL
  - Liên kết truy vấn con với dữ liệu của truy vấn ngoài
  - Kiểm tra quan hệ bằng EXISTS, MEMBER OF và IS EMPTY
  - Sử dụng SIZE, INDEX và các biểu thức cho tập hợp
  - Biểu diễn điều kiện bằng CASE, COALESCE và NULLIF
  - Lựa chọn hàm chuỗi, số và ngày giờ theo phiên bản đặc tả
  - Truy vấn đa hình bằng TYPE và TREAT
  - Gọi hàm cơ sở dữ liệu qua FUNCTION và đánh giá tính khả chuyển
  - Ánh xạ trực tiếp kết quả bằng biểu thức khởi tạo DTO
- level1: Criteria API
  level2:
  - Khi nào nên xây dựng truy vấn động bằng Criteria API
  - Vai trò của CriteriaBuilder, CriteriaQuery và Root
  - Truy cập thuộc tính bằng Path và mô hình siêu dữ liệu có kiểu
  - Kết hợp Predicate theo điều kiện tìm kiếm tùy chọn
  - Dùng ParameterExpression để tách cấu trúc và giá trị
  - Thiết kế Join và Fetch trong cây truy vấn
  - Chọn entity, DTO, giá trị tổng hợp và Tuple
  - Nhóm, lọc nhóm và sắp xếp kết quả
  - Tạo truy vấn con và truy vấn con tương quan
