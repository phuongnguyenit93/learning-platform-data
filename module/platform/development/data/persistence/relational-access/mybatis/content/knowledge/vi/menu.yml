  - Thời điểm cache và giao dịch được phối hợp
  - Chính sách loại bỏ, thời hạn và giới hạn dung lượng
  - Chế độ readOnly và sao chép giá trị trong cache cho phép thay đổi
  - Khả năng tuần tự hóa và hợp đồng của giá trị cache
  - Dữ liệu thay đổi ngoài namespace và nguy cơ cache cũ
  - Kiểm chứng cache khi nhiều phiên hoặc nhiều tiến trình cùng truy cập
- level1: Tích hợp Spring
  level2:
  - Vai trò của MyBatis-Spring trong ứng dụng
  - Tạo SqlSessionFactoryBean từ DataSource
  - SqlSessionTemplate và vòng đời phiên theo giao dịch Spring
  - Đăng ký Mapper bằng @MapperScan
  - Đăng ký tường minh với MapperFactoryBean
  - Tiêm Mapper vào dịch vụ nghiệp vụ
  - Cấu hình transaction manager dùng cùng DataSource
  - Phối hợp @Transactional với các lời gọi Mapper
  - Quyền quản lý commit, rollback và close trong môi trường Spring
  - Chuyển lỗi truy cập dữ liệu sang DataAccessException
  - Giới hạn khi trộn SqlSession độc lập với phiên do Spring quản lý
  - Cấu hình nhiều SqlSessionFactory và liên kết đúng Mapper
  - Giới hạn đổi loại executor trong một giao dịch Spring
- level1: Spring Boot
  level2:
  - Chọn phiên bản starter tương thích Spring Boot và JDK
  - Điều kiện tự cấu hình DataSource, SqlSessionFactory và SqlSessionTemplate
  - Quét Mapper bằng @Mapper và @MapperScan
  - Cấu hình đường dẫn XML bằng mybatis.mapper-locations
  - Đăng ký package chứa bí danh kiểu và TypeHandler
  - Dùng cấu hình mybatis.configuration hoặc tệp config-location
  - Phân biệt configuration-properties với các thiết lập của Configuration
  - Tùy biến cấu hình bằng các điểm mở rộng của starter
  - Đăng ký interceptor và thành phần tùy biến trong Spring
  - Cấu hình theo môi trường mà không đưa bí mật vào mã nguồn
  - Xử lý trường hợp nhiều DataSource cần cấu hình tường minh
  - Kiểm tra tài nguyên XML và bean Mapper khi đóng gói ứng dụng
- level1: Truy vấn lớn
  level2:
  - Giới hạn kết quả tại câu lệnh SQL
  - Phân trang bằng LIMIT, OFFSET hoặc cú pháp tương ứng
  - Phân trang theo khóa cho dữ liệu tăng trưởng lớn
  - RowBounds và khác biệt với phân trang tại cơ sở dữ liệu
  - Chọn thứ tự ổn định khi kết quả có giá trị trùng
  - Dùng Cursor để duyệt kết quả và đóng tài nguyên đúng lúc
  - Dùng ResultHandler để xử lý kết quả theo nhu cầu
  - Vai trò fetchSize và điều kiện phụ thuộc JDBC driver
  - Giữ kết nối và giao dịch trong lúc đọc dữ liệu theo luồng
  - Đọc theo lô để giới hạn bộ nhớ và thời gian giữ tài nguyên
  - Phân trang đối tượng cha khi ánh xạ collection qua JOIN
  - Kiểm soát chi phí đếm tổng số kết quả
- level1: Đồng thời
  level2:
  - Phạm vi an toàn luồng của factory, phiên và Mapper
  - Tách an toàn luồng khỏi tính đúng đắn của giao dịch
  - Cuộc đua giữa kiểm tra tồn tại và thêm bản ghi
  - Dùng ràng buộc duy nhất để bảo vệ dữ liệu
  - Khóa lạc quan bằng cột phiên bản trong SQL
  - Phát hiện xung đột qua số hàng bị ảnh hưởng
  - Khóa bi quan bằng cú pháp hệ quản trị hỗ trợ
  - Cập nhật tăng giảm nguyên tử thay vì đọc rồi ghi lại
  - Deadlock, timeout khóa và thứ tự truy cập dữ liệu
  - Thử lại toàn giao dịch khi xung đột có thể phục hồi
  - Bảo vệ bất biến trải trên nhiều bản ghi hoặc nhiều bảng
- level1: Đa hệ quản trị
  level2:
  - Vai trò của databaseIdProvider
  - Khai báo statement theo databaseId
  - Dùng _databaseId trong SQL động
  - Khác biệt cú pháp phân trang, upsert và sinh khóa
  - Quy tắc trích dẫn tên bảng hoặc cột theo hệ quản trị
  - Khác biệt kiểu boolean, ngày giờ và số chính xác
  - Ánh xạ dữ liệu JSON hoặc kiểu đặc thù bằng TypeHandler
  - Gọi stored procedure bằng statementType CALLABLE
  - Tham số IN, OUT và INOUT trong lời gọi thủ tục
  - Xử lý nhiều result set khi driver và hệ quản trị hỗ trợ
  - Ánh xạ câu lệnh ghi trả dữ liệu và vai trò của affectData
  - Xây bộ kiểm thử tương thích trên từng hệ quản trị được hỗ trợ
- level1: Mở rộng MyBatis
  level2:
  - Những trường hợp cần mở rộng thay vì cấu hình sẵn có
  - Viết plugin bằng Interceptor
  - Khai báo @Intercepts và @Signature
  - Các điểm can thiệp Executor, StatementHandler, ParameterHandler và ResultSetHandler
  - Kiểm soát phạm vi và thứ tự thực thi plugin
  - Đọc BoundSql mà không làm lộ dữ liệu nhạy cảm
  - Nguy cơ thay đổi SQL nhưng không đồng bộ tham số hoặc cache key
  - Tùy biến tạo đối tượng bằng ObjectFactory
  - Tùy biến ngôn ngữ SQL bằng LanguageDriver
  - Phân biệt plugin tự viết với tiện ích phân trang của bên thứ ba
  - Kiểm chứng tính tương thích và chi phí của thành phần mở rộng
- level1: Tổ chức mã
  level2:
  - Đặt Mapper và SQL theo miền nghiệp vụ
  - Tách mô hình lưu trữ khỏi DTO giao tiếp bên ngoài
  - Thiết kế truy vấn phục vụ đọc theo hình dạng dữ liệu cần dùng
  - Đặt ranh giới giữa Service, Repository và Mapper
  - Quy ước tên statement, tham số và resultMap
  - Quản lý SQL phức tạp mà vẫn kiểm tra được kế hoạch thực thi
  - Tách migration lược đồ khỏi logic ánh xạ
  - Vai trò MyBatis Generator và phạm vi mã có thể sinh
  - Lựa chọn target runtime và phụ thuộc của mã sinh
  - Tách phần sinh tự động khỏi SQL hoặc mô hình tự viết
  - Rà soát thay đổi khi sinh lại từ lược đồ mới
  - Tránh giả định MyBatis-Plus hoặc tiện ích bên ngoài là khả năng của lõi
- level1: Bảo mật
  level2:
  - 'Ràng buộc giá trị bằng #{...} để hạn chế SQL injection'
  - Rủi ro thay thế trực tiếp chuỗi bằng ${...}
  - Danh sách cho phép đối với tên cột, bảng và hướng sắp xếp
  - Ngăn SQL động cập nhật hoặc xóa ngoài phạm vi cho phép
  - Áp dụng điều kiện phân quyền và phân tách đơn vị thuê
  - Phân biệt lọc theo quyền với chỉ nhận định danh từ người dùng
  - Giới hạn kích thước collection và số lượng tham số
  - Giới hạn độ sâu hoặc độ phức tạp của truy vấn do đầu vào quyết định
  - Cấp quyền tối thiểu cho tài khoản cơ sở dữ liệu
  - Quản lý thông tin kết nối và mã hóa đường truyền
  - Che thông tin nhạy cảm trong SQL log và thông báo lỗi
  - Rà soát ảnh hưởng bảo mật của provider và plugin tùy biến
- level1: Kiểm thử
  level2:
  - Kiểm thử Mapper bằng cơ sở dữ liệu thật trong môi trường cô lập
  - Giới hạn của mock Mapper và cơ sở dữ liệu thay thế
  - Chuẩn bị migration cùng dữ liệu mẫu có thể lặp lại
  - Kiểm thử CRUD và số hàng bị ảnh hưởng
  - Kiểm thử null, enum, số chính xác và dữ liệu ngày giờ
  - Kiểm thử khóa sinh và ánh xạ về đúng đối tượng nguồn
  - Kiểm thử mọi nhánh SQL động và collection rỗng
  - Kiểm thử resultMap, JOIN và kết quả có quan hệ lồng nhau
  - Kiểm thử số truy vấn để phát hiện N+1 và tải lười ngoài ý muốn
  - Kiểm thử commit, rollback và lỗi khi flush batch
  - Kiểm thử cache giữa nhiều phiên có cập nhật dữ liệu
  - Kiểm thử đồng thời với lịch thực thi được kiểm soát
  - Dùng @MybatisTest khi phù hợp với cấu hình dự án
  - Kiểm tra khác biệt giữa rollback trong test và hành vi commit thực tế
- level1: Chẩn đoán lỗi
  level2:
  - Đọc chuỗi nguyên nhân của lỗi MyBatis và JDBC
  - Lỗi Invalid bound statement và liên kết namespace
  - Lỗi Parameter not found và tên @Param
  - Không tìm thấy Mapper XML trong tài nguyên đóng gói
  - Trùng mapped statement hoặc resultMap
  - Không tìm thấy thuộc tính getter hoặc setter phù hợp
  - Không tìm được constructor hay TypeHandler cho kiểu kết quả
  - TooManyResultsException khi truy vấn kỳ vọng một bản ghi
  - Lỗi SQL sau khi ghép nhánh động hoặc include
  - Lỗi jdbcType khi truyền null
  - Thiếu commit hoặc cấu hình sai transaction manager
  - Cursor hoặc quan hệ tải lười được dùng sau khi đóng tài nguyên
  - Khoanh vùng lỗi do driver, SQL, cấu hình hoặc mô hình Java
- level1: Hiệu năng
  level2:
  - Đo chi phí truy vấn và ánh xạ trong toàn bộ yêu cầu
  - Đọc SQL cùng tham số để tái hiện đúng truy vấn
  - Phân tích kế hoạch thực thi và mức sử dụng chỉ mục
  - Giảm cột và hàng được tải thay vì tối ưu chỉ phần Java
  - So sánh JOIN, nested select và nhiều truy vấn theo lô
  - Kiểm soát N+1, số lượt mạng và kích thước kết quả
  - Tối ưu batch theo tải thực tế và giới hạn driver
  - Đánh giá SIMPLE, REUSE và BATCH bằng phép đo phù hợp
  - Theo dõi bộ nhớ khi dựng đồ thị đối tượng lớn
  - Định cỡ connection pool theo năng lực xử lý của cơ sở dữ liệu
  - Chọn cache theo yêu cầu độ mới và cách dữ liệu bị cập nhật
  - Tránh dùng plugin hoặc cache để che truy vấn chưa được đo đạc
- level1: Vận hành
  level2:
  - Lựa chọn logging framework và mức log theo môi trường
  - Bật log theo Mapper hoặc statement cần chẩn đoán
  - Theo dõi truy vấn chậm, lỗi và thời gian chờ
  - Quan sát connection pool, giao dịch dài và chờ khóa
  - Theo dõi batch thất bại và các tác vụ cần đối soát
  - Quản lý tương thích giữa Mapper, lược đồ và phiên bản ứng dụng
  - Kiểm tra phụ thuộc và tài nguyên khi nâng cấp MyBatis hoặc driver
  - Xác minh cấu hình đang chạy sau triển khai
  - Lập quy trình xử lý cache cũ, thiếu kết nối và timeout
  - Bảo vệ dữ liệu thật khi tái hiện lỗi và đo tải
- level1: Thực hành tổng hợp
  level2:
  - Xây ứng dụng MyBatis độc lập cho một danh mục có CRUD
  - Thiết kế Mapper XML có tham số rõ ràng và resultMap tường minh
  - Xây bộ lọc động có phân trang và kiểm soát thứ tự sắp xếp
  - Ánh xạ đơn hàng cùng các dòng hàng từ kết quả JOIN
  - So sánh nested select với JOIN bằng số truy vấn và bộ nhớ
  - Viết TypeHandler cho giá trị nghiệp vụ có mã riêng
  - Ánh xạ mô hình đọc bất biến và kiểm thử giá trị null
  - Thực hiện batch có khóa sinh, lỗi giữa lô và rollback
  - Tích hợp dịch vụ Spring với nhiều thao tác trong một giao dịch
  - Kiểm chứng cache khi hai phiên lần lượt đọc và cập nhật
  - Xử lý cập nhật đồng thời bằng phiên bản và số hàng bị ảnh hưởng
  - Hoàn thiện kiểm thử tích hợp, phép đo và hướng dẫn chẩn đoán
