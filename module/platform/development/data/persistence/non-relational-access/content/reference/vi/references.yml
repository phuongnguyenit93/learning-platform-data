references:
  - title: "MongoDB Java Sync Driver"
    url: "https://www.mongodb.com/docs/drivers/java/sync/current/"
    description: "Java driver chính thức cho kết nối, CRUD và truy vấn MongoDB."
  - title: "Spring Data MongoDB Reference"
    url: "https://docs.spring.io/spring-data/mongodb/reference/"
    description: "Tài liệu MongoTemplate, mapping và repository cho MongoDB."
  - title: "Spring Data Redis Reference"
    url: "https://docs.spring.io/spring-data/redis/reference/"
    description: "Kết nối Redis, RedisTemplate và data access trong Spring."
  - title: "Apache Cassandra Java Driver"
    url: "https://apache.github.io/cassandra-java-driver/"
    description: "Tài liệu driver Java chính thức cho Cassandra và CQL."
  - title: "Neo4j Java Driver Manual"
    url: "https://neo4j.com/docs/java-manual/current/"
    description: "Kết nối Java, chạy Cypher và xử lý transaction trong Neo4j."