menu:
- level1: Nền tảng
  level2:
  - Tuần tự hóa (serialization) là gì và vì sao dữ liệu phải có dạng biểu diễn để lưu hoặc truyền
  - Giải tuần tự hóa (deserialization) và việc tái tạo dữ liệu trong một tiến trình khác
  - Phân biệt tuần tự hóa, mã hóa ký tự, chuyển đổi mô hình và nén dữ liệu
  - Phân biệt tuần tự hóa với mã hóa bảo mật, băm và ký dữ liệu
  - Marshalling, parsing, binding và codec trong toàn bộ chuỗi xử lý
  - Dạng biểu diễn trên đường truyền khác với cách đối tượng nằm trong bộ nhớ
  - Các bên ghi, bên đọc và thỏa thuận cần có để hiểu cùng một dữ liệu
  - Lộ trình với ví dụ trao đổi đơn hàng giữa Java, tệp và dịch vụ
- level1: Chuỗi xử lý
  level2:
  - Từ đối tượng miền đến DTO, cấu trúc dữ liệu, văn bản và byte
  - 'Chiều đọc: tách bản ghi, giải mã, phân tích cú pháp, ánh xạ và kiểm tra'
  - Xác định trách nhiệm của từng lớp trong chuỗi xử lý
  - Ranh giới giữa kiểm tra cú pháp, cấu trúc và ý nghĩa nghiệp vụ
  - Tuần tự hóa toàn đối tượng hoặc chỉ một phép chiếu có mục đích
  - Phân biệt lưu trạng thái với lưu hành vi hoặc tài nguyên đang mở
  - Điều kiện để chuyển đổi đi rồi về giữ được thông tin cần thiết
  - Định nghĩa tiêu chí tương đương khi kết quả đọc lại không phải cùng đối tượng Java
  - Nhận diện điểm có thể mất thông tin hoặc phát sinh tác dụng phụ
- level1: Bit và byte
  level2:
  - Bit, byte, dãy byte và vai trò trong định dạng lưu trữ
  - Biểu diễn số nguyên có dấu, không dấu và giới hạn của kiểu byte Java
  - Thứ tự byte big-endian, little-endian và thỏa thuận giữa bên ghi với bên đọc
  - Số có độ rộng cố định và số có độ dài biến đổi
  - Varint và ý tưởng biểu diễn số có dấu bằng ZigZag
  - Số dấu phẩy động và cách giữ hoặc mất độ chính xác
  - Độ dài, căn chỉnh và các trường điều khiển trong một cấu trúc nhị phân
  - ByteBuffer và ByteOrder khi đọc hoặc ghi dữ liệu theo bố cục
  - Đọc dãy byte bằng biểu diễn hexadecimal để chẩn đoán lỗi
- level1: Văn bản và Unicode
  level2:
  - Phân biệt ký tự, điểm mã Unicode, đơn vị mã và byte
  - UTF-8, UTF-16 và lựa chọn bộ ký tự theo thỏa thuận
  - Độ dài String khác với số byte hoặc số ký tự người dùng nhìn thấy
  - Chọn Charset tường minh thay vì dựa vào cấu hình mặc định
  - Byte Order Mark và cách xử lý theo định dạng hoặc giao thức
  - Ký tự không biểu diễn được, byte không hợp lệ và chính sách báo lỗi hoặc thay thế
  - Chuẩn hóa Unicode khác với mã hóa ký tự
  - Ký tự điều khiển, ký tự thoát và dấu phân cách trong văn bản
  - Xuống dòng LF hoặc CRLF và ý nghĩa khi tách bản ghi
  - Chuyển đổi byte–String nhiều lần và nguy cơ hỏng dữ liệu nhị phân
- level1: Kiểu và giá trị
  level2:
  - Ánh xạ kiểu dữ liệu của định dạng với kiểu Java
  - Thiếu trường, null, giá trị rỗng và giá trị mặc định
  - Số nguyên lớn và khả năng đọc của các hệ thống khác nhau
  - BigDecimal, giá trị thập phân và quy tắc giữ thang số
  - NaN, vô cực và số 0 có dấu trong những định dạng hỗ trợ khác nhau
  - Tiền tệ, đơn vị đo và thông tin không được suy đoán từ con số
  - Ngày, giờ địa phương, thời điểm và múi giờ
  - Enum, mã định danh và chính sách khi gặp mã mới
  - Dữ liệu nhị phân trong định dạng văn bản và vai trò của Base64
  - Tập hợp, thứ tự phần tử, khóa ánh xạ và phần tử trùng
  - Giữ ý nghĩa khi chuyển đổi từ kiểu mạnh sang cấu trúc dữ liệu tổng quát
- level1: Đồ thị đối tượng
  level2:
  - Cây dữ liệu khác với đồ thị có tham chiếu dùng chung
  - Tham chiếu vòng và nguy cơ đệ quy không kết thúc
  - Cùng giá trị khác với cùng định danh hoặc cùng tham chiếu
  - Nhúng đối tượng hay biểu diễn quan hệ bằng định danh
  - Định dạng có cơ chế tham chiếu và định dạng chỉ mô tả cấu trúc lồng nhau
  - Đa hình và cách nhận diện biến thể dữ liệu
  - Giới hạn độ sâu, số phần tử và kích thước đồ thị
  - Tài nguyên như kết nối, luồng và khóa đồng bộ không phải dữ liệu trao đổi thông thường
  - Tránh kéo theo proxy, trạng thái nội bộ hoặc dữ liệu nhạy cảm ngoài dự kiến
  - Chọn ranh giới đối tượng được tuần tự hóa theo mục đích sử dụng
- level1: Luồng vào ra Java
  level2:
  - InputStream, OutputStream, Reader và Writer theo loại dữ liệu
  - Cầu nối InputStreamReader hoặc OutputStreamWriter với Charset
  - Luồng có bộ đệm và chi phí đọc ghi từng phần nhỏ
  - ByteArrayInputStream hoặc ByteArrayOutputStream cho xử lý trong bộ nhớ
  - DataInputStream và DataOutputStream cho dữ liệu nhị phân có kiểu
  - writeUTF, readUTF, modified UTF-8 và giới hạn của cách biểu diễn này
  - Đọc không đủ số byte, cuối luồng và cách phát hiện bản ghi chưa hoàn chỉnh
  - flush khác với đóng luồng hoặc bảo đảm dữ liệu đã được lưu bền
  - try-with-resources và quyền sở hữu tài nguyên
  - Đọc ghi theo từng khối để tránh tải toàn bộ dữ liệu vào bộ nhớ
- level1: Đóng khung dữ liệu
  level2:
  - Vì sao dãy byte cần quy tắc xác định ranh giới bản ghi
  - Đóng khung bằng độ dài cố định, tiền tố độ dài hoặc dấu phân cách
  - Thoát dấu phân cách và trường hợp nội dung chứa xuống dòng
  - Dòng dữ liệu mạng không bảo đảm mỗi lần đọc tương ứng một thông điệp
  - Đọc tiêu đề trước, kiểm tra độ dài rồi đọc nội dung có giới hạn
  - Header, magic number, phiên bản và cờ định dạng
  - Phân biệt một tài liệu, chuỗi nhiều tài liệu và định dạng theo bản ghi
  - JSON Lines hoặc NDJSON cho luồng nhiều bản ghi
  - Luồng bị cắt, bản ghi hỏng và điều kiện có thể tiếp tục đồng bộ
  - Giới hạn số byte, thời gian đọc và lượng dữ liệu được phép giải nén
- level1: JSON
  level2:
  - 'Mô hình giá trị JSON: object, array, string, number, boolean và null'
  - Cú pháp chuỗi, ký tự thoát và biểu diễn Unicode
  - Khóa thuộc tính dạng chuỗi và thứ tự không nên mang ý nghĩa nghiệp vụ
  - Trường bị thiếu khác với trường có giá trị null
  - Giới hạn số của từng bên đọc và nguy cơ mất chính xác
  - Đối tượng có tên thuộc tính trùng và chính sách xử lý phải được xác định
  - Ngày giờ, dữ liệu nhị phân và kiểu đa hình cần quy ước bổ sung
  - JSON hợp lệ khác với JSON đáp ứng cấu trúc hoặc quy tắc nghiệp vụ
  - Biểu diễn gọn, biểu diễn dễ đọc và tác động đến byte đầu ra
  - Đánh giá ưu điểm với giới hạn mà không gắn vào một thư viện cụ thể
- level1: XML
  level2:
  - Cấu trúc phần tử, thuộc tính và nội dung văn bản
  - Well-formed khác với valid theo lược đồ
  - Namespace, tên có tiền tố và định danh theo URI
  - Thoát ký tự, CDATA và nội dung hỗn hợp
  - Khai báo mã hóa và sự thống nhất với byte thực tế
  - Phần tử vắng mặt, phần tử rỗng và biểu diễn null theo quy ước
  - DTD, XML Schema và vai trò mô tả cấu trúc
  - DOM, SAX hoặc StAX theo cách đọc và mức dùng bộ nhớ
  - Thực thể ngoài, tài nguyên tham chiếu và giới hạn xử lý an toàn
  - Ánh xạ XML sang mô hình Java mà vẫn giữ đúng cấu trúc cần thiết
- level1: CSV
  level2:
  - CSV như dạng trao đổi bản ghi có cột và các giới hạn của nó
  - Thỏa thuận dấu phân cách, dấu bao, ký tự thoát và xuống dòng
  - Trường chứa dấu phân cách, dấu nháy hoặc nội dung nhiều dòng
  - Header, thứ tự cột, cột trùng tên và cột bị thiếu
  - Mọi trường đọc từ văn bản cần quy tắc suy ra hoặc chuyển kiểu
  - Giá trị rỗng, null và giá trị mặc định không có một cách hiểu chung cho mọi hệ thống
  - Số thập phân, ngày giờ và ảnh hưởng của quy ước địa phương
  - Mã hóa ký tự, BOM và dữ liệu có tiếng Việt
  - Báo lỗi theo bản ghi với số dòng vật lý có thể khác nhau
  - Nguy cơ nội dung được phần mềm bảng tính hiểu thành công thức
- level1: YAML và cấu hình
  level2:
  - YAML với ánh xạ, chuỗi phần tử và giá trị vô hướng
  - Thụt lề, dấu bao chuỗi và nội dung nhiều dòng
  - Giá trị có thể được suy ra thành số, boolean hoặc ngày theo phiên bản với bộ đọc
  - Anchor, alias và dữ liệu có tham chiếu dùng chung
  - Tag, kiểu tùy chỉnh và giới hạn cần đặt khi đọc dữ liệu ngoài
  - TOML như lựa chọn mô tả cấu hình có cấu trúc
  - Phân biệt định dạng cấu hình với định dạng trao đổi thông điệp
  - Giữ chú thích, thứ tự và bố cục không giống với chỉ giữ giá trị
  - Chọn quy ước biểu diễn rõ ràng để tránh cấu hình được hiểu khác nhau
- level1: Định dạng nhị phân
  level2:
  - Định dạng nhị phân tự mô tả hoặc phụ thuộc lược đồ
  - Thẻ trường, độ dài, kiểu và bố cục để bên đọc nhận diện dữ liệu
  - Protocol Buffers với số hiệu trường và mã được sinh từ định nghĩa
  - Avro với lược đồ bên ghi, bên đọc và quá trình phân giải
  - CBOR hoặc MessagePack cho cấu trúc dữ liệu có kiểu nhị phân
  - Giá trị bị thiếu, giá trị mặc định và mức độ giữ thông tin kiểu
  - Byte của dữ liệu nhị phân không nhất thiết là định dạng tuần tự hóa Java
  - Phân biệt tuần tự hóa bản ghi với bố cục cột phục vụ phân tích
  - Khả năng đọc khác ngôn ngữ và chi phí phụ thuộc công cụ
  - So sánh kích thước, tính dễ kiểm tra và chi phí tiến hóa định dạng
- level1: Lược đồ dữ liệu
  level2:
  - Lược đồ mô tả cấu trúc, kiểu và những ràng buộc nào
  - Lược đồ tách rời, nhúng trong dữ liệu hoặc tham chiếu qua định danh
  - JSON Schema, XML Schema và định nghĩa kiểu của định dạng nhị phân
  - Trường bắt buộc, tùy chọn, null và giá trị mặc định
  - Giới hạn số, chuỗi, phần tử và cấu trúc lồng nhau
  - Biến thể dữ liệu và quy tắc nhận diện kiểu
  - Phiên bản lược đồ, kho đăng ký và trách nhiệm của hai đầu trao đổi
  - Sinh mã từ lược đồ hoặc suy ra lược đồ từ mã
  - Giới hạn của kiểm tra lược đồ đối với ý nghĩa nghiệp vụ
  - Quản lý dữ liệu mẫu hợp lệ và không hợp lệ đi cùng định nghĩa
- level1: Tương thích phiên bản
  level2:
  - Tương thích ngược, xuôi và đầy đủ theo vai trò bên ghi với bên đọc
  - Phân biệt tương thích byte, cấu trúc, kiểu và ý nghĩa
  - Thêm trường và cách bên đọc cũ xử lý thông tin chưa biết
  - Xóa trường, đổi tên và chính sách giữ bí danh
  - Đổi kiểu, miền số, đơn vị hoặc cách biểu diễn thời gian
  - Thay đổi bắt buộc, null hoặc giá trị mặc định
  - Thêm mã enum hoặc biến thể đa hình
  - Số hiệu trường trong định dạng gắn thẻ và nguy cơ tái sử dụng
  - Dữ liệu lưu dài hạn, phát lại thông điệp và nhiều phiên bản cùng tồn tại
  - Ma trận kiểm thử bên ghi cũ với bên đọc mới và ngược lại
  - Kế hoạch ngừng hỗ trợ cùng quy trình chuyển đổi dữ liệu lịch sử
- level1: Mô hình trao đổi
  level2:
  - Thiết kế DTO theo nhu cầu trao đổi thay vì sao chép toàn mô hình miền
  - Đặt tên trường, ý nghĩa và ví dụ để bên đọc không phải suy đoán
  - Chọn định danh, dữ liệu nhúng và mức chi tiết cần công bố
  - Biểu diễn tiền, đơn vị, ngày giờ và thông tin tùy chọn một cách tường minh
  - Quy ước trường chưa biết và giá trị chưa được hỗ trợ
  - Phiên bản thông điệp, loại nội dung và siêu dữ liệu cần thiết
  - Tách dữ liệu công khai khỏi trạng thái nội bộ hoặc dữ liệu nhạy cảm
  - Giữ mô hình trao đổi có thể tồn tại độc lập với một phiên bản lớp Java
  - Phân biệt thông điệp trạng thái, sự kiện và yêu cầu thao tác
  - Ghi nhận những thông tin cố ý bị lược bỏ hoặc làm tròn
- level1: Chiến lược ánh xạ
  level2:
  - Ánh xạ thủ công, phản chiếu hoặc sinh mã
  - Phân tích theo luồng token, dựng cây trung gian hoặc gắn trực tiếp vào đối tượng
  - Ánh xạ trường, thuộc tính, constructor hoặc factory
  - Đối tượng bất biến, record và điều kiện khởi tạo có ý nghĩa
  - Thông tin generic bị xóa lúc chạy và cách bộ đọc nhận biết kiểu phần tử
  - Bộ chuyển đổi cho kiểu đặc thù và nơi đặt quy tắc
  - Chọn biến thể đa hình bằng mã loại được cho phép
  - Chính sách với thuộc tính không biết, thiếu hoặc không chuyển đổi được
  - Phân biệt chuyển kiểu tự động tiện dụng với chuyển đổi làm sai ý nghĩa
  - Trách nhiệm quản lý tài nguyên và cấu hình an toàn luồng của từng thư viện
- level1: Java Serialization
  level2:
  - Serializable là giao diện đánh dấu và phạm vi cơ chế tuần tự hóa gốc của Java
  - ObjectOutputStream với writeObject và ObjectInputStream với readObject
  - Luồng đối tượng có header, mô tả lớp và tham chiếu đến dữ liệu đã ghi
  - Phạm vi các trường được ghi theo cơ chế mặc định
  - Trường static, transient và trạng thái không được ghi mặc định
  - Đồ thị đối tượng có phần tử không Serializable và lỗi phát sinh
  - Giữ tham chiếu dùng chung hoặc tham chiếu vòng trong đồ thị
  - Bộ ghi nhớ đối tượng trong ObjectOutputStream và tác động khi ghi lại đối tượng đã sửa
  - reset, ghi không chia sẻ và giới hạn của các lựa chọn này
  - Đọc đúng thứ tự các giá trị được ghi và xử lý kết thúc luồng
  - Định dạng gốc của Java không phải hợp đồng độc lập ngôn ngữ
  - Giới hạn khi dùng dữ liệu gắn với lớp Java làm định dạng lưu trữ lâu dài
- level1: Định danh lớp
  level2:
  - serialVersionUID nhận diện khả năng tương thích của lớp trong luồng đối tượng
  - Khai báo tường minh khác với giá trị được tính tự động
  - serialVersionUID khác với phiên bản nghiệp vụ hoặc phiên bản định dạng
  - InvalidClassException và các nguyên nhân cần kiểm tra
  - Thêm, bỏ hoặc thay đổi trường trong phạm vi tương thích của Java Serialization
  - Giá trị của trường không có trong dữ liệu cũ sau khi đọc
  - Đổi hệ phân cấp, kiểu trường hoặc tên lớp và giới hạn tương thích
  - Class loader, tên lớp và môi trường cần thiết để tái tạo đối tượng
  - Đối chiếu dữ liệu cũ với lớp mới bằng bộ mẫu hồi quy
  - Khai báo UID giống nhau không tự làm mọi thay đổi trở nên tương thích
- level1: Tùy biến tuần tự hóa
  level2:
  - writeObject và readObject để kiểm soát dữ liệu của một lớp
  - defaultWriteObject hoặc defaultReadObject trong quy trình tùy chỉnh
  - Ghi và đọc dữ liệu bổ sung theo thứ tự cùng hợp đồng
  - PutField, GetField và kiểm soát trường tuần tự hóa
  - serialPersistentFields để tách dạng lưu với một phần cấu trúc cài đặt
  - readObjectNoData và trường hợp thiếu dữ liệu cho lớp trong hệ phân cấp
  - Kiểm tra bất biến sau khi đọc thay vì tin vào dữ liệu trong luồng
  - writeReplace và readResolve để thay thế đối tượng theo mục đích
  - Mẫu đối tượng trung gian tuần tự hóa (serialization proxy)
  - Không thực hiện thao tác bên ngoài hoặc để lộ đối tượng chưa hợp lệ trong quá trình đọc
  - '@Serial để thể hiện các thành phần thuộc cơ chế tuần tự hóa'
- level1: Kế thừa và kiểu đặc biệt
  level2:
  - Lớp con Serializable khi lớp cha không tham gia tuần tự hóa
  - Constructor của lớp cha không Serializable và điều kiện khởi tạo
  - Dữ liệu của từng lớp trong hệ phân cấp có tuần tự hóa
  - Cơ chế đặc thù khi tuần tự hóa enum
  - Record và vai trò constructor chuẩn khi giải tuần tự hóa
  - Mảng, collection và những giới hạn về phần tử bên trong
  - Lớp lồng, lớp ẩn danh và trạng thái bên ngoài dễ bị kéo theo
  - Lambda, lớp sinh động và rủi ro xem dạng tuần tự hóa là hợp đồng lâu dài
  - Proxy ORM hoặc proxy động khác với dữ liệu trao đổi có chủ đích
  - Đối tượng bất biến và yêu cầu khôi phục bất biến sau khi đọc
- level1: Externalizable
  level2:
  - Externalizable khác với tùy biến cục bộ trong Serializable
  - writeExternal và readExternal cho toàn bộ dạng biểu diễn của lớp
  - Constructor không tham số và yêu cầu khi khôi phục đối tượng
  - Tự xác định phiên bản, thứ tự trường và cách nhận biết dữ liệu
  - Đọc ghi kiểu nguyên thủy hoặc đối tượng con theo thỏa thuận
  - Trách nhiệm kiểm tra độ dài, miền giá trị và trạng thái sau khi đọc
  - Kế thừa, trường của lớp cha và trách nhiệm tự quản lý
  - Lợi ích kiểm soát khác với giả định luôn nhanh hoặc nhỏ hơn
  - So sánh với codec riêng hoặc định dạng có lược đồ cho cùng nhu cầu
- level1: Bảo mật giải tuần tự hóa
  level2:
  - Dữ liệu đầu vào không đáng tin cậy và ranh giới thực sự của bộ đọc
  - Tái tạo đối tượng có thể kích hoạt hành vi ngoài việc gán giá trị
  - Giới hạn loại được phép, kích thước, độ sâu và số tham chiếu
  - ObjectInputFilter cho cơ chế tuần tự hóa gốc của Java
  - Phạm vi bộ lọc, cách phối hợp cấu hình và kiểm tra bộ lọc thực sự được áp dụng
  - Không dùng tên lớp tùy ý trong dữ liệu để quyết định kiểu được khởi tạo
  - Kiểm soát tài nguyên ngoài khi đọc XML hoặc cấu trúc có tham chiếu
  - Alias, cấu trúc lồng quá sâu và dữ liệu nén có thể làm tăng chi phí xử lý
  - Kiểm tra bất biến sau khi đọc và tách khỏi hành vi có tác dụng phụ
  - Không ghi bí mật hoặc trạng thái nhạy cảm chỉ vì chúng có trong đối tượng
  - Bộ lọc kiểu không thay thế xác thực dữ liệu, cập nhật phụ thuộc hoặc thiết kế giao thức an toàn
- level1: Tính xác định
  level2:
  - Cùng dữ liệu có thể tạo ra dãy byte khác nhau như thế nào
  - Thứ tự trường, thứ tự khóa và thứ tự phần tử ảnh hưởng đến đầu ra
  - Khoảng trắng, ký tự thoát và cách biểu diễn số
  - Biểu diễn thời gian hoặc Unicode tương đương về ý nghĩa nhưng khác byte
  - Phân biệt chuyển đổi đi rồi về, đầu ra ổn định và chuẩn hóa chính tắc
  - Canonicalization khi cần so sánh, băm hoặc ký dữ liệu
  - Đầu ra deterministic của một công cụ không tự là chuẩn chung giữa mọi công cụ
  - Chọn băm byte gốc hay băm dạng chuẩn theo mục đích
  - Kiểm chứng tính ổn định qua cấu hình, phiên bản và ngôn ngữ triển khai
- level1: Nén và toàn vẹn
  level2:
  - Nén dữ liệu sau tuần tự hóa và giải nén trước khi phân tích
  - Đánh đổi kích thước, CPU và độ trễ của nén
  - Phân biệt thuật toán nén với định dạng đóng gói
  - Metadata về thuật toán, kích thước và phiên bản để bên đọc xử lý đúng
  - Checksum hỗ trợ phát hiện lỗi ngẫu nhiên nhưng không tự xác thực người gửi
  - Băm, mã xác thực và chữ ký số phục vụ những mục đích khác nhau
  - Thứ tự tuần tự hóa, nén, bảo vệ và xác minh theo thiết kế giao thức
  - Giới hạn kích thước sau giải nén và tài nguyên được sử dụng
  - Phát hiện dữ liệu bị cắt, bị thay đổi hoặc không khớp thông tin độ dài
- level1: Dữ liệu lớn và luồng
  level2:
  - Đọc toàn tài liệu vào bộ nhớ khác với xử lý theo token hoặc bản ghi
  - Chọn đơn vị xử lý và giới hạn bộ đệm
  - Tuần tự hóa tăng dần vào luồng thay vì tạo String trung gian rất lớn
  - Xử lý dữ liệu bị chia giữa nhiều lần đọc
  - Áp lực ngược và điều tiết tốc độ giữa bên tạo với bên nhận
  - Dữ liệu nhiều bản ghi và khả năng tiếp tục từ điểm đã xác nhận
  - Phân biệt thứ tự ghi, thứ tự hoàn tất và xử lý song song
  - Hủy thao tác, timeout và giải phóng luồng khi bên nhận dừng
  - Giới hạn một bản ghi quá lớn dù toàn bộ luồng được xử lý tuần tự
  - Kiểm tra bộ nhớ và thời gian với dữ liệu có quy mô đại diện
- level1: Lỗi và phục hồi
  level2:
  - Phân loại lỗi đọc byte, giải mã ký tự, cú pháp, kiểu và ý nghĩa
  - Báo vị trí theo byte, dòng, cột hoặc đường dẫn trường phù hợp
  - Thiếu kiểu lớp, UID không khớp và dữ liệu không thể tái tạo trong Java
  - Phân biệt tài liệu rỗng, null hợp lệ và đầu vào bị cắt
  - Từ chối toàn bộ hoặc cách ly bản ghi lỗi theo ranh giới đã định nghĩa
  - Chỉ bỏ qua dữ liệu khi biết chắc có thể tìm lại ranh giới bản ghi
  - Retry lỗi truyền nhận khác với thử lại dữ liệu sai cố định
  - Giữ dữ liệu gốc cần thiết để chẩn đoán mà không làm lộ thông tin nhạy cảm
  - Ghi nhận kết quả chưa xác định khi lỗi xảy ra giữa quá trình ghi
  - Khôi phục tệp hoặc bản ghi theo thỏa thuận với lớp lưu trữ bên dưới
- level1: Kiểm thử
  level2:
  - Kiểm thử chuyển đổi đi rồi về theo tiêu chí tương đương đã xác định
  - Mẫu dữ liệu chuẩn (golden files) và điều kiện cập nhật có kiểm soát
  - Kiểm thử kiểu số, biên giá trị, độ chính xác và chính sách làm tròn
  - Kiểm thử tiếng Việt, ký tự ngoài BMP, ký tự thoát và byte không hợp lệ
  - Kiểm thử null, thiếu trường, mặc định và tập hợp rỗng
  - Kiểm thử thứ tự, phần tử trùng, tham chiếu vòng và đa hình
  - Kiểm thử lớp hoặc lược đồ cũ với dữ liệu phiên bản mới và ngược lại
  - Kiểm thử trao đổi giữa Java với ngôn ngữ hoặc công cụ khác
  - Kiểm thử luồng bị cắt, đọc từng phần và bản ghi vượt giới hạn
  - Kiểm thử bộ lọc, giới hạn độ sâu và cấu trúc gây tốn tài nguyên
  - Sinh dữ liệu theo thuộc tính và dữ liệu ngẫu nhiên có kiểm soát
  - Đối chiếu byte khi yêu cầu là tính xác định thay vì chỉ so sánh đối tượng
  - Kiểm tra tài nguyên được đóng khi hoàn tất, lỗi hoặc bị hủy
- level1: Hiệu năng
  level2:
  - Đo kích thước đầu ra, thông lượng, độ trễ và mức cấp phát bộ nhớ
  - Phân biệt chi phí tuần tự hóa với I/O, nén và truyền mạng
  - Đo chiều ghi và chiều đọc riêng theo dữ liệu đại diện
  - Khởi động JVM, biên dịch JIT và cách tránh kết quả đo sai
  - JMH cho phép đo nhỏ và kiểm thử tải cho luồng xử lý đầy đủ
  - Bộ đệm, kích thước bản ghi và số lớp chuyển đổi trung gian
  - Tái sử dụng cấu hình hoặc bộ ghi theo hợp đồng an toàn luồng của công cụ
  - Chi phí reflection, sinh mã và cấu trúc trung gian
  - Đánh đổi kích thước nhỏ với chi phí phân tích hoặc tiến hóa dữ liệu
  - Giữ giới hạn an toàn và tính đúng khi tối ưu
- level1: Tích hợp ứng dụng
  level2:
  - Thông tin kiểu nội dung khác với bộ ký tự và cách nén truyền tải
  - Trao đổi HTTP theo hợp đồng request hoặc response
  - Thông điệp qua broker với ranh giới payload, header và định danh lược đồ
  - Lưu tệp với phiên bản định dạng và thông tin cần đọc lại
  - Phân biệt hoàn tất tuần tự hóa với dữ liệu đã được lưu bền hoặc gửi thành công
  - Tách DTO trao đổi khỏi thực thể ORM và đối tượng có proxy
  - Lưu đối tượng trong bộ nhớ đệm với yêu cầu tương thích khi triển khai nhiều phiên bản
  - Dữ liệu snapshot, dữ liệu sự kiện và thời gian cần đọc lại
  - Đặt codec tại ranh giới kiến trúc và chuyển lỗi về tầng phù hợp
  - Quan sát kích thước hoặc thời gian xử lý mà không log toàn bộ nội dung
- level1: Lựa chọn giải pháp
  level2:
  - Xác định mục đích lưu, truyền, cấu hình hoặc phân tích trước khi chọn định dạng
  - Khả năng đọc bằng mắt, độ gọn và yêu cầu nhiều ngôn ngữ
  - Lược đồ, sinh mã, công cụ kiểm tra và chi phí quản trị
  - Khả năng biểu diễn số, thời gian, đồ thị và đa hình
  - Độ bền của hợp đồng khi dữ liệu tồn tại lâu hơn mã ứng dụng
  - Nhu cầu xử lý theo luồng, truy cập một phần và giới hạn tài nguyên
  - Khả năng bảo vệ đầu vào và cấu hình an toàn của bộ đọc
  - Khả năng tích hợp với hệ thống đã có và chi phí chuyển đổi
  - Thử nghiệm trên dữ liệu thực tế với tiêu chí chấp nhận được định nghĩa trước
- level1: Lỗi thường gặp
  level2:
  - Đánh đồng tuần tự hóa với toString hoặc định dạng hiển thị
  - Đánh đồng mã hóa ký tự, Base64, nén và bảo mật dữ liệu
  - Chuyển byte nhị phân thành String mà không có quy tắc biểu diễn
  - Tự ghép JSON, XML hoặc CSV mà không xử lý ký tự thoát
  - Tự suy ra ngày giờ, kiểu số hoặc giá trị null khác với bên gửi
  - Cho rằng tuần tự hóa giữ nguyên mọi hành vi và tài nguyên của đối tượng
  - Kéo cả thực thể, tham chiếu vòng hoặc bí mật vào dữ liệu trao đổi
  - Dùng tên lớp triển khai làm hợp đồng đa hình công khai
  - Cho rằng cùng serialVersionUID thì mọi phiên bản lớp đều đọc được nhau
  - Thử lại dữ liệu sai mà không thay đổi nguyên nhân
  - Chỉ kiểm thử đọc đi ghi lại trong cùng một tiến trình
  - Chọn định dạng từ phép đo không đại diện hoặc bỏ qua yêu cầu tương thích
- level1: Thực hành tổng hợp
  level2:
  - Xác định thông tin cần trao đổi trong một đơn hàng và thiết kế DTO riêng
  - Đặc tả kiểu, đơn vị, null, thời gian và các giới hạn của dữ liệu
  - Ghi đọc văn bản UTF-8 có tiếng Việt và kiểm tra byte thực tế
  - So sánh biểu diễn cùng dữ liệu bằng JSON, XML, CSV và một định dạng nhị phân
  - Xây dựng luồng nhiều bản ghi với đóng khung và kiểm tra độ dài
  - Tuần tự hóa đồ thị Java để quan sát tham chiếu dùng chung và transient
  - Thay đổi lớp Serializable rồi kiểm tra dữ liệu cũ với serialVersionUID
  - Tùy biến quá trình đọc để khôi phục bất biến của đối tượng
  - Áp dụng bộ lọc cùng giới hạn kích thước cho dữ liệu đầu vào
  - Thiết kế hai phiên bản thông điệp và ma trận kiểm thử tương thích
  - Đo kích thước, thời gian và bộ nhớ trong cả chiều ghi với chiều đọc
  - Xử lý lỗi giữa luồng và đối soát bản ghi đã hoàn tất
  - Danh sách kiểm tra trước khi công bố một định dạng trao đổi hoặc lưu trữ
