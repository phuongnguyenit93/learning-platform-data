menu:
- level1: Định hướng
  level2:
  - Xử lý dữ liệu (data processing) là gì và tạo ra giá trị nào
  - Luồng dữ liệu từ đầu vào qua phép biến đổi tới kết quả
  - 'Các thuật ngữ: bản ghi, tập dữ liệu, sự kiện, công đoạn và luồng xử lý'
  - Phân biệt thu thập, xử lý, lưu trữ và trình bày dữ liệu
  - Phân biệt xử lý trong bộ nhớ với xử lý qua hệ thống lưu trữ
  - Dữ liệu hữu hạn và dữ liệu đến liên tục
  - Xử lý theo lô, vi lô và luồng sự kiện
  - Phân biệt Java Stream với hệ thống xử lý luồng sự kiện
  - Quan hệ giữa tính đúng đắn, độ trễ, thông lượng và tài nguyên
  - Lộ trình học từ phép toán đơn giản tới luồng xử lý có khả năng phục hồi
- level1: Hợp đồng xử lý
  level2:
  - Xác định câu hỏi nghiệp vụ và ý nghĩa kết quả cần tạo
  - Định nghĩa đầu vào, đầu ra và các điều kiện phải bảo toàn
  - Chọn đơn vị xử lý theo bản ghi, nhóm, lô hoặc cửa sổ
  - Xác định dữ liệu nguồn chuẩn và phạm vi trách nhiệm
  - Quy định cách xử lý dữ liệu thiếu, sai hoặc trùng
  - Xác định yêu cầu về thứ tự và độ mới dữ liệu
  - Chọn kết quả chính xác hoặc xấp xỉ theo nhu cầu
  - Quy định độ trễ, thời hạn hoàn thành và mức tài nguyên
  - Xác định khả năng chạy lại và điều kiện kết quả tương đương
  - Tài liệu hóa giả định về dữ liệu và trường hợp ngoài hợp đồng
- level1: Mô hình dữ liệu
  level2:
  - Bản ghi, thuộc tính, kiểu dữ liệu và lược đồ
  - Định danh bản ghi, khóa nghiệp vụ và khóa nhóm
  - Dữ liệu dạng bảng, cấu trúc lồng nhau và đồ thị
  - Phân biệt sự kiện thay đổi với trạng thái hiện tại
  - Phân biệt null, thiếu trường, chuỗi rỗng và giá trị mặc định
  - Đơn vị đo, ngôn ngữ và ngữ cảnh diễn giải giá trị
  - Thời điểm phát sinh dữ liệu và thời điểm nhận dữ liệu
  - Phân bố dữ liệu, số lượng giá trị khác nhau và độ lệch khóa
  - Đối tượng bất biến và quyền sở hữu dữ liệu giữa các công đoạn
  - Tương thích lược đồ khi nguồn hoặc bộ xử lý đổi phiên bản
- level1: Thiết kế luồng
  level2:
  - Mô hình nguồn, công đoạn xử lý và nơi nhận kết quả
  - Luồng tuyến tính, phân nhánh, hợp nhất và đồ thị phụ thuộc
  - Tách phép biến đổi thuần túy khỏi thao tác có tác dụng phụ
  - Phân biệt cấu hình luồng với dữ liệu và trạng thái lúc chạy
  - Xác định đầu vào và đầu ra của từng công đoạn
  - ETL và ELT theo vị trí thực hiện phép biến đổi
  - Đẩy lọc, lựa chọn cột hoặc tổng hợp tới nơi xử lý phù hợp
  - Giữ hợp đồng dữ liệu rõ ràng giữa các công đoạn
  - Thiết kế điểm kiểm tra và ranh giới công bố kết quả
  - Chọn xử lý đồng bộ hoặc bất đồng bộ theo yêu cầu
  - Lập bản đồ phụ thuộc để chạy lại đúng phần bị ảnh hưởng
- level1: Đọc dữ liệu
  level2:
  - Đọc từ collection, tệp, truy vấn hoặc nguồn sự kiện
  - Phân biệt nạp toàn bộ với đọc theo dòng hoặc theo lô
  - Tách bước giải mã dữ liệu khỏi bước tính toán
  - Giới hạn bộ nhớ khi đầu vào lớn hơn dung lượng khả dụng
  - Đánh dấu vị trí đọc và khả năng tiếp tục
  - Chọn ảnh chụp dữ liệu nhất quán khi nguồn đang thay đổi
  - Xử lý nguồn kết thúc, nguồn gián đoạn và nguồn không có dữ liệu
  - Quản lý tài nguyên trong toàn bộ thời gian đọc
  - Kiểm soát tốc độ đọc theo khả năng xử lý phía sau
- level1: Chuẩn hóa dữ liệu
  level2:
  - Chuẩn hóa khoảng trắng và cách biểu diễn chuỗi
  - Chuẩn hóa Unicode và quy tắc so sánh ký tự
  - Đổi kiểu với quy tắc định dạng tường minh
  - Chuẩn hóa ngày giờ và múi giờ
  - Quy đổi đơn vị đo trước khi tính toán
  - Chuẩn hóa mã danh mục theo bảng đối chiếu
  - Phân biệt sửa dữ liệu với suy đoán giá trị bị thiếu
  - Giữ bản gốc và dấu vết của thay đổi khi cần đối soát
  - Cách ly bản ghi không hợp lệ để xử lý riêng
  - Thiết kế bước chuẩn hóa có thể thực hiện lặp mà không làm sai dữ liệu
- level1: Biến đổi dữ liệu
  level2:
  - Ánh xạ một bản ghi thành một bản ghi
  - Tách một bản ghi thành nhiều phần tử
  - Làm phẳng collection hoặc cấu trúc lồng nhau
  - Gộp các trường để tạo thuộc tính dẫn xuất
  - Tách hoặc ghép chuỗi theo quy tắc có kiểm chứng
  - Chọn, đổi tên và loại bỏ thuộc tính theo hợp đồng
  - Dựng cấu trúc dữ liệu mới từ đầu vào phẳng
  - Áp dụng hàm chuyển đổi dùng chung cho nhiều công đoạn
  - Kết hợp nhiều phép biến đổi và giữ rõ thứ tự thực hiện
  - Phân biệt phép biến đổi mất thông tin với phép có thể đảo ngược
  - Kiểm soát ngoại lệ và lỗi chuyển đổi theo từng bản ghi
- level1: Lọc và định tuyến
  level2:
  - Xây dựng điều kiện chọn bản ghi theo nghiệp vụ
  - Kết hợp điều kiện AND, OR và NOT đúng ý nghĩa
  - Quy định hành vi khi điều kiện gặp null hoặc dữ liệu thiếu
  - Đẩy phép lọc sớm khi không làm thay đổi kết quả
  - Chia dữ liệu thành các nhóm xử lý theo điều kiện
  - Định tuyến bản ghi hợp lệ, bị loại và cần kiểm tra
  - Phân biệt loại bỏ bản ghi với ghi nhận lỗi
  - Lấy mẫu có thể lặp lại bằng hạt giống xác định
  - Đo số lượng và lý do dữ liệu bị loại ở mỗi nhánh
- level1: Sắp xếp và lựa chọn
  level2:
  - Xác định khóa và thứ tự sắp xếp
  - Sắp xếp theo nhiều trường với quy tắc phá hòa
  - Xử lý null và quy tắc so sánh chuỗi
  - Phân biệt thứ tự nguồn với thứ tự kết quả
  - Sắp xếp ổn định và nhu cầu bảo toàn thứ tự tương đối
  - Tìm phần tử nhỏ nhất hoặc lớn nhất
  - Chọn top K mà không sắp xếp toàn bộ khi phù hợp
  - Xếp hạng và xử lý các giá trị bằng nhau
  - Chọn bản ghi đầu, cuối hoặc mới nhất theo định nghĩa rõ ràng
  - Sắp xếp dữ liệu vượt bộ nhớ bằng phân đoạn và trộn
- level1: Khử trùng lặp
  level2:
  - Định nghĩa hai bản ghi trùng theo dữ liệu hoặc theo nghiệp vụ
  - Chọn khóa khử trùng lặp và phạm vi duy nhất
  - Giữ bản ghi đầu tiên, cuối cùng hoặc có phiên bản cao nhất
  - Phân biệt trùng nội dung với cùng một sự kiện được gửi lại
  - Sử dụng Set hoặc Map để theo dõi khóa đã gặp
  - Khử trùng lặp theo khoảng thời gian và giới hạn trạng thái
  - Xử lý xung đột khi cùng khóa nhưng dữ liệu khác nhau
  - Bảo toàn thứ tự khi loại bỏ bản ghi trùng
  - Đánh đổi bộ nhớ với phạm vi phát hiện trùng
  - Ghi nhận bản ghi bị loại để phục vụ kiểm tra
- level1: Nhóm và tổng hợp
  level2:
  - Nhóm dữ liệu theo một khóa hoặc khóa ghép
  - Đếm, tính tổng, cực trị và thống kê theo nhóm
  - Tính trung bình từ tổng và số lượng
  - Trung bình có trọng số và mẫu số hợp lệ
  - Phân biệt số lượng bản ghi với số giá trị khác nhau
  - Tổng hợp nhiều cấp và nhóm lồng nhau
  - Chia dữ liệu thành các tập theo điều kiện
  - Tổng hợp từng phần và hợp nhất kết quả
  - Vai trò của tính kết hợp và phần tử đơn vị
  - Tổng hợp trên tập rỗng và giá trị thiếu
  - Kiểm soát độ lớn của nhóm và số lượng khóa
  - Tính phân vị hoặc thống kê xấp xỉ với sai số được công bố
- level1: Ghép và làm giàu
  level2:
  - Phân biệt nối tập bản ghi với ghép theo khóa
  - Ghép trong, ghép trái, ghép đầy đủ và ý nghĩa bản ghi không khớp
  - Ghép theo khóa đơn hoặc khóa ghép
  - Quan hệ một–một, một–nhiều và nhiều–nhiều khi ghép
  - Nguy cơ nhân số lượng bản ghi sau phép ghép
  - Chọn thuật toán ghép lồng, ghép băm hoặc ghép trộn
  - Làm giàu bằng bảng tham chiếu đã được chuẩn bị
  - Giới hạn tra cứu dịch vụ ngoài theo từng bản ghi
  - Xác định phiên bản dữ liệu tham chiếu dùng cho một lần xử lý
  - Xử lý dữ liệu đến thiếu phía đối ứng hoặc đến sai thứ tự
  - Ghép theo điều kiện thời gian và phạm vi tương quan
- level1: Số và thời gian
  level2:
  - Chọn kiểu số theo miền giá trị và độ chính xác
  - Ngăn tràn số trong tổng hợp và chuyển kiểu
  - Phân biệt số thập phân chính xác với dấu phẩy động
  - Quy tắc làm tròn và thời điểm áp dụng
  - Xử lý chia cho không, NaN và giá trị vô hạn
  - Đơn vị tiền tệ và đơn vị đo trong phép tổng hợp
  - Xác định thời điểm tuyệt đối, thời gian địa phương và múi giờ
  - Tính khoảng thời gian với ranh giới ngày và thay đổi giờ địa phương
  - Quy tắc bao gồm hoặc loại trừ điểm biên của khoảng
  - Giữ quy tắc tính toán ổn định để đối soát kết quả
- level1: Trạng thái xử lý
  level2:
  - Phân biệt công đoạn không trạng thái với công đoạn có trạng thái
  - Trạng thái theo khóa, theo công đoạn và theo toàn bộ công việc
  - Tích lũy kết quả qua nhiều bản ghi
  - Bộ đệm, bảng băm và hàng đợi trong xử lý dữ liệu
  - Phân biệt trạng thái nghiệp vụ với vị trí tiến độ
  - Quản lý vòng đời và thời hạn của trạng thái
  - Giới hạn bộ nhớ khi số khóa hoặc dữ liệu chờ tăng
  - Lưu ảnh chụp trạng thái để phục vụ khôi phục
  - Tương thích trạng thái khi thay đổi cấu trúc hoặc thuật toán
  - Ngăn dùng chung trạng thái có thể thay đổi giữa các lần xử lý
- level1: Xử lý tăng dần
  level2:
  - So sánh tính lại toàn bộ với cập nhật từ phần dữ liệu thay đổi
  - Xác định mốc tiến độ theo phiên bản, vị trí hoặc thời gian
  - Giới hạn của việc chỉ dùng thời gian cập nhật để phát hiện thay đổi
  - Đọc thay đổi qua nhật ký hoặc cơ chế CDC
  - Diễn giải sự kiện thêm, sửa và xóa
  - Cập nhật kết quả dẫn xuất khi dữ liệu nguồn bị điều chỉnh
  - Xử lý dữ liệu thay đổi đến trễ hoặc sai thứ tự
  - Thiết kế bổ sung dữ liệu lịch sử và chạy bù (backfill)
  - Phối hợp xử lý trực tiếp với chạy bù mà không ghi đè sai
  - Đối soát kết quả tăng dần với kết quả tính lại
  - Ghi nhận phiên bản thuật toán để xác định dữ liệu cần tái xử lý
- level1: Thuật toán và tài nguyên
  level2:
  - Phân tích độ phức tạp theo số bản ghi và số khóa
  - Chọn cấu trúc dữ liệu theo phép tra cứu hoặc cập nhật
  - Phân biệt xử lý một lượt với cần đọc lại dữ liệu
  - Xử lý tăng dần để tránh giữ toàn bộ đầu vào
  - Tràn dữ liệu tạm ra đĩa khi vượt bộ nhớ (spill)
  - Chia dữ liệu thành lô và chọn kích thước phù hợp
  - Giảm sao chép, cấp phát đối tượng và biểu diễn trung gian
  - Giới hạn số lượng nhóm, bộ đệm và dữ liệu chờ ghép
  - Đánh đổi phép tính chính xác với cấu trúc xấp xỉ
  - Quản lý tài nguyên và dọn dữ liệu tạm khi dừng hoặc lỗi
  - Lựa chọn thuật toán theo phân bố dữ liệu thực tế
- level1: Xử lý theo lô
  level2:
  - Định nghĩa công việc, lần chạy và tập dữ liệu đầu vào
  - Chốt phạm vi dữ liệu trước khi bắt đầu xử lý
  - Chia công việc thành bước và nhóm bản ghi
  - Đọc, biến đổi và ghi theo khối
  - Chọn kích thước khối và ranh giới giao dịch
  - Lưu tiến độ sau khi kết quả tương ứng được xác nhận
  - Khởi động lại từ điểm đã hoàn thành
  - Phân biệt chạy lại cùng lần xử lý với tạo lần chạy mới
  - Chạy song song các phần dữ liệu độc lập
  - Tổng hợp kết quả và xác định trạng thái hoàn thành toàn công việc
  - Quản lý lịch chạy, công việc chồng lấn và dữ liệu đến muộn
  - Đối chiếu số lượng đầu vào, thành công, bị loại và thất bại
- level1: Luồng sự kiện
  level2:
  - Đặc điểm của dữ liệu đến liên tục không có điểm kết thúc cố định
  - Luồng đẩy và luồng kéo dưới góc độ nhận dữ liệu
  - Định danh sự kiện, khóa phân vùng và vị trí đọc
  - Phân biệt thứ tự toàn cục với thứ tự theo khóa
  - Xử lý từng sự kiện và xử lý theo vi lô
  - Phép biến đổi không trạng thái trên luồng
  - Tổng hợp có trạng thái theo khóa
  - Xử lý sự kiện lặp, đến trễ hoặc sai thứ tự
  - Dữ liệu tham chiếu thay đổi trong lúc luồng đang chạy
  - Giới hạn trạng thái của phép ghép và phát hiện mẫu liên tiếp
  - Dừng có kiểm soát và tiếp tục từ vị trí đã xác nhận
- level1: Thời gian và cửa sổ
  level2:
  - Thời gian sự kiện (event time) và thời gian xử lý (processing time)
  - Chọn dấu thời gian phù hợp với ý nghĩa nghiệp vụ
  - Cửa sổ cố định không chồng lấn (tumbling window)
  - Cửa sổ trượt có chồng lấn (sliding window)
  - Cửa sổ phiên theo khoảng ngừng hoạt động (session window)
  - Cửa sổ theo số lượng bản ghi và giới hạn áp dụng
  - Mốc tiến triển thời gian sự kiện (watermark)
  - Cân bằng chờ dữ liệu đến trễ với độ trễ công bố kết quả
  - Ảnh hưởng của phân vùng không phát sinh dữ liệu
  - Kết quả tạm thời, kết quả cập nhật và thời điểm chốt
  - Quy tắc giữ hoặc loại dữ liệu vượt độ trễ cho phép
  - Đặt giới hạn lưu trạng thái sau khi cửa sổ kết thúc
  - Kiểm thử biên cửa sổ, sai thứ tự và dữ liệu đến rất muộn
- level1: Đồng thời và song song
  level2:
  - Phân biệt đồng thời, song song và bất đồng bộ
  - Chia công việc theo bản ghi, lô hoặc khóa
  - Giữ các bước phụ thuộc chạy đúng thứ tự
  - Quyền sở hữu dữ liệu và trạng thái giữa các tác vụ
