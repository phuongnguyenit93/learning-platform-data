menu:
- level1: Bức tranh hiệu năng
  level2:
  - Kiểm thử hiệu năng là gì và các câu hỏi cần trả lời
  - 'Mô hình tư duy: nhu cầu, tải, tài nguyên, xử lý và kết quả'
  - Hiệu năng nhìn từ người dùng và từ hệ thống cung cấp dịch vụ
  - Thời gian phản hồi, thông lượng và mức sử dụng tài nguyên liên hệ thế nào
  - Quan hệ giữa tính đúng chức năng và kết quả đo hiệu năng
  - Phân biệt kiểm thử hiệu năng, đo chuẩn và quan sát vận hành
  - 'Các cấp phạm vi: hàm, thành phần, dịch vụ và hành trình đầu cuối'
  - Giới hạn của một con số nhanh nhất hoặc một lần chạy thành công
  - Lộ trình từ mục tiêu hiệu năng đến bằng chứng và cải tiến
- level1: Yêu cầu và mục tiêu
  level2:
  - Thu thập nhu cầu hiệu năng từ hành vi sử dụng thực tế
  - SLI, SLO và SLA trong ngữ cảnh đánh giá dịch vụ
  - Định nghĩa thao tác hoặc giao dịch nghiệp vụ cần đo
  - Xác định điểm bắt đầu, điểm kết thúc và phía quan sát
  - Yêu cầu độ trễ gắn với percentile, tải và cửa sổ thời gian
  - Yêu cầu thông lượng đi kèm điều kiện về lỗi và tính đúng
  - Giới hạn tài nguyên và năng lực phục vụ cần chứng minh
  - Ngưỡng chấp nhận tuyệt đối so với ngưỡng hồi quy tương đối
  - Thống nhất tiêu chí đạt, thất bại và lượt chạy không hợp lệ
  - Phân biệt số đo hiện tại với mục tiêu nghiệp vụ được chấp thuận
- level1: Chỉ số đo lường
  level2:
  - Thời gian phản hồi đầu cuối và thời gian xử lý phía máy chủ
  - Thời gian chờ hàng đợi và thời gian thực hiện công việc
  - Thời gian kết nối, bắt tay, nhận byte đầu và nhận đủ dữ liệu
  - Request, iteration và giao dịch nghiệp vụ là các đơn vị khác nhau
  - Tải đưa vào, tải hệ thống chấp nhận và số công việc hoàn tất
  - Thông lượng tổng so với thông lượng kết quả thành công có giá trị
  - Người dùng đồng thời, yêu cầu đang xử lý và số kết nối
  - Tỷ lệ lỗi, timeout, hủy yêu cầu và yêu cầu bị từ chối
  - CPU, bộ nhớ, mạng, I/O và các giới hạn đang áp dụng
  - Độ dài hàng đợi, thời gian chờ pool và mức bão hòa
  - Đơn vị đo, nhãn và phạm vi tổng hợp của mỗi chỉ số
  - Phân biệt chỉ số phía máy phát tải với chỉ số phía hệ thống đích
- level1: Phân bố và thống kê
  level2:
  - Trung bình, trung vị và phân bố lệch của thời gian phản hồi
  - p90, p95, p99 và ý nghĩa của phần đuôi độ trễ
  - Biểu đồ phân bố, histogram và biểu đồ theo thời gian
  - Số mẫu và độ ổn định của percentile cao
  - 'Ngoại lệ trong dữ liệu: giữ bằng chứng và tìm nguyên nhân'
  - Khoảng thời gian lấy mẫu và tác động của việc làm mượt
  - Gộp mẫu hoặc histogram thay vì lấy trung bình các percentile
  - Tách nhóm yêu cầu khác hành vi để tránh số tổng che khuất vấn đề
  - Lặp lại thí nghiệm, độ biến thiên và khoảng tin cậy
  - Ý nghĩa thống kê so với mức thay đổi có ý nghĩa thực tiễn
  - Timeout hoặc mẫu thiếu làm giới hạn kết luận về độ trễ
  - Phân tích thời gian phản hồi cùng tỷ lệ lỗi
- level1: Hàng đợi và đồng thời
  level2:
  - Vì sao tải tăng có thể làm thời gian chờ tăng nhanh
  - Năng lực xử lý, mức sử dụng và trạng thái bão hòa
  - Luật Little và điều kiện áp dụng quan hệ L = λ × W
  - Người dùng có thời gian suy nghĩ và yêu cầu đang thực thi
  - Giới hạn song song tại thread pool, connection pool hoặc dịch vụ ngoài
  - Hàng đợi hữu hạn, hàng đợi không giới hạn và hành vi khi quá tải
  - Tăng concurrency nhưng thông lượng không tăng tương ứng
  - Backpressure và kiểm soát lượng công việc được tiếp nhận
  - Phân biệt chờ I/O, chờ khóa và thực sự sử dụng CPU
- level1: Các dạng kiểm thử
  level2:
  - 'Smoke hiệu năng: kiểm tra kịch bản và phép đo ở tải nhỏ'
  - Load test tại tải thông thường hoặc tải mục tiêu
  - Stress test khi vượt vùng hoạt động dự kiến
  - Spike test với tải tăng hoặc giảm đột ngột
  - Soak hoặc endurance test trong thời gian kéo dài
  - Breakpoint test để tìm giới hạn hoạt động theo tiêu chí xác định
  - Volume test với quy mô hoặc phân bố dữ liệu lớn
  - Scalability test khi thay đổi số hoặc kích thước tài nguyên
  - Kiểm chứng khôi phục hiệu năng sau khi tải giảm
  - Đo chuẩn một thành phần so với thử tải một hệ thống
  - Thống nhất cách dùng tên loại kiểm thử và mục đích trong từng dự án
- level1: Mô hình sử dụng
  level2:
  - Chọn hành trình nghiệp vụ quan trọng và điểm quan sát
  - Tỷ trọng đọc, ghi, tìm kiếm và các thao tác nền
  - Tần suất đến, thời gian phiên và số bước trong một hành trình
  - Thời gian suy nghĩ (think time), pacing và sự khác nhau giữa các khoảng nghỉ
  - Phân bố tải theo thời gian thay vì chỉ dùng một giá trị trung bình
  - Tải nền, tác vụ định kỳ và các sự kiện cao điểm
  - Payload, kích thước kết quả và tỷ lệ dữ liệu trùng
  - Phân bố khóa nóng, khách hàng lớn và truy cập không đồng đều
  - Retry từ client và tải bổ sung phát sinh khi có lỗi
  - Dùng dữ liệu vận hành đã tổng hợp để kiểm tra tính đại diện
  - Giả định của mô hình tải và phạm vi chưa được mô phỏng
- level1: Mô hình tải mở và đóng
  level2:
  - 'Mô hình đóng: điều khiển số người dùng đang hoạt động'
  - 'Mô hình mở: điều khiển tốc độ bắt đầu công việc'
  - Chọn mô hình theo cách nhu cầu đến hệ thống thực tế
  - Tốc độ đến không đồng nghĩa với số yêu cầu mỗi giây
  - Khi hệ thống chậm làm mô hình đóng tự giảm lượng công việc mới
  - Coordinated omission và nguy cơ che khuất thời gian chờ của mô hình cần mô phỏng
  - Tải yêu cầu so với tải thực tế mà công cụ tạo được
  - Dropped iterations hoặc lần khởi tạo bị bỏ lỡ
  - Số người dùng ảo đủ để giữ lịch tải mở
  - Giới hạn của việc sửa histogram khi mô hình tải ban đầu không phù hợp
- level1: Dữ liệu thử tải
  level2:
  - Quy mô dữ liệu ban đầu và dữ liệu tăng lên trong lượt chạy
  - Phân bố dữ liệu ảnh hưởng truy vấn, cache và đường xử lý
  - Tài khoản, quyền và phiên đăng nhập đại diện
  - Chuẩn bị dữ liệu riêng khi nhiều người dùng ảo cùng ghi
  - Tránh khóa giả tạo do mọi luồng cùng dùng một bản ghi
  - Tái sử dụng dữ liệu và tác động đến tỷ lệ cache hit
  - Dữ liệu lớn, rỗng, hiếm gặp và các trường hợp tốn tài nguyên
  - Ẩn danh hoặc tạo dữ liệu tổng hợp phù hợp mục tiêu
  - Khôi phục dữ liệu giữa các lượt so sánh
  - Lưu phiên bản bộ dữ liệu và quy tắc sinh để tái hiện
- level1: Môi trường thí nghiệm
  level2:
  - Sơ đồ hệ thống và các thành phần thuộc phạm vi đo
  - Độ tương đồng với môi trường đích và giới hạn khi suy rộng
  - Cố định artifact, cấu hình và phiên bản phụ thuộc
  - CPU, RAM, ổ đĩa, mạng và phần cứng ảo hóa
  - Container limits, CPU throttling và tài nguyên có thể sử dụng thực
  - Ảnh hưởng của máy dùng chung hoặc tác vụ ngoài thí nghiệm
  - Độ trễ mạng, vị trí máy phát tải và đường đi yêu cầu
  - Cấu hình dịch vụ ngoài, mock hoặc stub trong mô hình đo
  - Thời gian đồng bộ và nhận diện các giai đoạn chạy
  - Điều kiện khôi phục môi trường và giới hạn dừng thí nghiệm
- level1: Máy phát tải
  level2:
  - Máy phát tải cũng có giới hạn CPU, bộ nhớ và mạng
  - Phân biệt nút thắt máy phát với nút thắt hệ thống đích
  - Theo dõi lịch tạo tải, số công việc bắt đầu và số hoàn tất
  - Kết nối, socket, cổng tạm và file descriptor của máy phát
  - Chi phí tạo dữ liệu, mã hóa hoặc kiểm tra phản hồi
  - Hạn chế ghi log và giao diện quan sát nặng khi tạo tải lớn
  - Chia tải qua nhiều máy và giữ cấu hình đồng nhất
  - Đồng bộ thời điểm, nhãn lượt chạy và tổng hợp kết quả phân tán
  - Kiểm chứng máy phát đủ năng lực trước khi kết luận hệ thống đã đạt giới hạn
- level1: Quan sát hệ thống
  level2:
  - Metrics, log, trace và hồ sơ thực thi bổ sung cho nhau
  - Đánh dấu giai đoạn tăng tải, ổn định và giảm tải
  - Liên kết request hoặc giao dịch với trace khi cần chẩn đoán
  - 'Đo từng tầng: gateway, ứng dụng, cơ sở dữ liệu và dịch vụ ngoài'
  - Counter, gauge và histogram theo mục đích sử dụng
  - Thiết kế nhãn có kiểm soát số lượng tổ hợp
  - Tần suất thu thập và khả năng bỏ sót biến động ngắn
  - Sampling và giới hạn của dữ liệu trace thu được
  - Chi phí đo lường có thể tác động kết quả thí nghiệm
  - Lưu dữ liệu thô, dashboard và cấu hình quan sát cùng báo cáo
- level1: Kịch bản và tính đúng
  level2:
  - Chuyển hành trình nghiệp vụ thành kịch bản tạo tải
  - Tham số hóa địa chỉ, dữ liệu và mức tải
  - 'Correlation: lấy token hoặc định danh từ phản hồi trước'
  - Cookie, session và trạng thái riêng của người dùng ảo
  - Kiểm tra mã trạng thái cùng nội dung có ý nghĩa nghiệp vụ
  - Phát hiện phản hồi nhanh nhưng sai, rỗng hoặc bị từ chối
  - Phân biệt lỗi kỹ thuật, từ chối dự kiến và thất bại nghiệp vụ
  - Thiết lập timeout, retry và chính sách khi một bước lỗi
  - Phân biệt số đo của từng request với cả giao dịch nhiều bước
  - Xác minh dữ liệu sau chạy đối với các kịch bản ghi
- level1: JMeter
  level2:
  - Test Plan, Thread Group và mô hình thực thi kịch bản
  - HTTP Request, cấu hình mặc định và quản lý kết nối
  - CSV Data Set Config và dữ liệu riêng cho người dùng
  - Cookie Manager, biến và trích xuất dữ liệu phản hồi
  - Timer và cách biểu diễn khoảng nghỉ hoặc điều tiết tải
  - Assertion để giữ điều kiện đúng trong lượt chạy
  - Transaction Controller và phạm vi đo giao dịch
  - Dùng GUI để soạn, kiểm tra kịch bản và CLI để tạo tải
  - JTL, báo cáo HTML và lựa chọn dữ liệu cần lưu
  - Hạn chế listener nặng khi tạo tải
  - Giới hạn của HTTP sampler đối với thực thi JavaScript và hiển thị trình duyệt
- level1: Gatling
  level2:
  - Simulation, scenario, protocol và cấu trúc Java DSL
  - Session và dữ liệu của từng người dùng ảo
  - Feeder để cấp dữ liệu và tránh trùng trạng thái
  - Checks và lưu giá trị từ phản hồi
  - injectOpen và injectClosed theo mô hình tải
  - Pause, pacing và tỷ trọng các nhánh hành trình
  - Nhóm request và đo thời gian của một giao dịch
  - Assertions cho tỷ lệ lỗi và phân bố thời gian phản hồi
  - Báo cáo, tham số hóa và chạy qua công cụ build
  - Kiểm chứng lịch tạo tải thực tế trước khi đọc kết quả tổng
- level1: k6
  level2:
  - Cấu trúc script, bước chuẩn bị và phần thực thi lặp
  - Virtual user, iteration và scenario
  - Executors theo số người dùng hoặc tốc độ đến
  - Checks cho tính đúng và thresholds cho tiêu chí đạt
  - Check thất bại không tự biến lượt chạy thành thất bại nếu thiếu tiêu chí phù hợp
  - Tham số hóa dữ liệu, môi trường và lịch tải
  - Custom metrics, tag và giới hạn số lượng nhãn
  - Nhận diện dropped iterations và giới hạn người dùng ảo
  - Tách thời gian chờ kết nối khỏi thời gian request theo định nghĩa công cụ
  - Đầu ra, mã thoát và tích hợp kết quả vào CI
- level1: Quy trình thực thi
  level2:
  - Kiểm tra artifact, cấu hình, dữ liệu và công cụ trước chạy
  - Smoke kịch bản để xác nhận chức năng và cơ chế đo
  - Lượt chạy chuẩn để hiểu hành vi ở tải thấp
  - Tăng tải có kiểm soát và giữ giai đoạn quan sát
  - Warm-up, giai đoạn đo và xử lý giai đoạn chưa ổn định
  - Dừng tạo tải, chờ hoàn tất và quan sát khôi phục
  - Điều kiện dừng khi vượt giới hạn đã xác định
  - Nhật ký thay đổi hoặc sự kiện bất thường trong lượt chạy
  - Đánh giá lượt chạy hợp lệ trước khi đưa vào so sánh
  - Khôi phục trạng thái và chuẩn bị lượt lặp độc lập
- level1: Tải mục tiêu và giới hạn
  level2:
  - Chứng minh yêu cầu dưới tải hoạt động được cam kết
  - Tăng tải theo bậc để tìm vùng bắt đầu suy giảm
  - Điểm gãy của quan hệ tải, thông lượng và thời gian phản hồi
  - Phân biệt thông lượng bão hòa với số yêu cầu tiếp tục đến
  - Giới hạn tốc độ (rate limiting), từ chối tải và ý nghĩa đối với mục tiêu kiểm chứng
  - Timeout hoặc lỗi nhanh có thể làm số thời gian phản hồi đẹp hơn
  - Kiểm tra tính đúng dữ liệu tại tải cao
  - Xác định giới hạn theo tiêu chí chất lượng thay vì chờ tiến trình sập
- level1: Tải đột biến và khôi phục
  level2:
  - Thiết kế biên độ, tốc độ tăng và thời gian giữ spike
  - Đột biến người dùng, tốc độ đến hoặc kích thước payload
  - Khởi tạo kết nối, cache hoặc tài nguyên đồng loạt
  - Hàng đợi và lượng công việc tồn sau khi đỉnh tải qua đi
  - Autoscaling phản ứng chậm so với nhu cầu tăng
  - Retry và nguy cơ khuếch đại tải khi hệ thống suy giảm
  - Thời gian trở về vùng hiệu năng mục tiêu
  - Phân biệt sống sót qua spike với hoàn tất đúng công việc đã nhận
- level1: Chạy dài và dữ liệu lớn
  level2:
  - Soak test và mục tiêu phát hiện suy giảm theo thời gian
  - Chọn thời lượng theo chu kỳ rủi ro thay vì một con số cố định
  - Rò rỉ bộ nhớ, kết nối, luồng hoặc file descriptor
  - Dữ liệu, log và hàng đợi tăng trong lúc chạy
  - Ảnh hưởng của tác vụ định kỳ hoặc chu kỳ thu gom
  - Phiên, token, kết nối và dữ liệu hết hạn
  - Volume test với quy mô lưu trữ hoặc tập kết quả lớn
  - So sánh đầu, giữa và cuối lượt chạy dưới tải tương đương
  - Khả năng dọn tài nguyên và khôi phục sau khi dừng tải
- level1: Khả năng mở rộng
  level2:
  - Scale up và scale out tạo những loại thay đổi nào
  - Đường cong năng lực khi tăng CPU, bộ nhớ hoặc số instance
  - Hiệu quả mở rộng và phần chi phí phối hợp
  - Nút thắt dùng chung giới hạn lợi ích thêm instance
  - Load balancing, phân bố phiên và độ lệch tải giữa các nút
  - 'Autoscaling: tín hiệu kích hoạt, độ trễ và hành vi ổn định'
  - Năng lực đỉnh so với năng lực duy trì trong giới hạn chất lượng
  - Dự phòng tài nguyên và khoảng an toàn theo mức biến động
  - Chi phí tài nguyên cho một đơn vị công việc thành công
  - Giới hạn của ngoại suy từ môi trường hoặc mức tải nhỏ
- level1: Hiệu năng JVM
  level2:
  - Khởi động JVM, nạp lớp và biên dịch JIT
  - Warm-up và chuyển đổi hành vi khi mã được tối ưu
  - Heap, bộ nhớ native và giới hạn bộ nhớ tiến trình
  - Tốc độ cấp phát đối tượng và áp lực thu gom rác
  - GC pause, thời gian GC tổng và ảnh hưởng đến thông lượng
  - Tập đối tượng còn sống sau GC và dấu hiệu cần điều tra
  - Thread, lock, contention và context switching
  - Pool luồng, pool kết nối và thời gian chờ
  - 'Virtual thread: đánh giá theo JDK, loại tác vụ và giới hạn tài nguyên'
  - Tham số JVM và tính so sánh giữa các lượt chạy
  - Tách bằng chứng đo được khỏi giả định về một tùy chọn tối ưu
- level1: JFR và phân tích thực thi
  level2:
  - Chọn cách phân tích thực thi theo câu hỏi về CPU, bộ nhớ, khóa hoặc I/O
  - JDK Flight Recorder và các nhóm sự kiện liên quan
  - JDK Mission Control để xem và đối chiếu bản ghi
  - Lấy mẫu phương thức (method sampling), cây lời gọi và giới hạn của lấy mẫu
  - Phân biệt thời gian dùng CPU với thời gian bị chặn hoặc chờ
  - Hồ sơ cấp phát (allocation profile) và nguồn tạo nhiều đối tượng
  - Đối chiếu sự kiện GC, khóa hoặc I/O với thời gian phản hồi
  - Thread dump trong giai đoạn có dấu hiệu nghẽn
  - Chi phí của cấu hình ghi và việc thu thập heap statistics
  - Xác minh lại bằng phép đo độc lập sau khi có giả thuyết
- level1: Cơ sở dữ liệu
  level2:
  - Thời gian từ ứng dụng chờ pool đến khi đọc xong kết quả
  - Truy vấn chậm và kế hoạch thực thi theo dữ liệu đại diện
  - Chỉ mục, độ chọn lọc và phân bố dữ liệu
  - N+1 query và số lần gọi tăng theo kích thước đầu vào
  - Lock, transaction dài và cạnh tranh trên bản ghi nóng
  - Connection pool và giới hạn máy chủ cơ sở dữ liệu
  - Batch, phân trang và khối lượng dữ liệu trả về
  - Warm cache của cơ sở dữ liệu so với lần đọc ban đầu
  - Timeout, retry và tải bổ sung khi truy vấn thất bại
  - Phân biệt tối ưu truy vấn đơn với hành vi khi nhiều yêu cầu đồng thời
- level1: Cache
  level2:
  - Cache lạnh, cache ấm và điều kiện cần tái hiện
  - Tỷ lệ hit, miss và khối lượng dữ liệu theo mô hình truy cập
  - TTL, eviction và thời điểm nhiều khóa cùng hết hạn
  - Cache stampede và tải dồn xuống thành phần phía sau
  - Khóa nóng, phân bố không đều và giới hạn dung lượng
  - Chi phí cập nhật hoặc vô hiệu hóa cache
  - Tính đúng và độ mới của dữ liệu trong bài thử tải
  - Giới hạn của kết quả khi mọi người dùng chỉ đọc một tập khóa nhỏ
- level1: Mạng và dịch vụ ngoài
  level2:
  - DNS, thiết lập kết nối, TLS và tái sử dụng kết nối
  - Độ trễ, băng thông và kích thước payload
  - Nén dữ liệu và đánh đổi CPU với lượng truyền
  - Proxy, gateway và giới hạn trên đường đi
  - Timeout từng chặng và ngân sách thời gian đầu cuối
  - Retry, circuit breaker và tác động đến lượng công việc thực tế
  - Giới hạn của stub khi cần dự báo năng lực dịch vụ tích hợp
  - Phân biệt nút thắt mạng, phụ thuộc ngoài và phần xử lý ứng dụng
- level1: Xử lý bất đồng bộ
  level2:
  - Thời điểm chấp nhận yêu cầu và thời điểm công việc thực sự hoàn tất
  - Đo độ trễ đầu cuối qua hàng đợi hoặc chuỗi sự kiện
  - Tốc độ producer, tốc độ consumer và mức tăng backlog
  - Độ trễ hàng đợi, số công việc đang xử lý và tuổi công việc
  - Batch, số consumer, partition và giới hạn song song
  - Retry, xử lý trùng và ảnh hưởng đến thông lượng có giá trị
  - Backpressure, giới hạn tiếp nhận và thời gian tiêu hết backlog
  - Tính đúng của kết quả khi tăng tốc xử lý
  - Không dùng phản hồi nhận việc nhanh thay cho thời gian hoàn thành nghiệp vụ
- level1: Hiệu năng phía người dùng
  level2:
  - Phân biệt đo HTTP ở mức giao thức với trải nghiệm trong trình duyệt
  - Tải tài nguyên, thực thi JavaScript và hiển thị nội dung
  - Độ phản hồi tương tác và sự ổn định bố cục
  - Cache trình duyệt, kết nối mới và người dùng quay lại
  - Thiết bị, CPU và điều kiện mạng của người sử dụng
  - Đo trong phòng thí nghiệm so với dữ liệu người dùng thực
  - Phân biệt hồi quy giao diện với suy giảm API phía máy chủ
  - Giới hạn khi suy trải nghiệm đầu cuối từ thời gian một request
- level1: Lượt chuẩn và so sánh
  level2:
  - Bộ kết quả chuẩn (baseline) và đầy đủ điều kiện thí nghiệm
  - Cùng artifact hoặc thay đổi có chủ đích khi đối chiếu
  - Giữ mô hình tải, dữ liệu, môi trường và cách đo nhất quán
  - Thứ tự chạy A/B và ảnh hưởng của thời gian hoặc trạng thái cache
  - Lặp nhiều lượt độc lập để đánh giá độ biến thiên
  - So sánh đường cong theo tải thay vì chỉ một điểm
  - Đối chiếu phân bố độ trễ, lỗi và tài nguyên cùng lúc
  - Ngưỡng hồi quy tương đối và mức thay đổi tối thiểu có ý nghĩa
  - Không chọn lượt đẹp nhất làm kết luận đại diện
  - Quản lý phiên bản bộ kết quả chuẩn và nguyên nhân chấp thuận thay đổi
- level1: Đo chuẩn thành phần
  level2:
  - Khi nào cần microbenchmark thay cho bài thử tải toàn hệ thống
  - JMH và cấu trúc phép đo cho mã Java
  - Warm-up, measurement và fork để kiểm soát ảnh hưởng JVM
  - Dead code elimination và kết quả không được sử dụng
  - Constant folding và đầu vào thiếu tính đại diện
  - Trạng thái dữ liệu, concurrency và phạm vi benchmark
  - Chi phí phép đo, độ biến thiên và ý nghĩa của kết quả
  - Xác minh lợi ích ở cấp hệ thống sau khi cải thiện một thành phần
- level1: Phân tích nút thắt
  level2:
  - Từ triệu chứng người dùng đến giả thuyết ở từng tầng
  - Liên kết điểm đổi của thông lượng, độ trễ, lỗi và tài nguyên
  - CPU cao, CPU thấp và các dạng chờ khác nhau
  - Queue hoặc pool bão hòa trong khi tài nguyên tổng còn dư
  - Độ trễ đuôi và một nhóm yêu cầu gây ảnh hưởng không đồng đều
  - Rò rỉ tài nguyên so với cache tăng đến mức ổn định
  - Phân biệt tương quan theo thời gian với quan hệ nguyên nhân
  - Thay một biến và lặp lại để kiểm tra giả thuyết
  - Nút thắt có thể dịch chuyển sau khi một tầng được cải thiện
  - Ghi nhận bằng chứng chưa đủ để kết luận
- level1: Kiểm chứng cải tiến
  level2:
  - Ưu tiên thay đổi theo mục tiêu và nút thắt đã có bằng chứng
  - Tối ưu thuật toán, dữ liệu, I/O hoặc mức song song theo giả thuyết
  - Giữ tính đúng chức năng khi thay cách xử lý
  - Đánh đổi độ trễ, thông lượng, bộ nhớ và mức sử dụng tài nguyên
  - Kiểm tra cả tải thông thường, tải cao và trường hợp bất lợi
  - Phát hiện cải thiện trung bình nhưng làm xấu phần đuôi
  - Đo lại dưới cùng điều kiện và kiểm tra độ biến thiên
  - Rà soát tác động đến thành phần hoặc nhóm người dùng khác
  - Lưu thay đổi, dữ liệu đối chiếu và kết luận có điều kiện
- level1: Tích hợp CI
  level2:
  - Chọn bài phản hồi nhanh và bài chuyên sâu theo mục đích
  - Tách kiểm chứng kịch bản khỏi kiểm chứng năng lực môi trường
  - Cấu hình lịch tải và ngưỡng có quản lý phiên bản
  - Môi trường CI có thể dùng chung và giới hạn so sánh hiệu năng
  - Giới hạn số lượt chạy đồng thời và tài nguyên của máy phát
  - Chuyển tiêu chí lỗi, độ trễ và tính đúng thành mã thoát
  - Lưu artifact, dữ liệu, cấu hình và kết quả để tái hiện
  - Phân biệt thất bại sản phẩm với lượt chạy không đủ điều kiện đo
  - Theo dõi xu hướng và thay đổi bộ kết quả chuẩn có chủ đích
- level1: Báo cáo và quyết định
  level2:
  - Tóm tắt câu hỏi, phạm vi, mô hình tải và điều kiện thí nghiệm
  - Trình bày tải đặt vào, tải thực đạt và công việc hoàn tất
  - Đường cong thông lượng, độ trễ, lỗi và mức sử dụng tài nguyên
  - Nêu rõ percentile, số mẫu và khoảng thời gian được tính
  - Đánh dấu giai đoạn khởi động, bất thường và khôi phục
  - Đối chiếu kết quả với tiêu chí đã thống nhất
  - Phân biệt phát hiện, giả thuyết nguyên nhân và đề xuất cần kiểm chứng
  - Giới hạn suy rộng và rủi ro chưa được bài thử bao phủ
  - Kết luận năng lực theo điều kiện thay vì công bố một con số tuyệt đối
- level1: Thực hành tổng hợp
  level2:
  - Chuyển một yêu cầu API thành mục tiêu độ trễ, tải và tỷ lệ lỗi
  - Xây mô hình tải có hành trình, tỷ trọng và dữ liệu đại diện
  - So sánh mô hình mở với mô hình đóng khi hệ thống chậm dần
  - Tạo bài JMeter hoặc Gatling có kiểm tra tính đúng phản hồi
  - Tạo bài k6 với checks, thresholds và theo dõi dropped iterations
  - Tìm điểm bão hòa bằng lịch tải tăng theo bậc
  - Đo thời gian hoàn tất nghiệp vụ trong hệ thống có hàng đợi
  - Đối chiếu cache lạnh, cache ấm và phân bố khóa nóng
  - Thu JFR để kiểm tra giả thuyết về cấp phát hoặc chờ khóa
  - So sánh hai phiên bản bằng nhiều lượt và phân bố kết quả
  - Kiểm chứng cải tiến mà vẫn giữ tính đúng và giới hạn tài nguyên
  - Viết báo cáo năng lực cùng phạm vi chưa có bằng chứng
