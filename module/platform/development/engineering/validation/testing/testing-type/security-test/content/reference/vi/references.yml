references:
  - title: "OWASP Web Security Testing Guide — Stable"
    url: "https://wstg.owasp.org/stable/4-Web_Application_Security_Testing/"
    description: "Quy trình và tình huống kiểm thử web: xác thực, phân quyền, phiên, đầu vào và cấu hình."
  - title: "OWASP Application Security Verification Standard"
    url: "https://asvs.owasp.org/"
    description: "Bộ yêu cầu kiểm chứng các kiểm soát bảo mật ứng dụng và dịch vụ web."
  - title: "OWASP API Security Top 10 — 2023"
    url: "https://api-security.owasp.org/editions/2023/en/0x00-header/"
    description: "Các nhóm rủi ro đặc thù khi đánh giá an toàn API."
  - title: "OWASP Cheat Sheet Series"
    url: "https://cheatsheetseries.owasp.org/"
    description: "Hướng dẫn thực hành về kiểm soát bảo mật cho các tình huống thường gặp."
  - title: "NIST SP 800-115 — Technical Guide to Information Security Testing and Assessment"
    url: "https://csrc.nist.gov/pubs/sp/800/115/final"
    description: "Lập kế hoạch, thực thi, phân tích và báo cáo kiểm thử bảo mật kỹ thuật."
  - title: "ZAP Documentation"
    url: "https://www.zaproxy.org/docs/"
    description: "Hướng dẫn sử dụng công cụ phân tích và kiểm thử bảo mật ứng dụng web."