references:
  - title: "JUnit 6 User Guide — Assertions"
    url: "https://docs.junit.org/6.1.2/writing-tests/assertions.html"
    description: "Hướng dẫn assertEquals, assertAll, assertThrows, assertTimeout, thông báo lỗi và cảnh báo preemptive timeout."
  - title: "JUnit 6 API — Assertions"
    url: "https://docs.junit.org/6.1.2/api/org.junit.jupiter.api/org/junit/jupiter/api/Assertions.html"
    description: "Định nghĩa và overload của các phép so sánh, kiểm tra null, exception, timeout và collection trong JUnit Jupiter."
  - title: "JUnit 6 User Guide — Parameterized Tests"
    url: "https://docs.junit.org/6.1.2/writing-tests/parameterized-classes-and-tests.html"
    description: "Chạy cùng một tập assertions trên nhiều tập dữ liệu đầu vào, bao gồm giá trị biên và trường hợp lỗi."
  - title: "AssertJ — Core Assertions Guide"
    url: "https://assertj.github.io/doc/"
    description: "Cú pháp fluent assertThat, collection assertions, extracting, recursive comparison và soft assertions."
  - title: "AssertJ — Official Examples"
    url: "https://github.com/assertj/assertj-examples"
    description: "Ví dụ Java sử dụng AssertJ Core để xác minh giá trị và đối tượng, hỗ trợ thực hành."
  - title: "Hamcrest — Java Tutorial"
    url: "https://hamcrest.org/JavaHamcrest/tutorial"
    description: "MatcherAssert.assertThat cùng matchers cho object, collection, string, logic và matcher tùy chỉnh."
  - title: "Hamcrest — Java API Reference"
    url: "https://hamcrest.org/JavaHamcrest/javadoc/"
    description: "Tài liệu API chính thức cho các matcher và phương thức dùng khi viết assertion khai báo."