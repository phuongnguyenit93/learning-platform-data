references:
  - title: "Testcontainers — Getting Started"
    url: "https://testcontainers.com/getting-started/"
    description: "Khởi tạo dependency thật trong container, test lifecycle, wait strategy và tự động dọn tài nguyên."
  - title: "Testcontainers Java — JUnit 5 Integration"
    url: "https://java.testcontainers.org/test_framework_integration/junit_5/"
    description: "Quản lý vòng đời @Testcontainers và @Container cho instance field, static field và test class."
  - title: "Testcontainers Java — Wait Strategies"
    url: "https://java.testcontainers.org/features/startup_and_waits/"
    description: "Chờ container và dịch vụ thực sự sẵn sàng trước khi kết nối hoặc chạy assertion."
  - title: "Docker Docs — Compose Quickstart"
    url: "https://docs.docker.com/compose/gettingstarted/"
    description: "Khai báo dịch vụ, network, healthcheck, cấu hình và chạy test stack bằng Docker Compose."
  - title: "Docker Docs — docker compose down"
    url: "https://docs.docker.com/reference/cli/docker/compose/down"
    description: "Quy tắc dừng/xóa container, network và volume test; phân biệt tác dụng của --volumes."
  - title: "Spring Boot — Testcontainers"
    url: "https://docs.spring.io/spring-boot/reference/testing/testcontainers.html"
    description: "Kết nối ứng dụng Spring Boot tới các dependency chạy bằng Testcontainers và @ServiceConnection."
  - title: "JUnit 5 — User Guide"
    url: "https://docs.junit.org/5.13.1/user-guide/index.html"
    description: "Test lifecycle, setup/teardown và kiểm soát ảnh hưởng của state hoặc chạy test song song."
  - title: "WireMock — Stubbing"
    url: "https://wiremock.org/docs/stubbing/"
    description: "Tạo phản hồi HTTP có kiểm soát để thay thế API ngoài khi thiết lập test environment."