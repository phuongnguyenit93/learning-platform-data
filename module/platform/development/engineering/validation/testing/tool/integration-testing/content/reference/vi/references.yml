references:
  - title: "Spring Framework — Integration Testing"
    url: "https://docs.spring.io/spring-framework/reference/testing/integration.html"
    description: "Spring TestContext, ApplicationContext và kiểm thử các thành phần phối hợp."
  - title: "Spring Boot — Testing Applications"
    url: "https://docs.spring.io/spring-boot/reference/testing/spring-boot-applications.html"
    description: "@SpringBootTest, web environment và phạm vi transaction/rollback."
  - title: "Spring Framework — MockMvc"
    url: "https://docs.spring.io/spring-framework/reference/testing/mockmvc.html"
    description: "Kiểm thử request/response qua Spring MVC mà không cần khởi chạy HTTP server."
  - title: "JUnit 5 — User Guide"
    url: "https://docs.junit.org/5.12.1/user-guide/index.html"
    description: "JUnit Jupiter annotations, lifecycle, assertions, timeouts và test configuration."
  - title: "Testcontainers for Java — Documentation"
    url: "https://java.testcontainers.org/"
    description: "Khởi chạy dịch vụ thực trong Docker cho kiểm thử tích hợp Java."
  - title: "Spring Boot — Testcontainers Integration"
    url: "https://docs.spring.io/spring-boot/reference/testing/testcontainers.html"
    description: "Quản lý container và tự cấu hình service connections trong Spring Boot test."
  - title: "WireMock — Stubbing"
    url: "https://wiremock.org/docs/stubbing/"
    description: "Mô phỏng API HTTP với phản hồi, điều kiện request và kịch bản lỗi."
  - title: "Awaitility — Usage Guide"
    url: "https://github.com/awaitility/awaitility/wiki/Usage"
    description: "Chờ điều kiện của xử lý bất đồng bộ với timeout và polling có giới hạn."
  - title: "Apache Maven — Failsafe Plugin"
    url: "https://maven.apache.org/surefire/maven-failsafe-plugin/index.html"
    description: "Chạy integration tests trong vòng đời Maven integration-test và verify."