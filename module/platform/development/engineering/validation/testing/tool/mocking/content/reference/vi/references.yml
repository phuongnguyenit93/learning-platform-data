references:
  - title: "Mockito — Core API (Mockito 5.24 Javadoc)"
    url: "https://javadoc.io/static/org.mockito/mockito-core/5.24.0/org.mockito/org/mockito/Mockito.html"
    description: "Hướng dẫn mock, when/thenReturn, verify, ArgumentMatcher, ArgumentCaptor, spy và strict stubbing."
  - title: "Mockito — MockitoExtension for JUnit Jupiter"
    url: "https://github.com/mockito/mockito/blob/main/mockito-extensions/mockito-junit-jupiter/src/main/java/org/mockito/junit/jupiter/MockitoExtension.java"
    description: "Tích hợp JUnit 5 bằng @ExtendWith, @Mock, Strictness và lifecycle tự động."
  - title: "Martin Fowler — Mocks Aren't Stubs"
    url: "https://www.martinfowler.com/articles/mocksArentStubs.html"
    description: "Phân biệt dummy, fake, stub, spy và mock; state verification so với behavior verification."
  - title: "Spring Framework — Unit Testing"
    url: "https://docs.spring.io/spring-framework/reference/testing/unit.html"
    description: "Unit test cho POJO và service bằng mocks mà không cần khởi động Spring ApplicationContext."
  - title: "Spring Framework — @MockitoBean and @MockitoSpyBean"
    url: "https://docs.spring.io/spring-framework/reference/testing/annotations/integration-spring/annotation-mockitobean.html"
    description: "Thay thế hoặc spy bean trong test ApplicationContext và các giới hạn khi dùng Spring AOP."
  - title: "Spring Framework — Bean Overriding in Tests"
    url: "https://docs.spring.io/spring-framework/reference/testing/testcontext-framework/bean-overriding.html"
    description: "Cơ chế override bean cho test với @TestBean, @MockitoBean và @MockitoSpyBean."
  - title: "JUnit — Third-party Extensions"
    url: "https://github.com/junit-team/junit-framework/wiki/Third-party-Extensions"
    description: "Nguồn JUnit tham chiếu MockitoExtension và artifact mockito-junit-jupiter."