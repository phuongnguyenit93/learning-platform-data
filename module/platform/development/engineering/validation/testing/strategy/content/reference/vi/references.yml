references:
  - title: "ISTQB – Certified Tester Foundation Level v4.0"
    url: "https://www.istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/"
    description: "Khung kiến thức chính thức về lập kế hoạch kiểm thử, quản lý rủi ro, các cấp độ và hoạt động kiểm thử."
  - title: "ISO/IEC/IEEE 29119-2:2021 – Test Processes"
    url: "https://www.iso.org/standard/79428.html"
    description: "Trang tiêu chuẩn chính thức mô tả các quy trình quản trị, quản lý và thực hiện kiểm thử phần mềm."
  - title: "Google Testing Blog – Just Say No to More End-to-End Tests"
    url: "https://testing.googleblog.com/2015/04/just-say-no-to-more-end-to-end-tests.html"
    description: "Phân tích sự cân đối giữa unit, integration và end-to-end để xây dựng vòng phản hồi kiểm thử."
  - title: "Microsoft Learn – Azure Test Plans Overview"
    url: "https://learn.microsoft.com/en-us/azure/devops/test/overview?view=azure-devops"
    description: "Tài liệu về tổ chức test plans, kết quả, truy vết yêu cầu và tích hợp kiểm thử vào CI/CD."
  - title: "OWASP Web Security Testing Guide"
    url: "https://owasp.org/projects/web-security-testing-guide?tab=main"
    description: "Phương pháp và phạm vi kiểm thử bảo mật ứng dụng web, có thể dùng khi xác định rủi ro bảo mật."