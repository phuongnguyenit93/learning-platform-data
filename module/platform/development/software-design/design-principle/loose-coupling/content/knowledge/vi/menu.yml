menu:
- level1: Tổng quan
  level2:
  - Liên kết lỏng (loose coupling) là gì trong thiết kế phần mềm
  - Liên kết (coupling) thể hiện sự phụ thuộc giữa các phần như thế nào
  - Vì sao một thay đổi nhỏ có thể kéo theo nhiều thay đổi khác
  - Mục tiêu giảm hiểu biết về chi tiết và giảm ràng buộc thay đổi
  - Phân biệt liên kết lỏng với loại bỏ mọi phụ thuộc
  - Quan hệ giữa liên kết lỏng và tính gắn kết cao
  - Ảnh hưởng đến khả năng kiểm thử, thay thế và tái sử dụng
  - Phân biệt liên kết ở cấp hàm, đối tượng, mô-đun và dịch vụ
  - Chi phí của lớp trung gian và giới hạn của việc tách rời
  - Thuật ngữ và thứ tự học từ nhận diện phụ thuộc đến cải tiến thiết kế
- level1: Các dạng liên kết
  level2:
  - Liên kết nội dung khi can thiệp vào chi tiết triển khai của phần khác
  - Liên kết qua dữ liệu toàn cục và tài nguyên dùng chung
  - Liên kết với định dạng, giao thức và quy ước bên ngoài
  - Liên kết điều khiển qua cờ và chỉ thị cách xử lý
  - Liên kết qua cấu trúc dữ liệu lớn hơn nhu cầu sử dụng
  - Liên kết qua dữ liệu đầu vào và đầu ra cần thiết
  - Liên kết qua thông điệp và hợp đồng tương tác
  - Liên kết thời gian qua thứ tự gọi và thời điểm sẵn sàng
  - Liên kết ngữ nghĩa qua ý nghĩa ngầm của giá trị và hành vi
  - Liên kết triển khai khi các phần buộc phải phát hành cùng nhau
  - Phân biệt phụ thuộc tĩnh, phụ thuộc lúc chạy và phụ thuộc nghiệp vụ
  - Đánh giá từng dạng liên kết theo ngữ cảnh thay vì xếp hạng máy móc
- level1: Phân tích tác động
  level2:
  - Lập danh sách thành phần, trách nhiệm và quan hệ phụ thuộc
  - Phân biệt phụ thuộc trực tiếp với phụ thuộc bắc cầu
  - Vẽ đồ thị phụ thuộc từ import, lời gọi và truy cập dữ liệu
  - Nhận diện phụ thuộc ẩn qua cấu hình, reflection và quy ước tên
  - Xác định bên cung cấp và bên sử dụng của từng hợp đồng
  - Phân tích thay đổi lan theo kiểu dữ liệu, hành vi và giao thức
  - Theo dõi những tệp hoặc mô-đun thường phải sửa cùng nhau
  - Phân biệt phụ thuộc thiết yếu với phụ thuộc do cách triển khai
  - Đánh giá điểm tập trung phụ thuộc và thành phần có phạm vi ảnh hưởng lớn
  - Kiểm chứng nhận định bằng một kịch bản thay đổi cụ thể
  - Ghi giả định và phần phụ thuộc chưa quan sát được
- level1: Ranh giới và gắn kết
  level2:
  - Nhóm trách nhiệm có lý do thay đổi liên quan với nhau
  - Xác định ranh giới theo năng lực nghiệp vụ và quyết định cần sở hữu
  - Đánh giá việc giảm liên kết có làm phân tán một trách nhiệm thống nhất
  - Giữ quy tắc và dữ liệu bảo vệ cùng một bất biến ở vị trí phù hợp
  - Nhận diện chia nhỏ quá mức khiến một thao tác phải đi qua nhiều phần
  - Phân biệt ranh giới logic với cấu trúc thư mục
  - Chọn mức phân chia theo phạm vi thay đổi thực tế
  - Đặt giao diện công khai tại ranh giới có ý nghĩa
  - Điều chỉnh ranh giới khi các phần liên tục phải thay đổi cùng nhau
  - Cân bằng tự chủ của thành phần với khả năng hiểu toàn bộ luồng xử lý
- level1: Che giấu thông tin
  level2:
  - Ẩn quyết định thiết kế dễ thay đổi phía sau hợp đồng
  - Phân biệt đóng gói dữ liệu với che giấu cách thực hiện
  - Giới hạn quyền truy cập vào trạng thái và cấu trúc nội bộ
  - Ngăn bên sử dụng phụ thuộc thuật toán hoặc cấu trúc lưu trữ
  - Nhận diện kiểu triển khai và ngoại lệ nội bộ bị lộ qua API
  - Giảm chuỗi truy cập xuyên qua nhiều đối tượng
  - Liên hệ nguyên tắc biết ít nhất với Law of Demeter
  - Thiết kế thao tác có ý nghĩa thay vì trả toàn bộ cấu trúc bên trong
  - Kiểm chứng khả năng thay đổi nội bộ mà bên sử dụng không phải sửa
  - Tránh lớp bao chỉ chuyển tiếp nhưng không che giấu quyết định nào
- level1: Hợp đồng và API
  level2:
  - Phân biệt hợp đồng cú pháp với hợp đồng hành vi
  - Thiết kế API từ nhu cầu của bên sử dụng
  - Giảm bề mặt công khai và số chi tiết bên sử dụng phải biết
  - Xác định tiền điều kiện, hậu điều kiện và bất biến
  - Phân tách giao diện theo nhóm nhu cầu sử dụng
  - Chọn tham số và giá trị trả về vừa đủ cho thao tác
  - Thể hiện rõ quyền sở hữu và khả năng sửa đổi dữ liệu
  - Thiết kế lỗi có ý nghĩa và giới hạn xử lý phía bên gọi
  - Ghi rõ quy tắc null, giá trị mặc định và dữ liệu không hợp lệ
  - Thiết kế thay đổi bổ sung mà vẫn giữ hành vi đã cam kết
  - Kiểm tra hợp đồng bằng ví dụ sử dụng và trường hợp lỗi
  - Nhận diện hợp đồng nhỏ về hình thức nhưng chứa nhiều giả định ngầm
- level1: Phụ thuộc dữ liệu
  level2:
  - Phân biệt chia sẻ giá trị với chia sẻ cấu trúc và trạng thái
  - Truyền dữ liệu cần thiết thay vì toàn bộ đối tượng nghiệp vụ
  - Đánh giá tham số nguyên thủy, value object và DTO theo ý nghĩa hợp đồng
  - Ngăn entity lưu trữ trở thành hợp đồng của nhiều thành phần
  - Tách mô hình nội bộ khỏi định dạng của hệ thống bên ngoài
  - Chuyển đổi dữ liệu tại ranh giới bằng lớp ánh xạ phù hợp
  - Quản lý enum, mã trạng thái và giá trị đặc biệt qua hợp đồng
  - Tránh dữ liệu không có kiểu rõ ràng che giấu ràng buộc lúc chạy
  - Đánh giá phụ thuộc do dùng chung bảng, schema và truy vấn
  - Xác định thành phần sở hữu dữ liệu và quyền cập nhật
  - Quản lý bản sao dữ liệu đọc và yêu cầu nhất quán
  - Đánh đổi giữa giảm phụ thuộc cấu trúc với chi phí ánh xạ và sao chép
- level1: Trạng thái dùng chung
  level2:
  - Nhận diện biến toàn cục, singleton có trạng thái và bộ nhớ dùng chung
  - Phân tích thay đổi gián tiếp do nhiều thành phần cùng sửa một đối tượng
  - Giới hạn quyền ghi và xác định chủ sở hữu trạng thái
  - Sử dụng dữ liệu bất biến khi phù hợp
  - Phân biệt truyền tham chiếu với trao quyền thay đổi dữ liệu
  - Kiểm soát cache chung và các giả định về thời hạn dữ liệu
  - Giảm phụ thuộc giữa kiểm thử do trạng thái còn sót lại
  - Đánh giá đồng bộ hóa và tranh chấp tài nguyên dùng chung
  - Tách trạng thái theo yêu cầu, phiên hoặc thành phần khi cần
  - Nhận diện phụ thuộc ẩn vào cấu hình toàn cục và môi trường
- level1: Hướng phụ thuộc
  level2:
  - Phân biệt chiều gọi lúc chạy với chiều phụ thuộc mã nguồn
  - Tổ chức đồ thị phụ thuộc theo trách nhiệm và mức ổn định
  - Giữ quy tắc nghiệp vụ tránh phụ thuộc chi tiết công nghệ
  - Nhận diện chu trình trực tiếp và chu trình qua nhiều thành phần
  - Phá chu trình bằng chuyển trách nhiệm hoặc tách điểm phối hợp
  - Đặt hợp đồng ở phía có nhu cầu và quyền sở hữu phù hợp
  - Cô lập phụ thuộc bên ngoài tại biên ứng dụng
  - Kiểm soát sự lan truyền của phụ thuộc bắc cầu
  - Phân biệt dependency inversion với việc chỉ thêm interface
  - Đánh giá hướng phụ thuộc khi thêm lớp trừu tượng
  - Quản lý ngoại lệ kiến trúc có lý do và phạm vi rõ ràng
- level1: Đảo ngược phụ thuộc
  level2:
  - Vấn đề khi chính sách cấp cao phụ thuộc triển khai cấp thấp
  - Thiết kế abstraction phản ánh nhu cầu nghiệp vụ
  - Đưa hợp đồng về phía bên sử dụng khi phù hợp
  - Triển khai adapter cho cơ sở dữ liệu và dịch vụ bên ngoài
  - Tách logic quyết định khỏi thao tác vào ra
  - Thay triển khai qua composition tại điểm khởi tạo
  - Kiểm thử logic với triển khai thay thế có hành vi đại diện
  - Đánh giá interface một triển khai theo nhu cầu cách ly thay đổi
  - Nhận diện abstraction vẫn làm lộ chi tiết của nhà cung cấp
  - Liên hệ dependency inversion với kiến trúc port và adapter
  - Tránh đảo ngược phụ thuộc chỉ để đáp ứng quy tắc hình thức
- level1: Tiêm phụ thuộc
  level2:
  - Phân biệt tạo phụ thuộc với sử dụng phụ thuộc
  - Tiêm phụ thuộc qua constructor, phương thức và tham số
  - Chọn vòng đời phụ thuộc phù hợp với bên sử dụng
  - Đặt việc ghép nối đối tượng tại composition root
  - Phân biệt dependency injection, inversion of control và service locator
  - Thiết kế phụ thuộc bắt buộc và tùy chọn một cách rõ ràng
  - Kiểm tra hợp lệ của phụ thuộc khi khởi tạo
  - Tránh container hoặc context toàn cục trong logic nghiệp vụ
  - Đánh giá constructor có quá nhiều phụ thuộc như tín hiệu thiết kế
  - Tiêm hàm, chiến lược hoặc nguồn dữ liệu cho điểm biến đổi nhỏ
  - Nhận diện liên kết ngữ nghĩa vẫn còn sau khi áp dụng dependency injection
- level1: Kế thừa và kết hợp
  level2:
  - Phụ thuộc giữa lớp con với hợp đồng và chi tiết của lớp cha
  - Nhận diện lớp cơ sở dễ vỡ khi thay đổi triển khai
  - Đánh giá protected và khả năng can thiệp trạng thái nội bộ
  - Sử dụng composition và delegation để giới hạn phần cần biết
  - Phân biệt quan hệ thay thế kiểu với nhu cầu tái sử dụng mã
  - Giữ hành vi thay thế phù hợp với hợp đồng đã cam kết
  - Tách chính sách biến đổi khỏi cơ chế dùng chung
  - Đánh giá chi phí lớp bao và số tầng chuyển tiếp
  - Thay kế thừa bằng kết hợp từng bước có kiểm thử
  - Chọn kế thừa hoặc kết hợp dựa trên quan hệ và nhu cầu thay đổi
- level1: Mẫu thiết kế hỗ trợ
  level2:
  - Adapter để cách ly hợp đồng ứng dụng với API bên ngoài
  - Facade để cung cấp lối vào đơn giản và ổn định
  - Strategy để tách thuật toán hoặc chính sách có thể thay thế
  - Bridge để tách hai chiều biến đổi độc lập
  - Factory để cách ly quyết định tạo và lựa chọn đối tượng
  - Observer để phân phối thông báo và quản lý đăng ký phụ thuộc
  - Mediator để tập trung phối hợp và giảm quan hệ trực tiếp
  - Command để biểu diễn yêu cầu và tách thời điểm thực thi
  - Decorator để bổ sung hành vi quanh hợp đồng ổn định
  - Ports and Adapters để bảo vệ logic bên trong khỏi công nghệ bên ngoài
  - Đánh giá liên kết được giảm và chi phí mới của từng mẫu thiết kế
  - Nhận diện việc áp dụng mẫu chỉ đổi hình thức mà vẫn giữ giả định ngầm
- level1: Liên kết thời gian
  level2:
  - Nhận diện API bắt buộc gọi các bước theo một thứ tự ngầm
  - Đưa trạng thái hợp lệ vào constructor hoặc kiểu dữ liệu phù hợp
  - Mô hình hóa vòng đời và chuyển trạng thái tường minh
  - Giảm yêu cầu khởi tạo toàn hệ thống theo một trình tự cứng
  - Quản lý đăng ký callback và thời điểm bắt đầu nhận sự kiện
  - Phân biệt phụ thuộc về thứ tự với phụ thuộc vào thời gian thực
  - Tiêm đồng hồ và bộ lập lịch để kiểm soát phụ thuộc thời gian
  - Thiết kế giải phóng tài nguyên gắn với vòng đời sử dụng
  - Đánh giá việc chuyển sang bất đồng bộ có làm hợp đồng phức tạp hơn
  - Kiểm thử các chuỗi gọi không hợp lệ và trạng thái chưa sẵn sàng
- level1: Giao tiếp và sự kiện
  level2:
  - Lựa chọn gọi trực tiếp, lệnh, truy vấn và sự kiện theo nhu cầu
  - Thiết kế sự kiện diễn đạt điều đã xảy ra trong nghiệp vụ
  - Phân biệt sự kiện nghiệp vụ với thông báo chi tiết triển khai
  - Xác định bên phát, bên nhận và chủ sở hữu hợp đồng sự kiện
  - Chọn dữ liệu sự kiện đủ dùng mà không công khai toàn bộ nội bộ
  - Đánh giá yêu cầu truy vấn ngược và liên kết phát sinh sau khi nhận sự kiện
  - Quản lý thứ tự, trùng lặp và khả năng xử lý lại
  - Xử lý lỗi một bên nhận mà không làm mơ hồ kết quả toàn luồng
  - Phân biệt phối hợp tập trung với phối hợp qua các sự kiện
  - Theo dõi luồng xử lý khi mất đường gọi trực tiếp
  - Nhận diện event bus toàn cục che giấu đồ thị phụ thuộc
  - Đánh giá tổng số giả định giữa các bên thay vì chỉ đếm lời gọi
- level1: Hệ thống phân tán
  level2:
  - Phân biệt tách tiến trình với tự chủ về hợp đồng và thay đổi
  - Nhận diện dịch vụ phải luôn sẵn sàng đồng thời
  - Liên kết do chuỗi gọi đồng bộ dài và yêu cầu độ trễ
  - Liên kết dữ liệu khi các dịch vụ cùng truy cập một schema
  - Liên kết phát hành khi thay đổi buộc nhiều dịch vụ triển khai cùng lúc
  - Thiết kế API và thông điệp có khả năng tiến hóa
  - Cách ly mô hình bên ngoài bằng lớp chuyển đổi ngữ nghĩa
  - Quản lý timeout, retry và tính lặp an toàn qua ranh giới mạng
  - Đánh giá nhất quán dữ liệu và giao dịch xuyên dịch vụ
  - Giảm giao tiếp quá vụn bằng thay đổi ranh giới và hợp đồng
  - Nhận diện distributed monolith qua yêu cầu phối hợp thực tế
  - Chọn giao tiếp đồng bộ hoặc bất đồng bộ theo đánh đổi cụ thể
- level1: Cô lập lỗi
  level2:
  - Phân tích lỗi lan truyền qua lời gọi và tài nguyên dùng chung
  - Thiết kế hợp đồng lỗi để bên sử dụng có thể quyết định phù hợp
  - Giới hạn thời gian chờ và cơ chế hủy xử lý
  - Tránh retry ở nhiều tầng gây khuếch đại tải
  - Cách ly thread pool, connection pool và hàng đợi khi có nhu cầu
  - Sử dụng circuit breaker và bulkhead cho phạm vi lỗi phù hợp
  - Thiết kế fallback với giới hạn dữ liệu và hành vi rõ ràng
  - Phân biệt độc lập về thiết kế với cô lập lỗi lúc chạy
  - Quản lý việc giải phóng tài nguyên khi một bước thất bại
  - Kiểm thử thành phần phụ thuộc bị chậm, lỗi hoặc không sẵn sàng
  - Đánh giá phạm vi ảnh hưởng sau mỗi biện pháp cách ly
- level1: Java và Spring
  level2:
  - Biểu diễn hợp đồng bằng interface hoặc kiểu cụ thể có phạm vi phù hợp
  - Giới hạn truy cập bằng package và các mức truy cập Java
  - Tách kiểu dữ liệu công khai khỏi entity và lớp triển khai
  - Tiêm phụ thuộc bằng constructor trong mã Java thuần
  - Sử dụng kiểu hàm cho chiến lược đơn giản khi phù hợp
  - Quản lý exception qua ranh giới mà không lộ công nghệ bên trong
  - Thiết kế composition root và cấu hình bean trong Spring
  - Tránh tra cứu ApplicationContext từ logic nghiệp vụ
  - Nhận diện chu trình bean và điều chỉnh trách nhiệm phía sau
  - Giới hạn phụ thuộc vào annotation và API framework
  - Phân tích sự kiện ứng dụng, transaction và thứ tự thực thi
  - Minh họa thay adapter lưu trữ hoặc nhà cung cấp mà giữ nguyên nghiệp vụ
- level1: Thư viện và phiên bản
  level2:
  - Phân biệt phụ thuộc API công khai với phụ thuộc triển khai
  - Ngăn kiểu của thư viện bên ngoài lan qua nhiều lớp
  - Bọc SDK bên thứ ba tại ranh giới có trách nhiệm rõ ràng
  - Kiểm soát phụ thuộc bắc cầu và xung đột phiên bản
  - Đánh giá thư viện dùng chung gây phối hợp phát hành
  - Phân biệt tương thích mã nguồn, nhị phân và hành vi
  - Lập kế hoạch thay đổi hợp đồng và ngừng hỗ trợ
  - Quản lý cấu hình công cụ build mà không tạo ràng buộc runtime ngoài ý muốn
  - Kiểm chứng nâng cấp thư viện bằng hợp đồng và kịch bản sử dụng
  - Đánh giá xây lớp cách ly so với sử dụng trực tiếp một API ổn định
- level1: Kiểm thử thiết kế
  level2:
  - Đánh giá mức thiết lập cần thiết để kiểm thử một trách nhiệm
  - Kiểm thử hành vi qua hợp đồng công khai
  - Thay phụ thuộc bằng fake hoặc stub có ngữ nghĩa đại diện
  - Phân biệt kiểm chứng hành vi với khóa chặt chuỗi tương tác nội bộ
  - Nhận diện kiểm thử quá nhiều mock như tín hiệu phụ thuộc phân tán
  - Kiểm thử hợp đồng giữa bên cung cấp và bên sử dụng
  - Kiểm thử thay triển khai mà không sửa kiểm thử nghiệp vụ
  - Kiểm thử lỗi, thời gian và dữ liệu không hợp lệ tại ranh giới
  - Kiểm soát phụ thuộc đồng hồ, ngẫu nhiên và môi trường
  - Phát hiện kiểm thử phụ thuộc thứ tự hoặc trạng thái dùng chung
  - Kết hợp kiểm thử đơn vị với tích hợp để tránh cảm giác tách rời giả
  - Đánh giá phạm vi kiểm thử cần chạy khi thay đổi một thành phần
- level1: Bảo vệ ranh giới
  level2:
  - Chuyển quy tắc phụ thuộc thành điều kiện kiểm tra được
  - Kiểm tra import giữa các package và mô-đun
  - Phát hiện chu trình trên đồ thị phụ thuộc
  - Ngăn truy cập lớp và kiểu dữ liệu nội bộ
  - Kiểm tra hướng phụ thuộc giữa nghiệp vụ và hạ tầng
  - Sử dụng ArchUnit để kiểm chứng quy tắc trong Java
  - Kết hợp kiểm tra build với đánh giá hợp đồng hành vi
  - Nhận diện giới hạn của phân tích tĩnh đối với phụ thuộc ẩn
  - Quản lý vi phạm đang tồn tại và ngăn vi phạm mới
  - Rà soát ngoại lệ kiến trúc theo chủ sở hữu và lý do
  - Đưa kiểm tra ranh giới vào review và CI
- level1: Đo lường liên kết
  level2:
  - Đo phụ thuộc đi vào và đi ra theo cấp phân tích
  - Phân tích số kiểu được sử dụng và giới hạn của chỉ số coupling
  - Đo phụ thuộc bắc cầu và khả năng lan truyền thay đổi
  - Quan sát lịch sử các tệp hoặc mô-đun thay đổi cùng nhau
  - Phân biệt cùng thay đổi do nghiệp vụ với cùng thay đổi do ranh giới sai
  - Đánh giá lượng kiến thức bên sử dụng cần biết
  - Đo số nhóm, bước phối hợp và bản phát hành cho một thay đổi
  - Đánh giá khả năng thay thế qua thử nghiệm có kiểm soát
  - Đối chiếu chỉ số với thời gian sửa đổi, kiểm thử và chẩn đoán
  - Nhận diện việc giảm import nhưng tăng phụ thuộc cấu hình hoặc ngữ nghĩa
  - Chọn mục tiêu cải tiến dựa trên rủi ro thay vì tối ưu một con số
- level1: Tái cấu trúc
  level2:
  - Chọn điểm liên kết gây chi phí thay đổi rõ ràng
  - Bổ sung kiểm thử đặc trưng trước khi đổi cấu trúc
  - Tách việc tạo đối tượng khỏi logic sử dụng
  - Thu hẹp giao diện và chia nhóm nhu cầu bên sử dụng
  - Thay đối tượng dữ liệu quá lớn bằng hợp đồng vừa đủ
  - Đưa truy cập chi tiết nội bộ về phía chủ sở hữu
  - Tách phụ thuộc bên ngoài qua adapter
  - Thay kế thừa không phù hợp bằng composition và delegation
  - Loại bỏ trạng thái toàn cục và kiểm soát vòng đời
  - Phá chu trình bằng thay đổi trách nhiệm hoặc điểm phối hợp
  - Chuyển đổi từng bước và giữ hành vi quan sát được
  - Kiểm chứng lợi ích bằng một thay đổi thực tế sau tái cấu trúc
- level1: Sai lầm thường gặp
  level2:
  - Thêm interface cho mọi lớp mà không có mục tiêu cách ly rõ ràng
  - Tạo nhiều lớp chuyển tiếp nhưng không che giấu chi tiết
  - Chuyển mọi lời gọi sang sự kiện và làm mất luồng xử lý rõ ràng
  - Dùng service locator để che giấu phụ thuộc bắt buộc
  - Truyền container, context hoặc đối tượng tổng hợp cho mọi thành phần
  - Dùng kiểu dữ liệu quá chung khiến hợp đồng chỉ còn quy ước ngầm
  - Đưa mọi phần dùng chung vào một thư viện lớn
  - Tách dịch vụ nhưng vẫn dùng chung dữ liệu và lịch phát hành
  - Cho rằng dependency injection tự bảo đảm liên kết lỏng
  - Đánh giá chất lượng chỉ bằng số import, interface hoặc mô-đun
  - Mock toàn bộ phụ thuộc và bỏ qua kiểm thử hợp đồng thực
  - Trừu tượng hóa sớm cho những khả năng thay đổi chưa có căn cứ
- level1: Đánh đổi thiết kế
  level2:
  - Giảm liên kết so với tăng số lớp và độ gián tiếp
  - Cân bằng hợp đồng ổn định với nhu cầu diễn đạt đặc thù
  - Chấp nhận phụ thuộc trực tiếp vào thành phần nhỏ và ổn định khi phù hợp
  - Đánh giá sao chép dữ liệu so với dùng chung tham chiếu
  - Cân nhắc trùng một ít mã để tránh phụ thuộc dùng chung không phù hợp
  - Đánh đổi giữa giao tiếp thô, giao tiếp chi tiết và hiệu năng
  - Đánh đổi giữa tự chủ dữ liệu với nhất quán và giao dịch
  - Đánh giá chi phí quan sát, chẩn đoán và vận hành sau khi tách rời
  - Ưu tiên giảm liên kết tại những điểm thay đổi có rủi ro cao
  - Duy trì khả năng đọc hiểu khi áp dụng nhiều lớp trừu tượng
- level1: Bài thực hành
  level2:
  - Phân tích ứng dụng có logic nghiệp vụ tạo trực tiếp phụ thuộc kỹ thuật
  - Vẽ đồ thị phụ thuộc và chọn một kịch bản thay đổi
  - Thiết kế hợp đồng theo nhu cầu bên sử dụng
  - Tách phụ thuộc bằng constructor và điểm ghép nối rõ ràng
  - Cách ly SDK hoặc cơ sở dữ liệu bằng adapter
  - Thu hẹp dữ liệu truyền qua ranh giới và loại bỏ entity dùng chung
  - Thay trạng thái toàn cục bằng quyền sở hữu tường minh
  - Loại bỏ yêu cầu gọi theo thứ tự ngầm trong một API
  - Thử thay triển khai bằng fake và adapter khác
  - Viết kiểm thử hợp đồng cùng tình huống phụ thuộc thất bại
  - Thêm kiểm tra kiến trúc cho hướng phụ thuộc và truy cập nội bộ
  - So sánh phạm vi thay đổi, độ rõ ràng và chi phí trước sau
  - Ghi lại quyết định thiết kế và phần liên kết vẫn cần giữ
- level1: Tình huống thiết kế
  level2:
  - Đổi nhà cung cấp thanh toán mà giữ ổn định quy tắc đặt hàng
  - Thay cách lưu trữ khi logic nghiệp vụ đang phụ thuộc entity
  - Thêm kênh thông báo mà không sửa nhiều luồng nghiệp vụ
  - Tách nguồn thời gian khỏi quy tắc tính hạn sử dụng
  - Thêm thuật toán tính phí mà không tạo chuỗi điều kiện lan rộng
  - Xử lý hai thành phần gọi lẫn nhau và cùng sở hữu một quy trình
  - Thay đổi schema khi nhiều bên đang dùng chung kiểu dữ liệu
  - Đánh giá gọi trực tiếp hoặc phát sự kiện cho xử lý sau đặt hàng
  - Giảm tác động khi dịch vụ phụ thuộc bị chậm hoặc gián đoạn
  - Tái cấu trúc thư viện dùng chung khiến nhiều nhóm phải phát hành đồng thời
  - Đơn giản hóa thiết kế bị lạm dụng interface và lớp trung gian
- level1: Quy trình áp dụng
  level2:
  - Làm rõ mục tiêu thay đổi, kiểm thử hoặc thay thế cần đạt
  - Khảo sát phụ thuộc công khai, phụ thuộc ẩn và quyền sở hữu
  - Chọn ranh giới phù hợp với tính gắn kết của trách nhiệm
  - Thiết kế hợp đồng nhỏ và mô tả giả định hành vi
  - Lựa chọn kỹ thuật giảm liên kết theo vấn đề đã xác định
  - Triển khai tối thiểu cùng kiểm thử bảo vệ hành vi
  - Thử kịch bản thay đổi và quan sát phạm vi ảnh hưởng
  - Đánh giá chi phí gián tiếp, dữ liệu và vận hành phát sinh
  - Duy trì quy tắc ranh giới và điều chỉnh theo bằng chứng mới
