references:
  - title: "Microsoft Learn — Architectural Principles"
    url: "https://learn.microsoft.com/dotnet/standard/modern-web-apps-azure-architecture/architectural-principles"
    description: "Định nghĩa Separation of Concerns, encapsulation, dependency inversion, SRP và tách business khỏi hạ tầng."
  - title: "Microsoft Learn — Common Web Application Architectures"
    url: "https://learn.microsoft.com/en-us/dotnet/architecture/modern-web-apps-azure/common-web-application-architectures"
    description: "Phân chia presentation, application core và infrastructure theo layer, clean architecture và hướng phụ thuộc."
  - title: "Martin Fowler — Separated Presentation"
    url: "https://martinfowler.com/eaaDev/SeparatedPresentation.html"
    description: "Tách presentation logic khỏi domain, hạn chế phụ thuộc ngược và minh họa refactor bằng Java."
  - title: "Martin Fowler — Service Layer"
    url: "https://martinfowler.com/eaaCatalog/serviceLayer.html"
    description: "Tổ chức ranh giới ứng dụng và điều phối các thao tác nghiệp vụ trong service layer."
  - title: "Spring Framework — Dependency Injection"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html"
    description: "Constructor injection để tách việc sử dụng dependency khỏi khởi tạo, tăng khả năng kiểm thử."
  - title: "Spring Framework — Aspect Oriented Programming"
    url: "https://docs.spring.io/spring-framework/reference/core/aop.html"
    description: "Khái niệm cross-cutting concerns và cách module hóa chúng bằng aspect khi phù hợp."
  - title: "Martin Fowler — Bounded Context"
    url: "https://martinfowler.com/bliki/BoundedContext.html"
    description: "Phân chia mô hình nghiệp vụ thành các bối cảnh có ranh giới rõ ràng ở cấp hệ thống."