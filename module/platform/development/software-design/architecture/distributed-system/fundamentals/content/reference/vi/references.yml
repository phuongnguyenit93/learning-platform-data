references:
  - title: "Columbia University — Distributed Systems Fundamentals Lectures"
    url: "https://systems.cs.columbia.edu/ds1-class/01-lectures/"
    description: "Đề cương chính thức về giao tiếp RPC, failure models, logical clocks, coordination, transactions và consensus."
  - title: "AWS Builders' Library — Timeouts, Retries and Backoff with Jitter"
    url: "https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/"
    description: "Cách thiết kế timeout, retry, exponential backoff và jitter để tránh gây quá tải dây chuyền."
  - title: "AWS Builders' Library — Making Retries Safe with Idempotent APIs"
    url: "https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/"
    description: "Giải thích idempotency và client request identifiers nhằm hạn chế tác dụng phụ của retry."
  - title: "Microsoft Azure — Circuit Breaker Pattern"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/circuit-breaker"
    description: "Cô lập remote dependency lỗi tạm thời, bảo vệ hệ thống và tổ chức quá trình hồi phục."
  - title: "IBM — CAP Theorem"
    url: "https://www.ibm.com/think/topics/cap-theorem"
    description: "Các đánh đổi consistency và availability khi mạng bị partition trong hệ thống phân tán."
  - title: "Microsoft Azure Cosmos DB — Consistency Levels"
    url: "https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels"
    description: "Minh họa strong, bounded staleness, session, consistent prefix và eventual consistency."
  - title: "Microsoft Azure — Sharding Pattern"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/sharding"
    description: "Phân vùng dữ liệu, chọn shard key, nhận diện hotspot và đánh đổi cross-shard query."
  - title: "Microsoft Azure — Competing Consumers Pattern"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/competing-consumers"
    description: "Xử lý message qua nhiều consumer, cân bằng tải, duplicate delivery và idempotency."
  - title: "Microsoft Azure — Asynchronous Request-Reply Pattern"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/asynchronous-request-reply"
    description: "Thiết kế API cho tác vụ dài, tách processing và polling qua endpoint trạng thái."
  - title: "Raft — The Raft Consensus Algorithm"
    url: "https://raft.github.io/"
    description: "Giới thiệu replicated state machines, leader election, log replication và quorum."
  - title: "Google SRE Book — Addressing Cascading Failures"
    url: "https://sre.google/sre-book/addressing-cascading-failures/"
    description: "Quản lý overload, retry storms, cascading failures và graceful degradation."