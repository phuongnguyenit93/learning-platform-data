references:
  - title: "Jeffrey Palermo — The Onion Architecture, Part 1"
    url: "https://jeffreypalermo.com/2008/07/the-onion-architecture-part-1/"
    description: "Bài viết khai sinh Onion Architecture: domain ở lõi, phụ thuộc hướng vào và hạ tầng nằm ngoài."
  - title: "Jeffrey Palermo — The Onion Architecture, Part 2"
    url: "https://jeffreypalermo.com/2008/07/the-onion-architecture-part-2/"
    description: "Ví dụ tổ chức controller, interface và hạ tầng theo các vòng kiến trúc."
  - title: "Microsoft Learn — Common Web Application Architectures"
    url: "https://learn.microsoft.com/en-us/dotnet/architecture/modern-web-apps-azure/common-web-application-architectures"
    description: "Giải thích nhóm kiến trúc Clean/Onion và quan hệ phụ thuộc vào application core."
  - title: "Cosmic Python — Repository Pattern"
    url: "https://www.cosmicpython.com/book/chapter_02_repository"
    description: "Repository abstraction, kiểm soát coupling và tách domain khỏi persistence."
  - title: "Cosmic Python — Service Layer"
    url: "https://www.cosmicpython.com/book/chapter_04_service_layer"
    description: "Application use case, orchestration so với domain service và test bằng fake repository."
  - title: "Cosmic Python — Dependency Injection"
    url: "https://www.cosmicpython.com/book/chapter_13_dependency_injection"
    description: "Lắp ghép port và adapter tại composition root để giữ phần lõi dễ kiểm thử."
  - title: "Spring Framework — Dependency Injection"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html"
    description: "Cách Spring IoC tạo và inject các dependency mà không bắt domain tự khởi tạo hạ tầng."
  - title: "ArchUnit — User Guide"
    url: "https://www.archunit.org/userguide/html/000_Index.html"
    description: "Kiểm tra dependency giữa package, quy tắc layered/onion architecture và dependency cycles trong Java."