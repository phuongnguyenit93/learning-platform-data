  - 'Onion với MVC: kiến trúc ứng dụng và tổ chức giao diện'
  - 'Onion và DDD: mức độ hỗ trợ lẫn nhau'
  - 'Onion với CQRS: tách đường đọc và đường ghi khi cần'
  - Onion trong ứng dụng nguyên khối và modular monolith
  - Onion bên trong một microservice và giới hạn đối với hệ phân tán
  - Lựa chọn phong cách kiến trúc theo ràng buộc bài toán
- level1: Cải tiến mã hiện hữu
  level2:
