menu:
- level1: Tổng quan Onion
  level2:
  - Onion Architecture là gì và giải quyết vấn đề nào
  - Từ kiến trúc lấy cơ sở dữ liệu làm trung tâm đến lấy miền nghiệp vụ làm trung tâm
  - Nguồn gốc, mục tiêu và tư tưởng cốt lõi của Onion Architecture
  - Miền nghiệp vụ, ứng dụng và hạ tầng trong cùng một hệ thống
  - Mô hình các vòng đồng tâm và ý nghĩa của phần lõi
  - Phân biệt chính sách nghiệp vụ với chi tiết kỹ thuật
  - Lợi ích về kiểm thử, bảo trì và thay thế công nghệ
  - Chi phí phân lớp, trừu tượng hóa và ánh xạ dữ liệu
  - Khi nên áp dụng Onion và khi cấu trúc đơn giản đã đủ
  - Thuật ngữ cốt lõi và lộ trình học Onion Architecture
- level1: Các vòng kiến trúc
  level2:
  - Mô hình miền ở trung tâm của Onion
  - Dịch vụ miền và vị trí của logic nghiệp vụ
  - Dịch vụ ứng dụng và vai trò thực hiện ca sử dụng
  - Giao diện người dùng ở vòng ngoài
  - Hạ tầng lưu trữ, mạng và framework ở vòng ngoài
  - Ranh giới logic và ranh giới vật lý của các vòng
  - Biến thể sơ đồ Onion và ý nghĩa thay vì số lớp cố định
  - Quan hệ giữa vòng kiến trúc, package, mô-đun và đơn vị triển khai
  - Nhận diện trách nhiệm của một thành phần trước khi chọn vòng
  - Đọc sơ đồ Onion qua ví dụ xử lý đơn hàng
- level1: Chiều phụ thuộc
  level2:
  - Quy tắc phụ thuộc từ vòng ngoài vào vòng trong
  - Phụ thuộc mã nguồn và luồng gọi lúc chạy khác nhau như thế nào
  - Dependency Inversion và quyền sở hữu trừu tượng
  - Dependency Injection hỗ trợ ghép nối nhưng không tự bảo đảm kiến trúc
  - Interface ở phía sử dụng và implementation ở vòng ngoài
  - Luồng gọi từ ứng dụng ra hạ tầng qua trừu tượng
  - Phụ thuộc vào kiểu dữ liệu cũng là phụ thuộc kiến trúc
  - Ngăn kiểu của framework và thư viện hạ tầng đi vào lõi
  - Phụ thuộc bắc cầu và thư viện dùng chung làm rò rỉ chi tiết
  - Phát hiện vòng phụ thuộc giữa các lớp và mô-đun
  - Phân biệt đảo ngược phụ thuộc với tạo interface cho mọi lớp
  - Theo dõi chiều phụ thuộc trên toàn bộ luồng yêu cầu
- level1: Nền tảng thiết kế
  level2:
  - Tính kết dính, liên kết và trách nhiệm của thành phần
  - Single Responsibility và lý do thay đổi ở từng vòng
  - Open–Closed và điểm mở rộng theo nhu cầu thực tế
  - Interface Segregation trong hợp đồng phục vụ ca sử dụng
  - Đóng gói trạng thái và bảo vệ bất biến nghiệp vụ
  - Composition và inheritance trong mô hình miền
  - Lập trình hướng đối tượng và mô hình miền giàu hành vi
  - Lập trình hàm và lõi xử lý thuần trong kiến trúc Onion
  - DDD hỗ trợ Onion nhưng không phải điều kiện bắt buộc
  - Chọn mức trừu tượng dựa trên độ phức tạp của bài toán
- level1: Mô hình miền
  level2:
  - Tìm khái niệm miền từ yêu cầu và ngôn ngữ nghiệp vụ
  - Entity và danh tính xuyên suốt vòng đời
  - Value Object và tính bằng nhau theo giá trị
  - Aggregate và ranh giới bảo vệ nhất quán
  - Aggregate Root và quyền truy cập trạng thái bên trong
  - Bất biến nghiệp vụ và thời điểm kiểm tra
  - Phương thức nghiệp vụ thay cho thay đổi dữ liệu tùy ý
  - Hàm tạo, factory và bảo đảm trạng thái khởi tạo hợp lệ
  - Biểu diễn tiền tệ, số lượng và định danh bằng kiểu miền
  - Trạng thái nghiệp vụ và các chuyển trạng thái hợp lệ
  - Đối tượng bất biến và cập nhật có kiểm soát
  - Phân biệt Entity miền với Entity lưu trữ
  - Ranh giới miền và ngữ cảnh giới hạn trong hệ thống lớn
- level1: Dịch vụ miền
  level2:
  - Khi một quy tắc không thuộc tự nhiên về Entity hay Value Object
  - Dịch vụ miền và sự khác biệt với dịch vụ ứng dụng
  - Đầu vào và đầu ra bằng ngôn ngữ của miền
  - Tách tính toán nghiệp vụ khỏi truy xuất dữ liệu
  - Quy tắc cần dữ liệu ngoài và trừu tượng do miền sở hữu
  - Policy, Specification và cách diễn đạt điều kiện nghiệp vụ
  - Quy tắc phối hợp nhiều đối tượng trong cùng ranh giới
  - Đặt factory ở miền khi việc tạo đối tượng có quy tắc
  - Tránh dịch vụ miền toàn năng và mô hình miền chỉ chứa dữ liệu
  - Kiểm thử quy tắc miền mà không khởi động hạ tầng
- level1: Dịch vụ ứng dụng
  level2:
  - Ca sử dụng là gì và cách xác định ranh giới
  - Dịch vụ ứng dụng điều phối mô hình miền như thế nào
  - Trình tự tải dữ liệu, thực hiện nghiệp vụ và lưu kết quả
  - Lệnh, truy vấn và hợp đồng của ca sử dụng
  - Phân biệt xác thực dữ liệu đầu vào với kiểm tra quy tắc miền
  - Truyền danh tính người thực hiện và ngữ cảnh cần thiết
  - Kiểm tra quyền thực hiện ca sử dụng
  - Ranh giới giao dịch ở cấp ca sử dụng
  - Trả kết quả ứng dụng mà không làm lộ đối tượng hạ tầng
  - Xử lý ca sử dụng cần nhiều dịch vụ bên ngoài
  - Tách điều phối khỏi logic nghiệp vụ thay vì dịch chuyển mọi logic vào service
  - Chọn lớp riêng cho từng ca sử dụng hay nhóm ca sử dụng liên quan
- level1: Hợp đồng biên
  level2:
  - Vai trò của interface tại ranh giới vòng trong và vòng ngoài
  - Đặt trừu tượng ở miền hay ứng dụng theo trách nhiệm
  - Hợp đồng đầu vào của ca sử dụng và bên gọi
  - Hợp đồng đầu ra cho lưu trữ và hệ thống bên ngoài
  - Thiết kế chữ ký bằng kiểu thuộc vòng sở hữu
  - Định nghĩa ngữ nghĩa, lỗi và cam kết của hợp đồng
  - Trừu tượng thời gian, mã định danh và nguồn ngẫu nhiên
  - Hợp đồng cho gửi thư, thanh toán và lưu tệp
  - Đồng bộ và bất đồng bộ trong hợp đồng biên
  - Thay implementation mà vẫn giữ nguyên ý nghĩa nghiệp vụ
  - Giữ hợp đồng nhỏ và tránh trừu tượng dùng chung quá mức
- level1: Repository
  level2:
  - Repository trong mô hình miền và khác biệt với DAO
  - Đặt interface Repository theo nhu cầu của miền hoặc ca sử dụng
  - Thiết kế Repository theo Aggregate thay vì theo từng bảng
  - Truy vấn và lưu Aggregate với ngữ nghĩa rõ ràng
  - Trạng thái không tồn tại và cách biểu diễn kết quả tìm kiếm
  - Phân biệt truy vấn nghiệp vụ với truy vấn phục vụ báo cáo
  - Phân trang và sắp xếp mà không rò rỉ kiểu của Spring Data
  - Định nghĩa điều kiện truy vấn và giới hạn của Repository tổng quát
  - Lưu Aggregate mới, cập nhật và kiểm soát phiên bản
  - Không làm lộ EntityManager, Session hay truy vấn đặc thù ra lõi
  - Repository trong bộ nhớ và giới hạn khi dùng cho kiểm thử
  - Khi không cần Repository hoặc không cần interface bổ sung
- level1: Hạ tầng lưu trữ
  level2:
  - Triển khai Repository ở vòng hạ tầng
  - Mô hình lưu trữ riêng và ánh xạ sang mô hình miền
  - 'Dùng chung mô hình miền với mô hình ORM: lợi ích và đánh đổi'
  - JPA annotation trong miền và mức độ độc lập thực tế
  - Ánh xạ Entity, Value Object và Aggregate với ORM
  - Khôi phục đối tượng miền mà vẫn tôn trọng bất biến
  - Lazy loading, proxy và ranh giới phiên làm việc
  - N+1 query và tác động của mô hình tải dữ liệu
  - Quan hệ cơ sở dữ liệu không đồng nhất với quan hệ Aggregate
  - Ràng buộc dữ liệu và quy tắc nghiệp vụ bổ trợ nhau
  - Thay đổi lược đồ và khả năng tương thích với mô hình miền
  - Tách chi tiết SQL, NoSQL và bộ nhớ đệm khỏi hợp đồng lõi
- level1: Giao dịch và nhất quán
  level2:
  - Ranh giới Aggregate và ranh giới giao dịch
  - Giao dịch cục bộ bao quanh một ca sử dụng
  - Vị trí thực thi transaction khi lõi cần độc lập framework
  - Optimistic locking và phát hiện cập nhật đồng thời
  - Pessimistic locking và các tình huống cần khóa
  - Phân biệt lỗi xung đột dữ liệu với lỗi nghiệp vụ
  - Thử lại giao dịch và nguy cơ lặp tác dụng phụ
  - Tính lũy đẳng của ca sử dụng và khóa chống xử lý trùng
  - Tác dụng phụ trước, trong và sau khi commit
  - Transactional Outbox khi cần phối hợp dữ liệu và thông điệp
  - Khi nào cần nhất quán cuối cùng giữa các ranh giới
  - Giữ phối hợp phân tán bên ngoài bất biến của một Aggregate
- level1: Giao diện ứng dụng
  level2:
  - HTTP controller là bộ chuyển đổi đầu vào
  - Phân tích request, gọi ca sử dụng và dựng response
  - Phân biệt DTO giao tiếp với dữ liệu đầu vào ứng dụng
  - Kiểm tra hình dạng dữ liệu tại biên HTTP
  - Ánh xạ kết quả và lỗi ứng dụng sang HTTP
  - Giao diện dòng lệnh, tác vụ định kỳ và xử lý theo lô
  - Bên tiêu thụ thông điệp như một điểm vào ứng dụng
  - Nhiều giao diện dùng chung một ca sử dụng
  - Không đặt nghiệp vụ trong controller, listener hoặc scheduler
  - Ngăn đối tượng miền thoát qua JSON và tuần tự hóa ngầm
  - Giữ ranh giới ứng dụng ổn định khi thay giao thức
- level1: Ánh xạ dữ liệu
  level2:
  - Phân biệt API DTO, mô hình ứng dụng, mô hình miền và mô hình lưu trữ
  - Chọn ranh giới cần ánh xạ thay vì nhân bản mọi mô hình
  - Chiều phụ thuộc của mapper và nơi đặt mã ánh xạ
  - Ánh xạ thủ công và dùng công cụ sinh mã
  - Giữ ý nghĩa Value Object qua các ranh giới
  - Trường thiếu, giá trị null và ngữ nghĩa cập nhật từng phần
  - Ánh xạ thời gian, tiền tệ và đơn vị đo
  - Tránh mapper làm thay trách nhiệm kiểm tra của miền
  - Vòng tham chiếu và chi phí ánh xạ đồ thị đối tượng
  - Kiểm thử ánh xạ và phát hiện mất dữ liệu
- level1: Tích hợp bên ngoài
  level2:
  - Xem dịch vụ ngoài là chi tiết hạ tầng của ca sử dụng
  - Thiết kế hợp đồng theo nhu cầu nội bộ thay vì SDK nhà cung cấp
  - Bộ chuyển đổi cho HTTP client và thư viện bên thứ ba
  - Lớp chống xâm lấn bảo vệ ngôn ngữ miền
  - Ánh xạ dữ liệu và lỗi từ hệ thống ngoài
  - Timeout, retry và Circuit Breaker trong bộ chuyển đổi
  - Phân định quyết định thử lại giữa ứng dụng và hạ tầng
  - Tách gửi thư, lưu tệp và thanh toán khỏi xử lý miền
  - Kiểm soát tác dụng phụ khi hệ thống ngoài trả kết quả chưa xác định
  - Giả lập hệ thống ngoài và kiểm thử hợp đồng của bộ chuyển đổi
- level1: Sự kiện
  level2:
  - Sự kiện miền và ý nghĩa của điều đã xảy ra
  - Đối tượng miền ghi nhận sự kiện như thế nào
  - Thu thập và xử lý sự kiện trong phạm vi ứng dụng
  - Phân biệt sự kiện miền với sự kiện tích hợp
  - Chuyển sự kiện miền thành hợp đồng công khai
  - Phát sự kiện trước hoặc sau commit và ảnh hưởng nhất quán
  - Lưu Outbox trong cùng giao dịch với dữ liệu nghiệp vụ
  - Triển khai publisher và subscriber ở vòng ngoài
  - Thông điệp trùng lặp và tính lũy đẳng của bên nhận
  - Tránh phụ thuộc trực tiếp từ miền vào broker hoặc event bus
  - Khi lời gọi trực tiếp rõ ràng hơn cơ chế sự kiện
- level1: Lỗi và kết quả
  level2:
  - Phân loại lỗi miền, lỗi ứng dụng và lỗi hạ tầng
  - Exception nghiệp vụ và kiểu kết quả tường minh
  - Biểu diễn không tìm thấy, xung đột và từ chối nghiệp vụ
  - Chuyển lỗi hạ tầng sang ngữ nghĩa hợp đồng biên
  - Lựa chọn truyền nguyên nhân kỹ thuật và bảo vệ chi tiết nội bộ
  - Không nuốt lỗi hoặc trả giá trị mặc định sai nghĩa
  - Chuyển lỗi ứng dụng thành phản hồi cho từng giao diện
  - Định danh lỗi, bản địa hóa thông báo và ngôn ngữ nghiệp vụ
  - Ghi log lỗi đúng ranh giới và tránh ghi lặp
  - Kiểm thử đường lỗi, rollback và trạng thái sau thất bại
- level1: Ghép nối thành phần
  level2:
  - Composition Root và nơi quyết định implementation cụ thể
  - Khởi tạo thủ công bằng constructor injection
  - Tách cấu hình ghép nối khỏi lớp nghiệp vụ
  - Quản lý vòng đời và phạm vi sống của thành phần
  - Cấu hình theo môi trường và lựa chọn bộ chuyển đổi
  - Decorator cho giao dịch, đo lường và chính sách kỹ thuật
  - Phân biệt Proxy của framework với đối tượng nghiệp vụ
  - Tránh Service Locator và truy cập container từ lõi
  - Phát hiện cấu hình thiếu, xung đột và phụ thuộc vòng
  - Kiểm thử ghép nối toàn bộ ứng dụng
- level1: Tổ chức mã Java
  level2:
  - Tổ chức package theo vòng và theo tính năng
  - Kết hợp mô-đun nghiệp vụ với các vòng bên trong
  - Ranh giới public, package-private và khả năng truy cập
  - Tách domain, application, infrastructure và bootstrap
  - Mô-đun Maven hoặc Gradle và chiều phụ thuộc biên dịch
  - JPMS khi cần tăng cường đóng gói ở cấp mô-đun Java
  - Giữ thư viện Spring, ORM và client SDK ở mô-đun phù hợp
  - Đặt tên lớp theo trách nhiệm thay vì hậu tố máy móc
  - Java record cho dữ liệu biên và Value Object phù hợp
  - Generic, Optional và Stream qua hợp đồng kiến trúc
  - Chia sẻ mã chung mà không tạo mô-đun common toàn năng
  - Ánh xạ cấu trúc package với sơ đồ phụ thuộc
- level1: Spring Boot
  level2:
  - Spring Boot ở vòng ngoài và vai trò khởi động ứng dụng
  - Bean configuration cho đối tượng miền và dịch vụ ứng dụng
  - Constructor injection và giới hạn của component scanning
  - Lõi Java thuần và biến thể dùng annotation Spring
  - '@Transactional trong ứng dụng và đánh đổi phụ thuộc framework'
  - TransactionTemplate hoặc decorator cho giao dịch ngoài lõi
  - Proxy, self-invocation và giới hạn cơ chế giao dịch Spring
  - Controller Spring MVC gọi ca sử dụng qua hợp đồng
  - Spring Data JPA Repository bọc bởi bộ chuyển đổi hạ tầng
  - Bean Validation tại biên và bất biến trong mô hình miền
  - Exception handler và ánh xạ lỗi HTTP tập trung
  - Configuration properties cho bộ chuyển đổi và dịch vụ ngoài
  - Sự kiện Spring và phạm vi bảo đảm xử lý thực tế
  - Kiểm tra ứng dụng vẫn khởi động và ghép nối đúng
- level1: Bảo mật và kỹ thuật chung
  level2:
  - Xác thực ở giao diện và truyền danh tính vào ca sử dụng
  - Phân quyền ứng dụng và điều kiện truy cập theo nghiệp vụ
  - Tránh SecurityContext và Principal của framework trong miền
  - Ngữ cảnh người dùng, tenant và yêu cầu quyền sở hữu dữ liệu
  - Validation tại biên và phòng ngừa dữ liệu không đáng tin cậy
  - Quản lý bí mật và cấu hình kết nối ở vòng hạ tầng
  - Log, số đo và truy vết qua decorator hoặc interceptor
  - Kiểm toán nghiệp vụ và phân biệt với log kỹ thuật
