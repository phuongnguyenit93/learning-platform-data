  - Kiểm soát số lần gọi Repository và hệ thống bên ngoài
  - Tải dữ liệu theo lô và tránh N+1 qua bộ chuyển đổi
  - Bộ nhớ đệm, tính nhất quán và trách nhiệm làm mất hiệu lực
  - Chi phí ánh xạ, cấp phát đối tượng và tuần tự hóa
  - Đo hiệu năng trước khi nới lỏng ranh giới
  - Ghi nhận ngoại lệ tối ưu hóa và kiểm chứng ảnh hưởng
- level1: So sánh kiến trúc
  level2:
