  - Dùng kiểm tra build để bảo vệ chiều phụ thuộc mô-đun
  - Kiểm tra quyền sở hữu interface và kiểu dữ liệu hợp đồng
  - Quản lý ngoại lệ kiến trúc có lý do và thời hạn
  - Đưa kiểm tra kiến trúc vào CI và đánh giá khi refactor
