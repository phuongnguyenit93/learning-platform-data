  - Kiểm thử ánh xạ ORM và giới hạn của cơ sở dữ liệu trong bộ nhớ
  - Kiểm thử bộ chuyển đổi HTTP và hệ thống bên ngoài
  - Kiểm thử controller và ánh xạ lỗi tại biên
