  - Đánh giá lợi ích và chi phí sau mỗi lần refactor
  - Ngừng refactor khi mức phân tách đã đáp ứng nhu cầu
- level1: Sai lầm thiết kế
  level2:
  - Vẽ các vòng nhưng vẫn để lõi import hạ tầng
