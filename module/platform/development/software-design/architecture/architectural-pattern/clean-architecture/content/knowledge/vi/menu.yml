menu:
  - level1: "Tổng quan"
    level2:
      - "Mục tiêu của Clean Architecture và những vấn đề về khả năng thay đổi mà nó giải quyết"
      - "Chính sách nghiệp vụ và chi tiết kỹ thuật trong một hệ thống phần mềm"
      - "Mô hình các vòng tròn và ý nghĩa của khoảng cách tới lõi nghiệp vụ"
      - "Bốn nhóm trách nhiệm: Entity, Use Case, Interface Adapter và Framework"
      - "Độc lập với giao diện người dùng, cơ sở dữ liệu, framework và dịch vụ bên ngoài"
      - "Khả năng kiểm thử nghiệp vụ mà không khởi động hạ tầng"
      - "Tình huống phù hợp, chi phí ban đầu và giới hạn của Clean Architecture"
      - "Hiểu kiến trúc qua luồng xử lý một yêu cầu đặt hàng xuyên các ranh giới"
  - level1: "Nguyên lý nền tảng"
    level2:
      - "Separation of Concerns và phân chia trách nhiệm theo lý do thay đổi"
      - "Đóng gói các quy tắc ổn định và cô lập những chi tiết dễ biến động"
      - "Cohesion, coupling và tác động của chúng tới ranh giới module"
      - "Dependency Inversion Principle trong quan hệ giữa chính sách và cơ chế"
      - "Phân biệt Dependency Inversion, Dependency Injection và IoC Container"
      - "Single Responsibility và Interface Segregation khi thiết kế boundary"
      - "Nguyên tắc kiến trúc thể hiện ý định nghiệp vụ qua tên và cấu trúc mã"
      - "Tránh trừu tượng hóa suy đoán và chỉ tạo ranh giới có giá trị thực tế"
  - level1: "Dependency Rule"
    level2:
      - "Quy tắc phụ thuộc mã nguồn luôn hướng về các chính sách phía trong"
      - "Phân biệt hướng gọi lúc chạy với hướng phụ thuộc tại thời điểm biên dịch"
      - "Các dạng phụ thuộc qua import, kiểu dữ liệu, kế thừa, annotation và cấu hình"
      - "Đảo chiều lời gọi ra ngoài bằng interface do phía chính sách sở hữu"
      - "Cho adapter triển khai port mà không để use case biết lớp triển khai"
      - "Nhận diện phụ thuộc bắc cầu và chu trình giữa package hoặc module"
      - "Giữ kiểu dữ liệu của framework và cơ sở dữ liệu ngoài hợp đồng của lõi"
      - "Đọc và kiểm tra sơ đồ phụ thuộc với ví dụ đúng và sai Dependency Rule"
  - level1: "Chính sách và tầng"
    level2:
      - "Phân biệt quy tắc nghiệp vụ cấp doanh nghiệp với quy tắc riêng của ứng dụng"
      - "Trách nhiệm và mức độ ổn định của tầng domain"
      - "Trách nhiệm điều phối và thực hiện mục tiêu người dùng của tầng application"
      - "Trách nhiệm chuyển đổi dữ liệu và giao thức của tầng interface adapter"
      - "Trách nhiệm cung cấp cơ chế kỹ thuật của tầng infrastructure"
      - "Phân biệt tầng logic, module mã nguồn và đơn vị triển khai"
      - "Điều chỉnh số tầng theo nhu cầu thay vì sao chép cứng bốn thư mục"
      - "Lập bảng sở hữu trách nhiệm để tránh logic bị đặt sai tầng"
  - level1: "Ranh giới kiến trúc"
    level2:
      - "Xác định ranh giới theo chính sách, quyền sở hữu và lý do thay đổi"
      - "Thiết kế port theo nhu cầu nghiệp vụ của bên sử dụng"
      - "Chọn interface, lời gọi hàm hoặc message phù hợp cho từng ranh giới"
      - "Giữ hợp đồng nhỏ, có ý nghĩa và không phản chiếu toàn bộ API của nhà cung cấp"
      - "Định nghĩa điều kiện đầu vào, kết quả, lỗi và bảo đảm của một boundary"
      - "Kiểm soát dữ liệu đi qua biên để tránh chia sẻ chi tiết triển khai"
      - "Phân biệt ranh giới kiến trúc trong tiến trình với ranh giới mạng và triển khai"
      - "Cân bằng mức cô lập, số lớp trung gian và chi phí chuyển đổi dữ liệu"
  - level1: "Phân tích nghiệp vụ"
    level2:
      - "Thu thập mục tiêu người dùng, tác nhân và kịch bản nghiệp vụ chủ đạo"
      - "Xây dựng ngôn ngữ thống nhất cho khái niệm và hành động của miền"
      - "Tách yêu cầu nghiệp vụ khỏi lựa chọn giao diện, lưu trữ và framework"
      - "Tìm quy tắc bất biến, trạng thái hợp lệ và các chuyển đổi được phép"
      - "Phân loại quy tắc thuộc entity, domain service hoặc use case"
      - "Xác định dữ liệu cần đọc, dữ liệu cần ghi và hệ thống cần tương tác"
      - "Xác định ranh giới nhất quán và những thất bại có thể xảy ra"
      - "Chuyển kịch bản nghiệp vụ thành danh sách use case và tiêu chí chấp nhận"
  - level1: "Entity"
    level2:
      - "Vai trò của entity trong việc bảo vệ quy tắc nghiệp vụ cốt lõi"
      - "Danh tính, vòng đời và sự khác biệt giữa entity miền với entity ORM"
      - "Thiết kế hành vi nghiệp vụ thay cho tập hợp getter và setter công khai"
      - "Bảo vệ invariant khi khởi tạo và khi thay đổi trạng thái"
      - "Mô hình hóa trạng thái và chuyển trạng thái bằng hành vi có tên rõ ràng"
      - "Kết hợp entity thành aggregate khi cần bảo vệ tính nhất quán"
      - "Kiểm soát quan hệ, collection và tính khả biến để tránh sửa trạng thái ngoài ý muốn"
      - "Giữ entity độc lập với HTTP, cơ sở dữ liệu và vòng đời của framework"
  - level1: "Value Object"
    level2:
      - "Phân biệt Value Object với entity dựa trên giá trị và danh tính"
      - "Mô hình hóa tiền tệ, địa chỉ, mã định danh và khoảng thời gian"
      - "Kiểm tra tính hợp lệ tại thời điểm tạo để tránh trạng thái không hợp lệ"
      - "Thiết kế tính bất biến, equality và hashCode nhất quán"
      - "Đóng gói phép toán nghiệp vụ thay vì truyền kiểu nguyên thủy khắp hệ thống"
      - "Sử dụng record trong Java và những giới hạn về tính bất biến sâu"
      - "Chuyển đổi Value Object tại biên API và lưu trữ mà không làm lộ chi tiết miền"
      - "Lựa chọn mức độ sử dụng Value Object theo độ phức tạp thực tế của nghiệp vụ"
  - level1: "Dịch vụ miền"
    level2:
      - "Nhận diện quy tắc nghiệp vụ không thuộc tự nhiên về một entity"
      - "Phân biệt domain service với application service và dịch vụ hạ tầng"
      - "Thiết kế policy và specification cho quy tắc tính giá, hạn mức và điều kiện"
      - "Ưu tiên hàm tính toán thuần khi quy tắc chỉ phụ thuộc dữ liệu đầu vào"
      - "Biểu diễn chiến lược nghiệp vụ có nhiều biến thể bằng hợp đồng phù hợp"
      - "Cung cấp thời gian, định danh và dữ liệu bên ngoài qua abstraction khi cần"
      - "Tránh domain service khổng lồ và tránh đẩy mọi hành vi ra khỏi entity"
      - "Kiểm soát phụ thuộc giữa quy tắc miền và các module nghiệp vụ liên quan"
  - level1: "Use case"
    level2:
      - "Đặt tên use case theo mục tiêu nghiệp vụ và kết quả mà tác nhân cần đạt"
      - "Thiết kế input, output, tiền điều kiện, hậu điều kiện và luồng thay thế"
      - "Điều phối tải dữ liệu, gọi hành vi miền và lưu kết quả"
      - "Tách orchestration của ứng dụng khỏi phép tính và invariant của domain"
      - "Xác định kích thước use case và chia nhỏ theo trách nhiệm có ý nghĩa"
      - "Biểu diễn lệnh và truy vấn; áp dụng CQRS khi lợi ích đủ rõ"
      - "Quản lý thất bại từng bước và tránh tạo hiệu ứng phụ trước khi kiểm tra điều kiện"
      - "Thiết kế use case có thể được gọi từ HTTP, CLI, tác vụ nền hoặc kiểm thử"
  - level1: "Input và Output Port"
    level2:
      - "Input port như hợp đồng thực thi một khả năng của ứng dụng"
      - "Output port cho lưu trữ, thanh toán, thông báo và các nhu cầu ra ngoài"
      - "Quyền sở hữu interface và vị trí đặt port theo chính sách sử dụng"
      - "Thiết kế tham số và kết quả theo ý nghĩa nghiệp vụ thay vì API hạ tầng"
      - "Phân biệt output port gọi dịch vụ ngoài với output boundary dành cho presenter"
      - "Lựa chọn trả kết quả trực tiếp hoặc gọi output boundary theo nhu cầu"
      - "Mô tả lỗi và bảo đảm của port để adapter có thể được thay thế an toàn"
      - "Tránh interface sao chép máy móc từng lớp và port chung phục vụ mọi use case"
  - level1: "DTO và dữ liệu biên"
    level2:
      - "Phân biệt request DTO, use case input, output model và domain model"
      - "Chỉ truyền dữ liệu cần thiết qua biên và tránh cấu trúc phụ thuộc tầng ngoài"
      - "Lựa chọn kiểu nguyên thủy, record và cấu trúc dữ liệu đơn giản cho hợp đồng"
      - "Không để HTTP request, ORM proxy hoặc SDK response đi vào lõi nghiệp vụ"
      - "Xác định vị trí ánh xạ giữa DTO, Value Object, entity và view model"
      - "Xử lý giá trị thiếu, giá trị mặc định, enum và dữ liệu không tương thích"
      - "Ngăn rò rỉ thông tin nhạy cảm và tránh cho khách hàng sửa trường nội bộ"
      - "Tiến hóa hợp đồng dữ liệu và đánh giá chi phí của việc sao chép model"
  - level1: "Interface Adapter"
    level2:
      - "Vai trò chuyển đổi giữa thế giới bên ngoài và hợp đồng của ứng dụng"
      - "Phân biệt inbound adapter với outbound adapter theo hướng tương tác"
      - "Phân chia controller, presenter, persistence adapter và integration adapter"
      - "Giữ chuyển đổi giao thức và định dạng dữ liệu ngoài logic nghiệp vụ"
      - "Thiết kế adapter có thể thay thế mà vẫn giữ nguyên hợp đồng port"
      - "Đặt mapper và translator tại phía biết các model cần chuyển đổi"
      - "Phân biệt adapter thực thi hợp đồng với facade che giấu hệ thống con"
      - "Nhận diện adapter chứa quá nhiều nghiệp vụ hoặc phụ thuộc ngược vào nhau"
  - level1: "Controller"
    level2:
      - "Tiếp nhận yêu cầu và chuyển dữ liệu giao thức thành input của use case"
      - "Tách binding, parsing và kiểm tra định dạng khỏi quyết định nghiệp vụ"
      - "Đưa danh tính tác nhân và ngữ cảnh cần thiết vào hợp đồng ứng dụng"
      - "Gọi input port qua constructor injection thay vì tạo trực tiếp dependency"
      - "Chuyển kết quả và lỗi ứng dụng sang mã trạng thái hoặc phản hồi giao thức"
      - "Giữ controller mỏng nhưng vẫn sở hữu trách nhiệm của tầng giao tiếp"
      - "Tái sử dụng cùng use case qua REST controller, CLI và message consumer"
      - "Kiểm thử controller độc lập bằng hợp đồng input và output quan sát được"
  - level1: "Presenter"
    level2:
      - "Vai trò của presenter trong việc biến kết quả ứng dụng thành dữ liệu hiển thị"
      - "Phân biệt output model với view model và response DTO"
      - "Triển khai output boundary mà không để use case phụ thuộc giao diện"
      - "Định dạng thời gian, tiền tệ, nhãn và thông báo theo ngữ cảnh hiển thị"
      - "Biểu diễn thành công, lỗi và kết quả rỗng nhất quán cho người sử dụng"
      - "Lựa chọn presenter riêng hoặc ánh xạ trực tiếp cho API đơn giản"
      - "Tránh lưu trạng thái phản hồi dùng chung gây rò rỉ dữ liệu giữa các yêu cầu"
      - "Kiểm thử ánh xạ trình bày và thay đổi giao diện mà không sửa use case"
  - level1: "Repository và Gateway"
    level2:
      - "Repository như abstraction truy cập đối tượng miền và gateway như cổng tương tác"
      - "Định nghĩa hợp đồng theo nhu cầu use case hoặc domain thay vì theo bảng dữ liệu"
      - "Đặt interface tại phía sử dụng và implementation tại adapter hạ tầng"
      - "Chọn ranh giới repository theo aggregate và yêu cầu nhất quán"
      - "Thiết kế truy vấn, phân trang và sắp xếp bằng kiểu dữ liệu độc lập framework"
      - "Phân biệt nhu cầu đọc projection với nhu cầu tải mô hình miền để thay đổi"
      - "Biểu diễn không tìm thấy, xung đột và lỗi truy cập mà không lộ exception của driver"
      - "Tránh generic repository quá rộng và tránh sao chép toàn bộ API của ORM"
  - level1: "Ánh xạ lưu trữ"
    level2:
      - "Tách domain entity, persistence model và schema dữ liệu theo nhu cầu cô lập"
      - "Ánh xạ danh tính, Value Object, quan hệ và trạng thái vòng đời"
      - "Khôi phục entity từ dữ liệu lưu trữ mà vẫn bảo vệ tính hợp lệ của miền"
      - "Xử lý lazy loading và tránh phụ thuộc vào phiên ORM trong domain hoặc presenter"
      - "Kiểm soát cascade, dirty checking và thời điểm phát sinh thao tác ghi"
      - "Thiết kế projection và truy vấn để hạn chế N+1 mà không làm lộ ORM vào use case"
      - "Quản lý thay đổi schema và tính tương thích của adapter lưu trữ"
      - "Đánh giá đánh đổi giữa model lưu trữ riêng và tái sử dụng model có annotation"
  - level1: "Giao dịch"
    level2:
      - "Xác định ranh giới giao dịch từ một mục tiêu nghiệp vụ và invariant cần bảo vệ"
      - "Phân biệt quyết định về tính nguyên tử với cơ chế transaction của framework"
      - "Triển khai unit of work hoặc transaction port khi ứng dụng cần điều khiển giao dịch"
      - "Dùng decorator hoặc cấu hình ngoài để bao use case bằng transaction"
      - "Giữ cùng ngữ cảnh giao dịch cho các adapter tham gia một đơn vị công việc"
      - "Xử lý cạnh tranh bằng optimistic locking, version và kiểm tra xung đột"
      - "Thiết kế rollback và tránh coi tác động lên dịch vụ ngoài là có thể rollback cục bộ"
      - "Kiểm thử tình huống ghi thất bại, cập nhật đồng thời và vi phạm tính nhất quán"
  - level1: "Framework và hạ tầng"
    level2:
      - "Xem framework, driver, ORM và SDK như cơ chế hỗ trợ ứng dụng"
      - "Giữ annotation và base class của framework ngoài lõi khi mục tiêu là cô lập chặt"
      - "Đóng gói client HTTP, truy cập tệp, hàng đợi và kết nối dữ liệu trong adapter"
      - "Tách cấu hình môi trường, thông tin xác thực và connection pool khỏi nghiệp vụ"
      - "Bọc thư viện bên thứ ba theo khả năng cần dùng thay vì toàn bộ bề mặt API"
      - "Quản lý tài nguyên và vòng đời kết nối tại tầng chịu trách nhiệm kỹ thuật"
      - "Chọn mức cô lập phù hợp khi dùng Spring Boot, JPA hoặc framework tương tự"
      - "Đánh giá tác động khi nâng cấp framework và thay đổi nhà cung cấp hạ tầng"
  - level1: "Composition Root"
    level2:
      - "Composition root như nơi ghép nối các implementation thành ứng dụng chạy được"
      - "Vị trí của bootstrap module và quyền phụ thuộc vào các thành phần phía ngoài"
      - "Lắp ghép thủ công bằng constructor để làm rõ đồ thị đối tượng"
      - "Cấu hình Dependency Injection Container mà không đưa container vào use case"
      - "Bind port với adapter và giải quyết nhiều implementation bằng cấu hình rõ ràng"
      - "Quản lý scope, thread safety và vòng đời của các dependency"
      - "Chọn adapter theo môi trường và thay bằng fake trong kiểm thử"
      - "Tránh service locator, global state và việc tạo dependency rải rác trong lõi"
  - level1: "Tổ chức mã Java"
    level2:
      - "Tổ chức package theo tính năng nghiệp vụ kết hợp ranh giới trách nhiệm"
      - "Thiết kế module domain, application, adapter và bootstrap theo quy mô hệ thống"
      - "Khai báo quan hệ phụ thuộc một chiều trong cấu hình build nhiều module"
      - "Dùng visibility và API công khai tối thiểu để bảo vệ chi tiết nội bộ"
      - "Đặt tên interface, interactor, DTO, mapper và adapter nhất quán"
      - "Tách thư viện dùng chung và tránh biến shared module thành nơi chứa mọi thứ"
      - "Quản lý dependency Java, annotation processor và mã sinh để tránh rò rỉ vào lõi"
      - "Tổ chức mã kiểm thử tương ứng với use case, adapter và ranh giới module"
  - level1: "API và giao diện"
    level2:
      - "Thiết kế API từ nhu cầu khách hàng và ánh xạ vào khả năng của ứng dụng"
      - "Phân biệt endpoint theo tài nguyên với use case theo mục tiêu nghiệp vụ"
      - "Giữ mã HTTP, header, cookie và session trong adapter giao tiếp"
      - "Thiết kế phân trang, lọc và sắp xếp không làm lộ kiểu dữ liệu framework"
