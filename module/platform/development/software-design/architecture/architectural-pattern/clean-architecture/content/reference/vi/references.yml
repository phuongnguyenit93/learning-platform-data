references:
  - title: "Robert C. Martin — The Clean Architecture"
    url: "https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html"
    description: "Nguồn gốc Clean Architecture, bốn vòng trách nhiệm và Dependency Rule hướng vào trong."
  - title: "Robert C. Martin — The Clean Architecture Dependency Rule"
    url: "https://www.informit.com/articles/article.aspx?p=2832399"
    description: "Giải thích Entities, Use Cases, Interface Adapters, Frameworks and Drivers cùng quy tắc phụ thuộc."
  - title: "InformIT — A Typical Clean Architecture Scenario"
    url: "https://www.informit.com/articles/article.aspx?p=2832399&seqNum=2"
    description: "Ví dụ Java web: controller, input boundary, use case, gateway và presenter qua các ranh giới."
  - title: "Microsoft Learn — Common Web Application Architectures"
    url: "https://learn.microsoft.com/en-us/dotnet/architecture/modern-web-apps-azure/common-web-application-architectures"
    description: "So sánh Clean Architecture với kiến trúc truyền thống và ví dụ application core độc lập hạ tầng."
  - title: "AWS Prescriptive Guidance — Hexagonal Architecture Pattern"
    url: "https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/hexagonal-architecture.html"
    description: "Các nguyên tắc ports/adapters liên quan, inversion of control và kiểm thử độc lập hạ tầng."
  - title: "Spring Framework — Dependency Injection"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html"
    description: "Constructor injection và cách lắp ghép các interface với implementation ở composition root."
  - title: "ArchUnit — User Guide"
    url: "https://www.archunit.org/userguide/html/000_Index.html"
    description: "Kiểm tra các phụ thuộc Java giữa package, lớp, layer và phòng ngừa vòng phụ thuộc."