references:
  - title: "Microsoft Learn — Pipes and Filters Pattern"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/pipes-and-filters"
    description: "Kiến trúc, lợi ích tái sử dụng/scale, idempotency, duplicate messages và trường hợp không phù hợp."
  - title: "Enterprise Integration Patterns — Pipes and Filters"
    url: "https://www.enterpriseintegrationpatterns.com/patterns/messaging/PipesAndFilters.html"
    description: "Định nghĩa filter, pipe, interface, khả năng thay thế hoặc thay đổi thứ tự trong hệ thống tích hợp."
  - title: "Apache Camel — Pipeline EIP"
    url: "https://camel.apache.org/components/4.14.x/eips/pipeline-eip.html"
    description: "Ghép các processor nối tiếp bằng pipeline trong Apache Camel và luồng trao đổi message."
  - title: "Spring Integration — Java DSL"
    url: "https://docs.spring.io/spring-integration/reference/dsl.html"
    description: "Tạo IntegrationFlow bằng API fluent, liên kết các xử lý, filter và transform qua pipeline."
  - title: "Spring Integration — Message Channels"
    url: "https://docs.spring.io/spring-integration/reference/channel.html"
    description: "MessageChannel tách producer khỏi consumer và các kiểu pipe trong ứng dụng Spring Integration."
  - title: "Oracle Java — Streams API"
    url: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/stream/package-summary.html"
    description: "Pipeline đồng bộ trong Java, nguồn dữ liệu, thao tác trung gian filter/map và terminal operation."
  - title: "Enterprise Integration Patterns — Dead Letter Channel"
    url: "https://www.enterpriseintegrationpatterns.com/patterns/messaging/DeadLetterChannel.html"
    description: "Cách xử lý message không thể giao hoặc xử lý thành công qua dead-letter channel."
  - title: "Enterprise Integration Patterns — Message History"
    url: "https://www.enterpriseintegrationpatterns.com/patterns/messaging/MessageHistory.html"
    description: "Theo dõi các component message đã đi qua để hỗ trợ quan sát và chẩn đoán pipeline."