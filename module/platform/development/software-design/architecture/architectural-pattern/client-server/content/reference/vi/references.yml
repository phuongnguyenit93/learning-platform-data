references:
  - title: "MDN — Client-server Overview"
    url: "https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Server-side/First_steps/Client-Server_overview"
    description: "Giải thích luồng request–response giữa browser và web server, vai trò ứng dụng phía server và dữ liệu động."
  - title: "RFC 9110 — HTTP Semantics"
    url: "https://www.rfc-editor.org/rfc/rfc9110.html"
    description: "Đặc tả chính thức về HTTP methods, URI, headers, status codes, tài nguyên và semantics khi giao tiếp Client–Server."
  - title: "Microsoft Azure — N-tier Architecture Style"
    url: "https://learn.microsoft.com/en-us/azure/architecture/guide/architecture-styles/n-tier"
    description: "So sánh các tầng presentation, business và data; trách nhiệm, phụ thuộc và đánh đổi khi triển khai N-tier."
  - title: "NGINX — Reverse Proxy"
    url: "https://docs.nginx.com/nginx/admin-guide/web-server/reverse-proxy"
    description: "Hướng dẫn reverse proxy chuyển tiếp request, nhận response từ backend và quản lý proxy headers hoặc buffering."
  - title: "OWASP — REST Security Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/REST_Security_Cheat_Sheet.html"
    description: "Thực hành kiểm soát authentication, authorization, validation, HTTP status, rate limit và an toàn API phía server."
  - title: "MDN — Cross-Origin Resource Sharing"
    url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS"
    description: "Khái niệm và giới hạn CORS khi browser client gọi API khác origin, giúp hiểu ranh giới bảo vệ phía browser."
