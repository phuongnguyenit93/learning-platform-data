menu:
- level1: Tổng quan SOA
  level2:
  - SOA là gì và kiến trúc hướng dịch vụ giải quyết vấn đề nào
  - Từ tích hợp từng cặp đến tổ chức hệ thống theo dịch vụ
  - Dịch vụ, khả năng nghiệp vụ và hợp đồng dịch vụ
  - Bên cung cấp, bên sử dụng và bên trung gian dịch vụ
  - Thông điệp, điểm cuối và tương tác giữa các dịch vụ
  - Bản đồ thành phần và luồng yêu cầu trong một hệ thống SOA
  - SOA ở cấp tổ chức và kiến trúc bên trong một dịch vụ
  - SOA với kiến trúc phân lớp, ứng dụng nguyên khối và mô-đun
  - 'SOA với microservices: điểm chung, khác biệt và phạm vi áp dụng'
  - Khi nên dùng SOA và khi chi phí tích hợp vượt lợi ích
  - Lộ trình học và thuật ngữ cốt lõi của SOA
- level1: Nền tảng phân tán
  level2:
  - Lời gọi nội bộ và lời gọi qua mạng khác nhau như thế nào
  - Độ trễ, băng thông và chi phí tuần tự hóa dữ liệu
  - Lỗi từng phần và giới hạn của việc suy luận từ mất kết nối
  - Thời hạn chờ, thời hạn tổng và trạng thái kết quả chưa xác định
  - Giao tiếp đồng bộ và bất đồng bộ
  - Phân biệt chấp nhận yêu cầu với hoàn tất nghiệp vụ
  - Mất, trùng lặp và đảo thứ tự thông điệp
  - Tính nhất quán và tính sẵn sàng khi mạng bị phân hoạch
  - Thời gian, đồng hồ và thứ tự sự kiện trong hệ thống phân tán
  - Ranh giới tin cậy và sự phụ thuộc giữa các hệ thống
- level1: Nguyên lý dịch vụ
  level2:
  - Hợp đồng chuẩn hóa và sự độc lập của bên sử dụng
  - Liên kết lỏng và những phụ thuộc vẫn tồn tại
  - Trừu tượng hóa dịch vụ và che giấu chi tiết triển khai
  - Khả năng tái sử dụng và giới hạn của tái sử dụng
  - Quyền tự chủ của dịch vụ và quyền kiểm soát tài nguyên
  - Giảm trạng thái hội thoại và quản lý trạng thái nghiệp vụ
  - Khả năng khám phá và diễn đạt ý nghĩa dịch vụ
  - Khả năng kết hợp dịch vụ thành quy trình lớn hơn
  - Tính kết dính và mức độ liên kết giữa các dịch vụ
  - Tính tương tác giữa nền tảng, ngôn ngữ và nhà cung cấp
  - Cân bằng các nguyên lý thay vì áp dụng máy móc
- level1: Phân tích nghiệp vụ
  level2:
  - Xác định mục tiêu kinh doanh và phạm vi sáng kiến SOA
  - Lập bản đồ khả năng nghiệp vụ của tổ chức
  - Phân rã quy trình nghiệp vụ và tìm điểm tương tác
  - Nhận diện tác nhân, hệ thống hiện hữu và bên sở hữu dữ liệu
  - Phân biệt khả năng nghiệp vụ với chức năng kỹ thuật
  - Xây dựng từ vựng chung và làm rõ ý nghĩa dữ liệu
  - Xác định sự kiện nghiệp vụ và các mốc thay đổi trạng thái
  - Thu thập yêu cầu chất lượng và ràng buộc tích hợp
  - Phân tích yêu cầu pháp lý, tổ chức và hệ thống kế thừa
  - Chọn quy trình thí điểm và tiêu chí thành công
- level1: Ranh giới dịch vụ
  level2:
  - Chuyển khả năng nghiệp vụ thành ứng viên dịch vụ
  - Thiết kế từ trên xuống, từ dưới lên và kết hợp hai hướng
  - Chọn độ hạt của dịch vụ và thao tác
  - Phân biệt ranh giới dịch vụ với bảng dữ liệu và thực thể
  - Sử dụng ngữ cảnh giới hạn để làm rõ ranh giới ngữ nghĩa
  - Xác định chủ sở hữu và trách nhiệm của từng dịch vụ
  - Đặt ranh giới theo dữ liệu, giao dịch và nhịp thay đổi
  - Nhận diện giao tiếp quá nhiều và dịch vụ phụ thuộc vòng
  - Phân tích ảnh hưởng của chia nhỏ hoặc gộp dịch vụ
  - Kiểm chứng ranh giới bằng kịch bản nghiệp vụ
  - Ghi nhận quyết định ranh giới và các đánh đổi
- level1: Danh mục dịch vụ
  level2:
  - Danh mục dịch vụ và mô hình dịch vụ ở cấp tổ chức
  - Dịch vụ nghiệp vụ và dịch vụ kỹ thuật dùng chung
  - Dịch vụ thực thể, dịch vụ tác vụ và dịch vụ tiện ích
  - Dịch vụ nguyên tử và dịch vụ kết hợp
  - Dịch vụ quy trình và vai trò điều phối
  - Phân biệt dịch vụ công khai với thành phần nội bộ
  - Xác định phạm vi dùng chung giữa các miền nghiệp vụ
  - Định danh, đặt tên và phân nhóm dịch vụ
  - Lập bản đồ phụ thuộc giữa bên cung cấp và bên sử dụng
  - Tránh danh mục trùng lặp và lớp dịch vụ không cần thiết
- level1: Hợp đồng dịch vụ
  level2:
  - 'Các phần của hợp đồng: chức năng, dữ liệu, lỗi và chất lượng'
  - Thiết kế theo hợp đồng trước hay theo triển khai trước
  - Đặt tên thao tác theo ý nghĩa nghiệp vụ
  - Định nghĩa đầu vào, đầu ra và điều kiện hợp lệ
  - Tiền điều kiện, hậu điều kiện và bất biến nghiệp vụ
  - Ngữ nghĩa của truy vấn, lệnh và thông báo sự kiện
  - Cam kết về tính lũy đẳng và khả năng thử lại
  - Mô hình lỗi nghiệp vụ và lỗi kỹ thuật
  - Phân biệt kết quả đồng bộ với trạng thái tác vụ dài
  - Định nghĩa giới hạn sử dụng, thời hạn chờ và kích thước dữ liệu
  - Tài liệu hợp đồng và ví dụ tương tác
  - Đánh giá hợp đồng từ góc nhìn bên sử dụng
- level1: Mô hình thông điệp
  level2:
  - Cấu trúc bao thông điệp, phần đầu và phần dữ liệu
  - Phân biệt mô hình dữ liệu truyền tải với mô hình nội bộ
  - XML, JSON và lựa chọn định dạng trao đổi
  - Lược đồ XSD và JSON Schema trong kiểm tra dữ liệu
  - Trường bắt buộc, tùy chọn, giá trị rỗng và giá trị mặc định
  - Định danh nghiệp vụ và định danh thông điệp
  - Mã liên kết, mã nguyên nhân và ngữ cảnh truy vết
  - Biểu diễn thời gian, múi giờ, tiền tệ và đơn vị đo
  - Mô hình dữ liệu chuẩn dùng chung và chi phí quản trị
  - Ánh xạ dữ liệu giữa các ngữ cảnh khác nhau
  - Tệp đính kèm, dữ liệu lớn và tham chiếu ngoài thông điệp
  - Phân loại dữ liệu nhạy cảm và giảm dữ liệu truyền đi
- level1: SOAP và WS-*
  level2:
  - SOAP trong SOA và các trường hợp tích hợp doanh nghiệp
  - Cấu trúc SOAP Envelope, Header, Body và Fault
  - SOAP 1.1 và SOAP 1.2 trong tương thích tích hợp
  - 'WSDL: kiểu dữ liệu, thông điệp, thao tác, binding và endpoint'
  - 'WSDL 1.1 và WSDL 2.0: nhận diện hợp đồng đang sử dụng'
  - XML Namespace, QName và quản lý lược đồ XSD
  - Document/Literal, RPC và khả năng tương tác
  - SOAP Fault và thiết kế lỗi theo hợp đồng
  - WS-Addressing và định danh tương tác
  - WS-Policy và công bố yêu cầu của điểm cuối
  - WS-Security trong bảo vệ thông điệp
  - WS-ReliableMessaging và giới hạn bảo đảm truyền nhận
  - MTOM/XOP cho dữ liệu nhị phân
  - Giới hạn của bộ tiêu chuẩn WS-* và lựa chọn mức hỗ trợ
- level1: REST và HTTP
  level2:
  - 'SOA với REST: phân biệt kiến trúc hướng dịch vụ và phong cách giao tiếp'
  - Mô hình tài nguyên và thiết kế URI
  - Ngữ nghĩa HTTP method và tính lũy đẳng
  - Mã trạng thái HTTP và mô hình phản hồi lỗi
  - Biểu diễn tài nguyên, Content-Type và thương lượng nội dung
  - Phân trang, lọc và sắp xếp trên hợp đồng truy vấn
  - Bộ nhớ đệm HTTP, ETag và yêu cầu có điều kiện
  - Xử lý cập nhật đồng thời bằng kiểm soát phiên bản
  - Tác vụ dài với phản hồi chấp nhận và điểm cuối trạng thái
  - OpenAPI và tài liệu hợp đồng HTTP
  - Khi chọn SOAP, REST hoặc nhắn tin cho một tương tác
- level1: Nhắn tin bất đồng bộ
  level2:
  - Hàng đợi, chủ đề và vai trò của môi giới thông điệp
  - Mô hình điểm tới điểm và xuất bản–đăng ký
  - Lệnh, sự kiện và tài liệu trong giao tiếp bất đồng bộ
  - Xác nhận gửi, xác nhận nhận và thời điểm xử lý thành công
  - At-most-once, at-least-once và phạm vi của exactly-once
  - Khóa thông điệp, phân vùng và bảo toàn thứ tự
  - Nhóm bên tiêu thụ và xử lý song song
  - Tương quan yêu cầu–phản hồi qua thông điệp
  - Thông điệp lỗi, hàng đợi lỗi và xử lý thông điệp độc hại
  - Lưu giữ, phát lại và hết hạn thông điệp
  - Điều tiết luồng và xử lý bên tiêu thụ chậm
  - AsyncAPI và mô tả hợp đồng bất đồng bộ
- level1: Tích hợp hệ thống
  level2:
  - Tích hợp qua tệp, cơ sở dữ liệu, lời gọi từ xa và thông điệp
  - Mô hình hub-and-spoke và mô hình tích hợp từng cặp
  - Bộ chuyển đổi giao thức và bộ kết nối hệ thống
  - Lớp chống xâm lấn cho hệ thống kế thừa
  - Chuyển đổi định dạng và ánh xạ ngữ nghĩa dữ liệu
  - Kiểm tra, chuẩn hóa và làm giàu thông điệp
  - Tích hợp hệ thống có sẵn mà không làm lộ mô hình nội bộ
  - Tích hợp đối tác bên ngoài và ranh giới doanh nghiệp
  - Trao đổi theo lô và xử lý gần thời gian thực
  - Thiết kế luồng lỗi và đối soát cho quá trình tích hợp
  - Quản lý phụ thuộc vào sản phẩm và nhà cung cấp tích hợp
- level1: ESB và trung gian
  level2:
  - ESB là gì và vai trò trung gian trong SOA
  - Định tuyến, chuyển đổi và điều phối trên ESB
  - Định tuyến theo nội dung, quy tắc và danh sách người nhận
  - Chuỗi xử lý và bộ lọc thông điệp
  - Tách thông điệp, gom kết quả và điều kiện hoàn tất
  - Kênh thông điệp không hợp lệ và kênh thông điệp lỗi
  - Thực thi chính sách và bảo vệ điểm cuối tập trung
  - Phân biệt ESB, API Gateway và môi giới thông điệp
  - Phân biệt ESB với service mesh theo phạm vi trách nhiệm
  - Nguy cơ ESB trở thành điểm nghẽn và điểm lỗi đơn
  - Giới hạn logic nghiệp vụ trên lớp trung gian
  - Khi dùng ESB tập trung, tích hợp phân tán hoặc kết hợp
- level1: Phối hợp dịch vụ
  level2:
  - Orchestration và choreography trong quy trình liên dịch vụ
  - Phân biệt bộ điều phối với dịch vụ nghiệp vụ
  - Kết hợp dịch vụ tuần tự, song song và theo điều kiện
  - Quản lý trạng thái và tính bền vững của quy trình
  - Tương quan thông điệp với phiên bản quy trình đang chạy
  - Quy trình kéo dài và tác vụ có con người tham gia
  - BPMN và ranh giới giữa mô hình với khả năng thực thi
  - BPEL trong hệ sinh thái điều phối dịch vụ SOAP
  - Xử lý hết hạn, hủy bỏ và tiếp tục quy trình
  - Bù trừ khi quy trình hoàn tất một phần
  - Nâng cấp quy trình khi còn phiên bản đang chạy
  - Tránh bộ điều phối toàn năng và vòng lặp sự kiện
- level1: Dữ liệu dịch vụ
  level2:
  - Quyền sở hữu dữ liệu và nguồn dữ liệu có thẩm quyền
  - Cơ sở dữ liệu dùng chung và dữ liệu do dịch vụ quản lý
  - Đồng bộ dữ liệu tham chiếu giữa các hệ thống
  - Sao chép dữ liệu và độ trễ hội tụ
  - Truy vấn qua nhiều dịch vụ và kết hợp kết quả
  - Phân biệt dữ liệu nguồn với mô hình đọc dẫn xuất
  - Quản lý dữ liệu chủ và danh tính thực thể liên hệ thống
  - Theo dõi thay đổi dữ liệu và tích hợp dựa trên CDC
  - Giải quyết xung đột và chính sách cập nhật
  - Đối soát, sửa dữ liệu và phục hồi sau lỗi tích hợp
  - Vòng đời, lưu giữ và xóa dữ liệu phân tán
- level1: Giao dịch phân tán
  level2:
  - Giao dịch cục bộ và giới hạn khi vượt ranh giới dịch vụ
  - Bất biến nghiệp vụ và yêu cầu nhất quán thực sự
  - Two-Phase Commit và vai trò của bộ điều phối giao dịch
  - XA và JTA trong hệ sinh thái Java
  - WS-Coordination, WS-AtomicTransaction và WS-BusinessActivity
  - Chi phí khóa, lỗi bộ điều phối và giới hạn tính sẵn sàng
  - Saga và chuỗi giao dịch cục bộ
  - Thiết kế thao tác bù trừ theo ý nghĩa nghiệp vụ
  - Transactional Outbox cho thay đổi dữ liệu và phát thông điệp
  - Inbox và xử lý thông điệp trùng lặp
  - Giữ chỗ tài nguyên, xác nhận và giải phóng
  - Trạng thái trung gian và trải nghiệm người sử dụng
  - Lựa chọn 2PC, Saga hoặc đối soát theo yêu cầu hệ thống
- level1: Khả năng phục hồi
  level2:
  - Lập ngân sách thời gian cho chuỗi lời gọi dịch vụ
  - Timeout và truyền thời hạn tổng qua các tầng
  - Retry với backoff, jitter và giới hạn số lần
  - Phân loại lỗi được phép thử lại
  - Khóa lũy đẳng và lưu kết quả xử lý
  - Circuit Breaker và phục hồi kết nối tới dịch vụ lỗi
  - Bulkhead và cô lập tài nguyên
  - Giới hạn đồng thời, hàng đợi hữu hạn và từ chối tải
  - Rate limiting, quota và bảo vệ bên cung cấp
  - Fallback và giới hạn của dữ liệu thay thế
  - Tránh retry storm và khuếch đại tải giữa nhiều tầng
  - Phục hồi sau khởi động lại và xử lý đang dở
  - Thiết kế kịch bản suy giảm chức năng có kiểm soát
- level1: Bảo mật dịch vụ
  level2:
  - Mô hình đe dọa và ranh giới tin cậy trong SOA
  - Xác thực, phân quyền và danh tính dịch vụ
  - TLS và mTLS cho bảo mật đường truyền
  - OAuth 2.0, OpenID Connect và phạm vi sử dụng
  - JWT, token tham chiếu và kiểm tra hiệu lực
  - SAML và liên kết danh tính trong tích hợp doanh nghiệp
  - WS-Security với chữ ký và mã hóa thông điệp
  - Bảo vệ đường truyền và bảo vệ thông điệp đầu cuối
  - Truyền danh tính người dùng và kiểm soát quyền ủy nhiệm
  - Chống phát lại và kiểm soát thời hạn thông điệp
  - Kiểm tra XML/JSON và phòng ngừa XXE, XML bomb
  - Quản lý bí mật, chứng chỉ và vòng đời khóa
  - Kiểm soát dữ liệu nhạy cảm trong log và thông điệp
  - Nhật ký kiểm toán và truy vết hành động liên dịch vụ
- level1: Quản trị SOA
  level2:
  - Quản trị SOA và mối quan hệ với vận hành hệ thống
  - Quản trị lúc thiết kế và lúc chạy
  - Vai trò chủ sở hữu dịch vụ, dữ liệu và nền tảng
  - Vòng đời từ đề xuất đến ngừng cung cấp dịch vụ
  - Tiêu chuẩn hợp đồng, đặt tên và mô hình lỗi
  - Chính sách bảo mật, tương thích và tuân thủ
  - Đánh giá kiến trúc và cơ chế xử lý ngoại lệ
  - SLA, SLO, SLI và trách nhiệm giữa các bên
