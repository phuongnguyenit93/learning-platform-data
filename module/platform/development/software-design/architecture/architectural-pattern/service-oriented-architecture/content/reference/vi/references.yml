references:
  - title: "OASIS — Reference Model for Service Oriented Architecture 1.0"
    url: "https://docs.oasis-open.org/soa-rm/v1.0/soa-rm.html"
    description: "Mô hình khái niệm nền tảng của SOA: service, visibility, service description, policy, contract và real-world effect."
  - title: "OASIS — SOA Reference Architecture Foundation 1.0"
    url: "https://docs.oasis-open.org/soa-rm/soa-ra/v1.0/soa-ra-v1.0.html"
    description: "Các góc nhìn kiến trúc SOA về tương tác, giao tiếp, sở hữu, security, management và governance."
  - title: "W3C — Web Services Architecture"
    url: "https://www.w3.org/TR/ws-arch/"
    description: "Các vai trò và quan hệ giữa service provider, requestor, mô tả dịch vụ, thông điệp và service discovery."
  - title: "W3C — Web Services Description Language (WSDL) 2.0"
    url: "https://www.w3.org/TR/wsdl20/"
    description: "Tiêu chuẩn mô tả interface, operation, binding và endpoint của Web Services."
  - title: "W3C — SOAP 1.2 Messaging Framework"
    url: "https://www.w3.org/TR/soap12-part1/"
    description: "Cấu trúc và ngữ nghĩa thông điệp SOAP; một công nghệ hiện thực SOA, không phải điều kiện bắt buộc."
  - title: "OpenAPI Initiative — OpenAPI Specification 3.1"
    url: "https://spec.openapis.org/oas/v3.1"
    description: "Tiêu chuẩn hợp đồng HTTP API độc lập ngôn ngữ để mô tả operation, request, response và schema."
  - title: "W3C — Web Services Addressing 1.0 Core"
    url: "https://www.w3.org/TR/ws-addr-core/"
    description: "Cơ chế định danh endpoint và thông điệp độc lập transport trong kiến trúc Web Services."
  - title: "W3C — Web Services Policy 1.5 Framework"
    url: "https://www.w3.org/TR/ws-policy/"
    description: "Biểu diễn policy, yêu cầu và khả năng của các thành phần trong một hệ thống Web Services."
  - title: "OMG — Business Process Model and Notation 2.0.2"
    url: "https://www.omg.org/spec/BPMN/2.0.2"
    description: "Ngôn ngữ mô hình hóa quy trình, workflow và sự phối hợp giữa các thành phần hoặc tổ chức."