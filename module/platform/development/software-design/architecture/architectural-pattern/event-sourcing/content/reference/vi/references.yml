references:
  - title: "Microsoft Learn – Event Sourcing Pattern"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/event-sourcing"
    description: "Append-only event store, rehydration, optimistic concurrency, snapshots, projections, privacy và trade-offs."
  - title: "Martin Fowler – Event Sourcing"
    url: "https://martinfowler.com/eaaDev/EventSourcing.html"
    description: "Mô tả gốc về chuỗi sự kiện, rebuild, temporal query và event replay."
  - title: "Microservices.io – Event Sourcing Pattern"
    url: "https://microservices.io/patterns/data/event-sourcing.html"
    description: "Thiết kế lưu aggregate bằng event stream, atomic append, snapshot và mối liên hệ với CQRS."
  - title: "Microsoft Learn – CQRS Pattern"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/cqrs"
    description: "Tách command/query models, materialized read views và eventual consistency."
  - title: "Microservices.io – CQRS Pattern"
    url: "https://microservices.io/patterns/data/cqrs.html"
    description: "Read replica/projection được cập nhật bằng domain events để truy vấn tối ưu."
  - title: "Axon Framework – Snapshotting"
    url: "https://docs.axoniq.io/axon-framework-reference/development/snapshotting/"
    description: "Cách snapshot tối ưu replay, chính sách tạo snapshot và fallback về event stream."
  - title: "Martin Fowler – What Do You Mean by Event-Driven?"
    url: "https://martinfowler.com/articles/201701-event-driven.html"
    description: "Phân biệt Event Sourcing với các cách dùng sự kiện trong kiến trúc event-driven."
  - title: "Microsoft Learn – Compensating Transaction Pattern"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/compensating-transaction"
    description: "Thiết kế tác vụ bù trừ, idempotency và phục hồi khi nghiệp vụ không thể rollback trực tiếp."