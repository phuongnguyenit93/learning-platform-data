menu:
  - level1: "Tổng quan"
    level2:
      - "Event Sourcing là gì và vì sao lưu chuỗi sự kiện thay cho chỉ lưu trạng thái hiện tại"
      - "Sự kiện nghiệp vụ bất biến làm nguồn dữ liệu chuẩn để tái dựng trạng thái aggregate"
      - "Các thành phần chính: command handler, aggregate, event store, projection và read model"
      - "Vòng đời từ ý định nghiệp vụ đến lưu sự kiện và cập nhật dữ liệu phục vụ truy vấn"
      - "Phân biệt Event Sourcing với CRUD, audit log và lưu lịch sử thay đổi dữ liệu"
      - "Phân biệt Event Sourcing với Event-Driven Architecture, messaging và CDC"
      - "Quan hệ giữa Event Sourcing, CQRS và Domain-Driven Design"
      - "Lợi ích, chi phí vận hành và giới hạn của việc lấy lịch sử làm nguồn sự thật"
  - level1: "Tư duy trạng thái"
    level2:
      - "Trạng thái hiện tại là kết quả fold chuỗi sự kiện theo thứ tự xác định"
      - "Phân biệt ý định trong command, sự thật trong event và dữ liệu dẫn xuất trong projection"
      - "Hàm tiến hóa trạng thái: trạng thái trước, sự kiện đầu vào và trạng thái sau"
      - "Tính xác định khi áp dụng sự kiện và ảnh hưởng của thời gian, số ngẫu nhiên, dữ liệu bên ngoài"
      - "Tái dựng trạng thái tại một phiên bản hoặc một thời điểm trong lịch sử"
      - "Phân biệt lịch sử nghiệp vụ với cách diễn giải lịch sử của từng read model"
      - "Bất biến của sự kiện đã ghi và cách biểu diễn sửa sai bằng sự kiện mới"
      - "Tách việc áp dụng sự kiện quá khứ khỏi việc kiểm tra quy tắc cho command mới"
  - level1: "Phạm vi áp dụng"
    level2:
      - "Nhận diện miền nghiệp vụ cần truy vết quyết định và lịch sử có ý nghĩa"
      - "Đánh giá nhu cầu tái dựng trạng thái, phân tích lịch sử và tạo góc nhìn mới"
      - "Các tình huống phù hợp: đơn hàng, tồn kho, sổ cái và quy trình nhiều bước"
      - "Các tình huống ít phù hợp: CRUD đơn giản, lịch sử ít giá trị và dữ liệu thay đổi quá lớn"
      - "Đánh giá chi phí nhận thức, lưu trữ, độ trễ nhất quán và năng lực vận hành"
      - "Áp dụng Event Sourcing có chọn lọc theo bounded context và aggregate"
      - "Kết hợp mô hình lưu trạng thái với mô hình lưu sự kiện trong cùng hệ thống"
      - "Ghi nhận quyết định kiến trúc, giả định và tiêu chí dừng hoặc điều chỉnh cách áp dụng"
  - level1: "Mô hình miền"
    level2:
      - "Xác định bounded context, ngôn ngữ chung và chủ sở hữu dữ liệu nghiệp vụ"
      - "Khám phá sự kiện, command và chính sách nghiệp vụ bằng Event Storming"
      - "Chọn aggregate root làm ranh giới nhất quán và đơn vị lưu event stream"
      - "Phân biệt entity, value object, aggregate và process manager trong mô hình sự kiện"
      - "Tìm bất biến nghiệp vụ và xác định dữ liệu cần để kiểm tra command"
      - "Thiết kế kích thước aggregate để cân bằng tính nhất quán, độ tranh chấp và chi phí nạp"
      - "Mô hình hóa vòng đời aggregate qua các trạng thái và chuyển tiếp hợp lệ"
      - "Giảm phụ thuộc giữa aggregate bằng định danh và sự kiện có ý nghĩa nghiệp vụ"
      - "Tách sự kiện nội bộ của miền khỏi hợp đồng tích hợp giữa các bounded context"
  - level1: "Thiết kế sự kiện"
    level2:
      - "Đặt tên sự kiện theo sự thật đã xảy ra và ngôn ngữ nghiệp vụ ở thì quá khứ"
      - "Chọn độ hạt sự kiện đủ diễn đạt quyết định mà không phụ thuộc cấu trúc bảng hoặc giao diện"
      - "Thiết kế payload chứa đủ dữ liệu để diễn giải và tái dựng lịch sử lâu dài"
      - "Tách payload nghiệp vụ khỏi envelope và metadata kỹ thuật"
      - "Thiết kế event ID, event type, schema version và thông tin nguồn phát"
      - "Gắn correlation ID, causation ID và command ID để theo dõi chuỗi nguyên nhân"
      - "Ghi nhận tác nhân, lý do và ngữ cảnh quyết định với mức dữ liệu cần thiết"
      - "Biểu diễn tiền tệ, đơn vị đo, số thập phân và giá trị đặc biệt ổn định qua thời gian"
      - "Xử lý dữ liệu tham chiếu có thể thay đổi mà vẫn giữ ý nghĩa lịch sử của sự kiện"
      - "Thiết kế sự kiện điều chỉnh, đảo tác động và hủy nghiệp vụ mà không sửa sự kiện cũ"
  - level1: "Định danh và thời gian"
    level2:
      - "Thiết kế aggregate ID, stream ID và quy tắc đặt tên stream theo miền nghiệp vụ"
      - "Phân biệt event ID, số thứ tự trong stream và vị trí trong log dùng cho đăng ký"
      - "Bảo đảm định danh không trùng và không suy diễn thứ tự chỉ từ ID"
      - "Phân biệt thời điểm nghiệp vụ xảy ra, thời điểm ghi nhận và thời điểm xử lý"
      - "Quy ước múi giờ, độ chính xác thời gian và biểu diễn timestamp nhất quán"
      - "Xử lý lệch đồng hồ và xác định thứ tự bằng phiên bản thay vì chỉ dùng timestamp"
      - "Mô hình hóa sự kiện đến muộn hoặc có hiệu lực hồi tố"
      - "Truy vấn theo thời gian hiệu lực và thời gian hệ thống biết thông tin khi nghiệp vụ yêu cầu"
  - level1: "Xử lý command"
    level2:
      - "Thiết kế command như ý định nghiệp vụ có đầu vào và kết quả rõ ràng"
      - "Luồng xử lý: xác thực, nạp aggregate, quyết định, append sự kiện và trả kết quả"
      - "Phân biệt kiểm tra định dạng, phân quyền và kiểm tra bất biến nghiệp vụ"
      - "Tách command handler điều phối khỏi logic quyết định của aggregate"
      - "Sinh không, một hoặc nhiều sự kiện từ một command và xác định ý nghĩa kết quả"
      - "Thiết kế command ID và idempotency key cho yêu cầu gửi lại"
      - "Lưu dấu kết quả xử lý để trả lại phản hồi ổn định khi command bị lặp"
      - "Phân biệt từ chối nghiệp vụ, xung đột phiên bản và lỗi hạ tầng"
      - "Xử lý timeout khi chưa biết append đã thành công hay chưa"
      - "Đặt ranh giới cho tác dụng phụ bên ngoài và công việc chỉ được thực hiện sau commit"
  - level1: "Aggregate và bất biến"
    level2:
      - "Khởi tạo aggregate từ trạng thái rỗng và chuỗi sự kiện đã lưu"
      - "Áp dụng từng loại sự kiện để cập nhật trạng thái mà không phát sinh tác dụng phụ"
      - "Kiểm tra bất biến trên trạng thái hiện tại trước khi tạo sự kiện mới"
      - "Quản lý phiên bản đã đọc, sự kiện chưa commit và trạng thái sau quyết định"
      - "Phân biệt tạo aggregate mới, aggregate chưa tồn tại và aggregate đã kết thúc vòng đời"
      - "Đưa thời gian hiện tại và kết quả dịch vụ ngoài vào bước quyết định một cách có kiểm soát"
      - "Xử lý quy tắc nghiệp vụ thay đổi mà vẫn tái dựng được lịch sử hợp lệ trước đây"
      - "Tránh đọc projection có độ trễ để kiểm tra bất biến cần nhất quán mạnh"
  - level1: "Thiết kế event store"
    level2:
      - "Các năng lực cốt lõi: append, đọc stream, kiểm tra phiên bản và theo dõi sự kiện mới"
      - "Mô hình bản ghi gồm stream ID, stream version, event ID, type, payload và metadata"
      - "Định nghĩa append có điều kiện bằng expected version"
      - "Bảo đảm ghi nguyên tử toàn bộ nhóm sự kiện của một command trong một stream"
      - "Thiết kế API đọc stream theo chiều, phiên bản bắt đầu và giới hạn phân trang"
      - "Ràng buộc duy nhất cho phiên bản trong stream và chính sách chống trùng event ID"
      - "Phân biệt event store lưu nguồn sự thật với message broker phục vụ phân phối"
      - "Phân biệt thứ tự trong stream với thứ tự toàn cục và khả năng thực tế của từng storage"
      - "Hợp đồng đối với stream chưa tồn tại, stream rỗng, stream đóng và stream bị xóa"
      - "Kiểm tra tính đầy đủ, khả năng giải mã và tính liên tục của lịch sử đã lưu"
  - level1: "Lưu trữ và chỉ mục"
    level2:
      - "Thiết kế bảng sự kiện trên cơ sở dữ liệu quan hệ và ranh giới transaction cần thiết"
      - "Đánh giá event store chuyên dụng theo bảo đảm nhất quán và chức năng đăng ký"
      - "Lựa chọn định dạng serialization theo độ bền hợp đồng và khả năng tiến hóa"
      - "Thiết kế chỉ mục phục vụ đọc stream, kiểm tra phiên bản và quét sự kiện"
      - "Phân vùng dữ liệu theo stream, tenant hoặc thời gian và hệ quả với thứ tự"
      - "Xử lý payload lớn bằng tham chiếu có kiểm soát và bảo đảm tài nguyên được lưu lâu dài"
      - "Nén dữ liệu, lưu trữ theo tầng và cân bằng chi phí đọc lịch sử"
      - "Quản lý kết nối, giới hạn kích thước batch và tránh khóa quá rộng khi append"
  - level1: "Giao dịch và độ bền"
    level2:
      - "Xác định điểm commit và thời điểm có thể xác nhận command thành công"
      - "Bảo đảm không xuất hiện nhóm sự kiện chỉ được ghi một phần"
      - "Phân biệt tính nguyên tử, khả năng nhìn thấy dữ liệu và độ bền sau sự cố"
      - "Chọn mức cô lập và ràng buộc dữ liệu phù hợp với cơ chế append có điều kiện"
      - "Phân tích sự cố trước commit, sau commit và trong lúc trả phản hồi"
      - "Thiết kế retry ghi dữ liệu khi kết quả lần ghi trước chưa xác định"
      - "Đánh giá giao dịch nhiều stream và giới hạn hỗ trợ của storage"
      - "Kiểm chứng bảo đảm độ bền khi failover, mất kết nối hoặc mất node"
  - level1: "Đồng thời và xung đột"
    level2:
      - "Optimistic concurrency bằng expected version và so sánh phiên bản khi append"
      - "Phát hiện hai command cùng quyết định trên một phiên bản aggregate"
      - "Phân biệt xung đột kỹ thuật có thể thử lại với xung đột nghiệp vụ phải từ chối"
      - "Nạp lại lịch sử và đánh giá lại toàn bộ command trước khi retry"
      - "Áp dụng backoff, jitter và giới hạn retry để tránh khuếch đại tranh chấp"
      - "Thiết kế thao tác có tính giao hoán khi ngữ nghĩa nghiệp vụ cho phép"
      - "Dùng khóa hoặc xử lý tuần tự theo aggregate và đánh giá giới hạn của từng cách"
      - "Phát hiện hot aggregate và điều chỉnh ranh giới hoặc cách phân bổ nghiệp vụ"
      - "Bảo vệ tính duy nhất và giới hạn tài nguyên xuyên aggregate bằng cơ chế phối hợp rõ ràng"
  - level1: "Thứ tự và phân phối"
    level2:
      - "Xác định phạm vi cần giữ thứ tự: một aggregate, một partition hay nhiều stream"
      - "Chọn partition key để giữ các sự kiện của cùng aggregate trên cùng tuyến xử lý"
      - "Phân biệt thứ tự ghi, thứ tự công bố, thứ tự nhận và thứ tự hoàn thành xử lý"
      - "Phát hiện sự kiện trùng, khoảng trống phiên bản và sự kiện đến sai thứ tự"
      - "Thiết kế bộ đệm, chờ bổ sung hoặc đọc lại stream khi thiếu sự kiện"
      - "Bảo toàn thứ tự cần thiết khi tăng số consumer và khi rebalance partition"
      - "Theo dõi quan hệ nhân quả giữa stream mà không giả định luôn có thứ tự toàn cục"
      - "Phân tích đánh đổi giữa yêu cầu thứ tự, độ trễ, thông lượng và khả năng chịu lỗi"
  - level1: "Công bố sự kiện"
    level2:
      - "Nhận diện lỗi dual write giữa event store và message broker"
      - "Đọc log sự kiện đã commit để công bố theo khả năng của event store"
      - "Áp dụng transactional outbox khi sự kiện và outbox có thể commit cùng giao dịch"
      - "Theo dõi vị trí công bố, xác nhận gửi và retry sau khi publisher khởi động lại"
      - "Chấp nhận khả năng công bố lặp và giữ event ID ổn định qua các lần gửi"
      - "Phân biệt domain event được lưu với integration event được công bố ra ngoài"
      - "Xử lý broker ngừng hoạt động, backlog tăng và áp lực ngược lên publisher"
      - "Đối soát sự kiện đã commit với sự kiện đã công bố để phát hiện mất hoặc bỏ sót"
  - level1: "Subscription và checkpoint"
    level2:
      - "Phân biệt subscription quét bù lịch sử, theo dõi trực tiếp và subscription bền vững"
      - "Chuyển từ đọc lịch sử sang theo dõi sự kiện mới mà không tạo khoảng trống"
      - "Thiết kế checkpoint theo consumer, projection, partition và thế hệ dữ liệu"
      - "Commit cập nhật projection và checkpoint nguyên tử khi cùng storage hỗ trợ"
      - "Dùng inbox hoặc dấu xử lý khi checkpoint và tác dụng xử lý nằm khác storage"
      - "Chọn thời điểm acknowledge để cân bằng nguy cơ lặp và nguy cơ mất xử lý"
      - "Quản lý quyền sở hữu partition, lease và consumer lỗi hoặc mất kết nối"
      - "Phân loại lỗi tạm thời, sự kiện không xử lý được và chính sách đưa vào hàng chờ lỗi"
      - "Retry, xử lý lại hàng chờ lỗi và giữ đúng quan hệ thứ tự của dữ liệu phụ thuộc"
  - level1: "Projection"
    level2:
      - "Thiết kế projection từ nhu cầu đọc và hợp đồng dữ liệu cần cung cấp"
      - "Chuyển sự kiện thành bảng tra cứu, dữ liệu tổng hợp, chỉ mục tìm kiếm hoặc cache"
      - "Thiết kế projector có tính xác định và kiểm soát tác dụng phụ"
      - "Cập nhật idempotent bằng event ID, stream version hoặc vị trí đã xử lý"
      - "Xử lý thao tác tăng giảm, upsert và xóa logic khi sự kiện có thể được nhận lại"
      - "Thiết kế projection nhận sự kiện từ nhiều aggregate và nhiều loại sự kiện"
      - "Giải quyết dữ liệu tham chiếu đến muộn và quan hệ phụ thuộc giữa các projection"
      - "Quản lý phiên bản projection độc lập với phiên bản schema của sự kiện"
      - "Xử lý sự kiện điều chỉnh, hủy và đến muộn trong dữ liệu tổng hợp"
      - "Đối soát projection với nguồn sự kiện để phát hiện và sửa dữ liệu lệch"
  - level1: "CQRS và truy vấn"
    level2:
      - "Tách mô hình ghi bảo vệ bất biến khỏi mô hình đọc tối ưu theo truy vấn"
      - "Áp dụng CQRS cùng Event Sourcing và nhận diện phần có thể triển khai độc lập"
      - "Thiết kế API command và query với trách nhiệm, kết quả và lỗi rõ ràng"
      - "Chọn storage cho read model theo kiểu truy vấn và nhu cầu cập nhật"
      - "Thiết kế nhiều read model cho danh sách, chi tiết, thống kê và tìm kiếm"
      - "Phân trang, lọc và sắp xếp trên dữ liệu projection đang tiếp tục thay đổi"
      - "Cung cấp truy vấn lịch sử và truy vấn tại phiên bản với ngữ nghĩa rõ ràng"
      - "Quản lý cache và tránh tạo thêm nguồn dữ liệu cạnh tranh với event store"
  - level1: "Nhất quán và trải nghiệm"
    level2:
      - "Phân biệt nhất quán trong aggregate với nhất quán cuối cùng của read model"
      - "Định nghĩa độ trễ chấp nhận được giữa command thành công và query nhìn thấy kết quả"
      - "Dùng phiên bản hoặc consistency token để theo dõi dữ liệu đã được projection xử lý"
      - "Thiết kế read-your-writes bằng chờ có giới hạn, polling hoặc thông báo cập nhật"
      - "Phản hồi trạng thái đang xử lý khi nghiệp vụ chưa hoàn tất ở các thành phần liên quan"
      - "Dùng cập nhật giao diện lạc quan và xử lý kết quả bị từ chối hoặc điều chỉnh"
      - "Xử lý đọc replica có độ trễ và lựa chọn tuyến đọc phù hợp với mức nhất quán cần thiết"
      - "Định nghĩa freshness, watermark và giới hạn chờ để tránh treo yêu cầu truy vấn"
  - level1: "Replay"
    level2:
