  - Đối tượng nghiệp vụ, đối tượng giá trị và quy tắc bất biến
  - Đặt hành vi cạnh dữ liệu mà hành vi đó quản lý
  - Phân biệt Model nghiệp vụ và mô hình dữ liệu trình bày
