  - Controller chứa toàn bộ quy tắc nghiệp vụ
  - Model bị thu hẹp thành thực thể cơ sở dữ liệu
  - View thực hiện truy vấn hoặc cập nhật dữ liệu
  - Truyền đối tượng lưu trữ trực tiếp ra giao diện không kiểm soát
  - Chia thư mục thành ba nhóm nhưng vẫn phụ thuộc chéo
  - Lạm dụng lớp cơ sở và thành phần dùng chung
  - Đặt trạng thái người dùng trong đối tượng dùng chung
  - Lặp lại logic kiểm tra và ánh xạ ở nhiều Controller
  - Coi Controller mỏng là lý do tạo thêm các lớp trung gian không cần thiết
  - Cố áp dụng cùng một biến thể MVC cho mọi loại giao diện
- level1: Cải tiến thiết kế
  level2:
  - Nhận diện mã trộn giao diện và nghiệp vụ
  - Bảo vệ hành vi hiện có bằng kiểm thử đặc trưng
  - Tách xử lý đầu vào và tạo phản hồi khỏi mã nghiệp vụ
  - Rút ca sử dụng ra dịch vụ ứng dụng
  - Tách dữ liệu biểu mẫu và dữ liệu trình bày
  - Đưa truy cập dữ liệu về lớp có trách nhiệm
  - Thay phụ thuộc trực tiếp bằng ranh giới trừu tượng cần thiết
  - Cải tiến từng luồng thay vì tổ chức lại toàn bộ mã một lần
  - Đánh giá số lớp, mức phụ thuộc và khả năng đọc sau cải tiến
  - Xác minh hành vi và xóa cấu trúc cũ đã được thay thế
- level1: Minh họa quản lý sách
  level2:
  - Yêu cầu danh sách, xem chi tiết, tạo mới và sửa thông tin sách
  - Xác định Model và quy tắc nghiệp vụ
  - Xác định View, dữ liệu biểu mẫu và dữ liệu trình bày
  - Thiết kế Controller và các hành động
  - Tổ chức dịch vụ ứng dụng và kho lưu trữ
  - Luồng hiển thị danh sách có phân trang và lọc
  - Luồng gửi biểu mẫu, kiểm tra và báo lỗi
  - Luồng cập nhật với kiểm soát xung đột
  - Phân quyền thao tác và xử lý dữ liệu không tồn tại
  - Kiểm thử và truy vết một ca sử dụng hoàn chỉnh
- level1: Thực hành
  level2:
  - Xây dựng ứng dụng MVC tối giản không phụ thuộc nền tảng
  - Tạo hai View cùng phản ánh một Model
  - Thay lớp lưu trữ mà vẫn giữ hành vi giao diện
  - Thêm biểu mẫu và phân tách các loại kiểm tra
  - Chuyển một luồng MVC tương tác sang luồng MVC trên web
  - Thiết kế phản hồi khi thao tác thất bại
  - Tách Controller quá lớn trong một ví dụ có sẵn
  - Thêm kiểm thử để bảo vệ ranh giới MVC
  - So sánh hai phương án thiết kế và giải thích đánh đổi
- level1: Đánh giá thiết kế
  level2:
  - Kiểm tra trách nhiệm của Model, View và Controller
  - Kiểm tra hướng phụ thuộc và khả năng thay đổi độc lập
  - Kiểm tra hợp đồng dữ liệu và ranh giới nghiệp vụ
  - Kiểm tra trạng thái, vòng đời và an toàn đồng thời
  - Kiểm tra lỗi, bảo mật và trải nghiệm phản hồi
  - Kiểm tra mức bao phủ hành vi bằng kiểm thử
  - Đánh giá hiệu năng và khả năng chẩn đoán
  - Câu hỏi phản biện theo các yêu cầu thay đổi
  - Ghi nhận quyết định, giới hạn và tiêu chí nghiệm thu
