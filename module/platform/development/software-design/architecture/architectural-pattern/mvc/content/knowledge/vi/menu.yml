  - Phối hợp dịch vụ ứng dụng hoặc thao tác trên Model
  - Chọn kết quả, dữ liệu trả về và View phù hợp
  - Phân biệt điều phối và thực thi quy tắc nghiệp vụ
  - Phân biệt xác thực đầu vào và quyết định nghiệp vụ
  - Quản lý điều hướng và kết quả sau thao tác
  - Xử lý yêu cầu không hợp lệ hoặc hành động không được hỗ trợ
  - Thiết kế Controller nhỏ, rõ trách nhiệm và dễ kiểm thử
  - Tránh phụ thuộc trực tiếp vào chi tiết giao diện hoặc cơ sở dữ liệu
  - Giới hạn của nguyên tắc Controller mỏng
