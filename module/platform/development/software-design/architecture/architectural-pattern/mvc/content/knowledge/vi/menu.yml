  - View truy vấn Model hoặc nhận dữ liệu đã chuẩn bị
  - Khuôn mẫu, bố cục và thành phần giao diện tái sử dụng
  - Hiển thị danh sách, chi tiết và trạng thái rỗng
  - Trạng thái đang tải, thành công và thất bại
  - Định dạng ngày giờ, số và nội dung theo ngôn ngữ
  - Khả năng tiếp cận và phản hồi thao tác cho người dùng
  - Giới hạn logic điều kiện và vòng lặp trong View
  - Ranh giới giữa View, ViewModel và bộ chuyển đổi dữ liệu
  - Giữ View có thể thay đổi mà không làm đổi quy tắc nghiệp vụ
