references:
  - title: "Spring Modulith - Project Overview"
    url: "https://spring.io/projects/spring-modulith/"
    description: "Tổng quan modular applications trên Spring Boot, mô hình module, verification và documentation."
  - title: "Spring Modulith - Fundamentals"
    url: "https://docs.spring.io/spring-modulith/reference/fundamentals.html"
    description: "Application modules, provided/required interfaces, package structure và named interfaces."
  - title: "Spring Modulith - Verifying Module Structure"
    url: "https://docs.spring.io/spring-modulith/reference/verification.html"
    description: "ApplicationModules.verify(), kiểm tra không có dependency cycle và chỉ truy cập API module."
  - title: "Spring Modulith - Working with Application Events"
    url: "https://docs.spring.io/spring-modulith/reference/events.html"
    description: "Event communication giữa các module, transactional listeners, publication registry và retry."
  - title: "Spring Modulith - Integration Testing Modules"
    url: "https://docs.spring.io/spring-modulith/reference/testing.html"
    description: "@ApplicationModuleTest, bootstrap modes, dependency isolation và event-based scenarios."
  - title: "Spring Modulith - Documenting Modules"
    url: "https://docs.spring.io/spring-modulith/reference/documentation.html"
    description: "Tạo sơ đồ C4/UML và Application Module Canvas bằng Documenter."
  - title: "Spring Modulith - Production-ready Features"
    url: "https://docs.spring.io/spring-modulith/reference/production-ready.html"
    description: "Actuator endpoint, observability, traces và metrics theo tương tác module."
  - title: "Martin Fowler - Microservices"
    url: "https://martinfowler.com/articles/microservices.html"
    description: "So sánh monolithic và microservice architecture về tiến trình, deploy và khả năng mở rộng."
  - title: "Microsoft Azure - Microservices Architecture Style"
    url: "https://learn.microsoft.com/en-us/azure/architecture/microservices/"
    description: "Bounded contexts, service boundaries, independent deployment và trade-offs khi phân tán."