references:
  - title: "ISO/IEC/IEEE 42010:2022 — Architecture Description"
    url: "https://www.iso.org/standard/74393.html"
    description: "Chuẩn khái niệm stakeholder, concern, architecture viewpoint, model và yêu cầu mô tả kiến trúc."
  - title: "ISO/IEC 25010:2023 — Product Quality Model"
    url: "https://www.iso.org/standard/78176.html"
    description: "Mô hình thuộc tính chất lượng phần mềm phục vụ xác định mục tiêu và đánh giá giải pháp."
  - title: "C4 Model — Architecture Diagrams"
    url: "https://c4model.com/diagrams"
    description: "Hướng dẫn các góc nhìn system context, container, component, code và sơ đồ động/triển khai."
  - title: "arc42 — Architecture Documentation"
    url: "https://docs.arc42.org/"
    description: "Mẫu và hướng dẫn tài liệu hóa mục tiêu, bối cảnh, building blocks, runtime, deployment và rủi ro."
  - title: "arc42 — Architecture Decisions"
    url: "https://docs.arc42.org/section-9/"
    description: "Ghi nhận các quyết định kiến trúc, lý do, lựa chọn thay thế và hệ quả dưới dạng ADR."
  - title: "CMU SEI — Architecture Tradeoff Analysis Method"
    url: "https://www.sei.cmu.edu/library/the-architecture-tradeoff-analysis-method/"
    description: "Phương pháp ATAM đánh giá rủi ro và đánh đổi giữa các thuộc tính chất lượng của kiến trúc."
  - title: "Microsoft — Design Principles for Azure Applications"
    url: "https://learn.microsoft.com/en-us/azure/architecture/guide/design-principles/"
    description: "Các nguyên tắc thiết kế khả năng phục hồi, mở rộng, vận hành và tiến hóa hệ thống."
  - title: "AWS — Well-Architected Framework"
    url: "https://docs.aws.amazon.com/wellarchitected/latest/framework/"
    description: "Khung rà soát chất lượng thiết kế theo các trụ cột vận hành, bảo mật, tin cậy, hiệu năng và chi phí."
  - title: "arc42 — Introduction and Quality Goals"
    url: "https://docs.arc42.org/section-1/"
    description: "Cách ghi stakeholder, yêu cầu và ưu tiên các mục tiêu chất lượng kiến trúc quan trọng."