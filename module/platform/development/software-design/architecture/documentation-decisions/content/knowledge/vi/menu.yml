menu:
  - level1: "Tổng quan ADR"
    level2:
      - "Architecture Decision Record là gì và giá trị của việc lưu lại lý do quyết định"
      - "Vai trò của ADR trong duy trì hiểu biết chung và trí nhớ kiến trúc của nhóm"
      - "Phân biệt ADR với tài liệu thiết kế, RFC, biên bản họp và hướng dẫn vận hành"
      - "Quan hệ giữa ADR, tài liệu kiến trúc và mã nguồn trong repository"
      - "Những thành phần cốt lõi của ADR gồm bối cảnh, quyết định, đánh đổi và hệ quả"
      - "Ai viết, ai đọc và ai sử dụng ADR trong các giai đoạn phát triển hệ thống"
      - "Khi nào ADR mang lại giá trị và khi nào một ghi chú ngắn đã đủ"
      - "Đọc một ADR mẫu từ vấn đề ban đầu đến lựa chọn được chấp nhận"
  - level1: "Phạm vi quyết định"
    level2:
      - "Nhận diện quyết định có ý nghĩa kiến trúc từ tác động và chi phí thay đổi"
      - "Phân loại quyết định về cấu trúc, dữ liệu, tích hợp, triển khai và vận hành"
      - "Xác định phạm vi áp dụng ở cấp hệ thống, dịch vụ, mô-đun hoặc toàn tổ chức"
      - "Chọn độ chi tiết phù hợp và giữ mỗi ADR tập trung vào một quyết định"
      - "Tách quyết định lớn thành các ADR liên quan mà vẫn giữ được lập luận tổng thể"
      - "Phân biệt quyết định kiến trúc với chi tiết triển khai và tác vụ kỹ thuật thông thường"
      - "Đánh giá khả năng đảo ngược để chọn mức đầu tư cho việc ghi chép"
      - "Ưu tiên các quyết định cần ghi trước khi khởi tạo kho ADR cho hệ thống hiện có"
  - level1: "Bối cảnh và động lực"
    level2:
      - "Mô tả hiện trạng kiến trúc và vấn đề cần giải quyết bằng dữ kiện cụ thể"
      - "Xác định các bên liên quan, nhu cầu sử dụng và mục tiêu kinh doanh"
      - "Chuyển yêu cầu chất lượng thành tiêu chí có thể quan sát hoặc đo lường"
      - "Ghi rõ ràng buộc về thời gian, ngân sách, năng lực nhóm và công nghệ hiện có"
      - "Liệt kê giả định, điều kiện tiên quyết và giới hạn phạm vi của quyết định"
      - "Nhận diện động lực quyết định và sắp xếp mức ưu tiên khi các mục tiêu xung đột"
      - "Ghi lại thời điểm cần quyết định và chi phí của việc tiếp tục trì hoãn"
      - "Diễn đạt câu hỏi quyết định để người đọc hiểu rõ điều cần được lựa chọn"
  - level1: "Bằng chứng và bất định"
    level2:
      - "Thu thập bằng chứng từ yêu cầu, sự cố, dữ liệu vận hành và tài liệu liên quan"
      - "Phân biệt sự kiện đã kiểm chứng, giả định làm việc và ý kiến cá nhân"
      - "Dùng thử nghiệm kỹ thuật và bản chứng minh khả thi để kiểm tra giả định quan trọng"
      - "Ghi điều kiện thử nghiệm, số liệu đo và giới hạn của kết quả so sánh"
      - "Đánh giá độ tin cậy, thời điểm thu thập và phạm vi áp dụng của nguồn tham khảo"
      - "Nêu rõ điều chưa biết và mức bất định còn lại khi phải đưa ra quyết định"
      - "Liên kết bằng chứng với tiêu chí đánh giá và lập luận lựa chọn phương án"
      - "Xác định bằng chứng mới nào sẽ buộc nhóm xem xét lại quyết định"
  - level1: "Phương án lựa chọn"
    level2:
      - "Xây dựng danh sách phương án khả thi dựa trên cùng một câu hỏi quyết định"
      - "Đưa phương án giữ nguyên hiện trạng hoặc chưa thay đổi vào so sánh khi phù hợp"
      - "Mô tả từng phương án ở mức chi tiết tương đương để tránh so sánh thiên lệch"
      - "Làm rõ điều kiện áp dụng, phụ thuộc và giới hạn kỹ thuật của từng phương án"
      - "Phân biệt phương án độc lập, phương án kết hợp và các lựa chọn loại trừ nhau"
      - "Loại sớm phương án không đáp ứng ràng buộc bắt buộc và ghi lại lý do"
      - "Ghi các phương án đã cân nhắc nhưng không chọn để tránh lặp lại tranh luận"
      - "Kiểm soát số lượng phương án để việc phân tích vừa đầy đủ vừa có thể hoàn tất"
  - level1: "Phân tích đánh đổi"
    level2:
      - "So sánh phương án theo động lực quyết định và tiêu chí đã thống nhất"
      - "Phân tích đánh đổi giữa hiệu năng, độ tin cậy, bảo mật và khả năng bảo trì"
      - "Đánh giá chi phí xây dựng, vận hành, chuyển đổi và tổng chi phí sở hữu"
      - "Cân nhắc độ phức tạp, năng lực nhóm, thời gian học và khả năng hỗ trợ lâu dài"
      - "Phân tích phụ thuộc nhà cung cấp, tính di động và mức độ khó đảo ngược"
      - "Sử dụng bảng so sánh hoặc ma trận trọng số và chỉ rõ giới hạn của cách chấm điểm"
      - "Kiểm tra độ nhạy của lựa chọn khi giả định hoặc mức ưu tiên thay đổi"
      - "Trình bày những lợi ích phải từ bỏ và giới hạn được chấp nhận một cách minh bạch"
  - level1: "Quyết định và lập luận"
    level2:
      - "Viết phát biểu quyết định rõ ràng về lựa chọn, phạm vi và điều kiện áp dụng"
      - "Kết nối phương án được chọn với các động lực và bằng chứng quan trọng nhất"
      - "Giải thích vì sao phương án được chọn phù hợp hơn trong bối cảnh hiện tại"
      - "Ghi lý do không chọn các phương án còn lại bằng tiêu chí có thể kiểm tra"
      - "Làm rõ ngoại lệ được phép và cách xử lý trường hợp nằm ngoài phạm vi"
      - "Xác định ranh giới giữa điều đã quyết định và chi tiết còn để nhóm triển khai lựa chọn"
      - "Ghi điều kiện hiệu lực, thời hạn thử nghiệm hoặc mốc cần đánh giá lại"
      - "Tránh hợp thức hóa lựa chọn đã có bằng lập luận thiếu bằng chứng hoặc phủ nhận đánh đổi"
  - level1: "Hệ quả và rủi ro"
    level2:
      - "Ghi hệ quả tích cực, tiêu cực và trung tính của quyết định"
      - "Phân tích tác động đến các nhóm, dịch vụ, dữ liệu và quy trình vận hành liên quan"
      - "Tách hệ quả chắc chắn, rủi ro có khả năng xảy ra và vấn đề chưa được giải quyết"
      - "Ghi nợ kỹ thuật được chấp nhận cùng nguyên nhân và điều kiện xử lý"
      - "Xác định biện pháp giảm thiểu rủi ro và người chịu trách nhiệm theo dõi"
      - "Mô tả tác động đến khả năng thay đổi, mở rộng và bảo trì trong tương lai"
      - "Liên kết hệ quả cần hành động với công việc triển khai và tiêu chí hoàn thành"
      - "Xác định phương án hoàn tác hoặc chuyển hướng khi hệ quả vượt mức chấp nhận"
  - level1: "Cấu trúc bản ghi"
    level2:
      - "Đặt tiêu đề phản ánh nội dung quyết định và giúp tìm kiếm về sau"
      - "Ghi mã định danh, ngày, tác giả, người phụ trách và trạng thái nhất quán"
      - "Tổ chức phần bối cảnh để nêu đủ vấn đề, động lực, ràng buộc và giả định"
      - "Trình bày các phương án và phần so sánh trước khi nêu lập luận lựa chọn"
      - "Viết phần quyết định ngắn gọn, dứt khoát và không mơ hồ về phạm vi"
      - "Tổ chức phần hệ quả để làm rõ lợi ích, chi phí, rủi ro và công việc tiếp theo"
      - "Bổ sung liên kết tham khảo, ADR liên quan và bằng chứng mà không làm loãng nội dung chính"
      - "Phân biệt thông tin bắt buộc với phần mở rộng như mức tin cậy hoặc lịch sử thay đổi"
  - level1: "Mẫu và quy ước"
    level2:
      - "So sánh mẫu ADR tối giản, mẫu Nygard và MADR theo nhu cầu ghi chép của nhóm"
      - "Chọn mẫu chung dựa trên độ phức tạp của quyết định và mức trưởng thành của nhóm"
      - "Thiết kế mẫu Markdown với hướng dẫn ngắn và câu hỏi gợi mở cho từng phần"
      - "Thống nhất thuật ngữ, cách viết ngày, tên trạng thái và ngôn ngữ sử dụng"
      - "Quy định cách trình bày bảng phương án, sơ đồ và nguồn tham khảo"
      - "Thiết kế phần thông tin bổ sung cho quyết định liên quan nhiều nhóm hoặc yêu cầu kiểm toán"
      - "Cung cấp ADR mẫu đã hoàn thành để người viết hiểu cách áp dụng biểu mẫu"
      - "Quản lý phiên bản mẫu và thay đổi quy ước mà vẫn đọc được ADR cũ"
  - level1: "Kỹ thuật viết ADR"
    level2:
      - "Viết ngắn gọn nhưng giữ đủ bối cảnh để người ngoài nhóm hiểu được quyết định"
      - "Dùng ngôn ngữ trung lập và mô tả lựa chọn thay vì đánh giá cá nhân hoặc nhóm"
      - "Tách mô tả vấn đề, thông tin thực tế và lập luận để tránh nhầm lẫn"
      - "Viết theo bối cảnh tại thời điểm quyết định và giải thích thuật ngữ cần thiết"
      - "Dùng ví dụ và sơ đồ vừa đủ để làm rõ phạm vi hoặc luồng tương tác"
      - "Tránh tiêu đề chung chung, nội dung sao chép mẫu và những nhận định không có căn cứ"
      - "Xử lý ADR quá dài bằng tóm tắt, liên kết tài liệu hỗ trợ hoặc tách quyết định"
      - "Tự kiểm tra độ rõ ràng, tính nhất quán và khả năng đọc độc lập trước khi gửi review"
  - level1: "Đề xuất và thảo luận"
    level2:
      - "Khởi tạo ADR khi câu hỏi kiến trúc xuất hiện và chỉ định người dẫn dắt quyết định"
      - "Chuẩn bị bản nháp với bối cảnh, phương án và các câu hỏi còn mở"
      - "Xác định đúng nhóm cần tham gia và người có chuyên môn cần tham vấn"
      - "Tổ chức lấy ý kiến bất đồng bộ bằng issue và pull request trong repository"
      - "Đặt thời hạn phản hồi và tiêu chí kết thúc thảo luận phù hợp với mức ảnh hưởng"
      - "Chuyển sang buổi thảo luận trực tiếp khi bất đồng khó giải quyết bằng văn bản"
      - "Tổng hợp ý kiến, ghi nhận bất đồng còn lại và cập nhật lập luận trong bản nháp"
      - "Ghi ADR sau quyết định khẩn cấp và phân biệt bản ghi hồi cứu với đề xuất mới"
  - level1: "Review ADR"
    level2:
      - "Kiểm tra ADR có nêu đúng vấn đề, phạm vi và các bên chịu tác động hay không"
      - "Review độ đầy đủ và công bằng của danh sách phương án cùng tiêu chí so sánh"
      - "Kiểm tra chất lượng bằng chứng, giả định và mức tin cậy của kết luận"
      - "Đánh giá tính nhất quán giữa động lực, lựa chọn, đánh đổi và hệ quả"
      - "Phát hiện mâu thuẫn với ADR đang hiệu lực, nguyên tắc kiến trúc và ràng buộc hiện có"
      - "Review khả năng triển khai, vận hành, hoàn tác và kiểm chứng sau quyết định"
      - "Phân biệt góp ý cần xử lý trước phê duyệt với đề xuất cải thiện có thể làm sau"
      - "Đóng vòng phản hồi bằng cập nhật bản ghi và xác nhận các điểm đã được giải quyết"
  - level1: "Phê duyệt và trách nhiệm"
    level2:
      - "Phân định vai trò người đề xuất, người tư vấn, người quyết định và người triển khai"
      - "Chọn cơ chế ra quyết định theo phạm vi ảnh hưởng và quyền sở hữu hệ thống"
      - "Xác định số lượng và chuyên môn người review cần thiết cho từng loại ADR"
      - "Làm rõ khác biệt giữa đồng thuận, chấp thuận theo thẩm quyền và việc merge pull request"
      - "Ghi nhận người phê duyệt, thời điểm và căn cứ chấp nhận quyết định"
      - "Xử lý bất đồng hoặc bế tắc bằng quy trình phân xử và giới hạn thời gian rõ ràng"
      - "Quản lý ngoại lệ với quyết định chung và trách nhiệm đánh giá lại ngoại lệ"
      - "Giữ quy trình phê duyệt tương xứng với rủi ro để tránh biến ADR thành thủ tục hình thức"
  - level1: "Trạng thái và vòng đời"
    level2:
      - "Định nghĩa tập trạng thái và sơ đồ chuyển trạng thái ADR mà nhóm thống nhất sử dụng"
      - "Quản lý bản nháp và trạng thái Proposed trong quá trình thu thập ý kiến"
      - "Chuyển sang Accepted khi quyết định được chấp thuận và ghi rõ thời điểm hiệu lực"
      - "Dùng Rejected để giữ lại đề xuất đã bị bác bỏ cùng lý do"
      - "Phân biệt Withdrawn cho đề xuất được rút với Rejected cho đề xuất không được chấp thuận"
      - "Phân biệt Deprecated với Superseded và chỉ rõ trạng thái áp dụng ở từng trường hợp"
      - "Tách trạng thái của quyết định khỏi tiến độ triển khai trong issue hoặc công cụ công việc"
      - "Kiểm tra chuyển trạng thái hợp lệ và giữ lại bằng chứng cho từng lần chuyển"
  - level1: "Thay đổi và thay thế"
    level2:
      - "Phân biệt sửa lỗi trình bày, bổ sung thông tin và thay đổi nội dung quyết định"
      - "Bảo toàn bối cảnh lịch sử của ADR đã chấp nhận khi cập nhật tài liệu"
      - "Nhận diện dấu hiệu cần mở ADR mới khi yêu cầu, ràng buộc hoặc bằng chứng thay đổi"
      - "Viết ADR thay thế với lý do xem xét lại và phần so sánh với lựa chọn trước"
      - "Liên kết hai chiều giữa ADR bị thay thế và ADR thay thế để đọc được chuỗi quyết định"
      - "Xử lý thay thế một phần bằng cách chỉ rõ phạm vi còn hiệu lực của ADR cũ"
      - "Ghi quyết định hoàn tác, thử nghiệm thất bại và bài học mà không xóa dấu vết lịch sử"
      - "Giải quyết các ADR mâu thuẫn và xác định quyết định hiện đang có hiệu lực"
  - level1: "Tổ chức repository"
    level2:
      - "Chọn vị trí lưu ADR trong repository chứa mã nguồn hoặc kho tài liệu dùng chung"
      - "Tổ chức thư mục ADR cho monorepo, nhiều repository và quyết định liên nhóm"
      - "Thiết kế mã định danh ổn định và quy tắc đánh số khi nhiều nhánh cùng tạo ADR"
      - "Đặt tên file Markdown nhất quán và giữ đường dẫn có thể tham chiếu lâu dài"
      - "Tạo trang mục lục để tra cứu theo mã, chủ đề, trạng thái và phạm vi áp dụng"
      - "Đặt mẫu ADR và hướng dẫn đóng góp ở nơi người viết dễ tìm thấy"
      - "Quản lý sơ đồ, ảnh và tài liệu bằng chứng đi kèm mà không làm repository khó bảo trì"
      - "Xác lập nguồn thông tin chính thức khi ADR được sao chép hoặc xuất sang cổng tài liệu"
  - level1: "Liên kết và truy vết"
    level2:
      - "Liên kết ADR với yêu cầu, issue và mục tiêu chất lượng đã dẫn đến quyết định"
      - "Liên kết ADR với pull request, commit và phần mã nguồn thực hiện lựa chọn"
      - "Kết nối ADR với sơ đồ kiến trúc, tài liệu thiết kế và hướng dẫn vận hành liên quan"
      - "Biểu diễn quan hệ phụ thuộc, bổ sung, mâu thuẫn và thay thế giữa các ADR"
      - "Dùng mã ADR trong bình luận mã hoặc tài liệu kỹ thuật khi cần giải thích lý do"
      - "Chọn liên kết cố định cho bằng chứng và liên kết hiện hành cho nội dung cần cập nhật"
      - "Kiểm tra liên kết hỏng, tham chiếu thiếu và tác động khi đổi tên hoặc di chuyển file"
      - "Truy vết từ một hành vi hệ thống về quyết định gốc và từ quyết định đến nơi áp dụng"
  - level1: "Git và pull request"
    level2:
      - "Áp dụng tài liệu dưới dạng mã để đề xuất, review và lưu lịch sử ADR bằng Git"
      - "Chọn ADR đi cùng pull request mã nguồn hoặc pull request riêng theo thời điểm quyết định"
      - "Viết mô tả pull request nêu câu hỏi quyết định, phạm vi ảnh hưởng và ý kiến cần nhận"
      - "Thiết lập người review và quyền sở hữu thư mục ADR theo trách nhiệm của nhóm"
      - "Xử lý xung đột nội dung, trùng mã ADR và thay đổi song song trên nhiều nhánh"
      - "Kiểm tra trong CI các mục bắt buộc, liên kết, mã trùng và quy ước trạng thái"
      - "Đánh giá công cụ tạo ADR, kiểm tra Markdown và dựng mục lục theo nhu cầu repository"
      - "Sử dụng diff và lịch sử Git để xem ai thay đổi lập luận, trạng thái và bằng chứng"
  - level1: "Triển khai và kiểm chứng"
    level2:
      - "Chuyển hệ quả của ADR thành công việc triển khai với chủ sở hữu và tiêu chí hoàn thành"
      - "Xác định tiêu chí kiểm chứng lựa chọn dựa trên mục tiêu chất lượng và giả định ban đầu"
      - "Liên kết quyết định với kiểm thử, chỉ số vận hành và bằng chứng sau triển khai"
      - "Ghi kế hoạch chuyển đổi, tương thích và hoàn tác khi quyết định tác động hệ thống đang chạy"
      - "Theo dõi chênh lệch giữa kiến trúc đã quyết định và hiện trạng mã nguồn hoặc hạ tầng"
      - "Phân biệt sai lệch triển khai cần sửa với bối cảnh mới cần ra quyết định lại"
      - "Đánh giá kết quả sau triển khai và ghi lại hệ quả ngoài dự kiến"
      - "Đóng vòng kiểm chứng bằng cập nhật bằng chứng hoặc đề xuất ADR thay thế"
  - level1: "Bảo trì kho ADR"
    level2:
      - "Phân công người phụ trách và chu kỳ rà soát cho các nhóm quyết định quan trọng"
      - "Kích hoạt rà soát khi có sự cố, thay đổi yêu cầu, công nghệ hoặc tổ chức nhóm"
      - "Kiểm tra ADR thiếu chủ sở hữu, quá hạn xem xét hoặc không còn khớp với hiện trạng"
      - "Rà soát mục lục, trạng thái và chuỗi thay thế để người đọc tìm đúng quyết định hiện hành"
      - "Bổ sung ADR hồi cứu từ mã nguồn và lịch sử thay đổi mà không suy đoán động cơ đã mất"
      - "Phát hiện bản ghi trùng lặp, thiếu phương án, thiếu hệ quả hoặc chỉ chứa kết luận"
      - "Lưu trữ ADR hết hiệu lực với lịch sử và liên kết còn truy cập được"
      - "Đánh giá chất lượng kho ADR qua khả năng tìm kiếm, giải thích và sử dụng lại quyết định"
  - level1: "Cộng tác và áp dụng"
    level2:
      - "Khởi động thói quen viết ADR bằng một nhóm nhỏ và các quyết định đang có nhu cầu thực tế"
      - "Đưa ADR vào quy trình thiết kế, review mã và hoàn thành công việc của nhóm"
      - "Dùng ADR khi hướng dẫn thành viên mới để giải thích vì sao hệ thống có thiết kế hiện tại"
      - "Chia sẻ quyết định ảnh hưởng nhiều nhóm và thống nhất nơi tiếp nhận phản hồi"
      - "Tổ chức phiên đọc ADR để cập nhật hiểu biết chung và phát hiện giả định đã thay đổi"
      - "Giảm chi phí ghi chép bằng mẫu vừa đủ, ví dụ tốt và trách nhiệm rõ ràng"
      - "Nhận diện dấu hiệu ADR bị bỏ quên, viết cho đủ số lượng hoặc trở thành rào cản phê duyệt"
      - "Đo hiệu quả qua thời gian tìm lý do quyết định, chất lượng review và mức giảm tranh luận lặp lại"
  - level1: "Bảo mật và tuân thủ"
    level2:
      - "Xác định thông tin nhạy cảm trong bối cảnh, phương án và bằng chứng của ADR"
      - "Tránh đưa thông tin xác thực, dữ liệu cá nhân và chi tiết khai thác vào repository không phù hợp"
      - "Phân quyền đọc và review ADR theo mức nhạy cảm và nhu cầu tham gia quyết định"
      - "Tách phụ lục hạn chế truy cập và giữ phần lập luận cần thiết trong bản ghi chung"
      - "Ghi nguồn yêu cầu tuân thủ và người xác nhận thay vì khẳng định đáp ứng khi chưa có bằng chứng"
      - "Liên kết quyết định bảo mật với phân tích mối đe dọa, kiểm soát và bằng chứng kiểm tra"
      - "Chuẩn bị chuỗi truy vết từ yêu cầu đến phê duyệt và triển khai để hỗ trợ kiểm toán"
      - "Xử lý thông tin nhạy cảm đã lộ trong ADR theo quy trình sự cố và quản lý lịch sử Git"
  - level1: "Thực hành ADR"
    level2:
      - "Phân tích một ADR hoàn chỉnh và chỉ ra quan hệ giữa bối cảnh, phương án, đánh đổi và hệ quả"
      - "Viết ADR lựa chọn cơ sở dữ liệu với ràng buộc nhất quán, truy vấn và năng lực vận hành"
      - "Viết ADR giao tiếp đồng bộ hay bất đồng bộ với yêu cầu độ trễ và khả năng chịu lỗi"
      - "Viết ADR xác định ranh giới mô-đun và quy tắc phụ thuộc dựa trên nhu cầu thay đổi"
      - "Viết ADR cho kế hoạch chuyển đổi hệ thống với giai đoạn triển khai và phương án hoàn tác"
      - "Review và sửa một ADR thiếu bằng chứng, phương án đối chiếu hoặc hệ quả tiêu cực"
      - "Thực hành chấp nhận, bác bỏ và thay thế ADR khi xuất hiện bằng chứng mới"
      - "Hoàn thiện kho ADR mẫu với mục lục, pull request, liên kết mã nguồn và tiêu chí đánh giá chất lượng"
