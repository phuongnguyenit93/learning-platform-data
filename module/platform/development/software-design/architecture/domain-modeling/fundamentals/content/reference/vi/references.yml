references:
  - title: "Martin Fowler - Domain Model"
    url: "https://martinfowler.com/eaaCatalog/domainModel.html"
    description: "Định nghĩa Domain Model và cách kết hợp dữ liệu với hành vi nghiệp vụ."
  - title: "Martin Fowler - Value Object"
    url: "https://martinfowler.com/eaaCatalog/valueObject.html"
    description: "Value Object và sự khác biệt giữa equality theo giá trị với identity."
  - title: "Martin Fowler - Bounded Context"
    url: "https://martinfowler.com/bliki/BoundedContext.html"
    description: "Ngôn ngữ chung, phạm vi nhất quán của domain model và ranh giới context."
  - title: "Martin Fowler - Anemic Domain Model"
    url: "https://martinfowler.com/bliki/AnemicDomainModel.html"
    description: "Vì sao mô hình chỉ có getter/setter không diễn đạt tốt quy tắc nghiệp vụ phức tạp."
  - title: "Eric Evans - DDD Reference"
    url: "https://www.domainlanguage.com/ddd/reference/"
    description: "Bản tóm lược chính thức các khái niệm Domain-Driven Design của Eric Evans."
  - title: "Microsoft - Designing a Domain Model"
    url: "https://learn.microsoft.com/en-us/dotnet/architecture/microservices/microservice-ddd-cqrs-patterns/microservice-domain-model"
    description: "Entities, Value Objects, Aggregates và Aggregate Root với ví dụ domain model."
  - title: "Microsoft - Tactical Domain-Driven Design"
    url: "https://learn.microsoft.com/en-us/azure/architecture/microservices/model/tactical-domain-driven-design"
    description: "Patterns thực hành Entity, Value Object, Aggregate, Domain Service và Domain Event."
  - title: "Microsoft - Domain Model Validations"
    url: "https://learn.microsoft.com/en-us/dotnet/architecture/microservices/microservice-ddd-cqrs-patterns/domain-model-layer-validations"
    description: "Cách thực thi invariants và bảo vệ trạng thái hợp lệ của Domain Entity."