menu:
  - level1: "Bản chất design pattern"
    level2:
      - "Design pattern là gì: vấn đề lặp lại, bối cảnh và giải pháp thiết kế"
      - "Bốn thành phần cốt lõi: tên mẫu, vấn đề, giải pháp và hệ quả"
      - "Phân biệt design pattern với thuật toán, idiom, thư viện và framework"
      - "Phân biệt mẫu thiết kế hướng đối tượng với mẫu kiến trúc và mẫu tích hợp"
      - "Lợi ích của ngôn ngữ thiết kế chung khi đọc mã và trao đổi trong nhóm"
      - "Điều kiện áp dụng, lực tác động và giới hạn của một mẫu thiết kế"
      - "Chi phí của lớp trung gian, mức gián tiếp và việc áp dụng mẫu quá sớm"
  - level1: "Nền tảng hướng đối tượng"
    level2:
      - "Đối tượng, trạng thái, hành vi và bất biến trong mô hình miền"
      - "Đóng gói dữ liệu và bảo vệ quy tắc nghiệp vụ qua hành vi"
      - "Trừu tượng hóa, hợp đồng và đa hình trong thiết kế cộng tác"
      - "Vai trò của interface, abstract class và concrete class"
      - "Kế thừa, composition và delegation trong tái sử dụng hành vi"
      - "Phân biệt quan hệ is-a, has-a và uses-a bằng tình huống Java"
      - "Cohesion, coupling và hướng phụ thuộc giữa các thành phần"
      - "Danh tính, tính bằng nhau, mutability và quyền sở hữu đối tượng"
  - level1: "Nhận diện vấn đề thiết kế"
    level2:
      - "Bắt đầu từ ca sử dụng, ràng buộc và thay đổi có khả năng xảy ra"
      - "Xác định phần ổn định và phần biến thiên trong yêu cầu"
      - "Phân bổ trách nhiệm và mô tả cộng tác giữa các đối tượng"
      - "Nhận diện phụ thuộc trực tiếp vào lớp cụ thể và cách khởi tạo"
      - "Nhận diện điều kiện phân nhánh theo loại, trạng thái và thuật toán"
      - "Nhận diện kế thừa phình to, lặp mã và lớp gánh quá nhiều trách nhiệm"
      - "Phân biệt triệu chứng trong mã với nguyên nhân trong mô hình thiết kế"
      - "Viết phát biểu vấn đề và tiêu chí thành công trước khi chọn mẫu"
  - level1: "Nguyên tắc thiết kế"
    level2:
      - "Program to an interface: phụ thuộc vào hợp đồng phù hợp"
      - "Ưu tiên composition khi cần thay đổi hành vi độc lập"
      - "Encapsulate what varies: cô lập điểm thay đổi có bằng chứng"
      - "SRP và OCP: trách nhiệm thay đổi và cơ chế mở rộng"
      - "LSP và ISP: khả năng thay thế và hợp đồng tối thiểu"
      - "DIP và dependency injection: đảo chiều phụ thuộc và truyền cộng tác viên"
      - "Law of Demeter và Tell, Don't Ask trong cộng tác đối tượng"
      - "Cân bằng DRY, KISS và YAGNI để tránh trừu tượng hóa quá mức"
  - level1: "Bản đồ GoF"
    level2:
      - "Ba nhóm GoF: Creational, Structural và Behavioral"
      - "Nhóm Creational: năm cách quản lý việc tạo đối tượng"
      - "Nhóm Structural: bảy cách tổ chức và kết nối đối tượng"
      - "Nhóm Behavioral: mười một cách phân phối hành vi và trách nhiệm"
      - "Phân biệt class pattern và object pattern theo cơ chế cộng tác"
      - "Đọc một mẫu theo intent, applicability, participants và collaborations"
      - "Liên kết cấu trúc, luồng gọi và consequences với vấn đề cần giải quyết"
  - level1: "UML cấu trúc"
    level2:
      - "Đọc class diagram: tên lớp, thuộc tính, phương thức và phạm vi truy cập"
      - "Biểu diễn interface, abstract class và phương thức trừu tượng"
      - "Phân biệt generalization và realization trong hệ kiểu"
      - "Phân biệt dependency và association qua cách đối tượng sử dụng nhau"
      - "Đọc aggregation và composition theo quyền sở hữu và vòng đời"
      - "Đọc multiplicity, role name và navigability trong quan hệ"
      - "Dùng object diagram để kiểm tra cấu trúc đối tượng lúc chạy"
      - "Ánh xạ vai trò trong UML sang lớp Java và phát hiện sơ đồ thiếu hợp đồng"
  - level1: "UML hành vi"
    level2:
      - "Đọc sequence diagram: lifeline, lời gọi và thứ tự cộng tác"
      - "Theo dõi khởi tạo, delegation, callback và giá trị trả về"
      - "Biểu diễn nhánh lựa chọn, vòng lặp và điều kiện bảo vệ"
      - "Dùng state diagram để mô tả trạng thái và chuyển trạng thái hợp lệ"
      - "Đọc activity diagram cho quy trình và điểm quyết định"
      - "Kết nối sequence diagram với class diagram và ca sử dụng"
      - "Kiểm tra sơ đồ với đường đi thành công, lỗi và trường hợp biên"
  - level1: "Hiện thực bằng Java"
    level2:
      - "Chuyển vai trò thiết kế thành package, interface và lớp triển khai"
      - "Dùng constructor để truyền dependency và bảo vệ trạng thái hợp lệ"
      - "Chọn interface, abstract class, default method hoặc composition"
      - "Dùng generics để biểu diễn hợp đồng và hạn chế ép kiểu"
      - "Dùng functional interface, lambda và method reference cho hành vi đơn giản"
      - "Quản lý collection, aliasing, defensive copy và tính bất biến"
      - "Thiết kế exception, vòng đời tài nguyên và trách nhiệm đóng tài nguyên"
      - "Phân biệt mô hình cộng tác với bảo đảm thread safety trong Java"
  - level1: "Factory Method và Abstract Factory"
    level2:
      - "Factory Method: cô lập bước tạo sản phẩm trong luồng xử lý của Creator"
      - "Factory Method: vai trò Creator, ConcreteCreator, Product và ConcreteProduct"
      - "Factory Method: đọc UML và hiện thực đa hình bằng Java"
      - "Factory Method: kiểm tra mở rộng sản phẩm và chi phí phân cấp Creator"
      - "Phân biệt Factory Method, simple factory và static factory method"
      - "Abstract Factory: tạo họ sản phẩm tương thích cho một bối cảnh"
      - "Abstract Factory: vai trò nhà máy và các nhóm sản phẩm trừu tượng"
      - "Abstract Factory: đọc UML và hiện thực họ sản phẩm bằng Java"
      - "Abstract Factory: thêm họ sản phẩm so với thêm loại sản phẩm"
      - "So sánh hai mẫu qua bài toán đổi giao diện hoặc bộ kết nối"
  - level1: "Builder và Prototype"
    level2:
      - "Builder: tách quy trình dựng đối tượng khỏi biểu diễn kết quả"
      - "Builder: vai trò Builder, ConcreteBuilder, Product và Director tùy chọn"
      - "Builder: đọc UML và xây dựng đối tượng nhiều bước bằng Java"
      - "Builder: kiểm tra dữ liệu bắt buộc, bất biến và thời điểm tạo kết quả"
      - "Phân biệt GoF Builder, fluent API và builder cho tham số tùy chọn"
      - "Prototype: tạo đối tượng từ mẫu cấu hình sẵn"
      - "Prototype: đọc UML và hiện thực sao chép bằng copy constructor hoặc factory"
      - "Prototype: shallow copy, deep copy, đồ thị tham chiếu và giới hạn của clone"
      - "So sánh Builder, Prototype và factory theo nguồn dữ liệu khởi tạo"
  - level1: "Singleton"
    level2:
      - "Ý định của Singleton và phạm vi một instance cần xác định"
      - "Vai trò, UML và cách kiểm soát quyền khởi tạo trong Java"
      - "So sánh eager initialization, holder idiom và enum singleton"
      - "Lazy initialization, đồng bộ hóa và yêu cầu safe publication"
      - "Tác động của class loader, serialization và reflection theo cách triển khai"
      - "Global state, dependency ẩn và khó khăn khi kiểm thử"
      - "So sánh Singleton với vòng đời đối tượng do dependency injection quản lý"
  - level1: "Adapter và Facade"
    level2:
      - "Adapter: chuyển đổi hợp đồng không tương thích thành giao diện client cần"
      - "Adapter: vai trò Target, Adapter, Adaptee và luồng delegation trong UML"
      - "Adapter: hiện thực object adapter và chuyển đổi dữ liệu hoặc lỗi bằng Java"
      - "Adapter: giới hạn của class adapter và tác động của kế thừa trong Java"
      - "Facade: cung cấp lối vào đơn giản cho một subsystem"
      - "Facade: đọc UML và điều phối các thành phần qua API Java"
      - "Facade: giữ ranh giới subsystem và tránh gom toàn bộ nghiệp vụ vào một lớp"
      - "So sánh Adapter và Facade theo mục tiêu tương thích và đơn giản hóa"
  - level1: "Bridge và Decorator"
    level2:
      - "Bridge: tách hai chiều biến thiên độc lập khỏi phân cấp kế thừa"
      - "Bridge: vai trò Abstraction, RefinedAbstraction và Implementor trong UML"
      - "Bridge: kết hợp biến thể nghiệp vụ và nền tảng triển khai bằng Java"
      - "Bridge: chi phí của lớp trừu tượng và điều kiện thực sự cần hai chiều mở rộng"
      - "Decorator: bổ sung trách nhiệm bằng chuỗi đối tượng bọc"
      - "Decorator: vai trò Component, ConcreteComponent và Decorator trong UML"
      - "Decorator: hiện thực lớp bọc Java và bảo toàn hợp đồng của component"
      - "Decorator: thứ tự bọc, danh tính đối tượng và luồng ngoại lệ"
      - "So sánh Bridge, Decorator và kế thừa qua điểm thay đổi"
  - level1: "Composite và Flyweight"
    level2:
      - "Composite: thao tác thống nhất trên phần tử đơn và cấu trúc cây"
      - "Composite: vai trò Component, Leaf và Composite trong UML"
      - "Composite: duyệt cây và tổng hợp kết quả bằng Java"
      - "Composite: cân bằng giao diện thống nhất với thao tác chỉ có ở nút chứa"
      - "Composite: quyền sở hữu nút, chu trình và thay đổi cấu trúc khi duyệt"
      - "Flyweight: chia sẻ dữ liệu nội tại giữa nhiều đối tượng logic"
      - "Flyweight: đọc UML và tách intrinsic state khỏi extrinsic state"
      - "Flyweight: hiện thực factory, khóa tra cứu và đối tượng bất biến bằng Java"
      - "Flyweight: đo lợi ích bộ nhớ và chi phí tra cứu, vòng đời, đồng bộ"
  - level1: "Proxy"
    level2:
      - "Ý định kiểm soát truy cập qua một đối tượng đại diện"
      - "Vai trò Subject, RealSubject và Proxy trong UML"
      - "Hiện thực proxy thủ công bằng Java và giữ hợp đồng của Subject"
      - "Virtual proxy, protection proxy và remote proxy qua tình huống cụ thể"
      - "Dynamic proxy với interface trong Java và vai trò của InvocationHandler"
      - "Lazy loading, lỗi từ xa, danh tính và chi phí lời gọi gián tiếp"
      - "Phân biệt Proxy, Decorator và Adapter theo mục đích đối tượng bọc"
  - level1: "Strategy và State"
    level2:
      - "Strategy: thay thế thuật toán qua một hợp đồng hành vi"
      - "Strategy: vai trò Context và các chiến lược trong UML"
      - "Strategy: hiện thực lớp hoặc lambda cho chính sách tính phí bằng Java"
      - "Strategy: chọn thuật toán và quản lý dữ liệu đầu vào, dependency"
      - "State: phân phối hành vi theo trạng thái hiện tại của đối tượng"
      - "State: vai trò Context, State và ConcreteState trong UML"
      - "State: hiện thực chuyển trạng thái và bảo vệ bất biến bằng Java"
      - "State: xác định nơi sở hữu chuyển trạng thái và xử lý chuyển không hợp lệ"
      - "So sánh Strategy, State, enum và nhánh điều kiện theo độ phức tạp"
  - level1: "Template Method"
    level2:
      - "Ý định cố định khung thuật toán và cho phép thay đổi từng bước"
      - "Vai trò AbstractClass, ConcreteClass và luồng gọi trong UML"
      - "Hiện thực template method, primitive operation và hook bằng Java"
      - "Quy định bước bắt buộc, bước tùy chọn và thứ tự thực thi"
      - "Bảo vệ bất biến và hạn chế override bằng phạm vi truy cập hoặc final"
      - "Chi phí kế thừa và rủi ro phụ thuộc chi tiết lớp cha"
      - "So sánh Template Method với Strategy và callback trong cùng quy trình"
  - level1: "Observer và Mediator"
    level2:
      - "Observer: thông báo thay đổi từ Subject đến nhiều Observer"
      - "Observer: đọc UML đăng ký, hủy đăng ký và phát thông báo"
      - "Observer: hiện thực listener bằng Java với dữ liệu sự kiện rõ ràng"
      - "Observer: push, pull, thứ tự thông báo và thay đổi danh sách khi callback"
      - "Observer: vòng đời đăng ký, memory leak, lỗi listener và tái nhập"
      - "Mediator: gom quy tắc phối hợp giữa các colleague"
      - "Mediator: đọc UML và hiện thực luồng điều phối bằng Java"
      - "Mediator: giảm liên kết chéo và kiểm soát nguy cơ lớp điều phối phình to"
      - "So sánh Observer, Mediator và publish-subscribe theo quan hệ và cách truyền tin"
  - level1: "Command và Chain of Responsibility"
    level2:
      - "Command: biến yêu cầu thành đối tượng mang hành vi và dữ liệu"
      - "Command: vai trò Invoker, Command, Receiver và Client trong UML"
      - "Command: hiện thực gọi lệnh, hàng đợi đơn giản và macro bằng Java"
      - "Command: thiết kế undo với trạng thái cần lưu và thao tác không thể đảo ngược"
      - "Command: đánh giá vòng đời lệnh, lỗi thực thi và chi phí lưu lịch sử"
      - "Chain of Responsibility: chuyển yêu cầu qua chuỗi handler"
      - "Chain of Responsibility: đọc UML và lắp ráp chuỗi xử lý bằng Java"
      - "Chain of Responsibility: thứ tự, điều kiện dừng và yêu cầu không được xử lý"
      - "So sánh Command, Chain of Responsibility và pipeline theo luồng trách nhiệm"
  - level1: "Iterator và Visitor"
    level2:
      - "Iterator: tách cách duyệt khỏi cấu trúc lưu trữ"
      - "Iterator: vai trò Aggregate, Iterator và các lớp cụ thể trong UML"
      - "Iterator: hiện thực Iterable và Iterator cho collection riêng trong Java"
      - "Iterator: trạng thái duyệt, phần tử cuối và thay đổi collection khi duyệt"
      - "Phân biệt Iterator, vòng lặp for-each và Stream trong Java"
      - "Visitor: thêm phép toán trên cấu trúc đối tượng có loại phần tử ổn định"
      - "Visitor: đọc UML accept, visit và mô phỏng double dispatch trong Java"
      - "Visitor: chi phí khi thêm phép toán so với thêm loại phần tử"
      - "Kết hợp Composite, Iterator và Visitor khi duyệt cây và thực hiện thao tác"
  - level1: "Memento"
    level2:
      - "Ý định lưu và khôi phục trạng thái mà giữ ranh giới đóng gói"
      - "Vai trò Originator, Memento và Caretaker trong UML"
      - "Hiện thực snapshot bất biến và khôi phục đối tượng bằng Java"
      - "Xác định phạm vi snapshot, deep copy và tính nhất quán của trạng thái"
      - "Quản lý lịch sử, giới hạn bộ nhớ và trạng thái đã lỗi thời"
      - "So sánh Memento, Command undo và lưu trữ bền vững"
  - level1: "Interpreter"
    level2:
      - "Ý định biểu diễn ngữ pháp nhỏ bằng cấu trúc các biểu thức"
      - "Vai trò AbstractExpression, TerminalExpression, NonterminalExpression và Context"
      - "Đọc UML và xây dựng cây biểu thức cho một ngôn ngữ quy tắc nhỏ"
      - "Hiện thực diễn giải bằng Java với context và hợp đồng kết quả"
      - "Phân biệt xây cây cú pháp, phân tích cú pháp và diễn giải biểu thức"
      - "Giới hạn về độ lớn ngữ pháp, hiệu năng và lựa chọn thư viện parser"
  - level1: "So sánh các mẫu"
    level2:
      - "So sánh nhóm khởi tạo theo thời điểm tạo, cấu hình và khả năng mở rộng"
      - "Factory Method và Template Method: quan hệ giữa bước tạo và khung thuật toán"
      - "Adapter, Decorator và Proxy: cấu trúc bọc giống nhau, mục đích khác nhau"
      - "Facade và Mediator: ranh giới subsystem và quy tắc phối hợp"
      - "Bridge và Strategy: hai chiều biến thiên và thuật toán có thể thay thế"
      - "Strategy và State: cách chọn hành vi và nơi quyết định chuyển đổi"
      - "Template Method và Strategy: kế thừa so với composition"
      - "Observer và Chain of Responsibility: phát thông báo và chuyển quyền xử lý"
      - "Visitor và đa hình thông thường: nơi đặt phép toán và hướng mở rộng"
  - level1: "Phối hợp các mẫu"
    level2:
      - "Kết hợp Abstract Factory, Factory Method và Prototype trong khởi tạo"
      - "Dùng Builder để lắp ráp cấu trúc Composite"
      - "Kết hợp Composite và Decorator khi tổ chức thành phần"
      - "Kết hợp Command và Memento cho lịch sử thao tác và undo"
      - "Kết hợp State và Observer để phản ứng với thay đổi trạng thái"
      - "Dùng Facade làm điểm vào cho subsystem có nhiều mẫu cộng tác"
      - "Theo dõi trách nhiệm và dependency khi nhiều mẫu cùng xuất hiện"
  - level1: "Lựa chọn giải pháp"
    level2:
      - "Chuyển yêu cầu thành tiêu chí lựa chọn và kịch bản thay đổi"
      - "Xác định trục biến thiên về khởi tạo, cấu trúc hoặc hành vi"
      - "Xây dựng phương án đơn giản bằng hàm, điều kiện hoặc composition"
      - "So sánh các mẫu ứng viên theo hợp đồng và mức phù hợp với bối cảnh"
      - "Ước lượng số lớp, mức gián tiếp và gánh nặng đọc hiểu"
