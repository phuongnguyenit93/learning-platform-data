menu:
  - level1: "Tổng quan"
    level2:
      - "Ý định của Mediator và bài toán điều phối tương tác giữa các đối tượng"
      - "Vị trí của Mediator trong nhóm mẫu thiết kế hành vi"
      - "Từ mạng phụ thuộc chéo đến giao tiếp thông qua thành phần trung gian"
      - "Phân biệt logic điều phối với hành vi nghiệp vụ của từng đối tượng"
      - "Lợi ích, giới hạn và điều kiện áp dụng Mediator"
      - "Thuật ngữ Mediator, ConcreteMediator, Colleague và ConcreteColleague"
  - level1: "Nhận diện vấn đề"
    level2:
      - "Dấu hiệu nhiều đối tượng biết nhau và gọi trực tiếp lẫn nhau"
      - "Phát hiện phụ thuộc vòng và thay đổi lan truyền khi thêm cộng tác viên"
      - "Nhận diện quy tắc tương tác phân tán trong nhiều lớp"
      - "Lập bản đồ quan hệ, luồng gọi và điểm quyết định điều phối"
      - "Đánh giá khó khăn khi kiểm thử hoặc tái sử dụng một đối tượng riêng lẻ"
      - "Xác định phạm vi cộng tác và các quy tắc nên tập trung"
      - "Trường hợp tương tác đơn giản chưa cần đưa vào Mediator"
  - level1: "Cấu trúc mẫu"
    level2:
      - "Vai trò của giao diện Mediator và lớp điều phối cụ thể"
      - "Vai trò của Colleague và cách giữ tham chiếu đến Mediator"
      - "Chiều phụ thuộc giữa hợp đồng, thành phần cộng tác và bộ điều phối"
      - "Biểu diễn cấu trúc bằng sơ đồ lớp UML"
      - "Biểu diễn một kịch bản cộng tác bằng sơ đồ tuần tự"
      - "So sánh cấu trúc trước và sau khi áp dụng Mediator"
      - "Một Mediator cho một phạm vi cộng tác và khả năng có nhiều thể hiện"
  - level1: "Hợp đồng cộng tác"
    level2:
      - "Thiết kế giao diện theo ý định nghiệp vụ thay vì thao tác nội bộ"
      - "Chọn phương thức chuyên biệt hoặc một điểm tiếp nhận thông báo chung"
      - "Mô hình hóa người gửi, người nhận và loại thông báo"
      - "Dùng enum, lớp giá trị hoặc record để biểu diễn dữ liệu thông báo"
      - "Phân biệt yêu cầu thực hiện, thông báo sự kiện và kết quả phản hồi"
      - "Quy định dữ liệu bắt buộc, giá trị không hợp lệ và thông báo không hỗ trợ"
      - "Xác định điều kiện trước, điều kiện sau và bất biến của tương tác"
      - "Thay đổi hợp đồng và giới hạn phụ thuộc của cộng tác viên vào Mediator"
  - level1: "Thiết kế tương tác"
    level2:
      - "Chuyển yêu cầu nghiệp vụ thành bảng quy tắc cộng tác"
      - "Định tuyến một người gửi đến một hoặc nhiều người nhận"
      - "Quy định thứ tự xử lý và điều kiện kích hoạt từng bước"
      - "Phân chia trách nhiệm giữa Mediator và các đối tượng tham gia"
      - "Tránh vòng lặp thông báo và xử lý lời gọi tái nhập"
      - "Phân biệt luồng điều khiển với luồng dữ liệu qua Mediator"
      - "Xử lý yêu cầu lặp, yêu cầu đến sai thứ tự và thông báo không còn phù hợp"
      - "Tách các nhóm quy tắc độc lập khi phạm vi điều phối mở rộng"
  - level1: "Triển khai Java"
    level2:
      - "Xây dựng ví dụ Java tối thiểu với giao diện Mediator và hai Colleague"
      - "Cài đặt ConcreteMediator để tập trung quy tắc tương tác"
      - "Chọn giao diện Colleague, lớp cơ sở hoặc thành phần độc lập"
      - "Truyền Mediator qua constructor và xử lý việc khởi tạo quan hệ hai chiều"
      - "Đăng ký, hủy đăng ký và tra cứu cộng tác viên bằng collection"
      - "Thiết kế thông báo có kiểu dữ liệu rõ ràng và hạn chế ép kiểu"
      - "Giữ dữ liệu truyền đi bất biến và đóng gói trạng thái nội bộ"
      - "Quy ước giá trị trả về, ngoại lệ và kết quả xử lý"
      - "Tổ chức package và chương trình chạy thử cho một kịch bản hoàn chỉnh"
  - level1: "Ví dụ phòng chat"
    level2:
      - "Phân tích phụ thuộc trực tiếp giữa những người dùng trong phòng chat"
      - "Thiết kế ChatRoomMediator, người dùng và thông điệp"
      - "Quản lý tham gia, rời phòng và định danh người dùng"
      - "Điều phối tin nhắn riêng và tin nhắn gửi toàn phòng"
      - "Quy định có nhận lại tin nhắn của chính người gửi hay không"
      - "Xử lý người nhận không tồn tại và người dùng chưa đăng ký"
      - "Triển khai Java và theo dõi chuỗi lời gọi của một lượt gửi tin"
      - "Đánh giá thay đổi cần thiết khi bổ sung quy tắc chặn hoặc lọc tin"
  - level1: "Ví dụ biểu mẫu"
    level2:
      - "Nhận diện phụ thuộc giữa ô nhập, hộp chọn và nút gửi"
      - "Thiết kế DialogMediator và hợp đồng tương tác của các thành phần giao diện"
      - "Điều phối trạng thái bật tắt và hiển thị theo lựa chọn của người dùng"
      - "Kết hợp kiểm tra dữ liệu với điều kiện cho phép gửi biểu mẫu"
      - "Ngăn vòng lặp khi cập nhật một trường làm phát sinh sự kiện mới"
      - "Tách quy tắc phối hợp giao diện khỏi logic xử lý nghiệp vụ"
      - "Triển khai Java với các thành phần giả lập để tập trung vào mẫu thiết kế"
      - "Kiểm tra các chuyển trạng thái và phản hồi khi dữ liệu không hợp lệ"
  - level1: "Ví dụ đặt hàng"
    level2:
      - "Xác định phạm vi điều phối giữa đơn hàng, tồn kho, thanh toán và thông báo"
      - "Thiết kế hợp đồng cho từng cộng tác viên và bộ điều phối đặt hàng"
      - "Mô tả luồng thành công và điều kiện chuyển sang bước tiếp theo"
      - "Xử lý hết hàng, thanh toán thất bại và lỗi gửi thông báo"
      - "Xác định hành động bù và nơi chịu trách nhiệm thực hiện"
      - "Triển khai ví dụ Java trong cùng tiến trình với các cổng phụ thuộc giả lập"
      - "Ngăn logic tính giá hoặc cập nhật tồn kho bị dồn vào Mediator"
      - "Đánh giá giới hạn của ví dụ khi chuyển sang hệ thống phân tán"
  - level1: "Trạng thái và vòng đời"
    level2:
      - "Phân định trạng thái do Mediator giữ và trạng thái thuộc cộng tác viên"
      - "Chọn Mediator có trạng thái hoặc không có trạng thái theo nhu cầu"
      - "Xác định vòng đời theo yêu cầu, phiên làm việc hoặc phạm vi ứng dụng"
      - "Đăng ký động, thay thế và tháo bỏ cộng tác viên"
      - "Duy trì bất biến khi thành phần tham gia xuất hiện hoặc rời đi"
      - "Giải phóng tham chiếu, tài nguyên và tránh rò rỉ bộ nhớ"
      - "Khôi phục hoặc đặt lại trạng thái sau khi một luồng cộng tác kết thúc"
  - level1: "Xử lý lỗi"
    level2:
      - "Phân loại lỗi dữ liệu, lỗi nghiệp vụ và lỗi hạ tầng"
      - "Quy định dừng sớm hoặc tiếp tục khi một cộng tác viên thất bại"
      - "Biểu diễn và báo cáo kết quả thành công một phần"
      - "Chọn nơi bắt ngoại lệ và giữ lại nguyên nhân gốc"
      - "Thiết kế retry có giới hạn gắn với tính lũy đẳng"
      - "Xác định ranh giới giao dịch và trách nhiệm hoàn tác"
      - "Phân biệt rollback trong giao dịch với hành động bù ở nhiều bước"
      - "Truyền trạng thái lỗi về người khởi tạo mà không làm lộ chi tiết nội bộ"
  - level1: "Đồng thời và bất đồng bộ"
    level2:
      - "Phân biệt Mediator đồng bộ và Mediator xử lý bất đồng bộ"
      - "Đánh giá an toàn luồng của Mediator và các cộng tác viên"
      - "Bảo vệ đăng ký thành viên và trạng thái dùng chung trước race condition"
      - "Chọn thứ tự xử lý khi nhiều yêu cầu đến cùng lúc"
      - "Tránh deadlock khi giữ khóa và gọi sang đối tượng cộng tác"
      - "Sử dụng ExecutorService để tách luồng thực thi khi cần"
      - "Kết hợp CompletableFuture để tổng hợp kết quả và lỗi"
      - "Quy định timeout, hủy tác vụ và phản hồi đến muộn"
      - "Giới hạn hàng đợi và áp lực xử lý khi lưu lượng vượt khả năng đáp ứng"
  - level1: "Kiểm thử"
    level2:
      - "Lập ma trận kiểm thử từ quy tắc và kịch bản cộng tác"
      - "Kiểm thử đơn vị Mediator bằng cộng tác viên giả lập"
      - "Kiểm thử Colleague qua hợp đồng Mediator thay cho đối tượng cụ thể"
      - "Xác minh người nhận, dữ liệu, số lần gọi và thứ tự có ý nghĩa nghiệp vụ"
      - "Bao phủ nhánh lỗi, thành viên không tồn tại và kết quả một phần"
      - "Kiểm thử tái nhập, thông báo lặp và bất biến trạng thái"
      - "Kiểm thử đồng thời và bất đồng bộ bằng cơ chế đồng bộ có kiểm soát"
      - "Kiểm thử tích hợp cho toàn bộ luồng cộng tác trong Java"
      - "Tránh kiểm thử bám chặt chi tiết cài đặt hoặc chỉ lặp lại mã điều phối"
  - level1: "Refactor sang Mediator"
    level2:
      - "Khảo sát mã hiện có và xác định cụm đối tượng phụ thuộc chéo"
      - "Ghi nhận hành vi hiện tại bằng kiểm thử trước khi di chuyển logic"
      - "Tách hợp đồng tối thiểu cho các điểm cộng tác"
      - "Di chuyển từng quy tắc điều phối vào Mediator"
      - "Thay lời gọi trực tiếp bằng tương tác qua hợp đồng trung gian"
      - "Xử lý phụ thuộc vòng trong quá trình khởi tạo và tiêm phụ thuộc"
      - "Loại bỏ tham chiếu dư thừa và xác minh hành vi sau từng bước"
      - "So sánh độ liên kết, khả năng thay đổi và độ phức tạp trước sau refactor"
  - level1: "So sánh các mẫu"
    level2:
      - "Mediator và Observer về nơi đặt quy tắc phản ứng và sự phụ thuộc"
      - "Mediator và Facade về phối hợp nội bộ và đơn giản hóa giao diện truy cập"
      - "Mediator và Command về điều phối tương tác và đóng gói yêu cầu"
      - "Mediator và Chain of Responsibility về chọn người xử lý và luồng chuyển tiếp"
      - "Mediator và State về điều phối cộng tác và hành vi theo trạng thái"
      - "Mediator và Strategy về luồng phối hợp và thuật toán có thể thay thế"
      - "Mediator và Event Bus về định tuyến sự kiện và chính sách cộng tác"
      - "Mediator và Controller hoặc Application Service về phạm vi trách nhiệm"
      - "Kết hợp Mediator với Observer hoặc Command khi có nhu cầu cụ thể"
  - level1: "Ranh giới kiến trúc"
    level2:
      - "Đặt Mediator ở tầng giao diện, ứng dụng hoặc miền theo loại tương tác"
      - "Giữ quy tắc nghiệp vụ cốt lõi trong đối tượng miền hoặc dịch vụ phù hợp"
      - "Áp dụng nguyên lý trách nhiệm đơn nhất và đảo ngược phụ thuộc"
      - "Tách bộ điều phối theo ca sử dụng hoặc nhóm cộng tác gắn kết"
      - "Dùng cổng giao tiếp để cách ly cơ sở dữ liệu và dịch vụ bên ngoài"
      - "Phân biệt Mediator trong tiến trình với broker truyền thông điệp"
      - "Đánh giá khác biệt với workflow engine và Saga khi xử lý luồng dài"
      - "Xác định phần mẫu thiết kế không tự giải quyết về giao dịch và độ tin cậy"
  - level1: "Tích hợp Java"
    level2:
      - "Lắp ghép Mediator và các cộng tác viên bằng Java thuần"
      - "Đăng ký thành phần qua factory hoặc bộ dựng cấu hình"
      - "Tiêm phụ thuộc trong Spring và chọn phạm vi bean phù hợp"
      - "Giải quyết phụ thuộc vòng bằng thiết kế đăng ký và phân tách hợp đồng"
      - "Phân biệt sự kiện ứng dụng Spring với quy tắc điều phối của Mediator"
      - "Tích hợp listener của giao diện Java và tuân thủ luồng cập nhật giao diện"
      - "Đánh giá bộ phân phối request và handler trước khi bổ sung thư viện"
  - level1: "Hiệu năng và quan sát"
    level2:
      - "Đánh giá chi phí gọi trung gian và tra cứu người nhận"
      - "Nhận diện nút thắt khi nhiều tương tác tập trung vào một Mediator"
      - "Đo độ trễ, thông lượng và thời gian chờ theo từng kịch bản"
      - "Theo dõi kích thước hàng đợi, số lỗi và số lần retry"
      - "Gắn mã tương quan để nối các bước của cùng một luồng cộng tác"
      - "Thiết kế log và trace để giải thích quyết định điều phối"
      - "Tối ưu dựa trên đo đạc và cân nhắc tách phạm vi điều phối"
  - level1: "Đánh đổi thiết kế"
    level2:
      - "Giảm liên kết giữa các cộng tác viên và tăng phụ thuộc vào hợp đồng Mediator"
      - "Tập trung quy tắc để dễ theo dõi và nguy cơ hình thành God Object"
      - "Tăng khả năng tái sử dụng cộng tác viên và chi phí thiết kế hợp đồng"
      - "Đơn giản hóa kiểm thử từng thành phần và mở rộng kiểm thử luồng phối hợp"
      - "Mở rộng thành phần tham gia và mức thay đổi cần thiết trong Mediator"
      - "Giữ tính minh bạch của luồng gọi khi điều phối chuyển sang bất đồng bộ"
      - "Đánh giá trách nhiệm, độ gắn kết, độ liên kết và chi phí vận hành"
      - "Tiêu chí lựa chọn Mediator hoặc giữ giao tiếp trực tiếp"
  - level1: "Lỗi thiết kế thường gặp"
    level2:
      - "Mediator ôm toàn bộ nghiệp vụ và biết quá nhiều chi tiết nội bộ"
      - "Colleague vẫn gọi chéo nhau khiến quy tắc tồn tại ở nhiều nơi"
      - "Giao diện notify tổng quát lạm dụng chuỗi, Object và ép kiểu"
      - "Dùng Mediator như Service Locator hoặc kho trạng thái toàn cục"
      - "Ép Mediator thành singleton khi các phiên cần trạng thái độc lập"
      - "Chuỗi thông báo đệ quy, phát lặp và tác dụng phụ khó truy vết"
      - "Nuốt ngoại lệ, retry không giới hạn và bỏ qua thất bại một phần"
      - "Áp dụng mẫu cho mọi tương tác hoặc tạo nhiều tầng trung gian dư thừa"
  - level1: "Bài tập thực hành"
    level2:
      - "Vẽ mạng phụ thuộc và chọn phạm vi Mediator cho mã cho sẵn"
      - "Cài đặt phòng chat Java có nhắn riêng, phát tin và quản lý thành viên"
      - "Xây dựng bộ điều phối biểu mẫu với các quy tắc phụ thuộc giữa trường"
      - "Mô phỏng đặt hàng có lỗi thanh toán và hành động bù"
      - "Thay thông báo dùng chuỗi bằng hợp đồng có kiểu dữ liệu rõ ràng"
      - "Refactor ví dụ gọi chéo và chứng minh hành vi được giữ nguyên"
      - "Bổ sung xử lý bất đồng bộ cùng kiểm thử timeout và yêu cầu lặp"
      - "Đánh giá một Mediator quá lớn và đề xuất cách chia trách nhiệm"
  - level1: "Checklist áp dụng"
    level2:
      - "Xác nhận bài toán có quy tắc cộng tác đủ phức tạp để cần trung gian"
      - "Rà soát vai trò, hợp đồng và ranh giới của từng thành phần"
      - "Kiểm tra luồng thành công, luồng lỗi và các bất biến"
      - "Xác minh vòng đời, an toàn luồng và khả năng quan sát"
      - "Đối chiếu kiểm thử và bằng chứng cải thiện khả năng thay đổi"
      - "Ghi lại đánh đổi và điều kiện cần tách hoặc loại bỏ Mediator"
