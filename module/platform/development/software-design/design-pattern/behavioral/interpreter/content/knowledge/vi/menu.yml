menu:
  - level1: "Tổng quan"
    level2:
      - "Ý định của mẫu Interpreter và bài toán diễn giải một ngôn ngữ nhỏ"
      - "Vị trí của Interpreter trong nhóm mẫu thiết kế hành vi GoF"
      - "Từ chuỗi đầu vào đến token, cây biểu thức và kết quả đánh giá"
      - "Phân biệt grammar, lexer, parser, AST và evaluator"
      - "Mối liên hệ giữa quy tắc grammar và các lớp biểu thức"
      - "Lợi ích của việc biểu diễn quy tắc bằng các đối tượng có thể kết hợp"
      - "Chi phí xây dựng và bảo trì một ngôn ngữ chuyên biệt"
      - "Khi nên dùng Interpreter và những dấu hiệu nên chọn giải pháp khác"
  - level1: "Vai trò và cộng tác"
    level2:
      - "AbstractExpression và hợp đồng đánh giá biểu thức trong Java"
      - "TerminalExpression và cách đánh giá phần tử không có biểu thức con"
      - "NonterminalExpression và cách kết hợp các biểu thức con"
      - "Context và dữ liệu dùng chung trong một lần đánh giá"
      - "Client và trách nhiệm tạo, phân tích, tái sử dụng cây biểu thức"
      - "Luồng cộng tác giữa client, parser, AST, context và evaluator"
      - "Ánh xạ sơ đồ lớp GoF sang một mô hình Java tối thiểu"
      - "Tách trách nhiệm phân tích cú pháp khỏi thực thi ngữ nghĩa"
  - level1: "Phạm vi ngôn ngữ"
    level2:
      - "Xác định người viết quy tắc, người vận hành và người sử dụng kết quả"
      - "Chọn miền bài toán và giới hạn năng lực của DSL"
      - "Thiết kế cú pháp gần nghiệp vụ nhưng có ngữ nghĩa xác định"
      - "Xác định biến, toán tử, hàm và các kiểu kết quả được hỗ trợ"
      - "Chọn biểu thức thuần và quy định rõ các tác dụng phụ được phép"
      - "Quy định hành vi với dữ liệu thiếu, giá trị null và đầu vào sai"
      - "Xác định yêu cầu tương thích và phiên bản của ngôn ngữ"
      - "Xây bộ ví dụ hợp lệ, không hợp lệ và các trường hợp biên trước khi triển khai"
  - level1: "Thiết kế grammar"
    level2:
      - "Biểu diễn grammar bằng BNF và EBNF"
      - "Ký hiệu bắt đầu, terminal, nonterminal và luật sinh"
      - "Grammar cho literal, biến, lời gọi hàm và biểu thức có ngoặc"
      - "Độ ưu tiên và tính kết hợp của các toán tử"
      - "Phân tầng grammar cho toán tử một ngôi, nhân chia, cộng trừ và so sánh"
      - "Phân tầng grammar cho NOT, AND và OR"
      - "Phát hiện grammar mơ hồ qua những chuỗi có nhiều cách phân tích"
      - "Loại bỏ đệ quy trái và tách tiền tố chung khi dùng recursive descent"
      - "Đồng bộ grammar với đặc tả ngữ nghĩa và ví dụ chấp nhận"
  - level1: "Phân tích từ vựng"
    level2:
      - "Thiết kế TokenType, Token và vị trí nguồn trong Java"
      - "Nhận diện số, chuỗi, định danh, từ khóa và dấu phân cách"
      - "Xử lý khoảng trắng, chú thích và ký tự kết thúc đầu vào"
      - "Quy tắc nhận diện toán tử nhiều ký tự và nguyên tắc khớp dài nhất"
      - "Phân biệt dấu âm trong cú pháp với literal số"
      - "Escape trong chuỗi, Unicode và chính sách phân biệt chữ hoa chữ thường"
      - "Thông báo lỗi khi gặp ký tự lạ hoặc chuỗi chưa đóng"
      - "Giới hạn độ dài nguồn, literal và số lượng token"
  - level1: "Mô hình AST"
    level2:
      - "Phân biệt cây phân tích cú pháp với cây cú pháp trừu tượng"
      - "Thiết kế các node Literal, Variable, Unary, Binary và FunctionCall"
      - "Biểu diễn toán tử bằng enum và quan hệ giữa các node"
      - "Dùng interface, class, record hoặc sealed type theo phiên bản Java"
      - "Thiết kế AST bất biến và kiểm tra bất biến tại constructor"
      - "Lưu vị trí nguồn để liên kết lỗi thực thi với biểu thức ban đầu"
      - "Xây cây bằng tay để kiểm chứng mô hình trước khi viết parser"
      - "Duyệt cây, in cây và xuất lại biểu thức với dấu ngoặc phù hợp"
      - "Kiểm tra độ sâu, số node và tính hợp lệ của cây trước khi đánh giá"
  - level1: "Biểu thức terminal"
    level2:
      - "LiteralExpression cho số, chuỗi và giá trị boolean"
      - "VariableExpression và cơ chế tra cứu tên trong context"
      - "ConstantExpression và các hằng được ngôn ngữ cho phép"
      - "Quy định kiểu trả về của từng loại terminal"
      - "Xử lý biến chưa khai báo và giá trị không tồn tại"
      - "Phân biệt terminal của grammar với node lá trong AST"
      - "Kiểm thử terminal độc lập bằng context nhỏ và dữ liệu biên"
      - "Tránh để node lá tự truy cập cơ sở dữ liệu hoặc dịch vụ bên ngoài"
  - level1: "Biểu thức nonterminal"
    level2:
      - "UnaryExpression cho đổi dấu và phủ định logic"
      - "BinaryExpression cho số học, so sánh và kết hợp logic"
      - "Biểu thức điều kiện và nhánh đánh giá được lựa chọn"
      - "Lời gọi hàm có danh sách đối số và kiểm tra số lượng tham số"
      - "Thứ tự đánh giá các biểu thức con và ảnh hưởng tới kết quả"
      - "Short-circuit cho AND, OR và biểu thức điều kiện"
      - "Tổng hợp kết quả con và truyền lỗi lên biểu thức cha"
      - "Giữ các lớp biểu thức tập trung vào một trách nhiệm ngữ nghĩa"
  - level1: "Ngữ cảnh đánh giá"
    level2:
      - "Thiết kế EvaluationContext và giao diện truy cập biến có kiểm soát"
      - "Phân biệt môi trường tên biến, dữ liệu thực tế và cấu hình thực thi"
      - "Phạm vi biến, che khuất tên và quy tắc phân giải định danh"
      - "Đóng băng dữ liệu đầu vào cho một lần đánh giá nhất quán"
      - "Truyền đồng hồ, múi giờ và locale một cách tường minh"
      - "Đăng ký hàm theo danh sách cho phép và hợp đồng rõ ràng"
      - "Tách dữ liệu nghiệp vụ khỏi bộ đếm tài nguyên và trạng thái chẩn đoán"
      - "Tránh context toàn cục, trạng thái ẩn và phụ thuộc khó kiểm thử"
  - level1: "Kiểu và ngữ nghĩa"
    level2:
      - "Chọn mô hình giá trị cho boolean, số, chuỗi, ngày giờ và giá trị thiếu"
      - "Phân biệt lỗi cú pháp, lỗi phân giải tên, lỗi kiểu và lỗi đánh giá"
      - "Kiểm tra kiểu trước khi thực thi và kiểm tra động khi cần thiết"
      - "Quy định ép kiểu tường minh, ép kiểu ngầm và các phép toán bị cấm"
      - "Ngữ nghĩa so sánh bằng, so sánh thứ tự và tương thích kiểu"
      - "Thiết kế logic hai giá trị hoặc ba giá trị khi dữ liệu có thể thiếu"
      - "Quy định độ chính xác số, làm tròn, tràn số và chia cho không"
      - "Kiểu trả về, tính thuần và tính xác định của các hàm mở rộng"
      - "Tách kết quả đánh giá thành thành công, lỗi và trạng thái không xác định nếu cần"
  - level1: "Parser thủ công"
    level2:
      - "Xây parser recursive descent từ các tầng ưu tiên của grammar"
      - "Quản lý con trỏ token, lookahead và các thao tác match, consume, expect"
      - "Phân tích literal, định danh, ngoặc và lời gọi hàm"
      - "Phân tích toán tử một ngôi và các chuỗi toán tử nhị phân"
      - "Xây AST trực tiếp trong quá trình phân tích cú pháp"
      - "Bảo toàn tính kết hợp trái hoặc phải theo đặc tả"
      - "Yêu cầu đọc hết đầu vào và từ chối token dư"
      - "Đặt giới hạn đệ quy và trả lỗi có vị trí nguồn"
      - "Kiểm thử parser bằng cấu trúc cây mong đợi và các chuỗi lỗi"
  - level1: "Chiến lược parser"
    level2:
      - "So sánh recursive descent, Pratt parser và shunting-yard"
      - "Dùng Pratt parser khi có nhiều toán tử với binding power khác nhau"
      - "Dùng shunting-yard để chuyển biểu thức trung tố sang hậu tố"
      - "Khi nào grammar đủ phức tạp để cân nhắc công cụ sinh parser"
      - "Vai trò của ANTLR trong sinh lexer, parser và chuyển cây sang AST"
      - "Tách mô hình nghiệp vụ khỏi các kiểu dữ liệu do công cụ sinh ra"
      - "Cân đối khả năng mở rộng grammar, chất lượng lỗi và chi phí phụ thuộc"
      - "Chọn chiến lược khôi phục lỗi cho trình soạn thảo và từ chối lỗi khi thực thi"
  - level1: "Evaluator Java"
    level2:
      - "Xây API parse, validate và evaluate với hợp đồng riêng"
      - "Triển khai interpret trên node hoặc tách bộ đánh giá khỏi AST"
      - "Chọn kiểu trả về có cấu trúc thay cho Object và ép kiểu rải rác"
      - "Cài đặt đánh giá literal, biến, toán tử và lời gọi hàm"
      - "Bảo đảm đánh giá lười tại những toán tử yêu cầu short-circuit"
      - "Truyền context, vị trí nguồn và lỗi qua từng bước đánh giá"
      - "Giữ AST dùng lại được với nhiều bộ dữ liệu đầu vào"
      - "Cân nhắc duyệt lặp bằng stack khi cây sâu vượt khả năng đệ quy"
      - "Đóng gói evaluator thành thành phần độc lập để tích hợp ứng dụng"
  - level1: "Biểu thức số học"
    level2:
      - "Xây grammar và AST cho phép cộng, trừ, nhân, chia và dấu ngoặc"
      - "Theo dõi từng bước đánh giá để minh họa độ ưu tiên toán tử"
      - "Bổ sung biến số và hàm có số lượng đối số được kiểm tra"
      - "Chọn BigDecimal cho ví dụ tiền tệ và cấu hình làm tròn tường minh"
      - "Quy định phép chia, giá trị âm và số có độ lớn bất thường"
      - "Phân biệt so sánh giá trị số với so sánh biểu diễn hoặc scale"
      - "Tạo constant folding cho các cây con chỉ chứa hằng thuần"
      - "Kiểm chứng kết quả với dữ liệu thường gặp và các trường hợp biên"
  - level1: "Logic và điều kiện"
    level2:
      - "Xây các biểu thức AND, OR, NOT và toán tử so sánh"
      - "Thiết kế predicate cho dữ liệu khách hàng, đơn hàng và giao dịch"
      - "Biểu thức điều kiện lồng nhau và ảnh hưởng của dấu ngoặc"
      - "Short-circuit để tránh đánh giá nhánh không cần thiết hoặc không hợp lệ"
      - "Quy tắc contains, in và kiểm tra tập giá trị có giới hạn"
      - "Ngữ nghĩa cho chuỗi rỗng, null, thuộc tính thiếu và dữ liệu sai kiểu"
      - "So sánh ngày giờ với múi giờ và đồng hồ được truyền qua context"
      - "Trả lời vì sao một điều kiện đúng hoặc sai bằng dấu vết đánh giá"
      - "Kiểm thử bảng chân trị và những nhánh bắt buộc không được thực thi"
  - level1: "DSL nghiệp vụ"
    level2:
      - "Chuyển mô tả nghiệp vụ thành từ vựng, grammar và quy tắc ngữ nghĩa"
      - "Thiết kế DSL tính ưu đãi theo giá trị đơn hàng và nhóm khách hàng"
      - "Thiết kế DSL lọc đối tượng theo các thuộc tính được cho phép"
      - "Xác định độ ưu tiên và chính sách khi nhiều quy tắc cùng khớp"
      - "Đánh giá độc lập nhiều quy tắc và tổng hợp kết quả có thể giải thích"
      - "Chuẩn bị dữ liệu nghiệp vụ trước khi chạy evaluator để tránh I/O trong cây"
      - "Phân biệt việc tính ra quyết định với việc thực hiện hành động nghiệp vụ"
      - "Định danh, lưu trữ và gắn phiên bản cho tập quy tắc"
      - "Xây ví dụ đầu vào, kết quả và lời giải thích cho người viết quy tắc"
  - level1: "Lỗi và chẩn đoán"
    level2:
      - "Xây hệ phân loại lỗi cho lexer, parser, validation và evaluator"
      - "Thông báo token mong đợi, token nhận được và vị trí dòng cột"
      - "Chỉ ra biến chưa khai báo, hàm không tồn tại và đối số không hợp lệ"
      - "Đính kèm đoạn nguồn và đường đi tới node gây lỗi"
      - "Chọn dừng sớm hay thu thập nhiều lỗi ở từng giai đoạn"
      - "Phân biệt quy tắc cho kết quả false với quy tắc không thể đánh giá"
      - "Thiết kế mã lỗi ổn định và thông báo tiếng Việt dễ hiểu"
      - "Che dữ liệu nhạy cảm trong lỗi, log và nội dung chẩn đoán"
  - level1: "An toàn thực thi"
    level2:
      - "Xác định ranh giới tin cậy khi người dùng cung cấp biểu thức"
      - "Chỉ cho phép toán tử, hàm và thuộc tính đã được đăng ký"
      - "Ngăn truy cập reflection, lớp Java, hệ thống tệp, mạng và lệnh hệ điều hành"
      - "Giới hạn kích thước nguồn, số token, số node và độ sâu AST"
      - "Áp dụng ngân sách bước đánh giá, thời gian và kích thước kết quả"
      - "Thiết kế hủy hợp tác và hiểu giới hạn của timeout với mã không hợp tác"
      - "Cách ly thực thi ngoài tiến trình khi có phần mở rộng không đáng tin cậy"
      - "Kiểm soát biểu thức chính quy, tập dữ liệu lớn và hàm có chi phí cao"
      - "Cách ly context, quyền truy cập dữ liệu và cache giữa các tenant"
      - "Từ chối quy tắc lỗi theo chính sách rõ ràng và tránh thực thi chuỗi như mã Java"
  - level1: "Hiệu năng"
    level2:
      - "Phân tách chi phí tokenize, parse, validate và evaluate"
      - "Phân tích độ phức tạp theo số node và chi phí của từng toán tử"
      - "Parse một lần, kiểm tra một lần và đánh giá nhiều lần với context mới"
      - "Thiết kế cache AST có giới hạn dung lượng và chính sách loại bỏ"
      - "Tạo khóa cache theo nguồn, phiên bản grammar, cấu hình và phạm vi truy cập"
      - "Constant folding và rút gọn cây khi bảo toàn ngữ nghĩa và short-circuit"
      - "Memoization có điều kiện và rủi ro khi phụ thuộc context hoặc hàm có tác dụng phụ"
      - "Đo bằng JMH với warmup và tách từng giai đoạn xử lý"
      - "Xác định ngưỡng cân nhắc bytecode, thư viện biểu thức hoặc giải pháp khác"
  - level1: "Đồng thời và tài nguyên"
    level2:
      - "Chia sẻ AST bất biến giữa nhiều luồng đánh giá"
      - "Tạo EvaluationContext riêng cho từng yêu cầu và từng người dùng"
      - "Kiểm tra tính an toàn luồng của registry hàm và thành phần mở rộng"
      - "Đồng bộ cache và tránh tạo trùng AST khi tải cao"
      - "Quản lý bộ nhớ của AST, dữ liệu context và dấu vết đánh giá"
      - "Truyền deadline và tín hiệu hủy xuyên suốt quá trình thực thi"
      - "Đánh giá hàng loạt với giới hạn đồng thời và cơ chế điều tiết tải"
      - "Kiểm thử chạy song song, hủy tác vụ và dọn trạng thái sau lỗi"
  - level1: "Mở rộng ngôn ngữ"
    level2:
      - "Quy trình thêm toán tử từ grammar tới AST, evaluator và kiểm thử"
      - "Quy trình thêm hàm với chữ ký kiểu, giới hạn tài nguyên và tài liệu"
      - "Mở rộng kiểu dữ liệu và kiểm tra tương thích với toán tử hiện có"
      - "Đánh giá chi phí gia tăng số lớp khi grammar có nhiều luật"
      - "Cân nhắc thêm loại node mới so với thêm thao tác mới trên cây"
      - "Quản lý phiên bản grammar và ngữ nghĩa của các quy tắc đã lưu"
      - "Chuyển đổi quy tắc cũ và phát hiện thay đổi hành vi ngoài ý muốn"
      - "Thiết kế API mở rộng có kiểm soát thay vì cho phép thực thi mã tùy ý"
      - "Đặt giới hạn phạm vi để DSL không phát triển thành ngôn ngữ đa dụng"
  - level1: "Phối hợp mẫu thiết kế"
    level2:
      - "Composite cho cấu trúc cây biểu thức"
      - "Visitor cho đánh giá, kiểm tra kiểu, in cây và tối ưu AST"
      - "Strategy cho lựa chọn chính sách đánh giá hoặc chiến lược xử lý toán tử"
