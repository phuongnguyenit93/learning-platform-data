menu:
  - level1: "Tổng quan"
    level2:
      - "Bài toán một subject thay đổi và nhiều observer cần nhận thông báo"
      - "Ý định của Observer và quan hệ phụ thuộc một-nhiều"
      - "Các thuật ngữ subject, publisher, observer, subscriber và listener"
      - "Lợi ích của việc tách nơi phát sinh thay đổi khỏi nơi phản ứng"
      - "Dấu hiệu nên áp dụng Observer trong thiết kế ứng dụng"
      - "Giới hạn của Observer và trường hợp nên chọn cách gọi trực tiếp"
      - "Ví dụ xuyên suốt về thông báo thay đổi giá sản phẩm"
  - level1: "Cấu trúc mẫu"
    level2:
      - "Vai trò Subject và hợp đồng đăng ký, hủy đăng ký, thông báo"
      - "Vai trò Observer và hợp đồng nhận sự kiện"
      - "Trách nhiệm của ConcreteSubject và ConcreteObserver"
      - "Quan hệ giữa trạng thái nghiệp vụ và danh sách observer"
      - "Luồng tương tác từ đăng ký đến thay đổi trạng thái và callback"
      - "Sơ đồ lớp và sơ đồ tuần tự cho một lần phát thông báo"
      - "Thiết kế theo interface và nguyên tắc đảo ngược phụ thuộc"
  - level1: "Hợp đồng thông báo"
    level2:
      - "Xác định thay đổi nào tạo sự kiện và thời điểm được phép phát"
      - "Phân biệt thông báo đồng bộ và thông báo bất đồng bộ"
      - "Quy định thứ tự gọi observer và phạm vi bảo đảm thứ tự"
      - "Quy định đăng ký trùng và cách xác định cùng một observer"
      - "Ngữ nghĩa hủy đăng ký đối với callback đã bắt đầu hoặc đang chờ"
      - "Chính sách khi callback thất bại và khi không có observer"
      - "Giới hạn bảo đảm giao nhận, xử lý trùng và sự kiện có thể bị mất"
  - level1: "Thiết kế sự kiện"
    level2:
      - "Mô hình push, pull và kết hợp hai cách truyền dữ liệu thay đổi"
      - "Thiết kế đối tượng sự kiện bất biến và sử dụng record khi phù hợp"
      - "Lựa chọn giá trị cũ, giá trị mới, nguồn phát và thời điểm thay đổi"
      - "Định danh sự kiện, phiên bản trạng thái và thông tin liên kết luồng xử lý"
      - "Dùng kiểu tổng quát để bảo đảm an toàn kiểu cho listener"
      - "Sao chép dữ liệu cần thiết để tránh lộ trạng thái mutable của subject"
      - "Phân loại sự kiện và lọc đăng ký theo loại hoặc điều kiện"
      - "Tiến hóa cấu trúc dữ liệu sự kiện và duy trì tương thích hợp đồng"
  - level1: "Cài đặt Java"
    level2:
      - "Khai báo interface Observer và Subject cho ví dụ thay đổi giá"
      - "Cài đặt ConcreteSubject lưu trạng thái và danh sách observer"
      - "Đăng ký, hủy đăng ký và phát sự kiện trong phiên bản đồng bộ"
      - "Cập nhật trạng thái thành công trước khi tạo và gửi sự kiện"
      - "Cài đặt nhiều observer độc lập cho hiển thị, thống kê và cảnh báo"
      - "Dùng functional interface, lambda và method reference cho callback"
      - "Tách logic nghiệp vụ, quản lý đăng ký và cơ chế phân phối thông báo"
      - "Chạy ví dụ hoàn chỉnh và giải thích thứ tự kết quả nhận được"
  - level1: "Quản lý đăng ký"
    level2:
      - "Lựa chọn List, Set hoặc cấu trúc có khóa cho tập observer"
      - "So sánh nhận diện theo tham chiếu với equals và hashCode"
      - "Thiết kế đối tượng Subscription đại diện cho từng lần đăng ký"
      - "Hủy đăng ký nhiều lần an toàn và xử lý observer chưa được đăng ký"
      - "Đóng Subscription bằng AutoCloseable và try-with-resources"
      - "Đăng ký có điều kiện, đăng ký một lần và nhiều đăng ký cùng listener"
      - "Xác định hành vi khi đăng ký hoặc hủy đăng ký trong lúc thông báo"
  - level1: "Vòng đời observer"
    level2:
      - "Xác định bên sở hữu subject, observer và đối tượng Subscription"
      - "Gắn thời điểm đăng ký và hủy đăng ký với vòng đời thành phần"
      - "Nguyên nhân rò rỉ bộ nhớ do subject giữ tham chiếu mạnh đến observer"
      - "Giải phóng đăng ký khi đóng màn hình, dịch vụ hoặc tài nguyên"
      - "Đánh đổi khi dùng weak reference và cách dọn tham chiếu đã hết hiệu lực"
      - "Khởi tạo, dừng và đóng subject với hợp đồng vòng đời rõ ràng"
      - "Xử lý tác vụ thông báo còn chờ và đăng ký mới khi hệ thống đang đóng"
  - level1: "Trình tự thông báo"
    level2:
      - "Duyệt danh sách trực tiếp và duyệt ảnh chụp danh sách observer"
      - "Tự hủy đăng ký hoặc thêm listener mới từ bên trong callback"
      - "Phân biệt thứ tự đăng ký với thứ tự ưu tiên nghiệp vụ"
      - "Nhận diện reentrancy khi callback tiếp tục thay đổi subject"
      - "Ngăn vòng lặp thông báo giữa nhiều subject và observer"
      - "Chọn phát lồng nhau, xếp hàng hoặc gộp các thay đổi liên tiếp"
      - "Xác định observer đăng ký muộn có nhận trạng thái hiện tại hay không"
  - level1: "Nhất quán trạng thái"
    level2:
      - "Phân biệt ảnh chụp dữ liệu sự kiện với trạng thái hiện tại của subject"
      - "Giữ bất biến nghiệp vụ khi một thao tác cập nhật nhiều thuộc tính"
      - "Phát thông báo sau khi hoàn tất cập nhật thay vì lộ trạng thái trung gian"
      - "Sử dụng số phiên bản để nhận diện thông báo cũ hoặc sai thứ tự"
      - "Xử lý cập nhật không làm đổi giá trị và quyết định có phát sự kiện"
      - "Gộp nhiều thay đổi thành sự kiện theo lô và đánh đổi độ chi tiết"
      - "Phân biệt thông báo trong bộ nhớ với bảo đảm nhất quán giao dịch"
  - level1: "Xử lý lỗi"
    level2:
      - "Lựa chọn dừng ngay hoặc tiếp tục thông báo khi một observer ném ngoại lệ"
      - "Cô lập lỗi callback để bảo vệ việc thông báo cho các observer khác"
      - "Tổng hợp và báo cáo lỗi mà không che mất nguyên nhân ban đầu"
      - "Đặt timeout cho xử lý bất đồng bộ và hiểu giới hạn hủy tác vụ Java"
      - "Retry có giới hạn và yêu cầu xử lý idempotent khi có thể nhận lại sự kiện"
      - "Xử lý InterruptedException và bảo toàn tín hiệu ngắt phù hợp"
      - "Quy định xử lý dữ liệu không hợp lệ và callback thất bại liên tiếp"
  - level1: "An toàn luồng"
    level2:
      - "Nhận diện race condition khi đăng ký, hủy đăng ký và phát sự kiện đồng thời"
      - "Bảo vệ trạng thái subject và danh sách observer theo cùng hợp đồng đồng bộ"
      - "So sánh synchronized, khóa tường minh và cơ chế sao chép khi ghi"
      - "Dùng CopyOnWriteArrayList khi số lần đọc lớn và số lần đăng ký nhỏ"
      - "Tạo ảnh chụp danh sách dưới khóa rồi gọi callback bên ngoài khóa"
      - "Bảo đảm hiển thị bộ nhớ và công bố an toàn dữ liệu sự kiện bất biến"
      - "Làm rõ observer có thể nhận callback đồng thời hay cần tuần tự hóa"
      - "Tránh deadlock do callback lấy khóa khác hoặc gọi ngược vào subject"
      - "Xử lý hủy đăng ký đồng thời với một thông báo đang thực hiện"
  - level1: "Thông báo bất đồng bộ"
    level2:
      - "Tách luồng cập nhật subject khỏi luồng thực thi callback bằng Executor"
      - "Quản lý ExecutorService theo quyền sở hữu và vòng đời ứng dụng"
      - "So sánh một hàng đợi chung với hàng đợi riêng cho từng observer"
      - "Duy trì thứ tự theo subject hoặc observer khi dùng nhiều worker"
      - "Truyền ngữ cảnh cần thiết qua sự kiện thay vì phụ thuộc ThreadLocal"
      - "Theo dõi hoàn tất và thu thập lỗi từ tác vụ thông báo"
      - "Đóng bộ thực thi, chờ tác vụ hoặc hủy tác vụ theo chính sách đã chọn"
      - "Đánh đổi giữa độ trễ, mức song song và khả năng xử lý observer chậm"
  - level1: "Kiểm soát tải"
    level2:
      - "Tác động của observer chậm lên subject và các listener khác"
      - "Giới hạn dung lượng hàng đợi để kiểm soát bộ nhớ"
      - "Chọn chặn, từ chối, bỏ cũ hoặc bỏ mới khi hàng đợi đầy"
      - "Áp dụng gộp sự kiện khi chỉ cần giữ giá trị mới nhất"
      - "Phân biệt debounce, throttle và lấy mẫu thông báo"
      - "Giới thiệu backpressure khi tốc độ phát vượt tốc độ tiêu thụ"
      - "Công khai chính sách quá tải và tác động đến bảo đảm giao nhận"
  - level1: "API Java liên quan"
    level2:
      - "Mô hình listener với EventObject và EventListener trong Java"
      - "Theo dõi thay đổi thuộc tính bằng PropertyChangeSupport"
      - "So sánh đăng ký listener toàn cục và theo tên thuộc tính"
      - "Lý do không chọn Observable và Observer đã deprecated cho thiết kế mới"
      - "Liên hệ Observer với Flow.Publisher, Subscriber và Subscription"
      - "Phân biệt nhu cầu sự kiện đơn giản với giao thức Reactive Streams"
      - "Đánh giá SubmissionPublisher theo yêu cầu bộ đệm, lỗi và vòng đời"
  - level1: "Kiểm thử chức năng"
    level2:
      - "Kiểm thử subject không có observer và subject có nhiều observer"
      - "Xác minh dữ liệu sự kiện, nguồn phát, giá trị cũ và giá trị mới"
      - "Kiểm thử đăng ký trùng theo chính sách đã công bố"
      - "Kiểm thử hủy đăng ký, đóng Subscription và hủy nhiều lần"
      - "Xác minh thứ tự callback khi hợp đồng có bảo đảm thứ tự"
      - "Kiểm thử observer ném ngoại lệ và chính sách cô lập lỗi"
      - "Kiểm thử tự hủy, thêm observer và cập nhật lồng trong callback"
      - "Dùng observer giả, bộ ghi nhận sự kiện và assertion có ý nghĩa"
  - level1: "Kiểm thử đồng thời"
    level2:
      - "Tạo kịch bản đăng ký và phát sự kiện đồng thời bằng latch hoặc barrier"
      - "Kiểm thử ranh giới hủy đăng ký khi callback đang chạy hoặc đang chờ"
      - "Kiểm tra thứ tự và tính toàn vẹn dữ liệu giữa nhiều luồng phát"
      - "Dùng executor kiểm soát được để kiểm thử bất đồng bộ có tính xác định"
      - "Chờ điều kiện với timeout thay vì dựa vào Thread.sleep"
      - "Kiểm thử observer chậm, hàng đợi đầy và chính sách quá tải"
      - "Kiểm thử shutdown, ngắt tác vụ và giải phóng tài nguyên"
      - "Kiểm tra rò rỉ đăng ký và tránh assertion phụ thuộc thời điểm GC"
  - level1: "Hiệu năng"
    level2:
      - "Ước lượng chi phí phát sự kiện theo số observer và thời gian callback"
      - "Đánh giá chi phí sao chép danh sách và thay đổi đăng ký thường xuyên"
      - "Đo thông lượng, độ trễ thông báo và mức sử dụng bộ nhớ"
      - "Xây dựng phép đo Java phù hợp và tránh kết luận từ vòng lặp đơn giản"
      - "Phân tích cấp phát đối tượng sự kiện, giữ tham chiếu và áp lực GC"
      - "So sánh cơ chế đồng bộ và bất đồng bộ bằng tải đại diện"
      - "Chọn tối ưu dựa trên nút thắt và yêu cầu giao nhận thực tế"
  - level1: "Quan sát vận hành"
    level2:
      - "Theo dõi số observer đang đăng ký và số lần đăng ký, hủy đăng ký"
      - "Đo số sự kiện phát, số callback thành công và số callback thất bại"
      - "Giám sát độ trễ callback, độ dài hàng đợi và số sự kiện bị bỏ"
      - "Gắn mã sự kiện và ngữ cảnh liên kết để truy vết luồng thông báo"
      - "Ghi log lỗi có kiểm soát và hạn chế lộ dữ liệu nhạy cảm trong payload"
      - "Chẩn đoán thiếu thông báo, thông báo trùng và listener không được giải phóng"
  - level1: "Tích hợp ứng dụng"
    level2:
      - "Cập nhật nhiều thành phần giao diện và tuân thủ luồng giao diện tương ứng"
      - "Phát thông báo thay đổi cấu hình cho các thành phần trong cùng tiến trình"
      - "Dùng sự kiện miền để tách phản ứng nghiệp vụ khỏi thao tác cập nhật"
      - "Liên kết phát sự kiện với kết quả commit hoặc rollback của giao dịch"
      - "Tích hợp cơ chế quản lý dependency và hook đóng ứng dụng"
      - "Xác định ranh giới khi cần chuyển từ observer trong bộ nhớ sang message broker"
      - "Đánh giá mức phụ thuộc và khả năng truy vết khi số listener tăng lên"
  - level1: "So sánh mẫu"
    level2:
      - "Observer và publish-subscribe khác nhau về trung gian và mức liên kết"
      - "Observer và Event Bus trong phạm vi phân phối và truy vết sự kiện"
      - "Observer và Mediator trong điều phối tương tác nhiều thành phần"
      - "Observer và Strategy trong số đối tượng tham gia và cách chọn hành vi"
      - "Observer và Chain of Responsibility trong cách truyền và xử lý yêu cầu"
      - "Observer và callback đơn lẻ khi mở rộng thành nhiều bên nhận"
      - "Observer và luồng phản ứng trong quản lý nhu cầu, lỗi và tín hiệu kết thúc"
  - level1: "Lỗi thường gặp"
    level2:
      - "Thông báo trước khi cập nhật xong trạng thái nghiệp vụ"
      - "Sửa danh sách observer trong khi duyệt và hiểu sai vai trò của snapshot"
      - "Gọi callback khi đang giữ khóa của subject"
      - "Chia sẻ payload mutable khiến observer ảnh hưởng lẫn nhau"
      - "Quên hủy đăng ký hoặc tạo nhiều đăng ký ngoài ý muốn"
      - "Nuốt ngoại lệ khiến mất dấu lỗi và dừng thông báo ngoài dự kiến"
      - "Dùng hàng đợi không giới hạn hoặc tạo luồng mới cho mỗi sự kiện"
      - "Giả định observer trong bộ nhớ bảo đảm lưu bền hoặc giao nhận đúng một lần"
  - level1: "Thực hành tổng hợp"
    level2:
      - "Xây dựng subject theo dõi giá với nhiều listener có trách nhiệm độc lập"
      - "Bổ sung sự kiện bất biến, lọc đăng ký và Subscription có thể đóng"
      - "Hoàn thiện chính sách lỗi, thứ tự gọi và thay đổi đăng ký trong callback"
      - "Nâng cấp thiết kế để an toàn khi có nhiều luồng cùng cập nhật"
      - "Thêm phân phối bất đồng bộ với hàng đợi giới hạn và shutdown rõ ràng"
      - "Viết bộ kiểm thử cho vòng đời đăng ký, dữ liệu và các luồng thông báo"
      - "Đo tác động của listener chậm và giải thích lựa chọn kiểm soát tải"
      - "Rà soát hợp đồng, tài nguyên và tiêu chí chọn Observer cho bài toán thực tế"
