menu:
  - level1: "Tổng quan State"
    level2:
      - "Bài toán hành vi đối tượng thay đổi theo trạng thái nội tại"
      - "Ý định của State và vai trò trong nhóm mẫu hành vi"
      - "Phân biệt trạng thái, sự kiện, hành vi và chuyển trạng thái"
      - "Dấu hiệu nhận biết các nhánh if/switch theo trạng thái cần tái cấu trúc"
      - "Ủy quyền hành vi và nguyên tắc đóng gói phần thay đổi"
      - "Lợi ích về tính rõ ràng, khả năng mở rộng và kiểm thử"
      - "Chi phí số lượng lớp và trường hợp chưa cần áp dụng State"
  - level1: "Cấu trúc mẫu"
    level2:
      - "Context quản lý dữ liệu nghiệp vụ và tham chiếu State hiện tại"
      - "Giao diện State xác định hợp đồng hành vi phụ thuộc trạng thái"
      - "ConcreteState hiện thực hành vi cho từng trạng thái cụ thể"
      - "Client khởi tạo và sử dụng Context qua giao diện nghiệp vụ"
      - "Quan hệ giữa Context, State và các cộng tác viên nghiệp vụ"
      - "Sơ đồ lớp UML thể hiện cấu trúc và chiều phụ thuộc"
      - "Sơ đồ đối tượng minh họa thay thế State trong cùng một Context"
  - level1: "Luồng thực thi"
    level2:
      - "Context tiếp nhận yêu cầu và ủy quyền cho State đang hoạt động"
      - "State sử dụng dữ liệu Context để thực hiện hành vi nghiệp vụ"
      - "Đánh giá điều kiện bảo vệ trước khi chấp nhận sự kiện"
      - "Chọn trạng thái đích và điều phối việc chuyển trạng thái"
      - "Thứ tự thực hiện hành vi, cập nhật State và thông báo kết quả"
      - "Hành vi tại trạng thái kết thúc và yêu cầu đến sau khi kết thúc"
      - "Sơ đồ tuần tự cho luồng thành công và yêu cầu bị từ chối"
  - level1: "Mô hình trạng thái"
    level2:
      - "Thu thập vòng đời nghiệp vụ và phân định phạm vi đối tượng"
      - "Xác định tập trạng thái bằng ý nghĩa nghiệp vụ và hành vi khác biệt"
      - "Lập bảng trạng thái nguồn, sự kiện, điều kiện và trạng thái đích"
      - "Vẽ sơ đồ chuyển trạng thái với hành động và điều kiện bảo vệ"
      - "Xác định trạng thái khởi đầu, kết thúc, chu trình và khả năng đi tới"
      - "Phát hiện chuyển trạng thái trái phép, ngõ cụt và trường hợp bỏ sót"
      - "Phân biệt trạng thái vòng đời với thuộc tính, cờ và trạng thái suy ra"
  - level1: "Bất biến và hợp đồng"
    level2:
      - "Xác định bất biến dữ liệu phải được giữ trong toàn bộ vòng đời"
      - "Định nghĩa tiền điều kiện và hậu điều kiện của từng hành vi"
      - "Thiết kế điều kiện bảo vệ rõ ràng và không gây tác dụng phụ"
      - "Bảo đảm State hiện tại nhất quán với dữ liệu nghiệp vụ"
      - "Ngăn quan sát hoặc sử dụng Context khi chuyển trạng thái dở dang"
      - "Kiểm tra bất biến sau thành công, từ chối và ngoại lệ"
      - "Xác định nguồn sự thật khi trạng thái trong bộ nhớ và lưu trữ cùng tồn tại"
  - level1: "Thiết kế Context"
    level2:
      - "Thiết kế API theo ý định nghiệp vụ thay vì thao tác đổi State tùy ý"
      - "Đặt dữ liệu dùng chung và quy tắc sở hữu dữ liệu trong Context"
      - "Cung cấp thao tác nội bộ tối thiểu cho các lớp State"
      - "Giới hạn quyền thay thế State để bảo vệ đồ thị chuyển trạng thái"
      - "Phân chia trách nhiệm xác thực giữa Context, State và dịch vụ miền"
      - "Cung cấp truy vấn trạng thái và ảnh chụp dữ liệu an toàn"
      - "Khởi tạo mới và khôi phục Context với trạng thái hợp lệ"
  - level1: "Thiết kế lớp State"
    level2:
      - "Đặt tên ConcreteState theo ngôn ngữ nghiệp vụ của từng trạng thái"
      - "Lựa chọn interface hoặc lớp trừu tượng cho hợp đồng State"
      - "Gom các hành vi cùng trạng thái và giữ trách nhiệm lớp rõ ràng"
      - "Quy định hành vi mặc định cho thao tác không được hỗ trợ"
      - "Truyền Context qua tham số hoặc giữ tham chiếu trong State"
      - "Quản lý tài nguyên và ranh giới trách nhiệm khi State ngừng hoạt động"
      - "Chia sẻ logic phù hợp mà không tạo hệ phân cấp kế thừa phức tạp"
  - level1: "Điều phối chuyển trạng thái"
    level2:
      - "Lựa chọn Context, State hoặc bộ điều phối làm nơi quyết định chuyển trạng thái"
      - "Tập trung chính sách chuyển trạng thái và tránh quy tắc trùng lặp"
      - "Biểu diễn quan hệ giữa sự kiện, điều kiện bảo vệ và trạng thái đích"
      - "Phân biệt sự kiện lặp, chuyển về chính nó và yêu cầu có tính lũy đẳng"
      - "Kiểm soát chuỗi chuyển tiếp và xử lý xong một sự kiện trước sự kiện tiếp theo"
      - "Ngăn chuyển trạng thái hai lần trong cùng một thao tác nghiệp vụ"
      - "Quy định việc hủy, mở lại và rời trạng thái kết thúc theo nghiệp vụ"
  - level1: "Triển khai Java"
    level2:
      - "Xây dựng interface State với các phương thức nghiệp vụ rõ nghĩa"
      - "Hiện thực ConcreteState và kiểm soát phụ thuộc giữa các lớp"
      - "Cài đặt Context ủy quyền từng thao tác cho State hiện tại"
      - "Dùng constructor, factory và phạm vi package để kiểm soát khởi tạo"
      - "Kết hợp enum mã trạng thái với lớp State và cân nhắc sealed interface"
      - "Thiết kế kiểu kết quả và ngoại lệ miền cho các thao tác State"
      - "Đối chiếu mã Java dùng if/switch với phiên bản áp dụng State"
  - level1: "Dữ liệu và vòng đời"
    level2:
      - "Phân bổ dữ liệu cho Context hoặc State theo phạm vi và thời gian sống"
      - "Lựa chọn State bất biến và giới hạn dữ liệu có thể thay đổi"
      - "Điều kiện dùng chung State không mang dữ liệu bằng singleton"
      - "Tạo State bằng factory và tiêm phụ thuộc mà không tạo vòng phụ thuộc"
      - "Chọn vòng đời instance theo Context, yêu cầu hoặc phạm vi ứng dụng"
      - "Phân biệt định danh trạng thái với định danh instance và phép so sánh bằng"
      - "Đánh giá chi phí cấp phát, giữ tham chiếu và giải phóng tài nguyên"
  - level1: "Tác vụ vào và ra"
    level2:
      - "Xác định khi nào cần hành động vào trạng thái và rời trạng thái"
      - "Quy định thứ tự exit, cập nhật State và entry trong một lần chuyển"
      - "Kiểm tra điều kiện và chuẩn bị dữ liệu trước tác dụng phụ"
      - "Xử lý ngoại lệ tại entry hoặc exit và xác định trạng thái có hiệu lực"
      - "Phân biệt chuyển nội bộ và chuyển về chính nó có chạy lại entry/exit"
      - "Quản lý bộ định thời, đăng ký lắng nghe và tác vụ nền theo State"
      - "Ngăn callback cũ và lời gọi tái nhập làm sai thứ tự chuyển trạng thái"
  - level1: "Lỗi và phục hồi"
    level2:
      - "Phân loại thao tác không hợp lệ, điều kiện không đạt và lỗi hệ thống"
      - "Lựa chọn trả kết quả từ chối hoặc ném ngoại lệ miền"
      - "Bảo đảm dữ liệu và State hợp lệ khi một thao tác thất bại"
      - "Phục hồi hoặc bù trừ khi tác dụng phụ chỉ hoàn thành một phần"
      - "Mô hình hóa trạng thái lỗi, thử lại và chờ phục hồi khi nghiệp vụ cần"
      - "Giới hạn số lần thử lại và xác định điểm chuyển sang thất bại cuối cùng"
      - "Thiết kế thông tin lỗi và hướng phục hồi mà không che giấu vi phạm bất biến"
  - level1: "Đồng thời và bất đồng bộ"
    level2:
      - "Nhận diện tranh chấp khi nhiều luồng đọc, xử lý và đổi State"
      - "Lựa chọn xử lý tuần tự, khóa hoặc cập nhật có điều kiện"
      - "Dùng phiên bản trạng thái để phát hiện quyết định dựa trên dữ liệu cũ"
      - "Gắn định danh tác vụ để loại bỏ sự kiện đến muộn hoặc sai phiên xử lý"
      - "Tách tác vụ kéo dài khỏi khóa và tiếp nhận kết quả qua sự kiện"
      - "Giải quyết cạnh tranh giữa hoàn thành, hủy bỏ và hết thời gian chờ"
      - "Kiểm soát callback, lời gọi tái nhập và nguy cơ khóa chéo"
  - level1: "Lưu và khôi phục"
    level2:
      - "Lưu mã trạng thái ổn định thay vì tên lớp hoặc tham chiếu đối tượng"
      - "Thiết kế ảnh chụp gồm dữ liệu nghiệp vụ, mã State và phiên bản"
      - "Ánh xạ mã lưu trữ về ConcreteState bằng factory hoặc registry"
      - "Ghi trạng thái và dữ liệu liên quan trong cùng ranh giới nhất quán"
      - "Ánh xạ với cơ sở dữ liệu và ORM mà không phụ thuộc tuần tự hóa lớp State"
      - "Khôi phục Context mà không chạy lặp tác dụng phụ của entry"
      - "Di trú dữ liệu cũ và xử lý mã trạng thái không còn được hỗ trợ"
  - level1: "Giao dịch và tích hợp"
    level2:
      - "Xác định ranh giới giao dịch cho xử lý sự kiện và chuyển trạng thái"
      - "Kiểm soát cập nhật đồng thời bằng khóa lạc quan và phiên bản bản ghi"
      - "Dùng khóa lũy đẳng để xử lý yêu cầu hoặc thông điệp gửi lại"
      - "Phát sự kiện sau commit và áp dụng outbox khi cần độ bền"
      - "Phân biệt chuyển trạng thái cục bộ với phối hợp giao dịch nhiều dịch vụ"
      - "Tiếp tục công việc sau khi tiến trình dừng giữa lưu trạng thái và gửi sự kiện"
      - "Xử lý thứ tự, trùng lặp và bàn giao tác vụ giữa các worker"
  - level1: "Theo dõi trạng thái"
    level2:
      - "Ghi log trạng thái nguồn, sự kiện, trạng thái đích và lý do chuyển"
      - "Lưu lịch sử chuyển trạng thái với thời điểm, chủ thể và kết quả"
      - "Đo số lần chuyển, tỷ lệ từ chối và thời gian lưu ở mỗi trạng thái"
      - "Phát hiện đối tượng mắc kẹt, chuyển bất thường và lỗi phục hồi lặp lại"
      - "Liên kết log và trace bằng định danh Context, yêu cầu và tác vụ"
      - "Bảo vệ dữ liệu nhạy cảm trong lịch sử và thông tin chẩn đoán"
      - "Phân biệt trạng thái nghiệp vụ với tình trạng kỹ thuật của hệ thống"
  - level1: "Kiểm thử hành vi"
    level2:
      - "Kiểm thử đơn vị hành vi của từng ConcreteState bằng cộng tác viên phù hợp"
      - "Kiểm tra Context ủy quyền đúng State và trả đúng kết quả nghiệp vụ"
      - "Sinh ca kiểm thử tham số hóa từ bảng chuyển trạng thái"
      - "Kiểm tra điều kiện bảo vệ ở biên và các tổ hợp dữ liệu quan trọng"
      - "Xác minh yêu cầu trái phép bị từ chối và không làm thay đổi dữ liệu"
      - "Kiểm tra thứ tự và số lần thực hiện entry, exit cùng tác dụng phụ"
      - "Kiểm thử trạng thái khởi đầu, kết thúc và sự kiện không được hỗ trợ"
  - level1: "Kiểm thử độ bền"
    level2:
      - "Kiểm thử dựa trên thuộc tính để giữ bất biến qua chuỗi sự kiện"
      - "Đánh giá độ bao phủ trạng thái, cạnh chuyển và đường đi quan trọng"
      - "Kiểm thử đồng thời bằng lịch thực thi có kiểm soát thay vì phụ thuộc sleep"
      - "Chèn lỗi tại thao tác nghiệp vụ, entry, exit và điểm phát sự kiện"
      - "Kiểm thử tích hợp lưu trữ, xung đột phiên bản và ranh giới giao dịch"
      - "Mô phỏng khởi động lại, thông điệp lặp và kết quả bất đồng bộ đến muộn"
      - "Kiểm tra tương thích ảnh chụp trạng thái qua các phiên bản ứng dụng"
  - level1: "Tái cấu trúc if/switch"
    level2:
      - "Tìm các nhánh điều kiện lặp theo cùng một biến trạng thái"
      - "Ghi nhận hành vi hiện tại bằng kiểm thử trước khi thay đổi thiết kế"
      - "Chuyển các điều kiện rải rác thành bảng hành vi và bảng chuyển trạng thái"
      - "Trích xuất hợp đồng State và giữ ổn định API của Context"
      - "Di chuyển hành vi sang ConcreteState theo từng bước nhỏ"
      - "Hợp nhất điểm đổi State và loại bỏ dữ liệu trạng thái trùng lặp"
      - "So sánh hành vi trước sau và loại bỏ nhánh điều kiện đã được thay thế"
  - level1: "So sánh và lựa chọn"
    level2:
      - "State và Strategy khác nhau về ý định, cách lựa chọn và vòng đời"
      - "Lựa chọn giữa enum kết hợp switch và các lớp ConcreteState"
      - "Quan hệ giữa mẫu State và mô hình máy trạng thái hữu hạn"
      - "So sánh State hướng đối tượng với bảng chuyển và bộ diễn giải trạng thái"
      - "Phân định phạm vi State trong đối tượng và workflow engine trong quy trình"
      - "Kết hợp Command biểu diễn yêu cầu và Observer nhận thông báo thay đổi"
      - "Cân nhắc chi phí thiết kế theo số trạng thái, hành vi và tần suất thay đổi"
  - level1: "Mở rộng thiết kế"
    level2:
      - "Đánh giá tác động khi thêm trạng thái mới hoặc thêm hành vi mới"
      - "Tách hợp đồng State khi một giao diện chứa quá nhiều thao tác không liên quan"
      - "Dùng thành phần dùng chung cho hành vi lặp giữa nhiều State"
      - "Mô hình hóa trạng thái phân cấp khi nhiều trạng thái con có quy tắc chung"
      - "Tách các chiều trạng thái độc lập để hạn chế bùng nổ tổ hợp"
      - "Tách chính sách và điều kiện bảo vệ có thể thay đổi khỏi lớp State"
      - "Kết hợp cấu hình chuyển trạng thái với hành vi viết bằng mã khi phù hợp"
  - level1: "Lỗi thiết kế thường gặp"
    level2:
      - "Giữ nguyên if/switch phức tạp bên trong mọi ConcreteState"
      - "Đẩy toàn bộ nghiệp vụ vào Context khiến State chỉ còn là tên gọi"
      - "Để các State phụ thuộc chéo và tự tạo toàn bộ trạng thái đích"
      - "Công khai setter trạng thái cho phép bỏ qua điều kiện bảo vệ"
      - "Chia sẻ State có dữ liệu thay đổi làm rò rỉ dữ liệu giữa các Context"
      - "Chạy lại tác dụng phụ khi khôi phục hoặc nhận lại cùng sự kiện"
      - "Tạo quá nhiều State vụn hoặc gộp các trạng thái có bất biến khác nhau"
  - level1: "Thực hành đơn hàng"
    level2:
      - "Xác định vòng đời đơn hàng, tập sự kiện và bảng chuyển hợp lệ"
      - "Thiết kế OrderContext cùng State cho tạo mới, thanh toán và hoàn tất"
      - "Ủy quyền xác nhận, thanh toán, giao hàng và hủy theo State hiện tại"
      - "Bảo vệ bất biến số tiền, điều kiện hủy và điều kiện giao hàng"
      - "Lưu trạng thái đơn hàng và kiểm soát cập nhật đồng thời"
      - "Xử lý thanh toán lỗi, thông báo lặp và yêu cầu đến sau khi hoàn tất"
      - "Kiểm thử vòng đời đầy đủ và đối chiếu với phiên bản dùng if/switch"
  - level1: "Thực hành tác vụ nền"
    level2:
      - "Mô hình hóa tác vụ chờ chạy, đang chạy, thành công, thất bại và bị hủy"
      - "Thiết kế JobContext và State điều phối bắt đầu, hoàn tất và thử lại"
