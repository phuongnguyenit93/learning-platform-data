menu:
  - level1: "Bản chất và phạm vi áp dụng mẫu Iterator"
    level2:
      - "Bài toán duyệt phần tử khi mã sử dụng phụ thuộc cấu trúc lưu trữ"
      - "Mục tiêu tách thuật toán sử dụng phần tử khỏi cơ chế duyệt"
      - "Khái niệm tập hợp, iterator, con trỏ duyệt và phần tử hiện tại"
      - "Truy cập tuần tự theo giao thức và thứ tự do iterator quy định"
      - "Tình huống phù hợp: cùng một giao thức cho nhiều cấu trúc dữ liệu"
      - "Lợi ích đóng gói cấu trúc lưu trữ và giảm phụ thuộc của mã sử dụng"
      - "Chi phí tạo đối tượng, quản lý trạng thái và mở rộng giao diện"
      - "Nhận diện trường hợp vòng lặp trực tiếp đã đáp ứng nhu cầu"
  - level1: "Vai trò, cộng tác và biến thể thiết kế Iterator"
    level2:
      - "Iterator: khai báo giao thức kiểm tra và lấy phần tử tiếp theo"
      - "ConcreteIterator: lưu trạng thái và hiện thực chiến lược duyệt"
      - "Aggregate và ConcreteAggregate: cung cấp điểm tạo iterator"
      - "Client: sử dụng giao thức chung thay cho chi tiết lưu trữ"
      - "Luồng cộng tác từ tạo iterator đến kết thúc lượt duyệt"
      - "Iterator bên ngoài và duyệt do tập hợp điều khiển"
      - "Nhiều iterator độc lập trên cùng một tập hợp"
      - "Thứ tự duyệt, quyền sửa đổi và vòng đời là quyết định của từng iterator"
  - level1: "Hợp đồng Iterator<E> trong Java"
    level2:
      - "Kiểu phần tử E, generic và an toàn kiểu khi duyệt"
      - "hasNext(): quan sát khả năng còn phần tử mà không tiến con trỏ"
      - "next(): trả phần tử tiếp theo và cập nhật trạng thái duyệt"
      - "NoSuchElementException khi next() được gọi sau phần tử cuối"
      - "Phân biệt kết thúc lượt duyệt với phần tử có giá trị null"
      - "remove(): thao tác tùy chọn trên phần tử vừa được trả về"
      - "IllegalStateException khi remove() sai trạng thái"
      - "UnsupportedOperationException đối với thao tác không được hỗ trợ"
      - "forEachRemaining(): duyệt phần còn lại từ vị trí hiện tại"
      - "Ngoại lệ trong hành động forEachRemaining() và giới hạn bảo đảm trạng thái"
  - level1: "Thiết kế tập hợp tùy chỉnh có hỗ trợ Iterator"
    level2:
      - "Xác định hành vi duyệt từ yêu cầu của tập hợp miền nghiệp vụ"
      - "Tách thao tác quản lý tập hợp khỏi thao tác di chuyển con trỏ"
      - "Chọn thứ tự duyệt mặc định và mô tả rõ thứ tự được bảo đảm"
      - "Quy định xử lý null, phần tử trùng lặp và tập hợp rỗng"
      - "Chọn lớp iterator lồng nhau hoặc lớp iterator độc lập"
      - "Giới hạn quyền truy cập vào mảng, nút liên kết và trạng thái nội bộ"
      - "Chọn hỗ trợ remove() hoặc công bố iterator chỉ đọc"
      - "Quy định hành vi khi tập hợp thay đổi trong thời gian duyệt"
  - level1: "Tự cài đặt iterator cho tập hợp dùng mảng"
    level2:
      - "Biểu diễn kích thước logic và sức chứa của mảng nền"
      - "Khởi tạo cursor và giới hạn phần tử có thể duyệt"
      - "Cài đặt hasNext() theo kích thước logic"
      - "Cài đặt next() với kiểm tra biên và ngoại lệ đúng hợp đồng"
      - "Tách lastReturned khỏi cursor để theo dõi phần tử vừa trả về"
      - "Cài đặt remove() với dịch phần tử và điều chỉnh cursor"
      - "Xử lý mảng tăng dung lượng theo chính sách thay đổi đã chọn"
      - "Bảo đảm mỗi lần tạo iterator sinh trạng thái duyệt độc lập"
      - "Chạy thử tập hợp rỗng, một phần tử, null và các phần tử trùng"
  - level1: "Tự cài đặt iterator cho danh sách liên kết"
    level2:
      - "Lưu tham chiếu nút tiếp theo thay cho chỉ số truy cập ngẫu nhiên"
      - "Cài đặt hasNext() và next() khi nút cuối trỏ tới null"
      - "Theo dõi nút vừa trả về và nút trước trong danh sách liên kết đơn"
      - "Cài đặt remove() khi phần tử nằm ở đầu, giữa hoặc cuối danh sách"
      - "Xử lý danh sách chỉ có một nút và chuyển về trạng thái rỗng"
      - "Cập nhật liên kết và bất biến đầu danh sách, cuối danh sách, kích thước"
      - "Thiết kế con trỏ cho danh sách liên kết đôi"
      - "So sánh cùng giao thức Iterator trên mảng và danh sách liên kết"
  - level1: "Iterable<T>, vòng lặp for-each và tái sử dụng lượt duyệt"
    level2:
      - "Vai trò của Iterable<T> và phương thức iterator()"
      - "Hiện thực Iterable<T> cho tập hợp tùy chỉnh"
      - "Liên hệ giữa for-each trên Iterable và giao thức Iterator"
      - "Phân biệt for-each trên mảng với for-each trên Iterable"
      - "Trả iterator mới cho mỗi lần gọi iterator()"
      - "Duyệt lồng nhau mà các con trỏ không ảnh hưởng lẫn nhau"
      - "Phân biệt nguồn có thể duyệt lại với iterator chỉ tiến một lượt"
      - "Iterable.forEach() và lựa chọn giữa callback với điều khiển con trỏ"
  - level1: "Sử dụng Iterator với Java Collections Framework"
    level2:
      - "Duyệt List và phân biệt chỉ số danh sách với trạng thái iterator"
      - "Duyệt Set theo bảo đảm thứ tự của từng loại tập hợp"
      - "Duyệt Map qua keySet(), values() và entrySet()"
      - "Phân biệt thứ tự duyệt của HashSet, LinkedHashSet và TreeSet"
      - "Phân biệt thứ tự duyệt của HashMap, LinkedHashMap và TreeMap"
      - "Duyệt Queue và Deque theo hợp đồng của triển khai cụ thể"
      - "PriorityQueue: phân biệt thứ tự iterator với thứ tự lấy bằng poll()"
      - "Tập hợp không sửa đổi được, khung nhìn không cho sửa và iterator tương ứng"
      - "Chọn Iterator khi cần dừng sớm, giữ con trỏ hoặc xóa có kiểm soát"
  - level1: "Duyệt hai chiều và chỉnh sửa bằng ListIterator<E>"
    level2:
      - "ListIterator mở rộng Iterator dành cho danh sách"
      - "Tạo listIterator() và listIterator(index) tại vị trí hợp lệ"
      - "Con trỏ nằm giữa các phần tử và ý nghĩa của vị trí size()"
      - "IndexOutOfBoundsException và NoSuchElementException theo từng thao tác ListIterator"
      - "hasPrevious() và previous() khi duyệt ngược"
      - "nextIndex() và previousIndex() tại đầu, giữa và cuối danh sách"
      - "Đổi hướng next() và previous() mà không nhầm phần tử trả về"
      - "remove(): xóa phần tử vừa được next() hoặc previous() trả về"
      - "set(): thay thế phần tử vừa được trả về và điều kiện trạng thái"
      - "add(): chèn tại con trỏ và vị trí con trỏ sau khi chèn"
      - "Tương tác giữa add(), remove(), set() và IllegalStateException"
      - "Thao tác tùy chọn và hỗ trợ ListIterator của từng loại List"
  - level1: "Thay đổi collection trong khi đang duyệt"
    level2:
      - "Phân biệt thay đổi cấu trúc với cập nhật giá trị phần tử"
      - "Xóa bằng Iterator.remove() theo đúng trạng thái của iterator"
      - "Rủi ro gọi collection.remove() khi iterator vẫn đang hoạt động"
      - "Giới hạn sửa đổi collection trong vòng lặp for-each"
      - "Sử dụng ListIterator cho chèn, xóa và thay thế khi duyệt List"
      - "Lựa chọn removeIf() hoặc thu thập phần tử rồi cập nhật sau"
      - "Thay đổi qua khung nhìn subList(), keySet() và entrySet()"
      - "Giới hạn của Map.Entry.setValue() và thay đổi phần tử ánh xạ"
      - "Ảnh hưởng của một iterator sửa tập hợp lên iterator khác"
      - "Phân biệt lỗi sửa đổi trong một luồng với tranh chấp giữa nhiều luồng"
  - level1: "Iterator fail-fast và phát hiện thay đổi cấu trúc"
    level2:
      - "Mục đích của ConcurrentModificationException trong iterator fail-fast"
      - "Fail-fast là phát hiện lỗi theo nỗ lực tốt nhất"
      - "Vì sao không dùng ConcurrentModificationException để bảo đảm đồng bộ"
      - "Thiết kế modCount cho các thay đổi cấu trúc của tập hợp tùy chỉnh"
      - "Khởi tạo expectedModCount khi tạo iterator"
      - "Chọn điểm kiểm tra thay đổi theo hợp đồng của iterator tự cài đặt"
      - "Cập nhật expectedModCount sau remove() hợp lệ của chính iterator"
      - "Xử lý mở rộng mảng, clear() và thay đổi qua các đường cập nhật khác"
      - "Kiểm thử phát hiện thay đổi mà không giả định mọi iterator có cùng thời điểm ném lỗi"
  - level1: "Duyệt đồng thời và lựa chọn chính sách nhất quán"
    level2:
      - "Phân biệt nhiều iterator độc lập với chia sẻ một iterator giữa các luồng"
      - "Trạng thái con trỏ dùng chung và nguy cơ tranh chấp dữ liệu"
      - "Collections.synchronizedList(): khóa phù hợp trong toàn bộ lượt duyệt"
      - "Chọn đối tượng khóa đúng khi duyệt khung nhìn của collection được đồng bộ"
      - "Tạo bản sao dưới cơ chế đồng bộ phù hợp trước khi duyệt"
      - "CopyOnWriteArrayList: iterator duyệt ảnh chụp tại lúc tạo"
      - "Giới hạn sửa đổi qua iterator của CopyOnWriteArrayList"
      - "ConcurrentHashMap: iterator nhất quán yếu và khả năng quan sát thay đổi"
      - "Phân biệt fail-fast, ảnh chụp và nhất quán yếu theo hợp đồng thư viện"
      - "Chọn khóa, sao chép hoặc collection đồng thời theo yêu cầu đọc và ghi"
  - level1: "Thiết kế các chiến lược duyệt tùy chỉnh"
    level2:
      - "Duyệt thuận và duyệt ngược với cùng kiểu phần tử"
      - "Duyệt một khoảng chỉ số và xác định biên bao gồm hoặc loại trừ"
      - "Iterator lọc phần tử mà không tạo collection trung gian"
      - "Chuẩn bị phần tử kế tiếp để hasNext() không làm mất dữ liệu"
      - "Lặp lại hasNext() và lưu đệm kết quả lọc đúng trạng thái"
      - "Iterator ánh xạ kiểu phần tử và truyền ngoại lệ từ hàm chuyển đổi"
      - "Ghép nhiều iterator thành một chuỗi duyệt liên tục"
      - "Làm phẳng các iterator lồng nhau có tập hợp con rỗng"
      - "Giới hạn số phần tử và khả năng kết thúc nguồn duyệt không hữu hạn"
  - level1: "Duyệt cây, đồ thị và cấu trúc phân cấp"
    level2:
      - "Chọn thứ tự tiền tự, trung tự, hậu tự theo cấu trúc cây"
      - "Cài đặt iterator duyệt sâu bằng ngăn xếp tường minh"
      - "Cài đặt iterator duyệt rộng bằng hàng đợi"
      - "Ẩn cấu trúc nút và chỉ trả về dữ liệu cần cho mã sử dụng"
      - "Xử lý cây rỗng, nút lá và cây lệch sâu"
      - "Duyệt đồ thị có chu trình với tập đỉnh đã thăm"
      - "Phân biệt duyệt theo đỉnh, theo cạnh và phần tử trùng trong kết quả"
      - "Quy định thứ tự, chi phí bộ nhớ và hành vi khi cấu trúc thay đổi"
  - level1: "Duyệt lười và tích hợp nguồn dữ liệu thực tế"
    level2:
      - "Iterator lười: chỉ tính hoặc tải phần tử khi cần thiết"
      - "Chuyển nguồn dữ liệu phân trang thành giao thức duyệt phần tử"
      - "Phân biệt trang rỗng, trang cuối và lỗi tải dữ liệu"
      - "Giới hạn chi phí tiền nạp và tác dụng phụ trong hasNext()"
      - "Chính sách lỗi, hủy lượt duyệt và tránh lặp lại tác dụng phụ"
      - "Quản lý vòng đời tài nguyên vì Iterator không có hợp đồng đóng tài nguyên"
      - "Thiết kế nguồn có thể đóng khi duyệt tệp hoặc kết nối ngoài"
      - "Dừng sớm và trách nhiệm giải phóng tài nguyên của mã sử dụng"
  - level1: "Quan hệ với mẫu thiết kế và API duyệt khác"
    level2:
      - "Iterator và Composite khi duyệt cấu trúc phân cấp"
      - "Iterator và Strategy khi thay đổi thuật toán hoặc thứ tự duyệt"
      - "Iterator và Visitor khi tách phép xử lý khỏi cấu trúc phần tử"
      - "Iterator và Adapter khi thống nhất giao thức của nguồn dữ liệu"
      - "Iterator và Enumeration trong các API Java cũ"
      - "Iterator và Stream: điều khiển con trỏ so với chuỗi phép xử lý"
      - "Iterator và Spliterator: phạm vi phân tách phục vụ xử lý song song"
      - "PrimitiveIterator và chi phí boxing của phần tử nguyên thủy"
  - level1: "Độ phức tạp, hiệu năng và chất lượng API"
    level2:
      - "Đánh giá chi phí tạo iterator và chi phí mỗi bước duyệt"
      - "Đánh giá tổng chi phí khi hasNext() có lọc hoặc tiền nạp"
      - "Tránh duyệt LinkedList bằng get(index) lặp lại"
      - "So sánh chi phí xóa trên mảng với xóa trên cấu trúc liên kết"
      - "Chi phí bộ nhớ của con trỏ, ngăn xếp, ảnh chụp và tập đã thăm"
      - "Đánh đổi hiệu năng đọc và ghi khi dùng CopyOnWriteArrayList"
      - "Thời gian giữ khóa và nguy cơ gọi mã bên ngoài trong lúc khóa"
      - "Ghi rõ bảo đảm thứ tự, khả năng sửa đổi và giới hạn an toàn luồng"
      - "Đo lường theo tình huống sử dụng trước khi tối ưu cơ chế duyệt"
  - level1: "Kiểm thử hợp đồng và các trường hợp biên"
    level2:
      - "Lập ma trận kiểm thử cho iterator chỉ đọc và iterator có sửa đổi"
      - "Kiểm thử tập hợp rỗng, một phần tử và nhiều phần tử"
      - "Kiểm thử null, phần tử trùng và phần tử ở hai đầu tập hợp"
      - "Kiểm thử gọi hasNext() nhiều lần mà kết quả duyệt không bị thay đổi"
      - "Kiểm thử next() trực tiếp và next() sau khi đã hết phần tử"
      - "Kiểm thử remove() trước next(), gọi hai lần và gọi sau next() mới"
      - "Kiểm thử xóa đầu, giữa, cuối mà không bỏ sót hoặc lặp phần tử"
      - "Kiểm thử forEachRemaining() khi mới tạo, đã duyệt dở và đã cạn"
      - "Kiểm thử nhiều iterator và vòng lặp lồng nhau"
      - "Kiểm thử ListIterator đổi hướng, chỉ số con trỏ và chuỗi add/set/remove"
      - "Kiểm thử thay đổi cấu trúc theo chính sách fail-fast đã công bố"
      - "Kiểm thử ảnh chụp và nhất quán yếu theo bảo đảm thay vì lịch chạy ngẫu nhiên"
      - "Kiểm thử iterator lọc, cây, đồ thị có chu trình và dừng sớm"
      - "Đối chiếu iterator tùy chỉnh với một mô hình kết quả tham chiếu"
  - level1: "Bài thực hành và bài tập tích hợp"
    level2:
      - "Xây dựng kệ sách Iterable<Book> có iterator chỉ đọc"
      - "Thay cấu trúc lưu trữ kệ sách mà giữ nguyên mã sử dụng iterator"
      - "Hoàn thiện iterator cho mảng động có remove() và phát hiện sửa đổi"
      - "Hoàn thiện iterator cho danh sách liên kết với kiểm thử bất biến"
      - "Viết bài xử lý danh sách bằng ListIterator theo cả hai hướng"
      - "Xây dựng iterator lọc và ghép nguồn với bộ kiểm thử hợp đồng"
      - "Xây dựng iterator duyệt cây thư mục giả lập theo chiều sâu và chiều rộng"
      - "So sánh duyệt có khóa, duyệt ảnh chụp và duyệt nhất quán yếu"
      - "Tích hợp tập hợp miền nghiệp vụ, mã sử dụng và kiểm thử hồi quy"
  - level1: "Lỗi thường gặp và tiêu chí đánh giá thiết kế"
    level2:
      - "Rò rỉ mảng hoặc nút nội bộ làm mất đóng gói tập hợp"
      - "Dùng null báo hết lượt duyệt hoặc trả sai ngoại lệ"
      - "Di chuyển con trỏ trong hasNext() làm bỏ sót phần tử"
      - "Tái sử dụng cùng iterator cho nhiều lượt duyệt độc lập"
      - "Sai trạng thái lastReturned sau remove(), add() hoặc đổi hướng"
