menu:
  - level1: "Tổng quan"
    level2:
      - "Ý định của Strategy: đóng gói các thuật toán thay thế được sau cùng một hợp đồng"
      - "Bài toán nhiều biến thể hành vi và sự phình to của các nhánh if/else hoặc switch"
      - "Các dấu hiệu nên tách chiến lược trong mã Java và trong yêu cầu nghiệp vụ"
      - "Lợi ích về khả năng mở rộng, cô lập thay đổi và kiểm thử độc lập"
      - "Chi phí về số lượng kiểu, cấu hình và trách nhiệm chọn chiến lược"
      - "Quan hệ với nguyên tắc Open/Closed, Dependency Inversion và Liskov Substitution"
      - "Điều kiện áp dụng và trường hợp một hàm hoặc nhánh điều kiện vẫn phù hợp hơn"
      - "Thuật ngữ Strategy, ConcreteStrategy, Context và Client trong cùng một ví dụ"
  - level1: "Cấu trúc và luồng chạy"
    level2:
      - "Vai trò của Strategy trong việc định nghĩa điểm thay thế thuật toán"
      - "Vai trò của ConcreteStrategy trong việc hiện thực từng biến thể hành vi"
      - "Vai trò của Context trong việc ủy quyền xử lý và giữ luồng nghiệp vụ ổn định"
      - "Vai trò của Client trong việc tạo đối tượng, cung cấp phụ thuộc và chọn chiến lược"
      - "Quan hệ composition và hướng phụ thuộc từ Context đến hợp đồng Strategy"
      - "Luồng gọi từ Client qua Context đến chiến lược và trả kết quả"
      - "Ranh giới giữa lựa chọn chiến lược và thực thi thuật toán đã chọn"
      - "Biểu diễn sơ đồ lớp và sơ đồ tuần tự cho một Context có nhiều chiến lược"
  - level1: "Hợp đồng Strategy"
    level2:
      - "Xác định phần hành vi thực sự biến thiên trước khi thiết kế interface"
      - "Đặt tên phương thức theo ý nghĩa nghiệp vụ và kết quả mà bên gọi cần"
      - "Thiết kế dữ liệu đầu vào và đầu ra chung cho các thuật toán thay thế nhau"
      - "Thống nhất tiền điều kiện, hậu điều kiện và các bất biến của hợp đồng"
      - "Quy định cách xử lý null, dữ liệu rỗng và giá trị ngoài miền hợp lệ"
      - "Thống nhất ngoại lệ, tác dụng phụ và tính xác định của từng chiến lược"
      - "Tránh interface quá rộng và phương thức chỉ có ý nghĩa với một triển khai"
      - "Phát triển hợp đồng khi có biến thể mới mà vẫn kiểm soát ảnh hưởng đến bên gọi"
  - level1: "Hiện thực bằng interface"
    level2:
      - "Xây dựng interface ShippingStrategy và mô hình yêu cầu tính phí vận chuyển"
      - "Hiện thực các chiến lược giao tiêu chuẩn, giao nhanh và nhận tại cửa hàng"
      - "Đóng gói công thức và điều kiện riêng trong từng lớp ConcreteStrategy"
      - "Cấp các phụ thuộc như bảng giá hoặc dịch vụ khoảng cách qua constructor"
      - "Chia sẻ phép tính thuần bằng cộng tác viên thay vì ép các chiến lược kế thừa nhau"
      - "Tổ chức package cho hợp đồng, triển khai, Context và mã lắp ráp đối tượng"
      - "Chọn phạm vi truy cập để hạn chế phụ thuộc trực tiếp vào lớp triển khai"
      - "Chạy ví dụ Java hoàn chỉnh và thêm biến thể mới qua cùng một interface"
  - level1: "Thiết kế Context"
    level2:
      - "Giữ trách nhiệm nghiệp vụ của Context và ủy quyền đúng phần thuật toán biến thiên"
      - "Bắt buộc cung cấp Strategy qua constructor để bảo đảm Context luôn hợp lệ"
      - "Truyền Strategy theo từng lời gọi khi lựa chọn thay đổi theo yêu cầu xử lý"
      - "Cho phép đổi Strategy bằng setter và xác định rõ tác động của trạng thái thay đổi"
      - "Đặt bước kiểm tra, chuẩn hóa và hoàn tất dùng chung quanh lời gọi Strategy"
      - "Truyền dữ liệu cần thiết thay vì đưa toàn bộ Context cho chiến lược"
      - "Tránh instanceof, ép kiểu và nhánh điều kiện theo lớp cụ thể trong Context"
      - "Thiết kế API của Context để bên gọi không phụ thuộc chi tiết triển khai thuật toán"
  - level1: "Lambda và method reference"
    level2:
      - "Thiết kế functional interface cho chiến lược có một phương thức trừu tượng"
      - "Dùng lambda để biểu diễn chiến lược ngắn và không cần lớp riêng"
      - "Dùng method reference để tái sử dụng hàm nghiệp vụ có sẵn"
      - "Chọn Function, Predicate, Comparator hoặc interface nghiệp vụ phù hợp với hợp đồng"
      - "Xử lý biến được capture, yêu cầu effectively final và trạng thái có thể thay đổi"
      - "Biểu diễn ngoại lệ và kết quả thất bại khi dùng chiến lược dạng lambda"
      - "Đặt tên và đăng ký lambda để vẫn truy vết được chiến lược đang thực thi"
      - "Chuyển từ lambda sang lớp riêng khi logic, phụ thuộc hoặc yêu cầu kiểm thử tăng lên"
  - level1: "Strategy bằng enum"
    level2:
      - "Biểu diễn tập chiến lược hữu hạn bằng các hằng enum có hành vi riêng"
      - "Hiện thực phương thức trừu tượng trên enum bằng thân lớp riêng của từng hằng"
      - "Cho enum triển khai interface để Context tiếp tục phụ thuộc vào hợp đồng chung"
      - "Gắn mã định danh và thông tin mô tả cho từng chiến lược enum"
      - "Ánh xạ dữ liệu đầu vào sang enum bằng mã ổn định và kiểm tra giá trị không hợp lệ"
      - "Tránh trạng thái theo yêu cầu và phụ thuộc có vòng đời ngắn trong hằng enum dùng chung"
      - "Nhận diện giới hạn mở rộng khi thêm chiến lược đòi hỏi sửa định nghĩa enum"
      - "So sánh enum, lớp triển khai và lambda theo khả năng mở rộng và quản lý phụ thuộc"
  - level1: "Generics và kiểu dữ liệu"
    level2:
      - "Thiết kế Strategy với tham số kiểu cho dữ liệu đầu vào và kết quả"
      - "Ràng buộc kiểu giữa Context và Strategy để phát hiện dùng sai ngay khi biên dịch"
      - "Sử dụng giới hạn kiểu và wildcard khi API nhận hoặc trả về chiến lược tổng quát"
      - "Đóng gói nhiều tham số nghiệp vụ trong đối tượng yêu cầu có ý nghĩa rõ ràng"
      - "Dùng đối tượng kết quả chung để tránh trả Object và ép kiểu tại bên gọi"
      - "Xử lý biến thể cần dữ liệu bổ sung mà không làm hợp đồng chung trở nên tùy tiện"
      - "Thiết kế registry có kiểm soát kiểu và nhận diện giới hạn do type erasure"
      - "Giữ các hợp đồng riêng khi hai thuật toán không có ngữ nghĩa thay thế tương đương"
  - level1: "Trạng thái và vòng đời"
    level2:
      - "Phân biệt chiến lược không trạng thái và chiến lược có trạng thái nội bộ"
      - "Tách cấu hình bất biến khỏi dữ liệu thay đổi theo từng yêu cầu xử lý"
      - "Xác định khi nào có thể tái sử dụng một instance Strategy cho nhiều Context"
      - "Chọn vòng đời theo ứng dụng, theo phiên hoặc theo yêu cầu dựa trên trạng thái"
      - "Tránh rò rỉ dữ liệu giữa các lần gọi khi chiến lược được dùng chung"
      - "Quy định quyền sở hữu và trách nhiệm đóng tài nguyên mà chiến lược sử dụng"
      - "Quản lý cache nội bộ với khóa, giới hạn dung lượng và cơ chế vô hiệu hóa phù hợp"
      - "Ghi rõ yêu cầu reset hoặc tạo instance mới đối với chiến lược tích lũy trạng thái"
  - level1: "Lựa chọn lúc chạy"
    level2:
      - "Chọn chiến lược từ tham số người dùng, loại yêu cầu hoặc ngữ cảnh nghiệp vụ"
      - "Tách bộ chọn Strategy khỏi Context để thay đổi chính sách lựa chọn độc lập"
      - "Ánh xạ mã chiến lược sang triển khai bằng Map thay cho chuỗi nhánh điều kiện"
      - "Chọn theo khả năng hỗ trợ dữ liệu và phân biệt supports với thực thi thuật toán"
      - "Quy định ưu tiên khi nhiều chiến lược phù hợp và tránh phụ thuộc thứ tự ngẫu nhiên"
      - "Xử lý rõ trường hợp không có chiến lược phù hợp hoặc mã lựa chọn không được nhận diện"
      - "Xác thực quyền sử dụng chiến lược và các ràng buộc nghiệp vụ trước khi thực thi"
      - "Cố định chiến lược cho một lần xử lý để bảo đảm kết quả nhất quán"
  - level1: "Registry và khởi tạo"
    level2:
      - "Thiết kế registry ánh xạ khóa ổn định sang các instance Strategy"
      - "Khởi tạo và đăng ký chiến lược tại điểm lắp ráp phụ thuộc của ứng dụng"
      - "Phát hiện khóa trùng, chiến lược thiếu và cấu hình không hợp lệ ngay khi khởi động"
      - "Dùng factory khi chiến lược cần tạo mới theo dữ liệu hoặc vòng đời cụ thể"
      - "Phân biệt trách nhiệm tạo Strategy của factory và trách nhiệm thực thi của Strategy"
      - "Giữ registry chỉ đọc sau khởi tạo khi không cần cập nhật động"
      - "Dùng ServiceLoader cho trường hợp mở rộng triển khai qua cơ chế cung cấp dịch vụ Java"
      - "Kiểm soát đăng ký động và tránh biến registry thành điểm truy cập phụ thuộc toàn cục"
  - level1: "Cấu hình và tích hợp"
    level2:
      - "Chọn chiến lược từ cấu hình môi trường và kiểm tra tính hợp lệ khi nạp cấu hình"
      - "Tích hợp Strategy vào lớp dịch vụ mà vẫn giữ hợp đồng độc lập với framework"
      - "Tiêm tập chiến lược qua dependency injection và dựng registry từ mã nghiệp vụ ổn định"
      - "Lắp ráp các bean Strategy trong Spring khi ứng dụng sử dụng Spring"
      - "Quy định chiến lược mặc định và tránh lựa chọn mơ hồ khi có nhiều triển khai"
      - "Bảo đảm mỗi chiến lược được tiêm đúng phụ thuộc và vòng đời cần thiết"
      - "Áp dụng feature flag hoặc phân nhóm thử nghiệm với quy tắc lựa chọn có thể kiểm tra"
      - "Thay cấu hình trong lúc chạy bằng ảnh chụp nhất quán và có đường quay lui"
  - level1: "Kết hợp chiến lược"
    level2:
      - "Ghép các chiến lược xử lý tuần tự khi đầu ra của bước trước là đầu vào bước sau"
      - "Kết hợp Predicate hoặc Comparator bằng các phép kết hợp có ngữ nghĩa rõ ràng"
      - "Bọc Strategy để bổ sung đo thời gian, ghi log hoặc cache mà giữ nguyên hợp đồng"
      - "Tách các chiều biến thiên độc lập thành các Strategy riêng thay vì nhân số lớp kết hợp"
      - "Xây dựng chiến lược tổng hợp có quy tắc kết hợp kết quả và xử lý lỗi rõ ràng"
      - "Xác định thứ tự áp dụng khi phép kết hợp các thuật toán không có tính giao hoán"
      - "Phân biệt chọn một Strategy với chạy nhiều handler trong một chuỗi xử lý"
      - "Giới hạn độ sâu kết hợp để hệ thống vẫn dễ theo dõi và kiểm thử"
  - level1: "Lỗi và dự phòng"
    level2:
      - "Phân loại lỗi đầu vào, lỗi nghiệp vụ và lỗi phụ thuộc bên ngoài trong Strategy"
      - "Quy định ngoại lệ chung và thông tin lỗi mà Context được phép xử lý"
      - "Chọn fail fast hoặc trả kết quả lỗi theo ngữ nghĩa của hợp đồng"
      - "Dùng chiến lược dự phòng khi được nghiệp vụ cho phép và giữ dấu vết lựa chọn"
      - "Tránh mặc định im lặng khi chiến lược không được tìm thấy hoặc cấu hình bị sai"
      - "Đặt retry và giới hạn thời gian ở ranh giới phù hợp với phụ thuộc bên ngoài"
      - "Bảo vệ tính lũy đẳng khi retry hoặc chuyển chiến lược sau một lần xử lý thất bại"
      - "Xác định ranh giới giao dịch và xử lý tác dụng phụ đã xảy ra trước khi thất bại"
  - level1: "Đồng thời và bất đồng bộ"
    level2:
      - "Đánh giá tính an toàn luồng của Strategy, dữ liệu dùng chung và các phụ thuộc"
      - "Ưu tiên chiến lược bất biến và biến cục bộ khi phục vụ nhiều yêu cầu đồng thời"
      - "Nhận diện race condition khi thay Strategy trên Context đang được dùng chung"
      - "Công bố tham chiếu Strategy an toàn và dùng một ảnh chụp cho mỗi lần thực thi"
      - "Tránh khóa quá rộng quanh thuật toán có thời gian chạy dài hoặc thao tác I/O"
      - "Thiết kế hợp đồng trả CompletionStage khi các biến thể đều xử lý bất đồng bộ"
      - "Thống nhất cách truyền lỗi, giới hạn thời gian và kỳ vọng hủy tác vụ bất đồng bộ"
      - "Truyền thông tin truy vết và ngữ cảnh yêu cầu khi thực thi trên luồng khác"
  - level1: "Hiệu năng và quan sát"
    level2:
      - "Phân biệt chi phí chọn chiến lược, cấp phát đối tượng và chạy thuật toán"
      - "Đo trên dữ liệu và điều kiện đại diện trước khi tối ưu cách hiện thực Strategy"
      - "Thiết kế phép đo hiệu năng Java có warmup và tránh kết luận từ phép đo thủ công đơn giản"
      - "So sánh các chiến lược theo độ trễ, thông lượng và mức dùng tài nguyên"
      - "Tái sử dụng chiến lược an toàn và kiểm soát chi phí tạo mới khi cần giữ trạng thái riêng"
      - "Gắn mã chiến lược ổn định vào log, metric và trace của lần xử lý"
      - "Theo dõi tỷ lệ lựa chọn, lỗi và sử dụng dự phòng theo từng chiến lược"
      - "Giữ nhãn metric có số lượng giá trị hữu hạn và hạn chế ghi dữ liệu nhạy cảm"
  - level1: "Tái cấu trúc mã"
    level2:
      - "Nhận diện cụm if/else hoặc switch đang chọn các thuật toán cùng mục đích"
      - "Ghi nhận hành vi hiện tại bằng kiểm thử trước khi tách các nhánh điều kiện"
      - "Tách dữ liệu chung và xác định hợp đồng đủ nhỏ cho các biến thể hiện có"
      - "Trích từng nhánh sang Strategy và giữ nguyên kết quả quan sát được"
      - "Đưa logic chung về Context và loại bỏ phần lặp giữa các triển khai"
      - "Chuyển lựa chọn sang bộ chọn hoặc registry và cập nhật nơi lắp ráp phụ thuộc"
      - "Chuyển dần các điểm gọi và đối chiếu hành vi sau mỗi bước thay đổi"
      - "Đánh giá lại thiết kế khi các nhánh khác nhau về quy trình thay vì thuật toán thay thế"
  - level1: "Phân biệt các mẫu"
    level2:
      - "Strategy và State: chọn thuật toán so với hành vi gắn với trạng thái và chuyển trạng thái"
      - "Strategy và Template Method: thay hành vi bằng composition so với khung xử lý qua kế thừa"
      - "Strategy và Command: thuật toán thay thế so với đối tượng biểu diễn yêu cầu thực thi"
      - "Strategy và Factory Method: thực thi hành vi so với quyết định tạo đối tượng"
      - "Strategy và Decorator: thay thuật toán so với bọc để bổ sung trách nhiệm"
      - "Strategy và Chain of Responsibility: chọn một biến thể so với chuyển yêu cầu qua chuỗi handler"
      - "Strategy và Bridge: thay thuật toán so với tách hai hệ phân cấp biến thiên độc lập"
      - "Strategy và đa hình đơn thuần: nhận diện ý định thiết kế thay vì chỉ nhìn cấu trúc interface"
  - level1: "Kiểm thử từng chiến lược"
    level2:
      - "Kiểm thử đơn vị từng ConcreteStrategy bằng đầu vào và kết quả nghiệp vụ rõ ràng"
      - "Dùng kiểm thử tham số hóa cho các trường hợp thông thường và các giá trị biên"
      - "Xây dựng bộ kiểm thử hợp đồng dùng chung cho mọi triển khai có thể thay thế nhau"
      - "Kiểm tra null, dữ liệu rỗng, dữ liệu không hợp lệ và ngoại lệ đã cam kết"
      - "Kiểm tra bất biến, tính xác định và tác dụng phụ theo hợp đồng của thuật toán"
      - "Dùng stub hoặc fake cho phụ thuộc bên ngoài để kiểm soát dữ liệu và tình huống lỗi"
      - "Kiểm thử lambda, method reference và enum qua cùng hợp đồng như chiến lược dạng lớp"
      - "Xác minh các thuật toán tương đương trên cùng dữ liệu khi nghiệp vụ yêu cầu kết quả giống nhau"
  - level1: "Kiểm thử Context và lựa chọn"
    level2:
      - "Dùng Strategy giả để kiểm tra Context chuyển đúng dữ liệu và trả đúng kết quả"
      - "Xác minh các bước dùng chung trong Context xảy ra đúng thứ tự quanh lời gọi Strategy"
      - "Kiểm thử ánh xạ mã chiến lược, khóa không tồn tại và khóa đăng ký trùng"
      - "Kiểm thử quy tắc ưu tiên khi nhiều chiến lược phù hợp với một yêu cầu"
      - "Kiểm tra thay Strategy giữa các lần gọi và giữ lựa chọn ổn định trong một lần gọi"
      - "Kiểm thử lỗi, dự phòng và điều kiện retry mà không che giấu thất bại gốc"
      - "Kiểm thử tích hợp cấu hình và dependency injection để phát hiện lắp ráp sai"
      - "Kiểm tra yêu cầu đồng thời và thêm biến thể mới mà không phải sửa Context"
  - level1: "Tình huống thực tế"
    level2:
      - "Tính phí vận chuyển theo hình thức giao hàng với đầu vào và đơn vị kết quả thống nhất"
      - "Áp dụng chính sách giảm giá theo nhóm khách hàng và quy tắc ưu tiên rõ ràng"
      - "Chọn thuật toán sắp xếp hoặc Comparator theo mục đích hiển thị dữ liệu"
      - "Xuất cùng mô hình dữ liệu sang các định dạng khác nhau bằng chiến lược xuất"
      - "Chọn thuật toán nén với hợp đồng về dữ liệu đầu ra và quyền sở hữu luồng I/O"
      - "Chọn cách định tuyến dựa trên mục tiêu thời gian, khoảng cách hoặc chi phí"
      - "Chọn chiến lược phân bổ công việc theo tải và khả năng của tài nguyên"
      - "So sánh các tình huống để nhận diện ranh giới thuật toán và phần thuộc về bộ chọn"
  - level1: "Bài thực hành Java"
    level2:
      - "Xây dựng ứng dụng tính phí vận chuyển với interface, ba chiến lược và một Context"
      - "Chuyển một chiến lược đơn giản sang lambda và một hàm có sẵn sang method reference"
      - "Hiện thực lại tập chiến lược hữu hạn bằng enum và giải thích các đánh đổi"
      - "Bổ sung registry để chọn chiến lược từ mã nhập vào mà không sửa Context"
      - "Thêm chiến lược cần phụ thuộc bên ngoài và truyền phụ thuộc qua constructor"
      - "Tái cấu trúc phiên bản dùng switch sang Strategy với kiểm thử bảo toàn hành vi"
      - "Viết bộ kiểm thử hợp đồng, kiểm thử bộ chọn và các trường hợp lỗi biên"
      - "Hoàn thiện bài tổng hợp với cấu hình, lựa chọn lúc chạy và một biến thể bổ sung"
  - level1: "Sai lầm thường gặp"
    level2:
      - "Tạo Strategy cho mọi khác biệt nhỏ khiến mô hình phức tạp hơn nhu cầu thực tế"
      - "Đưa toàn bộ logic lựa chọn trở lại Context bằng instanceof hoặc tên lớp triển khai"
      - "Thiết kế hợp đồng quá chung bằng Object, Map tùy ý hoặc quá nhiều cờ điều khiển"
      - "Dùng cờ để phân nhánh nhiều thuật toán ngay bên trong một ConcreteStrategy"
      - "Cho các chiến lược có tiền điều kiện hoặc tác dụng phụ không tương thích dùng chung hợp đồng"
      - "Chia sẻ instance chứa dữ liệu theo yêu cầu gây nhiễu trạng thái giữa các bên gọi"
      - "Phụ thuộc vào thứ tự đăng ký ngẫu nhiên hoặc tự động chọn mặc định khi cấu hình sai"
      - "Lạm dụng mock và chi tiết nội bộ khiến kiểm thử không phản ánh hành vi nghiệp vụ"
  - level1: "Tiêu chí thiết kế"
    level2:
      - "Xác nhận mỗi Strategy đại diện một thuật toán có mục đích và hợp đồng rõ ràng"
      - "Kiểm tra Context chỉ phụ thuộc hợp đồng và giữ trách nhiệm điều phối nhất quán"
      - "Đánh giá việc thêm biến thể có giới hạn thay đổi tại triển khai và nơi đăng ký phù hợp"
      - "Rà soát quy tắc lựa chọn, hành vi khi không tìm thấy và khả năng truy vết quyết định"
      - "Rà soát tính thay thế, kiểu dữ liệu, ngoại lệ và các bất biến giữa các chiến lược"
      - "Kiểm tra vòng đời, tính an toàn luồng và quyền sở hữu tài nguyên của mỗi triển khai"
      - "Đánh giá độ bao phủ kiểm thử theo hợp đồng, từng biến thể và luồng tích hợp"
      - "Giải thích được lựa chọn interface, lambda hoặc enum và thời điểm nên đơn giản hóa thiết kế"
