menu:
  - level1: "Bản chất Singleton"
    level2:
      - "Ý định của Singleton và hai trách nhiệm kiểm soát khởi tạo, cung cấp điểm truy cập"
      - "Phân biệt một instance được bảo đảm với một instance do quy ước sử dụng"
      - "Phạm vi một instance theo định nghĩa lớp và class loader nạp lớp đó"
      - "Vì sao Singleton không bảo đảm duy nhất giữa nhiều JVM, tiến trình hoặc máy chủ"
      - "Phân biệt Singleton với biến static, lớp tiện ích, đối tượng bất biến và tài nguyên dùng chung"
      - "Chi phí của điểm truy cập toàn cục đối với phụ thuộc, khả năng thay đổi và kiểm thử"
      - "Các bất biến cần xác định trước khi lựa chọn một biến thể Singleton"
  - level1: "Đánh giá nhu cầu"
    level2:
      - "Phân biệt yêu cầu chỉ được có một đối tượng với nhu cầu tái sử dụng một đối tượng"
      - "Xác định phạm vi chia sẻ theo ứng dụng, tenant, request, luồng hoặc phiên làm việc"
      - "Đánh giá chi phí khởi tạo, tần suất truy cập và yêu cầu khởi động ứng dụng"
      - "Xác định chủ sở hữu của cấu hình, phụ thuộc và tài nguyên mà Singleton sử dụng"
      - "Nhận diện dữ liệu người dùng và trạng thái nghiệp vụ không nên đặt trong Singleton toàn cục"
      - "Đánh giá tác động của nhiều bản triển khai ứng dụng đối với yêu cầu duy nhất"
      - "Tiêu chí chọn Singleton hoặc chuyển sang quản lý đối tượng tại composition root"
  - level1: "Cấu trúc cơ bản"
    level2:
      - "Vai trò của constructor private, trường lưu instance và phương thức truy cập"
      - "Ngăn khởi tạo tùy ý bằng giới hạn truy cập và thiết kế lớp không cho kế thừa"
      - "Chọn công khai trường instance hay cung cấp phương thức getInstance"
      - "Tách API nghiệp vụ khỏi cơ chế lấy instance để giảm phụ thuộc vào static"
      - "Giữ constructor đơn giản và tránh để this thoát ra trước khi khởi tạo hoàn tất"
      - "Phân biệt tính duy nhất của instance với tính đúng đắn của hành vi nghiệp vụ"
      - "Xác định hành vi khi khởi tạo lỗi, khi truy cập lại và khi tài nguyên đã đóng"
  - level1: "Khởi tạo eager"
    level2:
      - "Triển khai Singleton bằng trường private static final được gán khi lớp khởi tạo"
      - "Bảo đảm công bố an toàn nhờ cơ chế khởi tạo lớp của JVM"
      - "Phân biệt thời điểm nạp lớp với thời điểm khởi tạo lớp và tạo instance"
      - "Sử dụng static initialization block khi cần nhiều bước khởi tạo"
      - "Xử lý lỗi trong static initializer và ảnh hưởng đến các lần sử dụng lớp sau đó"
      - "Đánh giá chi phí khởi tạo sớm, bộ nhớ và tài nguyên có thể không được sử dụng"
      - "Trường hợp phù hợp với eager và các dấu hiệu nên cân nhắc lazy"
  - level1: "Khởi tạo lazy"
    level2:
      - "Triển khai lazy initialization đơn giản và diễn tiến của lần truy cập đầu tiên"
      - "Mô phỏng hai luồng cùng thấy instance bằng null và tạo nhiều đối tượng"
      - "Phân biệt lỗi tạo trùng instance với lỗi nhìn thấy trạng thái chưa được công bố an toàn"
      - "Vì sao kiểm tra null hoặc chỉ thêm volatile chưa làm thao tác tạo instance thành nguyên tử"
      - "Giới hạn áp dụng của lazy không đồng bộ trong chương trình thực sự đơn luồng"
      - "Đánh đổi giữa giảm chi phí khởi động và tăng độ trễ của lần truy cập đầu"
      - "Quy định retry hay giữ trạng thái thất bại khi quá trình tạo instance gặp lỗi"
  - level1: "Đồng bộ khởi tạo"
    level2:
      - "Bảo vệ toàn bộ getInstance bằng synchronized để triển khai lazy đúng đắn"
      - "Xác định monitor được sử dụng trong phương thức static synchronized"
      - "Tính loại trừ lẫn nhau và khả năng nhìn thấy dữ liệu sau khi nhả, nhận monitor"
      - "Chọn khóa riêng và tránh khóa trên đối tượng công khai hoặc có thể thay đổi"
      - "Chi phí đi qua vùng đồng bộ ở mỗi lần lấy instance và cách đánh giá thực tế"
      - "Rủi ro khi constructor giữ khóa rồi gọi phụ thuộc có khóa hoặc callback ngược"
      - "So sánh synchronized getter với eager, holder và double-checked locking"
  - level1: "Double-checked locking"
    level2:
      - "Cấu trúc hai lần kiểm tra null và vùng synchronized trong double-checked locking"
      - "Vai trò bắt buộc của volatile đối với trường instance trong biến thể DCL thông dụng"
      - "Vì sao DCL thiếu volatile không bảo đảm công bố đối tượng an toàn"
      - "Vì sao vẫn phải kiểm tra null lần thứ hai sau khi đã lấy được khóa"
      - "Dùng biến cục bộ để giảm số lần đọc volatile và giữ mã dễ kiểm tra"
      - "Giới hạn của DCL khi cấu hình khởi tạo phụ thuộc tham số ở lần gọi đầu tiên"
      - "Các bảo đảm của Java Memory Model từ Java 5 và rủi ro sao chép mã DCL cũ"
      - "Khi tính linh hoạt của DCL đáng với độ phức tạp so với holder"
  - level1: "Lazy holder"
    level2:
      - "Triển khai Initialization-on-demand holder bằng lớp static lồng nhau"
      - "Vì sao gọi getInstance mới kích hoạt khởi tạo lớp holder trong thiết kế thông dụng"
      - "Cơ chế JVM tuần tự hóa khởi tạo lớp và công bố instance an toàn"
      - "Tách lớp ngoài, lớp holder và API để giữ luồng khởi tạo rõ ràng"
      - "Ảnh hưởng của lỗi khởi tạo holder đến khả năng sử dụng lại lớp trong cùng class loader"
      - "Giới hạn của holder với tham số runtime, retry có kiểm soát và tái tạo instance"
      - "So sánh độ đơn giản, tính lazy và khả năng quản lý vòng đời với DCL"
  - level1: "Enum Singleton"
    level2:
      - "Triển khai enum một hằng làm Singleton và đặt hành vi nghiệp vụ vào enum"
      - "Thời điểm khởi tạo enum và phạm vi duy nhất theo lớp enum đã được nạp"
      - "Bảo toàn danh tính hằng enum khi dùng cơ chế Java serialization chuẩn"
      - "Vì sao reflection chuẩn không cho tạo enum bằng Constructor.newInstance"
      - "Giới hạn về kế thừa và cách enum triển khai interface để cung cấp hợp đồng"
      - "Trạng thái mutable trong enum vẫn cần chính sách an toàn luồng riêng"
      - "Đánh giá enum khi cần inject phụ thuộc, kiểm thử thay thế hoặc đóng tài nguyên"
  - level1: "Chọn cách triển khai"
    level2:
      - "Bảng so sánh eager, synchronized lazy, DCL, holder và enum theo cùng tiêu chí"
      - "Đối chiếu thời điểm khởi tạo, bảo đảm công bố và chi phí truy cập sau khởi tạo"
      - "So sánh khả năng nhận cấu hình runtime, báo lỗi và thử khởi tạo lại"
      - "Đối chiếu hành vi trước reflection, serialization và giới hạn của từng cơ chế"
      - "Chọn biến thể theo nhu cầu kiểm thử, quản lý tài nguyên và độ dễ bảo trì"
      - "Các câu hỏi cần trả lời trước khi tối ưu getter hoặc chọn DCL"
      - "Ghi lại lý do lựa chọn và điều kiện cần xem xét lại thiết kế Singleton"
  - level1: "Java Memory Model"
    level2:
      - "Khái niệm visibility, atomicity và ordering trong việc chia sẻ một đối tượng"
      - "Quan hệ happens-before của khởi tạo lớp, monitor và ghi đọc volatile tương ứng"
      - "Phân tích khởi tạo đối tượng, gán tham chiếu và nguy cơ công bố không an toàn"
      - "Bảo đảm của trường final và điều kiện không để this thoát trong constructor"
      - "Vì sao static hoặc final trên tham chiếu không tự bảo vệ mọi trạng thái bên trong"
      - "Phân biệt safe publication của instance với đồng bộ các thay đổi xảy ra về sau"
      - "Phân tích interleaving để giải thích lỗi thay vì suy luận từ một lần chạy thành công"
  - level1: "Trạng thái dùng chung"
    level2:
      - "Ưu tiên Singleton không trạng thái hoặc có dữ liệu bất biến khi phù hợp"
      - "Thiết kế bất biến và sao chép phòng vệ để tránh lộ dữ liệu nội bộ mutable"
      - "Bảo vệ thao tác đọc sửa ghi và các bất biến liên quan đến nhiều trường"
      - "Lựa chọn synchronized, Lock, Atomic hoặc concurrent collection theo loại thao tác"
      - "Vì sao concurrent collection không làm chuỗi thao tác nghiệp vụ tự động nguyên tử"
      - "Cập nhật cấu hình bằng immutable snapshot và công bố tham chiếu an toàn"
      - "Tránh giữ request context, thông tin người dùng hoặc dữ liệu tenant trong trường toàn cục"
      - "Kiểm soát kích thước cache, thời hạn dữ liệu và khả năng giải phóng tham chiếu"
      - "Nhận diện race condition, contention, deadlock và điểm nghẽn do trạng thái tập trung"
  - level1: "Cấu hình và phụ thuộc"
    level2:
      - "Tách việc đọc cấu hình và tạo dependency ra khỏi constructor của Singleton"
      - "Thiết kế khởi tạo có tham số và giải quyết xung đột giữa các lần gọi cấu hình khác nhau"
      - "Vì sao quy tắc lần gọi đầu tiên quyết định cấu hình dễ tạo hành vi khó dự đoán"
      - "Phân biệt cấu hình bất biến lúc khởi động với cấu hình được nạp lại khi chạy"
      - "Xử lý phụ thuộc vòng, khởi tạo đệ quy và callback gọi lại getInstance"
      - "Cung cấp Clock, nguồn ngẫu nhiên và client bên ngoài qua interface để dễ kiểm thử"
      - "Xác định thứ tự khởi tạo và chính sách khi một dependency không sẵn sàng"
  - level1: "Vòng đời tài nguyên"
    level2:
      - "Phân biệt vòng đời tham chiếu static, đối tượng Singleton và tài nguyên bên ngoài"
      - "Xác định thành phần chịu trách nhiệm mở, sử dụng và đóng tài nguyên"
      - "Áp dụng AutoCloseable và thiết kế close có thể gọi lặp an toàn khi cần"
      - "Phối hợp khởi tạo, sử dụng và đóng để tránh truy cập tài nguyên đã giải phóng"
      - "Quản lý executor, luồng nền, socket và connection pool do Singleton sở hữu"
      - "Chọn khởi tạo tài nguyên khi khởi động hoặc khi dùng lần đầu theo yêu cầu vận hành"
      - "Giới hạn của shutdown hook và lý do cần cơ chế shutdown rõ ràng của ứng dụng"
      - "Quy định hành vi sau close, khả năng tái tạo và nguy cơ giữ tham chiếu instance cũ"
      - "Ngăn rò rỉ tài nguyên khi quá trình khởi tạo chỉ hoàn tất một phần"
  - level1: "Phạm vi class loader"
    level2:
      - "Danh tính lớp trong JVM được xác định bởi tên lớp và class loader định nghĩa lớp"
      - "Hai class loader định nghĩa cùng lớp có thể tạo hai Singleton độc lập"
      - "Tác động của cơ chế ủy quyền nạp lớp đến việc chia sẻ Singleton"
      - "Phân tích Singleton trong ứng dụng plugin, application server và môi trường chạy kiểm thử"
      - "Ảnh hưởng của reload và redeploy đến instance, tài nguyên và dữ liệu static"
      - "Rò rỉ class loader do luồng nền, ThreadLocal, registry hoặc tham chiếu static giữ lại"
      - "Giới hạn của Singleton khi chạy nhiều JVM và yêu cầu phối hợp ở hệ thống phân tán"
      - "Chọn phạm vi sở hữu rõ ràng thay vì dựa vào giả định duy nhất trên toàn hệ thống"
  - level1: "Các đường tạo khác"
    level2:
      - "Constructor private giới hạn truy cập thông thường nhưng không phải ranh giới bảo mật"
      - "Reflection có thể ảnh hưởng Singleton dạng class khi quyền truy cập cho phép"
      - "Giới hạn của cờ kiểm tra trong constructor trước reflection và các thứ tự khởi tạo khác nhau"
      - "Java serialization có thể tạo đối tượng khác và vai trò của readResolve khi cần giữ danh tính"
      - "Phân biệt khôi phục danh tính bằng readResolve với khôi phục trạng thái hoặc tài nguyên"
      - "Ngăn clone ngoài ý muốn và hiểu điều kiện để Object.clone có thể được sử dụng"
      - "Đánh giá nhu cầu hỗ trợ serialization thay vì tự động thêm Serializable"
      - "Xác định mô hình đe dọa và giới hạn bảo đảm trước Unsafe hoặc cơ chế bỏ qua khởi tạo chuẩn"
  - level1: "Kiểm thử Singleton"
    level2:
      - "Kiểm tra cùng tham chiếu bằng phép so sánh danh tính thay vì chỉ dựa vào equals"
      - "Thiết kế kiểm thử truy cập đồng thời bằng barrier hoặc latch để phối hợp các luồng"
      - "Xác minh số lần thực thi khởi tạo và tính nhất quán của trạng thái quan sát được"
      - "Kiểm thử lỗi khởi tạo, truy cập lại, shutdown và truy cập sau khi tài nguyên đóng"
      - "Kiểm thử trạng thái mutable bằng tình huống tranh chấp và bất biến nghiệp vụ cụ thể"
      - "Cô lập dữ liệu dùng chung để tránh kiểm thử phụ thuộc thứ tự hoặc gây lỗi khi chạy song song"
      - "Dùng class loader hoặc JVM riêng khi cần kiểm thử lại trạng thái khởi tạo lớp"
      - "Giới hạn của resetForTest, reflection và static mocking đối với độ tin cậy của kiểm thử"
      - "Kết hợp lập luận Java Memory Model với kiểm thử stress vì kiểm thử không chứng minh hết interleaving"
  - level1: "Dependency injection"
    level2:
      - "Biểu diễn phụ thuộc bằng interface và truyền đối tượng qua constructor"
      - "Tạo một instance tại composition root rồi chia sẻ tường minh cho các thành phần sử dụng"
      - "Phân biệt phạm vi dùng chung của instance với cơ chế truy cập static toàn cục"
      - "Đưa cấu hình và dependency bắt buộc vào quá trình lắp ráp đối tượng"
      - "Thay implementation bằng fake hoặc stub trong kiểm thử mà không sửa trạng thái static"
      - "Quản lý startup và shutdown tập trung tại thành phần sở hữu vòng đời"
      - "Khi Singleton gây phụ thuộc ẩn, khó kiểm thử hoặc sai phạm vi thì ưu tiên DI"
      - "Đánh giá phần phức tạp được loại bỏ và phần trách nhiệm vẫn còn sau khi chuyển sang DI"
  - level1: "Singleton trong container"
    level2:
      - "Phân biệt GoF Singleton với singleton scope do DI container quản lý"
      - "Hiểu singleton scope trong Spring theo bean definition và container quản lý bean"
      - "Nhiều bean definition cùng kiểu hoặc nhiều application context có thể có các instance khác nhau"
      - "Singleton bean vẫn cần thiết kế an toàn khi nhiều luồng cùng truy cập"
      - "Vấn đề đưa dependency có vòng đời ngắn vào singleton bean và cách tra cứu đúng phạm vi"
      - "Để container quản lý lifecycle thay vì tự xây thêm getInstance cho bean"
      - "Phân biệt proxy được inject với đối tượng đích khi đánh giá danh tính và phạm vi"
  - level1: "Giải pháp thay thế"
    level2:
      - "Dùng đối tượng thông thường và factory khi cần kiểm soát cách tạo mà không ép duy nhất"
      - "Dùng static utility cho hàm thuần không có trạng thái hoặc vòng đời tài nguyên"
      - "Dùng immutable object được chia sẻ khi nhu cầu chỉ là tái sử dụng dữ liệu"
      - "Dùng registry theo khóa khi mỗi tenant hoặc mỗi cấu hình cần một instance riêng"
      - "Dùng object pool khi cần quản lý nhiều tài nguyên hữu hạn có thể tái sử dụng"
      - "Dùng request scope hoặc session scope cho trạng thái gắn với từng phạm vi tương ứng"
      - "Dùng cơ chế phối hợp bên ngoài tiến trình khi cần kiểm soát một chủ thể trên nhiều máy"
  - level1: "Tình huống áp dụng"
    level2:
      - "Phân tích kho cấu hình bất biến được chia sẻ và yêu cầu nạp lại cấu hình"
      - "Đánh giá bộ nhớ đệm dùng chung theo giới hạn dung lượng, tính nhất quán và phạm vi dữ liệu"
      - "Phân tích client dùng chung theo cam kết thread safety và vòng đời của thư viện"
      - "Phân biệt một đối tượng quản lý connection pool với việc chỉ dùng một kết nối cơ sở dữ liệu"
      - "Đánh giá dịch vụ logging hoặc metrics theo khả năng inject và chính sách vòng đời"
      - "Nhận diện bộ đếm, mã định danh và khóa toàn cục không được bảo đảm giữa nhiều JVM"
      - "Loại bỏ dữ liệu giỏ hàng, phiên đăng nhập và giao dịch khỏi Singleton dùng chung toàn ứng dụng"
  - level1: "Lỗi và chẩn đoán"
    level2:
      - "Chẩn đoán nhiều instance bằng cách đối chiếu đường khởi tạo và class loader định nghĩa lớp"
      - "Phân tích lỗi DCL thiếu volatile và lazy getter không được đồng bộ đúng cách"
      - "Nhận diện rò rỉ this, phụ thuộc vòng và khởi tạo đệ quy từ constructor"
      - "Phân biệt lỗi khởi tạo lớp ban đầu với lỗi sử dụng lớp đã ở trạng thái khởi tạo thất bại"
      - "Điều tra deadlock, contention và lời gọi I/O bên trong vùng khóa"
      - "Theo dõi rò rỉ bộ nhớ hoặc luồng sau redeploy và sau khi ứng dụng shutdown"
      - "Chẩn đoán kiểm thử không ổn định do trạng thái static còn lại giữa các trường hợp chạy"
      - "Bổ sung log và chỉ số có ích cho khởi tạo, lỗi và đóng tài nguyên mà không tạo phụ thuộc vòng"
  - level1: "Đánh giá hiệu năng"
    level2:
      - "Tách chi phí lấy instance khỏi chi phí công việc và truy cập trạng thái dùng chung"
      - "Đo riêng độ trễ khởi tạo lần đầu và chi phí truy cập khi hệ thống đã ổn định"
      - "Sử dụng JMH để so sánh các biến thể với warmup, fork và kết quả được tiêu thụ đúng cách"
      - "Tránh sai lệch do dead-code elimination, constant folding và benchmark chỉ tạo tranh chấp giả"
      - "Đánh giá throughput và độ trễ khi tăng số luồng hoặc thời gian giữ khóa"
      - "Quan sát bộ nhớ, tài nguyên và tác động startup trước khi quyết định chuyển eager sang lazy"
      - "Chỉ tối ưu cơ chế truy cập khi số đo cho thấy đó là điểm nghẽn có ý nghĩa"
  - level1: "Chuyển đổi mã cũ"
    level2:
      - "Lập danh sách nơi gọi getInstance và những phụ thuộc toàn cục đang bị che giấu"
      - "Tạo interface tại ranh giới sử dụng và chuyển từng thành phần sang constructor injection"
      - "Đặt adapter tương thích quanh API static để chuyển đổi từng bước"
      - "Di chuyển quyền tạo instance và cấu hình về composition root hoặc DI container"
      - "Chuyển trách nhiệm đóng tài nguyên và xử lý lỗi về chủ sở hữu vòng đời mới"
      - "Kiểm tra tính tương thích của trạng thái, danh tính và phạm vi chia sẻ trong giai đoạn chuyển tiếp"
      - "Loại bỏ adapter, reset hook và điểm truy cập static khi các nơi sử dụng đã được chuyển đổi"
  - level1: "Bài tập thực hành"
    level2:
      - "Xây dựng cùng một dịch vụ bằng eager, synchronized lazy, holder, enum và DCL"
      - "Tái hiện race condition của lazy không đồng bộ bằng các luồng được phối hợp có chủ đích"
      - "Giải thích từng quan hệ happens-before trong các phiên bản bảo đảm công bố an toàn"
      - "Dùng hai class loader riêng để quan sát hai instance của cùng mã lớp"
      - "So sánh hành vi serialization của class thông thường, class có readResolve và enum"
      - "Thiết kế Singleton có tài nguyên với kiểm thử đóng lặp, khởi tạo lỗi và truy cập đồng thời lúc đóng"
      - "Chuyển một bộ nhớ đệm Singleton có trạng thái sang dịch vụ được inject và kiểm thử độc lập"
      - "Viết quyết định thiết kế dựa trên phạm vi duy nhất, chi phí, vòng đời và khả năng kiểm thử"
  - level1: "Rà soát thiết kế"
    level2:
      - "Xác nhận yêu cầu một instance và phạm vi duy nhất đã được mô tả chính xác"
      - "Kiểm tra mọi đường tạo đối tượng và cơ chế công bố instance cho các luồng"
      - "Kiểm tra bất biến nghiệp vụ, dữ liệu mutable và sự cô lập người dùng hoặc tenant"
      - "Xác nhận chính sách cấu hình, lỗi khởi tạo, retry, shutdown và sử dụng sau close"
      - "Đánh giá ảnh hưởng của class loader, redeploy và nhiều JVM đối với thiết kế"
      - "Xác nhận khả năng thay thế dependency và chạy kiểm thử độc lập, song song"
      - "Ghi rõ lý do giữ Singleton hoặc lựa chọn DI cùng bằng chứng kiểm thử và đo hiệu năng cần thiết"
