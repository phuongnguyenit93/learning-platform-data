references:
  - title: "Martin Fowler — Bounded Context"
    url: "https://martinfowler.com/bliki/BoundedContext.html"
    description: "Ranh giới mô hình nghiệp vụ, ngôn ngữ thống nhất trong từng context và quan hệ giữa các context."
  - title: "Oracle Java Language Specification — Packages and Modules"
    url: "https://docs.oracle.com/javase/specs/jls/se21/html/jls-7.html"
    description: "Khái niệm Java package, module declarations, requires và exports để minh họa đóng gói và phụ thuộc."
  - title: "Spring Modulith — Fundamentals"
    url: "https://docs.spring.io/spring-modulith/reference/fundamentals.html"
    description: "API của module, phần triển khai nội bộ, phụ thuộc được phép và cấu trúc module trong ứng dụng Java/Spring."
  - title: "ArchUnit — User Guide"
    url: "https://www.archunit.org/userguide/html/000_Index.html"
    description: "Kiểm thử kiến trúc Java, quan hệ giữa package và class, quy tắc tầng và chu trình phụ thuộc."
  - title: "Spring Modulith — Verifying Application Module Structure"
    url: "https://docs.spring.io/spring-modulith/reference/verification.html"
    description: "Xác minh ranh giới module, không có chu trình và không truy cập vào package nội bộ."