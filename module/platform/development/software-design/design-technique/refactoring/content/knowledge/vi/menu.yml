menu:
- level1: Tổng quan
  level2:
  - Tái cấu trúc mã (refactoring) là gì và vì sao cần thực hiện
  - Phân biệt refactoring, sửa lỗi, thêm tính năng và viết lại
  - Cấu trúc bên trong và hành vi có thể quan sát của phần mềm
  - Mối quan hệ giữa refactoring, thiết kế tiến hóa và nợ kỹ thuật
  - Vai trò của các bước thay đổi nhỏ và phản hồi nhanh
  - Refactoring trước, trong và sau khi phát triển tính năng
  - Khi nào nên thực hiện, trì hoãn hoặc dừng refactoring
  - Thuật ngữ chính và lộ trình học các nhóm kỹ thuật
- level1: Bảo toàn hành vi
  level2:
  - Xác định hành vi cần giữ theo góc nhìn người sử dụng mã
  - Nhận diện đầu vào, đầu ra, ngoại lệ và tác dụng phụ
  - Giữ nguyên thứ tự thao tác khi thứ tự có ý nghĩa
  - Bảo toàn quy tắc nghiệp vụ và điều kiện bất biến
  - Phân biệt hợp đồng công khai với chi tiết triển khai nội bộ
  - Nhận diện hành vi ngầm qua thời gian, tài nguyên và dữ liệu lưu trữ
  - Xử lý hành vi sai đang được hệ thống khác dựa vào
  - Tách thay đổi cấu trúc khỏi thay đổi yêu cầu nghiệp vụ
  - Xác định bằng chứng đủ mạnh để kết luận hành vi được giữ
  - Giới hạn của kiểm thử và phân tích tĩnh trong chứng minh tương đương
- level1: Dấu hiệu cần cải tiến
  level2:
  - Mã trùng lặp và chi phí duy trì nhiều bản sao
  - Hàm quá dài và quá nhiều mức lồng nhau
  - Lớp quá lớn và nhiều lý do thay đổi
  - Danh sách tham số dài và dữ liệu thường đi cùng nhau
  - Lạm dụng kiểu nguyên thủy và mã loại
  - Dữ liệu và hành vi nằm xa nhau (Feature Envy)
  - Thay đổi phân tán nhiều nơi (Shotgun Surgery)
  - Một cấu trúc phải thay đổi vì nhiều nhóm yêu cầu khác nhau
  - Chuỗi truy cập dài và lớp trung gian không tạo giá trị
  - Ghép nối không phù hợp và phụ thuộc vòng
  - Nhánh điều kiện lặp lại theo cùng một loại đối tượng
  - Mã chết, tính tổng quát sớm và chú thích che giấu mã khó hiểu
  - Phân biệt dấu hiệu cần điều tra với kết luận bắt buộc phải sửa
- level1: Đánh giá thiết kế
  level2:
  - Đánh giá tính gắn kết và mức phụ thuộc giữa các thành phần
  - Xác định trách nhiệm và lý do thay đổi của từng phần mã
  - Tìm ranh giới khái niệm và mức trừu tượng phù hợp
  - Áp dụng SOLID như câu hỏi đánh giá thay vì khuôn bắt buộc
  - Cân bằng DRY, KISS và YAGNI khi lựa chọn thay đổi
  - Sử dụng độ phức tạp, độ dài và số phụ thuộc đúng bối cảnh
  - Phân tích lịch sử thay đổi để tìm điểm nóng
  - Ưu tiên mã vừa khó hiểu vừa thay đổi thường xuyên
  - Đánh giá tác động đến khả năng đọc, kiểm thử và sửa đổi
  - Tránh đồng nhất nhiều lớp, nhiều mẫu thiết kế với thiết kế tốt
- level1: Quy trình an toàn
  level2:
  - Xác định mục tiêu cụ thể và phạm vi thay đổi
  - Khảo sát luồng gọi, phụ thuộc và hợp đồng hiện có
  - Thiết lập trạng thái kiểm thử đạt trước khi sửa mã
  - Chọn chuỗi phép biến đổi nhỏ và có thể đảo ngược
  - Thực hiện một bước, chạy kiểm tra và đánh giá kết quả
  - Tách việc di chuyển mã khỏi thay đổi logic
  - Lưu các mốc thay đổi rõ ràng trong kiểm soát phiên bản
  - Xử lý kiểm thử thất bại mà không sửa theo phỏng đoán
  - Nhận diện khi cần quay lui hoặc đổi hướng
  - Xác định tiêu chí hoàn thành và tránh mở rộng phạm vi liên tục
- level1: Kiểm thử bảo vệ
  level2:
  - Chọn cấp kiểm thử theo hành vi và rủi ro thay đổi
  - Viết kiểm thử đặc tả hành vi hiện hữu (characterization test)
  - Bao phủ trường hợp biên, dữ liệu rỗng và lỗi
  - Kiểm tra đầu ra cùng tác dụng phụ quan trọng
  - Sử dụng kiểm thử so sánh trước và sau thay đổi
  - Áp dụng golden master hoặc snapshot có kiểm soát
  - Kiểm thử theo thuộc tính và điều kiện bất biến
  - Kiểm thử hợp đồng tại ranh giới thành phần
  - Phân biệt kiểm thử hành vi với kiểm thử khóa cứng cách triển khai
  - Đánh giá kiểm thử bằng lỗi giả định và kiểm thử đột biến
  - Giảm kiểm thử chập chờn trước khi dùng làm hàng rào bảo vệ
  - Đọc độ bao phủ mã đúng giới hạn của nó
- level1: Mã thiếu kiểm thử
  level2:
  - Đọc hiểu mã cũ từ điểm vào và luồng nghiệp vụ
  - Tìm điểm có thể can thiệp mà ít ảnh hưởng phần còn lại (seam)
  - Phá phụ thuộc khó kiểm thử theo từng bước nhỏ
  - Cô lập thời gian, số ngẫu nhiên và cấu hình toàn cục
  - Thay thế tương tác ngoài bằng thành phần kiểm thử phù hợp
  - Bao bọc thư viện và dịch vụ ngoài trước khi thay đổi
  - Giữ hành vi hiện tại bằng kiểm thử ở ranh giới ổn định
  - Đưa logic thuần ra khỏi vùng mã khó kiểm thử
  - Xử lý khởi tạo có tác dụng phụ và phụ thuộc tĩnh
  - Phân biệt hành vi cần giữ với lỗi cần sửa trong nhiệm vụ riêng
  - Xây dựng vùng mã có kiểm thử rồi mở rộng dần
- level1: Tên và diễn đạt
  level2:
  - Đổi tên để thể hiện ý nghĩa nghiệp vụ và mục đích
  - Đổi tên biến, hàm, lớp và mô đun nhất quán
  - Loại bỏ viết tắt khó hiểu và tên dễ gây nhầm lẫn
  - Phân biệt tên thể hiện ý định với tên mô tả thao tác máy móc
  - Thay số và chuỗi mang ý nghĩa bằng tên phù hợp
  - Dùng biến giải thích để làm rõ biểu thức phức tạp
  - Thống nhất từ vựng trong cùng một miền nghiệp vụ
  - Kiểm tra tác động của đổi tên qua reflection, cấu hình và dữ liệu ánh xạ
  - Giữ chú thích giải thích lý do và loại bỏ chú thích đã lỗi thời
- level1: Hàm và biểu thức
  level2:
  - Tách hàm theo một ý nghĩa rõ ràng (Extract Function)
  - Gộp hàm trung gian không còn giá trị (Inline Function)
  - Tách biến để đặt tên cho kết quả trung gian
  - Gộp biến khi tên trung gian không giúp hiểu mã
  - Chia hàm theo mức trừu tượng và các giai đoạn xử lý
  - Di chuyển câu lệnh đến gần nơi sử dụng
  - Tách các giai đoạn chuẩn bị, tính toán và xuất kết quả
  - Thay mã nội tuyến lặp lại bằng lời gọi hàm
  - Thay thuật toán bằng cách diễn đạt rõ hơn khi đã có bằng chứng tương đương
  - Kiểm tra phạm vi biến, thứ tự đánh giá và số lần thực thi
  - Tránh chia nhỏ hàm đến mức người đọc phải lần theo quá nhiều lớp
- level1: Giao diện hàm
  level2:
  - Thay đổi khai báo hàm và cập nhật các nơi gọi an toàn
  - Thêm, bỏ và sắp xếp tham số theo ý nghĩa sử dụng
  - Gom nhóm dữ liệu liên quan bằng đối tượng tham số
  - Truyền đối tượng đầy đủ khi phù hợp thay vì nhiều trường rời rạc
  - Thay tham số bằng truy vấn hoặc truy vấn bằng tham số theo ranh giới phụ thuộc
  - Loại bỏ tham số cờ bằng các hàm có ý định rõ ràng
  - Tham số hóa hành vi lặp lại khi khác biệt đã rõ
  - Trả về kết quả thay vì ghi vào tham số đầu ra
  - Tách thao tác truy vấn khỏi thao tác làm thay đổi trạng thái
  - Đưa hàm có quá nhiều dữ liệu trung gian vào một đối tượng chuyên trách
  - Phân biệt thay đổi giao diện nội bộ với thay đổi hợp đồng công khai
- level1: Điều kiện
  level2:
  - Phân rã điều kiện phức tạp thành các khái niệm có tên
  - Gom các nhánh có cùng kết quả xử lý
  - Đưa trường hợp đặc biệt ra đầu bằng mệnh đề bảo vệ
  - Giảm mức lồng nhau mà vẫn giữ thứ tự kiểm tra
  - Thay biến điều khiển bằng cấu trúc luồng rõ ràng
  - Thay điều kiện theo loại bằng đa hình khi có hành vi biến đổi ổn định
  - Biểu diễn trường hợp đặc biệt bằng đối tượng phù hợp
  - Phân biệt giá trị vắng mặt với một trường hợp nghiệp vụ hợp lệ
  - Giữ nguyên cơ chế đánh giá ngắn mạch và tác dụng phụ
  - Kiểm tra tính đầy đủ, chồng lấn và thứ tự ưu tiên các nhánh
  - Tránh tạo hệ phân cấp chỉ để loại bỏ một điều kiện đơn giản
- level1: Vòng lặp và tập hợp
  level2:
  - Tách vòng lặp đang thực hiện nhiều trách nhiệm
  - Gộp các bước duyệt chỉ khi không làm rối ý nghĩa
  - Thay vòng lặp bằng phép biến đổi tập hợp khi dễ đọc hơn
  - Thay chuỗi biến đổi khó hiểu bằng vòng lặp rõ ràng
  - Tách điều kiện lọc, ánh xạ và tổng hợp
  - Bảo toàn thứ tự phần tử, phần tử trùng và giá trị rỗng
  - Giữ đúng hành vi dừng sớm và xử lý lỗi giữa chừng
  - Kiểm soát tác dụng phụ trong phép duyệt tập hợp
  - Nhận diện thay đổi từ tính toán ngay sang tính toán trì hoãn
  - Đánh giá số lần duyệt, cấp phát và độ phức tạp sau thay đổi
- level1: Cấu trúc dữ liệu
  level2:
  - Đóng gói bản ghi để kiểm soát cách truy cập dữ liệu
  - Đóng gói tập hợp và tránh để bên gọi sửa trực tiếp
  - Thay dữ liệu nguyên thủy bằng kiểu biểu đạt ý nghĩa
  - Tách biến đang được dùng cho nhiều mục đích
  - Thay dữ liệu dẫn xuất được lưu bằng phép tính khi phù hợp
  - Chọn giữa đối tượng giá trị và đối tượng có danh tính
  - Chuyển đổi giữa tham chiếu dùng chung và giá trị độc lập
  - Thay biểu diễn dữ liệu mà giữ quy tắc so sánh và sắp xếp
  - Kiểm tra sao chép nông, sao chép sâu và tham chiếu dùng chung
  - Giữ ý nghĩa dữ liệu khi chuyển từ cấu trúc chung sang kiểu chuyên biệt
- level1: Trạng thái và bất biến
  level2:
  - Nhận diện trạng thái thuộc đối tượng và trạng thái có thể suy ra
  - Thu hẹp phạm vi biến và thời gian tồn tại của trạng thái
  - Khởi tạo đối tượng trong trạng thái hợp lệ
  - Loại bỏ hàm thay đổi trực tiếp dữ liệu khi không cần thiết
  - Chuyển đối tượng có thể thay đổi thành đối tượng bất biến theo từng bước
  - Đưa điều kiện bất biến về nơi sở hữu dữ liệu
  - Giảm trạng thái toàn cục và trạng thái chia sẻ ẩn
  - Phân biệt bất biến bề ngoài với bất biến của toàn bộ dữ liệu bên trong
  - Kiểm soát bộ nhớ đệm khi thay đổi cách lưu trạng thái
  - Xác minh các chuyển trạng thái và tình huống cập nhật một phần
- level1: Lớp và trách nhiệm
  level2:
  - Tách lớp đang chứa nhiều nhóm trách nhiệm (Extract Class)
  - Gộp lớp quá nhỏ hoặc chỉ chuyển tiếp không cần thiết
  - Ẩn chi tiết ủy quyền để giảm hiểu biết của bên gọi
  - Loại bỏ lớp trung gian không còn tạo giá trị
  - Đặt hành vi gần dữ liệu mà nó sử dụng
  - Tách điều phối quy trình khỏi tính toán nghiệp vụ
  - Phân biệt lớp dịch vụ, đối tượng nghiệp vụ và lớp hạ tầng
  - Tránh lớp điều phối tập trung quá nhiều kiến thức
  - Đánh giá kích thước giao diện và số lý do thay đổi
  - Giữ ranh giới lớp đơn giản sau khi tách trách nhiệm
- level1: Di chuyển mã
  level2:
  - Di chuyển hàm đến thành phần phù hợp hơn (Move Function)
  - Di chuyển trường dữ liệu về đúng nơi sở hữu
  - Di chuyển câu lệnh vào hoặc ra khỏi một hàm
  - Gom hành vi thường thay đổi cùng nhau
  - Tách các phần chỉ tình cờ nằm chung tệp hoặc lớp
  - Sắp xếp câu lệnh để bộc lộ phụ thuộc dữ liệu
  - Xử lý truy cập private và phạm vi hiển thị khi di chuyển
  - Cập nhật nơi gọi bằng lớp chuyển tiếp tạm thời
  - Kiểm tra vòng phụ thuộc mới sau khi chuyển mã
  - Phân biệt di chuyển thuần túy với sửa logic trong cùng thay đổi
- level1: Phụ thuộc và ranh giới
  level2:
  - Làm rõ phụ thuộc ẩn qua tham số và hàm khởi tạo
  - Áp dụng tiêm phụ thuộc để tách tạo đối tượng khỏi sử dụng
  - Đảo chiều phụ thuộc tại ranh giới cần thay thế
  - Đưa giao diện về phía sử dụng khi phù hợp
  - Bao bọc thư viện bên ngoài bằng lớp chuyển đổi
  - Tách logic nghiệp vụ khỏi giao diện người dùng và truy cập dữ liệu
  - Thay phụ thuộc tĩnh hoặc toàn cục bằng ranh giới rõ ràng
  - Giảm chuỗi truy cập sâu giữa các đối tượng
  - Phá vòng phụ thuộc bằng phân chia trách nhiệm
  - Tránh tạo giao diện cho mọi lớp khi chưa có nhu cầu
  - Kiểm thử hợp đồng giữa hai phía của ranh giới
- level1: Kế thừa và ủy quyền
  level2:
  - Đưa dữ liệu và hành vi chung lên lớp cha
  - Đưa dữ liệu và hành vi riêng xuống lớp con
  - Tách lớp cha khi có quan hệ kiểu phù hợp
  - Thu gọn hệ phân cấp không còn khác biệt có ý nghĩa
  - Hợp nhất logic khởi tạo trùng lặp trong hệ phân cấp
  - Thay lớp con bằng đối tượng được ủy quyền
  - Thay kế thừa triển khai bằng kết hợp đối tượng
  - Loại bỏ lớp con chỉ mã hóa một giá trị đơn giản
  - Kiểm tra khả năng thay thế kiểu con và hợp đồng kế thừa
  - Giữ ngữ nghĩa của phương thức ghi đè và lời gọi lớp cha
  - Xác minh tác động của đổi hệ phân cấp đến bên sử dụng
- level1: Mô hình nghiệp vụ
  level2:
  - Làm rõ thuật ngữ nghiệp vụ trước khi đổi cấu trúc mã
  - Thay chuỗi hoặc số rời rạc bằng kiểu nghiệp vụ có kiểm tra
  - Gom quy tắc đi cùng dữ liệu vào đối tượng thích hợp
  - Biểu diễn tiền tệ, đơn vị đo và khoảng thời gian rõ ràng
  - Thay mã loại bằng enum, đối tượng hoặc đa hình theo nhu cầu
  - Tách trạng thái nghiệp vụ khỏi cờ kỹ thuật tạm thời
  - Giảm mô hình dữ liệu chỉ chứa trường nhưng đẩy quy tắc ra nhiều nơi
  - Giữ ranh giới nhất quán khi tách hoặc gộp đối tượng
  - Refactoring hướng tới mẫu thiết kế khi vấn đề đã rõ
  - Tránh đưa mẫu thiết kế và mô hình phức tạp vào trước nhu cầu
- level1: Ngoại lệ và tài nguyên
  level2:
  - Phân biệt lỗi nghiệp vụ, lỗi kỹ thuật và lỗi lập trình
  - Chuẩn hóa đường xử lý lỗi mà giữ hợp đồng hiện có
  - Thu hẹp khối bắt lỗi và bảo toàn nguyên nhân gốc
  - Loại bỏ xử lý lỗi trùng lặp ở đúng ranh giới
  - Thay mã lỗi bằng ngoại lệ hoặc kiểu kết quả qua lớp tương thích khi cần
  - Giữ nguyên thời điểm phát sinh và thứ tự lan truyền lỗi
  - Bảo đảm đóng tệp, kết nối và tài nguyên khi tách hàm
  - Tách quản lý tài nguyên khỏi phần tính toán
  - Kiểm tra tác động của finally và lỗi xảy ra khi dọn dẹp
  - Tránh nuốt lỗi hoặc biến lỗi thành kết quả thành công trong lúc refactor
- level1: Tác dụng phụ
  level2:
  - Nhận diện đọc ghi tệp, mạng, cơ sở dữ liệu và trạng thái ngoài
  - Tách phần tính toán thuần khỏi phần tương tác bên ngoài
  - Đưa phụ thuộc vào thời gian và số ngẫu nhiên ra ranh giới
  - Tách truy vấn khỏi lệnh thay đổi trạng thái
  - Giữ thứ tự và số lần thực hiện tác dụng phụ
  - Không tự ý thay đổi hành vi thử lại hoặc tính lũy đẳng
  - Tách ghi nhật ký và đo lường mà không làm đổi luồng xử lý
  - Đưa quyết định nghiệp vụ ra khỏi lớp tích hợp
  - Kiểm tra khi thay việc tính lại bằng lưu kết quả tạm
  - Tránh làm mất tác dụng phụ khi thay vòng lặp bằng chuỗi biến đổi
- level1: Đồng thời và bất đồng bộ
  level2:
  - Nhận diện hợp đồng về thứ tự, đồng bộ và tính nguyên tử
  - Giữ phạm vi khóa khi tách hoặc di chuyển mã
  - Kiểm tra thay đổi khả năng nhìn thấy dữ liệu giữa các luồng
  - Tránh đưa trạng thái chia sẻ vào đối tượng vốn độc lập
  - Xử lý tác dụng phụ khi chuyển logic sang callback hoặc future
  - Bảo toàn ngữ cảnh thực thi, giao dịch và thông tin yêu cầu
  - Giữ hành vi timeout, hủy tác vụ và lan truyền ngoại lệ
  - Phân biệt refactoring với thay đổi mô hình thực thi đồng thời
  - Kiểm thử tình huống đua dữ liệu và thứ tự thực thi bất lợi
  - Đánh giá nguy cơ deadlock và giữ tài nguyên sau thay đổi
- level1: Lưu trữ và giao dịch
  level2:
  - Tách truy vấn dữ liệu khỏi quy tắc nghiệp vụ
  - Giữ ranh giới giao dịch khi tách lớp và di chuyển hàm
  - Phân biệt thay đổi cách tổ chức mã với thay đổi lược đồ dữ liệu
  - Bảo toàn mức cô lập và thứ tự cập nhật dữ liệu
  - Kiểm tra tác động của tải trì hoãn và vòng đời phiên truy cập dữ liệu
  - Tránh tạo truy vấn N+1 hoặc tăng số lần truy cập ngoài ý muốn
  - Giữ hành vi ánh xạ, giá trị mặc định và xử lý dữ liệu rỗng
  - Sử dụng lớp tương thích khi đổi mô hình dữ liệu được lưu
  - Điều phối thay đổi lược đồ theo cách mở rộng rồi thu hẹp khi được yêu cầu
  - Kiểm thử hoàn tác giao dịch và cập nhật thất bại giữa chừng
  - Xác minh tương thích giữa phiên bản mã mới và dữ liệu hiện hữu
- level1: API và tương thích
  level2:
  - Xác định các bên sử dụng trước khi đổi giao diện công khai
  - Giữ hợp đồng đầu vào, đầu ra và cách báo lỗi
  - Đổi tên hoặc tách API qua lớp chuyển tiếp có thời hạn
  - Tách giao diện nội bộ mới khỏi giao diện công khai cũ
  - Kiểm soát tương thích mã nguồn và tương thích nhị phân
  - Bảo toàn định dạng JSON, tệp và dữ liệu tuần tự hóa
  - Kiểm tra reflection, annotation, cấu hình và cơ chế tạo proxy
  - Xử lý hàm tạo và điểm mở rộng đang được bên ngoài sử dụng
  - Đánh dấu ngừng hỗ trợ và lập kế hoạch bỏ giao diện cũ
  - Kiểm thử hợp đồng với các bên sử dụng đại diện
  - Phân biệt refactoring nội bộ với thay đổi API cần quản lý phiên bản
- level1: Cấu trúc mô đun
  level2:
  - Nhóm mã theo khả năng nghiệp vụ và quan hệ thay đổi
  - Phân biệt tổ chức theo tầng kỹ thuật với theo tính năng
  - Di chuyển package hoặc mô đun theo từng bước tương thích
  - Thu hẹp phần giao diện được công khai giữa mô đun
  - Tách mã dùng chung khi có khái niệm chung thực sự
  - Tránh thư mục tiện ích tập trung mọi trách nhiệm
  - Phá vòng phụ thuộc giữa mô đun mà không chuyển vòng sang nơi khác
  - Giữ hướng phụ thuộc phù hợp với ranh giới thiết kế
  - Kiểm tra cấu hình build, tài nguyên và cơ chế khám phá lớp sau di chuyển
  - Đánh giá khi nên giữ một mô đun thay vì tách nhỏ
- level1: Cải tiến kiểm thử
  level2:
  - Nhận diện mã kiểm thử khó đọc, trùng lặp và phụ thuộc thứ tự
  - Đặt tên kiểm thử theo hành vi và điều kiện
  - Tách chuẩn bị dữ liệu, thực thi và kiểm chứng kết quả
  - Dùng bộ tạo dữ liệu kiểm thử để làm rõ phần liên quan
  - Tách dữ liệu mặc định khỏi dữ liệu quyết định tình huống
  - Giảm mock gắn chặt với lời gọi nội bộ
  - Thay kiểm chứng tương tác bằng kiểm chứng kết quả khi phù hợp
  - Gom kiểm thử theo hành vi mà vẫn giữ phản hồi lỗi rõ ràng
  - Không thay đồng thời mã thật và kết quả kỳ vọng để che lỗi
  - Giữ khả năng cô lập, tốc độ và tính xác định của bộ kiểm thử
- level1: Hiệu năng và tài nguyên
  level2:
  - Phân biệt refactoring với tối ưu hóa có chủ đích
  - Đo đường cơ sở trước khi thay cấu trúc vùng mã nhạy cảm
  - Nhận diện thay đổi độ phức tạp và số lần tính toán
  - Kiểm tra cấp phát, sao chép dữ liệu và thời gian giữ tài nguyên
  - Đánh giá chi phí trừu tượng hóa và lời gọi gián tiếp theo bằng chứng
  - Giữ thứ tự phép tính khi số học dấu phẩy động có thể khác kết quả
  - Kiểm tra tác động của thay đổi cấu trúc dữ liệu đến thứ tự duyệt
  - Đánh giá độ trễ, thông lượng và bộ nhớ trong tình huống đại diện
  - Không đánh đổi khả năng đọc chỉ dựa trên suy đoán hiệu năng
  - Quyết định tách thay đổi hiệu năng thành nhiệm vụ riêng khi hành vi vận hành thay đổi
- level1: Công cụ hỗ trợ
  level2:
  - Sử dụng IDE để đổi tên, tách hàm và di chuyển mã
  - Kiểm tra điều kiện áp dụng trước khi chấp nhận biến đổi tự động
  - Đọc bản xem trước và kiểm tra toàn bộ nơi bị ảnh hưởng
  - Kết hợp trình biên dịch, kiểm tra kiểu và phân tích tĩnh
  - Tìm tham chiếu qua mã nguồn, chuỗi cấu hình và tài nguyên
  - Áp dụng công cụ viết lại mã theo quy tắc cho thay đổi lặp lại
  - Thử quy tắc tự động trên phạm vi nhỏ trước khi mở rộng
  - Phân biệt định dạng mã, sửa cảnh báo và refactoring
  - Sử dụng công cụ AI để đề xuất thay đổi và tự kiểm chứng kết quả
  - Nhận diện giới hạn công cụ với reflection, sinh mã và liên kết động
  - Kiểm soát diff để tránh trộn nhiều thay đổi không liên quan
- level1: Thay đổi quy mô lớn
  level2:
  - Chọn refactoring chuẩn bị trước khi thêm tính năng
  - Cải tiến cục bộ trong lúc đọc hiểu hoặc sửa mã
  - Lập kế hoạch thay đổi nhiều nơi với mục tiêu đo được
  - Di chuyển theo từng phần thay vì thay thế đồng loạt
  - Sử dụng lớp tương thích để mã cũ và mã mới cùng tồn tại
  - Tách phía sử dụng khỏi triển khai bằng ranh giới trừu tượng
  - Quản lý chuỗi phụ thuộc giữa các thay đổi nhỏ
  - Duy trì kiểm thử và khả năng phát hành trong quá trình chuyển đổi
  - Theo dõi mã chuyển tiếp và thời điểm loại bỏ
  - Xác định điểm dừng khi lợi ích tiếp theo không còn tương xứng
  - Phân biệt refactoring diện rộng với thiết kế lại kiến trúc cần phạm vi riêng
- level1: Làm việc nhóm
  level2:
  - Giải thích vấn đề, mục tiêu và bằng chứng trước khi đề xuất refactor
  - Chọn phạm vi phù hợp với công việc hiện tại của nhóm
  - Tách commit di chuyển mã, đổi cấu trúc và thay hành vi
  - Viết mô tả thay đổi để người khác kiểm tra được tính bảo toàn
  - Phối hợp khi nhiều người cùng sửa một vùng mã
  - Giảm xung đột bằng các bước nhỏ và tích hợp thường xuyên
  - Rà soát theo trách nhiệm, hợp đồng và rủi ro thay vì sở thích cá nhân
  - Kết hợp làm việc cặp và truyền đạt kiến thức mã cũ
  - Thống nhất nguyên tắc đặt tên và ranh giới thiết kế
  - Ghi nhận quyết định quan trọng mà không tạo tài liệu thừa
- level1: Đánh giá kết quả
  level2:
  - Đối chiếu kết quả với mục tiêu và phạm vi ban đầu
  - Kiểm tra hành vi thường gặp, trường hợp biên và đường lỗi
  - Đánh giá mức dễ đọc và khả năng giải thích luồng xử lý
  - Xác minh trách nhiệm rõ hơn và phụ thuộc phù hợp hơn
  - Đánh giá khả năng thực hiện thay đổi tiếp theo
  - Kiểm tra hợp đồng công khai, dữ liệu lưu trữ và cấu hình tích hợp
  - So sánh hiệu năng khi thay đổi nằm trên đường xử lý quan trọng
  - Rà soát mã chết, lớp chuyển tiếp và kiểm thử đã lỗi thời
  - Phát hiện trừu tượng hóa thừa và dấu hiệu thiết kế kém mới xuất hiện
  - Giữ bằng chứng kiểm tra và những rủi ro còn lại
  - Không dùng số dòng giảm hoặc số lớp tăng làm thước đo thành công duy nhất
- level1: Sai lầm thường gặp
  level2:
  - Viết lại nhiều phần mã trong một bước rồi mới chạy kiểm thử
  - Trộn sửa lỗi, đổi yêu cầu và đổi cấu trúc trong cùng thay đổi
  - Sửa kiểm thử để phù hợp mã mới mà không kiểm tra hợp đồng cũ
  - Áp dụng mẫu thiết kế để làm mã trông phức tạp hơn
  - Loại bỏ mọi mã trùng dù các phần có lý do thay đổi khác nhau
  - Tách hàm và lớp quá mức làm mất luồng đọc
  - Đổi tên hoặc chữ ký mà bỏ sót người dùng ngoài kho mã
  - Vô tình đổi thứ tự tác dụng phụ, khóa hoặc giao dịch
  - Tối ưu hóa theo phỏng đoán và làm mất khả năng kiểm chứng
  - Kéo dài lớp tương thích đến mức tạo hai thiết kế song song
  - Refactor không có mục tiêu trong vùng mã ổn định và rủi ro cao
- level1: Bài thực hành
  level2:
  - Thiết lập dự án thực hành và ghi lại hành vi ban đầu
  - Viết kiểm thử đặc tả cho một đoạn mã chưa có kiểm thử
  - Tách hàm dài và đặt tên theo ý nghĩa nghiệp vụ
  - Đơn giản hóa điều kiện lồng nhau mà giữ thứ tự đánh giá
  - Đóng gói dữ liệu và thay kiểu nguyên thủy bằng kiểu có ý nghĩa
  - Tách lớp nhiều trách nhiệm và di chuyển hành vi về nơi phù hợp
  - Phá phụ thuộc tĩnh và cô lập tương tác bên ngoài
  - Thay kế thừa không phù hợp bằng ủy quyền
  - Cải tiến vòng lặp và kiểm chứng thứ tự, phần tử trùng và đường lỗi
  - Giữ hợp đồng công khai khi thay đổi giao diện nội bộ
  - Refactor mã có giao dịch hoặc tài nguyên cần đóng
  - Thực hiện chuỗi thay đổi nhỏ với kiểm thử sau từng bước
  - Rà soát diff, đánh giá thiết kế và ghi nhận giới hạn kiểm chứng
  - Loại bỏ mã chuyển tiếp sau khi xác nhận toàn bộ bên sử dụng đã chuyển đổi
