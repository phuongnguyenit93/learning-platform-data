references:
  - title: "OMG — Model Driven Architecture"
    url: "https://www.omg.org/mda/"
    description: "Tổng quan cách tiếp cận MDA, phân tách logic miền và công nghệ triển khai, các tiêu chuẩn UML/MOF/XMI."
  - title: "OMG — MDA Specifications"
    url: "https://www.omg.org/mda/specs.htm"
    description: "Giải thích PIM, PSM, metamodel, MOF, mô hình hóa và biến đổi trong Model Driven Architecture."
  - title: "OMG — UML Specification"
    url: "https://www.omg.org/spec/UML/"
    description: "Tiêu chuẩn ngôn ngữ mô hình hóa UML cho cấu trúc, hành vi và các quan hệ trong hệ thống."
  - title: "OMG — Object Constraint Language"
    url: "https://www.omg.org/technology/documents/formal/ocl.htm"
    description: "Đặc tả OCL để biểu diễn ràng buộc và kiểm tra quy tắc trên mô hình."
  - title: "OMG — MOF Query/View/Transformation"
    url: "https://www.omg.org/spec/QVT/"
    description: "Tiêu chuẩn cho truy vấn và phép biến đổi model-to-model, hỗ trợ ánh xạ PIM sang PSM."
  - title: "Eclipse — Modeling Framework (EMF)"
    url: "https://eclipse.dev/emf/"
    description: "Ecore metamodel, XMI, EMF runtime và sinh các lớp Java hoặc editor từ mô hình dữ liệu."
  - title: "Eclipse — Xtext Documentation"
    url: "https://eclipse.dev/Xtext/documentation/"
    description: "Tạo ngôn ngữ đặc thù miền (DSL), parser, validation, IDE tooling và mô hình từ cú pháp văn bản."
  - title: "Eclipse — Acceleo 4 User Guide"
    url: "https://help.eclipse.org/latest/topic/org.eclipse.acceleo.aql.doc/doc/index.html"
    description: "Sinh mã và các tệp cấu hình/tài liệu từ model thông qua template model-to-text."