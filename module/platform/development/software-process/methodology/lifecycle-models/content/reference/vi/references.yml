references:
  - title: "ISO/IEC/IEEE 12207:2026 — Software Life Cycle Processes"
    url: "https://www.iso.org/standard/90219.html"
    description: "Khung tiêu chuẩn hiện hành về các quy trình vòng đời phần mềm từ phát triển, vận hành, bảo trì đến ngừng dùng."
  - title: "SEBoK — Life Cycle Models"
    url: "https://sebokwiki.org/wiki/Life_Cycle_Models"
    description: "Định nghĩa mô hình vòng đời, các giai đoạn, milestone, sự lặp lại và quan hệ với DevOps."
  - title: "SEBoK — Sequential Development Approach"
    url: "https://sebokwiki.org/wiki/Sequential_Development_Approach"
    description: "Phát triển tuần tự, Vee model, kiểm chứng và xác nhận trong các bước thiết kế/phát triển."
  - title: "SEBoK — Incremental Development Approach"
    url: "https://sebokwiki.org/wiki/Incremental_Development_Approach"
    description: "So sánh iterative, incremental, vòng phản hồi và tiếp cận rủi ro theo Spiral/ICSM."
  - title: "IBM — What Is the SDLC?"
    url: "https://www.ibm.com/think/topics/sdlc"
    description: "Tổng quan các pha và mô hình SDLC: Waterfall, V-model, Iterative, Spiral, Agile và RAD."
  - title: "IBM — Agile vs. Waterfall"
    url: "https://www.ibm.com/think/topics/agile-vs-waterfall"
    description: "So sánh quy trình tuần tự với thích ứng, yêu cầu thay đổi và điều kiện lựa chọn."
  - title: "IBM — Rapid Application Development"
    url: "https://www.ibm.com/think/topics/rapid-application-development"
    description: "Prototyping, chu kỳ nhận phản hồi người dùng, lợi thế và giới hạn của RAD."
  - title: "Agile Manifesto — Principles"
    url: "https://agilemanifesto.org/principles"
    description: "Các nguyên tắc phần mềm chạy được, phản hồi, cộng tác và bàn giao liên tục."
  - title: "SEBoK — Development Approaches"
    url: "https://sebokwiki.org/wiki/Development_Approaches"
    description: "Phân loại sequential, incremental, evolutionary và nhận diện sự giao thoa giữa các cách tiếp cận."