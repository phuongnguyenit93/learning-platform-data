menu:
- level1: Định hướng
  level2:
  - Phát triển Agile là gì và giải quyết vấn đề nào trong phần mềm
  - Phân biệt Agile, phương pháp, khung làm việc và thực hành kỹ thuật
  - Mối liên hệ giữa nhu cầu thay đổi, phản hồi và khả năng thích ứng
  - 'Các khái niệm nền: giá trị, vòng lặp, phần tăng trưởng và luồng công việc'
  - Phân biệt phát triển lặp với phát triển tăng trưởng
  - Agile trong toàn bộ vòng đời từ khám phá đến vận hành
  - Quan hệ giữa Agile, Scrum, Kanban, Lean và Extreme Programming
  - Điều kiện áp dụng và giới hạn của phát triển Agile
  - Trình tự học từ tư duy nền tảng đến thực hành trong nhóm
- level1: Nền tảng Agile
  level2:
  - Bối cảnh hình thành Tuyên ngôn Agile năm 2001
  - Những khó khăn của việc cố định giải pháp khi hiểu biết còn thay đổi
  - Giảm bất định bằng các vòng phản hồi ngắn
  - Chia nhỏ việc bàn giao để sớm kiểm chứng giá trị
  - Cân bằng khả năng thích ứng với tính kỷ luật
  - Phân biệt thực hiện hoạt động Agile với thay đổi cách ra quyết định
  - Vai trò của kỹ năng con người, năng lực kỹ thuật và môi trường tổ chức
  - Agile và mối liên hệ với tư duy tinh gọn cùng phát triển sản phẩm
- level1: Giá trị Agile
  level2:
  - Cá nhân và tương tác so với quy trình và công cụ
  - Phần mềm hoạt động được so với tài liệu đầy đủ
  - Cộng tác với khách hàng so với đàm phán hợp đồng
  - Ứng phó thay đổi so với bám theo kế hoạch
  - Hiểu đúng việc coi trọng hai phía trong mỗi cặp giá trị
  - Vận dụng bốn giá trị vào quyết định công việc hằng ngày
- level1: Nguyên tắc Agile
  level2:
  - Ưu tiên sự hài lòng của khách hàng bằng phần mềm có giá trị được bàn giao sớm và liên tục
  - Đón nhận thay đổi yêu cầu trong quá trình phát triển
  - Bàn giao phần mềm hoạt động được thường xuyên với chu kỳ phù hợp
  - Cộng tác thường xuyên giữa người làm nghiệp vụ và người phát triển
  - Xây dựng môi trường hỗ trợ, tin tưởng và tạo động lực cho con người
  - Giao tiếp trực tiếp để truyền đạt thông tin hiệu quả
  - Sử dụng phần mềm hoạt động được làm thước đo tiến triển chủ yếu
  - Duy trì nhịp phát triển bền vững
  - Chú trọng năng lực kỹ thuật và thiết kế tốt
  - Đơn giản hóa bằng cách giảm công việc không cần thiết
  - Tạo điều kiện để nhóm tự tổ chức hình thành giải pháp phù hợp
  - Thường xuyên nhìn lại và điều chỉnh cách làm
  - Liên kết mười hai nguyên tắc với các quyết định thực tế trong nhóm
- level1: Tư duy thực nghiệm
  level2:
  - Phân biệt điều đã biết, giả định và điều cần khám phá
  - Minh bạch thông tin để nhóm và bên liên quan cùng hiểu thực tế
  - Kiểm tra kết quả và điều chỉnh dựa trên bằng chứng
  - Đặt giả thuyết trước khi triển khai giải pháp
  - Thiết kế thử nghiệm nhỏ để giảm rủi ro học sai
  - Rút ngắn vòng phản hồi từ người dùng, phần mềm và hệ thống vận hành
  - Ra quyết định khi thông tin chưa đầy đủ và khả năng thay đổi còn cao
  - Tránh biến nghi thức và chỉ số thành mục tiêu tự thân
- level1: Sản phẩm và giá trị
  level2:
  - Phân biệt đầu ra bàn giao với kết quả mang lại cho người dùng
  - Xác định vấn đề, nhóm người dùng và giá trị cần tạo
  - Liên kết tầm nhìn, mục tiêu sản phẩm và công việc ngắn hạn
  - Kết hợp khám phá nhu cầu với phát triển giải pháp
  - Xác định phần sản phẩm nhỏ nhất để kiểm chứng một giả định
  - Phân biệt nguyên mẫu, sản phẩm khả dụng tối thiểu và phần tăng trưởng có thể sử dụng
  - Thu thập phản hồi từ sử dụng thực tế và thử nghiệm với người dùng
  - Điều chỉnh hướng sản phẩm khi dữ liệu không xác nhận giả định
  - Cân bằng giá trị khách hàng với khả năng vận hành và mục tiêu tổ chức
- level1: Cộng tác và lãnh đạo
  level2:
  - Nhóm đa chức năng và khả năng tạo kết quả xuyên suốt
  - Tự tổ chức, tự quản và ranh giới quyền quyết định
  - Xây dựng mục tiêu chung và trách nhiệm đối với kết quả
  - An toàn tâm lý trong trao đổi, phản biện và thừa nhận sai sót
  - Lãnh đạo phục vụ và hỗ trợ nhóm tháo gỡ trở ngại
  - Phân biệt hướng dẫn, huấn luyện, hỗ trợ thảo luận và ra quyết định
  - Chia sẻ kiến thức để giảm phụ thuộc vào một cá nhân
  - Xử lý bất đồng kỹ thuật, ưu tiên và cách làm
  - Thiết lập thỏa thuận cộng tác cùng nhịp làm việc bền vững
  - Trách nhiệm của quản lý trong xây dựng môi trường phát triển Agile
- level1: Yêu cầu thích ứng
  level2:
  - Phát triển hiểu biết về yêu cầu qua các vòng phản hồi
  - Mô tả nhu cầu bằng ngôn ngữ người dùng và bối cảnh nghiệp vụ
  - Làm rõ yêu cầu đúng mức cho quyết định sắp tới
  - Tổ chức trao đổi giữa nghiệp vụ, phát triển và kiểm thử
  - Mô tả ví dụ cụ thể để phát hiện cách hiểu khác nhau
  - Đưa yêu cầu chất lượng, bảo mật và vận hành vào kế hoạch
  - Quản lý thay đổi mà vẫn giữ dấu vết mục tiêu và quyết định
  - Phân biệt làm rõ yêu cầu với mở rộng phạm vi
  - Xử lý giả định chưa được kiểm chứng bằng công việc khảo sát có giới hạn
  - Liên kết yêu cầu với tiêu chí chấp nhận và bằng chứng kiểm chứng
- level1: User story
  level2:
  - User story như công cụ hỗ trợ trao đổi về giá trị
  - Cấu trúc người dùng, nhu cầu và lợi ích trong mô tả câu chuyện
  - Thẻ ghi, trao đổi và xác nhận trong mô hình 3C
  - Đánh giá chất lượng câu chuyện bằng các tiêu chí INVEST
  - Phân biệt epic, user story, task, bug và spike
  - Chia lát dọc để tạo kết quả có thể kiểm chứng
  - Tách câu chuyện theo luồng sử dụng, quy tắc nghiệp vụ và mức độ rủi ro
  - Xây dựng tiêu chí chấp nhận cùng ví dụ cụ thể
  - Lập bản đồ câu chuyện để nhìn hành trình và các lát phát hành
  - Nhận diện câu chuyện giả, công việc thuần kỹ thuật và các giới hạn của khuôn mô tả
- level1: Ưu tiên và backlog
  level2:
  - Vai trò của danh sách công việc tồn đọng trong phát triển thích ứng
  - Liên kết hạng mục với mục tiêu sản phẩm
  - Sắp xếp công việc theo giá trị, rủi ro, phụ thuộc và chi phí trì hoãn
  - Cân bằng tính năng, lỗi, nợ kỹ thuật và hoạt động khám phá
  - Làm rõ và phân nhỏ hạng mục trước khi chọn thực hiện
  - Điều chỉnh mức chi tiết theo khoảng cách đến thời điểm triển khai
  - Phân biệt tiêu chí sẵn sàng do nhóm thống nhất với yêu cầu bắt buộc của khung làm việc
  - Kiểm soát yêu cầu cũ, trùng lặp và công việc ngoài luồng
  - Thay đổi thứ tự ưu tiên khi xuất hiện bằng chứng mới
  - Giữ một nguồn công việc rõ ràng khi nhiều bên cùng đề xuất
- level1: Kế hoạch thích ứng
  level2:
  - Phân biệt mục tiêu dài hạn với kế hoạch chi tiết ngắn hạn
  - Lập kế hoạch cuốn chiếu theo mức độ hiểu biết
  - Kết nối tầm nhìn, lộ trình, kế hoạch phát hành và công việc hằng ngày
  - Giới hạn thời gian bằng timebox và lựa chọn nhịp phản hồi
  - Lập kế hoạch theo năng lực thực tế và dữ liệu đã có
  - Xác định mục tiêu ngắn hạn cùng phần giá trị có thể bàn giao
  - Dành năng lực cho kiểm thử, tích hợp, bảo trì và việc phát sinh
  - Xử lý phụ thuộc mà vẫn bảo toàn khả năng đổi hướng
  - Phân biệt dự báo thực hiện với cam kết thời hạn cố định
  - Điều chỉnh kế hoạch khi phạm vi, nguồn lực hoặc giả định thay đổi
  - Duy trì khả năng dự đoán mà không cố định mọi chi tiết từ đầu
- level1: Ước lượng và dự báo
  level2:
  - Mục đích của ước lượng trong trao đổi và lập kế hoạch
  - Phân biệt công sức, độ phức tạp, thời gian theo lịch và bất định
  - Ước lượng tương đối bằng story point và hạng mục tham chiếu
  - Thảo luận ước lượng theo nhóm bằng Planning Poker
  - Ước lượng theo độ lớn hoặc khoảng khi chưa đủ thông tin
  - Phân biệt vận tốc nhóm với năng suất và giá trị tạo ra
  - Dự báo từ thông lượng và dữ liệu thời gian hoàn thành
  - Biểu diễn khả năng hoàn thành bằng khoảng cùng xác suất dự báo
  - Nhận diện điều kiện khi có thể giảm nhu cầu ước lượng từng hạng mục
  - Tránh biến ước lượng thành hạn chót bắt buộc hoặc công cụ so sánh cá nhân
- level1: Nền tảng Scrum
  level2:
  - Scrum là khung làm việc hỗ trợ giải quyết vấn đề phức tạp
  - Chủ nghĩa kinh nghiệm và tư duy tinh gọn trong Scrum
  - Minh bạch, kiểm tra và thích ứng
  - Cam kết, tập trung, cởi mở, tôn trọng và can đảm
  - Scrum Team như một nhóm nhỏ đa chức năng và tự quản
  - Mối liên hệ giữa trách nhiệm, sự kiện, tạo tác và cam kết
  - Phân biệt quy định của Scrum với thực hành nhóm tự bổ sung
  - Những giới hạn Scrum cần được hỗ trợ bằng kỹ thuật và bối cảnh tổ chức
- level1: Trách nhiệm Scrum
  level2:
  - Product Owner và trách nhiệm tối đa hóa giá trị sản phẩm
  - Quản lý Product Backlog và truyền đạt Product Goal
  - Scrum Master và trách nhiệm đối với hiệu quả vận dụng Scrum
  - Scrum Master hỗ trợ Scrum Team, Product Owner và tổ chức
  - Developers và trách nhiệm xây dựng phần tăng trưởng sử dụng được
  - Developers tự quản kế hoạch thực hiện và thích ứng hằng ngày
  - Trách nhiệm chung của Scrum Team đối với kết quả sản phẩm
  - Cộng tác với bên liên quan và chuyên gia ngoài Scrum Team
  - Giải quyết khoảng trống trách nhiệm khi tổ chức có vai trò quản lý dự án
- level1: Sự kiện Scrum
  level2:
  - Sprint như nhịp chứa các hoạt động và sự kiện Scrum
  - 'Sprint Planning: mục tiêu, lựa chọn công việc và cách thực hiện'
  - Xây dựng Sprint Goal làm định hướng chung cho Sprint
  - Daily Scrum và điều chỉnh kế hoạch của Developers
  - Sprint Review để cùng kiểm tra kết quả và định hướng tiếp theo
  - Sprint Retrospective để cải thiện chất lượng và hiệu quả
  - Làm rõ Product Backlog như hoạt động liên tục
  - Giới hạn thời gian và tính nhất quán của nhịp sự kiện
  - Xử lý thay đổi, công việc chưa hoàn tất và điều kiện hủy Sprint
  - Phân biệt mục đích sự kiện với báo cáo tình trạng hoặc phê duyệt hình thức
- level1: Tạo tác Scrum
  level2:
  - Product Backlog và cam kết Product Goal
  - Sprint Backlog và cam kết Sprint Goal
  - Increment và cam kết Definition of Done
  - Mối liên hệ giữa ba tạo tác và tính minh bạch
  - Cập nhật Sprint Backlog trong quá trình học hỏi và thực hiện
  - Xây dựng nhiều Increment cùng khả năng tích hợp trong một Sprint
  - Bàn giao Increment khi sẵn sàng mà không phải chờ Sprint Review
  - Phân biệt Definition of Done với tiêu chí chấp nhận của từng hạng mục
  - Áp dụng tiêu chí hoàn tất chung khi nhiều nhóm cùng phát triển sản phẩm
  - Xử lý công việc chưa đáp ứng Definition of Done
- level1: Kanban
  level2:
  - Kanban và mục tiêu tối ưu dòng giá trị
  - Định nghĩa luồng công việc cùng điểm bắt đầu và kết thúc
  - Trực quan hóa trạng thái, hàng đợi và công việc bị chặn
  - Kiểm soát công việc đang thực hiện bằng giới hạn WIP
  - Kéo công việc theo năng lực còn trống
  - Làm rõ chính sách chuyển trạng thái và điều kiện hoàn tất
  - Quản lý tuổi công việc cùng kỳ vọng thời gian phục vụ
  - Xử lý công việc khẩn cấp bằng chính sách dịch vụ rõ ràng
  - Phát hiện nút thắt và giảm thời gian chờ
  - Phân biệt bảng Kanban với một hệ thống quản lý dòng công việc
  - Cải tiến luồng dựa trên dữ liệu và thử nghiệm
  - Mối liên hệ giữa Kanban, Agile và quy trình hiện có
- level1: Lean
  level2:
  - Tư duy tinh gọn trong phát triển phần mềm
  - Nhận diện giá trị từ góc nhìn người sử dụng
  - 'Nhận diện lãng phí: chờ đợi, bàn giao, làm lại và việc chưa hoàn tất'
  - Giảm kích thước lô và rút ngắn thời gian tạo giá trị
  - Tăng cường học hỏi và giữ các phương án khi còn bất định
  - Ra quyết định vào thời điểm có đủ thông tin cần thiết
  - Xây dựng chất lượng ngay trong quá trình phát triển
  - Tôn trọng con người và trao quyền giải quyết vấn đề
  - Tối ưu toàn hệ thống và nhận diện tác hại của tối ưu cục bộ
- level1: Extreme Programming
  level2:
  - Extreme Programming và vai trò của phản hồi kỹ thuật nhanh
  - Các giá trị giao tiếp, đơn giản, phản hồi, can đảm và tôn trọng
  - Khách hàng tham gia thường xuyên và trao đổi về ưu tiên
  - Lập kế hoạch cộng tác và phát hành theo phần nhỏ
  - Thiết kế đơn giản theo nhu cầu đã được hiểu
  - Ẩn dụ hệ thống và ngôn ngữ chung để định hướng thiết kế
  - Phát triển có kiểm thử dẫn dắt và phản hồi tự động
  - Tái cấu trúc liên tục để bảo toàn khả năng thay đổi
  - Lập trình cặp và chia sẻ hiểu biết khi phát triển
  - Quyền sở hữu mã chung cùng quy ước mã nguồn thống nhất
  - Tích hợp liên tục để phát hiện xung đột sớm
  - Nhịp làm việc bền vững và khả năng duy trì chất lượng
  - Quan hệ hỗ trợ lẫn nhau giữa các thực hành XP
- level1: Các cách tiếp cận khác
  level2:
  - Crystal và lựa chọn cách làm theo quy mô cùng mức độ quan trọng của hệ thống
  - 'Crystal: trao đổi thường xuyên, phản hồi và an toàn trong cộng tác'
  - DSDM và cân bằng thời gian, chi phí, chất lượng với phạm vi
  - 'DSDM: ưu tiên MoSCoW, timebox và cộng tác nghiệp vụ'
  - Feature-Driven Development và vai trò của mô hình miền
  - 'FDD: danh sách tính năng cùng lập kế hoạch, thiết kế và xây dựng theo tính năng'
  - Scrumban và sự kết hợp thực hành theo nhu cầu dòng công việc
  - So sánh trọng tâm của Scrum, Kanban, XP, Lean và các cách tiếp cận liên quan
  - Phân biệt kết hợp có chủ đích với việc tùy ý bỏ những cơ chế cần thiết
  - Xác định phần nền tảng cần giữ khi điều chỉnh một cách tiếp cận
- level1: Thực hành kỹ thuật
  level2:
  - Vai trò của năng lực kỹ thuật đối với khả năng thích ứng
  - Kiểm thử đơn vị và nền tảng phản hồi tự động
  - Vòng lặp TDD và mối liên hệ với thiết kế mã
  - BDD và trao đổi hành vi bằng ví dụ nghiệp vụ
  - ATDD và thống nhất tiêu chí nghiệm thu trước khi triển khai
  - Phân biệt mục tiêu và phạm vi của TDD, BDD và ATDD
  - Tích hợp liên tục cùng nhánh mã tồn tại ngắn
  - Tự động hóa xây dựng, kiểm thử và kiểm tra chất lượng
  - Phân biệt chuyển giao liên tục với triển khai liên tục
  - Kết hợp lập trình cặp, rà soát mã và chia sẻ kiến thức
  - Mối liên hệ giữa Agile, DevOps và trách nhiệm vận hành
- level1: Thiết kế tiến hóa
  level2:
  - Thiết kế tiến hóa và khả năng thay đổi theo hiểu biết mới
  - Cân bằng thiết kế đủ dùng với rủi ro phải làm lại
  - Khảo sát kỹ thuật bằng spike và nguyên mẫu có mục đích
  - Thiết kế mô đun để giảm phụ thuộc và giới hạn tác động thay đổi
  - Giữ tính đơn giản và tránh xây sẵn khả năng chưa được chứng minh
  - Tái cấu trúc an toàn nhờ bằng chứng kiểm thử
  - Quản lý nợ kỹ thuật và chi phí thay đổi tích lũy
  - Điều phối kiến trúc giữa các nhóm bằng ràng buộc cùng quyết định rõ ràng
  - Lưu quyết định kiến trúc và kiểm chứng các giả định quan trọng
- level1: Chất lượng liên tục
  level2:
  - Chất lượng như trách nhiệm chung trong toàn bộ vòng phát triển
  - Xác định chất lượng cần đạt từ nhu cầu và mức độ rủi ro
  - Đưa kiểm thử vào từng phần tăng trưởng
  - Tổ chức kiểm thử theo nhiều mức cùng vòng phản hồi phù hợp
  - Kết hợp kiểm thử tự động với kiểm thử khám phá
  - Đưa bảo mật, hiệu năng, khả năng truy cập và vận hành vào công việc
  - Ngăn tích tụ lỗi và công việc kiểm chứng ở cuối chu kỳ
  - Duy trì tiêu chí hoàn tất khi thời hạn gây áp lực
  - Theo dõi lỗi lọt ra thực tế và sử dụng phản hồi để phòng ngừa
  - Đánh giá chất lượng của kết quả thay vì chỉ đếm số bài kiểm thử
- level1: Phản hồi và phát hành
  level2:
  - Phân biệt nhịp phát triển, nhịp kiểm chứng và nhịp phát hành
  - Thiết kế phần tăng trưởng đủ nhỏ để nhận phản hồi sớm
  - Thu thập phản hồi qua trình diễn, sử dụng thử và quan sát thực tế
  - Kết hợp phản hồi định tính với dữ liệu sử dụng
  - Phát hành có kiểm soát bằng cờ tính năng và giới hạn phạm vi triển khai
  - Đưa quan sát hệ thống cùng khả năng khôi phục vào kế hoạch phát hành
  - Phối hợp hỗ trợ người dùng và vận hành sau bàn giao
  - Kiểm chứng kết quả sản phẩm sau khi tính năng được sử dụng
  - Điều chỉnh ưu tiên khi phản hồi trái với giả định ban đầu
  - Khép kín vòng học hỏi giữa phát triển, người dùng và vận hành
- level1: Đo lường Agile
  level2:
  - Chọn chỉ số theo câu hỏi và quyết định cần hỗ trợ
  - Phân biệt hoạt động, đầu ra, kết quả và tác động
  - Đo giá trị sản phẩm thông qua mục tiêu có thể kiểm chứng
  - Đo thời gian dẫn (lead time) và xác định ranh giới đo
  - Đo thời gian chu kỳ (cycle time), WIP và thông lượng
  - Theo dõi tuổi công việc, thời gian bị chặn và mức độ làm lại
  - Đọc biểu đồ dòng tích lũy cùng phân bố thời gian hoàn thành
  - Sử dụng biểu đồ công việc còn lại và công việc đã hoàn thành
  - Hiểu vận tốc trong bối cảnh của từng nhóm và cách ước lượng
  - Đánh giá chất lượng, mức độ ổn định và tính bền vững của nhịp làm việc
  - Tránh dùng chỉ số để xếp hạng cá nhân hoặc ép tăng khối lượng đầu ra
  - Kiểm tra chất lượng dữ liệu và điều kiện so sánh trước khi kết luận
- level1: Cải tiến liên tục
  level2:
  - Tạo vòng cải tiến từ quan sát, giả thuyết đến thử nghiệm
  - Tổ chức nhìn lại dựa trên sự kiện cùng điều kiện làm việc
  - Phân tích nguyên nhân của chậm trễ, lỗi và trở ngại lặp lại
  - Chọn vấn đề có tác động rõ và phạm vi thử nghiệm phù hợp
  - Xác định người thực hiện, thời hạn và cách đo hiệu quả cải tiến
  - Theo dõi hành động cải tiến trong công việc thực tế
  - Điều chỉnh chính sách, kỹ thuật và cách phối hợp theo kết quả
  - Lan tỏa hiểu biết mà vẫn tôn trọng khác biệt bối cảnh
  - Nhận diện cải tiến hình thức và các hành động liên tục bị bỏ quên
- level1: Nhóm phân tán
  level2:
  - Thiết lập thỏa thuận cộng tác cho nhóm làm việc từ xa
  - Kết hợp giao tiếp đồng bộ với trao đổi bất đồng bộ
  - Duy trì minh bạch mục tiêu, công việc và quyết định
  - Tổ chức sự kiện có sự tham gia thực chất khi khác địa điểm
  - Giảm thời gian chờ do múi giờ và bàn giao thiếu bối cảnh
  - Lưu trữ kiến thức để hỗ trợ thành viên mới và người vắng mặt
  - Duy trì an toàn tâm lý cùng cơ hội đóng góp công bằng
  - Nhận diện giới hạn của công cụ và điều chỉnh cách cộng tác
- level1: Phối hợp nhiều nhóm
  level2:
  - Xác định sản phẩm chung, mục tiêu chung và ranh giới nhóm
  - Tổ chức nhóm theo khả năng tạo giá trị xuyên suốt
  - Quản lý danh sách công việc và thứ tự ưu tiên trên phạm vi sản phẩm
  - Nhận diện và giảm phụ thuộc giữa các nhóm
  - Tích hợp thường xuyên cùng tiêu chí chất lượng chung
  - Điều phối chuyên môn dùng chung và nhóm hỗ trợ nền tảng
  - Phối hợp nhịp kiểm chứng, phát hành và phản hồi khách hàng
  - Nhận diện phạm vi của Nexus, LeSS và SAFe trong mở rộng Agile
  - Đánh giá chi phí phối hợp khi thêm nhóm hoặc tầng quản lý
  - Đo kết quả toàn luồng và bảo toàn khả năng thích ứng ở quy mô lớn
- level1: Quản trị và ràng buộc
  level2:
  - Liên kết tự chủ của nhóm với mục tiêu và trách nhiệm giải trình
  - Lập ngân sách theo khả năng học hỏi và giá trị cần kiểm chứng
  - Quản lý rủi ro bằng bàn giao nhỏ cùng phản hồi sớm
  - Xử lý thời hạn bắt buộc và phạm vi có thể thương lượng
  - Cộng tác với khách hàng khi hợp đồng hoặc cơ chế mua sắm còn cứng nhắc
  - Duy trì tài liệu cần thiết cùng khả năng truy vết quyết định
  - Tích hợp yêu cầu tuân thủ và bằng chứng kiểm chứng vào dòng công việc
  - Phối hợp với nhà cung cấp có nhịp phát triển khác
  - Thích ứng trong hệ thống cũ hoặc môi trường bị giới hạn khả năng phát hành
  - Cân bằng yêu cầu kiểm soát tổ chức với tốc độ phản hồi của nhóm
- level1: Chuyển đổi Agile
  level2:
  - Đánh giá vấn đề hiện tại trước khi lựa chọn cách thay đổi
  - Xác định mục tiêu chuyển đổi bằng kết quả có thể quan sát
  - Chuẩn bị sự hỗ trợ của lãnh đạo và quyền ra quyết định phù hợp
  - Lựa chọn nhóm thí điểm cùng phạm vi thử nghiệm có thể học hỏi
  - Phát triển kỹ năng cộng tác, sản phẩm và kỹ thuật song song
  - Điều chỉnh cơ chế giao việc, đánh giá và phân bổ nguồn lực
  - Xử lý lo ngại và sự kháng cự thông qua đối thoại cùng bằng chứng
  - Theo dõi tiến triển bằng kết quả thực tế của nhóm và sản phẩm
  - Mở rộng cách làm dựa trên điều kiện thành công của thí điểm
  - Duy trì học hỏi để tránh biến chuyển đổi thành một chương trình có điểm kết thúc hình thức
- level1: Lựa chọn cách tiếp cận
  level2:
  - Đánh giá mức bất định về nhu cầu và giải pháp
  - Đánh giá tần suất gián đoạn, loại công việc và khả năng bàn giao
  - Cân nhắc Scrum khi cần mục tiêu cùng nhịp kiểm tra định kỳ
  - Cân nhắc Kanban khi cần quản lý dòng công việc liên tục
  - Bổ sung thực hành XP để củng cố chất lượng cùng khả năng thay đổi
  - Vận dụng Lean để nhận diện lãng phí và cải thiện dòng giá trị
  - Kết hợp cách lập kế hoạch dự báo và thích ứng khi có ràng buộc cụ thể
  - Thiết kế thử nghiệm để kiểm chứng cách tiếp cận phù hợp với nhóm
- level1: Sai lầm thường gặp
  level2:
  - Đồng nhất Agile với tốc độ làm việc cao hoặc thiếu kế hoạch
  - Đồng nhất Agile với Scrum hoặc một bộ công cụ
  - Thực hiện đủ nghi thức nhưng không có phản hồi và thích ứng
  - Biến Daily Scrum thành báo cáo cho người quản lý
  - Biến Sprint Review thành cổng nghiệm thu duy nhất
  - Xem Product Owner là người ghi yêu cầu và Scrum Master là người giao việc
  - Ép vận tốc tăng liên tục hoặc so sánh story point giữa các nhóm
  - Coi mọi yêu cầu mới đều phải làm ngay vì nhóm đang áp dụng Agile
  - Chia nhỏ đầu việc nhưng không tạo phần giá trị có thể kiểm chứng
  - Dồn kiểm thử và tích hợp sang cuối kỳ hoặc nhóm khác
  - Tối ưu mức bận rộn cá nhân làm tăng WIP và thời gian chờ
  - Mở rộng khuôn tổ chức trước khi giải quyết trở ngại của từng nhóm
- level1: Thực hành tổng hợp
  level2:
  - Phân tích một tình huống phát triển và xác định nhu cầu thích ứng
  - Đối chiếu quyết định của nhóm với bốn giá trị cùng mười hai nguyên tắc
  - Chuyển mục tiêu sản phẩm thành các giả thuyết và phần tăng trưởng nhỏ
  - Viết, trao đổi và chia lát user story có tiêu chí chấp nhận
  - Xây dựng backlog rồi điều chỉnh ưu tiên sau phản hồi
  - Lập kế hoạch ngắn hạn theo năng lực, phụ thuộc và bất định
  - Mô phỏng một Sprint với trách nhiệm, sự kiện, tạo tác và cam kết
  - Thiết kế hệ thống Kanban với chính sách cùng giới hạn WIP
  - Lựa chọn các thực hành XP hỗ trợ một vấn đề chất lượng cụ thể
  - Đọc dữ liệu dòng công việc để phát hiện nút thắt và lập dự báo
  - Xử lý tình huống thay đổi yêu cầu, thời hạn cứng và công việc khẩn cấp
  - Thiết kế một thử nghiệm cải tiến với cách kiểm chứng kết quả
  - Đề xuất cách áp dụng Agile cho nhóm phân tán hoặc nhiều nhóm cùng sản phẩm
