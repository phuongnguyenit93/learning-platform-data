references:
  - title: "DORA - Software Delivery Performance Metrics"
    url: "https://dora.dev/guides/dora-metrics/"
    description: "Năm chỉ số DORA hiện hành, throughput, instability và cách đo hiệu quả delivery theo từng hệ thống."
  - title: "DORA - Value Stream Mapping for Software Delivery"
    url: "https://dora.dev/guides/value-stream-management/"
    description: "Đặt mục tiêu, vẽ quy trình delivery, tìm bottleneck và đo tác động cải tiến."
  - title: "DORA - Empower Software Delivery Teams"
    url: "https://dora.dev/guides/how-to-empower-software-delivery-teams/"
    description: "Sử dụng chỉ số ở cấp nhóm, học từ thí nghiệm và tránh tối ưu hiệu suất cá nhân sai ngữ cảnh."
  - title: "Lean Enterprise Institute - Value Stream Mapping"
    url: "https://www.lean.org/lexicon-terms/value-stream-mapping/"
    description: "Định nghĩa VSM, sơ đồ current/future state, lead time và loại bỏ lãng phí."
  - title: "ASQ - Continuous Improvement"
    url: "https://asq.org/quality-resources/continuous-improvement"
    description: "Cải tiến liên tục, Lean, PDCA và cách xem xét chất lượng quy trình."
  - title: "ASQ - Plan-Do-Check-Act Cycle"
    url: "https://asq.org/quality-resources/pdca-cycle"
    description: "Cách triển khai thí nghiệm cải tiến nhỏ theo Plan, Do, Check, Act."
  - title: "Kanban Guides - The Kanban Guide (2025)"
    url: "https://kanbanguides.org/the-kanban-guide"
    description: "WIP, throughput, work item age, cycle time và quản lý luồng công việc."
  - title: "Scrum Guides - The Scrum Guide (2020)"
    url: "https://scrumguides.org/scrum-guide"
    description: "Sprint Retrospective, inspect/adapt và lập kế hoạch tăng chất lượng, hiệu quả."
  - title: "Google SRE Workbook - Postmortem Culture"
    url: "https://sre.google/workbook/postmortem-culture/"
    description: "Học từ sự cố không đổ lỗi, hành động có owner, ưu tiên và tiêu chí kiểm chứng."