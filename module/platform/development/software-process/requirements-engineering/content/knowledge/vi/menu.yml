menu:
- level1: Tổng quan
  level2:
  - Kỹ nghệ yêu cầu là gì và vấn đề mà nó giải quyết
  - Vì sao hiểu sai nhu cầu có thể làm sai toàn bộ sản phẩm
  - Mối liên hệ giữa nhu cầu, yêu cầu, thiết kế, triển khai và kiểm thử
  - Phân biệt kỹ nghệ yêu cầu với quản lý yêu cầu và phân tích nghiệp vụ
  - Các hoạt động khai thác, phân tích, đặc tả, xác nhận và quản lý
  - Các sản phẩm công việc chính và cách chúng liên kết với nhau
  - Vai trò của kỹ nghệ yêu cầu trong toàn bộ vòng đời phần mềm
  - Kiến thức nền và lộ trình học từ vấn đề đến yêu cầu được nghiệm thu
- level1: Khái niệm yêu cầu
  level2:
  - Phân biệt mong muốn, nhu cầu, yêu cầu và đề xuất giải pháp
  - Yêu cầu nghiệp vụ, yêu cầu của bên liên quan và yêu cầu người dùng
  - Phân biệt yêu cầu hệ thống với yêu cầu phần mềm
  - Yêu cầu chức năng, yêu cầu chất lượng và ràng buộc
  - Yêu cầu miền nghiệp vụ và quy tắc nghiệp vụ
  - Phân biệt yêu cầu sản phẩm với yêu cầu đối với dự án và quy trình
  - Yêu cầu tường minh, nhu cầu ngầm hiểu và giả định chưa được kiểm chứng
  - Yêu cầu dẫn xuất và cách giải thích căn cứ hình thành
  - Phân biệt tính năng, ca sử dụng, câu chuyện người dùng và nhiệm vụ phát triển
- level1: Quy trình yêu cầu
  level2:
  - Vòng đời yêu cầu từ phát hiện đến thay thế hoặc ngừng áp dụng
  - Quan hệ lặp và phản hồi giữa các hoạt động kỹ nghệ yêu cầu
  - Đầu vào, đầu ra và điều kiện chuyển tiếp của từng hoạt động
  - Phân công trách nhiệm giữa chuyên viên yêu cầu, khách hàng và nhóm phát triển
  - Phối hợp với kiến trúc, trải nghiệm người dùng, kiểm thử và vận hành
  - Thực hiện yêu cầu trong quy trình theo kế hoạch và quy trình linh hoạt
  - Điều chỉnh độ chi tiết và mức độ hình thức theo rủi ro
  - Xử lý điểm chưa thống nhất mà không giả định yêu cầu đã được chốt
- level1: Phạm vi và bối cảnh
  level2:
  - Xác định vấn đề, cơ hội và kết quả nghiệp vụ mong muốn
  - Phân biệt mục tiêu kinh doanh với danh sách tính năng đề xuất
  - Xác định đối tượng hệ thống và ranh giới phạm vi
  - Bối cảnh vận hành, môi trường sử dụng và các hệ thống bên ngoài
  - Phân biệt phạm vi hệ thống với phạm vi bối cảnh cần khảo sát
  - Sơ đồ bối cảnh và các tương tác vượt qua ranh giới hệ thống
  - Nội dung thuộc phạm vi, ngoài phạm vi và các trường hợp bị loại trừ
  - Giả định, phụ thuộc và ràng buộc chi phối phạm vi
  - Thống nhất tầm nhìn sản phẩm và tiêu chí thành công ban đầu
- level1: Bên liên quan
  level2:
  - Nhận diện bên liên quan trong phát triển, sử dụng, vận hành và bảo trì
  - Phân biệt khách hàng, người tài trợ, người mua và người sử dụng
  - Phân nhóm người dùng và xác định nhu cầu khác biệt
  - Phân tích mức ảnh hưởng, mối quan tâm và quyền quyết định
  - Nhận diện người đại diện và nguy cơ thiếu tiếng nói người dùng thực tế
  - Thu thập tri thức từ chuyên gia miền và chủ sở hữu hệ thống
  - Xác định người cung cấp, rà soát và phê duyệt từng loại yêu cầu
  - Lập kế hoạch giao tiếp và tham gia của các bên liên quan
  - Xử lý thay đổi bên liên quan và lưu giữ quyết định đã thống nhất
- level1: Lập kế hoạch
  level2:
  - Xác định mục tiêu, phạm vi và sản phẩm công việc cho hoạt động yêu cầu
  - Kiểm kê nguồn thông tin từ con người, tài liệu và hệ thống
  - Lựa chọn kỹ thuật khai thác theo nguồn, thời gian và mức bất định
  - Lập lịch buổi làm việc và chuẩn bị người tham gia
  - Lựa chọn hình thức đặc tả, mô hình và kho quản lý yêu cầu
  - Thống nhất thuật ngữ, mẫu biểu và quy tắc định danh
  - Xác định tiêu chí chất lượng, cơ chế rà soát và thẩm quyền quyết định
  - Dự báo rủi ro tiếp cận nguồn và quản lý câu hỏi còn mở
- level1: Khai thác yêu cầu
  level2:
  - Phân biệt khai thác yêu cầu với sao chép điều khách hàng đề nghị
  - Chuẩn bị và thực hiện phỏng vấn có cấu trúc hoặc bán cấu trúc
  - Đặt câu hỏi mở, câu hỏi làm rõ và câu hỏi kiểm chứng
  - Quan sát công việc, theo chân người dùng và nhận diện thao tác ngầm
  - Tổ chức hội thảo để cùng khám phá và làm rõ nhu cầu
  - Động não và kỹ thuật sáng tạo khi nhu cầu chưa rõ
  - Khảo sát bằng bảng hỏi và nhận diện giới hạn của mẫu trả lời
  - Phân tích tài liệu, biểu mẫu, dữ liệu và hệ thống hiện có
  - Khai thác từ kịch bản, hành trình người dùng và tình huống ngoại lệ
  - Sử dụng bản mẫu để khơi gợi và kiểm chứng hiểu biết
  - Ghi nhận phát hiện, nguồn gốc, căn cứ và điểm chưa chắc chắn
  - Nhận diện thiên kiến, câu hỏi dẫn dắt và dấu hiệu bỏ sót nguồn
- level1: Phân tích yêu cầu
  level2:
  - Tổ chức phát hiện thô thành nhóm nhu cầu và yêu cầu có cấu trúc
  - Làm rõ thuật ngữ và xây dựng bảng thuật ngữ miền nghiệp vụ
  - Phân rã yêu cầu theo mức trừu tượng mà vẫn giữ mục tiêu ban đầu
  - Phân tích phụ thuộc, chồng lặp và mâu thuẫn giữa các yêu cầu
  - Phát hiện yêu cầu thiếu, yêu cầu thừa và yêu cầu không có căn cứ
  - Phân tích điều kiện biên, trường hợp rỗng và tình huống thất bại
  - Phân biệt quy tắc nghiệp vụ với hành vi xử lý của phần mềm
  - Đánh giá tác động của giả định và mức độ bất định
  - Phân bổ yêu cầu cho phần mềm, con người và thành phần bên ngoài
  - Duy trì lý do và bằng chứng cho các quyết định phân tích
- level1: Xung đột yêu cầu
  level2:
  - Nhận diện xung đột dữ kiện, lợi ích, giá trị và cách diễn giải
  - Phân biệt mâu thuẫn giữa yêu cầu với bất đồng về giải pháp
  - Xác định các bên có liên quan và nguyên nhân gốc của xung đột
  - Chuẩn bị phương án thương lượng và tiêu chí đánh giá chung
  - Phân tích đánh đổi giữa chức năng, chất lượng, chi phí và thời gian
  - Điều phối thảo luận để tìm phương án được chấp nhận
  - Chuyển cấp quyết định khi nhóm không có đủ thẩm quyền
  - Ghi nhận thỏa thuận, điều kiện áp dụng và bất đồng còn tồn tại
- level1: Mô hình mục tiêu
  level2:
  - Mô hình hóa mục tiêu và liên kết với giá trị của sản phẩm
  - Phân rã mục tiêu thành mục tiêu con và yêu cầu hỗ trợ
  - Phân biệt mục tiêu bắt buộc với mục tiêu chất lượng cần đánh đổi
  - Quan hệ đóng góp, xung đột và phụ thuộc giữa các mục tiêu
  - Nhận diện trở ngại, giả định và rủi ro làm mục tiêu không đạt
  - Liên kết mục tiêu với thước đo kết quả và bên chịu trách nhiệm
  - Rà soát mô hình mục tiêu để tránh tối ưu tính năng thiếu giá trị
- level1: Mô hình nghiệp vụ
  level2:
  - Phân biệt mô tả nghiệp vụ hiện tại với nghiệp vụ mong muốn
  - Mô hình hóa quy trình, hoạt động, vai trò và điểm bàn giao
  - Sơ đồ hoạt động và ký pháp BPMN ở mức phục vụ yêu cầu
  - Mô hình luồng dữ liệu và các nguồn hoặc đích bên ngoài
  - Phát hiện điểm nghẽn, thao tác lặp và ngoại lệ trong quy trình
  - Biểu diễn điều kiện quyết định bằng bảng quyết định
  - Biểu diễn quy tắc nghiệp vụ và phạm vi hiệu lực
  - Liên kết bước nghiệp vụ với yêu cầu phần mềm hỗ trợ
  - Giữ nhất quán giữa mô hình quy trình với mô tả bằng văn bản
- level1: Mô hình dữ liệu
  level2:
  - Nhận diện thực thể, khái niệm và quan hệ trong miền nghiệp vụ
  - Phân biệt mô hình dữ liệu khái niệm với thiết kế cơ sở dữ liệu
  - Mô hình thực thể và quan hệ hoặc sơ đồ lớp ở mức phân tích
  - Thuộc tính, định danh và số lượng liên kết giữa các thực thể
  - Từ điển dữ liệu và định nghĩa ý nghĩa của từng trường
  - Ràng buộc toàn vẹn, tính duy nhất và quy tắc kiểm tra dữ liệu
  - Vòng đời dữ liệu và quyền sở hữu thông tin
  - Đối chiếu mô hình dữ liệu với ca sử dụng và quy tắc nghiệp vụ
- level1: Mô hình hành vi
  level2:
  - Xác định góc nhìn hành vi cần làm rõ trước khi chọn mô hình
  - Mô hình trạng thái, sự kiện kích hoạt và điều kiện chuyển
  - Phân biệt trạng thái nghiệp vụ với trạng thái kỹ thuật nội bộ
  - Luồng bình thường, luồng thay thế và luồng ngoại lệ
  - Thứ tự tương tác và thông điệp qua sơ đồ tuần tự
  - Hành vi khi xử lý đồng thời, hết thời gian chờ hoặc bị gián đoạn
  - Bất biến, điều kiện trước và điều kiện sau của hành vi
  - Phát hiện trạng thái thiếu, chuyển trạng thái sai và kịch bản chưa bao phủ
  - Kết hợp các mô hình mà không biến đặc tả yêu cầu thành thiết kế chi tiết
- level1: Ca sử dụng
  level2:
  - Ca sử dụng là gì và khi nào nên dùng để đặc tả yêu cầu
  - Tác nhân chính, tác nhân hỗ trợ và mục tiêu của người sử dụng
  - Phạm vi, mức độ và tên gọi của một ca sử dụng
  - Tiền điều kiện, sự kiện bắt đầu và bảo đảm sau khi kết thúc
  - Viết luồng thành công chính bằng hành vi quan sát được
  - Mô tả luồng thay thế, ngoại lệ và xử lý thất bại
  - Sơ đồ ca sử dụng và quan hệ include, extend, khái quát hóa
  - Liên kết yêu cầu chất lượng và quy tắc nghiệp vụ vào ca sử dụng
  - Phân biệt ca sử dụng với kịch bản, câu chuyện người dùng và màn hình
  - Rà soát ca sử dụng bằng ví dụ thực tế và trường hợp biên
- level1: Câu chuyện người dùng
  level2:
  - Câu chuyện người dùng là gì và vai trò trong trao đổi về yêu cầu
  - Ba thành phần thẻ ghi, trao đổi và xác nhận theo mô hình 3C
  - Viết câu chuyện theo vai trò, nhu cầu và giá trị mong muốn
  - Phân biệt epic, tính năng, câu chuyện và nhiệm vụ kỹ thuật
  - Đánh giá câu chuyện bằng các đặc tính INVEST
  - Chia nhỏ theo lát cắt giá trị có thể kiểm chứng
  - Bản đồ câu chuyện và cách nhận diện hành trình bị thiếu
  - Viết tiêu chí chấp nhận bằng kết quả quan sát được
  - Ví dụ Given–When–Then để làm rõ điều kiện và hành vi
  - Phân biệt tiêu chí chấp nhận với Definition of Done
  - Nhận diện giới hạn của mẫu câu và yêu cầu không phù hợp dạng câu chuyện
- level1: Yêu cầu chất lượng
  level2:
  - Vai trò của yêu cầu chất lượng và giới hạn của nhãn phi chức năng
  - Dùng mô hình chất lượng ISO/IEC 25010 làm khung gợi mở
  - Viết kịch bản chất lượng có bối cảnh, kích thích và kết quả đo được
  - Đặc tả thời gian đáp ứng, thông lượng và tải sử dụng
  - Đặc tả tính sẵn sàng, độ tin cậy và khả năng phục hồi
  - Đặc tả khả năng sử dụng và khả năng tiếp cận
  - Đặc tả yêu cầu bảo mật và bảo vệ dữ liệu cá nhân
  - Đặc tả khả năng tương tác và tính tương thích
  - Đặc tả khả năng bảo trì, triển khai và thích ứng
  - Xác định điều kiện đo, đơn vị, ngưỡng và phương pháp kiểm chứng
  - Phân tích xung đột và ưu tiên giữa các thuộc tính chất lượng
  - Phân biệt yêu cầu chất lượng của toàn hệ thống với của từng chức năng
- level1: Dữ liệu và giao tiếp
  level2:
  - Đặc tả dữ liệu đầu vào, đầu ra và quy tắc kiểm tra hợp lệ
  - Yêu cầu về chất lượng, nguồn gốc và tính nhất quán dữ liệu
  - Yêu cầu lưu giữ, lưu trữ lâu dài, xóa và khôi phục dữ liệu
  - Yêu cầu báo cáo, tra cứu và đối soát thông tin
  - Đặc tả giao tiếp với người dùng bằng hành vi thay vì chỉ bằng ảnh màn hình
  - Đặc tả trao đổi với hệ thống ngoài và trách nhiệm của mỗi phía
  - Yêu cầu về định dạng dữ liệu, đơn vị đo, múi giờ và bản địa hóa
  - Yêu cầu về lỗi, thử lại, trùng lặp và thứ tự thông điệp
  - Xác định khả năng tương thích và điều kiện thay đổi hợp đồng giao tiếp
  - Liên kết yêu cầu giao tiếp với kịch bản tích hợp và tiêu chí chấp nhận
- level1: Ràng buộc và chuyển đổi
  level2:
  - Nhận diện ràng buộc kinh doanh, kỹ thuật và môi trường vận hành
  - Phân biệt ràng buộc có căn cứ với sở thích triển khai
  - Chuyển nguồn tiêu chuẩn hoặc chính sách thành yêu cầu có thể truy vết
  - Yêu cầu tương thích với hệ thống và nền tảng hiện có
  - Yêu cầu chuyển đổi dữ liệu và xác minh dữ liệu sau chuyển đổi
  - Yêu cầu đào tạo, hỗ trợ và thay đổi cách làm việc
  - Yêu cầu chạy song song, chuyển giao và ngừng hệ thống cũ
  - Phân biệt yêu cầu chuyển tiếp có thời hạn với yêu cầu vận hành lâu dài
- level1: Viết yêu cầu
  level2:
  - Viết phát biểu yêu cầu có chủ thể, hành vi và điều kiện rõ ràng
  - Giữ mỗi phát biểu tập trung vào một nghĩa vụ có thể kiểm chứng
  - Diễn đạt mức bắt buộc, mức mong muốn và quyền lựa chọn nhất quán
  - Thay từ mơ hồ bằng dữ kiện hoặc tiêu chí đo được
  - Làm rõ lượng từ, tham chiếu, điều kiện phủ định và từ nối
  - Tách yêu cầu khỏi lý do, ví dụ và giải thích bổ sung
  - Mẫu câu theo sự kiện, trạng thái và điều kiện bất thường
  - Xử lý giá trị chưa xác định và giả định cần xác minh
  - Giữ trung lập với giải pháp trừ khi ràng buộc thiết kế đã có căn cứ
  - Biên tập yêu cầu tiếng Việt và thuật ngữ song ngữ nhất quán
- level1: Hồ sơ đặc tả
  level2:
  - Chọn văn bản, bảng biểu, mô hình hoặc tổ hợp theo người đọc
  - Mục đích và cấu trúc đặc tả yêu cầu phần mềm SRS
  - Phân biệt tài liệu nhu cầu nghiệp vụ, yêu cầu bên liên quan và SRS
  - Tổ chức phạm vi, bối cảnh, giả định và phụ thuộc trong đặc tả
  - Tổ chức yêu cầu chức năng, chất lượng, dữ liệu và giao tiếp
  - Thuộc tính yêu cầu gồm mã định danh, nguồn, căn cứ và mức ưu tiên
  - Liên kết văn bản, mô hình, bảng thuật ngữ và ví dụ minh họa
  - Phân biệt nội dung bắt buộc với nội dung tham khảo trong tài liệu
  - Vận dụng ISO/IEC/IEEE 29148 theo phạm vi và phiên bản áp dụng
  - Quản lý các góc nhìn tài liệu mà vẫn giữ một nguồn yêu cầu chuẩn
- level1: Kiểm tra yêu cầu
  level2:
  - Phân biệt kiểm tra chất lượng đặc tả với xác nhận đúng nhu cầu
  - Kiểm tra tính rõ ràng, đơn nghĩa và đầy đủ của từng phát biểu
  - Kiểm tra tính nhất quán và đầy đủ của cả tập yêu cầu
  - Kiểm tra tính cần thiết, khả thi và khả năng kiểm chứng
  - Rà soát theo danh mục kiểm tra và theo góc nhìn vai trò
  - Tổ chức đọc duyệt (walkthrough), rà soát chéo (peer review) và thẩm tra (inspection)
  - Kiểm tra nhất quán giữa văn bản, bảng quyết định và mô hình
  - Ghi nhận lỗi yêu cầu theo mức ảnh hưởng và nguyên nhân
  - Sửa lỗi, rà soát lại và theo dõi kết quả khắc phục
- level1: Xác nhận yêu cầu
  level2:
  - Xác nhận yêu cầu với nhu cầu, mục tiêu và bối cảnh sử dụng
  - Lựa chọn người tham gia xác nhận đại diện cho bên liên quan
  - Đi xuyên kịch bản để phát hiện hiểu sai và nhu cầu bị thiếu
  - Xác nhận bằng bản mẫu có độ trung thực phù hợp
  - Xác nhận bằng mô phỏng, ví dụ dữ liệu và quy trình nghiệp vụ
  - Suy ra kiểm thử chấp nhận để phát hiện yêu cầu chưa đủ rõ
  - Đánh giá yêu cầu chất lượng trong điều kiện sử dụng đại diện
  - Phân biệt đồng thuận, phê duyệt và bằng chứng đã xác nhận
  - Xử lý phản hồi, điều kiện chấp thuận và điểm chưa thống nhất
- level1: Ưu tiên và khả thi
  level2:
  - Xác định tiêu chí ưu tiên theo giá trị, rủi ro và tính cấp thiết
  - Phân biệt độ ưu tiên, độ nghiêm trọng và thứ tự triển khai
  - Phân loại bằng MoSCoW và kiểm soát việc mọi yêu cầu đều thành bắt buộc
  - So sánh cặp và chấm điểm có trọng số theo tiêu chí đã thống nhất
  - Phân tích mức đáp ứng nhu cầu bằng mô hình Kano
  - Xem xét phụ thuộc khi lựa chọn tập yêu cầu tối thiểu có giá trị
  - Đánh giá khả thi kỹ thuật, vận hành và khả năng cung cấp nguồn lực
  - Khảo sát kỹ thuật hoặc thử nghiệm ý tưởng để giảm bất định
  - Thương lượng phạm vi dựa trên giới hạn và bằng chứng
  - Rà soát lại ưu tiên khi giả định hoặc mục tiêu thay đổi
- level1: Quản lý yêu cầu
  level2:
  - Mô hình thông tin yêu cầu và các loại quan hệ cần quản lý
  - Mã định danh ổn định và quy tắc tổ chức phân cấp yêu cầu
  - Quản lý thuộc tính, người sở hữu và nguồn phát sinh
  - Trạng thái yêu cầu và điều kiện chuyển trạng thái
  - Quản lý phiên bản của từng yêu cầu và cả tập yêu cầu
  - Đường cơ sở yêu cầu và nội dung của một bản được phê duyệt
  - Phân biệt bản làm việc, bản phát hành và bản lưu lịch sử
  - Quản lý yêu cầu dùng chung, biến thể và cấu hình sản phẩm
  - Phân quyền cập nhật, phê duyệt và tra cứu yêu cầu
- level1: Truy vết
  level2:
  - Truy vết hai chiều từ mục tiêu và nguồn đến yêu cầu chi tiết
  - Liên kết yêu cầu với mô hình, quyết định thiết kế và mã nguồn
  - Liên kết yêu cầu với tiêu chí chấp nhận và bằng chứng kiểm thử
  - Ma trận truy vết yêu cầu và cách đọc mức bao phủ
  - Phân biệt liên kết nguồn gốc, phân rã, phụ thuộc và đáp ứng
  - Phát hiện yêu cầu mồ côi và chức năng không có căn cứ
  - Đánh giá tính đúng của liên kết thay vì chỉ đếm liên kết
  - Dùng truy vết để phân tích tác động khi yêu cầu thay đổi
  - Duy trì truy vết khi tách, gộp, thay thế hoặc xóa yêu cầu
- level1: Quản lý thay đổi
  level2:
  - Phân biệt làm rõ, sửa lỗi yêu cầu và thay đổi phạm vi
  - Tiếp nhận đề nghị thay đổi cùng lý do và nguồn phát sinh
  - Phân tích tác động lên yêu cầu liên quan, thiết kế và kiểm thử
  - Đánh giá tác động tới chi phí thực hiện, tiến độ và rủi ro
  - Xác định người có thẩm quyền chấp nhận hoặc từ chối thay đổi
  - Cập nhật phiên bản, đường cơ sở và lịch sử quyết định
  - Truyền đạt thay đổi tới các bên chịu ảnh hưởng
  - Xử lý thay đổi khẩn cấp và yêu cầu bị rút lại
  - Ngăn mở rộng phạm vi không kiểm soát mà vẫn tiếp nhận học hỏi mới
- level1: Yêu cầu linh hoạt
  level2:
  - Phân biệt linh hoạt trong yêu cầu với bỏ qua đặc tả và kiểm soát
  - Khám phá liên tục và bổ sung chi tiết đúng thời điểm
  - Liên kết mục tiêu sản phẩm với Product Backlog
  - Làm rõ yêu cầu qua trao đổi giữa nghiệp vụ, phát triển và kiểm thử
  - Tinh chỉnh yêu cầu (refinement) và phân rã trước khi thực hiện
  - Dùng thỏa thuận về mức sẵn sàng mà không biến thành rào cản cứng
  - Duy trì yêu cầu chất lượng xuyên suốt các lần phát hành
  - Phản hồi từ sản phẩm đã dùng và điều chỉnh nhu cầu
  - Giữ tài liệu sản phẩm nhất quán với yêu cầu thay đổi qua nhiều vòng lặp
- level1: Bàn giao và nghiệm thu
  level2:
  - Phối hợp với nhóm phát triển để xác nhận hiểu đúng yêu cầu
  - Chuyển yêu cầu thành tiêu chí kiểm chứng mà không áp đặt thiết kế
  - Phân biệt tiêu chí chấp nhận, ca kiểm thử và thủ tục nghiệm thu
  - Liên kết yêu cầu với kế hoạch UAT và dữ liệu đại diện
  - Phân biệt kiểm chứng sản phẩm đúng đặc tả với xác nhận sản phẩm đáp ứng nhu cầu
  - Thu thập bằng chứng đáp ứng cho yêu cầu chức năng và chất lượng
  - Xử lý sai lệch, ngoại lệ được chấp thuận và yêu cầu chưa đáp ứng
  - Phân biệt lỗi triển khai với yêu cầu sai hoặc thiếu
  - Cập nhật yêu cầu và tài liệu sau nghiệm thu hoặc phản hồi vận hành
- level1: Công cụ hỗ trợ
  level2:
  - Xác định nhu cầu công cụ từ mô hình thông tin và cách cộng tác
  - Phân biệt kho tài liệu, công cụ quản lý yêu cầu và bảng công việc
  - Quản lý yêu cầu trong Markdown, Git hoặc công cụ chuyên dụng
  - Kiểm tra tự động định dạng, thuộc tính bắt buộc và liên kết hỏng
  - Tìm kiếm, lọc và tạo các góc nhìn theo vai trò
  - Trao đổi yêu cầu giữa công cụ và duy trì định danh khi nhập xuất
  - Ứng dụng trí tuệ nhân tạo (AI) để gợi ý câu hỏi, phát hiện mơ hồ và hỗ trợ biên tập
  - Kiểm chứng gợi ý của AI và bảo vệ dữ liệu nguồn yêu cầu
  - Giữ lịch sử chỉnh sửa và tránh nhiều bản yêu cầu mâu thuẫn
- level1: Đo lường và cải tiến
  level2:
  - Chọn thước đo theo vấn đề cần ra quyết định
  - Đo lỗi yêu cầu và thời điểm phát hiện trong vòng đời
  - Theo dõi mức biến động yêu cầu và lý do thay đổi
  - Đánh giá độ bao phủ nguồn, truy vết và tiêu chí chấp nhận
  - Theo dõi thời gian làm rõ và lượng câu hỏi còn mở
  - Tránh coi số lượng yêu cầu hoặc độ dài tài liệu là chất lượng
  - Phân tích nguyên nhân yêu cầu bị bỏ sót, hiểu sai hoặc viết lại
  - Cải tiến kỹ thuật khai thác và mẫu đặc tả từ phản hồi thực tế
- level1: Bối cảnh đặc thù
  level2:
  - Khai thác yêu cầu khi thay thế hoặc hiện đại hóa hệ thống cũ
  - Phân biệt hành vi đang có với hành vi thực sự cần giữ lại
  - Phân tích khoảng cách khi mua hoặc cấu hình phần mềm có sẵn
  - Quản lý yêu cầu giữa nhiều nhà cung cấp và nhóm phát triển
  - Yêu cầu của sản phẩm dùng chung cho nhiều khách hàng
  - Yêu cầu trong miền có rủi ro an toàn hoặc cần bằng chứng kiểm chứng cao
  - Khai thác và xác nhận yêu cầu của hệ thống sử dụng mô hình AI
  - Yêu cầu cho dữ liệu đầu vào, chất lượng đầu ra và giám sát của hệ thống AI
  - Điều chỉnh cách cộng tác khi bên liên quan phân tán hoặc khó tiếp cận
- level1: Thực hành tổng hợp
  level2:
  - Từ mô tả vấn đề đến phạm vi một hệ thống quản lý đơn hàng
  - Lập danh sách bên liên quan, nguồn yêu cầu và kế hoạch khai thác
  - Chuyển ghi chép phỏng vấn thành nhu cầu có nguồn và căn cứ
  - Xây dựng mô hình nghiệp vụ, dữ liệu và kịch bản đơn hàng
  - Đặc tả cùng một chức năng bằng ca sử dụng và câu chuyện người dùng
  - Chuyển yêu cầu hiệu năng hoặc bảo mật mơ hồ thành tiêu chí đo được
  - Biên soạn hồ sơ SRS cùng bảng thuật ngữ và thuộc tính yêu cầu
  - Tổ chức rà soát và xác nhận bằng bản mẫu cùng ví dụ dữ liệu
  - Lập ma trận truy vết và xử lý một đề nghị thay đổi chính sách đơn hàng
  - Chuẩn bị bằng chứng nghiệm thu và đánh giá chất lượng hồ sơ cuối
