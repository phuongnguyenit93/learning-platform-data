references:
  - title: "IREB CPRE - Foundation Level"
    url: "https://cpre.ireb.org/en/concept/foundationlevel"
    description: "Tổng quan nghiệp vụ Requirements Engineering, elicitation, documentation, validation và quản lý yêu cầu."
  - title: "IREB CPRE - Download Center"
    url: "https://cpre.ireb.org/en/downloads-and-resources/downloads"
    description: "Syllabus, handbook và glossary chính thức cho Foundation Level và các chuyên đề RE."
  - title: "IREB - Requirements Elicitation"
    url: "https://cpre.ireb.org/en/concept/requirements-elicitation"
    description: "Nguồn stakeholder, phỏng vấn, workshop, conflict resolution và validation."
  - title: "IREB - Requirements Modeling"
    url: "https://cpre.ireb.org/en/concept/requirements-modeling"
    description: "Use case, context model, activity diagram, state machine và scenario modeling."
  - title: "IREB - Requirements Management"
    url: "https://cpre.ireb.org/en/concept/requirements-management"
    description: "Prioritization, version control, traceability, impact analysis và change management."
  - title: "IEEE - ISO/IEC/IEEE 29148:2018"
    url: "https://standards.ieee.org/ieee/29148/6937/"
    description: "Quy trình và thuộc tính của yêu cầu tốt, đặc tả và quản lý yêu cầu xuyên vòng đời."
  - title: "ISO - ISO/IEC 25010:2023"
    url: "https://www.iso.org/standard/78176.html"
    description: "Khung chất lượng sản phẩm để xác định yêu cầu phi chức năng và tiêu chí đo lường."
  - title: "INCOSE - Guide to Writing Requirements"
    url: "https://portal.incose.org/Web/iCore/Store/StoreLayouts/Item_Detail.aspx?Category=EBOOKS&iProductCode=GUIDEWRITEREQ"
    description: "Quy tắc và đặc tính của câu phát biểu yêu cầu rõ ràng, đầy đủ và kiểm chứng được."
  - title: "Atlassian - User Stories"
    url: "https://www.atlassian.com/agile/project-management/user-stories"
    description: "User story từ góc nhìn người dùng, 3 C và acceptance criteria."
  - title: "Scrum Guides - Scrum Guide"
    url: "https://scrumguides.org/scrum-guide"
    description: "Product Backlog, backlog refinement, Product Goal và phát triển yêu cầu theo vòng lặp."
  - title: "IBM - Requirements Management"
    url: "https://www.ibm.com/think/topics/what-is-requirements-management"
    description: "Workflow từ elicitation, prioritization và approval tới traceability, validation và change control."