references:
  - title: "Agile Alliance — Acceptance Test Driven Development (ATDD)"
    url: "https://agilealliance.org/glossary/atdd/"
    description: "Định nghĩa ATDD, phối hợp Three Amigos và viết kiểm thử chấp nhận trước khi triển khai."
  - title: "Agile Alliance — Acceptance Testing"
    url: "https://agilealliance.org/glossary/acceptance-testing/"
    description: "Kiểm thử chấp nhận như đặc tả hành vi; lưu ý về tính dễ hiểu và rủi ro test giòn."
  - title: "Cucumber — Example Mapping"
    url: "https://cucumber.io/docs/bdd/example-mapping/"
    description: "Khám phá story, quy tắc, ví dụ nghiệp vụ và câu hỏi chưa rõ trong thảo luận nhóm."
  - title: "Cucumber — Gherkin Reference"
    url: "https://cucumber.io/docs/gherkin/reference/"
    description: "Cú pháp Feature/Scenario/Given–When–Then và cách mô tả ví dụ có thể kiểm chứng."
  - title: "Cucumber — Step Definitions"
    url: "https://cucumber.io/docs/cucumber/step-definitions/"
    description: "Liên kết các bước Gherkin với mã kiểm thử Java để thực thi acceptance scenarios."
  - title: "Cucumber — Cucumber Reference"
    url: "https://cucumber.io/docs/cucumber/api/"
    description: "API của Cucumber cho step arguments, data tables và ánh xạ kịch bản với mã kiểm thử."
  - title: "Martin Fowler — Given When Then"
    url: "https://martinfowler.com/bliki/GivenWhenThen.html"
    description: "Giải thích Given/When/Then như cách diễn đạt hành vi trong Specification by Example."
  - title: "Robot Framework — User Guide"
    url: "https://robotframework.org/robotframework/latest/RobotFrameworkUserGuide"
    description: "Cách viết acceptance tests và yêu cầu có thể thực thi bằng keyword-driven testing."