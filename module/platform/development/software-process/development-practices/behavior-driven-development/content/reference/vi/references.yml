references:
  - title: "Cucumber - Behaviour-Driven Development"
    url: "https://cucumber.io/docs/bdd/"
    description: "Ba thực hành Discovery, Formulation và Automation cùng mục tiêu cộng tác trong BDD."
  - title: "Cucumber - Discovery Workshop"
    url: "https://cucumber.io/docs/bdd/discovery-workshop/"
    description: "Cách tổ chức buổi khám phá quy tắc và ví dụ giữa business và kỹ thuật."
  - title: "Cucumber - Who Does What"
    url: "https://cucumber.io/docs/bdd/who-does-what/"
    description: "Vai trò Three Amigos của product owner, tester, developer trong quá trình BDD."
  - title: "Cucumber - Example Mapping"
    url: "https://cucumber.io/docs/bdd/example-mapping/"
    description: "Phân loại rules, examples, open questions và user story để làm rõ acceptance criteria."
  - title: "Cucumber - Examples"
    url: "https://cucumber.io/docs/bdd/examples/"
    description: "Thiết kế ví dụ cụ thể phản ánh nghiệp vụ và kết quả người dùng mong đợi."
  - title: "Cucumber - Gherkin Reference"
    url: "https://cucumber.io/docs/gherkin/reference/"
    description: "Cấu trúc Feature, Rule, Scenario, Given/When/Then, Background và Scenario Outline."
  - title: "Cucumber - Writing Better Gherkin"
    url: "https://cucumber.io/docs/bdd/better-gherkin/"
    description: "Viết scenario dạng khai báo về hành vi thay vì chi tiết thao tác giao diện."
  - title: "Cucumber - Java Installation"
    url: "https://cucumber.io/docs/installation/java/"
    description: "Cài Cucumber-JVM, chạy với JUnit và xác định các dependency cần thiết."
  - title: "Cucumber - Step Definitions"
    url: "https://cucumber.io/docs/cucumber/step-definitions/"
    description: "Ánh xạ Gherkin steps sang phương thức Java qua annotations và tham số."
  - title: "Cucumber - Cucumber Expressions"
    url: "https://cucumber.io/docs/cucumber/cucumber-expressions/"
    description: "Tham số hóa step definitions bằng Cucumber Expressions thay cho viết trùng bước."
  - title: "Cucumber - API Reference"
    url: "https://cucumber.io/docs/cucumber/api/"
    description: "Data Tables, step arguments, hooks và trạng thái step results."
  - title: "Cucumber - State and Isolation"
    url: "https://cucumber.io/docs/cucumber/state/"
    description: "Cô lập kịch bản, quản lý trạng thái giữa các steps và dependency injection."
  - title: "Cucumber - Reporting"
    url: "https://cucumber.io/docs/cucumber/reporting/"
    description: "Xuất báo cáo Cucumber dạng HTML, JSON, JUnit và theo dõi trạng thái test."