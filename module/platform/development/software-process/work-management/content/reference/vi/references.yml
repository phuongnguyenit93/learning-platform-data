references:
  - title: "Scrum Guide — Official 2020 Guide"
    url: "https://scrumguides.org/scrum-guide"
    description: "Product Backlog, Sprint Backlog, Sprint Planning, Definition of Done và các sự kiện kiểm tra, thích ứng."
  - title: "Scrum.org — Kanban Guide for Scrum Teams"
    url: "https://www.scrum.org/resources/online-kanban-guide-scrum-teams"
    description: "Workflow trực quan, WIP limit và các chỉ số flow: WIP, cycle time, work item age, throughput."
  - title: "Atlassian Jira — Use Your Scrum Backlog"
    url: "https://support.atlassian.com/jira-software-cloud/docs/use-your-scrum-backlog"
    description: "Tạo, sắp xếp và refinement công việc trong backlog, liên kết epic và lập kế hoạch sprint."
  - title: "Atlassian Jira — Configure a Company-managed Board"
    url: "https://support.atlassian.com/jira-software-cloud/docs/configure-a-company-managed-board/"
    description: "Ánh xạ trạng thái workflow vào cột board và quản lý trường, filter, swimlane."
  - title: "Atlassian Jira — What Is a Sprint?"
    url: "https://support.atlassian.com/jira-software-cloud/docs/what-is-a-sprint/"
    description: "Khái niệm sprint, iteration và kế hoạch công việc theo chu kỳ trong Scrum."
  - title: "GitHub Docs — About Projects"
    url: "https://docs.github.com/en/issues/planning-and-tracking-with-projects/learning-about-projects/about-projects"
    description: "Theo dõi issue, pull request và backlog bằng table, board hoặc roadmap trong GitHub Projects."
  - title: "GitHub Docs — Understanding Fields"
    url: "https://docs.github.com/en/issues/planning-and-tracking-with-projects/understanding-fields"
    description: "Trường priority, effort, iteration, date và các trường tùy chỉnh để quản lý work item."
  - title: "GitHub Docs — About Iteration Fields"
    url: "https://docs.github.com/en/issues/planning-and-tracking-with-projects/understanding-fields/about-iteration-fields"
    description: "Tổ chức công việc theo chu kỳ lặp và lọc, nhóm theo iteration."
  - title: "DORA — Software Delivery Performance Metrics"
    url: "https://dora.dev/guides/dora-metrics/"
    description: "Đo lường hiệu quả phân phối phần mềm và cải tiến theo dữ liệu, bổ trợ cho chỉ số flow."