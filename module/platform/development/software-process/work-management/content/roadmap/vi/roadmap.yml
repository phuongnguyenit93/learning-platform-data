roadmap:
- id: muc-tieu-dau-vao
  title: Mục tiêu & Đầu vào
  purpose: Xác định cách ghi nhận yêu cầu công việc và giá trị cần bàn giao trước khi bắt đầu triển khai.
  objectives:
  - Mô tả nguồn yêu cầu và mục tiêu của một nhóm phát triển.
  - Thiết lập điều kiện tối thiểu để tiếp nhận một work item.
- id: chia-nho-work-item
  title: Chia nhỏ Work Item
  purpose: Biến yêu cầu lớn thành các đầu việc có kết quả và người chịu trách nhiệm rõ ràng.
  objectives:
  - Phân biệt epic, story, task và bug qua ví dụ.
  - Viết acceptance criteria cho một story đủ nhỏ để thực hiện.
- id: backlog-uu-tien
  title: Backlog & Ưu tiên
  purpose: Duy trì danh sách việc cần làm có thứ tự để nhóm tập trung vào giá trị cao nhất.
  objectives:
  - Sắp xếp backlog theo giá trị, rủi ro và mức khẩn cấp.
  - Thực hiện refinement để làm rõ, tách hoặc bỏ mục không còn phù hợp.
- id: workflow-board
  title: Workflow & Board
  purpose: Trực quan hóa trạng thái công việc và quy tắc chuyển bước trong quy trình chung.
  objectives:
  - Thiết kế các cột To Do, In Progress, Review, Done.
  - Định nghĩa chính sách chuyển trạng thái và WIP limit.
- id: ke-hoach-nang-luc
  title: Kế hoạch & Năng lực
  purpose: Lập kế hoạch thực tế dựa trên mức ưu tiên, năng lực nhóm và phụ thuộc.
  objectives:
  - Chọn hạng mục cho một iteration hoặc chu kỳ làm việc.
  - Ước lượng effort và so sánh với capacity hiện có.
- id: theo-doi-go-blocker
  title: Theo dõi & Gỡ Blocker
  purpose: Chủ động phát hiện việc chậm, bị chặn hoặc tồn đọng thay vì chỉ cập nhật trạng thái.
  objectives:
  - Cập nhật owner, tiến độ, deadline và blocker trên board.
  - Đưa ra hành động xử lý một work item vượt thời gian kỳ vọng.
- id: phoi-hop-phu-thuoc
  title: Phối hợp & Phụ thuộc
  purpose: Giữ thông tin minh bạch khi công việc liên quan nhiều thành viên hoặc nhóm.
  objectives:
  - Liên kết work item với dependency và pull request liên quan.
  - Ghi quyết định, người phụ trách và thời điểm trao đổi cần thiết.
- id: nghiem-thu-ban-giao
  title: Nghiệm thu & Bàn giao
  purpose: Chỉ hoàn tất công việc khi kết quả đáp ứng điều kiện chất lượng đã thống nhất.
  objectives:
  - Kiểm tra acceptance criteria và Definition of Done.
  - Gắn bằng chứng test/review và ghi chú phát hành cho work item.
- id: do-luong-cai-tien
  title: Đo lường & Cải tiến
  purpose: Dùng số liệu dòng chảy và phản hồi để giảm tồn đọng và cải thiện khả năng bàn giao.
  objectives:
  - Đo cycle time, throughput, WIP và work item age.
  - Đề xuất một cải tiến từ retro và kiểm tra hiệu quả sau một chu kỳ.
