references:
  - title: "IEEE Computer Society — SWEBOK Guide V4"
    url: "https://www.computer.org/education/bodies-of-knowledge/software-engineering"
    description: "Tổng quan các lĩnh vực tri thức kỹ nghệ phần mềm, gồm requirements, design, testing, process, quality, operations và security."
  - title: "ISO/IEC/IEEE 12207:2026 — Software Life Cycle Processes"
    url: "https://www.iso.org/standard/90219.html"
    description: "Khung quy trình vòng đời phần mềm từ hình thành, phát triển, vận hành đến bảo trì và kết thúc; không áp đặt một lifecycle model."
  - title: "Agile Manifesto — Principles"
    url: "https://agilemanifesto.org/principles"
    description: "Các nguyên tắc về bàn giao liên tục, hợp tác với khách hàng, thích ứng thay đổi và cải tiến nhóm phát triển."
  - title: "Scrum Guides — Scrum Guide 2020"
    url: "https://scrumguides.org/scrum-guide"
    description: "Định nghĩa Scrum với kiểm tra và thích ứng, Sprint, các vai trò, sự kiện và sản phẩm quản lý công việc."
  - title: "Pro Git — About Version Control"
    url: "https://git-scm.com/book/en/v2/Getting-Started-About-Version-Control"
    description: "Giới thiệu quản lý phiên bản, lịch sử thay đổi mã, so sánh và khôi phục phiên bản để cộng tác."
  - title: "GitHub Docs — Continuous Integration"
    url: "https://docs.github.com/en/actions/get-started/continuous-integration"
    description: "Giải thích thực hành commit thường xuyên, tự động build/test, lint và kiểm tra pull request trong CI."
  - title: "GitHub Docs — Continuous Deployment"
    url: "https://docs.github.com/en/actions/get-started/continuous-deployment"
    description: "Giới thiệu tự động hóa build, test và phát hành thay đổi phần mềm qua pipeline CD."
  - title: "NIST SP 800-218 — Secure Software Development Framework"
    url: "https://csrc.nist.gov/pubs/sp/800/218/final"
    description: "Khuyến nghị lồng ghép thực hành phát triển an toàn vào mọi mô hình vòng đời và hạn chế lỗ hổng phần mềm."
  - title: "DORA — Software Delivery Performance Metrics"
    url: "https://dora.dev/guides/dora-metrics/"
    description: "Năm chỉ số hiện hành đánh giá throughput và instability của quá trình bàn giao để hỗ trợ cải tiến liên tục."
