references:
  - title: "ISO – Quality Management and Continual Improvement"
    url: "https://www.iso.org/quality-management"
    description: "Quality management system, process approach, PDCA và cải tiến liên tục."
  - title: "ISO/IEC/IEEE 12207:2026 – Software Life Cycle Processes"
    url: "https://www.iso.org/standard/90219.html"
    description: "Khung quy trình vòng đời phần mềm để thiết kế, kiểm soát và cải tiến."
  - title: "IEEE 730-2026 – Software Quality Assurance Processes"
    url: "https://standards.ieee.org/ieee/730/10854/"
    description: "Các yêu cầu lập kế hoạch, thực thi và kiểm soát hoạt động SQA."
  - title: "ISO/IEC 25010:2023 – Product Quality Model"
    url: "https://www.iso.org/standard/78176.html"
    description: "Mô hình chín thuộc tính chất lượng để chọn yêu cầu và tiêu chí sản phẩm."
  - title: "ISO/IEC 33020:2019 – Process Capability Assessment"
    url: "https://www.iso.org/standard/78526.html"
    description: "Khung đo lường năng lực quy trình và đánh giá khả năng đáp ứng mục tiêu."
  - title: "ISACA – CMMI Model Quick Reference Guide"
    url: "https://www.isaca.org/resources/reference-guide/cmmi-model-quick-reference-guide"
    description: "Các nhóm năng lực và thực hành để đánh giá, cải tiến mức trưởng thành quy trình."
  - title: "ISTQB – Certified Tester Foundation Level 4.0"
    url: "https://www.istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/"
    description: "Test planning, monitoring, risk-based testing, defect management và kiểm thử trong SDLC."
  - title: "DORA – Software Delivery Performance Metrics"
    url: "https://dora.dev/guides/dora-metrics/"
    description: "Năm chỉ số về throughput và instability để theo dõi cải tiến quá trình giao phần mềm."
  - title: "DORA – Value Stream Mapping for Software Delivery"
    url: "https://dora.dev/guides/value-stream-management/"
    description: "Phương pháp vẽ flow, điểm chờ, bottleneck và chọn hoạt động cải tiến."
  - title: "Atlassian – Incident Postmortems"
    url: "https://www.atlassian.com/incident-management/handbook/postmortems"
    description: "Phân tích nguyên nhân sự cố không đổ lỗi và theo dõi hành động phòng ngừa."