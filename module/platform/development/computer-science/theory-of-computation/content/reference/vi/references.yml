    description: "Lý giải quan hệ giữa ôtômát ngăn xếp và ngôn ngữ phi ngữ cảnh."
  - title: "Foundations of Computation — Critchlow & Eck"
    url: "https://davidjeck.github.io/FoundationsOfComputation/index.html"
    description: "Sách mở về biểu thức chính quy, ôtômát hữu hạn, ngữ pháp và máy Turing."