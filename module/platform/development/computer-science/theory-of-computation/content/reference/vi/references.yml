references:
  - title: "MIT OpenCourseWare — Theory of Computation (18.404J)"
    url: "https://ocw.mit.edu/courses/18-404j-theory-of-computation-fall-2020/"
    description: "Bài giảng, video và bài tập về ngôn ngữ chính quy, CFG/PDA, khả quyết và độ phức tạp."
  - title: "MIT OpenCourseWare — Automata, Computability, and Complexity (6.045J)"
    url: "https://ocw.mit.edu/courses/6-045j-automata-computability-and-complexity-spring-2011/"
