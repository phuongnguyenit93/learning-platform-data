references:
  - title: "MIT OpenCourseWare — Mathematics for Computer Science (6.042J)"
    url: "https://ocw.mit.edu/courses/6-042j-mathematics-for-computer-science-spring-2015/"
    description: "Khóa học toán rời rạc cho CS về logic, chứng minh, tập hợp, quan hệ, đồ thị, đồng dư, đếm và xác suất."
  - title: "Discrete Mathematics: An Open Introduction — Oscar Levin"
    url: "https://textbooks.aimath.org/textbooks/approved-textbooks/levin/"
    description: "Sách mở có bài tập về chứng minh, tổ hợp, dãy, lý thuyết đồ thị và lý thuyết số."
  - title: "Lecture Notes for Linear Algebra — Gilbert Strang (MIT)"
    url: "https://math.mit.edu/~gs/LectureNotes/"
    description: "Ghi chú về vectơ, ma trận, hệ tuyến tính, không gian con và cơ sở."
  - title: "MIT OpenCourseWare — Single Variable Calculus (18.01SC)"
    url: "https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/"
    description: "Bài giảng và bài tập về đạo hàm, tích phân, cực trị và ứng dụng."
  - title: "Harvard Statistics 110 — Probability"
    url: "https://stat110.hsites.harvard.edu/"
    description: "Video và học liệu về xác suất, Bayes, biến ngẫu nhiên, kỳ vọng và phân phối."