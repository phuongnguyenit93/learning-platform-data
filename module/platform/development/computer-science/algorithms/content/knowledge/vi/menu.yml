  - Duyệt đồ thị song song và phối hợp trạng thái đã thăm
  - Cân bằng tải khi các bài toán con có kích thước khác nhau
  - Chi phí đồng bộ, truyền dữ liệu và tạo tác vụ
  - Tranh chấp dữ liệu và tính đúng của kết quả
  - Tính xác định và ảnh hưởng của thứ tự phép toán số thực
  - Phân biệt mô hình bộ nhớ chung với mô hình phân tán
  - Chọn ngưỡng xử lý tuần tự thay vì tách thêm tác vụ
- level1: Cài đặt và kiểm thử
  level2:
  - Ánh xạ giả mã sang kiểu dữ liệu và giao diện hàm
  - Chỉ số, khoảng nửa mở và quy tắc quản lý biên
  - Tràn số nguyên, giá trị vô cực và tính toán modulo
  - Sai số số thực và phép so sánh theo yêu cầu bài toán
  - Trạng thái dùng lại, dữ liệu đầu vào bị sửa và khả năng gọi nhiều lần
  - Độ sâu đệ quy, ngăn xếp và cách chuyển sang lặp
  - Truy vết một lần chạy bằng bảng trạng thái
  - Kiểm thử trường hợp rỗng, nhỏ nhất, lớn nhất và phần tử trùng
  - Kiểm thử đối kháng với đầu vào đã có thứ tự hoặc mất cân bằng
  - Đối chiếu lời giải tối ưu với vét cạn trên dữ liệu nhỏ
  - Kiểm thử tính chất và quan hệ biến đổi bảo toàn đáp án
  - Sinh dữ liệu có kiểm soát và thu nhỏ phản ví dụ
  - Đo thời gian, bộ nhớ và tách chi phí chuẩn bị dữ liệu
  - Ghi rõ giả thiết, bất biến và giới hạn sử dụng của lời giải
- level1: Thực hành tổng hợp
  level2:
  - Phân loại bài toán trước khi chọn kỹ thuật
  - Từ vét cạn đến tiền xử lý, tham lam hoặc quy hoạch động
  - Kết hợp tìm kiếm nhị phân trên đáp án với phép kiểm tra khả thi
  - Kết hợp sắp xếp, hai con trỏ và xử lý theo sự kiện
  - Lập lịch và phân bổ nguồn lực theo các ràng buộc khác nhau
  - Mô hình hóa đường đi và chi phí trên mạng
  - Mô hình hóa phân công bằng ghép cặp hoặc luồng
  - Tìm kiếm văn bản với một mẫu, nhiều mẫu và nhiều truy vấn
  - Xử lý bài toán số học với miền giá trị lớn
  - Lựa chọn giải pháp khi dữ liệu không vừa bộ nhớ
  - Đánh giá lời giải ngẫu nhiên hoặc gần đúng bằng tiêu chí phù hợp
  - Hoàn thiện bài giải với chứng minh, phân tích chi phí và kiểm thử
  - So sánh nhiều lời giải trên cùng hợp đồng đầu vào–đầu ra
