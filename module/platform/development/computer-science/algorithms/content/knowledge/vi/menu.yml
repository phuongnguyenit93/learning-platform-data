menu:
- level1: Bản đồ thuật toán
  level2:
  - Thuật toán là gì và quan hệ với bài toán, chương trình, dữ liệu
  - Đầu vào, đầu ra, bước xử lý và điều kiện kết thúc
  - Bài toán quyết định, tìm kiếm, liệt kê, đếm và tối ưu
  - Từ ví dụ cụ thể đến quy tắc giải tổng quát
  - Vai trò của biểu diễn dữ liệu trong thiết kế lời giải
  - Tính đúng, hiệu quả và giới hạn tài nguyên
  - Các họ kỹ thuật thiết kế và cách nhận diện
  - Phân biệt thuật toán, cấu trúc dữ liệu và phân tích thuật toán
  - Lộ trình từ lời giải trực tiếp đến lựa chọn giải pháp phù hợp
