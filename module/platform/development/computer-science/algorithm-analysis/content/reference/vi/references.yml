references:
  - title: "MIT OpenCourseWare — 6.006 Introduction to Algorithms"
    url: "https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/"
    description: "Học liệu nền tảng về mô hình tính toán, đo hiệu năng, phân tích thời gian, cây đệ quy và hệ thức truy hồi."
  - title: "MIT OpenCourseWare — 6.046J Design and Analysis of Algorithms"
    url: "https://ocw.mit.edu/courses/6-046j-design-and-analysis-of-algorithms-spring-2015/"
    description: "Bài giảng và bài tập về chứng minh tính đúng, phân tích khấu hao, thuật toán ngẫu nhiên và độ phức tạp."
  - title: "Algorithms, 4th Edition — Analysis of Algorithms"
    url: "https://algs4.cs.princeton.edu/14analysis/"
    description: "Chương về phân tích tài nguyên, mô hình toán học và đo lường thực nghiệm hiệu năng chương trình."
  - title: "Algorithms — Jeff Erickson"
    url: "https://jeffe.cs.illinois.edu/teaching/algorithms/"
    description: "Giáo trình mở và ghi chú về truy hồi, quy nạp, cận dưới, xác suất và phân tích thuật toán."
