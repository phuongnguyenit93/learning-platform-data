menu:
- level1: Nhập môn
  level2:
  - Mẫu lỗi (bug pattern) là gì trong phân tích tĩnh?
  - Từ đoạn mã đáng ngờ đến lỗi có thể quan sát
  - Phân biệt lỗi đúng đắn, mùi mã, vi phạm quy ước và lỗ hổng
  - Vì sao một mẫu cú pháp có thể đúng ở ngữ cảnh này nhưng sai ở ngữ cảnh khác?
  - Điều kiện kích hoạt, hậu quả và giả thiết của một mẫu lỗi
  - Các nhóm lỗi thường gặp trong chương trình Java
  - Vai trò của hợp đồng API và đặc tả ngôn ngữ
  - Phân tích tĩnh bổ sung cho kiểm thử và rà soát mã như thế nào?
  - Giới hạn của việc coi không có cảnh báo là không có lỗi
  - Lộ trình nhận diện, xác minh, sửa và ngăn tái diễn
- level1: Đọc cảnh báo
  level2:
  - Vị trí phát hiện và vị trí nguyên nhân gốc
  - Thông điệp, nhóm quy tắc và dấu vết phân tích
  - Mức độ nghiêm trọng, độ tin cậy và khả năng xảy ra
  - Theo dõi giá trị từ nguồn đến điểm sử dụng
  - Đọc đường đi điều khiển dẫn đến vi phạm
  - Xác định tiền điều kiện và hợp đồng đang bị phá vỡ
  - Đối chiếu ngữ cảnh gọi và dữ liệu đầu vào thực tế
  - Phân biệt cảnh báo trùng với các lỗi độc lập
  - Thu gọn ví dụ để kiểm tra giả thuyết
  - Ghi lại bằng chứng thay vì chỉ lặp lại thông điệp công cụ
- level1: Luồng điều khiển
  level2:
  - Nhánh điều kiện luôn đúng hoặc luôn sai
  - Điều kiện mâu thuẫn và đoạn mã không thể tới
  - Nhánh trùng nhau do sao chép rồi sửa thiếu
  - Dùng phép gán thay cho kiểm tra giá trị boolean
  - Nhầm toán tử ngắn mạch với toán tử luôn đánh giá hai vế
  - Thứ tự kiểm tra điều kiện làm vô hiệu hóa bước bảo vệ
  - Dấu chấm phẩy hoặc khối lệnh đặt sai vị trí
  - Vòng lặp không cập nhật điều kiện tiến triển
  - Sai cận vòng lặp và lỗi lệch một đơn vị
  - return, break hoặc continue làm bỏ qua công việc cần thiết
  - Rơi qua nhánh switch ngoài dự kiến
  - Xử lý thiếu trường hợp mặc định hoặc trường hợp miền giá trị
- level1: Luồng dữ liệu
  level2:
  - Đọc giá trị chưa sẵn sàng và giới hạn kiểm tra của trình biên dịch
  - Phép gán bị ghi đè trước khi được sử dụng
  - Tự gán biến, trường hoặc phần tử do nhầm tên
  - Che khuất trường bằng biến hoặc tham số cùng tên
  - Truyền nhầm đối số cùng kiểu hoặc đảo thứ tự đối số
  - Sử dụng giá trị cũ sau khi thay đổi trạng thái
  - Kiểm tra một giá trị nhưng sử dụng giá trị khác
  - Bỏ qua giá trị trả về mang kết quả hoặc trạng thái lỗi
  - Nhầm phương thức tạo giá trị mới với phương thức sửa tại chỗ
  - Khởi tạo hoặc cập nhật thiếu trên một đường đi
  - Giữ tham chiếu bí danh và sửa nhầm đối tượng
  - Truyền dữ liệu đã hết hiệu lực sang bước xử lý tiếp theo
- level1: Null và Optional
  level2:
  - Giải tham chiếu giá trị null chắc chắn hoặc có thể xảy ra
  - Kiểm tra null sau khi đã sử dụng đối tượng
  - Một nhánh trả null làm sai giả thiết của bên gọi
  - Unboxing wrapper có giá trị null
  - Null trong chuỗi gọi phương thức hoặc kết quả tra cứu
  - Điều kiện bảo vệ bị phá vỡ do cập nhật hoặc gọi hàm trung gian
  - Hợp đồng nullable, non-null và giới hạn suy luận của công cụ
  - Phân biệt null hợp lệ với trạng thái không được khởi tạo đúng
  - Gọi Optional.get mà không bảo đảm có giá trị
  - Trả null thay cho Optional.empty
  - Nhầm Optional.of với Optional.ofNullable
  - Tính toán mặc định ngoài ý muốn với orElse
  - Làm mất thông tin lỗi khi chuyển mọi thất bại thành Optional.empty
  - Sửa lỗi null tại nơi tạo dữ liệu thay vì che triệu chứng
- level1: So sánh và định danh
  level2:
  - Nhầm so sánh tham chiếu với so sánh giá trị
  - Dùng == với String hoặc kiểu wrapper
  - Phụ thuộc ngoài ý muốn vào bộ nhớ đệm của wrapper
  - equals không đáp ứng tính phản xạ, đối xứng hoặc bắc cầu
  - equals không xử lý null đúng hợp đồng
  - Ghi đè equals nhưng thiếu hashCode tương ứng
  - Dùng các trường khác nhau trong equals và hashCode
  - Nhầm nạp chồng equals với ghi đè equals(Object)
  - So sánh mảng bằng equals của đối tượng
  - Nhầm Objects.equals với so sánh sâu cấu trúc mảng
  - compareTo hoặc Comparator không bảo toàn hợp đồng thứ tự
  - Dùng phép trừ để so sánh và gây tràn số
  - Thứ tự so sánh không nhất quán với equals
  - So sánh BigDecimal theo giá trị hoặc theo cả scale
  - NaN, số không có dấu và khác biệt giữa các cách so sánh số thực
- level1: Số học
  level2:
  - Tràn số nguyên trong phép cộng, trừ và nhân
  - Ép sang kiểu rộng sau khi phép tính đã tràn
  - Chia số nguyên làm mất phần thập phân ngoài dự kiến
  - Chia cho không trên đường đi có thể xảy ra
  - Thu hẹp kiểu và cắt mất dữ liệu
  - Đổi dấu, trị tuyệt đối và giá trị nhỏ nhất của kiểu số
  - Điều kiện so sánh số thực và sai số mong đợi
  - NaN hoặc vô cực làm sai giả thiết của thuật toán
  - Nhầm ưu tiên toán tử và vị trí dấu ngoặc
  - Nhầm toán tử bit với toán tử logic
  - Dịch bit, mở rộng dấu và khoảng dịch thực tế
  - Phần dư âm và tính chỉ số theo vòng
  - Tạo BigDecimal từ double ngoài ý định biểu diễn
  - Làm tròn sai thời điểm hoặc sai chế độ
  - Nhầm đơn vị, hệ số chuyển đổi và cận giá trị
- level1: Chuỗi và Unicode
  level2:
  - Kiểm tra tiền tố, hậu tố hoặc mẫu chuỗi không đúng yêu cầu
  - Bỏ qua kết quả của thao tác trên String bất biến
  - Nhầm chuỗi rỗng, chuỗi trắng và giá trị null
  - Tách chuỗi bằng split mà quên đối số là biểu thức chính quy
  - Nhầm thay thế văn bản nguyên dạng với replaceAll
  - Ký tự đặc biệt trong biểu thức hoặc chuỗi thay thế
  - Sai cận substring và giả thiết về độ dài
  - Nhầm char, code point và ký tự người dùng nhìn thấy
  - Cắt chuỗi làm tách cặp surrogate hoặc cụm ký tự
  - Đổi hoa thường phụ thuộc locale ngoài dự kiến
  - Chuẩn hóa Unicode trước khi so sánh hoặc kiểm tra định danh
  - Mã hóa và giải mã dùng charset không nhất quán
  - Định dạng chuỗi sai số lượng hoặc kiểu đối số
- level1: Mảng và generics
  level2:
  - Truy cập ngoài cận và nhầm độ dài với chỉ số cuối
  - Nhầm bản sao mảng với tham chiếu dùng chung
  - Sao chép thiếu hoặc ghi đè vùng dữ liệu ngoài ý muốn
  - Mảng nhiều chiều và giả thiết sai về kích thước từng hàng
  - Hiệp biến mảng và ArrayStoreException
  - Ép kiểu mảng không hợp lệ dù phần tử có vẻ phù hợp
  - Dùng raw type làm mất kiểm tra kiểu
  - Unchecked cast và giả thiết kiểu không được chứng minh
  - Ô nhiễm heap do kết hợp generics với varargs
  - Dùng @SafeVarargs khi thân phương thức chưa an toàn
  - Nhầm kiểu generic lúc biên dịch với thông tin còn lại khi chạy
  - Phân biệt lỗi kiểu bị trình biên dịch chặn với rủi ro cần phân tích bổ sung
- level1: Collections
  level2:
  - Sửa collection trong lúc duyệt không đúng cơ chế
  - Xóa phần tử bằng chỉ số hoặc bằng giá trị ngoài ý định
  - Giả định mọi List đều có thể thêm, xóa hoặc cập nhật
  - Nhầm Arrays.asList với danh sách độc lập và thay đổi kích thước được
  - Nhầm vỏ bọc chỉ đọc với bản chụp hoặc tính bất biến sâu
  - Giữ view từ subList hoặc tập khóa mà quên quan hệ với dữ liệu gốc
  - Giả định thứ tự duyệt mà kiểu collection không cam kết
  - Bỏ qua chính sách null của collection được chọn
  - Truyền sai kiểu phần tử vào contains hoặc remove
  - Phụ thuộc fail-fast như một cơ chế bảo đảm an toàn luồng
  - Chia sẻ collection không an toàn giữa nhiều luồng
  - Giả định sao chép collection đồng thời cũng sao chép từng phần tử
- level1: Map và Set
  level2:
  - Thay đổi trường tham gia equals hoặc hashCode sau khi đưa khóa vào Map
  - Đối tượng bằng nhau nhưng không được tìm thấy do sai hợp đồng băm
  - Khóa bị so sánh bằng tiêu chí khác trong TreeMap hoặc TreeSet
  - Ghi đè giá trị cũ ngoài ý muốn khi trùng khóa
  - Nhầm thiếu khóa với khóa được ánh xạ tới null
  - Kiểm tra rồi cập nhật bằng nhiều thao tác không nguyên tử
  - Chọn sai compute, computeIfAbsent hoặc merge theo hợp đồng
  - Hàm tính giá trị có tác dụng phụ hoặc sửa lại cùng cấu trúc
  - Dùng bản đồ tham chiếu yếu mà không hiểu vòng đời khóa
  - Nhầm collection đồng thời với tính nguyên tử của toàn quy trình
  - Giả định iterator hoặc view là bản chụp độc lập
  - Chọn khóa có biểu diễn không ổn định giữa các bước xử lý
- level1: Stream và lambda
  level2:
  - Tạo Stream nhưng không có thao tác kết thúc cần thiết
  - Tái sử dụng Stream đã được tiêu thụ hoặc đóng
  - Bỏ qua kết quả map, filter hoặc pipeline được tạo
  - Đặt logic bắt buộc trong peek hoặc tác dụng phụ có thể bị lược bỏ
  - Sửa nguồn dữ liệu trong khi Stream đang xử lý
  - Chia sẻ trạng thái có thể thay đổi giữa các lần gọi lambda
  - Dùng reduce hoặc collect với phép gộp không đúng hợp đồng
  - Phụ thuộc thứ tự trong pipeline song song
  - Phân biệt findFirst với findAny theo yêu cầu thực tế
  - Thu thập về Map khi có khóa trùng mà chưa xác định cách xử lý
  - Lambda giữ tham chiếu đối tượng có vòng đời dài hơn dự kiến
  - Dùng lambda che mất ngoại lệ hoặc lỗi xử lý
  - Không đóng Stream gắn với tài nguyên I/O
  - Nhầm hàm được truyền vào với thao tác đã được thực thi
- level1: Ngoại lệ
  level2:
  - Bắt rồi bỏ qua ngoại lệ làm chương trình tiếp tục ở trạng thái sai
  - Bắt quá rộng và che lỗi lập trình không mong muốn
  - Trả giá trị mặc định làm mất ý nghĩa thất bại
  - Ném ngoại lệ mới nhưng làm mất nguyên nhân gốc
  - Ghi log nhiều lần cho cùng một lỗi hoặc không giữ đủ ngữ cảnh
  - return hoặc throw trong finally che kết quả và ngoại lệ trước đó
  - Đóng tài nguyên làm mất ngoại lệ phát sinh ban đầu
  - Bỏ qua suppressed exceptions khi chẩn đoán
  - Bắt InterruptedException mà không xử lý yêu cầu gián đoạn đúng hợp đồng
  - Dùng sai kiểu ngoại lệ khiến bên gọi xử lý sai
  - Kiểm tra lỗi bằng nội dung thông điệp không ổn định
  - Thực hiện tác dụng phụ trước khi hoàn tất kiểm tra đầu vào
  - Đối tượng bị cập nhật một phần khi thao tác thất bại
  - Thử lại thao tác không an toàn khi thực hiện nhiều lần
- level1: Tài nguyên
  level2:
  - Mở tài nguyên mà không bảo đảm đóng trên mọi đường đi
  - Đóng tài nguyên quá sớm rồi tiếp tục sử dụng
  - Trả tài nguyên đã bị đóng bởi try-with-resources
  - Không xác định rõ bên tạo hay bên nhận chịu trách nhiệm đóng
  - Nhầm quyền sở hữu tài nguyên khi đóng lớp bao
  - Đóng sai thứ tự các tài nguyên phụ thuộc
  - Rò rỉ connection, statement hoặc result set
  - Quên kết thúc transaction hoặc khôi phục trạng thái kết nối
  - Dùng khóa, giấy phép semaphore hoặc đăng ký mà không giải phóng
  - Rò rỉ Executor, tác vụ nền hoặc kết nối mạng
  - Dùng AutoCloseable nhưng close không được gọi theo vòng đời thiết kế
  - Phụ thuộc dọn dẹp không xác định thay cho đóng chủ động
  - Giải phóng hai lần và tính an toàn của thao tác đóng lặp
- level1: Khởi tạo
  level2:
  - Thứ tự khởi tạo trường, khối khởi tạo và constructor
  - Đọc giá trị mặc định trước khi trường được gán theo ý định
  - Gọi phương thức có thể bị ghi đè từ constructor
  - Để this thoát ra ngoài khi đối tượng chưa khởi tạo xong
  - Đăng ký listener hoặc chạy tác vụ quá sớm trong constructor
  - Dùng đối số constructor nhưng quên cập nhật trường
  - Vòng phụ thuộc giữa các bước khởi tạo
  - Phụ thuộc thứ tự khởi tạo static giữa các lớp
  - Khởi tạo lười không an toàn khi có nhiều luồng
  - Singleton hoặc bộ nhớ đệm bị công bố trước khi sẵn sàng
  - Ném lỗi trong quá trình khởi tạo và đối tượng chưa hoàn thiện
  - Bất biến của đối tượng chưa được bảo đảm ở mọi constructor
- level1: Bất biến và đóng gói
  level2:
  - Trả trực tiếp tham chiếu tới trạng thái có thể sửa đổi
  - Giữ tham chiếu đầu vào mà không kiểm soát quyền sửa
  - Sao chép nông khi cần tách cấu trúc dữ liệu bên trong
  - Nhầm final của tham chiếu với tính bất biến của đối tượng
  - Collection chỉ đọc nhưng phần tử bên trong vẫn thay đổi
  - Record chứa thành phần có thể sửa đổi
  - Getter hoặc setter làm phá vỡ bất biến liên trường
  - Phương thức tưởng chỉ đọc nhưng làm thay đổi trạng thái
  - Lưu hoặc trả giá trị có thời hạn sử dụng ngắn hơn đối tượng chứa
  - Bộ nhớ đệm trả đối tượng dùng chung cho nhiều bên gọi
  - Chỉ kiểm tra đầu vào trước khi giữ tham chiếu có thể bị thay đổi
  - Ranh giới sao chép phòng vệ và chi phí cần kiểm chứng
- level1: Kế thừa và đa hình
  level2:
  - Nạp chồng nhầm chữ ký thay vì ghi đè phương thức
  - Thiếu @Override làm lỗi chữ ký khó nhận ra
  - Lớp con phá tiền điều kiện hoặc hậu điều kiện của lớp cha
  - equals không đối xứng khi kết hợp các lớp trong cùng hệ kế thừa
  - Ẩn trường hoặc phương thức static gây hiểu nhầm cách truy cập
  - Gọi phương thức không đúng như dự kiến do kiểu khai báo
  - Lớp con bỏ qua phần xử lý bắt buộc của lớp cha
  - Thêm trạng thái lớp con nhưng không cập nhật hợp đồng sao chép hoặc so sánh
  - Giả định clone tạo bản sao độc lập của toàn bộ đối tượng
  - Lựa chọn tổ hợp đối tượng khi kế thừa làm hợp đồng khó giữ
- level1: Trạng thái đồng thời
  level2:
  - Data race và truy cập trạng thái thiếu đồng bộ
  - Không nhìn thấy cập nhật giữa các luồng
  - Nhầm volatile với tính nguyên tử của phép đọc-sửa-ghi
  - Kiểm tra rồi hành động trên trạng thái có thể đổi
  - Chuỗi thao tác riêng lẻ an toàn nhưng tổng thể không nguyên tử
  - Công bố đối tượng không an toàn
  - Double-checked locking thiếu điều kiện bảo đảm phù hợp
  - Trường static có thể sửa bị chia sẻ ngoài dự kiến
  - Bộ sinh định dạng hoặc đối tượng khác không an toàn luồng bị dùng chung
