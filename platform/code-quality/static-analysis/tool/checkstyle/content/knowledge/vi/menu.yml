  - Đồng bộ import order, tab, line wrapping và độ dài dòng
  - Phân biệt sửa tự động bằng formatter với xác minh bằng Checkstyle
  - Chẩn đoán trường hợp IDE đạt nhưng build hoặc CI báo lỗi
- level1: Báo cáo và CI
  level2:
  - Thiết kế cổng chất lượng dựa trên severity và ngưỡng vi phạm
  - Chạy Checkstyle trong pipeline cùng lệnh build đã chuẩn hóa
  - Báo cáo plain, XML, HTML và SARIF
  - Tùy biến HTML bằng stylesheet khi build tool hỗ trợ
  - Lưu artifact và liên kết vi phạm về đúng tệp/dòng nguồn
  - Tích hợp kết quả vào giao diện review qua hệ thống CI phù hợp
  - Phân biệt báo cáo được tạo thành công với cổng kiểm tra đã đạt
  - Giữ báo cáo khi task thất bại và không làm mất exit status
  - Kiểm tra toàn dự án hoặc tệp thay đổi và giới hạn của từng phạm vi
  - Đường dẫn, encoding, locale và kết quả tái lập giữa các môi trường
- level1: Dự án nhiều module
  level2:
  - Chọn nguồn cấu hình chuẩn cho toàn repository
  - Chia sẻ cấu hình qua artifact, parent POM hoặc convention plugin
  - Tách phiên bản bộ quy tắc với phiên bản engine
  - Property đường dẫn dùng chung và tài nguyên suppression/header/import control
  - Quy tắc mặc định và ngoại lệ có chủ sở hữu cho từng module
  - Phân biệt báo cáo từng module với báo cáo tổng hợp
  - Phối hợp source set, mã sinh và ngôn ngữ ngoài Java
  - Kiểm tra sự nhất quán khi module chạy riêng hoặc từ root
- level1: Áp dụng cho mã cũ
  level2:
  - Kiểm kê vi phạm trước khi chọn chính sách áp dụng
  - Phân loại lỗi bố cục, lỗi quy ước và trường hợp cần xem xét thiết kế
  - Thiết lập mốc vi phạm ban đầu từ báo cáo hoặc suppression có kiểm soát
  - Phân biệt baseline do quy trình tạo với khả năng có sẵn của Checkstyle
  - Bật từng nhóm quy tắc theo giá trị và chi phí sửa
  - Tách thay đổi định dạng diện rộng khỏi thay đổi hành vi
  - Chính sách cho mã mới, mã được sửa và mã chưa chạm tới
  - Giảm ngoại lệ theo giai đoạn, có lý do và người chịu trách nhiệm
  - Đánh giá tác động đến review, merge conflict và trải nghiệm phát triển
- level1: Check AST tùy chỉnh
  level2:
  - Viết đặc tả quy tắc và chọn AbstractCheck
  - Tạo dự án JAR có dependency API Checkstyle phù hợp
  - getDefaultTokens, getAcceptableTokens và getRequiredTokens
  - visitToken, leaveToken, beginTree và finishTree
  - Điều hướng DetailAST qua node cha, con và node cùng cấp
  - Lấy nội dung token, vị trí nguồn và phân biệt ngữ cảnh
  - Khai báo property qua setter và kiểm tra giá trị cấu hình
  - Phát thông báo bằng log cùng messages.properties
  - Quản lý trạng thái theo tệp và tránh rò rỉ giữa các lần kiểm tra
  - Comment token, hỗ trợ XPath và giới hạn phân tích cú pháp
  - Đóng gói JAR, đăng ký module và kiểm tra khả năng nạp lớp
- level1: Check tệp và Javadoc
  level2:
  - Khi nào chọn AbstractFileSetCheck?
  - processFiltered, FileText và nội dung tệp
  - Giới hạn fileExtensions và vị trí báo vi phạm trên tệp
  - Khai báo tài nguyên ngoài để xử lý cache đúng
  - Phân biệt Java AST với cây Javadoc
  - AbstractJavadocCheck, DetailNode và JavadocTokenTypes
  - Truy cập ngữ cảnh Java từ check Javadoc
  - Giới hạn parser HTML/Javadoc và cách kiểm thử dữ liệu không hợp lệ
  - Chọn check Java, check tệp hoặc check Javadoc theo yêu cầu
- level1: Filter và listener riêng
  level2:
  - Khi nào cần filter riêng thay vì thêm check hoặc suppression chuẩn?
  - Filter, AuditEvent và điều kiện chấp nhận sự kiện
  - TreeWalkerFilter và phạm vi sự kiện trong TreeWalker
  - BeforeExecutionFileFilter cho quyết định loại trừ trước phân tích
  - AuditListener và các sự kiện bắt đầu/kết thúc, lỗi và exception
  - Tạo báo cáo tùy chỉnh mà không thay đổi logic phát hiện
  - Cấu hình module, property và classpath cho thành phần mở rộng
  - Giữ chi phí xử lý, trạng thái và tài nguyên trong giới hạn
  - Kiểm chứng kết quả sau khi ghép check, filter và listener
- level1: Kiểm thử quy tắc
  level2:
  - Thiết kế fixture đạt, vi phạm và trường hợp biên
  - Chạy Checker với cấu hình kiểm thử bằng JUnit
  - Thu AuditEvent và đối chiếu check, dòng, cột, thông báo
  - Kiểm thử property mặc định, tùy chỉnh và không hợp lệ
  - Kiểm thử token được chọn, token bắt buộc và ngữ cảnh cú pháp
  - Comment, chuỗi, Unicode, tab và xuống dòng CRLF/LF
  - Record, lambda, generic và cú pháp Java mới trong phạm vi hỗ trợ
  - Kiểm thử nhiều tệp liên tiếp để phát hiện trạng thái tồn dư
  - Kiểm thử từng suppression cùng một vi phạm lân cận không được miễn
  - Kiểm thử JAR tùy chỉnh qua CLI và build tool thực tế
  - Kiểm thử hồi quy cấu hình khi nâng engine hoặc plugin
  - Giữ fixture nhỏ để thông báo lỗi phản ánh đúng quy tắc đang kiểm tra
- level1: Hiệu năng và cache
  level2:
  - Đo thời gian theo số tệp, kích thước mã và nhóm check
  - Cache của Checker và điều kiện khiến kết quả phải được tính lại
  - Thay đổi cấu hình, tài nguyên ngoài hoặc check tùy chỉnh
  - Phân biệt cache Checkstyle với up-to-date/build cache của Gradle
  - Loại trừ mã sinh hoặc đầu vào trùng đúng phạm vi
  - Regex tốn tài nguyên, XPath rộng và duyệt cây không cần thiết
  - Cấp heap phù hợp và nhận diện rò rỉ trạng thái trong check riêng
  - Giới hạn chạy song song và an toàn của thành phần mở rộng
  - Chọn phép đo tái lập trước khi tối ưu pipeline
- level1: Lỗi và chẩn đoán
  level2:
  - Lỗi XML, DTD, property chưa được thay thế hoặc kiểu giá trị sai
  - Đặt check/filter sai Parent Module
  - Không tìm thấy module, class hoặc resource trên classpath
  - UnsupportedClassVersionError và JDK chạy công cụ không phù hợp
  - Parser không hỗ trợ cú pháp Java hoặc preview feature đang dùng
  - Token không được check chấp nhận hoặc cấu hình tokens sai
  - Suppression không có tác dụng vì sai đường dẫn, id hoặc AST
  - Regex và XML escape khác dự kiến
  - Khác biệt dòng/cột do tab, encoding hoặc chuẩn xuống dòng
  - Vi phạm lặp hoặc thiếu do quét nguồn sai phạm vi
  - IDE, Maven, Gradle và CI dùng engine hoặc cấu hình khác nhau
  - Quy trình tái hiện tối thiểu bằng một tệp nguồn và một cấu hình
- level1: Nâng cấp và quản trị
  level2:
  - Đọc release notes và yêu cầu JDK của engine
  - Tách nâng plugin build, engine và bộ quy tắc
  - Check mới, property đổi tên, token mới và giá trị mặc định thay đổi
  - Đối chiếu thay đổi google_checks.xml, sun_checks.xml hoặc style khác
  - Kiểm tra tương thích JAR quy tắc tùy chỉnh
  - Chạy so sánh báo cáo trước–sau trên tập mã đại diện
  - Rà soát suppression đã lỗi thời và XPath bị thay đổi
  - Version hóa cấu hình và ghi nhận quyết định quy ước
  - Lập kế hoạch triển khai cùng phương án quay lại cấu hình trước
- level1: Thực hành tổng hợp
  level2:
  - Thiết lập dự án Java mẫu và quy ước nhóm
  - Viết checkstyle.xml tối thiểu và tạo các vi phạm có chủ đích
  - Thực hành naming, import, whitespace, Javadoc và metrics
  - Tích hợp với Maven hoặc Gradle theo cấu trúc dự án
  - Đồng bộ formatter và plugin IDE với lệnh build
  - Viết suppression XML, comment và XPath có phạm vi hẹp
  - Tạo một AbstractCheck theo quy tắc riêng của dự án
  - Kiểm thử fixture, property và đóng gói check thành JAR
  - Chạy CI, lưu báo cáo và xác minh điều kiện làm build thất bại
  - Áp dụng dần cho một module mã cũ và đánh giá thay đổi vi phạm
  - Nâng engine hoặc bộ quy tắc trên nhánh thử nghiệm
  - Rà soát tính đúng của cấu hình, phạm vi nguồn và khả năng bảo trì
