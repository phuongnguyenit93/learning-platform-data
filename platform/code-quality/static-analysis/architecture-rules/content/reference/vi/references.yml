references:
  - title: "ArchUnit User Guide"
    url: "https://www.archunit.org/userguide/html/000_Index.html"
    description: "Hướng dẫn kiểm thử kiến trúc Java: lớp, gói, tầng, slices, chu trình và baseline vi phạm."
  - title: "Spring Modulith — Verifying Application Module Structure"
    url: "https://docs.spring.io/spring-modulith/reference/verification.html"
    description: "Các quy tắc xác thực module ứng dụng về chu trình, API công khai và dependency được phép."
  - title: "jQAssistant User Manual"
    url: "https://jqassistant.github.io/jqassistant/current/"
    description: "Quy tắc cấu trúc dựa trên đồ thị để phát hiện dependency sai, chu trình và vi phạm ranh giới."
  - title: "Apache Maven Enforcer — Banned Dependencies"
    url: "https://maven.apache.org/components/enforcer/enforcer-rules/bannedDependencies.html"
    description: "Ví dụ chính thức về khai báo và thực thi chính sách cấm dependency ở cấp build Maven."
  - title: "The Clean Architecture — Robert C. Martin"
    url: "https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html"
    description: "Nền tảng lý thuyết về tách trách nhiệm và quy tắc hướng phụ thuộc giữa các tầng."