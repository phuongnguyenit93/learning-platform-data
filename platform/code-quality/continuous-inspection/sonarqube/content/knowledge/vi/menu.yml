menu:
- level1: Mô hình tư duy
  level2:
  - SonarQube giải quyết vấn đề gì trong kiểm tra chất lượng mã liên tục?
  - Từ cảnh báo cục bộ đến kết quả phân tích được theo dõi theo thời gian
  - 'Các thành phần chính: mã nguồn, scanner, analyzer, máy chủ và người rà soát'
  - Luồng phản hồi từ thay đổi mã đến sửa lỗi và phân tích lại
  - Độ tin cậy, bảo mật và khả năng bảo trì trong mô hình chất lượng
  - Phân biệt phân tích tĩnh, kiểm thử tự động và rà soát mã thủ công
  - Phân biệt quy tắc, vấn đề phát hiện, chỉ số và điều kiện chất lượng
  - Clean as You Code và cách kiểm soát chất lượng phần mã mới
  - Giới hạn của công cụ và ý nghĩa thực tế của kết quả đạt
  - Bản đồ thuật ngữ và lộ trình từ lần quét đầu tiên đến CI/CD
- level1: Sản phẩm và phiên bản
  level2:
  - Phân biệt SonarQube Server, Community Build và SonarQube Cloud
  - Vai trò của SonarQube for IDE trong hệ sinh thái
  - Xác định đúng sản phẩm, phiên bản và tài liệu tương ứng
  - Bản phát hành thông thường, bản hỗ trợ dài hạn và chính sách nâng cấp
  - Phạm vi ngôn ngữ, bộ phân tích và khả năng tùy theo phiên bản
  - Kiểm tra điều kiện sử dụng phân tích nhánh, pull request và báo cáo nâng cao
  - Phân biệt tính năng sẵn có, tính năng theo edition và tiện ích bên ngoài
  - Đối chiếu khả năng phân tích mã, bí mật và phụ thuộc theo sản phẩm
  - Kiểm tra tương thích giữa máy chủ, scanner, JDK và công cụ build
  - Lập cấu hình thực hành có phiên bản cố định và có thể tái lập
- level1: Kiến trúc phân tích
  level2:
  - Scanner chạy ở đâu và đọc những dữ liệu nào?
  - Analyzer phân tích mã và tạo phát hiện như thế nào ở mức khái niệm?
  - Biên dịch, chạy kiểm thử, sinh báo cáo và quét mã là các công việc khác nhau
  - Gửi báo cáo phân tích và xử lý bất đồng bộ ở phía máy chủ
  - Vai trò của Compute Engine, cơ sở dữ liệu và chỉ mục tìm kiếm
  - Phân biệt scanner thành công với máy chủ xử lý báo cáo thành công
  - Thời điểm tính chỉ số, cập nhật vấn đề và đánh giá Quality Gate
  - Quan hệ giữa một lần phân tích, nhánh và ảnh chụp kết quả
  - Dữ liệu SCM và thông tin ngữ cảnh phục vụ phân tích
  - Ranh giới tin cậy giữa máy phát triển, CI và máy chủ SonarQube
- level1: Môi trường thực hành
  level2:
  - Chọn môi trường cục bộ, container hoặc máy chủ dùng chung
  - Đọc yêu cầu hệ điều hành, tài nguyên và JDK theo phiên bản
  - Chạy môi trường thử nghiệm bằng Docker và cố định phiên bản image
  - Cổng truy cập, hostname và kết nối từ máy quét đến máy chủ
  - Cơ sở dữ liệu thử nghiệm và cơ sở dữ liệu phù hợp môi trường lâu dài
  - Lưu bền dữ liệu, cấu hình và các thư mục cần quản lý
  - Đăng nhập lần đầu, thiết lập tài khoản quản trị và cấu hình cơ bản
  - Biến môi trường, tệp cấu hình và cách cung cấp bí mật
  - Kiểm tra trạng thái khởi động, nhật ký và kết nối cơ sở dữ liệu
  - Tách môi trường học tập khỏi môi trường phục vụ nhiều dự án
  - Khởi động lại môi trường và xác minh dữ liệu vẫn được bảo toàn
- level1: Dự án đầu tiên
  level2:
  - Tạo dự án thủ công hoặc nhập từ nền tảng quản lý mã nguồn
  - Project key, tên hiển thị và định danh ổn định
  - Chọn quyền truy cập và phạm vi hiển thị dự án
  - Chọn scanner phù hợp với hệ thống build
  - Cấp token đúng phạm vi để thực hiện phân tích
  - Chuẩn bị một dự án Java nhỏ có mã nguồn và kiểm thử
  - Thực hiện lần phân tích đầu tiên và đọc nhật ký scanner
  - Theo dõi tác vụ nền đến khi kết quả sẵn sàng
  - Đọc Overview, Issues, Measures, Code và lịch sử phân tích
  - Sửa một vấn đề mẫu rồi xác minh bằng lần phân tích tiếp theo
  - Ghi nhận môi trường và đầu vào để người khác tái hiện được
- level1: Phạm vi phân tích
  level2:
  - Thư mục gốc dự án và cách diễn giải đường dẫn
  - Phân biệt mã sản phẩm, mã kiểm thử và tài nguyên
  - Giá trị suy ra từ công cụ build và cấu hình ghi đè
  - sonar.sources, sonar.tests và giới hạn cách khai báo phạm vi
  - Bao gồm hoặc loại trừ tệp bằng mẫu đường dẫn phù hợp
  - Phân biệt loại trừ khỏi phân tích, coverage và phát hiện trùng lặp
  - Mã sinh tự động, thư viện bên thứ ba và các tệp không thuộc quyền sửa
  - Thư mục build, tệp bị SCM bỏ qua và nội dung cần kiểm tra lại
  - Mã nhiều ngôn ngữ và phạm vi của từng bộ phân tích
  - Tránh một tệp bị phân loại đồng thời là nguồn và kiểm thử
  - Thứ tự ưu tiên giữa thiết lập máy chủ, dự án, build và tham số chạy
  - Kiểm chứng danh sách tệp được quét bằng nhật ký và giao diện
- level1: Java và bytecode
  level2:
  - Vì sao phân tích Java cần thông tin ngữ nghĩa và mã đã biên dịch?
  - Mã nguồn, tệp class và thư viện phụ thuộc trong quá trình phân tích
  - Chuẩn bị bytecode đúng với phiên bản mã đang quét
  - sonar.java.binaries, thư viện và các tình huống cần cấu hình tường minh
  - Phân biệt JDK biên dịch ứng dụng với JRE chạy scanner
  - Tương thích cú pháp Java, mức source và năng lực analyzer
  - JRE tự cung cấp của scanner và các yêu cầu cần kiểm tra
  - Annotation processor, mã sinh và ảnh hưởng đến thông tin phân tích
  - Quét mã có Lombok hoặc framework cần hiểu mô hình biên dịch
  - Đọc cảnh báo thiếu lớp, thiếu thư viện hoặc thiếu thông tin kiểu
  - Giới hạn phân tích khi chỉ quét mã nguồn mà không chuẩn bị đầy đủ build
- level1: Tích hợp Gradle
  level2:
  - Vai trò plugin org.sonarqube trong một dự án Gradle
  - Chọn phiên bản plugin phù hợp máy chủ, Gradle và môi trường Java
  - Khai báo plugin và cấu hình khối sonar trong Groovy hoặc Kotlin DSL
  - Project key, địa chỉ máy chủ và thông tin dự án
  - Cung cấp SONAR_TOKEN qua môi trường hoặc kho bí mật
  - Quan hệ giữa compile, test, báo cáo coverage và tác vụ sonar
  - Thứ tự tác vụ khác phụ thuộc tác vụ và cách bảo đảm đầu vào đã được tạo
  - Đọc thuộc tính được suy ra từ mô hình Gradle
  - Đường dẫn tương đối, thư mục làm việc và môi trường CI
  - Cấu hình dùng chung và giá trị riêng cho từng subproject
  - Bộ nhớ scanner, cache và các tham số chạy theo phiên bản
  - Đọc kết quả Gradle cùng tác vụ nền trên máy chủ
  - Kiểm tra bản dựng thất bại, scanner thất bại và gate thất bại riêng biệt
- level1: Maven và Scanner CLI
  level2:
  - Khi nào chọn scanner tích hợp build và khi nào dùng Scanner CLI?
  - SonarScanner for Maven và dữ liệu suy ra từ mô hình dự án
  - Thứ tự chuẩn bị package, kiểm thử và báo cáo trước phân tích
  - Scanner CLI và tệp sonar-project.properties
  - Cấu hình tường minh mã nguồn, bytecode và thư viện khi không dùng scanner theo build
  - Phân biệt cấu hình của Maven, Gradle và CLI
  - Tham số dòng lệnh, biến môi trường và nguy cơ lộ token
  - Giữ hợp đồng phân tích nhất quán khi đổi công cụ build
- level1: Dự án nhiều mô-đun
  level2:
  - Chọn ranh giới project SonarQube theo sản phẩm hoặc kho mã
  - Một lần phân tích toàn dự án và nhiều dự án phân tích độc lập
  - Quan hệ giữa root project, subproject và phạm vi mã nguồn
  - Cấu hình dùng chung và ngoại lệ cho từng mô-đun
  - Loại bỏ mô-đun không thuộc phạm vi bằng cơ chế scanner hỗ trợ
  - Bytecode và phụ thuộc giữa các mô-đun
  - Kiểm thử ở mô-đun riêng và ánh xạ coverage về mô-đun chứa mã
  - Đường dẫn báo cáo tổng hợp và phạm vi nguồn tương ứng
  - Kho mã đơn (monorepo), định danh dự án và giới hạn tích hợp theo phiên bản
  - Tránh quét trùng, thiếu tệp hoặc gắn kết quả vào sai dự án
  - Đánh giá thay đổi cấu trúc mô-đun mà vẫn giữ lịch sử có ý nghĩa
- level1: Kiểm thử và coverage
  level2:
  - SonarQube tiếp nhận báo cáo thay vì tự chạy kiểm thử hoặc đo coverage
  - Phân biệt kết quả chạy kiểm thử với độ bao phủ mã
  - Dùng JaCoCo tạo báo cáo XML cho dự án Java
  - Cấu hình sonar.coverage.jacoco.xmlReportPaths và kiểm tra tệp đầu vào
  - Bảo đảm báo cáo được sinh trước khi scanner đọc
  - Độ bao phủ dòng, nhánh điều kiện và ý nghĩa kết quả tổng hợp
  - Coverage trên mã mới và trên toàn bộ mã
  - Tập kiểm thử đơn vị, tích hợp và chiến lược tổng hợp báo cáo
  - Loại trừ coverage có lý do và ảnh hưởng tới mẫu số
  - Phân biệt chưa nhập được báo cáo với báo cáo hợp lệ có coverage thấp
  - Chẩn đoán đường dẫn sai, báo cáo rỗng, mã không khớp hoặc thiếu class
  - Giới hạn của phần trăm coverage đối với chất lượng kiểm thử
- level1: Chỉ số chất lượng
  level2:
  - Đọc Measures theo toàn bộ mã và phần mã mới
  - Dòng mã, tệp, hàm và các đơn vị đếm cần hiểu đúng
  - Độ phức tạp chu trình và độ phức tạp nhận thức
  - Trùng lặp theo dòng hoặc khối và giới hạn suy luận từ chỉ số
  - Chỉ số độ tin cậy, bảo mật và khả năng bảo trì
  - Xếp hạng chất lượng và cách tra định nghĩa theo chế độ đang dùng
  - Ước lượng công sửa chữa và nợ kỹ thuật
  - Tỷ lệ đã rà soát Security Hotspot và ý nghĩa bảo đảm thực tế
  - Biến động chỉ số do thay mã, thay phạm vi hoặc thay analyzer
  - So sánh dự án khi có cùng chính sách và điều kiện đo
  - Tránh đồng nhất điểm số cao với thiết kế tốt hoặc không còn lỗi
- level1: Quy tắc và chế độ
  level2:
  - Rule key, mô tả vấn đề, ví dụ và hướng dẫn khắc phục
  - Đọc điều kiện phát hiện và phạm vi áp dụng của một quy tắc
  - Standard Experience và cách phân loại Bug, Vulnerability, Code Smell
  - MQR Mode và tác động lên Security, Reliability, Maintainability
  - Mức độ nghiêm trọng theo chế độ và tác động lên xếp hạng
  - Một phát hiện có thể ảnh hưởng nhiều khía cạnh chất lượng
  - Thuộc tính mã sạch và cách dùng làm thông tin hỗ trợ
  - Quy tắc đang hoạt động, quy tắc mới và quy tắc không còn được khuyến nghị
  - Tham số quy tắc và điều chỉnh theo bối cảnh dự án
  - Tra tài liệu phù hợp thay vì suy diễn từ nhãn mức độ
  - Giới hạn phát hiện, cảnh báo nhầm và lỗi bị bỏ sót
- level1: Quality Profile
  level2:
  - Quality Profile xác định tập quy tắc cho một ngôn ngữ
  - Phân biệt profile tích hợp sẵn, profile mặc định và profile tự tạo
  - Profile Sonar way và vai trò điểm xuất phát
  - Gắn profile với dự án hoặc sử dụng profile mặc định
  - Sao chép profile và kế thừa profile có tác động khác nhau
  - Bật, tắt và điều chỉnh tham số quy tắc có căn cứ
  - Phân quyền quản lý profile và trách nhiệm thay đổi chính sách
  - So sánh profile để xác định khác biệt quy tắc
  - Theo dõi thay đổi từ analyzer hoặc profile tích hợp sẵn
  - Xuất, khôi phục và quản lý cấu hình theo khả năng phiên bản
  - Rà soát tác động lên các dự án trước khi áp dụng diện rộng
- level1: Quality Gate
  level2:
  - Quality Gate đánh giá các điều kiện trên kết quả phân tích
  - Phân biệt Quality Gate với Quality Profile và mức độ một vấn đề
  - Chỉ số, toán tử so sánh và ngưỡng của một điều kiện
  - Điều kiện trên mã mới và trên toàn bộ mã
  - Gate tích hợp sẵn, gate tùy chỉnh và gate mặc định
  - Gắn gate phù hợp với từng loại dự án
  - Đọc lý do Passed, Failed hoặc trạng thái chưa có kết quả
  - Điều kiện coverage, trùng lặp, vấn đề mới và rà soát hotspot
  - Các ngoại lệ khi lượng mã mới nhỏ và cách kiểm tra thiết lập
  - Giới hạn điều kiện hoặc quy tắc ưu tiên tùy edition
  - Đánh giá tác động của thay gate lên quy trình phát triển
  - Gate đạt là một tín hiệu trong quyết định chất lượng tổng thể
- level1: New Code
  level2:
  - New Code khác Overall Code và mã cũ như thế nào?
  - Định nghĩa mốc so sánh để xác định phần mã mới
  - Previous version và cách quản lý phiên bản dự án
  - Number of days và tác động của cửa sổ thời gian trượt
  - Reference branch và yêu cầu dữ liệu SCM phù hợp
  - Specific analysis và phạm vi cấu hình theo phiên bản
  - Thiết lập ở cấp toàn hệ thống, dự án hoặc nhánh
  - Ưu tiên cấu hình và tác động khi thay mốc chung
  - New Code của pull request so với nhánh đích
  - Lần phân tích đầu tiên và cách kiểm chứng mốc so sánh
  - Ngày thay đổi, lịch sử Git và các trường hợp mã bị nhận diện khác dự kiến
  - Tránh đổi baseline để che vấn đề mà không cải thiện mã
- level1: Vòng đời vấn đề
  level2:
  - Đọc một vấn đề theo quy tắc, vị trí và ngữ cảnh mã
  - Vị trí chính, vị trí bổ sung và luồng dữ liệu dẫn đến phát hiện
  - Phân loại ưu tiên dựa trên tác động và khả năng xảy ra
  - Trạng thái Open, Accepted, False positive và Fixed
  - Sửa mã rồi phân tích lại để xác minh vấn đề đã được khắc phục
  - Phân biệt chấp nhận một vấn đề có thật với xác định cảnh báo nhầm
  - Phân công, bình luận và ghi lại lý do quyết định
  - Tìm kiếm, lọc và xử lý nhiều vấn đề có cùng nguyên nhân
  - Nhận diện vấn đề giữa các lần phân tích khi tệp hoặc dòng thay đổi
  - Sandbox cho vấn đề phát sinh từ cập nhật công cụ khi phiên bản hỗ trợ
  - Ảnh hưởng của trạng thái vấn đề lên chỉ số và Quality Gate
  - Giữ bằng chứng rà soát thay vì chỉ làm giảm số lượng cảnh báo
- level1: Security Hotspot
  level2:
  - Security Hotspot yêu cầu rà soát khác vấn đề bảo mật đã được phát hiện
  - Đọc ngữ cảnh sử dụng trước khi quyết định có cần sửa
  - Nguồn dữ liệu, điểm sử dụng nhạy cảm và đường truyền dữ liệu
  - Ưu tiên rà soát theo rủi ro và mức độ tiếp xúc thực tế
  - Thực hiện quy trình đánh giá với bằng chứng từ mã và cấu hình
  - Trạng thái cần rà soát, chờ xử lý, đã sửa hoặc an toàn theo phiên bản
  - Phân quyền rà soát và ghi lại lập luận của người đánh giá
  - Phân tích lại sau khi thay đổi biện pháp bảo vệ
  - Ảnh hưởng của tỷ lệ rà soát lên điều kiện chất lượng
  - Giới hạn của kết luận an toàn và nhu cầu kiểm chứng bảo mật bổ sung
- level1: Quy trình của lập trình viên
  level2:
  - Đưa việc đọc và sửa cảnh báo vào công việc phát triển hằng ngày
  - Cài SonarQube for IDE và chọn đúng sản phẩm được hỗ trợ
  - Phân biệt phân tích độc lập trong IDE với Connected Mode
  - Kết nối dự án IDE với dự án trên máy chủ
  - Đồng bộ chính sách và hiểu giới hạn khác biệt kết quả IDE–máy chủ
  - Mở vấn đề trong IDE và kiểm tra đúng phiên bản mã
  - Chạy kiểm thử sau khi sửa để bảo toàn hành vi
  - Nhận phản hồi trước commit và xác minh lại bằng CI
  - Tránh sửa máy móc theo gợi ý hoặc đổi thiết kế chỉ vì một chỉ số
  - Ghi nhận quyết định khi cảnh báo cần trao đổi giữa nhiều người
- level1: SCM, nhánh và pull request
  level2:
  - Kiểm tra khả năng phân tích nhánh và pull request theo sản phẩm, edition
  - Main branch và cách ánh xạ với nhánh chính trong kho mã
  - Phân biệt phân tích nhánh với phân tích pull request
  - Thông tin commit, nhánh nguồn và nhánh đích
  - Lịch sử Git, shallow clone và dữ liệu blame
  - Chuẩn bị nhánh đích hoặc nhánh tham chiếu trên máy chạy CI
  - Tự nhận diện thông tin CI và trường hợp phải truyền tham số
  - Phạm vi vấn đề và điều kiện Quality Gate của pull request
  - Hiển thị kết quả phân tích trong giao diện pull request
  - Quyền truy cập kho mã và cấu hình liên kết nền tảng DevOps
  - Theo dõi trạng thái vấn đề sau khi merge
  - Xử lý nhánh tạm, đổi tên nhánh và dữ liệu phân tích không còn cần thiết
- level1: Tích hợp CI/CD
  level2:
  - Thiết kế pipeline checkout, build, test, report, scan và đánh giá gate
  - Chuẩn bị JDK, công cụ build và phiên bản scanner trên CI
  - Cung cấp token bằng kho bí mật thay vì tệp mã nguồn
  - Kết nối mạng, DNS và chứng chỉ giữa runner với máy chủ
  - 'GitHub Actions: xác định sự kiện chạy và quyền tối thiểu'
  - 'Jenkins: cấu hình môi trường scanner và liên kết kết quả phân tích'
  - Đối chiếu cách tích hợp GitLab CI hoặc Azure Pipelines khi sử dụng
  - Phân biệt bí mật ở môi trường tin cậy với pull request từ fork
  - Lưu và dùng đúng báo cáo kiểm thử hoặc coverage giữa các job
  - Bộ nhớ đệm phụ thuộc và kiểm tra dữ liệu phân tích còn mới
  - Tránh phân tích trùng hoặc ghi kết quả từ các commit không khớp
  - Lưu liên kết, định danh lần phân tích và thông tin phục vụ chẩn đoán
- level1: Quality Gate trong pipeline
  level2:
  - Vì sao scanner trả thành công nhưng pipeline chưa biết kết quả gate?
  - Chờ xử lý báo cáo bằng sonar.qualitygate.wait khi scanner hỗ trợ
  - Thời hạn chờ và phân biệt gate không đạt với chưa nhận được kết quả
  - Liên kết tác vụ nền với đúng lần phân tích vừa gửi
  - Đọc report-task.txt và các định danh phục vụ truy vết
  - Chờ theo webhook hoặc cơ chế tích hợp CI phù hợp
  - Chính sách dừng pipeline, ngăn merge hoặc chặn phát hành
  - Cấu hình kiểm tra bắt buộc trên nền tảng quản lý mã
  - Xử lý lỗi hạ tầng riêng với quyết định chất lượng
  - Kiểm thử một thay đổi chủ động làm gate thất bại rồi khắc phục
  - Không dùng trạng thái cũ của dự án để quyết định cho commit mới
- level1: Công cụ bên ngoài
  level2:
  - Phân biệt analyzer của SonarQube với kết quả nhập từ công cụ khác
  - Vai trò bổ sung của Checkstyle, PMD và SpotBugs trong dự án Java
  - Sinh báo cáo bên ngoài trước khi scanner nhập dữ liệu
  - Kiểm tra định dạng, phiên bản và đường dẫn báo cáo được hỗ trợ
  - Định dạng vấn đề tổng quát và báo cáo SARIF
  - Ánh xạ quy tắc, mức tác động, tệp và vị trí mã
  - Quy tắc bên ngoài được quản lý ở đâu thay vì trong Quality Profile?
  - Ảnh hưởng của kết quả nhập lên chỉ số và gate theo phiên bản
  - Trạng thái trong SonarQube không tự đồng bộ về công cụ nguồn
  - Giảm phát hiện trùng và giữ rõ chủ sở hữu của từng chính sách
- level1: Ngoại lệ và cảnh báo nhầm
  level2:
  - Thu thập bằng chứng trước khi kết luận một cảnh báo là nhầm
  - Đánh giá ngoại lệ theo dự án, quy tắc, tệp hoặc vị trí cụ thể
  - Phân biệt sửa mã, đổi profile, đổi phạm vi và đổi trạng thái vấn đề
  - '@SuppressWarnings và phạm vi hỗ trợ của bộ phân tích'
  - NOSONAR và rủi ro che cả cảnh báo phát sinh về sau
  - Điều kiện bỏ qua vấn đề và mẫu đường dẫn cần kiểm tra kỹ
  - Loại trừ mã sinh hoặc mã không quản lý mà vẫn giữ minh bạch
  - Ghi lý do, người chịu trách nhiệm và thời điểm rà soát lại
  - Phân tích tỷ lệ ngoại lệ để phát hiện chính sách chưa phù hợp
  - Kiểm tra gate đạt nhờ cải thiện mã hay do thay đổi cách đo
- level1: Phân quyền và bí mật
  level2:
  - Quyền toàn hệ thống, quyền dự án và nguyên tắc tối thiểu
  - Nhóm người dùng, mẫu phân quyền và dự án công khai hoặc riêng tư
  - Tách quyền xem mã, thực hiện phân tích và quản trị chính sách
  - Phân biệt token người dùng với các loại token phân tích được hỗ trợ
  - Phạm vi dự án, thời hạn, thu hồi và luân chuyển token
  - Tài khoản dịch vụ và quyền dùng cho tự động hóa
  - Cơ chế đăng nhập tập trung theo sản phẩm hoặc edition
  - Bảo vệ kết nối HTTPS và cấu hình chứng chỉ tin cậy
  - Kiểm soát bí mật trong log, tham số dòng lệnh và cấu hình build
  - Quyền truy cập mã nguồn, báo cáo và dữ liệu phân tích nhạy cảm
  - Rà soát quyền khi người dùng hoặc dự án thay đổi chủ sở hữu
- level1: Web API và webhook
  level2:
  - Tra Web API ngay trên phiên bản máy chủ đang sử dụng
  - Xác thực và phân quyền cho từng thao tác API
  - Đọc dự án, chỉ số, vấn đề và trạng thái phân tích
  - Phân trang, lọc dữ liệu và tránh bỏ sót kết quả
  - Phân biệt metric key theo chế độ hoặc phiên bản
  - Tự động hóa cấu hình có kiểm tra trước và đọc lại sau thay đổi
  - Endpoint bị thay thế và lộ trình Web API V2
  - Webhook khi xử lý phân tích hoàn tất và dữ liệu cần đối chiếu
  - Xác minh chữ ký HMAC của payload webhook
  - Xử lý gửi lại, trùng sự kiện và tính lũy đẳng ở bên nhận
  - Theo dõi lỗi giao nhận mà không suy diễn trạng thái gate
- level1: Vận hành máy chủ
  level2:
  - Trách nhiệm của quản trị hệ thống và quản trị từng dự án
  - Theo dõi trạng thái web, Compute Engine, tìm kiếm và cơ sở dữ liệu
  - Nhật ký từng thành phần và cách liên kết với một tác vụ
  - Hàng đợi báo cáo, thời gian xử lý và phát hiện tồn đọng
  - Theo dõi CPU, bộ nhớ, dung lượng đĩa và kết nối cơ sở dữ liệu
  - Reverse proxy, URL công khai và cấu hình HTTPS
  - Lưu giữ lịch sử, dọn dữ liệu và tác động tới khả năng tra cứu
  - Quản lý extension hoặc plugin tương thích với phiên bản
  - Theo dõi giấy phép và giới hạn sử dụng khi edition yêu cầu
  - Tách thay đổi cấu hình vận hành khỏi thay đổi chính sách chất lượng
  - Thiết lập cảnh báo sự cố và quy trình khôi phục dịch vụ
- level1: Sao lưu và nâng cấp
  level2:
  - Xác định dữ liệu gốc cần sao lưu và thành phần có thể dựng lại
  - Sao lưu cơ sở dữ liệu bằng cơ chế được nhà cung cấp hỗ trợ
  - Quản lý bản sao cấu hình, plugin và các bí mật cần khôi phục
  - Thử khôi phục vào môi trường riêng và kiểm tra tính đầy đủ
  - Chỉ mục tìm kiếm và quy trình dựng lại theo phiên bản
  - Đọc lộ trình cập nhật thay vì bỏ qua phiên bản trung gian bắt buộc
  - Kiểm tra tương thích JDK, cơ sở dữ liệu, scanner và plugin
  - Sao lưu, cửa sổ bảo trì và điều kiện quay về trước nâng cấp
  - Thay đổi schema dữ liệu và giới hạn hạ phiên bản
  - Rà soát quy tắc, profile, chỉ số và gate sau cập nhật
  - Kiểm chứng bằng dự án mẫu trước khi tiếp tục phân tích diện rộng
- level1: Hiệu năng phân tích
  level2:
  - Tách thời gian build, kiểm thử, scanner và xử lý phía máy chủ
  - Đo quy mô mã, số dự án và tần suất phân tích thực tế
  - Bộ nhớ của scanner khác bộ nhớ ứng dụng SonarQube
  - Cache phân tích và cơ chế tăng dần theo ngôn ngữ, phiên bản
  - Tải lại dữ liệu, mạng và chi phí nhập báo cáo lớn
  - Phân bổ tài nguyên CI theo kích thước từng dự án
  - Tối ưu phạm vi đúng hợp đồng thay vì loại bỏ mã chỉ để quét nhanh
  - Điều phối nhiều lần phân tích và theo dõi nghẽn Compute Engine
  - Mở rộng triển khai theo khả năng edition và tài liệu kiến trúc
  - Đánh giá tối ưu bằng thời gian phản hồi và độ đầy đủ kết quả
- level1: Chẩn đoán sự cố
  level2:
  - 'Không kết nối được máy chủ: địa chỉ, mạng, proxy và chứng chỉ'
  - Token không hợp lệ, hết hạn hoặc không đủ quyền
  - Không tìm thấy dự án hoặc project key không đúng
  - Scanner không chạy do JDK, Gradle hoặc plugin không tương thích
  - Thiếu bytecode, thư viện hoặc thông tin kiểu của mã Java
  - Không có tệp được quét hoặc một tệp bị lập chỉ mục hai lần
  - Không nhập được coverage hoặc coverage không khớp kỳ vọng
  - Kết quả mã mới sai do mốc so sánh hoặc lịch sử SCM
  - Phân tích nhánh hoặc pull request không được hỗ trợ trong môi trường đang dùng
  - Tác vụ nền chờ lâu, thất bại hoặc hết bộ nhớ
  - Gate không đạt, chưa được tính hoặc pipeline không nhận được kết quả
  - Kết quả IDE, máy cục bộ và CI khác nhau
  - Báo cáo ngoài không hiển thị hoặc ánh xạ sai vị trí
  - Phát hiện tăng đột ngột sau đổi profile, chế độ hoặc phiên bản
  - Tạo bộ thông tin tái hiện đủ dùng mà không làm lộ bí mật
- level1: Áp dụng trong nhóm
  level2:
  - Thống nhất mục tiêu chất lượng và phạm vi trách nhiệm của SonarQube
  - Triển khai thử trên một dự án đại diện trước khi mở rộng
  - Thiết lập mốc ban đầu cho dự án có nhiều nợ kỹ thuật
  - Ưu tiên giữ mã mới tốt trong khi lập kế hoạch cải thiện mã cũ
  - Quy trình thảo luận, phê duyệt và rà soát ngoại lệ
  - Chọn gate theo rủi ro và đặc điểm dự án có căn cứ
  - Quản lý thay đổi profile hoặc gate như một thay đổi chính sách
  - Phân công xử lý cảnh báo giữa người phát triển, bảo mật và quản trị
  - Theo dõi thời gian phản hồi, vấn đề tái xuất hiện và hiệu quả khắc phục
  - Tránh dùng điểm số hoặc số cảnh báo để xếp hạng cá nhân
  - Báo cáo tổng hợp qua application hoặc portfolio khi edition hỗ trợ
- level1: Thực hành
  level2:
  - Dựng môi trường SonarQube có phiên bản cố định và dự án Java mẫu
  - Tích hợp Gradle rồi theo dõi một lần phân tích đến kết quả cuối
  - Sinh coverage JaCoCo và kiểm chứng các trường hợp nhập báo cáo sai
  - Tạo profile cho dự án mẫu và quan sát tác động khi đổi quy tắc
  - Thiết kế gate có điều kiện rõ ràng rồi thử thay đổi đạt và không đạt
  - Thiết lập New Code và đối chiếu với các dòng đã sửa trong Git
  - Rà soát một cảnh báo nhầm và một Security Hotspot có bằng chứng
  - Phân tích dự án nhiều mô-đun có báo cáo kiểm thử tổng hợp
  - Tích hợp CI và chứng minh gate thất bại thực sự chặn bước tiếp theo
  - Thử phân tích pull request trên môi trường có tính năng tương ứng
  - Nhập báo cáo bên ngoài và kiểm tra chủ sở hữu quy tắc
  - Đọc kết quả bằng API hoặc xác minh webhook trên hệ thống thực hành
  - Thực hiện sao lưu–khôi phục và phân tích lại một dự án mẫu
- level1: Đánh giá cấu hình
  level2:
  - Xác minh đúng sản phẩm, phiên bản và các tính năng được sử dụng
  - Kiểm tra phạm vi nguồn, kiểm thử, bytecode và báo cáo đầu vào
  - Đối chiếu profile, gate và định nghĩa mã mới đang có hiệu lực
  - Kiểm tra commit được quét khớp với commit được quyết định merge hoặc phát hành
  - Đánh giá quyền, token và khả năng lộ dữ liệu qua pipeline
  - Phân biệt cải thiện mã với thay đổi làm đẹp kết quả đo
  - Kiểm tra khả năng xử lý lỗi hạ tầng và theo dõi tác vụ nền
  - Đánh giá vận hành, khôi phục và chi phí duy trì chính sách
  - Tự đánh giá bằng lần chạy tái hiện được và bằng chứng trước–sau
