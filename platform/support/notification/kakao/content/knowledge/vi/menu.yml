- level1: Chọn sản phẩm
  level2:
  - Chọn kênh theo người gửi, người nhận và mục đích
  - Talk Message cho tương tác giữa người dùng cùng dịch vụ
  - Người dùng chủ động chọn bạn bè và thực hiện thao tác gửi
  - Talk Share để người dùng chia sẻ qua giao diện KakaoTalk
  - Alimtalk cho thông báo thông tin theo điều kiện sử dụng
  - Brand Message cho nội dung quảng cáo với đối tượng hợp lệ
  - Channel Message và công cụ quản trị chiến dịch
  - FriendTalk trong hệ thống cũ và kiểm tra lộ trình chuyển đổi
