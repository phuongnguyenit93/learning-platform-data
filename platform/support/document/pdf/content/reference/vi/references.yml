references:
  - title: "Apache PDFBox — Java PDF Library"
    url: "https://pdfbox.apache.org/"
    description: "Tổng quan tạo, đọc, chỉnh sửa, tách/ghép, biểu mẫu và bảo mật PDF với Java."
  - title: "Apache PDFBox 3.0 — Getting Started"
    url: "https://pdfbox.apache.org/3.0/getting-started.html"
    description: "Cấu hình dependency và bắt đầu sử dụng PDFBox trong dự án Java."
  - title: "Apache PDFBox 3.0 — Command-Line Tools"
    url: "https://pdfbox.apache.org/3.0/commandline.html"
    description: "Thao tác trích xuất text, ghép/tách và render trang để kiểm thử đầu ra."
  - title: "Apache PDFBox 3.0 — FAQ"
    url: "https://pdfbox.apache.org/3.0/faq.html"
    description: "Lưu ý về xử lý trang, font, hiệu năng, đóng tài nguyên và bộ nhớ."
  - title: "Apache PDFBox 3.0 — Migration Guide"
    url: "https://pdfbox.apache.org/3.0/migration.html"
    description: "Những thay đổi API PDFBox 3, bao gồm cách load tài liệu và thao tác I/O."
  - title: "Apache FOP — Documentation"
    url: "https://xmlgraphics.apache.org/fop/"
    description: "Công cụ Java chuyển tài liệu XSL-FO sang PDF với bố cục nhiều trang."
  - title: "Apache FOP — Quick Start Guide"
    url: "https://xmlgraphics.apache.org/fop/quickstartguide.html"
    description: "Ví dụ tạo PDF từ XML và XSL-FO, phù hợp báo cáo định dạng cố định."
  - title: "Apache PDFBox 3.0.8 — PDFTextStripper API"
    url: "https://javadoc.io/static/org.apache.pdfbox/pdfbox/3.0.8/org/apache/pdfbox/text/PDFTextStripper.html"
    description: "API trích xuất văn bản và các giới hạn về thứ tự text của tài liệu PDF."
  - title: "Apache PDFBox Examples — AcroForm"
    url: "https://javadoc.io/static/org.apache.pdfbox/pdfbox-examples/3.0.7/org/apache/pdfbox/examples/interactive/form/package-summary.html"
    description: "Các ví dụ tạo, đọc và điền trường biểu mẫu AcroForm trong PDF."
  - title: "Apache FOP — PDF/A (ISO 19005)"
    url: "https://xmlgraphics.apache.org/fop/trunk/pdfa.html"
    description: "Khái niệm PDF/A và các giới hạn cần lưu ý khi xuất bản lưu trữ dài hạn."