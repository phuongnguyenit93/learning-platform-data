references:
  - title: "MDN — Introduction to Events"
    url: "https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/Events"
    description: "Kiến thức cơ bản về event, event handler, đăng ký/hủy listener và phản ứng sự kiện trong trình duyệt."
  - title: "Node.js — Events API"
    url: "https://nodejs.org/api/events.html"
    description: "EventEmitter, emit/on/once/off và sự khác biệt giữa listener đồng bộ mặc định với xử lý bất đồng bộ."
  - title: "Spring Framework — ApplicationContext Events"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/context-introduction.html"
    description: "ApplicationEventPublisher, ApplicationListener, @EventListener và xử lý sự kiện nội bộ của Spring."
  - title: "Microsoft — Event-Driven Architecture Style"
    url: "https://learn.microsoft.com/en-us/azure/architecture/guide/architecture-styles/event-driven"
    description: "Mô hình producer, channel, consumer; pub/sub, streaming, mức ghép nối, nhất quán và xử lý lỗi."
  - title: "Microsoft — Publisher-Subscriber Pattern"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/publisher-subscriber"
    description: "Tách publisher/consumer, schema evolution, correlation ID, idempotency và backpressure."
  - title: "Microsoft — Competing Consumers Pattern"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/competing-consumers"
    description: "So sánh hàng đợi và pub/sub, phân phối công việc tới nhiều consumer và cân bằng tải."
  - title: "Google Cloud — Event-Driven Architecture with Pub/Sub"
    url: "https://docs.cloud.google.com/solutions/event-driven-architecture-pubsub"
    description: "Topic, subscription, routing, fan-out và lựa chọn trao đổi sự kiện bất đồng bộ."
  - title: "CloudEvents — Event Format Specification"
    url: "https://github.com/cloudevents/spec/blob/main/cloudevents/spec.md"
    description: "Các thuộc tính cơ bản như id, source, type, time và định dạng tương tác sự kiện giữa hệ thống."
  - title: "AWS — Communication Patterns"
    url: "https://docs.aws.amazon.com/prescriptive-guidance/latest/modernization-integrating-microservices/communication-patterns.html"
    description: "Phân biệt giao tiếp synchronous request-response với asynchronous message-based trong hệ phân tán."