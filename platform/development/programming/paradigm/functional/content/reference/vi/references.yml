references:
  - title: "Scala 3 Book - Functional Programming"
    url: "https://docs.scala-lang.org/scala3/book/fp-intro.html"
    description: "Giới thiệu functional programming, immutable values, pure functions, first-class functions và xử lý lỗi."
  - title: "Scala 3 Book - Pure Functions"
    url: "https://docs.scala-lang.org/scala3/book/fp-pure-functions.html"
    description: "Hàm thuần, deterministic output, side effects và cơ sở cho referential transparency."
  - title: "Scala 3 Book - Immutable Values"
    url: "https://docs.scala-lang.org/scala3/book/fp-immutable-values.html"
    description: "Giá trị bất biến, immutable collections và cập nhật dữ liệu bằng tạo bản sao."
  - title: "Scala 3 Book - Functions Are Values"
    url: "https://docs.scala-lang.org/scala3/book/fp-functions-are-values.html"
    description: "Hàm như giá trị, lambda và truyền function vào các phép toán collection."
  - title: "Scala Tour - Higher-order Functions"
    url: "https://docs.scala-lang.org/tour/higher-order-functions.html"
    description: "Higher-order function nhận hoặc trả về function; ví dụ map và lambda."
  - title: "Scala 3 Book - Functional Error Handling"
    url: "https://docs.scala-lang.org/scala3/book/fp-functional-error-handling.html"
    description: "Option, Some và None để xử lý dữ liệu không có kết quả."
  - title: "Scala 3 Book - Algebraic Data Types"
    url: "https://docs.scala-lang.org/scala3/book/types-adts-gadts.html"
    description: "ADT bằng enum, dữ liệu dạng sum type và pattern matching."
  - title: "Java SE 25 - FunctionalInterface"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/FunctionalInterface.html"
    description: "Đặc điểm functional interface, lambda và method reference trong Java."
  - title: "Java SE 25 - Function Interface"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/function/Function.html"
    description: "Function<T,R> và cách ghép hàm với compose hoặc andThen."
  - title: "Java SE 25 - Stream API"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/stream/Stream.html"
    description: "map, filter, reduce và các ràng buộc accumulator trong stream."
  - title: "Java SE 25 - Stream Package"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/stream/package-summary.html"
    description: "Functional pipelines, lazy intermediate và terminal operations."
  - title: "Java SE 25 - Optional"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Optional.html"
    description: "Biểu diễn kết quả có thể thiếu, map/flatMap và xử lý trường hợp empty."