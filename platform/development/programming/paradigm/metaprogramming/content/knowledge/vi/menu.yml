  - Tổ chức thư mục nguồn sinh và cấu hình source set
  - Khai báo processor bằng annotationProcessor trong Gradle
  - Phân biệt compileClasspath, runtimeClasspath và processor path
  - Mô tả đầu vào, đầu ra và quan hệ phụ thuộc giữa tác vụ
  - Sinh mã tăng dần và xử lý tệp đầu vào bị xóa
  - Bộ nhớ đệm build và yêu cầu đầu ra xác định
  - Quản lý tài nguyên phụ trợ và đường dẫn giữa các môi trường
  - IDE, tác vụ dòng lệnh và CI cần dùng cùng cấu hình
  - Quyết định có lưu mã sinh trong kho mã hay không
  - Tách thư viện annotation, bộ xử lý và mã ứng dụng
- level1: Kiểm thử
  level2:
  - Các tầng kiểm thử của một giải pháp metaprogramming
  - Kiểm thử mô hình đầu vào và từng phép biến đổi
  - So sánh mã sinh bằng snapshot và giới hạn của kiểm thử văn bản
  - Chuẩn hóa định dạng trước khi so sánh cấu trúc
  - Biên dịch mã được sinh như một cổng kiểm tra bắt buộc
  - Kiểm tra chẩn đoán cho đầu vào sai và trường hợp biên
  - Kiểm thử hành vi của chương trình được tạo
  - Đối chiếu hành vi giữa bản gốc và bản biến đổi
  - Kiểm thử thuộc tính và sinh đầu vào tự động
  - Kiểm thử nhiều processor, nhiều vòng và nhiều tệp nguồn
  - Kiểm tra xóa, đổi tên đầu vào và tính đúng của build tăng dần
  - Kiểm thử proxy, ClassLoader và agent trong môi trường tách biệt
- level1: Gỡ lỗi và quan sát
  level2:
  - Tìm lỗi thuộc giai đoạn sinh mã hay giai đoạn thực thi
  - Lưu và đọc mã nguồn, AST hoặc bytecode được tạo
  - Theo dõi quá trình mở rộng macro và các bước biến đổi
  - Ánh xạ stack trace về mã nguồn và mô tả gốc
  - Đặt breakpoint và giữ thông tin gỡ lỗi trong mã sinh
  - Chẩn đoán lỗi tìm lớp, nạp lớp và xung đột bộ nạp
  - Chẩn đoán lỗi truy cập và phản chiếu trong hệ module
  - Phân tích lỗi xác minh bytecode và lỗi liên kết
  - Ghi nhận thời gian sinh, biên dịch, nạp và gọi mã
  - Thu gọn ví dụ gây lỗi để tái hiện độc lập
- level1: Bảo mật
  level2:
  - Ranh giới tin cậy giữa mô tả đầu vào và mã thực thi
  - Chèn mã qua khuôn mẫu, chuỗi và biểu thức động
  - Kiểm tra cấu trúc và giới hạn ngữ pháp đầu vào
  - Danh sách cho phép đối với kiểu, thành viên và thao tác
  - Không coi ClassLoader là cơ chế cô lập bảo mật đầy đủ
  - Rủi ro mở quyền truy cập bằng reflection hoặc cấu hình module
  - Quyền thực thi của annotation processor và công cụ sinh mã
  - Nguồn gốc thư viện, plugin và chuỗi cung ứng build
  - Giới hạn tài nguyên để tránh mở rộng hoặc biên dịch quá mức
  - Cô lập tiến trình khi cần thực thi mã không đáng tin cậy
  - Bảo vệ bí mật trong mã sinh, log và thông báo lỗi
- level1: Hiệu năng
  level2:
  - Tách chi phí sinh mã, biên dịch, nạp lớp và gọi mã
  - Chi phí khởi động so với chi phí thực thi ổn định
  - Bộ nhớ đệm siêu dữ liệu, handle và lớp được tạo
  - Khóa bộ nhớ đệm theo cấu hình, kiểu và bộ nạp lớp
  - Lời gọi trực tiếp, reflection, MethodHandle và proxy trong phép đo
  - Khởi động JIT, khả năng nội tuyến và dạng lời gọi
  - Thiết kế phép đo JMH tránh kết luận từ một vòng lặp đơn giản
  - Bùng nổ số lớp, kích thước mã và sử dụng metaspace
  - Tham chiếu yếu, vòng đời bộ nhớ đệm và khả năng thu hồi lớp
  - An toàn luồng khi sinh mã và khởi tạo bộ nhớ đệm
  - Đánh đổi tốc độ chạy với thời gian build và độ phức tạp bảo trì
- level1: Tương thích
  level2:
  - Phân biệt tương thích nguồn, nhị phân và hành vi
  - Phiên bản Java nguồn, bytecode đích và thư viện cần có
  - Module path, classpath và đóng gói API nội bộ
  - Giới hạn khi phụ thuộc API trình biên dịch không chuẩn
  - Nâng cấp thư viện thao tác bytecode theo định dạng lớp
  - Thay đổi schema, annotation và hợp đồng mã sinh
  - Chạy trên JDK đầy đủ, runtime image và môi trường hạn chế
  - Reflection, proxy và sinh mã trong ứng dụng native image
  - Các giới hạn cần kiểm tra khi kết hợp nhiều agent hoặc framework
  - Lập ma trận phiên bản và kế hoạch di chuyển có kiểm chứng
- level1: Lỗi thường gặp
  level2:
  - Dùng metaprogramming cho vấn đề giải quyết được bằng thiết kế thông thường
  - Tạo quá nhiều lớp gián tiếp làm khó đọc luồng xử lý
  - Biến đổi mã bằng biểu thức chính quy khi cần hiểu cú pháp
  - Macro làm đổi phạm vi tên hoặc đánh giá biểu thức nhiều lần
  - Giả định annotation tự tạo hành vi mà không cần bộ xử lý
  - Nhầm annotation processor chuẩn với công cụ sửa AST nội bộ
  - Dựa vào thứ tự thành viên mà API không cam kết
  - Nuốt ngoại lệ phản chiếu và làm mất nguyên nhân gốc
  - Giữ tham chiếu lớp động quá lâu gây rò rỉ bộ nạp
  - Sinh tệp trùng, giữ tệp cũ và tạo phụ thuộc build vòng
  - Sửa tay mã sinh rồi đánh mất thay đổi ở lần tạo tiếp theo
  - Đánh giá hiệu năng hoặc bảo mật từ giả định chưa kiểm chứng
- level1: Dự án thực hành
  level2:
  - Khảo sát một đối tượng và xuất mô tả cấu trúc bằng reflection
  - Xây bộ kiểm tra dữ liệu dựa trên annotation có giới hạn rõ ràng
  - Tạo proxy đo thời gian với hợp đồng ngoại lệ và định danh được kiểm thử
  - Viết annotation processor sinh bộ dựng đối tượng
  - Phát triển bộ ánh xạ đơn giản và kiểm tra lỗi ngay khi biên dịch
  - Sinh mã từ schema và kiểm tra build tăng dần khi schema thay đổi
  - Thiết kế DSL biểu thức nhỏ với bộ phân tích và thông báo lỗi
  - Biên dịch mã Java trong bộ nhớ và gọi qua interface ổn định
  - Tạo lớp động bằng thư viện bytecode và kiểm tra mã đầu ra
  - Viết Java Agent quan sát lời gọi trong một ứng dụng thử nghiệm
  - So sánh các cơ chế trên cùng một bài toán bằng kiểm thử và phép đo
  - Hoàn thiện dự án với mô tả giới hạn, mô hình tin cậy và hướng bảo trì
- level1: Lựa chọn giải pháp
  level2:
  - Xuất phát từ bài toán và phần lặp thực sự cần loại bỏ
  - So sánh cấu hình, tổ hợp đối tượng, hàm và sinh mã
  - Chọn annotation processing, reflection, proxy hoặc bytecode trong Java
  - Chọn macro, DSL hoặc thư viện API theo nhu cầu biểu đạt
  - Đặt tiêu chí về kiểm tra sớm, hiệu năng và hỗ trợ công cụ
  - Đánh giá chi phí sử dụng, gỡ lỗi và đào tạo người bảo trì
  - Kiểm chứng giả thuyết bằng nguyên mẫu nhỏ có thể loại bỏ
  - Ghi lại quyết định, giới hạn và điều kiện xem xét lại
  - Duy trì lộ trình quay về giải pháp đơn giản hơn khi yêu cầu thay đổi
