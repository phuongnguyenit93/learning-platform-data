  - Kiến thức nền và lộ trình tiếp cận các cơ chế
- level1: Cơ chế và phân loại
  level2:
  - Sinh chương trình (generative programming) và phản chiếu (reflection)
  - Tự quan sát cấu trúc (introspection) và can thiệp hành vi
  - Metaprogramming tĩnh và metaprogramming động
  - Thao tác ở thời điểm biên dịch, nạp lớp và thực thi
  - Biến đổi mã nguồn, cây cú pháp và mã trung gian
  - Cơ chế do ngôn ngữ cung cấp và cơ chế do thư viện cung cấp
  - Thay đổi cấu trúc và thay đổi hành vi của chương trình
  - Mã được tạo trước và mã được tạo theo yêu cầu
  - Những trục phân loại có thể kết hợp trong cùng giải pháp
- level1: Biểu diễn chương trình
  level2:
  - Mã nguồn dưới dạng văn bản và giới hạn của xử lý chuỗi
  - Token và phân tích từ vựng
  - Cây cú pháp cụ thể (CST) và cây cú pháp trừu tượng (AST)
  - Duyệt cây bằng Visitor và biến đổi các nút
  - Bảng ký hiệu, phạm vi tên và liên kết định danh
  - Thông tin kiểu và phân tích ngữ nghĩa
  - Biểu diễn trung gian (IR), bytecode và mã máy
  - Biểu diễn dữ liệu giống mã (homoiconicity) và ý nghĩa đối với macro
  - Giữ chú thích, định dạng và vị trí nguồn khi biến đổi
  - Lựa chọn mức biểu diễn phù hợp với yêu cầu
- level1: Ngữ nghĩa và thời điểm
  level2:
  - Các giai đoạn phân tích, biên dịch, liên kết, nạp và chạy
  - Thời điểm ràng buộc (binding time) và dữ liệu sẵn có
  - Biến đổi cú pháp hợp lệ và bảo toàn ý nghĩa chương trình
  - Phạm vi từ vựng, che khuất tên và phân giải tên
  - Ràng buộc tên ngoài ý muốn (variable capture)
  - Thứ tự đánh giá và nguy cơ thực thi biểu thức nhiều lần
  - Tác dụng phụ, ngoại lệ và luồng điều khiển sau biến đổi
  - Quy tắc kiểu của mã đầu vào và mã được tạo
  - Ranh giới giữa giai đoạn sinh mã và giai đoạn chạy mã
  - Đánh đổi giữa kiểm tra sớm và tính linh hoạt khi chạy
- level1: Siêu dữ liệu và phản chiếu
  level2:
  - Siêu dữ liệu (metadata) mô tả chương trình như thế nào?
  - Siêu dữ liệu khai báo, siêu dữ liệu suy ra và cấu hình bên ngoài
  - Truy vấn kiểu, thành viên và quan hệ kế thừa
  - Từ mô tả thành viên đến truy cập và gọi động
  - Cơ chế phản chiếu và quyền truy cập
  - Giao thức siêu đối tượng (metaobject protocol)
  - Tạo bộ diễn giải hành vi dựa trên siêu dữ liệu
  - Bộ nhớ đệm và vòng đời thông tin phản chiếu
  - Giới hạn của việc suy luận ý định từ cấu trúc mã
- level1: Sinh mã nguồn
  level2:
  - Quy trình mô tả đầu vào → mô hình → bộ sinh → mã đầu ra
  - Sinh mã bằng nối chuỗi, khuôn mẫu và AST
  - Thiết kế mô hình đầu vào thay vì phụ thuộc trực tiếp vào văn bản
  - Tham số hóa khuôn mẫu và tái sử dụng các thành phần
  - Xử lý tên, từ khóa, kiểu, import và ký tự cần thoát
  - Sinh nhiều tệp và quản lý quan hệ phụ thuộc
  - Tạo mã xác định, lặp lại được và không sinh bản trùng
  - Phân tách mã được sinh với mã do người viết quản lý
  - Ánh xạ lỗi của mã được tạo về mô tả đầu vào
  - Kiểm tra cú pháp, biên dịch và hành vi của mã đầu ra
  - Sinh lại toàn bộ và sinh tăng dần theo thay đổi
- level1: Macro
  level2:
  - Macro là gì và khác hàm ở khả năng nào?
  - Macro thay thế văn bản và macro thao tác trên cú pháp
  - Định nghĩa, gọi và mở rộng macro
  - Trích dẫn mã (quote), giải trích dẫn (unquote) và chèn cấu trúc
  - Macro bảo toàn phạm vi tên (hygienic macro)
  - Tạo tên mới và tránh va chạm định danh
  - Mở rộng lồng nhau, đệ quy và giới hạn độ sâu
  - Ngữ cảnh cú pháp và kiểm tra kiểu sau mở rộng
  - Tránh đánh giá lặp và thay đổi tác dụng phụ
  - Đọc mã sau mở rộng để giải thích hành vi
  - Khi nào macro giúp tạo cú pháp mới và khi nào làm mã khó hiểu
- level1: Lập trình nhiều giai đoạn
  level2:
  - Lập trình nhiều giai đoạn (staged programming) là gì?
  - Tạo giá trị biểu diễn mã và thực thi mã ở giai đoạn sau
  - Trích dẫn có kiểu và chèn mã trong mô hình nhiều giai đoạn
  - Truyền giá trị giữa các giai đoạn và giới hạn phạm vi
  - Chuyên biệt hóa chương trình theo dữ liệu đã biết
  - Đánh giá một phần (partial evaluation)
  - Khác biệt giữa đánh giá một phần, tối ưu hóa và JIT
  - Kiểm soát tác dụng phụ khi chuẩn bị và chạy mã
  - Lựa chọn giai đoạn để cân bằng chi phí tạo mã và thực thi
- level1: Ngôn ngữ chuyên biệt
  level2:
  - Ngôn ngữ chuyên biệt (DSL) và ranh giới miền bài toán
  - DSL nội bộ và DSL bên ngoài
  - Thiết kế từ vựng, cú pháp và ngữ nghĩa của DSL
  - DSL nội bộ bằng API thông thường và phương thức nối tiếp
  - Phân tích DSL bên ngoài thành AST hoặc mô hình trung gian
  - Kiểm tra kiểu, tham chiếu và ràng buộc nghiệp vụ
  - Thông dịch DSL và biên dịch DSL thành mã
  - Báo lỗi kèm vị trí trong mô tả gốc
  - Mở rộng DSL, quản lý phiên bản và tương thích
  - Khi nào chỉ cần dữ liệu cấu hình thay vì một ngôn ngữ mới
- level1: Lập trình ở mức kiểu
  level2:
  - Dùng hệ kiểu để biểu diễn và kiểm tra tính toán
  - Lập trình tổng quát và giới hạn của việc xem generics là metaprogramming
  - Khởi tạo mẫu ở thời điểm biên dịch trong C++
  - Chuyên biệt hóa mẫu và lựa chọn cách triển khai
  - Tính toán hằng ở thời điểm biên dịch và quan hệ với sinh mã
  - Ràng buộc kiểu và thông báo lỗi cho người sử dụng
  - Kiểu điều kiện và kiểu ánh xạ trong TypeScript
  - Vai trò của kiểu phụ thuộc và họ kiểu trong mô hình nâng cao
  - Giới hạn biểu đạt, độ phức tạp và chi phí biên dịch
- level1: Annotations Java
  level2:
  - Annotation trong Java mô tả điều gì và không tự làm điều gì?
  - Khai báo annotation type và sử dụng trên phần tử chương trình
  - Kiểu dữ liệu hợp lệ của phần tử annotation và giá trị mặc định
  - Chính sách giữ lại SOURCE, CLASS và RUNTIME
  - Giới hạn vị trí với @Target và annotation trên kiểu
  - Annotation lặp lại với @Repeatable
  - Phạm vi kế thừa của @Inherited
  - Vai trò của @Documented và các meta-annotation
  - Đọc annotation trực tiếp, gián tiếp và hiện diện theo API
  - Annotation so với naming convention, XML và cấu hình ngoài
  - Thiết kế hợp đồng annotation dễ hiểu và dễ mở rộng
  - Lựa chọn bộ xử lý khi biên dịch hoặc bộ đọc khi chạy
- level1: Reflection Java
  level2:
  - Class, thành viên phản chiếu và cách lấy đối tượng Class
  - Phân biệt getMethods/getFields với getDeclaredMethods/getDeclaredFields
  - Khảo sát lớp cha, interface và thành viên kế thừa
  - Đọc annotation trên lớp, thành viên, tham số và kiểu
  - Tạo đối tượng qua Constructor
  - Đọc và ghi trường qua Field
  - Tìm và gọi phương thức qua Method
  - Tham số, kiểu trả về, varargs và chuyển đổi giá trị khi gọi
  - Phản chiếu kiểu tổng quát với Type và các dạng liên quan
  - Type erasure và giới hạn khôi phục thông tin kiểu
  - Đọc record components, enum và thành viên do trình biên dịch tạo
  - Quyền truy cập, trySetAccessible và ranh giới module
  - Xử lý InvocationTargetException và ngoại lệ truy cập
  - Tên tham số, tùy chọn -parameters và giới hạn siêu dữ liệu
- level1: MethodHandle và VarHandle
  level2:
  - Mục đích của MethodHandle, MethodType và Lookup
  - Tra cứu phương thức tĩnh, phương thức đối tượng và constructor
  - Quyền tra cứu với Lookup và privateLookupIn
  - Phân biệt invokeExact với invoke
  - Điều chỉnh chữ ký bằng asType và bindTo
  - Kết hợp MethodHandle để tạo chuỗi xử lý động
  - CallSite, invokedynamic và cơ chế liên kết động
  - Vai trò của VarHandle trong truy cập biến
  - Các chế độ truy cập, thao tác nguyên tử và trật tự bộ nhớ
  - Khi nào chọn reflection, MethodHandle hoặc lời gọi trực tiếp
- level1: Proxy động
  level2:
  - Proxy là gì và thay đổi đường đi lời gọi như thế nào?
  - Tạo JDK dynamic proxy từ các interface
  - Hợp đồng InvocationHandler và phương thức invoke
  - Xử lý đối số, kết quả trả về và ngoại lệ
  - Xử lý equals, hashCode và toString
  - Gọi phương thức mặc định của interface qua InvocationHandler.invokeDefault
  - Ủy quyền đến đối tượng đích và quản lý trạng thái
  - Chặn lời gọi để đo thời gian, ghi log và kiểm tra quyền
  - Proxy theo interface và proxy sinh lớp con
  - Quan hệ giữa proxy, Decorator và lập trình hướng khía cạnh
  - Giới hạn tự gọi nội bộ, định danh đối tượng và kiểu cụ thể
- level1: Annotation Processing
  level2:
  - Mô hình xử lý annotation tại thời điểm biên dịch
  - Processor, AbstractProcessor và ProcessingEnvironment
  - Khai báo annotation được hỗ trợ, tùy chọn và phiên bản nguồn
  - Các vòng xử lý và RoundEnvironment
  - Cây phần tử với Element, TypeElement và ExecutableElement
  - Biểu diễn kiểu với TypeMirror, Types và Elements
  - Kiểm tra ràng buộc và phát chẩn đoán bằng Messager
  - Tạo tệp nguồn, tệp lớp và tài nguyên bằng Filer
  - Quy tắc đặt tên và tránh tạo lại cùng một tệp
  - Điều phối nhiều processor và ý nghĩa kết quả process
  - Đăng ký processor và tách đường dẫn processor khỏi mã ứng dụng
  - Giới hạn của API chuẩn đối với việc sửa cây mã nguồn có sẵn
  - Kiểm thử processor bằng mã đầu vào đúng và sai
  - Vai trò của MapStruct và sự khác biệt với cách Lombok can thiệp trình biên dịch
- level1: Biên dịch động Java
  level2:
  - Mục đích và phạm vi của Java Compiler API
  - Lấy trình biên dịch qua ToolProvider.getSystemJavaCompiler
  - JavaCompiler, CompilationTask và các tùy chọn biên dịch
  - Cấp mã nguồn bằng JavaFileObject
  - Quản lý tệp và đầu ra trong bộ nhớ bằng JavaFileManager
  - Thu thập lỗi, cảnh báo và vị trí nguồn qua DiagnosticCollector
  - Thiết lập classpath, module path và phiên bản đích
  - Nạp lớp được biên dịch và gọi qua một hợp đồng ổn định
  - Đánh giá biểu thức và thử nghiệm tương tác bằng JShell
  - Quản lý tài nguyên, bộ nhớ đệm và vòng đời mã sinh khi chạy
  - Giới hạn của biên dịch động khi chỉ có môi trường chạy tối giản
- level1: Biến đổi bytecode
  level2:
