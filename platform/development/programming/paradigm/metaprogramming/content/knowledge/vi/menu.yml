  - Lệnh bytecode, ngăn xếp toán hạng và biến cục bộ
  - Bộ kiểm chứng bytecode và stack map frames
  - Sinh lớp mới và biến đổi lớp có sẵn
  - Mô hình Visitor và mô hình cây của ASM
  - Mô tả hành vi và ủy quyền bằng Byte Buddy
  - Thao tác bytecode với Javassist và khác biệt về mức trừu tượng
  - Chèn mã trước, sau và quanh thân phương thức
  - Giữ annotation, thông tin gỡ lỗi và ánh xạ dòng
  - Kiểm tra bytecode bằng javap và công cụ phân tích
  - Lựa chọn sinh mã nguồn hoặc sinh bytecode trực tiếp
- level1: Class Loader và Agent
  level2:
  - 'Vòng đời lớp: nạp, liên kết và khởi tạo'
  - Ủy quyền nạp lớp và lựa chọn ClassLoader
  - Định danh lớp gắn với tên nhị phân và bộ nạp
  - Phân tách mã ứng dụng, thư viện và mã được sinh
