  - Giới hạn thay đổi cấu trúc lớp đã được nạp
  - Xử lý nhiều bộ biến đổi và tránh biến đổi lặp
  - Quản lý agent, quyền gắn động và ảnh hưởng đến môi trường chạy
- level1: Đối chiếu ngôn ngữ
