references:
  - title: "Inside Java — Data-Oriented Programming in Java v1.1"
    url: "https://inside.java/2024/05/23/dop-v1-1-introduction/"
    description: "Giới thiệu bốn nguyên tắc DOP trong Java: dữ liệu minh bạch, immutable, trạng thái hợp lệ và tách operations."
  - title: "Inside Java — Model Data Immutably and Transparently"
    url: "https://inside.java/2024/05/27/dop-v1-1-immutable-transparent-data/"
    description: "Cách dùng Java records, hiểu tính bất biến và API minh bạch khi mô hình hóa dữ liệu."
  - title: "Inside Java — Model the Whole Data"
    url: "https://inside.java/2024/05/29/dop-v1-1-model-data/"
    description: "Mô hình hóa đầy đủ dữ liệu bằng records và sealed types để biểu diễn các biến thể."
  - title: "Inside Java — Make Illegal States Unrepresentable"
    url: "https://inside.java/2024/06/03/dop-v1-1-illegal-states/"
    description: "Dùng kiểu dữ liệu, invariant và validation tại boundary để ngăn trạng thái không hợp lệ."
  - title: "Inside Java — Separate Operations From Data"
    url: "https://inside.java/2024/06/05/dop-v1-1-separate-operations/"
    description: "Tổ chức domain operations ở lớp riêng, xử lý sealed types bằng pattern matching và switch."
  - title: "Inside Java — When to Use Data-Oriented Programming"
    url: "https://inside.java/2024/06/10/dop-v1-1-wrap-up/"
    description: "So sánh DOP với OOP và FP, xác định bối cảnh sử dụng và phiên bản Java phù hợp."
  - title: "Oracle Java 21 — Java Language Changes"
    url: "https://docs.oracle.com/en/java/javase/21/language/java-language-changes-release.html"
    description: "Tình trạng chính thức của records, sealed classes, record patterns và pattern matching for switch."
  - title: "Oracle Java 21 — Pattern Matching for switch"
    url: "https://docs.oracle.com/en/java/javase/21/language/pattern-matching-switch.html"
    description: "Cú pháp pattern switch, type coverage, tính exhaustive và xử lý null trong Java 21."