menu:
- level1: Tổng quan
  level2:
  - Lập trình phản ứng là gì và bài toán thay đổi theo thời gian
  - Từ cập nhật thủ công đến lan truyền thay đổi qua quan hệ phụ thuộc
  - Luồng dữ liệu, sự kiện, tín hiệu và các thuật ngữ nền tảng
  - 'Một ví dụ xuyên suốt: tìm kiếm gợi ý khi người dùng nhập'
  - Phân biệt lập trình phản ứng, hệ thống phản ứng và Reactive Streams
  - Mối liên hệ với lập trình hàm, hướng đối tượng và hướng sự kiện
  - Lợi ích, chi phí và những trường hợp không phù hợp
  - Phạm vi kiến thức và thứ tự học từ mô hình đến ứng dụng
- level1: Bất đồng bộ
  level2:
  - Đồng bộ và bất đồng bộ trong vòng đời một tác vụ
  - 'Chặn và không chặn: phân biệt với đồng bộ và bất đồng bộ'
  - 'Đồng thời và song song: vai trò của luồng thực thi'
  - Vòng lặp sự kiện và mô hình xử lý dựa trên thông báo
  - 'Hàm gọi lại: đảo quyền điều khiển và khó khăn khi phối hợp'
  - 'Future và CompletableFuture: một kết quả so với nhiều phần tử'
  - Cơ chế đẩy, kéo và phối hợp đẩy–kéo trong trao đổi dữ liệu
  - Độ trễ, thông lượng và khả năng đáp ứng dưới tải
  - 'Luồng ảo Java: mối liên hệ với I/O chặn và mô hình phản ứng'
- level1: Mô hình luồng
  level2:
  - Biểu diễn một chuỗi giá trị theo thời gian
  - Phần tử dữ liệu và tín hiệu điều khiển trong một luồng
  - Nguồn, toán tử, bên tiêu thụ và đồ thị xử lý
  - Luồng hữu hạn, vô hạn, rỗng và không kết thúc
  - Không có phần tử, phần tử rỗng và giá trị null
  - Đọc sơ đồ marble để mô tả dữ liệu, thời gian và kết thúc
  - Lắp ráp chuỗi xử lý, đăng ký nhận và thực thi
  - Tính khai báo, tính lười và thời điểm phát sinh tác dụng phụ
  - Phân biệt luồng phản ứng với Java Stream và bộ sưu tập
- level1: Hợp đồng tín hiệu
  level2:
  - Ý nghĩa và thứ tự của onSubscribe, onNext, onError, onComplete
  - Tín hiệu kết thúc và giới hạn phát dữ liệu sau khi kết thúc
  - Phân biệt hoàn thành bình thường, lỗi và hủy đăng ký
  - Tuần tự hóa tín hiệu và tính an toàn khi có nhiều luồng thực thi
  - Truyền lỗi qua tín hiệu so với ném ngoại lệ trực tiếp
  - Nguồn không tuân thủ hợp đồng và hệ quả cho bên tiêu thụ
  - Hủy đăng ký trong khi dữ liệu hoặc tín hiệu đang được phát
  - Giá trị null và cách biểu diễn dữ liệu thiếu trong Reactive Streams
  - Đọc diễn tiến tín hiệu của các tình huống biên bằng sơ đồ marble
- level1: Reactive Streams
  level2:
  - Mục tiêu và phạm vi của đặc tả Reactive Streams
  - 'Publisher: vai trò phát dữ liệu và tiếp nhận đăng ký'
  - 'Subscriber: tiếp nhận subscription, dữ liệu và tín hiệu kết thúc'
  - 'Subscription: yêu cầu dữ liệu bằng request và hủy bằng cancel'
  - 'Processor: vai trò trung gian vừa nhận vừa phát dữ liệu'
  - Nhu cầu cộng dồn, request không hợp lệ và nhu cầu không giới hạn
  - Quan hệ giữa số phần tử yêu cầu và số phần tử được phát
  - Hợp đồng bộ nhớ, thứ tự tín hiệu và lời gọi lồng nhau
  - Bộ kiểm tra tương thích TCK và giới hạn của việc tự cài đặt
  - Java Flow và cách kết nối với hệ sinh thái Reactive Streams
- level1: Đăng ký nhận
  level2:
  - Đăng ký nhận dữ liệu và quyền sở hữu vòng đời subscription
  - Mỗi đăng ký tạo một lần thực thi hay dùng chung một nguồn
  - Đăng ký bên trong toán tử và nguyên nhân tạo luồng tách rời
  - Trả về chuỗi xử lý so với tự gọi subscribe trong tầng nghiệp vụ
  - Tác dụng phụ tại thời điểm lắp ráp và thời điểm đăng ký
  - Hủy đăng ký theo thời gian chờ, yêu cầu HTTP hoặc vòng đời ứng dụng
  - Nhiều bên đăng ký và việc phát sinh lặp lại tác vụ bên ngoài
  - Quan sát vòng đời bằng các điểm móc trước và sau tín hiệu
  - Theo dõi quan hệ giữa đăng ký, nguồn và các nhánh xử lý
- level1: Nguồn nóng và lạnh
  level2:
  - 'Nguồn lạnh: dữ liệu và tác vụ được tạo theo từng đăng ký'
  - 'Nguồn nóng: dữ liệu tồn tại độc lập với thời điểm đăng ký'
  - Đăng ký muộn và nguy cơ bỏ lỡ phần tử
  - Phát đa hướng và chia sẻ một nguồn cho nhiều bên tiêu thụ
  - Kết nối thủ công, tự kết nối và đếm số bên đăng ký
  - Phát lại dữ liệu, bộ nhớ đệm và giới hạn lưu giữ
  - Tái kết nối sau khi tất cả bên đăng ký rời đi
  - Bên tiêu thụ chậm trong một luồng dùng chung
  - Lựa chọn nguồn nóng hoặc lạnh cho sự kiện, I/O và trạng thái
- level1: Áp lực ngược
  level2:
  - Chênh lệch tốc độ phát và xử lý dẫn đến quá tải
  - Điều tiết nhu cầu từ bên tiêu thụ về nguồn phát
  - Áp lực ngược khác gì giới hạn tốc độ và kiểm soát lưu lượng
  - Yêu cầu theo lô, nạp trước và điều chỉnh kích thước lô
  - Truyền nhu cầu qua từng toán tử trong chuỗi
  - Hàng đợi và ranh giới bất đồng bộ làm thay đổi nhu cầu
  - Đệm có giới hạn và chính sách khi bộ đệm đầy
  - Bỏ phần tử, giữ phần tử mới nhất hoặc kết thúc bằng lỗi
  - Nguồn không thể giảm tốc và giới hạn của áp lực ngược
  - Nhu cầu không giới hạn và nguy cơ tăng bộ nhớ ngoài dự kiến
  - Kiểm tra áp lực ngược bằng bên tiêu thụ chậm có kiểm soát
- level1: Tạo nguồn
  level2:
  - Tạo luồng từ một giá trị, mảng, bộ sưu tập và khoảng số
  - Tạo nguồn rỗng, nguồn lỗi và nguồn không kết thúc
  - Trì hoãn việc tạo nguồn cho đến khi có đăng ký
  - Chuyển Callable, Supplier, Future và CompletionStage thành nguồn
  - Tạo nguồn từ hàm gọi lại và bộ lắng nghe sự kiện
  - Phát từng phần tử theo nhu cầu bằng bộ sinh trạng thái
  - Tiếp nhận dữ liệu từ nhiều nơi qua bộ phát có kiểm soát
  - Xử lý phát đồng thời và kết quả phát không thành công
  - Gỡ bộ lắng nghe và giải phóng tài nguyên khi nguồn bị hủy
  - 'Đọc tệp và nguồn I/O: kiểm tra hành vi chặn của bộ chuyển đổi'
- level1: Biến đổi dữ liệu
  level2:
  - Biến đổi từng phần tử và giữ quan hệ một–một
  - Lọc phần tử theo điều kiện và theo kiểu dữ liệu
  - Loại bỏ phần tử trùng lặp toàn luồng hoặc liền kề
  - Lấy, bỏ qua và giới hạn phần tử theo số lượng hoặc điều kiện
  - Đánh số phần tử và kết hợp dữ liệu với thông tin vị trí
  - Xử lý có điều kiện khi một đầu vào tạo không hoặc một đầu ra
  - Tách phần dữ liệu hợp lệ và biểu diễn lỗi xác thực
  - Phân biệt biến đổi dữ liệu với quan sát tác dụng phụ
  - Đóng gói một chuỗi toán tử thành phép biến đổi tái sử dụng
  - Lựa chọn toán tử theo số đầu ra, trạng thái và tín hiệu kết thúc
- level1: Ghép luồng
  level2:
  - Làm phẳng luồng lồng nhau và ý nghĩa của phép ánh xạ bất đồng bộ
  - 'flatMap: phối hợp các luồng con và cho phép xen kẽ kết quả'
  - 'concatMap: xử lý luồng con tuần tự và bảo toàn thứ tự'
  - 'flatMapSequential: xử lý đồng thời nhưng phát theo thứ tự'
  - 'switchMap: chuyển sang nguồn mới và hủy nguồn trước'
  - 'concat và merge: nối tiếp hoặc trộn nhiều nguồn'
  - 'zip và combineLatest: ghép theo vị trí hoặc giá trị gần nhất'
  - Kết hợp một nguồn chính với dữ liệu từ nguồn phụ
  - Phối hợp tín hiệu hoàn thành khi không cần giữ giá trị
  - Giới hạn đồng thời, nạp trước và ảnh hưởng của nguồn con chậm
  - Nguồn rỗng, nguồn lỗi và nguồn không kết thúc khi ghép
- level1: Thời gian
  level2:
  - Thời gian sự kiện, thời gian xử lý và vai trò của đồng hồ
  - Nguồn phát theo khoảng thời gian và bộ định thời
  - Trì hoãn đăng ký, trì hoãn phần tử và trì hoãn tín hiệu
  - 'debounce: chờ khoảng yên lặng trước khi phát giá trị'
  - 'throttle và sample: lựa chọn giá trị theo nhịp thời gian'
  - 'timeout: giới hạn thời gian chờ và lựa chọn hành vi thay thế'
  - Đo khoảng cách thời gian giữa các phần tử
  - Đua giữa nguồn dữ liệu, bộ định thời và tín hiệu hủy
  - Lựa chọn bộ lập lịch cho toán tử phụ thuộc thời gian
  - Kiểm thử hành vi thời gian bằng đồng hồ ảo
- level1: Gom và chia luồng
  level2:
  - 'reduce: tổng hợp kết quả sau khi nguồn hoàn thành'
  - 'scan: phát trạng thái tích lũy sau từng phần tử'
  - 'collect: gom vào cấu trúc dữ liệu và giới hạn bộ nhớ'
  - Đếm, kiểm tra tồn tại và kiểm tra điều kiện toàn luồng
  - 'buffer: gom phần tử thành lô theo số lượng hoặc thời gian'
  - 'window: chia nguồn thành các luồng con'
  - 'groupBy: phân nhóm theo khóa và quản lý vòng đời nhóm'
  - Cửa sổ chồng lấn, khoảng trống và điều kiện đóng cửa sổ
  - Nguồn vô hạn và các phép tổng hợp không thể kết thúc
  - Nhiều nhóm, nhóm không được tiêu thụ và nguy cơ tắc nghẽn
- level1: Lỗi và phục hồi
  level2:
  - Phân loại lỗi dữ liệu, lỗi nghiệp vụ và lỗi hạ tầng
  - Lỗi kết thúc một chuỗi và phạm vi lỗi của luồng con
  - Chuyển đổi lỗi nhưng giữ nguyên nguyên nhân ban đầu
  - Thay lỗi bằng giá trị mặc định hoặc một nguồn khác
  - Bỏ qua một phần tử lỗi bằng cách đặt phục hồi đúng vị trí
  - Thử lại nguồn và phân biệt retry với repeat
  - Giới hạn số lần thử, thời gian chờ tăng dần và độ lệch ngẫu nhiên
  - Thử lại tác vụ có tác dụng phụ và yêu cầu tính lũy đẳng
  - Thời gian chờ, hủy đăng ký và chính sách phục hồi
  - Xử lý ngay hoặc trì hoãn lỗi khi phối hợp nhiều nguồn
  - Tín hiệu lỗi không thể chuyển tiếp và các cơ chế quan sát toàn cục
  - Giới hạn và rủi ro của onErrorContinue trong Reactor
- level1: Tài nguyên
  level2:
  - Gắn vòng đời tài nguyên với vòng đời của chuỗi xử lý
  - Mở, sử dụng và đóng tài nguyên trên mọi đường kết thúc
  - Dọn dẹp đồng bộ và dọn dẹp bất đồng bộ
  - Xử lý riêng khi hoàn thành, phát lỗi hoặc bị hủy
  - Lỗi trong lúc dọn dẹp và quan hệ với lỗi nghiệp vụ
  - Phần tử bị bỏ, bộ đệm chưa tiêu thụ và tài nguyên cần giải phóng
  - Tránh giữ tham chiếu qua bộ nhớ đệm, nhóm và nguồn dùng chung
  - Tác vụ kéo dài sau khi bên tiêu thụ hủy đăng ký
  - Kiểm tra không rò rỉ tệp, kết nối và bộ lắng nghe
- level1: Luồng thực thi
  level2:
  - Chuỗi xử lý chạy trên luồng nào khi chưa đổi bộ lập lịch
  - Bộ lập lịch và ranh giới thực thi của từng đoạn chuỗi
  - 'subscribeOn: thay đổi nơi thực hiện việc đăng ký nguồn'
  - 'publishOn hoặc observeOn: chuyển nơi xử lý tín hiệu phía sau'
  - Vị trí nhiều điểm chuyển bộ lập lịch và chi phí chuyển ngữ cảnh
  - Công việc thiên về CPU và công việc chờ I/O
  - Cô lập lời gọi chặn vào tài nguyên thực thi có giới hạn
  - Xử lý đồng thời khác với chia dữ liệu để chạy song song
  - Giới hạn luồng, hàng đợi và hành vi khi tài nguyên thực thi đầy
  - Nguy cơ tự chờ, bế tắc và chặn vòng lặp sự kiện
  - Quản lý vòng đời bộ lập lịch do ứng dụng tạo
- level1: Trạng thái
  level2:
  - Hàm thuần, dữ liệu bất biến và khả năng suy luận chuỗi xử lý
  - Trạng thái riêng cho mỗi đăng ký và trạng thái dùng chung
  - Biến khả biến trong lambda và nguy cơ tranh chấp dữ liệu
  - Thứ tự tín hiệu không thay thế an toàn truy cập giữa nhiều luồng
  - Mô hình hóa trạng thái bằng sự kiện và phép tích lũy
  - Lựa chọn phạm vi đồng bộ hóa khi có tài nguyên dùng chung
  - Tính xác định khi kết quả phụ thuộc thứ tự hoặc thời điểm
  - Ảnh chụp trạng thái, phát lại sự kiện và tái tạo kết quả
- level1: Ngữ cảnh
  level2:
  - Ngữ cảnh yêu cầu và dữ liệu đi kèm vòng đời đăng ký
  - Vì sao ThreadLocal không tự đi theo chuỗi bất đồng bộ
  - Reactor Context và chiều truyền ngữ cảnh qua chuỗi
  - Đọc và bổ sung ngữ cảnh tại thời điểm đăng ký
  - Truyền mã theo dõi yêu cầu qua luồng con và ranh giới thực thi
  - Kết nối ngữ cảnh với ghi log, bảo mật và truy vết
  - Tích hợp hệ thống cũ dùng ThreadLocal theo phạm vi kiểm soát
  - Tránh rò rỉ ngữ cảnh giữa các yêu cầu dùng chung luồng
- level1: Project Reactor
  level2:
  - 'Mono và Flux: biểu diễn không–một và không–nhiều phần tử'
  - Tạo, ghép và trả về chuỗi Reactor trong mã Java
  - 'defer và fromCallable: lựa chọn thời điểm tạo giá trị'
  - BaseSubscriber và kiểm soát nhu cầu nhận dữ liệu
  - Sinks.One, Sinks.Many và lựa chọn cơ chế phát
  - ConnectableFlux, share và cache trong quản lý nguồn dùng chung
  - then, thenReturn và xử lý Mono<Void>
  - transform và transformDeferred trong tái sử dụng chuỗi
  - publishOn, subscribeOn và các bộ lập lịch của Reactor
  - Kết nối Reactor với Java Flow, CompletionStage và thư viện khác
- level1: RxJava
  level2:
  - Observable, Flowable, Single, Maybe và Completable
  - 'Observable và Flowable: khác biệt về hỗ trợ áp lực ngược'
  - Disposable và Subscription trong quản lý hủy nhận
  - 'Subject và Processor: phát dữ liệu và chuyển tiếp tín hiệu'
  - Scheduler, subscribeOn và observeOn trong RxJava
  - Lựa chọn toán tử tương đương và khác biệt về ngữ nghĩa
  - Chiến lược áp lực ngược khi chuyển Observable sang Flowable
  - Lỗi không thể giao cho bên nhận và cơ chế RxJavaPlugins
  - Kết nối RxJava với Reactive Streams và Reactor
  - Lựa chọn Reactor hoặc RxJava theo môi trường tích hợp
- level1: Phản ứng hàm
  level2:
  - Lập trình phản ứng hàm (FRP) và quan hệ với lập trình hàm
  - Sự kiện rời rạc và giá trị biến thiên theo thời gian
  - 'Behavior và Signal: cách mô hình hóa giá trị theo thời gian'
  - Đồ thị phụ thuộc và lan truyền thay đổi
  - Đọc đồng thời nhiều giá trị phụ thuộc và lỗi cập nhật trung gian
  - Tính nhất quán khi một thay đổi kéo theo nhiều cập nhật
  - Phụ thuộc động, chuyển nguồn và vòng phản hồi
  - Quan hệ và khác biệt giữa FRP cổ điển với thư viện luồng sự kiện
  - Mô hình hóa giao diện phản ứng mà không đồng nhất FRP với bất đồng bộ
- level1: Tích hợp I/O
  level2:
  - Kiểm tra toàn bộ đường đi I/O có thực sự không chặn
  - HTTP client phản ứng và quản lý tài nguyên kết nối
  - Gọi nhiều dịch vụ độc lập bằng luồng con có giới hạn
  - Chuyển API hàm gọi lại sang nguồn có thể hủy
  - Kết nối hàng đợi thông điệp và kiểm soát tốc độ tiêu thụ
  - Đọc dữ liệu lớn theo từng phần thay vì nạp toàn bộ
  - Cô lập JDBC và thư viện chặn khi chưa thể thay thế
  - Chuyển đổi CompletableFuture mà không chặn để lấy kết quả
  - Hủy chuỗi và khả năng hủy tác vụ I/O ở lớp bên dưới
- level1: Ứng dụng Web
  level2:
  - 'Spring WebFlux: vị trí trong hệ sinh thái lập trình phản ứng'
  - Controller và handler trả về Mono hoặc Flux
  - Vòng lặp sự kiện và vòng đời một yêu cầu HTTP
  - 'WebClient: gửi yêu cầu, đọc phản hồi và xử lý lỗi'
  - Phát dữ liệu bằng Server-Sent Events và WebSocket
  - Tuần tự hóa phản hồi theo luồng và giới hạn đệm
  - Ngắt kết nối từ phía người dùng và hủy chuỗi xử lý
  - Áp lực ngược qua ranh giới HTTP và giới hạn của giao thức
  - Xử lý lỗi, thời gian chờ và ngữ cảnh bảo mật của yêu cầu
  - Lựa chọn WebFlux hoặc mô hình Web chặn theo đặc điểm tải
- level1: Dữ liệu và giao dịch
  level2:
  - Trình điều khiển dữ liệu phản ứng và giới hạn của bộ chuyển đổi
  - 'R2DBC: kết nối, truy vấn và ánh xạ kết quả theo luồng'
  - Quản lý nhóm kết nối và giới hạn số truy vấn đồng thời
  - Ranh giới giao dịch gắn với đăng ký và ngữ cảnh
  - TransactionalOperator và giao dịch phản ứng trong Spring
  - Hoàn tất, lỗi và hủy chuỗi khi đang có giao dịch
  - Phối hợp nhiều thao tác trong cùng một giao dịch
  - Tránh mở nhiều giao dịch ngoài ý muốn do đăng ký lặp lại
  - Phân trang, đọc theo luồng và tính nhất quán dữ liệu
  - Giới hạn giao dịch giữa nhiều nguồn dữ liệu và dịch vụ
- level1: Hệ thống phản ứng
  level2:
  - 'Bốn đặc tính: đáp ứng, chịu lỗi, co giãn và hướng thông điệp'
  - Phân biệt áp dụng thư viện phản ứng với thiết kế cả hệ thống
  - Ranh giới bất đồng bộ giữa các thành phần và dịch vụ
  - Giới hạn tải đầu vào và bảo vệ tài nguyên hữu hạn
  - Cô lập lỗi bằng bulkhead và ngắt mạch bằng circuit breaker
  - Ngân sách thời gian chờ và chuỗi lời gọi nhiều tầng
  - Bão thử lại, giới hạn thử lại và tính lũy đẳng
  - Bảo đảm giao nhận thông điệp, trùng lặp và thứ tự xử lý
  - Hàng đợi có giới hạn, điều tiết lưu lượng và loại tải
  - Dừng ứng dụng có kiểm soát và hoàn tất tác vụ đang chạy
- level1: Kiểm thử
  level2:
  - Phân lớp kiểm thử toán tử, thành phần và tích hợp
  - 'StepVerifier: xác nhận dữ liệu, thứ tự và tín hiệu kết thúc'
  - Kiểm thử nguồn rỗng, nguồn lỗi và nguồn không kết thúc
  - Yêu cầu từng phần dữ liệu để xác minh áp lực ngược
  - Kiểm thử hủy đăng ký và dọn dẹp tài nguyên
  - Thời gian ảo cho delay, debounce, timeout và retry
  - 'TestPublisher: chủ động phát tín hiệu và tình huống vi phạm'
  - 'PublisherProbe: xác minh nhánh dự phòng đã được đăng ký'
  - Kiểm thử nguồn nóng, đăng ký muộn và phát lại dữ liệu
  - Kiểm thử xử lý đồng thời mà không phụ thuộc sleep tùy tiện
  - Phát hiện lời gọi chặn bằng BlockHound trong môi trường phù hợp
  - Kiểm thử HTTP và dữ liệu phản ứng bằng hạ tầng tích hợp
- level1: Chẩn đoán
  level2:
  - Phân biệt nơi lắp ráp chuỗi và nơi lỗi được phát
  - Ghi log tín hiệu và truy theo vòng đời đăng ký
  - checkpoint và thông tin lắp ráp phục vụ tìm lỗi
  - Theo dõi chuỗi không chạy, không kết thúc hoặc bị hủy sớm
  - Quan sát phần tử bị bỏ và lỗi không thể chuyển tiếp
  - Đo độ trễ, thông lượng, lỗi, hủy và số đăng ký đang hoạt động
  - Theo dõi hàng đợi, nhu cầu, kết nối và mức sử dụng bộ lập lịch
  - Truy vết phân tán qua ranh giới bất đồng bộ
  - Kiểm soát chi phí chẩn đoán và bảo vệ dữ liệu khi ghi log
- level1: Hiệu năng
  level2:
  - Lập mô hình tải dựa trên tốc độ đến và khả năng xử lý
  - Giới hạn số luồng con thay vì khởi chạy không kiểm soát
  - Điều chỉnh nạp trước, kích thước lô và bộ đệm
  - Nút thắt ở luồng thực thi, kết nối, CPU và dịch vụ phụ thuộc
  - Chi phí chuyển bộ lập lịch và hàng đợi trung gian
  - Tối ưu chuỗi toán tử và khái niệm hợp nhất toán tử
  - Bộ nhớ giữ bởi cache, replay, collect và groupBy
  - Đo thông lượng và các phân vị độ trễ trong điều kiện tải
  - So sánh mô hình phản ứng, luồng nền tảng và luồng ảo có cùng tải
  - Kiểm chứng tối ưu bằng đo đạc và giới hạn tài nguyên thực tế
- level1: Thiết kế ứng dụng
  level2:
  - Biểu diễn trường hợp sử dụng bằng chuỗi xử lý có ranh giới rõ
  - Giữ logic nghiệp vụ dễ kiểm thử bằng hàm thuần
  - Thiết kế API trả về kiểu phản ứng thay vì tự đăng ký
  - Biểu diễn dữ liệu thiếu và lỗi nghiệp vụ trong hợp đồng API
  - Lựa chọn toán tử theo thứ tự, số lượng, thời gian và nhu cầu
  - Phân tách tác dụng phụ, tài nguyên và điều phối thực thi
  - Thiết kế hủy, thời gian chờ và thử lại ngay từ đầu
  - Chia chuỗi dài thành phép biến đổi có tên và mục đích rõ
  - Ranh giới giữa mã phản ứng và mã chặn trong hệ thống hỗn hợp
  - Chuyển đổi từng phần và tiêu chí đánh giá tính phù hợp
- level1: Lỗi thường gặp
  level2:
  - Quên đăng ký hoặc bỏ qua chuỗi mới do toán tử trả về
  - Gọi subscribe lồng nhau làm tách vòng đời và đường truyền lỗi
  - Gọi block trên vòng lặp sự kiện hoặc trong chuỗi đang chạy
  - Dùng map cho tác vụ trả về Publisher và tạo luồng lồng nhau
  - Dùng flatMap khi nghiệp vụ cần thứ tự nghiêm ngặt
  - Tác dụng phụ lặp lại do nhiều đăng ký, retry hoặc repeat
  - Lưu trạng thái khả biến dùng chung giữa nhiều đăng ký
  - Gom nguồn vô hạn hoặc tạo bộ đệm không có giới hạn
  - Đặt phục hồi lỗi sai vị trí làm kết thúc toàn bộ nguồn
  - Cache hoặc share ngoài ý muốn làm thay đổi vòng đời và dữ liệu
  - Nhầm hoàn thành rỗng, Mono<Void> và giá trị cần để phối hợp
  - Bắt mọi lỗi hoặc tiếp tục sau lỗi khiến mất dữ liệu âm thầm
- level1: Bài thực hành
  level2:
  - Mô phỏng Publisher và Subscriber có yêu cầu dữ liệu theo lô
  - Tìm kiếm gợi ý với debounce, loại trùng và switchMap
  - Tổng hợp nhiều API với giới hạn đồng thời và thời gian chờ
  - Đọc dữ liệu theo lô và xử lý một bên tiêu thụ chậm
  - Xây dựng luồng sự kiện dùng chung có phát lại giới hạn
  - Khôi phục lời gọi dịch vụ bằng retry có giới hạn và nguồn dự phòng
  - Theo dõi trạng thái đơn hàng bằng sự kiện và scan
  - Xây dựng API WebFlux phát dữ liệu qua Server-Sent Events
  - Thực hiện giao dịch dữ liệu phản ứng và kiểm thử đường lỗi
  - Đo tải, phát hiện lời gọi chặn và so sánh các mô hình thực thi
  - Thiết kế hủy tác vụ và xác minh tài nguyên được giải phóng
  - Đọc yêu cầu thực tế và giải thích lựa chọn toán tử, vòng đời, giới hạn tải
