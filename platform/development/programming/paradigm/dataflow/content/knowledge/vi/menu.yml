menu:
- level1: Nhập môn
  level2:
  - Lập trình theo luồng dữ liệu (dataflow programming) là gì?
  - Vì sao mô tả quan hệ phụ thuộc thay vì thứ tự câu lệnh?
  - Nút tính toán, cạnh truyền dữ liệu và đơn vị dữ liệu
  - Từ biểu thức đơn giản đến mạng xử lý dữ liệu
  - Khi nào dữ liệu sẵn sàng kích hoạt một phép tính?
  - Vai trò của bộ thực thi trong việc điều phối đồ thị
  - Các bài toán phù hợp và giới hạn của mô hình
  - Phân biệt dataflow với lưu đồ điều khiển và sơ đồ kiến trúc
  - Lộ trình học từ mô hình tính toán đến chương trình thực tế
- level1: Đồ thị dữ liệu
  level2:
  - Biểu diễn phép tính bằng đồ thị có hướng
  - Nút nguồn, nút biến đổi và nút đầu ra
  - Cổng vào, cổng ra và hợp đồng kết nối
  - Cạnh biểu diễn quan hệ phụ thuộc và kênh truyền
  - Đơn vị dữ liệu (token) và ý nghĩa của một lần kích hoạt
  - Đồ thị không chu trình (DAG) và đồ thị có phản hồi
  - Nhánh tách, nhánh hợp và nút có nhiều đầu vào
  - Đồ thị tĩnh và đồ thị thay đổi khi chạy
  - Đồ thị logic và đồ thị thực thi vật lý
  - Đồ thị con, thành phần tái sử dụng và ranh giới chương trình
  - Phân biệt đồ thị cấp bản ghi với đồ thị cấp tác vụ
- level1: Ngữ nghĩa thực thi
  level2:
  - Điều kiện sẵn sàng và quy tắc kích hoạt nút
  - Tiêu thụ dữ liệu đầu vào và phát dữ liệu đầu ra
  - Một lần kích hoạt và vòng đời của một nút
  - Thứ tự theo quan hệ phụ thuộc và thứ tự thực thi thực tế
  - Truyền dữ liệu chủ động (push) và lấy dữ liệu theo nhu cầu (pull)
  - Thực thi háo hức, trì hoãn và theo nhu cầu
  - Hàm thuần, tác dụng phụ và tính xác định
  - Kích hoạt một lần, nhiều lần và xử lý dữ liệu trùng
  - Thứ tự trong một kênh và thứ tự giữa nhiều kênh
  - Phân biệt chưa có dữ liệu, hết dữ liệu và lỗi
  - Hoàn thành đồ thị hữu hạn và vận hành luồng không kết thúc
  - Ngữ nghĩa dữ liệu, lỗi, hủy và đóng kênh
- level1: Các mô hình dataflow
  level2:
  - Luồng dữ liệu tĩnh và luồng dữ liệu động
  - Mô hình dựa trên tác vụ và mô hình dựa trên token
  - Mạng tiến trình Kahn (KPN)
  - Luồng dữ liệu đồng bộ (SDF) và ý nghĩa của tốc độ cố định
  - Luồng dữ liệu tuần hoàn (CSDF)
  - Mô hình có tốc độ phụ thuộc dữ liệu và nhánh điều kiện
  - Luồng có gắn nhãn để phân biệt các lần tính toán
  - Mô hình lặp, điểm bất động và tính toán gia tăng
  - Các giả thiết khác nhau về kênh, trạng thái và bộ lập lịch
  - Chọn mô hình theo yêu cầu phân tích và thực thi
- level1: Dữ liệu và hợp đồng
  level2:
  - 'Xác định đơn vị xử lý: giá trị, bản ghi, lô nhỏ hay tập dữ liệu'
  - Kiểu dữ liệu trên cổng và khả năng ghép nối các nút
  - Schema, trường bắt buộc và giá trị mặc định
  - Phân biệt giá trị null, dữ liệu thiếu và không có token
  - Quyền sở hữu dữ liệu và sử dụng đối tượng bất biến
  - Sao chép, chia sẻ và tái sử dụng vùng nhớ
  - Gắn khóa, nhãn và thông tin nguồn gốc cho bản ghi
  - Biểu diễn lỗi như tín hiệu riêng hoặc dữ liệu có kiểu
  - Chuyển đổi schema và kiểm tra hợp đồng đầu vào
  - Tuần tự hóa dữ liệu khi đi qua ranh giới tiến trình
- level1: Phép biến đổi
  level2:
  - Ánh xạ giá trị bằng map
  - Lọc dữ liệu bằng filter
  - Mở rộng một đầu vào thành nhiều đầu ra bằng flatMap
  - Chọn trường, đổi tên và chuyển đổi kiểu dữ liệu
  - Tách dữ liệu thành nhiều nhánh theo điều kiện
  - Nhân bản dữ liệu đến nhiều nhánh xử lý
  - Gom nhóm theo khóa và chia dữ liệu thành phân vùng
  - Tích lũy bằng fold, reduce và aggregate
  - Phát kết quả tích lũy trung gian bằng scan
  - Loại trùng và quản lý phạm vi ghi nhớ
  - Sắp xếp, giới hạn và thao tác cần biết điểm kết thúc
  - Tính kết hợp, tính giao hoán và điều kiện thực hiện phép gộp
- level1: Kết hợp luồng
  level2:
  - Hợp luồng và giữ nguyên nguồn gốc dữ liệu
  - Ghép phần tử theo vị trí bằng zip
  - Kết hợp các giá trị mới nhất và hợp đồng phát kết quả
  - Nối theo khóa và điều kiện khớp bản ghi
  - Nối trong, nối ngoài và xử lý bản ghi chưa có đối ứng
  - Chờ đủ đầu vào và xử lý chênh lệch tốc độ
  - Ngữ nghĩa khi một đầu vào kết thúc sớm
  - Phân nhánh rồi tổng hợp kết quả
  - Thứ tự đầu ra và yêu cầu xác định kết quả
  - Giới hạn bộ nhớ khi kết hợp các luồng không giới hạn
- level1: Mạng tiến trình Kahn
  level2:
  - Tiến trình tuần tự và kênh FIFO trong mô hình KPN
  - Đọc chặn và ghi không chặn theo mô hình lý thuyết
  - Kênh không giới hạn và giả thiết về lưu trữ
  - Tính xác định khi các tiến trình đều xác định
  - Quan hệ giữa lịch thực thi và kết quả quan sát được
  - Biểu diễn mạng có phản hồi
  - Phân biệt chờ dữ liệu, bế tắc và không kết thúc
  - Ảnh hưởng của việc thay kênh không giới hạn bằng hàng đợi hữu hạn
  - Giới hạn phân tích tài nguyên và hành vi của mạng tổng quát
  - Khi nào mô hình KPN phù hợp để suy luận chương trình
- level1: Luồng đồng bộ
  level2:
  - Một lần kích hoạt và tốc độ sản xuất, tiêu thụ cố định trong SDF
  - Tốc độ token và sự khác biệt với tốc độ theo thời gian
  - Phương trình cân bằng dữ liệu trên từng cạnh
  - Vector số lần kích hoạt trong một chu kỳ
  - Điều kiện cân bằng và giới hạn của việc chỉ kiểm tra cân bằng
  - Tạo lịch thực thi tuần hoàn
  - Vai trò của token khởi tạo trên vòng phản hồi
  - Khả năng thực thi, bế tắc và kiểm tra trạng thái ban đầu
  - Tính kích thước bộ đệm theo lịch thực thi
  - Tối ưu lịch, bộ nhớ và mức độ song song
  - Ví dụ mạng xử lý tín hiệu nhiều tốc độ
  - Mở rộng từ SDF sang tốc độ biến thiên tuần hoàn trong CSDF
- level1: Luồng động
  level2:
  - Tốc độ sinh và tiêu thụ phụ thuộc dữ liệu
  - Nhánh điều kiện, chọn đường đi và hợp nhánh
  - Sự hiện diện hoặc vắng mặt của token
  - Kích hoạt lặp lại và gắn nhãn cho các lần tính toán
  - Tạo tác vụ và mở rộng đồ thị theo yêu cầu
  - Chuyển tuyến theo khóa, loại dữ liệu hoặc điều kiện nghiệp vụ
  - Điều phối khi chưa biết trước số lượng đầu ra
  - Ảnh hưởng đến phân tích lịch và giới hạn bộ đệm
  - Quản lý tài nguyên khi cấu trúc hoặc khối lượng thay đổi
  - Đánh đổi tính linh hoạt với khả năng dự đoán
- level1: Lập lịch
  level2:
  - Xác định các nút sẵn sàng từ quan hệ phụ thuộc
  - Lập lịch tĩnh và lập lịch động
  - Thực thi theo thứ tự tô-pô trên DAG
  - Chạy song song các nhánh độc lập
  - Song song giữa các giai đoạn và song song trên phân vùng dữ liệu
  - Chia hạt tác vụ và chi phí điều phối
  - Phân phối công việc, công bằng và tránh bỏ đói
  - Giữ thứ tự đầu ra khi tác vụ hoàn thành không theo thứ tự
  - Giới hạn số tác vụ đang chạy và số tác vụ đang chờ
  - Tránh chặn luồng thực thi đang cần để hoàn thành tác vụ phụ thuộc
  - Xử lý phụ thuộc tài nguyên ngoài đồ thị dữ liệu
  - Điều phối hủy và kết thúc toàn bộ đồ thị
- level1: Điều tiết luồng
  level2:
  - Tốc độ nguồn, tốc độ xử lý và nút thắt cổ chai
  - Hàng đợi hữu hạn, hàng đợi không giới hạn và hậu quả tài nguyên
  - Áp lực ngược (backpressure) và truyền tín hiệu nhu cầu
  - Chặn bên sản xuất, giảm nguồn phát và giới hạn tác vụ đang xử lý
  - Lựa chọn chờ, bỏ bản ghi, giữ bản mới nhất hoặc báo lỗi
  - Phân biệt backpressure với giới hạn tốc độ và giới hạn tần suất
  - Gom lô, đọc trước và kích thước bộ đệm
  - Nhánh chậm ảnh hưởng đến việc phát dữ liệu cho nhiều bên nhận
  - Chu kỳ hàng đợi và nguy cơ bế tắc do giới hạn dung lượng
  - Bộ đệm bền vững, tràn ra đĩa và giới hạn sử dụng
  - Truyền điều tiết qua ranh giới bất đồng bộ hoặc mạng
  - Chọn chính sách khi tải vượt khả năng xử lý lâu dài
- level1: Lô và luồng
  level2:
  - Dữ liệu hữu hạn và dữ liệu không giới hạn
  - Xử lý theo lô (batch) và xử lý dòng dữ liệu (streaming)
  - Xử lý từng bản ghi và theo lô nhỏ (micro-batch)
  - Kết quả cuối cùng và kết quả được cập nhật liên tục
  - Toán tử chặn toàn bộ dữ liệu và toán tử có thể phát sớm
  - Tái sử dụng mô hình đồ thị giữa batch và streaming
  - Nguồn có thể phát lại và nguồn không thể phát lại
  - Kết thúc đầu vào, dữ liệu nhàn rỗi và tín hiệu hoàn thành
  - Độ trễ, thông lượng và yêu cầu độ mới của kết quả
  - Giới hạn thao tác toàn cục trên đầu vào không kết thúc
- level1: Trạng thái và phản hồi
  level2:
  - Nút không trạng thái và nút có trạng thái
  - Trạng thái cục bộ, theo khóa và dùng chung
  - Tích lũy giá trị theo chuỗi bản ghi
  - Biến chỉ gán một lần và cơ chế chờ giá trị
  - Cạnh phản hồi, giá trị trễ và token khởi tạo
  - Mô hình hóa vòng lặp bằng dữ liệu phản hồi
  - Điều kiện dừng, số vòng lặp và tiêu chí hội tụ
  - Bảo đảm thứ tự cập nhật trạng thái
  - Tính xác định khi trạng thái và tác dụng phụ cùng tồn tại
  - Vòng đời, giới hạn dung lượng và thời hạn giữ trạng thái
  - Quyền sở hữu trạng thái khi tăng mức độ song song
  - Bảo vệ bất biến và tránh chia sẻ đối tượng có thể sửa đổi
- level1: Thời gian và cửa sổ
  level2:
  - Thời gian sự kiện (event time) và thời gian xử lý (processing time)
  - Dấu thời gian và dữ liệu đến không đúng thứ tự
  - Watermark và giả thiết về tiến độ của dữ liệu
  - Cửa sổ cố định, cửa sổ trượt và cửa sổ phiên
  - Cửa sổ theo số lượng bản ghi và theo thời gian
  - Gom nhóm theo khóa trong từng cửa sổ
  - Điều kiện phát kết quả (trigger)
  - Kết quả sớm, kết quả đúng thời điểm và cập nhật muộn
  - Dữ liệu đến muộn và thời gian chấp nhận trễ
  - Tích lũy, thay thế và thu hồi kết quả đã phát
  - Bộ định thời và dọn dẹp trạng thái cửa sổ
  - Ghép luồng theo khoảng thời gian và quản lý dữ liệu chờ
  - Ảnh hưởng của nguồn nhàn rỗi hoặc chậm đến tiến độ toàn đồ thị
- level1: Tính toán gia tăng
  level2:
  - Tái tính toán toàn bộ và chỉ cập nhật phần chịu ảnh hưởng
  - Theo dõi phụ thuộc giữa dữ liệu đầu vào và kết quả
  - Làm mất hiệu lực bộ nhớ đệm khi dữ liệu thay đổi
  - Truyền phần chênh lệch (delta) qua các nút
  - Biểu diễn thêm, cập nhật và xóa dữ liệu
  - Bảo trì kết quả tổng hợp và kết quả nối theo thay đổi
  - Phản hồi, tính toán đệ quy và điểm bất động
  - Tính đơn điệu và điều kiện hội tụ trong mô hình phù hợp
  - Kết quả tạm thời, tiến độ và xác định khi nào có thể chốt
  - Đồ thị phụ thuộc động và cập nhật cấu trúc tính toán
  - Đánh đổi bộ nhớ lưu kết quả với chi phí tính lại
  - Phân biệt tính toán gia tăng với xử lý streaming nói chung
- level1: Thực thi phân tán
  level2:
  - Ánh xạ đồ thị logic lên các tiến trình và máy thực thi
  - Chia toán tử thành nhiều bản thực thi song song
  - Phân vùng theo khóa, chia đều và phát đến mọi phân vùng
  - Shuffle và trao đổi dữ liệu qua mạng
  - Giữ dữ liệu gần nơi xử lý và giảm truyền tải
  - Trật tự cục bộ, trật tự theo khóa và giới hạn trật tự toàn cục
  - Khóa lệch tải, phân vùng nóng và phân phối lại công việc
  - Đồng bộ các nhánh có tốc độ hoặc tiến độ khác nhau
  - Giới hạn luồng đang xử lý giữa các tiến trình
  - Tăng giảm tài nguyên và di chuyển trạng thái
  - Phát hiện tiến độ và kết thúc trong đồ thị phân tán
  - Ranh giới giữa bộ điều phối, bộ thực thi và nơi lưu trạng thái
- level1: Lỗi và khôi phục
  level2:
  - Phân loại lỗi bản ghi, lỗi toán tử và lỗi hạ tầng
  - Chọn dừng toàn đồ thị, cô lập nhánh hoặc chuyển bản ghi lỗi
  - Thử lại và điều kiện thao tác có thể thực hiện lặp an toàn
  - Lùi thời gian thử lại, giới hạn lần thử và bản ghi lỗi kéo dài
  - Ngữ nghĩa giao nhận ít nhất một lần, nhiều nhất một lần và đúng một lần
  - Nguồn phát lại, vị trí đọc và điểm khôi phục
  - Chụp trạng thái và tính nhất quán giữa dữ liệu với trạng thái
  - Phối hợp checkpoint giữa các nhánh và kênh đang truyền
  - Khôi phục từ checkpoint và xử lý dữ liệu được phát lại
  - Phân biệt trạng thái nhất quán với hiệu ứng bên ngoài đúng một lần
  - Đầu ra có giao dịch, ghi lặp an toàn và chống trùng
  - Hủy tác vụ, đóng tài nguyên và kết thúc có kiểm soát
  - Đánh đổi thời gian khôi phục, dung lượng lưu trữ và chi phí vận hành
- level1: Tối ưu đồ thị
  level2:
  - Bảo toàn ngữ nghĩa khi thay đổi cấu trúc đồ thị
  - Loại nút không sử dụng và tính toán lặp
  - Đẩy phép lọc và chọn trường về gần nguồn
  - Hợp nhất toán tử và giảm chi phí truyền dữ liệu
  - Tách toán tử để tăng song song và cô lập nút chậm
  - Kết hợp từng phần trước khi trao đổi dữ liệu
  - Đổi thứ tự phép biến đổi khi thỏa điều kiện
  - Ghi nhớ kết quả trung gian và lựa chọn điểm lưu
  - Lựa chọn chiến lược nối và phân vùng
  - Tối ưu theo thống kê, độ chọn lọc và phân bố khóa
  - Mâu thuẫn giữa hợp nhất, backpressure và khả năng khôi phục
