references:
  - title: "SWI-Prolog — Getting Started Quickly"
    url: "https://www.swi-prolog.org/man/quickstart.html"
    description: "Cài đặt, nạp chương trình, viết fact/rule và chạy query trong môi trường Prolog."
  - title: "SWI-Prolog — Glossary of Terms"
    url: "https://www.swi-prolog.org/pldoc/man?section=glossary"
    description: "Giải nghĩa atom, arity, term, variable, unification và backtracking."
  - title: "SWI-Prolog — Control Predicates"
    url: "https://us.swi-prolog.org/pldoc/man?section=control"
    description: "Điều khiển luồng suy diễn, true/fail, cut, if-then-else và thu thập kết quả truy vấn."
  - title: "Learn Prolog Now! — Negation as Failure"
    url: "https://lpn.swi-prolog.org/lpnpage.php?pageid=lpn-htmlse45&pagetype=html"
    description: "Giải thích negation as failure, cut, fail và giới hạn suy luận dạng closed-world."
  - title: "SWI-Prolog — CLP(FD) Library"
    url: "https://www.swi-prolog.org/man/clpfd.html"
    description: "Lập trình ràng buộc số nguyên và tìm nghiệm cho bài toán lập lịch hoặc phân công."
  - title: "SWI-Prolog — Debugger Overview"
    url: "https://www.swi-prolog.org/pldoc/man?section=debugoverview"
    description: "Dùng trace và debug để theo dõi call, exit, redo, fail của chương trình Prolog."
  - title: "SWI-Prolog — Unit Testing with plunit"
    url: "https://www.swi-prolog.org/pldoc/man?predicate=run_tests%2F0"
    description: "Chạy unit tests để xác minh các predicate thành công hoặc thất bại đúng kỳ vọng."
  - title: "Markus Triska — The Power of Prolog"
    url: "https://www.metalevel.at/prolog"
    description: "Sách trực tuyến về nền tảng logic, đệ quy, tính thuần khiết, constraints và kiểm thử Prolog."