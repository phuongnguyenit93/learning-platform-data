  - 2.8 Xử lý NoSuchAlgorithmException, NoSuchProviderException và lỗi tham số
  - 2.9 Tính tương thích và trạng thái thay đổi khi dùng dịch vụ mật mã đồng thời
- level1: 3. Dữ liệu và ngẫu nhiên
  level2:
  - 3.1 Chuyển String thành byte[] với charset xác định và quy tắc chuẩn hóa dữ liệu
  - 3.2 Base64, HexFormat và sự khác biệt giữa biểu diễn dữ liệu với bảo vệ bí mật
  - 3.3 Phân biệt số bit, số byte, độ dài khóa và độ dài đầu ra
  - 3.4 Vai trò của entropy; phân biệt SecureRandom với Random và ThreadLocalRandom
  - 3.5 Tạo byte ngẫu nhiên, seed, reseed và tác động của seed có thể dự đoán
  - 3.6 getInstanceStrong, DRBG và khả năng chặn của nguồn ngẫu nhiên
  - 3.7 Phân biệt salt, IV, nonce, challenge và token ngẫu nhiên
  - 3.8 Thiết kế định dạng dữ liệu có phiên bản, độ dài và mã định danh thuật toán
- level1: 4. Hàm băm
  level2:
  - 4.1 Tính một chiều, tiền ảnh và va chạm của hàm băm mật mã
  - 4.2 MessageDigest với SHA-2, SHA-3 và việc kiểm tra khả năng hỗ trợ
  - 4.3 Chu trình update, digest, reset và xử lý dữ liệu nhiều phần
  - 4.4 Băm file lớn bằng luồng hoặc ByteBuffer
  - 4.5 Phân biệt checksum, Object.hashCode và digest mật mã
  - 4.6 So sánh digest bằng MessageDigest.isEqual và phạm vi bảo đảm của API
  - 4.7 Giới hạn của digest công khai trước dữ liệu bị thay thế và mật khẩu yếu
- level1: 5. Mã xác thực
  level2:
  - 5.1 MAC chứng minh điều gì khi hai bên cùng giữ một khóa bí mật
  - 5.2 HMAC và khác biệt với băm dữ liệu có nối thêm khóa
  - 5.3 Sử dụng Mac với init, update, doFinal và quản lý trạng thái
  - 5.4 Sinh, bảo quản và tách khóa HMAC theo mục đích sử dụng
  - 5.5 Thống nhất dữ liệu đầu vào, thứ tự trường và định dạng tag giữa hai bên
  - 5.6 Kiểm tra tag, dữ liệu bị sửa, sai khóa và giới hạn cắt ngắn tag
  - 5.7 Phân biệt xác thực thông điệp với chống phát lại bằng nonce hoặc số thứ tự
- level1: 6. Mã hóa đối xứng
  level2:
  - 6.1 Block cipher, stream cipher, mode và padding
  - 6.2 Chỉ định đầy đủ transformation thay vì phụ thuộc giá trị mặc định của provider
  - 6.3 Tạo khóa AES bằng KeyGenerator và dựng khóa từ vật liệu hợp lệ
  - 6.4 Chu trình Cipher.init, update, doFinal và tính toán bộ đệm đầu ra
  - 6.5 Phân biệt ECB, CBC, CTR và yêu cầu bảo vệ tính toàn vẹn của bản mã
  - 6.6 AEAD, AES/GCM/NoPadding và vai trò của authentication tag
  - 6.7 GCMParameterSpec, độ dài tag và yêu cầu không lặp IV dưới cùng một khóa
  - 6.8 Truyền AAD trước dữ liệu; phân biệt dữ liệu được xác thực với dữ liệu được mã hóa
  - 6.9 ChaCha20, ChaCha20-Poly1305 và quản lý nonce
