    url: "https://docs.oracle.com/en/java/javase/27/migrate/index.html"
    description: "Hướng dẫn chính thức cho quá trình di trú Java tới JDK 27 và các thay đổi cần xem xét."
  - title: "Oracle — Preparing for Migration (JDK 25)"
    url: "https://docs.oracle.com/en/java/javase/25/migrate/preparing-migration.html"
    description: "Quy trình chạy ứng dụng trước khi biên dịch lại, nâng cấp dependency, sử dụng --release và jdeps."
  - title: "Oracle — Migrating from JDK 8 to Later Releases"
    url: "https://docs.oracle.com/en/java/javase/25/migrate/migrating-jdk-8-later-jdk-releases.html"
    description: "Các vấn đề tương thích với JPMS, strong encapsulation, locale, JVM options và hành vi runtime."
  - title: "Oracle — Removed APIs (JDK 25)"
    url: "https://docs.oracle.com/en/java/javase/25/migrate/removed-apis.html"
    description: "Danh sách API đã loại bỏ theo bản Java, hỗ trợ rà soát nâng cấp và kế hoạch thay thế."
  - title: "Oracle — jdeps Command (JDK 26)"
    url: "https://docs.oracle.com/en/java/javase/26/docs/specs/man/jdeps.html"
