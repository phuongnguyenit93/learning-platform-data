  - title: "Oracle — jdeprscan Command (JDK 26)"
    url: "https://docs.oracle.com/en/java/javase/26/docs/specs/man/jdeprscan.html"
    description: "Công cụ rà soát API Java SE deprecated hoặc đánh dấu for removal trong class/JAR."
  - title: "Oracle — javac Command (JDK 25)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/specs/man/javac.html"
    description: "Ý nghĩa --release, -source, -target và cấu hình biên dịch cho Java platform đời trước."
  - title: "Java Language Specification — Binary Compatibility (Java SE 25)"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-13.html"
    description: "Định nghĩa tương thích nhị phân và tác động của thay đổi class, method, field, module."
  - title: "Oracle — JAR File Specification: Multi-release JAR"
    url: "https://docs.oracle.com/en/java/javase/17/docs/specs/jar/jar.html"
    description: "Quy tắc Multi-Release JAR cho thư viện cần hỗ trợ nhiều phiên bản Java trong một artifact."