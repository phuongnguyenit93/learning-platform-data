  level2:
  - Cờ JVM đã deprecated, bị bỏ qua hoặc bị loại bỏ
  - Thay đổi Garbage Collector mặc định và các GC không còn hỗ trợ
  - Chuyển GC log cũ sang Unified Logging
  - Heap, metaspace và hành vi quản lý bộ nhớ sau nâng cấp
  - Nhận diện CPU, bộ nhớ và giới hạn cgroups trong container
  - JIT, thời gian làm nóng và biến động hiệu năng
  - Kiểm chứng tác vụ đồng thời khi đổi JVM hoặc thư viện concurrency
  - Thread pool, virtual thread và giới hạn của việc đổi mô hình thực thi
  - JFR, JMX và tương thích với công cụ giám sát
  - Đo độ trễ, thông lượng và mức dùng tài nguyên trên tải tương đương
- level1: Đóng gói và môi trường
  level2:
  - Cấu trúc JDK sau phiên bản 8 và sự thay đổi của rt.jar hoặc tools.jar
  - JRE đóng gói sẵn và runtime tùy biến bằng jlink
  - JAR thường, executable JAR và cấu hình launcher
  - 'Multi-release JAR: cấu trúc META-INF/versions và lựa chọn lớp'
  - Giới hạn API công khai và kiểm thử từng nhánh của multi-release JAR
  - Manifest, chữ ký JAR và service metadata sau khi đóng gói lại
  - jpackage và cách phân phối ứng dụng desktop
  - Container base image, thư viện hệ thống và kiến trúc đích
  - Đường dẫn, quyền tệp, font và các giả định về hệ điều hành
  - Tham số khởi động trong script, systemd hoặc cấu hình Kubernetes
- level1: Chiến lược chuyển đổi
  level2:
  - Chạy artifact hiện tại trên JDK đích trước khi quyết định biên dịch lại
  - Nâng cấp công cụ và dependency theo thứ tự phụ thuộc
  - Chọn bước chuyển nhỏ có thể kiểm chứng và quay lui
  - Duy trì khả năng build song song trên JDK cũ và mới trong giai đoạn chuyển tiếp
  - Dùng adapter hoặc nhánh triển khai riêng khi cần hỗ trợ nhiều JDK
  - Tự động hóa thay đổi cơ học và kiểm tra diff của mã sinh
  - Ghi rõ phạm vi, chủ sở hữu và thời hạn của biện pháp tạm thời
  - Tách sửa tương thích khỏi việc áp dụng cú pháp hoặc API mới
  - Xác định điều kiện hoàn tất và loại bỏ cấu hình chuyển tiếp
- level1: Kiểm thử hồi quy
  level2:
  - Lập ma trận JDK, nhà cung cấp, hệ điều hành và kiến trúc cần hỗ trợ
  - Chạy cùng bộ kiểm thử trên môi trường cũ và mới
  - Kiểm thử mã nguồn bằng cách biên dịch lại bên sử dụng
  - Kiểm thử nhị phân bằng artifact bên sử dụng đã biên dịch trước đó
  - Kiểm thử hợp đồng API, SPI và plugin của bên thứ ba
  - Kiểm thử dữ liệu đã lưu từ phiên bản trước
  - Kiểm thử locale, charset, múi giờ và dữ liệu quốc tế hóa
  - Kiểm thử TLS, chứng chỉ và tích hợp dịch vụ bên ngoài
  - Kiểm thử nhiều phiên bản dịch vụ cùng hoạt động
  - So sánh kết quả và phát hiện khác biệt được cho phép
  - Đặt ngưỡng chấp nhận chức năng, hiệu năng và vận hành trong CI
- level1: Chẩn đoán lỗi
  level2:
  - UnsupportedClassVersionError và mức bytecode của từng dependency
  - ClassNotFoundException và NoClassDefFoundError
  - NoSuchMethodError, NoSuchFieldError và dependency không khớp
  - AbstractMethodError và IncompatibleClassChangeError
  - IllegalAccessError, IllegalAccessException và InaccessibleObjectException
  - VerifyError, lỗi nạp lớp và lỗi biến đổi bytecode
  - Module không được tìm thấy, package trùng và lỗi phân giải JPMS
  - Unrecognized VM option và tùy chọn GC đã bị xóa
  - Lỗi bắt tay TLS, thuật toán bị vô hiệu hóa và truststore không khớp
  - Khác biệt chỉ xảy ra trong CI hoặc container
  - Thu nhỏ trường hợp lỗi và xác định thay đổi đầu tiên gây hồi quy
- level1: Phát hành và vận hành
  level2:
  - Lưu artifact, cấu hình và kết quả kiểm thử của từng bước chuyển đổi
  - Phát hành thử với một phần lưu lượng trước khi triển khai rộng
  - Chạy song song phiên bản cũ và mới với hợp đồng dữ liệu chung
  - Theo dõi lỗi, độ trễ, bộ nhớ và hành vi GC sau phát hành
  - Xác định điều kiện dừng triển khai và kích hoạt quay lui
  - Quay lui JDK hoặc ứng dụng khi dữ liệu và dependency đã thay đổi
  - Kiểm tra lại bản vá bảo mật trên phiên bản JDK đã chọn
  - Cập nhật tài liệu hỗ trợ, môi trường phát triển và hướng dẫn vận hành
  - Dọn dependency, cờ mở quyền và mã trung gian sau giai đoạn chuyển tiếp
- level1: Bài thực hành
  level2:
  - Tạo ma trận tương thích và báo cáo hiện trạng cho một dự án Java
  - Tái hiện trường hợp -source và -target vẫn gọi nhầm API mới
  - Biên dịch lại với --release và kiểm chứng trên JDK tối thiểu
  - Tạo thư viện mới làm hỏng artifact bên sử dụng cũ
  - So sánh API trước và sau thay đổi bằng công cụ tự động
  - Tìm và thay thế một API nội bộ bằng jdeps
  - Tái hiện lỗi reflection và loại bỏ nhu cầu dùng --add-opens
  - Tạo multi-release JAR và kiểm thử trên các JDK được hỗ trợ
  - Chuyển dự án dùng JAXB khỏi dependency ngầm vào JDK
  - Chuyển một thành phần javax sang jakarta đúng phạm vi
  - Phát hiện hồi quy charset, locale hoặc dữ liệu tuần tự hóa
  - Thực hiện nâng cấp JDK theo giai đoạn với kiểm thử và phương án quay lui
