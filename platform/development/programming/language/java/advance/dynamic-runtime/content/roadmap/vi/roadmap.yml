roadmap:
- id: co-che-dong
  title: Cơ chế động
  purpose: Xác định khi nào chương trình cần khám phá hoặc chọn hành vi lúc chạy.
  objectives:
  - Phân biệt lời gọi trực tiếp, reflection, proxy và method handle.
  - Chọn cơ chế phù hợp cho một tình huống mở rộng.
  - Nêu các đánh đổi về kiểu dữ liệu, quyền truy cập và chi phí.
- id: kham-pha-va-goi-dong
  title: Khám phá và gọi động
  purpose: Sử dụng thông tin kiểu lúc chạy để truy cập thành phần của đối tượng.
  objectives:
  - Tìm constructor, method và field từ đối tượng Class.
  - Gọi thành phần bằng reflection và xử lý ngoại lệ được bọc.
  - Phân biệt thông tin generic khai báo với kiểu thực tế lúc chạy.
- id: quyen-truy-cap
  title: Quyền truy cập
  purpose: Hiểu giới hạn truy cập khi mã động đi qua lớp, package và module.
  objectives:
  - Giải thích khác biệt giữa truy cập công khai và truy cập sâu.
  - Đối chiếu exports, opens và kết quả trySetAccessible.
  - Nhận diện lỗi truy cập thay vì mặc định phá đóng gói.
- id: method-handle
  title: Method handle
  purpose: Tạo lời gọi động có kiểu và kết hợp các thao tác gọi.
  objectives:
  - Tạo MethodHandle bằng Lookup và mô tả MethodType.
  - Phân biệt invokeExact với invoke.
  - Áp dụng bindTo, asType hoặc bộ kết hợp trong ví dụ.
- id: proxy-dong
  title: Proxy động
  purpose: Chèn hành vi quanh lời gọi qua một interface.
  objectives:
  - Tạo proxy bằng Proxy và InvocationHandler.
  - Theo dõi lời gọi, giá trị trả về và ngoại lệ qua proxy.
  - Kiểm tra xử lý equals, hashCode, toString và phương thức mặc định.
- id: lien-ket-dong-jvm
  title: Liên kết động JVM
  purpose: Hiểu cách JVM liên kết điểm gọi động với hành vi thực thi.
  objectives:
  - Mô tả vai trò invokedynamic, bootstrap method và CallSite.
  - Phân biệt điểm gọi có đích cố định và có thể thay đổi.
  - Dùng javap để nhận diện invokedynamic trong một lớp đã biên dịch.
- id: lop-sinh-luc-chay
  title: Lớp sinh lúc chạy
  purpose: Hiểu vòng đời và giới hạn khi định nghĩa mã mới trong tiến trình.
  objectives:
  - Phân biệt defineClass với defineHiddenClass.
  - Giải thích ảnh hưởng của class loader và module tới lớp được tạo.
  - Kiểm thử quyền truy cập, tính tương thích và nguy cơ giữ lớp trong bộ nhớ.
