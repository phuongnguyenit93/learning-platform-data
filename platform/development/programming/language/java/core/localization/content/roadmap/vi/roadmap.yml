roadmap:
- id: tong-quan-ban-dia-hoa
  title: Tổng quan bản địa hóa
  purpose: Hiểu cách ứng dụng thích ứng với ngôn ngữ và quy ước của người dùng.
  objectives:
  - Phân biệt quốc tế hóa và bản địa hóa
  - Nhận biết dữ liệu phụ thuộc ngôn ngữ và vùng
  - Tách nội dung hiển thị khỏi logic nghiệp vụ
- id: xac-dinh-locale
  title: Xác định Locale
  purpose: Chọn ngôn ngữ và vùng một cách rõ ràng cho từng ngữ cảnh.
  objectives:
  - Tạo Locale từ thẻ ngôn ngữ BCP 47
  - Phân biệt ngôn ngữ, hệ chữ và vùng
  - Phân biệt Locale với múi giờ
  - Hạn chế phụ thuộc Locale mặc định
- id: tai-nguyen-ngon-ngu
  title: Tài nguyên ngôn ngữ
  purpose: Quản lý thông điệp đa ngôn ngữ bằng ResourceBundle.
  objectives:
  - Tổ chức khóa và tệp tài nguyên theo Locale
  - Tra cứu chuỗi bằng ResourceBundle
  - Giải thích cơ chế chọn tài nguyên dự phòng
  - Xử lý thiếu khóa hoặc thiếu gói tài nguyên
- id: thong-diep-co-tham-so
  title: Thông điệp có tham số
  purpose: Tạo câu hoàn chỉnh có dữ liệu động mà vẫn thuận tiện cho dịch thuật.
  objectives:
  - Dùng MessageFormat với mẫu trong tài nguyên
  - Thay đổi vị trí tham số theo ngôn ngữ
  - Xử lý dấu nháy và ký tự đặc biệt trong mẫu
- id: so-va-tien-te
  title: Số và tiền tệ
  purpose: Hiển thị và đọc số theo quy ước vùng mà không làm sai giá trị.
  objectives:
  - Dùng NumberFormat cho số, phần trăm và tiền tệ
  - Phân biệt Locale, mã tiền tệ và giá trị tiền
  - Kiểm soát làm tròn và đọc dữ liệu đầu vào
- id: ngay-gio-theo-vung
  title: Ngày giờ theo vùng
  purpose: Hiển thị thời gian theo quy ước ngôn ngữ và múi giờ phù hợp.
  objectives:
  - Dùng DateTimeFormatter với Locale
  - Chọn kiểu định dạng ngày giờ bản địa hóa
  - Phân biệt Locale với ZoneId khi hiển thị
- id: van-ban-da-ngon-ngu
  title: Văn bản đa ngôn ngữ
  purpose: Xử lý chữ và thứ tự ngôn ngữ đúng với ngữ cảnh người dùng.
  objectives:
  - Nhận biết vai trò Unicode và mã hóa UTF-8
  - Chuyển hoa thường với Locale phù hợp
  - So sánh và sắp xếp bằng Collator
  - Nhận biết tách từ và ký tự bằng BreakIterator
- id: tich-hop-va-kiem-thu
  title: Tích hợp và kiểm thử
  purpose: Kết hợp tài nguyên và định dạng thành luồng đa ngôn ngữ nhất quán.
  objectives:
  - Truyền Locale rõ ràng qua luồng xử lý
  - Kiểm thử nhiều ngôn ngữ, vùng và múi giờ
  - Kiểm tra thiếu bản dịch và tài nguyên dự phòng
  - Phân biệt định dạng hiển thị với định dạng lưu trữ
