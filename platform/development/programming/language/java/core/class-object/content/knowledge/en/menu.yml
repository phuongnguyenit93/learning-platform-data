  - Accessor của record và sự khác biệt với getter JavaBeans
  - Hàm khởi tạo chuẩn và hàm khởi tạo chuẩn rút gọn
  - Kiểm tra, chuẩn hóa dữ liệu và sao chép phòng vệ
  - Hàm khởi tạo bổ sung và ủy quyền tới hàm khởi tạo chuẩn
  - Quy tắc về trường đối tượng, kế thừa và hiện thực interface
  - equals(), hashCode(), toString() và ảnh hưởng của thành phần mảng
  - Record chỉ bảo đảm bất biến nông
  - Lựa chọn record hay lớp thông thường
- level1: Lớp sealed
  level2:
  - Mục đích kiểm soát tập lớp con trực tiếp
