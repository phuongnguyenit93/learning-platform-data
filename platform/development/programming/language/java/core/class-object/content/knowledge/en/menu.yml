  - Phân biệt bắt giữ giá trị biến với thay đổi trạng thái đối tượng được tham chiếu
  - Lớp cục bộ trong ngữ cảnh static và ngữ cảnh đối tượng
  - Giới hạn từ khóa truy cập và static trên lớp cục bộ thông thường
  - Local enum và local record được ngầm định static
  - Khi nào lớp cục bộ giúp giữ chi tiết triển khai gần nơi dùng
- level1: Lớp vô danh
  level2:
  - Khai báo và tạo đối tượng vô danh trong một biểu thức
  - Mở rộng một lớp hoặc hiện thực một interface
  - Truyền đối số tới hàm khởi tạo của lớp cha
  - Khởi tạo trường và khối khởi tạo khi không có hàm khởi tạo có tên
  - Ý nghĩa this và truy cập đối tượng bao ngoài
  - Bắt giữ biến final và effectively final
  - So sánh lớp vô danh với lambda ở phạm vi sử dụng và this
  - Nhược điểm của khởi tạo bằng hai cặp ngoặc nhọn
  - Lựa chọn lớp có tên, lớp vô danh hoặc lambda
- level1: Enum
  level2:
  - Enum để mô hình hóa tập thể hiện có tên hữu hạn
  - Khai báo hằng enum và danh tính của từng hằng
  - Trường, phương thức và hàm khởi tạo của enum
  - Giới hạn tạo đối tượng và kế thừa của enum
  - Phần thân riêng cho từng hằng và hành vi khác nhau
  - Enum hiện thực interface
  - values(), valueOf(), name() và ordinal()
  - So sánh bằng == và sử dụng enum trong switch
  - Tránh dùng ordinal() làm mã dữ liệu bền vững
- level1: Record
  level2:
  - Record để biểu diễn một nhóm giá trị có tên
