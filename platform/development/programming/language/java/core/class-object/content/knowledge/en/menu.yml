  - Điều kiện suy ra danh sách lớp con khi bỏ permits
  - Lớp con final, sealed và non-sealed
  - Ràng buộc cùng module hoặc cùng package
  - Kết hợp sealed với lớp abstract, record và enum
  - So sánh hệ phân cấp đóng với lớp tự do mở rộng
  - Khi nào sealed phù hợp để mô hình hóa các loại giá trị
- level1: Lớp generic
  level2:
  - Lớp generic và mục đích tham số hóa kiểu dữ liệu
  - Khai báo lớp Box<T>, trường và phương thức dùng T
  - Tạo đối tượng với đối số kiểu và toán tử diamond
  - Giới hạn kiểu với extends và nhiều ràng buộc
  - Tham số kiểu của lớp không dùng trực tiếp trong ngữ cảnh static
  - Phương thức generic và tham số kiểu riêng
  - Nhận diện raw type, cảnh báo không an toàn và xóa kiểu
  - Giới hạn tạo new T(), mảng generic và kiểm tra kiểu tại thời gian chạy
- level1: Vòng đời đối tượng
  level2:
  - Từ tạo đối tượng tới sử dụng và không còn truy cập được
  - Biến cục bộ, trường và các đường tham chiếu giữ đối tượng tồn tại
  - Phân biệt phạm vi biến với khả năng đối tượng còn được truy cập
  - Thu gom rác tự động và thời điểm thu gom không được bảo đảm
  - Vì sao tham chiếu vòng không tự nó ngăn thu gom rác
  - Rò rỉ bộ nhớ do static, bộ nhớ đệm và đăng ký không được gỡ
  - System.gc() là yêu cầu gợi ý và không thay thế quản lý vòng đời
  - finalize() đã bị khuyến cáo loại bỏ và không dùng để quản lý tài nguyên
  - Đóng tài nguyên bằng AutoCloseable và try-with-resources
- level1: Thiết kế và thực hành
  level2:
  - Chọn trách nhiệm của lớp trước khi chọn trường và phương thức
  - Giữ trạng thái tối thiểu và tránh lưu dữ liệu suy ra không cần thiết
  - Thiết kế thao tác nghiệp vụ để giữ quy tắc hợp lệ
  - Chọn lớp có thể thay đổi, lớp bất biến, record hoặc enum
  - Xây dựng lớp tài khoản với tạo mới, nạp tiền và rút tiền
  - Kết hợp tài khoản, giao dịch và chủ tài khoản bằng tham chiếu
  - Thực nghiệm tham chiếu dùng chung, truyền tham trị và sao chép
  - Viết kiểm thử cho khởi tạo, cập nhật, trường hợp biên và lỗi đầu vào
  - Dùng debugger quan sát this, trường, tham số và đối tượng
  - Danh sách lỗi thường gặp và tiêu chí tự đánh giá thiết kế lớp
