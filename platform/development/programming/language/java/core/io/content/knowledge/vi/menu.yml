  - Deflater, Inflater và phạm vi điều khiển mức nén
  - CRC32, Adler32 và giới hạn của checksum
  - Giới hạn dung lượng, số entry và tỷ lệ giải nén
  - Giải nén đúng thư mục đích và xử lý đường dẫn entry
- level1: Tuần tự hóa cơ bản
  level2:
  - Tuần tự hóa (serialization), Serializable và việc lưu đồ thị đối tượng
  - ObjectOutputStream và ObjectInputStream
  - writeObject, readObject và định dạng stream
  - Tham chiếu dùng chung, vòng tham chiếu và object handle
  - Trường transient, static và trạng thái mặc định được lưu
  - serialVersionUID và tương thích lớp
  - NotSerializableException, InvalidClassException và StreamCorruptedException
  - Constructor của lớp Serializable và lớp cha không Serializable
  - Ghi lại đối tượng đã thay đổi, reset và cache handle
  - Stream header và lỗi khi nối tùy tiện nhiều object stream
  - Khác biệt với định dạng trao đổi có schema độc lập Java
- level1: Tuần tự hóa nâng cao
  level2:
  - writeObject, readObject và defaultWriteObject, defaultReadObject
  - readObjectNoData và thay đổi hệ phân cấp
  - serialPersistentFields và điều khiển dạng lưu trữ
  - writeReplace, readResolve và thay thế đối tượng
  - Externalizable, writeExternal và readExternal
  - Yêu cầu constructor public không tham số của Externalizable
  - Serializable với enum và record
  - '@Serial và kiểm tra khai báo thành viên đặc biệt'
  - Kiểm tra bất biến sau khi khôi phục đối tượng
  - 'ObjectInputFilter: giới hạn lớp, độ sâu, số tham chiếu và độ dài mảng'
  - Filter theo stream, cấu hình JVM và phụ thuộc phiên bản JDK
  - Không khôi phục trực tiếp dữ liệu đối tượng không tin cậy
- level1: Thiết kế an toàn
  level2:
  - Giới hạn kích thước đầu vào và lượng bộ nhớ sử dụng
  - Path traversal và ranh giới thư mục được phép
  - Normalize không thay thế việc xử lý symbolic link
  - 'TOCTOU: khoảng trống giữa kiểm tra và thao tác'
  - SecureDirectoryStream và khả năng hỗ trợ của provider
  - Tạo tệp tạm có quyền phù hợp và dọn dẹp có kiểm soát
  - Không ghi đè dữ liệu ngoài ý muốn khi mở hoặc copy
  - Kiểm tra tính toàn vẹn bằng hash khi bài toán yêu cầu
  - Tránh ghi dữ liệu nhạy cảm và đường dẫn nội bộ vào thông báo công khai
  - Phân biệt quyền hệ điều hành với các cơ chế bảo mật Java lịch sử
- level1: Hiệu năng và tệp lớn
  level2:
  - Xử lý từng khối thay vì đưa toàn bộ tệp vào bộ nhớ
  - Chọn kích thước buffer theo phép đo
  - Chi phí syscall, chuyển đổi charset và số lớp bọc
  - So sánh stream có bộ đệm, Files.copy và FileChannel
  - Heap buffer, direct memory và áp lực bộ nhớ
  - Giới hạn đọc song song và thứ tự ghép kết quả
  - Đo throughput, latency và mức sử dụng bộ nhớ
  - Ảnh hưởng của cache hệ điều hành khi benchmark
  - Không mặc định NIO hoặc memory mapping luôn nhanh hơn
  - Giới hạn file descriptor và số tài nguyên đang mở
- level1: Kiểm thử và chẩn đoán
  level2:
  - Kiểm thử bằng stream bộ nhớ trước khi phụ thuộc tệp thật
  - Tạo thư mục tạm riêng cho từng kịch bản
  - Kiểm tra nội dung byte chính xác và round-trip văn bản
  - Dữ liệu Unicode, BOM và ký tự bị chia giữa các khối
  - Tệp rỗng, tệp lớn, EOF sớm và bản ghi không hoàn chỉnh
  - Mô phỏng partial read, partial write và lỗi giữa chừng
  - Kiểm tra tài nguyên được đóng khi có lỗi
  - Kiểm tra symbolic link, quyền và hành vi theo nền tảng
  - Chẩn đoán sai working directory, charset và đường dẫn resource
  - Chẩn đoán dữ liệu chưa flush, file handle còn mở và buffer sai trạng thái
  - Kiểm tra event, callback và thao tác đồng thời theo cách xác định
- level1: Thực hành
