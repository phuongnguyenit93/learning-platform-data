  - Benchmark đáng tin cậy với JMH (công cụ ngoài JDK)
  - Warming up JVM, JIT và tránh microbenchmark sai
  - Giới hạn tài nguyên và backpressure để bảo vệ hệ thống
  - 'ThreadLocalRandom.current(): tránh tranh chấp, khả năng tái lập và giới hạn bảo mật'
- level1: Kiểm thử & Chẩn đoán
  level2:
  - Test tính đúng đắn khi nhiều tác vụ cùng truy cập state
  - Tái hiện race condition với latch/barrier
  - Không dùng Thread.sleep() thay cho điều kiện đồng bộ trong test
  - Test timeout, interruption và cancellation
  - Test shutdown khi task đang chờ hoặc đang chạy
  - Kiểm tra invariant và lỗi mất dữ liệu
  - Kiểm tra contention/stress với jcstress (công cụ ngoài JDK)
  - Thread dump và nhận diện RUNNABLE/BLOCKED/WAITING
  - jcmd Thread.print, jstack và ThreadMXBean
  - Phân tích deadlock với ThreadMXBean
  - Java Flight Recorder cho thread park, lock và allocation
  - Đọc stack trace khi future và async stage lỗi
  - Log có thread name, task ID và correlation ID
  - Xác định nguyên nhân trước khi tinh chỉnh pool/lock
- level1: Bài tập thực tế
  level2:
  - Xây counter bị race và lần lượt sửa bằng lock, atomic
  - Xây bounded producer–consumer bằng BlockingQueue
  - Xây executor có bounded queue và rejection policy
  - Chạy nhiều Callable, lấy kết quả theo thứ tự hoàn tất
  - Tính tổng mảng bằng Fork/Join và so benchmark
  - Gọi nhiều I/O giả lập bằng CompletableFuture với timeout
  - So sánh platform threads và virtual threads cho tác vụ I/O
  - Triển khai Semaphore giới hạn tài nguyên đồng thời
  - Viết test tái hiện deadlock rồi sửa lock ordering
  - Đọc thread dump và tìm vị trí chặn luồng
  - Thiết kế shutdown có hủy, timeout và đóng tài nguyên
  - 'Tổng kết checklist: thread safety, cancellation, observability'
