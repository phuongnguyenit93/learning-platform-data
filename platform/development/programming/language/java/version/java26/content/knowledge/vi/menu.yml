- level1: HTTP/3
  level2:
  - HTTP/3 là API chính thức từ Java 26
  - QUIC, UDP, TLS và quan hệ với HTTP/3
  - So sánh luồng truyền HTTP/1.1, HTTP/2 và HTTP/3
