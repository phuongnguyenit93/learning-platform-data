      - "Stream Gatherers và Class File API: từ preview trong Java 22 đến chính thức từ JDK 24"
      - "Scoped Value, hàm tạo linh hoạt và tệp nguồn gọn: đối chiếu với phiên bản chính thức từ JDK 25"
