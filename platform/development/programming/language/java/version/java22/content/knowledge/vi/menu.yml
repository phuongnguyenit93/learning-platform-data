      - "Đọc JEP và tài liệu API theo phiên bản để tránh sao chép cú pháp preview đã thay đổi"
  - level1: "Biến và mẫu không tên"
    level2:
      - "JEP 456: mục đích và phạm vi sử dụng dấu gạch dưới làm biến hoặc mẫu không tên"
      - "Phân biệt biến không tên, mẫu không tên và biến mẫu có tên"
      - "Khai báo biến cục bộ không tên và yêu cầu về biểu thức khởi tạo"
      - "Dùng biến không tên trong vòng lặp khi chỉ cần tác dụng phụ hoặc số lần lặp"
      - "Bỏ qua tham số lambda không sử dụng mà vẫn giữ rõ hợp đồng hàm"
      - "Bỏ qua đối tượng ngoại lệ trong catch khi thông tin ngoại lệ không cần thiết"
      - "Quản lý tài nguyên bằng try-with-resources khi không cần dùng tên tài nguyên trong thân khối"
      - "Dùng mẫu không tên để bỏ qua thành phần của record pattern lồng nhau"
      - "Dùng biến mẫu không tên trong switch và instanceof khi chỉ cần kiểm tra kiểu"
      - "Tính bao phủ, thứ tự nhánh và xử lý null khi kết hợp mẫu không tên với switch"
      - "Phạm vi hợp lệ của dấu gạch dưới, khai báo lặp lại và lỗi khi cố đọc biến không tên"
      - "Refactor mã bằng biến không tên mà vẫn giữ rõ ý định và xử lý lỗi có ích"
  - level1: "Bộ nhớ ngoại lai"
    level2:
      - "JEP 454 và mô hình chính thức của Foreign Function & Memory API trong java.lang.foreign"
      - "MemorySegment: vùng nhớ trên heap, ngoài heap, kích thước và địa chỉ"
      - "Arena.ofConfined, Arena.ofShared, Arena.ofAuto và Arena.global: quyền sở hữu và vòng đời"
      - "Cấp phát vùng nhớ bằng Arena và giải phóng xác định bằng try-with-resources"
      - "Đọc ghi dữ liệu bằng ValueLayout với kiểu dữ liệu, byte order và căn chỉnh"
      - "MemoryLayout, StructLayout và SequenceLayout để mô tả cấu trúc dữ liệu native"
      - "Padding, offset và alignment khi ánh xạ cấu trúc C sang Java"
      - "Layout path và VarHandle để truy cập thành phần trong cấu trúc lồng nhau"
      - "Cắt lát, sao chép, điền dữ liệu và chuyển đổi giữa MemorySegment, mảng và ByteBuffer"
      - "Ánh xạ tệp vào bộ nhớ với FileChannel và Arena"
      - "An toàn biên, an toàn vòng đời và giới hạn truy cập theo luồng"
      - "Con trỏ, vùng nhớ kích thước không xác định và trách nhiệm khi dùng reinterpret"
  - level1: "Gọi hàm native"
    level2:
      - "Quy trình gọi thư viện C bằng Linker, SymbolLookup và FunctionDescriptor"
      - "Tìm symbol trong thư viện nạp theo đường dẫn, thư viện của class loader và thư viện nền tảng"
      - "Mô tả tham số cùng giá trị trả về theo ABI của nền tảng"
      - "Tạo downcall handle và gọi hàm native qua MethodHandle"
      - "Truyền số nguyên, số thực, con trỏ và cấu trúc giữa Java với C"
      - "Mã hóa chuỗi, ký tự kết thúc và quản lý buffer khi giao tiếp với mã native"
      - "Nhận kết quả trong vùng nhớ do bên gọi cấp phát và xác định trách nhiệm giải phóng"
      - "Tạo upcall stub để thư viện native gọi ngược vào Java"
      - "Vòng đời callback, truy cập đa luồng và ngăn ngoại lệ thoát qua biên native"
      - "Hàm có số đối số biến đổi và lựa chọn Linker phù hợp với chữ ký native"
      - "Thu thập trạng thái lời gọi như errno và diễn giải quy ước báo lỗi của thư viện"
      - "Cấu hình quyền native access cho classpath hoặc named module theo JDK triển khai"
      - "Kiểm tra tính di động, đóng gói thư viện và lựa chọn FFM cho từng phần tích hợp JNI"
  - level1: "Stream Gatherers"
    level2:
      - "JEP 461 và lộ trình tới API chính thức của Stream Gatherers trong JDK 24"
      - "Stream.gather và khác biệt giữa Gatherer, Collector cùng các phép map hoặc flatMap"
      - "Mô hình biến đổi trung gian không trạng thái và có trạng thái"
      - "Gatherers.windowFixed để chia luồng thành các cửa sổ không chồng lấn"
      - "Gatherers.windowSliding để xử lý cửa sổ trượt và dữ liệu liên tiếp"
      - "Gatherers.fold để tích lũy và phát kết quả khi hoàn tất"
      - "Gatherers.scan để tạo dãy kết quả tích lũy theo từng phần tử"
      - "Gatherers.mapConcurrent và giới hạn số tác vụ đồng thời"
      - "Thứ tự kết quả, ngoại lệ và chi phí khi ánh xạ đồng thời"
      - "Kết hợp gatherer với filter, map, limit và các terminal operation"
      - "Đánh giá bộ nhớ cùng khả năng dừng sớm khi xử lý luồng lớn hoặc vô hạn"
      - "Chuyển ví dụ preview Java 22 sang API Gatherers chính thức trên JDK mới"
  - level1: "Gatherer tùy biến"
    level2:
      - "Các tham số kiểu đầu vào, trạng thái và đầu ra của Gatherer"
      - "Initializer, integrator, combiner và finisher trong vòng đời xử lý"
      - "Phát không, một hoặc nhiều phần tử đầu ra qua Downstream.push"
      - "Tín hiệu dừng từ integrator và xử lý downstream từ chối nhận thêm dữ liệu"
      - "Thiết kế gatherer tuần tự bằng Gatherer.ofSequential"
      - "Thiết kế gatherer có thể chạy song song và ghép trạng thái đúng thứ tự"
      - "Ghép nhiều gatherer bằng andThen và phân định trách nhiệm từng bước"
      - "Xử lý phần dữ liệu còn lại trong finisher khi nguồn kết thúc"
      - "Kiểm chứng nguồn rỗng, cửa sổ chưa đủ, dừng sớm, ngoại lệ và thực thi song song"
      - "Bài tập gom lô, loại trùng liên tiếp và tổng hợp sự kiện theo cửa sổ"
  - level1: "Class File API"
    level2:
      - "JEP 457 và lộ trình tới Class File API chính thức trong JDK 24"
      - "Vai trò của java.lang.classfile trong phân tích, sinh và biến đổi bytecode"
      - "Đọc byte class thành ClassModel và duyệt cấu trúc theo mô hình phần tử"
      - "Khảo sát FieldModel, MethodModel, CodeModel và các thuộc tính của class file"
      - "Sinh lớp, trường và phương thức bằng builder với mô tả kiểu hợp lệ"
      - "Đọc cùng tạo lệnh bytecode, label, nhánh rẽ và vùng xử lý ngoại lệ"
      - "Constant pool, mô tả hằng và các tham chiếu ký hiệu trong bytecode"
      - "Biến đổi lớp hoặc phương thức bằng transform và bảo toàn phần tử không sửa"
      - "Chèn logging hoặc đo thời gian vào bytecode và giữ nguyên hành vi phương thức"
      - "Stack map, kiểm tra hợp lệ bytecode và xử lý lỗi khi nạp lớp"
      - "Phiên bản class file, thuộc tính mới và giới hạn tương thích giữa các JDK"
      - "Đối chiếu API chính thức với ví dụ preview Java 22 và thư viện bytecode đang sử dụng"
      - "Bài tập thống kê phương thức, sinh lớp đơn giản và kiểm tra lớp sau biến đổi"
  - level1: "Chạy nguồn nhiều tệp"
    level2:
      - "JEP 458: thực thi chương trình nhiều tệp Java trực tiếp bằng source launcher"
      - "Chọn tệp chứa điểm vào và chạy chương trình bằng lệnh java với tệp nguồn"
      - "Cách launcher tìm và biên dịch các tệp nguồn được chương trình tham chiếu"
      - "Package, thư mục gốc nguồn và cách tổ chức các tệp phụ thuộc"
      - "Đối số chương trình, tùy chọn JVM và lựa chọn phiên bản ngôn ngữ bằng --source"
      - "Kết hợp mã nguồn với thư viện trên classpath và nhận diện xung đột lớp"
      - "Giới hạn khi làm việc với module, annotation processor và quy trình biên dịch phức tạp"
      - "Chẩn đoán lỗi thiếu nguồn, sai package, không tìm thấy lớp và lỗi biên dịch"
      - "Tổ chức tiện ích dòng lệnh cùng ví dụ học tập gồm nhiều tệp"
      - "Khi nào dùng source launcher và khi nào chuyển sang quy trình build đầy đủ"
  - level1: "G1 và ghim vùng nhớ"
    level2:
      - "JEP 423: G1 region pinning và vấn đề khi mã native giữ vùng nhớ heap"
      - "JNI critical region qua GetPrimitiveArrayCritical và GetStringCritical"
      - "Cách G1 giữ nguyên vùng bị ghim trong khi vẫn thu gom các vùng khác"
      - "Ảnh hưởng tới độ trễ, thông lượng và hành vi khi cấp phát bộ nhớ"
      - "Giới hạn của region pinning khi số vùng bị ghim hoặc thời gian ghim tăng cao"
      - "Phân biệt ghim vùng nhớ của GC với ghim carrier thread của virtual thread"
      - "Quan sát hành vi GC bằng unified logging, JFR và tải có lời gọi native"
      - "Thiết kế JNI critical section ngắn và giải phóng tài nguyên đúng thời điểm"
      - "Đo hiệu quả trên JDK triển khai với tải thực tế trước khi điều chỉnh cấu hình G1"
  - level1: "Hàm tạo linh hoạt"
    level2:
      - "Từ JEP 447 trong Java 22 tới Flexible Constructor Bodies chính thức từ JDK 25"
      - "Tổ chức phần xử lý trước và sau lời gọi constructor super hoặc this"
      - "Kiểm tra tham số và chuẩn hóa dữ liệu trước khi gọi constructor của lớp cha"
      - "Dùng biến cục bộ cùng phép tính dùng chung để chuẩn bị đối số constructor"
      - "Ngữ cảnh khởi tạo sớm và các giới hạn truy cập this, super cùng phương thức instance"
      - "Các phép gán trường được cho phép trước lời gọi constructor theo quy tắc hiện hành"
      - "Thứ tự khởi tạo trường, instance initializer và chuỗi constructor"
      - "Ngoại lệ, tác dụng phụ và tránh làm lộ đối tượng đang khởi tạo"
      - "Chuyển mã kiểm tra đầu vào sang cú pháp chính thức và kiểm tra lỗi biên dịch"
  - level1: "Tệp nguồn gọn"
    level2:
      - "Từ JEP 463 trong Java 22 tới Compact Source Files chính thức từ JDK 25"
      - "Viết chương trình nhỏ với instance main và giảm phần khai báo lặp lại"
      - "Các dạng phương thức main được hỗ trợ và quy tắc lựa chọn điểm vào"
      - "Khai báo trường, phương thức hỗ trợ và khởi tạo đối tượng trong tệp nguồn gọn"
      - "Các import ngầm định và sử dụng lớp java.lang.IO trên JDK hỗ trợ bản chính thức"
      - "Đọc đầu vào, xuất kết quả và xử lý lỗi cho chương trình dòng lệnh nhỏ"
      - "Chạy tệp nguồn gọn và phân biệt với cơ chế chạy chương trình nhiều tệp của JEP 458"
      - "Giới hạn về package, tên lớp và khả năng mở rộng của tệp nguồn gọn"
      - "Chuyển chương trình sang lớp có tên cùng cấu trúc dự án khi quy mô tăng"
  - level1: "Scoped Value"
    level2:
      - "Từ JEP 464 trong Java 22 tới Scoped Values chính thức từ JDK 25"
      - "Truyền ngữ cảnh bất biến theo phạm vi động và đối chiếu với ThreadLocal"
      - "Tạo khóa ScopedValue và quy định quyền truy cập khóa trong ứng dụng"
      - "Ràng buộc giá trị bằng ScopedValue.where và thực thi trong phạm vi run hoặc call"
      - "Đọc giá trị, kiểm tra ràng buộc và xử lý khi khóa chưa có giá trị"
      - "Phạm vi lồng nhau, che khuất ràng buộc và khôi phục ngữ cảnh khi thoát phạm vi"
      - "Truyền ngữ cảnh theo cơ chế kế thừa được hỗ trợ bởi StructuredTaskScope của JDK sử dụng"
      - "Tách biệt phạm vi ràng buộc với tính an toàn luồng của đối tượng được tham chiếu"
      - "Ứng dụng cho request ID, thông tin người dùng và cấu hình theo yêu cầu"
      - "Chuyển ví dụ preview hoặc ngữ cảnh ThreadLocal phù hợp sang API ScopedValue chính thức"
  - level1: "Đồng thời có cấu trúc"
    level2:
      - "JEP 462 trong Java 22 và lộ trình Structured Concurrency trên các JDK tiếp theo"
      - "Quan hệ cha con, vòng đời tác vụ và nguyên tắc kết thúc tác vụ trong phạm vi sở hữu"
      - "StructuredTaskScope theo API preview của đúng JDK đang dùng"
      - "Khởi chạy tác vụ con, chờ hoàn tất và truy xuất kết quả theo hợp đồng của scope"
      - "Chiến lược chờ mọi kết quả, thất bại sớm và lấy kết quả thành công phù hợp"
      - "Lan truyền lỗi, hủy tác vụ còn lại và xử lý interruption đúng cách"
      - "Timeout, thời hạn xử lý và đóng scope khi tác vụ con chưa kết thúc"
      - "Kết hợp virtual thread với tác vụ I/O và giới hạn tài nguyên bên ngoài"
      - "Kết hợp ScopedValue để truyền ngữ cảnh trong cây tác vụ"
      - "Kiểm tra tình huống thành công, thất bại từng phần, timeout và rò rỉ tác vụ"
      - "Chuyển ví dụ Java 22 sang JDK mục tiêu và quản lý yêu cầu --enable-preview"
  - level1: "Vector API"
    level2:
      - "JEP 460 trong Java 22 và trạng thái incubator cần kiểm tra ở JDK triển khai"
      - "Mô hình SIMD, lane, vector và các bài toán phù hợp với xử lý dữ liệu song song"
      - "Kích hoạt mô-đun jdk.incubator.vector bằng --add-modules"
      - "VectorSpecies, số lane và lựa chọn species phù hợp với nền tảng"
      - "Nạp, tính toán và ghi dữ liệu bằng các kiểu vector số nguyên hoặc số thực"
      - "VectorMask và xử lý phần đuôi khi độ dài dữ liệu không chia hết cho số lane"
      - "Phép toán số học, so sánh, lựa chọn phần tử và kết hợp mask"
      - "Reduction, chuyển kiểu và sắp xếp lại lane theo yêu cầu thuật toán"
      - "Khác biệt kết quả dấu phẩy động và yêu cầu về sai số khi vector hóa"
      - "Đánh giá hỗ trợ phần cứng, biên dịch JIT và đường thực thi dự phòng"
      - "Bài tập tính tích vô hướng, lọc dữ liệu và so sánh hiệu năng với vòng lặp vô hướng"
  - level1: "Vận dụng và nâng cấp"
    level2:
      - "Lập bảng tính năng theo JDK: nguồn gốc Java 22, trạng thái hiện tại và tùy chọn chạy"
      - "Đồng bộ JDK của IDE, javac, java và công cụ build cho từng bài thực hành"
      - "Quy tắc biên dịch và chạy preview trong cùng phiên bản JDK; phân biệt với incubator"
      - "Chọn --release phù hợp và hiểu giới hạn khi gọi API chỉ có ở JDK mới"
      - "Bài tập FFM: đọc cấu trúc nhị phân và gọi một hàm trong thư viện native"
      - "Bài tập Gatherers: xử lý dữ liệu theo cửa sổ với bộ nhớ có giới hạn"
      - "Bài tập Class File API: phân tích phương thức và xác minh bytecode sau biến đổi"
      - "Bài tập ngữ cảnh yêu cầu: ScopedValue và cây tác vụ trên JDK hỗ trợ tương ứng"
      - "Đo hiệu năng với JMH, kiểm soát warmup và phân tích GC thay vì suy luận từ cú pháp"
      - "Chuyển khỏi JDK 22 sang JDK được hỗ trợ, thay API preview bằng bản chính thức khi có"
      - "Rà soát tương thích, cấu hình native access và tài liệu triển khai trước khi sử dụng thực tế"
