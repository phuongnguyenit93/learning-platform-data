  - Độ bao phủ contract external event
  - Nhận diện module có nhiều code nhưng ít bằng chứng
  - Tránh tối ưu coverage bằng test ít ý nghĩa
  - Theo dõi khoảng trống kiểm thử theo rủi ro
- level1: CI và quality gate
  level2:
  - Chạy ApplicationModules.verify ở mọi pull request
  - Chọn nhóm module test trong pipeline
  - Phân tầng test nhanh và test hạ tầng
  - Cache dependency và container image
  - Thu thập report khi test thất bại
  - Lưu log scenario và thông tin bootstrap
  - Chạy lại flaky test có giới hạn và có cảnh báo
  - Không bỏ qua test kiến trúc vì build chậm
  - Quality gate cho dependency cycle
  - Quality gate cho test module và event contract
  - So sánh thời gian test giữa các commit
  - Bảo đảm CI và máy phát triển dùng cấu hình tương thích
- level1: Refactoring an existing app
  level2:
  - Khảo sát package và dependency trước khi thêm module test
  - Tạo ApplicationModules cho code hiện hữu
  - Xử lý package chưa có boundary rõ
  - Đưa dependency cycle ra ánh sáng
  - Chọn một module có ranh giới dễ kiểm chứng
  - Viết test public API trước khi tái cấu trúc
  - Chuyển gọi trực tiếp thành event khi có lý do
  - Tách test fixture khỏi implementation package
  - Thiết lập baseline và xử lý vi phạm từng phần
  - Giữ hành vi khi di chuyển lớp giữa module
  - Đưa verify vào build sau khi module model ổn định
  - Đo lợi ích của verification sau refactor
- level1: Performance tests
  level2:
  - Chi phí tạo ApplicationContext cho từng module test
  - Context caching và cấu hình làm cache bị tách
  - Giảm bean ngoài phạm vi module
  - Giảm thời gian chuẩn bị database
  - Tái sử dụng container an toàn
  - Giới hạn số scenario trong một test class
  - Tách test structural nhanh khỏi integration test chậm
  - Chạy event flow với dữ liệu tối thiểu
  - Đo thời gian chờ event và state change
  - Phát hiện test rò tài nguyên
  - Tối ưu test mà vẫn giữ bằng chứng cần thiết
- level1: Security testing
  level2:
  - Không đưa secret thật vào module test
  - Kiểm tra authorization khi gọi public module API
  - Security context trong web hoặc event test
  - Kiểm tra event không làm lộ dữ liệu nhạy cảm
  - Kiểm tra tenant boundary giữa module
  - Mock external identity provider theo contract
  - Test lỗi khi thiếu quyền
  - Test cấu hình mặc định không mở quyền ngoài ý muốn
  - Dọn token và credential sau test
  - Phân biệt security test với architectural verification
  - Lưu report không chứa dữ liệu nhạy cảm
- level1: Lỗi thường gặp
  level2:
  - Chỉ chạy verify một lần rồi bỏ qua trong CI
  - Coi module test là unit test có Spring
  - Bootstrap toàn ứng dụng cho mọi scenario
  - Mock toàn bộ dependency làm mất giá trị tích hợp
  - Dùng sleep để chờ event
  - Không kiểm tra event sau transaction commit
  - Không dọn executor và container
  - Dùng fixture dùng chung có thể thay đổi
  - Assertion trực tiếp vào package nội bộ
  - Suppress dependency cycle không có lý do
  - Đo coverage mà không xem chất lượng assertion
  - Gọi event publisher nhưng không xác minh listener
  - Chạy test green nhưng không có assertion thực sự
- level1: Chọn chiến lược
  level2:
  - Xác định mục tiêu là structural hay behavioral verification
  - Chọn ApplicationModules.verify cho luật kiến trúc
  - Chọn @ApplicationModuleTest cho một module
  - Chọn @SpringBootTest cho cross-module flow
  - Chọn Scenario cho event-driven behavior
  - Chọn contract test cho public module API
  - Chọn Testcontainers khi cần dependency thật
  - Chọn mock khi boundary đã đủ rõ
  - Cân bằng độ cô lập với bằng chứng tích hợp
  - Xác định timeout, retry và mức observability
  - Ghi lại phạm vi những gì test không chứng minh
- level1: Dự án thực hành
  level2:
  - Khởi tạo ứng dụng Spring Modulith nhỏ có ba module
  - Khám phá mô hình bằng ApplicationModules
  - Viết test kiểm tra dependency và cycle
  - Khai báo named interface cho public API
  - Tạo ApplicationModuleTest cho module nghiệp vụ
  - Bootstrap module với collaborator được thay thế
  - Viết scenario kích hoạt command và chờ event
  - Kiểm tra event chỉ phát sau transaction commit
  - Kiểm tra state change sau listener bất đồng bộ
  - Kiểm tra contract của externalized event
  - Chạy database test bằng Testcontainers
  - Đưa verify và module test vào CI
  - Ghi report và chẩn đoán một test thất bại
  - Đánh giá giới hạn còn lại của bộ verification
