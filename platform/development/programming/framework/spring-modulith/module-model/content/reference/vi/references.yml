  - title: "Spring Modulith – Documenting Application Modules"
    url: "https://docs.spring.io/spring-modulith/reference/documentation.html"
    description: "Cách biểu diễn quan hệ giữa mô-đun và phần tử của chúng dưới dạng sơ đồ và module canvas."
  - title: "Spring Modulith – Project Overview"
    url: "https://spring.io/projects/spring-modulith/"
