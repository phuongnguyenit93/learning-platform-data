references:
  - title: "Reactor Netty — Getting Started"
    url: "https://projectreactor.io/docs/netty/release/reference/getting-started.html"
    description: "Giới thiệu Reactor Netty, Reactive Streams, các giao thức HTTP/TCP/UDP và cơ chế quản lý phiên bản bằng BOM."
  - title: "Reactor Netty — TCP Server"
    url: "https://projectreactor.io/docs/netty/release/reference/tcp-server.html"
    description: "Thiết lập TcpServer, bind/dispose, nhận gửi dữ liệu, event loop, TLS và cấu hình timeout."
  - title: "Reactor Netty — TCP Client"
    url: "https://projectreactor.io/docs/netty/release/reference/tcp-client.html"
    description: "Thiết lập TcpClient, connect, truyền dữ liệu, connection pool, proxy, TLS và metrics."
  - title: "Reactor Netty — HTTP Server"
    url: "https://projectreactor.io/docs/netty/release/reference/http-server.html"
    description: "Hướng dẫn HttpServer, routing, xử lý request/response, HTTP protocol, TLS và giới hạn kết nối."
  - title: "Reactor Netty — HTTP Client"
    url: "https://projectreactor.io/docs/netty/release/reference/http-client.html"
    description: "Hướng dẫn HttpClient, gửi request, response streaming, connection provider, timeout, SSL và HTTP/2."
  - title: "Reactor Netty — Observability"
    url: "https://projectreactor.io/docs/netty/release/reference/observability.html"
    description: "Danh mục metrics và tracing cho các kết nối, connection pool, HTTP/TCP và WebSocket."
