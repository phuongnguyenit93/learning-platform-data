  - title: "Reactor Test Javadoc — PublisherProbe"
    url: "https://projectreactor.io/docs/test/release/api/reactor/test/publisher/PublisherProbe.html"
    description: "Xác nhận một nhánh Publisher có được subscribe, request hoặc cancel hay không."
  - title: "Project Reactor Reference — Context"
    url: "https://projectreactor.io/docs/core/release/reference/advancedFeatures/context.html"
    description: "Cơ chế Context, contextWrite và deferContextual để hiểu và kiểm thử dữ liệu ngữ cảnh trong luồng."