references:
  - title: "Spring Framework - Exporting Your Beans to JMX"
    url: "https://docs.spring.io/spring-framework/reference/integration/jmx/exporting.html"
    description: "Cấu hình MBeanExporter, MBeanServerFactoryBean và đăng ký Spring beans."
  - title: "Spring Framework - Controlling the Management Interface"
    url: "https://docs.spring.io/spring-framework/reference/integration/jmx/interface.html"
    description: "@ManagedResource, @ManagedAttribute, @ManagedOperation và giới hạn management interface."
  - title: "Spring Framework - Controlling ObjectName"
    url: "https://docs.spring.io/spring-framework/reference/integration/jmx/naming.html"
    description: "ObjectNamingStrategy, ObjectName, @EnableMBeanExport và metadata naming."
  - title: "Spring Framework - JMX Notifications"
    url: "https://docs.spring.io/spring-framework/reference/integration/jmx/notifications.html"
    description: "Đăng ký listener, NotificationPublisherAware và phát JMX Notification."
  - title: "Spring Framework - Accessing MBeans through Proxies"
    url: "https://docs.spring.io/spring-framework/reference/integration/jmx/proxy.html"
    description: "MBeanProxyFactoryBean và truy cập MBean qua MBeanServerConnection."
  - title: "Spring Framework - Using JSR-160 Connectors"
    url: "https://docs.spring.io/spring-framework/reference/integration/jmx/jsr160.html"
    description: "Kết nối client/server JMX từ xa, connector và serviceUrl."
  - title: "Spring Boot - Actuator Endpoints"
    url: "https://docs.spring.io/spring-boot/reference/actuator/endpoints.html"
    description: "Exposing endpoint qua JMX, giới hạn truy cập và quản trị exposure."
  - title: "Oracle Java SE - Introduction to JMX Technology"
    url: "https://docs.oracle.com/en/java/javase/25/jmx/introduction-jmx-technology.html"
    description: "Kiến trúc MBean, MBeanServer, agent và connector của JMX."
  - title: "Oracle Java SE - Instrumenting Resources for JMX"
    url: "https://docs.oracle.com/en/java/javase/25/jmx/instrumenting-your-resources-jmx-technology.html"
    description: "Standard MBeans, Dynamic MBeans, MXBeans, attributes và operations."
  - title: "Oracle Java SE - JMX Security"
    url: "https://docs.oracle.com/en/java/javase/25/jmx/security.html"
    description: "Xác thực, SSL, phân quyền và các cảnh báo khi quản trị qua JMX."