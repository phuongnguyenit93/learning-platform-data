references:
  - title: "Spring Framework — ApplicationContext and Events"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/context-introduction.html"
    description: "Cách công bố event, @EventListener, application lifecycle events và listener bất đồng bộ."
  - title: "Spring API — ApplicationEventPublisher"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/context/ApplicationEventPublisher.html"
    description: "Hợp đồng publishEvent và ý nghĩa bàn giao event cho các listener phù hợp."
  - title: "Spring API — EventListener"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/context/event/EventListener.html"
    description: "Cú pháp @EventListener, điều kiện, thứ tự và các giới hạn khi chạy bất đồng bộ."
  - title: "Spring Framework — Task Execution and Scheduling"
    url: "https://docs.spring.io/spring-framework/reference/integration/scheduling.html"
    description: "@EnableAsync, @Async, TaskExecutor và xử lý ngoại lệ trong tác vụ bất đồng bộ."
  - title: "Spring Framework — Transaction-bound Events"
    url: "https://docs.spring.io/spring-framework/reference/data-access/transaction/event.html"
    description: "@TransactionalEventListener, các transaction phase và fallbackExecution."
  - title: "Spring Framework — Test Application Events"
    url: "https://docs.spring.io/spring-framework/reference/testing/testcontext-framework/application-events.html"
    description: "@RecordApplicationEvents và API ApplicationEvents để xác nhận sự kiện trong integration test."