references:
  - title: "Spring Kafka – Message Listener Containers"
    url: "https://docs.spring.io/spring-kafka/reference/kafka/receiving-messages/message-listener-container.html"
    description: "Commit offset, AckMode, concurrency và hành vi của listener container."
  - title: "Spring Kafka – Handling Exceptions"
    url: "https://docs.spring.io/spring-kafka/reference/kafka/annotation-error-handling.html"
    description: "DefaultErrorHandler, BackOff và DeadLetterPublishingRecoverer khi xử lý lỗi."
  - title: "Spring Kafka – Non-Blocking Retries"
    url: "https://docs.spring.io/spring-kafka/reference/retrytopic.html"
    description: "Retry topic, DLT, các giới hạn với batch listener và container transactions."
  - title: "Spring Kafka – Transactions"
    url: "https://docs.spring.io/spring-kafka/reference/kafka/transactions.html"
    description: "KafkaTransactionManager, transactionIdPrefix và đồng bộ giao dịch."
  - title: "Spring Kafka – Exactly Once Semantics"
    url: "https://docs.spring.io/spring-kafka/reference/kafka/exactly-once.html"
    description: "Phạm vi EOS cho read-process-write và commit offset trong giao dịch Kafka."
  - title: "Spring Kafka – Pausing and Resuming Listener Containers"
    url: "https://docs.spring.io/spring-kafka/reference/kafka/pause-resume.html"
    description: "Tạm dừng và tiếp tục tiêu thụ khi cần điều tiết hoặc xử lý sự cố."
  - title: "Spring Kafka – Monitoring"
    url: "https://docs.spring.io/spring-kafka/reference/kafka/micrometer.html"
    description: "Metrics, Micrometer timers và Observation cho listener và KafkaTemplate."
  - title: "Spring Kafka – Topic/Partition Initial Offset"
    url: "https://docs.spring.io/spring-kafka/reference/kafka/topic/partition-initial-offset.html"
    description: "Vị trí tiêu thụ ban đầu, auto.offset.reset và lựa chọn seek."