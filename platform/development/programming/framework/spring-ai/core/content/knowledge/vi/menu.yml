menu:
- level1: Tổng quan
  level2:
  - Spring AI là gì và giải quyết vấn đề nào trong ứng dụng Java
  - Vai trò của Spring AI giữa ứng dụng, mô hình và nhà cung cấp
  - Phân biệt mô hình, nhà cung cấp, điểm truy cập API và ứng dụng AI
  - Phạm vi Spring AI Core và các hướng mở rộng chuyên sâu
  - 'Các tác vụ nền tảng: hỏi đáp, tóm tắt, phân loại, trích xuất và sinh nội dung'
  - Luồng xử lý từ yêu cầu người dùng đến kết quả mô hình
  - Giới hạn của AI tạo sinh và trách nhiệm kiểm chứng của ứng dụng
  - Kiến thức tiên quyết và trình tự học Spring AI Core
- level1: Nền tảng LLM
  level2:
  - Mô hình ngôn ngữ lớn và cơ chế dự đoán token ở mức khái niệm
