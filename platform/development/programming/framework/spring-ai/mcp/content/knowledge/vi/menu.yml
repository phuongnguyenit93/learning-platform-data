menu:
  - level1: Tổng quan và kiến trúc Spring AI MCP
    level2:
      - MCP giải quyết bài toán kết nối ứng dụng AI với hệ thống bên ngoài
      - Vai trò của Host, Client và Server trong một luồng MCP
      - Phân biệt MCP với REST API, tool calling và tích hợp trực tiếp
      - Tools, resources và prompts trong hợp đồng MCP thống nhất
      - Vị trí của Spring AI, MCP Java SDK và Spring Boot Starters
      - Luồng yêu cầu từ người dùng qua ChatClient đến dịch vụ nghiệp vụ
      - Ranh giới tin cậy và trách nhiệm của từng thành phần
      - Các trường hợp sử dụng MCP trong ứng dụng Spring
  - level1: Hợp đồng giao thức và tương thích phiên bản
    level2:
      - 'Thông điệp JSON-RPC: request, response, notification và request ID'
      - Khám phá server và thương lượng capabilities theo phiên bản giao thức
      - Vòng đời initialize và initialized trong các phiên bản có phiên kết nối
      - Đối chiếu server/discover và capabilities theo request của đặc tả mới
      - Đọc ma trận hỗ trợ giữa Spring AI, MCP Java SDK và đặc tả MCP
      - Phân trang danh mục và xử lý cursor khi liệt kê khả năng của server
      - Phân biệt lỗi giao thức, lỗi transport và kết quả lỗi của công cụ
      - Kiểm tra tính năng tùy chọn trước khi gọi hoặc đăng ký handler
      - Quản lý thay đổi hợp đồng để client cũ tiếp tục hoạt động
  - level1: Chuẩn bị môi trường và cấu hình dự án
    level2:
      - Chọn phiên bản Java, Spring Boot và Spring AI tương thích
      - Quản lý dependency bằng Spring AI BOM với Maven hoặc Gradle
      - Tách ứng dụng MCP Server, MCP Client và lớp nghiệp vụ
      - Chọn starter cho STDIO, WebMVC và WebFlux
      - Tổ chức cấu hình spring.ai.mcp.server và spring.ai.mcp.client
      - Tách profile phát triển, kiểm thử và triển khai
      - Chuẩn bị mô hình AI và quản lý thông tin kết nối ngoài mã nguồn
      - Thiết lập dữ liệu mẫu và tiêu chí hoàn thành bài thực hành
  - level1: Lựa chọn transport và mô hình thực thi
    level2:
      - So sánh STDIO, Streamable HTTP và HTTP SSE cũ
      - STDIO giữa client và tiến trình server cục bộ
      - Streamable HTTP với yêu cầu HTTP và luồng SSE tùy chọn
      - Phân biệt SSE trong Streamable HTTP với transport HTTP SSE cũ
      - Chọn server stateful hoặc stateless theo hỗ trợ của SDK
      - Chọn WebMVC hoặc WebFlux theo tải và thư viện nghiệp vụ
      - Chọn API đồng bộ hoặc bất đồng bộ và giới hạn khi phối hợp
      - Đánh giá transport theo bảo mật, mạng, độ trễ và vận hành
      - Lập ma trận capabilities được hỗ trợ cho từng transport
  - level1: Xây dựng MCP Server đầu tiên qua STDIO
    level2:
      - Khởi tạo MCP Server tối thiểu bằng Spring Boot starter
      - Khai báo tên, phiên bản và capabilities của server
      - Tạo công cụ tra cứu dữ liệu mẫu từ Spring service
      - Đóng gói server thành JAR để client khởi chạy
      - Cấu hình command, arguments, biến môi trường và thư mục làm việc
      - Tách log khỏi stdout để giữ nguyên luồng thông điệp STDIO
      - Khám phá và gọi công cụ bằng MCP Inspector tương thích
      - Đóng tiến trình server và giải phóng tài nguyên an toàn
  - level1: Triển khai MCP Server qua HTTP
    level2:
      - Cấu hình Streamable HTTP Server với WebMVC
      - Cấu hình Streamable HTTP Server với WebFlux
      - Định tuyến endpoint MCP và kiểm tra Content-Type cùng Accept
      - Quản lý session ID và protocol version khi phiên bản yêu cầu
      - Triển khai chế độ stateless và xác định tính năng không khả dụng
      - Xử lý kết nối ngắt và khả năng tiếp tục luồng khi được hỗ trợ
      - Tích hợp reverse proxy với streaming và thời gian chờ phù hợp
      - Phân biệt CORS, kiểm tra Origin và xác thực phía server
      - Chuyển đổi từ transport HTTP SSE cũ và kiểm tra tương thích
  - level1: Thiết kế hợp đồng công cụ và JSON Schema
    level2:
      - Chọn ranh giới nghiệp vụ và độ hạt phù hợp cho từng tool
      - Đặt tên và mô tả để mô hình hiểu đúng khả năng công cụ
      - Thiết kế inputSchema với kiểu dữ liệu và trường bắt buộc
      - Biểu diễn enum, danh sách, đối tượng lồng nhau và giá trị tùy chọn
      - Kiểm tra đầu vào ở lớp schema và lớp nghiệp vụ
      - Thiết kế nội dung kết quả văn bản, dữ liệu có cấu trúc và resource link
      - Khai báo outputSchema và kiểm chứng structuredContent
      - Sử dụng readOnlyHint, destructiveHint và idempotentHint đúng ý nghĩa
      - Thiết kế giới hạn kích thước, phân trang và định dạng lỗi nghiệp vụ
      - Duy trì tương thích khi thay đổi tên, tham số và kết quả công cụ
  - level1: Hiện thực và đăng ký công cụ phía server
    level2:
      - Khai báo công cụ bằng @McpTool và tham số bằng @McpToolParam
      - Kết nối công cụ với Spring bean và lớp dịch vụ nghiệp vụ
      - Tái sử dụng @Tool và ToolCallback qua cơ chế chuyển đổi được hỗ trợ
      - Đăng ký tool bằng API lập trình của MCP Java SDK
      - Trả CallToolResult và biểu diễn lỗi thực thi bằng isError
      - Xử lý kiểu trả về đồng bộ và bất đồng bộ phù hợp server
      - Tiếp cận request context và metadata theo API của phiên bản
      - Kiểm soát phạm vi quét annotation và tránh đăng ký trùng
      - Quản lý đăng ký động và thông báo thay đổi danh mục khi được hỗ trợ
  - level1: Cung cấp và quản lý MCP Resources
    level2:
      - Phân biệt resource đọc dữ liệu với tool thực hiện hành động
      - Thiết kế URI, MIME type và metadata của resource
      - Cung cấp resource văn bản và dữ liệu nhị phân
      - Khai báo @McpResource với URI cố định
      - Thiết kế resource template và kiểm tra biến URI
      - Liệt kê resources và resource templates với phân trang
      - Đọc resource từ repository, tệp hoặc dịch vụ bên ngoài
      - Đăng ký theo dõi cập nhật resource khi capability cho phép
      - Xử lý resource không tồn tại, dữ liệu quá lớn và quyền đọc
      - Kiểm soát cache, độ mới dữ liệu và phiên bản nội dung
  - level1: Cung cấp MCP Prompts và gợi ý tham số
    level2:
      - Phân biệt MCP prompt với system prompt và nội dung người dùng
      - Khai báo @McpPrompt và hợp đồng tham số
      - Xây dựng thông điệp theo vai trò trong kết quả prompt
      - Liệt kê prompts và lấy prompt theo tên cùng arguments
      - Kết hợp dữ liệu resource với mẫu prompt có kiểm soát
      - Sử dụng @McpComplete cho tham số prompt và resource template
      - Kiểm tra giá trị thiếu, tham số không hợp lệ và prompt không tồn tại
      - Quản lý phiên bản prompt và thông báo thay đổi khi được hỗ trợ
  - level1: Xây dựng MCP Client và quản lý vòng đời
    level2:
      - Cấu hình client starter và các kết nối có tên
      - Kết nối tới tiến trình STDIO bằng cấu hình trực tiếp hoặc JSON
      - Kết nối tới server Streamable HTTP với endpoint phù hợp
      - Kết nối HTTP SSE cũ khi hệ thống còn yêu cầu
      - Inject McpSyncClient hoặc McpAsyncClient theo cấu hình thống nhất
      - Khởi tạo client và đọc thông tin server cùng capabilities
      - Liệt kê công cụ và gọi tools/call với arguments hợp lệ
      - Tùy biến client bằng customizer theo từng kết nối
      - Cấu hình thời gian chờ và hành vi khi server chưa sẵn sàng
      - Đóng client, phiên kết nối và tiến trình con khi ứng dụng dừng
  - level1: Tích hợp công cụ MCP với Spring AI ChatClient
    level2:
      - Chuyển công cụ MCP thành ToolCallbackProvider cho Spring AI
      - Đăng ký tool callbacks cho ChatClient theo cơ chế được phiên bản hỗ trợ
      - Theo dõi chu trình mô hình chọn tool, thực thi và tổng hợp câu trả lời
      - Phân biệt gọi tool trực tiếp với để mô hình lựa chọn công cụ
      - Kết hợp công cụ cục bộ và MCP tools mà không trùng tên
      - Giới hạn số vòng gọi công cụ và ngân sách một yêu cầu hội thoại
      - Cấp ToolContext và chuyển metadata bằng danh sách cho phép
      - Kiểm soát dữ liệu nhạy cảm khi gửi kết quả công cụ về mô hình
      - Xử lý tool lỗi hoặc không có kết quả trong câu trả lời hội thoại
      - Kiểm chứng câu trả lời dựa trên dữ liệu trả về từ MCP Server
  - level1: Đưa resources và prompts vào ngữ cảnh hội thoại
    level2:
      - Đọc resource bằng MCP Client trước khi dựng yêu cầu ChatClient
      - Lấy MCP prompt và ánh xạ thông điệp sang mô hình hội thoại
      - Phân biệt tích hợp tools tự động với xử lý resources và prompts chủ động
      - Chọn resource theo yêu cầu và quyền của người dùng
      - Kết hợp resource, prompt và tool result trong cùng luồng xử lý
      - Giới hạn token, chia nhỏ nội dung và giữ thông tin nguồn
      - Kết hợp MCP với retrieval và RAG theo nhu cầu ứng dụng
      - Xử lý dữ liệu lỗi thời và xung đột giữa nhiều nguồn ngữ cảnh
  - level1: Kết nối nhiều server và quản lý danh mục công cụ
    level2:
      - Tổ chức cấu hình nhiều MCP Server theo miền nghiệp vụ
      - Phân biệt tên kết nối, tên server và tên công cụ
      - Lọc công cụ được đưa vào ChatClient bằng McpToolFilter
      - Xử lý trùng tên qua McpToolNamePrefixGenerator
      - Chọn tập công cụ theo tác vụ và giới hạn ngữ cảnh mô hình
      - Làm mới danh mục khi server thay đổi capabilities hoặc công cụ
      - Cô lập server lỗi để duy trì các kết nối còn lại
      - Quản lý độ tin cậy và phiên bản hợp đồng của từng server
  - level1: Request context và tính năng MCP tùy chọn
    level2:
      - Đọc request context và metadata mà không đưa vào arguments của mô hình
      - Xử lý logging, progress và thông báo đổi danh mục bằng annotation
      - Liên kết client handler với đúng tên kết nối
      - Báo tiến độ và xử lý yêu cầu hủy khi giao thức hỗ trợ
      - Roots và giới hạn của việc khai báo phạm vi tài nguyên
      - Sampling và quyền kiểm soát mô hình ở phía client khi được hỗ trợ
      - Elicitation để yêu cầu người dùng bổ sung dữ liệu có kiểm soát
      - Phân biệt chấp nhận, từ chối và hủy yêu cầu elicitation
      - Đánh giá Tasks và extensions theo ma trận hỗ trợ thực tế của SDK
  - level1: Xác thực và bảo vệ kết nối MCP
    level2:
      - Xác định bề mặt truy cập của server STDIO và server HTTP
      - Thiết lập ranh giới xác thực cho endpoint MCP bằng Spring Security
      - Bảo vệ server HTTP bằng OAuth 2.0 Resource Server
      - Kiểm tra issuer, audience, thời hạn token và scope
      - Khám phá thông tin ủy quyền theo phiên bản đặc tả hỗ trợ
      - Cấu hình OAuth phía client và quản lý vòng đời access token
      - Đánh giá API key nội bộ và giới hạn so với chuẩn ủy quyền MCP
      - Áp dụng TLS, kiểm tra Origin và giới hạn địa chỉ lắng nghe
      - Phòng ngừa token passthrough và confused deputy
      - Đánh giá thư viện MCP Security cộng đồng theo mức hỗ trợ phiên bản
  - level1: Phân quyền công cụ và kiểm soát hành động
    level2:
      - Phân tách quyền khám phá danh mục với quyền thực thi công cụ
      - Ánh xạ vai trò và scope tới tool, resource và prompt
      - Thực thi kiểm tra quyền tại server cho từng lời gọi nghiệp vụ
      - Phân biệt lọc công cụ phía client với cơ chế cấp quyền phía server
      - Truyền danh tính đã xác thực qua request context đáng tin cậy
      - Cô lập tenant và quyền sở hữu đối tượng trong truy vấn dữ liệu
      - Thiết kế xác nhận của người dùng trước hành động có tác động
      - Quản lý trạng thái phê duyệt và từ chối khi quyền thay đổi
      - Ghi audit cho chủ thể, công cụ, quyết định quyền và kết quả
  - level1: An toàn dữ liệu và phòng chống lạm dụng công cụ
    level2:
      - Nhận diện prompt injection trong mô tả tool, resource và tool result
      - Giữ ranh giới giữa dữ liệu bên ngoài và chỉ dẫn của ứng dụng
      - Kiểm soát tham số nguy hiểm, path traversal và SSRF
      - Giới hạn lệnh, tệp và biến môi trường của server STDIO
      - Che dữ liệu cá nhân và thông tin bí mật trong phản hồi
      - Ngăn dữ liệu giữa các tenant lẫn vào cache hoặc ngữ cảnh hội thoại
      - Áp dụng quota, rate limit và giới hạn kích thước payload
      - Thẩm định server bên ngoài và thay đổi bất thường của danh mục công cụ
  - level1: Xử lý lỗi và tăng độ tin cậy khi gọi công cụ
    level2:
      - Phân loại lỗi validation, nghiệp vụ, xác thực, giao thức và mạng
      - Ánh xạ exception thành kết quả MCP mà không lộ thông tin nội bộ
      - Xử lý tool không tồn tại và schema không còn tương thích
      - Phối hợp timeout của mô hình, client, server và dịch vụ phía sau
      - Retry có giới hạn với backoff, jitter và điều kiện phù hợp
      - Ngăn thực thi lặp bằng idempotency key ở công cụ có tác động
      - Xử lý kết quả không xác định khi mất kết nối sau khi gửi yêu cầu
      - Áp dụng circuit breaker, bulkhead và giới hạn đồng thời
      - Lan truyền hủy yêu cầu và giải phóng tác vụ đang chạy
      - Thiết kế fallback và thông báo lỗi có thể hành động cho người dùng
      - Phục hồi client sau server restart mà không lặp thao tác nghiệp vụ
  - level1: Kiểm thử đơn vị và hợp đồng MCP
    level2:
      - Thiết kế ma trận kiểm thử theo capability, transport và quyền truy cập
      - Kiểm thử lớp nghiệp vụ độc lập với giao thức và mô hình AI
      - Kiểm chứng inputSchema và outputSchema của từng công cụ
      - Kiểm thử serialization cho dữ liệu Unicode, thời gian và đối tượng lồng nhau
      - Kiểm tra CallToolResult thành công và lỗi isError
      - Kiểm thử URI template, MIME type và nội dung resource
      - Kiểm thử prompt arguments và cấu trúc thông điệp trả về
      - Kiểm thử danh mục và hợp đồng để phát hiện thay đổi không tương thích
      - Kiểm thử phân quyền theo vai trò, tenant và đối tượng dữ liệu
  - level1: Kiểm thử tích hợp và các tình huống lỗi
    level2:
      - Chạy MCP Server thật trong kiểm thử tích hợp Spring Boot
      - Kiểm thử STDIO với tiến trình con và stdout không bị nhiễu
      - Kiểm thử Streamable HTTP cho cả WebMVC và WebFlux
      - Dùng MCP Inspector để kiểm tra độc lập với ChatClient
      - Kiểm thử khởi tạo, khám phá và đóng kết nối theo phiên bản
      - Tiêm lỗi arguments sai kiểu, thiếu trường và tool không tồn tại
      - Mô phỏng timeout, ngắt mạng, phản hồi hỏng và server dừng đột ngột
      - Kiểm thử token thiếu, hết hạn, sai audience và thiếu scope
      - Kiểm thử đồng thời, retry và chống ghi trùng với công cụ có tác động
      - Kiểm thử ChatClient bằng mô hình giả lập để có kết quả xác định
      - Kiểm thử đầu cuối với mô hình thật và đánh giá lựa chọn công cụ
  - level1: Quan sát hệ thống và tối ưu hiệu năng
    level2:
      - Liên kết hội thoại, request MCP và lời gọi dịch vụ bằng correlation ID
      - Thiết kế log có cấu trúc và che dữ liệu nhạy cảm
      - Theo dõi số lần gọi, độ trễ, tỷ lệ lỗi và timeout theo công cụ
      - Phân biệt MCP logging với log vận hành của ứng dụng
      - Truy vết qua ChatClient, MCP Client và MCP Server khi tích hợp cho phép
      - Đo chi phí token và tác động của kích thước danh mục công cụ
      - Tối ưu cache danh mục và resource với phạm vi quyền phù hợp
      - Đo tải cho mô hình đồng bộ, bất đồng bộ và luồng streaming
      - Xác định nghẽn ở thread pool, kết nối mạng và dịch vụ phụ thuộc
  - level1: Triển khai, vận hành và nâng cấp
    level2:
      - Đóng gói server STDIO và server HTTP theo môi trường chạy
      - Cấu hình secrets, tài khoản dịch vụ và quyền hệ điều hành tối thiểu
      - Thiết lập health check và readiness phù hợp từng transport
      - Triển khai sau gateway hoặc load balancer có hỗ trợ streaming
      - Mở rộng ngang theo yêu cầu session của phiên bản giao thức
      - Thiết kế graceful shutdown và xử lý kết nối đang hoạt động
      - Theo dõi hạn mức, cảnh báo và quy trình xử lý sự cố
      - Chẩn đoán sai endpoint, capability, cấu hình STDIO và quyền truy cập
      - Nâng cấp Spring AI và MCP Java SDK theo BOM cùng release notes
      - Rà soát thay đổi package, starter, annotation và transport khi nâng cấp
      - Kiểm thử tương thích trước phát hành và chuẩn bị phương án rollback
  - level1: Thực hành tổng hợp trợ lý nghiệp vụ dùng MCP
    level2:
      - Thiết kế trợ lý tra cứu tài liệu và quản lý yêu cầu hỗ trợ
      - Định nghĩa hợp đồng tools, resources và prompts cho bài thực hành
      - Xây dựng MCP Server cung cấp tra cứu và tạo yêu cầu hỗ trợ
      - Cung cấp tài liệu dưới dạng resource và mẫu xử lý dưới dạng prompt
      - Xây dựng MCP Client kết hợp ChatClient và nhiều công cụ
      - Thực hành chuyển từ STDIO sang Streamable HTTP
      - Áp dụng xác thực, phân quyền theo người dùng và xác nhận hành động
      - Kiểm thử dữ liệu sai, mất kết nối, hết hạn token và thao tác lặp
      - Đo độ trễ, chi phí gọi mô hình và độ đúng của kết quả
      - Đánh giá sản phẩm theo hợp đồng, bảo mật và khả năng phục hồi
