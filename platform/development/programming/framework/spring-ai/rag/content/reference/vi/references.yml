references:
  - title: "Spring AI - Getting Started"
    url: "https://docs.spring.io/spring-ai/reference/getting-started.html"
    description: "Thiết lập dependency management, starter và phiên bản Spring Boot/Spring AI tương thích."
  - title: "Spring AI - Chat Client API"
    url: "https://docs.spring.io/spring-ai/reference/api/chatclient.html"
    description: "Tạo ChatClient, cấu hình model, prompt và advisors cho ứng dụng Java."
  - title: "Spring AI - ETL Pipeline"
    url: "https://docs.spring.io/spring-ai/reference/api/etl-pipeline.html"
    description: "DocumentReader, DocumentTransformer, TokenTextSplitter, metadata và nạp vector."
  - title: "Spring AI - Embeddings Model API"
    url: "https://docs.spring.io/spring-ai/reference/api/embeddings.html"
    description: "EmbeddingModel, độ dài vector, ánh xạ text sang embedding và batch processing."
  - title: "Spring AI - Vector Databases"
    url: "https://docs.spring.io/spring-ai/reference/api/vectordbs.html"
    description: "VectorStore, similarity search, metadata và khả năng tích hợp nhiều vector database."
  - title: "Spring AI - PGvector"
    url: "https://docs.spring.io/spring-ai/reference/api/vectordbs/pgvector.html"
    description: "Cài PGvector starter, schema, index, topK và metadata filtering."
  - title: "Spring AI - Retrieval Augmented Generation"
    url: "https://docs.spring.io/spring-ai/reference/api/retrieval-augmented-generation.html"
    description: "QuestionAnswerAdvisor, RetrievalAugmentationAdvisor, document retriever và query augmentation."
  - title: "Spring AI - Advisors API"
    url: "https://docs.spring.io/spring-ai/reference/api/advisors.html"
    description: "Advisor chain và khả năng bổ sung ngữ cảnh cho ChatClient."
  - title: "Spring AI - Evaluation Testing"
    url: "https://docs.spring.io/spring-ai/reference/api/testing.html"
    description: "RelevancyEvaluator, EvaluationRequest và đánh giá RAG bằng integration tests."
  - title: "Spring AI - Observability"
    url: "https://docs.spring.io/spring-ai/reference/observability/index.html"
    description: "Metrics và tracing của ChatClient, ChatModel, EmbeddingModel và VectorStore."
  - title: "OWASP - LLM Prompt Injection Prevention"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/LLM_Prompt_Injection_Prevention_Cheat_Sheet.html"
    description: "Prompt injection gián tiếp và RAG poisoning; kiểm soát quyền, dữ liệu không tin cậy và logging."