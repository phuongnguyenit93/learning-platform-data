references:
  - title: "Spring AI — Getting Started"
    url: "https://docs.spring.io/spring-ai/reference/getting-started.html"
    description: "BOM, lựa chọn starter embedding/vector store và tương thích giữa các phiên bản Spring AI và Spring Boot."
  - title: "Spring AI — Embeddings Model API"
    url: "https://docs.spring.io/spring-ai/reference/api/embeddings.html"
    description: "EmbeddingModel, embed(String/Document), embedding dimension, response và các implementation."
  - title: "Spring AI — Ollama Embeddings"
    url: "https://docs.spring.io/spring-ai/reference/api/embeddings/ollama-embeddings.html"
    description: "Cấu hình và chạy mô hình embedding local bằng Ollama trong ứng dụng Spring AI."
  - title: "Spring AI — OpenAI Embeddings"
    url: "https://docs.spring.io/spring-ai/reference/api/embeddings/openai-embeddings.html"
    description: "Cấu hình embedding model từ provider bên ngoài và quản lý API key qua biến môi trường."
  - title: "Spring AI — Vector Databases"
    url: "https://docs.spring.io/spring-ai/reference/api/vectordbs.html"
    description: "VectorStore, VectorStoreRetriever, add/delete, similaritySearch, topK, threshold và metadata filtering."
  - title: "Spring AI — PGvector"
    url: "https://docs.spring.io/spring-ai/reference/api/vectordbs/pgvector.html"
    description: "Khởi tạo PGvector, embedding dimension, chỉ mục vector và tìm kiếm theo metadata."
  - title: "Spring AI — ETL Pipeline"
    url: "https://docs.spring.io/spring-ai/reference/api/etl-pipeline.html"
    description: "DocumentReader, DocumentTransformer, TokenTextSplitter và đưa documents vào VectorStore."
  - title: "Spring AI — Observability"
    url: "https://docs.spring.io/spring-ai/reference/observability/"
    description: "Metrics, tracing cho EmbeddingModel/VectorStore và lưu ý không log dữ liệu nhạy cảm."