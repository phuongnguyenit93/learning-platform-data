references:
  - title: "Spring Boot 3.3 — Calling REST Services"
    url: "https://docs.spring.io/spring-boot/3.3/reference/io/rest-client.html"
    description: "RestClient, WebClient và builder được Boot cấu hình để gọi API ngoài theo mô hình blocking hoặc reactive."
  - title: "Spring Boot 3.3 — SQL Databases"
    url: "https://docs.spring.io/spring-boot/3.3/reference/data/sql.html"
    description: "Cấu hình DataSource, tài nguyên kết nối và tích hợp JDBC, JPA, Spring Data."
  - title: "Spring Boot 3.3 — Working with NoSQL Technologies"
    url: "https://docs.spring.io/spring-boot/3.3/reference/data/nosql.html"
    description: "Hỗ trợ tự cấu hình client và thành phần truy cập Redis, MongoDB cùng các kho NoSQL khác."
  - title: "Spring Boot 3.3 — Caching"
    url: "https://docs.spring.io/spring-boot/3.3/reference/io/caching.html"
    description: "Kích hoạt bộ nhớ đệm, chọn CacheManager và cấu hình nhà cung cấp cache."
  - title: "Spring Boot 3.3 — AMQP"
    url: "https://docs.spring.io/spring-boot/3.3/reference/messaging/amqp.html"
    description: "Cấu hình RabbitMQ, gửi nhận thông điệp và tùy chỉnh template hoặc listener."
  - title: "Spring Boot 3.3 — Apache Kafka Support"
    url: "https://docs.spring.io/spring-boot/3.3/reference/messaging/kafka.html"
    description: "Cấu hình KafkaTemplate, listener, producer, consumer và hỗ trợ giao dịch Kafka."
  - title: "Spring Boot 3.3 — Spring Integration"
    url: "https://docs.spring.io/spring-boot/3.3/reference/messaging/spring-integration.html"
    description: "Tích hợp framework Spring Integration vào Boot, cấu hình poller và các module hỗ trợ."
  - title: "Overview of Spring Integration Framework"
    url: "https://docs.spring.io/spring-integration/reference/overview.html"
    description: "Mẫu tích hợp, Message, Channel, Endpoint và adapter; chọn phiên bản tương thích với thư viện của dự án."
  - title: "Spring Integration — Error Handling"
    url: "https://docs.spring.io/spring-integration/reference/error-handling.html"
    description: "Cách lỗi được truyền trong luồng thông điệp và vai trò của errorChannel khi xử lý bất đồng bộ."
  - title: "RFC 9110 — HTTP Semantics"
    url: "https://www.rfc-editor.org/rfc/rfc9110.html"
    description: "Ngữ nghĩa phương thức, mã trạng thái và tính idempotent làm cơ sở quyết định khi nào có thể gửi lại yêu cầu HTTP."
  - title: "Spring Boot 3.3 — Testcontainers"
    url: "https://docs.spring.io/spring-boot/3.3/reference/testing/testcontainers.html"
    description: "Kiểm thử với hạ tầng chạy trong container, quản lý vòng đời và hỗ trợ ServiceConnection."
  - title: "Spring Boot 3.3 — Observability"
    url: "https://docs.spring.io/spring-boot/3.3/reference/actuator/observability.html"
    description: "Log, metric, trace và Micrometer Observation để theo dõi hành vi của các kết nối tích hợp."
