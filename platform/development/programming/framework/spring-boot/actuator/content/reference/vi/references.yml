references:
  - title: "Spring Boot 3.3 — Production-ready Features"
    url: "https://docs.spring.io/spring-boot/3.3/reference/actuator/index.html"
    description: "Tổng quan khả năng theo dõi và quản trị ứng dụng qua Actuator, HTTP và JMX."
  - title: "Spring Boot 3.3 — Endpoints"
    url: "https://docs.spring.io/spring-boot/3.3/reference/actuator/endpoints.html"
    description: "Bật và công bố endpoint, bảo vệ truy cập, health group, probe và endpoint tùy chỉnh."
  - title: "Spring Boot 3.3 — Monitoring and Management Over HTTP"
    url: "https://docs.spring.io/spring-boot/3.3/reference/actuator/monitoring.html"
    description: "Cấu hình đường dẫn, cổng và địa chỉ máy chủ quản trị trong ứng dụng Servlet hoặc Reactive."
  - title: "Spring Boot 3.3 — Metrics"
    url: "https://docs.spring.io/spring-boot/3.3/reference/actuator/metrics.html"
    description: "Micrometer MeterRegistry, phép đo tự cấu hình và xuất metric sang hệ thống giám sát."
  - title: "Spring Boot 3.3 — Tracing"
    url: "https://docs.spring.io/spring-boot/3.3/reference/actuator/tracing.html"
    description: "Cầu nối Micrometer Tracing, cấu hình lấy mẫu, liên kết log và truyền ngữ cảnh qua lời gọi dịch vụ."
  - title: "Spring Boot 3.3 — Observability"
    url: "https://docs.spring.io/spring-boot/3.3/reference/actuator/observability.html"
    description: "ObservationRegistry, thông tin có số lượng giá trị thấp/cao và truyền ngữ cảnh giữa luồng hoặc chuỗi reactive."
  - title: "Spring Boot 3.3 — Loggers"
    url: "https://docs.spring.io/spring-boot/3.3/reference/actuator/loggers.html"
    description: "Đọc và thay đổi mức ghi log của ứng dụng trong lúc chạy."
  - title: "Spring Boot 3.3 Actuator API — Health (health)"
    url: "https://docs.spring.io/spring-boot/3.3/api/rest/actuator/health.html"
    description: "Định dạng yêu cầu và phản hồi health, trạng thái thành phần và quyền hiển thị chi tiết."
  - title: "Spring Boot 3.3 Actuator API — Metrics (metrics)"
    url: "https://docs.spring.io/spring-boot/3.3/api/rest/actuator/metrics.html"
    description: "Liệt kê và kiểm tra phép đo đã đăng ký; endpoint này phục vụ chẩn đoán, không thay hệ thống lưu trữ metric."
  - title: "Spring Boot 3.3 Actuator API — Prometheus (prometheus)"
    url: "https://docs.spring.io/spring-boot/3.3/api/rest/actuator/prometheus.html"
    description: "Định dạng metric mà Prometheus thu thập từ endpoint được cấu hình và công bố."
  - title: "Micrometer — Meters"
    url: "https://docs.micrometer.io/micrometer/reference/concepts/meters.html"
    description: "Counter, Gauge, Timer và định danh phép đo bằng tên/nhãn; đối chiếu phiên bản Micrometer của dự án."
