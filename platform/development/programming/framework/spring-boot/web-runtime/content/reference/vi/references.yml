references:
  - title: "Spring Boot 3.3 — Servlet Web Applications"
    url: "https://docs.spring.io/spring-boot/3.3/reference/web/servlet.html"
    description: "Tự cấu hình Spring MVC, chuyển đổi dữ liệu HTTP, xử lý lỗi, máy chủ Servlet nhúng và phiên."
  - title: "Spring Boot 3.3 — Reactive Web Applications"
    url: "https://docs.spring.io/spring-boot/3.3/reference/web/reactive.html"
    description: "Tự cấu hình WebFlux, codec, xử lý lỗi và máy chủ reactive nhúng."
  - title: "Spring Boot 3.3 — Embedded Web Servers"
    url: "https://docs.spring.io/spring-boot/3.3/how-to/webserver.html"
    description: "Chọn máy chủ, cấu hình cổng, HTTPS, nén phản hồi và hoạt động sau proxy."
  - title: "Spring Boot 3.3 — Graceful Shutdown"
    url: "https://docs.spring.io/spring-boot/3.3/reference/web/graceful-shutdown.html"
    description: "Cấu hình dừng an toàn, thời gian chờ và cách từng máy chủ xử lý yêu cầu trong giai đoạn dừng."
  - title: "Spring Boot 3.3 — Testing Spring Boot Applications"
    url: "https://docs.spring.io/spring-boot/3.3/reference/testing/spring-boot-applications.html"
    description: "Phân biệt môi trường web giả lập với máy chủ thật; dùng RANDOM_PORT để kiểm chứng HTTP khi chạy."
  - title: "Spring Framework — DispatcherServlet"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet.html"
    description: "Vai trò bộ điều phối trung tâm của Spring MVC và các thành phần tham gia xử lý yêu cầu; đối chiếu phiên bản Framework của dự án."
  - title: "Spring Framework — DispatcherHandler"
    url: "https://docs.spring.io/spring-framework/reference/web/webflux/dispatcher-handler.html"
    description: "Bộ điều phối WebFlux, chuỗi WebFilter và các thành phần ánh xạ, thực thi, xử lý kết quả; đối chiếu phiên bản của dự án."
  - title: "Spring Framework — WebFlux Overview"
    url: "https://docs.spring.io/spring-framework/reference/web/webflux/new-framework.html"
    description: "Mô hình non-blocking, backpressure và so sánh cách xử lý đồng thời giữa MVC với WebFlux."
  - title: "Spring Framework — Asynchronous Requests"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-ann-async.html"
    description: "Servlet bất đồng bộ trong Spring MVC và sự khác biệt với WebFlux; xử lý bất đồng bộ không tự bảo đảm toàn bộ I/O là non-blocking."
