references:
  - title: "Spring Boot 3.3 — Build Systems"
    url: "https://docs.spring.io/spring-boot/3.3/reference/using/build-systems.html"
    description: "Vai trò Maven, Gradle, starter và BOM spring-boot-dependencies trong quản lý build."
  - title: "Spring Boot 3.3 — Gradle Plugin"
    url: "https://docs.spring.io/spring-boot/3.3/gradle-plugin/index.html"
    description: "Khả năng của plugin và các phiên bản Gradle tương thích với Spring Boot 3.3."
  - title: "Spring Boot 3.3 — Managing Dependencies"
    url: "https://docs.spring.io/spring-boot/3.3/gradle-plugin/managing-dependencies.html"
    description: "Dùng dependency-management plugin hoặc BOM của Gradle và kiểm soát phiên bản thư viện."
  - title: "Spring Boot 3.3 — Gradle: Packaging Executable Archives"
    url: "https://docs.spring.io/spring-boot/3.3/gradle-plugin/packaging.html"
    description: "Task bootJar, bootWar, gói plain, main class, providedRuntime và phân lớp archive."
  - title: "Spring Boot 3.3 — Maven: Packaging Executable Archives"
    url: "https://docs.spring.io/spring-boot/3.3/maven-plugin/packaging.html"
    description: "Goal repackage, cấu trúc gói, classifier, main class và outputTimestamp cho archive tái lập."
  - title: "Spring Boot 3.3 — Nested JARs"
    url: "https://docs.spring.io/spring-boot/3.3/specification/executable-jar/nested-jars.html"
    description: "Cấu trúc BOOT-INF của JAR, WEB-INF của WAR, dependency lồng nhau và chỉ mục lớp đóng gói."
  - title: "Spring Boot 3.3 — Traditional Deployment"
    url: "https://docs.spring.io/spring-boot/3.3/how-to/deployment/traditional-deployment.html"
    description: "SpringBootServletInitializer, dependency container được cung cấp bên ngoài và giới hạn triển khai WAR của WebFlux."
  - title: "Spring Boot 3.3 — Packaging OCI Images"
    url: "https://docs.spring.io/spring-boot/3.3/gradle-plugin/packaging-oci-image.html"
    description: "Tạo image bằng bootBuildImage, Cloud Native Buildpacks, Docker daemon và cấu hình builder/runtime."
  - title: "Apache Maven — Introduction to the Build Lifecycle"
    url: "https://maven.apache.org/guides/introduction/introduction-to-the-lifecycle.html"
    description: "Quan hệ giữa phase, plugin goal và các bước compile, test, package, verify, install, deploy."
  - title: "Gradle — Gradle Wrapper"
    url: "https://docs.gradle.org/current/userguide/gradle_wrapper.html"
    description: "Kiểm soát phiên bản Gradle và chạy build qua wrapper; đối chiếu tài liệu với phiên bản dự án sử dụng."
  - title: "Gradle — Toolchains for JVM projects"
    url: "https://docs.gradle.org/current/userguide/toolchains.html"
    description: "Lựa chọn JDK cho biên dịch, kiểm thử và chạy tác vụ; phân biệt toolchain với JVM chạy Gradle và Java đích."
