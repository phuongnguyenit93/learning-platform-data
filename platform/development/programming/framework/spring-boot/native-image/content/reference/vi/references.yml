references:
  - title: "Spring Boot 3.3: Giới thiệu GraalVM Native Image"
    url: "https://docs.spring.io/spring-boot/3.3/reference/packaging/native-image/introducing-graalvm-native-images.html"
    description: "Mô hình thực thi native, Spring AOT, giả định thế giới đóng và giới hạn thay đổi tập bean."
  - title: "Spring Boot 3.3: Yêu cầu hệ thống"
    url: "https://docs.spring.io/spring-boot/3.3/system-requirements.html"
    description: "Đối chiếu phiên bản Java, công cụ dựng và hỗ trợ GraalVM Native Image của nhánh Spring Boot 3.3."
  - title: "Spring Boot 3.3: Xây dựng ứng dụng native đầu tiên"
    url: "https://docs.spring.io/spring-boot/3.3/how-to/native-image/developing-your-first-application.html"
    description: "Chuẩn bị môi trường, tạo tệp thực thi bằng Native Build Tools và tạo container native bằng Buildpacks."
  - title: "GraalVM Native Build Tools 0.10.6: Plugin Gradle"
    url: "https://graalvm.github.io/native-build-tools/0.10.6/gradle-plugin.html"
    description: "Cấu hình công cụ, nativeCompile, nativeRun, nativeTest và tích hợp kho metadata cho thư viện."
  - title: "Spring Boot 3.3: Chủ đề native nâng cao"
    url: "https://docs.spring.io/spring-boot/3.3/reference/packaging/native-image/advanced-topics.html"
    description: "RuntimeHintsRegistrar, kiểm thử runtime hint, thu thập metadata và xử lý thư viện chưa được hỗ trợ đầy đủ."
  - title: "Spring Boot 3.3: Kiểm thử GraalVM Native Image"
    url: "https://docs.spring.io/spring-boot/3.3/how-to/native-image/testing-native-applications.html"
    description: "Kiểm thử sau xử lý AOT trên JVM và chạy kiểm thử trong tệp thực thi native."
  - title: "GraalVM cho JDK 21: Metadata về truy cập động (Reachability Metadata)"
    url: "https://www.graalvm.org/jdk21/reference-manual/native-image/metadata/"
    description: "Khai báo các phần chương trình được truy cập động, gồm reflection, tài nguyên, proxy và serialization."
  - title: "GraalVM cho JDK 21: Thu thập metadata bằng Tracing Agent"
    url: "https://www.graalvm.org/jdk21/reference-manual/native-image/metadata/AutomaticMetadataCollection/"
    description: "Thu thập và lọc metadata khi chạy trên JVM; kết quả chỉ phản ánh những đường chạy đã được thực thi."
  - title: "GraalVM cho JDK 21: Khởi tạo lớp trong Native Image"
    url: "https://www.graalvm.org/jdk21/reference-manual/native-image/optimizations-and-performance/ClassInitialization/"
    description: "Phân biệt khởi tạo lớp khi dựng và khi chạy, cùng các ràng buộc liên quan đến trạng thái tĩnh."
  - title: "GraalVM cho JDK 21: Báo cáo quá trình dựng Native Image"
    url: "https://www.graalvm.org/jdk21/reference-manual/native-image/overview/BuildOutput/"
    description: "Đọc các giai đoạn dựng, kích thước đầu ra và thống kê sử dụng tài nguyên của quá trình biên dịch."