references:
  - title: "Developing Your First Spring Boot Application"
    url: "https://docs.spring.io/spring-boot/3.3/tutorial/first-application/"
    description: "Hướng dẫn tạo, chạy và đóng gói ứng dụng đầu tiên, giới thiệu các cơ chế chính của Spring Boot."
  - title: "Build Systems"
    url: "https://docs.spring.io/spring-boot/3.3/reference/using/build-systems.html"
    description: "Starter, quản lý phụ thuộc và vai trò Maven hoặc Gradle trong dự án Spring Boot."
  - title: "Structuring Your Code"
    url: "https://docs.spring.io/spring-boot/3.3/reference/using/structuring-your-code.html"
    description: "Bố trí gói mã nguồn, vị trí lớp main và phạm vi tìm thành phần."
  - title: "Spring Beans and Dependency Injection"
    url: "https://docs.spring.io/spring-boot/3.3/reference/using/spring-beans-and-dependency-injection.html"
    description: "Khai báo thành phần Spring và kết nối phụ thuộc qua hàm khởi tạo."
  - title: "Auto-configuration"
    url: "https://docs.spring.io/spring-boot/3.3/reference/using/auto-configuration.html"
    description: "Cấu hình tự động, thay thế cấu hình mặc định và quan sát báo cáo điều kiện."
  - title: "Externalized Configuration"
    url: "https://docs.spring.io/spring-boot/3.3/reference/features/external-config.html"
    description: "Nguồn thuộc tính, thứ tự ghi đè và liên kết giá trị cấu hình vào ứng dụng."
  - title: "SpringApplication"
    url: "https://docs.spring.io/spring-boot/3.3/reference/features/spring-application.html"
    description: "Khởi động ứng dụng, loại ngữ cảnh, tác vụ sau khởi tạo và chẩn đoán lỗi."
  - title: "Testing Spring Boot Applications"
    url: "https://docs.spring.io/spring-boot/3.3/reference/testing/spring-boot-applications.html"
    description: "Điểm bắt đầu kiểm chứng ngữ cảnh và hành vi ứng dụng bằng công cụ kiểm thử Spring Boot."