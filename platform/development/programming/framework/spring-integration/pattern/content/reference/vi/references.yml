references:
  - title: "Spring Integration — Overview"
    url: "https://docs.spring.io/spring-integration/reference/overview.html"
    description: "Giải thích EIP, thông điệp, kênh và thành phần xử lý trong Spring Integration."
  - title: "Spring Integration — Message Channels"
    url: "https://docs.spring.io/spring-integration/reference/channel.html"
    description: "Point-to-point, publish-subscribe, interceptors và đặc tính của các kênh."
  - title: "Spring Integration — Message Routing"
    url: "https://docs.spring.io/spring-integration/reference/message-routing.html"
    description: "Tổng hợp tài liệu về router, filter, splitter, aggregator, resequencer và scatter-gather."
  - title: "Spring Integration — Filter"
    url: "https://docs.spring.io/spring-integration/reference/filter.html"
    description: "Chọn, loại bỏ hoặc chuyển hướng thông điệp bị từ chối bằng Filter và discard channel."
  - title: "Spring Integration — Content Enricher"
    url: "https://docs.spring.io/spring-integration/reference/content-enrichment.html"
    description: "Làm giàu payload và headers khi trao đổi thông điệp."
  - title: "Spring Integration — Splitter"
    url: "https://docs.spring.io/spring-integration/reference/splitter.html"
    description: "Chia thông điệp và cung cấp các correlation/sequence headers cho nhánh xử lý."
  - title: "Spring Integration — Aggregator"
    url: "https://docs.spring.io/spring-integration/reference/aggregator.html"
    description: "Gom nhóm thông điệp, correlation, release strategy và xử lý nhóm hết hạn."
  - title: "Spring Integration — Messaging Gateways"
    url: "https://docs.spring.io/spring-integration/reference/gateway.html"
    description: "Cổng request-reply, @MessagingGateway và timeout cho các luồng tích hợp."
  - title: "Spring Integration — Scatter-Gather"
    url: "https://docs.spring.io/spring-integration/reference/scatter-gather.html"
    description: "Phân phối yêu cầu cho nhiều nhánh và tổng hợp phản hồi."
  - title: "Spring Integration — Idempotent Receiver"
    url: "https://docs.spring.io/spring-integration/reference/handler-advice/idempotent-receiver.html"
    description: "Cách nhận diện, đánh dấu hoặc loại bỏ thông điệp trùng trước xử lý."