references:
  - title: "Spring Integration — Configuring Message Channels"
    url: "https://docs.spring.io/spring-integration/reference/channel/configuration.html"
    description: "Cấu hình DirectChannel, ExecutorChannel, QueueChannel và đặc tính thực thi."
  - title: "Spring Integration — Message Endpoints"
    url: "https://docs.spring.io/spring-integration/reference/endpoint.html"
    description: "Event-driven consumer, polling consumer, poller, trigger và TaskExecutor."
  - title: "Spring Integration — Error Handling"
    url: "https://docs.spring.io/spring-integration/reference/7.0/error-handling.html"
    description: "Exception đồng bộ, ErrorMessage, errorChannel và xử lý lỗi bất đồng bộ."
  - title: "Spring Integration — Transaction Support"
    url: "https://docs.spring.io/spring-integration/reference/transactions.html"
    description: "Transaction boundary trong message flow, poller và các ngữ cảnh thực thi."
  - title: "Spring Integration — Control Bus"
    url: "https://docs.spring.io/spring-integration/reference/control-bus.html"
    description: "Điều khiển và quản lý bean/endpoint đang chạy qua message."
  - title: "Spring Integration — Metrics and Management"
    url: "https://docs.spring.io/spring-integration/reference/metrics.html"
    description: "Micrometer metrics, observation và quản lý channel, handler, source."