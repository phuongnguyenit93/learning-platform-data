references:
  - title: "Spring Integration — Overview of the Framework"
    url: "https://docs.spring.io/spring-integration/reference/overview.html"
    description: "Giải thích mô hình message-driven, Enterprise Integration Patterns, nguyên tắc tách trách nhiệm và các thành phần của framework."
  - title: "Spring Integration — Core Messaging"
    url: "https://docs.spring.io/spring-integration/reference/core.html"
    description: "Tài liệu chính thức về Message, MessageChannel, endpoint, các pattern cơ bản và cơ chế xử lý thông điệp."
  - title: "Spring Integration — Message"
    url: "https://docs.spring.io/spring-integration/reference/message.html"
    description: "Mô tả cấu trúc payload, headers và các metadata như replyChannel, errorChannel trong thông điệp."
  - title: "Spring Integration — Message Channels"
    url: "https://docs.spring.io/spring-integration/reference/channel.html"
    description: "Giải thích các loại channel, mô hình phân phối thông điệp và cách cấu hình kết nối producer-consumer."
  - title: "Spring Integration — Working with Message Flows"
    url: "https://docs.spring.io/spring-integration/reference/dsl/java-flows.html"
    description: "Hướng dẫn xây dựng IntegrationFlow bằng Java DSL và lắp ghép các endpoint trong luồng."
