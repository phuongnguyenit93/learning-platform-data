  - Điều kiện cache theo HTTP method, status và Cache-Control
  - Cấu hình dung lượng và thời gian sống theo tuyến
  - Tương tác với max-age và các yêu cầu có điều kiện
  - Giới hạn cache cục bộ khi gateway có nhiều bản sao
  - Ngăn cache nhầm dữ liệu theo người dùng hoặc khách hàng
  - Đo tỷ lệ cache hit và kiểm chứng tính đúng đắn của phản hồi
- level1: Bộ lọc tùy biến
  level2:
