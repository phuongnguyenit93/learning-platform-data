  - Chọn implementation Resilience4j phù hợp với web stack
  - Các trạng thái đóng, mở, thử lại và cách đo tỷ lệ lỗi
  - Cấu hình tên circuit breaker, cửa sổ đo và ngưỡng
  - Kích hoạt theo exception hoặc mã HTTP được chỉ định
  - fallbackUri và endpoint dự phòng nội bộ
  - FallbackHeaders và thông tin lỗi được phép chuyển tiếp
  - Phối hợp circuit breaker với timeout và cơ chế thử lại
  - Tránh fallback gây đệ quy hoặc che mất lỗi nghiệp vụ
- level1: Thử lại yêu cầu
  level2:
