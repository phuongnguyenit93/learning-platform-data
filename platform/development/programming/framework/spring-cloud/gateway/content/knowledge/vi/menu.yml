  - Kiểm tra định nghĩa tuyến trước khi phát hành
  - Phiên bản cấu hình, kiểm toán thay đổi và khôi phục tuyến
  - Bảo vệ URI đích, biểu thức và tham số của cấu hình động
- level1: Quản trị Actuator
  level2:
