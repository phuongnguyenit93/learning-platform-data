  - Chạy công việc chặn luồng ngoài event loop khi thực sự cần
  - Tránh gọi subscribe() thủ công hoặc block() trong chuỗi xử lý
  - Truyền dữ liệu qua exchange attributes và Reactor Context
  - Kiểm thử hợp đồng của bộ lọc cùng các bộ lọc có sẵn
  - Đóng gói bộ lọc dùng chung và quản lý tương thích phiên bản
