  - Khoảng chờ tăng dần và giới hạn tổng thời gian xử lý
  - Tính lặp an toàn của GET so với thao tác ghi dữ liệu
  - Idempotency key cho nghiệp vụ có nguy cơ thực hiện lặp
  - Lưu request body khi thử lại và chi phí bộ nhớ
  - Thử lại với forward nội bộ và điều kiện response chưa commit
  - Tương tác với load balancer và cơ chế thử lại của dịch vụ
  - Tránh khuếch đại tải khi nhiều tầng cùng thử lại
- level1: Bộ nhớ đệm
  level2:
