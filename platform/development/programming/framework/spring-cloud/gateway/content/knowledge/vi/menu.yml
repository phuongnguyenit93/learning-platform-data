  - Lớp Config, ánh xạ args và kiểm tra cấu hình đầu vào
  - Quy tắc đặt tên factory và shortcutFieldOrder
  - Viết GlobalFilter và lựa chọn thứ tự có chủ đích
  - Viết AbstractRoutePredicateFactory tùy biến
  - Thay đổi request và response bằng các decorator phù hợp
