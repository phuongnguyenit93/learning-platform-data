- level1: Cấu hình tuyến
  level2:
  - Các trường id, uri, order, predicates, filters và metadata
  - 'URI đích với http:, https:, lb:, ws:, wss: và forward: theo khả năng hỗ trợ'
  - Ý nghĩa đường dẫn trong URI đích và cấu hình rewrite riêng
  - Cú pháp rút gọn so với khai báo name và args đầy đủ
  - Java DSL và kết hợp điều kiện and, or, negate
  - Thứ tự ưu tiên khi nhiều tuyến cùng khớp
  - Tuyến tổng quát, tuyến chuyên biệt và nguy cơ bắt nhầm yêu cầu
  - Biến URI được trích xuất từ Path hoặc Host
  - Default filters và phạm vi áp dụng cho các tuyến
  - Metadata riêng của tuyến và giới hạn cấu hình phụ thuộc phiên bản
- level1: Điều kiện định tuyến
  level2:
  - 'Path: mẫu đường dẫn, biến URI và dấu gạch chéo cuối'
  - 'Host: khớp tên miền, tên miền con và biến mẫu'
  - 'Method: chọn tuyến theo một hoặc nhiều HTTP method'
  - 'Header: kiểm tra header và biểu thức chính quy'
  - 'Query: kiểm tra tên và giá trị query parameter'
  - 'Cookie: điều kiện trên tên và giá trị cookie'
  - 'After, Before và Between: định tuyến theo thời gian và múi giờ'
  - 'RemoteAddr: địa chỉ IP, CIDR và bộ phân giải địa chỉ'
  - XForwardedRemoteAddr và giới hạn tin cậy proxy theo phiên bản hỗ trợ
  - 'Weight: chia lưu lượng theo nhóm và trọng số'
  - Version và ApiVersionStrategy cho định tuyến theo phiên bản API khi được hỗ trợ
  - ReadBody qua Java DSL và giới hạn lưu request body
  - Phối hợp predicate và kiểm tra điều kiện thực tế của một yêu cầu
  - Tác động của base path, mã hóa URL và chuẩn hóa đường dẫn
- level1: Chuỗi bộ lọc
  level2:
  - Phân biệt GatewayFilter, GlobalFilter và GatewayFilterFactory
  - Cách kết hợp global filter với bộ lọc riêng của tuyến
  - Ordered và thứ tự thực thi trước/sau theo chiều đảo ngược
  - OrderedGatewayFilter và thứ tự bộ lọc trong Java DSL
  - Tiếp tục chuỗi bằng chain.filter(exchange)
  - Kết thúc sớm với phản hồi trực tiếp tại gateway
  - Thao tác trước khi response được commit
  - Tương tác thứ tự giữa rewrite, load balancing, retry và bảo mật
  - Đối chiếu chuỗi bộ lọc đang chạy với cấu hình khai báo
- level1: Đường dẫn và chuyển hướng
  level2:
  - 'StripPrefix: bỏ các đoạn đầu đường dẫn'
  - 'PrefixPath: thêm tiền tố cho yêu cầu phía sau'
  - 'SetPath: đặt đường dẫn bằng URI template'
  - 'RewritePath: thay thế đường dẫn bằng biểu thức chính quy'
  - Escape ký tự thay thế trong YAML và Java DSL
  - 'RedirectTo: chuyển hướng client và lựa chọn mã HTTP'
  - 'RewriteLocationResponseHeader: sửa Location từ dịch vụ phía sau'
  - 'RewriteResponseHeader: sửa giá trị header bằng biểu thức chính quy'
  - Phân biệt rewrite nội bộ, forward nội bộ và redirect ra client
  - Giữ query string, dấu gạch chéo và ký tự mã hóa khi đổi đường dẫn
- level1: Header yêu cầu
  level2:
  - 'AddRequestHeader và SetRequestHeader: thêm hoặc thay thế giá trị'
  - AddRequestHeadersIfNotPresent và điều kiện bổ sung header
  - RemoveRequestHeader và loại bỏ dữ liệu không được chuyển tiếp
  - MapRequestHeader và ánh xạ giá trị giữa các header
  - AddRequestParameter và RemoveRequestParameter
  - PreserveHostHeader và SetRequestHostHeader
  - RequestHeaderToRequestUri và kiểm soát đích chuyển tiếp
  - Forwarded, X-Forwarded-* và thông tin proxy được tin cậy
  - RemoveHopByHop và các header dành riêng từng chặng
  - Giới hạn kích thước header bằng RequestHeaderSize khi được hỗ trợ
  - Giữ định danh yêu cầu và ngăn client giả mạo header nội bộ
- level1: Header và trạng thái
  level2:
  - AddResponseHeader và SetResponseHeader
  - RemoveResponseHeader và loại bỏ thông tin triển khai
  - DedupeResponseHeader khi gateway và dịch vụ cùng ghi header
  - SecureHeaders và tùy chỉnh chính sách header bảo mật
  - SetStatus và hợp đồng mã HTTP trả về client
  - Đổi URI đích qua Java DSL và kiểm soát exchange attributes
  - Xử lý Content-Length, Transfer-Encoding và nội dung được biến đổi
  - Cookie, thuộc tính Set-Cookie và tác động của proxy
  - Đồng bộ header, body và mã trạng thái khi tạo phản hồi tại gateway
- level1: Nội dung HTTP
  level2:
  - Vì sao request body thường chỉ được đọc một lần trong WebFlux
  - CacheRequestBody và tái sử dụng nội dung đã đọc
  - ModifyRequestBody qua Java DSL và chuyển đổi dữ liệu đầu vào
  - ModifyResponseBody qua Java DSL và chuyển đổi dữ liệu trả về
  - RewriteRequestParameter và quy tắc thay query parameter
  - RemoveJsonAttributesResponseBody và loại bỏ trường JSON
  - RequestSize và giới hạn kích thước tải lên
  - JSON, form, multipart và lựa chọn bộ chuyển đổi nội dung
  - Giới hạn bộ đệm codec và DataBufferLimitException
  - DataBuffer, giữ/thả bộ đệm và phòng tránh rò rỉ bộ nhớ
  - Bộ đệm toàn bộ nội dung so với truyền dữ liệu theo luồng
  - Che dữ liệu nhạy cảm khi ghi log request hoặc response body
- level1: Khám phá và cân bằng tải
  level2:
  - Tuyến cố định so với tuyến dùng định danh dịch vụ lb://
  - Tích hợp Spring Cloud LoadBalancer với Gateway Server WebFlux
  - ReactiveLoadBalancerClientFilter và phân giải ServiceInstance
  - Kết nối DiscoveryClient với Eureka, Consul hoặc nguồn dịch vụ phù hợp
  - DiscoveryClient Route Definition Locator
  - Predicate và filter mặc định của các tuyến tự sinh
  - Tùy chỉnh điều kiện đưa dịch vụ vào danh sách tuyến
  - Định danh dịch vụ, chữ hoa/thường và quy tắc đường dẫn
  - Lựa chọn instance, trạng thái isSecure và giao thức phía sau
  - Xử lý không có instance khả dụng và phản hồi 503 hoặc 404
  - Tương tác giữa khám phá dịch vụ, cache và thay đổi danh sách instance
  - Kiểm soát dịch vụ nội bộ được phép công bố qua discovery
- level1: Kết nối và TLS
  level2:
  - Phân biệt kết nối client–gateway với kết nối gateway–dịch vụ
  - Cấu hình TLS đầu vào và chứng chỉ của gateway
  - Trust store, chứng chỉ phía sau và xác minh tên máy chủ
  - Xác thực hai chiều mTLS khi triển khai và phiên bản hỗ trợ
  - Thời gian chờ kết nối, phản hồi và bắt tay TLS
  - Ghi đè thời gian chờ theo route metadata và đơn vị cấu hình
  - Connection pool, giới hạn kết nối và hàng đợi chờ
  - Keep-alive, thời gian nhàn rỗi và vòng đời kết nối
  - Phân giải DNS và thay đổi địa chỉ dịch vụ
  - HttpClientCustomizer và tùy biến Reactor Netty HttpClient
  - Cấu hình proxy đầu ra khi môi trường triển khai yêu cầu
- level1: CORS
  level2:
  - Same-origin, cross-origin và vai trò CORS tại gateway
  - Yêu cầu đơn giản so với preflight OPTIONS
  - Cấu hình CORS toàn cục cho Gateway Server WebFlux
  - Cấu hình CORS bằng metadata của từng tuyến
  - Preflight không khớp route predicate và simple URL handler mapping
  - Allowed origins, methods, headers và exposed headers
  - Credentials, wildcard origin và thời gian cache preflight
  - Phối hợp CORS giữa gateway, Spring Security và dịch vụ phía sau
  - Chẩn đoán header CORS bị trùng hoặc preflight bị từ chối
- level1: Xác thực và phân quyền
  level2:
  - Ranh giới xác thực tại gateway và kiểm tra quyền tại dịch vụ
  - Tích hợp Spring Security với SecurityWebFilterChain
  - OAuth 2.0 Resource Server và xác minh JWT
  - Kiểm tra issuer, audience, thời hạn và chữ ký token
  - Phân quyền theo đường dẫn, HTTP method, role và scope
  - Tách tuyến công khai, tuyến cần đăng nhập và tuyến quản trị
  - Chuẩn hóa phản hồi 401, 403 và lỗi xác thực
  - Token dạng opaque và tích hợp introspection khi phù hợp
  - CSRF theo mô hình client dùng cookie hoặc bearer token
  - Chuyển tiếp danh tính xuống dịch vụ trong ranh giới tin cậy
  - Quản lý khóa xác minh, cache JWK và thay đổi khóa của nhà cung cấp danh tính
- level1: Phiên đăng nhập và token
  level2:
  - Gateway làm OAuth 2.0 Client và đăng nhập bằng OpenID Connect
  - TokenRelay và chuyển access token đến dịch vụ phía sau
  - OAuth2AuthorizedClient và lựa chọn client registration
  - Phân biệt relay token hiện có với cấp token hoặc trao đổi token
  - Lưu trạng thái authorized client và giới hạn lưu trữ trong bộ nhớ
  - SaveSession và thời điểm lưu phiên trước khi chuyển tiếp
  - Spring Session và chia sẻ phiên khi chạy nhiều bản sao
  - Cookie phiên, SameSite, Secure và đường dẫn phía sau proxy
  - Đăng xuất, token hết hạn và vòng đời phiên của người dùng
  - Ngăn ghi log hoặc chuyển token đến đích không được tin cậy
- level1: Giới hạn lưu lượng
  level2:
  - Giới hạn tần suất, giới hạn đồng thời và hạn mức sử dụng
  - RequestRateLimiter và phản hồi HTTP 429
  - 'Token bucket: tốc độ nạp, dung lượng và chi phí mỗi yêu cầu'
  - RedisRateLimiter và dependency Redis reactive
  - replenishRate, burstCapacity và requestedTokens
  - KeyResolver theo người dùng, khách hàng, API key hoặc địa chỉ IP
  - Khóa rỗng, deny-empty-key và nguy cơ chọn khóa không tin cậy
  - Hạn mức theo tuyến và khách hàng trong hệ thống nhiều bản sao
  - Header thông báo giới hạn và phản hồi khi bị từ chối
  - Bucket4j và lựa chọn kho trạng thái theo biến thể, phiên bản hỗ trợ
  - RateLimiter tùy biến và chính sách khi kho giới hạn lưu lượng lỗi
  - Kiểm thử tải đột biến, phân bố khóa và tính nhất quán hạn mức
- level1: Ngắt mạch và dự phòng
  level2:
