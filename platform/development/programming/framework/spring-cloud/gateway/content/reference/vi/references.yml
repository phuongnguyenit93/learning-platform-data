    url: "https://docs.spring.io/spring-cloud-gateway/reference/spring-cloud-gateway-server-webflux/gatewayfilter-factories.html"
    description: "Các GatewayFilter cho chỉnh sửa request/response, path và HTTP header."
  - title: "Spring Cloud Gateway - DiscoveryClient Route Locator"
