references:
  - title: "Spring Cloud Kubernetes – Reference Guide"
    url: "https://docs.spring.io/spring-cloud-kubernetes/reference/index.html"
    description: "Giới thiệu dự án, trường hợp sử dụng và các khả năng tích hợp Spring với Kubernetes."
  - title: "Spring Cloud – Release Train Compatibility"
    url: "https://spring.io/projects/spring-cloud/"
    description: "Chọn phiên bản Spring Cloud BOM tương thích với Spring Boot."
  - title: "Spring Boot – Deploying to the Cloud"
    url: "https://docs.spring.io/spring-boot/how-to/deployment/cloud.html"
    description: "Triển khai Spring Boot trên Kubernetes, phát hiện môi trường và shutdown."
  - title: "Kubernetes – Deployments"
    url: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"
    description: "Quản lý replicas, Pod lifecycle và rolling updates."
  - title: "Kubernetes – Service"
    url: "https://kubernetes.io/docs/concepts/services-networking/service/"
    description: "Kubernetes Service, selectors, endpoints và service discovery qua DNS."
  - title: "Spring Cloud Kubernetes – PropertySources"
    url: "https://docs.spring.io/spring-cloud-kubernetes/reference/property-source-config.html"
    description: "Nạp cấu hình ConfigMap/Secret qua spring.config.import và thứ tự ưu tiên cấu hình."
  - title: "Spring Cloud Kubernetes – DiscoveryClient"
    url: "https://docs.spring.io/spring-cloud-kubernetes/reference/discovery-client.html"
    description: "Tìm dịch vụ bằng Kubernetes API, lọc namespaces, labels và ServiceInstance."
  - title: "Spring Cloud Kubernetes – LoadBalancer"
    url: "https://docs.spring.io/spring-cloud-kubernetes/reference/load-balancer.html"
    description: "Spring Cloud LoadBalancer với chế độ POD và SERVICE."
  - title: "Spring Cloud Kubernetes – Configuration Watcher"
    url: "https://docs.spring.io/spring-cloud-kubernetes/reference/spring-cloud-kubernetes-configuration-watcher.html"
    description: "Theo dõi thay đổi ConfigMap/Secret và gửi sự kiện refresh cho Spring."
  - title: "Kubernetes – RBAC Authorization"
    url: "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"
    description: "Role, RoleBinding, ServiceAccount và nguyên tắc least privilege."
  - title: "Spring Boot – Actuator Kubernetes Probes"
    url: "https://docs.spring.io/spring-boot/reference/actuator/endpoints.html"
    description: "Liveness, readiness, Actuator health endpoints và cấu hình probe."