menu:
- level1: Tổng quan
  level2:
  - Spring Cloud Service Broker và tên dự án Spring Cloud Open Service Broker
  - Bài toán tự phục vụ tài nguyên và vai trò của service broker
  - 'Các bên tham gia: nền tảng, broker, nhà cung cấp dịch vụ và ứng dụng'
  - Quan hệ giữa dịch vụ, gói dịch vụ, thực thể dịch vụ và liên kết
  - Phân biệt service broker với service discovery, API gateway và message broker
  - Phạm vi trách nhiệm của framework và phần nghiệp vụ do người viết broker đảm nhiệm
  - Luồng tổng thể từ công bố dịch vụ đến cấp phát, liên kết và thu hồi
  - Điều kiện áp dụng OSB API và giới hạn của mô hình broker
- level1: Kiến trúc
  level2:
  - Kiến trúc nền tảng – broker – hệ thống cung cấp tài nguyên
  - Tách luồng quản lý vòng đời khỏi luồng ứng dụng sử dụng dịch vụ
  - Controller OSB, mô hình dữ liệu và cơ chế tự cấu hình của Spring Boot
  - Vai trò và quan hệ của CatalogService, ServiceInstanceService và ServiceInstanceBindingService
  - Luồng xử lý từ HTTP request đến dịch vụ nghiệp vụ và HTTP response
  - Tách bộ điều hợp hạ tầng khỏi hợp đồng Open Service Broker
  - Nhận diện nền tảng bằng platformInstanceId và tiền tố đường dẫn
  - Thiết kế broker phục vụ nhiều nền tảng và nhiều khách hàng
- level1: Khởi tạo
  level2:
  - 'Kiến thức cần có: Spring Boot, HTTP, JSON, bảo mật và Reactor'
  - Chọn phiên bản Java, Spring Boot và Spring Cloud Open Service Broker tương thích
  - Khai báo spring-cloud-starter-open-service-broker bằng Maven hoặc Gradle
  - Lựa chọn web starter Spring MVC hoặc Spring WebFlux
  - Khởi tạo ứng dụng và đăng ký các Spring bean nghiệp vụ
  - Cấu hình application.yml và tách cấu hình theo môi trường
  - Tùy chỉnh đường dẫn bằng spring.cloud.openservicebroker.base-path
  - Dựng broker tối thiểu và gọi thử GET /v2/catalog
- level1: Giao thức OSB
  level2:
  - 'Đọc đặc tả OSB API: yêu cầu bắt buộc, tùy chọn và khả năng của nền tảng'
  - Nhóm endpoint catalog, service_instances, service_bindings và last_operation
  - HTTP method, đường dẫn định danh, query parameter và JSON body
  - X-Broker-API-Version và kiểm tra phiên bản giao thức
  - X-Broker-API-Originating-Identity và danh tính người khởi tạo
  - X-Broker-API-Request-Identity và đối chiếu các yêu cầu
  - Trường context và dữ liệu riêng của từng nền tảng
  - service_id, plan_id, instance_id và binding_id trong từng loại yêu cầu
  - Hợp đồng phản hồi đồng bộ, bất đồng bộ và lỗi giao thức
  - Phân biệt tính năng đã phát hành với phần mở rộng phụ thuộc phiên bản
- level1: Danh mục dịch vụ
  level2:
  - Cấu trúc Catalog, ServiceDefinition và Plan
  - Khai báo id, name, description và tính ổn định của định danh
  - Công bố danh mục qua GET /v2/catalog
  - Tạo Catalog bean bằng Java builder
  - Khai báo danh mục bằng YAML hoặc properties
  - Cài đặt CatalogService cho danh mục lấy từ nguồn dữ liệu động
  - Metadata, tags, liên kết tài liệu và thông tin hiển thị trên marketplace
  - Các cờ bindable, instances_retrievable và bindings_retrievable
  - Khai báo requires và các khả năng đặc thù của dịch vụ
  - Đồng bộ danh mục với năng lực cấp phát thực tế của broker
  - Bộ nhớ đệm danh mục và phản hồi có điều kiện bằng ETag theo phiên bản hỗ trợ
- level1: Gói dịch vụ
  level2:
  - Mô hình gói dịch vụ và ánh xạ gói sang tài nguyên hạ tầng
  - Định danh, mô tả, thuộc tính free và metadata của gói
  - Quy tắc kế thừa và ghi đè bindable ở cấp gói
  - Khai báo plan_updateable và giới hạn chuyển đổi gói
  - Tách metadata về giá khỏi cơ chế tính phí thực tế
  - Giới hạn dung lượng, số lượng và tài nguyên theo từng gói
  - maintenance_info và yêu cầu bảo trì phụ thuộc phiên bản giao thức
  - Thêm, ngừng cung cấp và thay đổi gói mà vẫn quản lý được instance cũ
- level1: Tham số đầu vào
  level2:
  - Phân biệt parameters, context, metadata và thuộc tính giao thức
  - Schema tham số cấp phát, cập nhật instance và tạo binding
  - Mô tả tham số bằng JSON Schema trong danh mục dịch vụ
  - Tham số bắt buộc, giá trị mặc định, kiểu dữ liệu và miền giá trị
  - Kiểm tra tham số tại broker thay vì chỉ dựa vào kiểm tra của nền tảng
  - Chuẩn hóa tham số và từ chối trường không được hỗ trợ
  - Kiểm tra quan hệ giữa tham số, gói dịch vụ và quyền của khách hàng
  - Quản lý tham số nhạy cảm và loại bỏ bí mật khỏi thông báo lỗi
  - Tiến hóa schema tham số và tương thích với yêu cầu cũ
- level1: Cấp phát dịch vụ
  level2:
  - PUT /v2/service_instances/{instance_id} và hợp đồng cấp phát
  - CreateServiceInstanceRequest và dữ liệu cần xác minh trước khi tạo
  - Cài đặt createServiceInstance() trong ServiceInstanceService
  - Ánh xạ instance_id sang tài nguyên của nhà cung cấp
  - Cấp phát tài nguyên dùng chung và tài nguyên dành riêng
  - CreateServiceInstanceResponse, dashboard_url và metadata được hỗ trợ
  - Lựa chọn hoàn tất đồng bộ hoặc trả về thao tác bất đồng bộ
  - Lưu kết quả cấp phát và xử lý yêu cầu tạo lại cùng định danh
  - Thu hồi tài nguyên đã tạo khi cấp phát chỉ thành công một phần
- level1: Truy xuất dịch vụ
  level2:
  - instances_retrievable và điều kiện hỗ trợ GET service instance
  - Cài đặt getServiceInstance() và xây dựng GetServiceInstanceResponse
  - Truy xuất cấu hình hiện tại và các tham số được phép công bố
  - Phân biệt trạng thái instance với trạng thái thao tác last_operation
  - Metadata, labels và thuộc tính mở rộng theo phiên bản hỗ trợ
  - Xử lý instance không tồn tại hoặc tài nguyên bên ngoài đã bị xóa
  - Đối chiếu trạng thái đã lưu với trạng thái thực của nhà cung cấp
- level1: Cập nhật dịch vụ
  level2:
  - PATCH /v2/service_instances/{instance_id} và điều kiện plan_updateable
  - Cài đặt updateServiceInstance() và mô hình request/response
  - Phân biệt đổi gói dịch vụ, đổi tham số và cập nhật context
  - previous_values và đối chiếu cấu hình trước khi thay đổi
  - Kiểm tra đường chuyển gói, hạn mức và khả năng của nhà cung cấp
  - Cập nhật tại chỗ hoặc thay thế tài nguyên và di chuyển dữ liệu
  - Cập nhật đồng bộ, bất đồng bộ và kiểm soát thao tác đang diễn ra
  - 'Thất bại khi cập nhật: khả năng tiếp tục sử dụng và thử lại'
  - Bảo trì theo maintenance_info khi framework và nền tảng hỗ trợ
- level1: Thu hồi dịch vụ
  level2:
  - DELETE /v2/service_instances/{instance_id} và hợp đồng thu hồi
  - Cài đặt deleteServiceInstance() và mô hình request/response
  - Xác minh service_id, plan_id và quyền sở hữu trước khi xóa
  - Xử lý binding còn tồn tại và thứ tự giải phóng tài nguyên
  - Chính sách giữ dữ liệu, sao lưu và xóa theo yêu cầu dịch vụ
  - Thu hồi đồng bộ hoặc bất đồng bộ và xác nhận kết quả cuối
  - Thu hồi lặp lại, instance không còn tồn tại và phản hồi phù hợp
  - Dọn tài nguyên mồ côi theo cơ chế orphan mitigation
  - Khôi phục khả năng thu hồi khi nhà cung cấp tạm thời không đáp ứng
- level1: Thao tác bất đồng bộ
  level2:
  - Vì sao tác vụ hạ tầng kéo dài cần giao thức bất đồng bộ
  - accepts_incomplete và trường hợp phải báo AsyncRequired
  - Phản hồi HTTP 202, trường operation và định danh tác vụ
  - Mô hình trạng thái in progress, succeeded và failed
  - Cài đặt getLastOperation() cho service instance
  - Cài đặt getLastOperation() cho service binding
  - Chu kỳ hỏi trạng thái, Retry-After và giới hạn chờ theo nền tảng
  - Phân biệt Mono bất đồng bộ trong ứng dụng với bất đồng bộ của OSB API
  - Thực thi tác vụ bền vững bằng hàng đợi hoặc bộ xử lý nền do broker quản lý
  - Tiếp tục theo dõi tác vụ sau khi ứng dụng khởi động lại
  - Lưu kết quả cuối, thời hạn lưu và xử lý operation không còn hợp lệ
  - Xung đột giữa thao tác đang chạy với yêu cầu cập nhật hoặc xóa mới
- level1: Liên kết dịch vụ
  level2:
  - Vai trò của service binding và điều kiện bindable
  - PUT service binding và CreateServiceInstanceBindingRequest
  - Cài đặt createServiceInstanceBinding() trong ServiceInstanceBindingService
  - Service binding dành cho ứng dụng và service binding dành cho route
  - bind_resource, app_guid, route và dữ liệu phụ thuộc nền tảng
  - CreateServiceInstanceAppBindingResponse và cấu trúc credentials
  - CreateServiceInstanceRouteBindingResponse và route_service_url
  - Liên kết cho log drain và volume mount theo khả năng nền tảng
  - Cấp phát tài khoản riêng cho từng binding hoặc dùng chung có kiểm soát
  - Tạo binding đồng bộ, bất đồng bộ và phản hồi yêu cầu tạo lặp
- level1: Vòng đời liên kết
  level2:
  - bindings_retrievable và GET service binding
  - Cài đặt getServiceInstanceBinding() và trả dữ liệu liên kết được phép
  - DELETE service binding và cài đặt deleteServiceInstanceBinding()
  - Thu hồi quyền truy cập, tài khoản và tài nguyên thuộc riêng binding
  - Hủy binding đồng bộ hoặc bất đồng bộ
  - Binding không tồn tại và quy tắc phản hồi khi hủy lặp lại
  - Thứ tự hủy binding, xóa instance và xử lý thao tác đồng thời
  - Luân chuyển binding với predecessor_binding_id khi phiên bản hỗ trợ
  - Thời hạn binding, expiresAt và renewBefore theo khả năng thực tế
  - Phân phối credentials mới và kết thúc thời gian chuyển tiếp an toàn
- level1: Dữ liệu và trạng thái
  level2:
  - Mô hình lưu trữ cho instance, binding, operation và tài nguyên bên ngoài
  - Khóa dữ liệu theo nền tảng, khách hàng và định danh OSB
  - Giới hạn của lưu trữ trong bộ nhớ và lựa chọn kho dữ liệu bền vững
  - Lưu tham số, định danh nhà cung cấp và kết quả phản hồi cần tái sử dụng
  - Ranh giới giao dịch giữa cơ sở dữ liệu broker và API hạ tầng
  - Nhật ký thao tác, hộp thư giao dịch và tránh thất lạc tác vụ
  - Khóa lạc quan, ràng buộc duy nhất và kiểm soát cập nhật cạnh tranh
  - Đối soát trạng thái định kỳ và phát hiện tài nguyên lệch trạng thái
  - Sao lưu, phục hồi và thay đổi schema kho dữ liệu
- level1: Tính lặp an toàn
  level2:
  - Tính lặp an toàn (idempotency) khi nền tảng gửi lại yêu cầu
  - Cùng định danh và cùng tham số so với cùng định danh nhưng khác tham số
  - Sử dụng dấu vết yêu cầu và kết quả đã lưu để tránh tạo tài nguyên trùng
  - Tính lặp an toàn cho cấp phát, tạo binding và thu hồi
  - Liên kết request identity với nghiệp vụ mà không thay thế instance_id
  - Kiểm soát hai yêu cầu cạnh tranh trên cùng instance hoặc binding
  - Thử lại có giới hạn, khoảng chờ tăng dần và giới hạn tốc độ
  - Bù trừ thao tác khi chuỗi cấp phát chỉ thành công một phần
  - Cơ chế phục hồi sau sự cố giữa lúc gọi nhà cung cấp và lưu trạng thái
- level1: Tích hợp hạ tầng
  level2:
  - Thiết kế giao diện bộ điều hợp cho từng nhà cung cấp dịch vụ
  - Ánh xạ gói và tham số sang yêu cầu API của nhà cung cấp
  - Cấp phát cơ sở dữ liệu, bộ nhớ đệm hoặc dịch vụ nhắn tin qua broker
  - Quản lý thông tin xác thực và quyền tối thiểu của tài khoản nhà cung cấp
  - Thiết lập thời gian chờ, giới hạn đồng thời và giới hạn tần suất gọi API
  - Phân loại lỗi nhà cung cấp thành lỗi OSB phù hợp
  - Đối chiếu tác vụ OSB với mã công việc bất đồng bộ của nhà cung cấp
  - Đặt tên, gắn nhãn và truy vết tài nguyên do broker tạo
  - Đối soát hạn mức và chi phí khi có nhiều instance hoặc nhiều khách hàng
- level1: Mở rộng framework
  level2:
  - Thay thế Spring bean mặc định và điều kiện tự cấu hình
  - Reactor Mono trong các giao diện dịch vụ của framework
  - Lập lịch lời gọi hạ tầng chặn luồng trong ứng dụng WebFlux
  - Truyền lỗi Reactor và chuyển thành phản hồi OSB
  - EventFlowRegistry và các giai đoạn initialization, completion, error
  - Đăng ký luồng bằng registry hoặc các bean event flow
  - Event flow cho cấp phát, cập nhật, thu hồi và last operation
  - Event flow cho tạo, hủy binding và truy vấn trạng thái thao tác
  - Ranh giới giữa event flow trong ứng dụng và cơ chế tác vụ bền vững
  - Bổ sung dashboard và endpoint quản trị mà không xung đột đường dẫn OSB
- level1: Lỗi và phản hồi
  level2:
  - 'Cấu trúc lỗi OSB: error, description và phần mở rộng được hỗ trợ'
  - Ý nghĩa HTTP 200, 201, 202, 204 và 410 theo từng endpoint
  - Lỗi yêu cầu 400, xung đột 409 và điều kiện phiên bản 412
  - HTTP 422 cho AsyncRequired và các trường hợp không thể xử lý
  - Ánh xạ exception của framework sang mã HTTP và nội dung lỗi
  - Phân biệt lỗi xác thực, lỗi phân quyền và lỗi nghiệp vụ
  - Lỗi tạm thời của nhà cung cấp và lỗi không nên thử lại
  - Mô tả lỗi có thể chẩn đoán mà không lộ credentials hoặc dữ liệu khách hàng
  - Phản hồi lỗi khi thao tác đã tạo ra tác động một phần
- level1: Bảo mật
  level2:
  - Ranh giới tin cậy giữa nền tảng, broker, ứng dụng và nhà cung cấp
  - Xác thực nền tảng bằng HTTP Basic theo hợp đồng OSB và triển khai TLS
  - Cấu hình Spring Security cho Spring MVC hoặc Spring WebFlux
  - Phân tách chính sách bảo mật endpoint OSB, dashboard và Actuator
  - Lựa chọn chính sách CSRF phù hợp với API và giao diện trình duyệt
  - Phân quyền theo nền tảng, khách hàng, dịch vụ và tài nguyên
  - Kiểm tra originating identity và context trong ranh giới tin cậy
  - Lưu credentials trong kho bí mật và mã hóa dữ liệu nhạy cảm
  - 'Vòng đời credentials: cấp mới, phân phối, luân chuyển và thu hồi'
  - Kiểm soát dashboard_url, route_service_url và địa chỉ đầu vào
  - Nhật ký kiểm toán, che dữ liệu nhạy cảm và giới hạn bề mặt tấn công
- level1: Cloud Foundry
  level2:
  - Vai trò marketplace, service broker và service instance trong Cloud Foundry
  - Triển khai broker và đăng ký bằng cf create-service-broker
  - Phân biệt broker toàn nền tảng và broker giới hạn trong một space
  - Cập nhật thông tin đăng ký bằng cf update-service-broker
  - Công bố gói và quản lý quyền truy cập bằng cf enable-service-access
  - Tạo và cập nhật dịch vụ bằng cf create-service và cf update-service
  - Liên kết ứng dụng bằng cf bind-service và phân phối cấu hình qua VCAP_SERVICES
  - Service key và ứng dụng của binding ngoài quy trình gắn ứng dụng
  - Theo dõi thao tác, hủy liên kết và xóa dịch vụ bằng CF CLI
  - Đăng ký một broker với nhiều foundation bằng platformInstanceId
  - Đối chiếu context, tổ chức, không gian và quyền truy cập dịch vụ
  - Dashboard SSO và kiểm soát truy cập trang quản lý dịch vụ
  - Chia sẻ service instance giữa các space và ảnh hưởng đến phân quyền
- level1: Kubernetes và OSB
  level2:
  - Điều kiện tích hợp OSB API và giới hạn hỗ trợ sẵn có của Kubernetes
  - Kiến trúc Service Catalog trong các hệ thống Kubernetes cũ sử dụng OSB
  - ClusterServiceBroker, ServiceInstance và ServiceBinding trong Service Catalog
  - Luồng đồng bộ danh mục và quản lý vòng đời qua bộ điều khiển OSB
  - Phân phối credentials bằng Secret và ánh xạ cho workload
  - Namespace, tài khoản dịch vụ, RBAC và cô lập khách hàng
  - Triển khai broker trên Kubernetes độc lập với việc nền tảng có dùng OSB
  - Service Catalog đã ngừng duy trì và giới hạn khi vận hành hệ thống cũ
  - Đối chiếu OSB với Operator và cơ chế Service Binding của hệ sinh thái Kubernetes
  - Phương án chuyển đổi hệ thống OSB cũ mà vẫn giữ tài nguyên và thông tin kết nối
- level1: Kiểm thử
  level2:
  - Lập ma trận kiểm thử từ khả năng công bố trong catalog
  - Kiểm thử đơn vị CatalogService và các quy tắc gói dịch vụ
  - Kiểm thử đơn vị vòng đời instance, binding và operation
  - Kiểm thử HTTP bằng MockMvc hoặc WebTestClient theo web stack
  - Kiểm thử hợp đồng JSON, HTTP status và header OSB
  - Kiểm thử phiên bản giao thức, tham số không hợp lệ và cờ khả năng
  - Kiểm thử chuỗi bất đồng bộ từ HTTP 202 đến trạng thái cuối
  - Kiểm thử yêu cầu lặp, thao tác cạnh tranh và khởi động lại broker
  - Mô phỏng API nhà cung cấp, lỗi mạng và thời gian chờ
  - Kiểm thử tích hợp kho dữ liệu và dịch vụ thật bằng Testcontainers khi phù hợp
  - Kiểm thử phân quyền nhiều khách hàng và không rò rỉ credentials
  - Kiểm thử toàn trình với nền tảng OSB tương thích
- level1: Triển khai
  level2:
  - Đóng gói broker và quản lý cấu hình theo môi trường
  - Thiết lập TLS, reverse proxy và đường dẫn công khai
  - Triển khai trên Cloud Foundry, máy chủ ứng dụng hoặc Kubernetes
  - Vận hành nhiều bản sao với trạng thái dùng chung
  - Phối hợp bộ xử lý nền để tránh chạy trùng tác vụ
  - Readiness, liveness và khả năng kết nối kho dữ liệu
  - Dừng ứng dụng an toàn khi có thao tác cấp phát đang chạy
  - Giới hạn tài nguyên, kết nối và năng lực xử lý theo tải
  - Nâng cấp cuốn chiếu và tương thích schema dữ liệu
  - Quy trình phục hồi broker và đối soát tài nguyên sau sự cố
- level1: Giám sát
  level2:
  - Log có cấu trúc theo platform, instance, binding và operation
  - Đối chiếu yêu cầu OSB với tác vụ nhà cung cấp bằng mã truy vết
  - Đo số lượng yêu cầu, độ trễ và tỷ lệ lỗi từng thao tác
  - Đo thời gian cấp phát, số tác vụ chờ và tuổi tác vụ chưa hoàn tất
  - Giám sát hạn mức, tài nguyên mồ côi và lỗi đối soát
  - Actuator, Micrometer và xuất số liệu giám sát
  - Giới hạn nhãn số liệu để tránh cardinality cao từ instance_id
  - Cảnh báo thất bại kéo dài, luân chuyển credentials lỗi và cạn tài nguyên
- level1: Chẩn đoán sự cố
  level2:
  - Broker khởi động nhưng endpoint /v2/catalog trả 404
  - Catalog không xuất hiện hoặc gói không hiển thị trên marketplace
  - Yêu cầu bị từ chối do phiên bản giao thức, xác thực hoặc phân quyền
  - Cấp phát bị gọi lặp và tài nguyên đã tồn tại bên nhà cung cấp
  - Operation ở trạng thái in progress quá lâu hoặc không tìm thấy
  - Cập nhật gói thất bại trong khi instance vẫn đang được sử dụng
  - Binding được tạo nhưng ứng dụng không kết nối được dịch vụ
  - Credentials đã luân chuyển nhưng ứng dụng vẫn dùng thông tin cũ
  - Hủy binding hoặc xóa instance thất bại và để lại tài nguyên mồ côi
  - Broker khởi động lại mất trạng thái hoặc nhiều bản sao xử lý trùng
  - Quy trình thu thập bằng chứng từ nền tảng, broker, kho dữ liệu và nhà cung cấp
- level1: Nâng cấp và tương thích
  level2:
  - Phân biệt phiên bản framework, Spring Boot và OSB API
  - Lập bảng tính năng tương thích giữa broker, đặc tả và nền tảng
  - Đánh giá thay đổi API Java, cấu hình và web stack khi nâng phiên bản
  - Bảo toàn service_id, plan_id, instance_id và binding_id qua nâng cấp
  - Tiến hóa catalog, schema tham số và metadata mà không phá instance cũ
  - Giới thiệu tính năng tùy chọn theo năng lực thực tế của nền tảng
  - Di chuyển kho trạng thái và dữ liệu credentials
  - Kiểm thử hồi quy, triển khai từng phần và kế hoạch khôi phục phiên bản
  - Ngừng cung cấp broker và bàn giao tài nguyên đang được sử dụng
- level1: Thực hành tổng hợp
  level2:
  - Xây dựng broker tối thiểu với catalog tĩnh và nhà cung cấp mô phỏng
  - Hoàn thiện vòng đời cấp phát, truy xuất, cập nhật và thu hồi instance
  - Thêm binding với credentials riêng và kiểm chứng thu hồi quyền truy cập
  - Chuyển cấp phát sang bất đồng bộ và lưu trạng thái bền vững
  - Tích hợp một dịch vụ cơ sở dữ liệu hoặc bộ nhớ đệm thực tế
  - Bổ sung tính lặp an toàn và kiểm thử yêu cầu cạnh tranh
  - Mô phỏng lỗi giữa chừng, khởi động lại và đối soát tài nguyên
  - Đăng ký broker với nền tảng OSB và chạy toàn bộ vòng đời dịch vụ
  - Gia cố bảo mật, đo lường vận hành và kiểm tra điều kiện triển khai
  - Thiết kế kế hoạch nâng cấp gói và luân chuyển credentials không gián đoạn
