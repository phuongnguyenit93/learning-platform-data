references:
  - title: "Spring — Spring Cloud Open Service Broker"
    url: "https://spring.io/projects/spring-cloud-open-service-broker/"
    description: "Giới thiệu dự án, starter và mục đích triển khai Open Service Broker API trên Spring Boot."
  - title: "Spring Cloud Open Service Broker — Reference"
    url: "https://docs.spring.io/spring-cloud-open-service-broker/docs/current/reference/"
    description: "Hướng dẫn catalog, ServiceInstanceService, ServiceInstanceBindingService, async, API version và security."
  - title: "Spring Cloud Open Service Broker — Source Repository"
    url: "https://github.com/spring-cloud/spring-cloud-open-service-broker"
    description: "Mã nguồn, phiên bản tương thích, ví dụ và bộ kiểm thử framework."
  - title: "Open Service Broker API — Specification"
    url: "https://github.com/cloudfoundry/servicebroker/blob/master/spec.md"
    description: "Hợp đồng HTTP của platform và broker về catalog, provision, binding, polling và error; nhánh master có thể chứa thay đổi chưa phát hành."
  - title: "Open Service Broker API — OpenAPI Definition"
    url: "https://github.com/cloudfoundry/servicebroker/blob/master/openapi.yaml"
    description: "Đặc tả máy đọc được của endpoint, request, response và lỗi OSB API."
  - title: "Cloud Foundry — Services Overview"
    url: "https://docs.cloudfoundry.org/services/overview.html"
    description: "Vai trò service broker và liên hệ giữa offerings, plans, instances và bindings trong platform."
  - title: "Open Service Broker API — Getting Started"
    url: "https://github.com/cloudfoundry/servicebroker/blob/master/gettingStarted.md"
    description: "Tổng quan tích hợp platform và các thư viện tạo service broker, bao gồm Spring Cloud."