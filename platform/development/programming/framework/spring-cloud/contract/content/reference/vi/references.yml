references:
  - title: "Spring Cloud Contract — Reference Documentation"
    url: "https://docs.spring.io/spring-cloud-contract/reference/index.html"
    description: "Tổng quan consumer-driven và producer-driven contract testing cùng các thành phần chính."
  - title: "Spring Cloud Contract — Getting Started"
    url: "https://docs.spring.io/spring-cloud-contract/reference/getting-started.html"
    description: "Giới thiệu mục đích, quy trình đầu tiên và cách thiết lập dự án contract testing."
  - title: "Spring Cloud Contract — Contract DSL"
    url: "https://docs.spring.io/spring-cloud-contract/reference/project-features-contract.html"
    description: "Cú pháp Groovy, YAML, Java, Kotlin, HTTP request/response và matchers."
  - title: "Spring Cloud Contract — Maven Project"
    url: "https://docs.spring.io/spring-cloud-contract/reference/maven-project.html"
    description: "Maven plugin, sinh generated tests, base test class và tạo/phân phối stub artifacts."
  - title: "Spring Cloud Contract — Gradle Project"
    url: "https://docs.spring.io/spring-cloud-contract/reference/gradle-project.html"
    description: "Cấu hình Gradle plugin, contract directory và tác vụ sinh test hoặc client stubs."
  - title: "Spring Cloud Contract — Stub Runner"
    url: "https://docs.spring.io/spring-cloud-contract/reference/project-features-stubrunner.html"
    description: "Lấy và chạy stub để kiểm thử consumer không cần khởi động producer thật."
  - title: "Spring Cloud Contract — Messaging"
    url: "https://docs.spring.io/spring-cloud-contract/reference/project-features-messaging.html"
    description: "Định nghĩa contract cho luồng message, trigger và tạo stub phía consumer."
  - title: "Spring Cloud Contract — Using Spring Cloud Contract"
    url: "https://docs.spring.io/spring-cloud-contract/reference/using.html"
    description: "Các workflow giữa producer và consumer, lưu contract và thực hành áp dụng trong nhóm."