references:
  - title: "Spring — Spring Cloud Stream Project"
    url: "https://spring.io/projects/spring-cloud-stream/"
    description: "Tổng quan framework, message-driven microservices, binder abstraction và các broker được hỗ trợ."
  - title: "Spring — Spring Cloud Stream Reference"
    url: "https://docs.spring.io/spring-cloud-stream/reference/spring-cloud-stream.html"
    description: "Khái niệm cốt lõi, ứng dụng mẫu, functional model, configuration và tổ chức ứng dụng."
  - title: "Spring — Producing and Consuming Messages"
    url: "https://docs.spring.io/spring-cloud-stream/reference/spring-cloud-stream/producing-and-consuming-messages.html"
    description: "Supplier, Function, Consumer, functional binding names và gửi message qua StreamBridge."
  - title: "Spring — Binding Properties"
    url: "https://docs.spring.io/spring-cloud-stream/reference/spring-cloud-stream/binding-properties.html"
    description: "Cấu hình destination, group, contentType, concurrency, partition key và các thuộc tính producer/consumer."
  - title: "Spring — Consumer Groups"
    url: "https://docs.spring.io/spring-cloud-stream/reference/spring-cloud-stream/consumer-groups.html"
    description: "Pub/sub qua nhiều consumer group và phân phối message giữa các instance trong cùng group."
  - title: "Spring — Kafka Binder Usage"
    url: "https://docs.spring.io/spring-cloud-stream/reference/kafka/kafka-binder/usage.html"
    description: "Dependency starter và cách kết nối Kafka binder trong ứng dụng Spring Cloud Stream."
  - title: "Spring — RabbitMQ Binder Reference"
    url: "https://docs.spring.io/spring-cloud-stream/reference/rabbit/spring-cloud-stream-binder-rabbit.html"
    description: "Tổng quan RabbitMQ binder và các chủ đề cấu hình, chuyển message, xử lý lỗi của Rabbit."
  - title: "Spring — Error Handling"
    url: "https://docs.spring.io/spring-cloud-stream/reference/spring-cloud-stream/overview-error-handling.html"
    description: "Retry, custom error handler, DLQ và sự khác biệt giữa imperative với reactive functions."
  - title: "Spring — Kafka Dead-Letter Processing"
    url: "https://docs.spring.io/spring-cloud-stream/reference/kafka/kafka-binder/dlq.html"
    description: "Thiết lập consumer group và enable-dlq để xử lý record thất bại sau khi retry."
  - title: "Spring — Testing with Test Binder"
    url: "https://docs.spring.io/spring-cloud-stream/reference/spring-cloud-stream/spring_integration_test_binder.html"
    description: "Kiểm thử bằng @EnableTestBinder, InputDestination và OutputDestination không cần broker thực."
  - title: "Spring — Observability"
    url: "https://docs.spring.io/spring-cloud-stream/reference/observability.html"
    description: "Kết hợp Micrometer metrics/tracing với luồng xử lý message trong Spring Cloud Stream."