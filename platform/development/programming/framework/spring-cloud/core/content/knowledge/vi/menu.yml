  - Xây dựng PropertySourceLocator cho nguồn cấu hình riêng
  - Thực nghiệm context cha, con và sibling
  - So sánh @Value, ConfigurationProperties rebind và Refresh Scope
  - Đổi cấu hình trên hai instance và kiểm chứng phạm vi refresh
  - Giải mã cấu hình cục bộ với khóa bên ngoài ứng dụng
  - Tra cứu instance bằng SimpleDiscoveryClient
  - Gọi dịch vụ theo tên bằng HTTP client có @LoadBalanced
  - Thử nghiệm ServiceRegistry với implementation giả lập
  - Đóng gói starter nền tảng và kiểm thử auto-configuration
  - Chẩn đoán sự cố từ bằng chứng env, conditions, health và log
