- level1: AOT và checkpoint
  level2:
  - Khác biệt giữa JVM thông thường, Spring AOT và native image
  - Giới hạn Context Refresh trong AOT và native image
  - Cấu hình spring.cloud.refresh.enabled theo chế độ chạy
  - Kiểm tra khả năng hỗ trợ của từng implementation discovery và HTTP client
  - Checkpoint, restore và vai trò RefreshScopeLifecycle khi được hỗ trợ
  - Điều khiển refresh.on-restart.enabled và kiểm chứng khôi phục
  - Quản lý socket, thread và tài nguyên bên ngoài sau restore
- level1: Nâng cấp
  level2:
  - Lập bảng Java, Spring Boot, release train và phiên bản Commons
  - Đối chiếu tài liệu, cấu hình và mặc định của phiên bản đích
  - Chuyển bootstrap cũ sang Config Data khi phù hợp
  - Phân biệt cơ chế đăng ký trong spring.factories và AutoConfiguration.imports
  - Kiểm tra thay đổi trong DiscoveryClient và HTTP client integration
  - Loại bỏ giả định cũ về annotation bắt buộc và client tự tạo
  - Kiểm tra thay đổi rebind, xóa thuộc tính và giới hạn Refresh Scope
  - Kiểm thử hồi quy thứ tự nguồn cấu hình và endpoint quản trị
  - Triển khai thử và chuẩn bị quay lại phiên bản trước
- level1: Chẩn đoán sự cố
  level2:
  - Ứng dụng không khởi động do Boot và Cloud không tương thích
  - Không tìm thấy bean dù đã thêm starter
  - Bootstrap.yml không được đọc hoặc đọc sai profile
  - Cùng thuộc tính có giá trị khác với tệp cấu hình dự kiến
  - Nguồn cấu hình từ xa ghi đè giá trị cục bộ ngoài dự kiến
  - PropertySourceLocator chạy sai thời điểm hoặc bị gọi lặp
  - Refresh trả thành công nhưng bean vẫn giữ giá trị cũ
  - Bean mới không xuất hiện sau khi đổi ConditionalOnProperty
  - Refresh làm mất tài nguyên hoặc gây lỗi xử lý đồng thời
  - Không giải mã được giá trị cipher
  - DiscoveryClient không có instance hoặc chọn sai implementation
  - Đăng ký sai IP, hostname, port hoặc scheme
  - HTTP client phân giải tên dịch vụ như DNS thông thường
  - Endpoint quản trị trả 404, 401 hoặc 403
  - Context khởi tạo nhiều lần hoặc bootstrap bean bị component scan nhầm
- level1: Thực hành tổng hợp
  level2:
  - Ứng dụng nền tảng có Commons, Context và Actuator tối thiểu
