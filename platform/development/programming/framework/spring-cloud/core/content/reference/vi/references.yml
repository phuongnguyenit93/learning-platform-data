references:
  - title: "Spring — Spring Cloud Project"
    url: "https://spring.io/projects/spring-cloud/"
    description: "Tổng quan Spring Cloud, release train/BOM, bảng tương thích với Spring Boot và các dự án thành phần."
  - title: "Spring Cloud Commons — Common Abstractions"
    url: "https://docs.spring.io/spring-cloud-commons/reference/spring-cloud-commons/common-abstractions.html"
    description: "DiscoveryClient, ServiceRegistry, health indicators, compatibility verifier và abstraction chung."
  - title: "Spring Cloud Context — Application Context Services"
    url: "https://docs.spring.io/spring-cloud-commons/reference/spring-cloud-commons/application-context-services.html"
    description: "Bootstrap context, property sources, EnvironmentChangeEvent, @RefreshScope và Actuator refresh."
  - title: "Spring Cloud Config — Client"
    url: "https://docs.spring.io/spring-cloud-config/reference/client.html"
    description: "Sử dụng spring.config.import, phân biệt Config Data với legacy bootstrap, fail-fast và retry."
  - title: "Spring Cloud Commons — LoadBalancer"
    url: "https://docs.spring.io/spring-cloud-commons/reference/spring-cloud-commons/loadbalancer.html"
    description: "Client-side load balancing, ServiceInstanceListSupplier và tích hợp RestClient/WebClient."
  - title: "Spring Cloud Circuit Breaker — Reference"
    url: "https://docs.spring.io/spring-cloud-circuitbreaker/reference/index.html"
    description: "Các lựa chọn implementation cho circuit breaker và hướng dẫn đi đến API chung."
  - title: "Spring Boot — Actuator Endpoints"
    url: "https://docs.spring.io/spring-boot/reference/actuator/endpoints.html"
    description: "Theo dõi health, env, configprops, điều kiện auto-configuration và bảo vệ endpoints."
  - title: "Spring Cloud Commons — Configuration Properties"
    url: "https://docs.spring.io/spring-cloud-commons/reference/configprops.html"
    description: "Tra cứu các thiết lập của discovery, refresh, load balancer và service registry."