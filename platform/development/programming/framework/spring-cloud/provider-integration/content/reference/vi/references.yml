references:
  - title: "Spring Cloud - Overview & Release Trains"
    url: "https://spring.io/projects/spring-cloud/"
    description: "BOM, lựa chọn Spring Cloud release train theo phiên bản Spring Boot và khởi tạo ứng dụng."
  - title: "Spring Cloud - Supported Versions"
    url: "https://github.com/spring-cloud/spring-cloud-release/wiki/Supported-Versions"
    description: "Các bản Spring Cloud và mức hỗ trợ tương ứng với Spring Boot."
  - title: "Spring Cloud AWS - Provider Integrations"
    url: "https://awspring.io/what-is-spring-cloud-aws"
    description: "Các dịch vụ AWS được tích hợp như S3, SQS, Secrets Manager và tương thích phiên bản."
  - title: "Spring Cloud Azure - Project Overview"
    url: "https://spring.io/projects/spring-cloud-azure/"
    description: "Tích hợp App Configuration, Key Vault, Blob Storage, Service Bus và Azure Identity."
  - title: "Microsoft Learn - Spring Cloud Azure Guide"
    url: "https://learn.microsoft.com/en-us/azure/developer/java/spring-framework/developer-guide-overview"
    description: "Danh sách starter cho Azure Storage, messaging, Key Vault và data services."
  - title: "Microsoft Learn - Spring Cloud Azure Authentication"
    url: "https://learn.microsoft.com/en-us/azure/developer/java/spring-framework/authentication"
    description: "DefaultAzureCredential, managed/workload identities và kiểm soát quyền qua Azure RBAC."
  - title: "Google Cloud - Spring Framework Integration Guide"
    url: "https://googlecloudplatform.github.io/spring-cloud-gcp/reference/html/"
    description: "Spring starters và tích hợp Cloud Storage, Pub/Sub, dữ liệu, authentication và Secret Manager."
  - title: "Google Cloud - Pub/Sub for Spring"
    url: "https://docs.cloud.google.com/pubsub/docs/spring"
    description: "Pub/Sub starter, integration channel adapters và Spring Cloud Stream binder."
  - title: "Google Cloud - Spring Integration Repository"
    url: "https://github.com/GoogleCloudPlatform/spring-cloud-gcp"
    description: "Mã nguồn Spring Framework on Google Cloud và danh sách cloud integrations được hỗ trợ."
  - title: "Spring Boot - Observability"
    url: "https://docs.spring.io/spring-boot/reference/actuator/observability.html"
    description: "Logging, metrics, traces và Micrometer Observation cho dịch vụ Spring."
  - title: "Spring Boot - Actuator Metrics"
    url: "https://docs.spring.io/spring-boot/reference/actuator/metrics.html"
    description: "Theo dõi latency, lỗi HTTP, client metrics và xuất dữ liệu giám sát."
  - title: "Azure SDK for Java - Spring Starters"
    url: "https://github.com/Azure/azure-sdk-for-java/blob/main/sdk/spring/README.md"
    description: "Các thành phần Spring Cloud Azure, starter phụ thuộc và liên kết mẫu thực hành."