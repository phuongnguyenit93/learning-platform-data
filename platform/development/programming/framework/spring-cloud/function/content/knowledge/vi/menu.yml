  - Đánh giá Spring AOT, RuntimeHints và GraalVM Native Image
  - Kiểm tra tương thích adapter trước khi chọn kiểu triển khai tối ưu
- level1: Nâng cấp
  level2:
  - Phân biệt phiên bản Spring Cloud Function, Boot, BOM và runtime
  - Đối chiếu API, thuộc tính cấu hình và thay đổi hành vi mặc định
  - Kiểm tra chuyển đổi JSON và chính sách loại dữ liệu được phép
  - Kiểm tra web adapter, định tuyến và header sau nâng cấp
  - Chuyển đổi handler serverless đã ngừng khuyến nghị
  - Giữ ổn định tên hàm, định nghĩa ghép và hợp đồng sự kiện
  - Đối chiếu tài liệu cũ với thế hệ dịch vụ đám mây hiện hành
  - Kiểm thử hồi quy và kế hoạch khôi phục phiên bản
- level1: Chẩn đoán
  level2:
  - Không tìm thấy hàm trong FunctionCatalog
  - Hàm ngoài ý muốn được đăng ký hoặc công bố
  - Tra cứu tên sai vẫn trả hàm khi bật cơ chế tra cứu dự phòng
  - Chuyển đổi JSON thất bại hoặc nhận Map thay vì POJO
  - Chữ ký generic bị mất sau đăng ký hoặc đóng gói
  - Ghép hàm sai thứ tự hoặc không tương thích kiểu
  - Header định tuyến không có tác dụng với luồng phản ứng
  - Luồng Flux không được xử lý do thiếu đăng ký nhận dữ liệu
  - HTTP trả sai đường dẫn, method hoặc content type
  - Header bị mất, bị sao chép ngoài ý muốn hoặc bổ sung thất bại
  - Handler serverless không khởi tạo được lớp ứng dụng
  - Nạp JAR lỗi do ClassLoader, manifest hoặc phụ thuộc
  - Thời gian khởi động dài, vượt timeout hoặc lặp tác dụng phụ
- level1: Thực hành
  level2:
  - Xây dựng bộ Supplier, Function và Consumer xử lý văn bản
  - Chuyển JSON thành POJO với converter tùy chỉnh
  - Ghép chuỗi kiểm tra và xử lý đơn hàng
  - Định tuyến theo header với danh sách hàm được phép
  - Bổ sung metadata và kiểm chứng quy tắc truyền header
  - Tách và kết hợp nhiều luồng bằng Reactor Tuple
  - Công bố cùng một hàm qua HTTP và Spring Cloud Stream
  - Dùng FunctionFlowBuilder trong luồng Spring Integration
  - Nạp hàm từ JAR độc lập và kiểm tra ranh giới kiểu
  - Đưa nghiệp vụ lên một adapter serverless rồi đối chiếu kết quả
  - Mô phỏng lỗi, dữ liệu lặp và nhiều lần gọi đồng thời
  - Đo khởi động, bảo vệ điểm vào và hoàn thiện kiểm thử triển khai
