references:
  - title: "Spring LDAP — Introduction"
    url: "https://docs.spring.io/spring-ldap/reference/introduction.html"
    description: "Tổng quan Spring LDAP, LdapClient, LdapTemplate và các khả năng nền tảng."
  - title: "Spring LDAP — Configuration"
    url: "https://docs.spring.io/spring-ldap/reference/configuration.html"
    description: "Cấu hình ContextSource, TLS, LdapClient, LdapTemplate và phạm vi base DN."
  - title: "Spring LDAP — Basic Usage"
    url: "https://docs.spring.io/spring-ldap/reference/spring-ldap-basic-usage.html"
    description: "Tra cứu, LdapQuery, DN, tìm kiếm và các thao tác bind/modify/unbind."
  - title: "Spring LDAP — Object-Directory Mapping (ODM)"
    url: "https://docs.spring.io/spring-ldap/reference/odm.html"
    description: "Ánh xạ LDAP entry sang đối tượng Java bằng các annotation và LdapTemplate."
  - title: "Spring LDAP — Spring LDAP Repositories"
    url: "https://docs.spring.io/spring-ldap/reference/repositories.html"
    description: "Cấu hình LdapRepository và thao tác truy cập dữ liệu thông qua repository."
  - title: "Spring LDAP — User Authentication"
    url: "https://docs.spring.io/spring-ldap/reference/user-authentication.html"
    description: "Xác thực người dùng với LDAP và vai trò của Spring Security."
  - title: "Spring LDAP — Pooling Support"
    url: "https://docs.spring.io/spring-ldap/reference/pooling.html"
    description: "Pool kết nối và kiểm tra sức khỏe của DirContext."
  - title: "Spring LDAP — Transaction Support"
    url: "https://docs.spring.io/spring-ldap/reference/transaction-support.html"
    description: "Transaction bù phía client và giới hạn rollback trong LDAP."
  - title: "Spring LDAP — Testing"
    url: "https://docs.spring.io/spring-ldap/reference/testing.html"
    description: "Kiểm thử LDAP tích hợp bằng embedded server và dữ liệu LDIF."