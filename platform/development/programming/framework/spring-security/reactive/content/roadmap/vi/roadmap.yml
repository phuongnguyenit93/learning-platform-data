roadmap:
- id: nen-tang-bao-mat-webflux
  title: Nền tảng bảo mật WebFlux
  purpose: Hiểu vai trò của Spring Security trong ứng dụng WebFlux và tư duy xử lý không chặn.
  objectives:
  - Phân biệt xác thực danh tính với phân quyền truy cập.
  - Nhận diện quan hệ giữa WebFilter, Authentication và SecurityContext.
- id: chuoi-loc-bao-mat
  title: Chuỗi lọc bảo mật
  purpose: Nắm nơi cấu hình và thứ tự áp dụng các lớp bảo vệ cho yêu cầu HTTP.
  objectives:
  - Tạo SecurityWebFilterChain bằng ServerHttpSecurity.
  - Phân biệt phạm vi chọn chuỗi với quy tắc truy cập; sắp xếp nhiều chuỗi bằng @Order.
- id: xac-thuc-nguoi-dung
  title: Xác thực người dùng
  purpose: Kiểm tra danh tính qua các thành phần xác thực dành cho luồng phản ứng.
  objectives:
  - Lần theo AuthenticationWebFilter và ReactiveAuthenticationManager.
  - Cấu hình HTTP Basic hoặc đăng nhập biểu mẫu với ReactiveUserDetailsService và PasswordEncoder.
- id: ngu-canh-va-phien
  title: Ngữ cảnh và phiên
  purpose: Hiểu cách danh tính được truyền trong luồng xử lý và duy trì giữa các yêu cầu.
  objectives:
  - Đọc danh tính qua ReactiveSecurityContextHolder trong Reactor Context.
  - Phân biệt ngữ cảnh theo luồng xử lý với lưu trữ qua WebSession; kiểm tra đăng xuất.
- id: phan-quyen-truy-cap
  title: Phân quyền truy cập
  purpose: Áp dụng quyền truy cập nhất quán tại lớp HTTP và phương thức nghiệp vụ.
  objectives:
  - Thiết lập authorizeExchange theo đường dẫn, vai trò và quyền hạn.
  - Dùng @EnableReactiveMethodSecurity và @PreAuthorize cho phương thức trả Mono hoặc Flux.
- id: bao-ve-ung-dung-web
  title: Bảo vệ ứng dụng web
  purpose: Lựa chọn biện pháp bảo vệ phù hợp với trình duyệt và cách gửi thông tin xác thực.
  objectives:
  - Kiểm tra CSRF theo cơ chế dùng cookie hoặc Bearer token; giải thích trước khi tắt bảo vệ.
  - Cấu hình CORS và các HTTP header bảo mật phù hợp.
- id: tich-hop-oauth2-oidc
  title: Tích hợp OAuth2/OIDC
  purpose: Kết nối ứng dụng WebFlux với hệ thống cấp danh tính và quyền truy cập bên ngoài.
  objectives:
  - Phân biệt OAuth2 Login/OIDC, OAuth2 Client và Resource Server.
  - Tích hợp đăng nhập, kiểm tra access token và gọi API bằng WebClient theo vai trò ứng dụng.
- id: kiem-thu-va-chan-doan
  title: Kiểm thử và chẩn đoán
  purpose: Chứng minh các quy tắc bảo mật hoạt động đúng và xác định nơi phát sinh lỗi.
  objectives:
  - Dùng WebTestClient và spring-security-test kiểm tra danh tính, quyền, CSRF và token.
  - Đối chiếu trường hợp được phép, chưa xác thực, thiếu quyền và mất ngữ cảnh; tránh block() trong luồng phản ứng.
