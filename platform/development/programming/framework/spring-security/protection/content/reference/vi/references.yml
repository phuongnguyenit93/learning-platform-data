references:
  - title: "Spring Security - Protection Against Exploits"
    url: "https://docs.spring.io/spring-security/reference/servlet/exploits/index.html"
    description: "Tổng quan các cơ chế bảo vệ chống khai thác dành cho ứng dụng Servlet."
  - title: "Spring Security - Cross Site Request Forgery"
    url: "https://docs.spring.io/spring-security/reference/servlet/exploits/csrf.html"
    description: "Cấu hình CSRF token, xử lý request và kiểm thử phòng chống CSRF."
  - title: "Spring Security - CORS"
    url: "https://docs.spring.io/spring-security/reference/servlet/integrations/cors.html"
    description: "CORS, preflight và phối hợp với Spring Security filter chain."
  - title: "Spring Security - Security HTTP Response Headers"
    url: "https://docs.spring.io/spring-security/reference/servlet/exploits/headers.html"
    description: "Các response header bảo vệ, cấu hình và tùy chỉnh."
  - title: "Spring Security - HTTP"
    url: "https://docs.spring.io/spring-security/reference/servlet/exploits/http.html"
    description: "HTTPS redirect, HSTS và lưu ý triển khai sau reverse proxy."
  - title: "Spring Security - Session Management"
    url: "https://docs.spring.io/spring-security/reference/servlet/authentication/session-management.html"
    description: "Quản lý session, session fixation, timeout và xử lý trạng thái xác thực."
  - title: "Spring Security - HttpFirewall"
    url: "https://docs.spring.io/spring-security/reference/servlet/exploits/firewall.html"
    description: "StrictHttpFirewall và các trường hợp request bị từ chối."
  - title: "Spring Security - Spring MVC Test Integration"
    url: "https://docs.spring.io/spring-security/reference/servlet/test/mockmvc/"
    description: "MockMvc và các tiện ích kiểm thử bảo vệ trong Spring Security."