references:
  - title: "Architecture"
    url: "https://docs.spring.io/spring-security/reference/servlet/architecture.html"
    description: "Kiến trúc bảo mật Servlet và quan hệ giữa các thành phần của chuỗi bộ lọc."
  - title: "Java Configuration"
    url: "https://docs.spring.io/spring-security/reference/servlet/configuration/java.html"
    description: "Cấu hình HttpSecurity, SecurityFilterChain và lựa chọn chuỗi cho từng nhóm yêu cầu."
  - title: "Username/Password Authentication"
    url: "https://docs.spring.io/spring-security/reference/servlet/authentication/passwords/index.html"
    description: "Xác thực bằng tên người dùng và mật khẩu, đăng nhập biểu mẫu và HTTP Basic."
  - title: "Authorize HttpServletRequests"
    url: "https://docs.spring.io/spring-security/reference/servlet/authorization/authorize-http-requests.html"
    description: "Phân quyền yêu cầu HTTP bằng authorizeHttpRequests và xử lý truy cập bị từ chối."
  - title: "Persisting Authentication"
    url: "https://docs.spring.io/spring-security/reference/servlet/authentication/persistence.html"
    description: "Lưu và khôi phục ngữ cảnh bảo mật với SecurityContextRepository."
  - title: "Handling Logouts"
    url: "https://docs.spring.io/spring-security/reference/servlet/authentication/logout.html"
    description: "Luồng đăng xuất, xóa ngữ cảnh bảo mật và vô hiệu hóa phiên."
  - title: "Cross Site Request Forgery (CSRF)"
    url: "https://docs.spring.io/spring-security/reference/servlet/exploits/csrf.html"
    description: "Cơ chế bảo vệ CSRF và cách xử lý mã CSRF trong ứng dụng Servlet."
  - title: "CORS"
    url: "https://docs.spring.io/spring-security/reference/servlet/integrations/cors.html"
    description: "Tích hợp CORS và xử lý yêu cầu sơ bộ trước bước xác thực."
  - title: "Security HTTP Response Headers"
    url: "https://docs.spring.io/spring-security/reference/servlet/exploits/headers.html"
    description: "Các tiêu đề HTTP hỗ trợ bảo vệ ứng dụng web và cách cấu hình."
  - title: "Spring MVC Test Integration"
    url: "https://docs.spring.io/spring-security/reference/servlet/test/mockmvc/index.html"
    description: "Tích hợp Spring Security với MockMvc để kiểm tra hành vi bảo mật."