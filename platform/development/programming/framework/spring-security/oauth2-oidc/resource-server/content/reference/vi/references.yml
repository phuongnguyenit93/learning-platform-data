references:
  - title: "Spring Security – Resource Server JWT"
    url: "https://docs.spring.io/spring-security/reference/servlet/oauth2/resource-server/jwt.html"
    description: "Cấu hình JWT, issuer, JWKS, chữ ký và kiểm tra claims."
  - title: "Spring Security – Resource Server Opaque Token"
    url: "https://docs.spring.io/spring-security/reference/servlet/oauth2/resource-server/opaque-token.html"
    description: "Xác thực token bằng introspection và lấy quyền từ scope."
  - title: "Spring Security – Resource Server Multi-tenancy"
    url: "https://docs.spring.io/spring-security/reference/servlet/oauth2/resource-server/multitenancy.html"
    description: "Xác định và xác thực nhiều issuer hoặc tenant được tin cậy."
  - title: "Spring Security – Method Security"
    url: "https://docs.spring.io/spring-security/reference/servlet/authorization/method-security.html"
    description: "Áp dụng phân quyền cấp phương thức bằng @EnableMethodSecurity và @PreAuthorize."
  - title: "Spring Security – Testing OAuth 2.0"
    url: "https://docs.spring.io/spring-security/reference/servlet/test/mockmvc/oauth2.html"
    description: "Kiểm thử JWT và cấu hình OAuth2 bằng Spring Security Test và MockMvc."
  - title: "OpenID Connect Core 1.0"
    url: "https://openid.net/specs/openid-connect-core-1_0.html"
    description: "Phân biệt OIDC identity layer, ID Token và các khái niệm xác thực."
  - title: "RFC 6750 – OAuth 2.0 Bearer Token Usage"
    url: "https://www.rfc-editor.org/rfc/rfc6750"
    description: "Quy tắc truyền Bearer token qua HTTP và biện pháp giảm rủi ro."