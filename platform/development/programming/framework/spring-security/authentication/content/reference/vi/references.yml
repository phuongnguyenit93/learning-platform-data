references:
  - title: "Spring Security: Kiến trúc xác thực Servlet (Servlet Authentication Architecture)"
    url: "https://docs.spring.io/spring-security/reference/servlet/authentication/architecture.html"
    description: "Mô hình Authentication, SecurityContext, AuthenticationManager, ProviderManager và các thành phần xác thực."
  - title: "Spring Security: Dữ liệu người dùng (UserDetailsService)"
    url: "https://docs.spring.io/spring-security/reference/servlet/authentication/passwords/user-details-service.html"
    description: "Nạp thông tin tài khoản phục vụ xác thực tên người dùng và mật khẩu qua DaoAuthenticationProvider."
  - title: "Spring Security: Lưu trữ mật khẩu (Password Storage)"
    url: "https://docs.spring.io/spring-security/reference/features/authentication/password-storage.html"
    description: "PasswordEncoder, hàm băm mật khẩu thích ứng và định dạng của DelegatingPasswordEncoder."
  - title: "Spring Security: Đăng nhập biểu mẫu (Form Login)"
    url: "https://docs.spring.io/spring-security/reference/servlet/authentication/passwords/form.html"
    description: "Luồng tiếp nhận tên người dùng, mật khẩu và xử lý kết quả đăng nhập trong Servlet."
  - title: "Spring Security: Xác thực HTTP Basic (Basic Authentication)"
    url: "https://docs.spring.io/spring-security/reference/servlet/authentication/passwords/basic.html"
    description: "Luồng BasicAuthenticationFilter, AuthenticationManager và phản hồi yêu cầu xác thực."
  - title: "Spring Security: Lưu kết quả xác thực (Persisting Authentication)"
    url: "https://docs.spring.io/spring-security/reference/servlet/authentication/persistence.html"
    description: "SecurityContextRepository và sự khác biệt giữa nạp ngữ cảnh với lưu ngữ cảnh cho yêu cầu tiếp theo."
  - title: "Spring Security: Quản lý phiên xác thực"
    url: "https://docs.spring.io/spring-security/reference/servlet/authentication/session-management.html"
    description: "Duy trì xác thực, chính sách tạo phiên, bảo vệ chống cố định phiên và kiểm soát phiên đồng thời."
  - title: "Spring Security: Ghi nhớ đăng nhập (Remember-Me Authentication)"
    url: "https://docs.spring.io/spring-security/reference/servlet/authentication/rememberme.html"
    description: "Cơ chế đăng nhập lại qua cookie và các chiến lược remember-me có sẵn."
  - title: "Spring Security: Xử lý đăng xuất (Handling Logouts)"
    url: "https://docs.spring.io/spring-security/reference/servlet/authentication/logout.html"
    description: "Vòng đời đăng xuất, xóa ngữ cảnh bảo mật, hủy phiên và dọn thông tin liên quan."
  - title: "Spring Security API: AuthenticationProvider"
    url: "https://docs.spring.io/spring-security/reference/api/java/org/springframework/security/authentication/AuthenticationProvider.html"
    description: "Hợp đồng supports và authenticate khi triển khai thành phần kiểm tra danh tính tùy chỉnh."
  - title: "Spring Security: Sự kiện xác thực (Authentication Events)"
    url: "https://docs.spring.io/spring-security/reference/servlet/authentication/events.html"
    description: "AuthenticationEventPublisher và các sự kiện thành công hoặc thất bại để quan sát luồng xác thực."
  - title: "Spring Security: Mô phỏng người dùng trong kiểm thử Spring MVC"
    url: "https://docs.spring.io/spring-security/reference/servlet/test/mockmvc/authentication.html"
    description: "Thiết lập người dùng, Authentication hoặc SecurityContext trong MockMvc; phân biệt với đăng nhập bằng thông tin xác thực."
  - title: "Spring Security: Kiểm thử đăng nhập biểu mẫu"
    url: "https://docs.spring.io/spring-security/reference/servlet/test/mockmvc/form-login.html"
    description: "Tạo yêu cầu đăng nhập bằng tên người dùng, mật khẩu và CSRF token để kiểm thử luồng xác thực."