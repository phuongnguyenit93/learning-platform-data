    description: "Multi-threaded step, parallel steps, local chunking, partitioning và remote chunking."
  - title: "Spring Batch - Commit Interval"
    url: "https://docs.spring.io/spring-batch/reference/step/chunk-oriented-processing/commit-interval.html"
    description: "Cấu hình chunk size và ranh giới commit trong xử lý theo chunk."
  - title: "Spring Batch - Skip Logic"
    url: "https://docs.spring.io/spring-batch/reference/step/chunk-oriented-processing/configuring-skip.html"
    description: "Chính sách skip, giới hạn bỏ qua và hành vi khi ghi thất bại."
  - title: "Spring Batch - Restarting Steps"
    url: "https://docs.spring.io/spring-batch/reference/step/chunk-oriented-processing/restart.html"
    description: "Cấu hình giới hạn khởi động và khôi phục các Step sau lỗi."
  - title: "Spring Batch - Observability"
    url: "https://docs.spring.io/spring-batch/reference/spring-batch-observability.html"
    description: "Theo dõi và quan sát batch job bằng Micrometer và Java Flight Recorder."