  - Lịch chạy batch
  - JobParameters từ scheduler
  - Prevent overlapping execution
  - Lock khi nhiều scheduler instance
  - Misfire và missed schedule
  - Chạy lại sau failure
  - Dependency giữa các job
  - Job completion signal
  - Time zone của schedule
  - Run window và deadline
  - Audit lần launch
- level1: Monitoring
  level2:
  - Đếm read, write, filter và skip
  - Theo dõi commit count
  - Theo dõi retry count
  - Theo dõi thời gian mỗi chunk
  - Theo dõi step duration
  - Theo dõi job duration
  - Tỷ lệ failure theo job
  - Metadata cho audit
  - Log job instance và execution
  - Correlation với request hoặc scheduler
  - Alert job không tiến triển
  - Dashboard batch operational
- level1: Logging
  level2:
  - Log ở job listener
  - Log ở step listener
  - Log item lỗi an toàn
  - Không log toàn bộ dữ liệu nhạy cảm
  - Gắn job execution ID
  - Gắn step execution ID
  - Gắn chunk hoặc item key
  - Structured log cho batch
  - Log retry và recovery
  - Log restart point
  - Giảm log trên job lớn
  - Đối chiếu log với metadata
- level1: Performance
  level2:
  - Throughput theo chunk
  - Latency của reader processor writer
  - Commit interval tuning
  - Fetch size và page size
  - Batch update size
  - Memory của chunk
  - CPU trong processor
  - I/O của reader và writer
  - Connection pool
  - GC và object allocation
  - Tối ưu mà không phá restart
  - Benchmark dữ liệu đại diện
- level1: Failure recovery
  level2:
  - Failure ở reader
  - Failure ở processor
  - Failure ở writer
  - Failure khi commit
  - Failure khi cập nhật metadata
  - Process bị kill
  - Database mất kết nối
  - File system đầy
  - Remote service timeout
  - Dữ liệu lỗi hàng loạt
  - Recovery bằng retry hoặc restart
  - Runbook xử lý failure
- level1: Data quality
  level2:
  - Validate đầu vào trước batch
  - Quarantine item lỗi
  - Skip và báo cáo rejected item
  - Đối chiếu tổng input và output
  - Reconciliation sau job
  - Duplicate detection
  - Missing record detection
  - Data type và format validation
  - Schema version của input
  - Business rule trong processor
  - Báo cáo chất lượng dữ liệu
  - Không biến skip thành mất dữ liệu im lặng
- level1: Security
  level2:
  - Secret trong JobParameters
  - Không ghi credential vào ExecutionContext
  - Quyền đọc input resource
  - Quyền ghi output resource
  - Database credential
  - Mã hóa file nhạy cảm
  - Mask dữ liệu trong log
  - Phân quyền launch và stop job
  - Audit operator action
  - Validate input tránh injection
  - Bảo vệ metadata repository
- level1: Lỗi thường gặp
  level2:
  - Dùng thời gian hiện tại để luôn tạo JobInstance mới
  - Chạy lại job COMPLETED như restart
  - Không lưu reader state
  - Reader không restartable nhưng job cần restart
  - Writer tạo duplicate output
  - Skip quá rộng che lỗi dữ liệu
  - Retry lỗi vĩnh viễn
  - Chunk quá lớn gây thiếu bộ nhớ
  - Chunk quá nhỏ làm throughput thấp
  - Gọi remote service trong transaction dài
  - Không dọn file tạm sau failure
  - Test chỉ kiểm tra exit code
  - Không kiểm tra ExecutionContext
- level1: Quyết định thiết kế
  level2:
  - Chọn chunk hay tasklet
  - Chọn reader database hay file
  - Chọn cursor hay paging
  - Chọn skip hay fail fast
  - Chọn retry hay restart
  - Chọn metadata database hay cơ chế khác
  - Chọn synchronous hay asynchronous launch
  - Chọn một job lớn hay nhiều job nhỏ
  - Chọn output transaction hay outbox
  - Đánh đổi throughput với khả năng phục hồi
  - Ghi giả thiết và giới hạn của job
- level1: Dự án thực hành
  level2:
  - Tạo job đọc file CSV và ghi database
  - Thêm processor validate và map dữ liệu
  - Cấu hình JobRepository và JobLauncher
  - Thiết kế JobParameters định danh lần chạy
  - Thêm chunk transaction và checkpoint
  - Xử lý skip dữ liệu lỗi với báo cáo
  - Thêm retry lỗi tạm thời
  - Kiểm tra restart sau khi process bị dừng
  - Tạo job flow nhiều step
  - Thêm listener và metric
  - Viết unit và integration test
  - Đưa job vào scheduler
  - Tạo runbook cho failure và recovery
