  - Khai báo tài nguyên XML cần kiểm tra
  - Đăng ký service giả bằng MockFlowBuilderContext
  - MockExternalContext cho input, sự kiện và người dùng
  - Khởi chạy flow và kiểm tra state đầu tiên
  - Tiếp tục flow bằng một sự kiện
  - Thiết lập state hiện tại để kiểm tra một nhánh cụ thể
  - Kiểm tra dữ liệu trong flowScope và conversationScope
  - Kiểm tra trạng thái kết thúc, outcome và output
  - Giả lập subflow cùng dữ liệu đầu vào, đầu ra
  - Nạp tài nguyên flow cha khi kiểm tra inheritance
  - Tổ chức đường dẫn kiểm thử cho thành công, lỗi, quay lại và hủy
  - Chạy kiểm thử kế thừa TestCase qua JUnit Platform với engine tương thích
- level1: Kiểm thử tích hợp
  level2:
  - Đối chiếu kiểm thử bộ máy flow với kiểm thử qua HTTP
  - Kiểm tra FlowHandlerMapping, adapter và ViewResolver
  - Duy trì session, cookie và execution key qua nhiều yêu cầu
  - Kiểm tra binding, conversion và validation từ dữ liệu form
  - Kiểm tra quyền ở URL, flow, state và transition
  - Kiểm tra token CSRF cho các yêu cầu thay đổi trạng thái
  - Kiểm tra commit, hủy và xung đột khóa lạc quan
  - Kiểm tra Back, Refresh, nhiều tab và phiên hết hạn
  - Kiểm tra Ajax và giao diện Faces khi có sử dụng
  - Tự động hóa trình duyệt cho hành trình hoàn chỉnh
  - Kiểm tra service không ghi lặp khi gửi xác nhận nhiều lần
  - Chọn dữ liệu kiểm thử và dọn trạng thái sau mỗi ca
- level1: Chẩn đoán lỗi
  level2:
  - Đọc log khởi tạo registry và dựng định nghĩa
  - Flow không được tìm thấy do đường dẫn hoặc định danh
  - State đích thiếu và transition không khớp sự kiện
  - Lỗi biểu thức, tên bean và phương thức không phù hợp
  - Dữ liệu mất do chọn sai scope hoặc sai tên biến
  - Form không cập nhật model do binding và conversion
  - Validation không chạy hoặc chặn nhầm sự kiện quay lại
  - Execution key không hợp lệ và snapshot không còn
  - NotSerializableException và đối tượng được giữ trong mô hình
  - Lỗi view, tài nguyên Faces và cấu hình ViewResolver
  - Lỗi dependency javax/Jakarta hoặc thư viện không tương thích
  - Tái hiện lỗi bằng một flow nhỏ và chuỗi yêu cầu xác định
