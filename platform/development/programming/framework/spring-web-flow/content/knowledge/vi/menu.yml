  - Đo thời gian hành động, truy vấn dữ liệu và hiển thị view
  - Kiểm soát khóa khi nhiều yêu cầu dùng cùng execution
  - HTTP session, cân bằng tải và lựa chọn gắn phiên
  - Sao chép hoặc lưu session tập trung và yêu cầu tương thích dữ liệu
  - Kiểm tra khả năng khôi phục execution khi chuyển máy chủ
  - Triển khai phiên bản mới khi còn flow đang hoạt động
  - Tách tác vụ lâu chạy khỏi thời gian xử lý một yêu cầu
