  - Liên kết cũ sau khi flow đã hoàn thành
  - Phiên hết hạn và trạng thái không còn trong repository
  - Snapshot bị loại bỏ do vượt giới hạn lịch sử
  - Thuộc tính history của transition và các lựa chọn điều hướng
  - Quay lại state cũ và dữ liệu đã thay đổi bên ngoài flow
  - Thiết kế trang khôi phục hoặc bắt đầu lại có kiểm soát
- level1: Dữ liệu và giao dịch
  level2:
  - Tách trạng thái biểu mẫu khỏi dữ liệu đã lưu
  - Lưu qua tầng service và làm việc với đối tượng tách rời
  - Flow-managed persistence và thời gian sống của persistence context
  - Khai báo persistence-context cho một flow
  - JpaFlowExecutionListener và EntityManager theo flow
  - Tích hợp Hibernate theo khả năng của phiên bản sử dụng
  - Đọc dữ liệu trong nhiều yêu cầu trước khi xác nhận
  - End-state có commit và kết thúc không commit
  - Lan truyền persistence context sang subflow
  - Vai trò của transaction ở thời điểm ghi nhận thay đổi
  - Tránh ghi sớm các chỉnh sửa còn đang chờ xác nhận
  - Khóa lạc quan và xung đột chỉnh sửa giữa nhiều người dùng
  - Phân biệt khôi phục snapshot với hoàn tác thay đổi trong cơ sở dữ liệu
  - Thiết kế bản nháp lưu bền và cơ chế tiếp tục theo nghiệp vụ
  - Chống xử lý trùng tại service khi xác nhận bị gửi lại
- level1: Bảo vệ flow
  level2:
  - Ranh giới xác thực, phân quyền và kiểm tra dữ liệu
  - Cấu hình Spring Security cho URL khởi chạy và tiếp tục flow
  - Phần tử secured ở flow, state và transition
  - Gắn SecurityFlowExecutionListener vào FlowExecutor
  - Quyết định phân quyền theo cơ chế của phiên bản Spring Security
  - Tùy chỉnh AuthorizationManager trên các phiên bản hỗ trợ
  - Để lỗi AccessDenied được xử lý đúng tại ranh giới bảo mật
  - Kiểm tra quyền sở hữu đối tượng từ flow input
  - Giới hạn thuộc tính được binding ở từng màn hình
  - Tích hợp CSRF vào form và yêu cầu phát sự kiện
  - Vai trò riêng của execution key, phiên đăng nhập và CSRF token
  - Xử lý thay đổi đăng nhập, đăng xuất và hết phiên giữa hành trình
  - Kiểm soát redirect, biểu thức và dữ liệu hiển thị
  - Giảm dữ liệu nhạy cảm trong scope, snapshot và log
- level1: Tích hợp JSF
  level2:
  - Vai trò của spring-faces và Jakarta Faces trong ứng dụng Web Flow
  - Kiểm tra phiên bản Faces, Servlet và thư viện thành phần
  - Khởi tạo FacesServlet và định tuyến qua DispatcherServlet
  - AbstractFacesFlowConfiguration và cấu hình Java tương ứng
  - JsfFlowHandlerAdapter và view factory cho Faces
  - Facelets, định danh view và tài nguyên giao diện
  - Tham chiếu dữ liệu các scope bằng EL của Faces
  - Vòng đời JSF và ranh giới với vòng đời flow
  - Điều hướng bằng kết quả action và sự kiện của thành phần
  - Chuyển kiểu, kiểm tra dữ liệu và thông báo trên form JSF
  - Xử lý Ajax và cập nhật thành phần trong cùng view-state
  - Nhúng flow vào một trang theo cơ chế được hỗ trợ
  - Tích hợp thư viện thành phần, tải tệp và tài nguyên liên quan
  - Thẻ bảo mật Facelets và kiểm tra quyền ở phía máy chủ
- level1: Ajax và phân mảnh
  level2:
  - Nhận diện yêu cầu Ajax ở ranh giới flow
  - AjaxHandler và giao thức phản hồi của thư viện giao diện
  - Render toàn view và render một phần
  - Phần tử render và danh sách fragments
  - Transition ở cùng màn hình để cập nhật dữ liệu
  - Điều kiện công nghệ view phải hỗ trợ render phân mảnh
  - Redirect và báo lỗi trong phản hồi Ajax
  - Cập nhật execution key sau một tương tác
  - Đồng bộ dữ liệu form khi có nhiều yêu cầu liên tiếp
  - Chống bấm liên tục và xử lý phản hồi đến khác thứ tự
  - Đọc ứng dụng Spring JavaScript cũ và đánh giá phương án thay thế
- level1: Ngoại lệ và phục hồi
  level2:
  - Phân biệt kết quả nghiệp vụ thất bại với lỗi kỹ thuật
  - Bắt lỗi trong action và trả sự kiện có ý nghĩa
  - Transition on-exception ở phạm vi thích hợp
  - Xử lý lỗi chung bằng global transitions
  - FlowExecutionException và ngữ cảnh flow, state gây lỗi
  - FlowExecutionExceptionHandler và trạng thái nhất quán sau xử lý
  - Dùng TransitionExecutingFlowExecutionExceptionHandler khi phù hợp
  - Phân biệt lỗi bên trong flow với lỗi khôi phục execution
  - Xử lý lỗi render mà không làm mất dấu nguyên nhân
  - Quyết định thử lại, quay lại hoặc kết thúc hành trình
  - Bù trừ tác động bên ngoài đã xảy ra trước khi lỗi
  - Thông báo cho người dùng và giữ dữ liệu cần thiết để xử lý tiếp
- level1: Listener và mở rộng
  level2:
  - FlowExecutionListener và các điểm quan sát vòng đời
  - Đăng ký listener cho toàn bộ hoặc một nhóm flow
  - Phân biệt callback của listener với action trong định nghĩa
  - Theo dõi khởi tạo, chuyển state, tạm dừng và tiếp tục
  - Ghi nhận kết quả hoàn thành, hủy và lỗi
  - Thứ tự listener bảo mật, dữ liệu và listener tùy chỉnh
  - Truy cập RequestContext và FlowExecutionContext đúng thời điểm
  - Tùy chỉnh ViewFactoryCreator khi tích hợp giao diện
  - Tùy chỉnh ExpressionParser, conversion và validation
  - Mở rộng repository hoặc ConversationManager khi có yêu cầu cụ thể
  - Giữ thành phần singleton an toàn khi phục vụ nhiều execution
  - Kiểm thử mở rộng bằng các hợp đồng và tình huống lỗi
- level1: Kiểm thử flow
  level2:
  - Phạm vi kiểm thử định nghĩa và hành vi điều hướng
