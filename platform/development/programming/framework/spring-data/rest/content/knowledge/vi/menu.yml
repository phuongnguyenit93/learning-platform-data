menu:
- level1: Tổng quan
  level2:
  - Spring Data REST là gì và bài toán tự động công bố repository qua HTTP
  - Vai trò của tài nguyên, biểu diễn, liên kết và phương thức HTTP
  - Mối liên hệ giữa Spring Data REST, Spring Data, Spring MVC và Spring HATEOAS
  - Từ mô hình miền đến repository, tài nguyên tập hợp và tài nguyên đơn
  - REST, HATEOAS và khả năng khám phá API qua liên kết
  - So sánh API từ repository với API tự viết Controller–Service–DTO
  - 'Các trường hợp phù hợp: CRUD, công cụ nội bộ và tra cứu dữ liệu'
  - Giới hạn với nghiệp vụ nhiều bước, hợp đồng công khai và mô hình miền phức tạp
  - Kiến thức nền cần có và thứ tự học Spring Data REST
- level1: Khởi tạo
  level2:
  - Lựa chọn phiên bản tương thích của Java, Spring Boot và Spring Data REST
  - Quản lý dependency bằng Spring Boot BOM hoặc Spring Data BOM
  - Thêm spring-boot-starter-data-rest với Maven và Gradle
  - Lựa chọn kho dữ liệu và kiểm tra mức hỗ trợ xuất REST theo phiên bản
  - Tạo ứng dụng mẫu với Spring Data JPA, H2 và dữ liệu khởi tạo
  - Khai báo entity, repository và chạy API đầu tiên
  - Cơ chế tự cấu hình Spring Boot và điều kiện để repository được phát hiện
  - Tích hợp spring-data-rest-webmvc vào ứng dụng Spring MVC hiện có
  - Cấu hình spring.data.rest.* và RepositoryRestConfigurer
  - Dùng curl và HAL Explorer kiểm tra tài nguyên gốc
- level1: Mô hình miền
  level2:
  - Thực thể, đối tượng giá trị và ranh giới cụm nghiệp vụ (aggregate)
  - Lựa chọn mô hình miền phù hợp để công bố trực tiếp qua REST
  - Định danh tài nguyên với Long, UUID và kiểu ID tùy chỉnh
  - Phân biệt ID lưu trữ, URI tài nguyên và khóa nghiệp vụ
  - Thuộc tính đơn, đối tượng lồng và quan hệ giữa các thực thể
  - Ảnh hưởng của việc có repository riêng đến cách biểu diễn quan hệ
  - Quan hệ một-một, một-nhiều và nhiều-nhiều trong ví dụ JPA
  - Phía sở hữu quan hệ, mappedBy, cascade và orphanRemoval trong JPA
  - Thiết kế bất biến nghiệp vụ khi người dùng có thể ghi trực tiếp vào entity
  - Phân biệt hành vi chung của REST exporter và đặc điểm riêng của kho dữ liệu
- level1: Luồng xử lý
  level2:
  - Các thành phần chính của REST exporter và RepositoryRestMvcConfiguration
  - RepositoryRestHandlerMapping lựa chọn bộ xử lý yêu cầu như thế nào
  - Các bộ xử lý tài nguyên tập hợp, tài nguyên đơn, liên kết và tìm kiếm
  - Đọc metadata repository, kiểu miền và phương thức CRUD khả dụng
  - Chuyển đổi tham số đường dẫn, query parameter và request body
  - Ánh xạ lời gọi HTTP đến phương thức repository
  - Vị trí của validation, sự kiện, phân quyền và tuần tự hóa trong luồng xử lý
  - Quan hệ giữa cấu hình Spring MVC thông thường và hạ tầng riêng của Spring Data REST
- level1: Công bố repository
  level2:
  - '@RepositoryRestResource và các thuộc tính điều khiển công bố tài nguyên'
  - 'RepositoryDetectionStrategy: DEFAULT, ALL, VISIBILITY và ANNOTATED'
  - Ảnh hưởng của phạm vi public và annotation đến việc phát hiện repository
  - Ẩn toàn bộ repository bằng exported = false
  - Ẩn phương thức CRUD hoặc truy vấn bằng @RestResource(exported = false)
  - Chọn phương thức công bố với Repository, CrudRepository và JpaRepository
  - Vai trò của PagingAndSortingRepository và thay đổi quan hệ kế thừa theo phiên bản
  - '@NoRepositoryBean và interface repository cơ sở dùng chung'
  - ExposureConfiguration để giới hạn HTTP method toàn cục hoặc theo kiểu miền
  - Phân biệt khóa POST, PUT, PATCH khi cùng dựa trên phương thức save
  - Rà soát các biến thể phương thức delete và thiết kế repository chỉ đọc
- level1: Đường dẫn tài nguyên
  level2:
  - Cấu hình base path và phân biệt với servlet context path
  - Quy tắc suy ra đường dẫn mặc định từ tên kiểu miền
  - Tùy chỉnh path, collectionResourceRel và itemResourceRel
  - Phân biệt đường dẫn URL và tên quan hệ liên kết (rel)
  - Tùy chỉnh đường dẫn và rel của phương thức tìm kiếm
  - Tùy chỉnh đường dẫn tài nguyên liên kết trên thuộc tính quan hệ
  - Tùy chỉnh URI định danh bằng EntityLookup và withEntityLookup
  - Chuyển đổi ID bằng BackendIdConverter, mã hóa URL và xử lý ID không hợp lệ
  - Tránh trùng đường dẫn giữa repository và Controller tự viết
- level1: HAL và HATEOAS
  level2:
  - Cấu trúc biểu diễn HAL với _links, _embedded và dữ liệu nghiệp vụ
  - Ý nghĩa của self, profile, search và liên kết quan hệ
  - Biểu diễn tài nguyên đơn, tập hợp và kết quả phân trang
  - URI template, thuộc tính templated và cách điền tham số
  - Khám phá tài nguyên từ API gốc thay vì ghép cứng URL
  - Thương lượng nội dung bằng Accept và Content-Type
  - Phân biệt application/hal+json và application/json theo cấu hình
  - Biểu diễn tập hợp rỗng, liên kết vắng mặt và quan hệ tùy chọn
  - Ảnh hưởng của thay đổi rel và cấu trúc biểu diễn đến máy khách
  - HAL-FORMS và biểu mẫu thao tác khi phiên bản, media type hỗ trợ
- level1: Đọc tài nguyên
  level2:
  - GET tài nguyên gốc và xác định các repository đang được công bố
  - GET tập hợp và phương thức findAll được sử dụng
  - GET tài nguyên đơn và phương thức findById
  - HEAD để kiểm tra tài nguyên và đọc header
  - OPTIONS và Allow để kiểm tra HTTP method khả dụng
  - Phân biệt tài nguyên không tồn tại, tập hợp rỗng và phương thức bị tắt
  - Đọc Location, Content-Type và các header trong phản hồi
  - Thực hành lần theo liên kết từ tập hợp đến tài nguyên đơn
- level1: Ghi tài nguyên
  level2:
  - POST tạo tài nguyên và xác định các thuộc tính được phép ghi
  - 201 Created, Location và cách lấy biểu diễn sau khi tạo
  - PUT thay thế tài nguyên và tác động lên thuộc tính bị bỏ qua
  - Khả năng tạo tài nguyên bằng PUT và cấu hình disablePutForCreation
  - PATCH cập nhật một phần và phân biệt với PUT
  - Cập nhật từng phần bằng JSON theo media type được hỗ trợ
  - JSON Patch với application/json-patch+json và các thao tác cơ bản
  - JSON Merge Patch với application/merge-patch+json
  - Phân biệt trường bị bỏ qua, giá trị null và thay thế mảng khi cập nhật
  - DELETE tài nguyên và ảnh hưởng của ràng buộc dữ liệu
  - Cấu hình returnBodyOnCreate, returnBodyOnUpdate và ảnh hưởng của Accept
  - Phân biệt 200, 201, 204 và lỗi phương thức không được hỗ trợ
  - Tính lũy đẳng của HTTP method và rủi ro gửi lại yêu cầu ghi
- level1: Tài nguyên liên kết
  level2:
  - Phân biệt liên kết HAL và tài nguyên thao tác quan hệ
  - Đường dẫn /{collection}/{id}/{property} cho quan hệ
  - GET quan hệ đơn và quan hệ tập hợp
  - Gửi tham chiếu tài nguyên bằng URI trong JSON khi tạo hoặc cập nhật
  - text/uri-list và cách biểu diễn một hoặc nhiều URI
  - PUT để thiết lập hoặc thay thế quan hệ
  - POST để bổ sung phần tử vào quan hệ tập hợp
  - DELETE để gỡ liên kết và phân biệt với xóa thực thể đích
  - Gỡ một phần tử khỏi quan hệ tập hợp bằng URI thành viên
  - Quan hệ bắt buộc, URI không tồn tại và lỗi số lượng tham chiếu
  - Ảnh hưởng của phía sở hữu quan hệ và transaction khi cập nhật liên kết
  - Ẩn quan hệ bằng @RestResource và kiểm soát đường ghi còn lại
- level1: Truy vấn tìm kiếm
  level2:
  - Tài nguyên /search và cơ chế khám phá các phương thức truy vấn
  - Công bố derived query method thành tài nguyên chỉ đọc
  - Đặt tên tham số truy vấn bằng @Param
  - Tùy chỉnh path và rel của truy vấn bằng @RestResource
  - Công bố truy vấn @Query và giữ logic truy vấn trong tầng repository
  - Kiểu trả về đơn, Optional, tập hợp, Page và Slice
  - Kết hợp tham số nghiệp vụ với Pageable và Sort
  - Chuyển đổi enum, ngày giờ và kiểu tham số tùy chỉnh
  - Tham số thiếu, giá trị không hợp lệ và kết quả không có dữ liệu
  - Giới hạn của lọc tự động từ query parameter và lựa chọn truy vấn tường minh
  - QuerydslPredicateExecutor và tùy chỉnh binding khi phiên bản, kho dữ liệu hỗ trợ
  - Giới hạn thuộc tính được phép lọc bằng QuerydslBinderCustomizer
  - Giới hạn công bố truy vấn ghi dữ liệu hoặc truy vấn tốn tài nguyên
- level1: Phân trang và sắp xếp
  level2:
  - Điều kiện để tài nguyên tập hợp hỗ trợ phân trang và sắp xếp
  - Tham số page, size và quy ước chỉ số trang bắt đầu từ 0
  - 'Metadata phân trang: number, size, totalElements và totalPages'
  - Liên kết first, prev, next và last trong kết quả phân trang
  - 'Page và Slice: tổng số phần tử, chi phí đếm và liên kết điều hướng'
  - Cấu hình kích thước trang mặc định và kích thước tối đa
  - Tùy chỉnh tên tham số phân trang và sắp xếp
  - Sắp xếp tăng, giảm và nhiều thuộc tính bằng sort
  - Sắp xếp thuộc tính lồng và giới hạn với quan hệ được biểu diễn bằng liên kết
  - Thứ tự ổn định, trang vượt phạm vi và dữ liệu thay đổi giữa các lần đọc
- level1: Projections và Excerpts
  level2:
  - Projection là gì và nhu cầu thay đổi góc nhìn dữ liệu
  - Khai báo interface @Projection với name và types
  - Chọn projection bằng query parameter projection
  - Cơ chế quét package và đăng ký projection tường minh
  - Projection lồng nhau và thay đổi cách hiển thị quan hệ
  - Thuộc tính tính toán với @Value và biểu thức SpEL
  - Excerpt projection và cấu hình excerptProjection trên repository
  - Phân biệt excerpt mặc định và projection do máy khách yêu cầu
  - Phạm vi áp dụng excerpt với tập hợp, quan hệ và tài nguyên đơn
  - Projection có thể làm lộ dữ liệu đã ẩn bằng @JsonIgnore
  - Giới hạn của projection đối với đầu vào ghi, phân quyền và hợp đồng DTO
- level1: Ánh xạ JSON
  level2:
  - ObjectMapper của Spring Data REST và cơ chế ánh xạ entity–liên kết
  - Tuần tự hóa đối tượng được quản lý và đối tượng lồng thông thường
  - Điều khiển tên thuộc tính bằng @JsonProperty và quy tắc đặt tên
  - '@JsonIgnore, thuộc tính chỉ đọc và thuộc tính chỉ ghi'
  - Chủ động công bố ID bằng exposeIdsFor khi cần
  - Ánh xạ enum, ngày giờ, tiền tệ và kiểu giá trị tùy chỉnh
  - Đăng ký Jackson Module, serializer và deserializer tùy chỉnh
  - Ánh xạ interface hoặc lớp trừu tượng sang kiểu triển khai
  - Quan hệ hai chiều, vòng lặp JSON và tác động của Hibernate proxy
  - Kiểm soát mass assignment và dữ liệu đầu vào ngoài dự kiến
- level1: Kiểm tra dữ liệu
  level2:
  - Phân biệt kiểm tra cú pháp JSON, ràng buộc dữ liệu và quy tắc nghiệp vụ
  - Khai báo Jakarta Bean Validation và xác minh điểm thực sự kích hoạt
  - Triển khai Spring Validator với supports và validate
  - Đăng ký validator bằng tiền tố bean beforeCreate và beforeSave
  - Đăng ký tường minh qua configureValidatingRepositoryEventListener
  - Validation cho tạo mới, cập nhật và thay đổi liên kết
  - Kiểm tra trường bắt buộc, ràng buộc chéo trường và thông báo đa ngôn ngữ
  - Phối hợp validator với ràng buộc duy nhất và khóa ngoại trong cơ sở dữ liệu
  - Định dạng lỗi validation và kiểm thử dữ liệu không hợp lệ
- level1: Sự kiện REST
  level2:
  - Vòng đời sự kiện của REST exporter và điểm mở rộng xử lý
  - BeforeCreateEvent và AfterCreateEvent khi tạo tài nguyên
  - BeforeSaveEvent và AfterSaveEvent khi cập nhật tài nguyên
  - BeforeLinkSaveEvent và AfterLinkSaveEvent khi thay đổi liên kết
  - BeforeDeleteEvent và AfterDeleteEvent khi xóa tài nguyên
  - Viết listener bằng ApplicationListener và AbstractRepositoryEventListener
  - '@RepositoryEventHandler và các annotation @HandleBefore*, @HandleAfter*'
  - Đăng ký handler thành Spring bean và giới hạn kiểu miền
  - Tính đồng bộ mặc định, thứ tự xử lý và ngoại lệ trong listener
  - Phân biệt REST event, repository domain event và callback của JPA
  - Giới hạn của REST event khi repository được gọi từ luồng ngoài HTTP
- level1: Giao dịch và auditing
  level2:
  - Ranh giới transaction của repository và luồng gọi REST exporter
  - Vì sao sự kiện After* không đồng nghĩa với transaction đã commit
  - Thực thi tác vụ sau commit bằng cơ chế transaction phù hợp
  - Nghiệp vụ nhiều repository và nhu cầu điều phối ở tầng service
  - Rollback, lỗi listener và tác động đến dữ liệu đã thay đổi
  - Auditing với @CreatedDate, @LastModifiedDate, @CreatedBy và @LastModifiedBy
  - Lấy người dùng hiện tại qua AuditorAware khi tích hợp Spring Security
  - Phân biệt kiểm toán dữ liệu, log HTTP và nhật ký nghiệp vụ
- level1: ETag và bộ nhớ đệm
  level2:
  - ETag và quan hệ với thuộc tính phiên bản @Version
  - Phân biệt annotation @Version của JPA và Spring Data
  - Khóa lạc quan tại kho dữ liệu và điều kiện HTTP tại REST API
  - If-Match cho PUT, PATCH, DELETE và phản hồi 412
  - If-None-Match cho GET và phản hồi 304 Not Modified
  - Last-Modified, @LastModifiedDate và điều kiện hỗ trợ auditing
  - If-Modified-Since và kiểm tra thời điểm thay đổi
  - Lưu ETag theo đúng URI, tham số và biểu diễn đã yêu cầu
  - Đồng bộ lại dữ liệu khi nhiều máy khách cùng chỉnh sửa
  - Phân biệt kiểm tra freshness bằng header và bộ nhớ đệm dữ liệu của ứng dụng
- level1: Xác thực và phân quyền
  level2:
  - Tích hợp SecurityFilterChain với các đường dẫn Spring Data REST
  - Xác thực bằng session hoặc bearer token theo kiến trúc ứng dụng
  - Bật bảo mật mức phương thức bằng @EnableMethodSecurity
  - '@PreAuthorize tại repository và phương thức CRUD'
  - Quy tắc phương thức ghi đè quy tắc bảo mật ở cấp repository
  - Rà soát toàn bộ phương thức save, delete và các biến thể được kế thừa
  - Phân quyền đọc, tạo, sửa, xóa và thao tác liên kết
  - Kiểm soát truy cập theo chủ sở hữu và ngăn truy cập chéo bản ghi
  - Giới hạn truy vấn theo người dùng hoặc tenant trong tầng dữ liệu
  - Bảo vệ trường nhạy cảm qua JSON, projection và liên kết quan hệ
  - Phân biệt ẩn tài nguyên, ẩn liên kết và thực thi kiểm tra quyền
  - CSRF, session cookie và chiến lược cho API dùng token
  - Phản hồi 401, 403 và kiểm thử truy cập không được phép
- level1: CORS
  level2:
  - Cùng nguồn, khác nguồn và cơ chế preflight của trình duyệt
  - Cấu hình @CrossOrigin trên repository
  - Cấu hình CORS cho Controller tùy chỉnh của Spring Data REST
  - Cấu hình toàn cục qua RepositoryRestConfigurer và CorsRegistry
  - Quan hệ giữa cấu hình CORS riêng của exporter và Spring MVC
  - Phối hợp CORS với Spring Security và yêu cầu OPTIONS
  - Origins, methods, headers, credentials và giới hạn wildcard
  - Cho phép trình duyệt đọc Location, ETag và các header cần thiết
- level1: Siêu dữ liệu
  level2:
  - Liên kết profile và khả năng tự mô tả của tài nguyên
  - ALPS mô tả thuộc tính và thao tác trên tài nguyên như thế nào
  - Descriptor, rel và các kiểu SEMANTIC, SAFE, IDEMPOTENT, UNSAFE
  - Khám phá các projection được công bố qua metadata
  - JSON Schema của tài nguyên và thương lượng media type
  - Bổ sung mô tả tài nguyên, thuộc tính và truy vấn bằng @Description
  - Quốc tế hóa mô tả bằng rest-messages.properties
  - Khác biệt giữa ALPS, JSON Schema và tài liệu hợp đồng OpenAPI
  - Khả năng và giới hạn của metadata đối với validation, phân quyền và nghiệp vụ
- level1: Mở rộng API
  level2:
  - 'Lựa chọn điểm mở rộng: cấu hình, processor, listener hoặc Controller'
  - '@RepositoryRestController và tích hợp với base path, converter, xử lý lỗi'
  - '@BasePathAwareController và phân biệt với @RestController thông thường'
  - Viết endpoint nghiệp vụ tùy chỉnh qua tầng service
  - Trả EntityModel, CollectionModel, PagedModel và ResponseEntity
  - PersistentEntityResourceAssembler cho biểu diễn entity nhất quán
  - Bổ sung liên kết và biểu diễn bằng RepresentationModelProcessor
  - Tạo liên kết repository bằng RepositoryEntityLinks
  - Nhận tham chiếu tài nguyên bằng AggregateReference khi phiên bản hỗ trợ
  - Giải quyết xung đột mapping và thay thế bộ xử lý mặc định có chủ đích
  - Giữ nguyên phân trang, projection, header và bảo mật khi tự xử lý endpoint
  - Ranh giới giữa mở rộng Spring Data REST và chuyển sang API dùng DTO riêng
- level1: Xử lý lỗi
  level2:
  - Cơ chế RepositoryRestExceptionHandler và phạm vi xử lý ngoại lệ
  - 400 cho tham số, JSON hoặc dữ liệu đầu vào không hợp lệ
  - 404 cho tài nguyên thiếu và phân biệt với truy vấn trả tập hợp rỗng
  - 405 và header Allow khi HTTP method bị vô hiệu hóa
  - 406 và 415 khi Accept hoặc Content-Type không được hỗ trợ
  - 409 cho xung đột ràng buộc dữ liệu và khóa lạc quan tùy trường hợp
  - 412 cho điều kiện If-Match không còn hợp lệ
  - Định dạng lỗi validation, lỗi liên kết và ngoại lệ nghiệp vụ
  - Tùy chỉnh xử lý lỗi bằng advice phù hợp với hạ tầng exporter
  - Thông báo an toàn cho máy khách, mã theo dõi và chi tiết dành cho log
- level1: Kiểm thử
  level2:
  - Phân biệt kiểm thử repository, cấu hình xuất REST và hợp đồng HTTP
  - Chọn @SpringBootTest, MockMvc hoặc HTTP thật theo phạm vi kiểm chứng
  - Chuẩn bị dữ liệu độc lập và dọn trạng thái giữa các ca kiểm thử
  - Kiểm tra API gốc, đường dẫn tài nguyên, rel và cấu trúc HAL
  - Kiểm tra GET, POST, PUT, PATCH, DELETE cùng status và header
  - Kiểm tra JSON Patch, Merge Patch, trường bị bỏ qua và giá trị null
  - Kiểm tra thêm, thay thế, gỡ liên kết và quan hệ bắt buộc
  - Kiểm tra search, chuyển đổi tham số, phân trang và sắp xếp
  - Kiểm tra projection, excerpt và dữ liệu nhạy cảm
  - Kiểm tra validation, sự kiện và rollback khi xử lý thất bại
  - Kiểm tra ETag với hai máy khách cập nhật đồng thời
  - Kiểm tra phân quyền, CSRF và CORS bằng Spring Security Test
  - Kiểm tra hợp đồng với cơ sở dữ liệu thật qua Testcontainers
  - Kiểm thử hồi quy việc công bố ngoài ý muốn khi thêm repository hoặc phương thức
- level1: Hiệu năng
  level2:
  - Đo độ trễ, số truy vấn và kích thước biểu diễn trước khi tối ưu
  - Nhận diện N+1 khi đọc quan hệ, projection và excerpt
  - Tối ưu truy vấn JPA bằng fetch plan và @EntityGraph khi phù hợp
  - Ảnh hưởng của lazy loading và Open Session in View
  - Giảm dữ liệu trả về bằng projection và giới hạn kích thước trang
  - Chi phí count query, Page, Slice và phân trang tập dữ liệu lớn
  - Thiết kế chỉ mục cho các truy vấn tìm kiếm được công bố
  - Giới hạn request body, truy vấn tốn tài nguyên và số yêu cầu
  - Đánh đổi giữa nhúng dữ liệu, lần theo liên kết và số lượt HTTP
- level1: Vận hành
  level2:
  - Tách cấu hình phát triển, kiểm thử và production
  - Triển khai sau reverse proxy với context path và base path
  - Forwarded header, HTTPS và tính đúng đắn của liên kết tuyệt đối
  - Giới hạn tin cậy proxy để tránh sinh liên kết từ host giả mạo
  - Quan sát request bằng log, tracing và metrics
  - Tích hợp health check và quản lý quyền truy cập Actuator
  - Quản lý thời gian chờ, connection pool và lỗi kho dữ liệu
  - Kiểm soát việc bật HAL Explorer trong môi trường triển khai
  - Rà soát bề mặt API được công bố sau mỗi lần phát hành
- level1: Tích hợp máy khách
  level2:
  - Khám phá API bằng HAL Explorer và đọc URI template
  - Thực hiện chuỗi thao tác bằng curl hoặc Postman
  - Đọc HAL từ ứng dụng JavaScript và xử lý _embedded, _links
  - Điều hướng theo rel và mở rộng URI template an toàn
  - Tạo mới qua Location và quản lý URI của tài nguyên
  - Quản lý phân trang, projection và trạng thái dữ liệu trên giao diện
  - Lưu ETag và xử lý xung đột chỉnh sửa trên giao diện
  - Phân biệt retry yêu cầu đọc với gửi lại thao tác tạo hoặc cập nhật
- level1: Thiết kế và nâng cấp
  level2:
  - Phân định API công bố repository và API nghiệp vụ tự thiết kế
  - Giảm phụ thuộc giữa cấu trúc entity và hợp đồng HTTP
  - Quản lý thay đổi tên trường, path, rel và projection
  - Versioning hợp đồng API và chiến lược chuyển tiếp cho máy khách
  - Giới hạn REST exporter với nghiệp vụ nhiều bước và transaction xuyên tài nguyên
  - Kiểm tra tương thích Spring Boot, Spring Data REST, Spring HATEOAS và Jackson
  - Đối chiếu thay đổi API, annotation và mặc định cấu hình khi nâng cấp
  - Phân biệt các ví dụ cũ dùng Resource, PagedResources với API RepresentationModel
  - Nhận diện và khắc phục công bố quá mức, logic nghiệp vụ trong listener và URL ghép cứng
- level1: Thực hành tổng hợp
  level2:
  - Xây dựng API quản lý danh mục với entity, repository và HAL
  - Thực hành CRUD và kiểm chứng khác biệt PUT, PATCH, DELETE
  - Thiết lập và gỡ quan hệ giữa sản phẩm, danh mục bằng URI
  - Bổ sung tìm kiếm, phân trang, sắp xếp và projection
  - Thêm validation, auditing và sự kiện xử lý dữ liệu
  - Bảo vệ API theo vai trò và quyền sở hữu tài nguyên
  - Mô phỏng hai người dùng cập nhật đồng thời với ETag
  - Viết endpoint nghiệp vụ qua service và bổ sung liên kết HAL
  - Hoàn thiện bộ kiểm thử hợp đồng, lỗi và cấu hình triển khai
