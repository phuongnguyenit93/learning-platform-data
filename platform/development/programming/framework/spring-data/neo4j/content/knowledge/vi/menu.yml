  - '@Transactional trên phương thức trả về Publisher'
  - Quản lý giao dịch bằng TransactionalOperator
  - Ghép nhiều thao tác repository/client trong cùng một chuỗi
  - Phân biệt lỗi, hoàn thành và hủy subscription đối với giao dịch
  - Giới hạn xử lý song song trên cùng session hoặc transaction
  - Đặt retry đúng ranh giới để chạy lại trọn đơn vị công việc
  - Phân trang reactive bằng Cypher và phép đếm riêng khi cần
  - Kiểm thử reactive bằng StepVerifier và xác minh kết quả sau commit
