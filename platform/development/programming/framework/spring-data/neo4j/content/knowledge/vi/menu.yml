  - Proxy, self-invocation và nguyên nhân giao dịch không được áp dụng
  - Quản lý giao dịch lập trình bằng TransactionTemplate
  - Phân biệt giao dịch Spring với giao dịch tự mở bằng Driver
- level1: Kiểm soát đồng thời
  level2:
  - Mất cập nhật khi nhiều giao dịch cùng sửa node hoặc relationship
  - Optimistic locking bằng @Version trên entity
  - Version khởi tạo, phát hiện entity mới và cập nhật version
  - Xử lý OptimisticLockingFailureException bằng tải lại dữ liệu
  - Khóa ghi, deadlock và thứ tự cập nhật các node
  - Cập nhật nguyên tử bằng Cypher thay cho đọc–sửa–ghi thiếu kiểm soát
  - MERGE, uniqueness constraint và yêu cầu ghi đồng thời
  - Phân biệt lỗi tạm thời có thể thử lại với lỗi nghiệp vụ
  - Idempotency và tác động phụ khi một giao dịch được chạy lại
- level1: Truy cập reactive
  level2:
  - Phân biệt imperative, asynchronous và reactive API của driver
  - Mono, Flux, subscription và thời điểm truy vấn được thực thi
  - Cấu hình AbstractReactiveNeo4jConfig và @EnableReactiveNeo4jRepositories
  - Khai báo ReactiveNeo4jRepository và các kiểu kết quả phù hợp
  - Thao tác entity bằng ReactiveNeo4jTemplate
  - Truy vấn tùy chỉnh bằng ReactiveNeo4jClient
  - Backpressure, fetch size và tiêu thụ kết quả lớn
  - Tránh block, subscribe thủ công và lẫn API đồng bộ trong chuỗi reactive
  - Lựa chọn xử lý tuần tự hoặc có giới hạn đồng thời cho thao tác ghi
- level1: Giao dịch reactive
  level2:
