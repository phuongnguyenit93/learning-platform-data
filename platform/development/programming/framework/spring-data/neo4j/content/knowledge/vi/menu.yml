  - Nhập dữ liệu lặp an toàn bằng MERGE kết hợp constraint
  - Kiểm tra tính tương thích khi ứng dụng cũ và mới cùng hoạt động
  - Sao lưu, khôi phục và xác minh kết quả chuyển đổi dữ liệu
