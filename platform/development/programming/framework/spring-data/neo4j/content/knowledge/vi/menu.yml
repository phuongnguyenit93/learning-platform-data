  - DateTimeProvider, múi giờ và thời gian kiểm thử xác định
  - Kích hoạt @EnableReactiveNeo4jAuditing và ReactiveAuditorAware
  - Lấy người thao tác từ ngữ cảnh bảo mật đồng bộ hoặc reactive
  - Vai trò của ID và version khi phân biệt tạo mới với cập nhật
  - Giới hạn auditing khi dữ liệu được ghi ngoài quy trình entity
