  - Chỉ mục tổng hợp và thứ tự property trong điều kiện
  - Kiểm tra trạng thái index và constraint trước khi phục vụ ứng dụng
  - Đánh đổi giữa hiệu năng đọc, chi phí ghi và dung lượng chỉ mục
