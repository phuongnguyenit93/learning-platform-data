menu:
- level1: Tổng quan
  level2:
  - Spring Data LDAP là gì và giải quyết bài toán nào
  - LDAP là gì và vì sao ứng dụng cần truy cập dịch vụ thư mục
  - Phân biệt giao thức LDAP, máy chủ thư mục và cơ sở dữ liệu quan hệ
  - Phân biệt JNDI, Spring LDAP, Spring Data LDAP và Spring Security LDAP
  - 'Bản đồ các thành phần: ContextSource, LdapTemplate, ODM và Repository'
  - Các tình huống tra cứu danh bạ, quản lý tài khoản và tra cứu nhóm
  - Khi nào nên dùng LDAP và khi nào nên chọn hệ lưu trữ khác
  - Lộ trình học và các kiến thức cần chuẩn bị
- level1: Mô hình thư mục
  level2:
  - Entry và attribute trong một bản ghi LDAP
  - Cây thông tin thư mục DIT và quan hệ cha–con
  - Naming context, suffix và gốc của một miền thư mục
  - Vai trò của dc, ou, cn, uid và cách tránh hiểu chúng như từ khóa cố định
  - Phân biệt cấu trúc cây với quan hệ nghiệp vụ giữa các entry
  - Root DSE và thông tin khả năng của máy chủ
  - Định danh entry bằng DN và phân biệt với tên đăng nhập
  - LDIF và cách biểu diễn dữ liệu thư mục
  - Phân biệt đọc dữ liệu thư mục với xác thực người dùng
- level1: DN và định danh
  level2:
  - DN, RDN và thứ tự các thành phần định danh
  - DN tuyệt đối và DN tương đối với base được cấu hình
  - Phân biệt DN, đường dẫn tệp, URL và biểu thức tìm kiếm
  - Biểu diễn định danh bằng javax.naming.Name và LdapName
  - Tạo DN an toàn bằng LdapNameBuilder
  - Thao tác thành phần RDN thay vì nối chuỗi thủ công
  - Ký tự đặc biệt, Unicode và quy tắc escape của DN
  - RDN nhiều giá trị và ảnh hưởng đến phân tích định danh
  - So sánh DN theo ngữ nghĩa thay vì chuẩn hóa chuỗi tùy ý
  - Phân biệt DN có thể thay đổi với định danh ổn định như entryUUID hoặc objectGUID
  - Thiết kế quy tắc đặt DN để hạn chế đổi tên và di chuyển
- level1: Schema
  level2:
  - Vai trò của schema trong dữ liệu thư mục
  - Object class cấu trúc, phụ trợ và trừu tượng
  - Quan hệ kế thừa giữa các object class
  - Thuộc tính bắt buộc MUST và tùy chọn MAY
  - Kiểu dữ liệu, cú pháp thuộc tính và matching rule
  - Thuộc tính một giá trị và nhiều giá trị
  - Phân biệt thuộc tính thường với thuộc tính vận hành
  - Thuộc tính chuỗi, nhị phân, thời gian và giá trị định danh
  - Đối chiếu schema của máy chủ trước khi thiết kế lớp Java
  - Quản lý thay đổi schema và tương thích dữ liệu cũ
- level1: Thao tác LDAP
  level2:
  - Bind và Unbind ở mức giao thức để quản lý phiên xác thực
  - Search, Compare và đọc thông tin entry
  - Add, Modify, Delete và Modify DN
  - Tính nguyên tử của một yêu cầu và giới hạn chuỗi nhiều yêu cầu
  - Mã kết quả LDAP và thông tin lỗi trả về
  - Controls và extended operations
  - Giới hạn thời gian, số lượng kết quả và quyền truy cập
  - Phân biệt bind của giao thức với bind tạo entry trong API JNDI/Spring LDAP
- level1: Kiến trúc Spring
  level2:
  - Vai trò của JNDI trong kết nối LDAP từ Java
  - DirContext, LdapContext và các đối tượng thuộc tính
  - ContextSource và LdapContextSource
  - Phân biệt context chỉ đọc với context đọc–ghi
  - LdapOperations và LdapTemplate
  - ObjectDirectoryMapper và cơ chế ánh xạ ODM
  - Cách Repository sử dụng hạ tầng Spring LDAP
  - Chuyển NamingException sang hệ ngoại lệ của Spring LDAP
  - Ranh giới trách nhiệm giữa lớp cấu hình, Repository và dịch vụ
- level1: Khởi tạo
  level2:
  - Chọn phiên bản Spring Boot, Spring Data LDAP và Spring LDAP tương thích
  - Khai báo dependency bằng Gradle hoặc Maven
  - Khởi tạo máy chủ LDAP phát triển bằng container
  - Chuẩn bị base DN, tài khoản dịch vụ và dữ liệu LDIF
  - Cấu hình spring.ldap trong application.yml
  - Cơ chế tự cấu hình ContextSource, LdapTemplate và Repository
  - Cấu hình thủ công khi cần nhiều nguồn thư mục hoặc tùy chọn riêng
  - Kiểm tra kết nối bằng một truy vấn tra cứu đơn giản
  - Tổ chức cấu hình theo môi trường và quản lý dữ liệu mẫu
- level1: Kết nối
  level2:
  - Cấu hình URL, base DN và tài khoản kết nối
  - Phân biệt LDAP URL với base của phép tìm kiếm
  - Cấu hình nhiều URL và kiểm tra hành vi chuyển máy chủ
  - Thiết lập thời gian chờ kết nối và thời gian chờ đọc
  - Truyền thuộc tính môi trường cho JNDI
  - Anonymous bind, simple bind và điều kiện máy chủ cho phép
  - Lấy context với danh tính chỉ định bằng ContextSource
  - Quản lý vòng đời DirContext và NamingEnumeration
  - Kiểm tra khả năng chia sẻ Template và giới hạn chia sẻ context giữa các luồng
  - Phân biệt không kết nối được với không đủ quyền đọc dữ liệu
- level1: TLS và xác thực
  level2:
  - Phân biệt LDAP không mã hóa, LDAPS và StartTLS
  - Cấu hình truststore và kiểm tra chuỗi chứng chỉ
  - Xác minh hostname và xử lý chứng chỉ theo môi trường
  - Thương lượng StartTLS qua chiến lược xác thực của Spring LDAP
  - Simple bind trên kênh bảo mật
  - SASL và xác thực bằng chứng chỉ khi hạ tầng hỗ trợ
  - Tìm DN người dùng rồi bind để kiểm tra thông tin đăng nhập
  - Phân biệt sai mật khẩu, tài khoản bị khóa và tài khoản hết hạn
  - Thay đổi mật khẩu và các yêu cầu riêng của từng máy chủ
  - Tương tác giữa TLS, pool và vòng đời kết nối
- level1: LdapTemplate
  level2:
  - Sử dụng LdapTemplate cho các thao tác đọc và ghi
  - Lookup một entry theo DN
  - Search theo base và bộ lọc
  - Chọn AttributesMapper, ContextMapper hoặc callback xử lý kết quả
  - Sử dụng DirContextAdapter để truy cập thuộc tính
  - Thực thi thao tác cấp thấp qua ContextExecutor
  - Truy cập thông tin base bằng BaseLdapPathAware khi cần
  - Đối chiếu phương thức trả một kết quả với phương thức trả nhiều kết quả
  - Lựa chọn Template hay Repository theo mức kiểm soát cần thiết
- level1: Tìm kiếm
  level2:
  - Ba phạm vi tìm kiếm OBJECT, ONELEVEL và SUBTREE
  - Chọn search base phù hợp với ranh giới dữ liệu
  - Cấu hình SearchControls
  - Chỉ lấy các thuộc tính cần thiết
  - Đọc thuộc tính vận hành và kiểm tra quyền máy chủ
  - Giới hạn số kết quả và thời gian thực thi
  - Phân biệt không tìm thấy entry với search base không tồn tại
  - Xử lý một kết quả, nhiều kết quả và kết quả ngoài dự kiến
  - Duyệt kết quả bằng callback và kiểm soát bộ nhớ
  - Ảnh hưởng của alias và chính sách dereference
  - Kiểm tra quyền truy cập khi kết quả bị thiếu mà không có lỗi
- level1: Bộ lọc
  level2:
  - Cấu trúc bộ lọc LDAP và biểu thức so khớp thuộc tính
  - Điều kiện bằng, khác, hiện diện và không hiện diện
  - Điều kiện chuỗi con, tiền tố và hậu tố
  - Kết hợp điều kiện AND, OR và NOT
  - So sánh thứ tự và điều kiện phụ thuộc matching rule
  - Phân biệt thuộc tính vắng mặt với giá trị rỗng
  - Tìm kiếm trên thuộc tính nhiều giá trị
  - Xây dựng bộ lọc bằng LdapQueryBuilder
  - Dùng các lớp Filter khi cần tổ hợp điều kiện
  - Escape giá trị bộ lọc và phân biệt với escape DN
  - Xử lý bộ lọc tùy chọn mà không vô tình mở rộng phạm vi tìm kiếm
  - Extensible matching và kiểm tra khả năng hỗ trợ của máy chủ
- level1: Ánh xạ kết quả
  level2:
  - Ánh xạ Attributes sang DTO bằng AttributesMapper
  - Ánh xạ context bằng ContextMapper và AbstractContextMapper
  - Đọc thuộc tính một giá trị hoặc nhiều giá trị
  - Xử lý thuộc tính vắng mặt, giá trị rỗng và giá trị không đúng kiểu
  - Đọc dữ liệu nhị phân mà không chuyển chuỗi tùy ý
  - Chuyển đổi thời gian và kiểu dữ liệu theo schema
  - Giữ DN của entry trong kết quả ánh xạ
  - Tách mô hình dữ liệu thư mục khỏi mô hình API
  - Kiểm soát việc làm lộ mật khẩu và thuộc tính nhạy cảm
- level1: Ánh xạ thực thể
  level2:
  - ODM là gì và khác ORM ở những điểm nào
  - Chọn đúng annotation ODM trong org.springframework.ldap.odm.annotations
  - Định nghĩa thực thể bằng @Entry và các objectClasses
  - Cấu hình base của thực thể trong cây thư mục
  - Dùng @Id với kiểu javax.naming.Name
  - Ánh xạ thuộc tính bằng @Attribute
  - Ánh xạ thành phần DN bằng @DnAttribute
  - Phân biệt tên thuộc tính LDAP với tên thành phần DN
  - Bỏ qua trường không lưu trữ bằng @Transient
  - Ánh xạ thuộc tính nhiều giá trị và kiểu nhị phân
  - Cấu hình chuyển đổi kiểu theo khả năng ODM của phiên bản sử dụng
  - Yêu cầu khởi tạo đối tượng và giới hạn với mô hình bất biến
  - Kiểm chứng trường nào được đọc, được ghi hoặc bị bỏ qua
- level1: LDAP Repository
  level2:
  - Bật và cấu hình @EnableLdapRepositories
  - Khai báo LdapRepository cho lớp thực thể ODM
  - Định danh bằng Name và hợp đồng của phương thức CRUD
  - Cơ chế quét và tạo triển khai Repository
  - Ngữ nghĩa save khi tạo mới hoặc cập nhật entry
  - Đọc theo DN bằng findById và kiểm tra tồn tại
  - Xóa entry theo định danh hoặc thực thể
  - Thao tác nhiều entry và số yêu cầu LDAP phát sinh
  - Đưa LdapQuery vào findOne và findAll
  - Giới hạn phân trang, sắp xếp và các chức năng không được suy ra từ JPA
  - Mở rộng Repository bằng triển khai tùy chỉnh dùng LdapTemplate
- level1: Truy vấn Repository
  level2:
  - Suy diễn truy vấn từ tên phương thức
  - Liên hệ tên thuộc tính Java với thuộc tính LDAP được ánh xạ
  - Kết hợp điều kiện bằng And, Or và phủ định
  - Các từ khóa hiện diện, so khớp chuỗi và so sánh được hỗ trợ
  - Phân biệt wildcard được chủ ý dùng với dữ liệu đầu vào thông thường
  - Vai trò của objectClasses trong phạm vi truy vấn thực thể
  - Khai báo bộ lọc bằng @Query
  - Liên kết tham số theo vị trí và khả năng tham số có tên theo phiên bản
  - Cơ chế mã hóa tham số và giới hạn của biểu thức động
  - Chọn kiểu kết quả đơn hoặc tập hợp và xử lý sai số lượng
  - Kiểm tra tính hợp lệ của phương thức truy vấn khi khởi động
- level1: Querydsl
  level2:
  - Mục đích của truy vấn có kiểm tra kiểu bằng Querydsl
  - Sinh lớp truy vấn từ metadata ODM bằng LdapAnnotationProcessor
  - Tổ chức annotation processing trong bản dựng
  - Xây dựng điều kiện bằng QueryDslLdapQuery
  - Tích hợp khả năng thực thi predicate vào Repository
  - Giới hạn biểu thức và đối chiếu hỗ trợ theo phiên bản thư viện
- level1: Ghi dữ liệu
  level2:
  - Tạo entry bằng bind của LdapTemplate
  - Thiết lập đầy đủ objectClasses và thuộc tính bắt buộc
  - Cập nhật thuộc tính bằng modifyAttributes
  - Phân biệt ADD_ATTRIBUTE, REPLACE_ATTRIBUTE và REMOVE_ATTRIBUTE
  - Thêm hoặc xóa một giá trị trong thuộc tính nhiều giá trị
  - Dùng DirContextAdapter để xác định thay đổi thuộc tính
  - Phân biệt cập nhật chọn lọc với rebind toàn entry
  - Xóa entry bằng unbind
  - Xóa entry có con và thiết kế thứ tự thao tác
  - Dùng các thao tác ODM create, update và delete
  - Kiểm tra ngữ nghĩa ghi lặp lại và trạng thái khi yêu cầu thất bại
- level1: Đổi tên và di chuyển
  level2:
  - Đổi RDN và di chuyển entry bằng rename
  - Quan hệ giữa DN mới với thuộc tính đặt tên
  - Điều kiện máy chủ cho phép di chuyển trong hoặc ngoài một nhánh
  - Ảnh hưởng của đổi DN đến định danh thực thể
  - Thay đổi trường @DnAttribute và hành vi cập nhật ODM
  - Tham chiếu DN trong nhóm hoặc entry khác sau khi đổi tên
  - Giới hạn của cơ chế tự cập nhật tham chiếu theo máy chủ
  - Thiết kế quy trình di chuyển có kiểm tra và phương án phục hồi
- level1: Người dùng và nhóm
  level2:
  - Mô hình người dùng với person, organizationalPerson và inetOrgPerson
  - Mô hình nhóm với groupOfNames và groupOfUniqueNames
  - Phân biệt thành viên dạng DN với thành viên dạng tên đăng nhập
  - Nhóm POSIX và thuộc tính memberUid
  - Tra cứu nhóm trực tiếp của người dùng
  - Nhóm lồng nhau và kiểm soát vòng lặp khi duyệt
  - Phân biệt member được ghi với memberOf do máy chủ cung cấp
  - Đồng bộ thêm, xóa thành viên mà không làm mất thay đổi đồng thời
  - Thiết kế mô hình vai trò ứng dụng từ thông tin nhóm
  - Tránh giả định mọi máy chủ đều có cùng schema nhóm
- level1: Phân trang và controls
  level2:
  - Vì sao giới hạn kết quả khác với phân trang
  - Paged Results Control và điều kiện máy chủ hỗ trợ
  - Quản lý cookie giữa các lần đọc trang
  - Dùng DirContextProcessor để gửi và nhận LDAP controls
  - Giữ context phù hợp khi duyệt nhiều trang
  - Chọn kích thước trang theo giới hạn máy chủ và ứng dụng
  - Giới hạn nhảy đến trang tùy ý và ước lượng tổng số kết quả
  - Sắp xếp phía máy chủ qua control khi được hỗ trợ
  - Phân biệt sắp xếp tại ứng dụng với sắp xếp toàn bộ kết quả
  - Đóng tài nguyên và xử lý dừng sớm giữa quá trình phân trang
  - Không đồng nhất phân trang LDAP với Pageable của Repository
- level1: Giao dịch bù trừ
  level2:
  - Giao dịch bù trừ phía client trong Spring LDAP là gì
  - Phân biệt giao dịch bù trừ với giao dịch ACID ở cơ sở dữ liệu quan hệ
  - Cấu hình ContextSourceTransactionManager
  - Đặt @Transactional ở ranh giới dịch vụ
  - Giữ cùng context trong phạm vi giao dịch
  - Vai trò của bản ghi trạng thái và các thao tác khôi phục
  - Đổi tên tạm thời và TempEntryRenamingStrategy
  - Giới hạn rollback khi mất kết nối hoặc thao tác bù thất bại
  - Chi phí, quyền bổ sung và tác động nhìn thấy từ bên ngoài
  - Phối hợp LDAP với JDBC và đối chiếu khả năng tích hợp theo phiên bản
  - Kiểm chứng cấu hình pool, xác thực và giao dịch cùng hoạt động
- level1: Đồng thời và nhất quán
  level2:
  - Thay đổi nhiều entry và ranh giới nguyên tử
  - Nguy cơ mất cập nhật khi thay thế toàn bộ thuộc tính
  - Cập nhật tăng giảm thành viên bằng thay đổi chọn lọc
  - Kiểm tra điều kiện trước khi ghi và giới hạn race condition
  - Assertion Control hoặc cơ chế máy chủ khi cần ghi có điều kiện
  - Không giả định có @Version và khóa lạc quan như JPA
  - Độ trễ replication và đọc lại sau khi ghi
  - Thiết kế thao tác lũy đẳng và đối soát trạng thái thực tế
  - Phối hợp nhiều hệ thống bằng quy trình bù trừ hoặc tác vụ đối soát
- level1: Pool kết nối
  level2:
  - Chi phí tạo LDAP context và mục đích của pool
  - Phân biệt native JNDI pooling với pooling của Spring LDAP
  - Chọn triển khai pool tương thích phiên bản thư viện
  - Tách context chỉ đọc và context đọc–ghi
  - Cấu hình số lượng tối đa, số nhàn rỗi và thời gian chờ
  - Kiểm tra kết nối khi lấy, trả hoặc trong lúc nhàn rỗi
  - Thu hồi kết nối hỏng và phản ứng với CommunicationException
  - Giới hạn khi pool dùng chung nhưng danh tính xác thực thay đổi
