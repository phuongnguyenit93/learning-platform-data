references:
  - title: "Spring Data JPA — Getting Started"
    url: "https://docs.spring.io/spring-data/jpa/reference/jpa/getting-started.html"
    description: "Thiết lập entity và Repository đầu tiên."
  - title: "Spring Data JPA — Persisting Entities"
    url: "https://docs.spring.io/spring-data/jpa/reference/jpa/entity-persistence.html"
    description: "Cách save entity, persist/merge và phát hiện entity mới."
  - title: "Spring Data JPA — Query Methods"
    url: "https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html"
    description: "Derived queries, @Query, JPQL, cập nhật và tối ưu truy vấn."
  - title: "Spring Data Commons — Query Methods, Paging and Sorting"
    url: "https://docs.spring.io/spring-data/jpa/reference/repositories/query-methods-details.html"
    description: "Nguyên tắc truy vấn theo tên, Pageable, Sort và các kiểu kết quả."
  - title: "Spring Data JPA — Projections"
    url: "https://docs.spring.io/spring-data/jpa/reference/repositories/projections.html"
    description: "Interface projection và DTO projection."
  - title: "Spring Data JPA — Specifications"
    url: "https://docs.spring.io/spring-data/jpa/reference/jpa/specifications.html"
    description: "Xây dựng và kết hợp điều kiện lọc động."
  - title: "Spring Data JPA — Transactionality"
    url: "https://docs.spring.io/spring-data/jpa/reference/jpa/transactions.html"
    description: "Ranh giới giao dịch, các thiết lập @Transactional cho Repository."
  - title: "Spring Data JPA — Locking"
    url: "https://docs.spring.io/spring-data/jpa/reference/jpa/locking.html"
    description: "Các chế độ khóa trên phương thức truy vấn Repository."
  - title: "Spring Data JPA — Auditing"
    url: "https://docs.spring.io/spring-data/jpa/reference/auditing.html"
    description: "Tự động ghi nhận thời điểm và người tạo hoặc thay đổi entity."