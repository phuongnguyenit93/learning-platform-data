roadmap:
- id: reactive-sql-r2dbc
  title: Reactive SQL & R2DBC
  purpose: Nắm cách truy cập cơ sở dữ liệu quan hệ theo mô hình reactive và nhận biết giới hạn của R2DBC.
  objectives:
  - Phân biệt JDBC blocking và R2DBC non-blocking
  - Giải thích vai trò Reactive Streams, Mono và Flux
  - Nhận diện trường hợp phù hợp để dùng R2DBC
- id: ket-noi-cau-hinh
  title: Kết nối & cấu hình
  purpose: Thiết lập ứng dụng Spring với driver R2DBC và kết nối cơ sở dữ liệu đúng cách.
  objectives:
  - Cấu hình driver và URL r2dbc trong Spring Boot
  - Giải thích vai trò ConnectionFactory và connection pool
  - Kiểm tra truy cập cơ sở dữ liệu bằng truy vấn đơn giản
- id: entity-mapping
  title: Entity Mapping
  purpose: Ánh xạ hàng SQL thành thực thể và hiểu cách Spring Data R2DBC lưu trữ aggregate.
  objectives:
  - Sử dụng @Table, @Id và @Column
  - Giải thích ánh xạ kiểu dữ liệu và khóa chính
  - Nhận biết cách xử lý quan hệ khác với JPA
- id: reactive-repository
  title: Reactive Repository
  purpose: Thực hiện CRUD với repository và xây dựng các phương thức truy vấn khai báo.
  objectives:
  - Dùng ReactiveCrudRepository cho thao tác cơ bản
  - Viết derived query theo tên phương thức
  - Phân biệt Mono và Flux trong kết quả truy vấn
- id: query-template
  title: Query & Template
  purpose: Lựa chọn mức trừu tượng thích hợp khi cần truy vấn phức tạp hoặc SQL tùy chỉnh.
  objectives:
  - Viết @Query và truyền tham số an toàn
  - Dùng R2dbcEntityTemplate cho truy vấn CRUD
  - Dùng DatabaseClient để xử lý SQL linh hoạt
- id: reactive-data-flow
  title: Reactive Data Flow
  purpose: Ghép các thao tác dữ liệu thành pipeline bất đồng bộ có xử lý lỗi rõ ràng.
  objectives:
  - Kết hợp Mono, Flux bằng map và flatMap
  - Xử lý lỗi và kết quả rỗng trong pipeline
  - Tránh block() trong luồng xử lý reactive
- id: reactive-transaction
  title: Reactive Transaction
  purpose: Giữ tính nhất quán của nhiều thao tác SQL trong cùng giao dịch reactive.
  objectives:
  - Giải thích R2dbcTransactionManager và reactive context
  - Dùng @Transactional hoặc TransactionalOperator
  - Kiểm tra commit và rollback khi phát sinh lỗi
- id: testing-van-hanh
  title: Testing & vận hành
  purpose: Xác minh hành vi truy cập dữ liệu và quan sát các giới hạn vận hành thực tế.
  objectives:
  - Viết kiểm thử repository với StepVerifier
  - Thử truy vấn và giao dịch trên database kiểm thử
  - Theo dõi lỗi SQL, pooling và truy vấn chậm
