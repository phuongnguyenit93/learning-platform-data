references:
  - title: "Spring Data MongoDB — Connecting to MongoDB"
    url: "https://docs.spring.io/spring-data/mongodb/reference/mongodb/configuration.html"
    description: "Cấu hình MongoClient, MongoDatabaseFactory và MongoTemplate cho ứng dụng."
  - title: "Spring Data MongoDB — Object Mapping"
    url: "https://docs.spring.io/spring-data/mongodb/reference/mongodb/mapping/mapping.html"
    description: "Ánh xạ document/BSON, định danh, annotation và converter."
  - title: "Spring Data MongoDB — MongoDB Repositories"
    url: "https://docs.spring.io/spring-data/mongodb/reference/mongodb/repositories/repositories.html"
    description: "Định nghĩa repository, truy vấn và truy cập đồng bộ hoặc reactive."
  - title: "Spring Data MongoDB — Template API"
    url: "https://docs.spring.io/spring-data/mongodb/reference/mongodb/template-api.html"
    description: "MongoTemplate và ReactiveMongoTemplate cho CRUD và query linh hoạt."
  - title: "Spring Data MongoDB — Aggregation Framework"
    url: "https://docs.spring.io/spring-data/mongodb/reference/mongodb/aggregation-framework.html"
    description: "Aggregation pipeline, group, project, sort và ánh xạ kết quả."
  - title: "Spring Data MongoDB — Index Creation"
    url: "https://docs.spring.io/spring-data/mongodb/reference/mongodb/mapping/mapping-index-management.html"
    description: "Quản lý index khai báo và tạo index chủ động."
  - title: "Spring Data MongoDB — Sessions & Transactions"
    url: "https://docs.spring.io/spring-data/mongodb/reference/mongodb/client-session-transactions.html"
    description: "ClientSession, MongoTransactionManager, commit, rollback và lưu ý transaction."
  - title: "Spring Data MongoDB — Saving, Updating and Removing Documents"
    url: "https://docs.spring.io/spring-data/mongodb/reference/mongodb/template-crud-operations.html"
    description: "Thao tác insert, save, update, delete và hỗ trợ optimistic locking."