references:
  - title: "Spring for GraphQL — Reference Overview"
    url: "https://docs.spring.io/spring-graphql/reference/index.html"
    description: "Tổng quan thư viện Spring for GraphQL và các thành phần hỗ trợ ứng dụng Spring."
  - title: "Spring GraphQL — Request Execution"
    url: "https://docs.spring.io/spring-graphql/reference/request-execution.html"
    description: "Schema resources, GraphQlSource, thực thi truy vấn, batch loading, phân trang và xử lý ngoại lệ."
  - title: "Spring GraphQL — Annotated Controllers"
    url: "https://docs.spring.io/spring-graphql/reference/controllers.html"
    description: "@QueryMapping, @SchemaMapping, @MutationMapping, @SubscriptionMapping, argument binding và @BatchMapping."
  - title: "Spring GraphQL — Server Transports"
    url: "https://docs.spring.io/spring-graphql/reference/transports.html"
    description: "Hỗ trợ request GraphQL qua HTTP, WebSocket, RSocket và yêu cầu của subscription."
  - title: "Spring GraphQL — Testing"
    url: "https://docs.spring.io/spring-graphql/reference/testing.html"
    description: "GraphQlTester và cách kiểm thử trực tiếp hoặc qua HTTP, WebSocket, RSocket."
  - title: "GraphQL — Schemas and Types"
    url: "https://graphql.org/learn/schema/"
    description: "Các khái niệm type, field, scalar, nullability, input object và root operation."
  - title: "GraphQL — Queries"
    url: "https://graphql.org/learn/queries/"
    description: "Cú pháp truy vấn, selection sets, arguments, variables và dữ liệu trả về."