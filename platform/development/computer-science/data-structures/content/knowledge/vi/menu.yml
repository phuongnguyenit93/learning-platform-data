menu:
- level1: Tổng quan
  level2:
  - Cấu trúc dữ liệu là gì và vấn đề tổ chức dữ liệu để làm gì
  - Dữ liệu, quan hệ giữa dữ liệu và các phép toán cần hỗ trợ
  - Phân biệt kiểu dữ liệu, kiểu dữ liệu trừu tượng và cách cài đặt
  - Mối liên hệ giữa cấu trúc dữ liệu và thuật toán
  - Cấu trúc tuyến tính, phân cấp, đồ thị và kết hợp
  - Cấu trúc tĩnh, động, khả biến và bất biến
  - Truy cập theo vị trí, khóa, thứ tự và quan hệ
  - Đánh đổi giữa tốc độ, bộ nhớ và độ phức tạp cài đặt
  - 'Bản đồ thuật ngữ: phần tử, nút, liên kết, khóa và chỉ mục'
  - Lộ trình học từ cấu trúc cơ bản đến cấu trúc chuyên dụng
- level1: Đặc tả và chi phí
  level2:
  - Đặc tả kiểu dữ liệu trừu tượng bằng tập phép toán
  - Tiền điều kiện, hậu điều kiện và bất biến biểu diễn
  - Phân biệt giao diện sử dụng với chi tiết lưu trữ
  - Đo kích thước dữ liệu và xác định phép toán cơ bản
  - Chi phí truy cập, tìm kiếm, chèn, xóa và duyệt
  - Độ phức tạp thời gian và không gian phụ trợ
  - Trường hợp tốt nhất, xấu nhất, trung bình và chi phí kỳ vọng
  - Phân tích khấu hao và sự khác biệt với lấy trung bình trên dữ liệu ngẫu nhiên
  - Chi phí xây dựng ban đầu và chi phí cập nhật về sau
  - Bộ nhớ trên mỗi phần tử và chi phí do cấp phát
  - Vai trò của phân bố dữ liệu và chuỗi thao tác thực tế
  - Mô hình so sánh, mô hình RAM và giả định về kích thước từ máy
- level1: Bộ nhớ và biểu diễn
  level2:
  - Lưu trữ liên tiếp và lưu trữ bằng các nút liên kết
  - Giá trị, địa chỉ, con trỏ, tham chiếu và tính gián tiếp
  - Căn chỉnh, phần đệm và chi phí thông tin phụ của nút
  - Tính cục bộ dữ liệu và ảnh hưởng của bộ nhớ đệm
  - Sao chép dữ liệu so với chia sẻ cùng vùng lưu trữ
  - Bí danh tham chiếu và thay đổi có thể quan sát từ nhiều nơi
  - Quyền sở hữu, vòng đời và giải phóng tài nguyên
  - Tham chiếu treo, rò rỉ bộ nhớ và giữ tham chiếu không cần thiết
  - Sao chép nông, sao chép sâu và phần tử có trạng thái khả biến
  - Giá trị rỗng, nút canh gác và quy ước biểu diễn rỗng
  - So sánh bằng nhau, thứ tự toàn phần và tính nhất quán của khóa
  - Bộ duyệt và điều kiện làm mất hiệu lực khi cấu trúc thay đổi
- level1: Mảng
  level2:
  - Mảng như ánh xạ từ chỉ số sang phần tử
  - Độ dài, chỉ số hợp lệ và quy ước khoảng nửa kín
  - Cách tính địa chỉ phần tử trong bộ nhớ liên tiếp
  - Truy cập theo chỉ số và giới hạn của tìm kiếm theo giá trị
  - Chèn, xóa và chi phí dịch chuyển phần tử
  - Mảng có thứ tự và mảng không có thứ tự
  - Mảng nhiều chiều và cách trải phẳng theo hàng hoặc theo cột
  - Mảng răng cưa và biểu diễn nhiều chiều không đều
  - Lát cắt, khung nhìn và quan hệ với mảng gốc
  - Tìm kiếm tuyến tính và nhị phân nhìn từ yêu cầu biểu diễn
  - Tách mảng cấu trúc thành các mảng trường và đánh đổi bố trí dữ liệu
  - Lỗi vượt biên, lệch một đơn vị và nhầm độ dài với chỉ số cuối
- level1: Mảng động
  level2:
  - Phân biệt số phần tử đang dùng với dung lượng đã cấp phát
  - Biểu diễn mảng động bằng bộ đệm, kích thước và dung lượng
  - Thêm cuối khi còn chỗ và khi phải cấp phát lại
  - Vì sao tăng dung lượng theo cấp số nhân cho chi phí khấu hao hằng số
  - Hệ số tăng trưởng và đánh đổi giữa sao chép với bộ nhớ dư
  - Vì sao tăng dung lượng từng đơn vị có thể gây chi phí bậc hai
  - Chèn, xóa tại vị trí bất kỳ và dịch chuyển vùng dữ liệu
  - Thu nhỏ dung lượng và tránh tăng–giảm liên tục quanh ngưỡng
  - Đặt trước dung lượng khi biết quy mô dữ liệu
  - Mất hiệu lực của con trỏ, tham chiếu hoặc bộ duyệt sau cấp phát lại
  - Dọn các ô không còn dùng để tránh giữ đối tượng ngoài ý muốn
  - So sánh mảng động với mảng cố định và danh sách liên kết
- level1: Chuỗi và dãy bit
  level2:
  - Chuỗi như dãy ký hiệu và các lựa chọn biểu diễn
  - Phân biệt byte, đơn vị mã, điểm mã Unicode và ký tự hiển thị
  - Độ dài và truy cập ký tự phụ thuộc vào cách mã hóa
  - Chuỗi khả biến, bất biến và bộ đệm xây dựng chuỗi
  - Chi phí nối lặp nhiều lần và vai trò của bộ đệm tăng trưởng
  - Chuỗi con được sao chép hay chia sẻ vùng lưu trữ
  - Kết thúc bằng ký hiệu canh gác so với lưu độ dài tường minh
  - Dãy bit và đóng gói nhiều giá trị Boolean trong một từ máy
  - Đặt, xóa, kiểm tra và duyệt các bit đang bật
  - Hợp, giao, hiệu và đếm phần tử bằng phép toán bit
  - Đánh đổi của bitset khi miền giá trị dày hoặc thưa
  - So sánh chuỗi, mảng ký tự, mảng byte và dãy bit theo nhu cầu
- level1: Danh sách liên kết
  level2:
  - Nút và liên kết trong danh sách đơn
  - Con trỏ đầu, con trỏ cuối và bất biến của danh sách rỗng
  - Duyệt tuần tự và chi phí truy cập theo vị trí
  - Chèn đầu, chèn sau nút và thêm cuối
  - Xóa đầu, xóa sau nút và giới hạn khi chỉ biết nút cần xóa
  - Danh sách đôi và liên kết hai chiều
  - Chèn, xóa một nút trong danh sách đôi khi đã có tham chiếu
  - Danh sách vòng đơn, vòng đôi và điều kiện kết thúc duyệt
  - Nút đầu giả, nút cuối giả và nút canh gác
  - Đảo danh sách và cập nhật liên kết an toàn
  - Ghép, tách và chuyển đoạn nút giữa các danh sách
  - Danh sách nội tại (intrusive list) và quyền sở hữu nút
  - Phát hiện chu trình và phân biệt chu trình hợp lệ với lỗi liên kết
  - So sánh chi phí cấp phát, bộ nhớ đệm và dịch chuyển dữ liệu với mảng
- level1: Ngăn xếp
  level2:
  - Kiểu dữ liệu trừu tượng LIFO và các phép push, pop, peek
  - Ngăn xếp bằng mảng cố định hoặc mảng động
  - Ngăn xếp bằng danh sách liên kết
  - Tràn, rỗng và lựa chọn chính sách xử lý lỗi
  - Ngăn xếp lời gọi và mối liên hệ với đệ quy
  - Đổi đệ quy thành ngăn xếp tường minh
  - Ứng dụng kiểm tra dấu ngoặc và lưu trạng thái xử lý
  - Duy trì giá trị nhỏ nhất hoặc lớn nhất cùng ngăn xếp
  - Ngăn xếp đơn điệu và bất biến thứ tự
  - Lịch sử hoàn tác và giới hạn của mô hình một ngăn xếp
  - So sánh chi phí và lựa chọn cách biểu diễn ngăn xếp
- level1: Hàng đợi và deque
  level2:
  - Kiểu dữ liệu trừu tượng FIFO và các phép thêm–lấy
  - Hàng đợi bằng danh sách đơn có đầu và cuối
  - Vì sao xóa đầu mảng bằng dịch chuyển gây chi phí tuyến tính
  - Hàng đợi vòng bằng mảng và chỉ số quay vòng
  - Phân biệt trạng thái đầy và rỗng trong bộ đệm vòng
  - 'Bộ đệm có giới hạn: từ chối, chờ hoặc ghi đè dữ liệu'
  - Mở rộng hàng đợi vòng và sắp xếp lại phần tử khi sao chép
  - Hàng đợi hai đầu (deque) và bốn phép thêm–lấy ở hai phía
  - Deque bằng mảng vòng hoặc các khối liên kết
  - Cài đặt hàng đợi bằng hai ngăn xếp và chi phí khấu hao
  - Cài đặt ngăn xếp bằng hàng đợi và đánh đổi phép toán
  - Deque đơn điệu cho cực trị trên cửa sổ trượt
  - Phân biệt hàng đợi thường với hàng đợi ưu tiên
- level1: Tập hợp và ánh xạ
  level2:
  - Tập hợp như kiểu dữ liệu trừu tượng không chứa phần tử trùng
  - Ánh xạ khóa–giá trị và tính duy nhất của khóa
  - Thêm mới, cập nhật, tra cứu và xóa theo khóa
  - Phân biệt thiếu khóa với giá trị rỗng hợp lệ
  - Đa tập hợp và lưu số lần xuất hiện
  - Đa ánh xạ và nhiều giá trị cho cùng một khóa
  - Hợp, giao, hiệu và kiểm tra quan hệ tập con
  - Thứ tự chèn, thứ tự sắp xếp và thứ tự duyệt không được bảo đảm
  - Ảnh hưởng của quy tắc bằng nhau và bộ so sánh đến khóa trùng
  - Cài đặt tập hợp hoặc ánh xạ bằng mảng, danh sách, bảng băm và cây
  - Khung nhìn khóa, giá trị, cặp khóa–giá trị và thay đổi trên cấu trúc gốc
- level1: Bảng băm
  level2:
  - Ý tưởng ánh xạ khóa vào vị trí lưu trữ bằng hàm băm
  - Phân biệt mã băm của khóa với chỉ số ô trong bảng
  - Điều kiện nhất quán giữa phép so sánh bằng nhau và hàm băm
  - Hàm băm tốt, phân bố đều và giả định dùng trong phân tích
  - Va chạm và giải quyết bằng chuỗi liên kết
  - Địa chỉ mở và quy tắc thăm dò ô
  - Thăm dò tuyến tính và hiện tượng kết cụm
  - Thăm dò bậc hai, băm kép và điều kiện để duyệt được vị trí cần thiết
  - Hệ số tải và ảnh hưởng đến tìm kiếm, chèn, xóa
  - Dấu mốc đã xóa và lý do không thể đơn giản đặt ô về rỗng
  - Băm lại khi tăng hoặc giảm dung lượng
  - Chi phí kỳ vọng, khấu hao và trường hợp xấu nhất
  - Khóa thay đổi sau khi chèn và nguy cơ không tìm lại được dữ liệu
  - Băm chuỗi, khóa tổ hợp và chi phí tính hàm băm
  - Tấn công gây va chạm và vai trò của ngẫu nhiên hóa hàm băm
  - Vì sao bảng băm thông thường không hỗ trợ hiệu quả truy vấn thứ tự
- level1: Biến thể bảng băm
  level2:
  - Băm phổ dụng và lựa chọn ngẫu nhiên từ một họ hàm băm
  - Băm hoàn hảo cho tập khóa tĩnh
  - Băm hoàn hảo tối thiểu và đánh đổi khi tập khóa thay đổi
  - Băm cuckoo và chuỗi di chuyển khóa khi chèn
  - Băm Robin Hood và cân bằng khoảng cách thăm dò
  - Băm hopscotch và vùng lân cận của một ô
  - Băm có thể mở rộng và thư mục các nhóm khóa
  - Băm tuyến tính và tăng số nhóm khóa từng bước
  - Băm nhất quán khi phân chia khóa giữa các nút lưu trữ
  - Phân biệt băm phục vụ tra cứu với băm mật mã
  - Lựa chọn biến thể theo tải, cập nhật, bộ nhớ và độ trễ
- level1: Cây cơ bản
  level2:
  - Cây như quan hệ phân cấp và cây như đồ thị liên thông không chu trình
  - Gốc, nút cha, nút con, anh em, lá và nút trong
  - Độ sâu, chiều cao, bậc của nút và quy ước tính chiều cao
  - Cây có thứ tự, cây không thứ tự và rừng
  - Cây nhị phân và giới hạn tối đa hai nút con
  - Cây nhị phân đầy đủ (full), hoàn chỉnh (complete), hoàn hảo (perfect) và suy biến
  - Quan hệ giữa chiều cao với số nút và số lá
  - Biểu diễn cây bằng liên kết cha–con
  - Biểu diễn cây nhị phân bằng mảng và công thức chỉ số
  - Biểu diễn cây tổng quát bằng danh sách con hoặc con đầu–anh em kế
  - Quyền sở hữu cây con và những thay đổi ảnh hưởng nhiều nút
  - Phân biệt cây biểu diễn dữ liệu với cây tìm kiếm và heap
- level1: Duyệt và biến đổi cây
  level2:
  - Duyệt trước, giữa, sau và ý nghĩa thứ tự xử lý nút
  - Duyệt theo tầng bằng hàng đợi
  - Duyệt cây bằng đệ quy và chi phí ngăn xếp theo chiều cao
  - Duyệt không đệ quy bằng ngăn xếp tường minh
  - Bộ duyệt lười và trạng thái cần giữ giữa các lần lấy phần tử
  - Tính kích thước, chiều cao và tổng hợp thông tin từ cây con
  - Tìm đường từ gốc và xác định tổ tiên chung
  - Dựng lại cây nhị phân từ các thứ tự duyệt và điều kiện duy nhất
  - Tuần tự hóa, khôi phục cây và mã hóa nút con rỗng
  - Sao chép, giải phóng và duyệt cây có độ sâu lớn
  - Duyệt Morris bằng liên kết tạm và điều kiện sử dụng an toàn
  - Phát hiện cấu trúc không còn là cây do chu trình hoặc nhiều cha
- level1: Cây tìm kiếm nhị phân
  level2:
  - Bất biến BST trên toàn bộ cây con trái và phải
  - Tra cứu khóa và đường đi quyết định bởi phép so sánh
  - Chèn nút mới và chính sách xử lý khóa trùng
  - Tìm khóa nhỏ nhất, lớn nhất, tiền nhiệm và kế nhiệm
  - Tìm khóa gần nhất theo cận dưới và cận trên
  - Xóa nút lá và nút chỉ có một con
  - Xóa nút hai con bằng tiền nhiệm hoặc kế nhiệm
  - Giữ đúng liên kết cha, gốc và thông tin phụ khi xóa
  - Duyệt giữa để lấy các khóa theo thứ tự
  - Truy vấn một khoảng khóa và giới hạn số phần tử đầu ra
  - Chi phí theo chiều cao và nguy cơ suy biến khi dữ liệu đã có thứ tự
  - Dựng BST cân đối từ dãy khóa đã sắp xếp
  - Kiểm tra BST bằng miền khóa hợp lệ thay vì chỉ so sánh con trực tiếp
- level1: Cây tìm kiếm cân bằng
  level2:
  - Mục tiêu khống chế chiều cao và các dạng bất biến cân bằng
  - Phép quay trái, quay phải và bảo toàn thứ tự BST
  - 'Cây AVL: chiều cao và hệ số cân bằng'
  - Bốn trường hợp mất cân bằng khi chèn vào AVL
  - Xóa trong AVL và lan truyền thay đổi chiều cao
  - 'Cây đỏ–đen: màu nút, lá rỗng và chiều cao đen'
  - Khôi phục bất biến đỏ–đen sau khi chèn
  - Các trường hợp khôi phục sau khi xóa trong cây đỏ–đen
  - Quan hệ giữa cây đỏ–đen và cây 2–3–4
  - So sánh AVL với đỏ–đen theo tra cứu, cập nhật và thông tin phụ
  - Cây splay và thao tác đưa nút vừa truy cập lên gốc
  - Các bước zig, zig-zig và zig-zag
  - Chi phí khấu hao của splay và một thao tác có thể vẫn tuyến tính
  - Duy trì bộ duyệt và tham chiếu khi quay hoặc tổ chức lại cây
- level1: Cây nhiều nhánh
  level2:
  - Động cơ gom nhiều khóa và con trỏ trong cùng một nút
  - Cây 2–3, cây 2–3–4 và quy tắc số con
  - Định nghĩa B-tree và các quy ước về bậc hoặc bậc tối thiểu
  - Bất biến số khóa, số con và độ sâu của các lá
  - Tìm kiếm khóa trong một nút và chọn nhánh con
  - Chèn vào B-tree bằng tách nút đầy
  - Xóa bằng mượn khóa, gộp nút và điều chỉnh gốc
  - B+-tree và việc lưu bản ghi ở tầng lá
  - Khóa phân cách, sao chép khóa và liên kết giữa các lá
  - Truy vấn khoảng trên B+-tree
  - Chọn kích thước nút theo trang lưu trữ và chi phí I/O
  - So sánh B-tree, B+-tree và cây nhị phân cân bằng
