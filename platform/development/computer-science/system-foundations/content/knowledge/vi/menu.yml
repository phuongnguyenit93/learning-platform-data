menu:
- level1: Tổng quan hệ thống
  level2:
  - 'Hệ thống máy tính là gì: phần cứng, phần mềm và môi trường thực thi'
  - 'Các lớp trừu tượng: mạch số, tập lệnh, hệ điều hành và ứng dụng'
  - 'Tài nguyên hệ thống: năng lực xử lý, bộ nhớ, lưu trữ và kết nối'
  - 'Hành trình một chương trình: từ mã nguồn đến tiến trình đang chạy'
  - 'Hành trình một yêu cầu: từ ứng dụng qua hệ điều hành đến thiết bị'
  - Phân biệt chương trình, tiến trình, luồng, lõi xử lý và máy chủ
  - 'Giao diện và hợp đồng giữa các lớp: ISA, ABI, API và giao thức'
  - 'Đánh đổi nền tảng: tốc độ, chi phí, độ tin cậy, an toàn và tính đơn giản'
  - Cách đọc sơ đồ hệ thống, luồng dữ liệu và đường đi của lỗi
- level1: Biểu diễn dữ liệu
  level2:
  - Bit, byte, từ máy và các đơn vị dung lượng thập phân, nhị phân
  - Hệ nhị phân, thập lục phân và chuyển đổi cơ số
  - Phép toán bit, mặt nạ và dịch bit logic, số học
  - Số nguyên không dấu và số nguyên có dấu theo mã bù hai
  - Miền giá trị, mở rộng dấu, cắt bớt bit và tràn số nguyên
  - 'Số dấu phẩy động IEEE 754: biểu diễn, độ chính xác và làm tròn'
  - 'Giá trị đặc biệt: số dưới chuẩn, vô cực, NaN và số không có dấu'
  - 'Thứ tự byte: little-endian, big-endian và trao đổi dữ liệu'
  - 'Ký tự và văn bản: ASCII, Unicode, điểm mã và UTF-8, UTF-16'
  - Địa chỉ, con trỏ, căn chỉnh và phần đệm trong bố trí dữ liệu
  - 'Tuần tự hóa: phân định bản ghi, kiểu dữ liệu và khả năng tương thích'
  - 'Kiểm tra lỗi dữ liệu: bit chẵn lẻ, checksum, CRC và giới hạn phát hiện lỗi'
- level1: Logic số
  level2:
  - Đại số Boolean, bảng chân trị và các cổng logic cơ bản
  - 'Mạch tổ hợp và mạch tuần tự: khác biệt về trạng thái'
  - Bộ chọn, bộ giải mã và bộ cộng nhị phân
  - Latch, flip-flop, thanh ghi và cách lưu một bit
  - ALU và cách kết hợp phép toán số học với phép toán logic
  - Xung nhịp, độ trễ lan truyền và đường tới hạn
  - Máy trạng thái hữu hạn và điều khiển hoạt động của mạch
  - 'Từ thanh ghi đến bộ nhớ: tổ chức ô nhớ và tín hiệu đọc, ghi'
- level1: Kiến trúc máy tính
  level2:
  - Mô hình chương trình lưu trong bộ nhớ và kiến trúc von Neumann
  - CPU, bộ nhớ, bộ điều khiển và thiết bị ngoại vi phối hợp ra sao
  - Bus, liên kết điểm tới điểm và truyền dữ liệu giữa các thành phần
  - 'Kiến trúc tập lệnh và vi kiến trúc: cùng giao diện, khác cách thực hiện'
  - Thanh ghi, bộ đếm chương trình, con trỏ ngăn xếp và trạng thái máy
  - Chu trình lấy lệnh, giải mã, thực hiện và cập nhật trạng thái
  - 'Kiến trúc 32 bit, 64 bit: độ rộng dữ liệu và không gian địa chỉ'
  - Máy đơn lõi, đa lõi, đa bộ xử lý và cấu trúc NUMA
  - Hệ thống trên chip, bộ tăng tốc và vai trò của GPU
  - Ranh giới giữa cơ chế phần cứng và chính sách phần mềm
- level1: Tập lệnh và hợp ngữ
  level2:
  - Cấu trúc lệnh máy, mã thao tác và toán hạng
  - 'Các kiểu định địa chỉ: tức thời, thanh ghi, trực tiếp và gián tiếp'
  - Lệnh nạp, lưu và kiến trúc load-store
  - Lệnh số học, logic, so sánh và chuyển kiểu dữ liệu
  - Rẽ nhánh, vòng lặp và ánh xạ luồng điều khiển xuống lệnh máy
  - Lời gọi hàm, khung ngăn xếp và quy ước gọi hàm
  - Truyền tham số, giá trị trả về và bảo toàn thanh ghi theo ABI
  - Lệnh đặc quyền, lời gọi hệ thống và chuyển mức đặc quyền
  - 'Ngắt, ngoại lệ và bẫy đồng bộ: nguồn phát sinh và cách xử lý'
  - Đọc hợp ngữ đơn giản từ mã nguồn và kết quả giải mã lệnh
- level1: Tổ chức bộ xử lý
  level2:
  - Đường dữ liệu và bộ điều khiển trong một bộ xử lý
  - Pipeline và sự khác nhau giữa độ trễ với thông lượng
  - Xung đột cấu trúc, dữ liệu, điều khiển và cách xử lý
  - Chuyển tiếp dữ liệu, dừng pipeline và dự đoán rẽ nhánh
  - Thực thi nhiều lệnh mỗi chu kỳ và thực thi ngoài thứ tự
  - Đổi tên thanh ghi, thực thi suy đoán và hoàn tất lệnh theo thứ tự
  - Tần số, số lệnh, CPI và cách ước lượng thời gian xử lý
  - Đa luồng đồng thời trên phần cứng và giới hạn chia sẻ tài nguyên
  - Điện năng, nhiệt độ, điều chỉnh tần số và giới hạn tăng tốc
- level1: Phân cấp bộ nhớ
  level2:
  - Thanh ghi, cache, RAM và lưu trữ trong tháp phân cấp bộ nhớ
  - Tính cục bộ theo thời gian, theo không gian và tập dữ liệu đang dùng
  - Dòng cache, ánh xạ cache và cách tra cứu thẻ địa chỉ
  - Cache hit, cache miss và các nguyên nhân bỏ lỡ bộ nhớ đệm
  - Chính sách thay thế, ghi xuyên, ghi trả và cấp phát khi ghi
  - Cache nhiều cấp và thời gian truy cập bộ nhớ trung bình
  - Nạp trước dữ liệu và ảnh hưởng của mẫu truy cập tuần tự, ngẫu nhiên
  - Nhất quán cache giữa các lõi và vai trò của giao thức coherence
  - Chia sẻ giả (false sharing), căn chỉnh dữ liệu và tranh chấp dòng cache
  - Thứ tự bộ nhớ, hàng rào bộ nhớ và quan hệ với cơ chế đồng bộ
  - 'NUMA: vị trí cấp phát, truy cập bộ nhớ từ xa và gắn luồng với CPU'
- level1: Biên dịch và thực thi
  level2:
  - Biên dịch, hợp dịch, liên kết, nạp và các tạo tác trung gian
  - Tệp đối tượng, tệp thực thi và định dạng ELF, PE ở mức khái niệm
  - Ký hiệu, phân giải ký hiệu, định vị lại và lỗi liên kết
  - Liên kết tĩnh, liên kết động và thư viện dùng chung
  - Bộ nạp chương trình, thư viện động và thời điểm phân giải phụ thuộc
  - Các vùng mã, dữ liệu, BSS, heap và stack trong ảnh tiến trình
  - ABI, bố trí dữ liệu và tương thích giữa các thành phần đã biên dịch
  - Thông dịch, AOT, JIT và sự khác nhau giữa máy ảo với máy vật lý
  - Bộ nhớ do chương trình quản lý và bộ nhớ được thu gom tự động
  - 'Từ lỗi mã nguồn đến lỗi khi chạy: vai trò của ký hiệu gỡ lỗi và stack trace'
- level1: Nền tảng hệ điều hành
  level2:
  - 'Vai trò của hệ điều hành: trừu tượng hóa, phân chia và bảo vệ tài nguyên'
  - Nhân hệ điều hành, không gian người dùng và không gian nhân
  - Lời gọi hệ thống, thư viện chuẩn và chi phí chuyển ranh giới
  - Ngắt phần cứng, ngoại lệ bộ xử lý và công việc trì hoãn trong nhân
  - Cơ chế, chính sách và các đánh đổi khi thiết kế hệ điều hành
  - Nhân nguyên khối, vi nhân và mô-đun nhân
  - Tài nguyên được đặt tên bằng handle, bộ mô tả tệp và định danh
  - Quyền sở hữu, vòng đời tài nguyên và rò rỉ tài nguyên
  - Tính đồng thời và khả năng bị ngắt trong hoạt động của nhân
  - Giao diện POSIX, khác biệt giữa các hệ điều hành và tính khả chuyển
- level1: Tiến trình
  level2:
  - Tiến trình là gì và hệ điều hành cần lưu những thông tin nào
  - Không gian địa chỉ riêng, tài nguyên riêng và tài nguyên dùng chung
  - Vòng đời tiến trình và các trạng thái chạy, sẵn sàng, chờ
  - 'Tạo tiến trình: fork, exec và mô hình tạo mới trên các hệ điều hành'
  - Tiến trình cha, tiến trình con, mã thoát và thu hồi trạng thái
  - Zombie, tiến trình mồ côi và trách nhiệm của trình quản lý tiến trình
  - Chuyển ngữ cảnh tiến trình và các thành phần chi phí
  - Biến môi trường, đối số, thư mục làm việc và luồng vào ra chuẩn
  - Định danh người dùng, nhóm và thông tin xác thực của tiến trình
  - Tín hiệu, kết thúc mềm, kết thúc cưỡng bức và thu dọn tài nguyên
- level1: Luồng và lập lịch
  level2:
  - 'Luồng là gì: ngăn xếp riêng và không gian địa chỉ dùng chung'
  - Luồng người dùng, luồng nhân và các mô hình ánh xạ
  - Đồng thời, song song và khác biệt giữa tác vụ chờ I/O với tác vụ dùng CPU
  - Lập lịch ưu tiên, có quyền ngắt và chuyển đổi luồng
  - FCFS, SJF, round-robin và các giả định của từng chính sách
  - Công bằng, độ phản hồi, thông lượng và thời gian chờ
  - Hàng đợi nhiều mức phản hồi và điều chỉnh độ ưu tiên
  - Lập lịch đa lõi, gắn luồng với CPU và cân bằng tải
  - Ưu tiên thời gian thực, hạn chót và giới hạn bảo đảm
  - Số luồng, vượt mức tài nguyên (oversubscription) và chi phí tranh chấp
- level1: Đồng bộ
  level2:
  - Vùng tới hạn, điều kiện tranh chấp và bất biến của dữ liệu dùng chung
  - Thao tác nguyên tử, tính hiển thị và thứ tự quan sát dữ liệu
  - Khóa mutex, spinlock và lựa chọn chờ bận hay ngủ chờ
  - Semaphore, biến điều kiện và cách phối hợp trạng thái chờ
  - Monitor và kiểm tra điều kiện chờ bằng vòng lặp
  - CAS, cập nhật nguyên tử và giới hạn của cách làm không khóa
  - 'Deadlock: bốn điều kiện cần và sơ đồ chờ tài nguyên'
  - Phòng ngừa, tránh, phát hiện và phục hồi khi deadlock
  - Starvation, livelock, đảo ngược ưu tiên và chuyển giao ưu tiên
  - Giảm chia sẻ, thứ tự lấy khóa và vòng đời khóa an toàn
  - Mô hình bộ nhớ phần cứng, mô hình ngôn ngữ và hợp đồng của đồng bộ
- level1: Bộ nhớ ảo
  level2:
  - Địa chỉ ảo, địa chỉ vật lý và mục đích của không gian địa chỉ
  - MMU, phân trang và dịch địa chỉ qua bảng trang
  - Bảng trang nhiều cấp và chi phí quản lý không gian địa chỉ
  - TLB, TLB miss và ảnh hưởng của chuyển ngữ cảnh
  - Quyền đọc, ghi, thực thi và bảo vệ ở mức trang
  - Lỗi trang hợp lệ, vi phạm truy cập và quá trình xử lý page fault
  - Nạp trang theo nhu cầu, phân trang trước và trang dùng chung
  - Copy-on-write và mối quan hệ với tạo tiến trình
  - Ánh xạ tệp vào bộ nhớ và ánh xạ ẩn danh
  - Chính sách thay thế trang, working set và hiện tượng thrashing
  - Swap, áp lực bộ nhớ, cạn bộ nhớ và hành vi OOM
  - Cấp phát heap, phân mảnh trong, phân mảnh ngoài và trả bộ nhớ
  - Trang lớn, ghim bộ nhớ và các đánh đổi về hiệu năng
- level1: Giao tiếp tiến trình
  level2:
  - 'Chia sẻ bộ nhớ và truyền thông điệp: hai mô hình giao tiếp'
  - Pipe, named pipe và truyền dữ liệu theo luồng byte
  - Socket cục bộ và trao đổi thông tin giữa các tiến trình cùng máy
  - Hàng đợi thông điệp và phân định ranh giới thông điệp
  - Bộ nhớ chia sẻ, ánh xạ chung và trách nhiệm đồng bộ
  - 'Tín hiệu và sự kiện: thông báo không đồng nghĩa với lưu dữ liệu'
  - Giao tiếp chặn, không chặn và các điều kiện đánh thức
  - Áp lực ngược (backpressure), dung lượng bộ đệm và điều tiết bên gửi
  - Đóng kênh, lỗi phía đối tác và dọn dẹp tài nguyên giao tiếp
- level1: Thiết bị và vào ra
  level2:
  - Bộ điều khiển thiết bị, trình điều khiển và giao diện của nhân
  - Port-mapped I/O, memory-mapped I/O và truy cập thanh ghi thiết bị
  - Thăm dò, ngắt và lựa chọn cơ chế nhận biết hoàn tất I/O
  - DMA và truyền dữ liệu giữa thiết bị với bộ nhớ
  - I/O đồng bộ, bất đồng bộ, chặn và không chặn
  - Bộ đệm, gộp yêu cầu, cache trang và chi phí sao chép dữ liệu
  - I/O có đệm, I/O trực tiếp và I/O đồng bộ xuống lưu trữ
  - Độ sâu hàng đợi, gộp thao tác và lập lịch yêu cầu thiết bị
  - 'Zero-copy: những lần sao chép có thể tránh và các điều kiện áp dụng'
  - Lỗi thiết bị, hết thời gian chờ, hủy yêu cầu và khôi phục
- level1: Hệ thống tệp
  level2:
  - Tệp, thư mục, đường dẫn tuyệt đối và đường dẫn tương đối
  - Tên tệp, metadata, inode và cách phân giải đường dẫn
  - Hard link, symbolic link và liên kết bị đứt
  - Bộ mô tả tệp, open file description và vị trí đọc, ghi
  - Tạo, mở, đọc, ghi, đổi tên, xóa và đóng tệp
  - Quyền truy cập, chủ sở hữu, nhóm và danh sách kiểm soát truy cập
  - Tệp thưa, cấp phát khối, extent và phân mảnh
  - Mount, hệ thống tệp ảo và phối hợp nhiều loại hệ thống tệp
  - Page cache, dentry cache, inode cache và tính nhất quán quan sát được
  - Khóa tệp, nhiều bên ghi và giới hạn bảo đảm của thao tác nối thêm
  - Đổi tên nguyên tử, fsync tệp, fsync thư mục và công bố tệp an toàn
  - Hạn ngạch, hết dung lượng, hết inode và lỗi tệp vẫn mở sau khi xóa
- level1: Lưu trữ bền vững
  level2:
  - HDD, SSD và khác biệt về độ trễ, truy cập ngẫu nhiên, tuổi thọ
  - Sector, block, căn chỉnh và các lớp đệm trong đường ghi
  - 'SSD: flash, FTL, thu gom rác và khuếch đại ghi'
  - RAID, sao chép, parity và các dạng lỗi lưu trữ
  - Tính nguyên tử, thứ tự ghi và độ bền sau sự cố
  - Journaling, copy-on-write và cơ chế khôi phục hệ thống tệp
  - Ghi nhật ký trước (write-ahead logging), điểm kiểm tra và phục hồi sau sự cố
  - Checksum, phát hiện hỏng âm thầm và kiểm tra toàn vẹn định kỳ
  - Snapshot, sao lưu và bản sao dự phòng phục vụ các mục đích khác nhau
  - RPO, RTO và kiểm chứng khả năng phục hồi từ bản sao lưu
- level1: Hệ quản trị dữ liệu
  level2:
  - Vì sao cần hệ quản trị dữ liệu thay vì chỉ đọc, ghi tệp
  - Trang dữ liệu, bản ghi, bộ đệm và đường đi của thao tác đọc, ghi
  - Chỉ mục B+ tree và tổ chức LSM ở mức hệ thống lưu trữ
  - Chi phí I/O, tính cục bộ và đánh đổi giữa khuếch đại đọc, ghi, dung lượng
  - Giao dịch, tính nguyên tử, tính nhất quán và độ bền
  - Mức cô lập và các bất thường khi giao dịch chạy đồng thời
  - Khóa, MVCC và góc nhìn dữ liệu theo phiên bản
  - Phối hợp nhật ký, điểm kiểm tra và phục hồi giao dịch
  - Truy vấn, kế hoạch thực thi và tài nguyên CPU, bộ nhớ, I/O
  - Giới hạn kết nối, nhóm kết nối và áp lực tài nguyên từ ứng dụng
- level1: Khởi động hệ thống
  level2:
  - 'Từ cấp nguồn đến firmware: POST, BIOS và UEFI'
  - Bộ nạp khởi động, nạp nhân và hệ thống tệp ban đầu
  - Khởi tạo nhân, nhận diện thiết bị và gắn hệ thống tệp gốc
  - Tiến trình đầu tiên và trình quản lý dịch vụ
  - Phụ thuộc dịch vụ, khởi động song song và trạng thái sẵn sàng
