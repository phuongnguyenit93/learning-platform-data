references:
  - title: "From Nand to Tetris"
    url: "https://www.nand2tetris.org/"
    description: "Dự án học logic số, kiến trúc máy tính và ngăn xếp phần mềm từ đầu."
  - title: "Computer Systems: A Programmer's Perspective (CS:APP3e)"
    url: "https://csapp.cs.cmu.edu/3e/home.html"
    description: "Nền tảng biểu diễn dữ liệu, mã máy, bộ nhớ, liên kết, I/O và đồng thời."
  - title: "Operating Systems: Three Easy Pieces"
    url: "https://pages.cs.wisc.edu/~remzi/OSTEP/"
    description: "Sách mở về tiến trình, bộ nhớ ảo, đồng thời và lưu trữ bền vững."
  - title: "MIT 6.1800 — Computer Systems Engineering"
    url: "https://web.mit.edu/6.1800/www/"
    description: "Bài giảng về hệ điều hành, mạng, hệ phân tán, độ tin cậy và bảo mật."
  - title: "An Introduction to Computer Networks"
    url: "https://intronetworks4.cs.luc.edu/"
    description: "Giáo trình mở về tầng mạng, IP, TCP, truyền gói và giao thức."
  - title: "MIT 6.5840 — Distributed Systems"
    url: "https://pdos.csail.mit.edu/6.824/"
    description: "Tài liệu nâng cao về chịu lỗi, sao chép và nhất quán hệ phân tán."