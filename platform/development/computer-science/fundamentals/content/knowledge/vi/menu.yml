menu:
- level1: Tổng quan ngành
  level2:
  - 'Khoa học máy tính nghiên cứu điều gì: thông tin, tính toán và hệ thống'
  - Phân biệt khoa học máy tính, lập trình, công nghệ thông tin và kỹ nghệ phần mềm
  - Từ bài toán thực tế đến mô hình, thuật toán, chương trình và kết quả
  - Mối liên hệ giữa toán học, thuật toán, ngôn ngữ và hệ thống máy tính
  - 'Các lớp trừu tượng: phần cứng, hệ điều hành, nền tảng thực thi và ứng dụng'
  - 'Các hướng ứng dụng: xử lý dữ liệu, đồ họa, trí tuệ nhân tạo và hệ nhúng'
  - Nền tảng chung, kiến thức tiên quyết và các hướng học chuyên sâu
  - Cách học bằng mô hình, ví dụ, phản ví dụ, thí nghiệm và giải thích kết quả
- level1: Tư duy tính toán
  level2:
  - Phân rã vấn đề thành các phần có trách nhiệm rõ ràng
  - Nhận diện mẫu và tái sử dụng cách giải cho những bài toán tương tự
  - 'Trừu tượng hóa: giữ thông tin cần thiết và bỏ chi tiết không liên quan'
  - Lựa chọn mức trừu tượng phù hợp với câu hỏi đang giải quyết
  - Mô hình hóa trạng thái và các phép chuyển trạng thái
  - Tách dữ liệu đầu vào, quy tắc xử lý và kết quả đầu ra
  - Thiết kế quy trình có thể mô tả, thực hiện và kiểm chứng
  - 'Tư duy đệ quy: bài toán con, trường hợp cơ sở và tiến triển'
  - 'Tư duy bất biến: điều gì phải đúng trước, trong và sau mỗi bước'
  - Phân biệt tương quan, quan hệ nhân quả và giả thuyết cần kiểm chứng
- level1: Bài toán và đặc tả
  level2:
  - Chuyển yêu cầu bằng ngôn ngữ tự nhiên thành bài toán rõ ràng
  - Xác định miền đầu vào, miền đầu ra và điều kiện hợp lệ
  - Tiền điều kiện, hậu điều kiện và hợp đồng của lời giải
  - Ràng buộc chức năng, tài nguyên, thời gian và môi trường thực thi
  - Ví dụ chuẩn, trường hợp biên và đầu vào không hợp lệ
  - Bài toán quyết định, tìm kiếm, đếm và tối ưu hóa
  - Lời giải chính xác, lời giải gần đúng và kết quả có tính xác suất
  - Phân biệt yêu cầu bắt buộc với lựa chọn thiết kế
  - Xử lý yêu cầu mơ hồ, thiếu thông tin và giả định chưa được xác nhận
  - Tiêu chí chấp nhận và cách nhận biết một bài toán đã được giải
- level1: Thông tin và biểu diễn
  level2:
  - Phân biệt dữ liệu, thông tin, ý nghĩa và ngữ cảnh diễn giải
  - Biểu diễn rời rạc và chuyển đổi từ tín hiệu liên tục sang dữ liệu số
  - Bit, byte, đơn vị dung lượng và số lượng trạng thái có thể biểu diễn
  - Hệ nhị phân, thập lục phân và chuyển đổi giữa các cơ số
  - Biểu diễn số nguyên, số có dấu và giới hạn miền giá trị
  - Số dấu phẩy động, sai số biểu diễn và giới hạn so sánh số thực
  - Ký tự, Unicode, điểm mã và mã hóa UTF-8, UTF-16
  - Biểu diễn hình ảnh, âm thanh và các đánh đổi khi lấy mẫu
  - Mã hóa biểu diễn, nén, mã hóa bảo mật và băm phục vụ những mục đích gì
  - Nén không mất dữ liệu, nén mất dữ liệu và giới hạn khả năng nén
  - Lượng thông tin, entropy và quan hệ với mức độ bất định
  - Phát hiện lỗi dữ liệu, kiểm tra toàn vẹn và giới hạn của checksum
- level1: Logic và suy luận
  level2:
  - Mệnh đề, giá trị chân lý và các phép toán logic
  - Bảng chân trị và kiểm tra tương đương logic
  - Kéo theo, tương đương, điều kiện cần và điều kiện đủ
  - Phủ định mệnh đề và các quy tắc De Morgan
  - Vị từ, miền xét và lượng từ với mọi, tồn tại
  - Phủ định biểu thức có lượng từ và tránh nhầm thứ tự lượng từ
  - Suy luận hợp lệ, giả thiết, kết luận và lỗi suy luận thường gặp
  - Chứng minh trực tiếp, phản chứng và phản đảo
  - Phản ví dụ và cách bác bỏ một khẳng định tổng quát
  - Biểu thức điều kiện trong chương trình và sự khác nhau với logic toán học
- level1: Toán học cốt lõi
  level2:
  - Tập hợp, phần tử, tập con và các phép toán trên tập
  - Tích Descartes, bộ giá trị và biểu diễn dữ liệu có cấu trúc
  - Quan hệ, tính tương đương và quan hệ thứ tự
  - Hàm, miền xác định, miền giá trị và phép hợp thành
  - Dãy, tổng, tích và những quy luật tăng trưởng cơ bản
  - Lũy thừa, logarit và ý nghĩa trong chia đôi, mã hóa, tìm kiếm
  - Quy nạp toán học và quy nạp theo cấu trúc
  - Quy tắc đếm, hoán vị, chỉnh hợp và tổ hợp
  - Xác suất, xác suất có điều kiện và tính độc lập
  - Biến ngẫu nhiên, kỳ vọng và phân biệt trung bình với từng kết quả
  - Số học modulo và ứng dụng trong chỉ mục vòng, băm, kiểm tra chia hết
  - Đồ thị, đỉnh, cạnh, đường đi và quan hệ kết nối
- level1: Mô hình tính toán
  level2:
  - Mô hình tính toán và lý do cần tách cách tính khỏi thiết bị thực hiện
  - Hệ chuyển trạng thái và cách mô tả một phép tính
  - Máy trạng thái hữu hạn và những giới hạn về bộ nhớ
  - Bộ nhớ có ngăn xếp và khả năng xử lý cấu trúc lồng nhau
  - Máy Turing và ý tưởng về một mô hình tính toán tổng quát
  - Thuật toán, chương trình và thiết bị tính toán không phải là một khái niệm
  - Khả năng tính toán, tính quyết định được và bài toán không quyết định được
  - Bài toán dừng và giới hạn của việc tự động phân tích mọi chương trình
  - Phân biệt bài toán không thể giải tổng quát với bài toán quá tốn tài nguyên
- level1: Nền tảng thuật toán
  level2:
  - Thuật toán là gì và cần mô tả những thông tin nào
  - Tính xác định của từng bước, tính hiệu quả thực hiện và điều kiện dừng
  - Mã giả, sơ đồ luồng và bảng lần vết thực hiện
  - Thực hiện tuần tự, lựa chọn và lặp
  - Đầu vào, đầu ra, trạng thái trung gian và bất biến
  - Thuật toán xác định và thuật toán có sử dụng ngẫu nhiên
  - Thuật toán lặp và thuật toán đệ quy
  - Duyệt tuần tự, tìm kiếm và tích lũy kết quả
  - Sắp xếp, thứ tự so sánh và ý nghĩa của tính ổn định
  - Biểu diễn cùng một thuật toán bằng nhiều ngôn ngữ hoặc mô hình
- level1: Thiết kế thuật toán
  level2:
  - Vét cạn và sử dụng lời giải đơn giản làm mốc đối chiếu
  - Giảm kích thước bài toán và tiến dần đến trường hợp cơ sở
  - Chia để trị và kết hợp lời giải các bài toán con
  - Tham lam và điều kiện để lựa chọn cục bộ dẫn đến kết quả đúng
  - Quy hoạch động, trạng thái và bài toán con chồng lặp
  - Ghi nhớ kết quả và lập bảng tính theo thứ tự phụ thuộc
  - Quay lui, khôi phục trạng thái và cắt bỏ nhánh không khả thi
  - Biến đổi cách biểu diễn để bài toán dễ giải hơn
  - Mô hình hóa quan hệ thành đồ thị để duyệt và tìm đường
  - Chọn chiến lược dựa trên cấu trúc bài toán và ràng buộc đầu vào
- level1: Độ đúng chương trình
  level2:
  - Độ đúng so với đặc tả và sự khác nhau giữa đúng với có vẻ hợp lý
  - Độ đúng bộ phận, tính kết thúc và độ đúng toàn phần
  - 'Bất biến vòng lặp: khởi tạo, duy trì và kết luận'
  - Đại lượng giảm và cách lập luận rằng vòng lặp sẽ dừng
  - Hợp đồng của hàm và kết hợp các thành phần đã được kiểm chứng
  - Chứng minh thuật toán đệ quy bằng quy nạp
  - Điều kiện biên, chỉ số và lỗi lệch một đơn vị
  - Độ đúng số học khi có tràn số, làm tròn hoặc mất độ chính xác
  - Kiểm thử, chứng minh và phân tích tĩnh cung cấp những bằng chứng khác nhau
  - Phản ví dụ nhỏ nhất và thu hẹp đầu vào gây sai
- level1: Phân tích chi phí
  level2:
  - Kích thước đầu vào và mô hình đếm phép toán
  - Chi phí thời gian và chi phí bộ nhớ
  - Trường hợp tốt nhất, xấu nhất và trung bình
  - Ký hiệu O, Omega, Theta và cách diễn giải giới hạn tiệm cận
  - Tăng trưởng hằng số, logarit, tuyến tính, đa thức và hàm mũ
  - Phân tích chuỗi lệnh, nhánh điều kiện và vòng lặp lồng nhau
  - Phân tích đệ quy bằng phương trình truy hồi đơn giản
  - Chi phí khấu hao và sự khác nhau với chi phí trung bình
  - Đánh đổi thời gian, bộ nhớ và độ chính xác
  - Chi phí I/O, truyền dữ liệu và giới hạn của mô hình chỉ đếm CPU
  - Tính khả thi thực tế và ý nghĩa nhập môn của P, NP, NP-complete, NP-hard
  - Vì sao số đo thời gian chạy không thay thế được phân tích độ phức tạp
- level1: Mô hình dữ liệu
  level2:
  - Mô hình dữ liệu và cách chọn những thuộc tính cần biểu diễn
  - Giá trị vô hướng, bản ghi, bộ giá trị và cấu trúc lồng nhau
  - Danh tính đối tượng và sự bằng nhau về giá trị
  - Dữ liệu khả biến, bất biến và quan hệ với trạng thái chương trình
  - Giá trị thiếu, null, tập rỗng và dữ liệu không hợp lệ
  - Bất biến dữ liệu và trách nhiệm giữ dữ liệu hợp lệ
  - Quan hệ một một, một nhiều, nhiều nhiều và cách biểu diễn
  - Mô hình cây, đồ thị và lựa chọn theo quan hệ thực tế
  - Kiểu dữ liệu trừu tượng và phân biệt giao diện với cách cài đặt
  - Tuần tự hóa, lược đồ và thay đổi định dạng dữ liệu theo thời gian
- level1: Cấu trúc dữ liệu
  level2:
  - Mảng và truy cập phần tử theo chỉ số
  - Mảng động, dung lượng dự phòng và chi phí mở rộng
  - Danh sách liên kết và đánh đổi giữa truy cập với cập nhật
  - Ngăn xếp và xử lý theo thứ tự vào sau ra trước
  - Hàng đợi, hàng đợi hai đầu và bộ đệm vòng
  - Bảng băm, hàm băm, va chạm và tra cứu theo khóa
  - Tập hợp, ánh xạ và các hợp đồng về tính duy nhất, thứ tự
  - Cây, cây tìm kiếm và ý nghĩa của việc giữ cây cân bằng
  - Heap và hàng đợi ưu tiên
  - Biểu diễn đồ thị bằng danh sách kề hoặc ma trận kề
  - Chọn cấu trúc theo thao tác chủ đạo, dữ liệu và giới hạn tài nguyên
  - Ảnh hưởng của bố trí bộ nhớ, tính cục bộ và chi phí quản lý phần tử
- level1: Nền tảng lập trình
  level2:
  - Giá trị, biến, tên và trạng thái trong chương trình
  - Biểu thức, toán tử, thứ tự tính và phép gán
  - Rẽ nhánh, điều kiện kết hợp và cách tránh logic khó theo dõi
  - Vòng lặp, điều kiện dừng và các dạng duyệt dữ liệu
  - Hàm, tham số, đối số và kết quả trả về
  - Phạm vi tên, che khuất tên và thời gian sống của dữ liệu
  - Tác dụng phụ và phân biệt tính toán với cập nhật trạng thái
  - Đầu vào, đầu ra và kiểm tra dữ liệu ở ranh giới chương trình
  - Lỗi có thể dự kiến, ngoại lệ và lựa chọn cách biểu diễn thất bại
  - Đọc mã, lần vết thực hiện và dự đoán kết quả trước khi chạy
  - 'Phong cách viết mã rõ ràng: đặt tên, độ dài hàm và mức lồng nhau'
- level1: Hàm và mô-đun
  level2:
  - Trừu tượng hóa bằng hàm và che giấu chi tiết xử lý
  - Hàm thuần, tác dụng phụ và tính dễ kiểm chứng
  - Tham số, giá trị trả về và truyền sự phụ thuộc rõ ràng
  - Truyền giá trị, truyền tham chiếu và chia sẻ đối tượng
  - Đệ quy, ngăn xếp lời gọi và giới hạn độ sâu
  - Mô-đun, giao diện công khai và chi tiết nội bộ
  - Tính gắn kết trong mô-đun và mức phụ thuộc giữa các mô-đun
  - Hợp thành chức năng và tránh lặp lại quy tắc xử lý
  - Quản lý trạng thái dùng chung và giảm phụ thuộc ngầm
  - Tái sử dụng phù hợp và tránh trừu tượng hóa khi chưa có nhu cầu rõ ràng
- level1: Ngôn ngữ lập trình
  level2:
  - Cú pháp, ngữ nghĩa và sự khác nhau giữa mã hợp lệ với mã đúng yêu cầu
  - Từ vựng, phân tích cú pháp và cây cú pháp ở mức khái niệm
  - Kiểu dữ liệu và vai trò của hệ thống kiểu
  - Kiểm tra kiểu tĩnh, kiểm tra kiểu động và thời điểm phát hiện lỗi
  - Suy luận kiểu, chuyển kiểu tường minh và chuyển kiểu ngầm định
  - Đa hình tham số, kiểu con và tái sử dụng theo hợp đồng
  - Kiểu hàm, giá trị hàm và đóng gói môi trường bằng closure
  - Biên dịch, thông dịch, AOT, JIT và các cách thực thi kết hợp
  - Ngôn ngữ, thư viện chuẩn, môi trường thực thi và hệ sinh thái công cụ
  - Lựa chọn ngôn ngữ theo bài toán, môi trường và những đánh đổi
- level1: Phong cách lập trình
  level2:
  - Lập trình mệnh lệnh và mô tả các bước thay đổi trạng thái
  - Lập trình thủ tục và tổ chức chương trình bằng hàm
  - 'Lập trình hướng đối tượng: đối tượng, trách nhiệm và sự cộng tác'
  - Đóng gói, đa hình và hợp thành trong thiết kế hướng đối tượng
  - 'Lập trình hàm: hàm thuần, dữ liệu bất biến và hợp thành phép biến đổi'
  - Lập trình khai báo và mô tả kết quả cần có
  - Lập trình logic và suy luận từ các quan hệ, quy tắc
  - Lập trình hướng sự kiện và phản ứng với thay đổi từ môi trường
  - Ngôn ngữ đa phong cách và lựa chọn cách tổ chức phù hợp
- level1: Chương trình và bộ nhớ
  level2:
  - Biến trong mã nguồn, vị trí lưu trữ và giá trị khi thực thi
  - Địa chỉ bộ nhớ, con trỏ và tham chiếu ở mức khái niệm
  - Ngăn xếp lời gọi, khung hàm và dữ liệu cục bộ
  - Heap, cấp phát động và thời gian sống vượt khỏi lời gọi hàm
  - Chia sẻ tham chiếu, bí danh và thay đổi dữ liệu qua nhiều tên
  - Sao chép nông, sao chép sâu và tác động đến dữ liệu dùng chung
  - Quyền sở hữu, mượn tài nguyên và trách nhiệm thu hồi
  - Thu gom rác và phân biệt khả năng truy cập với tài nguyên bên ngoài
  - Rò rỉ bộ nhớ, tham chiếu treo và sử dụng sau khi giải phóng
  - Quản lý tệp, socket, khóa và thu dọn tài nguyên có giới hạn
  - Đo mức sử dụng bộ nhớ và giải thích sự khác nhau giữa các chỉ số
