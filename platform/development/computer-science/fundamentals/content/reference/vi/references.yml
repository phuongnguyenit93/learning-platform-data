references:
  - title: "CS50's Introduction to Computer Science"
    url: "https://cs50.harvard.edu/x/"
    description: "Học liệu mở của Harvard về tư duy tính toán, thuật toán, lập trình và cấu trúc dữ liệu."
  - title: "Computer Science Field Guide"
    url: "https://www.csfieldguide.org.nz/en/chapters/"
    description: "Các chương tương tác về biểu diễn dữ liệu, thuật toán, độ phức tạp, mạng và an toàn máy tính."
  - title: "MIT OpenCourseWare — Introductory Programming"
    url: "https://ocw.mit.edu/collections/introductory-programming/"
    description: "Tuyển tập khóa nhập môn lập trình và khoa học máy tính dùng ví dụ tính toán."
  - title: "How to Think Like a Computer Scientist: Interactive Edition"
    url: "https://runestone.academy/ns/books/published/thinkcspy/index.html"
    description: "Sách tương tác thực hành tư duy giải quyết vấn đề, hàm, điều kiện, vòng lặp và kiểm thử."
  - title: "OpenDSA"
    url: "https://opendsa.cs.vt.edu/home/books"
    description: "Sách và bài tập trực quan về thuật toán, cấu trúc dữ liệu và khái niệm nền tảng."