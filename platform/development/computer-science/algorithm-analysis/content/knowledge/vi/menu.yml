menu:
- level1: Tổng quan
  level2:
  - Phân tích thuật toán là gì và những câu hỏi cần trả lời
  - Phân biệt tính đúng, khả năng giải và hiệu quả thực hiện
  - Thuật toán, cách cài đặt và chương trình chạy trên máy thực
  - Tài nguyên thời gian, bộ nhớ, truyền dữ liệu và số phép toán
  - Từ mô tả bài toán đến tham số đầu vào và mô hình chi phí
  - Phân biệt chi phí của một thuật toán với độ khó của bài toán
  - Vì sao cùng một kết quả có thể đạt được với chi phí rất khác nhau
  - Vai trò của giả định, chứng minh và đo lường thực nghiệm
  - 'Bản đồ thuật ngữ: cận trên, cận dưới, tiệm cận, kỳ vọng và khấu hao'
  - Lộ trình học và quan hệ với toán, cấu trúc dữ liệu và thiết kế thuật toán
- level1: Đặc tả và tính đúng
  level2:
  - Đặc tả đầu vào, đầu ra và điều kiện hợp lệ
  - Tiền điều kiện, hậu điều kiện và quan hệ giữa chúng
  - Tính đúng bộ phận và tính đúng toàn phần
  - 'Bất biến vòng lặp: khởi tạo, duy trì và kết thúc'
  - Hàm biến thiên và chứng minh vòng lặp dừng
  - Quy nạp để chứng minh tính đúng của thuật toán đệ quy
  - Điều kiện cơ sở và tiến triển về bài toán nhỏ hơn
  - Chứng minh bằng trao đổi trong thuật toán tham lam
  - Quan hệ tối ưu con và lập luận cho quy hoạch động
  - Vai trò của phản ví dụ khi kiểm tra một lập luận
  - Vì sao kiểm thử hữu hạn không thay thế được chứng minh tổng quát
- level1: Mô hình tính chi phí
  level2:
  - Chọn phép toán cơ bản và đơn vị đo chi phí
  - Mô hình máy truy cập ngẫu nhiên (RAM) và giả định về bộ nhớ
  - Mô hình word-RAM và giới hạn kích thước từ máy
  - Chi phí đơn vị và khi nào giả định hằng số không còn phù hợp
  - Mô hình chỉ dựa trên phép so sánh
  - Mô hình chi phí bit khi số nguyên có độ dài thay đổi
  - Đọc đầu vào, ghi đầu ra và chi phí không thể bỏ qua
  - Chi phí cấp phát, sao chép, băm và so sánh đối tượng
  - Chi phí gọi hàm thư viện phụ thuộc dữ liệu và cách cài đặt
  - Phân biệt số phép toán lý thuyết với thời gian đồng hồ
  - Chi phí tiền xử lý, một truy vấn và cả chuỗi truy vấn
  - Chọn mô hình theo mục tiêu phân tích và công bố rõ giả định
- level1: Quy mô và mã hóa
  level2:
  - Xác định kích thước đầu vào từ cách biểu diễn
  - Độ lớn giá trị khác với số bit dùng để mã hóa giá trị
  - Các tham số n, m, k và lý do không luôn gộp thành một biến
  - Kích thước mảng, độ dài chuỗi và độ dài của mỗi phần tử
  - Đồ thị theo số đỉnh, số cạnh và độ dài trọng số
  - Miền giá trị, bảng chữ cái và miền khóa của bài toán
  - Mã nhị phân, mã một ngôi và ảnh hưởng đến phân loại đa thức
  - Chi phí theo đầu vào nén và theo dữ liệu sau giải nén
  - Kích thước đầu ra và giới hạn khi phải liệt kê nhiều kết quả
  - Phân biệt tham số cố định, tham số thay đổi và dữ liệu nghiệp vụ
  - Chuẩn hóa cách ký hiệu trước khi so sánh hai thuật toán
- level1: Công cụ toán
  level2:
  - Lũy thừa, logarit và các quy tắc biến đổi cần dùng
  - Đổi cơ số logarit và điều kiện để bỏ hằng số
  - Hàm sàn, hàm trần và xử lý số phần tử không chia hết
  - Tổng cấp số cộng và tổng cấp số nhân
  - Tổng điều hòa và xấp xỉ bằng logarit
  - Tổng của i, i² và các lũy thừa cố định
  - Tổng có trọng số như i·2ⁱ hoặc i/2ⁱ
  - Giai thừa, hệ số nhị thức và xấp xỉ Stirling
  - Đánh giá tổng bằng chặn trên, chặn dưới và tích phân
  - Đổi thứ tự lấy tổng và đếm cùng một tập theo hai cách
  - Quy nạp thường, quy nạp mạnh và chọn giả thuyết đủ mạnh
  - Bất đẳng thức cơ bản và điều kiện áp dụng
  - Dãy tăng trưởng, giới hạn và các phép so sánh tỉ số
- level1: Ký hiệu tiệm cận
  level2:
  - Định nghĩa O bằng hằng số và ngưỡng đủ lớn
  - Định nghĩa Ω và ý nghĩa của một cận dưới cho hàm chi phí
  - Định nghĩa Θ và điều kiện có cận chặt
  - Ký hiệu o, ω và tăng trưởng nhỏ hơn hoặc lớn hơn nghiêm ngặt
  - Chứng minh trực tiếp từ định nghĩa tiệm cận
  - Tính bắc cầu, tính đối xứng của Θ và quan hệ giữa các ký hiệu
  - Cộng, nhân và lấy cực đại các hàm không âm
  - Bỏ hằng số và số hạng bậc thấp trong đúng điều kiện
  - Ký hiệu tiệm cận với nhiều tham số
  - Cận đồng đều khi nhiều tham số cùng thay đổi
  - Ý nghĩa của các biểu thức có O trong số mũ
  - Ký hiệu Õ và O* cùng những thừa số bị ẩn
  - Vì sao Big O không đồng nghĩa với trường hợp xấu nhất
  - Vì sao Big Ω không đồng nghĩa với trường hợp tốt nhất
  - Cận trên đúng nhưng lỏng và cách tìm cận Θ
- level1: Tốc độ tăng trưởng
  level2:
  - So sánh hằng số, logarit, tuyến tính và tuyến tính nhân logarit
  - Đa thức, siêu đa thức, hàm mũ và giai thừa
  - So sánh lũy thừa logarit với lũy thừa của n
  - So sánh n^log n, 2^n và n!
  - Logarit lặp và hàm nghịch đảo Ackermann ở mức định hướng
  - Dùng giới hạn tỉ số để xác định quan hệ tăng trưởng
  - Các hàm không so sánh được theo một thứ tự tiệm cận duy nhất
  - Cơ số logarit là hằng số nhưng cơ số hàm mũ có thể quyết định khác biệt lớn
  - Điểm giao chi phí và vai trò của hằng số ở quy mô thực tế
  - Khả năng mở rộng khi kích thước đầu vào tăng gấp đôi hoặc gấp mười
- level1: Các loại bảo đảm
  level2:
  - Hàm chi phí trên từng đầu vào và trên một kích thước cố định
  - Trường hợp tốt nhất, xấu nhất và trung bình
  - Trường hợp trung bình cần một phân bố đầu vào cụ thể
  - Kỳ vọng theo ngẫu nhiên nội tại với một đầu vào đã cố định
  - Phân biệt trung bình theo đầu vào với kỳ vọng theo lựa chọn ngẫu nhiên
  - Chi phí khấu hao trên cả chuỗi thao tác
  - Bảo đảm cho một thao tác và bảo đảm cho toàn bộ quá trình
  - Cận kỳ vọng khác với cận có xác suất cao
  - Phân tích nhạy theo đầu ra, đặc điểm dữ liệu và tham số
  - Phân tích làm trơn với nhiễu nhỏ trên dữ liệu
  - Nêu đúng nguồn ngẫu nhiên, miền lượng hóa và phạm vi bảo đảm
  - Những kết luận không thể suy ra chỉ từ một giá trị trung bình
- level1: Vòng lặp
  level2:
  - Đếm số lần thực hiện từ phạm vi chỉ số
  - Vòng lặp nối tiếp và quy tắc cộng chi phí
  - Vòng lặp lồng nhau với số lần lặp độc lập
  - Vòng lặp tam giác và các cận phụ thuộc chỉ số ngoài
  - Chỉ số tăng theo cộng, nhân hoặc lũy thừa
  - Vòng lặp chia đôi và số bước theo logarit
  - Tổng điều hòa từ các bước nhảy phụ thuộc chỉ số
  - Vòng lặp có break, return và nhánh điều kiện
  - Nhánh loại trừ nhau khác với các khối cùng được thực hiện
  - Con trỏ không quay lại và cách đếm tổng số lần tiến
  - Hai con trỏ, cửa sổ trượt và các vòng while lồng nhau
  - Phần tử vào–ra cấu trúc hữu hạn lần và chi phí tổng
  - Chi phí trong thân vòng lặp không phải lúc nào cũng hằng số
  - Vòng lặp lặp đến hội tụ và điều kiện dừng phụ thuộc dữ liệu
  - Lỗi kết luận bậc hai chỉ vì nhìn thấy hai vòng lặp lồng nhau
- level1: Không gian và cấp phát
  level2:
  - Không gian đầu vào, đầu ra và không gian phụ trợ
  - Không gian cực đại đang dùng khác với tổng lượng bộ nhớ đã cấp phát
  - Biến cục bộ, cấu trúc phụ và bộ đệm tạm
  - Ngăn xếp lời gọi và độ sâu đệ quy cực đại
  - Số lời gọi đệ quy khác với số khung ngăn xếp cùng tồn tại
  - Cây đệ quy và thứ tự thực hiện ảnh hưởng đến đỉnh sử dụng bộ nhớ
  - Chia sẻ dữ liệu, lát cắt và sao chép mảng con
  - Truyền tham chiếu không có nghĩa mọi thao tác đều không sao chép
  - Thuật toán tại chỗ và quy ước cho bộ nhớ ngăn xếp
  - Đệ quy đuôi và điều kiện để thực sự giảm bộ nhớ
  - Bộ nhớ đệm kết quả, vòng đời đối tượng và khả năng thu hồi
  - Đánh đổi thời gian–không gian qua tiền xử lý và lưu thông tin phụ
  - Chi phí biểu diễn một phần tử khi kích thước giá trị không cố định
- level1: Đệ quy và truy hồi
  level2:
  - Mô hình hóa một lời gọi bằng kích thước bài toán hiện tại
  - Số bài toán con, kích thước bài toán con và chi phí ngoài đệ quy
  - Điều kiện cơ sở và ảnh hưởng đến nghiệm truy hồi
  - Truy hồi giảm một đơn vị và giảm theo hệ số
  - Một nhánh đệ quy khác với nhiều nhánh cùng được thực hiện
  - Truy hồi cho nhánh xấu nhất và nhánh được chọn theo điều kiện
  - Truy hồi phụ thuộc nhiều tham số
  - Xử lý n lẻ, hàm sàn và hàm trần
  - Chi phí sao chép và tạo dữ liệu con trong mỗi lời gọi
  - Phân biệt truy hồi bằng nhau với bất đẳng thức truy hồi
  - Nhận biết bài toán con trùng lặp trước khi cộng chi phí
  - Kiểm tra tiến triển và tính dừng trước khi phân tích thời gian
- level1: Giải truy hồi
  level2:
  - Khai triển liên tiếp và xác định số mức
  - Đổi biến để đưa truy hồi về dạng dễ phân tích
  - 'Cây đệ quy: chi phí tại nút, tại mức và toàn cây'
  - Độ cao cây, số lá và vai trò của điều kiện cơ sở
  - Tổng chi phí khi các mức bằng nhau, tăng dần hoặc giảm dần
  - Cây đệ quy không cân bằng và các đường đi có độ sâu khác nhau
  - Phương pháp thế và chứng minh cận trên bằng quy nạp
  - Chứng minh cận dưới và ghép thành cận Θ
  - Chọn hằng số, ngưỡng cơ sở và giả thuyết quy nạp đủ mạnh
  - Thêm số hạng hiệu chỉnh để tránh phép thế không khép kín
  - Truy hồi tuyến tính hệ số hằng và phương trình đặc trưng
  - Nghiệm truy hồi Fibonacci và khác biệt giữa giá trị trả về với số lời gọi
  - Kiểm tra nghiệm bằng thay ngược và đối chiếu các giá trị nhỏ
  - Giới hạn của suy đoán nghiệm từ một vài số liệu
- level1: Master và mở rộng
  level2:
  - Dạng T(n)=aT(n/b)+f(n) và các giả định của định lý Master
  - So sánh f(n) với n^(log_b a)
  - Trường hợp chi phí ở lá chiếm ưu thế
  - Trường hợp cân bằng giữa các mức của cây đệ quy
  - Trường hợp chi phí gần gốc chiếm ưu thế
  - Khoảng cách đa thức và lý do không chỉ so sánh lớn hơn hoặc nhỏ hơn
  - Điều kiện chính quy trong trường hợp f(n) chiếm ưu thế
  - Thừa số logarit và các phiên bản mở rộng của Master
  - Trường hợp biên dẫn đến log log n
  - Vì sao Master không áp dụng trực tiếp cho T(n−1) hoặc các nhánh không đều
  - Định lý Akra–Bazzi cho một số truy hồi chia không đều
  - Điều kiện áp dụng, số mũ cân bằng và thành phần tích phân của Akra–Bazzi
  - Chọn phương pháp giải thay vì ép mọi truy hồi vào một công thức
- level1: Quy hoạch động
  level2:
  - Không gian trạng thái và ý nghĩa của một trạng thái
  - Số trạng thái có thể có khác với số trạng thái thực sự đạt tới
  - Chi phí bằng số trạng thái nhân chi phí chuyển trong đúng điều kiện
  - Đếm cạnh của đồ thị phụ thuộc khi số chuyển không đều
  - Ghi nhớ kết quả và bảo đảm mỗi trạng thái chỉ được tính hữu ích một lần
  - Chi phí tra cứu bộ nhớ đệm bằng mảng, bảng băm hoặc cây
  - Đệ quy có ghi nhớ so với tính bảng theo thứ tự phụ thuộc
  - Bộ nhớ bảng kết quả và ngăn xếp lời gọi
  - Nén chiều, mảng cuộn và điều kiện không mất dữ liệu cần dùng
  - Chi phí khôi phục lời giải bên cạnh chỉ tính giá trị tối ưu
  - Đếm trạng thái theo tập con, đoạn và nhiều tham số
  - Bài toán ba lô và dấu hiệu độ phức tạp giả đa thức
  - Chi phí biểu diễn và sao chép giá trị trong mỗi ô
  - Lỗi bỏ qua vòng duyệt chuyển trạng thái hoặc dữ liệu không đạt tới
- level1: Chi phí cấu trúc dữ liệu
  level2:
  - Mảng cố định, mảng động và danh sách liên kết theo từng phép toán
  - Chi phí thao tác khi đã biết vị trí khác với phải tìm vị trí
  - Ngăn xếp, hàng đợi và deque trên các cách cài đặt
  - 'Bảng băm: chi phí băm khóa, hệ số tải và va chạm'
  - Thời gian kỳ vọng của bảng băm khác với bảo đảm xấu nhất
  - BST theo chiều cao và ảnh hưởng của dữ liệu đã có thứ tự
  - Cây cân bằng và số lần cập nhật thông tin phụ
  - 'Heap: thêm, lấy cực trị, đổi ưu tiên và xây từ dưới lên'
  - Trie theo độ dài khóa và cách lưu tập nhánh
  - Cây đoạn và Fenwick theo số mức cấu trúc
  - 'DSU: hợp theo hạng, nén đường đi và chi phí cả chuỗi'
  - Chi phí duyệt mọi phần tử cùng chi phí duy trì bộ duyệt
  - Phối hợp nhiều cấu trúc và cộng chi phí cập nhật các chỉ mục
  - Không coi thao tác thư viện là hằng số chỉ vì có một lời gọi
- level1: Tìm kiếm và sắp xếp
  level2:
  - Tìm kiếm tuyến tính và phân bố vị trí cần tìm
  - 'Tìm kiếm nhị phân: số phép so sánh và điều kiện truy cập dữ liệu'
  - Chèn vào mảng đã sắp xếp và chi phí dịch chuyển
  - Sắp xếp chèn và số nghịch thế của đầu vào
  - Sắp xếp chọn và số phép so sánh không phụ thuộc nhiều vào thứ tự
  - Sắp xếp nổi bọt với hoặc không có điều kiện dừng sớm
  - 'Sắp xếp trộn: truy hồi thời gian và bộ nhớ phụ'
  - Quicksort với phân hoạch cân bằng, lệch và nhiều khóa trùng
  - Heapsort và tổng chi phí xây heap rồi lấy phần tử
  - Counting sort theo số phần tử và miền giá trị
  - Radix sort theo số lượt, cơ số và độ dài khóa
  - Bucket sort và giả định phân bố dữ liệu
  - 'Quickselect: chỉ theo nhánh chứa hạng cần tìm'
  - Chọn phần tử bằng median-of-medians và truy hồi chia không đều
