references:
  - title: "MIT 6.005 — Reading 19: Concurrency"
    url: "https://web.mit.edu/6.005/www/fa16/classes/19-concurrency/"
    description: "Nền tảng concurrency, parallelism, process, thread, shared memory, message passing và race condition."
  - title: "MIT 6.005 — Reading 20: Thread Safety"
    url: "https://web.mit.edu/6.005/www/fa16/classes/20-thread-safety/"
    description: "Chiến lược an toàn luồng bằng confinement, immutable state và cấu trúc dữ liệu thread-safe."
  - title: "MIT 6.005 — Reading 23: Locks and Synchronization"
    url: "https://web.mit.edu/6.005/www/fa16/classes/23-locks/"
    description: "Giải thích khóa, critical section, đồng bộ và chiến lược tránh deadlock."
  - title: "Operating Systems: Three Easy Pieces — Concurrency"
    url: "https://pages.cs.wisc.edu/~remzi/OSTEP/"
    description: "Sách mở về luồng, lock, condition variable, semaphore và các lỗi đồng thời."
  - title: "Oracle Java Tutorials — Concurrency"
    url: "https://docs.oracle.com/javase/tutorial/essential/concurrency/index.html"
    description: "Tổng quan process/thread, synchronization, liveness, executor và concurrent collection."
  - title: "The Go Memory Model"
    url: "https://go.dev/ref/mem"
    description: "Tài liệu chính thức về visibility, synchronization, happens-before và data race."