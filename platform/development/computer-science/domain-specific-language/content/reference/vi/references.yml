references:
  - title: "Martin Fowler — Domain-Specific Languages Guide"
    url: "https://martinfowler.com/dsl.html"
    description: "Khái niệm DSL, phân biệt internal và external DSL, các lựa chọn thiết kế ngôn ngữ."
  - title: "Martin Fowler — Domain Specific Language"
    url: "https://martinfowler.com/bliki/DomainSpecificLanguage.html"
    description: "Ví dụ DSL, fluent interfaces, parser riêng và diễn giải hoặc code generation."
  - title: "Martin Fowler — Language Workbench"
    url: "https://martinfowler.com/bliki/LanguageWorkbench.html"
    description: "Language-oriented programming, semantic model và công cụ hỗ trợ nhiều DSL."
  - title: "ANTLR v4 — Getting Started"
    url: "https://github.com/antlr/antlr4/blob/dev/doc/getting-started.md"
    description: "Viết grammar, tạo lexer/parser cho Java, kiểm tra parse tree bằng ANTLR."
  - title: "Eclipse Xtext — 15 Minutes Tutorial"
    url: "https://eclipse.dev/Xtext/documentation/102_domainmodelwalkthrough.html"
    description: "Tạo external DSL, grammar, model, parser và hỗ trợ editor/validation."
  - title: "Eclipse Xtext — Language Generator Configuration"
    url: "https://eclipse.dev/Xtext/documentation/302_configuration.html"
    description: "Sinh parser, serializer, model và cấu hình hạ tầng triển khai DSL."
  - title: "JetBrains MPS — Basic Notions"
    url: "https://www.jetbrains.com/help/mps/basic-notions.html"
    description: "AST và projectional editor như một hướng xây công cụ DSL không dựa trên parser văn bản."