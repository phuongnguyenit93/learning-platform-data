menu:
- level1: Bản đồ ngôn ngữ
  level2:
  - Ngôn ngữ lập trình là gì và vai trò trong việc diễn đạt thuật toán
  - Chương trình, ngôn ngữ, bộ xử lý ngôn ngữ và môi trường thực thi
  - Cú pháp, ngữ nghĩa và cách sử dụng ngôn ngữ liên hệ với nhau thế nào
  - Giá trị, kiểu, tên, biểu thức và câu lệnh trong một chương trình
  - Trạng thái, luồng điều khiển và trừu tượng hóa
  - Mô hình lập trình (paradigm) và ngôn ngữ hỗ trợ nhiều mô hình
  - Đặc tả ngôn ngữ, thư viện chuẩn và cách hiện thực khác nhau
  - Mã nguồn, biểu diễn trung gian, mã máy và kết quả thực thi
  - Lộ trình học từ khái niệm ngôn ngữ đến phân tích chương trình
- level1: Thiết kế và tiến hóa
  level2:
  - Bài toán ứng dụng và phần cứng ảnh hưởng đến thiết kế ngôn ngữ
  - Các mốc phát triển từ ngôn ngữ máy đến ngôn ngữ bậc cao
  - Sự phát triển của các mô hình mệnh lệnh, hàm, logic và hướng đối tượng
  - Khả năng đọc, khả năng viết, độ tin cậy và chi phí sử dụng
  - Tính đơn giản, tính trực giao và sức biểu đạt
  - Đánh đổi giữa an toàn, tính linh hoạt và khả năng kiểm soát
  - Thiết kế tối giản và thiết kế tích hợp nhiều đặc tính
  - Đặc tả chuẩn, phương ngữ và phần mở rộng của nhà cung cấp
  - Tương thích ngược, loại bỏ đặc tính và tiến hóa ngôn ngữ
  - Cách đánh giá một đặc tính bằng tình huống sử dụng và đánh đổi
- level1: Cú pháp
  level2:
  - Ký tự, từ tố (token), từ khóa và định danh
  - Khoảng trắng, chú thích và ranh giới câu lệnh
  - Từ vựng và văn phạm trong mô tả cú pháp
  - Ký pháp BNF và EBNF để đọc quy tắc ngôn ngữ
  - Quy tắc sinh, dẫn xuất và cây phân tích cú pháp
  - Cây cú pháp trừu tượng (AST) và cấu trúc chương trình
  - Sự nhập nhằng của văn phạm và cách loại bỏ
  - Độ ưu tiên và tính kết hợp của toán tử
  - Phân biệt cú pháp cụ thể với cú pháp trừu tượng
  - Cú pháp rút gọn và phép chuyển đổi về cấu trúc cốt lõi
  - Lỗi từ vựng, lỗi cú pháp và chất lượng thông báo lỗi
- level1: Ngữ nghĩa
  level2:
  - Ý nghĩa chương trình và ranh giới giữa cú pháp với ngữ nghĩa
  - Ngữ nghĩa tĩnh và các điều kiện hợp lệ trước khi chạy
  - Ngữ nghĩa động và cách xác định hành vi lúc chạy
  - Môi trường liên kết tên và vùng lưu trữ trong mô hình thực thi
  - Ngữ nghĩa thao tác với bước nhỏ và bước lớn
  - Ngữ nghĩa biểu thị và ý nghĩa dưới dạng hàm toán học
  - Ngữ nghĩa tiên đề và bộ ba Hoare
  - Tiền điều kiện, hậu điều kiện và bất biến
  - Hành vi được đặc tả, chưa được quy định và phụ thuộc cách hiện thực
  - Hành vi không xác định và giới hạn suy luận về chương trình
  - Tương đương quan sát được và phép biến đổi bảo toàn ngữ nghĩa
- level1: Tên và liên kết
  level2:
  - Tên, thực thể, thuộc tính và phép liên kết (binding)
  - Khai báo, định nghĩa và lần sử dụng một tên
  - Thời điểm liên kết ở mức thiết kế, biên dịch, nạp và thực thi
  - Liên kết tĩnh, liên kết động và khả năng thay đổi liên kết
  - Không gian tên và các quy tắc phân giải tên
  - Che khuất tên (shadowing) và xung đột định danh
  - Nạp chồng tên và lựa chọn thực thể phù hợp
  - Bí danh (aliasing) và nhiều tên cùng trỏ đến một thực thể
  - Hằng, biến, vị trí lưu trữ và giá trị
  - Định danh của đối tượng và sự bằng nhau về giá trị
- level1: Phạm vi và thời gian sống
  level2:
  - Phạm vi tên và thời gian sống của thực thể
  - Phạm vi từ vựng (lexical scope) và khối lồng nhau
  - Phạm vi động (dynamic scope) và chuỗi lời gọi
  - Biến cục bộ, biến không cục bộ và biến toàn cục
  - Quy tắc khai báo trước khi dùng và điểm bắt đầu có hiệu lực
  - Thời gian lưu trữ tĩnh, theo ngăn xếp và theo vùng nhớ động
  - Biến thoát khỏi phạm vi khai báo và môi trường được giữ lại
  - Liên kết tên khi truyền hàm và môi trường thực thi đi kèm
  - Phạm vi mô-đun, lớp và quyền truy cập
  - Phân tích lỗi do che khuất tên, bí danh và thời gian sống
- level1: Nền tảng hệ kiểu
  level2:
  - Kiểu dữ liệu là tập giá trị và tập phép toán như thế nào
  - Kiểu của biến, kiểu của giá trị và mối quan hệ khi gán
  - Hệ kiểu và vai trò kiểm tra tính hợp lệ của chương trình
  - Kiểm tra kiểu tĩnh và kiểm tra kiểu động
  - An toàn kiểu và các lỗi mà hệ kiểu hướng tới ngăn chặn
  - Giới hạn của cách phân loại kiểu mạnh và kiểu yếu
  - Tương đương kiểu theo tên và theo cấu trúc
  - Tương thích kiểu, phép chuyển kiểu và ép kiểu
  - Chuyển kiểu ngầm định và chuyển kiểu tường minh
  - Suy luận kiểu và quan hệ với khai báo kiểu
  - Kiểu con và nguyên tắc thay thế
  - Đa hình tham số, đa hình kiểu con và đa hình đặc biệt
  - Kiểu trên cùng, kiểu dưới cùng và kiểu đơn vị (unit)
- level1: Kiểu dữ liệu cơ sở
  level2:
  - Giá trị Boolean, phép toán logic và chuyển đổi sang điều kiện
  - Số nguyên có độ rộng cố định, miền giá trị và tính có dấu
  - Tràn số nguyên và chính sách xử lý của từng ngôn ngữ
  - Số nguyên độ chính xác tùy ý và đánh đổi tài nguyên
  - Số dấu phẩy động và ảnh hưởng của biểu diễn gần đúng
  - NaN, vô cực, số không có dấu và phép so sánh
  - Số thập phân chính xác và bài toán tính toán tài chính
  - Ký tự, điểm mã Unicode và đơn vị mã
  - Chuỗi, mã hóa văn bản và độ dài theo cách đếm khác nhau
  - Chuỗi bất biến, chuỗi khả biến và các phép thao tác
  - Kiểu liệt kê và ý nghĩa của các giá trị ký hiệu
  - Giá trị null, giá trị không có và kiểu cho phép thiếu
- level1: Biểu thức và phép gán
  level2:
  - Biểu thức, câu lệnh và ngôn ngữ xem cấu trúc điều khiển là biểu thức
  - Giá trị, vị trí lưu trữ và các nhóm giá trị như lvalue, rvalue
  - Toán tử một ngôi, hai ngôi và ba ngôi
  - Độ ưu tiên cú pháp và thứ tự thực sự đánh giá các toán hạng
  - Tác dụng phụ trong biểu thức và ảnh hưởng đến kết quả
  - Đánh giá ngắn mạch của các toán tử logic
  - Phép gán, phép khởi tạo và phép liên kết lại tên
  - Gán ghép, tăng giảm và các quy tắc đánh giá
  - Gán đồng thời, phân rã giá trị và nhiều giá trị trả về
  - So sánh giá trị, so sánh định danh và hợp đồng bằng nhau
  - Nạp chồng toán tử và sự nhất quán về ý nghĩa
  - Chuyển đổi kiểu số và tương tác giữa các kiểu trong biểu thức
- level1: Điều khiển luồng
  level2:
  - Thực thi tuần tự và cấu trúc điều khiển có tổ chức
  - Rẽ nhánh if và ý nghĩa của điều kiện
  - Lựa chọn nhiều nhánh với switch và các biến thể
  - Khớp mẫu (pattern matching) và phân rã dữ liệu
  - Điều kiện bảo vệ, tính đầy đủ và nhánh không thể tới
  - Vòng lặp kiểm tra điều kiện trước và sau
  - Vòng lặp đếm và quy tắc của biến điều khiển
  - Duyệt tập hợp qua bộ lặp (iterator) và giao thức duyệt
  - Thoát sớm bằng break, continue và return
  - Nhảy có nhãn, goto và tác động đến cấu trúc chương trình
  - Bất biến vòng lặp và lập luận về sự kết thúc
- level1: Chương trình con
  level2:
  - Hàm, thủ tục, phương thức và hợp đồng gọi
  - Chữ ký, phần thân và giao diện của chương trình con
  - Tham số hình thức và đối số thực tế
  - Giá trị trả về, nhiều kết quả và hàm không trả về bình thường
  - Phân biệt hàm với dữ liệu được gọi được
  - Hàm là giá trị hạng nhất và hàm bậc cao
  - Nạp chồng hàm và quy tắc lựa chọn lời gọi
  - Hàm có số lượng đối số thay đổi
  - Hàm ẩn danh, biểu thức lambda và hàm cục bộ
  - Đệ quy trực tiếp, đệ quy gián tiếp và điều kiện dừng
  - Tính thuần, tính tái nhập và trạng thái dùng chung của hàm
- level1: Tham số và lời gọi
  level2:
  - Truyền giá trị và dữ liệu được sao chép khi gọi hàm
  - Truyền tham chiếu và khả năng sửa thực thể của bên gọi
  - Truyền theo chia sẻ đối tượng và sao chép giá trị tham chiếu
  - Truyền kết quả, truyền giá trị–kết quả và thời điểm sao chép
  - Truyền theo tên và sự khác biệt với đánh giá thông thường
  - Bí danh giữa các tham số và tác động đến kết quả
  - Thứ tự đánh giá đối số và tác dụng phụ
  - Đối số theo vị trí, theo tên và đối số mặc định
  - Thời điểm đánh giá đối số mặc định
  - Tham số chỉ đọc và quyền sửa đối tượng được truyền vào
  - Lời gọi đuôi và điều kiện tối ưu hóa lời gọi đuôi
  - Hợp đồng tham số và thiết kế giao diện dễ sử dụng
- level1: Closure và tiếp diễn
  level2:
  - Biến tự do, biến bị ràng buộc và môi trường của hàm
  - Closure và việc kết hợp mã hàm với môi trường
  - Bắt giữ giá trị và bắt giữ vị trí lưu trữ
  - Thời gian sống của biến bị bắt giữ
  - Closure trong vòng lặp và thời điểm liên kết biến
  - Ứng dụng closure để che giấu trạng thái và tạo hàm chuyên biệt
  - Tiếp diễn (continuation) như phần tính toán còn lại
  - Phong cách truyền tiếp diễn (CPS)
  - Tiếp diễn có giới hạn và sự khác biệt với ngoại lệ
  - Mối liên hệ giữa closure, callback và coroutine
- level1: Kiểu hợp thành
  level2:
  - Tích Descartes, kiểu tích và bộ giá trị (tuple)
  - Con trỏ, tham chiếu và sự khác nhau trong mô hình ngôn ngữ
  - Bản ghi (record), trường dữ liệu và cập nhật giá trị
  - Mảng, chỉ số, cận và chính sách kiểm tra truy cập
  - Mảng nhiều chiều, mảng lồng nhau và hình dạng dữ liệu
  - Lát cắt (slice), khung nhìn và quan hệ với dữ liệu gốc
  - Danh sách, ánh xạ, tập hợp và hỗ trợ của ngôn ngữ hoặc thư viện
  - Kiểu tổng, hợp có nhãn và kiểu dữ liệu đại số
  - Phân biệt union không có nhãn với kiểu tổng có nhãn
  - Kiểu đệ quy và biểu diễn cây, danh sách liên kết
  - Kiểu Option, Maybe, Result và biểu diễn trạng thái hợp lệ
  - Khớp mẫu theo cấu trúc và xử lý đầy đủ các biến thể
  - Bất biến dữ liệu và mô hình hóa để hạn chế trạng thái sai
- level1: Tổng quát hóa
  level2:
  - Động cơ dùng kiểu và hàm tổng quát
  - Tham số kiểu, đối số kiểu và phạm vi của biến kiểu
  - Ràng buộc kiểu và các phép toán được phép sử dụng
  - Tổng quát hóa hàm, kiểu dữ liệu và mô-đun
  - Bất biến, đồng biến và nghịch biến của tham số kiểu
  - Vị trí đầu vào, đầu ra và an toàn khi thay thế kiểu
  - Phương sai tại nơi khai báo và tại nơi sử dụng
  - Wildcard, phép chiếu kiểu và giới hạn truy cập
  - Đơn hình hóa (monomorphization) và xóa kiểu (type erasure)
  - Kiểu còn được giữ ở thời gian chạy và giới hạn phản chiếu
  - Chuyên biệt hóa, lựa chọn hiện thực và chi phí mã sinh ra
  - Ràng buộc bằng interface, trait và type class
- level1: Trừu tượng và mô-đun
  level2:
  - Trừu tượng hóa dữ liệu và tách giao diện khỏi cách hiện thực
  - Kiểu dữ liệu trừu tượng và bất biến biểu diễn
  - Đóng gói, che giấu thông tin và quyền truy cập
  - Mô-đun, package, namespace và đơn vị biên dịch
  - Xuất, nhập và phân giải các phụ thuộc
  - Giao diện mô-đun, chữ ký và hiện thực thay thế
  - Khởi tạo mô-đun và vấn đề thứ tự khởi tạo
  - Mô-đun tham số hóa và ý tưởng functor trong hệ mô-đun
  - Liên kết giữa các đơn vị biên dịch và tải động
  - Tính liên kết nội bộ, sự phụ thuộc và thiết kế ranh giới
- level1: Hướng đối tượng
  level2:
  - Đối tượng, trạng thái, hành vi và định danh
  - Lớp, thể hiện, prototype và các mô hình tạo đối tượng
  - Thuộc tính, phương thức và cách xác định đối tượng nhận lời gọi
  - Khởi tạo, hủy và bất biến của đối tượng
  - Kế thừa để tái sử dụng và quan hệ kiểu con
  - Ghi đè, nạp chồng và che khuất thành viên
  - Phân phối lời gọi tĩnh và phân phối lời gọi động
  - Interface, lớp trừu tượng, trait và mixin
  - Đa kế thừa, xung đột tên và thứ tự phân giải phương thức
  - Thành phần hóa, ủy quyền và quan hệ với kế thừa
  - Đa hình kiểu con và nguyên tắc thay thế Liskov
  - Phân phối đơn, phân phối kép và đa phương thức
  - Bất biến nông, bất biến sâu và quyền sửa qua tham chiếu
  - Quan hệ giữa đóng gói, tính khả biến và khả năng mở rộng
- level1: Lập trình hàm
  level2:
  - Mô hình tính toán bằng cách áp dụng và kết hợp hàm
  - 'Lambda calculus: biến, trừu tượng hóa và áp dụng'
  - Biến đổi alpha, phép thế tránh bắt giữ và rút gọn beta
  - Hàm thuần, tính minh bạch tham chiếu và suy luận bằng thay thế
  - Dữ liệu bất biến và cấu trúc dữ liệu bền vững
  - Hàm bậc cao với map, filter, fold và reduce
  - Tổ hợp hàm, đường ống biến đổi và cách đọc luồng dữ liệu
  - Currying và áp dụng một phần
  - Đệ quy, khớp mẫu và thay thế một số vòng lặp
  - Tích lũy kết quả và đệ quy đuôi trong xử lý dữ liệu
  - Functor, applicative và monad như các mô hình kết hợp phép tính
  - Tách tính toán thuần khỏi tương tác với bên ngoài
  - Đánh đổi của lập trình hàm và cách kết hợp với mô hình khác
- level1: Lập trình logic
  level2:
  - Tri thức, sự kiện, luật và truy vấn
  - Logic vị từ và ý nghĩa khai báo của chương trình
  - Biến logic và sự khác biệt với biến lưu trạng thái
  - Hạng (term), cấu trúc dữ liệu và phép hợp nhất
  - Phép thế, kiểm tra xuất hiện và cấu trúc đệ quy
  - Hợp giải và cơ chế tìm lời giải
  - Quay lui và liệt kê nhiều kết quả
  - Thứ tự luật, thứ tự mục tiêu và ảnh hưởng đến tìm kiếm
  - Phủ định do thất bại và giới hạn diễn giải
