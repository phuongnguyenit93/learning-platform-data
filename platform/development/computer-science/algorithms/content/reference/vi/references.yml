references:
  - title: "MIT OpenCourseWare — 6.006 Introduction to Algorithms"
    url: "https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/"
    description: "Bài giảng và bài tập về thuật toán, sắp xếp, đồ thị và quy hoạch động."
  - title: "Algorithms, 4th Edition — Princeton"
    url: "https://algs4.cs.princeton.edu/home/"
    description: "Học liệu của Robert Sedgewick và Kevin Wayne về sắp xếp, tìm kiếm, đồ thị và chuỗi."
  - title: "CP-Algorithms"
    url: "https://cp-algorithms.com/"
    description: "Thư viện bài viết về quy hoạch động, thuật toán đồ thị, xử lý chuỗi và kỹ thuật giải bài."
  - title: "VisuAlgo"
    url: "https://visualgo.net/en"
    description: "Mô phỏng trực quan các bước chạy của thuật toán tìm kiếm, sắp xếp và đồ thị."
  - title: "OpenDSA"
    url: "https://opendsa.cs.vt.edu/"
    description: "Sách tương tác, hình minh họa và bài tập về cấu trúc dữ liệu cùng thuật toán."
  - title: "USACO Guide"
    url: "https://usaco.guide/"
    description: "Lộ trình bài tập thực hành các mẫu thuật toán từ cơ bản đến nâng cao."