  - Build chạy được trong reactor nhưng thất bại khi build riêng mô-đun
  - Khác biệt giữa máy cá nhân, IDE và CI do settings hoặc profile
  - Tái hiện lỗi với POM tối thiểu và lưu bằng chứng trước khi sửa
  - Kiểm tra giả thuyết trước khi xóa cache hoặc bỏ qua bước thất bại
