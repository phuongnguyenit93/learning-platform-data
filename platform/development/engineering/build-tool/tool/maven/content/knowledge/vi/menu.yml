  - Truy cập MavenProject, MavenSession và mô hình dự án
  - Khai báo yêu cầu phân giải phụ thuộc của goal
  - Thiết kế goal có đầu vào, đầu ra và thông báo lỗi rõ ràng
  - Thread safety và lưu ý khi goal chạy trong reactor song song
  - Kiểm thử plugin bằng dự án mẫu và kiểm chứng gọi qua Maven
  - Phân biệt build extension, core extension và plugin thông thường
  - Đăng ký extension qua cấu hình phù hợp và quản lý phiên bản
  - Chi phí bảo trì, tương thích và phạm vi tin cậy của phần mở rộng
