  - Tích hợp kiểm tra định dạng và quy tắc mã nguồn bằng plugin
  - Tích hợp phân tích tĩnh và phân biệt báo cáo với bước chặn build
  - 'JaCoCo: thu thập dữ liệu độ bao phủ và tạo báo cáo'
