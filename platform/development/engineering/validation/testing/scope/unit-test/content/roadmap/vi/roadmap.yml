roadmap:
- id: ranh-gioi-unit-test
  title: Ranh giới Unit Test
  purpose: Xác định phần hành vi cần kiểm chứng trong một đơn vị và ranh giới so với các cấp kiểm thử khác.
  objectives:
  - Nhận diện unit và hợp đồng hành vi cần kiểm thử.
  - Phân biệt unit test với integration và end-to-end test.
  - Ưu tiên logic nghiệp vụ, nhánh quyết định và quy tắc xử lý.
- id: thiet-ke-ca-kiem-thu
  title: Thiết kế ca kiểm thử
  purpose: Tạo các ca kiểm thử dễ hiểu, bám sát hành vi và kỳ vọng thực tế.
  objectives:
  - Viết test theo cấu trúc Arrange–Act–Assert.
  - Đặt tên thể hiện điều kiện và kết quả mong đợi.
  - Bao phủ luồng thành công, thất bại và tình huống biên.
- id: junit-jupiter
  title: JUnit Jupiter
  purpose: Tổ chức và chạy unit test Java bằng framework có vòng đời rõ ràng.
  objectives:
  - Viết @Test và chạy test qua IDE hoặc Gradle.
  - Sử dụng @BeforeEach, @AfterEach và @Nested phù hợp.
  - Tạo fixture độc lập để mỗi test có thể chạy riêng.
- id: assertions-exceptions
  title: Assertions & Exceptions
  purpose: Kiểm chứng chính xác đầu ra, trạng thái và lỗi có thể quan sát được.
  objectives:
  - Viết assertion cho giá trị, tập hợp và thay đổi trạng thái.
  - Dùng assertThrows cho ngoại lệ mong đợi.
  - Viết thông báo thất bại hữu ích, tránh assertion mơ hồ.
- id: du-lieu-parameterized-test
  title: Dữ liệu & Parameterized Test
  purpose: Tăng độ bao phủ tình huống mà không lặp lại cấu trúc test.
  objectives:
  - Phân lớp tương đương và lựa chọn giá trị biên.
  - Chuẩn bị dữ liệu test nhỏ, rõ và có thể tái sử dụng.
  - Dùng @ParameterizedTest với các nguồn dữ liệu phù hợp.
- id: test-doubles-mockito
  title: Test Doubles & Mockito
  purpose: Cô lập phụ thuộc bên ngoài để tập trung vào hành vi đơn vị đang kiểm thử.
  objectives:
  - Phân biệt stub, fake, mock và spy.
  - Dùng Mockito tạo stub và verify khi cần thiết.
  - Hạn chế over-mocking và không ràng buộc test vào chi tiết nội bộ.
- id: thiet-ke-testable-on-dinh
  title: Thiết kế Testable & Ổn định
  purpose: Giữ unit test nhanh, lặp lại được và không phụ thuộc môi trường.
  objectives:
  - Dùng dependency injection để thay thế dependency khi test.
  - Kiểm soát clock, randomness và I/O phát sinh trong unit.
  - Loại bỏ lệ thuộc thứ tự chạy, shared state và thời gian thực.
- id: do-luong-bao-tri-test
  title: Đo lường & Bảo trì Test
  purpose: Đánh giá sức phát hiện lỗi của bộ test và duy trì phản hồi nhanh qua thời gian.
  objectives:
  - Chạy unit test tự động trong local và CI.
  - Đọc JaCoCo coverage để nhận biết nhánh còn thiếu.
  - Dùng mutation testing phù hợp để kiểm tra chất lượng assertion.
