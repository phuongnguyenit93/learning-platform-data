references:
  - title: "IETF RFC 9110 - HTTP Semantics"
    url: "https://www.rfc-editor.org/rfc/rfc9110.html"
    description: "Ngữ nghĩa HTTP methods, status codes, request và response fields."
  - title: "curl - Command Line Manual"
    url: "https://curl.se/docs/manpage.html"
    description: "Thực hành HTTP method, headers, payload, redirects và quan sát phản hồi với curl."
  - title: "Postman - Send API Requests"
    url: "https://learning.postman.com/docs/use/send-requests/requests"
    description: "Tạo, gửi và kiểm tra HTTP requests, params, headers và response."
  - title: "Postman - Write Test Scripts"
    url: "https://learning.postman.com/docs/tests-and-scripts/write-scripts/test-scripts"
    description: "Viết assertions với pm.test, pm.response và kiểm thử phản hồi."
  - title: "Postman - Test Script Examples"
    url: "https://learning.postman.com/docs/tests-and-scripts/write-scripts/test-examples/"
    description: "Các ví dụ assertions, xác nhận dữ liệu và test response."
  - title: "Postman - Variables and Environments"
    url: "https://learning.postman.com/docs/use/send-requests/variables/variables/"
    description: "Biến base URL, token và truyền dữ liệu giữa các request theo scope."
  - title: "Postman - Collection Runner"
    url: "https://learning.postman.com/docs/tests-and-scripts/running-collections/intro-to-collection-runs"
    description: "Chạy một tập request và test theo thứ tự, nhiều iteration và test data."
  - title: "Postman - Run Collections from CLI"
    url: "https://learning.postman.com/docs/postman-cli/postman-cli-run-collection"
    description: "Chạy kiểm thử tự động trong CLI và CI/CD."
  - title: "Postman - API Mocking"
    url: "https://learning.postman.com/docs/design-apis/mock-apis/overview/"
    description: "Giả lập response của API và dependency khi kiểm thử độc lập."
  - title: "REST Assured - Usage Guide"
    url: "https://github.com/rest-assured/rest-assured/wiki/Usage"
    description: "Java DSL cho HTTP requests, response assertions và API automation."
  - title: "Playwright - API Testing"
    url: "https://playwright.dev/docs/api-testing"
    description: "Tạo APIRequestContext, setup test và kiểm tra HTTP bằng Playwright."
  - title: "Grafana k6 - HTTP Requests"
    url: "https://grafana.com/docs/k6/latest/using-k6/http-requests/"
    description: "Gửi HTTP requests và tổ chức phép đo trong k6 load test."
  - title: "Grafana k6 - Checks"
    url: "https://grafana.com/docs/k6/latest/using-k6/checks/"
    description: "Kiểm tra response và phối hợp threshold để định nghĩa pass/fail."