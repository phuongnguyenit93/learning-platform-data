references:
  - title: "Google SRE — Service Level Objectives"
    url: "https://sre.google/sre-book/service-level-objectives/"
    description: "Cơ sở định nghĩa SLI/SLO, latency percentile, throughput và error rate gắn với chất lượng dịch vụ."
  - title: "Grafana k6 — API Load Testing"
    url: "https://grafana.com/docs/k6/latest/testing-guides/api-load-testing/"
    description: "Quy trình lập mục tiêu thử tải, thiết kế workload và chọn smoke, load, stress, spike, soak hoặc breakpoint test."
  - title: "Grafana k6 — Scenarios"
    url: "https://grafana.com/docs/k6/latest/using-k6/scenarios/"
    description: "Tạo workload bằng virtual users, arrival rate, executor và các kịch bản tải độc lập."
  - title: "Grafana k6 — Thresholds"
    url: "https://grafana.com/docs/k6/latest/using-k6/thresholds/"
    description: "Đặt ngưỡng pass/fail cho response time, error rate và kiểm thử tự động."
  - title: "Grafana k6 — Automated Performance Testing"
    url: "https://grafana.com/docs/k6/latest/testing-guides/automated-performance-testing/"
    description: "Tổ chức smoke, average, stress, spike và soak tests thành bộ kiểm thử có thể chạy lặp lại."
  - title: "Apache JMeter — Elements of a Test Plan"
    url: "https://jmeter.apache.org/usermanual/test_plan.html"
    description: "Thread Groups, samplers, timers, assertions và listeners cho kịch bản thử tải."
  - title: "Apache JMeter — Generating Dashboard Report"
    url: "https://jmeter.apache.org/usermanual/generating-dashboard"
    description: "Tạo báo cáo HTML về response time percentiles, throughput, lỗi và số request."
  - title: "Gatling — Injection"
    url: "https://docs.gatling.io/concepts/injection/"
    description: "Mô hình tải open/closed, arrival rate, số người dùng đồng thời và bước ramp-up."
  - title: "OpenTelemetry — What Is OpenTelemetry?"
    url: "https://opentelemetry.io/docs/what-is-opentelemetry/"
    description: "Instrumentation và thu thập metrics, traces, logs để quan sát hệ thống khi kiểm thử hiệu năng."