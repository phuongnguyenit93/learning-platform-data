references:
  - title: "WireMock — Stubbing"
    url: "https://wiremock.org/docs/stubbing/"
    description: "Định nghĩa request/response stub bằng Java DSL hoặc JSON mappings, status, headers và body."
  - title: "WireMock — Request Matching"
    url: "https://wiremock.org/docs/request-matching/"
    description: "Khớp HTTP method, URL, query, headers, cookies, JSON body và thuộc tính request."
  - title: "WireMock — Response Templating"
    url: "https://wiremock.org/docs/response-templating/"
    description: "Tạo phản hồi linh hoạt từ request với response templates."
  - title: "WireMock — Simulating Faults"
    url: "https://wiremock.org/docs/simulating-faults/"
    description: "Giả lập response delay, network faults và kịch bản trục trặc kết nối."
  - title: "WireMock — Stateful Behaviour"
    url: "https://wiremock.org/docs/stateful-behaviour/"
    description: "Scenarios, state transitions và reset trạng thái giữa các lượt kiểm thử."
  - title: "WireMock — Verifying"
    url: "https://wiremock.org/docs/verifying/"
    description: "Xác minh số lượng và thuộc tính request đã nhận bằng request journal."
  - title: "WireMock — Record and Playback"
    url: "https://wiremock.org/docs/record-playback/"
    description: "Ghi lại interaction để tạo mappings, rà soát và tái sử dụng khi kiểm thử."
  - title: "WireMock — JUnit 5+ Jupiter"
    url: "https://wiremock.org/docs/junit-jupiter/"
    description: "Vòng đời server tự động, cổng ngẫu nhiên và reset mappings trong Java JUnit 5."
  - title: "Spring Framework — Testing Client Applications"
    url: "https://docs.spring.io/spring-framework/reference/testing/spring-mvc-test-client.html"
    description: "Kiểm thử HTTP client với WireMock, MockWebServer hoặc MockRestServiceServer trong Spring."