references:
  - title: "JUnit – User Guide"
    url: "https://docs.junit.org/current/user-guide/"
    description: "JUnit Platform, Jupiter, lập cấu hình test, lifecycle và khả năng chạy trên JVM."
  - title: "JUnit – Parameterized Classes and Tests"
    url: "https://docs.junit.org/current/writing-tests/parameterized-classes-and-tests.html"
    description: "@ParameterizedTest, các nguồn tham số và kiểm thử nhiều trường hợp dữ liệu."
  - title: "JUnit – Tags"
    url: "https://docs.junit.org/current/running-tests/tags.html"
    description: "Đánh nhãn @Tag và lọc bộ test theo nhóm hoặc mục đích."
  - title: "Mockito – Official Website"
    url: "https://site.mockito.org/"
    description: "Mocking framework cho unit test Java, stubbing và xác minh tương tác."
  - title: "Spring Boot – Testing"
    url: "https://docs.spring.io/spring-boot/reference/testing/"
    description: "Spring Boot test support, JUnit, test slices và tiện ích integration test."
  - title: "Spring Framework – MockMvc"
    url: "https://docs.spring.io/spring-framework/reference/testing/mockmvc.html"
    description: "Kiểm thử Spring MVC request/response mà không cần HTTP server thực."
  - title: "Testcontainers – JUnit 5 Quickstart"
    url: "https://java.testcontainers.org/quickstart/junit_5_quickstart/"
    description: "Tạo container phụ thuộc để chạy integration test có thể lặp lại."
  - title: "Apache Maven – Surefire Plugin"
    url: "https://maven.apache.org/surefire/maven-surefire-plugin/"
    description: "Chạy unit test trong giai đoạn test và tạo XML/text test reports."
  - title: "Apache Maven – Failsafe Plugin"
    url: "https://maven.apache.org/surefire/maven-failsafe-plugin/"
    description: "Chạy integration test trong integration-test/verify, hỗ trợ teardown an toàn."
  - title: "Gradle – Testing in Java & JVM Projects"
    url: "https://docs.gradle.org/current/userguide/java_testing.html"
    description: "Cấu hình test task, JUnit Platform, bộ lọc, báo cáo và chạy test trong build."
  - title: "JaCoCo – Documentation"
    url: "https://www.jacoco.org/jacoco/trunk/doc/"
    description: "Code coverage cho Java và cách tích hợp báo cáo với Maven/Gradle."