references:
  - title: "JaCoCo — Coverage Counters"
    url: "https://www.jacoco.org/jacoco/trunk/doc/counters.html"
    description: "Định nghĩa instruction, branch, line, method, class và complexity coverage cùng các giới hạn của phép đo."
  - title: "JaCoCo — Java Agent"
    url: "https://www.jacoco.org/jacoco/trunk/doc/agent.html"
    description: "Cơ chế instrumentation on-the-fly, thu thập execution data và các tùy chọn Java agent."
  - title: "JaCoCo — Offline Instrumentation"
    url: "https://www.jacoco.org/jacoco/trunk/doc/offline.html"
    description: "Trường hợp cần instrumentation trước runtime và cách thu thập dữ liệu coverage ngoài Java agent."
  - title: "JaCoCo — Maven Plugin"
    url: "https://www.jacoco.org/jacoco/trunk/doc/maven.html"
    description: "Tích hợp JaCoCo trong Maven, chạy unit/integration tests và tạo báo cáo."
  - title: "JaCoCo — jacoco:report"
    url: "https://www.jacoco.org/jacoco/trunk/doc/report-mojo.html"
    description: "Tạo báo cáo coverage dạng HTML, XML và CSV từ execution data trong dự án Maven."
  - title: "JaCoCo — jacoco:check"
    url: "https://www.jacoco.org/jacoco/trunk/doc/check-mojo.html"
    description: "Cấu hình ngưỡng và quy tắc coverage để làm thất bại build nếu vi phạm quality gate."
  - title: "JaCoCo — jacoco:report-aggregate"
    url: "https://www.jacoco.org/jacoco/trunk/doc/report-aggregate-mojo.html"
    description: "Tổng hợp báo cáo và dữ liệu đo từ nhiều module hoặc test project trong Maven reactor."
  - title: "Gradle — JaCoCo Plugin"
    url: "https://docs.gradle.org/current/userguide/jacoco_plugin.html"
    description: "Cấu hình JaCoCo trong Gradle, task jacocoTestReport, coverage verification và tổng hợp nhiều test suite."