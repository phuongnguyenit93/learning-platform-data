menu:
- level1: Tổng quan
  level2:
  - Kiểm thử bảo mật (security testing) là gì và vấn đề cần giải quyết
  - Quan hệ giữa tài sản, cơ chế bảo vệ và bằng chứng kiểm thử
  - 'Mục tiêu bảo mật: bí mật, toàn vẹn và sẵn sàng'
  - Phân biệt hành vi đúng chức năng với hành vi đáp ứng yêu cầu bảo mật
  - Phân biệt điểm yếu, lỗ hổng, mối đe dọa và rủi ro
  - Quan hệ với kiểm thử đơn vị, tích hợp, hệ thống và đầu cuối
  - Phân biệt rà soát bảo mật, quét lỗ hổng và kiểm thử thâm nhập
  - Lợi ích, chi phí và giới hạn của kết quả kiểm thử bảo mật
  - Lộ trình từ phân tích rủi ro đến xác minh bản sửa
- level1: Khái niệm nền tảng
  level2:
  - Nhận diện tài sản, dữ liệu nhạy cảm và chủ thể truy cập
  - Ranh giới tin cậy (trust boundary) và bề mặt tấn công
  - Phân biệt xác thực danh tính với phân quyền truy cập
  - Nguyên tắc quyền tối thiểu và mặc định từ chối
  - Phân biệt kiểm soát phòng ngừa, phát hiện và phục hồi
  - Phân biệt mã hóa, hàm băm, chữ ký và mã hóa biểu diễn
  - Nguồn dữ liệu không tin cậy và điểm sử dụng dữ liệu
  - Tác động bảo mật theo người dùng, khách hàng và hệ thống liên quan
  - Giới hạn suy luận từ một lần quét không phát hiện cảnh báo
- level1: Phạm vi và ủy quyền
  level2:
  - Xác định hệ thống, tài khoản, API và môi trường được phép kiểm tra
  - Thống nhất mục tiêu, phương pháp và thời gian thực hiện
  - Phân biệt tài sản do nhóm quản lý với dịch vụ của bên thứ ba
  - Quy định giới hạn tải, dữ liệu và thao tác có tác dụng phụ
  - Thiết lập điều kiện dừng và đầu mối xử lý sự cố
  - Quản lý quyền truy cập cho người và công cụ kiểm thử
  - Thống nhất cách thu thập, lưu giữ và chia sẻ bằng chứng
  - Ghi rõ phần ngoài phạm vi và rủi ro chưa được kiểm chứng
- level1: Mô hình đe dọa
  level2:
  - Vẽ luồng dữ liệu và các ranh giới tin cậy của ứng dụng
  - Xác định tác nhân, tài sản và khả năng tác động
  - Phân tích giả định tin cậy tại giao diện, dịch vụ và nơi lưu trữ
  - Sử dụng STRIDE hoặc cách phân tích phù hợp với hệ thống
  - Xây kịch bản lạm dụng từ mục tiêu nghiệp vụ cần bảo vệ
  - Ưu tiên rủi ro theo tác động, khả năng xảy ra và mức phơi lộ
  - Liên kết mối đe dọa với yêu cầu và cơ chế bảo vệ
  - Chuyển giả thuyết rủi ro thành điều kiện kiểm thử
  - Cập nhật mô hình khi kiến trúc, dữ liệu hoặc cách triển khai thay đổi
- level1: Chiến lược kiểm thử
  level2:
  - Chọn mức độ kiểm chứng theo rủi ro của sản phẩm
  - Kết hợp góc nhìn hộp đen, hộp xám và hộp trắng
  - Phối hợp kiểm thử tĩnh, động, thủ công và tự động
  - Sử dụng OWASP ASVS để xác định yêu cầu kiểm chứng
  - Sử dụng OWASP WSTG để tham khảo phương pháp kiểm thử
  - Sử dụng các danh mục rủi ro OWASP phù hợp với web và API
  - Ghi phiên bản tiêu chuẩn và mã yêu cầu khi lập ma trận bao phủ
  - Phân bổ kiểm tra theo giai đoạn phát triển và phát hành
  - Xác định bằng chứng, tiêu chí hoàn tất và phần rủi ro còn lại
  - Lập trách nhiệm phối hợp giữa phát triển, bảo mật và vận hành
- level1: Môi trường kiểm thử
  level2:
  - Tạo môi trường riêng có cấu hình đại diện cho ứng dụng
  - Sử dụng dữ liệu tổng hợp hoặc đã khử thông tin nhận dạng
  - Chuẩn bị tài khoản theo vai trò, trạng thái và khách hàng độc lập
  - Cô lập dịch vụ ngoài và điểm tiếp nhận dữ liệu thử nghiệm
  - Cố định phiên bản ứng dụng, cấu hình và thành phần phụ thuộc
  - Kiểm tra khả năng quan sát qua log, chỉ số và định danh tương quan
  - Chuẩn bị trạng thái ban đầu và cơ chế đặt lại dữ liệu
  - Giới hạn tài nguyên của các kiểm tra có thể tạo tải
  - Dọn tài khoản, tệp và dữ liệu sau kiểm thử
- level1: Thiết kế ca kiểm thử
  level2:
  - Liên kết yêu cầu bảo mật, rủi ro và ca kiểm thử
  - Xác định tiền điều kiện, vai trò, dữ liệu và kết quả mong đợi
  - Thiết kế ca hợp lệ cùng ca phải bị từ chối
  - Chọn giá trị biên, dạng dữ liệu bất thường và tổ hợp điều kiện
  - Xây ma trận vai trò, hành động và tài nguyên
  - Kiểm tra cơ chế bảo vệ ở nhiều lớp có liên quan
  - Xác nhận kiểm soát ở phía máy chủ qua giao diện công khai
  - Chọn bằng chứng đủ chứng minh tác động với dữ liệu thử nghiệm
  - Ghi điều kiện tái hiện và giới hạn của từng ca
  - Phân biệt kết quả không đạt với ca chưa được thực thi hoặc chưa đủ bằng chứng
- level1: Xác thực danh tính
  level2:
  - Kiểm tra đăng ký, xác minh danh tính và kích hoạt tài khoản
  - Kiểm tra đăng nhập hợp lệ và từ chối thông tin không đúng
  - Kiểm tra khả năng lộ sự tồn tại của tài khoản
  - Kiểm tra chính sách mật khẩu và thay đổi mật khẩu
  - Kiểm tra luồng quên mật khẩu và khôi phục tài khoản
  - Kiểm tra thời hạn, mục đích và khả năng dùng lại mã xác nhận
  - Kiểm tra giới hạn thử đăng nhập và cơ chế chống lạm dụng
  - Kiểm tra MFA cùng cơ chế khôi phục hoặc thay đổi yếu tố xác thực
  - Kiểm tra đăng nhập lại cho thao tác nhạy cảm
  - Kiểm tra tài khoản bị khóa, vô hiệu hóa hoặc thu hồi quyền
  - Kiểm tra liên kết danh tính và đăng nhập qua nhà cung cấp bên ngoài
  - Đánh giá thông báo lỗi và nhật ký xác thực
- level1: Phiên và token
  level2:
  - Kiểm tra tạo, thay đổi và hủy phiên làm việc
  - Kiểm tra session fixation và thay phiên sau thay đổi mức tin cậy
  - Kiểm tra thời hạn nhàn rỗi, thời hạn tuyệt đối và đăng xuất
  - Kiểm tra thuộc tính Secure, HttpOnly và SameSite của cookie
  - Kiểm tra phạm vi cookie theo domain và path
  - Kiểm tra chữ ký, thuật toán được chấp nhận và thời hạn JWT
  - Kiểm tra issuer, audience và mục đích sử dụng token
  - Kiểm tra refresh token, xoay vòng và phát hiện dùng lại theo thiết kế
  - Kiểm tra thu hồi phiên hoặc token sau sự kiện bảo mật
  - Kiểm tra lưu trữ token và khả năng lộ qua URL, log hoặc trình duyệt
  - Kiểm tra OAuth và OpenID Connect theo luồng được sử dụng
  - Kiểm tra redirect URI, state, nonce và PKCE khi phù hợp với giao thức
- level1: Phân quyền
  level2:
  - Phân biệt phân quyền theo vai trò, thuộc tính và quan hệ tài nguyên
  - Kiểm tra truy cập chức năng theo ma trận quyền
  - Kiểm tra quyền trên từng đối tượng và định danh tài nguyên
  - Kiểm tra quyền đọc hoặc sửa từng trường dữ liệu
  - Kiểm tra leo thang đặc quyền theo chiều ngang và chiều dọc
  - Kiểm tra cô lập dữ liệu giữa các khách hàng (tenant)
  - Kiểm tra tài nguyên thuộc người dùng khác hoặc không còn quyền sở hữu
  - Kiểm tra quyền sau khi đổi vai trò, chuyển trạng thái hoặc thu hồi
  - Kiểm tra endpoint quản trị và các đường truy cập thay thế
  - Kiểm tra quyền cho thao tác hàng loạt, export và tác vụ nền
  - Kiểm tra mặc định từ chối khi chính sách hoặc dữ liệu quyền bị thiếu
  - Đối chiếu phân quyền ở lớp web, lớp phương thức và truy cập dữ liệu
- level1: Bảo mật API
  level2:
  - Kiểm kê endpoint, phiên bản và giao diện quản trị đang hoạt động
  - Kiểm tra dữ liệu trả về theo quyền và nhu cầu người gọi
  - Kiểm tra giới hạn trường đầu vào để ngăn cập nhật thuộc tính ngoài quyền
  - Kiểm tra xác thực và phạm vi sử dụng API key hoặc token
  - Kiểm tra giới hạn tần suất, kích thước và mức tiêu thụ tài nguyên
  - Kiểm tra quy tắc cho truy vấn phức tạp, GraphQL hoặc thao tác hàng loạt
  - Kiểm tra API cũ, endpoint thử nghiệm và giao diện không còn được dùng
  - Kiểm tra xử lý dữ liệu từ API bên thứ ba
  - Kiểm tra webhook, chữ ký và tính mới của yêu cầu
  - Kiểm tra quyền và trạng thái phiên với WebSocket hoặc kết nối kéo dài
- level1: Kiểm tra đầu vào
  level2:
  - Phân biệt kiểm tra kiểu, định dạng, miền giá trị và quy tắc nghiệp vụ
  - Kiểm tra độ dài, kích thước và độ sâu dữ liệu đầu vào
  - Kiểm tra tham số thiếu, lặp, không được hỗ trợ hoặc sai kiểu
  - Kiểm tra chuẩn hóa Unicode, encoding và biểu diễn tương đương
  - Kiểm tra dữ liệu tại path, query, header, cookie và body
  - Kiểm tra danh sách trường được phép ghi và trường chỉ đọc
  - Kiểm tra quan hệ giữa các trường thay vì chỉ xác nhận từng giá trị
  - Kiểm tra giới hạn tài nguyên khi parse hoặc xử lý dữ liệu
  - Kiểm tra biểu thức chính quy và nguy cơ tiêu thụ tài nguyên quá mức (ReDoS)
  - Đối chiếu thông báo lỗi với yêu cầu bảo vệ thông tin
- level1: Chèn lệnh và truy vấn
  level2:
  - Nhận diện chèn lệnh (injection) khi dữ liệu đi vào câu lệnh hoặc ngôn ngữ biểu thức
  - Kiểm tra SQL injection tại truy vấn, sắp xếp và bộ lọc
  - Kiểm tra truy vấn động qua JDBC, ORM, JPQL hoặc HQL
  - Kiểm tra điều kiện truy vấn NoSQL theo công nghệ đang dùng
  - Kiểm tra dữ liệu được đưa vào LDAP hoặc XPath
  - Kiểm tra tách tham số khỏi lệnh hệ điều hành
  - Kiểm tra dữ liệu đưa vào template hoặc ngôn ngữ biểu thức
  - Kiểm tra header injection và ký tự xuống dòng trong giao thức
  - Xác minh cơ chế tham số hóa, danh sách cho phép và mã hóa đúng ngữ cảnh
  - Kiểm tra lỗi bị lộ và tác động trên dữ liệu thử nghiệm
- level1: XSS và trình duyệt
  level2:
  - Phân biệt XSS phản chiếu, lưu trữ và dựa trên DOM
  - Kiểm tra dữ liệu đi vào HTML, thuộc tính, URL và JavaScript
  - Xác minh mã hóa đầu ra theo đúng ngữ cảnh sử dụng
  - Kiểm tra bộ làm sạch khi ứng dụng cho phép nội dung HTML
  - Kiểm tra cách dùng API DOM và thư viện render
  - Kiểm tra chính sách Content Security Policy theo yêu cầu ứng dụng
  - Kiểm tra nội dung tải từ bên thứ ba và ranh giới tin cậy
  - Kiểm tra open redirect và việc xác nhận địa chỉ chuyển hướng
  - Kiểm tra chống nhúng trang, clickjacking và tương tác nhạy cảm
  - Đối chiếu kết quả trên trình duyệt với phản hồi HTTP và dữ liệu được lưu
- level1: CSRF và CORS
  level2:
  - Đánh giá nguy cơ CSRF theo cách trình duyệt gửi thông tin xác thực
  - Kiểm tra token CSRF hợp lệ, thiếu, sai hoặc thuộc phiên khác
  - Kiểm tra các thao tác thay đổi trạng thái và phương thức HTTP được chấp nhận
  - Đánh giá vai trò của SameSite, Origin và Referer trong cơ chế bảo vệ
  - Kiểm tra danh sách origin được cho phép
  - Kiểm tra credential, preflight và phương thức hoặc header được phép
  - Kiểm tra origin không tin cậy và cấu hình phản hồi động
  - Phân biệt chính sách CORS với xác thực và phân quyền phía máy chủ
  - Kiểm tra tính nhất quán giữa cấu hình ứng dụng và reverse proxy
- level1: Tệp và đường dẫn
  level2:
  - Kiểm tra tên tệp, đường dẫn và vùng lưu trữ được phép
  - Kiểm tra path traversal và truy cập ngoài thư mục quy định
  - Kiểm tra loại tệp, phần mở rộng, MIME và nội dung thực tế
  - Kiểm tra giới hạn kích thước, số lượng và tần suất upload
  - Kiểm tra quyền truy cập tệp sau khi tải lên
  - Kiểm tra khả năng thực thi nội dung tại vị trí lưu trữ
  - Kiểm tra giải nén với đường dẫn, số lượng và dung lượng được giới hạn
  - Kiểm tra tải xuống theo quyền và định danh tài nguyên
  - Kiểm tra URL chia sẻ hoặc URL có chữ ký theo phạm vi và thời hạn
  - Kiểm tra xóa tệp, dữ liệu tạm và tài nguyên còn sót
- level1: SSRF
  level2:
  - Nhận diện chức năng máy chủ truy cập URL do dữ liệu đầu vào quyết định
  - Xác định giao thức, host và đích mạng được phép truy cập
  - Kiểm tra chuẩn hóa URL trước khi quyết định cho phép
  - Kiểm tra cách xử lý redirect và thay đổi đích sau phân giải DNS
  - Kiểm tra hạn chế truy cập mạng nội bộ và dịch vụ metadata
  - Đánh giá proxy, kiểm soát kết nối ra ngoài và lớp bảo vệ mạng
  - Thu thập bằng chứng qua điểm tiếp nhận do nhóm kiểm thử kiểm soát
  - Kiểm tra timeout, kích thước phản hồi và giới hạn tài nguyên
  - Xác minh biện pháp bảo vệ vẫn có hiệu lực trong cấu hình triển khai
- level1: Bộ phân tích dữ liệu
  level2:
  - Kiểm tra XML external entity và cấu hình truy cập tài nguyên ngoài
  - Kiểm tra DTD, schema và cơ chế phân giải XML
  - Kiểm tra giới hạn mở rộng entity và độ sâu cấu trúc
  - Kiểm tra parser JSON với dữ liệu lớn, sâu hoặc không hợp lệ
  - Kiểm tra YAML loader và khả năng tạo đối tượng ngoài dự kiến
  - Kiểm tra định dạng tài liệu hoặc dữ liệu nhị phân theo thư viện đang dùng
  - Kiểm tra dữ liệu sau giải mã hoặc giải nén trước khi xử lý tiếp
  - Đánh giá lỗi parser, dữ liệu được ghi log và thông tin bị lộ
- level1: Java và Spring
  level2:
  - Kiểm tra giải tuần tự đối tượng Java từ nguồn không tin cậy
  - Kiểm tra ObjectInputFilter và chính sách lớp được phép theo cấu hình thực tế
  - Kiểm tra ánh xạ đa hình khi chuyển đổi JSON thành đối tượng
  - Kiểm tra data binding và trường thuộc tính được phép cập nhật
  - Kiểm tra dữ liệu đưa vào SpEL hoặc cơ chế tạo template
  - Kiểm tra reflection, tải lớp và cấu hình có thể thay đổi hành vi thực thi
  - Kiểm tra thứ tự và phạm vi áp dụng SecurityFilterChain
  - Kiểm tra method security và lời gọi đi qua cơ chế thực thi quyền
  - Kiểm tra Actuator, endpoint chẩn đoán và thông tin cấu hình
  - Đối chiếu bảo vệ trong kiểm thử mô phỏng với ứng dụng Java đang chạy
- level1: Mật mã và bí mật
  level2:
  - Kiểm kê dữ liệu cần mã hóa, xác thực tính toàn vẹn hoặc ký
  - Kiểm tra lựa chọn thuật toán, tham số và thư viện theo yêu cầu bảo mật
  - Kiểm tra quản lý khóa, vòng đời và phân tách quyền sử dụng
  - Kiểm tra nonce, IV và điều kiện duy nhất theo cơ chế mật mã
  - Kiểm tra lưu mật khẩu bằng hàm băm mật khẩu và tham số phù hợp
  - Đánh giá nguồn ngẫu nhiên cho token, khóa và mã xác nhận
  - Kiểm tra bí mật trong mã nguồn, tệp cấu hình, artifact và image
  - Kiểm tra cấp phát, xoay vòng và thu hồi thông tin xác thực
  - Kiểm tra cách ứng dụng xử lý khi khóa hoặc bí mật không sẵn sàng
  - Xác minh bảo vệ bí mật khi ghi log, báo lỗi và xuất dữ liệu
- level1: Dữ liệu nhạy cảm
  level2:
  - Phân loại dữ liệu và xác định người được phép tiếp cận
  - Kiểm tra dữ liệu nhạy cảm trong response, trang lỗi và metadata
  - Kiểm tra che dữ liệu trong log, báo cáo và công cụ giám sát
  - Kiểm tra mã hóa dữ liệu lưu trữ và dữ liệu sao lưu
  - Kiểm tra quyền truy cập cơ sở dữ liệu và kho lưu trữ đối tượng
  - Kiểm tra cache theo người dùng, khách hàng và mức quyền
  - Kiểm tra dữ liệu còn lại sau đăng xuất, xóa hoặc kết thúc phiên
  - Kiểm tra export, bản sao và tệp tạm theo chính sách vòng đời
  - Kiểm tra dữ liệu dùng cho môi trường phát triển và kiểm thử
  - Ghi rõ phạm vi bằng chứng đối với yêu cầu bảo vệ và lưu giữ dữ liệu
- level1: HTTP và TLS
  level2:
  - Kiểm tra HTTPS và xử lý kết nối không mã hóa
  - Kiểm tra chứng chỉ, hostname và chuỗi tin cậy
  - Kiểm tra phiên bản TLS và cấu hình thuật toán được chấp nhận
  - Kiểm tra HSTS cùng điều kiện triển khai phù hợp
  - Kiểm tra header bảo vệ nội dung và chính sách cache
  - Kiểm tra Host, forwarded header và ranh giới tin cậy với reverse proxy
  - Kiểm tra phương thức HTTP không cần thiết và thông báo lỗi giao thức
  - Kiểm tra tính nhất quán xử lý request giữa các tầng và rủi ro request smuggling
  - Kiểm tra cấu hình TLS của kết nối tới dịch vụ bên ngoài
  - Xác minh hiệu lực bảo vệ qua điểm truy cập thực tế của ứng dụng
- level1: Logic nghiệp vụ
  level2:
  - Xác định mục tiêu lạm dụng từ luồng nghiệp vụ hợp lệ
  - Kiểm tra thứ tự thao tác và chuyển trạng thái được phép
  - Kiểm tra dữ liệu do máy chủ quyết định như giá, quyền lợi và hạn mức
  - Kiểm tra thao tác lặp và tính idempotent của yêu cầu
  - Kiểm tra truy cập đồng thời và khả năng vượt giới hạn nghiệp vụ
  - Kiểm tra thời điểm xác nhận điều kiện so với lúc sử dụng tài nguyên
  - Kiểm tra điều kiện đổi, hủy, hoàn hoặc khôi phục giao dịch
  - Kiểm tra chính sách hạn chế lạm dụng các luồng nhạy cảm
  - Kiểm tra tương tác giữa nhiều vai trò hoặc tài khoản thử nghiệm
  - Đánh giá tác động và cơ chế phát hiện trên dữ liệu được kiểm soát
- level1: Tích hợp và thông điệp
  level2:
  - Kiểm tra danh tính và quyền giữa các dịch vụ
  - Kiểm tra truyền token, quyền hạn và định danh người dùng qua nhiều tầng
  - Kiểm tra độ tin cậy của dữ liệu từ đối tác hoặc API ngoài
  - Kiểm tra chữ ký, nguồn gửi và tính mới của webhook
  - Kiểm tra quyền phát, nhận và truy cập kênh thông điệp
  - Kiểm tra dữ liệu nhạy cảm trong payload, header và hàng đợi lỗi
  - Kiểm tra kiểm soát phát lại hoặc trùng lặp theo yêu cầu nghiệp vụ
  - Kiểm tra thay đổi quyền trong tác vụ bất đồng bộ
  - Đánh giá bảo mật khi dịch vụ phụ thuộc không sẵn sàng hoặc phản hồi bất thường
- level1: Cấu hình và phơi lộ
  level2:
  - Kiểm kê dịch vụ, cổng và giao diện ứng dụng thực sự công khai
  - Kiểm tra tài khoản mặc định và cấu hình ban đầu
  - Kiểm tra chế độ debug, stack trace và thông tin phiên bản
  - Kiểm tra tệp cấu hình, bản sao lưu và nội dung không cần công khai
  - Kiểm tra giao diện quản trị và công cụ chẩn đoán
  - Kiểm tra quyền tệp, thư mục và cấu hình của tiến trình ứng dụng
  - Kiểm tra sai lệch giữa môi trường thử nghiệm với bản triển khai
  - Xác minh cấu hình tăng cường bảo mật vẫn giữ hành vi nghiệp vụ cần thiết
- level1: Chuỗi cung ứng
  level2:
  - Kiểm kê thư viện trực tiếp, bắc cầu, plugin và công cụ build
  - Sử dụng SCA để tìm thành phần có lỗ hổng đã được công bố
  - Đọc báo cáo OWASP Dependency-Check hoặc công cụ tương đương
  - Xác minh định danh gói, phiên bản và điều kiện bị ảnh hưởng
  - Phân biệt lỗ hổng đã biết với khả năng tác động trong ứng dụng cụ thể
  - Tạo và đọc danh mục thành phần phần mềm SBOM
  - Kiểm tra nguồn tải, checksum, chữ ký và nguồn gốc artifact
  - Kiểm tra cấu hình repository, dependency và cơ chế cập nhật
  - Kiểm tra bí mật, quyền và thành phần ngoài trong quy trình build
  - Đánh giá bản vá cùng tương thích chức năng và rủi ro tồn đọng
- level1: Hạ tầng ứng dụng
  level2:
  - Xác định ranh giới trách nhiệm giữa ứng dụng và nền tảng triển khai
  - Kiểm tra image container và các thành phần được đóng gói
  - Kiểm tra người dùng thực thi, quyền hệ thống và tài nguyên được gắn
  - Kiểm tra quyền truy cập mạng và kết nối ra ngoài theo nhu cầu
  - Kiểm tra cấu hình bí mật và danh tính dịch vụ
  - Kiểm tra quyền kho đối tượng, database và dịch vụ được quản lý
  - Kiểm tra khả năng truy cập endpoint nội bộ từ vùng không tin cậy
  - Đánh giá quyền và cấu hình nền tảng bằng bằng chứng phù hợp phạm vi
  - Đối chiếu cấu hình hạ tầng với đường truy cập thực tế tới ứng dụng
- level1: Phân tích tĩnh
  level2:
  - Vai trò của SAST trong phát hiện mẫu mã không an toàn
  - Chuẩn bị phạm vi mã nguồn, cấu hình và phiên bản công cụ
  - Chọn quy tắc theo ngôn ngữ, framework và rủi ro
  - Đọc luồng dữ liệu từ nguồn đầu vào tới điểm sử dụng nhạy cảm
  - Xác minh cảnh báo bằng ngữ cảnh và cơ chế bảo vệ đang có
  - Quản lý kết quả dương tính giả và lý do loại trừ
  - Phân tích phạm vi còn thiếu khi mã sinh hoặc thư viện không được quan sát
  - Tích hợp rà soát mã thủ công với kết quả SAST
  - Quản lý tập kết quả cơ sở (baseline) và phát hiện vấn đề mới theo thay đổi
- level1: Phân tích động
  level2:
  - Vai trò của DAST trong kiểm tra ứng dụng đang chạy
  - Phân biệt quan sát thụ động với kiểm tra chủ động
  - Thiết lập mục tiêu, phạm vi và giới hạn theo kế hoạch kiểm thử
  - Thiết lập xác thực, phiên và tài khoản theo vai trò
  - Khám phá luồng ứng dụng bằng trình duyệt, request hoặc đặc tả API
  - Sử dụng ZAP để thu thập và đánh giá cảnh báo
  - Thiết kế kế hoạch tự động hóa ZAP theo môi trường được chuẩn bị
  - Kiểm tra độ bao phủ endpoint và trạng thái đăng nhập trong lần quét
  - Xác minh cảnh báo bằng bằng chứng có thể tái hiện
  - Phân biệt lỗi công cụ, lỗi kết nối và phát hiện bảo mật
  - Đánh giá phạm vi quan sát bổ sung của IAST khi hệ thống hỗ trợ
- level1: Kiểm thử Java tự động
  level2:
  - Chọn tầng đơn vị, lớp web, tích hợp hoặc HTTP thật theo mục tiêu
  - Tổ chức JUnit và dependency kiểm thử phù hợp phiên bản dự án
  - Thiết lập spring-security-test cho ứng dụng Spring Security
  - Sử dụng WithMockUser hoặc ngữ cảnh bảo mật kiểm soát được
  - Kiểm tra quyền theo vai trò bằng kiểm thử tham số hóa
  - Kiểm tra method security và đường gọi có áp dụng cơ chế bảo vệ
  - Kiểm tra request có hoặc không có CSRF token
  - Kiểm tra JWT hoặc OAuth với dữ liệu xác thực phù hợp phạm vi
  - Phân biệt giả lập principal với kiểm chứng quá trình xác thực thật
  - Kiểm tra cấu hình filter, header và hành vi từ chối truy cập
  - Bổ sung hồi quy cho bản sửa bằng ca từng không đạt
- level1: Thủ công và fuzzing
  level2:
  - Lập giả thuyết kiểm thử từ mô hình đe dọa và hành vi quan sát
  - Sử dụng proxy chặn bắt để xem và điều chỉnh request trong môi trường thử
  - Thiết kế kiểm tra thủ công cho phân quyền và logic nghiệp vụ
  - Kết hợp nhiều phát hiện để đánh giá tác động trong phạm vi cho phép
  - Phân biệt kiểm chứng lỗ hổng với thay đổi dữ liệu không cần thiết
  - Chọn đầu vào, cấu trúc và giới hạn tài nguyên cho fuzzing
  - Thiết kế điều kiện phát hiện lỗi, sập tiến trình hoặc vi phạm thuộc tính
  - Dùng dữ liệu sinh có kiểm soát và lưu seed để tái hiện
  - Thu nhỏ đầu vào gây lỗi và xác minh nguyên nhân
  - Quản lý thời gian, kết quả và khả năng dọn trạng thái sau kiểm thử
- level1: Nhật ký và phát hiện
  level2:
  - Xác định sự kiện bảo mật cần được ghi nhận
  - Kiểm tra log đăng nhập, từ chối quyền và thay đổi dữ liệu nhạy cảm
  - Kiểm tra định danh tác nhân, tài nguyên và request trong dấu vết
  - Kiểm tra che mật khẩu, token, khóa và dữ liệu cá nhân
  - Kiểm tra log injection và tính toàn vẹn của dữ liệu ghi nhận
  - Kiểm tra quyền đọc, sửa và thời hạn lưu log
  - Kiểm tra cảnh báo cho điều kiện lạm dụng được mô phỏng
  - Liên kết log, chỉ số và trace để phân tích kết quả
  - Đánh giá sự khác biệt giữa cơ chế ngăn chặn và cơ chế phát hiện
- level1: Phân loại phát hiện
  level2:
  - Phân biệt cảnh báo công cụ, lỗ hổng xác nhận và quan sát cấu hình
  - Xác minh điều kiện cần để vấn đề có thể tác động
  - Liên kết điểm yếu với CWE và lỗ hổng đã công bố với CVE khi phù hợp
  - Đánh giá mức nghiêm trọng bằng CVSS theo phiên bản được sử dụng
  - Ghi vector và giả định khi công bố điểm CVSS
  - Phân biệt mức nghiêm trọng kỹ thuật với mức ưu tiên xử lý nghiệp vụ
  - Đánh giá mức phơi lộ, dữ liệu ảnh hưởng và cơ chế giảm thiểu hiện có
  - Loại trùng kết quả cùng nguyên nhân hoặc cùng thành phần
  - Ghi mức chắc chắn, giới hạn bằng chứng và phần chưa kiểm chứng
  - Thống nhất người chịu trách nhiệm, thời hạn và cách theo dõi
- level1: Xác minh bản sửa
  level2:
  - Chuyển nguyên nhân đã xác nhận thành yêu cầu sửa có thể kiểm chứng
  - Kiểm tra lại ca từng chứng minh vấn đề
  - Kiểm tra đường truy cập và biểu diễn dữ liệu tương đương
  - Kiểm tra biện pháp sửa tại đúng ranh giới tin cậy
  - Kiểm tra ca hợp lệ để phát hiện ảnh hưởng tới chức năng
  - Đánh giá biến thể có cùng nguyên nhân và phạm vi bị ảnh hưởng
  - Xác minh bản vá hoặc cấu hình đã có trong artifact được triển khai
  - Đóng phát hiện bằng bằng chứng và lưu ca hồi quy
  - Theo dõi ngoại lệ, biện pháp tạm thời và rủi ro còn lại
- level1: CI/CD
  level2:
  - Phân bổ kiểm tra bí mật, SAST, SCA và kiểm thử bảo mật theo giai đoạn
  - Chạy kiểm tra nhanh trên thay đổi và kiểm tra rộng theo lịch
  - Chuẩn bị môi trường cùng tài khoản riêng cho DAST
  - Cố định phiên bản công cụ, bộ quy tắc và nguồn dữ liệu cần thiết
  - Đặt tiêu chí chất lượng theo mức rủi ro và trạng thái xác minh
  - Phân biệt phát hiện mới với vấn đề đã có trong tập kết quả cơ sở
  - Quản lý ngoại lệ có lý do, người phụ trách và thời hạn
  - Bảo vệ credential, log, báo cáo và artifact của pipeline
  - Thu thập mã thoát, bằng chứng và thông tin phiên bản
  - Thiết kế chạy lại, dọn dẹp và xử lý khi công cụ không sẵn sàng
- level1: Báo cáo và duy trì
  level2:
  - Viết báo cáo với tài sản, điều kiện, bằng chứng và tác động
  - Trình bày kết quả mong đợi, kết quả thực tế và cách tái hiện
  - Liên kết phát hiện với yêu cầu bảo mật và nhóm rủi ro
  - Đề xuất hướng khắc phục gắn với nguyên nhân
  - Che thông tin nhạy cảm khi chia sẻ bằng chứng
  - Tổng hợp phạm vi đã kiểm tra và phần chưa đủ bằng chứng
  - Theo dõi độ bao phủ, thời gian xử lý và lỗi tái phát
  - Cập nhật bộ ca theo thay đổi ứng dụng, tiêu chuẩn và thư viện
  - Rút kinh nghiệm từ sự cố và bổ sung kiểm soát phòng ngừa
  - Xác định quyền tiếp cận, thời hạn lưu và vòng đời báo cáo
- level1: Thực hành
  level2:
  - Lập phạm vi và mô hình đe dọa cho một ứng dụng Java thử nghiệm
  - Xây ma trận vai trò, hành động, tài nguyên và khách hàng độc lập
  - Viết kiểm thử xác thực, phân quyền và phiên bằng JUnit
  - Kiểm tra CSRF và CORS theo cách ứng dụng gửi thông tin xác thực
  - Xác minh xử lý đầu vào và truy vấn có tham số trên dữ liệu mẫu
  - Kiểm tra mã hóa đầu ra và nội dung HTML trong ứng dụng thử nghiệm
  - Kiểm tra upload, tải xuống và giới hạn đường dẫn
  - Kiểm tra SSRF hoặc parser XML với dịch vụ thử do nhóm kiểm soát
  - Đánh giá giải tuần tự và cấu hình bảo vệ trong ứng dụng Java
  - Quét thành phần phụ thuộc và xác minh một cảnh báo có ngữ cảnh
  - Thực hiện quan sát thụ động và DAST có giới hạn bằng ZAP
  - Phân tích một lỗi logic nghiệp vụ hoặc truy cập đồng thời
  - Viết báo cáo phát hiện kèm mức nghiêm trọng và hướng khắc phục
  - Xác minh bản sửa và thêm ca hồi quy vào CI
  - Đánh giá khoảng trống cùng giới hạn kết luận của đợt kiểm thử
