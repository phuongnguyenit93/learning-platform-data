  - Xác định kỹ năng chuyên sâu và khả năng đáp ứng của nhóm
  - Lập ngân sách công cụ, hạ tầng và dịch vụ bên ngoài
  - Dành năng lực cho kiểm tra lại, hồi quy và thay đổi đột xuất
  - Điều chỉnh phạm vi theo nguồn lực và công khai rủi ro phát sinh
- level1: Trách nhiệm
  level2:
