  - Thiết kế điểm chặn chất lượng (quality gate) với kết quả rõ ràng và người chịu trách nhiệm
  - Phân biệt tiêu chí chưa đạt với dữ liệu đánh giá chưa có
  - Quản lý ngoại lệ có thời hạn và biện pháp giảm thiểu
  - Xác định quyền chấp nhận rủi ro và quyền quyết định phát hành
  - Rà soát tiêu chí khi mục tiêu hoặc điều kiện sản phẩm thay đổi
