references:
  - title: "Java 21 Files API"
    url: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/nio/file/Files.html"
    description: "API thao tác file, path, luồng đọc và ghi trong Java."
  - title: "Apache Commons CSV User Guide"
    url: "https://commons.apache.org/proper/commons-csv/apidocs/index.html"
    description: "Ví dụ parse và ghi CSV, cấu hình delimiter, header và quote."
  - title: "Jackson Databind"
    url: "https://github.com/FasterXML/jackson-databind"
    description: "Ánh xạ POJO và serialize, deserialize JSON bằng ObjectMapper."
  - title: "Apache POI Spreadsheet"
    url: "https://poi.apache.org/components/spreadsheet/"
    description: "Đọc/ghi Excel XLSX, hỗ trợ streaming và giới hạn bộ nhớ."
  - title: "OWASP CSV Injection"
    url: "https://owasp.org/www-community/attacks/CSV_Injection"
    description: "Rủi ro công thức trong CSV và lưu ý khi xuất dữ liệu không tin cậy."