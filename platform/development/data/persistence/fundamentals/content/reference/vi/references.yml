references:
  - title: "PostgreSQL Tutorial – SQL and Relational Concepts"
    url: "https://www.postgresql.org/docs/current/tutorial.html"
    description: "Giới thiệu dữ liệu quan hệ, bảng, khóa ngoại, truy vấn và thao tác cập nhật."
  - title: "MongoDB – Data Modeling"
    url: "https://www.mongodb.com/docs/manual/data-modeling/"
    description: "Tổ chức dữ liệu dạng tài liệu và lựa chọn mô hình theo cách truy cập."
  - title: "PostgreSQL – Transactions"
    url: "https://www.postgresql.org/docs/current/tutorial-transactions.html"
    description: "Khái niệm giao dịch, tính nguyên tử và commit/rollback."
  - title: "PostgreSQL – Indexes"
    url: "https://www.postgresql.org/docs/current/indexes.html"
    description: "Khái niệm chỉ mục và đánh đổi giữa hiệu năng đọc với chi phí lưu/ghi."
  - title: "PostgreSQL – Backup and Restore"
    url: "https://www.postgresql.org/docs/current/backup.html"
    description: "Các cơ chế sao lưu, phục hồi và khôi phục theo thời điểm."
  - title: "Redis – Persistence"
    url: "https://redis.io/docs/latest/management/persistence/"
    description: "So sánh snapshot (RDB), append-only log (AOF) và độ bền dữ liệu."
  - title: "Spring Data Commons – Repositories"
    url: "https://docs.spring.io/spring-data/commons/reference/repositories.html"
    description: "Nguyên lý tầng Repository tách truy cập kho dữ liệu khỏi logic ứng dụng."
  - title: "Oracle Java Tutorials – JDBC Basics"
    url: "https://docs.oracle.com/javase/tutorial/jdbc/basics/"
    description: "Khái niệm kết nối, truy vấn, giao dịch và xử lý lỗi khi truy cập cơ sở dữ liệu từ Java; tài liệu ví dụ JDK 8."