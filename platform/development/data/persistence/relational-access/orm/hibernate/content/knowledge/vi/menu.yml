menu:
- level1: Nền tảng
  level2:
  - Hibernate ORM là gì và giải quyết độ lệch giữa đối tượng Java với dữ liệu quan hệ như thế nào
  - Phân biệt JDBC, ORM, Jakarta Persistence và Hibernate
  - Hibernate dưới vai trò bộ triển khai đặc tả và các khả năng mở rộng riêng
  - Phân biệt Hibernate ORM với Hibernate Validator, Search và Reactive
  - Mối liên hệ giữa lớp, đối tượng, bảng, hàng, khóa và giao dịch
  - Những việc ORM tự động hóa và những quyết định ứng dụng vẫn phải chịu trách nhiệm
  - Khi nào truy cập qua ORM phù hợp và khi nào cần SQL hoặc JDBC trực tiếp
  - Lộ trình học với ví dụ khách hàng, đơn hàng, dòng hàng và sản phẩm
- level1: Kiến trúc Hibernate
  level2:
  - SessionFactory, Session và Transaction trong toàn bộ vòng đời truy cập dữ liệu
  - Quan hệ giữa EntityManagerFactory với SessionFactory và EntityManager với Session
  - Persistence Context, bộ nhớ đệm cấp một và cơ chế giữ danh tính đối tượng
  - Siêu dữ liệu ánh xạ, bộ mô tả kiểu và Dialect
  - Từ thao tác đối tượng đến hàng đợi hành động và SQL gửi qua JDBC
  - Từ HQL đến mô hình truy vấn ngữ nghĩa, kế hoạch truy vấn và SQL
  - Vai trò của DataSource, bộ kết nối và JDBC driver
  - Ranh giới giữa API công khai, SPI mở rộng và chi tiết nội bộ không nên phụ thuộc
- level1: Khởi tạo và cấu hình
  level2:
  - Chọn bộ phiên bản tương thích giữa Java, Hibernate, Jakarta Persistence và JDBC driver
  - Khởi tạo gốc với registry dịch vụ, metadata và SessionFactory
  - Khởi tạo qua Jakarta Persistence với persistence unit
  - Cấu hình bằng thuộc tính, tệp cấu hình và môi trường triển khai
  - Đăng ký thực thể, package và các nguồn siêu dữ liệu
  - Lựa chọn Dialect và kiểm tra hỗ trợ của hệ quản trị
  - Kết nối qua DataSource và bộ kết nối dùng chung
  - Cấu hình tên logic, tên vật lý, schema và catalog
  - Cấu hình múi giờ JDBC, hiển thị SQL và thống kê
  - Quản lý thông tin xác thực, đóng tài nguyên và lỗi trong giai đoạn khởi động
- level1: Session và tài nguyên
  level2:
  - Phạm vi sử dụng và khả năng chia sẻ SessionFactory
  - Session không an toàn để dùng đồng thời và cách chọn phạm vi tồn tại
  - Mở, sử dụng và đóng Session khi giao dịch thành công hoặc thất bại
  - Phân biệt vòng đời Session, giao dịch và kết nối JDBC
  - Kết nối được lấy hoặc trả vào thời điểm nào theo cấu hình
  - Session theo yêu cầu, theo giao dịch hoặc theo tác vụ xử lý lô
  - Session hiện tại và cơ chế liên kết với ngữ cảnh thực thi
  - Không truyền Session hoặc thực thể đang quản lý sang luồng khác tùy tiện
  - Nguyên tắc bỏ Session đã lỗi và tạo ranh giới xử lý mới
- level1: Ánh xạ thực thể
  level2:
  - Điều kiện để một lớp Java trở thành thực thể được Hibernate quản lý
  - '@Entity, @Table và sự khác nhau giữa tên thực thể với tên bảng'
  - Chiến lược truy cập qua trường hoặc thuộc tính
  - '@Column, tên cột và các tùy chọn ánh xạ cơ bản'
  - Thuộc tính không lưu bằng @Transient và từ khóa transient của Java
  - Constructor, tính khả kiến và tác động của lớp hoặc phương thức final
  - Record, lớp bất biến và lựa chọn phù hợp cho thực thể hoặc dữ liệu chiếu
  - Ánh xạ nhiều bảng cho một thực thể bằng bảng phụ
  - Thuộc tính do cơ sở dữ liệu sinh và thời điểm đọc lại
  - Phân biệt metadata phục vụ sinh DDL với kiểm tra dữ liệu lúc chạy
- level1: Kiểu dữ liệu
  level2:
  - Ánh xạ kiểu Java, kiểu JDBC và kiểu cột của hệ quản trị
  - Chuỗi, số, boolean, dữ liệu nhị phân và đối tượng lớn
  - BigDecimal, precision, scale và độ chính xác của tiền tệ
  - Instant, LocalDate, LocalDateTime, OffsetDateTime và chính sách múi giờ
  - Enum theo tên hoặc giá trị tùy chỉnh và nguy cơ dùng thứ tự ordinal
  - AttributeConverter cho đối tượng giá trị và giới hạn áp dụng
  - '@JdbcTypeCode cùng cơ chế chỉ định cách biểu diễn JDBC'
  - Ánh xạ JSON, mảng hoặc kiểu đặc thù theo phiên bản và Dialect
  - Kiểu tùy chỉnh với UserType hoặc SPI kiểu dữ liệu khi converter chưa đủ
  - Tính có thể thay đổi của giá trị và ảnh hưởng đến sao chép với kiểm tra thay đổi
  - Null, giá trị mặc định và giá trị do cơ sở dữ liệu tính
- level1: Định danh
  level2:
  - Khóa thực thể, định danh Java và khóa chính trong cơ sở dữ liệu
  - Định danh do ứng dụng gán hoặc do hệ thống sinh
  - So sánh chiến lược IDENTITY, SEQUENCE, TABLE và AUTO
  - Bộ sinh UUID và các lựa chọn định danh phù hợp với phiên bản sử dụng
  - Sequence, kích thước cấp phát và nguy cơ lệch cấu hình với cơ sở dữ liệu
  - Khóa ghép bằng @EmbeddedId hoặc @IdClass
  - Định danh phụ thuộc và @MapsId
  - Khóa tự nhiên với @NaturalId và truy vấn theo khóa nghiệp vụ
  - Tính bất biến của định danh sau khi đối tượng được quản lý
  - Thời điểm có định danh và ảnh hưởng đến batching hoặc equals
  - Định danh trong mô hình nhiều tổ chức và phạm vi duy nhất
- level1: Giá trị và tập hợp
  level2:
  - '@Embeddable và @Embedded cho đối tượng giá trị'
  - Ghi đè tên cột khi nhúng cùng một kiểu ở nhiều vị trí
  - Giá trị nhúng nhiều tầng và cách xử lý null
  - '@ElementCollection cho tập hợp giá trị không có danh tính thực thể riêng'
  - Collection table, cột liên kết và vòng đời dữ liệu thành phần
  - List, Set, Map và bag khác nhau về ngữ nghĩa ánh xạ
  - '@OrderBy khác với @OrderColumn'
  - Khóa ánh xạ, giá trị ánh xạ và tập hợp đối tượng nhúng
  - Thay đổi tập hợp và SQL cập nhật hoặc xóa được sinh
  - Tập hợp lớn và dấu hiệu cần mô hình hóa thành thực thể riêng
- level1: Quan hệ đơn trị
  level2:
  - '@ManyToOne, khóa ngoại và phía quản lý liên kết'
  - '@OneToOne với khóa ngoại duy nhất hoặc khóa chính dùng chung'
  - Quan hệ một chiều, hai chiều và ý nghĩa của mappedBy
  - Quan hệ tùy chọn và sự khác nhau giữa optional với nullable
  - Tham chiếu trì hoãn và điều kiện để tránh tải thực thể ngay
  - Khóa ngoại thiếu, dữ liệu không nhất quán và cách xử lý lỗi
  - '@JoinColumn, @JoinColumns và tham chiếu khóa ghép'
  - Đồng bộ hai phía quan hệ bằng phương thức nghiệp vụ
  - Phân biệt phía quản lý liên kết với chủ sở hữu vòng đời nghiệp vụ
- level1: Quan hệ đa trị
  level2:
  - '@OneToMany hai chiều và vai trò khóa ngoại ở phía nhiều'
  - '@OneToMany một chiều và các phương án bảng liên kết hoặc cột liên kết'
  - '@ManyToMany và cấu trúc bảng liên kết'
  - Thực thể liên kết khi quan hệ có thuộc tính hoặc quy tắc riêng
  - Chọn Set, List hoặc Map theo ý nghĩa nghiệp vụ
  - Thêm, xóa và thay thế phần tử trên tập hợp đang được quản lý
  - Đồng bộ hai phía mà không tạo vòng gọi hoặc cập nhật thừa
  - Sắp xếp, thứ tự lưu và chi phí cập nhật vị trí
  - Quan hệ tự tham chiếu và mô hình cha con
  - Giới hạn đồ thị đối tượng và tránh tải toàn bộ tập hợp không cần thiết
- level1: Kế thừa
  level2:
  - '@MappedSuperclass và phần ánh xạ dùng chung'
  - Kế thừa thực thể với SINGLE_TABLE
  - Kế thừa thực thể với JOINED
  - Kế thừa thực thể với TABLE_PER_CLASS
  - Cột phân loại và giá trị phân loại kiểu con
  - Truy vấn đa hình và các bảng hoặc phép nối được sử dụng
  - Ảnh hưởng đến khóa, ràng buộc và thuộc tính bắt buộc
  - Chi phí truy vấn khi số kiểu con hoặc độ sâu kế thừa tăng
  - Chọn kết hợp đối tượng thay vì kế thừa khi quan hệ nghiệp vụ không phù hợp
- level1: Ánh xạ nâng cao
  level2:
  - Thuộc tính tính bằng biểu thức SQL với @Formula
  - Biểu thức đọc hoặc ghi cột với @ColumnTransformer
  - Ánh xạ mô hình đọc qua @Subselect và khai báo đồng bộ bằng @Synchronize
  - '@Immutable cho thực thể hoặc tập hợp và giới hạn bảo đảm'
  - Tùy chỉnh SQL insert, update hoặc delete và trách nhiệm giữ đúng trạng thái
  - Ánh xạ liên kết không theo khóa chính với điều kiện duy nhất rõ ràng
  - Quan hệ đa hình bằng @Any và giới hạn bảo toàn tham chiếu
  - Ánh xạ lược đồ có sẵn với tên đặc biệt, kiểu cột cũ hoặc cấu trúc bất thường
  - Chọn ánh xạ chỉ đọc thay vì cố biến mọi nguồn dữ liệu thành thực thể có thể sửa
  - Đánh giá khả năng di chuyển và kiểm thử SQL của mỗi phần mở rộng
- level1: Danh tính đối tượng
  level2:
  - Phân biệt cùng tham chiếu Java, cùng định danh lưu trữ và cùng giá trị nghiệp vụ
  - Chọn thuộc tính cho equals và hashCode của thực thể
  - Định danh chưa được sinh và tính ổn định của hashCode
  - Khóa tự nhiên bất biến như một tiêu chí so sánh khi phù hợp
  - Proxy, kế thừa và nguy cơ so sánh kiểu thực thể không đúng
  - Thực thể trong HashSet hoặc làm khóa HashMap khi thuộc tính bị thay đổi
  - So sánh các đối tượng thuộc nhiều Session khác nhau
  - Giới hạn của equals, hashCode hoặc toString được sinh tự động trên quan hệ
  - Kiểm thử tính đối xứng, bắc cầu và hành vi trước với sau khi lưu
- level1: Vòng đời thực thể
  level2:
  - Các trạng thái transient, managed, detached và removed
  - persist và quá trình đưa thực thể mới vào Persistence Context
  - Tải thực thể theo định danh và lấy tham chiếu trì hoãn
  - Thay đổi thuộc tính của thực thể đang được quản lý
  - merge và sự khác nhau giữa đối tượng truyền vào với kết quả được quản lý
  - remove và điều kiện để xóa thực thể
  - detach, clear và việc chấm dứt quản lý trạng thái
  - refresh để đọc lại dữ liệu từ cơ sở dữ liệu
  - Phân biệt persist, merge và cập nhật dữ liệu trực tiếp bằng truy vấn
  - Lỗi thực thể detached được đưa vào thao tác không phù hợp
  - Rà soát vòng đời qua SQL, định danh và trạng thái Session
- level1: Persistence Context
  level2:
  - Một thực thể theo một định danh trong cùng Persistence Context
  - Bộ nhớ đệm cấp một và việc đọc lại không nhất thiết phát SQL mới
  - Dữ liệu đang quản lý có thể khác với dữ liệu vừa đổi bên ngoài Session
  - Tải đối tượng, lưu ảnh trạng thái và theo dõi thay đổi
  - contains, detach, clear và phạm vi ảnh hưởng
  - Đồ thị đối tượng, tập hợp được quản lý và tham chiếu tới proxy
  - Chế độ chỉ đọc và những thay đổi thực sự được bỏ theo dõi
  - Session tồn tại lâu, bộ nhớ tăng và dữ liệu bị cũ
  - Phân biệt làm mới, xóa khỏi context và làm rỗng bộ nhớ đệm cấp hai
  - Ranh giới context trong xử lý theo lô và nhiều giao dịch
- level1: Dirty Checking và Flush
  level2:
  - Dirty checking phát hiện thay đổi thuộc tính như thế nào
  - So sánh ảnh trạng thái với theo dõi thay đổi bằng bytecode enhancement
  - Flush chuyển các thay đổi đang chờ thành SQL
  - Flush khác với commit và không tự kết thúc giao dịch
  - Thời điểm flush trước truy vấn hoặc khi kết thúc giao dịch
  - FlushMode và các chế độ hỗ trợ theo API Hibernate hoặc Jakarta Persistence
  - Hàng đợi hành động và thứ tự insert, update, delete
  - Ràng buộc cơ sở dữ liệu khiến thứ tự SQL trở nên quan trọng
  - '@DynamicInsert, @DynamicUpdate và đánh đổi với khả năng tái sử dụng câu lệnh'
  - Trường sinh tự động, giá trị mặc định và thời điểm đồng bộ trở lại
  - Tránh gọi flush hoặc clear theo thói quen khi chưa rõ mục đích
- level1: Giao dịch
  level2:
  - Giao dịch nghiệp vụ, giao dịch Hibernate và giao dịch cơ sở dữ liệu
  - Bắt đầu, commit, rollback và xử lý lỗi đúng ranh giới
  - Giao dịch resource-local và tích hợp JTA
  - Auto-commit JDBC và lý do phải xác định ranh giới giao dịch rõ ràng
  - Phân biệt mức cô lập của cơ sở dữ liệu với cơ chế quản lý trạng thái của ORM
  - Đọc lặp lại trong context không đồng nghĩa với mọi bảo đảm cô lập ở cơ sở dữ liệu
  - Timeout, trạng thái chỉ được rollback và lỗi xuất hiện tại commit
  - Ảnh hưởng của giao dịch dài đến khóa, kết nối và phiên bản dữ liệu
  - Đặt ranh giới giao dịch tại thao tác nghiệp vụ nhiều bước
  - Không tái sử dụng Session đã lỗi để tiếp tục xử lý ngoài kiểm soát
- level1: Khóa và đồng thời
  level2:
  - Mất cập nhật, đọc dữ liệu cũ và điều kiện tranh chấp
  - '@Version cho kiểm soát khóa lạc quan'
  - SQL kiểm tra phiên bản và kết quả khi bản ghi đã bị sửa
  - Khóa lạc quan với yêu cầu tăng phiên bản chủ động
  - Khóa bi quan khi tải hoặc truy vấn thực thể
  - Timeout khóa, deadlock và xử lý thất bại có giới hạn
  - Chế độ khóa Hibernate và ánh xạ sang khả năng của Dialect
  - Khóa trên thực thể, quan hệ và phạm vi bảo vệ thực tế
  - Khóa lạc quan không dùng cột phiên bản và giới hạn của các cơ chế mở rộng
  - Retry toàn thao tác nghiệp vụ bằng context mới khi phù hợp
  - Bất biến giữa nhiều hàng và vai trò của ràng buộc cơ sở dữ liệu
- level1: Cascade và xóa
  level2:
  - Cascade truyền thao tác vòng đời khác với tải dữ liệu liên quan
  - PERSIST, MERGE, REMOVE, REFRESH, DETACH và ý nghĩa của ALL
  - Cascade từ gốc aggregate theo quyền sở hữu nghiệp vụ
  - orphanRemoval khi phần tử không còn thuộc quan hệ
  - Phân biệt bỏ liên kết, xóa phần tử con và xóa thực thể cha
  - Rủi ro truyền REMOVE qua quan hệ nhiều với nhiều
  - Cascade ở ORM khác với ON DELETE CASCADE ở cơ sở dữ liệu
  - Thứ tự xóa, khóa ngoại và dữ liệu cần giữ lịch sử
  - Xóa bằng truy vấn hàng loạt không giống xóa từng thực thể
  - Kiểm chứng tác động xóa bằng số hàng và SQL thực tế
- level1: Tải dữ liệu
  level2:
  - Thời điểm tải khác với cách Hibernate lấy dữ liệu
  - LAZY và EAGER không mặc nhiên xác định số câu SQL
  - Tải bằng select, join, batch hoặc subselect
  - N+1 trong quan hệ đơn trị lẫn đa trị
  - JOIN FETCH theo từng tình huống sử dụng
  - Entity graph và fetch profile để định nghĩa dữ liệu cần tải
  - '@BatchSize và cấu hình kích thước tải nhóm'
  - FetchMode.SUBSELECT và các điều kiện cần kiểm chứng
  - Tải nhiều tập hợp, tích Descartes và giới hạn của bag
  - Phân trang cùng collection fetch join và nguy cơ xử lý trong bộ nhớ
  - Chọn DTO projection khi chỉ cần dữ liệu đọc
  - Kiểm tra số truy vấn, số hàng và kích thước kết quả thay vì chỉ nhìn annotation
- level1: Proxy và tăng cường
  level2:
  - Proxy biểu diễn tham chiếu chưa được khởi tạo
  - Thời điểm truy cập thuộc tính gây tải dữ liệu
  - LazyInitializationException và ranh giới context đã đóng
  - Nhận diện trạng thái tải và khởi tạo có chủ đích
