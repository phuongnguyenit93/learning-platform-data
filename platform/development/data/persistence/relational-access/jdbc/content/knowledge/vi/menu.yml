  - Làm việc với Struct và kiểu dữ liệu có cấu trúc
  - Vai trò của SQLData, SQLInput và SQLOutput
  - Ánh xạ kiểu tùy chỉnh qua type map của Connection
  - Hiểu vai trò của Ref và RowId khi hệ quản trị hỗ trợ
  - Xử lý UUID, JSON và các kiểu riêng qua cơ chế của driver
  - Phân biệt kiểu chuẩn JDBC và lớp đối tượng do driver trả về
  - Kiểm tra hỗ trợ trước khi dùng cấu trúc lồng hoặc kiểu đặc thù
  - Thiết kế lớp chuyển đổi để cô lập phụ thuộc nhà cung cấp
