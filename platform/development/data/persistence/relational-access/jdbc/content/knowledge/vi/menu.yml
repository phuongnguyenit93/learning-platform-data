  - Đọc dữ liệu lớn mà không nạp toàn bộ vào bộ nhớ
  - Xử lý độ dài được khai báo và độ dài chưa biết trước
  - Quản lý vòng đời locator LOB và kết nối liên quan
  - Sử dụng free để giải phóng tài nguyên LOB khi phù hợp
  - Xử lý lỗi giữa chừng trong lúc truyền dữ liệu
  - Kiểm tra giới hạn kích thước và chuyển đổi bảng mã
  - Phối hợp dữ liệu lớn với giao dịch và thời gian giữ kết nối
