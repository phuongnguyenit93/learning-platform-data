  - Phân biệt độ dài ký tự và kích thước byte của cột
  - Xử lý khoảng trắng, giá trị bị cắt và cảnh báo chuyển đổi
  - Đánh giá ảnh hưởng của collation tới so sánh và sắp xếp
  - Bảo toàn định danh dạng chuỗi có số 0 đầu
- level1: Ngày giờ và múi giờ
  level2:
