  - Ảnh hưởng của múi giờ JVM, phiên kết nối và máy chủ
  - Xử lý chuyển đổi qua Calendar khi cần tương thích API cũ
  - Kiểm tra độ chính xác phần giây và mất dữ liệu khi làm tròn
  - Kiểm thử thời điểm chuyển giờ mùa hè và ranh giới ngày
  - Thiết kế quy ước lưu và truy vấn thời gian nhất quán
