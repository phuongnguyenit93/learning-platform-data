  - Cập nhật hàng qua ResultSet có khả năng cập nhật
  - Thêm, xóa và làm mới hàng qua API ResultSet
  - Kiểm tra điều kiện để tập kết quả được phép cập nhật
  - Phân biệt cập nhật ResultSet và câu SQL cập nhật tường minh
  - Quản lý tập kết quả khi commit qua holdability
  - Xác minh cấu hình yêu cầu và cấu hình thực tế được cấp
- level1: RowSet ngoại tuyến
  level2:
