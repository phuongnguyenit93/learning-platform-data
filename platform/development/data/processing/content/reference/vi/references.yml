references:
  - title: "The Stream API – Dev.java"
    url: "https://dev.java/learn/api/collections-and-streams/streams/"
    description: "Hướng dẫn Java Stream: map, filter, reduce, collect và parallel streams."
  - title: "java.util.stream – Java SE 21"
    url: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/stream/package-summary.html"
    description: "API chuẩn của Java cho pipeline, phép biến đổi và tổng hợp dữ liệu."
  - title: "Spring Batch Reference"
    url: "https://docs.spring.io/spring-batch/reference/index.html"
    description: "Job, step, chunk, retry, mở rộng và kiểm thử xử lý theo lô."
  - title: "Apache Beam Programming Guide"
    url: "https://beam.apache.org/documentation/programming-guide/"
    description: "Pipeline, transform, gom nhóm, windowing và state cho batch/stream."
  - title: "Kafka Streams Developer Guide"
    url: "https://kafka.apache.org/44/streams/developer-guide/"
    description: "Xây dựng và kiểm thử pipeline sự kiện, state, window và topology."
  - title: "java.util.concurrent – Java SE 21"
    url: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/package-summary.html"
    description: "Các công cụ xử lý đồng thời và cấu trúc dữ liệu an toàn khi song song."