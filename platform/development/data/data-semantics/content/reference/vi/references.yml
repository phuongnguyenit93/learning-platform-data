references:
  - title: "W3C — Data on the Web Best Practices"
    url: "https://www.w3.org/TR/dwbp/"
    description: "Thực hành xuất bản và sử dụng dữ liệu dễ hiểu, có metadata và tái sử dụng được."
  - title: "W3C — RDF 1.1 Concepts and Abstract Syntax"
    url: "https://www.w3.org/TR/rdf11-concepts/"
    description: "Khái niệm tài nguyên, thuộc tính và quan hệ để biểu diễn thông tin có ngữ nghĩa."
  - title: "W3C — SKOS Simple Knowledge Organization System Reference"
    url: "https://www.w3.org/TR/skos-reference/"
    description: "Khái niệm, nhãn, từ đồng nghĩa và quan hệ giữa các thuật ngữ trong từ vựng chung."
  - title: "DCMI — DCMI Metadata Terms"
    url: "https://www.dublincore.org/specifications/dublin-core/dcmi-terms/"
    description: "Bộ thuật ngữ metadata chuẩn để mô tả và trao đổi ý nghĩa của dữ liệu."
  - title: "W3C — Shapes Constraint Language (SHACL)"
    url: "https://www.w3.org/TR/shacl/"
    description: "Ngôn ngữ mô tả và kiểm chứng các ràng buộc đối với dữ liệu có cấu trúc ngữ nghĩa."
  - title: "W3C — Time Ontology in OWL"
    url: "https://www.w3.org/TR/owl-time/"
    description: "Khái niệm về thời điểm, khoảng thời gian, quan hệ thời gian và thời lượng."