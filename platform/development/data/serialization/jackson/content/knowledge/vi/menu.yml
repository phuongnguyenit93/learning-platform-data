  - Giữ serializer dùng chung không chứa trạng thái thay đổi theo yêu cầu
  - Kiểm thử cấu trúc, kiểu và khả năng đọc lại kết quả
- level1: Deserializer tùy biến
  level2:
  - Khi nào cần deserializer riêng thay vì chuyển kiểu mặc định
  - Đọc dữ liệu từ JsonParser với kiểm tra loại token
  - Đọc một vùng dữ liệu thành cây để xử lý cục bộ
  - Thiết kế deserializer cho kiểu giá trị có nhiều cách biểu diễn
  - Đăng ký deserializer bằng JsonDeserialize theo kiểu hoặc thuộc tính
  - Phân biệt xử lý null, giá trị thiếu và dữ liệu sai kiểu
  - Tạo deserializer theo ngữ cảnh thuộc tính hoặc kiểu tổng quát
  - Tùy biến cách đọc khóa Map
  - Báo lỗi theo ngữ cảnh thay vì âm thầm dùng giá trị mặc định
  - Tránh gọi lại chính deserializer gây đệ quy vô hạn
  - Bảo toàn bất biến và giới hạn dữ liệu khi tạo đối tượng
- level1: Module và mix-in
  level2:
  - Đóng gói serializer và deserializer bằng SimpleModule
  - Quản lý tên, phiên bản và thứ tự đăng ký module
  - Phân biệt đăng ký tường minh và tự phát hiện module
  - Vai trò của module hỗ trợ Optional và kiểu dữ liệu Java bổ sung
  - Vai trò của module hỗ trợ tên tham số constructor
  - Áp dụng annotation cho lớp không sửa được bằng mix-in
  - Xác định phạm vi mix-in để không làm thay đổi nơi dùng khác
  - Giải quyết xung đột giữa module, annotation và cấu hình
  - Đánh giá phần mở rộng mức thấp như bộ sửa serializer và deserializer
  - Thiết kế module có thể kiểm thử độc lập với ứng dụng
- level1: Chuyển đổi và cập nhật
  level2:
  - Chuyển giữa POJO, Map và cây JSON bằng convertValue
  - Phân biệt chuyển giá trị trong bộ nhớ và đọc một tài liệu JSON
  - Chuyển cây sang đối tượng bằng treeToValue
  - Chuyển đối tượng thành cây bằng valueToTree
  - Đọc cập nhật lên đối tượng có sẵn bằng readerForUpdating
  - Phân biệt thay thế giá trị và hợp nhất cấu trúc bằng JsonMerge
  - Xử lý cập nhật thuộc tính vắng mặt, null và đối tượng lồng
  - Đánh giá cách cập nhật collection, Map và đối tượng bất biến
  - Phân biệt cập nhật đối tượng và giao thức JSON Patch hoặc Merge Patch
  - Tránh dùng chuyển đổi như một bảo đảm sao chép sâu hoặc kiểm tra nghiệp vụ
  - Kiểm thử ảnh hưởng của annotation và cấu hình lên phép chuyển đổi
- level1: Lỗi và chẩn đoán
  level2:
  - Phân biệt lỗi I/O, lỗi cú pháp và lỗi ánh xạ kiểu
  - Đọc vị trí và đường dẫn thuộc tính trong thông tin lỗi
  - Nhận diện dữ liệu bị cắt dở hoặc token không đúng kỳ vọng
  - Nhận diện lỗi thiếu creator và định nghĩa kiểu không phù hợp
  - Xử lý trường không nhận diện và giá trị enum không hợp lệ
  - Xử lý số vượt giới hạn và kiểu dữ liệu không tương thích
  - Giữ nguyên nguyên nhân gốc khi chuyển lỗi sang lớp ứng dụng
  - Báo lỗi theo trường mà không sao chép toàn bộ dữ liệu nhạy cảm
  - Phân biệt cấu hình sai và dữ liệu đầu vào sai
  - Thiết kế chính sách dừng tài liệu hoặc tách bản ghi lỗi
  - Tránh tiếp tục sử dụng parser sau lỗi khi không xác định được ranh giới
- level1: Hợp đồng dữ liệu
  level2:
  - Xác định cấu trúc JSON công khai độc lập với lớp triển khai
  - Tách kiểm tra cú pháp, ánh xạ kiểu và kiểm tra nghiệp vụ
  - Phân biệt annotation ánh xạ và ràng buộc validation thực tế
  - Phối hợp JSON Schema hoặc Bean Validation khi phù hợp
  - Thêm trường mà vẫn giữ tương thích với bên đọc cũ
  - Đổi tên trường với chiến lược chấp nhận tên cũ
  - Quản lý loại bỏ trường và thay đổi kiểu dữ liệu
  - Quản lý giá trị enum và kiểu con mới
  - Xác định chính sách cho thuộc tính không nhận diện
  - Giữ ý nghĩa của null, thiếu và mặc định qua các phiên bản
  - Phiên bản hóa định dạng thời gian và biểu diễn số
  - Thiết kế dữ liệu mẫu và kiểm thử hợp đồng giữa bên gửi và bên nhận
- level1: Bảo mật đầu vào
  level2:
  - Coi dữ liệu JSON bên ngoài là đầu vào không tin cậy
  - Giới hạn kích thước tài liệu và độ sâu lồng
  - Giới hạn độ dài chuỗi, tên thuộc tính và số
  - Cấu hình StreamReadConstraints và StreamWriteConstraints theo phiên bản
  - Tránh cho dữ liệu ngoài tự do lựa chọn lớp Java để khởi tạo
  - Đánh giá default typing và giới hạn kiểu bằng PolymorphicTypeValidator
  - Kiểm soát creator, setter và mã tùy biến có tác động phụ
  - Từ chối cấu trúc lặp bất thường và tài liệu gây tiêu tốn tài nguyên
  - Thiết kế chính sách xử lý tên thuộc tính trùng
  - Không dùng bỏ qua lỗi ánh xạ như một biện pháp kiểm tra dữ liệu
  - Ngăn lộ bí mật qua thuộc tính tự nhận diện và nhật ký lỗi
  - Theo dõi cập nhật bảo mật cho toàn bộ hệ dependency Jackson
- level1: XML với Jackson
  level2:
  - Vai trò của module XML và XmlMapper
  - Phân biệt mô hình JSON và mô hình phần tử, thuộc tính XML
  - Ánh xạ tên phần tử, thuộc tính và phần tử gốc
  - Quản lý namespace trong dữ liệu XML
  - Ánh xạ collection có hoặc không có phần tử bao
  - Phân biệt phần tử vắng mặt, phần tử rỗng và giá trị null
  - Xử lý văn bản và giới hạn của nội dung XML hỗn hợp
  - Kết hợp annotation Jackson và annotation riêng của module XML
  - Cấu hình bộ phân tích XML để hạn chế tài nguyên và thực thể ngoài
  - Kiểm thử tương thích thay vì giả định đổi mapper giữ nguyên ngữ nghĩa
- level1: YAML và CSV
  level2:
  - Vai trò của module YAML và YAMLMapper
  - Phân biệt kiểu dữ liệu YAML và biểu diễn JSON tương ứng
  - Kiểm tra phiên bản cú pháp và cấu hình parser YAML
  - Giới hạn tài nguyên khi đọc dữ liệu YAML không tin cậy
  - Vai trò của CsvMapper và CsvSchema
  - Khai báo cột, thứ tự và dòng tiêu đề cho CSV
  - Đọc ghi giá trị trống và null theo schema CSV
  - Xử lý dấu phân cách, trích dẫn và trường nhiều dòng
  - Đọc ghi nhiều dòng CSV theo từng bản ghi
  - Giới hạn biểu diễn cấu trúc lồng nhau trong CSV
  - Kiểm thử khả năng nhập lại và tương tác với công cụ bên ngoài
- level1: Định dạng nhị phân
  level2:
  - Vai trò của các module CBOR và Smile
  - Phân biệt cấu trúc dữ liệu và cách mã hóa trên đường truyền
  - Lựa chọn định dạng theo khả năng tương tác và nhu cầu lưu trữ
  - Làm việc với dữ liệu nhị phân mà không mặc định qua chuỗi
  - Kiểm tra hỗ trợ kiểu số và đặc điểm của từng định dạng
  - Khai báo định dạng khi gửi nhận để tránh đọc sai nội dung
  - Đánh giá kích thước, tốc độ và khả năng quan sát dữ liệu
  - Kiểm thử hợp đồng giữa các ngôn ngữ và công cụ khác nhau
- level1: Hiệu năng
  level2:
  - Đo thời gian đọc, ghi và chi phí cấp phát đối tượng
  - Tái sử dụng mapper, reader và writer có cấu hình ổn định
  - Lựa chọn byte array, String, tree hoặc stream theo nhu cầu
  - Tránh chuyển qua nhiều biểu diễn trung gian không cần thiết
  - Đánh giá chi phí phản chiếu, serializer cache và khởi tạo lần đầu
  - Đọc hoặc ghi từng phần cho tập dữ liệu lớn
  - Kiểm soát bộ đệm và số lượng đối tượng sống đồng thời
  - Đánh giá module tăng tốc theo dòng phiên bản và môi trường Java
  - Giữ cấu hình và kiểu dữ liệu đại diện khi đo hiệu năng
  - Phân biệt tối ưu định dạng và tối ưu quá trình truyền dữ liệu
  - Theo dõi ảnh hưởng của giới hạn bảo mật và xử lý lỗi tới hiệu năng
- level1: Kiểm thử Jackson
  level2:
  - Thiết kế dữ liệu mẫu cho đọc và ghi độc lập
  - So sánh cấu trúc JSON thay vì chỉ so sánh chuỗi ký tự
  - Kiểm thử null, thiếu, rỗng và giá trị mặc định
  - Kiểm thử Unicode, ký tự thoát và nội dung nhiều dòng
  - Kiểm thử số lớn, số thập phân và giá trị biên
  - Kiểm thử ngày giờ với nhiều múi giờ và độ chính xác
  - Kiểm thử generic, record và mô hình bất biến
  - Kiểm thử đa hình, chu trình và tham chiếu định danh
  - Kiểm thử serializer, deserializer và module tùy biến
  - Kiểm thử dữ liệu dư, tên trường trùng và cú pháp mở rộng
  - Kiểm thử giới hạn tài nguyên bằng dữ liệu được kiểm soát
  - Kiểm thử tương thích với dữ liệu của phiên bản trước
  - Kiểm thử thuộc tính bảo toàn qua vòng ghi rồi đọc
  - Kiểm thử tài nguyên được đóng khi thành công, hủy và thất bại
- level1: Tích hợp Spring
  level2:
  - Phân biệt mapper tự tạo và mapper do ứng dụng Spring quản lý
  - Vai trò của bộ chuyển đổi thông điệp HTTP dùng Jackson
  - Quản lý module, annotation và cấu hình Jackson trong ứng dụng
  - Tách DTO nhận vào và DTO trả ra theo hợp đồng API
  - Phân biệt lỗi đọc JSON và lỗi Bean Validation
  - Chuẩn hóa phản hồi lỗi ánh xạ mà không lộ cấu trúc nội bộ
  - Kiểm soát định dạng ngày giờ, tên trường và chính sách null
  - Tránh thay đổi mapper dùng chung sau khi bắt đầu phục vụ
  - Kiểm soát entity ORM và quan hệ tải chậm ở biên JSON
  - Thiết kế nhiều chính sách đọc ghi khi các tích hợp có hợp đồng khác nhau
  - Kiểm thử HTTP để xác minh cấu hình thực tế đã được áp dụng
- level1: Vận hành và nâng cấp
  level2:
  - Lưu cấu hình và module đang có hiệu lực để hỗ trợ chẩn đoán
  - Theo dõi tỷ lệ lỗi theo loại tài liệu và phiên bản hợp đồng
  - Theo dõi kích thước đầu vào, độ trễ và mức sử dụng bộ nhớ
  - Bảo vệ thông tin nhạy cảm trong dữ liệu lỗi được lưu mẫu
  - Kiểm kê dependency và phát hiện xung đột phiên bản
  - Đối chiếu thay đổi mặc định trước khi nâng phiên bản
  - Đánh giá đổi API và module khi chuyển dòng phiên bản Jackson
  - Chạy bộ kiểm thử dữ liệu cũ trước khi triển khai cấu hình mới
  - Triển khai có kiểm soát khi thay chính sách chuyển kiểu hoặc giới hạn
  - Xác minh định dạng đầu ra và khả năng đọc của bên nhận sau nâng cấp
- level1: Thực hành tổng hợp
  level2:
  - Thiết kế hợp đồng JSON cho khách hàng, đơn hàng và thanh toán
  - Ánh xạ DTO bất biến có generic và đối tượng lồng nhau
  - Bảo toàn số tiền, thời điểm và mã định danh qua vòng đọc ghi
  - Thiết kế cập nhật có phân biệt thuộc tính thiếu và null
  - Đọc dữ liệu mở rộng bằng cây JSON và giữ trường chưa nhận diện
  - Xử lý tệp JSON lớn theo từng bản ghi với bộ nhớ giới hạn
  - Ghi JSON theo luồng và xử lý lỗi khi đầu ra chưa hoàn tất
  - Thiết kế đa hình bằng tên kiểu nghiệp vụ được phép
  - Viết module cho kiểu giá trị riêng và kiểm thử chuyển đổi hai chiều
  - Giải quyết đồ thị có chu trình bằng DTO hoặc định danh tham chiếu
  - Đọc ghi CSV và XML bằng module tương ứng với hợp đồng tường minh
  - Kiểm thử dữ liệu lỗi, giới hạn tài nguyên và tương thích phiên bản
  - Tích hợp DTO vào ứng dụng Spring và kiểm chứng dữ liệu HTTP
  - Nghiệm thu bằng tính đúng, tính tương thích, bảo mật và hiệu năng
