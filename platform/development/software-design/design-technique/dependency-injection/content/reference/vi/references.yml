references:
  - title: "Martin Fowler — Inversion of Control Containers and Dependency Injection"
    url: "https://martinfowler.com/articles/injection.html"
    description: "Giải thích IoC, các hình thức DI, composition và điểm khác biệt với Service Locator."
  - title: "Spring Framework — Dependency Injection"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html"
    description: "Hướng dẫn constructor injection, setter injection và cách container nối các dependency."
  - title: "Spring Boot — Spring Beans and Dependency Injection"
    url: "https://docs.spring.io/spring-boot/reference/using/spring-beans-and-dependency-injection.html"
    description: "Ví dụ chính thức về bean, component scanning và constructor injection."
  - title: "Google Guice — Getting Started"
    url: "https://github.com/google/guice/wiki/GettingStarted"
    description: "Giới thiệu dependency injection, khai báo binding và thực hành Guice cơ bản."
  - title: "Spring Framework — Bean Scopes"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html"
    description: "Phân biệt singleton, prototype, request scope và các tương tác vòng đời."
  - title: "Spring Framework — Autowiring Qualifiers"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/annotation-config/autowired-qualifiers.html"
    description: "Xử lý nhiều bean cùng kiểu, lọc dependency qua qualifier và lựa chọn ứng viên."
  - title: "Jakarta EE — Contexts and Dependency Injection Explained"
    url: "https://jakarta.ee/learn/specification-guides/contexts-dependency-injection-explained/"
    description: "Giới thiệu CDI, injection points, qualifiers, context và bean scopes."
  - title: "Microsoft Learn — Dependency Injection"
    url: "https://learn.microsoft.com/en-us/dotnet/core/extensions/dependency-injection/"
    description: "Một góc nhìn đa nền tảng về DI, constructor injection, service lifetime và scope validation."