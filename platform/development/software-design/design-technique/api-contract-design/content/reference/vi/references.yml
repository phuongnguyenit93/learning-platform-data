references:
  - title: "OpenAPI Initiative — OpenAPI Specification (Latest)"
    url: "https://spec.openapis.org/oas/latest.html"
    description: "Đặc tả chính thức cho HTTP API: operations, parameters, schemas, responses và security."
  - title: "IETF RFC 9110 — HTTP Semantics"
    url: "https://www.rfc-editor.org/rfc/rfc9110.html"
    description: "Ngữ nghĩa HTTP method, URI, request/response header và status code."
  - title: "IETF RFC 9457 — Problem Details for HTTP APIs"
    url: "https://www.rfc-editor.org/rfc/rfc9457.html"
    description: "Định dạng chuẩn cho lỗi API có cấu trúc, dễ xử lý bằng máy."
  - title: "JSON Schema — Draft 2020-12"
    url: "https://json-schema.org/draft/2020-12"
    description: "Đặc tả schema, validation và giới hạn cấu trúc JSON trong hợp đồng."
  - title: "OWASP — API Security Top 10 (2023)"
    url: "https://owasp.org/API-Security/editions/2023/en/0x11-t10/"
    description: "Các rủi ro bảo mật quan trọng khi thiết kế xác thực, phân quyền và dữ liệu API."
  - title: "Pact — Contract Testing Documentation"
    url: "https://docs.pact.io/"
    description: "Consumer-driven contract testing, kiểm tra tương tác giữa consumer và provider."
  - title: "Zalando — RESTful API and Event Guidelines"
    url: "https://opensource.zalando.com/restful-api-guidelines/"
    description: "API-first, consistency, backward compatibility, deprecation và versioning."