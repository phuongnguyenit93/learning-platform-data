references:
  - title: "Martin Fowler - Refactoring"
    url: "https://martinfowler.com/books/refactoring.html"
    description: "Khái niệm, phương pháp thay đổi nhỏ và bảo toàn hành vi khi cải thiện thiết kế phần mềm."
  - title: "Martin Fowler - Catalog of Refactorings"
    url: "https://refactoring.com/catalog/"
    description: "Danh mục kỹ thuật chính thức từ sách Refactoring, gồm Extract, Move, Encapsulate và conditional logic."
  - title: "Refactoring.Guru - Refactoring Overview"
    url: "https://refactoring.guru/refactoring"
    description: "Tổng quan refactoring, code smell, quy trình từng bước và nguyên tắc kiểm thử."
  - title: "Refactoring.Guru - Composing Methods"
    url: "https://refactoring.guru/refactoring/techniques/composing-methods"
    description: "Các kỹ thuật Extract Method, Inline, Extract Variable và tổ chức phương thức."
  - title: "IntelliJ IDEA - Code Refactoring"
    url: "https://www.jetbrains.com/help/idea/refactoring-source-code.html"
    description: "Hướng dẫn công cụ Rename, Extract, Inline, Move và kiểm tra refactoring trong IDE."
  - title: "OpenRewrite - Recipes"
    url: "https://docs.openrewrite.org/concepts-and-explanations/recipes"
    description: "Khái niệm recipe và tự động hóa các phép biến đổi mã nguồn theo cấu trúc."
  - title: "Martin Fowler - Test Driven Development"
    url: "https://martinfowler.com/bliki/TestDrivenDevelopment.html"
    description: "Vòng lặp Red-Green-Refactor và vai trò kiểm thử trong cải thiện mã nguồn."