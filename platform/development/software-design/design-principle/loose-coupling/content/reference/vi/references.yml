references:
  - title: "Martin Fowler — Separated Interface"
    url: "https://martinfowler.com/eaaCatalog/separatedInterface.html"
    description: "Tách interface khỏi implementation để kiểm soát hướng phụ thuộc giữa package và module."
  - title: "Oracle Java Tutorials — Interfaces"
    url: "https://docs.oracle.com/javase/tutorial/java/IandI/createinterface.html"
    description: "Interface là hợp đồng giữa các thành phần, cho phép thay đổi implementation độc lập."
  - title: "Spring Framework — Dependency Injection"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html"
    description: "Giải thích constructor injection, IoC và cách decoupling hỗ trợ unit test với stub/mock."
  - title: "Microsoft Learn — Architectural Principles"
    url: "https://learn.microsoft.com/dotnet/standard/modern-web-apps-azure-architecture/architectural-principles"
    description: "Encapsulation, separation of concerns và loose coupling trong thiết kế module."
  - title: "Refactoring.Guru — Message Chains"
    url: "https://refactoring.guru/smells/message-chains"
    description: "Nhận diện phụ thuộc vào object graph và kỹ thuật Hide Delegate để giảm coupling."
  - title: "Refactoring.Guru — Code Smells"
    url: "https://refactoring.guru/refactoring/smells"
    description: "Các dấu hiệu Couplers như Feature Envy, Inappropriate Intimacy, Message Chains và Middle Man."