references:
  - title: "Microsoft Learn — Architectural Principles"
    url: "https://learn.microsoft.com/dotnet/standard/modern-web-apps-azure-architecture/architectural-principles"
    description: "Separation of concerns, encapsulation, dependency inversion, single responsibility và DRY."
  - title: "Oracle Java — Object-Oriented Programming Concepts"
    url: "https://docs.oracle.com/javase/tutorial/java/concepts/index.html"
    description: "Class, object, interface, inheritance, encapsulation và tổ chức package trong Java."
  - title: "Microsoft Learn — Abstractions and Interfaces"
    url: "https://learn.microsoft.com/en-us/dotnet/standard/design-guidelines/abstractions-abstract-types-and-interfaces"
    description: "Thiết kế abstraction theo hợp đồng, chi phí của quá nhiều interface và giá trị cho testability."
  - title: "Martin Fowler — Beck Design Rules"
    url: "https://martinfowler.com/bliki/BeckDesignRules.html"
    description: "Các quy tắc simple design: kiểm thử, thể hiện ý định, tránh duplication và giảm phần tử dư thừa."
  - title: "Martin Fowler — Yagni"
    url: "https://martinfowler.com/bliki/Yagni.html"
    description: "Lý do không xây trước tính năng chưa cần và cách giảm chi phí của thiết kế phỏng đoán."
  - title: "Refactoring.Guru — Code Smells"
    url: "https://refactoring.guru/refactoring/smells"
    description: "Các dấu hiệu Large Class, Duplicate Code, Shotgun Surgery, coupling và speculative generality."