references:
  - title: "Baeldung — A Solid Guide to SOLID Principles"
    url: "https://www.baeldung.com/solid-principles"
    description: "Tổng quan năm nguyên lý SOLID trong thiết kế hướng đối tượng cùng các ví dụ và cách nhận diện lợi ích."
  - title: "Baeldung — Single Responsibility Principle in Java"
    url: "https://www.baeldung.com/java-single-responsibility-principle"
    description: "Giải thích một lý do thay đổi của module và cách chia tách trách nhiệm trong Java."
  - title: "Baeldung — Open/Closed Principle in Java"
    url: "https://www.baeldung.com/java-open-closed-principle"
    description: "Ví dụ Java mở rộng hành vi qua abstraction và polymorphism thay vì phải sửa code lõi."
  - title: "Baeldung — Liskov Substitution Principle in Java"
    url: "https://www.baeldung.com/java-liskov-substitution-principle"
    description: "Phân tích tính thay thế của subtype, hợp đồng hành vi và ví dụ vi phạm khi dùng kế thừa."
  - title: "Baeldung — Interface Segregation Principle in Java"
    url: "https://www.baeldung.com/java-interface-segregation"
    description: "Cách tách interface lớn thành hợp đồng riêng theo client, tránh phương thức không cần hoặc không hỗ trợ."
  - title: "Baeldung — Dependency Inversion Principle"
    url: "https://www.baeldung.com/cs/dip"
    description: "Tách chính sách cấp cao khỏi chi tiết cấp thấp bằng abstraction và phân biệt với dependency injection."
  - title: "Old Dominion University — SOLID Design"
    url: "https://www.cs.odu.edu/~zeil/cs330/latest/Public/solid/index.html"
    description: "Bài giảng đại học bao quát SOLID, coupling, cohesion cùng ví dụ kiểm chứng các nguyên lý thiết kế."
