  level2:
  - Thiết kế ví dụ đặt hàng, tồn kho và thanh toán theo ranh giới rõ ràng
  - Tạo các ứng dụng Spring Boot có quy trình xây dựng độc lập
  - Xây dựng REST API và HTTP client có timeout tường minh
  - Quản lý dữ liệu và giao dịch cục bộ trong từng dịch vụ
  - Tích hợp broker cho thông điệp nghiệp vụ
  - Hiện thực Outbox và consumer xử lý lặp an toàn
  - Truyền ngữ cảnh quan sát và đo chỉ số theo dịch vụ
  - Kiểm thử tích hợp bằng JUnit và Testcontainers
  - Chạy môi trường học tập nhiều dịch vụ bằng Docker Compose
  - Đóng gói và chứng minh một dịch vụ có thể phát hành độc lập
- level1: Quan hệ kiến trúc
  level2:
  - 'Microservices và SOA: so sánh mục tiêu và cơ chế tích hợp'
