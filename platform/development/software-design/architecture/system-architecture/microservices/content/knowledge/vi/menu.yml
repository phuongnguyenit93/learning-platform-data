  - Chi phí quan sát, môi trường và đường ống phát hành
  - Chi phí phối hợp nhóm và xử lý sự cố
  - Phân bổ chi phí theo dịch vụ và hành trình nghiệp vụ
  - Cân bằng đa dạng công nghệ với khả năng bảo trì
  - Đánh giá lợi ích độc lập triển khai so với tổng chi phí sở hữu
