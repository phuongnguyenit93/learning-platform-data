  - Chọn dịch vụ đầu tiên theo giá trị, rủi ro và khả năng tách
  - Strangler Fig và chuyển dần lưu lượng sang phần mới
  - Lớp chống xâm nhập để bảo vệ mô hình mới khỏi hệ thống cũ
  - Tách quyền sở hữu dữ liệu và giảm truy cập cơ sở dữ liệu dùng chung
  - Di chuyển dữ liệu, đối chiếu kết quả và kiểm soát giai đoạn song song
  - Thay giao tiếp nội bộ bằng hợp đồng và cơ chế phục hồi
  - Tiêu chí chuyển hẳn, quay lui và ngừng thành phần cũ
  - Đánh giá khi nào nên hợp nhất lại dịch vụ
