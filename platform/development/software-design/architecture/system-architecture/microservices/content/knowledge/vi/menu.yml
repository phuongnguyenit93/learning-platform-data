  - Lập kế hoạch tách một năng lực khỏi hệ thống cũ
  - Xây dựng SLO, dashboard và quy trình xử lý sự cố cho hành trình người dùng
  - Danh sách kiểm tra ranh giới, dữ liệu, phát hành và khả năng vận hành
