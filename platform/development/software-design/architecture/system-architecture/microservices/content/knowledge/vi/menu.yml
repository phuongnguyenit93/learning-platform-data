  - Serverless trong triển khai một số năng lực của hệ thống
  - Phân biệt quyết định kiến trúc với lựa chọn framework và nền tảng
- level1: Sai lầm thiết kế
  level2:
  - Khối đơn thể phân tán và phát hành đồng bộ nhiều dịch vụ
  - Chia dịch vụ theo bảng dữ liệu hoặc từng lớp kỹ thuật
  - Dùng chung mô hình miền và thư viện nghiệp vụ quá rộng
