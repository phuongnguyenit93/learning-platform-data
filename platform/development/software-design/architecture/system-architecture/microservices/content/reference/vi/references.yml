references:
  - title: "Microsoft Learn – Microservices Architecture Style"
    url: "https://learn.microsoft.com/en-us/azure/architecture/microservices/"
    description: "Định nghĩa kiến trúc microservices, bounded contexts, độc lập deploy, coupling và thách thức vận hành."
  - title: "Microservices.io – Microservice Architecture Pattern"
    url: "https://microservices.io/patterns/microservices.html"
    description: "Các lực lượng trade-off, thiết kế phân rã và vận hành tập hợp service độc lập."
  - title: "Microservices.io – Decompose by Business Capability"
    url: "https://microservices.io/patterns/decomposition/decompose-by-business-capability.html"
    description: "Xác định ranh giới dịch vụ theo năng lực nghiệp vụ, cohesion, autonomy và khả năng thay đổi."
  - title: "Microsoft Learn – API Design for Microservices"
    url: "https://learn.microsoft.com/en-us/azure/architecture/microservices/design/api-design"
    description: "Thiết kế API public/internal, contract, backward compatibility, idempotency và tránh chatty API."
  - title: "Microsoft Learn – Interservice Communication"
    url: "https://learn.microsoft.com/en-us/azure/architecture/microservices/design/interservice-communication"
    description: "Lựa chọn giao tiếp synchronous/asynchronous, reliability, service mesh và giao dịch phân tán."
  - title: "Microservices.io – Database per Service"
    url: "https://microservices.io/patterns/data/database-per-service.html"
    description: "Cô lập dữ liệu, quyền sở hữu schema/database, API composition và CQRS."
  - title: "Microservices.io – Saga Pattern"
    url: "https://microservices.io/patterns/data/saga.html"
    description: "Nghiệp vụ qua nhiều local transactions, orchestration/choreography và compensating actions."
  - title: "Microservices.io – Transactional Outbox"
    url: "https://microservices.io/patterns/data/transactional-outbox.html"
    description: "Đảm bảo thay đổi dữ liệu và xuất sự kiện nhất quán, chấp nhận consumer idempotency."
  - title: "Microservices.io – API Gateway Pattern"
    url: "https://microservices.io/patterns/apigateway"
    description: "Gateway, backend-for-frontend, routing, auth và giảm coupling với client."
  - title: "Microservices.io – Circuit Breaker Pattern"
    url: "https://microservices.io/patterns/reliability/circuit-breaker.html"
    description: "Ngăn cascading failures và chọn ngưỡng/timeout cho lời gọi qua mạng."
  - title: "OpenTelemetry – Traces"
    url: "https://opentelemetry.io/docs/concepts/signals/traces/"
    description: "Trace, span, context propagation và theo dõi các yêu cầu xuyên nhiều microservice."