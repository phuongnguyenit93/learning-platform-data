references:
  - title: "AWS — Event-Driven Architecture"
    url: "https://aws.amazon.com/event-driven-architecture/"
    description: "Khái niệm EDA, producer, event router và consumer, cùng lợi ích tách ghép và fan-out."
  - title: "Microsoft Azure — Event-Driven Architecture Style"
    url: "https://learn.microsoft.com/en-us/azure/architecture/guide/architecture-styles/event-driven"
    description: "Các topology event-driven, pub/sub, event streaming, use cases, eventual consistency và đánh đổi."
  - title: "Microsoft Azure — Publisher-Subscriber Pattern"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/publisher-subscriber"
    description: "Pub/sub qua broker, fan-out, ordering, delivery semantics, schema evolution và correlation."
  - title: "Microsoft Azure — Competing Consumers Pattern"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/competing-consumers"
    description: "Mở rộng consumer xử lý song song từ cùng kênh thông điệp và những lưu ý về thứ tự, tải."
  - title: "CNCF CloudEvents — Specification v1.0.2"
    url: "https://github.com/cloudevents/spec/blob/v1.0.2/cloudevents/spec.md"
    description: "Định dạng metadata sự kiện chuẩn hóa với source, type, id và data để tăng tính liên thông."
  - title: "AsyncAPI — Official Documentation"
    url: "https://www.asyncapi.com/docs"
    description: "Mô tả hợp đồng cho API hướng sự kiện, message channels, schemas và công cụ tài liệu hóa."
  - title: "Microservices.io — Transactional Outbox Pattern"
    url: "https://microservices.io/patterns/data/transactional-outbox.html"
    description: "Giảm rủi ro dual write bằng ghi sự kiện vào outbox trong cùng transaction với dữ liệu nghiệp vụ."
  - title: "Microservices.io — Idempotent Consumer Pattern"
    url: "https://microservices.io/patterns/communication-style/idempotent-consumer.html"
    description: "Dedupe các thông điệp được giao lại để xử lý at-least-once không gây tác dụng phụ trùng."
  - title: "Microsoft Azure — Saga Pattern"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/saga"
    description: "Điều phối local transactions theo choreography/orchestration và cơ chế bù trừ khi bước lỗi."