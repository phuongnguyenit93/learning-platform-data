references:
  - title: "Martin Fowler - CQRS"
    url: "https://martinfowler.com/bliki/CQRS.html"
    description: "Nguồn nền tảng giải thích CQRS, phạm vi bounded context và các đánh đổi khi tách model đọc/ghi."
  - title: "Microsoft Azure Architecture Center - CQRS Pattern"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/cqrs"
    description: "Thiết kế command/query models, shared hoặc separate data stores, eventual consistency và transactional outbox."
  - title: "Microsoft Azure Architecture Center - Materialized View Pattern"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/materialized-view"
    description: "Tạo, cập nhật và tái dựng projection/read model tối ưu cho truy vấn."
  - title: "Microsoft Azure Architecture Center - Event Sourcing Pattern"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/event-sourcing"
    description: "Vai trò tùy chọn của Event Sourcing khi kết hợp CQRS, projection, replay và consistency."
  - title: "Microsoft Azure Architecture Center - Transactional Outbox"
    url: "https://learn.microsoft.com/en-us/azure/architecture/databases/guide/transactional-out-box-cosmos"
    description: "Lưu thay đổi và outbox trong cùng transaction, publish an toàn và xử lý idempotent."
  - title: "Axon Framework - Command Dispatchers"
    url: "https://docs.axoniq.io/axon-framework-reference/5.1/commands/command-dispatchers/"
    description: "CommandBus, CommandGateway và cách dispatch command tới command handler trong Java."
  - title: "Axon Framework - Query Dispatchers"
    url: "https://docs.axoniq.io/axon-framework-reference/development/queries/query-dispatchers/"
    description: "QueryGateway, QueryBus, point-to-point và subscription queries trong Java."
  - title: "Axon Framework - Event Handlers"
    url: "https://docs.axoniq.io/axon-framework-reference/development/events/event-handlers/"
    description: "Xử lý domain events và cập nhật read model/projections bằng event handlers."