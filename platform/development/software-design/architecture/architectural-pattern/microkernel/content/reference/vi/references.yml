references:
  - title: "O'Reilly — Software Architecture Patterns: Microkernel Architecture"
    url: "https://www.oreilly.com/content/software-architecture-patterns/"
    description: "Bản chất core system, plug-in modules, registry, contracts và tình huống áp dụng kiến trúc Microkernel."
  - title: "O'Reilly — Fundamentals of Software Architecture: Microkernel Style"
    url: "https://www.oreilly.com/library/view/fundamentals-of-software/9781492043447/ch12.html"
    description: "Topology, extension points, plug-in contracts và đánh đổi kiến trúc."
  - title: "PF4J — Getting Started"
    url: "https://pf4j.org/doc/getting-started.html"
    description: "Khởi tạo Java PluginManager, loadPlugins, startPlugins và cách tổ chức plugin directory."
  - title: "PF4J — Plugins"
    url: "https://pf4j.org/doc/plugins.html"
    description: "Plugin metadata, packaging, dependencies, version và các cơ chế load/unload."
  - title: "PF4J — Extensions"
    url: "https://pf4j.org/doc/extensions.html"
    description: "ExtensionPoint, @Extension, discovery và sử dụng các implementation do plugin cung cấp."
  - title: "PF4J — Plugin Lifecycle"
    url: "https://pf4j.org/doc/plugin-lifecycle.html"
    description: "Các trạng thái CREATED, DISABLED, RESOLVED, STARTED và STOPPED của plugin."
  - title: "PF4J — Class Loading"
    url: "https://pf4j.org/doc/class-loading.html"
    description: "PluginClassLoader riêng, delegation strategy và giải quyết class dependencies."
  - title: "Eclipse Equinox — Documentation"
    url: "https://equinox.eclipseprojects.io/"
    description: "Kiến trúc OSGi bundles, class loading và dịch vụ mở rộng trong hệ sinh thái Eclipse."
  - title: "IntelliJ Platform Plugin SDK — Plugin Configuration File"
    url: "https://plugins.jetbrains.com/docs/intellij/plugin-configuration-file.html"
    description: "plugin.xml, extension points, phiên bản và dependency metadata trong hệ sinh thái plugin thực tế."