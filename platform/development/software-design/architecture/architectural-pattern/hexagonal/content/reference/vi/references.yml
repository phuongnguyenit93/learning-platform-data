references:
  - title: "Alistair Cockburn — Hexagonal Architecture (Original Article)"
    url: "https://alistair.cockburn.us/hexagonal-architecture"
    description: "Bài viết gốc năm 2005 định nghĩa Ports & Adapters, mục tiêu tách UI/database và cơ chế primary/secondary adapters."
  - title: "AWS Prescriptive Guidance — Hexagonal Architecture Pattern"
    url: "https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/hexagonal-architecture.html"
    description: "Tổng quan động cơ, các vai trò ports/adapters và trường hợp nên áp dụng hexagonal architecture."
  - title: "AWS — Building Hexagonal Architectures: Overview"
    url: "https://docs.aws.amazon.com/prescriptive-guidance/latest/hexagonal-architectures/overview.html"
    description: "Mô hình domain-driven design, dependency inversion, primary/driving và secondary/driven adapters."
  - title: "AWS — Building Hexagonal Architectures: Best Practices"
    url: "https://docs.aws.amazon.com/prescriptive-guidance/latest/hexagonal-architectures/best-practices.html"
    description: "Cấu trúc dự án với entrypoints, domain, ports, adapters và phân lớp kiểm thử."
  - title: "AWS — Building Hexagonal Architectures: Adapting to Change"
    url: "https://docs.aws.amazon.com/prescriptive-guidance/latest/hexagonal-architectures/adapt-to-change.html"
    description: "Ví dụ thay đổi database hoặc API adapter không ảnh hưởng đến hợp đồng domain và use cases."
  - title: "AWS — Building Hexagonal Architectures: Examples"
    url: "https://docs.aws.amazon.com/prescriptive-guidance/latest/hexagonal-architectures/examples.html"
    description: "Ví dụ ứng dụng Hexagonal Architecture với các input/output adapters, database và cloud services."
  - title: "ArchUnit — User Guide"
    url: "https://www.archunit.org/userguide/html/000_Index.html"
    description: "Viết test tự động kiểm tra phụ thuộc giữa domain, adapters, modules và quy tắc kiến trúc trong Java."
  - title: "Spring Boot — Testing"
    url: "https://docs.spring.io/spring-boot/how-to/testing.html"
    description: "Hướng dẫn kiểm thử và cấu hình slice tests cho ứng dụng Spring Boot khi xác minh từng adapter."