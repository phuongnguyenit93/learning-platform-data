references:
  - title: "Microsoft Learn - ASP.NET Core MVC Overview"
    url: "https://learn.microsoft.com/en-us/aspnet/core/mvc/overview?view=aspnetcore-10.0"
    description: "Khái niệm Model, View, Controller; separation of concerns và trách nhiệm từng thành phần."
  - title: "Spring Framework - DispatcherServlet"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet.html"
    description: "Front controller và các thành phần xử lý request trong Spring MVC."
  - title: "Spring Framework - Request Processing"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/sequence.html"
    description: "Trình tự tìm handler, tạo model, resolve view và render response."
  - title: "Spring Framework - Annotated Controllers"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann.html"
    description: "@Controller, @RestController và phân biệt rendering view với response body."
  - title: "Spring Framework - Mapping Requests"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-requestmapping.html"
    description: "Ánh xạ HTTP method, URL và parameters vào controller methods."
  - title: "Spring Framework - Model Attribute Binding"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/modelattrib-method-args.html"
    description: "@ModelAttribute, dữ liệu form, BindingResult và hạn chế mass assignment."
  - title: "Spring Framework - View Resolution"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/viewresolver.html"
    description: "ViewResolver chuyển tên view logic thành view triển khai thực tế."
  - title: "Spring Framework - Thymeleaf Views"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc-view/mvc-thymeleaf.html"
    description: "Template server-side và tích hợp Thymeleaf với Spring MVC."
  - title: "Spring Framework - MVC Validation"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-config/validation.html"
    description: "Tích hợp Bean Validation và @Valid/@Validated trong Spring MVC."
  - title: "Spring Framework - Exception Handling"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-exceptionhandler.html"
    description: "@ExceptionHandler, ControllerAdvice và xử lý lỗi controller."
  - title: "Spring Framework - MockMvc"
    url: "https://docs.spring.io/spring-framework/reference/testing/mockmvc/overview.html"
    description: "Kiểm thử controller, routing, binding, validation và response không cần server thật."
  - title: "Spring Guide - Serving Web Content"
    url: "https://spring.io/guides/gs/serving-web-content/"
    description: "Lab Spring Boot MVC với @Controller, Model và HTML template."