references:
  - title: "Martin Fowler — Presentation Domain Data Layering"
    url: "https://martinfowler.com/bliki/PresentationDomainDataLayering.html"
    description: "Phân tách presentation, domain và data source; hướng phụ thuộc, testability và giới hạn của layering."
  - title: "Martin Fowler — Layering Principles"
    url: "https://martinfowler.com/bliki/LayeringPrinciples.html"
    description: "Các quy tắc phụ thuộc giữa các tầng, tách business khỏi UI và tránh chu trình."
  - title: "Microsoft Azure — N-tier Architecture Style"
    url: "https://learn.microsoft.com/en-us/azure/architecture/guide/architecture-styles/n-tier"
    description: "Layer so với tier; closed/open layers, ưu điểm, thách thức và đánh đổi triển khai."
  - title: "AWS Prescriptive Guidance — Layered vs Hexagonal Overview"
    url: "https://docs.aws.amazon.com/prescriptive-guidance/latest/hexagonal-architectures/overview.html"
    description: "Minh họa phụ thuộc của kiến trúc phân tầng và tác động của thay đổi data access."
  - title: "Spring Guide — Building a RESTful Web Service"
    url: "https://spring.io/guides/gs/rest-service/"
    description: "Ví dụ @RestController, API request/response và cách tổ chức giao tiếp HTTP với Spring."
  - title: "Spring Framework — Data Access"
    url: "https://docs.spring.io/spring/reference/data-access.html"
    description: "Data access, transaction management và mối quan hệ với business/service layer."
  - title: "Spring Framework — Using @Transactional"
    url: "https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html"
    description: "Quản lý transaction ở service/use case bằng @Transactional và lưu ý Spring proxy."
  - title: "ArchUnit — User Guide"
    url: "https://www.archunit.org/userguide/html/000_Index.html"
    description: "Tự động kiểm tra quy tắc layeredArchitecture, package dependencies và vòng phụ thuộc."