menu:
  - level1: "Tổng quan"
    level2:
      - "Khái niệm Pipes and Filters và mục tiêu phân rã luồng xử lý dữ liệu"
      - "Nguồn gốc tư duy pipeline và nguyên lý ghép các bước biến đổi độc lập"
      - "Luồng dữ liệu qua nguồn, các filter, các pipe và đích"
      - "Phân biệt mẫu kiến trúc Pipes and Filters với pipeline ở mức mã nguồn"
      - "Các thuộc tính cốt lõi: tính kết hợp, tính độc lập và khả năng thay thế"
      - "Lợi ích về tái sử dụng, kiểm thử, bảo trì và phát triển từng bước"
      - "Chi phí điều phối, truyền dữ liệu và quan sát khi tăng số bước"
      - "Thuật ngữ nền tảng: record, message, stream, stage và pipeline"
  - level1: "Thành phần cốt lõi"
    level2:
      - "Source: tiếp nhận dữ liệu, xác định ranh giới đầu vào và phát tín hiệu kết thúc"
      - "Filter: nhận dữ liệu, thực hiện một trách nhiệm và tạo đầu ra theo hợp đồng"
      - "Pipe: chuyển dữ liệu và tách biệt cơ chế vận chuyển khỏi phép biến đổi"
      - "Sink: tiêu thụ kết quả và xác định thời điểm hoàn tất xử lý"
      - "Bộ điều phối: quản lý vòng đời, phụ thuộc và kết quả của pipeline"
      - "Mặt phẳng dữ liệu và tín hiệu điều khiển: lỗi, hủy, nhu cầu và hoàn tất"
      - "Quyền sở hữu dữ liệu, tài nguyên và trách nhiệm giải phóng giữa các thành phần"
      - "Ranh giới giữa logic nghiệp vụ, adapter đầu vào/đầu ra và hạ tầng thực thi"
  - level1: "Ranh giới áp dụng"
    level2:
      - "Nhận diện bài toán có thể biểu diễn bằng chuỗi biến đổi dữ liệu độc lập"
      - "Điều kiện áp dụng cho ETL, xử lý tệp, nhật ký, thông điệp và đa phương tiện"
      - "Đánh giá mức độc lập, tính kết hợp và nhu cầu tái sử dụng của từng bước"
      - "Hạn chế khi cần tương tác qua lại, trạng thái chung hoặc giao dịch xuyên nhiều bước"
      - "So sánh với Layered Architecture theo luồng dữ liệu và hướng phụ thuộc"
      - "So sánh với Chain of Responsibility theo quyền xử lý và chuyển tiếp yêu cầu"
      - "So sánh với middleware và workflow theo ngữ nghĩa của từng bước"
      - "Cân nhắc độ phức tạp vận hành trước khi chọn pipeline phân tán"
  - level1: "Thiết kế filter"
    level2:
      - "Chia filter theo một trách nhiệm nghiệp vụ có đầu vào và đầu ra xác định"
      - "Thiết kế giao diện Filter<I, O> và biểu diễn phép kết hợp an toàn về kiểu"
      - "Phân biệt filter thuần, filter có trạng thái và filter có tác dụng phụ"
      - "Thiết kế ánh xạ một-một, một-nhiều, nhiều-một và loại bỏ phần tử"
      - "Giữ filter độc lập với filter kế tiếp và cơ chế vận chuyển"
      - "Tách cấu hình, phụ thuộc bên ngoài và ngữ cảnh xử lý khỏi dữ liệu nghiệp vụ"
      - "Chọn độ hạt filter để cân bằng khả năng tái sử dụng và chi phí kết nối"
      - "Xác định tính xác định, tính lũy đẳng và các bất biến của phép biến đổi"
  - level1: "Hợp đồng dữ liệu"
    level2:
      - "Xác định schema, kiểu dữ liệu, trường bắt buộc và trường tùy chọn tại mỗi ranh giới"
      - "Mô tả ngữ nghĩa, đơn vị đo, miền giá trị và quy ước chuẩn hóa dữ liệu"
      - "Quy định tiền điều kiện, hậu điều kiện và bất biến giữa các filter"
      - "Phân biệt dữ liệu thiếu, null, rỗng, không hợp lệ và giá trị mặc định"
      - "Tách payload khỏi metadata như mã tương quan, phiên bản và dấu thời gian"
      - "Quy định định dạng lỗi và biểu diễn kết quả thành công, bị loại hoặc thất bại"
      - "Xác định quyền sửa đổi dữ liệu và chính sách dùng đối tượng bất biến"
      - "Thiết kế hợp đồng tuần tự hóa, mã hóa ký tự và kích thước bản ghi"
      - "Khai báo số lượng đầu ra, tín hiệu kết thúc và hành vi với đầu vào rỗng"
      - "Xác minh khả năng kết hợp đầu ra của filter trước với đầu vào của filter sau"
  - level1: "Thiết kế pipe"
    level2:
      - "Pipe đồng bộ qua lời gọi trực tiếp và truyền giá trị trong bộ nhớ"
      - "Pipe bất đồng bộ qua hàng đợi và phân tách tốc độ giữa các bước"
      - "Pipe liên tiến trình hoặc qua mạng và chi phí truyền dữ liệu"
      - "Lựa chọn lưu trữ tạm thời hoặc bền vững theo yêu cầu phục hồi"
      - "Xác định dung lượng, chính sách khi đầy và thời hạn chờ của pipe"
      - "Quy định thứ tự, quyền sở hữu và thời điểm dữ liệu được coi là đã chuyển giao"
      - "Thiết kế đóng pipe, truyền lỗi và giải phóng tài nguyên khi dừng"
      - "Chọn cơ chế vận chuyển theo độ trễ, thông lượng, độ bền và mức ghép nối"
  - level1: "Cấu trúc pipeline"
    level2:
      - "Pipeline tuyến tính và điều kiện kết hợp các filter theo thứ tự"
      - "Định tuyến có điều kiện theo nội dung và tách luồng dữ liệu không hợp lệ"
      - "Fan-out: nhân bản dữ liệu hoặc phân chia dữ liệu sang nhiều nhánh"
      - "Fan-in: hợp nhất các nhánh và xác định ngữ nghĩa thứ tự đầu ra"
      - "Splitter và aggregator: tách bản ghi rồi gom kết quả theo khóa"
      - "Kết hợp nhiều nguồn bằng join và quản lý thời hạn chờ dữ liệu"
      - "Đồ thị không chu trình, phụ thuộc giữa các bước và phát hiện cấu hình sai"
      - "Vòng phản hồi và nhu cầu bổ sung giới hạn lặp, chống lặp vô hạn"
  - level1: "Điều phối thực thi"
    level2:
      - "Phân biệt luồng dữ liệu với luồng điều khiển của bộ điều phối"
      - "Xây dựng kế hoạch thực thi từ cấu hình và kiểm tra kết nối trước khi chạy"
      - "Quản lý khởi tạo, sẵn sàng, chạy, hoàn tất và đóng từng thành phần"
      - "Lập lịch các bước theo phụ thuộc và ngân sách tài nguyên"
      - "Truyền ngữ cảnh xử lý, thời hạn và tín hiệu hủy xuyên pipeline"
      - "Thiết kế timeout cho từng bước và thời hạn tổng thể của một lần xử lý"
      - "Phối hợp hoàn tất khi có nhiều nguồn, nhiều nhánh và đầu ra rỗng"
      - "Dừng êm: ngừng nhận dữ liệu mới, xử lý phần tồn và đóng sink"
      - "Giám sát lỗi của tác vụ con và ngăn tác vụ bị bỏ quên khi pipeline kết thúc"
      - "Phân định điều phối tập trung và điều phối qua thông điệp giữa các bước"
  - level1: "Mô hình xử lý"
    level2:
      - "Mô hình push: nguồn chủ động phát dữ liệu và trách nhiệm kiểm soát tốc độ"
      - "Mô hình pull: bước sau yêu cầu dữ liệu và đánh giá xử lý theo nhu cầu"
      - "Xử lý theo lô với tập dữ liệu hữu hạn và điều kiện hoàn tất rõ ràng"
      - "Xử lý luồng liên tục với nguồn không hữu hạn và kết quả tăng dần"
      - "Xử lý từng bản ghi và vi lô theo đánh đổi độ trễ, thông lượng"
      - "Thực thi đồng bộ và bất đồng bộ theo mức ghép nối giữa các bước"
      - "Thực thi lười và thực thi ngay theo thời điểm phát sinh công việc"
      - "Đánh giá vật chất hóa dữ liệu trung gian so với truyền dữ liệu liên tục"
  - level1: "Quản lý trạng thái"
    level2:
      - "Nhận diện trạng thái cục bộ, trạng thái theo khóa và trạng thái dùng chung"
      - "Chọn filter không trạng thái khi phép biến đổi không cần lịch sử xử lý"
      - "Thiết kế phạm vi sống và quyền sở hữu của trạng thái trong filter"
      - "Phân vùng trạng thái theo khóa và giữ dữ liệu liên quan cùng nơi xử lý"
      - "Lưu trạng thái trong bộ nhớ hoặc kho bên ngoài theo độ trễ và độ bền"
      - "Giới hạn trạng thái bằng TTL, cửa sổ và chính sách thu hồi"
      - "Chụp snapshot, tạo checkpoint và khôi phục trạng thái sau sự cố"
      - "Phối hợp trạng thái với vị trí đọc nguồn và kết quả đã ghi"
      - "Di chuyển trạng thái khi thay đổi số phân vùng hoặc số worker"
      - "Quản lý cache trong filter: độ mới, vô hiệu hóa và tính nhất quán"
  - level1: "Thứ tự và thời gian"
    level2:
      - "Phân biệt thứ tự toàn cục, thứ tự theo nguồn và thứ tự theo khóa"
      - "Ảnh hưởng của xử lý song song, retry và nhiều nhánh tới thứ tự kết quả"
      - "Số thứ tự, bộ đệm sắp xếp lại và giới hạn thời gian chờ phần tử thiếu"
      - "Phân biệt thời gian sự kiện, thời gian tiếp nhận và thời gian xử lý"
      - "Cửa sổ cố định, trượt và phiên cho phép tổng hợp dữ liệu luồng"
      - "Watermark, dữ liệu đến muộn và giới hạn chờ hoàn tất cửa sổ"
      - "Chính sách bỏ qua, cập nhật hoặc phát kết quả hiệu chỉnh khi dữ liệu đến muộn"
      - "Đồng bộ thời gian và bảo đảm tính xác định khi kiểm thử hoặc phát lại"
  - level1: "Phân loại lỗi"
    level2:
      - "Phân biệt lỗi dữ liệu, lỗi nghiệp vụ, lỗi hạ tầng và lỗi lập trình"
      - "Xác định lỗi tạm thời, lỗi vĩnh viễn và điều kiện có thể thử lại"
      - "Phạm vi lỗi ở mức bản ghi, vi lô, filter và toàn pipeline"
      - "Chọn fail-fast, tiếp tục có kiểm soát hoặc kết thúc một phần theo hợp đồng"
      - "Thiết kế kênh lỗi và giữ thông tin nguồn gốc, nguyên nhân, bước thất bại"
      - "Cách ly dữ liệu lỗi bằng quarantine hoặc dead-letter queue"
      - "Biểu diễn kết quả một phần và tránh bỏ qua lỗi hoặc thất thoát âm thầm"
      - "Cô lập nhánh thất bại và xác định điều kiện hủy các nhánh liên quan"
  - level1: "Phục hồi và retry"
    level2:
      - "Thiết kế retry có giới hạn theo số lần, thời gian và ngân sách xử lý"
      - "Exponential backoff và jitter để giảm tải khi phụ thuộc gặp sự cố"
      - "Chọn vị trí retry tại nguồn, từng filter hoặc toàn pipeline"
      - "Ngăn retry lồng nhau, bão retry và khuếch đại số lần gọi phụ thuộc"
      - "Circuit breaker và thời điểm tạm ngừng gọi dịch vụ đang lỗi"
      - "Phát hiện poison message và chuyển sang kênh xử lý thủ công có truy vết"
      - "Phục hồi từ checkpoint và phát lại trong phạm vi dữ liệu được xác định"
      - "Thiết kế quy trình sửa dữ liệu, tái xử lý và đối soát sau phục hồi"
  - level1: "Bảo đảm giao nhận"
    level2:
      - "At-most-once và đánh đổi giữa trùng lặp với nguy cơ mất dữ liệu"
      - "At-least-once và yêu cầu xử lý trùng lặp ở các bước nhận"
      - "Exactly-once: phạm vi bảo đảm, giả định và giới hạn khi gọi hệ thống bên ngoài"
      - "Thời điểm acknowledge, commit offset và xác nhận ghi kết quả"
      - "Khóa lũy đẳng, định danh bản ghi và chiến lược khử trùng lặp"
      - "Kho lưu dấu đã xử lý, thời hạn lưu và xử lý va chạm định danh"
      - "Cửa sổ sự cố giữa nhận dữ liệu, cập nhật trạng thái và phát đầu ra"
      - "Kiểm chứng bảo đảm giao nhận từ đầu đến cuối qua từng ranh giới"
  - level1: "Giao dịch và tác dụng phụ"
    level2:
      - "Tách phép biến đổi thuần khỏi ghi cơ sở dữ liệu, gọi API và phát thông điệp"
      - "Chọn ranh giới giao dịch tại filter hoặc sink theo đơn vị nghiệp vụ"
      - "Thiết kế sink có tính lũy đẳng và thao tác ghi có điều kiện"
      - "Transactional outbox để phối hợp cập nhật dữ liệu và phát sự kiện"
      - "Inbox và khử trùng lặp để bảo vệ tác dụng phụ ở phía nhận"
      - "Giao dịch phân tán và giới hạn khi tài nguyên không cùng cơ chế commit"
      - "Bù trừ và Saga khi chuỗi tác dụng phụ không thể rollback đồng thời"
      - "Đối soát tác dụng phụ khi timeout khiến kết quả thực tế chưa xác định"
  - level1: "Backpressure"
    level2:
      - "Nhận diện chênh lệch tốc độ giữa nguồn, filter và sink"
      - "Phân biệt backpressure, buffering, throttling và rate limiting"
      - "Điều tiết theo nhu cầu của bước nhận trong mô hình pull hoặc demand"
      - "Truyền áp lực ngược bằng chặn ghi hoặc chờ bất đồng bộ có giới hạn"
      - "Ngưỡng cao, ngưỡng thấp và chính sách tạm dừng rồi tiếp tục nguồn"
      - "Chọn chờ, từ chối, bỏ phần tử hoặc lưu tạm theo ngữ nghĩa dữ liệu"
      - "Xử lý nhánh chậm trong fan-out và giới hạn ảnh hưởng lên nhánh khác"
      - "Lan truyền áp lực ngược qua tiến trình, mạng và broker"
      - "Kiểm soát tiếp nhận và giảm tải khi tốc độ đầu vào vượt năng lực bền vững"
      - "Quan sát tốc độ, độ sâu hàng đợi và thời gian chờ để kiểm chứng điều tiết"
  - level1: "Bộ đệm và tài nguyên"
    level2:
      - "Ước lượng dung lượng hàng đợi từ tốc độ đến, thời gian chờ và kích thước bản ghi"
      - "Giới hạn số phần tử cùng kích thước byte để kiểm soát bộ nhớ thực tế"
      - "Chọn bộ đệm trong bộ nhớ, trên đĩa hoặc cơ chế spill theo tải"
      - "Quản lý vòng đời buffer, kết nối, luồng đọc và tệp tạm"
      - "Cân bằng sao chép dữ liệu, chia sẻ đối tượng và tối ưu truyền bộ đệm"
      - "Áp dụng quota cho kết nối, tác vụ đang xử lý và dung lượng lưu tạm"
      - "Ngăn rò rỉ tài nguyên khi lỗi, timeout, hủy và dừng giữa chừng"
      - "Dự phòng tài nguyên cho đột biến tải và giới hạn thời gian lưu dữ liệu tồn"
  - level1: "Xử lý đồng thời"
    level2:
      - "Phân biệt song song giữa các bước và song song bên trong một bước"
      - "Chọn số worker theo đặc tính công việc CPU hoặc chờ I/O"
      - "Phân chia dữ liệu theo bản ghi, lô hoặc khóa để tránh tranh chấp"
      - "Thiết kế filter an toàn luồng và cô lập trạng thái có thể thay đổi"
      - "Điều phối executor, nhóm worker và giới hạn tác vụ đang chờ"
      - "Khôi phục thứ tự đầu ra và nhận diện head-of-line blocking"
      - "Ngăn deadlock khi các pipe hữu hạn cùng chờ đọc hoặc ghi"
      - "Đánh giá công bằng, tranh chấp khóa và khả năng hủy khi chạy song song"
  - level1: "Tối ưu hiệu năng"
    level2:
      - "Đo thông lượng, độ trễ toàn tuyến và độ trễ tại các phân vị"
      - "Phân rã thời gian xử lý, thời gian xếp hàng và thời gian truyền dữ liệu"
      - "Xác định nút thắt bằng đo đạc từng bước với tải đại diện"
      - "Áp dụng định luật Little để liên hệ tải đang xử lý, thông lượng và độ trễ"
      - "Cân chỉnh kích thước lô theo chi phí cố định, bộ nhớ và thời gian chờ"
      - "Giảm tuần tự hóa, sao chép, cấp phát đối tượng và chuyển đổi ngữ cảnh"
