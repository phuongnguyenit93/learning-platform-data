references:
  - title: "Transactional Outbox Pattern - Microservices.io"
    url: "https://microservices.io/patterns/data/transactional-outbox.html"
    description: "Mô hình dual write, atomic outbox write, message relay và các ràng buộc về ordering."
  - title: "AWS - Transactional Outbox Pattern"
    url: "https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/transactional-outbox.html"
    description: "Hướng dẫn kiến trúc, tình huống lỗi, phát hành bất đồng bộ và idempotent consumer."
  - title: "Polling Publisher Pattern"
    url: "https://microservices.io/patterns/data/polling-publisher.html"
    description: "Phát event bằng cách polling bảng outbox; ưu điểm và giới hạn về thứ tự."
  - title: "Transaction Log Tailing Pattern"
    url: "https://microservices.io/patterns/data/transaction-log-tailing.html"
    description: "Relay bằng theo dõi WAL/binlog và những đánh đổi của CDC."
  - title: "Debezium - Outbox Event Router"
    url: "https://debezium.io/documentation/reference/stable/transformations/outbox-event-router.html"
    description: "Cấu trúc outbox event, eventId, aggregate key, payload và routing qua SMT."
  - title: "Idempotent Consumer Pattern"
    url: "https://microservices.io/patterns/communication-style/idempotent-consumer.html"
    description: "Loại trừ message trùng và lưu processed message ID trong transaction."
  - title: "Spring Framework - @Transactional"
    url: "https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html"
    description: "Giao dịch cục bộ trong Java/Spring, rollback rules và các giới hạn proxy."