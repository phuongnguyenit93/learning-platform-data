references:
  - title: "Microservices.io – Saga Pattern"
    url: "https://microservices.io/patterns/data/saga.html"
    description: "Khái niệm Saga và hai cơ chế phối hợp choreography, orchestration."
  - title: "AWS Prescriptive Guidance – Saga Patterns"
    url: "https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/saga-patterns.html"
    description: "Local transaction, forward recovery, compensation và lựa chọn hai biến thể Saga."
  - title: "AWS – Saga Choreography Pattern"
    url: "https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/saga-choreography.html"
    description: "Event-driven participants, dual write, isolation và observability trong choreography."
  - title: "AWS – Saga Orchestration Pattern"
    url: "https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/saga-orchestration.html"
    description: "Coordinator, trạng thái luồng, lỗi và cơ chế bù qua state machine."
  - title: "Microsoft Learn – Saga Design Pattern"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/saga"
    description: "Compensable, pivot, retryable steps và đánh đổi khi dùng Saga."
  - title: "Microsoft Learn – Compensating Transaction"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/compensating-transaction"
    description: "Thiết kế compensation theo nghiệp vụ, retry và xử lý khi không thể hoàn tác."
  - title: "Microservices.io – Transactional Outbox"
    url: "https://microservices.io/patterns/data/transactional-outbox.html"
    description: "Ghi trạng thái DB và outbox atomically, sau đó relay event tới broker."
  - title: "Microservices.io – Idempotent Consumer"
    url: "https://microservices.io/patterns/communication-style/idempotent-consumer.html"
    description: "Chống xử lý trùng khi message có thể được giao nhiều lần."
  - title: "Eventuate Tram Sagas – Getting Started"
    url: "https://eventuate.io/docs/manual/eventuate-tram/latest/getting-started-eventuate-tram-sagas.html"
    description: "Ví dụ Java JDBC/JPA xây dựng orchestrator, participant và saga messaging."
  - title: "AWS – Saga in Microservice Data Persistence"
    url: "https://docs.aws.amazon.com/prescriptive-guidance/latest/modernization-data-persistence/saga-pattern.html"
    description: "Ứng dụng Saga cho workflow nhiều service, rollback bằng compensation và thử thách debug."