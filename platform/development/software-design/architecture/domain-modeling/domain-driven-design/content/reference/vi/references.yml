references:
  - title: "Eric Evans — DDD Reference"
    url: "https://www.domainlanguage.com/ddd/reference/"
    description: "Tóm tắt các pattern chiến lược và chiến thuật của Domain-Driven Design bởi tác giả Eric Evans."
  - title: "Martin Fowler — Ubiquitous Language"
    url: "https://martinfowler.com/bliki/UbiquitousLanguage.html"
    description: "Ngôn ngữ chung giữa domain experts và developers, cách kiểm chứng và cải tiến mô hình."
  - title: "Domain Language — DDD Overview"
    url: "https://www.domainlanguage.com/training/ddd-overview/"
    description: "Tổng quan model discovery, core domain, context mapping và strategic design."
  - title: "Martin Fowler — Bounded Context"
    url: "https://martinfowler.com/bliki/BoundedContext.html"
    description: "Giới hạn ý nghĩa của một domain model và xác định quan hệ giữa các mô hình."
  - title: "Azure Architecture — Domain Analysis"
    url: "https://learn.microsoft.com/en-nz/azure/architecture/microservices/model/domain-analysis"
    description: "Phân tích subdomain, bounded context và context map; minh họa upstream/downstream và anti-corruption layer."
  - title: "Microsoft Learn — Microservice Domain Model"
    url: "https://learn.microsoft.com/dotnet/architecture/microservices/microservice-ddd-cqrs-patterns/microservice-domain-model"
    description: "Mô hình entity, value object, aggregate root và hành vi nghiệp vụ trong từng context."
  - title: "Martin Fowler — DDD Aggregate"
    url: "https://martinfowler.com/bliki/DDD_Aggregate.html"
    description: "Aggregate root, ranh giới nhất quán và thao tác lưu trữ theo aggregate."
  - title: "Microsoft Learn — Domain Events"
    url: "https://learn.microsoft.com/dotnet/architecture/microservices/microservice-ddd-cqrs-patterns/domain-events-design-implementation"
    description: "Thiết kế domain event, side effects và tính nhất quán giữa các aggregate."
  - title: "Microsoft Learn — DDD-Oriented Microservice"
    url: "https://learn.microsoft.com/dotnet/architecture/microservices/microservice-ddd-cqrs-patterns/ddd-oriented-microservice"
    description: "Phân biệt application layer và domain model, áp dụng DDD cho nghiệp vụ có quy tắc phức tạp."