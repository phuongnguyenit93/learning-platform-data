menu:
- level1: Tổng quan
  level2:
  - Nợ kỹ thuật (technical debt) là gì trong thiết kế phần mềm
  - Ẩn dụ khoản vay, vốn gốc và lãi giúp giải thích điều gì
  - Lợi ích ngắn hạn và nghĩa vụ thay đổi phát sinh trong tương lai
  - Phân biệt nợ kỹ thuật với lỗi phần mềm, thiếu tính năng và công việc bảo trì
  - Phân biệt nợ kỹ thuật với mã cũ, thiết kế xấu và sở thích cá nhân
  - Vì sao nợ kỹ thuật có thể tồn tại trong một hệ thống đang hoạt động tốt
  - Vòng đời từ phát sinh, nhận diện và quyết định đến xử lý hoặc chấp nhận
- level1: Nguồn hình thành
  level2:
  - Đánh đổi có chủ đích để kiểm chứng sản phẩm hoặc đáp ứng thời hạn
  - Quyết định thiếu thông tin và khoản nợ chỉ được nhận ra sau khi học thêm
  - Phân biệt quyết định có cân nhắc với quyết định thiếu căn cứ
  - Thay đổi yêu cầu và giả định thiết kế không còn phù hợp
  - Tăng trưởng quy mô làm lộ giới hạn của giải pháp ban đầu
  - Thiếu phản hồi, kiểm thử và quyền sở hữu làm nợ tích lũy
  - Tối ưu cục bộ giữa các nhóm gây chi phí cho toàn hệ thống
  - Phức tạp hóa sớm và tổng quát hóa vượt nhu cầu
- level1: Phân loại nợ
  level2:
  - Nợ mã nguồn và nợ thiết kế trong cấu trúc mô-đun
  - Nợ kiến trúc trong ranh giới, phụ thuộc và cách triển khai
  - Nợ kiểm thử làm giảm khả năng thay đổi an toàn
  - Nợ dữ liệu và hợp đồng giao tiếp làm khó tiến hóa hệ thống
  - Nợ phụ thuộc, công cụ xây dựng và nền tảng thực thi
  - Nợ tài liệu, kiến thức và khả năng quan sát hệ thống
  - Nợ bảo mật trong thiết kế và cơ chế bảo vệ hệ thống
  - Nợ quy trình có tác động trực tiếp đến chất lượng kỹ thuật
  - Một vấn đề mang nhiều loại nợ và cách tránh ghi nhận trùng
- level1: Mô hình chi phí
  level2:
  - Ước lượng vốn gốc là công sức xử lý trong một phạm vi xác định
  - Nhận diện lãi qua công sức tăng thêm khi sửa lỗi hoặc phát triển
  - Phân biệt chi phí thường xuyên với rủi ro tổn thất khi sự cố xảy ra
  - Chi phí cơ hội khi nợ làm chậm thay đổi có giá trị
  - Nợ tích lũy, nợ khuếch đại và các khoản nợ phụ thuộc lẫn nhau
  - Ảnh hưởng của tần suất thay đổi đến mức lãi thực tế
  - Vì sao khoản nợ trong thành phần ít thay đổi có thể chưa cần xử lý
  - Giới hạn của ẩn dụ tài chính và độ bất định trong ước lượng
  - So sánh chi phí giữ nguyên, giảm nhẹ, trả nợ và loại bỏ thành phần
- level1: Dấu hiệu thiết kế
  level2:
  - Mã có mùi (code smell) là dấu hiệu điều tra thay vì kết luận tự động
  - Lớp hoặc mô-đun ôm quá nhiều trách nhiệm
  - Liên kết phụ thuộc chặt và tính gắn kết nội bộ thấp
  - Phụ thuộc vòng và hướng phụ thuộc đi ngược ranh giới thiết kế
  - Một thay đổi nhỏ buộc sửa nhiều nơi
  - Nhiều lý do thay đổi không liên quan tập trung trong cùng thành phần
  - Sao chép quy tắc nghiệp vụ dẫn đến sửa không đồng nhất
  - Trừu tượng rò rỉ, điều kiện phân nhánh và ngoại lệ ngày càng chồng chất
  - Trạng thái dùng chung, tác dụng phụ ẩn và thứ tự gọi ngầm định
  - Đánh giá dấu hiệu theo bối cảnh thay đổi thay vì ngưỡng máy móc
- level1: Nợ kiến trúc
  level2:
  - Ranh giới miền không phản ánh trách nhiệm nghiệp vụ
  - Chia sẻ dữ liệu làm các thành phần không thể thay đổi độc lập
  - Quy trình triển khai cần phối hợp nhiều nhóm cho một thay đổi nhỏ
  - Phụ thuộc hạ tầng hoặc nhà cung cấp bị lan vào logic cốt lõi
  - Quyết định kiến trúc không còn đáp ứng yêu cầu chất lượng
  - Nhận diện suy giảm kiến trúc qua sai lệch so với quy tắc đã thống nhất
  - Kiến trúc phân tán nhưng vẫn phụ thuộc như một khối
  - Phân biệt nợ kiến trúc với nhu cầu mở rộng chưa được chứng minh
- level1: Nợ kiểm thử
  level2:
  - Thiếu bằng chứng về hành vi hiện tại trước khi sửa thiết kế
  - Kiểm thử dễ vỡ vì phụ thuộc chi tiết triển khai
  - Bộ kiểm thử chậm làm kéo dài vòng phản hồi
  - Kiểm thử chập chờn làm giảm niềm tin vào kết quả
  - Phụ thuộc môi trường và dữ liệu khiến kiểm thử khó tái hiện
  - Thiếu kiểm thử hợp đồng ở ranh giới giữa các thành phần
  - Khoảng trống kiểm thử trong các luồng nghiệp vụ quan trọng
  - Vì sao tỷ lệ bao phủ mã cao chưa chứng minh nợ kiểm thử thấp
- level1: Nợ dữ liệu và hợp đồng
  level2:
  - Lược đồ dữ liệu không thể hiện rõ quy tắc và quyền sở hữu
  - Dữ liệu trùng, dữ liệu sai và thiếu ràng buộc nhất quán
  - Nhiều dịch vụ cùng ghi vào cấu trúc dữ liệu dùng chung
  - API làm lộ mô hình lưu trữ hoặc chi tiết nội bộ
  - Hợp đồng không có chính sách tương thích và ngừng hỗ trợ
  - Định dạng sự kiện thiếu phiên bản hoặc ý nghĩa ổn định
  - Mã chuyển đổi tạm thời và nhánh tương thích không được dọn bỏ
  - Đánh giá tác động đến bên sử dụng trước khi gọi một hợp đồng là nợ
- level1: Nợ nền tảng
  level2:
  - Thư viện và môi trường thực thi quá khó nâng cấp
  - Tùy biến nền tảng làm tăng chi phí bảo trì dài hạn
  - Quy trình xây dựng thiếu khả năng tái hiện và phản hồi nhanh
  - Cấu hình môi trường không nhất quán gây lỗi khó chẩn đoán
  - Triển khai, quay lui và khôi phục phụ thuộc thao tác thủ công
  - Thiếu khả năng quan sát làm kéo dài điều tra và sửa đổi
  - Tài liệu lỗi thời và kiến thức tập trung ở một người
  - Xác định phần nợ cần phối hợp với bảo mật và vận hành
  - Phân biệt nợ bảo mật có thể lên kế hoạch với lỗ hổng cần xử lý khẩn cấp
- level1: Phát hiện và bằng chứng
  level2:
  - Kết hợp rà soát mã, phản hồi của nhóm và dữ liệu vận hành
  - Thu thập ví dụ thay đổi thực tế bị chậm bởi cấu trúc hiện tại
  - Phân tích lỗi lặp lại và các khu vực thường gây hồi quy
  - Dùng phân tích tĩnh để tìm ứng viên cần điều tra
  - Đọc đồ thị phụ thuộc và đối chiếu ranh giới mô-đun
  - Rà soát công việc thủ công và đường xử lý ngoại lệ kéo dài
  - Nhận diện khoản nợ được ghi trong TODO, FIXME và quyết định tạm thời
  - Phỏng vấn người bảo trì để làm rõ chi phí không xuất hiện trong công cụ
  - Tách quan sát, giả thuyết nguyên nhân và kết luận đã kiểm chứng
- level1: Phân tích điểm nóng
  level2:
  - Kết hợp tần suất thay đổi với độ phức tạp để tìm điểm nóng
  - Đọc lịch sử Git và xác định các tệp thường thay đổi cùng nhau
  - Phân biệt thành phần lớn nhưng ổn định với thành phần thường gây cản trở
  - Đối chiếu biến động mã với lỗi, thời gian sửa và số nhóm liên quan
  - Nhận diện khu vực thiếu người am hiểu và có rủi ro bàn giao
  - Xử lý nhiễu từ mã sinh tự động, đổi định dạng và di chuyển tệp
  - Giới hạn của lịch sử commit khi suy luận nguyên nhân thiết kế
  - Dùng điểm nóng để chọn phạm vi khảo sát thay vì tự động xếp hạng con người
- level1: Đánh giá tác động
  level2:
  - Xác định hành vi nghiệp vụ và yêu cầu chất lượng đang bị ảnh hưởng
  - Đo công sức tăng thêm qua các thay đổi có thể so sánh
  - Ước lượng tần suất phải chạm vào khoản nợ trong tương lai
  - Đánh giá phạm vi ảnh hưởng và hệ quả khi xử lý thất bại
  - Phân biệt mức độ nghiêm trọng, mức khẩn cấp và độ chắc chắn
  - Ước lượng công sức bằng khoảng giá trị cùng các giả định
  - Dùng khảo sát kỹ thuật ngắn để giảm điều chưa biết
  - Đánh giá độ đảo ngược và các phương án thay thế
  - Ghi nhận chi phí chuyển đổi, đào tạo và vận hành song song
  - Kiểm tra bằng chứng trước khi chuyển đánh giá thành cam kết
- level1: Hồ sơ khoản nợ
  level2:
  - Mô tả vấn đề bằng biểu hiện cụ thể và bằng chứng tái hiện
  - Ghi rõ phạm vi mã nguồn, hệ thống và bên bị ảnh hưởng
  - Lưu bối cảnh quyết định cùng lợi ích ngắn hạn ban đầu
  - Ghi nhận tác động, rủi ro, giả định và độ bất định
  - Xác định chủ sở hữu, người hỗ trợ và bên quyết định
  - Mô tả phương án giữ nguyên, giảm nhẹ hoặc xử lý
  - Đặt điều kiện kích hoạt xử lý và ngày rà soát
  - Định nghĩa tiêu chí hoàn thành cùng bằng chứng cần thu thập
  - Liên kết hồ sơ với issue, quyết định kiến trúc (ADR) và thay đổi liên quan
- level1: Ưu tiên xử lý
  level2:
  - Ưu tiên theo tác động đến sản phẩm và thay đổi sắp diễn ra
  - Kết hợp mức lãi, rủi ro, công sức và độ bất định
  - Tìm khoản nợ chặn nhiều công việc hoặc nhiều nhóm
  - Xem xét thứ tự phụ thuộc giữa các khoản nợ
  - Phân biệt xử lý khẩn cấp với cải tiến có thể lên lịch
  - Đánh giá lợi ích kỳ vọng và thời gian hoàn vốn với giả định rõ ràng
  - Dùng chấm điểm để hỗ trợ thảo luận thay vì tạo độ chính xác giả
  - Cân nhắc xử lý ngay khi đang thay đổi cùng khu vực mã
  - Quyết định giữ nguyên khi chi phí xử lý vượt lợi ích có thể chứng minh
- level1: Kế hoạch trả nợ
  level2:
  - Chọn mục tiêu giảm chi phí hoặc rủi ro cụ thể cho từng đợt
  - Chia công việc thành thay đổi nhỏ có thể kiểm chứng độc lập
  - Tách bước chuẩn bị, chuyển đổi và dọn bỏ giải pháp cũ
  - Lập kế hoạch theo phụ thuộc và năng lực của nhóm
  - Đưa công việc trả nợ vào kế hoạch cùng công việc sản phẩm
  - Dành năng lực xử lý theo dữ liệu và nhu cầu thay vì tỷ lệ cố định
  - Xác định điểm dừng, điều kiện quay lại và phạm vi có thể giảm
  - Dừng hoặc đổi hướng khi bằng chứng không xác nhận lợi ích
- level1: Thống nhất với sản phẩm
  level2:
  - Diễn đạt nợ bằng tác động đến giao hàng, sự cố và chi phí thay đổi
  - So sánh phương án theo lợi ích, rủi ro và thời điểm cần quyết định
  - Phân biệt cải tiến bắt buộc với cải tiến có thể trì hoãn
  - Làm rõ đánh đổi khi rút ngắn thời hạn hoặc giảm phạm vi
  - Thống nhất trách nhiệm chấp nhận rủi ro và thời hạn rà soát
  - Bảo vệ công việc giảm rủi ro mà không hứa hẹn lợi ích thiếu căn cứ
  - Báo cáo kết quả bằng bằng chứng thay vì số dòng mã đã sửa
- level1: An toàn thay đổi
  level2:
  - Lập bản đồ hành vi cần giữ và các ranh giới có tác động
  - Viết kiểm thử đặc tả hành vi hiện tại (characterization test)
  - Chọn kết quả chuẩn (golden master) và kiểm soát dữ liệu không ổn định
  - Tạo điểm tách phụ thuộc để kiểm thử mã khó thay đổi
  - Bổ sung kiểm thử hợp đồng và kiểm thử hồi quy theo mức rủi ro
  - Tách tái cấu trúc giữ nguyên hành vi khỏi thay đổi yêu cầu
  - Giữ thay đổi nhỏ để rà soát và xác định nguồn hồi quy
  - Chuẩn bị quan sát, triển khai có kiểm soát và phương án quay lui
  - Xử lý hành vi hiện tại bị lỗi bằng quyết định riêng có bằng chứng
- level1: Tái cấu trúc thiết kế
  level2:
  - Tách trách nhiệm và làm rõ ranh giới của lớp hoặc mô-đun
  - Giảm phụ thuộc vòng và thống nhất hướng phụ thuộc
  - Đưa quy tắc nghiệp vụ về nơi sở hữu phù hợp
  - Loại bỏ sao chép khi đã xác nhận phần chung ổn định
  - Thay trừu tượng sai bằng mô hình đơn giản hơn
  - Làm rõ trạng thái, tác dụng phụ và thứ tự xử lý
  - Cô lập mã phụ thuộc hạ tầng khỏi logic cần kiểm thử
  - Giảm điều kiện phân nhánh bằng mô hình phù hợp với bối cảnh
  - Xóa mã chết, cấu hình thừa và đường xử lý không còn sử dụng
  - Kiểm tra chi phí thay đổi sau tái cấu trúc thay vì chỉ đánh giá hình thức
- level1: Cải tiến kiến trúc
  level2:
  - Xác định kiến trúc đích vừa đủ cho yêu cầu đã được chứng minh
  - Tạo ranh giới chuyển tiếp để giảm phạm vi ảnh hưởng
  - Thay triển khai dần qua lớp trừu tượng (branch by abstraction)
  - Thay thế từng phần hệ thống cũ bằng hướng tiếp cận strangler fig
  - Bảo vệ mô hình nghiệp vụ bằng lớp cách ly (anti-corruption layer)
  - Giảm phụ thuộc dữ liệu và triển khai giữa các thành phần
  - Thiết kế lộ trình cùng tồn tại mà không kéo dài trạng thái trung gian
  - So sánh cải tiến từng bước với viết lại toàn bộ
  - Đặt điều kiện kết thúc chuyển đổi và loại bỏ kiến trúc tạm
- level1: Chuyển đổi hợp đồng
  level2:
  - Kiểm kê bên sử dụng API, sự kiện và cấu trúc dữ liệu
  - Mở rộng hợp đồng trước khi chuyển người sử dụng sang phiên bản mới
  - Áp dụng mở rộng rồi thu gọn (expand-contract) cho thay đổi tương thích
  - Lập kế hoạch chuyển dữ liệu và kiểm tra tính đầy đủ, nhất quán
  - Đánh giá rủi ro khi ghi song song vào hai cấu trúc
  - Đối soát kết quả giữa đường xử lý cũ và mới
  - Xử lý quay lui khi thay đổi dữ liệu không thể đảo ngược trực tiếp
  - Ngừng hỗ trợ và dọn phiên bản cũ sau khi xác nhận không còn bên sử dụng
- level1: Kiểm chứng kết quả
  level2:
  - Đối chiếu tiêu chí hoàn thành với thay đổi thực tế
  - Chứng minh hành vi được giữ qua kiểm thử và dữ liệu vận hành
  - So sánh công sức cho các thay đổi tương tự trước và sau
  - Đánh giá giảm phụ thuộc, giảm thao tác thủ công và tăng khả năng kiểm thử
  - Kiểm tra chi phí hoặc rủi ro có bị chuyển sang nhóm khác hay không
  - Phát hiện khoản nợ mới phát sinh từ giải pháp trả nợ
  - Chỉ đóng hồ sơ khi đã dọn đường chuyển tiếp và cập nhật tài liệu
  - Tiếp tục theo dõi để kiểm chứng lợi ích không chỉ xuất hiện tạm thời
- level1: Phòng ngừa tích lũy
  level2:
  - Đưa tiêu chí bảo trì và khả năng kiểm thử vào định nghĩa hoàn thành
  - Rà soát thiết kế tại các ranh giới có ảnh hưởng lớn
  - Ghi quyết định, giả định và thời hạn cho giải pháp tạm thời
  - Dùng kiểm thử kiến trúc để bảo vệ hướng phụ thuộc đã thống nhất
  - Thiết lập cổng kiểm soát chất lượng phù hợp với bối cảnh dự án
  - Giữ phản hồi xây dựng và kiểm thử đủ nhanh để được sử dụng
  - Cập nhật kiến thức và chia sẻ trách nhiệm bảo trì
  - Kiểm chứng mã viết tay, mã sinh và mã do AI hỗ trợ theo cùng tiêu chuẩn
  - Tránh phòng ngừa bằng khuôn mẫu hoặc trừu tượng vượt nhu cầu
- level1: Quản trị vòng đời
  level2:
  - Quản lý danh mục nợ có phạm vi và chủ sở hữu rõ ràng
  - Rà soát khoản nợ theo lịch và khi điều kiện kích hoạt xuất hiện
  - Gắn nợ với quyết định kiến trúc và kế hoạch tiến hóa sản phẩm
  - Quy định ai có thể tạo, chấp nhận, trì hoãn và đóng khoản nợ
  - Kiểm soát ngoại lệ và gia hạn giải pháp tạm thời
  - Loại bỏ hồ sơ trùng, lỗi thời hoặc không còn tác động
  - Xử lý khoản nợ vượt ranh giới nhóm bằng trách nhiệm phối hợp
  - Điều chỉnh cơ chế khuyến khích để không thưởng việc tạo nợ rồi sửa nợ
- level1: Đo lường bền vững
  level2:
  - Thiết lập đường cơ sở trước khi triển khai chương trình giảm nợ
  - Theo dõi chi phí thay đổi và thời gian phản hồi của nhóm
  - Theo dõi lỗi lặp lại, công việc làm lại và gián đoạn do thiết kế
  - Đối chiếu chỉ số cấu trúc mã với trải nghiệm bảo trì thực tế
  - Theo dõi tốc độ phát sinh, xử lý và tái xuất hiện của khoản nợ
  - Phân biệt số lượng hồ sơ nợ với mức nợ và rủi ro thực tế
  - Kiểm soát tác động của thay đổi phạm vi đo hoặc công cụ phân tích
  - Tránh dùng một điểm chất lượng duy nhất để xếp hạng đội ngũ
- level1: Sai lầm thường gặp
  level2:
  - Gọi mọi phần mã không thích là nợ mà thiếu bằng chứng
  - Đồng nhất mọi cảnh báo phân tích tĩnh với công việc phải sửa
  - Chỉ ưu tiên công việc dễ làm để tăng số lượng khoản nợ đã đóng
  - Cam kết giảm chi phí bằng ước lượng không có giả định và đường cơ sở
  - Viết lại toàn bộ để né việc hiểu hành vi hệ thống cũ
  - Để lớp chuyển tiếp, cờ tính năng và nhánh tương thích tồn tại vô thời hạn
  - Trì hoãn nợ mãi hoặc yêu cầu xóa sạch nợ trước khi phát triển tiếp
  - Biến trả nợ thành tranh luận cá nhân và bỏ qua mục tiêu sản phẩm
  - Tối ưu chỉ số bằng cách đổi quy tắc đo hoặc che cảnh báo
- level1: Thực hành có hướng dẫn
  level2:
  - Nhận diện dấu hiệu nợ trong một mô-đun có nhiều lý do thay đổi
  - Thu thập bằng chứng từ lịch sử sửa lỗi và yêu cầu tính năng
  - Lập hồ sơ nợ với giả định, chủ sở hữu và tiêu chí hoàn thành
  - So sánh các khoản nợ bằng tác động, rủi ro và công sức
  - Xây dựng kiểm thử hành vi trước khi tách trách nhiệm
  - Loại bỏ phụ thuộc vòng qua các bước thay đổi nhỏ
  - Lập kế hoạch chuyển đổi hợp đồng có giai đoạn cùng tồn tại
  - Đo kết quả trước và sau rồi quyết định đóng hoặc tiếp tục
  - Viết ADR giải thích khoản nợ được chấp nhận cùng điều kiện rà soát
- level1: Tình huống tổng hợp
  level2:
  - Giải pháp tạm để kiểm chứng sản phẩm trở thành nền tảng sử dụng lâu dài
  - Mô-đun trung tâm làm mọi tính năng mới phải sửa nhiều nơi
  - Khoản nợ ít gây lỗi nhưng liên tục làm chậm giao hàng
  - Nợ kiểm thử khiến một thay đổi thiết kế nhỏ có rủi ro cao
  - Nhiều dịch vụ phải triển khai cùng nhau vì dùng chung dữ liệu
  - Nâng cấp nền tảng bị chặn bởi tùy biến và phụ thuộc cũ
  - Chương trình trả nợ hoàn thành nhiều việc nhưng không giảm chi phí
  - Checklist đánh giá quyết định giữ nguyên, giảm nhẹ, xử lý hoặc loại bỏ
