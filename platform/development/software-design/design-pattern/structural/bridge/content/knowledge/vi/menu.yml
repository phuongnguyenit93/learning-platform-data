menu:
  - level1: "Tổng quan Bridge"
    level2:
      - "Ý định của Bridge: tách abstraction và implementation thành hai chiều biến thể độc lập"
      - "Vai trò của Bridge trong nhóm mẫu thiết kế cấu trúc"
      - "Vấn đề bùng nổ lớp con khi kết hợp nhiều chiều thay đổi bằng kế thừa"
      - "Composition làm cầu nối giữa hành vi cấp cao và cách triển khai"
      - "Ý nghĩa của abstraction và implementation trong Bridge so với từ khóa của Java"
      - "Lợi ích về khả năng mở rộng, thay thế và kiểm thử"
      - "Chi phí về số thành phần, mức gián tiếp và độ phức tạp thiết kế"
      - "Dấu hiệu nên cân nhắc Bridge và trường hợp thiết kế đơn giản đã đủ"
  - level1: "Hai chiều biến thể"
    level2:
      - "Nhận diện chiều chức năng cấp cao và chiều công nghệ triển khai"
      - "Lập ma trận các tổ hợp abstraction và implementation từ yêu cầu"
      - "Phân biệt hai chiều biến thể với các thuộc tính cấu hình thông thường"
      - "Phân tích cách số lớp tổ hợp tăng theo tích của hai chiều khi dùng kế thừa"
      - "Ước lượng số lớp và mã phối hợp khi chuyển sang hai hệ phân cấp riêng"
      - "Tìm phần ổn định, phần thay đổi và các điểm phụ thuộc chéo"
      - "Đánh giá tính độc lập của hai chiều qua các kịch bản thay đổi cụ thể"
      - "Xử lý ma trận không đầy đủ khi chỉ một số tổ hợp có ý nghĩa"
  - level1: "Cấu trúc Bridge"
    level2:
      - "Abstraction: cung cấp API cấp cao và giữ tham chiếu đến Implementor"
      - "RefinedAbstraction: mở rộng hành vi cấp cao trên cùng hợp đồng triển khai"
      - "Implementor: khai báo các thao tác phục vụ phía abstraction"
      - "ConcreteImplementor: hiện thực các thao tác cho từng cách triển khai"
      - "Client: lựa chọn tổ hợp và tương tác qua abstraction"
      - "Quan hệ kế thừa bên trong từng chiều và composition giữa hai chiều"
      - "Đọc sơ đồ lớp UML và ánh xạ từng vai trò sang mã Java"
      - "Phân biệt bộ khung Bridge với việc ghép hai interface không có hai chiều biến thể"
  - level1: "Luồng cộng tác"
    level2:
      - "Theo dõi lời gọi từ client qua abstraction đến concrete implementation"
      - "Kết hợp nhiều thao tác triển khai để tạo một hành vi cấp cao"
      - "Phân chia trách nhiệm điều phối và thực thi trong một ca sử dụng"
      - "Giữ chi tiết backend phía sau hợp đồng triển khai"
      - "Mô tả trình tự tương tác bằng sơ đồ sequence"
      - "Xác định bên sở hữu trạng thái và tránh lưu trùng dữ liệu"
      - "Thiết kế kết quả trả về và cách lỗi đi qua cầu nối"
      - "Kiểm tra luồng cộng tác khi thay implementation mà giữ nguyên thao tác của client"
  - level1: "Hợp đồng triển khai"
    level2:
      - "Chọn tập thao tác nguyên thủy vừa đủ cho các abstraction dự kiến"
      - "Thiết kế interface Implementor có độ kết dính cao và ít phụ thuộc"
      - "Tách API nghiệp vụ cấp cao khỏi API triển khai mà không buộc chúng giống nhau"
      - "Biểu diễn đầu vào và kết quả bằng kiểu dữ liệu ổn định trong Java"
      - "Quy định tiền điều kiện, hậu điều kiện và các bất biến chung"
      - "Chuẩn hóa ngữ nghĩa lỗi giữa những implementation khác nhau"
      - "Tránh để kiểu dữ liệu, ngoại lệ và tài nguyên đặc thù backend rò rỉ qua hợp đồng"
      - "Tách hợp đồng theo năng lực khi một interface buộc nhiều implementation có phương thức rỗng"
  - level1: "Phía abstraction"
    level2:
      - "Xác định API mà client cần và ranh giới hành vi cấp cao"
      - "Lựa chọn abstract class, interface hoặc lớp cụ thể theo nhu cầu chia sẻ hành vi"
      - "Giữ tham chiếu Implementor ở phạm vi truy cập phù hợp"
      - "Xây dựng RefinedAbstraction bằng cách phối hợp các thao tác triển khai"
      - "Bảo vệ bất biến nghiệp vụ khi bổ sung abstraction mới"
      - "Áp dụng nguyên tắc thay thế Liskov trong hệ phân cấp abstraction"
      - "Tránh kiểm tra kiểu concrete implementation trong hành vi cấp cao"
      - "Giới hạn độ sâu kế thừa và tách trách nhiệm khi abstraction trở nên quá lớn"
  - level1: "Phía implementation"
    level2:
      - "Xây dựng ConcreteImplementor cho từng backend hoặc công nghệ"
      - "Đóng gói chi tiết thư viện, giao thức và định dạng dữ liệu bên trong implementation"
      - "Bảo đảm các implementation tuân thủ cùng ngữ nghĩa hợp đồng"
      - "Tái sử dụng mã giữa các implementation mà không tạo phụ thuộc ngược"
      - "Phân biệt trạng thái riêng của backend với trạng thái nghiệp vụ của abstraction"
      - "Thiết kế implementation không trạng thái và implementation có trạng thái"
      - "Giới hạn phụ thuộc của implementation vào client và RefinedAbstraction"
      - "Thêm implementation mới với tác động tối thiểu đến các thành phần hiện có"
  - level1: "Triển khai Java"
    level2:
      - "Dựng ví dụ Bridge tối thiểu với interface Implementor và hai concrete implementation"
      - "Khai báo Abstraction và RefinedAbstraction với constructor injection"
      - "Dùng composition và delegation trong thân phương thức Java"
      - "Kiểm tra tham số đầu vào và giữ tham chiếu implementation bằng final khi phù hợp"
      - "Tổ chức package cho API cấp cao, hợp đồng triển khai và backend cụ thể"
      - "Ghép các đối tượng tại điểm khởi tạo ứng dụng"
      - "Chạy các tổ hợp bằng mã client dùng chung API abstraction"
      - "Đọc toàn bộ ví dụ Java và đối chiếu mã nguồn với các vai trò Bridge"
  - level1: "Ví dụ hình vẽ"
    level2:
      - "Phân tích yêu cầu nhiều loại hình và nhiều cơ chế kết xuất"
      - "Nhận diện Shape là abstraction và Renderer là hợp đồng triển khai"
      - "Thiết kế các thao tác vẽ nguyên thủy phục vụ Circle và Rectangle"
      - "Hiện thực VectorRenderer và RasterRenderer theo cùng hợp đồng"
      - "Kết nối từng loại hình với từng renderer bằng constructor"
      - "Bổ sung loại hình mới mà không sửa các renderer đã đủ năng lực"
      - "Bổ sung renderer mới và kiểm tra các loại hình hiện có"
      - "Phân tích giới hạn độc lập khi loại hình mới cần thêm thao tác kết xuất"
  - level1: "Ví dụ điều khiển"
    level2:
      - "Phân tích yêu cầu nhiều loại điều khiển và nhiều loại thiết bị"
      - "Thiết kế Device với hợp đồng nguồn điện, âm lượng và trạng thái"
      - "Xây dựng BasicRemote và AdvancedRemote trên cùng hợp đồng Device"
      - "Hiện thực Television và Radio với trạng thái riêng của từng thiết bị"
      - "Triển khai thao tác mute bằng cách phối hợp các thao tác của Device"
      - "Ghép và sử dụng các tổ hợp điều khiển với thiết bị trong Java"
      - "Xử lý thiết bị thiếu năng lực mà một loại điều khiển yêu cầu"
      - "So sánh cấu trúc Bridge với phương án tạo lớp điều khiển riêng cho từng thiết bị"
  - level1: "Khởi tạo và thay thế"
    level2:
      - "Chọn implementation tại điểm lắp ráp đối tượng theo cấu hình ứng dụng"
      - "Ưu tiên constructor injection khi tổ hợp được cố định theo vòng đời đối tượng"
      - "Dùng Factory để tập trung logic lựa chọn backend"
      - "Tích hợp dependency injection mà không buộc Bridge phụ thuộc framework"
      - "Phân biệt khả năng thay implementation bằng cấu hình với thay trực tiếp khi đang chạy"
      - "Thiết kế setter hoặc thao tác chuyển đổi chỉ khi thực sự cần thay động"
      - "Kiểm tra tương thích và chuyển trạng thái khi thay implementation đang sử dụng"
      - "Quy định quyền sở hữu và giải phóng implementation cũ sau khi chuyển đổi"
  - level1: "Mở rộng và tương thích"
    level2:
      - "Thêm RefinedAbstraction bằng các thao tác đã có trong hợp đồng"
      - "Thêm ConcreteImplementor mà không sửa các abstraction đang hoạt động"
      - "Phân tích phạm vi thay đổi khi hợp đồng Implementor cần mở rộng"
      - "Thiết kế hợp đồng năng lực để diễn đạt các tổ hợp được hỗ trợ"
      - "Kiểm tra và từ chối sớm tổ hợp abstraction với implementation không hợp lệ"
      - "Dùng generic khi ràng buộc kiểu giúp biểu diễn tính tương thích rõ ràng hơn"
      - "Duy trì tương thích nguồn và hành vi khi tiến hóa API Java"
      - "Giới hạn cam kết mở rộng độc lập khi hai chiều vẫn có ràng buộc nghiệp vụ"
  - level1: "Refactor kế thừa"
    level2:
      - "Nhận diện cây kế thừa đang mã hóa đồng thời hai chiều biến thể"
      - "Lập danh sách lớp tổ hợp và tìm mã triển khai bị lặp"
      - "Phân loại phương thức theo trách nhiệm cấp cao và trách nhiệm backend"
      - "Chọn đường cắt để tách một chiều thành interface Implementor"
      - "Thiết lập bất biến và hành vi cần giữ trước khi di chuyển mã"
      - "Lập bản đồ lớp cũ sang tổ hợp đối tượng Bridge tương ứng"
      - "Chọn thứ tự chuyển đổi từng nhánh để giảm phạm vi thay đổi"
      - "Đánh giá kết quả refactor bằng số điểm sửa đổi và mức giảm mã lặp"
  - level1: "Refactor mã Java"
    level2:
      - "Viết kiểm thử đặc trưng để ghi nhận hành vi của mã Java hiện tại"
      - "Trích xuất Implementor từ thao tác triển khai đang nằm trong lớp con"
      - "Di chuyển mã backend sang các ConcreteImplementor"
      - "Thay lời gọi kế thừa bằng delegation qua tham chiếu implementation"
      - "Giữ hành vi cấp cao trong Abstraction và RefinedAbstraction"
      - "Chuyển constructor, factory và nơi sử dụng sang cách lắp ráp mới"
      - "Duy trì lớp tương thích tạm thời khi cần giữ API cũ cho client"
      - "Loại bỏ lớp tổ hợp dư thừa sau khi kiểm thử hồi quy và so sánh hành vi"
  - level1: "Bridge và Adapter"
    level2:
      - "So sánh mục tiêu tách hai chiều biến thể của Bridge với chuyển đổi giao diện của Adapter"
      - "Phân tích bối cảnh thiết kế chủ động và tích hợp thành phần có giao diện không tương thích"
      - "Đối chiếu vai trò Abstraction, Implementor, Target và Adaptee"
      - "Giải thích vì sao cấu trúc composition tương tự chưa đủ để xác định cùng một mẫu"
      - "So sánh ví dụ Java dùng Bridge với ví dụ chuyển đổi API bằng Adapter"
      - "Dùng Adapter bên trong ConcreteImplementor để bọc thư viện có sẵn"
      - "Nhận diện tình huống cần Adapter nhưng chưa cần hai hệ phân cấp của Bridge"
      - "Lập tiêu chí lựa chọn Bridge, Adapter hoặc kết hợp cả hai theo vấn đề thực tế"
  - level1: "Bridge và Strategy"
    level2:
      - "So sánh hai chiều abstraction và implementation với họ thuật toán thay thế của Strategy"
      - "Đối chiếu vai trò Abstraction và Implementor với Context và Strategy"
      - "Phân tích ý định thiết kế khi cả hai mẫu đều dùng interface và delegation"
      - "Giải thích vì sao thay đối tượng khi chạy không phải tiêu chí riêng của Bridge hay Strategy"
      - "So sánh ví dụ Java tách backend với ví dụ thay thuật toán xử lý"
      - "Nhận diện trường hợp một chiều thuật toán chỉ cần Strategy"
      - "Kết hợp Strategy trong abstraction hoặc implementation để thay một thuật toán nội bộ"
      - "Đánh giá thiết kế có nhiều cách diễn giải bằng yêu cầu thay đổi và trách nhiệm thực tế"
  - level1: "Kết hợp mẫu khác"
    level2:
      - "Bridge và Decorator: tách chiều triển khai và bổ sung hành vi bằng lớp bọc"
      - "Bridge và Facade: phân biệt API đơn giản hóa với cấu trúc hai chiều biến thể"
      - "Bridge và Template Method: phối hợp hành vi bằng composition và bằng kế thừa"
      - "Bridge và Abstract Factory: khởi tạo các thành phần thuộc một họ tương thích"
      - "Bridge và Factory Method: cung cấp điểm tạo implementation cho lớp sử dụng"
      - "Bridge và Proxy: kiểm soát truy cập đến implementation qua cùng hợp đồng"
      - "Bridge và Composite: áp dụng cùng backend triển khai cho cấu trúc đối tượng dạng cây"
      - "Đặt Bridge trong kiến trúc phân lớp và đánh giá ranh giới với Ports and Adapters"
  - level1: "Kiểm thử Bridge"
    level2:
      - "Kiểm thử đơn vị abstraction bằng fake hoặc stub Implementor"
      - "Kiểm tra kết quả nghiệp vụ thay vì phụ thuộc quá mức vào thứ tự lời gọi nội bộ"
      - "Viết bộ kiểm thử hợp đồng dùng chung cho mọi ConcreteImplementor"
      - "Dùng kiểm thử tham số hóa JUnit để bao phủ các tổ hợp hợp lệ"
      - "Kiểm thử tích hợp với backend thật tại ranh giới triển khai"
      - "Kiểm thử lỗi, tổ hợp không tương thích và thao tác thay implementation"
      - "Kiểm thử hồi quy sau refactor để xác nhận hành vi quan sát được"
      - "Cân bằng độ bao phủ ma trận với chi phí chạy kiểm thử khi số tổ hợp lớn"
  - level1: "Vận hành an toàn"
    level2:
      - "Quản lý vòng đời tài nguyên backend với AutoCloseable khi phù hợp"
      - "Xác định bên chịu trách nhiệm mở, đóng và chia sẻ implementation"
      - "Chuyển đổi ngoại lệ kỹ thuật thành lỗi có ý nghĩa đối với abstraction"
      - "Đặt retry và timeout đúng trách nhiệm, xét tính lặp an toàn của thao tác"
      - "Phân tích an toàn luồng khi nhiều abstraction dùng chung implementation có trạng thái"
      - "Bảo đảm tính nhất quán khi thay implementation trong môi trường đồng thời"
      - "Ghi log, đo lường và truy vết qua cầu nối mà không làm rò rỉ chi tiết backend"
      - "Xử lý lỗi một phần khi một hành vi cấp cao gồm nhiều thao tác triển khai"
  - level1: "Hiệu năng và đánh đổi"
    level2:
      - "Đánh giá chi phí delegation và cấp phát đối tượng trong bối cảnh sử dụng thực tế"
      - "Chọn độ hạt thao tác để tránh quá nhiều lời gọi qua ranh giới backend"
      - "Phân tích chi phí I/O và tuần tự hóa khi implementation gọi dịch vụ từ xa"
      - "Đặt cache và xử lý theo lô ở nơi giữ đúng ngữ nghĩa hợp đồng"
      - "Cân nhắc dùng chung implementation với chi phí đồng bộ và quản lý vòng đời"
      - "Đo hiệu năng bằng kịch bản đại diện trước khi tối ưu cấu trúc Bridge"
      - "So sánh chi phí bảo trì của hai hệ phân cấp với mức giảm lớp tổ hợp"
      - "Chọn phương án đơn giản hơn khi chưa có hai chiều thay đổi đáng kể"
  - level1: "Lỗi thiết kế thường gặp"
    level2:
      - "Áp dụng Bridge chỉ vì có interface và nhiều lớp hiện thực"
      - "Chia sai hai chiều khiến mỗi abstraction phụ thuộc một concrete implementation riêng"
      - "Dùng instanceof hoặc ép kiểu backend trong abstraction để xử lý ngoại lệ thiết kế"
      - "Tạo Implementor quá rộng với nhiều thao tác không được hỗ trợ"
      - "Để abstraction và implementation gọi ngược lẫn nhau tạo phụ thuộc vòng"
      - "Giữ logic nghiệp vụ trùng lặp trong từng ConcreteImplementor"
      - "Thay implementation tùy ý làm mất trạng thái, tài nguyên hoặc bất biến"
      - "Tạo quá nhiều lớp trung gian khi composition đơn giản đã giải quyết yêu cầu"
  - level1: "Thực hành tổng hợp"
    level2:
      - "Bài tập nhận diện hai chiều biến thể từ một bộ yêu cầu Java"
      - "Bài tập vẽ sơ đồ lớp, hợp đồng và ma trận tổ hợp trước khi viết mã"
      - "Bài tập triển khai hệ thống hình vẽ với hai loại hình và hai renderer"
      - "Bài tập mở rộng điều khiển và thiết bị trong hai nhánh độc lập"
      - "Bài tập refactor cây kế thừa tổ hợp sang Bridge và giữ kiểm thử hồi quy"
      - "Bài tập lựa chọn Bridge, Adapter hoặc Strategy và giải thích bằng ý định thiết kế"
      - "Checklist review Java về hợp đồng, composition, tương thích, vòng đời và khả năng kiểm thử"
      - "Tiêu chí tự đánh giá qua một yêu cầu thêm abstraction và một yêu cầu thêm implementation"
