      - "Bài tập đổi thứ tự decorator và giải thích dấu vết lời gọi khi thành công hoặc thất bại"
      - "Bài tập client đọc dữ liệu với cache và retry theo hợp đồng cụ thể"
      - "Bài tập stream đếm byte có chuyển tiếp đầy đủ và đóng tài nguyên đúng cách"
      - "Bài tập tái cấu trúc hệ phân cấp tổ hợp tính năng thành chuỗi wrapper"
      - "Bài tập kiểm thử hợp đồng và đo tác động hiệu năng theo độ dài chuỗi"
