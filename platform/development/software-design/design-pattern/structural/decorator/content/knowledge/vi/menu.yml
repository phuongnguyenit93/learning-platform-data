menu:
  - level1: "Bản chất Decorator"
    level2:
      - "Ý định của Decorator: bổ sung hành vi cho từng đối tượng bằng wrapper cùng giao diện"
      - "Vị trí của Decorator trong nhóm mẫu thiết kế cấu trúc"
      - "Mô hình tư duy đối tượng lõi được bao bọc bởi nhiều lớp hành vi"
      - "Phân biệt mở rộng hành vi bằng composition với mở rộng kiểu bằng kế thừa"
      - "Tính trong suốt khi client làm việc qua giao diện chung"
      - "Tính linh hoạt của việc cấu hình chuỗi tại thời điểm chạy"
      - "Lợi ích và chi phí của việc chia hành vi thành nhiều wrapper nhỏ"
      - "Phân biệt mẫu Decorator với annotation và cú pháp decorator ở ngôn ngữ khác"
  - level1: "Khi nào sử dụng"
    level2:
      - "Bài toán bùng nổ số lớp khi kết hợp nhiều tính năng bằng kế thừa"
      - "Nhu cầu bật tắt hành vi tùy theo từng đối tượng hoặc từng luồng xử lý"
      - "Dấu hiệu một lớp đang gánh quá nhiều trách nhiệm bổ sung"
      - "Điều kiện áp dụng khi thành phần có hợp đồng giao diện ổn định"
      - "Lựa chọn giữa Decorator, kế thừa và một lớp có cấu hình đơn giản"
      - "Trường hợp không nên dùng khi hành vi không thể giữ nguyên hợp đồng"
      - "Đánh giá số tổ hợp, mức biến động và chi phí bảo trì trước khi áp dụng"
      - "Xác định mục tiêu mở rộng và tiêu chí thành công cho việc sử dụng Decorator"
  - level1: "Cấu trúc và vai trò"
    level2:
      - "Component: giao diện chung của đối tượng lõi và các decorator"
      - "ConcreteComponent: triển khai nghiệp vụ gốc trước khi được bổ sung hành vi"
      - "Decorator cơ sở: giữ tham chiếu tới Component và chuyển tiếp lời gọi"
      - "ConcreteDecorator: triển khai một trách nhiệm bổ sung cụ thể"
      - "Client: sử dụng Component mà không phụ thuộc cấu trúc chuỗi"
      - "Quan hệ composition đệ quy giữa các đối tượng cùng giao diện"
      - "Luồng gọi từ wrapper ngoài cùng tới lõi và luồng trả kết quả theo chiều ngược lại"
      - "Sơ đồ lớp và sơ đồ tuần tự của một chuỗi decorator điển hình"
      - "Các biến thể có hoặc không có lớp Decorator cơ sở"
  - level1: "Hợp đồng giao diện"
    level2:
      - "Giữ nguyên chữ ký phương thức và ý nghĩa nghiệp vụ của Component"
      - "Bảo toàn tiền điều kiện, hậu điều kiện và bất biến của đối tượng"
      - "Áp dụng nguyên lý thay thế Liskov cho wrapper và đối tượng được bọc"
      - "Quy định giá trị null, kết quả rỗng và tính hợp lệ của dữ liệu đầu vào"
      - "Giữ đúng hợp đồng ngoại lệ và nguyên nhân lỗi khi bổ sung hành vi"
      - "Bảo toàn quy ước về tác dụng phụ, tính lặp an toàn và số lần thực thi"
      - "Xác định bảo đảm về thứ tự, thời gian xử lý và tính an toàn luồng"
      - "Giới hạn của tính trong suốt đối với định danh, hiệu năng và quan sát trạng thái"
      - "Rủi ro khi decorator bổ sung phương thức riêng khiến client phải ép kiểu"
      - "Ghi rõ hành vi bổ sung nào được hợp đồng cho phép và hành vi nào làm sai ngữ nghĩa"
  - level1: "Thiết kế thành phần"
    level2:
      - "Chọn giao diện Component đủ nhỏ và phù hợp với các hành vi cần mở rộng"
      - "Tách nghiệp vụ lõi khỏi logging, đo thời gian và các trách nhiệm phụ trợ"
      - "Áp dụng nguyên lý trách nhiệm đơn nhất cho từng decorator"
      - "Áp dụng nguyên lý mở đóng mà không tạo quá nhiều lớp nhỏ thiếu ý nghĩa"
      - "Chọn interface hoặc abstract class theo nhu cầu tương thích và tái sử dụng"
      - "Thiết kế constructor nhận delegate bắt buộc và cấu hình riêng của decorator"
      - "Ưu tiên tham chiếu delegate bất biến và kiểm tra cấu hình ngay khi khởi tạo"
      - "Thiết kế điểm mở rộng cho trước lời gọi, sau lời gọi và khi kết thúc"
      - "Đặt tên decorator theo hành vi để chuỗi dễ đọc và dễ chẩn đoán"
  - level1: "Triển khai Java"
    level2:
      - "Xây dựng ví dụ xuyên suốt với giao diện dịch vụ xử lý đơn hàng và lớp nghiệp vụ lõi"
      - "Viết decorator cơ sở chuyển tiếp đầy đủ các phương thức tới delegate"
      - "Triển khai LoggingDecorator và giới hạn dữ liệu được ghi nhận"
      - "Triển khai TimingDecorator đo thời gian cho cả thành công và thất bại"
      - "Ghép LoggingDecorator và TimingDecorator quanh cùng một dịch vụ"
      - "Dùng constructor injection, trường final và Objects.requireNonNull cho delegate"
      - "Giữ an toàn kiểu với Component có generic và kết quả trả về tham số hóa"
      - "Xử lý checked exception, unchecked exception và khối try-finally"
      - "Chuyển tiếp phương thức default, phương thức overload và các phương thức mới của giao diện"
      - "Minh họa giới hạn của lời gọi nội bộ khi đối tượng lõi tự gọi phương thức của chính nó"
  - level1: "Lắp ráp chuỗi"
    level2:
      - "Biểu diễn chuỗi lồng nhau và xác định wrapper ngoài cùng"
      - "Lắp ráp chuỗi trực tiếp bằng constructor với thứ tự dễ kiểm tra"
      - "Dùng factory để tập trung quy tắc tạo và cấu hình chuỗi"
      - "Dùng builder khi có nhiều decorator tùy chọn và ràng buộc thứ tự"
      - "Bật tắt decorator theo cấu hình mà vẫn giữ kiểu Component cho client"
      - "Tạo chuỗi riêng cho từng đối tượng, yêu cầu xử lý hoặc nhóm cấu hình"
      - "Ngăn bọc trùng, cấu hình thiếu và các tổ hợp decorator không tương thích"
      - "Kiểm soát việc chia sẻ một delegate giữa nhiều chuỗi độc lập"
      - "Thay đổi chuỗi bằng cách tạo cấu hình mới và quản lý đối tượng đang được sử dụng"
      - "Công khai cấu trúc chuỗi phục vụ chẩn đoán mà không buộc client phụ thuộc triển khai"
  - level1: "Thứ tự xử lý"
    level2:
      - "Lần theo thứ tự thực thi trước delegate, trong delegate và sau delegate"
      - "Phân biệt thứ tự cấu tạo chuỗi với thứ tự đi vào và đi ra của lời gọi"
      - "Giải thích vì sao hai decorator thường không có tính giao hoán"
      - "So sánh đo thời gian toàn chuỗi với đo riêng phần xử lý bên trong"
      - "So sánh logging cho từng lần retry với logging cho toàn bộ thao tác"
      - "Phân tích thứ tự giữa kiểm tra quyền, cache và truy cập dữ liệu theo hợp đồng"
      - "Phân tích thứ tự giữa nén, mã hóa, đệm và ghi dữ liệu"
      - "Phân biệt hậu xử lý khi thành công với dọn dẹp luôn chạy trong finally"
      - "Xác định vị trí short-circuit và tác động khi delegate không được gọi"
      - "Mô tả ràng buộc thứ tự bằng bảng luồng và kiểm thử thứ tự sự kiện"
  - level1: "Trạng thái và định danh"
    level2:
      - "Phân biệt trạng thái của đối tượng lõi với trạng thái riêng của decorator"
      - "Giới hạn tính bất biến khi delegate vẫn là đối tượng có thể thay đổi"
      - "Quản lý bộ đếm, bộ đệm và dữ liệu tích lũy theo đúng phạm vi sống"
      - "Phân biệt cùng tham chiếu, tương đương nghiệp vụ và cùng đối tượng được bọc"
      - "Thiết kế equals và hashCode để tránh phá vỡ tính đối xứng và nhất quán"
      - "Thiết kế toString hữu ích khi chuỗi có nhiều lớp wrapper"
      - "Cân nhắc unwrap có kiểm soát và nguy cơ bỏ qua hành vi bắt buộc"
      - "Đánh giá nhu cầu sao chép hoặc tuần tự hóa cả chuỗi và trạng thái cấu hình"
  - level1: "Vòng đời tài nguyên"
    level2:
      - "Xác định decorator có sở hữu delegate và chịu trách nhiệm giải phóng tài nguyên hay không"
      - "Triển khai AutoCloseable khi Component có hợp đồng quản lý tài nguyên"
      - "Dùng try-with-resources với wrapper ngoài cùng của chuỗi"
      - "Quy định chuyển tiếp close và tránh đóng lặp khi delegate được dùng chung"
      - "Giữ đúng ngữ nghĩa flush, close và hoàn tất dữ liệu đang đệm"
      - "Xử lý lỗi trong lúc đóng và bảo toàn suppressed exception"
      - "Dọn tài nguyên đã tạo khi việc khởi tạo chuỗi bị thất bại giữa chừng"
      - "Phát hiện rò rỉ do chuỗi giữ tham chiếu lâu hơn vòng đời cần thiết"
      - "Thiết kế kiểm thử quyền sở hữu, thứ tự đóng và giải phóng tài nguyên khi có lỗi"
  - level1: "Lỗi và tác dụng phụ"
    level2:
      - "Phân biệt lỗi từ decorator với lỗi từ thành phần được bọc"
      - "Bảo toàn stack trace và chuỗi nguyên nhân khi cần chuyển đổi ngoại lệ"
      - "Tránh để lỗi logging hoặc đo lường che mất lỗi nghiệp vụ gốc"
      - "Quy định fail-open hoặc fail-closed theo trách nhiệm và hợp đồng của decorator"
      - "Chỉ áp dụng retry khi thao tác đáp ứng yêu cầu về tính lặp an toàn"
      - "Kiểm soát số lần gọi delegate và nguy cơ thực hiện tác dụng phụ nhiều lần"
      - "Thiết kế cache theo khóa, phạm vi, thời hạn và quy tắc vô hiệu hóa"
      - "Phân tích ranh giới giao dịch và tác động khi decorator thất bại sau khi delegate thành công"
      - "Bảo vệ dữ liệu nhạy cảm trong log, cache và thông tin chẩn đoán của chuỗi"
  - level1: "Đồng thời và bất đồng bộ"
    level2:
      - "Đánh giá an toàn luồng của toàn chuỗi từ decorator tới delegate"
      - "Phân biệt decorator không trạng thái với decorator có trạng thái dùng chung"
      - "Bảo vệ bộ đếm và bộ đệm bằng cơ chế đồng bộ phù hợp"
      - "Xác định phạm vi khóa khi delegate có thể chậm, gọi lại hoặc gọi lồng nhau"
      - "Tránh giả định trường delegate final làm toàn bộ chuỗi trở nên an toàn luồng"
      - "Giữ hợp đồng hoàn tất của Component trả về CompletionStage hoặc CompletableFuture"
      - "Đo thời gian đến khi hoàn tất bất đồng bộ thay vì chỉ đo thời gian tạo tác vụ"
      - "Truyền ngữ cảnh truy vết và xử lý mất ngữ cảnh khi chuyển luồng"
      - "Làm rõ timeout, hủy tác vụ và truyền lỗi theo khả năng thực tế của delegate"
  - level1: "Decorator trong Java I/O"
    level2:
      - "Nhận diện các vai trò Component và wrapper trong họ InputStream và OutputStream"
      - "Khảo sát FilterInputStream và FilterOutputStream như nền tảng chuyển tiếp"
      - "Phân tích BufferedInputStream và BufferedOutputStream khi bổ sung hành vi đệm"
      - "Phân tích DataInputStream và DataOutputStream khi bổ sung thao tác với kiểu dữ liệu"
      - "Khảo sát wrapper trong họ Reader và Writer với dữ liệu ký tự"
      - "Phân biệt chuyển đổi byte sang ký tự của InputStreamReader với việc trang trí cùng giao diện"
      - "Ghép chuỗi đệm, nén và mã hóa theo thứ tự đọc ghi tương ứng"
      - "Giữ đúng hợp đồng read, write, EOF, skip và mark-reset khi tự viết wrapper"
      - "Kiểm tra đường đi của phương thức đơn lẻ và phương thức xử lý mảng để tránh đếm hoặc xử lý lặp"
      - "Viết stream decorator theo dõi số byte cùng kiểm thử flush và close"
  - level1: "Ứng dụng thực tế"
    level2:
      - "Bổ sung logging cho dịch vụ qua giao diện mà không sửa nghiệp vụ lõi"
      - "Đo số lần gọi, thời gian và lỗi cho client gọi hệ thống bên ngoài"
      - "Trang trí repository bằng cache khi hợp đồng đọc và nhất quán dữ liệu cho phép"
      - "Bao bọc client bằng retry có giới hạn và chính sách backoff phù hợp"
      - "Áp dụng kiểm tra quyền ở wrapper và kiểm soát đường truy cập trực tiếp tới delegate"
      - "Giới hạn tốc độ hoặc số tác vụ đồng thời theo hợp đồng đã công bố"
      - "Bổ sung nén và mã hóa cho luồng dữ liệu có quy ước định dạng rõ ràng"
      - "Mở rộng bộ xuất báo cáo với kiểm tra dữ liệu và thu thập thông tin xử lý"
      - "Mô hình hóa tùy chọn đồ uống để minh họa tổ hợp hành vi và cách tính giá"
      - "Đánh giá giới hạn của từng ứng dụng khi làm thay đổi tính nhất quán hoặc kết quả quan sát được"
  - level1: "Tích hợp Java"
    level2:
      - "Đăng ký đối tượng lõi và chuỗi decorator trong composition root"
      - "Lắp ráp decorator bằng dependency injection và phân biệt rõ từng delegate"
      - "Tránh phụ thuộc vòng và lỗi tự tiêm decorator vào chính nó"
      - "Chọn scope phù hợp cho decorator có trạng thái và delegate được chia sẻ"
      - "Kiểm soát thứ tự khi chuỗi được tạo từ danh sách thành phần cấu hình"
      - "Phân biệt decorator viết tay với hành vi được gắn bằng AOP hoặc dynamic proxy"
      - "Nhận diện nguy cơ bọc hai lần khi kết hợp decorator với cơ chế chặn lời gọi của framework"
      - "Kiểm thử cấu hình lắp ráp thực tế để xác nhận client nhận đúng chuỗi mong muốn"
  - level1: "Kiểm thử hợp đồng"
    level2:
      - "Xây dựng bộ kiểm thử hợp đồng dùng chung cho Component lõi và các wrapper"
      - "Dùng delegate giả để kiểm tra tham số được chuyển tiếp chính xác"
      - "Kiểm tra kết quả trả về, giá trị null và các trường hợp biên"
      - "Kiểm tra ngoại lệ, nguyên nhân lỗi và thông tin bị bổ sung hoặc chuyển đổi"
      - "Xác nhận delegate được gọi đúng số lần theo từng chính sách hành vi"
      - "Kiểm tra tiền điều kiện, hậu điều kiện và bất biến sau khi bọc"
      - "Kiểm thử hành vi trước lời gọi, sau thành công và trong khối dọn dẹp"
      - "Kiểm tra các phương thức ít dùng và phương thức mới để tránh chuyển tiếp thiếu"
      - "Kiểm thử equals, hashCode và các ràng buộc định danh khi có áp dụng"
      - "Sử dụng JUnit và mock hoặc fake có chủ đích để kiểm tra hành vi quan sát được"
  - level1: "Kiểm thử chuỗi"
    level2:
      - "Dùng dấu vết sự kiện để xác minh thứ tự vào và ra qua từng wrapper"
      - "So sánh hai thứ tự decorator trên cùng dữ liệu và cùng delegate"
      - "Thiết kế ma trận kiểm thử các tổ hợp có rủi ro thay vì kiểm tra mù mọi hoán vị"
      - "Kiểm tra decorator tùy chọn, bọc trùng và các tổ hợp bị cấm"
      - "Kiểm thử lỗi tại từng tầng và tác động lên các tầng còn lại"
      - "Dùng đồng hồ và bộ lập lịch điều khiển được cho timing, cache và retry"
      - "Kiểm tra trạng thái dùng chung, gọi đồng thời và hoàn tất bất đồng bộ"
      - "Kiểm thử tích hợp client với factory hoặc cấu hình dependency injection thực tế"
  - level1: "Hiệu năng và đo lường"
    level2:
      - "Lập mô hình chi phí chuyển tiếp lời gọi và độ sâu của chuỗi decorator"
      - "Phân biệt chi phí tạo chuỗi, cấp phát đối tượng và chi phí mỗi lần gọi"
      - "Đánh giá tác động lên bộ nhớ, thời gian sống đối tượng và áp lực thu gom rác"
      - "Đo riêng chi phí logging, đo lường, đồng bộ, mã hóa và truy cập cache"
      - "Thiết kế benchmark JMH so sánh delegate trực tiếp với các độ dài chuỗi"
      - "Kiểm soát warmup, fork, dữ liệu đầu vào và tránh loại bỏ tính toán trong benchmark"
      - "Nhận biết ảnh hưởng của JIT và inlining mà không giả định lời gọi wrapper luôn miễn phí"
      - "Đánh giá throughput, độ trễ phân vị và tranh chấp dưới tải gần thực tế"
      - "Dùng profiler và Java Flight Recorder để xác định tầng gây tốn thời gian hoặc cấp phát"
      - "Đặt ngân sách chi phí, giảm wrapper dư thừa và đo lại sau mỗi thay đổi có mục tiêu"
  - level1: "So sánh các mẫu"
    level2:
      - "Decorator và Proxy: so sánh mục đích bổ sung hành vi với kiểm soát truy cập"
      - "Decorator và Adapter: so sánh giữ nguyên giao diện với chuyển đổi giao diện"
      - "Decorator và Composite: so sánh chuỗi bao bọc với cấu trúc cây thành phần"
      - "Decorator và Strategy: so sánh chồng hành vi với thay thế thuật toán"
      - "Decorator và Chain of Responsibility: so sánh bọc lời gọi với chuyển quyền xử lý"
      - "Decorator và Facade: so sánh mở rộng một Component với đơn giản hóa hệ thống con"
      - "Decorator và Template Method: so sánh composition đối tượng với điểm mở rộng bằng kế thừa"
      - "Decorator và AOP: so sánh cấu hình wrapper tường minh với cơ chế chặn lời gọi"
      - "Decorator và hàm bậc cao: xác định khi nào một wrapper hàm đã đủ cho bài toán"
  - level1: "Tái cấu trúc"
    level2:
      - "Nhận diện hệ phân cấp lớp đang nở ra theo các tổ hợp tính năng"
      - "Ghi nhận hành vi hiện có bằng kiểm thử trước khi thay đổi cấu trúc"
      - "Trích xuất giao diện chung và thành phần thực hiện nghiệp vụ lõi"
      - "Tách từng trách nhiệm phụ trợ thành decorator có hợp đồng rõ ràng"
      - "Chuyển cấu hình tổ hợp từ kế thừa sang factory lắp ráp wrapper"
      - "Di chuyển client từng bước để sử dụng giao diện Component"
      - "Xác minh tương thích kết quả, ngoại lệ, tài nguyên và hiệu năng sau chuyển đổi"
      - "Đơn giản hóa hoặc gộp decorator khi chi phí trừu tượng vượt lợi ích mở rộng"
  - level1: "Lỗi thiết kế thường gặp"
    level2:
      - "Quên chuyển tiếp một phần giao diện khiến wrapper hoạt động không nhất quán"
      - "Gọi delegate hai lần hoặc vô tình bỏ qua delegate"
      - "Dùng kế thừa để vừa bọc vừa truy cập trạng thái nội bộ của lớp cụ thể"
      - "Để client ép kiểu hoặc unwrap thường xuyên làm rò rỉ cấu trúc chuỗi"
      - "Giấu phụ thuộc thứ tự trong constructor hoặc cấu hình khó quan sát"
      - "Chia hành vi thành quá nhiều lớp mỏng khiến chuỗi khó hiểu và khó gỡ lỗi"
      - "Chia sẻ decorator có trạng thái giữa các yêu cầu mà thiếu cơ chế bảo vệ"
      - "Lặp logging, retry hoặc cache do nhiều tầng cùng bổ sung một hành vi"
      - "Bỏ qua quyền sở hữu tài nguyên và làm thay đổi hợp đồng đóng hoặc hủy"
  - level1: "Thực hành tổng hợp"
    level2:
