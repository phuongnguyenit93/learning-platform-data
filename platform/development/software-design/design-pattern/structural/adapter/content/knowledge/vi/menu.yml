menu:
  - level1: "Tổng quan Adapter"
    level2:
      - "Mục đích của Adapter và bài toán kết nối các giao diện không tương thích"
      - "Adapter trong nhóm mẫu cấu trúc và ý nghĩa của tên gọi Wrapper"
      - "Mục tiêu tái sử dụng thư viện hoặc hệ thống cũ mà không sửa mã client"
      - "Phạm vi chuyển đổi giao diện, dữ liệu và hành vi của lớp chuyển tiếp"
      - "Dấu hiệu cần Adapter khi tích hợp thành phần do bên khác quản lý"
      - "Lợi ích, chi phí gián tiếp và giới hạn của việc thêm lớp chuyển tiếp"
      - "Điều kiện áp dụng khi có thể bổ sung Adapter nhưng không thể sửa Adaptee"
      - "Lộ trình học từ ví dụ tối giản đến tích hợp SDK và hệ thống cũ"
  - level1: "Bài toán tương thích"
    level2:
      - "Không tương thích về tên phương thức và cấu trúc tham số"
      - "Không tương thích về kiểu trả về và cách biểu diễn kết quả"
      - "Không tương thích về đơn vị đo, định dạng và quy ước dữ liệu"
      - "Không tương thích về ngữ nghĩa dù chữ ký phương thức giống nhau"
      - "Không tương thích về ngoại lệ và cách thông báo thất bại"
      - "Không tương thích về thứ tự gọi và vòng đời đối tượng"
      - "Không tương thích giữa lời gọi đồng bộ và cơ chế callback"
      - "Khảo sát khả năng chuyển đổi trước khi cam kết giữ nguyên hợp đồng client"
  - level1: "Cấu trúc Adapter"
    level2:
      - "Vai trò Client và nhu cầu làm việc thông qua giao diện Target"
      - "Vai trò Target trong việc mô tả khả năng mà client cần"
      - "Vai trò Adaptee và giao diện sẵn có cần được tích hợp"
      - "Vai trò Adapter trong việc hiện thực Target và sử dụng Adaptee"
      - "Luồng gọi từ Client qua Adapter đến Adaptee và luồng trả kết quả"
      - "Sơ đồ lớp và sơ đồ trình tự cho một thao tác chuyển tiếp"
      - "Quyền sở hữu đối tượng và hướng phụ thuộc giữa các thành phần"
      - "Phân biệt hợp đồng công khai của Target với chi tiết nội bộ của Adaptee"
  - level1: "Hợp đồng giao diện"
    level2:
      - "Thiết kế Target theo nhu cầu client và ngôn ngữ của miền nghiệp vụ"
      - "Xác định tiền điều kiện, hậu điều kiện và bất biến cần bảo toàn"
      - "Lập bảng ánh xạ từng thao tác của Target sang khả năng của Adaptee"
      - "Xác định thao tác không được hỗ trợ và cách biểu đạt giới hạn rõ ràng"
      - "Giữ nguyên ý nghĩa thành công, thất bại và tác dụng phụ quan sát được"
      - "Bảo toàn quy tắc null, giá trị rỗng và dữ liệu mặc định trong hợp đồng"
      - "Phân chia Target theo Interface Segregation để tránh ép buộc khả năng"
      - "Áp dụng Liskov Substitution khi thay thành phần cũ bằng Adapter"
  - level1: "Object Adapter"
    level2:
      - "Cấu trúc Object Adapter dựa trên composition và delegation"
      - "Hiện thực Target bằng interface và giữ tham chiếu đến Adaptee trong Java"
      - "Truyền Adaptee qua constructor và kiểm tra phụ thuộc bắt buộc"
      - "Chuyển tham số đầu vào, gọi Adaptee và ánh xạ kết quả trả về"
      - "Tích hợp lớp final hoặc thành phần không cho phép kế thừa"
      - "Thay thế các hiện thực Adaptee thông qua cấu hình và dependency injection"
      - "Tách trạng thái của Adapter khỏi trạng thái của đối tượng được bọc"
      - "Đánh giá ưu điểm, hạn chế và khả năng kiểm thử của Object Adapter"
  - level1: "Class Adapter"
    level2:
      - "Cấu trúc Class Adapter dựa trên kế thừa để tiếp cận hành vi Adaptee"
      - "Đa kế thừa trong mô hình kinh điển và giới hạn đơn kế thừa lớp của Java"
      - "Hiện thực Adapter bằng extends Adaptee và implements Target trong Java"
      - "Điều kiện Target là interface và Adaptee cho phép kế thừa"
      - "Ảnh hưởng của constructor, phạm vi truy cập và phương thức final"
      - "Sử dụng super và ghi đè có kiểm soát khi cần hiệu chỉnh hành vi"
      - "Rủi ro phụ thuộc vào lớp cha và rò rỉ API kế thừa ra bên ngoài"
      - "Những tình huống Class Adapter không thể áp dụng hoặc khó bảo trì"
  - level1: "Biến thể Adapter"
    level2:
      - "So sánh Object Adapter và Class Adapter theo mức độ phụ thuộc"
      - "So sánh khả năng thay Adaptee, tái sử dụng và kiểm thử giữa hai cách"
      - "Adapter một chiều cho nhu cầu client chỉ sử dụng một hợp đồng"
      - "Adapter hai chiều và điều kiện bảo toàn ý nghĩa khi chuyển đổi ngược"
      - "Adapter có thể cấu hình bằng chiến lược ánh xạ được truyền vào"
      - "Dùng lambda hoặc method reference cho phép chuyển tiếp đơn giản trong Java"
      - "Phối hợp nhiều Adaptee khi một thao tác Target cần nhiều nguồn dữ liệu"
      - "Tiêu chí chọn biến thể và giới hạn độ phức tạp của lớp chuyển tiếp"
  - level1: "Chuyển đổi dữ liệu"
    level2:
      - "Ánh xạ DTO của SDK hoặc hệ thống cũ sang kiểu dữ liệu của Target"
      - "Chuyển tên trường, cấu trúc lồng nhau và trường dữ liệu tùy chọn"
      - "Chuyển kiểu số, kiểm soát tràn số và mất độ chính xác"
      - "Chuyển đơn vị đo, tiền tệ và quy tắc làm tròn bằng BigDecimal"
      - "Chuyển ngày giờ, múi giờ và định dạng bằng Java Time API"
      - "Ánh xạ enum, mã trạng thái và giá trị chưa biết để tránh diễn giải sai"
      - "Xử lý null, Optional, collection rỗng và phần tử không hợp lệ"
      - "Bảo vệ dữ liệu bằng defensive copy, kiểu bất biến và quy tắc chuyển đổi mất mát"
  - level1: "Chuyển đổi hành vi"
    level2:
      - "Chuẩn hóa ý nghĩa thao tác khi Target và Adaptee có quy ước khác nhau"
      - "Ghép nhiều lời gọi Adaptee để đáp ứng một phương thức Target"
      - "Tách một thao tác tổng hợp của Adaptee thành các khả năng Target cần"
      - "Chuyển phân trang, đánh số trang và cơ chế cursor giữa hai giao diện"
      - "Phân biệt dữ liệu tải ngay, tải lười và số lượng lời gọi phát sinh"
      - "Giữ đúng thứ tự kết quả và quy tắc xử lý phần tử trùng lặp"
      - "Xác định giới hạn nguyên tử và xử lý thành công từng phần khi ghép thao tác"
      - "Nhận diện chuyển đổi không thể bảo toàn ngữ nghĩa để điều chỉnh hợp đồng"
  - level1: "Thiết kế Java"
    level2:
      - "Tổ chức Target, Adapter, Adaptee và lớp ánh xạ trong các package rõ trách nhiệm"
      - "Dùng interface và constructor injection để client chỉ phụ thuộc Target"
      - "Chọn kiểu tham số và kết quả nhằm tránh lộ lớp của thư viện ngoài"
      - "Xử lý generics và wildcard mà không dựa vào ép kiểu thiếu an toàn"
      - "Sử dụng record hoặc lớp giá trị bất biến cho dữ liệu qua ranh giới tích hợp"
      - "Tách mapper dùng chung khi logic ánh xạ đủ lớn hoặc có nhiều Adapter"
      - "Khởi tạo Adapter qua factory và cấu hình thay vì rải new trong client"
      - "Cung cấp Javadoc mô tả ánh xạ, giới hạn và tác dụng phụ cần biết"
  - level1: "Lỗi và ngoại lệ"
    level2:
      - "Phân loại lỗi đầu vào, lỗi nghiệp vụ, lỗi hạ tầng và lỗi chuyển đổi"
      - "Chuyển checked exception và unchecked exception theo hợp đồng Target"
      - "Ánh xạ mã lỗi của Adaptee sang ngoại lệ hoặc kiểu kết quả của miền nghiệp vụ"
      - "Giữ nguyên nguyên nhân gốc khi bọc ngoại lệ để hỗ trợ chẩn đoán"
      - "Phân biệt không tìm thấy, kết quả rỗng và hệ thống bên ngoài gặp lỗi"
      - "Xử lý dữ liệu phản hồi thiếu trường, sai định dạng hoặc vượt miền giá trị"
      - "Quy định lỗi được thử lại và điều kiện idempotency trước khi retry"
      - "Tránh nuốt lỗi, trả dữ liệu mặc định sai nghĩa hoặc lộ thông tin nhạy cảm"
  - level1: "Tài nguyên và trạng thái"
    level2:
      - "Phân định bên tạo, bên sở hữu và bên đóng tài nguyên của Adaptee"
      - "Áp dụng AutoCloseable và try-with-resources khi Adapter sở hữu tài nguyên"
      - "Quản lý kết nối, stream và handle được trả qua ranh giới Adapter"
      - "Xử lý lỗi trong quá trình mở, sử dụng và đóng tài nguyên"
      - "Chọn Adapter không trạng thái hoặc có trạng thái theo vòng đời tích hợp"
      - "Đánh giá thread safety của Adaptee trước khi chia sẻ Adapter giữa các luồng"
      - "Bảo vệ trạng thái khả biến và tránh chia sẻ dữ liệu theo từng yêu cầu"
      - "Kiểm soát scope trong dependency injection và hành vi khi ứng dụng dừng"
  - level1: "Đồng bộ và bất đồng bộ"
    level2:
      - "Chuyển callback thành CompletableFuture và hoàn tất kết quả đúng một lần"
      - "Chuyển kết quả bất đồng bộ sang hợp đồng đồng bộ với thời gian chờ hữu hạn"
      - "Truyền lỗi từ callback hoặc future về cơ chế lỗi của Target"
      - "Ánh xạ timeout và phân biệt timeout cục bộ với tác vụ vẫn đang chạy"
      - "Truyền yêu cầu hủy xuống Adaptee khi có hỗ trợ và mô tả giới hạn hủy"
      - "Bảo toàn tín hiệu interruption khi có thao tác chặn trong Java"
      - "Quản lý executor và tránh chặn luồng event loop trong lớp chuyển tiếp"
      - "Chuyển luồng dữ liệu có xét backpressure và giới hạn bộ đệm khi cần"
  - level1: "Tích hợp SDK"
    level2:
      - "Định nghĩa Target ổn định trước API do nhà cung cấp SDK kiểm soát"
      - "Bọc SDK lưu trữ, thanh toán hoặc gửi thông báo bằng Object Adapter"
      - "Ánh xạ request, response và exception của SDK tại ranh giới tích hợp"
      - "Cấp cấu hình, thông tin xác thực và endpoint mà không gắn cứng trong Adapter"
      - "Xác định quyền sở hữu SDK client và khả năng tái sử dụng kết nối"
      - "Phối hợp timeout, retry và rate limit với cơ chế có sẵn của SDK"
      - "Hỗ trợ nhiều nhà cung cấp bằng các Adapter cùng hiện thực một Target"
      - "Khoanh vùng thay đổi khi nâng phiên bản SDK hoặc thay nhà cung cấp"
  - level1: "Kết nối hệ thống cũ"
    level2:
      - "Khảo sát API, kiểu dữ liệu và hành vi thực tế của hệ thống legacy"
      - "Tạo Target quanh ca sử dụng mới và giữ nguyên giao diện legacy"
      - "Chuyển mã ký tự, định dạng ngày và các giá trị sentinel của dữ liệu cũ"
      - "Bọc thủ tục, hàm tĩnh hoặc API trạng thái bằng một ranh giới có thể thay thế"
      - "Chuẩn hóa mã trả về và lỗi vốn không được biểu diễn bằng ngoại lệ"
      - "Ghi nhận hành vi thực tế bằng characterization test trước khi chuyển tiếp"
      - "Khoanh vùng tác dụng phụ và giới hạn giao dịch không thể thay đổi"
      - "Thay dần hệ thống cũ qua Target mà vẫn giữ hợp đồng của client"
  - level1: "Vai trò kiến trúc"
    level2:
      - "Đặt Adapter tại ranh giới giữa ứng dụng và hệ thống bên ngoài"
      - "Áp dụng Dependency Inversion để nghiệp vụ không phụ thuộc SDK"
      - "Liên hệ Target với port và Adapter với thành phần tích hợp trong kiến trúc hexagonal"
      - "Phân biệt Adapter đầu vào và Adapter đầu ra qua hướng tương tác"
      - "Liên hệ với Anti-Corruption Layer khi cần bảo vệ ngữ nghĩa miền nghiệp vụ"
      - "Giới hạn trách nhiệm giữa Adapter, application service và logic nghiệp vụ"
      - "Quản lý nhiều Adapter bằng composition root và cấu hình triển khai"
      - "Tổ chức module để kiểu dữ liệu của nhà cung cấp không lan vào lõi ứng dụng"
  - level1: "Kiểm thử đơn vị"
    level2:
      - "Xây dựng bộ kiểm thử theo hợp đồng Target thay vì chi tiết triển khai"
      - "Dùng JUnit với stub, fake hoặc mock Adaptee cho các tình huống xác định"
      - "Kiểm tra ánh xạ tham số và chuyển đổi dữ liệu trả về bằng ví dụ cụ thể"
      - "Kiểm tra giá trị biên, null, dữ liệu rỗng và mã trạng thái chưa biết"
      - "Kiểm tra ánh xạ ngoại lệ cùng nguyên nhân gốc và thông tin lỗi"
      - "Xác minh thứ tự gọi và số lần gọi khi chúng là yêu cầu của hợp đồng"
      - "Dùng parameterized test hoặc property-based test cho các quy tắc chuyển đổi"
      - "Kiểm tra đóng tài nguyên, tính cô lập trạng thái và hành vi hủy khi có hỗ trợ"
  - level1: "Kiểm thử tích hợp"
    level2:
      - "Chạy contract test chung cho các Adapter cùng hiện thực một Target"
      - "Kiểm tra với SDK thật, sandbox hoặc môi trường kiểm thử của hệ thống ngoài"
      - "Dùng fixture và phản hồi đã ghi để tái hiện dữ liệu legacy đặc trưng"
      - "Kiểm chứng serialization và deserialization tại ranh giới thư viện"
      - "Mô phỏng timeout, mất kết nối, lỗi tạm thời và phản hồi sai hợp đồng"
      - "Kiểm tra tác dụng phụ, idempotency và kết quả sau thành công từng phần"
      - "Kiểm tra cạnh tranh luồng và vòng đời tài nguyên trong điều kiện tích hợp"
      - "Phát hiện thay đổi không tương thích khi nâng SDK hoặc đổi phiên bản hệ thống"
  - level1: "Hiệu năng và vận hành"
    level2:
      - "Đo chi phí ánh xạ, cấp phát đối tượng và số lần gọi qua Adapter"
      - "Nhận diện lỗi N+1 do chuyển tiếp theo từng phần tử hoặc từng trang"
      - "Dùng xử lý theo lô khi bảo toàn được thứ tự, lỗi và tác dụng phụ của Target"
      - "Kiểm soát sao chép dữ liệu và bộ nhớ khi chuyển tập dữ liệu lớn"
      - "Ghi log có ngữ cảnh, mã tương quan và dữ liệu đã được che phù hợp"
      - "Theo dõi độ trễ, tỷ lệ lỗi và tracing ở ranh giới gọi hệ thống ngoài"
      - "Đặt retry, circuit breaker hoặc cache đúng lớp để tránh chính sách chồng chéo"
      - "Chẩn đoán lỗi thuộc client, lớp chuyển đổi hay hệ thống được tích hợp"
  - level1: "Tái cấu trúc với Adapter"
    level2:
      - "Nhận diện lời gọi SDK hoặc legacy đang rải rác trong mã client"
      - "Ghi nhận hành vi hiện tại và xác định hợp đồng cần giữ ổn định"
      - "Trích xuất Target tối thiểu từ nhu cầu thực tế của các client"
      - "Đưa mã chuyển đổi đang lặp vào một Object Adapter tập trung"
      - "Chuyển điểm khởi tạo và cung cấp phụ thuộc sang composition root"
      - "Thay lần lượt các điểm tích hợp và kiểm chứng hành vi sau mỗi bước"
      - "Dùng cấu hình lựa chọn hiện thực và chuẩn bị khả năng quay lại khi cần"
      - "Loại bỏ phụ thuộc thư viện ngoài khỏi client sau khi hoàn tất chuyển đổi"
  - level1: "So sánh mẫu thiết kế"
    level2:
      - "Adapter và Bridge theo thời điểm thiết kế và mục đích tách các chiều thay đổi"
      - "Adapter và Decorator theo mục đích đổi giao diện hoặc bổ sung hành vi"
      - "Adapter và Facade theo mục đích tương thích hoặc đơn giản hóa một hệ thống"
      - "Adapter và Proxy theo mục đích đổi hợp đồng hoặc kiểm soát truy cập"
      - "Adapter và Strategy theo vai trò tích hợp hoặc thay thế thuật toán"
      - "Adapter và Mapper theo trách nhiệm chuyển tiếp hành vi hoặc chỉ đổi dữ liệu"
      - "Adapter và Composite khi client cần hợp đồng thống nhất cho nhiều đối tượng"
      - "Phối hợp các mẫu có chủ đích và nhận diện trách nhiệm của từng lớp bọc"
  - level1: "Lỗi thiết kế thường gặp"
    level2:
      - "Tạo Adapter khi hai giao diện đã tương thích và không có nhu cầu chuyển đổi"
      - "Sao chép toàn bộ API nhà cung cấp thành Target mà bỏ qua nhu cầu client"
