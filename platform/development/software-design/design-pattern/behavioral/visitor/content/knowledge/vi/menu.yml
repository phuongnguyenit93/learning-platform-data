menu:
  - level1: "Tổng quan"
    level2:
      - "Ý định của Visitor: tách thao tác khỏi các lớp phần tử trong một cấu trúc đối tượng"
      - "Nhận diện Visitor trong nhóm mẫu hành vi và phân biệt thao tác với dữ liệu được xử lý"
      - "Vai trò của double dispatch trong việc chọn xử lý theo loại phần tử và loại visitor"
      - "Các tình huống ứng dụng: cây đối tượng, AST, xuất báo cáo, kiểm tra và chuyển đổi dữ liệu"
      - "Lợi ích khi thêm nhiều thao tác cho một hệ phân cấp phần tử tương đối ổn định"
      - "Chi phí phụ thuộc giữa phần tử và visitor khi xuất hiện loại phần tử mới"
      - "Dấu hiệu nên cân nhắc Visitor và trường hợp thiết kế đơn giản hơn đã đáp ứng nhu cầu"
      - "Kiến thức nền: kế thừa, interface, đa hình, overload, override và cấu trúc cây trong Java"
  - level1: "Bài toán mở rộng"
    level2:
      - "Mô hình hóa hai chiều thay đổi: thêm loại phần tử và thêm thao tác trên các phần tử"
      - "Phân tích cách đặt mọi thao tác trong lớp phần tử khiến lớp phình to và khó bảo trì"
      - "Nhận diện chuỗi instanceof hoặc switch lặp lại ở nhiều chức năng xử lý đối tượng"
      - "Đánh giá giới hạn của đa hình thông thường khi cần thêm thao tác mà không sửa từng phần tử"
      - "Liên hệ bài toán mở rộng dữ liệu và thao tác với nguyên lý đóng mở trong từng chiều thay đổi"
      - "Lập ma trận phần tử và thao tác để xác định phạm vi xử lý và phần còn thiếu"
      - "Khảo sát tần suất thay đổi của hệ phân cấp trước khi chọn Visitor làm điểm mở rộng"
      - "Xác định ranh giới nghiệp vụ để tránh gom những thao tác không liên quan vào cùng visitor"
  - level1: "Cấu trúc Visitor"
    level2:
      - "Element khai báo accept để một phần tử tiếp nhận visitor"
      - "ConcreteElement triển khai accept và chuyển chính nó đến overload visit tương ứng"
      - "Visitor khai báo tập phương thức visit cho các loại phần tử cần hỗ trợ"
      - "ConcreteVisitor đóng gói một thao tác xuyên qua nhiều loại phần tử"
      - "ObjectStructure lưu trữ hoặc cung cấp khả năng duyệt các phần tử"
      - "Client lựa chọn visitor, khởi tạo ngữ cảnh và kích hoạt quá trình xử lý"
      - "Theo dõi sơ đồ cộng tác từ client qua accept đến visit và kết quả trả về"
      - "Phân định trách nhiệm xử lý nghiệp vụ, duyệt cấu trúc và quản lý vòng đời visitor"
  - level1: "Double dispatch"
    level2:
      - "Phân biệt overload được chọn khi biên dịch và override được chọn khi chạy trong Java"
      - "Lần điều phối thứ nhất: gọi accept theo kiểu thực tế của phần tử qua tham chiếu Element"
      - "Lần điều phối thứ hai: gọi triển khai visit của visitor sau khi xác định overload theo kiểu phần tử"
      - "Giải thích vì sao visitor.visit(element) với biến kiểu Element không tự chọn overload của kiểu con"
      - "Phân tích kiểu tĩnh của this trong accept và ảnh hưởng đến overload visit được chọn"
      - "Nhận diện lỗi lớp con kế thừa accept khiến nó bị xử lý như lớp cha"
      - "Lần theo bảng lời gọi khi kết hợp nhiều ConcreteElement với nhiều ConcreteVisitor"
      - "Làm rõ double dispatch được mô phỏng bằng hai lần gọi đa hình trong Java"
  - level1: "Hợp đồng accept"
    level2:
      - "Thiết kế chữ ký accept nhất quán giữa interface phần tử và các lớp triển khai"
      - "Đặt accept tại từng loại phần tử cần điều phối riêng thay vì dùng một triển khai chung sai kiểu"
      - "Xác định cách xử lý lớp trừu tượng trung gian và nhóm phần tử có chung hành vi"
      - "Lựa chọn accept chỉ điều phối hoặc đồng thời duyệt con và ghi rõ hợp đồng"
      - "Quy định kết quả, tham số ngữ cảnh và ngoại lệ mà accept chuyển tiếp từ visitor"
      - "Quy định visitor null, phần tử tùy chọn và các điều kiện hợp lệ trước khi gọi accept"
      - "Giới hạn logic trong accept để tránh trộn thuật toán nghiệp vụ vào lớp phần tử"
      - "Đánh giá phụ thuộc từ mô hình phần tử đến hợp đồng Visitor và tác động tới kiến trúc"
  - level1: "Cài đặt Java"
    level2:
      - "Xây dựng ví dụ tối thiểu gồm Element, hai ConcreteElement và một Visitor"
      - "Khai báo các overload visit có kiểu phần tử cụ thể và triển khai accept tương ứng"
      - "Cài đặt hai ConcreteVisitor để thể hiện nhiều thao tác trên cùng tập phần tử"
      - "Tổ chức interface và lớp theo package để thể hiện rõ mô hình dữ liệu và các thao tác"
      - "Sử dụng @Override và kiểm tra chữ ký để phát hiện nhầm overload với override"
      - "Gọi accept thông qua biến kiểu Element và tập hợp các phần tử khác loại"
      - "Khởi tạo visitor tại client và đưa các phụ thuộc nghiệp vụ cần thiết vào constructor"
      - "Đọc luồng chạy hoàn chỉnh và đối chiếu kết quả của từng cặp phần tử với visitor"
  - level1: "Kết quả và ngữ cảnh"
    level2:
      - "So sánh Visitor trả void, trả kết quả trực tiếp và tích lũy kết quả trong trạng thái nội bộ"
      - "Thiết kế Visitor<R, C> và accept dùng tham số kiểu để truyền kết quả cùng ngữ cảnh"
      - "Giữ kiểu trả về thống nhất giữa các overload và mô hình hóa kết quả khác dạng khi cần"
      - "Truyền bảng ký hiệu, cấu hình và môi trường đánh giá bằng đối tượng ngữ cảnh rõ ràng"
      - "Tổng hợp kết quả từ các nút con bằng phép cộng, nối, ánh xạ hoặc kiểu kết quả có cấu trúc"
      - "Quản lý khởi tạo, đọc và đặt lại bộ tích lũy khi visitor có trạng thái"
      - "Biểu diễn kết quả vắng mặt, lỗi nghiệp vụ và nhiều chẩn đoán mà không lạm dụng null"
      - "Nhận diện giới hạn type erasure và overload khi thiết kế các interface Visitor tổng quát"
  - level1: "Duyệt cấu trúc"
    level2:
      - "So sánh trách nhiệm duyệt đặt trong visitor, trong phần tử hoặc trong bộ duyệt riêng"
      - "Chọn thứ tự tiền tự, hậu tự hoặc trung tự theo phụ thuộc giữa kết quả cha và con"
      - "Phân biệt duyệt theo chiều sâu và chiều rộng khi triển khai thao tác trên cây"
      - "Dùng ngăn xếp tường minh để xử lý cấu trúc sâu mà không phụ thuộc hoàn toàn vào đệ quy"
      - "Thiết kế cơ chế bỏ qua nhánh, dừng sớm và đoản mạch khi đã có kết quả"
      - "Nhận diện cây, DAG và đồ thị có chu trình để chọn chính sách thăm nút phù hợp"
      - "Theo dõi đường đi và tập nút đã thăm theo định danh đối tượng khi cấu trúc có chia sẻ"
      - "Quy định thứ tự duyệt ổn định và hành vi khi cấu trúc bị thay đổi trong lúc xử lý"
  - level1: "Cây đối tượng"
    level2:
      - "Mô hình hóa cây thư mục trong bộ nhớ với các phần tử tệp, thư mục và liên kết"
      - "Kết hợp Composite để biểu diễn quan hệ cha con và Visitor để bổ sung thao tác"
      - "Cài đặt SizeVisitor tính dung lượng với chính sách rõ ràng cho thư mục và liên kết"
      - "Cài đặt ReportVisitor tạo báo cáo thụt lề theo độ sâu và đường dẫn phần tử"
      - "Cài đặt ExportVisitor chuyển cây sang biểu diễn dữ liệu phục vụ xuất JSON"
      - "Cài đặt ValidationVisitor kiểm tra tên, quan hệ cha con và các bất biến của cây"
      - "Quy định xử lý liên kết vòng, phần tử dùng chung và dữ liệu siêu thông tin chưa có"
      - "Chạy nhiều visitor trên cùng cây mẫu và đối chiếu việc tách dữ liệu khỏi các thao tác"
  - level1: "Thiết kế AST"
    level2:
      - "Phân biệt cây cú pháp trừu tượng với cây phân tích cú pháp và xác định phạm vi ví dụ"
      - "Thiết kế Expr cùng LiteralExpr, UnaryExpr, BinaryExpr, VariableExpr và CallExpr"
      - "Biểu diễn toán tử bằng kiểu dữ liệu phù hợp thay vì tạo hệ phân cấp thiếu kiểm soát"
      - "Gắn vị trí mã nguồn và siêu dữ liệu vào nút để hỗ trợ thông báo lỗi chính xác"
      - "Cân nhắc lớp bất biến, record và sealed hierarchy khi mô hình hóa nút bằng Java"
      - "Tách bước tạo AST từ parser khỏi các bước phân tích và xử lý bằng visitor"
      - "Thiết kế ExprVisitor và accept cho từng loại nút với hợp đồng trả kết quả rõ ràng"
      - "Làm rõ Visitor điều phối theo loại nút, không tự giải quyết dispatch theo cả hai toán hạng"
  - level1: "Phân tích AST"
    level2:
      - "Cài đặt EvalVisitor đánh giá biểu thức với môi trường biến và hàm được truyền vào"
      - "Cài đặt PrintVisitor in biểu thức có xét độ ưu tiên và tính kết hợp của toán tử"
      - "Cài đặt TypeCheckVisitor suy ra kiểu và phát hiện phép toán không hợp lệ"
      - "Cài đặt VariableCollectorVisitor thu thập biến tự do và tên được tham chiếu"
      - "Cài đặt DependencyVisitor xác định quan hệ phụ thuộc giữa biểu thức và các ký hiệu"
      - "Cài đặt MetricsVisitor thống kê số nút, độ sâu và tần suất xuất hiện toán tử"
      - "Quản lý phạm vi từ vựng và bảng ký hiệu khi thao tác đi qua các vùng ngữ cảnh khác nhau"
      - "Liên kết chẩn đoán với vị trí mã nguồn và tổng hợp lỗi từ nhiều nhánh AST"
  - level1: "Biến đổi AST"
    level2:
      - "Thiết kế visitor trả về Expr mới để biểu diễn thao tác biến đổi cây"
      - "So sánh sửa nút tại chỗ với tái tạo AST bất biến và tác động đến bên sử dụng"
      - "Cài đặt constant folding theo hậu tự để rút gọn các biểu thức hằng"
      - "Xây dựng quy tắc viết lại và thứ tự áp dụng khi nhiều quy tắc cùng khớp"
      - "Bảo toàn vị trí mã nguồn, siêu dữ liệu và quan hệ chia sẻ khi tạo nút thay thế"
      - "Tái sử dụng nhánh không thay đổi để giảm cấp phát nhưng vẫn giữ bất biến"
      - "Xác định điều kiện dừng khi lặp phép biến đổi đến điểm cố định"
      - "Kiểm tra bảo toàn ngữ nghĩa với tác dụng phụ, ngoại lệ, tràn số và quy tắc số thực"
  - level1: "Mở rộng thao tác"
    level2:
      - "Thêm ConcreteVisitor mới cho tập phần tử hiện có mà không thêm phương thức nghiệp vụ vào từng lớp"
      - "Ánh xạ yêu cầu thao tác mới vào toàn bộ overload để tránh bỏ sót loại phần tử"
      - "Tách các lượt phân tích thành nhiều visitor và điều phối thứ tự phụ thuộc giữa chúng"
      - "Truyền kết quả của lượt trước sang lượt sau thông qua mô hình dữ liệu trung gian rõ ràng"
      - "Kết hợp các visitor khi có thể chia sẻ lượt duyệt mà vẫn giữ độc lập ngữ nghĩa"
      - "Dùng lớp cơ sở hoặc bộ duyệt hỗ trợ để giảm mã lặp giữa nhiều thao tác"
      - "Thiết kế visitor chỉ quan tâm một số loại phần tử với hành vi mặc định được công bố"
      - "Đánh giá chi phí thêm thao tác mới về kiểm thử, phụ thuộc và khả năng tái sử dụng"
  - level1: "Thay đổi phần tử"
    level2:
      - "Theo dõi các thay đổi cần thiết khi thêm một ConcreteElement và overload visit mới"
      - "Sử dụng lỗi biên dịch để nhận diện các ConcreteVisitor chưa hỗ trợ loại phần tử bổ sung"
      - "Đánh giá cách default method làm giảm công sửa nhưng có thể che giấu xử lý thiếu"
      - "Phân biệt thêm lớp con cần hành vi riêng với lớp con có thể dùng chung xử lý của lớp cha"
      - "Phân tích tác động của việc đổi, tách hoặc hợp nhất loại nút tới các thao tác hiện có"
      - "Xây dựng kế hoạch chuyển đổi khi mô hình phần tử và visitor được phát hành độc lập"
      - "Đánh giá tương thích mã nguồn, tương thích nhị phân và tương thích hành vi của API"
      - "Quyết định giữ Visitor, điều chỉnh ranh giới hoặc đổi giải pháp khi hệ phân cấp thay đổi thường xuyên"
  - level1: "Biến thể Visitor"
    level2:
      - "Classic Visitor với hợp đồng đầy đủ và sự phụ thuộc giữa tập phần tử với tập phương thức visit"
      - "Acyclic Visitor chia nhỏ interface theo loại phần tử để giảm phụ thuộc vào một hợp đồng lớn"
      - "Chọn hành vi bỏ qua hoặc báo lỗi khi Acyclic Visitor không hỗ trợ phần tử được gặp"
      - "Reflective Visitor tra cứu phương thức theo kiểu lúc chạy và đánh đổi với an toàn kiểu"
      - "Functional Visitor biểu diễn thao tác bằng hàm hoặc lambda khi tập trường hợp đã xác định"
      - "Visitor có triển khai mặc định và rủi ro mất khả năng phát hiện trường hợp chưa xử lý"
      - "Visitor hỗ trợ enter, leave và điều khiển duyệt để phục vụ thao tác phụ thuộc đường đi"
      - "So sánh các biến thể theo độ ghép nối, phát hiện lỗi, khả năng mở rộng và chi phí vận hành"
  - level1: "So sánh giải pháp"
    level2:
      - "Visitor và đa hình trực tiếp: lựa chọn nơi đặt hành vi theo chiều mở rộng chủ yếu"
      - "Visitor và Strategy: phân biệt thao tác theo từng loại phần tử với thuật toán có thể thay thế"
      - "Visitor và Iterator: phân biệt xử lý phần tử với cung cấp thứ tự truy cập"
      - "Visitor và Composite: kết hợp thao tác bên ngoài với cấu trúc cây thống nhất"
      - "Visitor và Interpreter: phân biệt cơ chế tổ chức thao tác với việc mô hình hóa ngữ pháp"
      - "Visitor và switch theo kiểu trên sealed hierarchy: so sánh độ đầy đủ và vị trí mã xử lý"
      - "Visitor và bảng đăng ký hàm xử lý: so sánh điều phối tĩnh với đăng ký loại tại thời điểm chạy"
      - "Lập bảng quyết định theo số thao tác, độ ổn định phần tử, quyền sửa mô hình và yêu cầu an toàn kiểu"
  - level1: "Thiết kế API"
    level2:
      - "Cung cấp accessor vừa đủ cho visitor mà vẫn bảo vệ bất biến và tính đóng gói của phần tử"
      - "Chọn phạm vi truy cập cho Element, Visitor và ConcreteVisitor theo ranh giới module"
      - "Giữ mô hình miền độc lập với định dạng xuất và thư viện tích hợp bằng các visitor chuyên biệt"
      - "Đưa dịch vụ phụ trợ vào visitor qua phụ thuộc tường minh để hỗ trợ thay thế và kiểm thử"
      - "Thiết kế bộ chuyển đổi cho mô hình bên thứ ba khi không thể thêm accept trực tiếp"
      - "Quy định khả năng mở rộng visitor và phần tử đối với plugin hoặc bên sử dụng thư viện"
      - "Tránh lớp visitor cơ sở chứa quá nhiều trạng thái, hành vi mặc định và móc mở rộng khó hiểu"
      - "Tài liệu hóa kiểu kết quả, thứ tự duyệt, quyền sửa cây và khả năng tái sử dụng instance"
  - level1: "Xử lý lỗi"
    level2:
      - "Phân biệt lỗi hợp đồng, dữ liệu đầu vào không hợp lệ và lỗi nghiệp vụ trong visitor"
      - "Lựa chọn dừng ngay hoặc thu thập nhiều chẩn đoán theo nhu cầu của thao tác"
      - "Thiết kế truyền checked exception qua Visitor và accept khi API yêu cầu"
      - "Xử lý phần tử chưa được hỗ trợ bằng lỗi tường minh hoặc kết quả được quy định trước"
      - "Khôi phục ngữ cảnh và ngăn xếp đường đi khi thoát nhánh do ngoại lệ"
      - "Quy định tính hợp lệ của kết quả tích lũy một phần sau khi thao tác thất bại"
      - "Phát hiện chu trình, độ sâu vượt giới hạn và nút thiếu dữ liệu trước khi xử lý tiếp"
      - "Bổ sung đường dẫn phần tử hoặc vị trí mã nguồn vào chẩn đoán mà vẫn giữ nguyên nguyên nhân lỗi"
  - level1: "Kiểm thử"
    level2:
      - "Lập ma trận kiểm thử từng ConcreteVisitor trên tất cả loại ConcreteElement được hỗ trợ"
      - "Kiểm tra double dispatch thông qua tham chiếu kiểu Element và Visitor"
      - "Viết ca hồi quy cho lỗi overload sai kiểu và lớp con kế thừa accept không phù hợp"
      - "Xác minh thứ tự duyệt, số lần thăm, bỏ qua nhánh và dừng sớm"
      - "Kiểm tra cây rỗng, nút đơn, cây sâu, DAG dùng chung nút và đồ thị có chu trình"
      - "Kiểm tra trạng thái visitor khi tái sử dụng, khi gặp lỗi và khi được gọi lồng nhau"
      - "Kiểm thử AST bằng kết quả đánh giá, dạng in và thuộc tính bảo toàn ngữ nghĩa sau biến đổi"
      - "Thêm kiểm thử hồi quy cho thao tác mới, loại phần tử mới và chẩn đoán có vị trí lỗi"
  - level1: "Hiệu năng"
    level2:
      - "Phân tích độ phức tạp theo số nút, số cạnh và số lượt duyệt của từng thao tác"
      - "Tách chi phí điều phối phương thức khỏi chi phí thuật toán, truy cập dữ liệu và tạo kết quả"
      - "Đánh giá đệ quy, ngăn xếp tường minh và mức dùng bộ nhớ trên cây có độ sâu lớn"
      - "Giảm cấp phát trong bộ tích lũy và khi tái tạo các nhánh AST không thay đổi"
      - "Dùng memoization cho nút dùng chung khi khóa bộ nhớ đệm phản ánh đầy đủ ngữ cảnh"
      - "Cân nhắc gộp lượt duyệt hoặc phân tích tăng dần theo phụ thuộc dữ liệu và mức thay đổi"
      - "Thiết kế phép đo bằng JMH có khởi động, dữ liệu đại diện và tiêu thụ kết quả đúng cách"
      - "So sánh Visitor với các lựa chọn khác bằng số liệu thay vì giả định về tốc độ dispatch"
  - level1: "Đồng thời"
    level2:
      - "Phân biệt visitor không trạng thái với visitor có bộ tích lũy dùng riêng cho mỗi lần xử lý"
      - "Xác định điều kiện an toàn khi nhiều visitor cùng đọc một cấu trúc bất biến"
      - "Tránh chia sẻ bảng ngữ cảnh và bộ tích lũy có thể sửa giữa các luồng"
      - "Thiết kế khả năng gọi lồng nhau để xử lý cây con mà không làm hỏng trạng thái lượt duyệt ngoài"
      - "Chia lượt duyệt song song chỉ khi các nhánh độc lập và phép tổng hợp có tính chất phù hợp"
      - "Bảo đảm thứ tự kết quả khi thao tác song song nhưng đầu ra phải có tính xác định"
      - "Phối hợp hủy xử lý, truyền lỗi và thu hồi tài nguyên trong các nhánh đang chạy"
      - "Quy định quyền sửa cấu trúc và chiến lược snapshot hoặc đồng bộ khi có truy cập đồng thời"
  - level1: "Tái cấu trúc"
    level2:
      - "Khảo sát các chuỗi phân nhánh theo kiểu và xác định tập thao tác đang bị phân tán"
      - "Ghi nhận hành vi hiện tại bằng kiểm thử trước khi chuyển sang Visitor"
      - "Xác định hệ phân cấp đủ ổn định và chuẩn hóa hợp đồng Element tối thiểu"
      - "Thêm accept vào từng loại phần tử với ca kiểm thử xác nhận điều phối đúng"
      - "Chuyển một thao tác sang ConcreteVisitor và so sánh kết quả với cách cài đặt cũ"
      - "Di chuyển dần các bên gọi qua API mới và dùng bộ chuyển đổi khi cần duy trì tương thích"
      - "Loại bỏ nhánh xử lý cũ sau khi kiểm chứng đầy đủ và hợp nhất logic duyệt bị lặp"
      - "Đánh giá lại mức ghép nối và độ phức tạp để xác nhận việc tái cấu trúc mang lại giá trị"
  - level1: "Bài tập thực hành"
    level2:
      - "Xây dựng cây thư mục trong bộ nhớ và triển khai các visitor tính dung lượng, kiểm tra và xuất báo cáo"
      - "Cài đặt AST biểu thức cùng EvalVisitor và PrintVisitor trên một bộ dữ liệu mẫu chung"
      - "Bổ sung TypeCheckVisitor với bảng ký hiệu, quy tắc kiểu và chẩn đoán có vị trí"
      - "Cài đặt visitor constant folding và chứng minh kết quả trước sau bằng các ca kiểm thử phù hợp"
      - "Thêm thao tác xuất AST sang một định dạng mới và ghi nhận những lớp phải thay đổi"
      - "Thêm ConditionalExpr hoặc loại phần tử mới rồi cập nhật toàn bộ các visitor liên quan"
      - "Sửa ví dụ dispatch sai do kiểu tĩnh và accept kế thừa, kèm kiểm thử ngăn lỗi tái diễn"
      - "So sánh một bài toán bằng Visitor và switch theo kiểu, giải thích lựa chọn theo yêu cầu mở rộng"
  - level1: "Đánh giá thiết kế"
    level2:
      - "Kiểm tra mỗi loại phần tử có được điều phối tới đúng overload và đúng ConcreteVisitor hay không"
      - "Đối chiếu ma trận phần tử và thao tác với các triển khai cùng ca kiểm thử thực tế"
      - "Xác minh thao tác mới có thể bổ sung theo ranh giới mở rộng đã cam kết"
      - "Liệt kê tác động khi thêm phần tử và đánh giá khả năng chấp nhận chi phí cập nhật visitor"
      - "Rà soát hợp đồng duyệt, quản lý trạng thái, xử lý lỗi và bảo toàn bất biến của cấu trúc"
      - "Kiểm tra tính dễ đọc, mức lộ dữ liệu và phụ thuộc mà Visitor đưa vào mô hình miền"
      - "Ghi lại quyết định chọn biến thể Visitor cùng điều kiện cần xem xét lại trong tương lai"
      - "Tự đánh giá khả năng giải thích double dispatch, cài đặt trên cây hoặc AST và phân tích đánh đổi"
