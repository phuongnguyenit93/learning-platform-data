menu:
  - level1: "Tổng quan"
    level2:
      - "Bài toán phân phối yêu cầu khi thành phần gửi không biết ai sẽ xử lý"
      - "Ý tưởng chuyển yêu cầu qua một chuỗi handler có trách nhiệm riêng"
      - "Mục tiêu tách thành phần gửi khỏi logic và thứ tự xử lý cụ thể"
      - "Các tình huống phù hợp với Chain of Responsibility"
      - "Lợi ích về khả năng mở rộng, tái sử dụng và thay đổi cấu hình"
      - "Đánh đổi về khả năng truy vết, độ trễ và yêu cầu không được xử lý"
      - "Các trường hợp nên dùng lời gọi trực tiếp hoặc giải pháp đơn giản hơn"
      - "Ví dụ xuyên suốt từ tiếp nhận yêu cầu đến xử lý và trả kết quả"
  - level1: "Vai trò và cấu trúc"
    level2:
      - "Client tạo yêu cầu và gọi điểm vào của chuỗi"
      - "Handler định nghĩa giao diện tiếp nhận và xử lý yêu cầu"
      - "Concrete Handler triển khai một trách nhiệm nghiệp vụ cụ thể"
      - "Successor biểu diễn handler tiếp theo và quan hệ chuyển tiếp"
      - "Chain quản lý thứ tự thực thi và chính sách kết thúc"
      - "Request, Response và Context mang dữ liệu qua các bước"
      - "Sơ đồ lớp và sơ đồ tuần tự của một yêu cầu đi qua chuỗi"
      - "Phân biệt trách nhiệm cấu hình chuỗi với trách nhiệm xử lý yêu cầu"
  - level1: "Ngữ nghĩa xử lý"
    level2:
      - "Quyết định xử lý, chuyển tiếp hoặc dừng tại mỗi handler"
      - "Biến thể tìm handler phù hợp đầu tiên và kết thúc sau khi xử lý"
      - "Biến thể nhiều handler cùng tham gia xử lý một yêu cầu"
      - "Xử lý cục bộ rồi tiếp tục chuyển yêu cầu cho bước sau"
      - "Từ chối yêu cầu và kết thúc sớm kèm lý do rõ ràng"
      - "Phân biệt bỏ qua một handler với kết thúc toàn bộ chuỗi"
      - "Chính sách khi đi hết chuỗi mà không có handler nhận xử lý"
      - "Thứ tự xử lý trước chuyển tiếp và sau khi bước tiếp theo hoàn tất"
  - level1: "Hợp đồng handler"
    level2:
      - "Thiết kế giao diện Handler với kiểu đầu vào và đầu ra rõ ràng"
      - "Lựa chọn handler giữ tham chiếu next hoặc nhận continuation"
      - "Phân tách điều kiện có thể xử lý với hành động xử lý khi cần"
      - "Quy định quyền chuyển tiếp và số lần được gọi bước tiếp theo"
      - "Thiết kế generic để bảo toàn kiểu dữ liệu xuyên suốt chuỗi"
      - "Quy ước null, tính bất biến và trách nhiệm sửa dữ liệu yêu cầu"
      - "Công bố lỗi, tác dụng phụ và yêu cầu an toàn luồng của handler"
      - "Giữ hợp đồng nhỏ để bổ sung handler mà không sửa client"
  - level1: "Triển khai Java"
    level2:
      - "Mô hình hóa yêu cầu và kết quả cho ví dụ Java tối giản"
      - "Xây dựng interface Handler và lớp cơ sở chuyển tiếp"
      - "Triển khai các handler cụ thể với một trách nhiệm mỗi lớp"
      - "Nối chuỗi thủ công và gọi xử lý từ client"
      - "Cài đặt điểm kết thúc mặc định cho yêu cầu không được xử lý"
      - "Triển khai chuỗi bằng danh sách và bộ điều phối dùng vòng lặp"
      - "Biểu diễn handler đơn giản bằng functional interface và lambda"
      - "Đối chiếu kết quả chạy khi thay đổi thứ tự hoặc bỏ một handler"
  - level1: "Kết quả xử lý"
    level2:
      - "So sánh hợp đồng trả về void, boolean, Optional và kiểu kết quả riêng"
      - "Mô hình hóa trạng thái tiếp tục, đã xử lý, từ chối và thất bại"
      - "Tách kết quả nghiệp vụ khỏi tín hiệu điều khiển chuỗi"
      - "Mang giá trị trả về, mã lý do và metadata trong kết quả"
      - "Phân biệt yêu cầu chưa được xử lý với kết quả rỗng hợp lệ"
      - "Tổng hợp kết quả khi nhiều handler cùng đóng góp dữ liệu"
      - "Biến đổi kết quả khi luồng thực thi quay về handler trước"
      - "Chuẩn hóa ánh xạ kết quả sang phản hồi của thành phần gọi"
  - level1: "Ngữ cảnh yêu cầu"
    level2:
      - "Tách dữ liệu nghiệp vụ khỏi metadata điều khiển và quan sát"
      - "Truyền correlation ID, thông tin người gọi và thời hạn xử lý"
      - "Lựa chọn context bất biến hoặc context có thể cập nhật"
      - "Thiết kế khóa và kiểu dữ liệu để tránh context thành túi dữ liệu tùy ý"
      - "Công bố dữ liệu mỗi handler đọc, tạo mới hoặc thay đổi"
      - "Kiểm soát phụ thuộc ngầm giữa handler tạo dữ liệu và handler sử dụng"
      - "Cô lập context giữa các yêu cầu và hạn chế lưu dữ liệu nhạy cảm"
      - "Truyền context tường minh qua ranh giới thread và tác vụ bất đồng bộ"
  - level1: "Lắp ghép chuỗi"
    level2:
      - "Chọn cấu trúc danh sách handler hoặc các nút liên kết"
      - "Dùng builder để khai báo thứ tự và tạo chuỗi hợp lệ"
      - "Tách factory lắp ghép khỏi các lớp handler nghiệp vụ"
      - "Kiểm tra chuỗi rỗng, handler null và điểm kết thúc bị thiếu"
      - "Phát hiện liên kết vòng và đăng ký handler trùng ngoài chủ ý"
      - "Biểu diễn ràng buộc thứ tự giữa các handler phụ thuộc nhau"
      - "Tái sử dụng các đoạn chuỗi và chọn chuỗi theo loại yêu cầu"
      - "Kiểm tra cấu hình trước khi công bố chuỗi cho client"
  - level1: "Cấu hình động"
    level2:
      - "Đăng ký handler qua registry và ánh xạ tên cấu hình sang triển khai"
      - "Bật, tắt và sắp xếp handler bằng cấu hình hoặc feature flag"
      - "Chọn chuỗi theo tenant, chức năng hoặc thuộc tính yêu cầu"
      - "Xác thực cấu hình mới và từ chối thứ tự vi phạm phụ thuộc"
      - "Tạo snapshot bất biến để một yêu cầu dùng một phiên bản chuỗi"
      - "Thay thế tham chiếu chuỗi một cách nguyên tử khi nạp lại cấu hình"
      - "Gắn phiên bản cấu hình để truy vết và quay về chuỗi trước"
      - "Xử lý cấu hình lỗi và giữ phiên bản đang hoạt động hợp lệ"
  - level1: "Vòng đời chuỗi"
    level2:
      - "Phân biệt handler dùng chung, handler theo yêu cầu và tài nguyên đi kèm"
      - "Khởi tạo dependency và kiểm tra khả năng phục vụ trước khi nhận yêu cầu"
      - "Xác định thành phần sở hữu executor, kết nối và tài nguyên đóng được"
      - "Dọn dẹp tài nguyên trong cả luồng thành công, thất bại và hủy"
      - "Ngừng nhận yêu cầu mới và chờ yêu cầu đang chạy khi shutdown"
      - "Giải phóng phiên bản chuỗi cũ sau khi các yêu cầu sử dụng hoàn tất"
      - "Tránh rò rỉ tài nguyên khi lắp ghép hoặc khởi tạo chuỗi thất bại"
      - "Kiểm tra đóng tài nguyên đúng một lần và không đóng dependency dùng chung"
  - level1: "Kiểm tra đầu vào"
    level2:
      - "Xây dựng chuỗi validation theo cú pháp, ngữ nghĩa và quy tắc nghiệp vụ"
      - "Chọn dừng ở lỗi đầu tiên hoặc thu thập nhiều lỗi độc lập"
      - "Phân biệt làm sạch dữ liệu, chuẩn hóa và kiểm tra tính hợp lệ"
      - "Sắp xếp kiểm tra rẻ trước kiểm tra cần truy cập dịch vụ bên ngoài"
      - "Biểu diễn lỗi theo trường dữ liệu và thông báo cho thành phần gọi"
      - "Chỉ chuyển sang xử lý nghiệp vụ khi các điều kiện bắt buộc đã đạt"
      - "Kiểm soát tác dụng phụ trong handler kiểm tra đầu vào"
      - "Mở rộng bộ quy tắc mà vẫn giữ thứ tự và hợp đồng kết quả ổn định"
  - level1: "Lỗi và phục hồi"
    level2:
      - "Phân biệt từ chối nghiệp vụ, lỗi cấu hình và lỗi hạ tầng"
      - "Chọn trả về kết quả lỗi hoặc ném exception theo hợp đồng chuỗi"
      - "Xác định nơi bắt lỗi tại handler, bộ điều phối hoặc biên hệ thống"
      - "Dừng chuỗi và bảo toàn nguyên nhân khi handler thất bại"
      - "Chỉ tiếp tục sau lỗi khi chính sách và trạng thái dữ liệu cho phép"
      - "Thiết kế fallback khi handler phụ thuộc dịch vụ không khả dụng"
      - "Đặt retry đúng phạm vi để tránh chạy lại các bước đã có tác dụng phụ"
      - "Giữ nguyên lỗi gốc khi xử lý lỗi hoặc dọn dẹp tài nguyên cũng thất bại"
  - level1: "Giao dịch và tác dụng phụ"
    level2:
      - "Phân loại handler thuần tính toán và handler thay đổi trạng thái bên ngoài"
      - "Xác định ranh giới transaction của một handler hoặc toàn bộ chuỗi"
      - "Quy định commit và rollback khi chuỗi dừng sớm hoặc gặp lỗi"
      - "Áp dụng idempotency cho yêu cầu lặp lại và cơ chế retry"
      - "Trì hoãn tác dụng phụ cho đến khi các kiểm tra bắt buộc hoàn tất"
      - "Thiết kế hành động bù khi không thể rollback toàn bộ thao tác"
      - "Kiểm soát phát sự kiện sau commit và xử lý gửi lặp"
      - "Làm rõ giới hạn transaction qua thread, tác vụ async và dịch vụ từ xa"
  - level1: "Đồng thời"
    level2:
      - "Phân biệt chuỗi chạy đồng thời nhiều yêu cầu với xử lý song song các bước"
      - "Ưu tiên handler stateless và chuỗi bất biến để chia sẻ giữa các thread"
      - "Cô lập trạng thái theo yêu cầu thay vì lưu trên field của handler dùng chung"
      - "Đồng bộ hóa cache, bộ đếm và tài nguyên dùng chung khi cần"
      - "Công bố cấu hình chuỗi an toàn theo mô hình bộ nhớ Java"
      - "Giữ tính nhất quán khi thay chuỗi trong lúc yêu cầu đang chạy"
      - "Tránh lock kéo dài, deadlock và tranh chấp trên đoạn xử lý chậm"
      - "Kiểm tra race condition và rò rỉ dữ liệu giữa các yêu cầu"
  - level1: "Chuỗi bất đồng bộ"
    level2:
      - "Thiết kế AsyncHandler trả về CompletionStage của kết quả xử lý"
      - "Ghép các bước phụ thuộc bằng thenCompose và biến đổi bằng thenApply"
      - "Giữ đúng thứ tự xử lý, chuyển tiếp và dừng sớm trong chuỗi async"
      - "Chọn executor cho tác vụ tính toán và tác vụ I/O có blocking"
      - "Tránh join hoặc get làm nghẽn thread trong luồng xử lý bất đồng bộ"
      - "Truyền context và khôi phục ngữ cảnh quan sát qua các callback"
      - "Truyền lỗi và đặt ranh giới phục hồi trong CompletionStage"
      - "Chạy song song các nhánh độc lập và hợp nhất trước bước phụ thuộc"
  - level1: "Timeout và hủy"
    level2:
      - "Phân biệt timeout của một handler với thời hạn của toàn bộ yêu cầu"
      - "Truyền deadline và tính ngân sách thời gian còn lại cho bước kế tiếp"
      - "Dừng chuyển tiếp khi yêu cầu hết hạn hoặc có tín hiệu hủy"
      - "Thiết kế hủy hợp tác và xử lý interruption đúng hợp đồng"
      - "Phân biệt future hoàn tất do timeout với việc tác vụ bên dưới thực sự dừng"
      - "Truyền tín hiệu hủy đến tác vụ và lời gọi I/O có hỗ trợ"
      - "Xử lý cuộc đua giữa hoàn tất, thất bại và hủy mà không trả kết quả hai lần"
      - "Dọn dẹp tài nguyên và kiểm thử tác vụ còn chạy sau timeout"
  - level1: "Chuỗi reactive"
    level2:
      - "Ánh xạ hợp đồng handler sang publisher của kết quả xử lý"
      - "Trì hoãn thực thi đến khi subscribe và phân biệt dữ liệu rỗng với bỏ qua"
      - "Ghép handler theo thứ tự và biểu diễn kết thúc sớm trong luồng reactive"
      - "Truyền context theo subscription thay vì phụ thuộc ThreadLocal"
      - "Tách thao tác blocking khỏi luồng xử lý cần duy trì non-blocking"
      - "Áp dụng backpressure khi đầu vào là một luồng nhiều yêu cầu"
      - "Xử lý timeout, hủy và retry mà không vô tình lặp tác dụng phụ"
      - "Chọn reactive, CompletableFuture hoặc chuỗi đồng bộ theo nhu cầu thực tế"
  - level1: "Middleware web"
    level2:
      - "Ánh xạ request, response và next vào cấu trúc Chain of Responsibility"
      - "Thực thi logic trước và sau lời gọi middleware tiếp theo"
      - "Tổ chức correlation ID, kiểm tra đầu vào và xử lý endpoint trong chuỗi"
      - "Kết thúc sớm bằng phản hồi khi yêu cầu không được chấp nhận"
      - "Đặt middleware xử lý exception để bao phủ đúng phạm vi lỗi"
      - "Quản lý trạng thái response đã ghi hoặc đã commit trước khi xử lý tiếp"
      - "Bảo vệ request body dạng stream khỏi việc đọc lặp ngoài chủ ý"
      - "Xác định thứ tự middleware và kiểm tra ảnh hưởng lên phản hồi cuối cùng"
  - level1: "Servlet Filter"
    level2:
      - "Vai trò của Filter, FilterChain, ServletRequest và ServletResponse"
      - "Gọi doFilter để chuyển tiếp và trả về để kết thúc xử lý tại filter"
      - "Bọc logic trước và sau chain.doFilter bằng cơ chế dọn dẹp phù hợp"
      - "Dùng request wrapper hoặc response wrapper khi cần biến đổi dữ liệu"
      - "Cấu hình mapping, dispatcher type và thứ tự filter"
      - "Phân biệt dispatch REQUEST, FORWARD, INCLUDE, ERROR và ASYNC"
      - "Xử lý async dispatch và phân biệt lúc doFilter trả về với lúc yêu cầu hoàn tất"
      - "Tránh ghi response hai lần, gọi chain hai lần và để trạng thái request trong field"
  - level1: "Tích hợp Spring"
    level2:
      - "Đăng ký handler bằng dependency injection và lắp ghép tại configuration"
      - "Quản lý thứ tự bean và kiểm tra thứ tự thực tế của chuỗi được tạo"
      - "Tổ chức Servlet Filter và OncePerRequestFilter theo loại dispatch cần hỗ trợ"
      - "Phân biệt Servlet Filter với Spring MVC HandlerInterceptor theo vị trí thực thi"
      - "Phân biệt chọn SecurityFilterChain phù hợp với chạy các filter trong chuỗi đó"
      - "Thiết kế WebFilter và chuyển tiếp bằng WebFilterChain trong WebFlux"
      - "Kiểm soát phạm vi bean, transaction và context trong handler dùng chung"
      - "Kiểm thử tích hợp thứ tự, kết thúc sớm và xử lý lỗi của chuỗi Spring"
  - level1: "Bảo mật"
    level2:
      - "Đặt xác thực và phân quyền trước handler truy cập tài nguyên được bảo vệ"
      - "Thiết kế mặc định từ chối khi không có handler bảo mật đưa ra quyết định hợp lệ"
      - "Phân biệt handler không áp dụng với quyết định cho phép truy cập"
      - "Ngăn cấu hình động bỏ qua hoặc đảo thứ tự các kiểm tra bắt buộc"
      - "Chỉ tin danh tính và metadata đã được xác minh tại ranh giới hệ thống"
      - "Kiểm soát dữ liệu nhạy cảm trong context, exception và log"
      - "Đặt giới hạn kích thước, tốc độ và chi phí xử lý yêu cầu phù hợp"
      - "Kiểm tra đường đi lỗi, timeout và fallback không làm mất điều kiện bảo vệ"
  - level1: "Quan sát hệ thống"
    level2:
      - "Ghi nhận handler đã chạy, đã bỏ qua và nơi chuỗi kết thúc"
      - "Liên kết log bằng request ID và phiên bản cấu hình chuỗi"
      - "Đo thời gian từng handler và thời gian toàn bộ yêu cầu"
      - "Đếm kết quả thành công, từ chối, không được xử lý, lỗi và timeout"
      - "Tạo trace và span thể hiện thứ tự cùng quan hệ giữa các bước"
      - "Tách thời gian xử lý nội bộ khỏi thời gian chờ bước tiếp theo"
      - "Hạn chế cardinality của nhãn metrics và chi phí log trên đường xử lý chính"
      - "Chẩn đoán handler chậm, điểm dừng bất thường và lỗi phụ thuộc thứ tự"
  - level1: "Kiểm thử"
    level2:
      - "Unit test riêng điều kiện áp dụng và logic xử lý của từng handler"
      - "Kiểm thử hợp đồng cho hành vi chuyển tiếp, dừng và số lần gọi next"
      - "Dùng fake hoặc spy để kiểm tra thứ tự và kết quả đầu cuối của chuỗi"
      - "Bao phủ chuỗi rỗng, không handler phù hợp, cấu hình lỗi và liên kết vòng"
      - "Kiểm tra exception, fallback, retry và bảo toàn tác dụng phụ hợp lệ"
      - "Kiểm thử async, timeout và hủy bằng cơ chế điều khiển thời gian phù hợp"
      - "Kiểm tra nhiều yêu cầu đồng thời và thay cấu hình khi đang xử lý"
      - "Kiểm thử tích hợp web cho phản hồi sớm, dispatch và response đã commit"
  - level1: "Hiệu năng"
    level2:
      - "Phân tích chi phí tuyến tính theo số handler thực sự được đi qua"
      - "Đặt kiểm tra rẻ và có khả năng loại bỏ cao ở vị trí hợp lệ về ngữ nghĩa"
      - "So sánh chuỗi liên kết đệ quy với bộ điều phối dùng vòng lặp"
      - "Giảm cấp phát context, sao chép dữ liệu và tạo callback không cần thiết"
      - "Giới hạn hàng đợi, concurrency và số tác vụ đang chờ để tránh quá tải"
      - "Phân biệt tăng throughput nhiều yêu cầu với giảm latency của một yêu cầu"
      - "Đo CPU bằng JMH và đo tải tích hợp khi chuỗi có I/O hoặc framework"
      - "Theo dõi phân vị độ trễ, lỗi và mức sử dụng tài nguyên trước khi tối ưu"
  - level1: "So sánh mẫu"
    level2:
      - "Chain of Responsibility và Strategy trong cách chọn thuật toán xử lý"
      - "Chain of Responsibility và Decorator trong bọc hành vi và điều khiển chuyển tiếp"
      - "Chain of Responsibility và pipeline trong kết thúc sớm và xử lý qua nhiều bước"
      - "Chain of Responsibility và Command trong biểu diễn hành động và phân phối yêu cầu"
      - "Chain of Responsibility và Observer trong truyền sự kiện cho nhiều bên nhận"
      - "Chain of Responsibility và State trong quyết định hành vi theo trạng thái"
      - "Chain of Responsibility và rule engine trong quản lý nhiều điều kiện nghiệp vụ"
      - "Chuỗi tuyến tính và workflow có nhánh, lưu trạng thái hoặc kéo dài nhiều bước"
  - level1: "Anti-pattern"
    level2:
      - "Biến chuỗi thành tập hợp handler làm quá nhiều trách nhiệm"
      - "Dựa vào thứ tự ngầm và dữ liệu context không có hợp đồng"
      - "Nuốt exception rồi chuyển tiếp khiến yêu cầu có trạng thái không hợp lệ"
      - "Quên gọi next, gọi next nhiều lần hoặc tạo vòng lặp chuyển tiếp"
      - "Dùng null hoặc boolean mơ hồ cho nhiều loại kết quả khác nhau"
      - "Chia sẻ trạng thái request trong singleton và sửa chuỗi khi đang duyệt"
      - "Retry toàn bộ chuỗi khiến thanh toán, ghi dữ liệu hoặc phát sự kiện bị lặp"
      - "Lạm dụng chuỗi cho luồng đơn giản hoặc dùng nó thay mọi cơ chế phân nhánh"
  - level1: "Tái cấu trúc"
    level2:
      - "Nhận diện if-else hoặc switch chứa nhiều trách nhiệm xử lý độc lập"
      - "Chốt hành vi hiện tại bằng các tình huống đại diện và kiểm thử hồi quy"
      - "Tách điều kiện áp dụng và logic xử lý thành các handler nhỏ"
      - "Giữ nguyên độ ưu tiên của điều kiện và chính sách không có kết quả phù hợp"
      - "Đưa thứ tự lắp ghép ra khỏi client và logic nghiệp vụ"
      - "Thay phụ thuộc context ngầm bằng dữ liệu đầu vào và kết quả rõ kiểu"
      - "Chuyển từng phần sang chuỗi và so sánh hành vi trước khi mở rộng áp dụng"
      - "Đánh giá lại độ phức tạp, khả năng thay đổi và chi phí vận hành sau chuyển đổi"
  - level1: "Thực hành Java"
    level2:
      - "Xây chuỗi hỗ trợ khách hàng với nhiều cấp tiếp nhận và chuyển cấp"
      - "Xây chuỗi validation đơn hàng có chế độ dừng sớm và thu thập lỗi"
      - "Xây chuỗi xét duyệt theo hạn mức và trả rõ lý do không được xử lý"
      - "Viết builder kiểm tra cấu hình, thứ tự phụ thuộc và liên kết vòng"
      - "Nạp chuỗi động bằng snapshot bất biến trong khi nhiều yêu cầu đang chạy"
      - "Chuyển một chuỗi gọi dịch vụ sang CompletionStage với executor phù hợp"
      - "Bổ sung deadline, hủy hợp tác và retry có kiểm soát tác dụng phụ"
      - "Hoàn thiện kiểm thử và đo đạc để giải thích lựa chọn thiết kế của từng bài"
  - level1: "Thực hành web"
    level2:
      - "Thiết kế chuỗi tiếp nhận API từ correlation ID đến phản hồi nghiệp vụ"
      - "Cài đặt filter kết thúc sớm khi đầu vào hoặc quyền truy cập không hợp lệ"
      - "Cài đặt middleware đo thời gian với dọn dẹp khi có exception"
      - "Bọc request và response để kiểm soát việc đọc body và ghi phản hồi"
      - "Tích hợp chuỗi handler nghiệp vụ với cấu hình dependency injection của Spring"
      - "Thử async dispatch hoặc WebFlux và quan sát truyền context cùng tín hiệu hủy"
      - "Kiểm thử thứ tự filter, đường đi lỗi, timeout và request đồng thời"
      - "Mô phỏng đổi cấu hình và dùng log, metrics, trace để tìm handler gây sự cố"
  - level1: "Vận hành chuỗi"
    level2:
      - "Công bố sơ đồ thứ tự handler và hợp đồng xử lý cho từng loại yêu cầu"
      - "Kiểm soát thay đổi cấu hình bằng phiên bản và kiểm tra trước khi áp dụng"
      - "Triển khai handler mới theo nhóm lưu lượng và theo dõi kết quả thực tế"
      - "Giữ tương thích khi nhiều phiên bản handler hoặc chuỗi cùng phục vụ"
      - "Đặt ngưỡng cảnh báo cho lỗi, timeout, quá tải và yêu cầu không được xử lý"
      - "Khoanh vùng sự cố theo handler, dependency và phiên bản cấu hình"
      - "Quay về cấu hình trước và xác minh các yêu cầu đang chạy được xử lý nhất quán"
      - "Rà soát định kỳ handler không còn dùng, phụ thuộc thứ tự và chi phí vận hành"
