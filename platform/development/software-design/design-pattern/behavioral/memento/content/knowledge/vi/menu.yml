menu:
- level1: Tổng quan
  level2:
  - Memento là gì và vị trí trong nhóm mẫu thiết kế hành vi
  - Bài toán ghi nhớ và khôi phục trạng thái của đối tượng
  - Mối liên hệ giữa trạng thái hiện tại, bản chụp và lịch sử
  - Vì sao khôi phục trạng thái cần bảo toàn tính đóng gói
  - Ba vai trò Originator, Memento và Caretaker
  - Trường hợp sử dụng, lợi ích và chi phí của Memento
  - Lộ trình từ bản chụp đơn lẻ đến cơ chế undo và redo
- level1: Bài toán thiết kế
  level2:
  - Nhận diện trạng thái cần khôi phục trong một đối tượng
  - Phân biệt dữ liệu nghiệp vụ, dữ liệu dẫn xuất và tài nguyên bên ngoài
  - Phân tích cách lưu trạng thái bằng các trường công khai
  - Phân tích cách để bên ngoài tự đọc và gán lại dữ liệu nội bộ
  - Xác định ranh giới trách nhiệm giữa đối tượng và nơi lưu lịch sử
  - Lựa chọn mức khôi phục theo nhu cầu của người sử dụng
  - Thiết lập tiêu chí đúng cho chức năng ghi nhớ và phục hồi
- level1: Thành phần
  level2:
  - 'Originator: sở hữu trạng thái và tạo bản chụp'
  - 'Memento: lưu thông tin cần thiết để phục hồi'
  - 'Caretaker: quản lý bản chụp và quyết định thời điểm sử dụng'
  - 'Bên sử dụng: điều phối thao tác thay đổi và phục hồi'
  - Giao diện hẹp cho Caretaker và quyền truy cập của Originator
  - Quan hệ sở hữu và vòng đời giữa các thành phần
  - Mô tả cấu trúc Memento bằng sơ đồ lớp
  - Phân biệt vai trò trong mẫu với số lượng lớp triển khai
- level1: Cơ chế hoạt động
  level2:
  - Tạo bản chụp tại một thời điểm xác định
  - Thay đổi trạng thái sau khi đã tạo bản chụp
  - Lưu và lựa chọn bản chụp cần khôi phục
  - Để Originator tự khôi phục dữ liệu từ Memento
  - Mô tả luồng tạo, lưu và phục hồi bằng sơ đồ trình tự
  - Phân biệt chụp trước thao tác và chụp sau thao tác
  - Xác định dữ liệu thuộc bản chụp và dữ liệu thuộc lịch sử
  - Giới hạn của việc khôi phục bộ nhớ đối với tác động bên ngoài
- level1: Thiết kế Java
  level2:
  - Xây dựng Originator với các thao tác nghiệp vụ rõ ràng
  - Thiết kế phương thức tạo bản chụp và khôi phục bản chụp
  - Triển khai Memento bằng lớp lồng static có phạm vi truy cập phù hợp
  - Dùng giao diện chỉ đánh dấu để Caretaker giữ Memento
  - Thiết kế Caretaker với kiểu dữ liệu và trách nhiệm riêng
  - Lựa chọn lớp thông thường hoặc record để biểu diễn dữ liệu chụp
  - Kiểm tra kiểu và nguồn gốc Memento trước khi phục hồi
  - Tách ví dụ Java thuần khỏi giao diện người dùng và nơi lưu trữ
  - Tổ chức ví dụ chạy được với Java 21
- level1: Đóng gói
  level2:
  - Giới hạn dữ liệu mà Caretaker được phép quan sát
  - Giữ quyền diễn giải và khôi phục bản chụp ở Originator
  - Phân biệt thông tin mô tả công khai với trạng thái nội bộ
  - Tránh getter và setter làm lộ toàn bộ dữ liệu của Memento
  - Kiểm soát hàm tạo để ngăn tạo bản chụp tùy tiện
  - Phân biệt kiểm soát truy cập của Java với ranh giới bảo mật
  - Cân nhắc đánh đổi đóng gói khi dùng DTO hoặc định dạng lưu trữ
- level1: Tính bất biến
  level2:
  - Vì sao bản chụp phải giữ nguyên sau khi được tạo
  - Phân biệt biến final với đối tượng bất biến
  - Hiểu tính bất biến nông của record
  - Bảo vệ thành phần có thể thay đổi trong hàm tạo
  - Ngăn dữ liệu bị sửa qua giá trị trả về
  - Phân biệt tập hợp không sửa được với bản sao độc lập
  - Định nghĩa so sánh trạng thái cho bản chụp
  - Nhận diện rủi ro equals và hashCode khi thành phần còn thay đổi
- level1: Sao chép dữ liệu
  level2:
  - Phân biệt sao chép nông và sao chép sâu
  - Xử lý String, kiểu nguyên thủy và các kiểu bất biến
  - Sao chép mảng, danh sách, tập hợp và bản đồ
  - Sao chép phần tử có thể thay đổi bên trong tập hợp
  - Xử lý đối tượng lồng nhau và đồ thị có chu trình
  - Bảo toàn quan hệ dùng chung khi nhiều trường tham chiếu một đối tượng
  - Phân biệt bản sao trạng thái với bản sao định danh đối tượng
  - Đánh giá copy constructor, hàm ánh xạ và Object.clone
  - Kiểm tra tính độc lập ở cả chiều tạo và chiều khôi phục
- level1: Phục hồi nhất quán
  level2:
  - Xác định các điều kiện luôn phải đúng của Originator
  - Phục hồi đồng thời những trường có quan hệ phụ thuộc
  - Kiểm tra tính hợp lệ trước khi thay đổi trạng thái hiện tại
  - Khôi phục trên đối tượng hiện có hoặc tạo đối tượng thay thế
  - Giữ định danh đối tượng khi bên ngoài còn giữ tham chiếu
  - Tính lại dữ liệu dẫn xuất và làm mới bộ nhớ đệm
  - Xử lý tham chiếu đến đối tượng không còn tồn tại
  - Xác định chính sách thông báo thay đổi sau phục hồi
- level1: Quản lý lịch sử
  level2:
  - Lựa chọn ngăn xếp hoặc danh sách có con trỏ lịch sử
  - Xác định trạng thái ban đầu và vị trí hiện tại
  - Phân biệt mã bản chụp, số thứ tự và thời điểm tạo
  - Tạo điểm lưu thủ công và điểm lưu tự động
  - Không tạo mục lịch sử cho thao tác không làm thay đổi trạng thái
  - Giới hạn lịch sử theo số lượng hoặc dung lượng
  - Loại bỏ bản chụp cũ và giải phóng tham chiếu
  - Tách lịch sử theo đối tượng, tài liệu hoặc phiên làm việc
  - Xác định cách xóa lịch sử khi đóng hoặc thay đối tượng
- level1: Undo và Redo
  level2:
  - Phân biệt quay về bản chụp với hoàn tác một thao tác
  - Thiết kế hai ngăn xếp undo và redo
  - Thiết kế danh sách lịch sử với con trỏ hiện tại
  - Lưu trạng thái cần thiết trước khi thực hiện undo
  - Khôi phục trạng thái khi thực hiện redo
  - Xóa nhánh redo khi phát sinh thay đổi mới trong lịch sử tuyến tính
  - Xử lý biên đầu và cuối lịch sử
  - Đồng bộ khả năng canUndo và canRedo với trạng thái thực
  - Nhóm nhiều thay đổi thành một thao tác hoàn tác
  - Mô phỏng chuỗi sửa, undo, redo và sửa mới bằng bảng trạng thái
- level1: Biến thể lịch sử
  level2:
  - Phân biệt lịch sử tuyến tính và lịch sử phân nhánh
  - Biểu diễn quan hệ cha con giữa các phiên bản
  - Chọn nhánh và phục hồi một mốc được đặt tên
  - Lưu toàn bộ trạng thái hoặc lưu phần thay đổi
  - Kết hợp bản chụp đầy đủ với chuỗi thay đổi
  - Đánh đổi độ phức tạp khi hỗ trợ phục hồi có chọn lọc
  - Xác định trường hợp cần biến thể và trường hợp nên giữ lịch sử đơn giản
- level1: Kết hợp Command
  level2:
  - Phân biệt lưu trạng thái với biểu diễn yêu cầu thực thi
  - Để Command giữ Memento trước khi thay đổi Originator
  - Dùng Memento khi khó xây dựng phép toán đảo ngược
  - Lựa chọn thực thi lại lệnh hoặc khôi phục trạng thái sau thao tác
  - Xử lý redo của thao tác phụ thuộc thời gian, ngẫu nhiên hoặc dữ liệu ngoài
  - Quản lý một lệnh tác động đến nhiều đối tượng
  - Gộp các lệnh và thống nhất ranh giới hoàn tác
  - Phân chia trách nhiệm giữa Command, Memento và nơi quản lý lịch sử
- level1: Ví dụ soạn thảo
  level2:
  - Xác định trạng thái văn bản, con trỏ và vùng chọn
  - Triển khai thao tác nhập, xóa và thay thế nội dung
  - Tạo bản chụp đóng gói của trình soạn thảo
  - Lưu lịch sử trước hoặc sau thay đổi theo quy ước
  - Thực hiện undo và redo với nhiều thao tác liên tiếp
  - Kiểm tra sửa mới sau khi undo
  - Gộp các lần gõ thành một thao tác có ý nghĩa
  - Phân biệt điểm lưu tài liệu với vị trí hiện tại trong lịch sử
  - Minh chứng hành vi bằng ví dụ chạy và kiểm thử
- level1: Ví dụ đồ họa
  level2:
  - Xác định trạng thái hình vẽ, vị trí, kích thước và thứ tự lớp
  - Chụp một hình hoặc toàn bộ vùng vẽ theo ranh giới thao tác
  - Sao chép tập hợp các hình và thuộc tính có thể thay đổi
  - Khôi phục thao tác thêm, xóa và di chuyển hình
  - Bảo toàn liên kết và định danh giữa các đối tượng đồ họa
  - Nhóm chuỗi kéo thả thành một lần hoàn tác
  - Đánh giá chi phí của bản chụp khi số lượng hình tăng
- level1: Java Swing
  level2:
  - Vai trò của UndoableEdit và AbstractUndoableEdit
  - 'StateEditable: khai báo cách lưu và khôi phục trạng thái'
  - 'StateEdit: lưu trạng thái trước và sau một lần chỉnh sửa'
  - Kết thúc StateEdit bằng end và hiểu việc loại dữ liệu trùng
  - 'UndoManager: quản lý danh sách chỉnh sửa và vị trí undo hoặc redo'
  - 'CompoundEdit: nhóm các chỉnh sửa thành một đơn vị'
  - Kết nối UndoableEditListener với mô hình tài liệu Swing
  - Phân biệt bảo đảm của UndoManager với an toàn luồng của đối tượng được chỉnh sửa
- level1: Lưu trữ
  level2:
  - Phân biệt Memento trong bộ nhớ với lưu trạng thái bền vững
  - Tách nơi lưu bản chụp khỏi logic của Originator
  - Thiết kế dữ liệu lưu trữ và thông tin mô tả cần thiết
  - Đánh giá định dạng JSON, nhị phân và Java Serialization
  - Kiểm soát tham chiếu ngoài và dữ liệu không thể tuần tự hóa
  - Ghi bản chụp hoàn chỉnh trước khi công bố có thể sử dụng
  - Phát hiện dữ liệu thiếu, hỏng hoặc không đọc được
  - Nạp bản chụp và kiểm tra trước khi khôi phục
  - Xác định chính sách lưu giữ, xóa và dọn tài nguyên
- level1: Tương thích phiên bản
  level2:
  - Gắn phiên bản lược đồ cho dữ liệu bản chụp
  - Phân biệt phiên bản dữ liệu với số thứ tự lịch sử
  - Xử lý thêm, đổi tên và loại bỏ trường trạng thái
  - Chuyển đổi bản chụp cũ sang mô hình hiện tại
  - Kiểm tra thay đổi điều kiện hợp lệ và quy tắc nghiệp vụ
  - Từ chối bản chụp không tương thích bằng lỗi rõ ràng
  - Kiểm thử khả năng đọc và phục hồi qua các phiên bản
- level1: Đồng thời
  level2:
  - Nhận diện bản chụp không nhất quán khi đối tượng bị sửa đồng thời
  - Đồng bộ quá trình chụp và thay đổi trạng thái
  - Giữ phục hồi và cập nhật con trỏ lịch sử trong cùng ranh giới nhất quán
  - Phát hiện dữ liệu mới hơn bằng số phiên bản hoặc dấu hiệu thay đổi
  - Lựa chọn khóa, kiểm tra phiên bản hoặc một luồng điều phối
  - Tách lịch sử của nhiều người dùng hoặc phiên làm việc
  - Phân biệt bản chụp cục bộ với cơ chế cộng tác chỉnh sửa
  - Kiểm tra nguy cơ khóa chéo khi một thao tác chụp nhiều đối tượng
- level1: Xử lý thất bại
  level2:
  - Xử lý lỗi tạo bản chụp trước khi thao tác nghiệp vụ diễn ra
  - Xử lý thao tác thay đổi thất bại sau khi đã chụp trạng thái
  - Giữ trạng thái hiện tại khi dữ liệu phục hồi không hợp lệ
  - Không di chuyển con trỏ lịch sử khi phục hồi thất bại
  - Tránh trạng thái nửa cũ nửa mới khi có ngoại lệ
  - Xử lý thông báo hoặc tác vụ phụ thất bại sau phục hồi
  - Thiết kế thông báo lỗi và khả năng thử lại có kiểm soát
- level1: Hiệu năng
  level2:
  - Ước lượng chi phí theo kích thước trạng thái và độ dài lịch sử
  - Đo thời gian tạo, lưu và khôi phục bản chụp
  - Đánh giá cấp phát bộ nhớ và áp lực thu gom rác
  - Chỉ chụp phần trạng thái cần thiết cho yêu cầu phục hồi
  - Chia sẻ cấu trúc bất biến để giảm sao chép
  - Áp dụng sao chép khi ghi và cấu trúc dữ liệu bền vững khi phù hợp
  - Đánh đổi giữa bản chụp đầy đủ, phần chênh lệch và mốc định kỳ
  - Gộp thay đổi, bỏ bản chụp trùng và giới hạn lịch sử
  - Đo đạc trước khi chọn giải pháp tối ưu phức tạp
- level1: Dữ liệu nhạy cảm
  level2:
  - Nhận diện dữ liệu nhạy cảm được giữ trong lịch sử
  - Giảm dữ liệu chụp theo đúng nhu cầu phục hồi
  - Kiểm soát quyền tạo, đọc và khôi phục bản chụp
  - Tránh làm lộ trạng thái qua nhật ký và toString
  - Bảo vệ bản chụp lưu ngoài tiến trình và kiểm tra nguồn dữ liệu
  - Hiểu giới hạn xóa dữ liệu khi bản chụp hoặc bản sao vẫn còn
- level1: Kiểm thử
  level2:
  - Kiểm tra chuỗi tạo bản chụp, thay đổi và phục hồi
  - Đối chiếu trạng thái phục hồi với trạng thái gốc theo giá trị
  - Kiểm tra thay đổi Originator không làm đổi Memento
  - Kiểm tra phục hồi không tạo tham chiếu dùng chung ngoài ý muốn
  - Kiểm tra danh sách lồng nhau, mảng và đối tượng có quan hệ
  - Kiểm tra undo và redo tại các biên lịch sử
  - Kiểm tra sửa mới sau undo và loại nhánh redo
  - Kiểm tra giới hạn lịch sử và vòng đời nhiều đối tượng
  - Kiểm tra sai nguồn gốc, sai phiên bản và dữ liệu không hợp lệ
  - Kiểm tra ngoại lệ không làm hỏng trạng thái hoặc lịch sử
  - Kiểm tra chuỗi thao tác sinh tự động và tình huống truy cập đồng thời
- level1: Mẫu liên quan
  level2:
  - 'Memento và Command: bản chụp trạng thái với yêu cầu thực thi'
  - 'Memento và Prototype: phục hồi trạng thái với sao chép đối tượng'
  - 'Memento và State: ghi nhớ dữ liệu với thay đổi hành vi theo trạng thái'
  - 'Memento và Observer: phục hồi trạng thái với thông báo thay đổi'
  - 'Memento và Serialization: mẫu trách nhiệm với cơ chế mã hóa dữ liệu'
  - 'Memento và Event Sourcing: bản chụp với tái dựng từ sự kiện'
  - 'Memento và bản sao lưu: phạm vi đối tượng với phục hồi dữ liệu hệ thống'
  - 'Memento và giao dịch: giới hạn của phục hồi bộ nhớ so với rollback'
  - 'Memento và thao tác bù: xử lý tác động đã xảy ra bên ngoài'
- level1: Lỗi thiết kế
  level2:
  - Lưu tham chiếu đến trạng thái đang thay đổi thay vì bản chụp
  - Cho rằng final, record hoặc List.copyOf luôn tạo bất biến sâu
  - Để Caretaker trực tiếp sửa dữ liệu nội bộ của Originator
  - Chụp thiếu trường hoặc không tính lại dữ liệu dẫn xuất
  - Khôi phục bản chụp của đối tượng hoặc phiên làm việc khác
  - Làm mất redo hoặc giữ redo sai sau thao tác mới
  - Không thống nhất thời điểm chụp và quy ước lịch sử
  - Tạo vòng lặp khi phục hồi phát sinh thêm mục lịch sử
  - Giữ lịch sử vô hạn và vô tình giữ sống tài nguyên
  - Dùng Memento như giải pháp tự động đảo ngược mọi tác động bên ngoài
- level1: Áp dụng thực tế
  level2:
  - Đánh giá nhu cầu phục hồi và tính phù hợp của Memento
  - Chọn trạng thái, ranh giới đối tượng và độ hạt của bản chụp
  - Lựa chọn lịch sử đơn giản trước khi thêm biến thể nâng cao
  - Tách mô hình nghiệp vụ, điều phối thao tác và nơi giữ lịch sử
  - Refactor từ cơ chế sao lưu thủ công sang trách nhiệm rõ ràng
  - Đánh giá phương án không dùng Memento khi phép toán đảo ngược đơn giản
  - Ghi lại giới hạn phục hồi và quyết định thiết kế trong tài liệu
- level1: Thực hành
  level2:
  - Xây dựng Memento tối thiểu cho một đối tượng Java
  - Hoàn thiện trình soạn thảo có undo và redo
  - Sửa lỗi bản chụp bị thay đổi do tham chiếu dùng chung
  - Mở rộng ví dụ với tập hợp đối tượng có thể thay đổi
  - Thêm giới hạn lịch sử và gộp các thao tác liên tiếp
  - Kết hợp Command với Memento cho một thao tác nhiều bước
  - Lưu và nạp bản chụp có phiên bản lược đồ
  - Thử nghiệm lỗi phục hồi và kiểm tra tính nhất quán
  - So sánh chi phí bản chụp đầy đủ với một phương án tối ưu
  - Tự đánh giá đóng gói, tính đúng, độ phức tạp và giới hạn sử dụng
