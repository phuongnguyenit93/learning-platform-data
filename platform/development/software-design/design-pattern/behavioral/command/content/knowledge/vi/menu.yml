menu:
  - level1: "Tổng quan Command"
    level2:
      - "Ý định của Command và vị trí trong nhóm mẫu thiết kế hành vi"
      - "Đóng gói một yêu cầu thành đối tượng chứa thao tác và dữ liệu thực thi"
      - "Bài toán phụ thuộc trực tiếp giữa thành phần phát sinh yêu cầu và thành phần xử lý"
      - "Lợi ích của việc truyền, lưu giữ, kết hợp và trì hoãn thao tác dưới dạng đối tượng"
      - "Nhận diện nhu cầu dùng Command trong trình soạn thảo, điều khiển thiết bị và xử lý tác vụ"
      - "Đánh đổi giữa khả năng mở rộng với số lượng lớp và chi phí quản lý vòng đời"
      - "Phân biệt Command theo GoF với lệnh ứng dụng và thông điệp gửi qua hệ thống phân tán"
      - "Tiêu chí chọn Command và trường hợp một lời gọi phương thức trực tiếp đã đủ"
  - level1: "Cấu trúc mẫu"
    level2:
      - "Command định nghĩa hợp đồng thực thi chung cho các yêu cầu"
      - "ConcreteCommand liên kết thao tác với Receiver và lưu tham số cần thiết"
      - "Receiver cung cấp hành vi nghiệp vụ thực sự được lệnh sử dụng"
      - "Invoker giữ hoặc kích hoạt lệnh mà không cần biết chi tiết xử lý nghiệp vụ"
      - "Client tạo Receiver, tạo Command và cấu hình Invoker"
      - "Sơ đồ lớp và hướng phụ thuộc giữa Command, ConcreteCommand, Invoker, Receiver và Client"
      - "Sơ đồ tương tác từ hành động của người dùng đến lời gọi trên Receiver"
      - "Áp dụng nguyên lý trách nhiệm đơn nhất, đảo ngược phụ thuộc và đóng mở khi thêm lệnh"
  - level1: "Luồng thực thi"
    level2:
      - "Tách thời điểm tạo lệnh, gửi lệnh và thực thi lệnh"
      - "Thu thập đầu vào và xác định Receiver trước khi đưa lệnh cho Invoker"
      - "Kiểm tra tính hợp lệ của dữ liệu và điều kiện nghiệp vụ tại thời điểm phù hợp"
      - "Theo dõi trạng thái tạo mới, chờ chạy, đang chạy, thành công, thất bại và bị hủy khi cần"
      - "Truyền kết quả và lỗi từ Receiver qua Command về thành phần gọi"
      - "Xác định tác dụng phụ và thời điểm thao tác được coi là hoàn tất"
      - "Phân biệt một đối tượng lệnh với từng lần thực thi của đối tượng đó"
      - "Quản lý tài nguyên và dọn dẹp sau khi lệnh kết thúc hoặc gặp lỗi"
  - level1: "Hợp đồng lệnh"
    level2:
      - "Thiết kế interface Command tối giản với phương thức execute"
      - "Lựa chọn hợp đồng không trả kết quả hoặc Command có kiểu kết quả tổng quát"
      - "Phân biệt tham số đầu vào, kết quả nghiệp vụ và siêu dữ liệu thực thi"
      - "Thiết kế hợp đồng lỗi với ngoại lệ hoặc đối tượng kết quả có trạng thái rõ ràng"
      - "Tách hợp đồng lệnh có thể hoàn tác khỏi lệnh chỉ hỗ trợ thực thi"
      - "Quy định khả năng tái sử dụng, tính thay đổi và giới hạn an toàn luồng của lệnh"
      - "Thiết kế canExecute khi cần phản hồi giao diện và kiểm tra lại điều kiện khi thực thi"
      - "Tách hợp đồng đồng bộ và bất đồng bộ khi cách nhận kết quả khác nhau"
  - level1: "Hiện thực Java"
    level2:
      - "Xây dựng ví dụ điều khiển đèn để minh họa đủ các vai trò của Command"
      - "Định nghĩa interface Command và các Receiver chứa thao tác bật tắt thiết bị"
      - "Cài đặt LightOnCommand và LightOffCommand bằng cách ủy quyền cho Receiver"
      - "Thiết kế RemoteControl làm Invoker và gán lệnh cho từng nút điều khiển"
      - "Lắp ráp Client bằng constructor injection để thể hiện rõ các phụ thuộc"
      - "Thêm một loại thiết bị và lệnh mới mà không sửa logic thực thi của Invoker"
      - "Lựa chọn giữa NoOpCommand và kiểm tra thiếu lệnh theo ngữ nghĩa của ứng dụng"
      - "Tổ chức package và trách nhiệm lớp cho ví dụ có thể mở rộng và kiểm thử"
  - level1: "Dữ liệu và trạng thái"
    level2:
      - "Lưu tham số bất biến để yêu cầu không đổi ngoài ý muốn trước khi được thực thi"
      - "Sao chép dữ liệu đầu vào có thể thay đổi và tránh giữ tham chiếu bộ sưu tập bên ngoài"
      - "Lựa chọn lưu định danh đối tượng hay giữ trực tiếp tham chiếu Receiver"
      - "Phân biệt trạng thái nghiệp vụ của Receiver với trạng thái vòng đời của lần thực thi"
      - "Xử lý dữ liệu hoặc điều kiện nghiệp vụ đã thay đổi giữa lúc tạo và lúc chạy lệnh"
      - "Quy định lệnh dùng một lần và lệnh có thể chạy lại để tránh tái sử dụng sai"
      - "Truyền ngữ cảnh người dùng, thời hạn và mã theo dõi mà không phụ thuộc biến toàn cục"
      - "Tránh giữ kết nối, luồng dữ liệu và đối tượng lớn quá lâu trong lệnh đang chờ"
  - level1: "Lệnh có tham số"
    level2:
      - "Chọn lớp lệnh chuyên biệt hoặc lệnh tổng quát theo mức độ khác nhau của hành vi"
      - "Thiết kế constructor, factory và builder cho lệnh có nhiều tham số"
      - "Dùng kiểu dữ liệu rõ nghĩa để tránh nhầm thứ tự và đơn vị của tham số"
      - "Kiểm tra ràng buộc đầu vào và báo lỗi trước khi phát sinh tác dụng phụ"
      - "Biểu diễn lệnh đơn giản bằng functional interface, lambda và method reference trong Java"
      - "Phân tích dữ liệu được lambda nắm giữ và nguy cơ tham chiếu đến trạng thái thay đổi"
      - "Giới hạn của lambda khi cần lịch sử, hoàn tác, định danh và lưu trữ lệnh"
      - "Tránh lệnh tổng quát chứa chuỗi điều kiện lớn thay cho các hành vi có trách nhiệm rõ ràng"
  - level1: "Thiết kế Invoker"
    level2:
      - "Giữ trách nhiệm của Invoker tập trung vào tiếp nhận và điều phối thực thi"
      - "Đăng ký và tra cứu lệnh bằng khóa có kiểu rõ ràng khi giao diện có nhiều thao tác"
      - "Phân biệt kích hoạt lệnh trực tiếp với nhận lệnh để xử lý về sau"
      - "Thiết kế điểm mở rộng cho lịch sử, quan sát và chính sách thực thi"
      - "Tách đối tượng dữ liệu lệnh và CommandHandler khi kiến trúc ứng dụng cần định tuyến"
      - "Xây dựng CommandBus tối giản và quy định một handler cho mỗi loại yêu cầu"
      - "Lắp ráp danh mục handler bằng dependency injection và phát hiện đăng ký thiếu hoặc trùng"
      - "Xử lý lệnh gọi lồng nhau, tái nhập và nguy cơ tạo chu trình điều phối"
  - level1: "Thiết kế Receiver"
    level2:
      - "Đặt quy tắc nghiệp vụ và bất biến dữ liệu tại Receiver hoặc lớp miền phù hợp"
      - "Giữ Command làm đối tượng mô tả hoặc điều phối yêu cầu thay vì sao chép nghiệp vụ"
      - "Thiết kế giao diện Receiver đủ hẹp để Command ít phụ thuộc chi tiết triển khai"
      - "Dùng nhiều Receiver trong một thao tác và xác định ranh giới trách nhiệm điều phối"
      - "Xác định quyền sở hữu trạng thái khi nhiều lệnh cùng tác động một Receiver"
      - "Đưa ranh giới giao dịch về nơi có thể bảo vệ đầy đủ bất biến nghiệp vụ"
      - "Trả kết quả và lỗi nghiệp vụ đủ rõ để Command quyết định bước tiếp theo"
      - "Tách truy cập hạ tầng khỏi hành vi miền để kiểm thử Receiver và Command độc lập"
  - level1: "Lệnh tổng hợp"
    level2:
      - "Dùng MacroCommand để biểu diễn một thao tác gồm nhiều lệnh con"
      - "Kết hợp Command với Composite để lệnh đơn và lệnh tổng hợp dùng chung hợp đồng"
      - "Quy định thứ tự chạy lệnh con và cách tổng hợp kết quả"
      - "Lựa chọn dừng ngay khi lỗi hoặc tiếp tục các lệnh con còn lại"
      - "Ghi nhận chính xác các lệnh con đã thành công trước khi một lệnh khác thất bại"
      - "Hoàn tác các lệnh con đã thực hiện theo thứ tự ngược khi hợp đồng cho phép"
      - "Phân biệt tính nguyên tử thật sự với cơ chế bù trừ của một chuỗi thao tác"
      - "Kiểm soát lệnh tổng hợp lồng nhau, chu trình tham chiếu và giới hạn kích thước"
  - level1: "Hoàn tác thao tác"
    level2:
      - "Xác định thao tác nào có thể hoàn tác và điều kiện để khôi phục có ý nghĩa"
      - "Thiết kế UndoableCommand với dữ liệu cần thiết cho execute và undo"
      - "Lựa chọn thao tác nghịch đảo hoặc lưu trạng thái trước khi thay đổi"
      - "Chỉ ghi nhận lệnh có tác động thành công vào lịch sử hoàn tác"
      - "Xử lý thao tác không làm thay đổi dữ liệu và yêu cầu không được phép hoàn tác"
      - "Kiểm tra phiên bản hoặc trạng thái Receiver để phát hiện xung đột khi undo"
      - "Gộp nhiều thay đổi nhỏ thành một thao tác hoàn tác có ý nghĩa với người dùng"
      - "Nhận diện tác dụng phụ khó đảo ngược như gửi thông báo và gọi dịch vụ bên ngoài"
  - level1: "Redo và lịch sử"
    level2:
      - "Thiết kế UndoManager bằng hai ngăn xếp hoặc con trỏ trong danh sách lịch sử"
      - "Mô tả chuyển trạng thái của lịch sử khi execute, undo và redo thành công"
      - "Xóa nhánh redo khi người dùng tạo thao tác mới sau một lần undo"
      - "Phân biệt redo với tạo yêu cầu mới và với retry một lần thực thi thất bại"
      - "Lưu dữ liệu đã xác định để redo không thay đổi do thời gian, ngẫu nhiên hoặc đầu vào mới"
      - "Giữ lịch sử nhất quán khi undo hoặc redo thất bại giữa chừng"
      - "Giới hạn số bước, dung lượng và thời gian giữ lịch sử theo nhu cầu ứng dụng"
      - "Phân biệt lịch sử thao tác phục vụ người dùng với nhật ký quan sát và nhật ký kiểm toán"
  - level1: "Command và Memento"
    level2:
      - "Kết hợp Command với Memento khi khôi phục bằng thao tác nghịch đảo quá phức tạp"
      - "Phân vai Originator, Memento và Caretaker trong cơ chế lưu trạng thái Receiver"
      - "Tạo bản chụp trước thay đổi và bảo vệ tính đóng gói của trạng thái nội bộ"
      - "Chọn bản sao sâu, cấu trúc bất biến hoặc bản chụp phần dữ liệu thay đổi"
      - "So sánh chi phí bộ nhớ và độ chính xác giữa lưu trạng thái với lưu thao tác nghịch đảo"
      - "Kết hợp điểm khôi phục định kỳ với lịch sử thay đổi để giới hạn chi phí lưu trữ"
      - "Kiểm tra tính tương thích của bản chụp khi mô hình dữ liệu hoặc phiên bản ứng dụng đổi"
      - "Kiểm thử tính độc lập của bản chụp và khả năng khôi phục sau nhiều chuỗi thao tác"
  - level1: "Lỗi và giao dịch"
    level2:
      - "Phân loại lỗi kiểm tra đầu vào, lỗi nghiệp vụ, lỗi hạ tầng và lỗi lập trình"
      - "Biểu diễn kết quả thành công, thất bại và hoàn tất một phần mà không che giấu tác dụng phụ"
      - "Áp dụng giao dịch cục bộ cho các thay đổi thuộc cùng một ranh giới dữ liệu"
      - "Xử lý thất bại khi một lệnh tác động nhiều tài nguyên không dùng chung giao dịch"
      - "Phân biệt rollback, undo do người dùng yêu cầu và compensation trong quy trình nghiệp vụ"
      - "Xác định cách báo cáo và phục hồi khi chính thao tác bù trừ hoặc hoàn tác thất bại"
      - "Đồng bộ việc cập nhật lịch sử với kết quả giao dịch và trạng thái Receiver"
      - "Bảo đảm giải phóng tài nguyên và giữ nguyên thông tin nguyên nhân khi truyền lỗi"
  - level1: "Hàng đợi lệnh"
    level2:
      - "Tách bên tạo lệnh và bên xử lý bằng hàng đợi trong bộ nhớ"
      - "Lựa chọn FIFO, hàng đợi ưu tiên và phạm vi cần giữ đúng thứ tự"
      - "Thiết kế producer, consumer và vòng lặp lấy lệnh bằng BlockingQueue trong Java"
      - "Giới hạn dung lượng và áp dụng backpressure khi tốc độ nhận lệnh vượt năng lực xử lý"
      - "Theo dõi thời điểm nhận, thời gian chờ và chuyển trạng thái khi consumer nhận lệnh"
      - "Cô lập lệnh lỗi và quy định cách đưa lại hàng đợi hoặc chuyển sang nơi xử lý riêng"
      - "Xử lý yêu cầu hủy khi lệnh còn chờ và khi consumer đã bắt đầu thực thi"
      - "Dừng tiếp nhận, xử lý phần việc còn lại và đóng worker theo chính sách shutdown"
  - level1: "Bất đồng bộ Java"
    level2:
      - "Phân biệt thực thi đồng bộ, trì hoãn, bất đồng bộ và thực thi song song"
      - "Chọn Runnable hoặc Callable làm bộ chuyển tiếp từ Command sang ExecutorService"
      - "Nhận kết quả và lỗi bằng Future mà không làm mất ngoại lệ của tác vụ"
      - "Kết hợp CompletableFuture với Command cho chuỗi xử lý và tổng hợp kết quả"
      - "Lựa chọn executor theo loại công việc và tránh chặn nhầm luồng giao diện"
      - "Truyền ngữ cảnh theo dõi và người dùng qua ranh giới luồng một cách tường minh"
      - "Phân biệt hết thời gian chờ kết quả với việc tác vụ thực sự bị hủy"
      - "Quản lý vòng đời executor và thu hồi tài nguyên khi ứng dụng dừng"
  - level1: "Đồng thời và hủy"
    level2:
      - "Đánh giá an toàn luồng riêng cho Command, Invoker, Receiver và dữ liệu dùng chung"
      - "Chạy tuần tự theo Receiver hoặc khóa nghiệp vụ khi cần bảo toàn thứ tự thay đổi"
      - "Lựa chọn khóa đồng bộ hoặc kiểm soát phiên bản để ngăn cập nhật xung đột"
      - "Bảo vệ lịch sử undo và redo trước các lần thực thi xen kẽ"
      - "Thiết kế hủy hợp tác bằng trạng thái hủy và xử lý interruption đúng hợp đồng"
      - "Xác định điểm không thể hủy sau khi tác dụng phụ đã được xác nhận"
      - "Giải quyết tranh chấp giữa hoàn tất, timeout và yêu cầu hủy của cùng một lần chạy"
      - "Phát hiện deadlock, tranh chấp tài nguyên và kết quả đến muộn trong luồng bất đồng bộ"
  - level1: "Retry và idempotency"
    level2:
      - "Chọn lỗi tạm thời có thể retry và lỗi phải dừng để tránh lặp thao tác vô ích"
      - "Phân biệt gửi lại cùng yêu cầu với tạo một yêu cầu nghiệp vụ mới"
      - "Thiết kế khóa idempotency và lưu kết quả để nhận diện yêu cầu trùng"
      - "Bảo đảm việc chống trùng và thay đổi dữ liệu nhất quán trong ranh giới phù hợp"
      - "Áp dụng backoff, jitter và giới hạn số lần thử để giảm quá tải"
      - "Kết hợp retry với thời hạn, ngân sách thời gian và yêu cầu hủy"
      - "Giữ đúng thứ tự nghiệp vụ khi một lệnh bị retry trong chuỗi lệnh liên quan"
      - "Phân tích giới hạn của bảo đảm giao nhận và tránh mặc định rằng một yêu cầu chỉ chạy một lần"
  - level1: "Lưu trữ và khôi phục"
    level2:
      - "Xác định khi nào cần hàng đợi bền vững thay cho hàng đợi trong bộ nhớ"
      - "Lưu loại lệnh, phiên bản, dữ liệu đầu vào và định danh thay vì đồ thị đối tượng Receiver"
      - "Ánh xạ dữ liệu lệnh đã lưu sang handler và Receiver tại thời điểm xử lý"
      - "Thiết kế tương thích phiên bản khi cấu trúc dữ liệu hoặc cách xử lý lệnh thay đổi"
