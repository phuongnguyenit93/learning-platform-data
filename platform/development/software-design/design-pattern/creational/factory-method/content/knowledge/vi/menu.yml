menu:
  - level1: "Tổng quan"
    level2:
      - "Mục đích của Factory Method trong nhóm mẫu khởi tạo GoF"
      - "Tách logic sử dụng sản phẩm khỏi quyết định khởi tạo lớp cụ thể"
      - "Vai trò của kế thừa và đa hình trong việc thay đổi sản phẩm"
      - "Ý nghĩa của phương thức factory trong ngữ cảnh Creator"
      - "Phạm vi áp dụng khi quy trình ổn định nhưng sản phẩm có nhiều biến thể"
      - "Lợi ích, chi phí và giới hạn của việc thêm phân cấp Creator"
      - "Phân biệt tên gọi Factory Method với một phương thức tạo đối tượng bất kỳ"
      - "Lộ trình học từ bài toán khởi tạo đến kiểm thử khả năng mở rộng"
  - level1: "Bài toán khởi tạo"
    level2:
      - "Bài toán giao hàng bằng đường bộ và đường biển trong cùng quy trình"
      - "Mã nguồn ban đầu khi logic giao hàng trực tiếp khởi tạo Truck"
      - "Ảnh hưởng của việc thêm Ship vào các nhánh điều kiện hiện có"
      - "Nhận diện phụ thuộc vào lớp cụ thể trong mã nghiệp vụ"
      - "Phân biệt phần quy trình chung với phần lựa chọn và tạo sản phẩm"
      - "Xác định điểm thay đổi dựa trên yêu cầu mở rộng thực tế"
      - "Đặt tiêu chí thiết kế cho hành vi giao hàng và khả năng thay thế sản phẩm"
      - "Trường hợp một constructor hoặc hàm tạo đơn giản đã đáp ứng yêu cầu"
  - level1: "Thành phần của mẫu"
    level2:
      - "Product định nghĩa hợp đồng chung mà logic nghiệp vụ sử dụng"
      - "ConcreteProduct hiện thực hành vi riêng cho từng loại sản phẩm"
      - "Creator khai báo factory method và chứa thao tác sử dụng Product"
      - "ConcreteCreator quyết định lớp sản phẩm được tạo qua việc ghi đè"
      - "Client lựa chọn Creator và gọi quy trình qua kiểu trừu tượng"
      - "Quan hệ kế thừa giữa các Creator và quan hệ hiện thực giữa các Product"
      - "Quan hệ phụ thuộc từ Creator đến Product trong sơ đồ lớp UML"
      - "Ánh xạ vai trò Logistics, RoadLogistics, SeaLogistics, Transport, Truck và Ship"
  - level1: "Luồng hoạt động"
    level2:
      - "Khởi tạo ConcreteCreator tại điểm lắp ráp ứng dụng"
      - "Gọi thao tác nghiệp vụ được định nghĩa trong Creator"
      - "Creator gọi factory method qua cơ chế dispatch động của Java"
      - "ConcreteCreator trả về sản phẩm tương thích với hợp đồng Product"
      - "Quy trình chung sử dụng sản phẩm mà không kiểm tra lớp cụ thể"
      - "Minh họa sơ đồ tuần tự từ client đến Creator và Product"
      - "Phân biệt thời điểm lựa chọn Creator với thời điểm tạo Product"
      - "Theo dõi luồng thực thi khi thay RoadLogistics bằng SeaLogistics"
  - level1: "Hợp đồng sản phẩm"
    level2:
      - "Thiết kế interface Transport theo nhu cầu thực tế của quy trình giao hàng"
      - "Lựa chọn interface hoặc abstract class cho Product trong Java"
      - "Xác định tham số đầu vào, kết quả trả về và tác dụng phụ của Product"
      - "Giữ hợp đồng hành vi nhất quán giữa Truck và Ship"
      - "Tách các khả năng không dùng chung thành interface riêng khi cần"
      - "Tránh để phương thức của Product làm lộ chi tiết lớp triển khai"
      - "Đặt bất biến và điều kiện hợp lệ cho sản phẩm ngay từ khi khởi tạo"
      - "Thiết kế Product đủ nhỏ để dễ thay thế bằng fake trong kiểm thử"
  - level1: "Thiết kế Creator"
    level2:
      - "Đặt thao tác nghiệp vụ chung và factory method vào đúng vai trò"
      - "Lựa chọn factory method trừu tượng hoặc có hiện thực mặc định"
      - "Chọn mức truy cập protected hoặc public theo nhu cầu của client"
      - "Xác định chữ ký factory method theo hợp đồng Product"
      - "Giữ quy trình nghiệp vụ phụ thuộc vào kiểu Product thay vì ConcreteProduct"
      - "Dùng final cho thao tác quy trình khi cần bảo vệ thứ tự xử lý"
      - "Tránh gọi factory method có thể bị ghi đè trong constructor"
      - "Phân định trách nhiệm giữa tạo sản phẩm, sử dụng sản phẩm và chọn Creator"
  - level1: "Triển khai Java"
    level2:
      - "Tạo interface Transport và các lớp Truck, Ship với hành vi minh họa"
      - "Xây dựng abstract class Logistics với phương thức createTransport"
      - "Cài đặt thao tác planDelivery sử dụng sản phẩm qua interface Transport"
      - "Hiện thực RoadLogistics bằng cách ghi đè createTransport"
      - "Hiện thực SeaLogistics và tái sử dụng quy trình trong Logistics"
      - "Lắp ráp ví dụ chạy hoàn chỉnh với client chỉ nhận Logistics"
      - "Tổ chức package cho hợp đồng, sản phẩm, Creator và mã khởi động"
      - "Đọc kết quả thực thi và đối chiếu từng lớp với sơ đồ Factory Method"
  - level1: "Mở rộng sản phẩm"
    level2:
      - "Thêm AirTransport và AirLogistics theo hợp đồng đã thiết kế"
      - "Tái sử dụng quy trình giao hàng mà không sửa logic dùng Transport"
      - "Cập nhật điểm lắp ráp để lựa chọn Creator mới"
      - "Bổ sung dependency riêng cho sản phẩm mới qua constructor của Creator"
      - "Đánh giá sản phẩm mới có thực sự thay thế được các sản phẩm cũ"
      - "Xử lý yêu cầu mới không phù hợp với hợp đồng Product hiện tại"
      - "Phân biệt mở rộng biến thể sản phẩm với thay đổi quy trình nghiệp vụ"
      - "Kiểm tra số lượng lớp tăng thêm và ngưỡng cần cân nhắc thiết kế khác"
  - level1: "Biến thể triển khai"
    level2:
      - "Factory method trừu tượng buộc lớp con cung cấp sản phẩm"
      - "Factory method có sản phẩm mặc định và các lớp con tùy biến"
      - "Kiểu trả về hiệp biến khi ConcreteCreator trả về ConcreteProduct"
      - "Factory method nhận tham số phục vụ việc tạo sản phẩm"
      - "Phân tích đánh đổi khi một factory method lựa chọn nhiều loại sản phẩm"
      - "Creator có nhiều factory method và ranh giới với Abstract Factory"
      - "Trả về sản phẩm mới hoặc tái sử dụng sản phẩm theo hợp đồng công khai"
      - "Thay thế điểm mở rộng bằng Supplier hoặc composition khi không cần kế thừa"
  - level1: "Cấu hình và tích hợp"
    level2:
      - "Đặt quyết định chọn ConcreteCreator tại composition root"
      - "Ánh xạ cấu hình giao hàng sang Creator được hỗ trợ"
      - "Giới hạn switch lựa chọn ở điểm lắp ráp và tránh rải nhánh trong nghiệp vụ"
      - "Dùng registry cho các Creator khi số lượng lựa chọn tăng"
      - "Truyền dependency và cấu hình đã kiểm tra vào constructor của Creator"
      - "Kết hợp dependency injection với cơ chế gọi factory method"
      - "Phân biệt vòng đời Creator với vòng đời Product trong ứng dụng"
      - "Xử lý giá trị cấu hình không hợp lệ và Creator chưa được đăng ký"
  - level1: "Lỗi và hợp đồng"
    level2:
      - "Phân biệt lỗi cấu hình, lỗi tạo sản phẩm và lỗi khi sử dụng sản phẩm"
      - "Quy định factory method trả về sản phẩm hợp lệ hay ném exception"
      - "Tránh trả về null làm đẩy lỗi khởi tạo sang bước nghiệp vụ sau"
      - "Lựa chọn checked hoặc unchecked exception theo hợp đồng API"
      - "Giữ nguyên nguyên nhân lỗi khi chuyển đổi exception tại ranh giới tạo sản phẩm"
      - "Dọn dẹp tài nguyên khi quá trình tạo sản phẩm chỉ hoàn thành một phần"
      - "Thiết kế fallback tường minh khi sản phẩm ưu tiên không thể khởi tạo"
      - "Xác định nơi ghi log và tránh ghi cùng một lỗi ở nhiều tầng"
  - level1: "Vòng đời tài nguyên"
    level2:
      - "Xác định ai sở hữu và ai chịu trách nhiệm giải phóng Product"
      - "Đặt hợp đồng cho sản phẩm cần AutoCloseable và try-with-resources"
      - "Phân biệt sản phẩm tạo mới theo lần gọi với sản phẩm dùng chung"
      - "Thiết kế khởi tạo trì hoãn khi chi phí tạo sản phẩm cao"
      - "Cân nhắc caching trong Creator theo trạng thái và thời gian sống của sản phẩm"
      - "Giới hạn tái sử dụng khi Product chứa trạng thái của từng yêu cầu"
      - "Kết hợp object pool khi sản phẩm đắt đỏ và có thể hoàn trả an toàn"
      - "Làm rõ Factory Method không mặc định bảo đảm instance mới hoặc singleton"
  - level1: "Kiểu và generics"
    level2:
      - "Dùng Product làm kiểu trả về để giới hạn phụ thuộc của client"
      - "Áp dụng Creator với tham số kiểu khi cần giữ quan hệ kiểu sản phẩm"
      - "Sử dụng giới hạn kiểu extends Product trong khai báo generic"
      - "Phân biệt generics với kiểu trả về hiệp biến khi ghi đè phương thức"
      - "Giải thích vì sao không thể trực tiếp khởi tạo new T trong Java"
      - "Truyền Supplier hoặc đối tượng tạo thích hợp thay cho ép kiểu không an toàn"
      - "Tránh downcast và instanceof để gọi hành vi riêng sau khi tạo Product"
      - "Cân nhắc độ phức tạp của generics so với nhu cầu thiết kế thực tế"
  - level1: "Đồng thời và hiệu năng"
    level2:
      - "Đánh giá thread safety riêng cho Creator và cho Product"
      - "Thiết kế Creator không trạng thái để đơn giản hóa việc dùng chung"
      - "Bảo vệ trạng thái chia sẻ khi factory method có caching hoặc lazy initialization"
      - "Bảo đảm công bố an toàn đối với sản phẩm dùng chung giữa các luồng"
      - "Tránh tái sử dụng sản phẩm có trạng thái yêu cầu giữa các luồng"
      - "Phân biệt chi phí dispatch đa hình với chi phí khởi tạo và tài nguyên bên ngoài"
      - "Đo chi phí tạo sản phẩm trước khi thêm caching hoặc pooling"
      - "Đánh giá giới hạn khi factory method thực hiện thao tác chặn hoặc I/O"
  - level1: "Kiểm thử đơn vị"
    level2:
      - "Kiểm thử hành vi Truck và Ship độc lập với Creator bằng JUnit"
      - "Kiểm tra mỗi ConcreteCreator trả về sản phẩm đúng hợp đồng"
      - "Dùng Creator thử nghiệm để trả về fake Product cho quy trình chung"
      - "Xác minh quy trình gọi đúng hành vi và truyền đúng dữ liệu cho Product"
      - "Kiểm thử các nhánh nghiệp vụ bằng stub Product có kết quả điều khiển được"
      - "Chọn fake, stub hoặc mock dựa trên điều cần quan sát"
      - "Kiểm thử lỗi khởi tạo và lỗi sử dụng sản phẩm theo hợp đồng"
      - "Tránh kiểm thử private method hoặc phụ thuộc vào chi tiết constructor nội bộ"
  - level1: "Kiểm thử mở rộng"
    level2:
      - "Xây dựng bộ kiểm thử hợp đồng chung cho mọi triển khai Product"
      - "Dùng parameterized test cho các cặp Creator và Product tương ứng"
      - "Kiểm chứng quy trình vẫn hoạt động khi bổ sung AirLogistics"
      - "Kiểm thử ánh xạ cấu hình sang Creator ở tầng tích hợp"
      - "Kiểm thử cấu hình thiếu, lựa chọn không hỗ trợ và dependency không hợp lệ"
      - "Xác minh đóng tài nguyên trong cả nhánh thành công và nhánh thất bại"
      - "Kiểm thử cách ly trạng thái hoặc dùng chung sản phẩm theo vòng đời đã chọn"
      - "Đặt tiêu chí hồi quy cho hành vi cũ khi thêm biến thể sản phẩm mới"
  - level1: "Tái cấu trúc"
    level2:
      - "Nhận diện các lệnh new nằm trong quy trình cần mở rộng"
      - "Viết kiểm thử đặc tả hành vi hiện có trước khi thay đổi cấu trúc"
      - "Rút trích hợp đồng Product từ những thao tác nghiệp vụ đang sử dụng"
      - "Đưa việc tạo sản phẩm vào factory method trong Creator"
      - "Tạo ConcreteCreator và chuyển từng lựa chọn sản phẩm sang lớp phù hợp"
      - "Di chuyển việc chọn Creator ra điểm lắp ráp ứng dụng"
      - "Loại bỏ các nhánh và ép kiểu trùng lặp sau khi bảo toàn hành vi"
      - "So sánh mức phụ thuộc, số điểm sửa và độ phức tạp trước sau tái cấu trúc"
  - level1: "Nguyên lý thiết kế"
    level2:
      - "Open/Closed khi thêm sản phẩm và giới hạn tại điểm đăng ký Creator"
      - "Dependency Inversion khi logic nghiệp vụ sử dụng hợp đồng Product"
      - "Single Responsibility trong phân chia quy trình và quyết định tạo sản phẩm"
      - "Liskov Substitution đối với cả phân cấp Product và phân cấp Creator"
      - "Interface Segregation để tránh hợp đồng sản phẩm quá rộng"
      - "Liên kết giữa Factory Method, tính gắn kết và mức phụ thuộc"
      - "Đánh đổi giữa điểm mở rộng bằng kế thừa và thiết kế dùng composition"
      - "Tránh áp dụng mẫu chỉ để thay thế mọi lệnh new trong chương trình"
  - level1: "So sánh các factory"
    level2:
      - "Factory Method và Simple Factory về vị trí quyết định tạo sản phẩm"
      - "Factory Method và static factory method trong API Java"
      - "Factory Method và Abstract Factory về một sản phẩm và họ sản phẩm liên quan"
      - "Factory Method và constructor về khả năng thay đổi lớp sản phẩm"
      - "Factory Method và Supplier về cơ chế mở rộng bằng kế thừa hoặc truyền hành vi"
      - "Factory Method và dependency injection về trách nhiệm tạo và lắp ráp dependency"
      - "Phân biệt Factory Method dạng mẫu thiết kế với thuật ngữ factory trong thư viện"
      - "Lập bảng lựa chọn theo số biến thể, nhu cầu mở rộng và chi phí thêm lớp"
  - level1: "Phối hợp các mẫu"
    level2:
      - "Kết hợp Template Method khi quy trình chung gọi điểm tạo sản phẩm có thể ghi đè"
      - "Kết hợp Strategy khi sản phẩm cần thay đổi thuật toán sau khi được tạo"
      - "Kết hợp Adapter để đưa đối tượng từ thư viện ngoài về hợp đồng Product"
      - "Kết hợp Decorator để bổ sung hành vi cho sản phẩm trả về"
      - "Kết hợp Builder khi bản thân sản phẩm có cấu hình khởi tạo phức tạp"
      - "So sánh Prototype với Factory Method khi tạo bằng sao chép hoặc bằng lớp con"
      - "Nhận diện Abstract Factory có thể sử dụng các factory method bên trong"
      - "Đánh giá khi phối hợp nhiều mẫu làm tăng chi phí hiểu và kiểm thử"
  - level1: "Tình huống ứng dụng"
    level2:
      - "Tạo trình xuất báo cáo PDF và CSV trong một quy trình xuất chung"
      - "Tạo kênh gửi thông báo email và SMS với hợp đồng gửi thống nhất"
      - "Tạo parser cho nhiều định dạng trong quy trình nhập dữ liệu"
      - "Tạo bộ chuyển đổi giao thức cho các đối tác có API khác nhau"
      - "Cung cấp điểm mở rộng tạo đối tượng cho framework hoặc thư viện"
      - "Phân tích mức phù hợp khi chọn sản phẩm theo cấu hình lúc khởi động"
      - "Phân tích mức phù hợp khi loại sản phẩm thay đổi liên tục theo từng yêu cầu"
      - "Xác định trường hợp chỉ cần Simple Factory, Supplier hoặc dependency injection"
  - level1: "Sai lầm thường gặp"
    level2:
      - "Gọi một static factory hoặc switch tạo đối tượng là Factory Method GoF"
      - "Chỉ tạo lớp factory độc lập nhưng không có vai trò Creator và điểm ghi đè"
      - "Để ConcreteCreator chứa bản sao của toàn bộ quy trình nghiệp vụ"
      - "Dùng kiểu ConcreteProduct hoặc downcast trong mã dùng sản phẩm"
      - "Gọi phương thức có thể ghi đè trước khi lớp con khởi tạo hoàn chỉnh"
      - "Nhầm đa hình với việc tự động khám phá hoặc đăng ký sản phẩm mới"
      - "Đưa lựa chọn cấu hình, I/O và nghiệp vụ vào cùng một factory method"
      - "Tạo quá nhiều lớp Creator khi không có nhu cầu mở rộng tương ứng"
  - level1: "Bài tập thực hành"
    level2:
      - "Dựng ví dụ Logistics hoàn chỉnh với Truck và Ship trong Java"
      - "Thêm AirTransport và chứng minh quy trình chung được tái sử dụng"
      - "Tái cấu trúc chương trình có switch khởi tạo sang Factory Method"
