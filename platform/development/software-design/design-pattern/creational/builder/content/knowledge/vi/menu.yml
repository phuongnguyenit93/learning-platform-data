menu:
  - level1: "Tổng quan"
    level2:
      - "Builder là gì và mục đích tách quá trình xây dựng khỏi biểu diễn sản phẩm"
      - "Vị trí của Builder trong nhóm mẫu thiết kế khởi tạo"
      - "Khởi tạo từng bước khác gì với chỉnh sửa đối tượng sau khi tạo"
      - "Phân biệt Builder kiểu GoF, fluent builder và fluent interface"
      - "Lợi ích về khả năng đọc, kiểm soát tùy chọn và bảo vệ trạng thái hợp lệ"
      - "Giới hạn, chi phí bổ sung và điều kiện áp dụng Builder"
  - level1: "Bài toán khởi tạo"
    level2:
      - "Nhận diện constructor có quá nhiều tham số và khó hiểu tại nơi gọi"
      - "Vấn đề của telescoping constructor và nhiều tổ hợp overload"
      - "Nhầm thứ tự các tham số cùng kiểu và giá trị boolean thiếu ngữ nghĩa"
      - "Hạn chế của JavaBeans với setter và trạng thái khởi tạo dở dang"
      - "Đối tượng có nhiều tùy chọn, giá trị mặc định và ràng buộc chéo"
      - "Một quy trình xây dựng tạo ra nhiều biểu diễn sản phẩm"
      - "Tiêu chí chọn Builder từ độ phức tạp thực tế của miền nghiệp vụ"
  - level1: "Cấu trúc GoF"
    level2:
      - "Vai trò và trách nhiệm của Builder, ConcreteBuilder, Director và Product"
      - "Thiết kế hợp đồng cho các bước xây dựng"
      - "ConcreteBuilder lưu trạng thái trung gian và tạo biểu diễn cụ thể"
      - "Director điều phối thứ tự và tổ hợp các bước xây dựng"
      - "Client lựa chọn builder và yêu cầu quy trình phù hợp"
      - "Phân biệt giao diện xây dựng với giao diện sử dụng sản phẩm"
      - "Cách lấy kết quả khi các ConcreteBuilder tạo sản phẩm cùng kiểu hoặc khác kiểu"
      - "Sơ đồ lớp và luồng tương tác giữa các thành phần GoF"
  - level1: "Quy trình GoF"
    level2:
      - "Xác định các bước chung từ những biểu diễn cần xây dựng"
      - "Tách bước bắt buộc, bước tùy chọn và bước có thể lặp"
      - "Quy định điều kiện trước và sau mỗi bước xây dựng"
      - "Tổ chức nhiều công thức xây dựng trong Director"
      - "Cho phép client điều phối trực tiếp khi không cần Director"
      - "Xác định thời điểm hoàn tất và quyền truy cập sản phẩm trung gian"
      - "Xử lý bước thất bại, tài nguyên đang giữ và trạng thái cần hủy"
  - level1: "Thực hành GoF"
    level2:
      - "Phân tích bài toán tạo báo cáo với phần tiêu đề, nội dung và tổng kết"
      - "Định nghĩa hợp đồng ReportBuilder theo các bước tạo báo cáo"
      - "Cài đặt HtmlReportBuilder và mô hình kết quả HTML"
      - "Cài đặt PlainTextReportBuilder và mô hình kết quả văn bản thuần"
      - "Cài đặt ReportDirector với công thức báo cáo ngắn và báo cáo đầy đủ"
      - "Client thay builder để tạo biểu diễn khác từ cùng dữ liệu đầu vào"
      - "Lấy kết quả đúng kiểu và xác định chính sách khởi tạo lần xây dựng tiếp theo"
      - "Kiểm tra đầu ra và đánh giá phần phụ thuộc đã được tách khỏi Director"
  - level1: "Fluent builder"
    level2:
      - "Cấu trúc Product và static nested Builder theo phong cách Java"
      - "Tạo điểm vào builder và đặt constructor sản phẩm ở phạm vi phù hợp"
      - "Thiết kế phương thức cấu hình trả về chính builder để nối chuỗi"
      - "Dùng constructor của builder hoặc phương thức đầu vào cho tham số bắt buộc"
      - "Cài đặt build để kiểm tra trạng thái và tạo một sản phẩm hoàn chỉnh"
      - "Thực hành OrderRequest với mã khách hàng, địa chỉ và tùy chọn giao hàng"
      - "Đọc luồng gọi từ builder đến build và đối chiếu với cấu trúc GoF"
      - "Giải thích vì sao method chaining chưa đủ để một API trở thành Builder"
  - level1: "Dữ liệu và tùy chọn"
    level2:
      - "Phân loại thuộc tính bắt buộc, tùy chọn và thuộc tính được suy ra"
      - "Chọn nơi khai báo giá trị mặc định và thời điểm tính giá trị mặc định"
      - "Phân biệt chưa thiết lập, thiết lập null và chủ động xóa một giá trị"
      - "Xử lý kiểu nguyên thủy khi cần phân biệt giá trị mặc định với dữ liệu được nhập"
      - "Quy định ý nghĩa của nhiều lần gọi cấu hình trên cùng một thuộc tính"
      - "Thiết kế tùy chọn loại trừ nhau và tùy chọn phụ thuộc lẫn nhau"
      - "Xây dựng thuộc tính dẫn xuất sau khi đã có đầy đủ đầu vào"
      - "Sử dụng enum và kiểu giá trị để hạn chế tổ hợp tùy chọn vô nghĩa"
  - level1: "Kiểm tra trạng thái"
    level2:
      - "Xác định invariant của sản phẩm trước khi thiết kế builder"
      - "Kiểm tra lỗi cục bộ ngay tại bước nhận dữ liệu khi phù hợp"
      - "Kiểm tra thiếu trường bắt buộc và ràng buộc chéo khi gọi build"
      - "Chuẩn hóa dữ liệu đầu vào trước khi kiểm tra và tạo sản phẩm"
      - "Giữ quy tắc hợp lệ tại constructor hoặc lớp miền để tránh bỏ qua builder"
      - "Thiết kế thông báo lỗi có tên trường và ngữ cảnh nghiệp vụ"
      - "Chọn fail fast, thu thập nhiều lỗi hoặc trả về kết quả có cấu trúc"
      - "Phân biệt kiểm tra hình dạng dữ liệu với kiểm tra cần truy cập dịch vụ ngoài"
      - "Bảo đảm build thất bại không làm lộ sản phẩm sai và xác định khả năng thử lại"
  - level1: "Tính bất biến"
    level2:
      - "Tạo sản phẩm bất biến từ một builder có trạng thái thay đổi được"
      - "Kết hợp trường final, constructor được kiểm soát và việc không cung cấp setter"
      - "Sao chép phòng vệ với mảng, collection và đối tượng đầu vào có thể thay đổi"
      - "Phân biệt bản sao dữ liệu với lớp bọc collection chỉ cho phép đọc"
      - "Ngăn builder sửa ngược sản phẩm đã tạo qua tham chiếu dùng chung"
      - "Sao chép phòng vệ ở getter khi sản phẩm còn chứa thành phần thay đổi được"
      - "Thiết kế toBuilder và copy builder để tạo biến thể từ sản phẩm hiện có"
      - "Tránh để tham chiếu this hoặc sản phẩm chưa hoàn tất thoát khỏi quá trình tạo"
  - level1: "Đối tượng phức hợp"
    level2:
      - "Tổ chức builder cho aggregate và các đối tượng giá trị lồng nhau"
      - "Chọn nhận sản phẩm con đã hoàn chỉnh hay nhận cấu hình builder con"
      - "Thiết kế addItem, addAll và replaceItems với ngữ nghĩa rõ ràng"
      - "Kiểm soát thứ tự, phần tử trùng lặp và phần tử null trong tập hợp"
      - "Xác thực ràng buộc giữa sản phẩm cha và các thành phần con"
      - "Xử lý cấu trúc có tham chiếu vòng mà không làm lộ trạng thái chưa hoàn tất"
      - "Đánh giá độ sâu của chuỗi builder và tránh DSL lồng nhau khó đọc"
  - level1: "Vòng đời builder"
    level2:
      - "Chọn builder dùng một lần hay có thể tái sử dụng"
      - "Định nghĩa hành vi khi gọi build nhiều lần trên cùng builder"
      - "Quy định build có giữ nguyên, tiêu thụ hay đặt lại trạng thái"
      - "Tránh dữ liệu sót lại khi reset hoặc tái sử dụng builder"
      - "Phân biệt builder giữ kết quả đang xây dựng với builder chỉ giữ tham số"
      - "Nhận diện builder thường không an toàn khi chia sẻ giữa các luồng"
      - "Dùng builder riêng cho từng tác vụ và công bố sản phẩm an toàn"
      - "Quản lý builder, Director và tài nguyên theo phạm vi sử dụng"
  - level1: "Step builder"
    level2:
      - "Mô hình hóa thứ tự bước bằng các interface đại diện trạng thái"
      - "Chỉ mở phương thức build sau khi đã đi qua các bước bắt buộc"
      - "Cài đặt staged builder cho yêu cầu có thông tin bắt buộc theo thứ tự"
      - "Thiết kế bước tùy chọn và bước lặp trong API có trạng thái kiểu"
      - "Giới hạn kiểm tra lúc biên dịch đối với điều kiện phụ thuộc giá trị"
      - "So sánh số lượng kiểu và độ dễ đọc với fluent builder thông thường"
      - "Lựa chọn step builder khi lợi ích ngăn sai thao tác đủ lớn"
  - level1: "Kế thừa và generic"
    level2:
      - "Vấn đề mất kiểu builder con khi nối các phương thức kế thừa"
      - "Dùng self type và generic đệ quy để giữ kiểu trả về của builder con"
      - "Thiết kế builder cho lớp cơ sở trừu tượng và sản phẩm cụ thể"
      - "Ghi đè build với kiểu trả về hiệp biến khi phù hợp"
      - "Kết hợp kiểm tra invariant của lớp cha và lớp con"
      - "Ưu tiên composition khi phân cấp builder khiến hợp đồng khó hiểu"
      - "Đánh giá độ phức tạp generic và kiểm soát ép kiểu không an toàn"
  - level1: "So sánh constructor"
    level2:
      - "Chọn constructor trực tiếp cho đối tượng nhỏ với ít tham số rõ nghĩa"
      - "So sánh Builder với telescoping constructor về khả năng đọc và bảo trì"
      - "So sánh Builder với JavaBeans về trạng thái trung gian và tính bất biến"
      - "Dùng parameter object hoặc kiểu giá trị để gom nhóm tham số liên quan"
      - "So sánh khả năng biểu diễn trường bắt buộc và giá trị mặc định"
      - "Đánh giá ảnh hưởng khi bổ sung thuộc tính hoặc thay đổi yêu cầu khởi tạo"
      - "Lập tiêu chí lựa chọn theo invariant, số tổ hợp tùy chọn và độ phức tạp API"
  - level1: "So sánh factory"
    level2:
      - "Phân biệt static factory method với mẫu thiết kế Factory Method"
      - "Chọn static factory có tên để thể hiện ý nghĩa của một cách khởi tạo"
      - "So sánh Builder với Factory Method về tạo từng bước và lựa chọn lớp sản phẩm"
      - "So sánh Builder với Abstract Factory về xây dựng sản phẩm và tạo họ sản phẩm"
      - "Kết hợp factory chọn builder hoặc tạo builder đã có cấu hình ban đầu"
      - "Phân biệt build tạo đối tượng mới với factory có thể trả đối tượng dùng lại"
      - "Phân tích cùng một yêu cầu bằng constructor, factory và Builder"
  - level1: "Kết hợp mẫu"
    level2:
      - "Kết hợp Builder với Composite để tạo cấu trúc cây từng bước"
      - "Dùng Prototype hoặc bản mẫu làm đầu vào cho copy builder"
      - "Phân biệt vai trò Director với việc chọn thuật toán bằng Strategy"
      - "Kết hợp dependency injection để cung cấp phụ thuộc cho đối tượng được xây dựng"
      - "Phân biệt GoF Builder, fluent interface và DSL theo mục đích thiết kế"
      - "Đánh giá việc kết hợp mẫu qua mức giảm phụ thuộc và chi phí hiểu mã"
  - level1: "Java và thư viện"
    level2:
      - "Tổ chức package, quyền truy cập và lớp Builder lồng tĩnh trong Java"
      - "Kết hợp record với builder khi nhiều tùy chọn làm lời gọi canonical constructor khó đọc"
      - "Giữ kiểm tra invariant tại canonical constructor hoặc compact constructor của record"
      - "Dùng Lombok Builder và hiểu mã được sinh thay cho chỉ nhìn annotation"
      - "Kiểm tra giá trị mặc định, collection và toBuilder khi dùng Lombok"
      - "Đánh giá builder kế thừa do thư viện sinh và giới hạn của công cụ"
      - "Tích hợp Jackson với builder và kiểm tra đường giải tuần tự hóa"
      - "Dùng Bean Validation khi phù hợp và bảo đảm kiểm tra được gọi trước khi trả sản phẩm"
  - level1: "Thiết kế API"
    level2:
      - "Đặt tên builder, các bước cấu hình và build theo ngôn ngữ miền nghiệp vụ"
      - "Giữ phương thức nối chuỗi nhất quán về kiểu trả về và tác động trạng thái"
      - "Cân nhắc overload, varargs và các lời gọi có null dễ gây nhập nhằng"
      - "Tài liệu hóa mặc định, null, ràng buộc, tái sử dụng và tính an toàn luồng"
      - "Tách cấu hình đối tượng khỏi hành động có tác dụng phụ như gửi hoặc lưu"
      - "Phát triển API khi thêm tùy chọn và giữ tương thích cho mã gọi hiện có"
      - "Viết ví dụ gọi tối thiểu, đầy đủ và thất bại để kiểm tra độ dễ dùng"
  - level1: "Kiểm thử"
    level2:
      - "Kiểm thử đường đi tối thiểu với đầy đủ dữ liệu bắt buộc"
      - "Kiểm thử cấu hình đầy đủ và mọi giá trị mặc định"
      - "Kiểm thử dữ liệu biên, trường thiếu, null và ràng buộc chéo"
      - "Kiểm thử thứ tự gọi có ảnh hưởng và các bước cấu hình được lặp lại"
      - "Kiểm thử build thất bại, sửa dữ liệu và thử xây dựng lại theo hợp đồng"
      - "Kiểm thử tính độc lập giữa sản phẩm và dữ liệu đầu vào có thể thay đổi"
      - "Kiểm thử build nhiều lần, reset, copy builder và toBuilder"
      - "Kiểm thử các công thức Director với từng ConcreteBuilder và kết quả quan sát được"
      - "Dùng kiểm thử tham số hóa hoặc theo thuộc tính cho tổ hợp tùy chọn và invariant"
  - level1: "Hiệu năng"
    level2:
      - "Nhận diện chi phí cấp phát builder, sản phẩm và bản sao phòng vệ"
      - "Đánh giá chi phí validation và tập hợp lớn trong quá trình xây dựng"
      - "So sánh công bằng constructor, factory và Builder với cùng yêu cầu nghiệp vụ"
      - "Dùng JMH khi cần đo chi phí tạo đối tượng trong đoạn mã quan trọng"
      - "Tránh kết luận từ phép đo thiếu warmup hoặc bị loại bỏ tính toán không dùng kết quả"
      - "Cân nhắc tái sử dụng và pooling trước nguy cơ sót trạng thái hoặc tranh chấp luồng"
  - level1: "Lạm dụng và lỗi"
    level2:
      - "Nhận diện Builder dư thừa cho đối tượng có ít tham số và cách tạo đơn giản"
      - "Nhầm chuỗi setter hoặc mọi fluent API với mẫu Builder"
      - "Để sản phẩm chưa hợp lệ thoát ra trước khi build hoàn tất"
      - "Cho phép đường khởi tạo khác bỏ qua invariant của sản phẩm"
      - "Chia sẻ builder giữa nhiều yêu cầu hoặc nhiều luồng"
      - "Giữ chung collection khiến dữ liệu sản phẩm thay đổi sau build"
      - "Đưa I/O, nghiệp vụ điều phối hoặc tác dụng phụ bất ngờ vào build"
      - "Tạo quá nhiều Director, interface bước và generic không đem lại lợi ích rõ ràng"
      - "Sao chép quy tắc validation nhiều nơi khiến hành vi khởi tạo không nhất quán"
  - level1: "Thực hành tổng hợp"
    level2:
      - "Refactor một constructor nhiều tham số sang fluent builder theo từng bước"
      - "Giữ tương thích với cách khởi tạo cũ trong giai đoạn chuyển đổi"
      - "Hoàn thiện OrderRequest với tùy chọn giao hàng và các invariant nghiệp vụ"
      - "Mở rộng ví dụ báo cáo GoF bằng biểu diễn mới và đánh giá thay đổi cần thiết"
      - "Thiết kế step builder cho quy trình có thứ tự bắt buộc và giải thích đánh đổi"
      - "So sánh ba phương án constructor, factory và Builder bằng cùng bộ tình huống"
      - "Rà soát mã theo tính bất biến, ngữ nghĩa build, validation và vòng đời builder"
      - "Nhận diện một Builder bị lạm dụng và đơn giản hóa thiết kế có căn cứ"
