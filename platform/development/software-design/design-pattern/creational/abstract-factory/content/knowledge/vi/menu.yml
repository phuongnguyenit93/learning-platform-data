menu:
  - level1: "Tổng quan"
    level2:
      - "Khái niệm Abstract Factory và mục tiêu tạo các họ đối tượng liên quan"
      - "Ý nghĩa của việc tạo đối tượng qua interface thay vì phụ thuộc lớp triển khai"
      - "Vị trí của Abstract Factory trong nhóm mẫu thiết kế khởi tạo"
      - "Lợi ích của việc tách logic nghiệp vụ khỏi quyết định chọn biến thể"
      - "Điều kiện áp dụng khi ứng dụng cần nhiều họ sản phẩm tương thích"
      - "Phạm vi bài học, kiến thức Java cần có và kết quả học tập mong đợi"
  - level1: "Nhận diện bài toán"
    level2:
      - "Bài toán giao diện đa nền tảng với Button và Checkbox cùng phong cách"
      - "Sự lan rộng của new, tên lớp cụ thể và điều kiện if hoặc switch trong mã khách"
      - "Rủi ro khi khởi tạo và kết hợp sản phẩm thuộc các họ khác nhau"
      - "Phân biệt nhu cầu tạo một đối tượng với nhu cầu tạo cả họ sản phẩm"
      - "Xác định các chiều biến thiên và phần hành vi cần giữ ổn định"
      - "Tiêu chí chọn Abstract Factory và trường hợp một factory đơn giản đã đủ"
  - level1: "Họ sản phẩm"
    level2:
      - "Phân biệt loại sản phẩm, biến thể sản phẩm và họ sản phẩm"
      - "Lập ma trận loại sản phẩm và biến thể để xác định phạm vi factory"
      - "Định nghĩa tính tương thích về giao thức, dữ liệu và quy tắc nghiệp vụ"
      - "Phân biệt tương thích về kiểu dữ liệu với tương thích về ngữ nghĩa"
      - "Xác định sản phẩm bắt buộc, tùy chọn và tổ hợp không được hỗ trợ"
      - "Giữ ranh giới họ sản phẩm đủ gắn kết để tránh factory ôm nhiều trách nhiệm"
      - "Mô tả bất biến mà mọi sản phẩm trong cùng một họ phải tuân thủ"
  - level1: "Cấu trúc và cộng tác"
    level2:
      - "Vai trò AbstractFactory trong việc công bố các phương thức tạo sản phẩm"
      - "Vai trò ConcreteFactory trong việc hiện thực một họ sản phẩm cụ thể"
      - "Vai trò AbstractProduct trong việc định nghĩa hợp đồng của từng loại sản phẩm"
      - "Vai trò ConcreteProduct trong việc cung cấp hành vi cho từng biến thể"
      - "Vai trò Client khi chỉ làm việc với factory và product qua abstraction"
      - "Sơ đồ lớp UML và quan hệ phụ thuộc giữa factory, product và client"
      - "Sơ đồ tuần tự từ chọn factory đến tạo và phối hợp các sản phẩm"
  - level1: "Thiết kế interface"
    level2:
      - "Thiết kế interface riêng cho từng loại sản phẩm theo hành vi người dùng cần"
      - "Thiết kế factory interface với kiểu trả về là product interface"
      - "Đặt tên phương thức tạo thể hiện rõ sản phẩm và ý nghĩa sử dụng"
      - "Truyền cấu hình chung và tham số riêng mà không làm lộ lớp triển khai"
      - "Thiết kế hợp đồng lỗi khi tham số không hợp lệ hoặc sản phẩm không được hỗ trợ"
      - "Cân nhắc generic và kiểu đánh dấu họ sản phẩm khi cần ràng buộc tương thích"
      - "Áp dụng DIP, OCP và ISP vào ranh giới giữa client, factory và product"
  - level1: "Luồng khởi tạo"
    level2:
      - "Tách bước chọn họ sản phẩm khỏi bước tạo đối tượng và sử dụng hành vi"
      - "Tổ chức composition root làm nơi duy nhất lắp ráp các lớp triển khai"
      - "Truyền AbstractFactory vào client qua constructor injection"
      - "Theo dõi luồng gọi từ client đến ConcreteFactory và ConcreteProduct"
      - "Xác định nơi còn phụ thuộc lớp cụ thể sau khi áp dụng mẫu thiết kế"
      - "Phân biệt trách nhiệm tạo sản phẩm với trách nhiệm điều phối nghiệp vụ"
  - level1: "Hiện thực bằng Java"
    level2:
      - "Xây dựng ví dụ xuyên suốt với GUIFactory, Button và Checkbox"
      - "Khai báo interface Button và Checkbox bằng các thao tác phù hợp miền giao diện"
      - "Khai báo GUIFactory với createButton và createCheckbox"
      - "Hiện thực họ LightButton và LightCheckbox cùng LightGUIFactory"
      - "Hiện thực họ DarkButton và DarkCheckbox cùng DarkGUIFactory"
      - "Xây dựng Application nhận GUIFactory và phối hợp các sản phẩm"
      - "Lắp ráp chương trình trong main và chạy lần lượt hai họ sản phẩm"
      - "Tổ chức package, phạm vi truy cập và constructor để hạn chế phụ thuộc sai"
      - "Đọc kết quả chạy và đối chiếu mã Java với các vai trò trong sơ đồ UML"
  - level1: "Lựa chọn biến thể"
    level2:
      - "Chọn factory từ tham số dòng lệnh, tệp cấu hình hoặc biến môi trường"
      - "Tập trung ánh xạ cấu hình sang ConcreteFactory tại điểm lắp ráp"
      - "Dùng enum và registry khi cần quản lý danh sách biến thể được hỗ trợ"
      - "Phát hiện cấu hình sai và quyết định báo lỗi hoặc dùng biến thể mặc định"
      - "Phân biệt đổi biến thể khi khởi động với đổi biến thể trong lúc chạy"
      - "Đổi factory có kiểm soát và tái tạo các sản phẩm đang phụ thuộc họ cũ"
      - "Giới hạn phạm vi factory theo ứng dụng, yêu cầu hoặc tenant để tránh dùng nhầm"
  - level1: "Bảo đảm tương thích"
    level2:
      - "Duy trì một factory nhất quán cho các sản phẩm cần cộng tác"
      - "Nhận diện các đường khởi tạo có thể đưa sản phẩm khác họ vào client"
      - "Giới hạn API và constructor để giảm khả năng trộn họ ngoài ý muốn"
      - "Dùng generic hoặc family token khi kiểm tra kiểu thông thường chưa đủ"
      - "Kiểm tra tương thích lúc chạy khi cấu hình động hoặc plugin không bảo đảm được lúc biên dịch"
      - "Thiết kế sản phẩm cộng tác qua hợp đồng chung thay vì ép kiểu sang lớp cụ thể"
      - "Phân tích giới hạn của Abstract Factory khi client vẫn có thể lấy sản phẩm từ nguồn khác"
  - level1: "Vòng đời và tài nguyên"
    level2:
      - "Phân biệt tạo mới, dùng lại và cache sản phẩm trong cùng một factory"
      - "Xác định quyền sở hữu và nơi chịu trách nhiệm đóng tài nguyên"
      - "Kết hợp AutoCloseable và try-with-resources với sản phẩm quản lý tài nguyên"
      - "Xử lý thất bại khi chỉ một phần các sản phẩm trong họ được tạo thành công"
      - "Đánh giá tính an toàn luồng của factory không trạng thái và factory có cache"
      - "Phân biệt Abstract Factory với Singleton và tránh mặc định chia sẻ mọi sản phẩm"
  - level1: "Kiểm thử"
    level2:
      - "Lập ma trận kiểm thử theo họ sản phẩm, loại sản phẩm và tình huống cộng tác"
      - "Viết unit test bằng JUnit cho từng ConcreteFactory và hợp đồng trả về"
      - "Dùng bộ contract test chung để kiểm tra mọi họ thực hiện đúng product interface"
      - "Viết kiểm thử tham số hóa để chạy cùng hành vi client với nhiều factory"
      - "Kiểm thử tích hợp cho các cặp sản phẩm cần tương thích về ngữ nghĩa"
      - "Dùng fake factory và fake product để kiểm thử client độc lập với hạ tầng"
      - "Kiểm thử chọn biến thể, cấu hình sai và sản phẩm không được hỗ trợ"
      - "Kiểm thử đổi biến thể và bảo đảm sản phẩm cũ không bị kết hợp với họ mới"
      - "Tránh khẳng định quá chặt tên lớp cụ thể và bổ sung kiểm thử hồi quy khi thêm họ"
  - level1: "Thêm họ sản phẩm"
    level2:
      - "Thêm họ HighContrast vào ma trận sản phẩm của ví dụ Java"
      - "Hiện thực đầy đủ các ConcreteProduct và ConcreteFactory của họ mới"
      - "Đăng ký factory mới trong cấu hình hoặc cơ chế khám phá biến thể"
      - "Xác minh client tiếp tục hoạt động qua các interface hiện có"
      - "Tái sử dụng contract test và mở rộng kiểm thử tương thích cho họ mới"
      - "Đánh giá những điểm vẫn phải thay đổi tại composition root và cấu hình triển khai"
  - level1: "Thêm loại sản phẩm"
    level2:
      - "Thêm Slider vào ví dụ để quan sát sự thay đổi theo chiều loại sản phẩm"
      - "Bổ sung product interface và phương thức tạo trong AbstractFactory"
      - "Cập nhật mọi ConcreteFactory và từng họ sản phẩm đang hỗ trợ"
      - "Phân tích ảnh hưởng tới mã nguồn, hợp đồng API và các bên triển khai factory"
      - "Cân nhắc tách factory theo năng lực khi một số họ không hỗ trợ sản phẩm mới"
      - "So sánh chi phí thêm loại sản phẩm với chi phí thêm họ sản phẩm"
  - level1: "Tái cấu trúc"
    level2:
      - "Nhận diện điểm khởi tạo trùng lặp và điều kiện chọn biến thể trong mã Java hiện hữu"
      - "Viết kiểm thử mô tả hành vi trước khi thay đổi cấu trúc tạo đối tượng"
      - "Trích xuất product interface từ các lớp cụ thể đang được sử dụng"
      - "Gom các thao tác tạo cùng họ vào ConcreteFactory rồi trích xuất AbstractFactory"
      - "Thay phụ thuộc lớp cụ thể bằng constructor injection trong client"
      - "Di chuyển quyết định chọn họ về composition root theo từng bước nhỏ"
      - "So sánh hành vi trước và sau tái cấu trúc bằng kiểm thử hồi quy"
  - level1: "Tích hợp kiến trúc"
    level2:
      - "Đặt interface và lớp triển khai trong cấu trúc package có hướng phụ thuộc rõ ràng"
      - "Kết hợp Abstract Factory với dependency injection container khi ứng dụng đã sử dụng container"
      - "Phân biệt factory nghiệp vụ với chức năng khởi tạo và quản lý bean của container"
      - "Dùng factory tại ranh giới hạ tầng trong kiến trúc phân lớp hoặc ports and adapters"
      - "Khám phá ConcreteFactory qua Java ServiceLoader cho kiến trúc plugin"
      - "Truyền cấu hình và dependency dùng chung mà không biến factory thành Service Locator"
      - "Theo dõi lỗi và thông tin biến thể tại điểm tạo sản phẩm để hỗ trợ vận hành"
  - level1: "Tình huống ứng dụng"
    level2:
      - "Bộ thành phần giao diện cùng theme hoặc cùng nền tảng"
      - "Bộ render văn bản, bảng và biểu đồ cho các định dạng tài liệu khác nhau"
      - "Bộ client lưu trữ, hàng đợi và thông báo theo từng nhà cung cấp hạ tầng"
      - "Bộ parser, validator và serializer dùng chung phiên bản định dạng dữ liệu"
      - "Bộ adapter môi trường thật và môi trường mô phỏng phục vụ kiểm thử"
      - "Đánh giá độ gắn kết và khác biệt năng lực trước khi gom các dịch vụ vào một họ"
  - level1: "So sánh mẫu thiết kế"
    level2:
      - "Abstract Factory và Factory Method về mục tiêu, cấu trúc và phạm vi tạo đối tượng"
      - "Abstract Factory và Simple Factory khi cần chọn một lớp từ một nhóm"
      - "Abstract Factory và Builder khi cần tạo họ sản phẩm hoặc lắp ráp một đối tượng phức tạp"
      - "Abstract Factory và Prototype khi sản phẩm được tạo bằng sao chép mẫu"
      - "Abstract Factory và Strategy khi thay cách tạo đối tượng hoặc thay thuật toán"
      - "Abstract Factory và Bridge khi tách các chiều biến thiên của abstraction và implementation"
      - "Kết hợp Factory Method hoặc Prototype bên trong một ConcreteFactory"
      - "Bảng tiêu chí lựa chọn dựa trên số họ, số loại sản phẩm và hướng mở rộng"
  - level1: "Chi phí và đánh đổi"
    level2:
      - "Đánh giá lợi ích về tính nhất quán, khả năng thay thế và cô lập phụ thuộc"
      - "Ước lượng số interface, lớp và factory tăng theo ma trận sản phẩm"
      - "Phân tích độ phức tạp do thêm lớp gián tiếp và chi phí đọc hiểu luồng khởi tạo"
      - "Đánh giá chi phí bảo trì khi các họ sản phẩm phát triển không đồng đều"
      - "Cân nhắc tính ổn định của product interface trước khi công khai API"
      - "Đo chi phí khởi tạo và cấp phát khi có vấn đề hiệu năng thực tế"
      - "Chọn giải pháp đơn giản hơn khi chưa có nhu cầu về họ sản phẩm"
  - level1: "Lỗi thường gặp"
    level2:
      - "Factory trả về lớp cụ thể khiến client tiếp tục phụ thuộc chi tiết triển khai"
      - "Client tự new sản phẩm hoặc trộn sản phẩm từ nhiều factory"
      - "Lặp lại if hoặc switch chọn biến thể trong từng phương thức nghiệp vụ"
      - "Dùng một factory khổng lồ cho các sản phẩm không có quan hệ tương thích"
      - "Nhầm Abstract Factory với một lớp gom các phương thức static tạo đối tượng"
      - "Trả về null hoặc ném UnsupportedOperationException để che lấp hợp đồng không phù hợp"
      - "Ép kiểu, dùng instanceof hoặc truy vấn tên lớp để chọn hành vi trong client"
      - "Đổi factory nhưng giữ sản phẩm cũ, cache sai phạm vi hoặc bỏ sót đóng tài nguyên"
  - level1: "Bài tập thực hành"
    level2:
      - "Phân tích một đề bài và lập ma trận họ sản phẩm trước khi thiết kế lớp"
      - "Vẽ sơ đồ UML và hiện thực ví dụ Light và Dark bằng Java"
      - "Thêm họ HighContrast và ghi lại số điểm cần sửa trong chương trình"
      - "Thêm Slider vào mọi họ và so sánh tác động với việc thêm biến thể"
      - "Tạo lỗi trộn họ có chủ đích rồi bổ sung cơ chế phát hiện và kiểm thử"
      - "Tái cấu trúc chương trình chứa nhiều nhánh khởi tạo sang Abstract Factory"
      - "Xây dựng một tình huống ứng dụng khác và giải thích lựa chọn cùng phương án thay thế"
  - level1: "Đánh giá thiết kế"
    level2:
      - "Kiểm tra khả năng giải thích đúng vai trò factory, product và client"
      - "Kiểm tra client chỉ phụ thuộc abstraction ở các ranh giới đã xác định"
      - "Kiểm tra mỗi họ đáp ứng đầy đủ hợp đồng và quy tắc tương thích"
      - "Chứng minh đổi biến thể bằng cấu hình và kiểm thử mà không sửa logic nghiệp vụ"
      - "Đánh giá chất lượng mã Java, kiểm thử và xử lý lỗi trong bài thực hành"
      - "Tổng hợp quyết định thiết kế, chi phí mở rộng và hướng bảo trì phù hợp"
