menu:
  - level1: "Tổng quan Prototype"
    level2:
      - "Ý định của Prototype và cách tạo đối tượng từ một nguyên mẫu"
      - "Bài toán client phụ thuộc trực tiếp vào lớp khởi tạo cụ thể"
      - "Phân biệt nguyên mẫu, bản sao và đối tượng được cấu hình sau sao chép"
      - "Khi khởi tạo tốn công hoặc cần lựa chọn cấu hình tại runtime"
      - "Lợi ích, chi phí và giới hạn của việc tạo đối tượng bằng sao chép"
      - "Điều kiện phù hợp và dấu hiệu không nên dùng Prototype"
      - "Phạm vi học: hợp đồng copy, shallow/deep copy, Registry và tham chiếu mutable"
  - level1: "Cấu trúc mẫu"
    level2:
      - "Vai trò của Prototype, ConcretePrototype và Client"
      - "Thiết kế sơ đồ lớp và quan hệ giữa các vai trò"
      - "Luồng chọn nguyên mẫu, gọi copy và tùy biến bản sao"
      - "Tách giao diện sao chép khỏi cách khởi tạo lớp cụ thể"
      - "Phân biệt sao chép trạng thái với tái sử dụng cùng một instance"
      - "Phân biệt nguyên mẫu đang dùng trực tiếp và nguyên mẫu được lưu trong Registry"
  - level1: "Hợp đồng copy"
    level2:
      - "Định nghĩa trạng thái được sao chép và trạng thái được tạo lại"
      - "Cam kết về instance mới, kiểu runtime và mức tương đương trạng thái"
      - "Quy định mức độc lập giữa nguồn và bản sao sau khi sửa dữ liệu"
      - "Chính sách cho từng field: sao chép giá trị, chia sẻ, deep copy hoặc bỏ qua"
      - "Phân biệt giá trị bằng nhau, định danh đối tượng và định danh nghiệp vụ"
      - "Cam kết giữ nguyên đối tượng nguồn và các bất biến miền"
      - "Quy định dữ liệu null, giá trị mặc định và trường hợp không thể sao chép"
      - "Đặt tên copy, shallowCopy hoặc deepCopy để thể hiện đúng ngữ nghĩa"
      - "Ghi rõ tiền điều kiện, hậu điều kiện và lỗi trong tài liệu API"
  - level1: "Prototype trong Java"
    level2:
      - "Xây dựng giao diện Prototype<T> với phương thức copy có kiểu trả về rõ ràng"
      - "Cài đặt nguyên mẫu Shape, Circle và Rectangle với trạng thái mutable"
      - "Tạo bản sao qua giao diện mà client không gọi constructor của lớp cụ thể"
      - "Sao chép danh sách nguyên mẫu khác kiểu và bảo toàn hành vi đa hình"
      - "Tùy biến bản sao mà vẫn giữ nguyên trạng thái của nguyên mẫu"
      - "Tổ chức package, phạm vi truy cập và điểm khởi tạo nguyên mẫu"
      - "Theo dõi trạng thái và quan hệ tham chiếu trước và sau mỗi lần copy"
  - level1: "Shallow copy"
    level2:
      - "Cơ chế sao chép field primitive và giá trị tham chiếu"
      - "Field immutable có thể chia sẻ và field mutable gây aliasing"
      - "Phân biệt tạo container mới với sao chép các phần tử bên trong"
      - "Quan sát thay đổi lan truyền khi bản sao dùng chung đối tượng lồng nhau"
      - "Vì sao final trên một field tham chiếu không làm đối tượng được trỏ tới bất biến"
      - "Khi shallow copy là chủ đích hợp lệ và cách công bố hợp đồng"
      - "Thiết kế ví dụ và kiểm chứng phạm vi độc lập của shallow copy"
  - level1: "Deep copy"
    level2:
      - "Xác định ranh giới deep copy theo quyền sở hữu dữ liệu của miền"
      - "Sao chép thủ công các field mutable và đối tượng lồng nhiều tầng"
      - "Chia sẻ an toàn thành phần immutable trong một bản deep copy"
      - "Phối hợp copy giữa các lớp thành phần thay vì truy cập xuyên cấu trúc"
      - "Xử lý null, thành phần tùy chọn và cấu trúc rỗng"
      - "Phân biệt deep copy toàn đồ thị với sao chép chọn lọc theo chính sách"
      - "Kiểm soát độ sâu đệ quy, thời gian và bộ nhớ của thao tác sao chép"
      - "Kiểm chứng sửa dữ liệu từ hai phía không vượt qua ranh giới độc lập đã cam kết"
  - level1: "Đồ thị tham chiếu"
    level2:
      - "Phân biệt cây đối tượng, đồ thị dùng chung nút và đồ thị có chu trình"
      - "Bảo toàn quan hệ dùng chung bên trong bản sao khi hợp đồng yêu cầu"
      - "Dùng bảng ánh xạ nguồn sang bản sao để tránh nhân đôi cùng một nút"
      - "Dùng IdentityHashMap khi theo dõi định danh thay vì equals và hashCode"
      - "Đăng ký bản sao tạm trước khi duyệt cạnh để xử lý self-reference và chu trình"
      - "Giữ đúng kiểu runtime khi sao chép các nút đa hình"
      - "Tách nút thuộc quyền sở hữu khỏi nút được phép chia sẻ với hệ thống bên ngoài"
      - "Kiểm thử đồ thị có chu trình, nút dùng chung và đường dẫn tham chiếu lặp lại"
  - level1: "Kế thừa và đa hình"
    level2:
      - "Thiết kế hợp đồng copy xuyên suốt cây kế thừa"
      - "Dùng kiểu trả về hiệp biến để giữ API thuận tiện cho lớp con"
      - "Sao chép đầy đủ trạng thái của lớp cha và lớp con"
      - "Tránh tạo nhầm kiểu lớp cha làm mất dữ liệu hoặc hành vi của lớp con"
      - "Phân công trách nhiệm cho lớp abstract và lớp concrete"
      - "Cân nhắc final, composition và giới hạn mở rộng để bảo toàn hợp đồng"
      - "Kiểm thử copy qua biến kiểu cha với nhiều lớp con"
  - level1: "Constructor và factory"
    level2:
      - "Dùng copy constructor làm chi tiết cài đặt cho phương thức copy"
      - "Dùng static copy factory để đặt tên và kiểm soát chính sách sao chép"
      - "Giới hạn của copy constructor và static factory khi client chỉ biết kiểu cha"
      - "Khởi tạo field final và kiểm tra tính hợp lệ thông qua constructor"
      - "Phân biệt cơ chế cài đặt sao chép với vai trò của mẫu Prototype"
      - "Giảm lặp logic giữa constructor thông thường, copy constructor và factory"
      - "Chọn API sao chép phù hợp với khả năng mở rộng và bảo trì"
  - level1: "Cloneable và clone()"
    level2:
      - "Vai trò marker của Cloneable và hợp đồng Object.clone() trong Java"
      - "Quyền truy cập của clone và ý nghĩa của CloneNotSupportedException"
      - "Hành vi shallow copy của Object.clone và trách nhiệm xử lý field mutable"
      - "Luồng super.clone trong cây kế thừa và việc constructor không được gọi"
      - "Ảnh hưởng của field final, trạng thái cần kiểm tra và bất biến của lớp"
      - "Mở quyền truy cập, dùng kiểu trả về hiệp biến và xử lý exception"
      - "So sánh clone với một API copy tường minh qua cùng ví dụ"
      - "Giới hạn của Cloneable và tiêu chí chọn phương án triển khai"
  - level1: "Sao chép tập hợp"
    level2:
      - "Sao chép mảng primitive và mảng chứa đối tượng mutable"
      - "Sao chép List, Set và Map ở mức container và mức phần tử"
      - "Xác định chính sách copy cho cả key và value trong Map"
      - "Bảo toàn thứ tự, comparator và đặc tính cần thiết của collection"
      - "Xử lý collection lồng nhau và phần tử dùng chung giữa nhiều collection"
      - "Phân biệt unmodifiable view, container độc lập và dữ liệu immutable"
      - "Nhận diện giới hạn của copyOf, constructor collection và array clone"
      - "Kiểm soát equals và hashCode khi key hoặc phần tử Set có trạng thái mutable"
  - level1: "Bảo toàn tính hợp lệ"
    level2:
      - "Quy định sao chép hay cấp mới ID, mã nghiệp vụ và thời điểm tạo"
      - "Sao chép value object và entity theo ý nghĩa của miền"
      - "Tái lập quan hệ hai chiều và tham chiếu tới đối tượng cha"
      - "Kiểm tra ràng buộc liên field trước khi công bố bản sao"
      - "Quyết định giữ, xóa hoặc tính lại cache và giá trị dẫn xuất"
      - "Xử lý trạng thái vòng đời như nháp, đã lưu hoặc đã kích hoạt"
      - "Tránh sao chép nhầm thông tin kiểm toán, quyền truy cập và dữ liệu riêng của instance"
  - level1: "Prototype Registry"
    level2:
      - "Mục đích và cấu trúc Registry ánh xạ khóa tới nguyên mẫu"
      - "Thiết kế API register, lookup, createCopy và unregister"
      - "Chọn khóa chuỗi, enum hoặc kiểu miền thay cho phụ thuộc lớp cụ thể"
      - "Trả về bản sao khi yêu cầu tạo đối tượng từ Registry"
      - "Quy định Registry lưu bản gốc, bản sao lúc đăng ký hay cấu hình immutable"
      - "Ngăn bên đăng ký và bên sử dụng vô tình sửa nguyên mẫu đã lưu"
      - "Xử lý khóa không tồn tại, khóa trùng và thao tác thay thế nguyên mẫu"
      - "Dùng generics hoặc Registry theo nhóm để giữ an toàn kiểu"
      - "Kiểm thử nhiều lần lấy cùng một khóa tạo các instance độc lập"
  - level1: "Vòng đời nguyên mẫu"
    level2:
      - "Khởi tạo và đăng ký các nguyên mẫu tại điểm lắp ghép ứng dụng"
      - "Xác thực nguyên mẫu trước khi cho phép client sử dụng"
      - "Tách cấu hình mẫu khỏi dữ liệu riêng của từng lần tạo đối tượng"
      - "Quản lý phiên bản và thay thế nguyên mẫu khi cấu hình thay đổi"
      - "Xác định phạm vi Registry theo ứng dụng, phiên làm việc hoặc tenant"
      - "Chính sách xóa nguyên mẫu và xử lý các bản sao đã tạo trước đó"
      - "Tránh biến Registry thành biến toàn cục gây phụ thuộc ẩn"
  - level1: "Sao chép đồng thời"
    level2:
      - "Rủi ro bản sao chứa trạng thái không nhất quán khi nguồn đang bị sửa"
      - "Chọn immutable prototype, khóa đồng bộ hoặc snapshot theo phiên bản"
      - "Xác định phạm vi khóa để lấy được trạng thái nhất quán của toàn cấu trúc"
      - "Phân biệt Registry an toàn luồng với đối tượng nguyên mẫu an toàn luồng"
      - "Phối hợp đăng ký, tra cứu và thay thế nguyên mẫu một cách nhất quán"
      - "Công bố bản sao sau khi khởi tạo hoàn chỉnh và bảo đảm khả năng nhìn thấy trạng thái"
      - "Kiểm thử cạnh tranh khi copy, cập nhật nguyên mẫu và thay thế mục Registry"
  - level1: "Tài nguyên và lỗi"
    level2:
      - "Xác định chính sách cho stream, socket, connection, lock và tài nguyên ngoài bộ nhớ"
      - "Quyết định chia sẻ dịch vụ, tạo tài nguyên mới hoặc từ chối sao chép"
      - "Xử lý callback, listener và tham chiếu tới đối tượng nguồn"
      - "Giữ nguồn nguyên vẹn và không công bố bản sao chưa hoàn chỉnh khi có lỗi"
      - "Giải phóng tài nguyên đã cấp phát nếu thao tác sao chép thất bại giữa chừng"
      - "Đánh giá serialization, JSON mapping và reflection theo hợp đồng, bảo mật và chi phí"
      - "Tránh sao chép mù trạng thái persistence, proxy hoặc đối tượng gắn với framework"
  - level1: "Phối hợp mẫu thiết kế"
    level2:
      - "So sánh Prototype với Factory Method theo cách quyết định đối tượng được tạo"
      - "Phối hợp Abstract Factory và Registry để tạo họ đối tượng từ nguyên mẫu"
      - "So sánh Prototype với Builder khi cần xây dựng cấu hình nhiều bước"
      - "Phân biệt sao chép trạng thái với chia sẻ trạng thái trong Flyweight"
      - "Phân biệt bản sao Prototype với snapshot phục hồi của Memento"
      - "Đánh giá copy-on-write và persistent data structure như phương án quản lý dữ liệu"
      - "Chọn composition, immutable object hoặc khởi tạo trực tiếp khi giải pháp đơn giản hơn"
  - level1: "Kiểm thử hợp đồng"
    level2:
      - "Xây dựng bộ kiểm thử hợp đồng dùng chung cho các ConcretePrototype"
      - "Kiểm tra instance khác nhau, kiểu runtime đúng và trạng thái ban đầu tương đương"
      - "Kiểm tra thay đổi hai chiều trên từng field mutable"
      - "Kiểm tra thành phần phải độc lập và thành phần được chủ đích chia sẻ"
      - "Kiểm tra null, collection rỗng, nhiều tầng và cấu trúc có chu trình"
      - "Kiểm tra bảo toàn alias nội bộ và định danh nghiệp vụ theo chính sách"
      - "Kiểm tra constructor, lớp con mới và field mới không phá hợp đồng copy"
      - "Kiểm thử Registry với khóa lỗi, thay thế nguyên mẫu và rò rỉ tham chiếu"
      - "Kiểm thử lỗi giữa chừng và trạng thái nguồn sau khi copy thất bại"
  - level1: "Đánh giá hiệu năng"
    level2:
      - "So sánh copy với khởi tạo mới trên cùng hành vi và dữ liệu đầu vào"
      - "Đo shallow copy, deep copy và khởi tạo lại với nhiều kích thước đồ thị"
      - "Đánh giá số lần cấp phát, mức dùng bộ nhớ và áp lực garbage collection"
      - "Phân biệt chi phí tạo nguyên mẫu với chi phí tạo từng bản sao"
      - "Thiết kế benchmark Java có warmup, chống loại bỏ mã và dùng công cụ phù hợp"
      - "Đo ảnh hưởng của cạnh tranh khóa và tần suất cập nhật Registry"
      - "Dựa vào kết quả đo để chọn ranh giới copy và mức tối ưu cần thiết"
  - level1: "Tình huống ứng dụng"
    level2:
      - "Nhân bản hình vẽ có tọa độ, kiểu dáng và nhóm hình lồng nhau"
      - "Tạo nhân vật hoặc vật phẩm từ nguyên mẫu với thuộc tính có thể thay đổi"
      - "Nhân bản cấu hình tác vụ rồi tùy biến tham số cho từng lần chạy"
      - "Tạo tài liệu từ mẫu với danh sách phần nội dung cần độc lập"
      - "Tạo test fixture phức tạp mà các ca kiểm thử không dùng chung trạng thái mutable"
      - "Phân tích trường hợp entity có ID, quan hệ và trạng thái persistence"
      - "Xác định chính sách sao chép và vai trò Registry cho từng tình huống"
  - level1: "Lỗi thường gặp"
    level2:
      - "Gán tham chiếu rồi gọi đó là sao chép đối tượng"
      - "Tạo container mới nhưng vẫn chia sẻ phần tử mutable ngoài ý muốn"
      - "Deep copy đệ quy vô hạn hoặc phá quan hệ dùng chung trong đồ thị"
      - "Trả thẳng nguyên mẫu từ Registry khiến trạng thái mẫu bị sửa"
      - "Quên sao chép field mới hoặc trạng thái bổ sung của lớp con"
      - "Sao chép nguyên ID, cache hoặc tài nguyên mà không có chính sách"
      - "Lạm dụng clone, reflection hoặc serialization để né hợp đồng copy"
      - "Mặc định copy nhanh hơn constructor mà không đo đạc"
      - "Tạo quá nhiều tùy chọn copy khiến API khó hiểu và khó kiểm thử"
  - level1: "Bài thực hành"
    level2:
      - "Cài đặt Shape Prototype và client sao chép qua giao diện chung"
      - "Tái hiện lỗi shallow copy với đối tượng lồng nhau rồi sửa theo hợp đồng"
      - "Deep copy đồ thị có chu trình và nút dùng chung bằng bảng ánh xạ định danh"
      - "Xây dựng Prototype Registry có chính sách sở hữu và xử lý khóa rõ ràng"
      - "Mở rộng lớp con và kiểm tra bản sao giữ đầy đủ trạng thái đa hình"
      - "Thử nghiệm nhiều luồng copy trong lúc nguyên mẫu được cập nhật"
      - "Viết bộ kiểm thử hợp đồng và đo chi phí sao chép trên dữ liệu đại diện"
      - "Refactor mã khởi tạo phụ thuộc lớp cụ thể sang Prototype và so sánh độ phức tạp"
      - "Rà soát API, quyền sở hữu tham chiếu và tiêu chí chấp nhận trước khi áp dụng"
