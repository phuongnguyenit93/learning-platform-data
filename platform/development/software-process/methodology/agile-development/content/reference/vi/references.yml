references:
  - title: "Agile Manifesto — Manifesto for Agile Software Development"
    url: "https://agilemanifesto.org/"
    description: "Bốn cặp giá trị cốt lõi của Agile Software Development."
  - title: "Agile Manifesto — Principles"
    url: "https://agilemanifesto.org/principles"
    description: "Mười hai nguyên tắc về giao giá trị sớm, phản hồi, hợp tác và cải tiến liên tục."
  - title: "Agile Alliance — What is Agile?"
    url: "https://agilealliance.org/agile101/"
    description: "Giải thích Agile mindset và vị trí của Scrum, Kanban, XP cùng các kỹ thuật hỗ trợ."
  - title: "Scrum Guides — The 2020 Scrum Guide"
    url: "https://scrumguides.org/scrum-guide"
    description: "Scrum accountabilities, events, artifacts và commitments theo hướng dẫn chính thức."
  - title: "Kanban Guides — The Kanban Guide (May 2025)"
    url: "https://kanbanguides.org/the-kanban-guide"
    description: "Các thực hành Kanban, giới hạn WIP và bốn chỉ số flow bắt buộc."
  - title: "Agile Alliance — User Stories"
    url: "https://agilealliance.org/glossary/user-stories/"
    description: "Chia nhu cầu thành user stories nhỏ hướng đến giá trị cho người dùng."
  - title: "Agile Alliance — Iterative Development"
    url: "https://agilealliance.org/glossary/iterative-development/"
    description: "Phân biệt lặp lại hoạt động, làm lại có chủ đích và phát triển incremental."
  - title: "Agile Alliance — Continuous Integration"
    url: "https://agilealliance.org/glossary/continuous-integration/"
    description: "Tích hợp mã thường xuyên, build và kiểm thử tự động để luôn sẵn sàng phát hành."
  - title: "Agile Alliance — Test Driven Development"
    url: "https://agilealliance.org/glossary/tdd/"
    description: "Thực hành Red–Green–Refactor và kiểm thử giúp duy trì chất lượng khi thay đổi liên tục."
  - title: "Agile Alliance — Refactoring"
    url: "https://agilealliance.org/glossary/refactoring/"
    description: "Cải tiến cấu trúc mã nhưng không thay đổi hành vi bên ngoài."