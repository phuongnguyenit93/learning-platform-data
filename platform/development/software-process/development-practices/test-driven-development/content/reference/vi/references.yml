references:
  - title: "Martin Fowler — Test Driven Development"
    url: "https://martinfowler.com/bliki/TestDrivenDevelopment.html"
    description: "Chu trình Red–Green–Refactor, danh sách test case và vai trò thiết kế của việc test trước."
  - title: "Martin Fowler — Workflows of Refactoring"
    url: "https://martinfowler.com/articles/workflowsOfRefactoring/"
    description: "TDD và các bước refactor nhỏ có kiểm chứng để bảo toàn hành vi."
  - title: "JUnit — User Guide"
    url: "https://docs.junit.org/current/user-guide/"
    description: "JUnit Jupiter, @Test, assertions, parameterized tests và cách chạy bộ test Java."
  - title: "Mockito — How to Write Good Tests"
    url: "https://github.com/mockito/mockito/wiki/How-to-write-good-tests"
    description: "Thiết kế test dễ bảo trì và sử dụng mock đúng mục đích, không mock tràn lan."
  - title: "Google Testing Blog — Test Behaviors, Not Methods"
    url: "https://testing.googleblog.com/2014/04/testing-on-toilet-test-behaviors-not.html"
    description: "Viết test tập trung vào một hành vi, tránh kiểm tra nhiều trách nhiệm trong một test."
  - title: "Martin Fowler — Refactoring"
    url: "https://www.martinfowler.com/books/refactoring.html"
    description: "Thay đổi cấu trúc mã từng bước nhỏ mà vẫn bảo toàn hành vi bên ngoài."
  - title: "JaCoCo — Documentation"
    url: "https://www.jacoco.org/jacoco/trunk/doc/"
    description: "Đo line/branch coverage và tích hợp kiểm tra coverage vào quy trình phát triển Java."