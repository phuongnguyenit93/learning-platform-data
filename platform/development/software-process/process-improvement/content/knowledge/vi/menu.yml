menu:
- level1: Tổng quan
  level2:
  - Cải tiến quy trình phần mềm (SPI) là gì và vì sao tổ chức cần thực hiện
  - Phân biệt quy trình, hoạt động, thực hành, phương pháp và công cụ
  - Quan hệ giữa chất lượng quy trình, chất lượng sản phẩm và kết quả kinh doanh
  - Cải tiến liên tục, khắc phục vấn đề và thiết kế lại quy trình khác nhau thế nào
  - Phân biệt đánh giá quy trình, bảo đảm chất lượng và chương trình cải tiến
  - Phạm vi cải tiến ở cá nhân, nhóm, dự án và toàn tổ chức
  - 'Bản đồ các hướng tiếp cận: PDCA, PDSA, IDEAL, Lean, Six Sigma và CMMI'
  - Thuật ngữ nền tảng, kiến thức tiên quyết và lộ trình học
- level1: Tư duy hệ thống
  level2:
  - Nhìn quy trình như một hệ thống gồm con người, công việc, công nghệ và chính sách
  - Giá trị đối với khách hàng và người sử dụng là điểm xuất phát của cải tiến
  - Phân biệt tối ưu một bộ phận với cải thiện kết quả toàn hệ thống
  - Nút thắt, giới hạn năng lực và sự dịch chuyển của điểm nghẽn
  - Vòng phản hồi, độ trễ và tác dụng ngoài dự kiến khi thay đổi quy trình
  - Phân biệt sai sót cá nhân với điều kiện hệ thống tạo ra sai sót
  - Cân bằng tốc độ, chất lượng, chi phí, khả năng dự đoán và sức khỏe đội ngũ
- level1: Khởi động cải tiến
  level2:
  - Nhận diện động lực cải tiến từ nhu cầu kinh doanh và vấn đề thực tế
  - Viết phát biểu vấn đề có bối cảnh, phạm vi và tác động đo được
  - Xác định khách hàng, người tài trợ và các bên chịu ảnh hưởng
  - Thiết lập vai trò của người sở hữu quy trình và nhóm cải tiến
  - Lập bản đề xuất cải tiến với mục tiêu, ranh giới và tiêu chí thành công
  - Ước lượng nguồn lực, ngân sách và thời gian dành cho cải tiến
  - Xác định quyền ra quyết định, trách nhiệm phối hợp và cơ chế giải quyết vướng mắc
  - Kiểm tra mức sẵn sàng thay đổi và chọn điểm khởi đầu khả thi
- level1: Khảo sát hiện trạng
  level2:
  - Phân biệt quy trình được mô tả trong tài liệu với cách công việc thực sự diễn ra
  - Chuẩn bị câu hỏi khảo sát và chọn người tham gia đại diện
  - Phỏng vấn, quan sát công việc và tổ chức buổi khảo sát liên chức năng
  - Thu thập bằng chứng từ công việc, sản phẩm trung gian và lịch sử thay đổi
  - Kết hợp phản hồi định tính với số liệu vận hành
  - Nhận diện công việc ẩn, bước làm lại và ngoại lệ thường xuyên
  - Đối chiếu nhiều nguồn để giảm thiên lệch và phát hiện thông tin mâu thuẫn
  - Ghi nhận hiện trạng, mức độ tin cậy và các khoảng trống cần kiểm chứng
- level1: Mô tả quy trình
  level2:
  - Xác định đầu vào, đầu ra, điểm bắt đầu và điểm kết thúc
  - Dùng SIPOC để xác định nhà cung cấp, đầu vào, quy trình, đầu ra và khách hàng
  - Vẽ lưu đồ và sơ đồ làn trách nhiệm cho công việc liên phòng ban
  - Mô tả vai trò, quyết định, điều kiện chuyển bước và điểm bàn giao
  - Thể hiện công việc lặp lại, xử lý ngoại lệ và các bước phê duyệt
  - Chọn mức chi tiết đủ để phân tích mà không tạo gánh nặng tài liệu
  - Xác nhận sơ đồ với người thực hiện trước khi dùng làm cơ sở cải tiến
- level1: Dòng giá trị
  level2:
  - Dòng giá trị phần mềm là gì và khác chuỗi hoạt động của một nhóm ở đâu
  - Lập bản đồ dòng giá trị từ nhu cầu đến kết quả người dùng nhận được
  - Phân biệt thời gian xử lý, thời gian chờ và tổng thời gian hoàn thành
  - Đo số lần bàn giao, tỷ lệ công việc phải làm lại và lượng việc đang dở
  - Nhận diện hàng đợi, lô công việc lớn và vòng lặp phản hồi chậm
  - Phân tích cả luồng phát triển thay đổi lẫn luồng khôi phục khi có sự cố
  - Phác thảo trạng thái mong muốn và xác định điểm nghẽn cần tác động
  - Dùng bản đồ dòng giá trị để thống nhất ưu tiên giữa các nhóm
- level1: Mục tiêu và đo lường
  level2:
  - Chuyển mục tiêu kinh doanh thành mục tiêu cải tiến cụ thể
  - Áp dụng Mục tiêu–Câu hỏi–Phép đo (GQM) để nối mục đích với dữ liệu cần thu thập
  - Phân biệt chỉ số kết quả, chỉ số hoạt động và chỉ số dự báo
  - Chọn chỉ số cân bằng để theo dõi chất lượng, tốc độ và tác động phụ
  - Định nghĩa đơn vị đo, sự kiện bắt đầu, sự kiện kết thúc và cách tổng hợp
  - Xác lập đường cơ sở (baseline), giai đoạn quan sát và nhóm dữ liệu so sánh
  - Đặt mục tiêu cải thiện có căn cứ thay vì chọn ngưỡng tùy ý
  - Phân biệt số đo mô tả, chỉ tiêu mong muốn và giới hạn kiểm soát
  - Lập kế hoạch thu thập, phân tích, báo cáo và sử dụng kết quả đo
- level1: Quản lý dữ liệu
  level2:
  - Thiết kế từ điển dữ liệu và quy ước trạng thái công việc
  - Chọn nguồn dữ liệu từ quản lý công việc, kho mã, CI/CD và vận hành
  - Kiểm tra dữ liệu thiếu, trùng, sai dấu thời gian và sai liên kết
  - Phân loại dữ liệu theo sản phẩm, loại công việc, độ phức tạp và bối cảnh
  - Lấy mẫu đại diện và nhận diện thiên lệch lựa chọn
  - Giữ lịch sử thay đổi định nghĩa chỉ số để so sánh đúng qua thời gian
  - Quyền truy cập, bảo mật và giới hạn sử dụng dữ liệu về nhân sự
  - Tự động hóa thu thập nhưng vẫn kiểm chứng chất lượng dữ liệu
- level1: Chỉ số phần mềm
  level2:
  - Thời gian hoàn thành (lead time), thời gian chu kỳ (cycle time) và tuổi công việc
  - Thông lượng, lượng việc đang dở và sơ đồ dòng tích lũy
  - Điều kiện áp dụng định luật Little khi phân tích dòng công việc
  - Đo lỗi lọt ra ngoài, công việc làm lại và chi phí do chất lượng kém
  - Đo thời gian phản hồi và hàng đợi ở các bước rà soát, kiểm thử, phê duyệt
  - Các chỉ số DORA về thời gian thay đổi, tần suất triển khai và khôi phục triển khai lỗi
  - Tỷ lệ thay đổi gây lỗi và tỷ lệ triển khai để khắc phục sự cố trong DORA
  - Phân biệt hiệu suất phân phối phần mềm với độ tin cậy và giá trị sản phẩm
  - Kết hợp dữ liệu vận hành với phản hồi trải nghiệm làm việc theo SPACE
  - Giới hạn của số dòng mã, số commit, story point và mức sử dụng thời gian
  - Tránh so sánh cá nhân hoặc xếp hạng nhóm từ các chỉ số thiếu bối cảnh
- level1: Phân tích biến thiên
  level2:
  - Vì sao cần xem phân phối dữ liệu thay vì chỉ xem số trung bình
  - Dùng trung vị, phân vị và biểu đồ phân phối cho thời gian hoàn thành
  - Biểu đồ diễn tiến (run chart) và quan sát xu hướng theo thời gian
  - Biểu đồ kiểm soát và cách chọn loại phù hợp với dữ liệu
  - Phân biệt biến thiên do nguyên nhân thông thường với nguyên nhân đặc biệt
  - Phân biệt quy trình ổn định với quy trình đáp ứng yêu cầu
  - Điều kiện và giới hạn khi áp dụng phân tích năng lực quy trình
  - Xem xét cỡ mẫu, tính phụ thuộc theo thời gian và độ bất định của kết luận
  - Tránh can thiệp liên tục chỉ để phản ứng với dao động ngẫu nhiên
- level1: Nguyên nhân gốc rễ
  level2:
  - Phân biệt hiện tượng, tác động, nguyên nhân và giả thuyết nguyên nhân
  - Phân tầng dữ liệu trước khi kết luận vấn đề nằm ở đâu
  - Dùng biểu đồ Pareto để chọn nhóm vấn đề cần điều tra
  - Áp dụng 5 Whys và nhận diện nguy cơ kết luận theo cảm tính
  - Dùng sơ đồ xương cá để mở rộng các nhóm nguyên nhân khả dĩ
  - Dựng dòng thời gian và phân tích các điều kiện góp phần vào sự cố
  - Phân biệt tương quan với quan hệ nhân quả
  - Kiểm chứng giả thuyết bằng bằng chứng đối chiếu hoặc thử nghiệm phù hợp
  - Chuyển kết quả phân tích thành hành động tác động vào hệ thống
- level1: Ưu tiên cải tiến
  level2:
  - Xây danh sách cơ hội cải tiến từ vấn đề và bằng chứng
  - Đánh giá tác động, mức khẩn cấp, rủi ro và phạm vi người hưởng lợi
  - Ước lượng công sức, phụ thuộc, chi phí chuyển đổi và độ chắc chắn
  - Dùng ma trận tác động–công sức để hỗ trợ thảo luận
  - Ưu tiên nút thắt thay vì tối ưu nơi dễ đo hoặc dễ sửa
  - Phân biệt cải tiến nhỏ thực hiện sớm với thay đổi nền tảng dài hạn
  - Giới hạn số sáng kiến đang thực hiện và phân bổ năng lực cải tiến
  - Lập lộ trình có mốc đánh giá, điều kiện tiếp tục và điều kiện dừng
- level1: PDCA và PDSA
  level2:
  - Chu trình Plan–Do–Check–Act và vai trò của từng bước
  - Chu trình Plan–Do–Study–Act và trọng tâm học hỏi từ dự đoán
  - Phân biệt kiểm tra kết quả với nghiên cứu vì sao kết quả xảy ra
  - Viết mục tiêu, giả thuyết và dự đoán trước khi thực hiện thay đổi
  - Thực hiện chu trình nhỏ với phạm vi và thời gian quan sát rõ ràng
  - Đối chiếu kết quả rồi chọn tiếp nhận, điều chỉnh hoặc từ bỏ thay đổi
  - Kết nối nhiều chu trình học hỏi thành cải tiến liên tục
- level1: Mô hình IDEAL
  level2:
  - Vai trò của IDEAL trong tổ chức chương trình cải tiến quy trình phần mềm
  - 'Initiating: xác lập bối cảnh, sự bảo trợ và hạ tầng cải tiến'
  - 'Diagnosing: mô tả hiện trạng, trạng thái mong muốn và khoảng cách'
  - 'Establishing: đặt ưu tiên, chọn cách tiếp cận và lập kế hoạch hành động'
  - 'Acting: tạo giải pháp, thử nghiệm, điều chỉnh và triển khai'
  - 'Learning: phân tích kết quả, rút kinh nghiệm và đề xuất hành động tiếp theo'
  - Phối hợp các vòng IDEAL ở cấp tổ chức với thử nghiệm nhỏ ở cấp nhóm
- level1: Lean và Kaizen
  level2:
  - 'Tư duy Lean: xác định giá trị và loại bỏ lãng phí trong công việc phần mềm'
  - Nhận diện chờ đợi, bàn giao, việc dở dang và xử lý thừa
  - Giảm kích thước lô và rút ngắn vòng phản hồi
  - Tổ chức dòng công việc kéo và giới hạn lượng việc đang dở
  - Kaizen hằng ngày và đợt cải tiến tập trung khác nhau thế nào
  - Quan sát công việc tại nơi thực hiện và tôn trọng hiểu biết của người làm
  - Dùng A3 để trình bày vấn đề, phân tích và phương án cải tiến
  - Chuẩn hóa cách làm hiện tại như cơ sở để tiếp tục học hỏi
  - Điều chỉnh tư duy Lean cho công việc tri thức và tính bất định của phần mềm
- level1: Six Sigma
  level2:
  - Mục tiêu giảm biến thiên và sai lỗi trong quy trình
  - Chọn bài toán phù hợp với DMAIC thay vì áp dụng cho mọi tình huống
  - 'Define: làm rõ vấn đề, nhu cầu khách hàng và phạm vi dự án'
  - 'Measure: kiểm chứng phép đo và xác lập hiện trạng đáng tin cậy'
  - 'Analyze: tìm và xác nhận yếu tố gây sai lỗi hoặc chậm trễ'
  - 'Improve: so sánh phương án và kiểm chứng giải pháp'
  - 'Control: duy trì kết quả bằng theo dõi và kế hoạch phản ứng'
  - Giới hạn khi chuyển các giả định thống kê từ sản xuất sang phần mềm
- level1: CMMI
  level2:
  - CMMI là mô hình cải tiến năng lực và hiệu suất tổ chức như thế nào
  - Quan hệ giữa mục tiêu kinh doanh, thực hành và bằng chứng thực hiện
  - Phân biệt mức năng lực của phạm vi thực hành với mức trưởng thành tổ chức
  - Từ cách làm ban đầu đến quản lý được và được định nghĩa
  - Vai trò của quản lý định lượng và tối ưu hóa ở mức trưởng thành cao
  - Lựa chọn phạm vi thực hành theo vấn đề và kết quả mong muốn
  - Điều chỉnh quy trình chuẩn theo đặc điểm dự án
  - Đánh giá CMMI, phạm vi kết quả và giới hạn của mức được công nhận
  - Tránh đồng nhất mức trưởng thành với chất lượng mọi sản phẩm
  - Kiểm tra phiên bản mô hình và thuật ngữ trước khi áp dụng tài liệu cũ
- level1: Đánh giá năng lực
  level2:
  - Mục đích của đánh giá quy trình và cách sử dụng kết quả để cải tiến
  - Phân biệt mô hình tham chiếu, mô hình đánh giá và khung đo năng lực
  - Tổng quan họ ISO/IEC 330xx và quan hệ với ISO/IEC 15504 trước đây
  - Phân biệt năng lực từng quy trình với mức trưởng thành của tổ chức
  - Xác định phạm vi, bối cảnh, quy trình và mẫu dự án được đánh giá
  - Thu thập bằng chứng khách quan từ tài liệu, phỏng vấn và quan sát
  - Đối chiếu bằng chứng, ghi nhận điểm mạnh và xác nhận khoảng cách
  - Phân biệt đánh giá nội bộ, đánh giá độc lập và kiểm tra tuân thủ
  - Dùng hồ sơ năng lực để ưu tiên cải tiến thay vì chỉ theo đuổi điểm số
- level1: Thiết kế cải tiến
  level2:
  - Chuyển nguyên nhân đã kiểm chứng thành mục tiêu thay đổi cụ thể
  - Tạo nhiều phương án trước khi chọn một giải pháp
  - Phân biệt thay đổi chính sách, cách phối hợp, kỹ năng và công cụ
  - Thiết kế quy trình mong muốn với đầu vào, đầu ra và trách nhiệm rõ ràng
  - Đánh giá phụ thuộc và tác động đến các bước trước, sau của quy trình
  - Dự kiến rủi ro, tác dụng phụ và biện pháp phòng ngừa
  - Ước lượng lợi ích, tổng chi phí sở hữu và chi phí cơ hội
  - Xác định cách kiểm chứng giải pháp và phương án quay lại
- level1: Thử nghiệm cải tiến
  level2:
  - Viết giả thuyết có thể kiểm chứng và cơ chế tạo ra thay đổi
  - Chọn nhóm thí điểm và kiểm tra mức độ đại diện
  - Thiết lập đường cơ sở, thời gian thử nghiệm và chỉ số bảo vệ
  - Chọn cách so sánh trước–sau, giữa các nhóm hoặc triển khai theo đợt
  - Kiểm soát thay đổi đồng thời, mùa vụ và khác biệt loại công việc
  - Thu thập cả kết quả định lượng lẫn trải nghiệm của người tham gia
  - Phân biệt không thấy hiệu quả với chưa có đủ bằng chứng
  - Quyết định tiếp tục, điều chỉnh, dừng hoặc mở rộng theo tiêu chí đã thống nhất
  - Ghi lại kết quả thất bại như tri thức có thể tái sử dụng
- level1: Quản lý thay đổi
  level2:
  - Nhận diện nhóm chịu ảnh hưởng và lợi ích hoặc lo ngại của từng nhóm
  - Thiết lập sự bảo trợ của lãnh đạo đi cùng cam kết về nguồn lực
  - Đồng thiết kế cách làm mới với người trực tiếp thực hiện
  - Truyền thông lý do thay đổi, kỳ vọng và giới hạn của thử nghiệm
  - Đào tạo, hướng dẫn tại chỗ và hỗ trợ giai đoạn chuyển tiếp
  - Xử lý phản đối bằng tìm hiểu nguyên nhân thay vì áp đặt
  - Tạo môi trường an toàn để báo vấn đề và phản hồi trung thực
  - Điều chỉnh cơ chế khuyến khích để không đi ngược mục tiêu cải tiến
  - Theo dõi mức độ sử dụng thực tế và nguy cơ quá tải vì quá nhiều thay đổi
- level1: Chuẩn hóa quy trình
  level2:
  - Chọn nội dung cần chuẩn hóa sau khi giải pháp được kiểm chứng
  - Phân biệt chính sách bắt buộc, quy trình tham chiếu và hướng dẫn thực hành
  - Thiết kế tài liệu gọn với trách nhiệm, tiêu chí đầu vào và đầu ra
  - Xây bộ tài sản quy trình gồm mẫu, ví dụ, danh sách kiểm tra và hướng dẫn
  - Xác định phần dùng chung và phần được điều chỉnh theo bối cảnh
  - Quản lý phiên bản, phê duyệt và thông báo thay đổi quy trình
  - Kiểm tra ngoại lệ, cập nhật cách làm và loại bỏ thủ tục không còn giá trị
  - Giữ liên kết giữa tài liệu, công việc thực tế và bằng chứng thực hiện
- level1: Công cụ và tự động hóa
  level2:
  - Chọn công cụ theo vấn đề cần giải quyết và khả năng đo lường
  - Kết nối dữ liệu quản lý công việc, kho mã, kiểm thử và triển khai
  - Dùng bảng theo dõi để hỗ trợ quyết định thay vì chỉ báo cáo số liệu
  - Tự động hóa bước lặp lại sau khi xác nhận quy trình có giá trị
  - Khai phá quy trình (process mining) từ nhật ký sự kiện và điều kiện dữ liệu cần có
  - Quản lý quy trình dưới dạng mã hoặc cấu hình có kiểm soát phiên bản khi phù hợp
  - Đánh giá chi phí vận hành, khả năng tích hợp và rủi ro phụ thuộc công cụ
  - Giữ quyền rà soát và xử lý ngoại lệ khi áp dụng tự động hóa
- level1: Bối cảnh phần mềm
  level2:
  - Cải tiến trong nhóm Agile qua phản tư, thử nghiệm và hành động theo dõi được
  - Cải tiến luồng DevOps từ thay đổi mã đến triển khai và khôi phục
  - Giảm vòng lặp làm rõ yêu cầu và phản hồi chấp nhận
  - Cải tiến rà soát mã, kiểm thử và xử lý lỗi theo điểm nghẽn thực tế
  - Cải tiến bảo trì, hỗ trợ và phản hồi sau sự cố
  - Điều chỉnh cách tiếp cận cho nhóm nhỏ, hệ thống cũ và tổ chức nhiều nhóm
  - Phối hợp với nhà cung cấp và cải tiến các điểm bàn giao ngoài tổ chức
  - 'Cải tiến quy trình cá nhân (PSP) và nhóm (TSP): vai trò và giới hạn'
  - Kết hợp yêu cầu quản trị với cách làm linh hoạt mà không tăng thủ tục hình thức
- level1: Đánh giá hiệu quả
  level2:
  - Phân biệt hoàn tất hoạt động cải tiến với tạo ra kết quả mong muốn
  - Đối chiếu kết quả với đường cơ sở và tiêu chí đã đặt
  - Xem xét mức cải thiện thực tế cùng độ bất định của số liệu
  - Kiểm tra tác động phụ lên chất lượng, độ tin cậy và sức khỏe đội ngũ
  - Đánh giá mức sử dụng cách làm mới và khả năng tạo lợi ích bền vững
  - Ước lượng lợi ích ròng, thời gian thu hồi và giới hạn quy đổi thành tiền
  - Tách ảnh hưởng của cải tiến khỏi yếu tố bên ngoài khi có bằng chứng phù hợp
  - Báo cáo kết quả, giới hạn kết luận và quyết định vòng cải tiến tiếp theo
- level1: Duy trì và nhân rộng
  level2:
  - Bàn giao trách nhiệm duy trì từ nhóm cải tiến sang người sở hữu quy trình
  - Lập kế hoạch theo dõi, ngưỡng phản ứng và cách xử lý khi kết quả suy giảm
  - Duy trì nhịp xem xét định kỳ và danh sách cơ hội cải tiến
  - Lưu bài học, giả định và quyết định để giảm việc thử lại sai lầm cũ
  - Xây cộng đồng thực hành và cơ chế hỗ trợ giữa các nhóm
  - Xác định điều kiện áp dụng trước khi nhân rộng kết quả thí điểm
  - Triển khai theo đợt và theo dõi khác biệt bối cảnh giữa các đơn vị
  - Cân bằng chuẩn chung của tổ chức với quyền điều chỉnh tại nhóm
  - Rà soát toàn bộ chương trình và dừng các sáng kiến không còn tạo giá trị
  - Nuôi dưỡng văn hóa học hỏi và năng lực cải tiến liên tục
- level1: Sai lầm thường gặp
  level2:
  - Chọn công cụ hoặc mô hình trước khi xác định vấn đề
  - Thay đổi hàng loạt khiến không xác định được nguyên nhân của kết quả
  - Theo đuổi mức trưởng thành hoặc chứng nhận thay cho kết quả kinh doanh
  - Biến chỉ số thành chỉ tiêu thưởng phạt và tạo hành vi đối phó
  - So sánh các nhóm có bối cảnh khác nhau như thể cùng một quy trình
  - Quy lỗi cho con người và bỏ qua điều kiện hệ thống
  - Chuẩn hóa quá mức hoặc tự động hóa một bước vốn không cần tồn tại
  - Kết thúc cải tiến ngay sau thí điểm và không kiểm tra khả năng duy trì
- level1: Thực hành
  level2:
  - Khảo sát một quy trình phát triển phần mềm và lập hồ sơ hiện trạng
  - Lập bản đồ dòng giá trị để tìm thời gian chờ và công việc làm lại
  - Xây mục tiêu GQM, từ điển chỉ số và bộ dữ liệu đường cơ sở
  - Phân tích biến thiên, phân tầng dữ liệu và kiểm chứng nguyên nhân chậm trễ
  - Ưu tiên danh sách cải tiến với bằng chứng về tác động và chi phí
  - Thiết kế một thử nghiệm giảm thời gian rà soát hoặc giảm lỗi sau triển khai
  - Lập chương trình IDEAL có vai trò, mốc đánh giá và kế hoạch học hỏi
  - Đối chiếu hồ sơ năng lực quy trình mà không suy diễn thành chứng nhận
  - Viết báo cáo trước–sau, quyết định triển khai và kế hoạch duy trì kết quả
