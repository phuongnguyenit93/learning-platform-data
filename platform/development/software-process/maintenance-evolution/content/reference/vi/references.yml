references:
  - title: "ISO/IEC/IEEE 14764:2022 — Software Maintenance"
    url: "https://www.iso.org/standard/80710.html"
    description: "Tiêu chuẩn quốc tế về quy trình, hoạt động và các loại bảo trì phần mềm trong vòng đời sản phẩm."
  - title: "IEEE Computer Society — SWEBOK Guide V4"
    url: "https://www.computer.org/education/bodies-of-knowledge/software-engineering"
    description: "Tổng quan Software Maintenance Knowledge Area cùng các lĩnh vực kiến thức và thực hành liên quan."
  - title: "Martin Fowler — Refactoring"
    url: "https://martinfowler.com/books/refactoring.html"
    description: "Kỹ thuật tái cấu trúc từng bước nhỏ để cải thiện thiết kế mà không đổi hành vi bên ngoài."
  - title: "Martin Fowler — Code Smell"
    url: "https://martinfowler.com/bliki/CodeSmell.html"
    description: "Nhận diện dấu hiệu thiết kế khó bảo trì và đánh giá trước khi quyết định refactor."
  - title: "Martin Fowler — Technical Debt"
    url: "https://martinfowler.com/bliki/TechnicalDebt.html"
    description: "Giải thích chi phí thay đổi phát sinh từ nợ kỹ thuật và cách ưu tiên cải thiện vùng mã thường xuyên sửa."
  - title: "Martin Fowler — Strangler Fig"
    url: "https://martinfowler.com/bliki/StranglerFigApplication.html"
    description: "Chiến lược hiện đại hóa hệ thống legacy qua thay thế từng phần và duy trì dịch vụ liên tục."
  - title: "Microsoft Azure Architecture — Strangler Fig Pattern"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/strangler-fig"
    description: "Mẫu di chuyển dần chức năng khỏi hệ thống cũ, xây facade và giảm rủi ro tích hợp."
  - title: "GitHub Docs — Managing Dependabot Alerts"
    url: "https://docs.github.com/en/code-security/how-tos/manage-security-alerts/manage-dependabot-alerts/view-dependabot-alerts"
    description: "Nhận diện, ưu tiên và cập nhật các thư viện phụ thuộc có lỗ hổng bảo mật."
  - title: "Google SRE Workbook — Eliminating Toil"
    url: "https://sre.google/workbook/eliminating-toil/"
    description: "Đo lường công việc lặp đi lặp lại, ưu tiên tự động hóa và quản lý chi phí duy trì dịch vụ."