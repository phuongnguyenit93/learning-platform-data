menu:
- level1: Tổng quan
  level2:
  - Bảo trì phần mềm là gì và vì sao bắt đầu chuẩn bị trước khi bàn giao
  - Tiến hóa phần mềm là gì và mối liên hệ với nhu cầu thay đổi
  - Phân biệt phát triển mới, bảo trì, vận hành và hỗ trợ người dùng
  - Phân biệt sửa lỗi, cải tiến, tái cấu trúc và hiện đại hóa
  - 'Các đối tượng cần bảo trì: mã nguồn, dữ liệu, cấu hình, kiểm thử và tài liệu'
  - Giá trị nghiệp vụ của việc duy trì một hệ thống đang được sử dụng
  - Rủi ro của thay đổi đối với hành vi, tính toàn vẹn và tính liên tục
  - Lộ trình từ tiếp nhận hệ thống đến thay đổi, chuyển đổi và ngừng sử dụng
- level1: Phân loại bảo trì
  level2:
  - 'Bảo trì khắc phục (corrective): xử lý vấn đề đã được phát hiện'
  - 'Bảo trì thích nghi (adaptive): đáp ứng môi trường thay đổi'
  - 'Bảo trì hoàn thiện (perfective): cải thiện thuộc tính và khả năng sử dụng'
  - 'Bảo trì phòng ngừa (preventive): xử lý lỗi tiềm ẩn trước khi xảy ra'
  - Bảo trì bổ sung (additive) trong ISO/IEC/IEEE 14764:2022
  - Phân biệt sửa chữa với nâng cao và thay đổi có nhiều mục đích
  - Phân biệt bảo trì chủ động với bảo trì phản ứng
  - Bảo trì theo lịch, ngoài lịch và khẩn cấp
  - Đối chiếu cách phân loại giữa tài liệu truyền thống và tiêu chuẩn áp dụng
- level1: Quy luật tiến hóa
  level2:
  - Phần mềm gắn với thế giới thực và nguồn áp lực phải thay đổi
  - Phân loại S, P, E của Lehman và phạm vi của hệ thống loại E
  - Quy luật thay đổi liên tục và sự suy giảm phù hợp với nhu cầu
  - Quy luật gia tăng độ phức tạp khi hệ thống được sửa đổi
  - Quy luật tự điều chỉnh của quá trình tiến hóa
  - Quy luật bảo toàn mức hoạt động của tổ chức
  - Quy luật bảo toàn mức độ quen thuộc với hệ thống
  - Quy luật tăng trưởng liên tục về khả năng cung cấp
  - Quy luật suy giảm chất lượng khi môi trường không còn phù hợp
  - Quy luật hệ thống phản hồi nhiều tầng và nhiều tác nhân
  - Giới hạn bằng chứng thực nghiệm và cách vận dụng các quy luật
  - Các giai đoạn phát triển, tiến hóa, duy trì hạn chế và kết thúc vòng đời
- level1: Khả năng bảo trì
  level2:
  - Khả năng bảo trì là gì và vì sao cần được đặc tả từ đầu
  - Tính dễ phân tích, dễ sửa đổi và dễ kiểm thử
  - Tính mô đun, phụ thuộc và tác động lan truyền của thay đổi
  - Độ phức tạp, tính kết dính và mức độ liên kết giữa thành phần
  - Khả năng tái hiện bản dựng và khôi phục môi trường phát triển
  - Khả năng quan sát hành vi để hỗ trợ chẩn đoán
  - Vai trò của kiểm thử, tài liệu và tri thức miền nghiệp vụ
  - Đánh giá khả năng bảo trì bằng nhiều bằng chứng thay vì một chỉ số
- level1: Tổ chức bảo trì
  level2:
  - Phân công chủ sở hữu sản phẩm và trách nhiệm bảo trì
  - Nhóm phát triển kiêm bảo trì và nhóm bảo trì chuyên trách
  - Phối hợp giữa hỗ trợ người dùng, vận hành, bảo mật và phát triển
  - Tiếp nhận công việc qua đầu mối hỗ trợ và cơ chế chuyển cấp
  - Thỏa thuận phạm vi dịch vụ và mục tiêu đáp ứng bảo trì
  - Bảo trì nội bộ, thuê ngoài và phụ thuộc nhà cung cấp
  - Quản lý năng lực, đào tạo chéo và rủi ro phụ thuộc một người
  - Phân bổ nguồn lực khi nhiều sản phẩm dùng chung đội bảo trì
  - Giao tiếp với khách hàng và bên liên quan trong thời gian thay đổi
- level1: Kế hoạch bảo trì
  level2:
  - Xác định phạm vi, thời hạn và mức dịch vụ cần duy trì
  - Chuẩn bị chiến lược bảo trì ngay trong quá trình phát triển
  - Lập danh mục tài sản phần mềm và mức quan trọng nghiệp vụ
  - Xác định môi trường, công cụ, quyền truy cập và dữ liệu cần thiết
  - Phân bổ năng lực cho sửa lỗi, thích nghi, cải tiến và phòng ngừa
  - Lập kế hoạch theo yêu cầu thay đổi, phiên bản và danh mục sản phẩm
  - Dự báo rủi ro lỗi thời của công nghệ và nguồn lực
  - Xác định tiêu chí tiếp tục duy trì, hiện đại hóa hoặc thay thế
  - Điều chỉnh kế hoạch từ số liệu thực tế và phản hồi sử dụng
- level1: Chuyển giao bảo trì
  level2:
  - Chuyển tiếp trách nhiệm từ nhóm phát triển sang nhóm bảo trì
  - Kiểm kê mã nguồn, nhánh, bản phát hành và lịch sử quyết định
  - Bàn giao kiến trúc, luồng nghiệp vụ và phụ thuộc bên ngoài
  - Bàn giao bản dựng, pipeline, môi trường và cấu hình triển khai
  - Bàn giao kiểm thử, dữ liệu mẫu và danh sách lỗi còn tồn tại
  - Xác minh quyền sở hữu, quyền truy cập và liên hệ nhà cung cấp
  - Đào tạo qua thực hành và chạy thử một yêu cầu bảo trì
  - Tiêu chí chấp nhận bàn giao và xử lý phần chưa đủ điều kiện
  - Lưu bằng chứng chuyển giao và giai đoạn hỗ trợ sau bàn giao
- level1: Quy trình thay đổi
  level2:
  - Luồng tiếp nhận, phân tích, phê duyệt, thực hiện và chấp nhận thay đổi
  - Phân biệt báo cáo vấn đề với đề nghị sửa đổi phần mềm
  - Thu thập triệu chứng, phiên bản, môi trường và kết quả mong đợi
  - Phân loại yêu cầu theo loại bảo trì và phạm vi trách nhiệm
  - Phân biệt mức nghiêm trọng, mức khẩn cấp và độ ưu tiên
  - Phân tích phương án cùng tác động, nguồn lực và rủi ro
  - Quyết định chấp nhận, từ chối, hoãn hoặc chuyển sang dự án khác
  - Thiết lập tiêu chí chấp nhận và người có thẩm quyền quyết định
  - Theo dõi trạng thái, căn cứ và lịch sử quyết định của yêu cầu
  - Điều chỉnh quy trình cho thay đổi khẩn cấp mà vẫn lưu bằng chứng
- level1: Hiểu hệ thống
  level2:
  - Xác định mục tiêu tìm hiểu trước khi đọc một hệ thống lớn
  - Khôi phục môi trường và chạy lại hành vi hiện tại
  - Đi từ ca sử dụng đến điểm vào, luồng xử lý và dữ liệu
  - Đọc mã theo luồng gọi, luồng điều khiển và luồng dữ liệu
  - Kết hợp phân tích tĩnh với quan sát khi chạy
  - Đọc lịch sử phiên bản để tìm lý do của hành vi hiện tại
  - Khai thác kiểm thử, log, cấu hình và tài liệu còn đáng tin cậy
  - Nhận diện hành vi chủ ý, lỗi đã biết và quy tắc nghiệp vụ ngầm
  - Đối chiếu hiểu biết với người dùng và người từng bảo trì
  - Ghi lại bản đồ thành phần, câu hỏi còn mở và mức chắc chắn
- level1: Phân tích tác động
  level2:
  - Xác định phạm vi thay đổi trực tiếp và ảnh hưởng gián tiếp
  - Phân tích phụ thuộc giữa mã nguồn, dữ liệu, cấu hình và giao tiếp
  - Truy vết từ yêu cầu thay đổi đến thiết kế và kiểm thử
  - Phát hiện thành phần liên quan bằng đồ thị gọi và lịch sử đồng thay đổi
  - Đánh giá tác động lên thuộc tính chất lượng và ràng buộc nghiệp vụ
  - Đánh giá ảnh hưởng đến hệ thống tích hợp và người sử dụng
  - Xác định kiểm thử cần chạy và bằng chứng cần bổ sung
  - Phân tích khả năng quay lui và thay đổi dữ liệu khó đảo ngược
  - Cập nhật ước lượng và mức rủi ro khi phát hiện phụ thuộc mới
- level1: Chẩn đoán và sửa lỗi
  level2:
  - Phân biệt triệu chứng, lỗi trong mã và nguyên nhân gốc
  - Tạo bước tái hiện tối thiểu cùng dữ liệu và môi trường đại diện
  - Thu thập bằng chứng trước khi thay đổi hệ thống
  - Khoanh vùng bằng giả thuyết, log, trình gỡ lỗi và đối chiếu phiên bản
  - Dùng lịch sử thay đổi hoặc tìm kiếm nhị phân để tìm lần phát sinh lỗi
  - Xử lý lỗi phụ thuộc thời gian, dữ liệu hoặc điều kiện cạnh tranh
  - Viết kiểm thử tái hiện trước khi sửa lỗi khi có thể
  - Chọn bản sửa đúng nguyên nhân và giới hạn phạm vi ảnh hưởng
  - Phân biệt biện pháp tạm thời với bản sửa lâu dài
  - Xác minh lỗi đã hết và bổ sung phòng ngừa lỗi tương tự
- level1: Cải tiến chức năng
  level2:
  - Phân biệt làm rõ hành vi cũ với thay đổi yêu cầu
  - Thu nhận nhu cầu mới trong bối cảnh hệ thống đang được dùng
  - Phân tích khoảng cách giữa khả năng hiện có và mục tiêu mới
  - Bổ sung chức năng theo các phần nhỏ có thể kiểm chứng
  - Giữ ổn định hành vi người dùng còn phụ thuộc
  - Xử lý cải tiến tác động tới dữ liệu lịch sử và quy trình nghiệp vụ
  - Đánh đổi giữa giá trị mới, độ phức tạp và chi phí duy trì
  - Xác nhận hiệu quả cải tiến sau khi phát hành
- level1: Kiểm thử hồi quy
  level2:
  - Mục tiêu của kiểm thử hồi quy trong bảo trì
  - Phân biệt kiểm thử xác nhận bản sửa với kiểm thử hồi quy
  - Ghi nhận hành vi hiện có bằng kiểm thử đặc trưng (characterization test)
  - Xác định hành vi cần giữ và hành vi sai được phép thay đổi
  - Lựa chọn phạm vi kiểm thử theo phân tích tác động và rủi ro
  - Kết hợp kiểm thử đơn vị, tích hợp, hợp đồng và đầu cuối
  - Kiểm thử dữ liệu cũ, cấu hình cũ và nhiều phiên bản cùng tồn tại
  - Kiểm thử hồi quy hiệu năng, bảo mật và khả năng phục hồi
  - Quản lý dữ liệu kiểm thử, môi trường và kết quả kỳ vọng
  - Xử lý kiểm thử chập chờn và các bộ kiểm thử quá chậm
  - Đánh giá giới hạn của độ bao phủ mã và bằng chứng chấp nhận
- level1: Tái cấu trúc mã
  level2:
  - Tái cấu trúc (refactoring) và yêu cầu bảo toàn hành vi bên ngoài
  - Phân biệt tái cấu trúc với sửa lỗi, tối ưu và viết lại
  - Nhận diện dấu hiệu mã khó thay đổi và chi phí phát sinh
  - Tạo điểm tách phụ thuộc để bổ sung kiểm thử cho mã cũ
  - Thực hiện biến đổi nhỏ và kiểm chứng sau từng bước
  - Đổi tên, tách hàm, di chuyển trách nhiệm và giảm trùng lặp
  - Cải thiện ranh giới mô đun và hướng phụ thuộc
  - Tái cấu trúc để chuẩn bị cho một thay đổi có mục tiêu
  - Sử dụng công cụ hỗ trợ và rà soát tác động ngoài mã nguồn
  - Đánh giá kết quả bằng khả năng thực hiện thay đổi tiếp theo
- level1: Nợ kỹ thuật
  level2:
  - Nợ kỹ thuật là gì và giới hạn của phép so sánh với nợ tài chính
  - Phân biệt nợ kỹ thuật với lỗi sản phẩm và mọi việc chưa hoàn thành
  - Nợ trong kiến trúc, mã, dữ liệu, kiểm thử và hạ tầng phát triển
  - Nhận diện quyết định đánh đổi có chủ ý và nợ phát hiện muộn
  - Ghi nhận hạng mục nợ cùng hậu quả, căn cứ và người sở hữu
  - Ước lượng chi phí xử lý và công sức tăng thêm khi tiếp tục trì hoãn
  - Ưu tiên xử lý nợ tại nơi có giá trị thay đổi cao
  - Kết hợp trả nợ với sửa lỗi hoặc cải tiến tính năng
  - Theo dõi nợ đã xử lý, nợ chấp nhận và điều kiện cần đánh giá lại
- level1: Tái kỹ nghệ
  level2:
  - Tái kỹ nghệ (reengineering) và mối quan hệ với bảo trì
  - Phân biệt kỹ nghệ ngược, khôi phục thiết kế và xây dựng lại
  - Phân tích hệ thống để tạo biểu diễn ở mức trừu tượng cao hơn
  - Khôi phục kiến trúc, mô hình dữ liệu và đặc tả từ hệ thống hiện có
  - Phân biệt tái lập tài liệu với thay đổi phần mềm
  - Lựa chọn phạm vi tái cấu trúc mã, dữ liệu hoặc kiến trúc
  - Bảo toàn quy tắc nghiệp vụ khi chuyển đổi cách triển khai
  - Xác minh tính tương đương và xử lý khác biệt có chủ đích
  - Đánh giá công cụ chuyển đổi tự động và công việc thủ công còn lại
- level1: Hiện đại hóa
  level2:
  - Xác định mục tiêu nghiệp vụ của hiện đại hóa hệ thống cũ
  - Đánh giá giá trị nghiệp vụ và chất lượng kỹ thuật của hệ thống
  - So sánh tiếp tục bảo trì, thay nền tảng, tái kiến trúc và thay thế
  - Phân tích rủi ro viết lại toàn bộ và thời gian duy trì hai hệ thống
  - Thay thế từng phần bằng cách tiếp cận Strangler Fig
  - Tạo ranh giới chuyển tiếp bằng lớp bao và lớp chuyển đổi giao tiếp
  - Chọn các phần theo năng lực nghiệp vụ có thể chuyển giao độc lập
  - Quản lý cùng tồn tại giữa hệ thống cũ và hệ thống mới
  - Đo tiến độ bằng phần trách nhiệm đã chuyển giao và phần cũ đã loại bỏ
  - Đánh giá lại lộ trình khi giả định hoặc nhu cầu thay đổi
- level1: Chuyển đổi nền tảng
  level2:
  - Phân biệt di chuyển môi trường với thay đổi kiến trúc
  - Kiểm kê phụ thuộc vào hệ điều hành, runtime và dịch vụ nền
  - Phân tích khác biệt hành vi giữa nền tảng nguồn và nền tảng đích
  - Lập kế hoạch chuyển đổi mã, cấu hình và tài nguyên triển khai
  - Kiểm chứng khả năng xây dựng và chạy trên môi trường mới
  - Chạy thử, chạy song song và đối chiếu kết quả
  - Chuẩn bị điều kiện chuyển giao và phương án khôi phục
  - Xác nhận hoàn tất chuyển đổi với nhóm vận hành và người dùng
- level1: Tiến hóa dữ liệu
  level2:
  - Quan hệ giữa thay đổi phần mềm và thay đổi cấu trúc dữ liệu
  - Quản lý phiên bản schema và các bước migration
  - Tiến hóa schema bằng mở rộng, chuyển đổi rồi thu hẹp
  - Giữ tương thích khi phiên bản ứng dụng cũ và mới cùng chạy
  - Chuyển đổi hoặc bổ sung dữ liệu theo lô và xử lý chạy lại
  - Kiểm tra tính toàn vẹn, đối soát và các bản ghi ngoại lệ
  - Đánh giá khóa dữ liệu, dung lượng và thời gian thực hiện
  - Phân biệt quay lui mã với phục hồi dữ liệu đã thay đổi
  - Thử nghiệm phục hồi trước khi thực hiện thay đổi khó đảo ngược
  - Loại bỏ cột, bảng và đường xử lý cũ sau khi đủ điều kiện
- level1: Tương thích giao tiếp
  level2:
  - Xác định hợp đồng công khai và các bên đang phụ thuộc
  - Phân biệt tương thích nguồn, nhị phân, giao thức và hành vi
  - Tương thích ngược và tương thích tiến trong hệ thống nhiều phiên bản
  - Định phiên bản API và truyền đạt thay đổi không tương thích
  - Dùng Semantic Versioning khi đã xác định hợp đồng công khai
  - Đánh dấu ngừng khuyến nghị sử dụng và lập lịch loại bỏ giao tiếp cũ
  - Bổ sung lớp chuyển đổi hoặc đường xử lý tương thích tạm thời
  - Kiểm thử hợp đồng và kiểm chứng với bên sử dụng thực tế
  - Quản lý thay đổi sự kiện, tệp trao đổi và dữ liệu tuần tự hóa
- level1: Bảo trì phụ thuộc
  level2:
  - Kiểm kê thư viện, framework, runtime và công cụ xây dựng
  - Phân biệt phụ thuộc trực tiếp, bắc cầu và thành phần được đóng gói
  - Bảng kê thành phần phần mềm (SBOM) và phạm vi thông tin cung cấp
  - Theo dõi vòng đời hỗ trợ và thành phần đã ngừng bảo trì
  - Đọc ghi chú phát hành và hướng dẫn chuyển đổi trước khi nâng cấp
  - Nâng cấp theo bước nhỏ và kiểm tra tổ hợp phiên bản
  - Kiểm chứng bản dựng tái lập và nguồn gốc thành phần
  - Quản lý bản vá riêng, fork và đóng góp thay đổi về dự án gốc
  - Lựa chọn thay thế khi phụ thuộc không còn được duy trì
- level1: Bảo trì bảo mật
  level2:
  - Tiếp nhận và xác minh báo cáo lỗ hổng sau khi phát hành
  - Xác định phiên bản, cấu hình và khách hàng chịu ảnh hưởng
  - Ưu tiên khắc phục theo khả năng khai thác và tác động thực tế
  - Phân biệt biện pháp giảm thiểu tạm thời với bản vá nguyên nhân
  - Kiểm thử bản vá mà không làm mất yêu cầu bảo mật khác
  - Đưa bản sửa về các nhánh còn được hỗ trợ
  - Bảo vệ tính toàn vẹn của gói cập nhật và đường phát hành
  - Phối hợp thông tin khắc phục với các bên chịu trách nhiệm
  - Phân tích nguyên nhân để ngăn lỗ hổng cùng loại tái xuất hiện
- level1: Cấu hình và phiên bản
  level2:
  - Xác định cấu hình chuẩn của mã, phụ thuộc, dữ liệu và tài liệu
  - Truy vết từ đề nghị thay đổi đến commit và bản phát hành
  - Quản lý nhánh chính, nhánh bảo trì và bản vá khẩn cấp
  - Phân biệt bản đang phát triển với các phiên bản đang được hỗ trợ
  - Đưa bản sửa về nhánh cũ và đưa ngược vào dòng phát triển hiện tại
  - Xử lý xung đột khi nhiều nhánh sửa cùng hành vi
  - Quản lý cấu hình theo môi trường và tránh sai lệch ngoài kiểm soát
  - Đánh dấu bản phát hành và lưu hiện vật có thể truy nguyên
  - Đồng bộ kiểm thử, tài liệu và ghi chú với đúng phiên bản
- level1: Phát hành thay đổi
  level2:
  - Xác định nội dung bản phát hành từ các yêu cầu đã được chấp nhận
  - Tự động hóa xây dựng, kiểm thử và kiểm tra điều kiện phát hành
  - Rà soát bằng chứng và rủi ro còn lại trước triển khai
  - Lập kế hoạch triển khai theo đợt và giới hạn phạm vi ảnh hưởng
  - Triển khai thăm dò (canary) và so sánh tín hiệu với phiên bản đối chứng
  - Cờ tính năng (feature flag) và quản lý vòng đời cờ tạm thời
  - Chọn điều kiện dừng, quay lui hoặc sửa tiếp trên phiên bản mới
  - Phối hợp triển khai ứng dụng với thay đổi schema và dữ liệu
  - Thông báo thay đổi, giới hạn đã biết và hướng dẫn cho người dùng
  - Xác nhận bản phát hành đạt tiêu chí chấp nhận sau triển khai
- level1: Phản hồi vận hành
  level2:
  - Dùng báo cáo sự cố và phản hồi người dùng làm đầu vào bảo trì
  - Phân biệt khôi phục dịch vụ với thực hiện thay đổi phần mềm
  - Liên hệ log, số đo và dấu vết với phiên bản đã triển khai
  - Chẩn đoán suy giảm hiệu năng hoặc lỗi phát sinh sau cập nhật
  - Lựa chọn dữ liệu quan sát cần thiết mà vẫn bảo vệ thông tin nhạy cảm
  - Đối chiếu hành vi thực tế với tiêu chí chấp nhận của bản thay đổi
  - Chuyển bài học sau sự cố thành yêu cầu sửa chữa hoặc phòng ngừa
  - Đóng vòng phản hồi bằng cách xác nhận kết quả với bên báo cáo
- level1: Tài liệu và tri thức
  level2:
  - Xác định tài liệu còn đúng với hệ thống đang chạy
  - Cập nhật kiến trúc, hợp đồng giao tiếp và mô hình dữ liệu sau thay đổi
  - Ghi lại quyết định cùng bối cảnh, phương án và lý do lựa chọn
  - Duy trì hướng dẫn tái hiện lỗi và thiết lập môi trường
  - Duy trì hướng dẫn phát hành, xử lý sự cố và phục hồi
  - Liên kết yêu cầu, mã, kiểm thử và tài liệu thay vì sao chép nhiều bản
  - Chuyển giao tri thức bằng làm việc cặp, rà soát và đào tạo chéo
  - Lưu giữ tri thức khi nhân sự hoặc nhà cung cấp thay đổi
- level1: Công cụ hỗ trợ
  level2:
  - Lựa chọn khả năng công cụ theo vấn đề bảo trì cần giải quyết
  - Tìm kiếm mã, điều hướng tham chiếu và phân tích phụ thuộc
  - Phân tích tĩnh, phát hiện trùng lặp và theo dõi độ phức tạp
  - Tự động hóa kiểm thử hồi quy và kiểm tra tương thích
  - Theo dõi phụ thuộc, lỗ hổng và vòng đời hỗ trợ
  - Tự động hóa biến đổi mã và giới hạn cần rà soát thủ công
  - Ứng dụng trí tuệ nhân tạo (AI) để giải thích mã và gợi ý thay đổi
  - Kiểm chứng kết quả do AI tạo và bảo vệ dữ liệu hệ thống
  - Tránh tạo thêm công cụ khó bảo trì hoặc tri thức chỉ một người nắm
- level1: Ước lượng và đo lường
  level2:
  - Phân biệt công sức sửa mã với tổng công sức hoàn tất bảo trì
  - Ước lượng từ dữ liệu lịch sử, chuyên gia và phạm vi tác động
  - Đưa thời gian tìm hiểu, kiểm thử và phát hành vào ước lượng
  - Biểu diễn bất định và cập nhật dự báo khi có bằng chứng mới
  - Theo dõi yêu cầu tồn đọng, tuổi yêu cầu và thời gian hoàn tất
  - Theo dõi lỗi tái mở, lỗi lặp lại và lỗi gây ra bởi thay đổi
  - Đo phân bổ công sức giữa các loại bảo trì
  - Đánh giá chi phí duy trì theo sản phẩm và xu hướng dài hạn
  - Tránh dùng số dòng mã hoặc số yêu cầu đóng làm năng suất tuyệt đối
  - Cải tiến quy trình từ nguyên nhân chậm trễ và lỗi lọt qua
- level1: Ngừng sử dụng
  level2:
  - Nhận diện điều kiện ngừng hỗ trợ hoặc ngừng vận hành phần mềm
  - Phân biệt hết hỗ trợ, hết vòng đời và ngừng dùng thực tế
  - Kiểm kê người dùng, tích hợp và quy trình còn phụ thuộc
  - Lập kế hoạch thay thế, chuyển giao và thông báo mốc thời gian
  - Di chuyển, lưu giữ hoặc xóa dữ liệu theo chính sách đã được phê duyệt
  - Chuẩn bị quyền truy cập và khả năng đọc dữ liệu lưu trữ
  - Thu hồi tích hợp, tài nguyên và quyền truy cập khi đủ điều kiện
  - Xác minh không còn luồng nghiệp vụ dựa vào hệ thống cũ
  - Lưu hồ sơ hoàn tất và trách nhiệm hỗ trợ còn lại
- level1: Bối cảnh đặc thù
  level2:
  - Bảo trì phần mềm đóng gói sẵn và giới hạn can thiệp của bên mua
  - Bảo trì phần mềm nguồn mở khi phụ thuộc cộng đồng hoặc người duy trì
  - Bảo trì sản phẩm nhiều khách hàng và kiểm soát tùy biến riêng
  - Bảo trì hệ thống nhúng hoặc thiết bị khó cập nhật
  - Bảo trì hệ thống cần bằng chứng kiểm chứng nghiêm ngặt
  - Bảo trì dịch vụ thuê ngoài hoặc SaaS khi không nắm mã nguồn
  - Bảo trì kho dữ liệu và luồng xử lý dữ liệu dài hạn
  - Quản lý thay đổi mô hình, dữ liệu và tiêu chí đánh giá trong hệ thống AI
  - Duy trì phần mềm có tài liệu thiếu hoặc không còn nhóm phát triển ban đầu
- level1: Thực hành tổng hợp
  level2:
  - Tiếp nhận một ứng dụng cũ và lập hồ sơ sẵn sàng bảo trì
  - Phân loại tập yêu cầu sửa lỗi, thích nghi, hoàn thiện và bổ sung
  - Khôi phục hành vi bằng đọc mã và kiểm thử đặc trưng
  - Phân tích tác động rồi sửa lỗi nghiệp vụ có kiểm thử hồi quy
  - Tái cấu trúc một thành phần trước khi thêm chức năng
  - Lập danh sách nợ kỹ thuật và chọn hạng mục cần xử lý trước
  - Nâng cấp phụ thuộc có thay đổi không tương thích
  - Chuyển đổi schema để hai phiên bản ứng dụng cùng hoạt động
  - Lập kế hoạch hiện đại hóa từng phần cùng bằng chứng chuyển giao
  - Chuẩn bị phát hành, phương án khôi phục và đánh giá sau thay đổi
  - Lập kế hoạch ngừng hệ thống cũ sau khi hoàn tất thay thế
