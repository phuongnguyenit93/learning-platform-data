references:
  - title: "Microsoft Learn — What is DevOps?"
    url: "https://learn.microsoft.com/en-us/devops/what-is-devops"
    description: "Văn hóa cộng tác, vòng đời, CI/CD, kiểm soát phiên bản, IaC và monitoring."
  - title: "GitHub Docs — About Pull Requests"
    url: "https://docs.github.com/en/pull-requests/get-started/about-pull-requests"
    description: "Quy trình branch, review, kiểm tra tự động và merge thay đổi mã nguồn."
  - title: "GitHub Docs — Continuous Integration"
    url: "https://docs.github.com/en/actions/get-started/continuous-integration"
    description: "Tạo pipeline tự động build, lint và test khi code được push hoặc tạo pull request."
  - title: "Docker Docs — What is Docker?"
    url: "https://docs.docker.com/get-started/docker-overview/"
    description: "Khái niệm image, container, registry và phát hành ứng dụng nhất quán."
  - title: "GitHub Docs — Continuous Deployment"
    url: "https://docs.github.com/en/actions/get-started/continuous-deployment"
    description: "Tự động hóa build, test và triển khai bằng workflow có điều kiện."
  - title: "HashiCorp Developer — What is Terraform?"
    url: "https://developer.hashicorp.com/terraform/intro"
    description: "Infrastructure as Code, tệp cấu hình có phiên bản và quản lý tài nguyên hạ tầng."
  - title: "OpenTelemetry — Observability Primer"
    url: "https://opentelemetry.io/docs/concepts/observability-primer/"
    description: "Logs, metrics, traces và khái niệm SLI/SLO để theo dõi chất lượng dịch vụ."
  - title: "OWASP — CI/CD Security Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/CI_CD_Security_Cheat_Sheet.html"
    description: "Kiểm soát quyền, bí mật và rủi ro trong pipeline build và triển khai."
  - title: "DORA — Software Delivery Performance Metrics"
    url: "https://dora.dev/guides/dora-metrics/"
    description: "Các chỉ số về throughput và instability để đánh giá, cải tiến quy trình giao phần mềm."