      - "Kiểm tra định dạng, phân tích tĩnh và phản hồi lỗi build sớm"
      - "Cập nhật phụ thuộc có kiểm thử và kiểm soát thay đổi không tương thích"
  - level1: "Hiện vật phần mềm"
    level2:
      - "Phân biệt mã nguồn, gói phát hành, binary và container image"
