      - "Xác minh dữ liệu sau triển khai và xử lý migration thất bại"
      - "Giới hạn rollback dữ liệu và lựa chọn sửa tiếp hoặc phục hồi từ bản sao lưu"
  - level1: "Khả năng quan sát"
