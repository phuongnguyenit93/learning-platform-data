references:
  - title: "OWASP Developer Guide - SAST"
    url: "https://devguide.owasp.org/en/05-implementation/05-static-analysis/"
    description: "Nguyên lý phân tích mã tĩnh, data flow, phát hiện sớm và giới hạn SAST."
  - title: "OWASP Developer Guide - DAST"
    url: "https://devguide.owasp.org/en/06-verification/02-tools/01-dast/"
    description: "Kiểm thử động ứng dụng web và các hạn chế của phương pháp tự động."
  - title: "OWASP Web Security Testing Guide"
    url: "https://wstg.owasp.org/"
    description: "Phương pháp kiểm thử bảo mật ứng dụng web và API dựa trên kịch bản."
  - title: "OWASP ASVS 5.0"
    url: "https://asvs.owasp.org/"
    description: "Yêu cầu kiểm chứng kỹ thuật cho bảo mật ứng dụng web."
  - title: "OWASP ZAP - Baseline Scan"
    url: "https://www.zaproxy.org/docs/docker/baseline-scan/"
    description: "Quét baseline dựa trên spider và passive rules; xuất báo cáo cho CI."
  - title: "OWASP ZAP - Active Scan"
    url: "https://www.zaproxy.org/docs/desktop/start/features/ascan/"
    description: "Cảnh báo tác động, giới hạn và yêu cầu quyền quét chủ động."
  - title: "OWASP ZAP - Docker User Guide"
    url: "https://www.zaproxy.org/docs/docker/about/"
    description: "Chạy ZAP trong Docker và lựa chọn chế độ quét cho pipeline."
  - title: "GitHub Docs - Upload SARIF"
    url: "https://docs.github.com/en/code-security/how-tos/find-and-fix-code-vulnerabilities/integrate-with-existing-tools/upload-sarif-file"
    description: "Đưa báo cáo phân tích từ công cụ bên ngoài vào GitHub code scanning."