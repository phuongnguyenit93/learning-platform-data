references:
  - title: "NIST SP 800-207 — Zero Trust Architecture"
    url: "https://www.nist.gov/publications/zero-trust-architecture"
    description: "Nguyên tắc Zero Trust, trust boundary, quản lý truy cập và bảo vệ tài nguyên."
  - title: "AWS IAM — Security Best Practices"
    url: "https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html"
    description: "Least privilege, MFA, temporary credentials và kiểm soát quyền truy cập."
  - title: "AWS VPC — Security Groups"
    url: "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html"
    description: "Quy tắc lọc lưu lượng inbound/outbound và giảm bề mặt mạng."
  - title: "Kubernetes — RBAC Good Practices"
    url: "https://kubernetes.io/docs/concepts/security/rbac-good-practices/"
    description: "Quyền tối thiểu cho user, service account và tránh leo thang đặc quyền."
  - title: "Kubernetes — Network Policies"
    url: "https://kubernetes.io/docs/concepts/services-networking/network-policies/"
    description: "Phân đoạn lưu lượng workload với NetworkPolicy khi mạng hỗ trợ enforcement."
  - title: "CIS — Security Benchmarks"
    url: "https://www.cisecurity.org/cis-benchmarks-overview_new"
    description: "Baseline và hướng dẫn hardening cấu hình hệ điều hành, cloud và hạ tầng."
  - title: "HashiCorp Vault — Secrets Engines"
    url: "https://developer.hashicorp.com/vault/docs/secrets"
    description: "Lưu trữ secrets, tạo credential động và quản lý vòng đời bí mật."
  - title: "Checkov — Infrastructure as Code Security"
    url: "https://www.checkov.io/"
    description: "Quét IaC và phát hiện misconfiguration của Terraform, Kubernetes và nhiều nền tảng."
  - title: "HashiCorp Terraform — Policy"
    url: "https://developer.hashicorp.com/terraform/policy"
    description: "Viết và thực thi policy as code trong quy trình Terraform."
  - title: "Kubernetes — Auditing"
    url: "https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/"
    description: "Audit log, audit policy và điều tra thay đổi truy cập API server."