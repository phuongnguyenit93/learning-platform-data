references:
  - title: "OWASP — DevSecOps Guideline"
    url: "https://owasp.github.io/DevSecOpsGuideline/"
    description: "Hướng dẫn DevSecOps hiện hành về shift-left, các giai đoạn SDLC, SAST/DAST/SCA, secret scanning, IaC, security gates và supply chain."
  - title: "NIST SP 800-218 — Secure Software Development Framework"
    url: "https://csrc.nist.gov/pubs/sp/800/218/final"
    description: "Các thực hành nền tảng để chuẩn bị, bảo vệ, sản xuất và phản hồi trong quy trình phát triển phần mềm an toàn."
  - title: "OWASP SAMM — The Model"
    url: "https://owaspsamm.org/model/"
    description: "Khung đánh giá và phát triển maturity của governance, design, implementation, verification và operations."
  - title: "OWASP — CI/CD Security Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/CI_CD_Security_Cheat_Sheet.html"
    description: "Những rủi ro và kiểm soát liên quan quyền truy cập, secrets, runner, pipeline và tính toàn vẹn của quá trình phát hành."
  - title: "OWASP — Secrets Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet"
    description: "Quản lý vòng đời, lưu trữ, truy cập, rotation, revocation và giám sát secrets trong ứng dụng và CI/CD."
  - title: "OWASP — Dependency-Check"
    url: "https://owasp.org/projects/dependency-check"
    description: "Ví dụ công cụ Software Composition Analysis để kiểm tra dependency và lỗ hổng công khai đã được ghi nhận."
  - title: "SLSA — Specification v1.2"
    url: "https://slsa.dev/spec/v1.2/"
    description: "Đặc tả cấp độ bảo đảm software supply chain, build provenance và các biện pháp nâng cao tính toàn vẹn artifact."
