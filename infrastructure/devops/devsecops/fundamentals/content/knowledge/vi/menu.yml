menu:
- level1: Tổng quan DevSecOps
  level2:
  - DevSecOps là gì và mối liên hệ giữa phát triển, bảo mật và vận hành
  - Vì sao kiểm tra bảo mật vào cuối dự án không đáp ứng nhịp phát hành liên tục
  - Mục tiêu của DevSecOps đối với sản phẩm, người dùng và tổ chức
  - Phân biệt DevOps, AppSec, SecOps và DevSecOps
  - Bảo mật như trách nhiệm chung trong toàn bộ vòng đời phần mềm
  - Mối liên hệ giữa tốc độ phát hành, an toàn và độ tin cậy
  - Nhận diện tài sản, mối đe dọa, rủi ro và biện pháp kiểm soát
  - Bản đồ thuật ngữ và lộ trình học các năng lực DevSecOps
  - Những hiểu lầm khi đồng nhất DevSecOps với công cụ quét hoặc một chức danh
- level1: Nguyên tắc cốt lõi
  level2:
  - Đưa phản hồi bảo mật về sớm trong vòng đời phát triển (shift left)
  - Kiểm chứng bảo mật trong môi trường vận hành (shift right)
  - Phản hồi liên tục và vòng lặp cải tiến giữa các nhóm
  - Tự động hóa những kiểm tra lặp lại và giữ đánh giá cần phán đoán của con người
  - Thiết kế an toàn mặc định và giảm cấu hình dễ gây sai sót
  - Đặc quyền tối thiểu, phòng thủ nhiều lớp và giảm bề mặt tấn công
  - Ưu tiên theo rủi ro thay vì chỉ tăng số lượng kiểm tra
  - Duy trì bằng chứng có thể truy vết từ yêu cầu đến phát hành
  - Thiết lập giới hạn và phương án xử lý khi biện pháp kiểm soát thất bại
- level1: Văn hóa và trách nhiệm
  level2:
  - Phân công trách nhiệm giữa nhóm phát triển, bảo mật, vận hành và sản phẩm
  - Vai trò của lãnh đạo trong ưu tiên và phân bổ nguồn lực bảo mật
  - Xây dựng mạng lưới người hỗ trợ bảo mật trong nhóm (security champions)
  - Phối hợp đánh giá thiết kế, xử lý phát hiện và quyết định phát hành
  - Giao tiếp rủi ro bằng tác động tới sản phẩm và người sử dụng
  - Xây dựng văn hóa báo cáo sớm và học từ sự cố không đổ lỗi
  - Đưa công việc bảo mật vào kế hoạch và danh sách công việc của nhóm
  - Đào tạo theo vai trò và kiểm chứng năng lực bằng tình huống thực tế
  - Xác định người sở hữu và cơ chế giải quyết công việc bảo mật bị bỏ ngỏ
- level1: Nền tảng bảo mật
  level2:
  - Tính bí mật, tính toàn vẹn và tính sẵn sàng của hệ thống
  - Phân biệt tài sản, điểm yếu, lỗ hổng, mối đe dọa và rủi ro
  - Xác thực, phân quyền và trách nhiệm giải trình trong hệ thống
  - Ranh giới tin cậy, bề mặt tấn công và luồng dữ liệu
  - Phân biệt biện pháp phòng ngừa, phát hiện và ứng phó
  - Phân biệt mã hóa, băm và chữ ký số cùng mục đích sử dụng
  - Quản lý khóa và vai trò của giao thức bảo vệ dữ liệu khi truyền
  - Rủi ro từ cấu hình, quy trình và con người bên cạnh lỗi mã nguồn
  - Phân biệt bảo mật, quyền riêng tư, tuân thủ và độ tin cậy
- level1: Vòng đời phát triển an toàn
  level2:
  - Các giai đoạn từ ý tưởng, thiết kế, phát triển đến vận hành và ngừng sử dụng
  - Xác định hoạt động bảo mật phù hợp cho từng giai đoạn
  - Đưa tiêu chí bảo mật vào điều kiện bắt đầu và hoàn tất công việc
  - Tổ chức phản hồi bảo mật trong nhóm Agile và luồng phân phối liên tục
  - Liên kết yêu cầu, thay đổi mã, kiểm thử và bằng chứng phát hành
  - Đánh giá bảo mật khi thay đổi kiến trúc, dữ liệu hoặc nhà cung cấp
  - Quản lý nợ bảo mật và kế hoạch cải tiến qua nhiều phiên bản
  - Phân biệt đánh giá định kỳ với kiểm chứng liên tục
  - Xử lý dữ liệu và thu hồi quyền khi kết thúc vòng đời sản phẩm
- level1: Tài sản và rủi ro
  level2:
  - Kiểm kê ứng dụng, dịch vụ, API, dữ liệu và hạ tầng liên quan
  - Phân loại mức quan trọng của tài sản đối với hoạt động kinh doanh
  - Nhận diện chủ sở hữu, phụ thuộc và phạm vi ảnh hưởng của hệ thống
  - Phân loại dữ liệu và xác định yêu cầu bảo vệ tương ứng
  - Đánh giá khả năng xảy ra, tác động và giả định của một rủi ro
  - Phân biệt mức nghiêm trọng kỹ thuật với ưu tiên xử lý theo bối cảnh
  - Lựa chọn giảm thiểu, tránh, chuyển giao hoặc chấp nhận rủi ro
  - Ghi nhận rủi ro còn lại và trách nhiệm phê duyệt
  - Cập nhật hồ sơ rủi ro khi có thay đổi hoặc bằng chứng mới
- level1: Yêu cầu bảo mật
  level2:
  - Chuyển mục tiêu bảo vệ sản phẩm thành yêu cầu có thể kiểm chứng
  - Xác định yêu cầu xác thực, phân quyền và quản lý phiên
  - Xác định yêu cầu bảo vệ dữ liệu khi lưu trữ, truyền và xử lý
  - Xây dựng tình huống lạm dụng và tiêu chí chấp nhận bảo mật
  - Đưa yêu cầu ghi log, giám sát và ứng phó vào thiết kế ban đầu
  - Xác định yêu cầu bảo mật đối với tích hợp và nhà cung cấp
  - Thiết lập điều kiện phát hành và bằng chứng cần cung cấp
  - Phân biệt yêu cầu bắt buộc với khuyến nghị cải tiến
  - Theo dõi tính nhất quán giữa yêu cầu, thiết kế và kiểm thử
- level1: Mô hình đe dọa
  level2:
  - Mục đích và thời điểm thực hiện mô hình đe dọa
  - Xác định phạm vi, tài sản và giả định về đối tượng tấn công
  - Vẽ sơ đồ luồng dữ liệu cùng các ranh giới tin cậy
  - Nhận diện điểm vào, quyền truy cập và đường tấn công
  - Sử dụng STRIDE như gợi ý phân tích các loại đe dọa
  - Xây dựng tình huống lạm dụng theo luồng nghiệp vụ
  - Ưu tiên đe dọa và lựa chọn biện pháp giảm thiểu
  - Chuyển kết quả phân tích thành công việc và ca kiểm thử
  - Đánh giá lại mô hình khi kiến trúc hoặc môi trường thay đổi
  - Nhận diện giới hạn và những giả định chưa được kiểm chứng
- level1: Kiến trúc an toàn
  level2:
  - Thiết kế ranh giới dịch vụ và phân chia vùng tin cậy
  - Áp dụng đặc quyền tối thiểu cho người dùng và thành phần hệ thống
  - Tách nhiệm vụ và kiểm soát các thao tác nhạy cảm
  - Thiết kế xác thực, phân quyền và quản lý danh tính nhất quán
  - Giảm dữ liệu nhạy cảm và giảm số thành phần cần được tin cậy
  - Thiết kế xử lý lỗi không làm lộ thông tin hoặc bỏ qua kiểm soát
  - Giới hạn tài nguyên, tần suất và tác động của hành vi lạm dụng
  - Bảo vệ giao tiếp và xác minh danh tính giữa các dịch vụ
  - Đánh giá đánh đổi giữa bảo mật, khả dụng và trải nghiệm sử dụng
  - Ghi lại quyết định kiến trúc và giả định bảo mật quan trọng
- level1: Lập trình an toàn
  level2:
  - Kiểm tra dữ liệu đầu vào theo ngữ cảnh và ranh giới tin cậy
  - Mã hóa đầu ra và ngăn dữ liệu bị diễn giải thành lệnh
  - Truy vấn có tham số và kiểm soát truy cập dữ liệu
  - Thực thi phân quyền ở phía máy chủ cho từng tài nguyên và hành động
  - Xử lý mật khẩu, phiên và thông tin xác thực bằng cơ chế phù hợp
  - Ngăn lộ dữ liệu nhạy cảm qua lỗi, log và phản hồi API
  - Kiểm soát thao tác với tệp, đường dẫn và tài nguyên bên ngoài
  - Nhận diện rủi ro khi xử lý URL, yêu cầu mạng và dữ liệu tuần tự hóa
  - Sử dụng thư viện mật mã và cấu hình an toàn thay vì tự thiết kế thuật toán
  - Rà soát mã theo luồng dữ liệu, giả định tin cậy và yêu cầu bảo mật
- level1: Danh tính và bí mật
  level2:
  - Phân biệt danh tính con người, dịch vụ và tác vụ tự động
  - Quản lý vòng đời tài khoản từ cấp phát đến thu hồi
  - Giảm quyền thường trực và giới hạn phạm vi thông tin xác thực
  - Bảo vệ tài khoản quan trọng bằng xác thực nhiều yếu tố
  - Phân biệt bí mật với cấu hình thông thường và dữ liệu công khai
  - Lưu giữ và cấp phát bí mật qua hệ thống quản lý chuyên dụng
  - Tránh đưa bí mật vào mã nguồn, log, tệp build và artifact
  - Luân chuyển, hết hạn và thu hồi thông tin xác thực
  - Nhận diện bí mật đã lộ và ưu tiên thu hồi trước khi dọn lịch sử
  - Xác minh danh tính tác vụ và kiểm soát quyền truy cập theo môi trường
- level1: Kho mã và cộng tác
  level2:
  - Xác định kho mã chuẩn và người được phép đưa thay đổi vào phát hành
  - Bảo vệ nhánh và yêu cầu rà soát cho thay đổi quan trọng
  - Phân công người duyệt mã, cấu hình build và tệp workflow
  - Quản lý quyền của bot, ứng dụng tích hợp và cộng tác viên
  - Kiểm soát thay đổi từ fork và đóng góp bên ngoài
  - Liên kết commit, yêu cầu thay đổi và bằng chứng kiểm tra
  - Kiểm tra bí mật và lỗi phổ biến trước hoặc khi đưa mã lên kho
  - Phân biệt tính xác thực của commit với chất lượng và độ an toàn của mã
  - Bảo vệ tag, quy tắc phát hành và lịch sử thay đổi
- level1: Nền tảng kiểm thử bảo mật
  level2:
  - Mục tiêu kiểm thử từ yêu cầu bảo mật và mô hình đe dọa
  - Phân biệt phân tích tĩnh, phân tích động và kiểm thử thủ công
  - Phân biệt SAST, DAST, SCA và kiểm tra cấu hình
  - Vai trò của kiểm thử tương tác (IAST) và kiểm thử bằng dữ liệu biến đổi (fuzzing)
  - Viết kiểm thử đơn vị, tích hợp và API cho hành vi bảo mật
  - Kiểm thử phân quyền, phiên và các luồng nghiệp vụ dễ bị lạm dụng
  - Vai trò và giới hạn của kiểm thử xâm nhập (penetration testing)
  - Chọn môi trường, dữ liệu và phạm vi kiểm thử được cho phép
  - Quản lý phát hiện sai, điểm bỏ sót và giới hạn độ bao phủ
  - Duy trì ca kiểm thử hồi quy sau khi sửa lỗ hổng
- level1: Phân tích mã và phụ thuộc
  level2:
  - Mục đích của SAST trong phát hiện mẫu mã có rủi ro
  - Tổ chức luật kiểm tra theo ngôn ngữ, framework và bối cảnh ứng dụng
  - Đối chiếu kết quả phân tích với luồng dữ liệu và khả năng khai thác
  - Mục đích của SCA trong kiểm kê thành phần và nhận diện rủi ro phụ thuộc
  - Phân biệt phụ thuộc trực tiếp, bắc cầu, lúc build và lúc chạy
  - Đánh giá phiên bản, tình trạng duy trì và nguồn phát hành của thành phần
  - Kiểm tra giấy phép và điều kiện sử dụng thành phần nguồn mở
  - Xử lý cập nhật phụ thuộc cùng kiểm thử tương thích và hồi quy
  - Phân biệt lỗi ứng dụng, lỗ hổng thư viện và rủi ro chuỗi cung ứng
- level1: Kiểm thử hệ thống chạy
  level2:
  - Mục đích của DAST và điều kiện để quét ứng dụng đang chạy
  - Chuẩn bị môi trường kiểm thử đại diện cho cấu hình triển khai
  - Cấp danh tính kiểm thử và bao phủ nhiều vai trò truy cập
  - Khám phá đường dẫn, API và luồng nghiệp vụ cần kiểm tra
  - Kiểm tra xác thực, phân quyền, phiên và xử lý đầu vào
  - Bảo vệ dữ liệu kiểm thử và giới hạn tác động của công cụ quét
  - Đối chiếu phát hiện động với log và bằng chứng tái hiện
  - Phân biệt phát hiện của công cụ với kiểm chứng khai thác trong phạm vi cho phép
  - Kết hợp kiểm thử tự động và đánh giá thủ công theo mức rủi ro
- level1: Chuỗi cung ứng phần mềm
  level2:
  - Nhận diện chuỗi từ nguồn mã và phụ thuộc đến artifact được sử dụng
  - Kiểm kê công cụ build, dịch vụ tích hợp và nhà cung cấp phần mềm
  - Nhận diện giả mạo gói, nguồn tải và bản cập nhật độc hại
  - Cố định đầu vào và xác minh tính toàn vẹn theo nội dung
  - Vai trò và giới hạn của danh mục thành phần phần mềm (SBOM)
  - Vai trò của bằng chứng nguồn gốc build (provenance) và xác nhận (attestation)
  - Phân biệt chữ ký hợp lệ với nội dung an toàn
  - Liên kết commit, lần build, artifact và bản triển khai
  - Xác minh bằng chứng tại điểm phát hành và điểm tiếp nhận
  - Xác định phạm vi ảnh hưởng khi một thành phần hoặc nguồn phát hành bị xâm nhập
- level1: Bảo vệ pipeline
  level2:
  - Nhận diện tài sản, danh tính và ranh giới tin cậy trong CI/CD
  - Tách luồng kiểm tra đóng góp bên ngoài với luồng có quyền phát hành
  - Cấp quyền tối thiểu và giới hạn thời gian sống của thông tin xác thực
  - Bảo vệ tệp workflow và các tham số điều khiển thực thi
  - Tránh để dữ liệu không tin cậy trở thành lệnh của pipeline
  - Kiểm soát nguồn và phiên bản của plugin, action và công cụ build
  - Cô lập môi trường thực thi và làm sạch trạng thái giữa các lần chạy
  - Bảo vệ cache, artifact trung gian và dữ liệu đầu ra của pipeline
  - Kiểm soát quyền truy cập bí mật theo nhánh và môi trường
  - Lưu log và bằng chứng mà không làm lộ thông tin nhạy cảm
- level1: Tích hợp kiểm tra tự động
  level2:
  - Chọn vị trí kiểm tra ở máy phát triển, yêu cầu thay đổi, build và triển khai
  - Tổ chức kiểm tra nhanh trước và đánh giá tốn thời gian sau
  - Cấu hình đầu vào, phiên bản và luật kiểm tra có thể tái hiện
  - Chuẩn hóa kết quả để liên kết phát hiện với mã và người sở hữu
  - Thiết lập đường cơ sở cho hệ thống đang có nợ bảo mật
  - Phân biệt phát hiện mới với vấn đề tồn đọng đã được theo dõi
  - Tối ưu thời gian chạy bằng phạm vi thay đổi và kiểm tra đầy đủ định kỳ
  - Phân biệt công cụ lỗi, không quét được và thực sự không có phát hiện
  - Đánh giá độ bao phủ trước khi bỏ hoặc giảm một bước kiểm tra
  - Quản lý thay đổi công cụ và luật quét như thay đổi của sản phẩm
- level1: Cổng kiểm soát và ngoại lệ
  level2:
  - Mục đích của cổng kiểm soát bảo mật trong luồng phân phối
  - Xây dựng điều kiện cảnh báo hoặc chặn dựa trên rủi ro
  - Phân biệt điều kiện chặn thay đổi mới với xử lý nợ hiện có
  - Kết hợp mức nghiêm trọng, khả năng khai thác và mức quan trọng của tài sản
  - Xác định hành vi khi thiếu dữ liệu hoặc kiểm tra không hoàn tất
  - Thiết lập người phê duyệt, lý do và thời hạn của ngoại lệ
  - Theo dõi biện pháp bù đắp và rủi ro còn lại trong thời gian ngoại lệ
  - Ngăn bỏ qua cổng kiểm soát ngoài quy trình được phép
  - Đánh giá tác động của cổng kiểm soát tới công việc phát triển
  - Rà soát và thu hồi ngoại lệ khi điều kiện áp dụng không còn
- level1: Quản lý lỗ hổng
  level2:
  - Tổ chức vòng đời phát hiện, xác minh, ưu tiên, sửa và đóng
  - Phân biệt phát hiện trùng lặp với nhiều vị trí bị ảnh hưởng
  - Đánh giá mức nghiêm trọng bằng ngữ cảnh và thang điểm như CVSS
  - Kết hợp dấu hiệu khai thác thực tế và khả năng tiếp cận thành phần
  - Xác định người sở hữu và thời hạn xử lý theo rủi ro
  - Tạo công việc có bằng chứng, cách tái hiện và tiêu chí xác minh
  - Phân biệt sửa nguyên nhân, biện pháp giảm thiểu và chấp nhận rủi ro
  - Kiểm thử lại bản sửa và bổ sung kiểm thử hồi quy
  - Theo dõi lỗ hổng chưa có bản vá và thành phần đã hết hỗ trợ
  - Nhận phản hồi từ bên ngoài qua quy trình công bố và tiếp nhận phù hợp
- level1: Nền tảng container
  level2:
  - Nhận diện image, registry và môi trường chạy trong phạm vi bảo vệ
  - Lựa chọn base image từ nguồn tin cậy và duy trì cập nhật
  - Giảm thành phần không cần thiết trong image
  - Tránh đưa bí mật và dữ liệu nhạy cảm vào các lớp image
  - Kiểm tra thành phần và cấu hình trước khi công bố image
  - Định danh image bằng nội dung và kiểm soát quyền registry
  - Giảm quyền tiến trình và quyền truy cập tài nguyên khi chạy container
  - Phân biệt rủi ro của image, cấu hình triển khai và môi trường chạy
  - Liên kết image với nguồn build, bằng chứng kiểm tra và bản triển khai
- level1: Nền tảng hạ tầng và cloud
  level2:
  - Phân định trách nhiệm bảo mật giữa nhà cung cấp và bên sử dụng cloud
  - Kiểm kê tài nguyên, danh tính và cấu hình hạ tầng
  - Tách môi trường và kiểm soát kết nối giữa các vùng
  - Thiết lập quyền tối thiểu cho tài nguyên và danh tính dịch vụ
  - Đưa cấu hình hạ tầng vào mã (IaC) và rà soát thay đổi
  - Kiểm tra cấu hình không an toàn trước khi cấp phát tài nguyên
  - Phát hiện sai lệch giữa cấu hình mong muốn và hệ thống thực tế
  - Bảo vệ trạng thái IaC, tệp kế hoạch và dữ liệu nhạy cảm
  - Quản lý bản vá, cấu hình chuẩn và tài nguyên hết vòng đời
  - Đánh giá chính sách hạ tầng bằng mã và giữ bằng chứng áp dụng
- level1: Triển khai an toàn
  level2:
  - Phân tách môi trường phát triển, kiểm thử và sản xuất
  - Phát hành đúng artifact đã được kiểm tra và phê duyệt
  - Kiểm soát cấu hình và bí mật theo môi trường triển khai
  - Giới hạn danh tính và quyền được phép triển khai
  - Đặt điều kiện xác minh trước và sau phát hành
  - Sử dụng triển khai theo giai đoạn để giới hạn tác động
  - Chuẩn bị quay lui cùng giới hạn khi dữ liệu hoặc schema đã thay đổi
  - Ghi nhận ai triển khai, phiên bản nào và bằng chứng liên quan
  - Tổ chức thay đổi khẩn cấp mà vẫn duy trì khả năng truy vết
- level1: Dữ liệu và quyền riêng tư
  level2:
  - Kiểm kê dữ liệu cá nhân và dữ liệu nhạy cảm theo luồng xử lý
  - Thu thập tối thiểu và giới hạn mục đích sử dụng dữ liệu
  - Bảo vệ dữ liệu khi lưu trữ và khi truyền giữa thành phần
  - Phân quyền truy cập dữ liệu theo vai trò và nhu cầu công việc
  - Ẩn danh hoặc che dữ liệu khi kiểm thử và hỗ trợ vận hành
  - Thiết lập thời hạn lưu giữ, xóa và xử lý bản sao dữ liệu
  - Ngăn lộ dữ liệu qua log, thông báo lỗi và công cụ phân tích
  - Đánh giá rủi ro dữ liệu khi tích hợp dịch vụ bên ngoài
  - Liên kết yêu cầu quyền riêng tư với thiết kế và bằng chứng kiểm chứng
- level1: Giám sát và ứng phó
  level2:
  - Xác định sự kiện bảo mật cần ghi nhận từ ứng dụng và nền tảng
  - Thiết kế log có ngữ cảnh nhưng không chứa bí mật hoặc dữ liệu không cần thiết
  - Bảo vệ tính toàn vẹn, quyền truy cập và thời hạn lưu log
  - Phát hiện hành vi bất thường và xây dựng cảnh báo có thể xử lý
  - Phân công người tiếp nhận, phân loại và nâng mức xử lý cảnh báo
  - Phân biệt lỗ hổng, sự kiện và sự cố bảo mật
  - Chuẩn bị hướng dẫn ứng phó, quyền truy cập và kênh phối hợp
  - Cô lập tác động và bảo toàn bằng chứng khi xảy ra sự cố
  - Khôi phục trên cơ sở đã xác minh và theo dõi nguy cơ tái diễn
  - Chuyển bài học sự cố thành yêu cầu, kiểm thử và biện pháp kiểm soát mới
- level1: Quản trị và bằng chứng
  level2:
  - Chuyển chính sách tổ chức thành yêu cầu kỹ thuật có người sở hữu
  - Phân biệt tuân thủ quy định với hiệu lực bảo vệ thực tế
  - Liên hệ hoạt động vòng đời an toàn với các khung như NIST SSDF
  - Sử dụng hướng dẫn và tiêu chí kiểm chứng như OWASP theo phạm vi phù hợp
  - Thu thập bằng chứng kiểm tra và phê duyệt ngay trong luồng công việc
  - Truy vết từ yêu cầu tới thay đổi mã, kiểm thử và bản phát hành
  - Bảo vệ quyền truy cập, tính toàn vẹn và thời hạn lưu bằng chứng
  - Đánh giá yêu cầu bảo mật khi tiếp nhận nhà cung cấp hoặc dịch vụ
  - Rà soát chính sách, ngoại lệ và trách nhiệm theo thay đổi của hệ thống
- level1: Đo lường và cải tiến
  level2:
  - Xác định mục tiêu đo lường gắn với rủi ro và kết quả sản phẩm
  - Theo dõi độ bao phủ kiểm tra cùng các vùng chưa được đánh giá
  - Đo thời gian từ phát hiện tới xác minh và khắc phục
  - Theo dõi lỗ hổng tồn đọng, tái xuất hiện và ngoại lệ quá hạn
  - Đánh giá chất lượng phát hiện và chi phí xử lý kết quả sai
  - Theo dõi thời gian phản hồi và tác động tới luồng phân phối
  - Phân tích nguyên nhân gốc của lỗi lặp lại và sự cố
  - Tránh đánh giá năng lực chỉ bằng số công cụ hoặc số lần quét
  - Thực hiện cải tiến nhỏ và kiểm chứng hiệu quả bằng bằng chứng
- level1: Công cụ và nền tảng
  level2:
  - Lập bản đồ nhu cầu trước khi lựa chọn công cụ DevSecOps
  - Đánh giá khả năng hỗ trợ ngôn ngữ, kiến trúc và môi trường triển khai
  - So sánh khả năng tích hợp, dữ liệu đầu ra và phân công xử lý
  - Đánh giá quyền truy cập và dữ liệu mà công cụ thu thập
  - Cân nhắc độ chính xác, độ bao phủ và thời gian phản hồi
  - Đánh giá chi phí vận hành, bảo trì luật và khả năng thay thế
  - Xây dựng cấu hình mẫu và luồng triển khai an toàn dễ sử dụng
  - Vai trò của nhóm nền tảng trong cung cấp năng lực bảo mật dùng chung
  - Tránh phụ thuộc vào công cụ khi thiếu quy trình, người sở hữu và kiểm chứng
- level1: Lộ trình áp dụng
  level2:
  - Đánh giá hiện trạng theo sản phẩm, đội ngũ và mức rủi ro
  - Chọn phạm vi thí điểm có mục tiêu và tiêu chí thành công rõ ràng
  - Ưu tiên tài sản, quyền truy cập và rủi ro có tác động lớn
  - Thiết lập đường cơ sở trước khi áp dụng cổng chặn rộng
  - Từng bước đưa phản hồi bảo mật vào công việc hằng ngày
  - Xử lý nợ bảo mật song song với kiểm soát thay đổi mới
  - Mở rộng mô hình dùng chung mà vẫn giữ yêu cầu riêng của sản phẩm
  - Đào tạo, hỗ trợ và thu thập phản hồi từ nhóm sử dụng
  - Rà soát kết quả để cập nhật kế hoạch và nguồn lực
  - Nhận diện dấu hiệu triển khai hình thức và điều chỉnh cách áp dụng
- level1: Thực hành tổng hợp
  level2:
  - Khảo sát một ứng dụng mẫu và lập bản đồ tài sản cùng chủ sở hữu
  - Viết yêu cầu bảo mật và tình huống lạm dụng cho một chức năng
  - Lập mô hình đe dọa theo luồng dữ liệu và ranh giới tin cậy
  - Rà soát mã và bổ sung kiểm thử cho một yêu cầu phân quyền
  - Tạo pipeline mẫu với kiểm tra mã, phụ thuộc và bí mật
  - Phân loại phát hiện, lập công việc sửa và xác minh sau khắc phục
  - Thiết kế cổng kiểm soát cùng quy trình ngoại lệ có thời hạn
  - Liên kết artifact với commit, kết quả kiểm tra và lần triển khai
  - Kiểm tra cấu hình container hoặc IaC trong môi trường thực hành cô lập
  - Diễn tập xử lý thông tin xác thực bị lộ và bảo toàn bằng chứng
  - Xây dựng chỉ số ban đầu và đề xuất một cải tiến có thể kiểm chứng
  - Bàn giao hồ sơ DevSecOps từ yêu cầu đến vận hành của ứng dụng mẫu
