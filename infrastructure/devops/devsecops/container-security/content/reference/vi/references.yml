references:
  - title: "NIST — Application Container Security Guide (SP 800-190)"
    url: "https://csrc.nist.gov/pubs/sp/800/190/final"
    description: "Mô hình rủi ro, cách ly, quản lý lỗ hổng và biện pháp bảo vệ container theo NIST."
  - title: "Docker — Building Best Practices"
    url: "https://docs.docker.com/build/building/best-practices/"
    description: "Lựa chọn base image tin cậy và tối giản, multi-stage build, cập nhật dependency và giảm attack surface."
  - title: "Docker — Engine Security"
    url: "https://docs.docker.com/engine/security/"
    description: "Cách ly namespace, daemon attack surface, Linux capabilities và hardening runtime."
  - title: "Docker Scout — Image Analysis"
    url: "https://docs.docker.com/scout/explore/analysis/"
    description: "Quét image, phân tích SBOM, vulnerabilities và kết quả theo CVE."
  - title: "Kubernetes — Application Security Checklist"
    url: "https://kubernetes.io/docs/concepts/security/application-security-checklist/"
    description: "Các điểm kiểm tra bảo mật ứng dụng Kubernetes như securityContext, quyền, image và network."
  - title: "Kubernetes — Pod Security Standards"
    url: "https://kubernetes.io/docs/concepts/security/pod-security-standards/"
    description: "Các cấp Privileged, Baseline, Restricted và yêu cầu bảo mật Pod."
  - title: "Kubernetes — Good Practices for Secrets"
    url: "https://kubernetes.io/docs/concepts/security/secrets-good-practices/"
    description: "Nguyên tắc bảo vệ secrets, RBAC, mã hóa khi lưu và giới hạn container được đọc."
  - title: "Kubernetes — Restrict Syscalls with seccomp"
    url: "https://kubernetes.io/docs/tutorials/security/seccomp/"
    description: "Thực hành seccomp profile và RuntimeDefault trong Pod để giảm bề mặt syscall."