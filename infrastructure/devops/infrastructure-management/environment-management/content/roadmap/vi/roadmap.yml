roadmap:
- id: phan-tang-moi-truong
  title: Phân tầng môi trường
  purpose: Xác định vai trò và tiêu chí chất lượng của dev, test, staging và production.
  objectives:
  - Phân biệt mục tiêu của từng môi trường
  - Lập ma trận cấu hình và mức độ ổn định
  - Xác định chủ sở hữu và quy tắc sử dụng
- id: co-lap-ha-tang
  title: Cô lập hạ tầng
  purpose: Ngăn ảnh hưởng chéo giữa môi trường qua ranh giới tài nguyên và mạng.
  objectives:
  - So sánh account/project với namespace
  - Thiết kế phân tách mạng và dữ liệu
  - Áp dụng quota và giới hạn tài nguyên
- id: config-secrets
  title: Config & Secrets
  purpose: Quản lý cấu hình theo lần triển khai và bảo vệ thông tin nhạy cảm.
  objectives:
  - Tách cấu hình khỏi mã nguồn
  - Phân biệt ConfigMap với Secret
  - Kiểm tra cấp phát và luân chuyển thông tin xác thực
- id: iac-state
  title: IaC & State
  purpose: Tạo môi trường nhất quán, có thể tái lập và quản lý thay đổi bằng mã.
  objectives:
  - Chuẩn hóa module và biến theo môi trường
  - Tách state và quyền truy cập phù hợp
  - Chạy plan để phát hiện sai lệch hạ tầng
- id: quyen-truy-cap-policy
  title: Quyền truy cập & Policy
  purpose: Thiết lập nguyên tắc đặc quyền tối thiểu và quy trình thay đổi có kiểm soát.
  objectives:
  - Thiết kế vai trò dev và vận hành production
  - Áp dụng RBAC và kiểm tra quyền thực tế
  - Lưu audit log của thay đổi cấu hình
- id: du-lieu-tuong-dong
  title: Dữ liệu & tương đồng
  purpose: Đảm bảo môi trường thử nghiệm đủ giống production mà không lộ dữ liệu nhạy cảm.
  objectives:
  - So sánh phiên bản dịch vụ giữa các môi trường
  - Tạo dữ liệu thử nghiệm được ẩn danh
  - Kiểm tra backup và khả năng khôi phục
- id: promotion-release-gate
  title: Promotion & Release Gate
  purpose: Đưa thay đổi qua các môi trường theo thứ tự và có thể rollback an toàn.
  objectives:
  - Thiết kế luồng dev đến staging và production
  - Thiết lập kiểm thử cùng bước phê duyệt
  - Thực hành rollback khi triển khai lỗi
- id: vong-doi-van-hanh
  title: Vòng đời & vận hành
  purpose: Quản lý môi trường tạm thời, quan sát hệ thống và hạn chế lãng phí tài nguyên.
  objectives:
  - Tạo và hủy môi trường preview tự động
  - Gắn nhãn owner, TTL và ngân sách
  - Theo dõi sức khỏe, cảnh báo và chi phí
