roadmap:
- id: container-vm
  title: Container & VM
  purpose: Hiểu container đóng gói ứng dụng cùng phụ thuộc và khác máy ảo ở cơ chế cô lập, chia sẻ kernel.
  objectives:
  - Giải thích container như tiến trình cô lập
  - So sánh container với máy ảo và host
  - Nêu lợi ích nhất quán giữa dev, CI và production
- id: image-layers-tags
  title: Image, Layers & Tags
  purpose: Phân biệt bản mẫu image với container đang chạy, đồng thời hiểu cấu trúc lớp và định danh phiên bản.
  objectives:
  - Phân biệt image bất biến với container có trạng thái
  - Giải thích layers, tag và digest
  - Đọc tên image gồm registry, repository và tag
- id: runtime-isolation
  title: Runtime & Isolation
  purpose: Nhận diện các thành phần thực thi container và giới hạn của cơ chế cô lập tài nguyên.
  objectives:
  - Phân biệt Docker Engine với container runtime
  - Giải thích namespaces và cgroups cơ bản
  - Nêu vai trò của tiêu chuẩn OCI đối với image và runtime
- id: vong-doi-container
  title: Vòng đời Container
  purpose: Thực hành thao tác tối thiểu để khởi chạy, quan sát và xử lý lỗi một container.
  objectives:
  - Dùng run, ps, logs, exec và inspect
  - Thử stop, start, remove và restart
  - Phân biệt dữ liệu tạm với dữ liệu cần lưu bền
- id: dockerfile-build
  title: Dockerfile & Build
  purpose: Biết tạo image tái lập được từ mã ứng dụng và giữ kích thước, phụ thuộc ở mức hợp lý.
  objectives:
  - Viết Dockerfile gồm FROM, WORKDIR, COPY, RUN, CMD
  - Build image và chạy ứng dụng mẫu
  - Áp dụng .dockerignore và multi-stage build
- id: registry-phan-phoi
  title: Registry & Phân phối
  purpose: Hiểu cách lưu, định danh và phân phối image để dùng nhất quán qua môi trường.
  objectives:
  - Phân biệt registry, repository, tag và digest
  - Thực hành pull, tag và push image thử nghiệm
  - Giải thích lý do pin phiên bản và kiểm soát nguồn image
- id: network-persistent-data
  title: Network & Persistent Data
  purpose: Kết nối dịch vụ qua cổng và mạng container, đồng thời tách dữ liệu bền khỏi vòng đời container.
  objectives:
  - Thử port publishing và bridge network
  - Phân biệt volume với bind mount
  - Kiểm chứng dữ liệu tồn tại sau khi xóa container
- id: bao-mat-van-hanh
  title: Bảo mật & Vận hành
  purpose: Áp dụng các nguyên tắc tối thiểu để container an toàn, quan sát được và sẵn sàng cho CI/CD.
  objectives:
  - Chọn base image tin cậy, hạn chế chạy root
  - Thiết lập giới hạn tài nguyên và healthcheck
  - Kiểm tra logs, quét image và cập nhật bản vá
