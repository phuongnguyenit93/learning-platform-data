references:
  - title: "Kubernetes — Components"
    url: "https://kubernetes.io/docs/concepts/overview/components/"
    description: "Control plane, worker node, scheduler, kubelet và các thành phần tạo nên cluster."
  - title: "Kubernetes — Pods"
    url: "https://kubernetes.io/docs/concepts/workloads/pods/"
    description: "Đơn vị thực thi Pod, container bên trong và cách Pod được quản lý."
  - title: "Kubernetes — Deployments"
    url: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"
    description: "Desired state, replicas, rolling update, rollout status và rollback."
  - title: "Kubernetes — Service"
    url: "https://kubernetes.io/docs/concepts/services-networking/service/"
    description: "Service discovery, labels/selectors, ClusterIP, NodePort và LoadBalancer."
  - title: "Kubernetes — ConfigMaps"
    url: "https://kubernetes.io/docs/concepts/configuration/configmap/"
    description: "Quản lý cấu hình không nhạy cảm tách khỏi container image."
  - title: "Kubernetes — Secrets"
    url: "https://kubernetes.io/docs/concepts/configuration/secret/"
    description: "Lưu dữ liệu nhạy cảm, mount/inject secrets và lưu ý quyền truy cập."
  - title: "Kubernetes — Persistent Volumes"
    url: "https://kubernetes.io/docs/concepts/storage/persistent-volumes/"
    description: "Phân biệt PV, PVC và vòng đời lưu trữ không gắn với Pod."
  - title: "Kubernetes — Liveness, Readiness, Startup Probes"
    url: "https://kubernetes.io/docs/concepts/workloads/pods/probes/"
    description: "Phân biệt probes phục hồi tiến trình, điều tiết traffic và xử lý khởi động chậm."
  - title: "Kubernetes — Horizontal Pod Autoscaling"
    url: "https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/"
    description: "Tự động tăng giảm số Pod theo CPU, memory hoặc metrics."
  - title: "Kubernetes — Logging Architecture"
    url: "https://kubernetes.io/docs/concepts/cluster-administration/logging/"
    description: "Application logs, node-level logging và mô hình lưu log toàn cluster."