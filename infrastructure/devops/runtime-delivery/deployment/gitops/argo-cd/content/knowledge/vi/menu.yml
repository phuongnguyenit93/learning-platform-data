menu:
- level1: Tổng quan
  level2:
  - Argo CD là gì và vai trò trong triển khai Kubernetes theo GitOps
  - Trạng thái mong muốn, trạng thái thực tế và vòng lặp đối soát
  - Phân chia trách nhiệm giữa CI, kho cấu hình và Argo CD
  - Mối quan hệ giữa Git, manifest, Application và tài nguyên Kubernetes
  - Phân biệt trạng thái đồng bộ với sức khỏe ứng dụng
  - Vai trò của lập trình viên, nhóm nền tảng và người vận hành
  - Phân biệt Argo CD, Argo Workflows, Argo Rollouts và Image Updater
  - Kiến thức Git, Kubernetes, Helm, Kustomize và mạng cần chuẩn bị
- level1: Kiến trúc
  level2:
  - Vai trò của API server và các giao diện UI, CLI, API
  - Vai trò của repository server trong lấy nguồn và sinh manifest
  - Vai trò của application controller trong đối chiếu và đồng bộ
  - Vai trò của ApplicationSet controller trong sinh Application
  - Vai trò của Redis và dữ liệu cache trong hệ thống
  - Luồng dữ liệu từ commit đến thay đổi trong cluster
  - Phân biệt cluster cài Argo CD và cluster triển khai ứng dụng
  - Ranh giới giữa cấu hình trong Kubernetes và trạng thái được khai báo ở Git
- level1: Cài đặt
  level2:
  - Chọn phiên bản Argo CD và kiểm tra ma trận Kubernetes hỗ trợ
  - Chuẩn bị cluster thử nghiệm, namespace và công cụ truy cập
  - Lựa chọn manifest cài đặt hoặc Helm chart được quản lý phù hợp
  - Phân biệt mô hình cài đặt thông thường và mô hình sẵn sàng cao
  - Cài CLI tương thích và kiểm tra các thành phần hoạt động
  - Đăng nhập ban đầu, thay thông tin quản trị và thu hồi bí mật tạm
  - Truy cập UI bằng port-forward trong phòng lab
  - Cấu hình ingress, TLS và kết nối gRPC hoặc gRPC-Web
  - Quản lý cấu hình cài đặt bằng Git theo phiên bản đã ghim
- level1: Ứng dụng đầu tiên
  level2:
  - Chuẩn bị repository manifest và cluster đích
  - Tạo Application đầu tiên qua CLI hoặc UI
  - Chọn repository, revision, đường dẫn và namespace đích
  - Đọc cây tài nguyên và xác định thay đổi trước đồng bộ
  - Thực hiện đồng bộ thủ công và theo dõi kết quả
  - Thay manifest trong Git rồi quan sát trạng thái OutOfSync
  - Tạo sai lệch trực tiếp trong cluster và quan sát đối chiếu
  - Xuất Application thành YAML để quản lý theo khai báo
- level1: Application
  level2:
  - Cấu trúc metadata và spec của tài nguyên Application
  - Khai báo project và ranh giới quyền của ứng dụng
  - Cấu hình source với repoURL, path, chart và targetRevision
  - Cấu hình destination bằng tên cluster hoặc địa chỉ API server
  - Phân biệt namespace của Application và namespace tài nguyên đích
  - Thiết lập syncPolicy và các tùy chọn đồng bộ
  - Quản lý labels, annotations và thông tin hiển thị
  - Đọc status, conditions và operationState khi vận hành
  - Lựa chọn phạm vi Application theo quyền sở hữu và vòng đời tài nguyên
- level1: Nguồn triển khai
  level2:
  - Kết nối Git repository công khai hoặc riêng tư
  - Xác thực Git bằng HTTPS token, SSH key hoặc GitHub App khi hỗ trợ
  - Quản lý repository Secret và mẫu thông tin xác thực
  - Thiết lập SSH known hosts và CA tin cậy cho Git
  - Lựa chọn nhánh, tag hoặc commit làm targetRevision
  - Sinh tài nguyên từ thư mục YAML và điều khiển phạm vi đệ quy
  - Sử dụng Helm repository hoặc registry OCI làm nguồn
  - Phân biệt OCI artifact chứa manifest và Helm chart lưu trong OCI
  - Cấu hình webhook và đối chiếu vai trò với cơ chế thăm dò định kỳ
- level1: Helm
  level2:
  - Vai trò của Helm trong sinh manifest cho Argo CD
  - Phân chia vòng đời Application và việc quản lý Helm release
  - Khai báo chart từ Helm repository hoặc từ Git
  - Ghim phiên bản chart và quản lý phụ thuộc của chart
  - Truyền values qua valueFiles, valuesObject hoặc parameters
  - Kiểm tra thứ tự ưu tiên giữa các nguồn Helm values
  - Quản lý releaseName, namespace và nhãn theo dõi tài nguyên
  - Đánh giá hook Helm, dữ liệu sinh ngẫu nhiên và tính ổn định khi render
  - Đối chiếu manifest được render trước khi nâng phiên bản chart
- level1: Kustomize
  level2:
  - Tổ chức base và overlay theo mục đích triển khai
  - Khai báo nguồn Kustomize trong Application
  - Điều chỉnh image, replicas, namespace và metadata
  - Sử dụng patches và components theo khả năng phiên bản
  - Quản lý ConfigMap hoặc Secret generator và tên có hậu tố hash
  - Ghim phiên bản Kustomize và kiểm soát build options
  - Quản lý remote base cùng quyền truy cập nguồn phụ thuộc
  - So sánh kết quả kustomize build cục bộ với manifest Argo CD sinh ra
- level1: Nhiều nguồn
  level2:
  - Khi nào một Application cần nhiều nguồn cấu hình
  - Khai báo sources và phân biệt với trường source
  - Kết hợp chart bên ngoài với Helm values trong Git riêng
  - Sử dụng ref và đường dẫn $values đúng phạm vi
  - Xử lý tài nguyên trùng định danh và RepeatedResourceWarning
  - Đánh giá tính tái lập khi nhiều revision cùng thay đổi
  - Lựa chọn multi-source, ApplicationSet hoặc App of Apps theo quan hệ ứng dụng
- level1: Đối chiếu và sai lệch
  level2:
  - Hiểu vòng lặp reconciliation và điều kiện phát hiện OutOfSync
  - Phân biệt refresh và hard refresh
  - Đọc diff giữa manifest mong muốn và đối tượng đang chạy
  - Nhận diện biến đổi do API server, admission webhook hoặc controller khác
  - Cấu hình ignoreDifferences bằng JSON pointer hoặc JQ expression
  - Giới hạn bỏ qua theo tài nguyên hoặc trường do thành phần khác quản lý
  - Phân biệt bỏ qua khi đối chiếu với RespectIgnoreDifferences lúc đồng bộ
  - Áp dụng resource exclusions hoặc inclusions theo nhu cầu theo dõi
  - Phối hợp HPA và operator để tránh tranh chấp quyền quản lý trường
  - Xử lý sai lệch bằng thay đổi khai báo có thể truy vết
- level1: Sức khỏe ứng dụng
  level2:
  - Đọc trạng thái Healthy, Progressing, Degraded, Suspended, Missing và Unknown
  - Hiểu cách trạng thái tài nguyên đóng góp vào sức khỏe Application
  - Phân biệt sync thành công với ứng dụng sẵn sàng phục vụ
  - Đánh giá sức khỏe Deployment, StatefulSet, Job và tài nguyên phổ biến
  - Xác định ảnh hưởng của readiness, rollout và điều kiện Kubernetes
  - Bổ sung health assessment cho custom resource khi cần
  - Kiểm thử quy tắc health tùy chỉnh và tránh báo khỏe sai
  - Liên hệ health với waves, hook và điều kiện chờ trong quy trình triển khai
- level1: Đồng bộ thủ công
  level2:
  - Xem trước phạm vi và revision trước khi chạy sync
  - Sử dụng UI hoặc argocd app sync để đồng bộ
  - Theo dõi tiến trình, kết quả từng tài nguyên và lịch sử thao tác
  - Chờ điều kiện đồng bộ hoặc sức khỏe bằng argocd app wait
  - Phân biệt đồng bộ toàn Application và selective sync
  - Đánh giá phạm vi pruning trước một lần đồng bộ
  - Dừng thao tác đang chạy và kiểm tra trạng thái thực còn lại
  - Chạy lại thao tác sau khi sửa nguyên nhân thay vì giả định đã quay lui
- level1: Đồng bộ tự động
  level2:
  - Thiết lập automated sync cho Application theo khai báo
  - Phân biệt tự đồng bộ khi nguồn đổi với selfHeal khi cluster sai lệch
  - Cấu hình prune và kiểm soát tài nguyên bị xóa khỏi nguồn
  - Đánh giá allowEmpty khi tập manifest trở thành rỗng
  - Quản lý chu kỳ reconciliation, jitter và webhook
  - Thiết lập retry, backoff và hành vi khi revision mới xuất hiện
  - Hiểu quan hệ giữa revision, tham số ứng dụng và lần sync trước
  - Tạm dừng hoặc khôi phục auto-sync tại đúng tài nguyên sở hữu cấu hình
  - Kiểm tra tác động của auto-sync khi xử lý sự cố hoặc quay lui
- level1: Tùy chọn đồng bộ
  level2:
  - Lựa chọn client-side apply và server-side apply theo quyền quản lý trường
  - Đánh giá Replace và Force với khả năng tái tạo tài nguyên
  - Kiểm soát xung đột managedFields khi chuyển sang server-side apply
  - Sử dụng CreateNamespace và quản lý metadata namespace có chủ đích
  - Đánh giá SkipDryRunOnMissingResource khi phụ thuộc CRD chưa sẵn sàng
  - Giới hạn bỏ qua schema validation theo trường hợp đã xác minh
  - Sử dụng ApplyOutOfSyncOnly và phân biệt với selective sync
  - Kiểm soát pruning bằng PruneLast và propagation policy
  - Chặn tài nguyên bị nhiều Application cùng quản lý bằng FailOnSharedResource
  - Đặt sync option theo Application hoặc theo từng tài nguyên
- level1: Hooks và waves
  level2:
  - Phân biệt giai đoạn hook và số thứ tự sync wave
  - Sử dụng PreSync, Sync, PostSync và SyncFail
  - Sắp xếp tài nguyên bằng sync-wave annotation
  - Phối hợp phase, wave, loại tài nguyên và health trong thứ tự áp dụng
  - Chuẩn bị namespace, CRD và custom resource theo phụ thuộc
  - Thiết kế Job kiểm tra trước hoặc sau triển khai
  - Quản lý tên hook, generateName và hook deletion policy
  - Xử lý hook lỗi, treo hoặc bị chạy lại
  - Đánh giá migration dữ liệu và cơ chế bù trừ khi hook thất bại
  - Nhận diện giới hạn hook trong selective sync và phụ thuộc xuyên Application
- level1: Vòng đời tài nguyên
  level2:
  - Xác định quyền sở hữu tài nguyên bằng resource tracking
  - So sánh tracking bằng annotation, label hoặc kết hợp
  - Tách installationID khi nhiều Argo CD instance cùng quản lý cluster
  - Nhận diện orphaned resources và tài nguyên dùng chung
  - Phân biệt pruning khi đồng bộ với xóa Application
  - Quản lý resources finalizer và cascading deletion
  - Lựa chọn xóa foreground, background hoặc giữ workload
  - Bảo vệ tài nguyên cần xác nhận hoặc được miễn pruning và deletion
  - Đánh giá namespace, PVC và dữ liệu bền vững trước thay đổi vòng đời
  - Bàn giao tài nguyên sang Application hoặc hệ thống quản lý khác
- level1: AppProject
  level2:
  - Vai trò của AppProject trong tổ chức và giới hạn Application
  - Giới hạn sourceRepos theo nguồn được tin cậy
  - Giới hạn destination theo cluster và namespace
  - Cho phép hoặc chặn loại tài nguyên cấp namespace và cấp cluster
  - Quản lý project-scoped repositories và clusters
  - Thiết kế project roles cho nhóm hoặc tài khoản tích hợp
  - Thiết lập sync windows với lịch, múi giờ và quyền đồng bộ thủ công
  - Rà soát quyền rộng của default project
  - Quản lý AppProject bằng Git và kiểm tra ảnh hưởng khi siết quyền
- level1: Xác thực và RBAC
  level2:
  - Phân biệt xác thực người dùng và phân quyền thao tác
  - Quản lý tài khoản cục bộ và token phục vụ tự động hóa
  - Tích hợp đăng nhập một lần qua OIDC hoặc Dex theo lựa chọn triển khai
  - Ánh xạ nhóm danh tính vào vai trò Argo CD
  - Viết policy RBAC theo resource, action và đối tượng đích
  - Phân biệt quyền xem, đồng bộ, cập nhật và xóa Application
  - Giới hạn quyền exec, logs và thao tác tài nguyên con theo nhu cầu
  - Phân biệt quyền API Argo CD với Kubernetes RBAC trên cluster đích
  - Kiểm tra policy hiệu lực và quyền mặc định của người đăng nhập
  - Luân chuyển token, thu hồi quyền và lưu bằng chứng truy cập
- level1: Phân tách nhóm
  level2:
  - Lựa chọn một Argo CD dùng chung hoặc nhiều instance theo ranh giới tin cậy
  - Thiết kế AppProject theo nhóm, môi trường và quyền sở hữu
  - Tách repository cấu hình nền tảng khỏi repository ứng dụng
  - Kiểm soát quyền sửa Application, AppProject và ApplicationSet trong Git
  - Đánh giá Applications in any namespace và sourceNamespaces được cho phép
  - Giới hạn thông tin xác thực repository hoặc cluster theo project
  - Ngăn leo thang quyền qua manifest có đặc quyền hoặc destination quản trị
  - Chuẩn hóa quy trình tự phục vụ với giới hạn và quyền phê duyệt rõ ràng
- level1: ApplicationSet
  level2:
  - Bài toán sinh nhiều Application từ một khai báo
  - Cấu trúc generators, template và templatePatch
  - Phân biệt ApplicationSet controller và application controller
  - Sử dụng Go Template và kiểm tra tham số bị thiếu
  - Đặt tên Application duy nhất và gắn nhãn quản trị
  - Tùy biến source, destination và project theo tham số được kiểm soát
  - Phân biệt chỉnh template với sửa trực tiếp Application được sinh
  - Kiểm tra tập Application dự kiến trước khi áp dụng thay đổi
  - Quản lý ApplicationSet bằng Git và xác định người sở hữu
- level1: Generators
  level2:
  - Sử dụng List generator cho tập tham số tường minh
  - Sử dụng Cluster generator với nhãn và bộ chọn cluster
  - Sử dụng Git directory generator theo cấu trúc thư mục
  - Sử dụng Git file generator theo tệp dữ liệu cấu hình
  - Kết hợp nguồn tham số bằng Matrix generator
  - Ghi đè có khóa đối chiếu bằng Merge generator
  - Phát hiện repository bằng SCM Provider generator
  - Tạo môi trường xem trước bằng Pull Request generator
  - Nhận diện Cluster Decision Resource và Plugin generator
  - Đánh giá OCI generator theo hỗ trợ của phiên bản
  - Lọc kết quả bằng selector và kiểm soát tổ hợp sinh quá nhiều ứng dụng
- level1: Vận hành ApplicationSet
  level2:
  - Điều chỉnh polling, requeue và webhook của từng nguồn generator
  - Kiểm soát tạo, cập nhật và xóa Application bằng applicationsSync
  - Hiểu ownerReferences và chuỗi xóa khi ApplicationSet biến mất
  - Sử dụng preserveResourcesOnDeletion theo mục đích giữ workload
  - Quản lý trường được bỏ qua và giới hạn sửa Application được sinh
  - Đánh giá Progressive Syncs và điều kiện bật theo phiên bản
  - Phân nhóm RollingSync theo nhãn và giới hạn maxUpdate
  - Xử lý nguồn generator lỗi hoặc đột ngột trả tập kết quả rỗng
  - Bảo vệ quyền project và thông tin xác thực trước dữ liệu từ pull request
- level1: Nhiều cluster
  level2:
  - Đăng ký cluster qua CLI hoặc Secret theo khai báo
  - Lựa chọn cơ chế xác thực cluster và quyền của service account
  - Kiểm tra đường mạng và chứng thư tới Kubernetes API
  - Quản lý tên, nhãn và danh mục cluster
  - Triển khai cùng ứng dụng tới nhiều cluster bằng ApplicationSet
  - Ghim nguồn và cấu hình khác biệt theo cluster
  - Phân biệt quyền quản trị cluster với phạm vi namespace được giao
  - Luân chuyển thông tin xác thực và xử lý cluster mất kết nối
  - Ngừng quản lý một cluster với đánh giá ảnh hưởng đến Application liên quan
- level1: Cấu trúc GitOps
  level2:
  - Lựa chọn kho mã ứng dụng và kho cấu hình triển khai theo trách nhiệm
  - Tổ chức đường dẫn theo ứng dụng, môi trường hoặc cluster
  - Quản lý Application và AppProject bằng cấu hình khai báo
  - Áp dụng App of Apps cho phạm vi bootstrap được quản trị
  - Phân biệt App of Apps và ApplicationSet theo nguồn sinh ứng dụng
  - Bootstrap Argo CD tự quản lý với đường phục hồi độc lập
  - Giới hạn phạm vi thay đổi và tránh một Application chứa tài nguyên không liên quan
  - Thiết lập quy ước tên, nhãn, người sở hữu và hướng dẫn vận hành
  - Ghim chart, image và nguồn phụ thuộc để tái lập phiên bản triển khai
- level1: Chuyển môi trường
  level2:
  - Tổ chức cấu hình development, staging và production
  - Chuyển cùng một artifact đã kiểm chứng giữa các môi trường
  - Cập nhật image digest hoặc phiên bản bằng pull request
  - Áp dụng cổng kiểm tra và quyền phê duyệt trước production
  - Phân biệt triển khai đồng loạt, RollingSync và điều phối phát hành ngoài Argo CD
  - Phối hợp Argo Rollouts cho canary hoặc blue-green khi có yêu cầu
  - Quay lui lâu dài bằng Git revert và kiểm tra cấu hình hiệu lực
  - Xử lý auto-sync trước rollback từ lịch sử Argo CD và đồng bộ lại nguồn chuẩn
- level1: Tích hợp CI
  level2:
  - Thiết kế luồng build, kiểm thử, xuất bản image và cập nhật kho GitOps
  - Tách quyền ghi repository cấu hình khỏi quyền quản trị cluster
  - Kiểm tra manifest được render trong pull request
  - Tạo commit hoặc pull request cập nhật phiên bản triển khai
  - Liên kết commit mã nguồn, image digest và commit cấu hình
  - Lựa chọn webhook hoặc polling để phát hiện thay đổi nguồn
  - Chờ kết quả Argo CD qua CLI hoặc API khi quy trình cần xác nhận
  - Xử lý chạy lại và cập nhật đồng thời mà không làm mất thay đổi cấu hình
- level1: Cập nhật image
  level2:
  - Vai trò và phạm vi riêng của Argo CD Image Updater
  - Kiểm tra tương thích và cách khai báo ImageUpdater theo phiên bản
  - Chọn ứng dụng, image và ánh xạ tham số Helm hoặc Kustomize
  - Giới hạn phiên bản bằng chiến lược cập nhật và bộ lọc tag
  - Quản lý xác thực registry và giới hạn tần suất truy vấn
  - Phân biệt ghi thay đổi vào Application và ghi lại vào Git
  - Kiểm soát nhánh, quyền ghi và quy trình pull request khi được hỗ trợ
  - Phối hợp chính sách cập nhật image với đóng băng phát hành và quay lui
- level1: Bí mật và bảo mật
  level2:
  - Phân biệt GitOps manifest với nơi lưu giữ giá trị bí mật
  - Lựa chọn External Secrets, Sealed Secrets hoặc giải mã có kiểm soát
  - Đánh giá SOPS hoặc Vault qua cơ chế tích hợp phù hợp
  - Kiểm soát bí mật trong manifest được render, cache và đầu ra chẩn đoán
  - Bảo vệ Secret chứa thông tin repository, registry và cluster
  - Áp dụng NetworkPolicy, TLS và giới hạn truy cập các thành phần
  - Giảm quyền repo-server, plugin sidecar và application controller
  - Xác minh chữ ký nguồn Git theo phạm vi tính năng hỗ trợ
  - Kiểm soát nguồn image, gói manifest và phụ thuộc được đưa vào triển khai
  - Theo dõi cảnh báo bảo mật, luân chuyển thông tin xác thực và ứng phó sự cố
- level1: Tiện ích mở rộng
  level2:
  - Xác định nhu cầu Config Management Plugin ngoài công cụ tích hợp sẵn
  - Thiết kế plugin sidecar với discovery, init và generate
  - Đóng gói công cụ sinh manifest và ghim phiên bản
  - Truyền tham số hoặc biến môi trường với ranh giới tin cậy rõ ràng
  - Quản lý thông tin xác thực và ngăn plugin truy cập repository ngoài phạm vi
  - Viết health customization hoặc resource action theo nhu cầu vận hành
  - Đánh giá extension giao diện và API theo phiên bản triển khai
  - Kiểm thử, cô lập lỗi và quản lý vòng đời phần mở rộng
- level1: Giám sát
  level2:
  - Theo dõi sync status, health và conditions của Application
  - Thu thập metrics từ controller, repo-server và API server
  - Xây dashboard về độ trễ đối soát, lỗi render và lỗi đồng bộ
  - Theo dõi hàng đợi, Git request và tải Kubernetes API
  - Thu thập log có cấu trúc và liên kết theo Application hoặc thao tác
  - Tra cứu Kubernetes events và tài nguyên gây tắc triển khai
  - Thiết lập cảnh báo OutOfSync kéo dài, Degraded và kết nối cluster lỗi
  - Theo dõi phiên bản triển khai và lịch sử thao tác có thể kiểm toán
  - Phân biệt khả năng quan sát Argo CD với chỉ số phục vụ của ứng dụng
- level1: Thông báo
  level2:
  - Vai trò của notifications controller trong phản hồi trạng thái triển khai
  - Cấu hình service, template, trigger và subscription
  - Gửi thông báo tới Slack, email hoặc webhook theo adapter được chọn
  - Chọn sự kiện theo sync, health và điều kiện tùy chỉnh
  - Giới hạn thông báo lặp bằng điều kiện và định danh phù hợp
  - Quản lý bí mật của kênh thông báo bằng Secret
  - Kiểm thử template và chẩn đoán lỗi gửi
  - Thiết kế thông báo hữu ích với liên kết ứng dụng, revision và nguyên nhân lỗi
- level1: Sẵn sàng và hiệu năng
  level2:
  - Phân tích ảnh hưởng khi API server, controller hoặc repo-server gián đoạn
  - Phân biệt sự cố bộ điều khiển với trạng thái workload đã được triển khai
  - Lựa chọn kiến trúc HA và cấu hình thành phần phụ thuộc
  - Phân bổ CPU, bộ nhớ và tài nguyên lưu trữ cho repo-server
  - Điều chỉnh số worker đối chiếu, worker thao tác và giới hạn song song
  - Đánh giá phân mảnh cluster cho application controller theo phiên bản
  - Tối ưu cache, chu kỳ reconciliation và thời gian sinh manifest
  - Giảm phạm vi tác động khi nhiều ứng dụng dùng chung monorepo
  - Kiểm soát tải Git, registry và Kubernetes API
  - Đo hiệu quả sau tối ưu bằng thời gian hội tụ và tỷ lệ lỗi
- level1: Sao lưu và nâng cấp
  level2:
  - Kiểm kê Application, AppProject, ApplicationSet và cấu hình hệ thống
  - Phân biệt dữ liệu tái tạo từ Git với Secret hoặc cấu hình cần sao lưu
  - Sử dụng cơ chế export hoặc import theo tài liệu phiên bản
  - Đồng bộ kế hoạch sao lưu Argo CD với sao lưu workload và dữ liệu ứng dụng
  - Diễn tập phục hồi trong cluster riêng và xác minh quyền truy cập
  - Kiểm soát auto-sync, pruning và finalizer khi phục hồi
  - Đọc release notes và hướng dẫn nâng cấp giữa các phiên bản
  - Kiểm tra tương thích CRD, CLI, Helm chart và plugin
  - Nâng cấp thử nghiệm, xác minh rồi triển khai theo phạm vi tăng dần
  - Chuẩn bị đường quay lui cấu hình cài đặt và bằng chứng xác minh sau nâng cấp
- level1: Kiểm thử
  level2:
  - Kiểm tra YAML, CRD schema và tính hợp lệ của Application
  - Render Helm hoặc Kustomize với cùng phiên bản và tham số như repo-server
  - Kiểm tra nguồn, destination và quyền AppProject trước triển khai
  - Kiểm tra policy Kubernetes và yêu cầu bảo mật trong CI
  - Đánh giá manifest diff trên cluster thử nghiệm
  - Kiểm thử hooks, health customization và điều kiện chờ
  - Kiểm tra tập ApplicationSet sinh ra và tình huống nguồn trả rỗng
  - Diễn tập pruning, xóa Application và phục hồi trên tài nguyên dùng thử
  - Xác minh hành vi drift, selfHeal và quay lui bằng bằng chứng quan sát được
- level1: Xử lý sự cố
  level2:
  - Chẩn đoán không đăng nhập được hoặc CLI lỗi gRPC qua ingress
  - Xử lý Git authentication, SSH known hosts và CA không được tin cậy
  - Chẩn đoán manifest generation error ở Helm, Kustomize hoặc plugin
  - Xử lý Application không có quyền source hoặc destination
  - Điều tra OutOfSync kéo dài do webhook, HPA hoặc giá trị render biến động
  - Chẩn đoán sync lỗi bởi CRD thiếu, schema hoặc quyền Kubernetes
  - Xử lý Progressing hoặc Degraded do tài nguyên đích không sẵn sàng
  - Điều tra hook treo, wave bị chặn và thao tác sync chạy quá lâu
  - Xử lý ApplicationSet không sinh ứng dụng hoặc sinh sai tham số
  - Chẩn đoán cluster unreachable, thông tin xác thực hết hạn và dữ liệu cache cũ
  - Điều tra xóa bị kẹt bởi finalizer hoặc tài nguyên mất quyền truy cập
  - Phục hồi sau đồng bộ sai revision và ngăn nguồn cấu hình tiếp tục áp dụng lỗi
- level1: Thực hành
  level2:
  - Dựng lab Argo CD và triển khai ứng dụng Java từ Git
  - Đóng gói ứng dụng bằng Helm hoặc Kustomize và kiểm tra manifest
  - Tạo sai lệch thủ công rồi kiểm chứng diff và selfHeal
  - Thiết lập AppProject cùng vai trò chỉ xem hoặc được đồng bộ
  - Triển khai thay đổi có hooks, waves và kiểm tra sức khỏe
  - Sinh ứng dụng nhiều môi trường bằng ApplicationSet
  - Tạo môi trường xem trước pull request với quyền và cơ chế dọn dẹp phù hợp
  - Tích hợp CI cập nhật image digest qua kho cấu hình
  - Diễn tập pruning, quay lui và giữ dữ liệu bền vững
  - Sao lưu, phục hồi và lập bằng chứng kiểm tra toàn luồng GitOps
