references:
  - title: "DORA – Continuous Integration"
    url: "https://dora.dev/capabilities/continuous-integration/"
    description: "Thực hành CI, tích hợp thường xuyên và phản hồi nhanh nhờ kiểm thử tự động."
  - title: "GitHub Docs – Understanding GitHub Actions"
    url: "https://docs.github.com/en/actions/get-started/understand-github-actions"
    description: "Sự kiện kích hoạt, YAML workflow, jobs, steps, runners và dependency."
  - title: "GitLab Docs – CI/CD Pipelines"
    url: "https://docs.gitlab.com/ci/pipelines/"
    description: "Cấu trúc jobs, stages, runners, triggers và pipeline as code."
  - title: "Jenkins – Pipeline"
    url: "https://www.jenkins.io/doc/book/pipeline/"
    description: "Jenkinsfile, agent, stages, steps và triển khai pipeline."
  - title: "GitLab Docs – Job Artifacts"
    url: "https://docs.gitlab.com/ci/jobs/job_artifacts/"
    description: "Phân biệt artifacts, cache và package registry; trao đổi kết quả giữa các jobs."
  - title: "SLSA – Build Provenance"
    url: "https://slsa.dev/spec/v1.2/build-provenance"
    description: "Thông tin truy xuất nơi, thời gian và cách một software artifact được build."
  - title: "GitHub Docs – Security for GitHub Actions"
    url: "https://docs.github.com/en/actions/how-tos/secure-your-work"
    description: "Quản lý quyền và secret, khóa action dependency và bảo vệ chuỗi cung ứng."
  - title: "GitHub Docs – Deployment Environments"
    url: "https://docs.github.com/en/actions/concepts/workflows-and-actions/deployment-environments"
    description: "Môi trường staging/production, approval, bảo vệ branch và environment secrets."
  - title: "Google Cloud Deploy – Terminology"
    url: "https://docs.cloud.google.com/deploy/docs/terminology"
    description: "Định nghĩa continuous delivery, continuous deployment, release và rollout."
  - title: "DORA – Software Delivery Performance Metrics"
    url: "https://dora.dev/guides/dora-metrics/"
    description: "Năm chỉ số đo throughput, recovery và instability trong delivery."