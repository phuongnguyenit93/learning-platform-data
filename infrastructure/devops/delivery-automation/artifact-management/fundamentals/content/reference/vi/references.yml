references:
  - title: "Apache Maven — Introduction to Repositories"
    url: "https://maven.apache.org/guides/introduction/introduction-to-repositories.html"
    description: "Khái niệm artifact repository, local/remote, snapshots, cache và kho nội bộ để publish/consume."
  - title: "OCI — Distribution Specification"
    url: "https://github.com/opencontainers/distribution-spec"
    description: "Chuẩn phân phối container image/artifact; manifest, blob, tag, digest và thao tác push/pull."
  - title: "Sonatype Nexus Repository — Staging"
    url: "https://help.sonatype.com/en/staging.html"
    description: "Ví dụ luồng build, kiểm thử, staging và promotion; lưu ý tính năng tùy gói Nexus."
  - title: "GitLab — Supported Package Registry Functionality"
    url: "https://docs.gitlab.com/user/packages/package_registry/supported_functionality/"
    description: "Các loại package, khả năng publish/pull, xác thực và giới hạn theo package manager."
  - title: "SLSA v1.1 — Build Provenance"
    url: "https://slsa.dev/spec/v1.1/provenance"
    description: "Mô tả chứng thực nguồn gốc build, nền tảng, input, dependencies và artifact đầu ra."
  - title: "Sigstore — Cosign Quickstart"
    url: "https://docs.sigstore.dev/quickstart/quickstart-cosign/"
    description: "Ký và xác minh artifact/image cùng metadata attestations trong chuỗi cung ứng phần mềm."
  - title: "GitHub — Using Artifact Attestations"
    url: "https://docs.github.com/en/actions/how-tos/secure-your-work/use-artifact-attestations/use-artifact-attestations"
    description: "Sinh và kiểm tra attestations cho binary, image và SBOM trong workflow phát hành."