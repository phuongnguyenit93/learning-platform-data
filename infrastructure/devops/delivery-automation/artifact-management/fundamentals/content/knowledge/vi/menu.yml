      - "Cấu thành định danh: namespace, tên, phiên bản, loại và nền tảng đích"
      - "Tọa độ Maven: groupId, artifactId, version, packaging và classifier"
      - "Định danh package theo tên gói, phạm vi sở hữu và phiên bản"
      - "Định danh container image bằng registry, repository, tag và digest"
      - "Phân biệt tên dễ đọc với định danh theo nội dung bằng hàm băm"
      - "Nhận diện biến thể theo hệ điều hành, kiến trúc CPU và cấu hình build"
      - "Quy ước đặt tên và namespace để tránh xung đột giữa nhóm và dự án"
      - "Ánh xạ định danh artifact tới commit, build và bản phát hành tương ứng"
  - level1: "Phiên bản bất biến"
    level2:
      - "Mục đích của phiên bản và cách diễn đạt mức độ thay đổi với Semantic Versioning"
      - "Phân biệt phiên bản phát triển, prerelease, release candidate và release chính thức"
      - "Đặc điểm của snapshot và rủi ro khi dùng phiên bản có thể thay đổi"
      - "Vì sao cùng một phiên bản phát hành phải luôn trỏ tới cùng nội dung"
      - "Phân biệt phiên bản, tag, build number, commit SHA và digest"
      - "Tác động của nhãn latest và các tham chiếu động tới khả năng triển khai lặp lại"
      - "Chặn ghi đè và xử lý khi cần sửa một artifact đã công bố"
      - "Chọn chiến lược phiên bản cho nhánh phát triển, bản vá và nhiều dòng phát hành"
  - level1: "Repository và registry"
    level2:
      - "Vai trò của artifact repository và package hoặc container registry"
      - "Phân biệt kho hosted, proxy và nhóm kho hoặc virtual repository"
      - "Kho công khai, kho riêng và tiêu chí lựa chọn theo nhu cầu sử dụng"
      - "Tổ chức kho cho dependency bên ngoài, artifact nội bộ và bản phát hành"
      - "Tách snapshot, release và vùng cách ly theo chính sách của nhóm"
      - "Các thành phần cơ bản: endpoint, namespace, metadata, blob và chỉ mục"
      - "Lựa chọn kho theo định dạng hỗ trợ, quyền truy cập và khả năng tích hợp"
      - "Phân biệt kho artifact với Git, object storage và bộ nhớ đệm của CI"
  - level1: "Phụ thuộc và phân giải"
    level2:
      - "Dependency trực tiếp, dependency bắc cầu và đồ thị phụ thuộc"
      - "Cách công cụ build tìm phiên bản và tải artifact từ các kho đã cấu hình"
      - "Thứ tự ưu tiên repository và nguy cơ lấy nhầm package trùng tên"
      - "Phiên bản cố định, khoảng phiên bản và tác động của cập nhật tự động"
      - "Lockfile, dependency locking và khả năng tái lập tập dependency"
      - "Local cache, proxy cache và khác biệt giữa cache với kho lưu trữ chính"
      - "Phân biệt dependency dùng khi build, kiểm thử và chạy ứng dụng"
      - "Kiểm soát nguồn dependency và cập nhật phụ thuộc qua quy trình có kiểm chứng"
  - level1: "Build tái lập"
    level2:
      - "Phân biệt build thành công, build lặp lại được và build tái lập theo byte"
      - "Cố định mã nguồn, dependency, toolchain và môi trường build"
      - "Ảnh hưởng của timestamp, thứ tự tệp, locale và đường dẫn tuyệt đối"
      - "Quản lý cấu hình và đầu vào build để tránh thay đổi nội dung ngoài dự kiến"
      - "Ghi nhận phiên bản JDK, công cụ đóng gói và base image đã sử dụng"
      - "So sánh checksum giữa các lần build và tìm nguồn gây khác biệt"
      - "Phân biệt môi trường build được kiểm soát với bằng chứng nguồn gốc đáng tin cậy"
      - "Nguyên tắc build một lần và dùng lại đúng artifact trong các bước tiếp theo"
  - level1: "Metadata artifact"
    level2:
      - "Các trường metadata tối thiểu để tìm kiếm, sử dụng và kiểm toán artifact"
      - "Ghi nhận commit, nhánh, build ID, thời điểm tạo và danh tính hệ thống build"
      - "Mô tả loại artifact, runtime, hệ điều hành và kiến trúc được hỗ trợ"
      - "Liên kết artifact với báo cáo kiểm thử, SBOM, chữ ký và provenance"
      - "Phân biệt metadata nằm trong artifact với thuộc tính lưu tại repository"
      - "Thiết kế nhãn sở hữu, sản phẩm và môi trường phục vụ tra cứu"
      - "Tách metadata định danh bất biến khỏi trạng thái phê duyệt có thể cập nhật"
      - "Bảo toàn metadata khi sao chép, promotion và xuất nhập artifact"
  - level1: "Lưu trữ artifact"
    level2:
      - "Phân biệt lưu theo đường dẫn phiên bản và lưu theo địa chỉ nội dung"
      - "Quan hệ giữa manifest, blob và metadata trong kho artifact"
      - "Dung lượng artifact, trùng lặp dữ liệu và cơ chế chia sẻ blob"
      - "Lựa chọn nơi lưu theo yêu cầu độ bền, hiệu năng và khả năng phục hồi"
      - "Giới hạn kích thước, hạn ngạch dung lượng và kiểm soát tốc độ tăng trưởng"
      - "Bảo vệ dữ liệu lưu trữ và quản lý quyền truy cập lớp lưu trữ bên dưới"
      - "Lưu artifact cùng checksum và bằng chứng kiểm chứng theo định danh rõ ràng"
      - "Giữ nhất quán giữa dữ liệu artifact, metadata và chỉ mục tìm kiếm"
  - level1: "Công bố artifact"
    level2:
      - "Chuẩn bị nội dung, tọa độ, phiên bản và metadata trước khi upload"
      - "Kiểm thử và kiểm tra điều kiện bắt buộc trước khi cho phép công bố"
      - "Phân biệt upload tệp, publish package và push container image"
      - "Dùng vùng staging để kiểm tra đầy đủ trước khi cho phép tiêu thụ"
      - "Công bố đồng bộ các thành phần cần thiết để tránh bản phát hành thiếu tệp"
      - "Xử lý retry, upload gián đoạn và hai pipeline cùng công bố một phiên bản"
      - "Xác nhận artifact đã công bố bằng cách đọc lại metadata và digest từ kho"
      - "Xử lý publish thất bại, hủy bản ứng viên và phát hành phiên bản thay thế"
  - level1: "Phân phối artifact"
    level2:
      - "Cấu hình client tải artifact qua endpoint và cơ chế xác thực phù hợp"
      - "Chọn artifact theo phiên bản cố định, tọa độ đầy đủ hoặc digest"
      - "Kiểm tra tính đầy đủ và toàn vẹn sau khi tải trước khi đưa vào sử dụng"
      - "Proxy, mirror và cache trong việc giảm độ trễ và phụ thuộc mạng ngoài"
      - "Cache hit, cache miss, thời hạn cache và rủi ro dữ liệu cũ"
      - "Sao chép giữa vùng hoặc kho và kiểm tra nội dung sau sao chép"
      - "Phân phối trong môi trường hạn chế kết nối hoặc cần hoạt động ngoại tuyến"
      - "Cân bằng băng thông, độ sẵn sàng và tính nhất quán khi nhiều nơi cùng tiêu thụ"
  - level1: "Tính toàn vẹn"
    level2:
      - "Checksum và digest giúp phát hiện nội dung thay đổi như thế nào"
      - "Sử dụng SHA-256 và phân biệt hàm băm với mã hóa hoặc chữ ký số"
      - "Tạo checksum cho artifact và so sánh với giá trị kỳ vọng khi tải về"
      - "Vì sao checksum cần đến từ nguồn đáng tin cậy để chống thay thế đồng thời"
      - "Phạm vi kiểm chứng: từng tệp, gói nén, manifest và các lớp container image"
      - "Phân biệt bảo vệ đường truyền bằng TLS với kiểm tra nội dung artifact"
      - "Dừng tiêu thụ, cách ly và điều tra khi checksum không khớp"
      - "Lưu kết quả kiểm chứng gắn với digest và lần chạy pipeline"
  - level1: "Chữ ký artifact"
    level2:
      - "Mục đích của chữ ký số và các câu hỏi về danh tính bên phát hành"
      - "Phân biệt xác minh chữ ký hợp lệ với quyết định tin cậy người ký"
      - "Quan hệ giữa khóa riêng, khóa công khai, chứng thư và chính sách tin cậy"
      - "Ký artifact hoặc digest và liên kết chữ ký với đúng nội dung cần bảo vệ"
      - "Tổng quan cách ký dùng khóa quản lý sẵn và cách ký dựa trên danh tính ngắn hạn"
      - "Kiểm tra danh tính, nguồn cấp chứng thư và điều kiện chấp nhận chữ ký"
      - "Quản lý vòng đời khóa, thay khóa và xử lý khi danh tính ký bị xâm phạm"
      - "Tích hợp xác minh chữ ký vào bước tải, promotion và triển khai"
  - level1: "Nguồn gốc artifact"
    level2:
      - "Provenance mô tả artifact được tạo từ đâu, bằng gì và qua quy trình nào"
      - "Liên kết digest đầu ra với mã nguồn, đầu vào build và danh tính builder"
      - "Phân biệt provenance, attestation, chữ ký, SBOM và báo cáo kiểm thử"
      - "Các trường bằng chứng cơ bản: subject, builder, invocation và materials"
      - "Khái niệm SLSA và vai trò của mức bảo đảm đối với chuỗi cung ứng phần mềm"
      - "Thu thập bằng chứng từ hệ thống CI và bảo vệ khỏi sửa đổi tùy ý"
      - "Xác minh attestation theo digest, danh tính phát hành và chính sách nguồn build"
      - "Giới hạn của provenance khi đầu vào, builder hoặc chính sách tin cậy bị sai"
  - level1: "SBOM"
    level2:
      - "SBOM là gì và giúp quản lý thành phần phần mềm trong artifact như thế nào"
      - "Thành phần trực tiếp, bắc cầu, thư viện nhúng và package hệ điều hành"
      - "Các thông tin cơ bản: tên, phiên bản, nhà cung cấp, giấy phép và quan hệ phụ thuộc"
      - "Nhận diện thành phần bằng package URL và các định danh phù hợp"
      - "Tổng quan hai định dạng SBOM phổ biến: SPDX và CycloneDX"
      - "Sinh SBOM từ dependency graph và quét nội dung đóng gói để nhận biết phần thiếu"
      - "Gắn SBOM với digest của artifact và lưu cùng bản phát hành"
      - "Dùng SBOM để tra cứu ảnh hưởng khi phát hiện lỗ hổng hoặc thay đổi chính sách"
  - level1: "Chính sách chấp nhận"
    level2:
      - "Xác định điều kiện chấp nhận artifact trước khi công bố, promotion và triển khai"
      - "Quét lỗ hổng dependency và container image bằng dữ liệu nhận diện thành phần"
      - "Đánh giá phát hiện theo mức độ nghiêm trọng, khả năng ảnh hưởng và ngữ cảnh sử dụng"
      - "Kiểm tra giấy phép, thành phần bị cấm và dependency không còn được hỗ trợ"
      - "Phân biệt bằng chứng đã quét với cam kết artifact không có lỗ hổng"
      - "Quét lại artifact bất biến khi cơ sở dữ liệu lỗ hổng hoặc chính sách thay đổi"
      - "Quản lý ngoại lệ có người chịu trách nhiệm, lý do và thời hạn rõ ràng"
      - "Cách ly hoặc thu hồi artifact và xác định các bản triển khai đang bị ảnh hưởng"
  - level1: "Kiểm soát truy cập"
    level2:
      - "Phân biệt quyền đọc, công bố, sửa metadata, promotion và xóa artifact"
      - "Áp dụng quyền tối thiểu theo namespace, repository và vai trò công việc"
      - "Tách danh tính người dùng, pipeline build và hệ thống triển khai"
      - "Sử dụng service account, token có phạm vi hẹp và thông tin xác thực ngắn hạn"
      - "Lưu bí mật trong hệ thống quản lý phù hợp và tránh đưa vào artifact hoặc log"
      - "Giới hạn quyền công bố từ nhánh, pull request và nguồn chạy CI chưa được tin cậy"
      - "Thu hồi thông tin xác thực, thay token và kiểm tra quyền khi có sự cố"
      - "Ghi nhật ký truy cập và truy vết các thao tác phát hành, ghi đè hoặc xóa"
  - level1: "Artifact trong CI/CD"
    level2:
      - "Thiết kế luồng build, test, package, publish, verify và deploy"
      - "Truyền định danh và digest giữa các job thay vì suy đoán artifact từ tên nhánh"
      - "Phân biệt build cache, artifact của job và artifact phát hành trong pipeline"
      - "Bảo đảm kiểm thử tích hợp và triển khai sử dụng đúng đầu ra đã đóng gói"
      - "Gắn báo cáo kiểm thử, kết quả quét và phê duyệt với cùng một digest"
      - "Tổ chức cổng kiểm soát tự động và xử lý khi thiếu bằng chứng bắt buộc"
      - "Xử lý chạy lại pipeline, các build đồng thời và lỗi sau khi publish thành công"
      - "Ghi nhận artifact thực tế đã triển khai để phục vụ kiểm toán và khôi phục"
  - level1: "Promotion artifact"
    level2:
      - "Promotion là gì và khác gì với build lại hoặc đổi nội dung artifact"
      - "Chuyển cùng artifact qua môi trường phát triển, kiểm thử, staging và production"
      - "Điều kiện promotion: kết quả kiểm thử, chữ ký, provenance, SBOM và chính sách"
      - "Promotion bằng sao chép, gắn nhãn hoặc đổi trạng thái và cách giữ nguyên digest"
      - "Tách cấu hình môi trường và bí mật triển khai khỏi artifact đã kiểm thử"
      - "Bảo toàn bằng chứng và xác minh định danh sau khi chuyển giữa các repository"
      - "Phân quyền phê duyệt, lưu lịch sử promotion và ngăn dùng nhầm artifact ứng viên"
      - "Rollback về artifact đã biết cùng kiểm tra tính tương thích dữ liệu và cấu hình"
  - level1: "Lưu giữ và dọn dẹp"
    level2:
      - "Phân biệt chính sách lưu giữ, chính sách xóa và nhu cầu lưu trữ dài hạn"
      - "Đặt thời gian lưu theo snapshot, bản ứng viên, release và artifact đang triển khai"
      - "Bảo vệ artifact phục vụ rollback, kiểm toán và các phiên bản vẫn được hỗ trợ"
      - "Xác định artifact còn tham chiếu trước khi xóa tag, manifest hoặc package"
      - "Phân biệt xóa tham chiếu với garbage collection giải phóng blob không còn được dùng"
      - "Lưu giữ đồng bộ SBOM, chữ ký, provenance và báo cáo đi kèm artifact"
      - "Chạy xem trước, rà soát danh sách xóa và ghi lại kết quả dọn dẹp"
      - "Xử lý artifact bị thu hồi và cân nhắc thời gian khôi phục trước khi xóa vĩnh viễn"
  - level1: "Vận hành kho artifact"
    level2:
      - "Theo dõi dung lượng, tốc độ tăng trưởng, lưu lượng tải và tỷ lệ lỗi"
      - "Theo dõi độ trễ publish, download và hiệu quả proxy cache"
      - "Cảnh báo khi gần hết dung lượng, xác thực lỗi hoặc artifact không truy cập được"
      - "Sao lưu blob, metadata, cấu hình và thông tin cần thiết để phục hồi"
      - "Xác định mục tiêu phục hồi và kiểm tra khôi phục bằng artifact có thể tải, kiểm chứng"
      - "Quản lý sao chép và khả năng hoạt động khi một kho hoặc một vùng gặp sự cố"
      - "Bảo trì, nâng cấp và di chuyển kho mà vẫn giữ định danh cùng bằng chứng artifact"
      - "Đánh giá chi phí lưu trữ, băng thông và hiệu quả chính sách lưu giữ"
  - level1: "JAR và package"
    level2:
      - "Phân biệt JAR thư viện, executable JAR, WAR và gói phân phối ứng dụng Java"
      - "Vai trò của POM, manifest và metadata khi công bố artifact Maven"
