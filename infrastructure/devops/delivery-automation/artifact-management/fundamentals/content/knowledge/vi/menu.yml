menu:
  - level1: "Nền tảng artifact"
    level2:
      - "Artifact là gì và vai trò của đầu ra build trong quá trình phân phối phần mềm"
      - "Phân biệt mã nguồn, artifact, dependency, bản phát hành và bản triển khai"
      - "Các dạng artifact: JAR, package thư viện, gói phân phối và container image"
      - "Artifact triển khai, artifact trung gian và tài liệu đi kèm bản build"
      - "Vì sao lưu artifact tập trung thay cho truyền tệp thủ công giữa các máy"
      - "Artifact management trong mối quan hệ với build automation và CI/CD"
      - "Các rủi ro cơ bản: dùng nhầm phiên bản, ghi đè nội dung và mất dấu nguồn gốc"
      - "Các nguyên tắc cốt lõi: định danh rõ ràng, bất biến, kiểm chứng và truy vết"
  - level1: "Vòng đời artifact"
    level2:
      - "Các giai đoạn từ tạo artifact đến công bố, sử dụng, lưu giữ và loại bỏ"
      - "Xác định bên tạo, bên sở hữu và bên tiêu thụ artifact"
      - "Phân biệt trạng thái đã build, đã kiểm thử, được phê duyệt và được phát hành"
      - "Phân biệt kho artifact dùng lâu dài với artifact tạm thời của một lần chạy CI"
      - "Liên kết một lần build với artifact, kết quả kiểm thử và bản triển khai"
      - "Quản lý artifact ứng viên, artifact bị cách ly và artifact đã thu hồi"
      - "Xác định nguồn sự thật khi cùng một artifact xuất hiện ở nhiều hệ thống"
      - "Xây dựng luồng quản lý artifact tối thiểu cho một nhóm phát triển"
  - level1: "Định danh artifact"
