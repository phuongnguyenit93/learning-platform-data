references:
  - title: "Semantic Versioning 2.0.0 — Specification"
    url: "https://semver.org/spec/v2.0.0.html"
    description: "Chuẩn MAJOR.MINOR.PATCH, pre-release, build metadata, thứ tự phiên bản và quy tắc không sửa bản đã phát hành."
  - title: "Conventional Commits 1.0.0 — Specification"
    url: "https://www.conventionalcommits.org/en/v1.0.0/"
    description: "Quy ước feat, fix, BREAKING CHANGE và liên hệ với Semantic Versioning."
  - title: "Keep a Changelog 1.1.0"
    url: "https://keepachangelog.com/en/1.1.0/"
    description: "Cấu trúc changelog và các nhóm thay đổi giúp người dùng nắm nội dung từng phiên bản."
  - title: "Git — git-tag Documentation"
    url: "https://git-scm.com/docs/git-tag"
    description: "Tạo, xem và xác minh Git tags, đặc biệt annotated/signed tags cho release."
  - title: "GitHub Docs — About Releases"
    url: "https://docs.github.com/en/repositories/releasing-projects-on-github/about-releases"
    description: "Liên hệ giữa Git tags, releases, release notes và tệp phát hành."
  - title: "Apache Maven — CI Friendly Versions"
    url: "https://maven.apache.org/guides/mini/guide-maven-ci-friendly.html"
    description: "Quản lý version Maven bằng revision/sha1/changelist và publish từ pipeline."
  - title: "Docker Docs — Immutable Tags"
    url: "https://docs.docker.com/docker-hub/repos/manage/hub-images/immutable-tags/"
    description: "Khác biệt tag có thể thay đổi và immutable tag để truy vết bản image đã phát hành."