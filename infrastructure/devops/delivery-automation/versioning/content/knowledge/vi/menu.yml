menu:
  - level1: "Tổng quan phiên bản"
    level2:
      - "Vai trò của phiên bản trong vòng đời phát triển, phân phối và vận hành phần mềm"
      - "Phân biệt phiên bản sản phẩm, API, mã nguồn, bản dựng, artifact và cấu hình triển khai"
      - "Phân biệt commit, Git tag, release, build và deployment"
      - "Quan hệ giữa số phiên bản, hợp đồng tương thích và kỳ vọng của người sử dụng"
      - "Thiết kế nguồn sự thật cho phiên bản và chủ thể có quyền công bố phiên bản"
      - "Tính bất biến của phiên bản đã phát hành và nguyên tắc không tái sử dụng định danh"
      - "Vòng đời từ thay đổi mã nguồn đến phiên bản đang chạy trên từng môi trường"
      - "Những rủi ro khi suy đoán tính tương thích hoặc nội dung bản dựng chỉ từ số phiên bản"
  - level1: "Quy ước định danh"
    level2:
      - "So sánh SemVer, CalVer, số bản dựng tăng dần và phiên bản theo commit"
      - "Lựa chọn quy ước cho thư viện, ứng dụng, dịch vụ và công cụ nội bộ"
      - "Thiết lập định dạng phiên bản chuẩn và quy tắc chuyển đổi giữa các hệ sinh thái"
      - "Phân biệt phiên bản SemVer với tiền tố v, tên nhánh và tên Git tag"
      - "Quy định tên sản phẩm, phạm vi package, kênh phân phối và định danh phiên bản"
      - "Thống nhất quy ước chữ hoa, chữ thường, ký tự hợp lệ và độ dài định danh"
      - "Xử lý phiên bản kế thừa và di chuyển sang quy ước mới mà vẫn giữ lịch sử"
      - "Ghi nhận chính sách versioning để nhóm phát triển và nhóm vận hành cùng áp dụng"
  - level1: "SemVer cốt lõi"
    level2:
      - "Cấu trúc MAJOR.MINOR.PATCH và điều kiện áp dụng Semantic Versioning"
      - "Xác định API công khai trước khi cam kết tính tương thích"
      - "Tăng MAJOR khi thay đổi phá vỡ hợp đồng đã công bố"
      - "Tăng MINOR khi bổ sung chức năng tương thích ngược và đánh dấu ngừng hỗ trợ"
      - "Tăng PATCH khi sửa lỗi tương thích ngược"
      - "Đặt lại MINOR và PATCH khi tăng thành phần phiên bản cao hơn"
      - "Đặc điểm phiên bản 0.y.z và quyết định công bố phiên bản ổn định 1.0.0"
      - "Quy tắc số nguyên không âm, dấu phân cách và cấm số 0 ở đầu thành phần số"
      - "So sánh thứ tự ưu tiên bằng giá trị số thay vì sắp xếp chuỗi"
      - "Giới hạn của SemVer khi đánh giá chất lượng, an toàn và mức độ phù hợp của bản phát hành"
  - level1: "Bản tiền phát hành"
    level2:
      - "Mục đích và cấu trúc định danh prerelease trong SemVer"
      - "Xây dựng quy ước alpha, beta và release candidate theo mức độ sẵn sàng"
      - "So sánh phiên bản prerelease với phiên bản ổn định có cùng MAJOR.MINOR.PATCH"
      - "So sánh từng định danh prerelease dạng số, dạng chữ và dãy định danh có độ dài khác nhau"
      - "Quy tắc ký tự hợp lệ và số 0 ở đầu định danh prerelease dạng số"
      - "Quản lý chuỗi bản thử nghiệm và chuyển từ release candidate sang bản ổn định"
      - "Phân phối prerelease theo kênh riêng và kiểm soát nhóm người dùng nhận bản thử nghiệm"
      - "Phân biệt prerelease hợp lệ theo SemVer với nhãn SNAPSHOT đặc thù của công cụ"
  - level1: "Build metadata"
    level2:
      - "Cấu trúc build metadata sau dấu cộng và tập ký tự được phép"
      - "Bổ sung commit SHA, mã pipeline và định danh bản dựng vào metadata"
      - "Quy tắc bỏ qua build metadata khi so sánh thứ tự ưu tiên SemVer"
      - "Phân biệt hai định danh bản dựng khác nhau nhưng có cùng thứ tự ưu tiên"
      - "Lựa chọn thông tin đặt trong phiên bản, manifest và hồ sơ phát hành"
      - "Giới hạn hỗ trợ build metadata trong package manager, registry và công cụ triển khai"
      - "Duy trì liên kết truy vết khi định dạng artifact không giữ nguyên chuỗi SemVer"
      - "Tránh đưa bí mật, dữ liệu cá nhân và thông tin không ổn định vào metadata"
  - level1: "Hợp đồng tương thích"
    level2:
      - "Phân biệt tương thích mã nguồn, nhị phân, giao thức, dữ liệu và hành vi"
      - "Xác định bên cung cấp, bên tiêu thụ và phạm vi hợp đồng cần giữ ổn định"
      - "Phân biệt tương thích ngược và tương thích xuôi trong quá trình nâng cấp"
      - "Đánh giá tác động của việc thêm, xóa, đổi tên và thay đổi ý nghĩa chức năng"
      - "Xử lý thay đổi mặc định, cấu hình, quyền truy cập và đặc tính vận hành"
      - "Thiết kế chính sách deprecation, thời gian chuyển đổi và thời điểm loại bỏ"
      - "Lập ma trận phiên bản được hỗ trợ giữa các thành phần phụ thuộc nhau"
      - "Quyết định mức tăng phiên bản khi một bản phát hành chứa nhiều loại thay đổi"
      - "Lập kế hoạch chuyển đổi cho thay đổi phá vỡ tương thích và thông báo tới bên sử dụng"
  - level1: "Phát hiện thay đổi"
    level2:
      - "Phân loại thay đổi tính năng, sửa lỗi, tài liệu, tái cấu trúc và bảo mật"
      - "Nhận diện breaking change từ hợp đồng thực tế thay vì chỉ dựa vào tên loại commit"
      - "Đánh giá tác động của thay đổi dependency trực tiếp và gián tiếp"
      - "Phát hiện thay đổi API bằng so sánh chữ ký, schema và kết quả kiểm thử hợp đồng"
      - "Đánh giá thay đổi hành vi mà công cụ so sánh API tĩnh không phát hiện được"
      - "Ghi nhận thay đổi trong pull request bằng nhãn, changeset hoặc bản ghi có cấu trúc"
      - "Quy định người duyệt và bằng chứng cho quyết định tăng phiên bản"
      - "Giải quyết trường hợp công cụ đề xuất phiên bản khác với đánh giá của nhóm"
  - level1: "API và dịch vụ"
    level2:
      - "Phân biệt phiên bản API công khai với phiên bản triển khai của dịch vụ"
      - "Quản lý thay đổi endpoint, tham số, mã trạng thái và cấu trúc phản hồi"
      - "Đánh giá tương thích khi thêm trường, mở rộng enum và thay đổi quy tắc kiểm tra dữ liệu"
      - "Lựa chọn phiên bản API qua đường dẫn, header hoặc cơ chế thương lượng phù hợp"
      - "Duy trì nhiều thế hệ API và xây dựng lộ trình ngừng hỗ trợ"
      - "Quản lý phiên bản SDK và thư viện máy khách tương ứng với API"
      - "Bảo đảm tương thích trong rolling deployment khi nhiều phiên bản dịch vụ cùng hoạt động"
      - "Kiểm thử hợp đồng giữa nhà cung cấp và bên tiêu thụ trước khi phát hành"
  - level1: "Dữ liệu và thông điệp"
    level2:
      - "Phân biệt phiên bản ứng dụng với phiên bản schema cơ sở dữ liệu và sự kiện"
      - "Phân loại thay đổi schema theo khả năng đọc và ghi của phiên bản cũ, mới"
      - "Áp dụng quy trình expand, migrate và contract khi thay đổi cấu trúc dữ liệu"
      - "Thiết kế phiên bản thông điệp, event và hợp đồng trao đổi bất đồng bộ"
      - "Kiểm tra tương thích backward, forward và full theo chính sách schema registry"
      - "Xử lý trường tùy chọn, giá trị mặc định và trường chưa biết trong từng định dạng dữ liệu"
      - "Điều phối thứ tự nâng cấp producer, consumer và dịch vụ sử dụng cơ sở dữ liệu"
      - "Đánh giá giới hạn rollback khi migration hoặc dữ liệu mới không còn tương thích"
  - level1: "Phiên bản dependency"
    level2:
      - "Phân biệt phiên bản chính xác, khoảng phiên bản và nhãn phiên bản động"
      - "Đọc ý nghĩa của khoảng phiên bản theo quy tắc riêng của từng package manager"
      - "Đối chiếu quy tắc caret, tilde, khoảng mở và cách xử lý prerelease trong npm"
      - "Quản lý dependency trong Maven và Gradle với release, SNAPSHOT và phiên bản động"
      - "Vai trò của lockfile, dependency locking và dependency verification"
      - "Sử dụng BOM, platform và dependency constraints để thống nhất phiên bản"
      - "Kiểm soát xung đột dependency bắc cầu, nâng cấp ngoài dự kiến và lệch phiên bản"
      - "Tự động đề xuất nâng cấp dependency và đánh giá mức độ tương thích trước khi hợp nhất"
      - "Kết hợp chính sách cập nhật bảo mật với kiểm thử hồi quy và khả năng tái lập bản dựng"
  - level1: "Git tag"
    level2:
      - "Phân biệt lightweight tag, annotated tag và signed tag"
      - "Thiết kế tên tag cho repository đơn, nhiều module và nhiều dòng phiên bản"
      - "Liên kết tag với commit phát hành và xác minh đối tượng commit thực tế của tag"
      - "Tạo, liệt kê, kiểm tra và phân phối tag tới remote theo chính sách dự án"
      - "Phân biệt tag Git, release trên nền tảng quản lý mã nguồn và artifact đã công bố"
      - "Bảo vệ namespace tag và kiểm soát quyền tạo, xóa hoặc thay đổi tag phát hành"
      - "Xác thực chữ ký tag và danh tính chủ thể thực hiện phát hành"
      - "Ngăn di chuyển tag đã phát hành và xử lý tag sai bằng quy trình có truy vết"
      - "Xử lý lịch sử Git nông, thiếu tag và mốc so sánh khi pipeline tính phiên bản"
  - level1: "Nhánh phát hành"
    level2:
      - "Lựa chọn trunk-based development, nhánh phát hành hoặc GitFlow theo nhu cầu bảo trì"
      - "Ánh xạ nhánh chính, nhánh thử nghiệm và nhánh bảo trì tới kênh phát hành"
      - "Quản lý đồng thời nhiều dòng MAJOR và nhiều phiên bản còn được hỗ trợ"
      - "Backport bản vá bằng cherry-pick và ghi nhận liên kết với thay đổi gốc"
      - "Xử lý hotfix khi nhánh phát triển đã có thay đổi cho phiên bản tiếp theo"
      - "Chốt phạm vi release candidate và kiểm soát thay đổi sau thời điểm đóng băng"
      - "Ngăn xung đột số phiên bản giữa các nhánh và các pipeline chạy đồng thời"
      - "Giữ nhất quán giữa lịch sử hợp nhất, changelog và tập commit của bản phát hành"
  - level1: "Phiên bản artifact"
    level2:
      - "Định danh artifact bằng tọa độ package, phiên bản và kho lưu trữ"
      - "Ánh xạ Git tag và commit sang phiên bản Maven, Gradle hoặc npm"
      - "Phân biệt phiên bản release, SNAPSHOT và bản dựng thử nghiệm trong kho artifact"
      - "Quản lý classifier, biến thể nền tảng và nhiều đầu ra của cùng một bản phát hành"
      - "Gắn phiên bản vào manifest, thông tin package và đầu ra hiển thị của ứng dụng"
      - "Xử lý khác biệt quy tắc chuẩn hóa và so sánh phiên bản giữa các hệ sinh thái"
      - "Xác định danh tính nội dung bằng checksum, hash hoặc digest bên cạnh số phiên bản"
      - "Bảo đảm artifact đã công bố không bị ghi đè dù quy trình build được chạy lại"
      - "Liên kết artifact, tài liệu, chữ ký và thông tin nguồn gốc trong hồ sơ phát hành"
  - level1: "Container image"
    level2:
      - "Phân biệt image tag có thể thay đổi và image digest định danh nội dung"
      - "Thiết kế tag SemVer, tag theo commit và nhãn kênh latest, stable hoặc canary"
      - "Xử lý ký tự build metadata không hợp lệ trong định dạng container tag"
      - "Gắn nhãn OCI cho phiên bản, revision, nguồn mã và thông tin bản dựng"
      - "Ghim triển khai bằng digest và xác minh image thực tế được runtime sử dụng"
      - "Quản lý image đa kiến trúc với digest của image index và manifest theo nền tảng"
      - "Áp dụng chính sách bất biến, lưu giữ và dọn dẹp image trong registry"
      - "Truy vết base image và xác định ảnh hưởng của việc rebuild cùng mã nguồn"
  - level1: "Changelog"
    level2:
      - "Phân biệt changelog, release notes, lịch sử commit và hướng dẫn nâng cấp"
      - "Tổ chức mục Unreleased, phiên bản, ngày phát hành và liên kết so sánh"
      - "Phân loại nội dung Added, Changed, Deprecated, Removed, Fixed và Security"
      - "Mô tả tác động đối với người sử dụng và hành động cần thực hiện khi nâng cấp"
      - "Ghi rõ breaking change, migration và thay đổi cấu hình bắt buộc"
      - "Liên kết thay đổi với issue, pull request, commit và artifact liên quan"
      - "Quản lý changelog cho prerelease, nhiều nhánh bảo trì và bản vá backport"
      - "Tự động tổng hợp bản nháp và duyệt nội dung trước khi công bố"
  - level1: "Chính sách phát hành"
    level2:
      - "Xác định lịch phát hành định kỳ, theo nhu cầu và phát hành khẩn cấp"
      - "Định nghĩa tiêu chí sẵn sàng và cổng kiểm soát cho từng kênh phát hành"
      - "Quy định chủ thể duyệt, chủ thể thực thi và trách nhiệm khi phát hành thất bại"
      - "Thiết lập cửa sổ hỗ trợ, dòng LTS và điều kiện kết thúc vòng đời phiên bản"
      - "Xây dựng quy trình công bố phiên bản mới, deprecation và thay đổi phá vỡ tương thích"
      - "Quy định xử lý bản phát hành lỗi, thu hồi và đánh dấu ngừng sử dụng"
      - "Đặt chính sách không tái sử dụng phiên bản đã công bố kể cả sau khi thu hồi"
      - "Lập hồ sơ phát hành gồm phạm vi thay đổi, bằng chứng kiểm thử và hướng dẫn phục hồi"
  - level1: "Tính phiên bản tự động"
    level2:
      - "Xây dựng thuật toán xác định phiên bản kế tiếp từ mốc phát hành gần nhất"
      - "Áp dụng Conventional Commits với phạm vi và dấu hiệu breaking change"
      - "Sử dụng changeset hoặc bản ghi thay đổi để tính phiên bản theo package"
      - "Xử lý squash merge, revert, cherry-pick và commit không ảnh hưởng phiên bản"
      - "Kết hợp quy tắc tự động với ngoại lệ được kiểm soát và lý do có thể kiểm toán"
      - "Sinh định danh prerelease nhất quán cho nhánh, pull request và release candidate"
      - "Xử lý repository chưa có tag, phiên bản khởi đầu và lịch sử không liên tục"
      - "Chống trùng phiên bản bằng khóa, kiểm tra trạng thái remote và cơ chế tuần tự hóa"
      - "Chạy thử để xem phiên bản, changelog và tập artifact dự kiến trước khi phát hành"
  - level1: "Pipeline phát hành"
    level2:
      - "Thiết kế chuỗi kiểm tra, tính phiên bản, build, kiểm thử, đóng gói và công bố"
      - "Phân biệt pipeline xác minh thay đổi với pipeline được quyền phát hành"
      - "Đối chiếu nguồn kích hoạt theo tag, nhánh, lịch hoặc thao tác thủ công"
      - "Chốt commit và phiên bản trước khi tạo artifact phát hành"
      - "Kiểm tra nhất quán giữa tag, file cấu hình build, manifest và tọa độ artifact"
      - "Tạo và xác minh checksum, chữ ký cùng bằng chứng nguồn gốc trước khi phân phối"
      - "Sắp xếp việc tạo tag, đẩy artifact và công bố release để có thể phục hồi khi lỗi từng phần"
      - "Thiết kế tính lặp an toàn, retry và tiếp tục pipeline mà không tạo phiên bản trùng"
      - "Ngăn vòng lặp pipeline do commit cập nhật phiên bản hoặc changelog tự động"
      - "Lưu kết quả và bằng chứng phát hành để điều tra, đối soát và truy vết sau này"
  - level1: "Công cụ tự động hóa"
    level2:
      - "So sánh mô hình phát hành bằng release pull request và phát hành trực tiếp sau hợp nhất"
      - "Áp dụng semantic-release để phân tích commit, tính phiên bản và công bố release"
      - "Áp dụng release-please để quản lý pull request cập nhật phiên bản và changelog"
      - "Áp dụng Changesets cho package, dependency nội bộ và repository nhiều gói"
      - "Tích hợp quy trình phiên bản vào Maven hoặc Gradle cho dự án Java"
      - "Kết nối công cụ phát hành với CI và registry bằng quyền truy cập tối thiểu"
      - "Kiểm soát phiên bản công cụ, plugin và cấu hình có ảnh hưởng tới kết quả phát hành"
      - "Lựa chọn công cụ theo mô hình repository, hệ sinh thái artifact và yêu cầu bảo trì"
  - level1: "Kho artifact"
    level2:
      - "Tổ chức kho release, kho snapshot, kho thử nghiệm và quyền truy cập tương ứng"
      - "Công bố package cùng metadata cần thiết cho việc phân giải dependency"
      - "Kiểm tra artifact tồn tại và xác minh nội dung trước khi quyết định bỏ qua hoặc retry"
      - "Ngăn ghi đè phiên bản và xác định chính sách đối với artifact đã công bố"
      - "Quản lý staging, kiểm duyệt và chuyển trạng thái artifact sang kênh phân phối chính thức"
      - "Xử lý cache, mirror và độ trễ đồng bộ khiến phiên bản mới chưa được tìm thấy"
      - "Thiết lập lưu giữ, lưu trữ dài hạn và khả năng phục hồi phiên bản cũ"
      - "Thu hồi hoặc đánh dấu bản lỗi theo khả năng của registry mà vẫn bảo toàn dấu vết kiểm toán"
  - level1: "Triển khai và promotion"
    level2:
      - "Tách quyết định phát hành artifact khỏi quyết định triển khai tới môi trường"
      - "Build một lần và promotion cùng nội dung artifact qua các môi trường"
      - "Ghi nhận ánh xạ phiên bản sản phẩm, digest artifact, môi trường và lần triển khai"
      - "Quản lý phiên bản manifest, Helm chart và cấu hình độc lập với phiên bản ứng dụng"
      - "Cập nhật phiên bản triển khai qua GitOps và giữ lịch sử thay đổi có thể đối chiếu"
      - "Triển khai canary, blue-green và rolling update với điều kiện tương thích phiên bản"
      - "Kiểm soát feature flag và cấu hình làm thay đổi hành vi của cùng một phiên bản"
      - "Xác nhận sau triển khai bằng phiên bản runtime, digest thực tế và kiểm thử smoke"
  - level1: "Truy vết phiên bản"
    level2:
      - "Thiết kế chuỗi liên kết từ yêu cầu thay đổi đến commit, tag, build, artifact và deployment"
      - "Tạo manifest phát hành hoặc release bill of materials cho các thành phần được triển khai"
      - "Cung cấp endpoint thông tin phiên bản và lệnh hiển thị phiên bản của ứng dụng"
      - "Gắn phiên bản dịch vụ, revision và môi trường vào log, trace và metadata giám sát"
      - "Quản lý nhãn phiên bản trong metrics để tránh cardinality tăng không kiểm soát"
      - "Đối chiếu số phiên bản công bố với digest và commit của tiến trình đang chạy"
      - "Phát hiện lệch phiên bản giữa pod, instance, vùng và môi trường"
      - "Truy ngược sự cố từ thời điểm triển khai tới thay đổi mã nguồn và dependency liên quan"
      - "Lưu lịch sử triển khai, người thực hiện và bằng chứng xác minh phục vụ kiểm toán"
  - level1: "Rollback và hotfix"
    level2:
      - "Phân biệt rollback triển khai, revert mã nguồn và phát hành phiên bản sửa lỗi"
      - "Đánh giá khả năng quay lui dựa trên tương thích dữ liệu, cấu hình và dependency"
      - "Chọn artifact đã xác minh bằng phiên bản cùng digest khi rollback"
      - "Tạo hotfix từ dòng phiên bản đang được hỗ trợ và xác định số phiên bản kế tiếp"
      - "Đưa bản vá trở lại nhánh phát triển và các nhánh bảo trì có liên quan"
      - "Xử lý phiên bản đã phát hành sai mà không sửa nội dung artifact hoặc di chuyển tag"
      - "Cập nhật changelog, trạng thái release và hướng dẫn cho người đang dùng bản lỗi"
      - "Diễn tập phục hồi và xác minh phiên bản thực tế sau rollback hoặc hotfix"
  - level1: "Monorepo và đa module"
    level2:
      - "Lựa chọn phiên bản đồng bộ hoặc phiên bản độc lập cho các module"
      - "Xác định phạm vi thay đổi và tập package chịu ảnh hưởng trong đồ thị dependency"
      - "Lan truyền thay đổi phiên bản tới dependency nội bộ và package phụ thuộc"
      - "Thiết kế namespace Git tag và changelog riêng cho từng thành phần"
      - "Điều phối thứ tự build, công bố package và phát hành bộ thành phần"
      - "Quản lý BOM và manifest phiên bản cho một bộ sản phẩm gồm nhiều artifact"
      - "Xử lý thay đổi dùng chung, package riêng tư và module không cần phát hành"
      - "Khôi phục quy trình khi chỉ một phần package của đợt phát hành được công bố thành công"
  - level1: "Bảo mật phát hành"
    level2:
      - "Phân quyền tạo tag, công bố artifact và phê duyệt phát hành theo vai trò"
      - "Quản lý token ngắn hạn, danh tính workload và bí mật dùng trong pipeline"
      - "Ký tag, artifact và image để xác minh nguồn phát hành"
      - "Liên kết SBOM với đúng phiên bản artifact và nội dung dependency thực tế"
      - "Gắn provenance và attestation với commit, công cụ cùng môi trường build"
      - "Kiểm tra hash, chữ ký và chính sách nguồn gốc khi nhận hoặc triển khai artifact"
      - "Ứng phó khi token, khóa ký hoặc tài khoản phát hành bị xâm phạm"
      - "Phát hành bản vá bảo mật và ghi nhận phiên bản bị ảnh hưởng mà vẫn tuân thủ chính sách công bố"
  - level1: "Kiểm thử versioning"
    level2:
      - "Kiểm tra cú pháp phiên bản, quy tắc đặt tag và ánh xạ định dạng artifact"
      - "Xây dựng bộ trường hợp so sánh SemVer gồm prerelease và build metadata"
      - "Kiểm tra quyết định tăng MAJOR, MINOR và PATCH với tập thay đổi đại diện"
      - "Kiểm thử tương thích API, nhị phân, schema và hành vi giữa các phiên bản"
      - "Kiểm tra nhất quán phiên bản trong package, manifest, changelog và release notes"
      - "Kiểm thử dry run, chạy đồng thời, retry và lỗi từng phần của pipeline phát hành"
      - "Đánh giá khả năng tái lập bản dựng và xác minh digest khi promotion"
      - "Kiểm tra truy vết và phục hồi từ phiên bản đang chạy tới artifact cùng commit nguồn"
  - level1: "Xử lý sự cố"
    level2:
      - "Chẩn đoán phiên bản không hợp lệ hoặc thứ tự sắp xếp khác mong đợi"
      - "Xử lý pipeline không tìm thấy tag vì checkout nông, thiếu quyền hoặc chưa fetch"
      - "Điều tra tag, changelog, package và artifact có phiên bản không nhất quán"
      - "Giải quyết xung đột phiên bản do nhiều pipeline hoặc nhiều nhánh cùng phát hành"
      - "Khắc phục prerelease bị đưa nhầm vào kênh ổn định hoặc dependency tự nhận bản thử nghiệm"
      - "Điều tra artifact cùng nhãn phiên bản nhưng khác nội dung hoặc digest"
      - "Xử lý package đã công bố nhưng release chưa hoàn tất và trường hợp ngược lại"
      - "Chẩn đoán môi trường vẫn chạy bản cũ do cache, image tag động hoặc cấu hình triển khai"
      - "Xác minh và phục hồi chuỗi truy vết khi thiếu manifest, metadata hoặc lịch sử triển khai"
  - level1: "Thực hành tổng hợp"
    level2:
      - "Thiết kế chính sách SemVer và hợp đồng tương thích cho một thư viện Java"
      - "Phân loại tập thay đổi và chọn phiên bản tiếp theo kèm lập luận"
      - "Tạo chuỗi alpha, beta, release candidate và bản ổn định cùng changelog tương ứng"
      - "Xây dựng pipeline phát hành artifact Java và container image từ một commit đã chốt"
      - "Tự động tính phiên bản, tạo release notes và công bố qua quy trình có kiểm soát"
      - "Promotion artifact qua các môi trường và chứng minh phiên bản thực tế đang chạy"
      - "Thực hiện hotfix, backport và rollback trong tình huống bản phát hành gặp lỗi"
      - "Thiết kế phát hành nhiều module kèm manifest, bằng chứng nguồn gốc và báo cáo truy vết"
