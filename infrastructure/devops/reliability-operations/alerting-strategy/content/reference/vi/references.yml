references:
  - title: "Google SRE - Monitoring Distributed Systems"
    url: "https://sre.google/sre-book/monitoring-distributed-systems/"
    description: "Golden signals, cảnh báo triệu chứng và phân biệt black-box với white-box."
  - title: "Google SRE Workbook - Alerting on SLOs"
    url: "https://sre.google/workbook/alerting-on-slos/"
    description: "Burn rate, error budget và multiwindow multi-burn-rate alerting."
  - title: "Google SRE Workbook - On-Call"
    url: "https://sre.google/workbook/on-call/"
    description: "Trực vận hành, cảnh báo có thể hành động và tác động của alert fatigue."
  - title: "Prometheus - Alerting Best Practices"
    url: "https://prometheus.io/docs/practices/alerting/"
    description: "Ưu tiên triệu chứng, alert đơn giản và metamonitoring."
  - title: "Prometheus - Alerting Rules"
    url: "https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/"
    description: "Viết expr, for, keep_firing_for, labels và annotations trong alert rule."
  - title: "Prometheus - Alertmanager"
    url: "https://prometheus.io/docs/alerting/latest/alertmanager/"
    description: "Grouping, deduplication, routing, inhibition và silences."
  - title: "Prometheus - Alertmanager Configuration"
    url: "https://prometheus.io/docs/alerting/latest/configuration/"
    description: "Cấu hình route tree, receivers, group_wait, group_interval và repeat_interval."
  - title: "Grafana - Alert Rules"
    url: "https://grafana.com/docs/grafana/latest/alerting/fundamentals/alert-rules/"
    description: "Query, alert conditions, evaluation interval và pending period."
  - title: "Grafana - Notifications"
    url: "https://grafana.com/docs/grafana/latest/alerting/fundamentals/notifications/"
    description: "Contact points, notification policies, grouping và mute timings."
  - title: "Grafana - TestData Alerting"
    url: "https://grafana.com/docs/grafana/latest/datasources/testdata/alerting/"
    description: "Thử quy tắc alert với dữ liệu giả lập, lỗi truy vấn và no-data."
  - title: "Grafana Cloud - Alerting Best Practices"
    url: "https://grafana.com/docs/grafana-cloud/observe-and-act/alert-and-measure-reliability/alerting/guides/best-practices/"
    description: "Thiết kế cảnh báo có owner, runbook và đánh giá lại sau sự cố."