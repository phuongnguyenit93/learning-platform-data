references:
  - title: "Atlassian — Create a Repository in Bitbucket Cloud"
    url: "https://support.atlassian.com/bitbucket-cloud/docs/create-a-repository-in-bitbucket-cloud/"
    description: "Tạo repository trong workspace và project, đặt quyền private, clone và bắt đầu cộng tác Git."
  - title: "Atlassian — Grant Repository Access to Users and Groups"
    url: "https://support.atlassian.com/bitbucket-cloud/docs/grant-repository-access-to-users-and-groups/"
    description: "Phân quyền Read, Write, Admin cho người dùng và nhóm theo nguyên tắc ít quyền."
  - title: "Atlassian — Configure SSH and Two-Step Verification"
    url: "https://support.atlassian.com/bitbucket-cloud/docs/configure-ssh-and-two-step-verification"
    description: "Thiết lập kết nối Git qua SSH, so sánh HTTPS và các lựa chọn xác thực."
  - title: "Atlassian — Use Pull Requests for Code Review"
    url: "https://support.atlassian.com/bitbucket-cloud/docs/use-pull-requests-for-code-review/"
    description: "Luồng tạo pull request, đề nghị reviewer, bình luận, phản hồi và phê duyệt mã nguồn."
  - title: "Atlassian — Merge a Pull Request"
    url: "https://support.atlassian.com/bitbucket-cloud/docs/merge-a-pull-request/"
    description: "Các chiến lược merge, xử lý merge conflict, build checks và bước hoàn tất pull request."
  - title: "Atlassian — Configure Project Branch Restrictions"
    url: "https://support.atlassian.com/bitbucket-cloud/docs/configure-a-projects-branch-restrictions"
    description: "Hạn chế push/merge theo nhánh và cấu hình merge checks; phân biệt cảnh báo với cưỡng chế Premium."
  - title: "Atlassian — Get Started with Bitbucket Pipelines"
    url: "https://support.atlassian.com/bitbucket-cloud/docs/get-started-with-bitbucket-pipelines"
    description: "Tạo CI/CD từ bitbucket-pipelines.yml, tự động build/test và theo dõi pipeline logs."
  - title: "Atlassian — Variables and Secrets"
    url: "https://support.atlassian.com/bitbucket-cloud/docs/variables-and-secrets/"
    description: "Cấu hình variables và secured secrets cho Pipelines mà không lưu credential trong repository."
  - title: "Atlassian — Manage Webhooks"
    url: "https://support.atlassian.com/bitbucket-cloud/docs/manage-webhooks"
    description: "Webhook cho push và pull request, tích hợp hệ thống ngoài và xác thực payload bằng HMAC signature."