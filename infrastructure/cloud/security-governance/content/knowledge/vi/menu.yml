      - "Bảo vệ registry và kiểm soát quyền kéo, đẩy image"
      - "Bảo vệ Kubernetes API, control plane và cấu hình xác thực"
      - "Thiết kế namespace, RBAC và ranh giới đa thuê bao"
      - "Giới hạn đặc quyền pod, capability và quyền truy cập host"
      - "Thực thi Pod Security và chính sách admission"
      - "Quản lý service account và danh tính workload trong cluster"
      - "Bảo vệ secret, cấu hình và volume của ứng dụng container"
      - "Kiểm soát lưu lượng pod bằng NetworkPolicy"
      - "Gia cố node và tổ chức cập nhật cluster an toàn"
      - "Phát hiện hành vi bất thường và thoát container khi chạy"
  - level1: "Serverless và dịch vụ được quản lý"
    level2:
      - "Xác định bề mặt tấn công của FaaS, PaaS và nền tảng được quản lý"
      - "Thiết kế quyền thực thi riêng cho từng function và tác vụ"
      - "Xác thực nguồn sự kiện và giới hạn đối tượng được kích hoạt"
      - "Kiểm tra dữ liệu đầu vào và xử lý sự kiện không tin cậy"
      - "Bảo vệ biến môi trường, thư mục tạm và kết nối của function"
      - "Kiểm soát phụ thuộc, runtime và phiên bản function"
      - "Bảo vệ workflow, lịch tác vụ và chuỗi xử lý sự kiện"
      - "Giới hạn đồng thời, thời gian chạy và lạm dụng tài nguyên serverless"
      - "Cấu hình triển khai, rollback và quyền quản trị nền tảng PaaS"
  - level1: "Bảo mật dịch vụ lưu trữ và dữ liệu"
