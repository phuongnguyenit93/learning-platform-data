      - "Kiểm tra nguồn image, chuỗi khởi động và tính toàn vẹn máy ảo"
      - "Quản trị máy ảo qua phiên được kiểm soát và truy cập có thời hạn"
      - "Giới hạn đặc quyền hệ điều hành và quyền của tiến trình dịch vụ"
      - "Bảo vệ metadata endpoint và thông tin xác thực gắn với máy ảo"
      - "Triển khai EDR và CWPP cho workload máy ảo"
      - "Bảo vệ ổ đĩa, snapshot và image chia sẻ"
      - "Cập nhật máy ảo bằng bản vá hoặc thay thế image bất biến"
      - "Duy trì kiểm soát bảo mật khi tự động co giãn workload"
  - level1: "Bảo mật container và Kubernetes"
    level2:
      - "Phân định trách nhiệm khi dùng Kubernetes tự quản lý hoặc được quản lý"
