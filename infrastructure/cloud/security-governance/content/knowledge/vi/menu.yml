      - "Ghi nhận, giám sát và điều tra phiên quản trị đặc quyền"
  - level1: "Danh tính máy và quản lý bí mật"
    level2:
      - "Phân biệt danh tính workload, service account và managed identity"
      - "Thiết kế vòng đời danh tính máy theo vòng đời workload"
      - "Ưu tiên thông tin xác thực ngắn hạn và loại bỏ khóa truy cập cố định"
      - "Thiết lập liên kết danh tính cho workload và tác vụ tự động"
      - "Kiểm soát quan hệ tin cậy khi truy cập chéo tài khoản"
      - "Kiểm kê và phân loại mật khẩu, khóa API, token và chứng thư"
      - "Tổ chức kho bí mật và chính sách phân quyền truy xuất"
      - "Cấp bí mật cho ứng dụng mà không nhúng vào mã hoặc image"
      - "Tự động xoay vòng, thu hồi và thay thế thông tin xác thực"
      - "Phát hiện bí mật bị lộ và xử lý phạm vi ảnh hưởng"
      - "Xác thực dịch vụ với dịch vụ bằng danh tính workload và mTLS"
  - level1: "Bảo vệ dữ liệu và quyền riêng tư"
