  - level1: "Chính sách và tiêu chuẩn kiểm soát"
    level2:
      - "Phân biệt chính sách, tiêu chuẩn, quy trình và hướng dẫn"
      - "Xây dựng danh mục kiểm soát bảo mật cho đám mây"
      - "Phân loại kiểm soát phòng ngừa, phát hiện và khắc phục"
      - "Phân định kiểm soát kế thừa, dùng chung và do khách hàng thực hiện"
      - "Thiết lập cấu hình bảo mật tối thiểu theo loại tài nguyên"
      - "Áp dụng yêu cầu kiểm soát theo mức nhạy cảm và môi trường"
      - "Chuyển yêu cầu chính sách thành rào chắn kỹ thuật"
      - "Quản lý ngoại lệ với chủ sở hữu, thời hạn và biện pháp bù đắp"
      - "Quản lý phiên bản, phổ biến và rà soát hiệu lực chính sách"
  - level1: "Tuân thủ và chủ quyền dữ liệu"
    level2:
      - "Xác định nghĩa vụ tuân thủ theo ngành, khu vực và loại dữ liệu"
      - "Ánh xạ kiểm soát với ISO 27001, ISO 27017 và ISO 27018"
      - "Sử dụng NIST CSF và NIST SP 800-53 để xây dựng chương trình kiểm soát"
      - "Đánh giá đám mây bằng CSA Cloud Controls Matrix và chương trình STAR"
      - "Lựa chọn CIS Benchmarks phù hợp với nền tảng và phiên bản"
      - "Xác định phạm vi dữ liệu thẻ và trách nhiệm PCI DSS trên đám mây"
      - "Chuyển yêu cầu bảo vệ dữ liệu cá nhân thành kiểm soát kỹ thuật"
      - "Phân biệt vị trí lưu trữ, chủ quyền và chuyển dữ liệu xuyên biên giới"
      - "Thiết kế lưu giữ, xóa dữ liệu và bảo toàn dữ liệu theo yêu cầu pháp lý"
      - "Đánh giá tác động quyền riêng tư trước khi triển khai dịch vụ"
      - "Duy trì ma trận nghĩa vụ, kiểm soát và bằng chứng tuân thủ"
  - level1: "Tổ chức tài nguyên và landing zone"
    level2:
      - "Thiết kế cấu trúc tổ chức, thư mục, tài khoản, subscription và project"
      - "Phân tách môi trường production, thử nghiệm, phát triển và sandbox"
      - "Bảo vệ tài khoản gốc và các tài khoản quản trị cấp tổ chức"
      - "Thiết kế landing zone với ranh giới mạng, danh tính và nhật ký"
      - "Tổ chức tài khoản hoặc project chuyên dụng cho bảo mật và vận hành"
      - "Kiểm soát vùng triển khai và danh mục dịch vụ được phép"
      - "Triển khai rào chắn kế thừa theo cây tổ chức"
      - "Chuẩn hóa tên tài nguyên, nhãn, chủ sở hữu và trung tâm chi phí"
      - "Tự động cấp phát tài khoản mới kèm cấu hình bảo mật tối thiểu"
      - "Thu hồi và đóng môi trường đám mây theo quy trình"
  - level1: "Kiểm kê tài sản và bề mặt tấn công"
    level2:
      - "Thu thập tài sản từ API quản trị và các nguồn kiểm kê"
      - "Xây dựng quan hệ giữa tài nguyên, danh tính, dữ liệu và dịch vụ"
      - "Xác minh chủ sở hữu và mức quan trọng của từng tài sản"
      - "Phát hiện tài nguyên không được quản lý và hoạt động shadow cloud"
      - "Kiểm kê tên miền, địa chỉ công khai và dịch vụ tiếp xúc Internet"
      - "Nhận diện kho dữ liệu công khai và điểm quản trị bị lộ"
      - "Theo dõi tài nguyên tạm thời, bị bỏ quên hoặc hết vòng đời"
      - "Đo độ bao phủ kiểm kê và đối soát tài sản giữa các nguồn"
  - level1: "Danh tính người dùng và liên kết"
    level2:
      - "Thiết kế nguồn danh tính và miền tin cậy cho người dùng đám mây"
      - "Tích hợp đăng nhập một lần bằng SAML và OpenID Connect"
      - "Áp dụng xác thực đa yếu tố và xác thực chống lừa đảo"
      - "Quản lý vòng đời nhân sự từ cấp quyền đến thu hồi quyền"
      - "Tự động đồng bộ danh tính và nhóm bằng SCIM"
      - "Kiểm soát điều kiện truy cập theo thiết bị, vị trí và mức rủi ro"
      - "Bảo vệ phiên đăng nhập, cookie, token và thời hạn phiên"
      - "Giới hạn truy cập của khách, đối tác và cộng tác viên"
      - "Bảo vệ đăng nhập qua console, CLI và công cụ quản trị"
      - "Kiểm tra thuộc tính, đối tượng nhận và điều kiện tin cậy khi liên kết"
  - level1: "Phân quyền và truy cập đặc quyền"
    level2:
      - "Thiết kế mô hình quyền với RBAC, ABAC và quyền theo tài nguyên"
      - "Đánh giá quyền hiệu lực từ chính sách cho phép và từ chối"
      - "Giới hạn quyền bằng ranh giới cấp tổ chức và phạm vi ủy quyền"
      - "Thiết kế quyền tối thiểu theo tác vụ và môi trường"
      - "Tách biệt nhiệm vụ quản trị, phát triển, triển khai và kiểm toán"
      - "Quản lý truy cập đặc quyền bằng PAM và phê duyệt có thời hạn"
      - "Áp dụng Just-in-Time và Just-Enough-Access"
      - "Thiết kế tài khoản khẩn cấp và kiểm tra quy trình break-glass"
      - "Sử dụng CIEM để phát hiện quyền dư thừa và đường leo thang đặc quyền"
