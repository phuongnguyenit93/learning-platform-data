      - "Gia cố cache và kho khóa giá trị được quản lý"
      - "Phân quyền producer, consumer và quản trị hàng đợi, topic, stream"
      - "Kiểm soát quyền truy vấn và chia sẻ trong data lake, data warehouse"
      - "Bảo vệ bản sao, bản xuất và quá trình nhập dữ liệu"
  - level1: "Bảo mật ứng dụng, API và phân phối biên"
