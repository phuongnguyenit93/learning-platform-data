      - "Phân vùng mạng theo mức tin cậy và mức quan trọng của workload"
      - "Kết hợp security group, network ACL và tường lửa đám mây"
      - "Giới hạn lưu lượng ngang giữa ứng dụng và tầng dữ liệu"
      - "Thiết kế kết nối hybrid qua VPN và đường truyền riêng"
      - "Kiểm soát peering, transit gateway và kết nối chéo tài khoản"
      - "Truy cập dịch vụ đám mây qua private endpoint"
      - "Bảo vệ DNS, phân giải tên nội bộ và miền quản trị"
      - "Kiểm soát lưu lượng đi ra qua NAT, proxy và bộ lọc đích"
      - "Giảm địa chỉ công khai và bảo vệ đường truy cập quản trị"
      - "Thiết kế khả năng chống DDoS ở lớp mạng"
      - "Xác minh đường đi và chẩn đoán vi phạm chính sách mạng"
  - level1: "Bảo mật máy ảo và hệ điều hành"
    level2:
