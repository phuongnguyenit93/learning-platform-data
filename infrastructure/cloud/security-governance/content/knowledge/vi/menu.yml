  - level1: "Quản lý rủi ro đám mây"
    level2:
      - "Xác định phạm vi, tài sản và bên liên quan khi đánh giá rủi ro"
      - "Phân tích tác động kinh doanh và mức độ quan trọng của dịch vụ"
