      - "Phân loại dữ liệu và lập bản đồ luồng dữ liệu đám mây"
      - "Khám phá dữ liệu nhạy cảm và đánh giá tư thế dữ liệu bằng DSPM"
      - "Áp dụng tối thiểu hóa dữ liệu và giới hạn mục đích sử dụng"
      - "Thiết kế kiểm soát truy cập dữ liệu theo độ nhạy cảm"
      - "Ngăn chia sẻ công khai và phân phối dữ liệu ngoài phạm vi cho phép"
      - "Cách ly dữ liệu giữa khách hàng, đơn vị và môi trường"
      - "Che dữ liệu, token hóa và giả danh hóa dữ liệu cá nhân"
      - "Bảo vệ dữ liệu dùng cho phát triển, kiểm thử và phân tích"
      - "Phát hiện và ngăn thất thoát dữ liệu bằng DLP"
      - "Thực thi lưu giữ, xóa an toàn và xử lý yêu cầu của chủ thể dữ liệu"
      - "Tích hợp quyền riêng tư ngay từ thiết kế dịch vụ đám mây"
  - level1: "Mã hóa và quản trị khóa"
    level2:
      - "Lựa chọn mã hóa khi lưu trữ, truyền tải và xử lý dữ liệu"
      - "Thiết kế TLS và xác minh chứng thư cho kết nối đám mây"
      - "Phân biệt khóa do nhà cung cấp quản lý và khóa do khách hàng quản lý"
      - "Lựa chọn KMS, HSM, BYOK và mô hình giữ khóa bên ngoài"
      - "Hiểu mã hóa phong bì và quan hệ giữa khóa dữ liệu với khóa chủ"
      - "Thiết kế chính sách sử dụng khóa và tách biệt người quản trị"
      - "Quản lý vòng đời khóa từ tạo mới đến hủy có kiểm soát"
      - "Quản lý PKI, cấp phát và gia hạn chứng thư tự động"
      - "Bảo đảm khả năng khôi phục dữ liệu khi khóa gặp sự cố"
      - "Giám sát thao tác mật mã và truy cập khóa bất thường"
      - "Đánh giá confidential computing cho dữ liệu đang được xử lý"
  - level1: "Mạng đám mây và kết nối"
