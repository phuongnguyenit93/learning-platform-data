references:
  - title: "NIST SP 800-145 — The Definition of Cloud Computing"
    url: "https://csrc.nist.gov/pubs/sp/800/145/final"
    description: "Định nghĩa chuẩn về năm đặc trưng, ba mô hình dịch vụ và bốn mô hình triển khai cloud computing."
  - title: "Microsoft Learn — Azure Fundamentals Study Guide"
    url: "https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-900"
    description: "Tổng quan kiến thức cloud, IaaS/PaaS/SaaS, region, zone, compute, storage, networking và quản trị."
  - title: "Microsoft Learn — Shared Responsibility in the Cloud"
    url: "https://learn.microsoft.com/en-ca/azure/security/fundamentals/shared-responsibility"
    description: "Phân định bảo mật, quản lý hệ điều hành, danh tính, dữ liệu theo mô hình on-premises/IaaS/PaaS/SaaS."
  - title: "AWS — Regions and Availability Zones"
    url: "https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions-availability-zones.html"
    description: "Khái niệm vị trí hạ tầng, region và availability zone cùng ảnh hưởng đến tính sẵn sàng của workload."
  - title: "Google Cloud — Cloud Overview"
    url: "https://docs.cloud.google.com/docs/overview"
    description: "Giới thiệu cấu trúc hạ tầng cloud, dịch vụ, region/zone, API và các cách quản lý tài nguyên."
  - title: "Google Cloud — Resource Hierarchy"
    url: "https://docs.cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy"
    description: "Cách tổ chức tài nguyên theo organization, folder và project để quản trị truy cập và vòng đời."
  - title: "Google Cloud — Monitoring Overview"
    url: "https://docs.cloud.google.com/monitoring/docs/monitoring-overview"
    description: "Các khái niệm về metrics, dashboard và alerting để theo dõi độ khỏe và hiệu năng workload."
  - title: "AWS Well-Architected — Expenditure and Usage Awareness"
    url: "https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/expenditure-and-usage-awareness.html"
    description: "Nguyên tắc quan sát mức sử dụng, phân bổ chi phí theo workload và phát hiện lãng phí tài nguyên."
