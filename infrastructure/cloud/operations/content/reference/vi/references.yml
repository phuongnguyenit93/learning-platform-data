references:
  - title: "AWS Well-Architected — Prepare"
    url: "https://docs.aws.amazon.com/wellarchitected/latest/operational-excellence-pillar/prepare.html"
    description: "Hướng dẫn operational readiness, infrastructure as code, thay đổi an toàn, runbooks và tự động hóa."
  - title: "AWS Well-Architected — Operate"
    url: "https://docs.aws.amazon.com/wellarchitected/latest/operational-excellence-pillar/operate.html"
    description: "Theo dõi sức khỏe workload, observability, xử lý sự kiện, escalation và cải tiến vận hành."
  - title: "Microsoft Cloud Adoption Framework — Manage Cloud Operations"
    url: "https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/manage/azure-management-guide/"
    description: "Mô hình trách nhiệm, on-call, quản lý sự cố, governance và rà soát hoạt động cloud thường kỳ."
  - title: "Google Cloud — Operational Excellence Pillar"
    url: "https://docs.cloud.google.com/architecture/framework/operational-excellence"
    description: "Hướng dẫn SLO, cloud operations, incident management, capacity planning và quản lý tài nguyên."
  - title: "Google SRE Workbook — Table of Contents"
    url: "https://sre.google/workbook/table-of-contents/"
    description: "Các chương thực hành về SLO, monitoring, alerting, on-call, incident response và postmortem."
  - title: "Microsoft Cloud Adoption Framework — Administer"
    url: "https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/manage/administer"
    description: "Các thực hành IAM, least privilege, cấu hình an toàn, compliance và quản trị workload cloud."
  - title: "AWS Well-Architected — Plan for Disaster Recovery"
    url: "https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/plan-for-disaster-recovery-dr.html"
    description: "Lập kế hoạch recovery theo RTO/RPO, backup, chiến lược phục hồi và thử nghiệm DR định kỳ."
  - title: "FinOps Foundation — FinOps Phases"
    url: "https://www.finops.org/framework/phases/"
    description: "Chu trình Inform, Optimize, Operate để phân tích, tối ưu chi phí và cải tiến việc sử dụng cloud."
