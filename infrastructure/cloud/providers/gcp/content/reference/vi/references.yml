references:
  - title: "Google Cloud — Resource Hierarchy"
    url: "https://docs.cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy"
    description: "Cấu trúc organization, folder, project và quan hệ giữa quyền truy cập, vòng đời tài nguyên và quản trị."
  - title: "Google Cloud — IAM Overview"
    url: "https://docs.cloud.google.com/iam/docs/overview"
    description: "Principal, role, permission, phân quyền tài nguyên và quản lý danh tính của người dùng hoặc workload."
  - title: "Google Cloud — VPC Overview"
    url: "https://docs.cloud.google.com/vpc/docs/overview"
    description: "Mạng VPC toàn cục, subnet theo region và các chức năng kết nối giữa workload Google Cloud."
  - title: "Google Cloud — Compute Engine Overview"
    url: "https://docs.cloud.google.com/compute/docs/overview"
    description: "Tổng quan dịch vụ VM, machine types, images, disks và quản lý phiên bản máy ảo."
  - title: "Google Cloud — Cloud Run Overview"
    url: "https://docs.cloud.google.com/run/docs/overview/what-is-cloud-run"
    description: "Mô hình serverless cho chạy container, services, jobs và khả năng tự mở rộng."
  - title: "Google Cloud — GKE Overview"
    url: "https://docs.cloud.google.com/kubernetes-engine/docs/concepts/kubernetes-engine-overview"
    description: "Kubernetes được quản lý với clusters, node pools, Standard và Autopilot."
  - title: "Google Cloud — Cloud Storage Overview"
    url: "https://docs.cloud.google.com/storage/docs/introduction"
    description: "Buckets, objects và các thao tác quản lý dữ liệu trong object storage."
  - title: "Google Cloud — Cloud SQL Overview"
    url: "https://docs.cloud.google.com/sql/docs/introduction"
    description: "Dịch vụ database quan hệ được quản lý cho MySQL, PostgreSQL và SQL Server."
  - title: "Google Cloud — Pub/Sub Overview"
    url: "https://docs.cloud.google.com/pubsub/docs/overview"
    description: "Messaging bất đồng bộ với publisher, topic và subscriber để tách các dịch vụ."
  - title: "Google Cloud — Cloud Build Overview"
    url: "https://docs.cloud.google.com/build/docs/overview"
    description: "Quy trình build, test, tạo artifact và tích hợp triển khai ứng dụng."
  - title: "Google Cloud — Monitoring Overview"
    url: "https://docs.cloud.google.com/monitoring/docs/monitoring-overview"
    description: "Metrics, dashboards và alerting để quan sát và xử lý sức khỏe hệ thống."
  - title: "Google Cloud — Budgets and Alerts"
    url: "https://docs.cloud.google.com/billing/docs/how-to/budgets"
    description: "Theo dõi ngân sách, cấu hình cảnh báo chi phí và giới hạn của budget alerts."
