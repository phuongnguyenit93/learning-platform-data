references:
  - title: "Micrometer Documentation"
    url: "https://docs.micrometer.io/micrometer/reference/"
    description: "Tổng quan API instrumentation độc lập với backend và vai trò Micrometer trong ứng dụng Java."
  - title: "Meters"
    url: "https://docs.micrometer.io/micrometer/reference/concepts/meters.html"
    description: "Các loại meter, phép đo, tên metric và tag; cơ sở chọn Counter, Timer, Gauge hay DistributionSummary."
  - title: "Registry"
    url: "https://docs.micrometer.io/micrometer/reference/concepts/registry.html"
    description: "MeterRegistry, SimpleMeterRegistry, composite registry và cách quản lý metrics trước khi xuất dữ liệu."
  - title: "Naming Meters"
    url: "https://docs.micrometer.io/micrometer/reference/concepts/naming.html"
    description: "Quy ước đặt tên meter và tag để dữ liệu dễ hiểu và tương thích giữa các backend."
  - title: "Counters"
    url: "https://docs.micrometer.io/micrometer/reference/concepts/counters.html"
    description: "Ví dụ đo sự kiện nghiệp vụ bằng Counter và lưu ý tránh đếm trùng với Timer."
  - title: "Spring Boot 3.3 - Metrics"
    url: "https://docs.spring.io/spring-boot/3.3/reference/actuator/metrics.html"
    description: "Tích hợp Micrometer với Spring Boot Actuator, cấu hình registry, metrics mặc định và metrics tự định nghĩa."
  - title: "Observation Components"
    url: "https://docs.micrometer.io/micrometer/reference/observation/components.html"
    description: "ObservationRegistry, ObservationHandler, ObservationConvention và vòng đời Observation phục vụ instrumentation."
  - title: "Spring Boot 3.3 - Observability"
    url: "https://docs.spring.io/spring-boot/3.3/reference/actuator/observability.html"
    description: "Tạo custom Observation trong Spring Boot và quản lý key-value có độ phân biệt thấp hoặc cao."