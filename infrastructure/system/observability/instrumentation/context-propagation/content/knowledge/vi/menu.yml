menu:
- level1: Tổng quan
  level2:
  - Truyền ngữ cảnh là gì và vì sao hệ thống quan sát cần cơ chế này
  - Một yêu cầu đi qua nhiều hàm, luồng và dịch vụ như thế nào
  - Ngữ cảnh thực thi và mối liên hệ giữa các công việc cùng hành trình
  - Phân biệt truyền ngữ cảnh với tạo span, ghi logs và xuất telemetry
  - Vì sao cùng một trace ID chưa đủ bảo đảm quan hệ xử lý đúng
  - Truyền trong một tiến trình và truyền qua ranh giới tiến trình
  - Các ranh giới thường làm mất ngữ cảnh trong ứng dụng Java
  - Vai trò của chuẩn trao đổi, thư viện và cơ chế gắn phép đo
  - 'Bản đồ thuật ngữ: context, scope, carrier, propagator và baggage'
  - Trình tự học từ mô hình ngữ cảnh đến kiểm chứng đầu cuối
- level1: Mô hình ngữ cảnh
  level2:
  - Ngữ cảnh là tập giá trị gắn với một đơn vị thực thi logic
  - Truyền tường minh qua tham số và truy cập ngữ cảnh hiện hành
  - Ngữ cảnh bất biến và tạo ngữ cảnh dẫn xuất
  - Phân biệt ngữ cảnh với đối tượng request và đối tượng session
  - Khóa ngữ cảnh, danh tính khóa và xung đột giữa thư viện
  - Ngữ cảnh gốc, ngữ cảnh hiện hành và giá trị mặc định
  - Giá trị cục bộ và giá trị được phép truyền qua mạng
  - Snapshot của ngữ cảnh và thời điểm chụp giá trị
  - Ngữ cảnh bất biến không bảo đảm đối tượng bên trong cũng bất biến
  - Phân biệt metadata quan sát với quyền truy cập, giao dịch và trạng thái nghiệp vụ
  - Quan hệ giữa ngữ cảnh thực thi với deadline và tín hiệu hủy
- level1: Phạm vi và vòng đời
  level2:
  - Phạm vi kích hoạt ngữ cảnh và cơ chế khôi phục ngữ cảnh trước
  - Mở phạm vi tại điểm vào và đóng phạm vi khi rời điểm xử lý
  - Phạm vi lồng nhau và thứ tự đóng từ trong ra ngoài
  - Khôi phục ngữ cảnh khi có ngoại lệ
  - Phân biệt đóng scope với kết thúc span
  - Phạm vi trên một luồng và công việc tiếp tục trên luồng khác
  - Vì sao không giữ scope mở trong lúc chờ tác vụ bất đồng bộ
  - Chụp ngữ cảnh trước khi bàn giao và kích hoạt lúc thực thi
  - Khôi phục trạng thái sẵn có trên luồng nhận
  - Giải phóng tham chiếu sau thành công, lỗi, hủy hoặc timeout
  - Rò rỉ ngữ cảnh và lẫn dữ liệu giữa hai yêu cầu
  - Quyền sở hữu việc mở, đóng scope khi nhiều lớp cùng tham gia
- level1: Quan hệ trace
  level2:
  - Trace, span và SpanContext trong mô hình quan sát phân tán
  - Trace ID nhận diện hành trình và span ID nhận diện một thao tác
  - Span cha cục bộ và ngữ cảnh cha nhận từ dịch vụ khác
  - Phân biệt ngữ cảnh cha từ xa với span đang hoạt động tại chỗ
  - Span con khi gọi hàm, gửi yêu cầu hoặc xử lý công việc mới
  - Tạo span không đồng nghĩa tự động kích hoạt span
  - Giữ nguyên trace ID và thay đổi span ID qua các chặng
  - Phân biệt quan hệ cha con với liên kết bằng span link
  - Một công việc có nhiều nguồn khởi tạo hoặc nhiều thông điệp đầu vào
  - Ngữ cảnh hợp lệ trong trường hợp span không ghi dữ liệu
  - Liên hệ giữa vòng đời span và vòng đời công việc thực tế
- level1: Traceparent
  level2:
  - Vai trò của W3C Trace Context trong trao đổi giữa các dịch vụ
  - 'Cấu trúc traceparent: version, trace-id, parent-id và trace-flags'
  - Ý nghĩa parent-id đối với dịch vụ nhận yêu cầu
  - Định dạng, độ dài và miền giá trị hợp lệ của các định danh
  - Định danh toàn số không và ngữ cảnh không hợp lệ
  - Cờ sampled và thông tin quyết định lấy mẫu được truyền đi
  - Quy tắc đọc các phiên bản và cờ theo đặc tả tương ứng
  - Khi không nhận được traceparent
  - Khi traceparent sai định dạng hoặc không được chấp nhận
  - Thay đổi parent-id khi tạo thao tác gửi đi mới
  - Tên header, tính không phân biệt hoa thường và xử lý qua thư viện
  - Đọc một chuỗi header mẫu để dựng quan hệ giữa các chặng
- level1: Tracestate
  level2:
  - Tracestate dùng cho thông tin mở rộng của hệ thống tracing
  - Mối liên hệ giữa traceparent hợp lệ và tracestate
  - Danh sách khóa giá trị, thứ tự thành viên và quyền sở hữu khóa
  - Cách thêm, cập nhật và chuyển tiếp thông tin của nhà cung cấp
  - Giới hạn kích thước và số thành viên theo đặc tả
  - Xử lý thành viên sai định dạng hoặc trùng khóa
  - Bảo toàn thông tin tương thích khi đi qua nhiều hệ thống
  - Phân biệt tracestate với baggage và thuộc tính của span
  - Không đưa dữ liệu nghiệp vụ tùy ý vào tracestate
- level1: Baggage
  level2:
  - Baggage là dữ liệu ứng dụng truyền cùng hành trình xử lý
  - Baggage có thể tồn tại độc lập với tracing
  - Phân biệt baggage với span attributes và resource attributes
  - Cấu trúc khóa, giá trị và metadata trong header baggage
  - Mã hóa ký tự, phân tách thành viên và giải mã an toàn
  - Thêm, đọc, thay thế và loại bỏ một mục baggage
  - Giới hạn số mục và tổng kích thước được truyền
  - Danh sách thuộc tính được cho phép tại từng ranh giới dịch vụ
  - Baggage không tự động trở thành thuộc tính span hoặc log
  - Chọn điểm chuyển baggage thành thông tin quan sát cần thiết
  - Giới hạn cardinality khi dùng dữ liệu ngữ cảnh cho metrics
  - Vòng đời baggage khi tạo nhánh xử lý hoặc bắt đầu hành trình mới
- level1: Inject và extract
  level2:
  - Carrier là nơi chứa dữ liệu được truyền qua ranh giới
  - 'Inject: ghi ngữ cảnh đã chọn vào carrier'
  - 'Extract: đọc carrier để tạo ngữ cảnh phía nhận'
  - Phân biệt trích xuất ngữ cảnh với kích hoạt ngữ cảnh
  - Getter và setter để thích nghi với từng kiểu carrier
  - Ngữ cảnh nền dùng khi trích xuất và chính sách giữ giá trị cục bộ
  - Kết hợp nhiều propagator cho trace context và baggage
  - Trường được propagator sử dụng và cách tránh ghi header trùng
  - Inject sau khi tạo span gửi đi phù hợp
  - Carrier dùng lại, dữ liệu cũ và nguy cơ lẫn yêu cầu
  - Xử lý giá trị thiếu, sai kiểu và nhiều giá trị cho một trường
  - Kiểm thử vòng inject rồi extract trên cùng một carrier
- level1: Luồng HTTP
  level2:
  - Luồng nhận yêu cầu, extract, tạo server span và kích hoạt ngữ cảnh
  - Luồng gọi ra, tạo client span, inject và gửi yêu cầu
  - Đóng scope và kết thúc span khi thao tác hoàn tất
  - Truyền ngữ cảnh qua nhiều dịch vụ trung gian
  - Proxy, gateway và header bị lọc hoặc thay đổi
  - Giữ riêng ngữ cảnh cho từng yêu cầu đồng thời
  - Lỗi HTTP, ngoại lệ và tác động đến vòng đời ngữ cảnh
  - Thử lại yêu cầu và quan hệ giữa span logic với từng lần gửi
  - Chuyển hướng sang đích khác và chính sách truyền header
  - Header từ trình duyệt, CORS và quyền đọc header phản hồi
  - Correlation ID của ứng dụng và quan hệ với trace ID
  - Phân biệt header giao thức tracing với dữ liệu nghiệp vụ trong body
- level1: RPC và kết nối dài
  level2:
  - Truyền ngữ cảnh bằng metadata trong gRPC
  - Interceptor phía nhận và phía gửi trong một lời gọi RPC
  - Phân biệt OpenTelemetry Context với io.grpc.Context
  - Deadline và cancellation của RPC cần cơ chế truyền riêng
  - Ngữ cảnh của một lời gọi streaming và các lần xử lý thông điệp
  - 'WebSocket: ngữ cảnh lúc bắt tay và ngữ cảnh từng thông điệp'
  - 'SSE: phạm vi kết nối, lần xử lý sự kiện và tác vụ gửi'
  - Carrier cho giao thức không có HTTP headers
  - Không dùng ngữ cảnh của một kết nối làm cha cho mọi công việc vô hạn
- level1: ThreadLocal
  level2:
  - ThreadLocal lưu dữ liệu riêng cho từng Thread như thế nào
  - Một luồng xử lý nhiều yêu cầu và nguy cơ giữ lại dữ liệu cũ
  - set, get, remove và dọn dẹp bằng finally
  - Lưu và khôi phục giá trị trước khi mở phạm vi mới
  - InheritableThreadLocal và thời điểm kế thừa khi tạo luồng con
  - Vì sao kế thừa luồng không giải quyết đầy đủ việc tái sử dụng pool
  - Bàn giao tác vụ khác với tạo mới một luồng
  - Ngữ cảnh theo yêu cầu và ngữ cảnh theo luồng không luôn trùng nhau
  - Dữ liệu dùng chung có thể thay đổi và lỗi cạnh tranh
  - Giới hạn của biến static hoặc singleton làm nơi giữ ngữ cảnh
  - Tái hiện lẫn ngữ cảnh bằng một pool chỉ có một luồng
- level1: Executor
  level2:
  - Điểm bàn giao qua Executor, ExecutorService và ScheduledExecutorService
  - Chụp ngữ cảnh lúc nộp tác vụ thay vì lúc khởi tạo pool
  - Bao bọc Runnable và Callable để kích hoạt rồi khôi phục ngữ cảnh
  - Trang trí executor và phạm vi những tác vụ được bao phủ
  - Bàn giao lồng nhau và tránh bao bọc nhiều lần ngoài ý muốn
  - Đường chạy inline và chính sách thực thi trên luồng gọi
  - Tác vụ bị từ chối và giải phóng dữ liệu đã chụp
  - Tác vụ ném lỗi, bị hủy hoặc không bao giờ được chạy
  - Lịch chạy một lần và lịch chạy lặp cần chính sách ngữ cảnh khác nhau
  - ForkJoinPool, parallel stream và giới hạn truyền ngầm
  - Tác vụ đã chụp ngữ cảnh không tự nhìn thấy thay đổi về sau
  - Đối chiếu ngữ cảnh trên luồng nộp và luồng thực thi
- level1: CompletableFuture
  level2:
  - Các điểm đổi đơn vị thực thi trong chuỗi CompletionStage
  - thenApply và luồng thực thi phụ thuộc thời điểm hoàn tất
  - thenApplyAsync và executor mặc định hoặc được chỉ định
  - supplyAsync, runAsync và thời điểm cần chụp ngữ cảnh
  - Truyền ngữ cảnh qua callback và qua executor
  - thenCompose và ngữ cảnh của công việc bất đồng bộ được nối tiếp
  - thenCombine, allOf và lựa chọn ngữ cảnh khi hợp nhất
  - whenComplete, handle, exceptionally và nhánh xử lý lỗi
  - Timeout của future không đồng nghĩa công việc nền đã dừng
  - Hủy future, công việc còn chạy và giải phóng phạm vi đúng chỗ
  - Future đã hoàn tất trước khi đăng ký callback
  - Kiểm thử chuỗi có nhánh chạy cùng luồng và nhánh chạy trên pool
- level1: Luồng ảo
  level2:
  - Luồng ảo trong Java 21 và ngữ cảnh theo luồng
  - Phân biệt luồng ảo với luồng carrier của JVM
  - ThreadLocal trên luồng ảo và giới hạn của suy luận theo tên luồng
  - Kế thừa ngữ cảnh khi tạo luồng ảo và chính sách của thread builder
  - Executor tạo luồng ảo cho từng tác vụ vẫn cần xác định ranh giới ngữ cảnh
  - Chi phí giữ dữ liệu ngữ cảnh khi có nhiều luồng ảo
  - Truyền sang pool khác từ một luồng ảo
  - Kiểm chứng ngữ cảnh bằng hành vi thay vì giả định mô hình luồng
- level1: OpenTelemetry Java
  level2:
  - Context.current, Context.root và ContextKey
  - Context.with để tạo ngữ cảnh dẫn xuất
  - makeCurrent và Scope trong try-with-resources
  - Span.current và truy cập SpanContext hợp lệ
  - setParent khi tạo span từ một ngữ cảnh đã biết
  - setNoParent khi chủ động bắt đầu trace mới
  - Giữ quan hệ giữa tạo span, kích hoạt và kết thúc
  - Context.wrap cho Runnable, Callable và các kiểu tác vụ được hỗ trợ
  - Context.taskWrapping để trang trí executor theo API phù hợp
  - TextMapPropagator, TextMapGetter và TextMapSetter
  - Baggage API và gắn baggage vào ngữ cảnh
  - Phân biệt cơ chế Context API với cấu hình SDK, sampler và exporter
- level1: MDC và logging
  level2:
  - MDC là gì và vai trò trong liên kết logs với hành trình xử lý
  - Phân biệt bản đồ MDC với ngữ cảnh tracing
  - Đưa trace ID, span ID hoặc correlation ID vào sự kiện log
  - Cập nhật MDC khi span hiện hành thay đổi
  - Sao chép và khôi phục MDC khi bàn giao tác vụ
  - Dọn dẹp đúng khóa mà không xóa dữ liệu do lớp ngoài quản lý
  - MDC lồng nhau và phục hồi giá trị bị che khuất
  - Sự kiện log bất đồng bộ và thời điểm chụp dữ liệu MDC
  - Logs từ luồng nền không có request đang hoạt động
  - Vì sao MDC có trace ID nhưng trace vẫn có thể đứt quan hệ
  - Không dùng toàn bộ MDC làm baggage mặc định
- level1: Micrometer
  level2:
  - Vai trò của Micrometer Context Propagation tại các điểm đổi mô hình
  - ThreadLocalAccessor và hợp đồng truy cập giá trị theo khóa
  - ContextAccessor cho cấu trúc ngữ cảnh dạng bản đồ
  - ContextRegistry và đăng ký các accessor cần thiết
  - ContextSnapshotFactory và chụp những giá trị đã đăng ký
  - ContextSnapshot lưu giá trị tại thời điểm chụp
  - setThreadLocals và khôi phục bằng Scope
  - Giá trị vắng mặt, chính sách xóa và ngăn dữ liệu cũ rò sang tác vụ
  - Bao bọc tác vụ hoặc executor bằng cơ chế snapshot phù hợp
  - Chuyển dữ liệu giữa ThreadLocal với Reactor Context
  - Observation đang hoạt động và accessor của hệ thống quan sát
  - Phân biệt truyền ngữ cảnh cục bộ với inject header qua mạng
- level1: Reactor Context
  level2:
  - Vì sao ThreadLocal riêng lẻ không mô tả đúng chuỗi reactive
  - Context và ContextView gắn với subscriber
  - Context bất biến và tạo giá trị dẫn xuất
  - contextWrite và phạm vi nhìn thấy của thay đổi
  - Chiều truyền ngữ cảnh từ bên đăng ký đến các toán tử phía trên
  - deferContextual để đọc ngữ cảnh lúc thực thi
  - Thời điểm lắp ráp chuỗi, đăng ký và phát tín hiệu
  - publishOn, subscribeOn và sự độc lập giữa luồng với subscriber context
  - flatMap và phạm vi ngữ cảnh của chuỗi con
  - Nhiều subscriber dùng chung một chuỗi nhưng có ngữ cảnh riêng
  - Khóa trùng, thứ tự contextWrite và giá trị bị ghi đè
  - Không đưa toàn bộ ngữ cảnh vào đối tượng dữ liệu nghiệp vụ
- level1: Cầu nối reactive
  level2:
  - Cơ chế nối Reactor Context với ThreadLocal đã đăng ký
  - contextCapture và thời điểm chụp dữ liệu khi đăng ký
  - Chế độ khôi phục giới hạn và các toán tử được hỗ trợ
  - Hooks.enableAutomaticContextPropagation và phạm vi áp dụng
  - Bật hook trước các lượt đăng ký cần được hỗ trợ
  - Đặt dữ liệu bằng contextWrite và đọc qua mã dùng ThreadLocal
  - Đường chuyển từ mã mệnh lệnh sang reactive
  - Đường chuyển từ reactive sang thư viện mệnh lệnh
  - Giá trị không có trong context và yêu cầu làm sạch ThreadLocal
  - retry, repeat và việc tạo lại phạm vi theo mỗi lần đăng ký
  - cache, share và rủi ro gắn nhầm ngữ cảnh giữa nhiều bên sử dụng
  - Kiểm tra khả năng tương thích giữa phiên bản Reactor và thư viện cầu nối
- level1: Spring MVC
  level2:
  - Điểm vào Servlet và phạm vi ngữ cảnh cho một yêu cầu
  - Vai trò của filter, interceptor và cơ chế observation có sẵn
  - Extract đầu vào trước khi gắn phép đo cho phần xử lý tương ứng
  - Truyền ngữ cảnh qua RestClient, RestTemplate hoặc HTTP client được sử dụng
  - Client được cấu hình sẵn so với client tự khởi tạo
  - Servlet async, Callable, DeferredResult và các lần dispatch
  - TaskDecorator và trang trí executor cho tác vụ bất đồng bộ
  - ContextPropagatingTaskDecorator khi phiên bản Spring hỗ trợ
  - '@Async và điều kiện executor thực sự được áp dụng'
  - Phân biệt observability context với SecurityContext, giao dịch và RequestContextHolder
  - Dọn dẹp khi có lỗi, timeout hoặc trả kết quả bất đồng bộ
- level1: Spring WebFlux
  level2:
  - Ngữ cảnh theo ServerWebExchange và theo subscriber
  - Vai trò của WebFilter và observation trong luồng reactive
  - Dùng Reactor Context để giữ dữ liệu quan sát theo yêu cầu
  - Truyền ngữ cảnh qua WebClient tại thời điểm đăng ký phù hợp
  - Đưa tracing context vào lời gọi gửi đi mà không đọc ThreadLocal quá sớm
  - Nhánh reactive gọi thư viện blocking trên scheduler khác
  - Kết hợp cầu nối tự động với cấu hình của Spring Boot đang sử dụng
  - Tránh subscribe thủ công làm tách phạm vi xử lý
  - Lỗi, hủy đăng ký và thời điểm kết thúc span
  - Kiểm chứng riêng từng yêu cầu khi nhiều chuỗi dùng chung event loop
- level1: Messaging
  level2:
  - Ngữ cảnh producer, metadata thông điệp và consumer
  - Chọn carrier từ message headers hoặc message properties
  - Inject trước khi gửi và extract khi nhận xử lý
  - Phân biệt gửi thông điệp, nhận thông điệp và xử lý nghiệp vụ
  - Quan hệ cha con hoặc span links theo mô hình messaging
  - Một lần xử lý nhận nhiều thông điệp có ngữ cảnh khác nhau
  - Phát đến nhiều consumer và phân nhánh hành trình
  - Thử gửi lại, xử lý lại và giao nhận thông điệp lặp
  - Thời gian chờ trong hàng đợi và vòng đời span
  - Kafka headers và vấn đề khóa có thể có nhiều giá trị
  - AMQP, JMS và khác biệt kiểu dữ liệu thuộc tính
  - Giải phóng ngữ cảnh trên luồng consumer trước thông điệp tiếp theo
  - Ngữ cảnh tracing không tự bảo đảm giao nhận chính xác một lần
- level1: Tác vụ nền
  level2:
  - Phân biệt công việc tiếp nối request với công việc độc lập
  - Tác vụ chạy sau khi request đã trả kết quả
  - Ngữ cảnh được chụp có thể còn định danh của span đã kết thúc
  - Lựa chọn nối tiếp trace, tạo trace mới hoặc thêm span link
  - Lịch lặp không được giữ mãi ngữ cảnh của lần cấu hình ban đầu
  - Ngữ cảnh cho từng lần chạy scheduler và từng đơn vị batch
  - Workflow dài hạn và dữ liệu liên kết được lưu bền
  - Retry, backoff và ngữ cảnh riêng cho từng lần thử
  - Chia nhiều nhánh và hợp nhất kết quả từ nhiều nguồn
  - Phân biệt truyền trace context với truyền deadline hoặc trạng thái hủy
  - Giới hạn dữ liệu giữ lại khi tác vụ chờ lâu hoặc không được chạy
- level1: Tương thích và lấy mẫu
  level2:
  - W3C Trace Context và định dạng B3
  - B3 một header, nhiều header và cấu hình tương thích
  - Phân biệt giải mã đầu vào với định dạng sẽ ghi đầu ra
  - Thứ tự ưu tiên khi nhận nhiều định dạng không đồng nhất
  - Chuyển đổi định dạng và thông tin có thể không được bảo toàn
  - Proxy hoặc thư viện trung gian không tạo span nhưng vẫn chuyển ngữ cảnh
  - Cờ sampled, quyết định sampler cục bộ và chính sách tin cậy
  - Không ghi span vẫn có thể truyền ngữ cảnh hợp lệ
  - Phân biệt truyền metadata lấy mẫu với xuất dữ liệu span
  - Trace bị thiếu span do sampling và trace bị đứt do propagation
  - Tương thích khi bật agent, thư viện tự động và mã thủ công cùng lúc
- level1: Ranh giới tin cậy
  level2:
  - Ngữ cảnh đầu vào từ người gọi là dữ liệu cần kiểm tra
  - Định dạng hợp lệ không đồng nghĩa nguồn gửi đáng tin cậy
  - Baggage và trace ID không phải bằng chứng xác thực hay phân quyền
  - Chính sách tiếp tục, làm mới hoặc loại bỏ ngữ cảnh tại biên hệ thống
  - Không truyền mật khẩu, token và thông tin nhạy cảm qua baggage
  - Danh sách trường cho phép theo miền, dịch vụ hoặc đối tác
  - Giới hạn kích thước, số trường và chi phí phân tích header
  - Chặn dữ liệu nguy hiểm trước khi chuyển vào logs
  - Ngăn dùng dữ liệu từ bên ngoài để ép mức ghi nhận không kiểm soát
  - Cách ly dữ liệu giữa người dùng, tenant và yêu cầu
  - CORS, chuyển hướng và điểm đích bên ngoài miền tin cậy
  - Phân biệt dữ liệu quan sát với trạng thái giao dịch, bảo mật và phân vùng dữ liệu
- level1: Hiệu năng và vòng đời
  level2:
  - Chi phí chụp snapshot theo số khóa và kích thước dữ liệu
  - Chi phí mở, đóng scope tại các ranh giới thực thi
  - Bao bọc nhiều lần và tác động đến cấp phát đối tượng
  - Giữ request hoặc đối tượng lớn trong context gây giữ bộ nhớ
  - Task bị hủy trong hàng đợi và vòng đời dữ liệu được giữ
  - Chi phí cầu nối tự động trong chuỗi reactive
  - Baggage lớn làm tăng kích thước mọi lời gọi hoặc thông điệp
  - Giới hạn dữ liệu cần truyền theo mục tiêu quan sát
  - Đo chi phí dưới tải và kiểm tra sau khi thay đổi cơ chế propagation
- level1: Kiểm thử
  level2:
  - Kiểm thử inject rồi extract bảo toàn các trường được hỗ trợ
  - Kiểm thử header thiếu, sai định dạng và vượt giới hạn
  - Kiểm thử scope lồng nhau khôi phục giá trị cũ
  - Kiểm thử đóng scope khi có ngoại lệ
  - Kiểm thử nhiều request trên một luồng pool dùng lại
  - Kiểm thử capture lúc nộp tác vụ và restore lúc chạy
  - Kiểm thử CompletableFuture hoàn tất trước và sau khi gắn callback
  - Kiểm thử Reactor với nhiều subscriber và thay đổi scheduler
  - Kiểm thử retry, timeout, hủy và công việc vẫn chạy nền
  - Kiểm thử producer, consumer, batch và thông điệp xử lý lại
  - Kiểm thử parent ID, trace ID và span links thay vì chỉ kiểm tra logs
  - Kiểm thử không rò ngữ cảnh sang công việc kế tiếp
  - Kiểm thử tự động và thủ công không tạo hai bộ span ngoài ý muốn
- level1: Chẩn đoán
  level2:
  - Lần theo ranh giới đầu tiên mà trace ID hoặc parent ID thay đổi sai
  - Header có đủ nhưng ngữ cảnh hiện hành vẫn rỗng
  - Context đã extract nhưng chưa được kích hoạt khi tạo span
  - Span đã tạo nhưng chưa trở thành span hiện hành
  - Trace ID đúng nhưng client span hoặc server span bị gắn sai cha
  - Logs có trace ID cũ sau khi xử lý yêu cầu khác
  - Mất ngữ cảnh sau @Async, executor hoặc callback
  - Mất dữ liệu khi đổi scheduler hoặc đăng ký reactive ở thời điểm khác
  - Header biến mất qua gateway, proxy hoặc client tự khởi tạo
  - Baggage không xuất hiện trong span vì chưa có bước ánh xạ
  - Span lặp hoặc scope lồng sai khi nhiều cơ chế cùng gắn phép đo
  - Phân biệt lỗi propagation với lỗi sampling, exporter hoặc đồng hồ
  - Dùng nhật ký ranh giới và carrier đã lọc để kiểm chứng giả thuyết
- level1: Thực hành tổng hợp
  level2:
  - Vẽ hành trình ngữ cảnh qua hai dịch vụ và một hàng đợi
  - Đọc traceparent mẫu để xác định quan hệ các chặng
  - Xây carrier giả để kiểm chứng inject và extract
  - Tái hiện lẫn ThreadLocal trên pool một luồng rồi xác minh dọn dẹp
  - So sánh capture ở lúc tạo wrapper với lúc nộp từng tác vụ
  - Truyền ngữ cảnh qua chuỗi CompletableFuture có nhánh lỗi
  - So sánh tác vụ trên luồng nền tảng và luồng ảo
  - Liên kết MDC với span đang hoạt động và kiểm tra scope lồng
  - Chuyển dữ liệu giữa ThreadLocal và Reactor Context
  - Đối chiếu contextWrite, contextCapture và chế độ cầu nối tự động
  - Kiểm tra hai subscriber đồng thời không dùng nhầm ngữ cảnh
  - Theo dõi producer, consumer, thử lại và xử lý theo lô
  - Thiết kế chính sách baggage tại ranh giới dịch vụ nội bộ và bên ngoài
  - Kiểm chứng hành trình không ghi span nhưng vẫn truyền ngữ cảnh
  - Lập bảng ranh giới, cơ chế capture, restore, inject, extract và bằng chứng kiểm thử
