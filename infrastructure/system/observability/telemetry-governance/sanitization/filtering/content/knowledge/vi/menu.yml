      - "Duy trì runbook và hướng dẫn cho đội ứng dụng tránh phụ thuộc vào telemetry đã bị lọc"
  - level1: "Bài tập thực hành"
    level2:
      - "Lập bảng quyết định giảm log health check nhưng giữ lỗi và sự kiện audit"
