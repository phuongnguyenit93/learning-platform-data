      - "Kiểm tra cảnh báo SLO, tỷ lệ lỗi và độ trễ khi metric hoặc datapoint bị loại bỏ"
      - "Đánh giá trace không đầy đủ, service map thiếu cạnh và exemplars không mở được"
      - "So sánh thời gian tìm nguyên nhân và số bằng chứng còn lại với đường cơ sở"
      - "Xác nhận mức giảm chi phí không làm vi phạm tiêu chí điều tra sự cố đã thống nhất"
  - level1: "Quan sát bộ lọc"
    level2:
      - "Theo dõi lưu lượng vào, ra và dữ liệu bị loại bỏ bằng telemetry sẵn có của Collector"
      - "Kiểm chứng tên, đơn vị và phạm vi metric nội bộ theo phiên bản Collector"
      - "Phân biệt dữ liệu bị lọc với dữ liệu mất do receiver, exporter, hàng đợi hoặc backend"
      - "Thiết kế dashboard tỷ lệ loại bỏ, thông lượng, lỗi điều kiện và độ trễ pipeline"
      - "Theo dõi tỷ lệ theo dịch vụ và tín hiệu mà không tạo nhãn có cardinality quá cao"
      - "Cảnh báo khi lưu lượng đầu ra về không, tỷ lệ loại bỏ tăng đột ngột hoặc lỗi đánh giá tăng"
      - "Gắn phiên bản chính sách vào bằng chứng triển khai để tương quan với thay đổi lưu lượng"
      - "Tránh ghi payload nhạy cảm khi bật log chẩn đoán và điều tra hoạt động bộ lọc"
  - level1: "Xử lý sự cố"
    level2:
      - "Chẩn đoán quy tắc không có hiệu lực do chưa gắn processor vào đúng pipeline"
      - "Chẩn đoán lỗi khởi động do YAML, biểu thức OTTL hoặc thành phần không được hỗ trợ"
      - "Chẩn đoán điều kiện không khớp do sai đường dẫn, kiểu dữ liệu hoặc semantic conventions"
