      - "Kiểm thử tải đột biến, bản ghi lớn và dữ liệu lỗi kiểu trong điều kiện thực tế"
      - "Đánh giá tương tác với memory limiter, batch và cơ chế thử lại exporter"
      - "Đặt giới hạn tài nguyên cùng ngưỡng hiệu năng chấp nhận cho từng lớp Collector"
      - "Tối ưu điều kiện dựa trên kết quả đo mà vẫn giữ nguyên ngữ nghĩa chính sách"
  - level1: "Kiểm thử điều kiện"
    level2:
      - "Xây dựng tập ca khớp, không khớp và ngoại lệ cho từng quy tắc OTTL"
      - "Kiểm thử nil, trường thiếu, chuỗi rỗng, kiểu sai và giá trị không được dự kiến"
      - "Kiểm thử bảng chân trị của and, or, not và danh sách điều kiện loại bỏ"
      - "Kiểm thử regex với dữ liệu gần giống, ký tự đặc biệt và chuỗi dài"
      - "Kiểm thử cùng tên thuộc tính tại resource và bản ghi để phát hiện nhầm ngữ cảnh"
      - "Đánh giá tỷ lệ loại bỏ nhầm và bỏ sót trên tập dữ liệu đã gán nhãn"
      - "Xác minh cú pháp và hành vi bằng đúng phiên bản, bản phân phối Collector dự kiến chạy"
      - "Duy trì bộ ca hồi quy khi chính sách, semantic conventions hoặc instrumentation thay đổi"
  - level1: "Kiểm thử pipeline"
    level2:
      - "Dựng pipeline kiểm thử cô lập với receiver, processor và đầu ra có thể đối chiếu"
      - "Phát telemetry tổng hợp bao phủ log, metric, span và sự kiện span"
      - "So sánh đầu vào và đầu ra theo định danh ổn định cùng số lượng dữ liệu mong đợi"
      - "Kiểm thử error_mode với lỗi đánh giá điều kiện và quan sát cách lỗi lan truyền"
      - "Kiểm thử thứ tự processor, connector và các nhánh xuất dữ liệu"
      - "Kiểm thử không rò rỉ dữ liệu nhạy cảm bằng giá trị đánh dấu tổng hợp"
      - "Kiểm thử hành vi khi batch trộn nhiều dịch vụ, tenant và đối tượng có dữ liệu rỗng"
      - "Lưu bằng chứng cấu hình và kết quả kiểm thử làm điều kiện chấp nhận thay đổi"
  - level1: "Kiểm thử điều tra lỗi"
    level2:
      - "Dựng kịch bản lỗi HTTP, timeout, retry và phụ thuộc dịch vụ chậm"
      - "Dựng kịch bản lỗi cơ sở dữ liệu, messaging và xử lý bất đồng bộ"
      - "Theo dõi một yêu cầu xuyên dịch vụ trước và sau khi áp dụng chính sách lọc"
