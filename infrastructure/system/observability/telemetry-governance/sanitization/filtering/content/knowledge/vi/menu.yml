      - "Chẩn đoán lỗi biểu thức bị bỏ qua hoặc lan truyền theo error_mode"
      - "Chẩn đoán chi phí không giảm dù tỷ lệ loại bỏ tăng do vị trí lọc hoặc cách tính phí"
      - "Khôi phục cấu hình an toàn khi trace đứt đoạn, cảnh báo thiếu dữ liệu hoặc CPU tăng cao"
      - "Thu thập bằng chứng sau sự cố và xác định phần dữ liệu bị loại bỏ không thể phục hồi"
  - level1: "Phát hành chính sách"
    level2:
