menu:
  - level1: "Tổng quan"
    level2:
      - "Vai trò của lọc telemetry trong quản trị dữ liệu quan sát và vệ sinh pipeline"
      - "Nguồn phát sinh log, metric và span dư thừa trong hệ thống phân tán"
      - "Phân biệt lọc dữ liệu với che giấu, băm, xóa thuộc tính và biến đổi dữ liệu"
      - "Phân biệt lọc tất định với lấy mẫu xác suất và lấy mẫu dựa trên toàn bộ trace"
      - "Lợi ích và đánh đổi giữa dung lượng, chi phí, độ bao phủ và khả năng điều tra lỗi"
      - "Giới hạn của bộ lọc khi dữ liệu nhạy cảm đã đi qua các tầng trước Collector"
      - "Các tình huống phù hợp và không phù hợp để loại bỏ toàn bộ bản ghi telemetry"
      - "Vòng đời từ xác định nhu cầu, thiết kế điều kiện đến vận hành chính sách lọc"
  - level1: "Mục tiêu và phạm vi"
    level2:
      - "Lập danh mục nguồn telemetry theo dịch vụ, môi trường, tenant và mức độ quan trọng"
      - "Xác định dữ liệu cần giữ để đáp ứng SLO, cảnh báo và quy trình xử lý sự cố"
      - "Xác định log lặp, health check, lưu lượng thử nghiệm và tín hiệu có giá trị thấp"
      - "Xây dựng đường cơ sở về lưu lượng, kích thước, cardinality và chi phí trước khi lọc"
      - "Định nghĩa tỷ lệ loại bỏ mục tiêu và ngưỡng mất tín hiệu có thể chấp nhận"
      - "Xác định ranh giới tin cậy và vị trí phải chặn dữ liệu nhạy cảm trước khi truyền tiếp"
      - "Xác định dữ liệu bắt buộc giữ và ngoại lệ theo yêu cầu nghiệp vụ, kiểm toán và bảo mật"
      - "Thiết lập tiêu chí nghiệm thu cân bằng tiết kiệm chi phí và khả năng điều tra lỗi"
  - level1: "Luồng telemetry"
    level2:
      - "Đường đi của telemetry từ ứng dụng và SDK qua agent, gateway đến hệ thống lưu trữ"
      - "Vai trò của receiver, processor, connector và exporter trong OpenTelemetry Collector"
      - "Cấu hình pipeline riêng cho log, metric và trace cùng phạm vi áp dụng bộ lọc"
      - "Phân biệt đơn vị truyền theo batch với đơn vị dữ liệu thực sự bị loại bỏ"
      - "Vị trí của bộ lọc so với hàng đợi, cơ chế thử lại và lưu trữ đệm"
      - "Tác động của lọc tại nguồn, Collector cục bộ và gateway đến lượng dữ liệu truyền"
      - "Rủi ro xuất dữ liệu ngoài ý muốn qua exporter phụ và pipeline chưa có chính sách"
      - "Giới hạn của lọc khi dữ liệu đã được ghi ra đĩa hoặc gửi tới hệ thống đích"
  - level1: "Mô hình dữ liệu"
    level2:
      - "Resource, instrumentation scope và thuộc tính dùng chung trong dữ liệu OpenTelemetry"
      - "Các trường của log record gồm body, severity, thuộc tính, timestamp và trace context"
      - "Các trường của span gồm tên, loại, trạng thái, thuộc tính, sự kiện và liên kết"
      - "Các loại metric gồm gauge, sum, histogram, exponential histogram và summary"
      - "Datapoint, nhãn, giá trị, timestamp, temporality và exemplars trong điều kiện lọc"
      - "Phân biệt thuộc tính resource, scope và bản ghi để tránh truy cập sai ngữ cảnh"
      - "Ảnh hưởng của semantic conventions và thay đổi tên thuộc tính giữa các phiên bản"
      - "Thu thập mẫu dữ liệu đã khử nhạy cảm để xây dựng và xác minh điều kiện"
  - level1: "Ngữ nghĩa loại bỏ"
    level2:
      - "Điều kiện khớp trong filter processor mang ý nghĩa loại bỏ dữ liệu"
      - "Quan hệ OR giữa các điều kiện loại bỏ và cách kết hợp AND, OR bên trong biểu thức"
      - "Biểu diễn yêu cầu chỉ giữ dữ liệu được phép bằng điều kiện loại bỏ phần bù"
      - "Phủ định điều kiện và xử lý ngoại lệ để tránh mở rộng tập dữ liệu bị xóa"
      - "Phạm vi tác động khi lọc span, sự kiện span, metric, datapoint và log record"
      - "Quan hệ giữa lọc đối tượng cha và các đối tượng con đi kèm"
      - "Phân biệt dữ liệu không khớp điều kiện với dữ liệu không thể đánh giá điều kiện"
      - "Hành vi khi đối tượng chứa dữ liệu trở nên rỗng sau khi lọc và cách kiểm chứng"
  - level1: "Thiết kế chính sách"
    level2:
      - "Chuyển yêu cầu nghiệp vụ thành điều kiện có đầu vào, phạm vi và kết quả rõ ràng"
      - "Xây dựng danh sách loại bỏ và danh sách cho phép theo mức độ tin cậy của nguồn"
      - "Thiết kế bảng quyết định cho tổ hợp dịch vụ, môi trường, loại tín hiệu và ngoại lệ"
      - "Tách chính sách giảm nhiễu, giảm chi phí và bảo vệ dữ liệu theo mục đích kiểm soát"
      - "Giữ tín hiệu lỗi, audit và giao dịch quan trọng bằng ngoại lệ có giới hạn"
      - "Phát hiện xung đột giữa các quy tắc và quy tắc khiến dữ liệu bị loại bỏ ngoài ý muốn"
      - "Lựa chọn hành vi khi thiếu thuộc tính hoặc xuất hiện giá trị chưa được phân loại"
      - "Ghi nhận chủ sở hữu, lý do, thời hạn và bằng chứng cho từng nhóm quy tắc"
  - level1: "OTTL căn bản"
    level2:
      - "Vai trò của OpenTelemetry Transformation Language trong biểu thức điều kiện lọc"
      - "Ngữ cảnh OTTL cho span, span event, metric, datapoint và log record"
      - "Truy cập đường dẫn thuộc tính, trường dữ liệu và hằng số phù hợp với ngữ cảnh"
      - "Biểu diễn chuỗi, số, boolean, nil và khóa thuộc tính trong biểu thức"
      - "Sử dụng phép so sánh, and, or, not và dấu ngoặc để diễn đạt điều kiện"
      - "Phân biệt biểu thức boolean dùng để lọc với câu lệnh biến đổi dữ liệu"
      - "Viết điều kiện nhiều dòng và bảo toàn dấu nháy khi nhúng OTTL trong YAML"
      - "Đọc lỗi cú pháp và xác định trường hoặc hàm không được hỗ trợ trong ngữ cảnh"
  - level1: "OTTL nâng cao"
    level2:
      - "Kết hợp điều kiện trên resource và bản ghi để thu hẹp phạm vi loại bỏ"
      - "So khớp chuỗi chính xác, tiền tố và mẫu biểu thức chính quy theo khả năng hỗ trợ"
      - "Kiểm tra tập giá trị và nhóm thuộc tính để giảm biểu thức lặp lại"
      - "Lọc body có cấu trúc, bản đồ lồng nhau và mảng với hàm phù hợp kiểu dữ liệu"
      - "Chuyển đổi kiểu có kiểm soát khi nguồn phát không thống nhất cách biểu diễn dữ liệu"
      - "Xây dựng điều kiện kết hợp tên metric, loại metric và thuộc tính datapoint"
      - "Giới hạn suy luận từ dữ liệu cục bộ khi điều kiện không có trạng thái toàn bộ trace"
      - "Kiểm chứng danh sách hàm, đường dẫn và cú pháp với đúng bản phân phối Collector"
  - level1: "Điều kiện an toàn"
    level2:
      - "Kiểm tra nil và sự tồn tại của trường trước khi so sánh hoặc truy cập giá trị"
      - "Xử lý khác biệt giữa chuỗi rỗng, thuộc tính thiếu và giá trị không hợp lệ"
      - "Kiểm tra kiểu trước khi áp dụng regex, truy cập body hoặc chuyển đổi giá trị"
      - "Thiết kế điều kiện chịu được thay đổi schema và nguồn telemetry không đồng nhất"
      - "Giới hạn độ phức tạp của regex và tránh mẫu khớp quá rộng"
      - "Tránh phụ thuộc vào dữ liệu có thể bị giả mạo để cấp ngoại lệ giữ hoặc loại bỏ"
      - "Đánh giá hành vi khi lỗi biểu thức xảy ra đối với chính sách bảo vệ dữ liệu nhạy cảm"
      - "Rà soát điều kiện luôn đúng, luôn sai và tổ hợp phủ định gây xóa hàng loạt"
  - level1: "Filter processor"
    level2:
      - "Xác minh thành phần filter processor có trong bản phân phối Collector đang sử dụng"
      - "Khai báo các instance filter processor với tên phản ánh mục đích chính sách"
      - "Cấu hình traces.span và traces.spanevent theo đúng ngữ cảnh dữ liệu"
      - "Cấu hình metrics.metric và metrics.datapoint theo phạm vi cần loại bỏ"
      - "Cấu hình logs.log_record để đánh giá từng bản ghi log"
      - "Lựa chọn error_mode và đánh giá hệ quả của ignore, silent và propagate"
      - "Gắn processor vào service.pipelines và xác minh instance được tham chiếu đúng"
      - "Đối chiếu cấu hình OTTL với cấu hình cũ và kế hoạch nâng cấp tương thích"
  - level1: "Lọc log"
    level2:
      - "Loại bỏ log theo severity cùng ngoại lệ cho lỗi và sự kiện cần điều tra"
      - "Lọc log health check, readiness, liveness và truy cập định kỳ ít giá trị"
      - "Lọc theo dịch vụ, môi trường, instrumentation scope và nguồn thu thập"
      - "Lọc theo nội dung body và thuộc tính có cấu trúc mà không phụ thuộc định dạng hiển thị"
      - "Xử lý log thiếu severity và khác biệt giữa severity text với severity number"
      - "Giữ log có trace context hoặc dấu hiệu lỗi theo chính sách tương quan đã xác định"
      - "Lọc luồng log lặp lại theo dấu hiệu nhận diện và giới hạn của cơ chế không có trạng thái"
      - "Bảo vệ log audit, bảo mật và sự kiện hiếm trước các quy tắc giảm nhiễu diện rộng"
  - level1: "Lọc span"
    level2:
      - "Loại bỏ span theo tên thao tác, span kind, dịch vụ và môi trường"
      - "Lọc span của health check, endpoint nội bộ và lưu lượng kiểm thử có nhận diện rõ ràng"
      - "Lọc span truy cập HTTP theo route chuẩn hóa thay vì URL chứa định danh động"
      - "Lọc span gọi cơ sở dữ liệu hoặc messaging có giá trị thấp theo thuộc tính đáng tin cậy"
      - "Phân biệt span status với mã phản hồi HTTP khi thiết kế ngoại lệ giữ lỗi"
      - "Giữ span chậm và span lỗi bằng tiêu chí phù hợp với dữ liệu sẵn có"
      - "Phân tích tác động khi loại bỏ span gốc, span trung gian và span lá"
      - "Giới hạn của filter processor khi yêu cầu giữ hoặc loại bỏ nhất quán toàn bộ trace"
  - level1: "Lọc sự kiện span"
    level2:
      - "Phân biệt loại bỏ sự kiện span với loại bỏ span chứa sự kiện"
      - "Thiết kế điều kiện theo tên và thuộc tính của span event"
      - "Lọc các sự kiện chẩn đoán lặp lại gây tăng kích thước trace"
      - "Giữ exception event và dữ liệu cần thiết để tái dựng chuỗi nguyên nhân lỗi"
      - "Kiểm tra ảnh hưởng của sự kiện chứa dữ liệu nhạy cảm khi span vẫn được giữ lại"
      - "Xác minh trường dữ liệu cha có thể truy cập từ ngữ cảnh spanevent"
      - "Phân biệt sự kiện span với span link và giới hạn lọc liên kết trong processor"
      - "Đo thay đổi số lượng sự kiện, kích thước span và giá trị chẩn đoán sau khi lọc"
  - level1: "Lọc metric"
    level2:
      - "Loại bỏ toàn bộ metric theo tên, loại, resource và instrumentation scope"
      - "Thiết kế danh sách metric cần giữ cho SLO, cảnh báo và giám sát tài nguyên"
      - "Loại bỏ metric thử nghiệm, trùng nguồn và metric không có người sử dụng"
      - "Xử lý tên metric và semantic conventions thay đổi theo thư viện instrumentation"
      - "Phân biệt giảm số metric với giảm số chuỗi thời gian và giảm cardinality"
      - "Đánh giá hệ quả khi loại bỏ histogram dùng cho phân vị và phân tích độ trễ"
      - "Kiểm tra đơn vị, tính đơn điệu và temporality trước khi chọn chính sách loại bỏ"
      - "Phát hiện dashboard, recording rule và cảnh báo phụ thuộc vào metric bị lọc"
  - level1: "Lọc datapoint"
    level2:
      - "Loại bỏ datapoint theo nhãn, resource và điều kiện kết hợp với tên metric"
      - "Giảm chuỗi thời gian của route, tenant hoặc môi trường ngoài phạm vi theo dõi"
      - "Phân biệt lọc datapoint với xóa nhãn và tổng hợp lại chuỗi thời gian"
      - "Rủi ro khi lọc theo giá trị, đặc biệt với giá trị bằng không và dữ liệu hiếm"
      - "Ảnh hưởng của datapoint bị thiếu tới counter, phép tính rate và cửa sổ đánh giá"
      - "Ảnh hưởng khác nhau của dữ liệu bị lọc đối với temporality delta và cumulative"
      - "Bảo toàn một datapoint histogram cùng các thành phần count, sum và bucket"
      - "Kiểm tra khoảng trống dữ liệu, chuỗi thời gian biến động và hành vi khi hết datapoint"
  - level1: "Bảo toàn tương quan"
    level2:
      - "Nhận diện span mồ côi và trace không đầy đủ khi span cha bị loại bỏ"
      - "Đánh giá ảnh hưởng tới service map, critical path và phân tích phụ thuộc dịch vụ"
      - "Kiểm tra liên kết từ log đến trace khi trace hoặc span đích đã bị lọc"
      - "Kiểm tra exemplars của metric trỏ đến trace không còn tồn tại"
      - "Phối hợp lọc với head sampling và tail sampling theo mục tiêu giữ bằng chứng lỗi"
      - "Lựa chọn thứ tự lọc và tổng hợp span metrics để xác định tập dữ liệu được đếm"
      - "Đo sai lệch tỷ lệ lỗi và phân bố độ trễ do giữ hoặc loại bỏ dữ liệu có chọn lọc"
      - "Thiết lập ngân sách mất tương quan và tiêu chí chấp nhận trace không đầy đủ"
  - level1: "Dữ liệu nhạy cảm"
    level2:
      - "Phân loại thông tin định danh, thông tin xác thực, bí mật và dữ liệu nghiệp vụ nhạy cảm"
      - "Kiểm kê vị trí dữ liệu nhạy cảm trong resource, thuộc tính, body, event và nhãn metric"
      - "Lựa chọn loại bỏ toàn bộ bản ghi hoặc xử lý từng trường theo mục đích sử dụng"
      - "Nhận diện token, cookie, header, query string và câu lệnh cơ sở dữ liệu có nguy cơ lộ dữ liệu"
      - "Kết hợp lọc với redaction và transform processor khi cần giữ phần telemetry an toàn"
      - "Giới hạn của regex nhận diện dữ liệu nhạy cảm và rủi ro bỏ sót hoặc khớp nhầm"
      - "Kiểm soát dữ liệu nhạy cảm trong log chẩn đoán Collector, dữ liệu đệm và nhánh xuất phụ"
      - "Kiểm chứng điểm chặn dữ liệu trước ranh giới truyền và lưu trữ được phép"
  - level1: "Thứ tự processor"
    level2:
      - "Đặt bộ lọc trong quan hệ với memory limiter, batch processor và chi phí xử lý"
      - "Làm giàu resource trước khi lọc khi điều kiện cần thuộc tính được bổ sung"
      - "Chuẩn hóa tên và kiểu dữ liệu trước khi đánh giá quy tắc phụ thuộc schema"
      - "Lựa chọn thứ tự lọc và che giấu dữ liệu khi điều kiện cần nhận diện trường gốc"
      - "Phân tích tác động của lọc trước hoặc sau processor lấy mẫu trace"
      - "Phân tích tác động của lọc trước hoặc sau connector tạo metric từ span"
      - "Sắp xếp nhiều instance filter processor và kiểm tra hiệu ứng loại bỏ tích lũy"
      - "Xác minh telemetry nội bộ của Collector được bảo vệ trong pipeline thu thập chính nó"
  - level1: "Pipeline nhiều nhánh"
    level2:
      - "Áp dụng chính sách lọc thống nhất khi một receiver cấp dữ liệu cho nhiều pipeline"
      - "Thiết kế chính sách riêng cho backend vận hành, phân tích và lưu trữ dài hạn"
      - "Xác định thứ tự định tuyến và lọc khi có connector hoặc cơ chế phân nhánh"
      - "Ngăn xuất dữ liệu nhạy cảm qua nhánh chưa có kiểm soát tương đương"
      - "Tách chính sách theo tenant và kiểm tra nguy cơ dữ liệu vượt ranh giới tenant"
      - "Thiết kế nhánh đối chứng để đo hiệu ứng lọc bằng dữ liệu tổng hợp hoặc đã khử nhạy cảm"
      - "Kiểm tra thay đổi cấu hình dùng chung ảnh hưởng tới nhiều pipeline và exporter"
      - "Đối chiếu lưu lượng đầu ra từng nhánh để phát hiện lọc thiếu hoặc lọc trùng"
  - level1: "Triển khai đa tầng"
    level2:
      - "Phân chia trách nhiệm lọc tại SDK, agent Collector và gateway Collector"
      - "Giảm dữ liệu truyền từ ứng dụng tới gateway bằng điều kiện có thể đánh giá tại nguồn"
      - "Áp dụng chính sách tập trung tại gateway cho các nguồn telemetry không đồng nhất"
      - "Đảm bảo thuộc tính cần thiết tồn tại tại tầng thực thi điều kiện"
      - "Kiểm soát xung đột và tác động cộng dồn khi một tín hiệu đi qua nhiều tầng lọc"
      - "Phân phối cấu hình nhất quán giữa các replica và phát hiện lệch phiên bản chính sách"
      - "Kiểm tra hành vi khi mở rộng, thay thế instance và chuyển vùng nhận telemetry"
      - "Xác định ranh giới bảo vệ dữ liệu khi kết hợp Kubernetes, máy ảo và dịch vụ được quản lý"
  - level1: "Tối ưu chi phí"
    level2:
      - "Đo dung lượng, số log, số span, số datapoint và số chuỗi thời gian trước và sau lọc"
      - "Ước tính tiết kiệm ingest, lưu trữ, truy vấn và truyền mạng theo cách tính phí thực tế"
      - "Xác định nguồn chi phí lớn theo dịch vụ, loại tín hiệu và nhóm quy tắc"
      - "Đánh giá giảm nhiễu so với mất độ bao phủ khi tăng mức loại bỏ"
      - "Phân biệt giảm số bản ghi, giảm kích thước bản ghi và giảm cardinality"
      - "Tính chi phí CPU, bộ nhớ và vận hành bổ sung của chính sách lọc"
      - "So sánh lọc với sampling, tổng hợp và thay đổi instrumentation cho cùng mục tiêu"
      - "Xây dựng báo cáo hiệu quả chi phí kèm chỉ số chất lượng điều tra và cảnh báo"
  - level1: "Hiệu năng và tải"
    level2:
      - "Đo thời gian xử lý điều kiện trên từng loại telemetry và kích thước batch"
      - "So sánh chi phí kiểm tra thuộc tính đơn giản với regex và body có cấu trúc lớn"
      - "Đo ảnh hưởng của số lượng quy tắc và khả năng kết thúc đánh giá điều kiện sớm"
