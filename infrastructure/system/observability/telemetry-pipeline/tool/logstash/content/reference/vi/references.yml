references:
  - title: "Getting started with Logstash"
    url: "https://www.elastic.co/docs/reference/logstash/getting-started-with-logstash"
    description: "Hướng dẫn cài đặt, chạy Logstash và thực hành pipeline xử lý log đầu tiên."
  - title: "Structure of a pipeline"
    url: "https://www.elastic.co/docs/reference/logstash/configuration-file-structure"
    description: "Cấu trúc input, filter, output, cú pháp plugin và kiểu giá trị trong pipeline config."
  - title: "Creating a Logstash Pipeline"
    url: "https://www.elastic.co/docs/reference/logstash/creating-logstash-pipeline"
    description: "Ví dụ tạo cấu hình pipeline và chạy một luồng sự kiện đơn giản."
  - title: "Accessing event data and fields"
    url: "https://www.elastic.co/docs/reference/logstash/event-dependent-configuration"
    description: "Tham chiếu field, điều kiện xử lý và cấu hình phụ thuộc dữ liệu event."
  - title: "Filter plugins"
    url: "https://www.elastic.co/docs/reference/logstash/plugins/filter-plugins"
    description: "Danh mục bộ lọc để parse, biến đổi, làm giàu và chuẩn hóa event."
  - title: "Grok filter plugin"
    url: "https://www.elastic.co/docs/reference/logstash/plugins/plugins-filters-grok"
    description: "Parse log phi cấu trúc bằng pattern và phân biệt với Dissect."
  - title: "Dissect filter plugin"
    url: "https://www.elastic.co/docs/reference/logstash/plugins/plugins-filters-dissect"
    description: "Tách log có định dạng ổn định bằng delimiter và lựa chọn so với Grok."
  - title: "Persistent queues"
    url: "https://www.elastic.co/docs/reference/logstash/persistent-queues"
    description: "Cấu hình hàng đợi bền vững để hấp thụ lưu lượng đột biến và giảm rủi ro mất dữ liệu."
  - title: "Dead letter queues"
    url: "https://www.elastic.co/docs/reference/logstash/dead-letter-queues"
    description: "Theo dõi và xử lý sự kiện lỗi không thể lập chỉ mục hoặc lỗi đánh giá điều kiện."
  - title: "Monitoring Logstash with APIs"
    url: "https://www.elastic.co/docs/reference/logstash/monitoring-logstash"
    description: "Các API thống kê node, plugin và pipeline để giám sát throughput và hiệu năng."
  - title: "Secrets keystore for secure settings"
    url: "https://www.elastic.co/docs/reference/logstash/keystore"
    description: "Lưu thông tin bí mật cho cấu hình Logstash thay vì ghi trực tiếp mật khẩu vào pipeline."