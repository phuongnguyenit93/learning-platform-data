menu:
- level1: Tổng quan
  level2:
  - Datadog là gì và giải quyết bài toán quan sát hệ thống nào
  - Vị trí của Datadog trong kiến trúc ứng dụng và hạ tầng
  - Metrics, logs, traces, profiles và sự kiện thay đổi
  - Phân biệt monitoring, observability và quy trình điều tra sự cố
  - Quan hệ giữa Agent, SDK, integration và nền tảng SaaS
  - Luồng dữ liệu từ nguồn phát sinh đến truy vấn và cảnh báo
  - Quan sát từ hạ tầng đến dịch vụ và trải nghiệm người dùng
  - Ranh giới giữa năng lực quan sát và các sản phẩm bảo mật mở rộng
  - Lộ trình học và kiến thức nền về hệ điều hành, mạng, JVM và cloud
- level1: Tổ chức và môi trường
  level2:
  - Datadog site, organization và cách chọn endpoint tương ứng
  - Phạm vi dữ liệu giữa site, organization và môi trường ứng dụng
  - Tổ chức tài khoản cho phát triển, kiểm thử và production
  - Phân biệt API key, application key và client token
  - Vai trò người dùng, nhóm và tài khoản dịch vụ
  - Kiểm tra quyền sử dụng sản phẩm và mức khả dụng theo site
  - Điều hướng giao diện, tìm kiếm chung và bộ chọn thời gian
  - Chuẩn bị môi trường thực hành và dữ liệu không nhạy cảm
- level1: Datadog Agent
  level2:
  - Kiến trúc core Agent, Trace Agent, Process Agent và system-probe
  - Cài đặt Agent trên Linux, Windows và macOS
  - Tổ chức datadog.yaml, conf.d và cấu hình integration
  - Cấu hình API key, DD_SITE và biến môi trường
  - Quản lý dịch vụ Agent và quyền truy cập tài nguyên
  - Kết nối qua proxy, TLS và các endpoint gửi dữ liệu
  - Đọc trạng thái Agent và danh sách check đang chạy
  - Kiểm tra cấu hình bằng status, configcheck và check
  - Quản lý phiên bản, nâng cấp và Fleet Automation
- level1: Thu thập đầu tiên
  level2:
  - Dựng ứng dụng thử nghiệm và Agent trong môi trường riêng
  - Xác minh host và system metrics xuất hiện trên Datadog
  - Gửi một custom metric bằng DogStatsD
  - Thu thập JSON log từ một tệp ứng dụng
  - Gửi trace của một yêu cầu HTTP từ ứng dụng Java
  - Tìm cùng dịch vụ qua metrics, logs và traces
  - Tạo dashboard và monitor thử nghiệm cho luồng dữ liệu
  - Phân biệt dữ liệu chưa phát sinh, đang trễ và bị lỗi thu thập
- level1: Tags và định danh
  level2:
  - Tags dạng key:value và vai trò trong lọc, tổng hợp, phân quyền
  - Unified Service Tagging với env, service và version
  - Tags ở host, container, pod, integration và ứng dụng
  - Ánh xạ Kubernetes labels và Docker labels sang tags
  - Host name, host alias và tránh nhận diện trùng máy chủ
  - Định danh service, resource, operation và phiên bản triển khai
  - Quy ước team, region, cluster và namespace
  - Tránh xung đột tag, thiếu tag và giá trị không nhất quán
  - Cardinality và tác động của user_id, request_id đến metrics
- level1: Tích hợp dữ liệu
  level2:
  - Phân biệt Agent-based, API-based và cloud integration
  - Kích hoạt integration và xác minh dữ liệu thực sự được nhận
  - Cấu trúc init_config, instances và quyền truy cập dịch vụ
  - Autodiscovery và cấu hình theo container hoặc workload
  - Thu thập Prometheus/OpenMetrics bằng integration tương ứng
  - Thu thập JMX bằng JMXFetch
  - Tích hợp MySQL, PostgreSQL, Redis, Kafka và NGINX
  - Viết custom Agent check khi chưa có integration phù hợp
  - Kiểm soát khoảng thu thập, timeout và số instance
  - Đánh giá integration cộng đồng, phiên bản và trách nhiệm vận hành
- level1: Mô hình metrics
  level2:
  - Metric name, điểm dữ liệu, timestamp, tags và chuỗi thời gian
  - Phân biệt kiểu gửi dữ liệu và kiểu metrics trong giao diện
  - Gauge, count và rate trong dữ liệu đo lường
  - Histogram tại Agent và distribution tổng hợp trên hệ thống
  - Set, timer và cách ánh xạ từ StatsD/DogStatsD
  - Đơn vị, metadata và ý nghĩa của metric
  - Metrics hạ tầng, integration metrics và custom metrics
  - Phân biệt missing data, giá trị zero và dữ liệu đến trễ
  - Độ phân giải, lưu giữ dữ liệu và rollup theo thời gian
- level1: Metrics tùy chỉnh
  level2:
  - Thiết kế metric từ câu hỏi nghiệp vụ hoặc vận hành
  - Gửi metrics qua DogStatsD bằng UDP
  - Sử dụng Unix Domain Socket và nhận diện nguồn gửi khi được hỗ trợ
  - Namespace, tags, sample rate và cơ chế gom dữ liệu tại client
  - Chọn count, gauge, histogram hoặc distribution đúng ngữ nghĩa
  - Gửi metrics qua HTTP API và hiểu trách nhiệm tổng hợp
  - Thu thập Micrometer metrics bằng DogStatsD hoặc Datadog registry
  - Thu thập endpoint OpenMetrics của ứng dụng
  - Tạo metrics từ log hoặc span và hiểu tập dữ liệu đầu vào
  - Kiểm tra mất gói, queue đầy và chi phí do cardinality
- level1: Truy vấn metrics
  level2:
  - Cấu trúc truy vấn metrics và bộ lọc theo tags
  - Tổng hợp theo không gian và nhóm theo host, service, region
  - Tổng hợp theo thời gian và lựa chọn rollup
  - Phân biệt as_count, as_rate, rate và derivative
  - Công thức nhiều truy vấn và tính tỷ lệ lỗi đúng mẫu số
  - Percentile của distribution và giới hạn của trung bình percentile
  - Xử lý interpolation, fill, default_zero và dữ liệu thưa
  - Top list, xếp hạng và so sánh theo nhóm
  - Timeshift, smoothing, anomaly và forecast trong phân tích
  - Kiểm tra chênh lệch kết quả giữa dashboard và monitor
- level1: Thu thập logs
  level2:
  - Chọn Agent, cloud forwarder, HTTP API hoặc collector trung gian
  - Bật log collection và cấu hình nguồn tệp
  - Gán service, source, status, host và tags cho log
  - Thu thập stdout, stderr và log từ container
  - Ghép nhiều dòng và stack trace Java tại nguồn thu thập
  - Theo dõi vị trí đọc, log rotation và tệp bị truncate
  - Lọc include/exclude và che nội dung trước khi gửi
  - Thu thập Kubernetes logs theo workload
  - Tiếp nhận log từ AWS, Azure và Google Cloud
  - Kiểm tra timestamp, mã hóa và giới hạn kích thước bản ghi
- level1: Xử lý logs
  level2:
  - Vòng đời ingestion, pipeline, processor và indexing
  - Thứ tự pipeline và bộ lọc chọn bản ghi
  - Tự động phân tích JSON và dùng Grok cho log văn bản
  - Viết, thử và bảo trì quy tắc Grok với mẫu dữ liệu
  - Chuẩn hóa timestamp bằng Date Remapper
  - Chuẩn hóa service, status, message và trace ID
  - Trích xuất thuộc tính, đổi tên trường và chuyển kiểu
  - Bổ sung dữ liệu bằng lookup và bảng tham chiếu
  - Phân biệt xử lý tại Agent, Observability Pipelines và phía Datadog
  - Kiểm chứng log trước sau xử lý và tránh mất trường quan trọng
- level1: Phân tích logs
  level2:
  - Phân biệt Live Tail và Log Explorer
  - Tìm kiếm văn bản, thuộc tính, tags và cú pháp boolean
  - Sử dụng facet và measure đúng mục đích
  - Lọc theo thời gian, service, environment và mức lỗi
  - Tổng hợp thành timeseries, top list và bảng
  - Phát hiện mẫu log lặp lại bằng Patterns
  - Tạo saved view và chia sẻ ngữ cảnh truy vấn
  - Đi từ log đến trace, host, container và source code
  - Tạo log-based metric, dashboard và monitor từ truy vấn
  - Điều tra log không tìm thấy dù Agent đã gửi
- level1: Lưu trữ logs
  level2:
  - Phân biệt log được nhận, được index và được archive
  - Thiết kế index, thứ tự định tuyến và thời gian lưu giữ
  - Exclusion filter, sampling và quota theo index
  - Đánh giá Standard Indexing và Flex Logs theo workload
  - Archive sang lưu trữ đối tượng trên cloud
  - Tìm dữ liệu trực tiếp bằng Archive Search khi khả dụng
  - Rehydrate dữ liệu và sử dụng historical view
  - Quyền truy cập archive, historical view và dữ liệu được phục hồi
  - Đánh đổi khả năng tìm kiếm, thời gian truy cập và mức sử dụng
  - Kiểm chứng thay đổi retention mà không suy diễn dữ liệu còn tồn tại
- level1: Observability Pipelines
  level2:
  - Khi nào cần xử lý telemetry trong hạ tầng của mình
  - Vai trò của control plane và Observability Pipelines Worker
  - Kết nối source, processor và destination được hỗ trợ
  - Phân tích, bổ sung trường, lọc và che dữ liệu tại Worker
  - Định tuyến đến Datadog, kho lưu trữ và các đích khác
  - Xử lý logs và metrics theo khả năng của phiên bản Worker
  - Buffer bộ nhớ, buffer đĩa và áp lực ngược
  - Hành vi khi đích chậm, buffer đầy hoặc Worker khởi động lại
  - Triển khai, nâng cấp và giám sát sức khỏe pipeline
- level1: Thu thập traces
  level2:
  - Trace, span, parent span, service, resource và operation
  - Phân biệt instrumentation tự động và thủ công
  - Cài Datadog SDK theo ngôn ngữ và runtime
  - Kết nối ứng dụng với Trace Agent
  - Truyền context qua HTTP và W3C Trace Context
  - Truyền context qua hàng đợi và tác vụ bất đồng bộ
  - Thêm span, tag, lỗi và sự kiện tại điểm nghiệp vụ
  - Chuẩn hóa tên resource và tránh URL có cardinality cao
  - Liên kết trace với logs và runtime metrics
  - Kiểm tra dữ liệu nhạy cảm trong headers, tags và payload
- level1: Phân tích APM
  level2:
  - Đọc trang dịch vụ và các chỉ số request, error, duration
  - Phân tích endpoint và resource có độ trễ cao
  - Đọc flame graph, waterfall và cây span
  - Phân biệt thời gian của span, thời gian chờ và thời gian tự xử lý
  - Tìm kiếm span bằng Trace Explorer
  - So sánh Live Search với dữ liệu đã được index
  - Tổng hợp spans theo thuộc tính và tạo phân tích
  - Tìm trace theo quan hệ giữa nhiều spans
  - Theo dõi dependency map và tác động đến dịch vụ liên quan
  - Phân tích phiên bản triển khai và thay đổi hiệu năng
- level1: Sampling và retention
  level2:
  - Phân biệt thu thập, ingestion sampling và retention filtering
  - Kiểm soát ingestion tại SDK, Agent và theo dịch vụ
  - Sampling ở đầu trace và theo kết quả trace
  - Quy tắc giữ trace lỗi, trace chậm và luồng nghiệp vụ quan trọng
  - Phân biệt lấy mẫu cả trace và giữ riêng spans
  - Custom retention filter và intelligent retention
  - Thứ tự filter và khả năng tìm kiếm từng span
  - Trace metrics, span-based metrics và ảnh hưởng của lấy mẫu
  - Ảnh hưởng của sampling đến liên kết logs, RUM và traces
  - Đo volume, chất lượng dữ liệu và hiệu quả sau thay đổi
- level1: Java và Spring Boot
  level2:
  - Kiểm tra hỗ trợ JDK, framework và thư viện Java
  - Khởi chạy JVM với dd-java-agent.jar
  - Cấu hình DD_SERVICE, DD_ENV, DD_VERSION và địa chỉ Agent
  - Quan sát Spring MVC, WebFlux và lời gọi HTTP client
  - Quan sát JDBC, connection pool, Redis và Kafka
  - JVM runtime metrics, heap, GC và luồng thực thi
  - Tương quan Logback hoặc Log4j2 với trace
  - Custom spans và OpenTelemetry API với Datadog SDK
  - Quan sát Executor, CompletableFuture và reactive context
  - Kết hợp Micrometer, JMX và tracing mà tránh ghi trùng dữ liệu
  - Phân tích một yêu cầu chậm từ HTTP đến truy vấn SQL
- level1: Profiling liên tục
  level2:
  - Continuous Profiler bổ sung gì cho APM và metrics
  - Điều kiện hỗ trợ theo ngôn ngữ, nền tảng và phiên bản
  - Bật profiling trong ứng dụng Java
  - Phân biệt CPU time, wall-clock time và các kiểu profile
  - Điều tra cấp phát bộ nhớ, contention và phương thức tốn tài nguyên
  - Đọc flame graph và so sánh profile theo thời gian
  - Liên kết profile với service, version và trace
  - Phân biệt Datadog Profiler và JFR theo nền tảng
  - Đánh giá chi phí thu thập và ảnh hưởng đến ứng dụng
- level1: Gỡ lỗi ứng dụng
  level2:
  - Error Tracking và cách nhóm lỗi theo dấu vết
  - Theo dõi lỗi mới, lỗi tái xuất hiện và phiên bản bị ảnh hưởng
  - Liên kết lỗi với logs, traces, RUM và source code
  - Dynamic Instrumentation và điều kiện bật tính năng
  - Thêm log probe, metric probe và span probe khi được hỗ trợ
  - Điều kiện kích hoạt, giới hạn tần suất và thời gian thu thập
  - Kiểm soát biến cục bộ, dữ liệu nhạy cảm và quyền gỡ lỗi
  - Exception Replay và dữ liệu trạng thái tại thời điểm lỗi
  - Gỡ probe sau điều tra và kiểm chứng mức dùng tài nguyên
- level1: OpenTelemetry
  level2:
  - Phân biệt OTel API, SDK, Collector và Datadog SDK
  - Chọn đường tích hợp theo bảng tương thích tính năng
  - Datadog Distribution of OpenTelemetry Collector và DDOT
  - Tiếp nhận OTLP qua Datadog Agent
  - Xuất dữ liệu từ upstream Collector sang Datadog
  - Gửi trực tiếp đến OTLP intake trong trường hợp phù hợp
  - Phân biệt endpoint, giao thức và xác thực của từng đường gửi
  - Ánh xạ resource attributes sang host, service và tags
  - Ánh xạ OTel metrics, histogram và temporality
  - Tạo trace metrics trước sampling và kiểm chứng dữ liệu
  - Di chuyển instrumentation và tránh chạy chồng các SDK
- level1: Hạ tầng và container
  level2:
  - Host Map, host list và phạm vi dữ liệu của từng host
  - Theo dõi CPU, memory, disk I/O, network và filesystem
  - Live Processes và phân tích tiến trình sử dụng tài nguyên
  - Cài Datadog Agent bằng Docker
  - Thu thập container metrics và metadata
  - Autodiscovery qua Docker labels
  - Giới hạn thu thập theo container và image
  - Cấu hình volume, socket và quyền truy cập host
  - Phân biệt tài nguyên host, container và ứng dụng
  - Giám sát mất kết nối Agent và host ngừng gửi dữ liệu
- level1: Kubernetes
  level2:
  - Kiến trúc node Agent, Cluster Agent và Cluster Check Runner
  - Cài đặt bằng Datadog Operator hoặc Helm
  - DatadogAgent resource, values.yaml và Kubernetes Secret
  - Định danh cluster và ánh xạ namespace, pod, workload thành tags
  - Autodiscovery bằng annotations và DatadogInstrumentation khi hỗ trợ
  - Thu thập kubelet metrics, trạng thái workload và events
  - Thu thập logs và APM từ pod ứng dụng
  - Admission Controller và lựa chọn instrumentation tự động
  - Cluster checks, endpoint checks và phân phối workload thu thập
  - Kubernetes Explorer và điều tra restart, pending, OOMKilled
  - Quyền RBAC, security context và giới hạn tài nguyên Agent
  - Giám sát Fargate, Autopilot và các giới hạn môi trường quản lý
- level1: Cloud và serverless
  level2:
