  - Quyền IAM, service account và giới hạn truy cập dữ liệu
  - Thu thập metrics, events, tags và logs từ cloud
  - Tránh đếm trùng tài nguyên và dữ liệu từ nhiều đường thu thập
  - Quan sát AWS Lambda và vai trò extension, SDK, forwarder
  - Điều tra cold start, timeout, lỗi và thời gian thực thi
