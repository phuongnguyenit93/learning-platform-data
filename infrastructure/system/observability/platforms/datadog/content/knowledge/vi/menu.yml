  - Điều kiện system-probe, eBPF và quyền theo hệ điều hành
  - Phân tích lưu lượng theo service, pod, host và availability zone
  - Điều tra latency, retransmission và kết nối thất bại
  - DNS Monitoring và phân biệt timeout với lỗi phân giải
  - Network map và lần theo phụ thuộc chưa được instrument
  - Thu thập thiết bị mạng qua SNMP khi cần
