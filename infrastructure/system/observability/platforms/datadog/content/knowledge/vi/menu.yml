  - Instrument producer và consumer Java theo phiên bản hỗ trợ
  - Truyền context qua message headers
  - Đọc topology, pathway, throughput và payload size
  - Điều tra consumer chậm, backlog và độ trễ lan truyền
  - Liên kết Kafka, RabbitMQ, SQS với ứng dụng và đội sở hữu
  - Kafka Console và quan hệ giữa topic, broker, schema, service
  - Jobs Monitoring trong Data Observability cho tác vụ dữ liệu
- level1: RUM và Session Replay
  level2:
  - Phân biệt trải nghiệm người dùng thực và kiểm thử tổng hợp
  - Khởi tạo Browser RUM SDK và chọn client token đúng phạm vi
  - Views, actions, resources, errors và sessions
  - Theo dõi Core Web Vitals và hiệu năng điều hướng
