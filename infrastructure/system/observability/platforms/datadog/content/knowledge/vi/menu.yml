  - Quyền database tối thiểu và lựa chọn nguồn kết nối
  - Theo dõi query metrics, normalized query và query samples
  - Đọc explain plan và tìm truy vấn chậm
  - Điều tra lock, wait, connection và giới hạn tài nguyên
