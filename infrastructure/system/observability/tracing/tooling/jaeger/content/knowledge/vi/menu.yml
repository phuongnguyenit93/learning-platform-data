menu:
- level1: Tổng quan
  level2:
  - Jaeger là gì và giải quyết bài toán quan sát hệ thống phân tán như thế nào
  - Vị trí của Jaeger trong luồng thu thập, xử lý, lưu trữ và phân tích trace
  - Phân biệt nền tảng truy vết Jaeger với OpenTelemetry API, SDK và Collector
  - Khi nào dùng trace để điều tra lỗi, độ trễ và quan hệ giữa dịch vụ
  - Quan hệ giữa trace, log, metric và mã định danh dùng để đối chiếu
  - 'Các khả năng chính: tìm kiếm, xem trace, phân tích phụ thuộc và giám sát dịch vụ'
  - Giới hạn của dữ liệu truy vết khi thiếu mã theo dõi, bị lấy mẫu hoặc bị mất span
  - Phạm vi Jaeger v2 và cách nhận diện tài liệu, cấu hình dành cho v1
  - Lộ trình học từ môi trường cục bộ đến vận hành Jaeger
  - Chuẩn bị kiến thức nền về HTTP, container và truy vết phân tán
- level1: Dữ liệu truy vết
  level2:
  - Trace, span, trace ID, span ID và quan hệ cha con
  - Tên span, dịch vụ và thao tác trong tìm kiếm của Jaeger
  - Thời điểm bắt đầu, thời lượng và khoảng thời gian của trace
  - Span kind và phân biệt phía gửi, nhận, xử lý nội bộ
  - Thuộc tính có kiểu dữ liệu và cách dùng để mô tả một thao tác
  - Tài nguyên (resource), instrumentation scope và nguồn phát sinh span
  - Trạng thái span, sự kiện và thông tin ngoại lệ
  - Span link và mô hình đồ thị ngoài quan hệ cha con
  - Ánh xạ thuật ngữ OpenTelemetry với tag, log và reference trong định dạng Jaeger cũ
  - Quy ước tên dịch vụ, môi trường, phiên bản và thuộc tính có ích cho điều tra
  - Trace không hoàn chỉnh, span mồ côi và dữ liệu đến muộn
- level1: Kiến trúc Jaeger v2
  level2:
  - Một chương trình Jaeger với nhiều vai trò do cấu hình quyết định
  - Vai trò collector trong tiếp nhận và ghi dữ liệu truy vết
  - Vai trò query trong cung cấp giao diện và API đọc dữ liệu
  - Vai trò ingester khi dữ liệu đi qua Kafka
  - Chế độ all-in-one và trường hợp sử dụng phù hợp
  - Nền tảng OpenTelemetry Collector bên trong Jaeger v2
  - Receiver, processor, exporter, connector và extension liên hệ với nhau ra sao
  - Vai trò của jaeger_storage, jaeger_storage_exporter và jaeger_query
  - Kiến trúc ghi trực tiếp vào kho dữ liệu
  - Kiến trúc collector–Kafka–ingester và các đánh đổi
  - Đặt OpenTelemetry Collector trước Jaeger theo mô hình sidecar, máy chủ hoặc gateway
  - Tách lưu lượng đọc, ghi và phạm vi ảnh hưởng khi thành phần lỗi
- level1: Khởi chạy cục bộ
  level2:
  - Chọn bản phát hành và cố định phiên bản chương trình hoặc container image
  - Chạy Jaeger all-in-one với kho dữ liệu trong bộ nhớ
  - Cổng tiếp nhận OTLP, cổng giao diện và cổng quản trị
  - Ánh xạ cổng, mạng container và phân biệt localhost giữa các tiến trình
  - Gửi trace thử nghiệm bằng ứng dụng mẫu hoặc công cụ sinh dữ liệu
  - Khám phá luồng yêu cầu bằng ứng dụng HotROD
  - Xác minh dữ liệu đi từ ứng dụng đến kết quả tìm kiếm trong Jaeger
  - Chạy Jaeger và ứng dụng thử nghiệm bằng Docker Compose
  - Gắn tệp cấu hình, volume và kiểm tra quyền đọc tệp trong container
  - Khởi động lại và quan sát sự khác biệt giữa bộ nhớ tạm với lưu trữ bền vững
  - Thu thập phiên bản, cấu hình và dữ liệu mẫu để tái hiện kết quả
- level1: Cấu hình
  level2:
  - Cấu trúc YAML của Jaeger v2 theo mô hình OpenTelemetry Collector
  - Khai báo thành phần và kích hoạt chúng trong service.pipelines hoặc service.extensions
  - Định danh type/name và sử dụng nhiều cấu hình cho cùng loại thành phần
  - Khai báo kho dữ liệu và tham chiếu tên kho từ phía ghi, đọc
  - Khai báo jaeger_query cho HTTP, gRPC và giao diện người dùng
  - Địa chỉ lắng nghe, endpoint và phạm vi truy cập mạng
  - Nạp cấu hình bằng --config và ghi đè có kiểm soát bằng --set
  - Tham chiếu biến môi trường trong YAML và giá trị mặc định
  - Phân biệt biến môi trường của SDK với cách cấu hình Jaeger v1
  - Tổ chức cấu hình theo môi trường và tách thông tin bí mật
  - Phát hiện khóa không được hỗ trợ, tham chiếu sai và thành phần chưa kích hoạt
  - Xác minh cấu hình với đúng phiên bản Jaeger trước khi triển khai
- level1: Tiếp nhận dữ liệu
  level2:
  - OTLP/gRPC và OTLP/HTTP trong việc gửi trace vào Jaeger
  - Endpoint /v1/traces, định dạng Protobuf và JSON qua HTTP
  - Chọn giao thức, cổng, đường dẫn và kiểu nội dung khớp nhau
  - Gửi trực tiếp từ SDK so với gửi qua OpenTelemetry Collector
  - Thiết lập timeout, nén, kích thước lô và giới hạn yêu cầu
  - Lỗi trả về từ receiver, cơ chế thử lại và ngân sách đệm ở phía gửi
  - 'Giới hạn tín hiệu: gửi trace vào Jaeger và định tuyến log, metric đến kho phù hợp'
  - Tiếp nhận định dạng Zipkin trong môi trường cần tương thích
  - 'Định dạng Jaeger gRPC, Thrift và UDP cũ: phạm vi tương thích'
  - Kiểm chứng một trace ID qua từng chặng tiếp nhận
  - Đánh giá dữ liệu không hợp lệ, span quá lớn và yêu cầu bị từ chối
- level1: Tích hợp Java
  level2:
  - Lựa chọn OpenTelemetry Java agent, SDK hoặc tích hợp framework để gửi đến Jaeger
  - Gắn Java agent và cấu hình xuất trace qua OTLP
  - Đặt service.name và các thuộc tính tài nguyên cho ứng dụng Java
  - Chọn endpoint và giao thức OTLP phù hợp với Java agent hoặc SDK đang dùng
  - Thiết lập OpenTelemetry Spring Boot starter trong trường hợp phù hợp
  - Micrometer Tracing bridge OpenTelemetry và vai trò của OTLP exporter
  - Phân biệt cấu hình Spring Boot, cấu hình SDK và cấu hình Jaeger
  - Kiểm tra trace HTTP, truy cập cơ sở dữ liệu và lời gọi dịch vụ từ ứng dụng Java
  - Bổ sung span nghiệp vụ có ý nghĩa bằng OpenTelemetry API
  - Tránh span trùng khi kết hợp agent, thư viện và tích hợp framework
  - Ghi trace ID, span ID vào log rồi tra cứu trong Jaeger
  - Xác minh kết thúc span và xuất dữ liệu khi ứng dụng dừng
- level1: Ngữ cảnh truy vết
  level2:
  - Vì sao Jaeger chỉ ghép được luồng phân tán khi ngữ cảnh được truyền đúng
  - W3C traceparent, tracestate và tính tương thích với hệ thống đang tích hợp
  - Định dạng truyền ngữ cảnh Jaeger cũ và giai đoạn chuyển đổi
  - Truyền ngữ cảnh qua HTTP client, server và proxy trung gian
  - Giữ ngữ cảnh khi chuyển luồng, dùng executor hoặc xử lý bất đồng bộ
  - Đọc trace qua hàng đợi thông điệp bằng quan hệ cha con hoặc span link
  - Tác vụ nền, tác vụ tách rời và lựa chọn bắt đầu trace mới
  - Baggage, thuộc tính span và dữ liệu nào xuất hiện trong Jaeger
  - Tránh rò ngữ cảnh hoặc gắn span vào sai yêu cầu
  - Đối chiếu cờ lấy mẫu giữa các dịch vụ trong cùng luồng yêu cầu
  - Chẩn đoán trace bị tách thành nhiều phần hoặc thiếu quan hệ
- level1: Xử lý pipeline
  level2:
  - Thiết kế đường đi từ receiver đến kho dữ liệu
  - Thứ tự processor và ảnh hưởng đến dữ liệu được lưu
  - Gom lô bằng batch processor và đánh đổi với việc xác nhận ghi
  - Memory limiter và cơ chế tạo áp lực ngược khi thiếu bộ nhớ
  - Thêm, sửa, xóa thuộc tính bằng processor phù hợp
  - Chuẩn hóa thuộc tính tài nguyên và bổ sung thông tin môi trường
  - Lọc span, sự kiện và nguy cơ làm đứt quan hệ trong trace
  - Loại bỏ thông tin nhạy cảm trước khi xuất đến kho lưu trữ
  - Chia dữ liệu sang nhiều pipeline và đích xuất
  - Dùng debug exporter để xác định dữ liệu thực tế đi qua pipeline
  - Kết nối pipeline trace với pipeline metric bằng connector
  - Đánh giá thành phần có sẵn và xây dựng bản phân phối tùy chỉnh bằng OCB
- level1: Lấy mẫu
  level2:
  - Vị trí quyết định lấy mẫu và tác động đến dữ liệu quan sát được
  - Lấy mẫu ở đầu trace (head sampling) tại OpenTelemetry SDK
  - Lấy mẫu theo quan hệ cha con và bảo toàn quyết định xuyên dịch vụ
  - Lấy mẫu xác suất và giới hạn số trace theo thời gian
  - Remote sampling và SDK có hỗ trợ giao thức Jaeger
  - Cấu hình remote_sampling theo tệp và chính sách theo dịch vụ, thao tác
  - Lấy mẫu thích ứng (adaptive sampling) theo mục tiêu lưu lượng
  - Quan hệ giữa adaptive_sampling processor, kho chiến lược và remote_sampling
  - Lấy mẫu sau khi thu thập (tail sampling) để ưu tiên trace lỗi hoặc chậm
  - Định tuyến các span cùng trace về cùng nơi quyết định tail sampling
  - Span đến muộn, thời gian chờ và giới hạn bộ nhớ khi lấy mẫu
  - Phối hợp head sampling với tail sampling và các thiên lệch phân tích
  - Kiểm chứng chính sách bằng dữ liệu thử nghiệm thay vì chỉ nhìn số trace
- level1: Tìm kiếm trace
  level2:
  - Chọn dịch vụ và thao tác trong giao diện tìm kiếm
  - Khoảng thời gian tương đối, tuyệt đối và múi giờ khi tra cứu
  - Tìm theo ngưỡng thời lượng tối thiểu, tối đa
  - Tìm theo thuộc tính hoặc tag và kiểm tra khả năng lập chỉ mục của backend
  - Tra cứu trực tiếp bằng trace ID từ log, cảnh báo hoặc ứng dụng
  - Giới hạn số kết quả và phạm vi dữ liệu mà kết quả đại diện
  - Đọc danh sách, biểu đồ phân tán và phân bố thời lượng của kết quả
  - Sắp xếp, thu hẹp tìm kiếm và lựa chọn trace đáng điều tra
  - Chia sẻ đường dẫn tìm kiếm có đủ điều kiện và ngữ cảnh thời gian
  - Phân biệt không có trace với dữ liệu chưa được ghi, chưa tìm thấy hoặc đã hết hạn
  - Ảnh hưởng của sampling, retention và quyền truy cập đến kết quả
- level1: Phân tích trace
  level2:
  - Đọc dòng thời gian (timeline) và biểu đồ Gantt của các span
  - Xem thuộc tính, sự kiện, trạng thái lỗi và thông tin tài nguyên của span
  - Thu gọn, mở rộng, tìm và lọc span trong trace lớn
  - Đối chiếu thời lượng toàn trace với thời lượng từng span
  - Phân biệt lời gọi tuần tự, song song và các khoảng chờ
  - Phân tích đường găng (critical path) của độ trễ toàn yêu cầu
  - Phân biệt thời gian bao hàm và thời gian riêng khi diễn giải chi phí
  - Quan sát trace bằng đồ thị, flame graph và bảng thống kê
  - Theo dõi span link và quan hệ ngoài cây cha con
  - Độ lệch đồng hồ (clock skew), cảnh báo điều chỉnh và giới hạn suy luận thời gian
  - Nhận diện span lỗi, retry, timeout và chuỗi tác động lan truyền
  - Đối chiếu các trace đại diện trước và sau thay đổi của ứng dụng
  - Xem, xuất hoặc nạp dữ liệu JSON để phục vụ điều tra có thể tái hiện
  - Phân biệt bằng chứng trong trace với giả thuyết về nguyên nhân
- level1: Quan hệ dịch vụ
  level2:
  - Sơ đồ System Architecture và ý nghĩa của cạnh phụ thuộc một bước
  - Deep Dependency Graph và quan hệ bắc cầu trong các trace được chọn
  - Chọn dịch vụ trung tâm và mức chi tiết theo dịch vụ hoặc thao tác
  - Vì sao hai cạnh A–B và B–C chưa chứng minh có một luồng A–B–C
  - Dữ liệu đầu vào cần có để tính liên kết phụ thuộc
  - Tính đồ thị trong bộ nhớ so với công việc tổng hợp cho kho phân tán
  - Vai trò của các công cụ tổng hợp phụ thuộc và kiểm tra tương thích phiên bản
  - Ảnh hưởng của cửa sổ thời gian, sampling và mã theo dõi chưa đầy đủ
  - Phát hiện lời gọi vòng, phụ thuộc bất ngờ và phạm vi ảnh hưởng
  - Đối chiếu sơ đồ dịch vụ với trace cụ thể trước khi kết luận
- level1: Giám sát dịch vụ
  level2:
  - Service Performance Monitoring (SPM) và mục đích của tab Monitor
  - 'Chỉ số RED: lưu lượng yêu cầu, tỷ lệ lỗi và thời lượng'
  - Đọc phân vị độ trễ, chỉ số Impact và chọn thao tác cần điều tra
  - Chuyển từ một bất thường trên Monitor đến tập trace liên quan
  - Tạo metric trước bằng spanmetrics connector và kho tương thích PromQL
  - Tính RED trực tiếp từ Elasticsearch/OpenSearch khi cấu hình hỗ trợ
  - Cấu hình kho metric, tham chiếu trong query và bật mục Monitor
  - Bucket thời lượng, đơn vị đo, tên metric và chuẩn hóa cấu hình liên quan
  - Số lượng chuỗi thời gian và kiểm soát độ đa dạng giá trị thuộc tính
  - Ảnh hưởng của sampling, loại span và quy ước trạng thái lỗi đến RED
  - Phân biệt metric suy ra từ span với metric ứng dụng độc lập
  - Chẩn đoán Monitor trống, thiếu thao tác hoặc truy vấn metric thất bại
- level1: Mô hình lưu trữ
  level2:
  - Vai trò kho trace chính, kho archive và kho metric
  - Tiêu chí chọn backend theo quy mô, tìm kiếm, chi phí và vận hành
  - 'Kho trong bộ nhớ: giới hạn dung lượng và vòng đời dữ liệu'
  - 'Badger: lưu trữ nhúng, volume và giới hạn triển khai một nút'
  - OpenSearch và Elasticsearch cho lưu trữ phân tán cùng tìm kiếm
  - Cassandra và các đặc điểm cần đánh giá khi dùng với Jaeger
  - 'ClickHouse: trạng thái hỗ trợ thử nghiệm và yêu cầu xác minh theo phiên bản'
  - Mở rộng backend qua gRPC Remote Storage API
  - Khả năng đọc, ghi, tìm kiếm và tổng hợp phụ thuộc khác nhau giữa backend
  - Retention, TTL và trách nhiệm quản lý vòng đời dữ liệu
  - Chọn và lưu trace vào archive để phục vụ điều tra dài hạn
  - Tách môi trường học tập, kiểm thử và sản xuất trong cấu hình lưu trữ
- level1: OpenSearch và Elasticsearch
  level2:
  - Kết nối Jaeger với cụm lưu trữ và xác minh phiên bản được hỗ trợ
  - Đặt tên, tiền tố chỉ mục và cách ly dữ liệu giữa các môi trường
  - Ánh xạ trường dữ liệu (mapping), template và các xung đột kiểu thuộc tính
  - Shard, replica và chi phí của nhiều chỉ mục nhỏ
  - Chỉ mục theo thời gian, alias và chiến lược rollover
  - Quản lý retention bằng công cụ Jaeger hoặc cơ chế vòng đời tương ứng backend
  - Phân biệt ILM của Elasticsearch với công cụ chính sách của OpenSearch
  - Ghi theo lô qua bulk API và giới hạn kích thước yêu cầu
  - Chế độ write_mode sync, async và ý nghĩa của phản hồi thành công
  - Độ bền dữ liệu khác với thời điểm dữ liệu có thể được tìm kiếm
  - Xử lý span bị từ chối lặp lại và lựa chọn fail, drop hoặc dead-letter
  - Lưu trữ archive, sao lưu và khôi phục chỉ mục
  - Theo dõi sức khỏe cụm, lỗi ghi, độ trễ truy vấn và dung lượng
- level1: Bộ đệm Kafka
  level2:
  - Khi nào thêm Kafka giữa collector và kho trace
  - Cấu hình Kafka exporter ở collector và Kafka receiver ở ingester
  - Chọn định dạng dữ liệu và bảo đảm bên ghi, bên đọc tương thích
  - Topic, partition, consumer group và khả năng chạy nhiều ingester
  - Retention của Kafka và thời gian hấp thụ gián đoạn kho dữ liệu
  - Thời điểm đánh dấu, commit offset và bảo đảm giao ít nhất một lần
  - Consumer lag và phân biệt chậm tiêu thụ với partition bị dừng
  - Chính sách thử lại khi lưu trữ lỗi và ngăn span lỗi chặn toàn partition
  - Gom lô, số partition và các giới hạn thông lượng ingester
  - Phát lại dữ liệu, span trùng và tính lặp lại an toàn của backend
  - Bảo vệ quyền produce, consume và truy cập consumer group
  - Phân biệt Kafka làm bộ đệm với kho dùng để phục vụ truy vấn trace
- level1: Độ bền dữ liệu
  level2:
  - Xác định thế nào là span đã được tiếp nhận, đã xếp hàng và đã lưu
  - Các điểm có thể mất dữ liệu từ SDK đến backend
  - Truyền lỗi ghi ngược qua toàn pipeline đến bên gửi
  - Ảnh hưởng của batch processor đến việc xác nhận trước khi dữ liệu được ghi
  - Exporter queue, wait_for_result và thời điểm trả phản hồi
  - Gom lô tại exporter queue khi cần chờ kết quả ghi
  - Áp lực ngược, giới hạn hàng đợi và lựa chọn chờ hoặc từ chối
  - Ngân sách thử lại phía gửi và phía ingester cho từng mô hình triển khai
  - Lỗi tạm thời, lỗi vĩnh viễn và cách xử lý tài liệu không thể lưu
  - Pipeline dead-letter để giữ span bị từ chối ở cấu hình hỗ trợ
  - Dừng tiến trình, thoát có kiểm soát và dữ liệu còn nằm trong bộ đệm
  - Thử nghiệm kho dữ liệu gián đoạn và đối chiếu trace đã gửi, đã lưu
  - Đánh đổi giữa độ bền, độ trễ, thông lượng và chi phí tài nguyên
- level1: API truy vấn
  level2:
  - Phân biệt API ghi, API đọc, remote sampling và remote storage
  - API QueryService v3 qua gRPC và mô hình dữ liệu dựa trên OTLP
  - API JSON/HTTP v3 và hợp đồng OpenAPI theo phiên bản
  - Lấy trace theo ID và tìm trace bằng điều kiện
  - Tra cứu dịch vụ, thao tác và thông tin phụ thuộc qua giao diện hỗ trợ
  - Phân biệt API stable, internal và deprecated
  - Rủi ro phụ thuộc trực tiếp vào endpoint JSON nội bộ của giao diện
  - Đơn vị thời gian, mã định danh, giới hạn kết quả và xử lý dữ liệu lớn
  - Xác thực, TLS, timeout và lỗi khi gọi API
  - Tạo công cụ điều tra tự động chỉ đọc bằng API có hợp đồng ổn định
- level1: Tùy biến và tích hợp
  level2:
  - Cấu hình UI bằng tệp riêng và tham chiếu trong jaeger_query
  - Tùy chỉnh điều hướng, liên kết và các tùy chọn hiển thị trace
  - Liên kết từ span đến log, dashboard và công cụ nội bộ
  - Mẫu liên kết dựa trên trace ID, thuộc tính và khoảng thời gian
  - Tích hợp Jaeger với Grafana và điều hướng giữa metric, log, trace
  - Nhúng trang tìm kiếm hoặc trace bằng embedded mode
  - Reverse proxy, tiền tố đường dẫn ngoài và base_path mà Jaeger nhận
  - Chia sẻ đường dẫn trace ổn định qua proxy hoặc ingress
  - Quản lý tùy chọn xem JSON, tải trace và hiển thị đường găng
  - Kiểm tra khả năng truy cập dữ liệu khi mở liên kết từ hệ thống khác
- level1: Triển khai Kubernetes
  level2:
  - Chọn mô hình all-in-one hoặc tách collector, query và ingester
  - Triển khai Jaeger v2 bằng Helm chart phù hợp phiên bản
  - Quản lý Jaeger v2 bằng OpenTelemetry Operator
  - Phân biệt tài nguyên triển khai v2 với Jaeger Operator dành cho hệ thống cũ
  - Đưa cấu hình vào ConfigMap và thông tin bí mật vào Secret
  - Service, DNS, ingress và định tuyến riêng cho OTLP cùng query
  - Startup probe, readiness probe và liveness probe
  - Giới hạn CPU, bộ nhớ và nguy cơ OOM hoặc giới hạn thông lượng
  - Persistent volume cho thành phần lưu trữ cục bộ khi sử dụng
  - NetworkPolicy, danh tính workload và quyền truy cập backend
  - Nhân bản, phân bố pod và cập nhật cuốn chiếu
  - Kiểm chứng luồng trace xuyên pod và cấu hình môi trường sau triển khai
- level1: Bảo mật và cách ly
  level2:
  - Xác định dữ liệu nhạy cảm có thể nằm trong thuộc tính, sự kiện và lỗi
  - Giảm dữ liệu thu thập và che thông tin nhạy cảm trước khi lưu
  - TLS và mTLS giữa ứng dụng, collector, query và backend
  - Xác thực cho giao diện, API HTTP và API gRPC
  - Dùng reverse proxy hoặc cổng xác thực và ngăn truy cập đi vòng
  - Chuyển tiếp bearer token, danh tính và giới hạn tin cậy của header
  - Quản lý chứng thư, khóa, mật khẩu và vòng đời thông tin bí mật
  - Cách ly dữ liệu nhiều nhóm bằng cấu hình tenancy và khả năng của backend
  - Phân biệt chọn tenant với xác minh quyền truy cập tenant
  - Quyền đọc trace, quyền ghi trace và quyền quản trị kho dữ liệu
  - Hạn chế truy cập endpoint quản trị, debug, profiling và AI
  - Retention, archive, sao lưu và yêu cầu bảo vệ dữ liệu xuyên vòng đời
- level1: Giám sát Jaeger
  level2:
  - Phân biệt giám sát sức khỏe Jaeger với SPM của ứng dụng
  - Cấu hình telemetry nội bộ cho metric, log và trace
  - Theo dõi span được receiver nhận, từ chối và được exporter gửi
  - Lỗi xuất dữ liệu, độ đầy hàng đợi và dấu hiệu mất span
  - Độ trễ, lưu lượng, lỗi truy vấn và trải nghiệm mở trace
  - CPU, bộ nhớ, garbage collection và goroutine của tiến trình Jaeger
  - Sức khỏe kho dữ liệu, dung lượng, độ trễ ghi và chỉ mục
  - Consumer lag và sức khỏe Kafka khi có tầng đệm
  - Tự truy vết query service và kiểm soát chi phí telemetry
  - Tách endpoint metric nội bộ với metric sinh ra từ spanmetrics
  - Health check và khác biệt giữa tiến trình sống với khả năng phục vụ
  - Dashboard, cảnh báo và ngưỡng gắn với triệu chứng ảnh hưởng người dùng
- level1: Hiệu năng và mở rộng
  level2:
  - Ước lượng số span mỗi giây, kích thước span và dung lượng theo retention
  - Đánh giá tổng chi phí lấy mẫu, truyền dữ liệu, xử lý và lưu trữ
  - Mở rộng collector và query độc lập theo tải đọc, ghi
  - Cân bằng tải, kết nối gRPC dài và phân bố yêu cầu thực tế
  - Điều chỉnh kích thước lô, mức độ ghi đồng thời và hàng đợi
  - Giảm thuộc tính dư thừa, giá trị quá lớn và tên thao tác có độ đa dạng cao
  - Giới hạn bộ nhớ khi xử lý trace lớn hoặc tail sampling
  - Tối ưu tìm kiếm bằng thời gian, điều kiện lọc và số lượng kết quả
  - Đánh giá chi phí dựng trace lớn trên query service và trình duyệt
  - Thiết kế kiểm thử tải có dữ liệu đại diện cùng tỷ lệ lỗi, span đến muộn
  - Nhận diện nút thắt ở collector, Kafka, storage hoặc query
  - Đánh đổi thông lượng với độ bền và khả năng điều tra
- level1: Vận hành và nâng cấp
  level2:
  - Quản lý cấu hình, phiên bản và thay đổi qua quy trình có thể tái hiện
  - Đọc release notes và kiểm tra tương thích giữa Jaeger với backend
  - Sao lưu cấu hình, thông tin phụ thuộc và dữ liệu lưu trữ
  - Chính sách retention, dọn dữ liệu và theo dõi tăng trưởng dung lượng
  - Giới hạn của archive so với một bản sao lưu độc lập
  - Lập kế hoạch nâng cấp query, ingester và collector theo yêu cầu tương thích
  - Thay đổi schema kho dữ liệu, chỉ mục và các bước chuẩn bị
  - Triển khai thử, kiểm chứng trace đầu cuối và điều kiện quay lui
  - Thay backend hoặc môi trường và xác minh khả năng đọc dữ liệu cũ
  - Diễn tập sự cố backend, mất kết nối và phục hồi dịch vụ
  - Lập quy trình xử lý sự cố, trách nhiệm vận hành và bằng chứng cần lưu
- level1: Chuyển đổi từ v1
  level2:
  - Kiểm kê Jaeger client, giao thức xuất và cấu hình đang sử dụng
  - Chuyển mã truy vết từ Jaeger client hoặc OpenTracing sang OpenTelemetry
  - Thay exporter Jaeger cũ bằng OTLP khi thư viện yêu cầu
  - Đối chiếu chương trình đa vai trò v2 với các binary, image v1
  - Chuyển cờ dòng lệnh và biến môi trường v1 sang YAML v2
  - Thay Jaeger agent cũ bằng mô hình thu thập phù hợp
  - Kiểm tra remote sampling, truyền ngữ cảnh và tính liên tục của trace
  - Xác minh tương thích dữ liệu lưu trữ và API đọc mà công cụ đang dùng
  - Chuyển triển khai Kubernetes từ cấu hình operator cũ
  - Chạy kiểm thử tương đương, quan sát dữ liệu thiếu và chuẩn bị quay lui
- level1: Xử lý sự cố
  level2:
  - Khoanh vùng theo chuỗi SDK–mạng–receiver–pipeline–storage–query–UI
  - 'Không có dịch vụ hoặc trace: xác minh đã phát sinh yêu cầu được đo'
  - Sai cổng, sai giao thức OTLP, sai đường dẫn và lỗi kiểu nội dung
  - Không kết nối được do localhost, DNS, TLS, proxy hoặc NetworkPolicy
  - Trace bị thiếu do sampling, lọc dữ liệu hoặc hết ngân sách thử lại
  - Trace bị chia cắt do mất ngữ cảnh hoặc cấu hình propagator khác nhau
  - Span không được lưu do mapping, giới hạn tài liệu hoặc backend quá tải
  - Dữ liệu đã ghi nhưng chưa tìm được do refresh, thời gian, chỉ mục hoặc tenant
  - Query chậm, trace quá lớn và giao diện thiếu bộ nhớ
  - Clock skew, span đến muộn và hiển thị thời gian bất thường
  - Monitor trống hoặc đồ thị phụ thuộc thiếu dữ liệu tổng hợp
  - Kafka lag tăng, partition ngừng tiến và span lỗi lặp lại
  - Dùng metric, log, debug exporter và dữ liệu sinh thử để tìm chặng hỏng
  - Lập báo cáo sự cố kèm phiên bản, cấu hình đã che bí mật và trace ID
- level1: AI và MCP
  level2:
  - Vai trò tùy chọn của MCP server và AI Assistant trong phân tích trace
  - Điều kiện phiên bản và cấu hình bật các bề mặt AI
  - Kết nối MCP client với công cụ đọc dữ liệu truy vết
  - Quy trình thu hẹp từ tìm trace đến sơ đồ, đường găng và span nghi vấn
  - AI Assistant theo mô hình tự cung cấp agent và nhà cung cấp mô hình
  - Vai trò của AG-UI, ACP và cổng trung gian của Jaeger
  - Bổ sung hướng dẫn phân tích riêng cho hệ thống bằng custom skills
  - Xác thực, TLS, quyền truy cập và nguy cơ lộ dữ liệu trace cho agent
  - Đối chiếu kết luận của AI với span và bằng chứng có thể kiểm tra
- level1: Thực hành tổng hợp
  level2:
  - Dựng Jaeger v2 và quan sát trace đầu tiên từ ứng dụng Java
  - Theo dõi một yêu cầu qua nhiều dịch vụ có lời gọi HTTP và cơ sở dữ liệu
  - Bổ sung span nghiệp vụ và tìm trace bằng thuộc tính có ý nghĩa
  - Tái hiện truy vấn chậm, lời gọi lặp và tác vụ chạy song song
  - Điều tra lỗi dây chuyền bằng trace, log và metric liên quan
  - Làm đứt ngữ cảnh có chủ đích rồi chứng minh cách sửa
  - So sánh chính sách head sampling, remote sampling và tail sampling
  - Chuyển kho trong bộ nhớ sang backend bền vững và kiểm tra sau khởi động lại
  - Dựng SPM rồi đi từ chỉ số bất thường đến trace cụ thể
  - Thử nghiệm backend gián đoạn để đánh giá queue, retry và dữ liệu bị mất
  - Dựng tầng Kafka và xác minh xử lý lại khi ingester dừng
  - Triển khai có TLS, xác thực và phạm vi truy cập phù hợp
  - Kiểm thử tải, lập kế hoạch dung lượng và kiểm tra nâng cấp
  - Hoàn thiện hồ sơ điều tra gồm giả thuyết, trace ID, bằng chứng và kết quả xác minh
