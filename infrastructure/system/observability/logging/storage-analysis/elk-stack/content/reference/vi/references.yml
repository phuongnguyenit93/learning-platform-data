references:
  - title: "Elastic Stack — The Stack"
    url: "https://www.elastic.co/docs/get-started/the-stack"
    description: "Tổng quan Elasticsearch, Kibana, Logstash, Elastic Agent và Beats; cách các thành phần ingest, store, search và visualize dữ liệu."
  - title: "Elasticsearch — Ingest Pipelines"
    url: "https://www.elastic.co/docs/manage-data/ingest/transform-enrich/ingest-pipelines"
    description: "Tạo pipeline và processors để parse, transform, remove hoặc enrich từng document trước khi index."
  - title: "Elasticsearch — Mapping"
    url: "https://www.elastic.co/docs/manage-data/data-store/mapping"
    description: "Khai báo kiểu trường và mapping động/tường minh, kiểm soát cách dữ liệu được lưu và đánh chỉ mục."
  - title: "Kibana — Data Views"
    url: "https://www.elastic.co/docs/explore-analyze/find-and-organize/data-views"
    description: "Kết nối Kibana với Elasticsearch indices, data streams hoặc aliases để Discover và Lens truy vấn dữ liệu."
  - title: "Kibana — Discover"
    url: "https://www.elastic.co/docs/explore-analyze/discover"
    description: "Tìm kiếm và lọc log/document, xem cấu trúc field, phân tích dữ liệu bằng KQL, Lucene hoặc ES|QL."
  - title: "Elasticsearch — Index Lifecycle Management"
    url: "https://www.elastic.co/docs/manage-data/lifecycle/index-lifecycle-management"
    description: "Quản lý vòng đời index qua các phase, rollover, retention và tier để cân bằng hiệu năng với chi phí."
  - title: "Elasticsearch — Snapshot and Restore"
    url: "https://www.elastic.co/docs/deploy-manage/tools/snapshot-and-restore"
    description: "Sao lưu cluster, data streams, indices và feature states; khôi phục dữ liệu và cấu hình khi cần."
  - title: "Elastic Stack — Security"
    url: "https://www.elastic.co/docs/deploy-manage/security"
    description: "Bảo vệ cluster và thành phần kết nối bằng TLS, authentication, roles, API keys và kiểm soát truy cập."
