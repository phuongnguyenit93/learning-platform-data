references:
  - title: "MongoDB — Thiết kế mô hình dữ liệu"
    url: "https://www.mongodb.com/docs/manual/data-modeling/"
    description: "Tài liệu chính thức về mô hình tài liệu, nhúng, tham chiếu và thiết kế theo cách ứng dụng truy cập dữ liệu."
  - title: "Redis — Kiểu dữ liệu"
    url: "https://redis.io/docs/latest/develop/data-types/"
    description: "Tổng quan chính thức các cấu trúc dữ liệu Redis, dùng làm ví dụ cho mô hình khóa–giá trị và lựa chọn theo nhu cầu truy cập."
  - title: "Apache Cassandra — Thiết kế theo truy vấn"
    url: "https://cassandra.apache.org/doc/latest/cassandra/developing/data-modeling/intro.html"
    description: "Giới thiệu thiết kế theo truy vấn, khóa phân vùng và lặp dữ liệu trong Cassandra, đại diện cho mô hình cột rộng."
  - title: "Neo4j — Khái niệm cơ sở dữ liệu đồ thị"
    url: "https://neo4j.com/docs/getting-started/graph-database/"
    description: "Tài liệu chính thức giới thiệu nút, quan hệ, thuộc tính và cách truy cập dữ liệu đồ thị."
  - title: "MongoDB — Tính nguyên tử và giao dịch"
    url: "https://www.mongodb.com/docs/manual/core/write-operations-atomicity/"
    description: "Ví dụ cụ thể về tính nguyên tử trên một tài liệu, cập nhật đồng thời và giao dịch nhiều tài liệu; đối chiếu khả năng của từng hệ."
  - title: "CAP — Chứng minh của Gilbert và Lynch"
    url: "https://groups.csail.mit.edu/tds/papers/Gilbert/Brewer6.pdf"
    description: "Bài nghiên cứu gốc về giới hạn kết hợp tính nhất quán, tính sẵn sàng và khả năng chịu phân hoạch mạng trong mô hình được nêu."
  - title: "Jepsen — Các mô hình nhất quán"
    url: "https://jepsen.io/consistency/models"
    description: "Định nghĩa lịch sử thực thi và các mô hình nhất quán, hỗ trợ diễn giải các bảo đảm đọc/ghi có thể kiểm chứng."
  - title: "MongoDB — Phương pháp sao lưu"
    url: "https://www.mongodb.com/docs/manual/core/backups/"
    description: "Ví dụ chính thức về các phương án sao lưu cho triển khai tự quản trị và những điều kiện cần xét khi chuẩn bị phục hồi."
  - title: "OWASP — Bảo mật NoSQL"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/NoSQL_Security_Cheat_Sheet.html"
    description: "Hướng dẫn về kiểm tra đầu vào, ngăn chèn truy vấn, xác thực, phân quyền, kết nối và quản lý bí mật cho ứng dụng NoSQL."
