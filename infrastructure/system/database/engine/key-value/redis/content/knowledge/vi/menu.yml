  - Đồng bộ đầy đủ, đồng bộ từng phần và replication backlog
  - Replication offset, độ trễ nhân bản và kiểm tra trạng thái
  - Nhân bản bất đồng bộ và cửa sổ có thể mất dữ liệu
  - Đọc từ replica và giới hạn nhất quán
  - WAIT và giới hạn của xác nhận nhân bản
  - 'WAITAOF: điều kiện hỗ trợ và phạm vi xác nhận'
  - Quy định số replica tối thiểu trước khi chấp nhận ghi
  - Đổi vai trò, khởi động lại và khôi phục kết nối
  - Dung lượng mạng, đầu ra máy khách và đồng bộ tập dữ liệu lớn
- level1: Sentinel
  level2:
  - Vai trò Sentinel và kiến trúc khả dụng cao
  - Giám sát primary, replica và các Sentinel khác
  - Quorum, đa số và điều kiện quyết định chuyển đổi
  - Phân biệt nhận định lỗi chủ quan và khách quan
  - Lựa chọn replica và quá trình failover
  - Khám phá primary từ máy khách
  - Tham số thời gian, giới hạn chuyển đổi và chống dao động
  - Phân vùng mạng, split-brain và giới hạn đảm bảo dữ liệu
  - Xác thực, TLS và cấu hình truy cập Sentinel
  - Kiểm thử chuyển đổi, khôi phục và xác minh sau sự cố
- level1: Redis Cluster
  level2:
  - Phân mảnh dữ liệu và mô hình hash slot
