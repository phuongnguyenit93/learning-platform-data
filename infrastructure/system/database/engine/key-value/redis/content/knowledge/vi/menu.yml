menu:
- level1: Tổng quan Redis
  level2:
  - Redis là gì và giải quyết những bài toán nào
  - Mô hình khóa–giá trị và máy chủ cấu trúc dữ liệu
  - Vai trò bộ nhớ chính và lưu trữ bền vững
  - Redis trong kiến trúc ứng dụng và hệ thống dữ liệu
  - Phân biệt cơ sở dữ liệu, bộ nhớ đệm và môi giới thông điệp
  - So sánh Redis với Memcached và cơ sở dữ liệu quan hệ
  - 'Thuật ngữ: instance, keyspace, client, shard và replica'
  - Lộ trình học, kiến thức nền và môi trường thực hành
  - Giới hạn sử dụng và những trường hợp nên chọn công nghệ khác
- level1: Kiến trúc xử lý
  level2:
  - Tiến trình Redis, kết nối máy khách và vòng lặp sự kiện
  - Mô hình thực thi lệnh và ý nghĩa của xử lý tuần tự
  - Tác vụ nền, luồng I/O và các công việc ngoài luồng lệnh chính
  - Tính nguyên tử của một lệnh và giới hạn giữa nhiều lệnh
  - Lệnh chậm, lệnh chặn và ảnh hưởng tới các kết nối khác
  - Độ phức tạp lệnh và kích thước dữ liệu đầu vào
  - Vai trò hệ điều hành, CPU, RAM và ổ đĩa
  - Phân biệt chế độ độc lập, Sentinel và Redis Cluster
- level1: Cài đặt và cấu hình
  level2:
  - Lựa chọn phiên bản, bản phân phối và điều kiện sử dụng
  - Cài đặt môi trường phát triển và chạy bằng Docker
  - Khởi động redis-server và kiểm tra bằng redis-cli
  - Tệp redis.conf, tham số khởi động và thứ tự cấu hình
  - Địa chỉ lắng nghe, cổng dịch vụ và protected mode
  - Thư mục dữ liệu, tệp nhật ký và quyền hệ điều hành
  - Đọc và thay đổi cấu hình bằng CONFIG GET và CONFIG SET
  - Cấu hình thời gian chờ, TCP keepalive và giới hạn kết nối
  - Nạp dữ liệu mẫu và đặt lại môi trường thực hành
  - Dừng, khởi động lại và xác minh cấu hình thực tế
- level1: Giao thức và kết nối
  level2:
  - RESP2, RESP3 và cách biểu diễn yêu cầu–phản hồi
  - Mở phiên làm việc với AUTH, HELLO và SELECT
  - Lệnh, đối số, giá trị trả về và các nhóm lỗi
  - Phân biệt chuỗi rỗng, giá trị null và khóa không tồn tại
  - Mã hóa văn bản, dữ liệu nhị phân và giới hạn kích thước
  - Kết nối lâu dài, ghép nhiều yêu cầu và quản lý tài nguyên
  - Thời gian chờ kết nối, thời gian chờ lệnh và hủy yêu cầu
  - Kết nối lại, thử lại và nguy cơ thực thi lệnh nhiều lần
  - Đọc mô tả lệnh bằng COMMAND và đối chiếu khả năng máy chủ
- level1: Thiết kế khóa
  level2:
  - Quy ước đặt tên khóa và phân chia không gian tên
  - Thiết kế khóa theo thực thể, quan hệ và mẫu truy cập
  - TYPE, EXISTS và kiểm tra vòng đời dữ liệu
  - DEL, UNLINK và lựa chọn cách xóa dữ liệu lớn
  - RENAME, RENAMENX và COPY
  - Quét không gian khóa bằng SCAN và giới hạn của KEYS
  - Cơ sở dữ liệu logic, SELECT và giới hạn trong Redis Cluster
  - Hash tag trong tên khóa và ảnh hưởng tới phân bố dữ liệu
  - Khóa quá lớn, khóa truy cập dày đặc và nguy cơ tập trung tải
  - Thiết kế phiên bản khóa và chuyển đổi lược đồ dữ liệu
- level1: Thời hạn dữ liệu
  level2:
  - TTL, PTTL và ý nghĩa các giá trị trả về
  - EXPIRE, PEXPIRE, EXPIREAT và PEXPIREAT
  - SET với EX, PX, EXAT, PXAT và KEEPTTL
  - PERSIST và các thao tác làm thay đổi thời hạn khóa
  - Điều kiện NX, XX, GT và LT khi đặt thời hạn
  - Cơ chế hết hạn chủ động và hết hạn khi truy cập
  - Phân biệt hết hạn, thu hồi do thiếu bộ nhớ và xóa chủ động
  - Đồng hồ hệ thống, thời điểm tuyệt đối và kiểm thử thời gian
  - Rải thời hạn dữ liệu để tránh hết hạn đồng loạt
- level1: Chuỗi và bộ đếm
  level2:
  - Biểu diễn chuỗi, số và dữ liệu nhị phân bằng String
  - SET, GET và các tùy chọn ghi có điều kiện
  - MSET, MGET và truy cập nhiều khóa
  - SET NX và SET XX trong khởi tạo hoặc cập nhật
  - INCR, DECR, INCRBY và DECRBY
  - INCRBYFLOAT, biểu diễn số và giới hạn độ chính xác
  - APPEND, STRLEN, GETRANGE và SETRANGE
  - GETDEL, GETEX và cập nhật vòng đời khi đọc
  - Giới hạn kích thước, chi phí sao chép và lựa chọn cấu trúc
  - Bài toán bộ đếm có thời hạn và cấp số thứ tự
- level1: Hash
  level2:
  - Mô hình trường–giá trị và biểu diễn một thực thể
  - HSET, HGET, HMGET và HGETALL
  - HSETNX, HEXISTS, HDEL và HLEN
  - HKEYS, HVALS và HSCAN
  - HINCRBY và HINCRBYFLOAT
  - Phân biệt trường không tồn tại và khóa không tồn tại
  - Lựa chọn Hash, nhiều khóa String hoặc tài liệu JSON
  - Mã hóa nội bộ, kích thước trường và chi phí bộ nhớ
  - 'Thời hạn từng trường: kiểm tra hỗ trợ và phân biệt TTL của khóa'
  - Cập nhật từng phần, phiên bản thực thể và thay đổi lược đồ
- level1: List
  level2:
  - Mô hình danh sách có thứ tự và truy cập hai đầu
  - LPUSH, RPUSH, LPOP và RPOP
  - LRANGE, LINDEX, LLEN và LSET
  - LINSERT, LREM và LTRIM
  - BLPOP, BRPOP và kết nối dành cho lệnh chặn
  - LMOVE và BLMOVE trong chuyển phần tử giữa danh sách
  - Danh sách giới hạn kích thước và lịch sử gần nhất
  - Độ phức tạp truy cập theo vị trí và dữ liệu lớn
  - Mất kết nối, khôi phục tác vụ và giới hạn hàng đợi dựa trên List
- level1: Set
  level2:
  - Tập hợp không thứ tự và tính duy nhất của phần tử
  - SADD, SREM, SISMEMBER và SMISMEMBER
  - SMEMBERS, SCARD và SSCAN
  - SPOP, SRANDMEMBER và lựa chọn ngẫu nhiên
  - SUNION, SINTER, SDIFF và các biến thể lưu kết quả
  - SMOVE và thay đổi quan hệ thành viên
  - Biểu diễn quan hệ nhiều–nhiều bằng Set
  - Kiểm tra trùng lặp, thẻ phân loại và quyền thành viên
  - Chi phí phép toán tập hợp và ràng buộc nhiều khóa trong Cluster
- level1: Sorted Set
  level2:
  - Phần tử duy nhất, điểm số và thứ tự sắp xếp
  - ZADD với điều kiện cập nhật và trả về số thay đổi
  - ZSCORE, ZMSCORE, ZCARD và ZCOUNT
  - ZRANGE theo thứ hạng, điểm số và thứ tự từ điển
  - ZRANK, ZREVRANK và cách xác định vị trí
  - ZINCRBY và cập nhật điểm đồng thời
  - ZREM và các lệnh xóa theo khoảng
  - ZPOPMIN, ZPOPMAX và các biến thể chặn
  - ZUNION, ZINTER, ZDIFF và kết hợp tập có trọng số
  - Độ chính xác điểm số và quy tắc xử lý các phần tử đồng điểm
  - Bảng xếp hạng, lịch tác vụ và cửa sổ thời gian
- level1: Bitmap và Bitfield
  level2:
  - Bitmap trên String và cách chọn chỉ số bit
  - SETBIT, GETBIT và BITCOUNT
  - BITPOS và tìm vị trí bit thỏa điều kiện
  - BITOP và kết hợp nhiều bitmap
  - BITFIELD, độ rộng trường và số có dấu
  - Các chế độ tràn số của BITFIELD
  - BITFIELD_RO và truy vấn trường bit chỉ đọc
  - Theo dõi hoạt động, cờ tính năng và thống kê theo ngày
  - Dung lượng theo miền chỉ số và rủi ro cấp phát lớn
- level1: HyperLogLog
  level2:
  - Đếm gần đúng số phần tử khác nhau với HyperLogLog
  - PFADD, PFCOUNT và PFMERGE
  - Sai số, chi phí bộ nhớ và lựa chọn đếm chính xác
- level1: Dữ liệu địa lý
  level2:
  - GEOADD và mô hình tọa độ địa lý
  - GEOPOS, GEODIST và GEOHASH
  - GEOSEARCH và GEOSEARCHSTORE
  - Đơn vị khoảng cách, giới hạn tọa độ và sắp xếp kết quả
  - Tìm đối tượng lân cận và kết hợp thuộc tính nghiệp vụ
  - Giới hạn truy vấn địa lý và khi cần hệ thống chuyên dụng
- level1: Streams
  level2:
  - Mô hình nhật ký sự kiện và cấu trúc Stream ID
  - XADD, XLEN và chính sách đặt ID
  - XRANGE, XREVRANGE và truy xuất lịch sử
  - XREAD và đọc chặn từ một hay nhiều stream
  - XGROUP và vòng đời nhóm tiêu thụ
  - XREADGROUP và phân phối thông điệp trong nhóm
  - XACK và danh sách thông điệp chờ xác nhận
  - XPENDING, XCLAIM và XAUTOCLAIM
  - XTRIM, XDEL và giới hạn lưu giữ
  - XINFO và quan sát stream, nhóm, máy khách tiêu thụ
  - Thứ tự, thông điệp trùng lặp và ngữ nghĩa giao nhận
  - Khôi phục máy khách tiêu thụ, xử lý lỗi và thông điệp không xử lý được
- level1: JSON
  level2:
  - Kiểm tra khả năng JSON theo phiên bản và bản phân phối
  - Lựa chọn tài liệu JSON, Hash hoặc chuỗi JSON
  - Đường dẫn JSONPath và lựa chọn phần tử
  - JSON.SET, JSON.GET và JSON.DEL
  - Cập nhật chuỗi, số, mảng và đối tượng
  - Đọc nhiều đường dẫn và xử lý kết quả không tồn tại
  - Chi phí cập nhật tài liệu lớn và giới hạn kích thước
  - Lược đồ ứng dụng, kiểm tra dữ liệu và chuyển đổi phiên bản
  - Kết hợp JSON với chỉ mục tìm kiếm khi được hỗ trợ
- level1: Tìm kiếm và vector
  level2:
  - Kiểm tra khả năng tìm kiếm, vector và điều kiện triển khai
  - Thiết kế chỉ mục trên Hash hoặc JSON
  - FT.CREATE, tiền tố khóa và khai báo trường
  - Trường văn bản, TAG, NUMERIC và GEO
  - FT.SEARCH, bộ lọc, sắp xếp và phân trang
  - FT.AGGREGATE và tổng hợp dữ liệu
  - Ngôn ngữ truy vấn, dialect và ký tự cần thoát
  - Phân tích văn bản, từ dừng và cấu hình theo ngôn ngữ
  - Kiểu dữ liệu vector, số chiều và phép đo khoảng cách
  - Lựa chọn chỉ mục FLAT hoặc HNSW
  - Truy vấn lân cận gần nhất và kết hợp bộ lọc thuộc tính
  - Vòng đời chỉ mục, chất lượng kết quả và chi phí bộ nhớ
- level1: Dữ liệu chuyên biệt
  level2:
  - Xác định khả năng tích hợp và phần mở rộng theo môi trường
  - 'Chuỗi thời gian: mẫu đo, nhãn và chính sách lưu giữ'
  - TS.ADD, TS.RANGE và truy vấn theo khoảng
  - TS.MRANGE, gộp mẫu và tổng hợp theo thời gian
  - 'Bloom filter: kiểm tra thành viên và xác suất dương tính giả'
  - 'Cuckoo filter: quản lý thành viên và khả năng xóa'
  - 'Count-Min Sketch: ước lượng tần suất xuất hiện'
  - 'Top-K: theo dõi các phần tử xuất hiện nhiều'
  - 't-digest: ước lượng phân vị của luồng số liệu'
  - Đánh đổi sai số, dung lượng và lựa chọn cấu trúc phù hợp
- level1: Giao dịch và đồng thời
  level2:
  - MULTI, EXEC và hàng đợi lệnh giao dịch
  - DISCARD và hủy giao dịch chưa thực thi
  - Lỗi trước EXEC và lỗi khi thực thi từng lệnh
  - Giới hạn hoàn tác và ý nghĩa tính nguyên tử
  - WATCH, UNWATCH và kiểm soát đồng thời lạc quan
  - Xử lý xung đột, giới hạn thử lại và thời gian chờ
  - So sánh giao dịch, lệnh đơn, pipeline và mã chạy phía máy chủ
  - Giới hạn nhiều khóa và hash slot trong Redis Cluster
  - Mất kết nối trước hoặc sau EXEC và kết quả không xác định
  - Thiết kế thao tác an toàn khi có yêu cầu đồng thời
- level1: Lua và Functions
  level2:
  - Bài toán cần thực thi logic gần dữ liệu
  - EVAL, EVALSHA và bộ nhớ đệm script
  - Khai báo KEYS, ARGV và truy cập khóa đúng quy tắc
  - Kiểu dữ liệu trả về giữa Lua và RESP
  - Đảm bảo tính nguyên tử và chi phí chặn máy chủ
  - Giới hạn thời gian, lỗi script và SCRIPT KILL
  - Nạp, gọi và quản lý thư viện bằng Redis Functions
  - FUNCTION LOAD, FCALL và vòng đời thư viện
  - Nhân bản, lưu trữ và triển khai script hoặc function
  - Thiết kế script an toàn trong Cluster và kiểm thử đồng thời
- level1: Pipeline và cache máy khách
  level2:
  - Độ trễ mạng và lý do sử dụng pipeline
  - Gom lệnh, thứ tự phản hồi và giới hạn tính nguyên tử
  - Chia lô theo số lệnh, kích thước và bộ nhớ máy khách
  - Lỗi từng lệnh, ngắt kết nối và xử lý kết quả một phần
  - Pipeline với giao dịch, lệnh chặn và Cluster
  - Lựa chọn pipeline, lệnh nhiều phần tử hoặc script
  - Client-side caching và invalidation
  - CLIENT TRACKING, thông báo đẩy và các chế độ theo dõi
  - Cache cục bộ, kết nối lại và nguy cơ dữ liệu cũ
- level1: Pub/Sub và thông báo
  level2:
  - PUBLISH, SUBSCRIBE và vòng đời đăng ký kênh
  - PSUBSCRIBE và định tuyến bằng mẫu kênh
  - Ngữ nghĩa giao nhận và giới hạn lưu trữ của Pub/Sub
  - Sharded Pub/Sub và điều kiện sử dụng trong Cluster
  - Quản lý kết nối đăng ký, mất kết nối và đăng ký lại
  - Thông báo keyspace, keyevent và cấu hình sự kiện
  - Sự kiện hết hạn và giới hạn về thời điểm phát sinh
  - So sánh Pub/Sub, Streams và hàng đợi tác vụ
  - Thiết kế thông báo làm mới dữ liệu và đồng bộ máy khách
- level1: Lưu trữ bền vững
  level2:
  - Lựa chọn không lưu bền, RDB, AOF hoặc kết hợp
  - Tạo ảnh chụp RDB với SAVE và BGSAVE
  - Lịch tạo RDB và điều kiện lỗi ghi dữ liệu
  - AOF, chính sách fsync và đánh đổi mất dữ liệu–độ trễ
  - Viết lại AOF và quản lý các tệp liên quan
  - Fork, copy-on-write và nhu cầu bộ nhớ khi lưu
  - Thứ tự nạp dữ liệu khi khởi động lại
  - Phát hiện tệp hỏng và sử dụng công cụ kiểm tra
  - Độ bền dữ liệu khi tiến trình, hệ điều hành hoặc máy chủ gặp sự cố
  - Đo thời gian khôi phục và chọn chính sách theo yêu cầu nghiệp vụ
- level1: Nhân bản
  level2:
