  - title: "Oracle AI Database — Backup and Recovery"
    url: "https://docs.oracle.com/en/database/oracle/oracle-database/26/bradv/introduction-backup-recovery.html"
    description: "Cơ sở backup, restore, Recovery Manager (RMAN) và chiến lược phục hồi."