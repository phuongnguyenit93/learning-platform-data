  - Đánh giá kiểu dữ liệu, khóa chính, schema và cardinality trước khi nạp
  - Chuyển Flux sang SQL hoặc InfluxQL theo ý nghĩa phép tính
  - Thay thế Continuous Query, Flux task và cơ chế cảnh báo theo đích đến
  - Xuất, nạp dữ liệu lịch sử và kiểm tra phương án di chuyển được hỗ trợ
  - Ghi song song, theo dõi sai lệch và xác định mốc chuyển luồng
  - Đối chiếu số điểm, timestamp, giá trị và truy vấn nghiệp vụ
  - Chuyển ứng dụng, SDK, token và dashboard theo từng giai đoạn
  - Điều kiện quay lui và xử lý dữ liệu phát sinh trong giai đoạn chuyển đổi
