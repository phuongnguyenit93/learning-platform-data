  - Ước lượng số điểm mỗi giây, số field, cardinality và dung lượng
  - Tối ưu kích thước lô, nén và số kết nối ghi
  - Giới hạn thời gian, chọn cột và giảm dữ liệu quét
  - Tối ưu bộ lọc tag, phép nhóm và phép tổng hợp theo bộ máy
