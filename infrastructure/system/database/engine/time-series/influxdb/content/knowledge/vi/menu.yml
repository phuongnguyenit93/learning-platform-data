  level2:
  - Theo dõi trạng thái sẵn sàng, tiến trình và tài nguyên máy chủ
  - Thu thập metrics của InfluxDB bằng endpoint hoặc công cụ phù hợp phiên bản
  - Đo tốc độ ghi, điểm bị từ chối và tỷ lệ phản hồi lỗi
  - Đo độ trễ truy vấn, số truy vấn chạy và timeout
  - Theo dõi WAL, cache, compaction và dung lượng đĩa trong TSM
  - Theo dõi object storage, Parquet, cache và catalog trong InfluxDB 3
  - Theo dõi Telegraf, hàng đợi gửi và dữ liệu đến chậm
  - Thu thập log có cấu trúc và liên kết với yêu cầu ứng dụng
  - Thiết lập SLI, SLO và cảnh báo theo mức ảnh hưởng
  - Soạn quy trình trực vận hành và thu thập bằng chứng sự cố
