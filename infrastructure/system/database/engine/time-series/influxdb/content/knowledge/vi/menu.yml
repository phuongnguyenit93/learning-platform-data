  - Tối ưu schema, shard và compaction trong TSM
  - Tối ưu Parquet, cache và object storage trong InfluxDB 3
  - Quản lý CPU, RAM, đĩa, băng thông và giới hạn truy vấn đồng thời
  - Đo bộ nhớ đệm nóng, bộ nhớ đệm lạnh và độ trễ phân vị
  - Thiết kế benchmark tái lập và kiểm tra kết quả đúng trước khi so tốc độ
