  - Tính nhất quán giữa WAL, catalog và dữ liệu trong object storage
  - Lập lịch, mã hóa, lưu ngoài máy và kiểm tra tính toàn vẹn bản sao lưu
  - Khôi phục vào môi trường tách biệt và xử lý xung đột tài nguyên
