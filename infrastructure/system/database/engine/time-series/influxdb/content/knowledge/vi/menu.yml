menu:
- level1: Tổng quan InfluxDB
  level2:
  - InfluxDB là gì và bài toán lưu trữ dữ liệu theo thời gian
  - Quan hệ giữa nguồn dữ liệu, điểm dữ liệu, chuỗi thời gian và truy vấn
  - Vai trò của InfluxDB trong hệ thống giám sát, IoT và phân tích sự kiện
  - Luồng dữ liệu từ thu thập đến lưu trữ, xử lý và trực quan hóa
  - So sánh phạm vi sử dụng với cơ sở dữ liệu quan hệ, kho phân tích và hệ thống giám sát
  - Giới hạn khi dùng InfluxDB cho giao dịch nghiệp vụ và quan hệ dữ liệu phức tạp
  - Kiến thức cần có và trình tự học từ mô hình dữ liệu đến vận hành
- level1: Các thế hệ InfluxDB
  level2:
  - Nhận diện phiên bản, sản phẩm và bộ máy lưu trữ đang sử dụng
  - 'InfluxDB 1.x: database, retention policy và InfluxQL'
  - 'InfluxDB 2.x: organization, bucket, token và Flux'
  - 'InfluxDB 3: database, table, SQL và InfluxQL'
  - Phân biệt InfluxDB OSS, Core, Enterprise và các dịch vụ Cloud
  - Ma trận ngôn ngữ truy vấn, API và công cụ theo từng sản phẩm
  - Phân biệt tương thích API ghi với tương thích truy vấn và quản trị
  - Giới hạn truy vấn lịch sử, tài nguyên và tính năng theo phiên bản triển khai
  - Chọn nhánh thực hành và cố định phiên bản máy chủ, CLI, SDK
- level1: Nền tảng thời gian
  level2:
  - Phân biệt thời gian sự kiện, thời gian thu thập và thời gian ghi
  - Unix timestamp, RFC3339 và cách biểu diễn một thời điểm
  - Độ chính xác giây, mili giây, micro giây và nano giây
  - Lưu trữ theo UTC và hiển thị theo múi giờ người dùng
  - Khoảng thời gian đóng, mở và quy ước đầu bao gồm, cuối loại trừ
  - Dữ liệu đến muộn, sai thứ tự và đồng hồ thiết bị bị lệch
  - Dữ liệu lấy mẫu đều, không đều và khoảng thời gian bị thiếu
  - Phân biệt đại lượng tức thời, bộ đếm tích lũy và sự kiện
  - Đơn vị đo, chu kỳ lấy mẫu và ảnh hưởng đến ý nghĩa kết quả
- level1: Mô hình dữ liệu
  level2:
  - 'Measurement và table: ranh giới nhóm dữ liệu'
  - Point, timestamp, tag set và field set
  - Tag key, tag value và vai trò của thuộc tính định danh
  - Field key, field value và các kiểu dữ liệu được hỗ trợ
  - Series và cách tính số lượng chuỗi theo từng bộ máy
  - Danh tính điểm dữ liệu trong InfluxDB 1.x và 2.x
  - Khóa chính và quy tắc schema của table trong InfluxDB 3
  - 'Điểm trùng khóa: hợp nhất field, ghi đè và khác biệt theo phiên bản'
  - Giá trị vắng mặt, chuỗi rỗng và NULL trong kết quả truy vấn
  - Schema-on-write, suy luận kiểu và xung đột kiểu dữ liệu
- level1: Thiết kế schema
  level2:
  - Xuất phát từ câu hỏi truy vấn, độ phân giải và thời hạn lưu dữ liệu
  - Chọn tag hay field theo định danh, điều kiện lọc và phép tính
  - Thiết kế measurement cho dữ liệu cảm biến, máy chủ và ứng dụng
  - Quy ước tên, đơn vị đo và phiên bản schema
  - Cardinality trong TSM và rủi ro dùng giá trị biến động làm tag
  - Cardinality trong InfluxDB 3 và chi phí thực tế của schema, dữ liệu, truy vấn
  - Thiết kế tập tag, thứ tự khóa và thay đổi cột theo phiên bản InfluxDB 3
  - Schema rộng, schema thưa và tách table theo mẫu truy cập
  - Tách dữ liệu theo khách hàng, môi trường và phạm vi quyền truy cập
  - Xử lý thuộc tính tùy chọn và thay đổi kiểu mà vẫn giữ dữ liệu lịch sử
  - Các thiết kế sai thường gặp và cách kiểm chứng bằng dữ liệu mẫu
- level1: Cài đặt và công cụ
  level2:
  - Chuẩn bị môi trường và kiểm tra yêu cầu của phiên bản đã chọn
  - Cài đặt bằng binary hoặc gói hệ điều hành
  - Chạy Docker và Docker Compose với image được cố định phiên bản
  - Cổng dịch vụ, đường dẫn dữ liệu và cấu hình lưu trữ bền vững
  - Khởi tạo InfluxDB 1.x, InfluxDB 2.x và InfluxDB 3 theo nhánh riêng
  - Phân biệt CLI influx, influxd, influxdb3 và công cụ quản trị Cloud
  - Sử dụng giao diện InfluxDB 2.x và InfluxDB 3 Explorer đúng sản phẩm
  - Kiểm tra trạng thái sẵn sàng và thực hiện vòng ghi, đọc đầu tiên
  - Quản lý cấu hình bằng tệp, biến môi trường và tham số khởi động
- level1: Quản trị tài nguyên
  level2:
  - Tạo và kiểm tra database, retention policy trong InfluxDB 1.x
  - Tạo organization, bucket và quản lý định danh trong InfluxDB 2.x
  - Tạo database, table và xem schema trong InfluxDB 3
  - Cấu hình thời hạn lưu dữ liệu theo khả năng của từng sản phẩm
  - Tạo tài nguyên tường minh và tài nguyên phát sinh khi ghi dữ liệu
  - Ánh xạ database-retention policy sang bucket bằng DBRP trong InfluxDB 2.x
  - Phân biệt tài nguyên quản trị, dữ liệu người dùng và dữ liệu hệ thống
  - Kiểm tra giới hạn database, bucket, table và cột trước khi mở rộng
  - Tự động hóa khởi tạo lặp lại an toàn và quản lý cấu hình giữa các môi trường
- level1: Line Protocol
  level2:
  - Cấu trúc measurement, tag set, field set và timestamp
  - Quy tắc dấu phân cách, khoảng trắng và kết thúc dòng
  - Escape tên measurement, tag và field key
  - Biểu diễn string, boolean, float, integer và unsigned integer
  - Dấu nháy, ký tự Unicode và dữ liệu văn bản đặc biệt
  - Timestamp tường minh, timestamp mặc định và tham số precision
  - Ghi nhiều field và nhiều điểm trong cùng một payload
  - Dữ liệu trùng khóa và tác động của việc đổi tag hoặc timestamp
  - Phát hiện lỗi cú pháp, sai kiểu và sai đơn vị thời gian
  - Chuyển JSON, CSV hoặc bản ghi ứng dụng sang Line Protocol
- level1: Ghi dữ liệu
  level2:
  - Chọn HTTP API, CLI, SDK hoặc Telegraf cho luồng ghi
  - Ghi đồng bộ, ghi bất đồng bộ và thời điểm xác nhận thành công
  - Gom lô theo số điểm, kích thước và khoảng thời gian
  - Nén payload, tái sử dụng kết nối và cấu hình timeout
  - Kiểm soát tốc độ gửi, bộ đệm và áp lực ngược
  - Xử lý phản hồi lỗi, ghi thành công một phần và dữ liệu bị từ chối
  - Thử lại có giới hạn, thời gian chờ tăng dần và độ trễ ngẫu nhiên
  - Gửi lại dữ liệu an toàn, điểm trùng và giới hạn bảo đảm exactly-once
  - Nạp dữ liệu lịch sử và xử lý điểm đến muộn
  - Lưu tạm khi mất kết nối và phục hồi tiến độ sau khởi động lại
  - Đo thông lượng, độ trễ và độ đầy đủ của luồng ghi
- level1: Thu thập với Telegraf
  level2:
  - Vai trò input, processor, aggregator và output trong luồng thu thập
  - Cấu trúc tệp cấu hình và kiểm tra dữ liệu trước khi gửi
  - Thu thập CPU, bộ nhớ, đĩa, mạng và tiến trình
  - Thu thập HTTP, MQTT, Kafka và dữ liệu thiết bị theo plugin
  - Đọc JSON, CSV và dữ liệu Prometheus bằng parser phù hợp
  - Chuẩn hóa tag, đổi tên field và lọc metric
  - Chọn output tương thích InfluxDB 1.x, 2.x hoặc 3
  - Cấu hình chu kỳ thu thập, chu kỳ gửi, batch và buffer
  - Bảo vệ thông tin xác thực bằng biến môi trường hoặc secret store
  - Giám sát lỗi parser, lỗi output, mất dữ liệu và nghẽn bộ đệm
- level1: HTTP API
  level2:
  - Cấu trúc URL, thông tin xác thực và tài nguyên đích theo phiên bản
  - API /write và /query của InfluxDB 1.x
  - API /api/v2/write và /api/v2/query của InfluxDB 2.x
  - API ghi và truy vấn /api/v3 của InfluxDB 3
  - Phạm vi hỗ trợ API tương thích v1 và v2 trong InfluxDB 3
  - Gửi truy vấn có tham số và tránh ghép chuỗi từ đầu vào người dùng
  - Định dạng JSON, CSV, annotated CSV và dữ liệu trả theo luồng
  - Phân biệt xác thực, phân quyền và lỗi tài nguyên không tồn tại
  - Mã trạng thái HTTP, nội dung lỗi và chính sách thử lại
  - Dùng curl để tái hiện yêu cầu và kiểm tra hợp đồng API
  - Vai trò Arrow Flight và Flight SQL khi sản phẩm, SDK hỗ trợ
- level1: InfluxQL
  level2:
  - Phạm vi hỗ trợ InfluxQL và khác biệt giữa các thế hệ
  - SELECT, FROM, WHERE và giới hạn thời gian truy vấn
  - Định danh, dấu nháy, tag, field và biểu thức lọc
  - SHOW MEASUREMENTS, TAG KEYS, FIELD KEYS và lệnh khám phá được hỗ trợ
  - Phép tổng hợp COUNT, SUM, MEAN, MIN và MAX
  - Hàm chọn FIRST, LAST, TOP, BOTTOM và ý nghĩa timestamp
  - GROUP BY tag, GROUP BY time và căn chỉnh cửa sổ
  - fill(), khoảng dữ liệu trống và giới hạn của phép điền
  - ORDER BY, LIMIT, SLIMIT và phân biệt điểm với chuỗi
  - DIFFERENCE, DERIVATIVE và NON_NEGATIVE_DERIVATIVE
  - MOVING_AVERAGE, PERCENTILE và CUMULATIVE_SUM theo hỗ trợ
  - Truy vấn con, SELECT INTO và các tính năng chỉ có ở sản phẩm tương ứng
  - Truy vấn nhiều measurement và giới hạn ghép dữ liệu của InfluxQL
- level1: Flux cơ bản (2.x)
  level2:
  - Vai trò của Flux trong InfluxDB 2.x và ranh giới với InfluxDB 3
  - Cú pháp pipeline, biến, hàm và toán tử |>
  - Stream of tables, group key và cách đọc kết quả
  - Các cột _time, _measurement, _field, _value, _start và _stop
  - from(), range() và filter() để giới hạn dữ liệu
  - keep(), drop(), rename() và tổ chức cột
  - group(), sort(), limit() và ảnh hưởng đến từng bảng
  - aggregateWindow() và lựa chọn khoảng tổng hợp
  - map(), toán tử số học và chuyển đổi kiểu
  - first(), last(), findRecord() và lấy giá trị đơn
  - Đọc annotated CSV và xử lý nhiều bảng kết quả
- level1: Flux nâng cao (2.x)
  level2:
  - 'window() và aggregateWindow(): ranh giới, timestamp và cửa sổ rỗng'
  - pivot() để đưa nhiều field về cùng một bản ghi
  - 'join() và union(): điều kiện ghép, group key và dữ liệu thiếu'
  - difference(), derivative(), increase() và bộ đếm bị đặt lại
  - movingAverage(), cumulativeSum() và phân tích xu hướng
  - fill(), interpolate và phân biệt điền thiếu với nội suy
  - quantile(), histogram và giới hạn tổng hợp phân vị
  - stateDuration(), stateCount() và phân tích trạng thái
  - Hàm tự định nghĩa, reduce() và logic điều kiện
  - Khám phá schema, xử lý chuỗi và biểu thức chính quy
  - Hạn chế dữ liệu quét và kiểm tra khả năng đẩy phép tính xuống bộ máy
- level1: SQL cơ bản (3.x)
  level2:
  - Vai trò SQL và phạm vi phương ngữ DataFusion trong InfluxDB 3
  - Khám phá table, column và metadata hệ thống
  - SELECT, WHERE, ORDER BY và LIMIT
  - Lọc tag, field và khoảng thời gian có giới hạn
  - Định danh có dấu nháy, alias và tên cột đặc biệt
  - Kiểu dữ liệu, CAST, NULL và logic ba giá trị
  - Hàm số học, chuỗi và biểu thức CASE
  - COUNT, SUM, AVG, MIN, MAX và GROUP BY
  - HAVING, truy vấn con và common table expression
  - JOIN và UNION theo hỗ trợ của sản phẩm, phiên bản
  - Tham số truy vấn, định dạng đầu ra và đọc kết quả theo luồng
- level1: SQL thời gian (3.x)
  level2:
  - NOW, INTERVAL và biểu thức thời gian
  - DATE_BIN để chia khoảng thời gian và căn chỉnh mốc
  - Tổng hợp theo cửa sổ thời gian và nhiều chiều tag
  - Hàm selector lấy giá trị đầu, cuối cùng timestamp liên quan
  - LAG, LEAD và so sánh các bản ghi trong cùng chuỗi
  - Window frame, trung bình trượt và tổng tích lũy
  - Tính tốc độ thay đổi với bộ đếm, khoảng lấy mẫu và giá trị đặt lại
  - Phát hiện khoảng trống và sử dụng hàm gap filling được hỗ trợ
  - Phân vị, độ lệch và thống kê chuỗi theo hàm được hỗ trợ
  - Top N, giá trị mới nhất và xếp hạng theo từng thiết bị
  - EXPLAIN, EXPLAIN ANALYZE và đọc kế hoạch thực thi khi được hỗ trợ
- level1: Tính đúng đắn dữ liệu
  level2:
  - Phân biệt không có điểm, field vắng mặt, NULL và giá trị bằng không
  - Chọn cửa sổ theo nghiệp vụ và tránh đếm trùng ở ranh giới
  - Phân biệt trung bình theo mẫu và trung bình có trọng số thời gian
  - Tổng hợp bộ đếm và đại lượng tức thời đúng ý nghĩa
  - Vì sao không cộng hoặc lấy trung bình các phân vị một cách tùy tiện
  - Dữ liệu đến muộn và tính lại khoảng tổng hợp bị ảnh hưởng
  - Chuỗi không đều, khoảng ngừng thiết bị và nội suy có kiểm soát
  - Sai số số thực, ép kiểu và chuyển đổi đơn vị đo
  - Đối chiếu truy vấn InfluxQL, Flux và SQL trên cùng tập dữ liệu
  - Giới hạn giao dịch, tính nhất quán và bảo đảm đọc sau ghi theo sản phẩm
- level1: Bộ máy TSM (1.x/2.x)
  level2:
  - Đường đi của dữ liệu qua WAL, cache và tệp TSM
  - Ghi WAL, xác nhận ghi và phục hồi sau sự cố
  - Snapshot cache và chuyển dữ liệu từ bộ nhớ xuống đĩa
  - Cấu trúc TSM và nén timestamp, giá trị
  - Shard, shard group và quan hệ với retention policy hoặc bucket
  - Chỉ mục chuỗi trong bộ nhớ và Time Series Index
  - Đường đọc, iterator và kết hợp dữ liệu trong cache với TSM
  - Compaction, tombstone và thu hồi dung lượng sau xóa
  - Tác động của cardinality, shard duration và dữ liệu sai thứ tự
  - Phân biệt metadata trong InfluxDB 1.x với InfluxDB 2.x
- level1: Bộ máy InfluxDB 3
  level2:
  - Vai trò Apache Arrow, DataFusion, Parquet và object storage
  - Đường ghi, WAL, vùng đệm và quá trình tạo dữ liệu bền vững
  - Catalog, schema và metadata điều khiển truy cập dữ liệu
  - Đường đọc dữ liệu trong bộ nhớ và tệp Parquet
  - Lưu trữ theo cột, nén và loại bỏ tệp không liên quan
  - Vai trò khóa chính, sắp xếp dữ liệu và thiết kế tag
  - Last Value Cache cho truy vấn giá trị gần nhất
  - Distinct Value Cache cho khám phá giá trị tag theo hỗ trợ
  - Giới hạn lưu giữ, phạm vi truy vấn và tài nguyên trong Core
  - Compaction, chỉ mục và truy vấn lịch sử trong Enterprise theo phiên bản
  - Phân biệt bộ máy lưu trữ của Core và các lựa chọn Enterprise
- level1: Lưu giữ và xóa
  level2:
  - Chọn thời hạn lưu dữ liệu thô, dữ liệu tổng hợp và dữ liệu kiểm toán
  - Retention policy trong InfluxDB 1.x
  - Bucket retention trong InfluxDB 2.x
  - Database retention trong InfluxDB 3 và giới hạn thay đổi cấu hình
  - Thời điểm hết hạn logic và thời điểm thu hồi dung lượng vật lý
  - Xóa theo thời gian và predicate trong InfluxDB 1.x hoặc 2.x
  - Xóa database, table và khả năng xóa từng phần trong InfluxDB 3 theo sản phẩm
  - Phân biệt xóa điểm, xóa measurement và xóa toàn tài nguyên
  - Kiểm tra dữ liệu trước, sau xóa và tác động tới dữ liệu tổng hợp
  - Quản lý dữ liệu hết hạn trong bản sao lưu và object storage
- level1: Tổng hợp định kỳ
  level2:
  - Giảm độ phân giải và thiết kế nhiều tầng lưu trữ
  - Continuous Query và RESAMPLE trong InfluxDB 1.x
  - 'Flux task trong InfluxDB 2.x: every, cron và offset'
  - Đọc dữ liệu nguồn, aggregateWindow() và ghi bằng to()
  - Tham số hóa và tái sử dụng task bằng cơ chế phù hợp InfluxDB 2.x
  - Xử lý dữ liệu muộn, cửa sổ chồng lấn và chạy lại không tạo sai số
  - Lưu sum, count, min, max để tổng hợp tiếp đúng phép toán
  - Theo dõi trạng thái chạy, thời gian thực thi và lỗi của task
  - Chọn Processing Engine hoặc lịch chạy bên ngoài cho InfluxDB 3
  - So sánh xử lý lúc ghi, xử lý định kỳ và tính trực tiếp lúc truy vấn
- level1: Processing Engine (3.x)
  level2:
  - Vai trò Python plugin nhúng trong InfluxDB 3 Core và Enterprise
  - Cấu hình thư mục plugin và môi trường thực thi
  - Cấu trúc plugin, dữ liệu đầu vào và API được cung cấp
  - Trigger theo ghi dữ liệu và quan hệ với WAL
  - Trigger theo lịch và yêu cầu HTTP theo khả năng hỗ trợ
  - Đọc, biến đổi và ghi dữ liệu tổng hợp từ plugin
  - Trạng thái trong bộ nhớ, vòng đời và giới hạn khi khởi động lại
  - Kiểm thử plugin, quản lý thư viện và cố định phụ thuộc
  - Phân quyền, bảo vệ bí mật và giới hạn tác động của mã plugin
  - Quan sát lỗi, chống vòng lặp ghi và xử lý lại an toàn
- level1: Java Client
  level2:
  - Chọn thư viện Java tương thích InfluxDB 1.x, 2.x hoặc 3
  - Khai báo phụ thuộc Maven hoặc Gradle và cố định phiên bản
  - Khởi tạo client bằng URL, database hoặc bucket, organization và token
  - Ánh xạ Instant, Duration và độ chính xác timestamp
  - Tạo Point, gán tag, field và serialize Line Protocol
  - Ghi theo lô, xử lý kết quả bất đồng bộ và lỗi khi flush
  - Truy vấn Flux với client InfluxDB 2.x và đọc nhiều bảng
  - Truy vấn SQL hoặc InfluxQL với client InfluxDB 3 và Arrow Flight
  - Ánh xạ kết quả sang DTO, xử lý NULL và bảo toàn kiểu số
  - Quản lý stream, kết nối, bộ nhớ Arrow và đóng tài nguyên
  - Cấu hình TLS, timeout, retry và khả năng tương thích JDK
- level1: Tích hợp Spring Boot
  level2:
  - Tổ chức lớp cấu hình, lớp truy cập dữ liệu và lớp nghiệp vụ
  - Khai báo cấu hình có kiểu và nạp bí mật từ môi trường
  - Quản lý vòng đời client bằng bean và đóng tài nguyên
  - Thiết kế dịch vụ ghi dữ liệu cảm biến theo lô
  - Thiết kế truy vấn theo khoảng thời gian và giới hạn khối lượng kết quả
  - Kiểm tra đầu vào, múi giờ, đơn vị đo và phạm vi tài nguyên
  - Xử lý luồng chặn trong ứng dụng Servlet hoặc Reactive
  - Ánh xạ lỗi cơ sở dữ liệu thành lỗi ứng dụng có thể xử lý
  - Kết hợp InfluxDB với cơ sở dữ liệu nghiệp vụ và hàng đợi khi cần
  - Thu thập số đo bằng Micrometer và chọn cơ chế xuất phù hợp
  - Flush khi dừng ứng dụng và theo dõi số điểm chưa được gửi
- level1: Dashboard và cảnh báo
  level2:
  - Kết nối Grafana bằng ngôn ngữ và phương thức xác thực phù hợp
  - Dashboard trong InfluxDB 2.x và InfluxDB 3 Explorer
  - Biến dashboard, bộ lọc tag và khoảng thời gian động
  - Chọn bước tổng hợp theo độ rộng biểu đồ và chu kỳ lấy mẫu
  - Biểu diễn đơn vị, múi giờ, dữ liệu thiếu và nhiều chuỗi
  - Checks, notification rules và endpoints trong InfluxDB 2.x
  - Cảnh báo bằng Grafana hoặc thành phần bên ngoài cho InfluxDB 3
  - Ngưỡng cảnh báo, thời gian duy trì và phát hiện mất dữ liệu
  - Chống cảnh báo lặp, dao động quanh ngưỡng và sai lệch do dữ liệu muộn
  - Vai trò Chronograf, Kapacitor trong hệ thống TICK sử dụng InfluxDB 1.x
- level1: Bảo mật
  level2:
  - Phân biệt xác thực, phân quyền và cô lập dữ liệu
  - Người dùng, quyền database và xác thực trong InfluxDB 1.x
  - API token, organization và quyền bucket trong InfluxDB 2.x
  - Token quản trị, token tài nguyên và mô hình quyền InfluxDB 3 theo phiên bản
  - Áp dụng đặc quyền tối thiểu cho người ghi, người đọc và quản trị
  - Luân chuyển, thu hồi, lưu trữ an toàn và kiểm tra token hết hiệu lực
  - TLS, chứng chỉ, proxy và giới hạn truy cập mạng
  - Bảo vệ object storage, ổ đĩa và bản sao lưu
  - Ngăn lộ token, dữ liệu nhạy cảm trong log và dashboard
  - Truy vấn có tham số, danh sách tài nguyên cho phép và giới hạn đầu vào
  - Kiểm toán truy cập và tính năng bảo mật riêng của Enterprise hoặc Cloud
- level1: Tối ưu hiệu năng
  level2:
