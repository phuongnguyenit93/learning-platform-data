  - Phân biệt HA, replication và backup
  - Vai trò các nút, bản sao đọc và compaction trong InfluxDB 3 Enterprise
  - Đánh giá Kubernetes và sản phẩm hỗ trợ triển khai cụm
  - Thu thập tại biên và sao chép dữ liệu theo tính năng từng sản phẩm
  - Đánh giá Cloud theo vùng, giới hạn, chi phí lưu trữ, truy vấn và truyền dữ liệu
  - Nâng cấp có kiểm soát, kiểm tra tương thích và kế hoạch quay lui
