  - Timestamp sai precision, sai múi giờ hoặc nằm ngoài khoảng truy vấn
  - 'Đã ghi thành công nhưng chưa thấy dữ liệu: đích ghi, filter và khả năng hiển thị'
  - Điểm trùng, field bị thay thế và sai khác do khóa dữ liệu
  - Truy vấn sai ngôn ngữ, API hoặc tính năng không được hỗ trợ
  - Truy vấn chậm, quá bộ nhớ, timeout và nghẽn đồng thời
  - Đầy đĩa, WAL tăng, compaction chậm và lỗi object storage
  - Dữ liệu biến mất do retention, thao tác xóa hoặc task sai đích
  - Thu thập bản tái hiện tối thiểu và xác minh nguyên nhân sau sửa lỗi
