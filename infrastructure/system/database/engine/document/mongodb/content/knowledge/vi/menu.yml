menu:
- level1: Tổng quan
  level2:
  - MongoDB là gì và mô hình cơ sở dữ liệu hướng document
  - Các khái niệm database, collection, document, field và namespace
  - Mối liên hệ giữa BSON, truy vấn, index và aggregation
  - So sánh MongoDB với cơ sở dữ liệu quan hệ và các mô hình NoSQL khác
  - Bài toán phù hợp, giới hạn và đánh đổi khi chọn MongoDB
  - Tổng quan standalone, replica set, sharded cluster và dịch vụ Atlas
  - Kiến thức đầu vào và trình tự học từ document đến vận hành
  - Thuật ngữ cốt lõi và cách tra cứu tài liệu theo phiên bản
- level1: Môi trường thực hành
  level2:
  - Lựa chọn MongoDB Community, Enterprise và Atlas theo môi trường
  - Cài đặt MongoDB và kiểm tra phiên bản server, công cụ, driver
  - Dựng môi trường Docker với volume lưu dữ liệu và cấu hình kết nối
  - Khởi tạo replica set phục vụ thực hành giao dịch và change stream
  - Kết nối bằng mongosh và thao tác với MongoDB Compass
  - Đọc connection string, mongodb://, mongodb+srv:// và các tùy chọn URI
  - Tạo bộ dữ liệu mẫu và quy ước thực hành có thể chạy lại
  - Kiểm tra kết nối, log khởi động và dọn dữ liệu thử nghiệm an toàn
- level1: Kiến trúc MongoDB
  level2:
  - Vai trò của mongod, mongos và config server
  - Đường đi của một yêu cầu đọc hoặc ghi trong MongoDB
  - 'WiredTiger: document, index và tổ chức dữ liệu lưu trữ'
  - Bộ nhớ đệm WiredTiger, bộ nhớ hệ điều hành và tập dữ liệu thường dùng
  - Journal, checkpoint và khả năng khôi phục sau sự cố
  - Nén dữ liệu, nén index và đánh đổi CPU với dung lượng
  - Khóa, điều khiển đồng thời và xung đột ghi trong storage engine
  - Phân biệt journal với oplog và dữ liệu sao lưu
  - 'Giới hạn tài nguyên: RAM, ổ đĩa, kết nối và dung lượng lưu trữ'
- level1: BSON và kiểu dữ liệu
  level2:
  - Phân biệt JSON, BSON và Extended JSON
  - Kiểu số int32, int64, double và Decimal128
  - Độ chính xác số, tiền tệ và chuyển đổi kiểu dữ liệu
  - Chuỗi, boolean, object và mảng lồng nhau
  - ObjectId, trường _id và lựa chọn khóa định danh
  - Date, Timestamp, múi giờ và biểu diễn thời gian
  - Binary, UUID và quy ước biểu diễn UUID giữa các driver
  - Phân biệt trường không tồn tại, null, chuỗi rỗng và mảng rỗng
  - Thứ tự so sánh kiểu BSON và ảnh hưởng đến truy vấn, sắp xếp
  - Giới hạn kích thước document, độ lồng nhau và tên trường
  - Đọc ghi Extended JSON mà không làm mất thông tin kiểu BSON
- level1: Database và collection
  level2:
  - Tạo, liệt kê, chọn và xóa database hoặc collection
  - Tạo collection ngầm định và tạo tường minh với tùy chọn
  - Quy tắc đặt tên, namespace và phân biệt chữ hoa chữ thường
  - Collection thông thường và capped collection
  - 'View chỉ đọc: định nghĩa, cách truy vấn và giới hạn'
  - Đọc metadata, thống kê dung lượng và thông tin collection
  - Thay đổi tùy chọn collection bằng collMod trong phạm vi được hỗ trợ
- level1: Mô hình document
  level2:
  - Bắt đầu từ nhu cầu truy vấn, tần suất đọc ghi và vòng đời dữ liệu
  - 'Nhúng document và tham chiếu: tiêu chí lựa chọn'
  - Mô hình quan hệ một một, một nhiều và nhiều nhiều
  - Ranh giới document, tính gắn kết dữ liệu và thao tác nguyên tử
  - Phi chuẩn hóa, sao chép dữ liệu và duy trì tính nhất quán
  - Mảng tăng không giới hạn, document quá lớn và document bị ghi tập trung
  - Các mẫu subset, computed, bucket và attribute
  - Document đa hình và biểu diễn các biến thể nghiệp vụ
  - Mô hình lịch sử, phiên bản và dữ liệu cần lưu trữ lâu dài
  - Đánh giá mô hình bằng truy vấn, index, dung lượng và chi phí cập nhật
- level1: Schema validation
  level2:
  - Schema linh hoạt và trách nhiệm kiểm soát chất lượng dữ liệu
  - Khai báo validator với $jsonSchema và bsonType
  - Trường bắt buộc, enum, khoảng giá trị và quy tắc chuỗi
  - Kiểm tra document lồng nhau, mảng và phần tử mảng
  - Kết hợp biểu thức truy vấn với schema validation
  - validationLevel, validationAction và xử lý document cũ
  - Cập nhật validator, triển khai tương thích và giới hạn bypassDocumentValidation
  - Phân chia kiểm tra dữ liệu giữa MongoDB và ứng dụng
- level1: Thêm document
  level2:
  - insertOne, insertMany và cấu trúc kết quả ghi
  - Tự sinh _id và sử dụng định danh do ứng dụng cung cấp
  - Ghi nhiều document theo thứ tự và không theo thứ tự
  - Lỗi trùng khóa, lỗi validation và kết quả thành công một phần
  - Kiểm soát kích thước lô ghi và giới hạn yêu cầu
  - Thiết kế thao tác thêm có thể gửi lại mà không tạo dữ liệu trùng
- level1: Truy vấn document
  level2:
  - find, findOne và cấu trúc bộ lọc truy vấn
  - So sánh giá trị với $eq, $ne, $gt, $gte, $lt và $lte
  - Kết hợp điều kiện bằng $and, $or, $nor và $not
  - Tập giá trị với $in, $nin và các trường hợp biên
  - Truy vấn trường lồng nhau bằng dot notation và so sánh nguyên document
  - Kiểm tra trường bằng $exists, $type và truy vấn null
  - 'Projection: chọn trường, loại trường và xử lý _id'
  - Sắp xếp nhiều trường và tạo thứ tự ổn định khi giá trị trùng
  - Truy vấn theo thời gian, chuỗi và collation
  - Đếm chính xác, đếm ước lượng và lấy giá trị distinct
  - Phân biệt toán tử truy vấn, biểu thức $expr và biểu thức aggregation
- level1: Truy vấn mảng
  level2:
  - So khớp toàn bộ mảng và so khớp từng phần tử
  - Điều kiện tập phần tử với $all, $in và $nin
  - Ràng buộc nhiều điều kiện trên cùng phần tử bằng $elemMatch
  - Truy vấn mảng document và đường dẫn lồng nhau
  - Kiểm tra kích thước mảng với $size và biểu thức phù hợp
  - Projection mảng bằng $elemMatch, $slice và toán tử vị trí
  - Các trường hợp mảng rỗng, phần tử null và trường không tồn tại
  - Ảnh hưởng của cấu trúc mảng đến multikey index và kế hoạch truy vấn
- level1: Cập nhật document
  level2:
  - updateOne, updateMany và phân biệt matchedCount với modifiedCount
  - replaceOne và giới hạn thay thế document, trường _id
  - Gán, xóa và đổi tên trường với $set, $unset và $rename
  - Cập nhật số và thời gian với $inc, $mul, $min, $max và $currentDate
  - Upsert, $setOnInsert và kiểm soát trùng khóa khi nhiều yêu cầu đồng thời
  - Cập nhật trường lồng nhau mà không thay thế nhầm document con
  - Thêm phần tử bằng $push, $addToSet và các tùy chọn $each, $sort, $slice
  - Loại phần tử bằng $pull, $pullAll và $pop
  - Cập nhật mảng bằng $, $[] và $[identifier] kết hợp arrayFilters
  - Cập nhật bằng aggregation pipeline và giới hạn các stage được phép
  - findOneAndUpdate, findOneAndReplace và lựa chọn document trả về
  - Thiết kế bộ lọc cập nhật có điều kiện và kiểm soát kết quả không khớp
- level1: Xóa và ghi theo lô
  level2:
  - deleteOne, deleteMany và giới hạn thao tác xóa
  - Xóa mềm, xóa vật lý và tác động đến truy vấn, unique index
  - findOneAndDelete và nhu cầu đọc kèm xóa nguyên tử
  - 'bulkWrite: kết hợp thêm, sửa, thay thế và xóa document'
  - Ordered, unordered và cách đọc kết quả hoặc lỗi của bulkWrite
  - Xử lý thành công một phần, gửi lại có chọn lọc và chống ghi trùng
  - Chia lô tác vụ lớn, điều tiết tốc độ và lưu mốc tiếp tục
- level1: Cursor và phân trang
  level2:
  - Vòng đời cursor, getMore và cơ chế tải dữ liệu theo lô
  - batchSize, limit và ảnh hưởng đến bộ nhớ, số lần truyền dữ liệu
  - Đọc tuần tự, đóng cursor và xử lý cursor hết hạn
  - Phân trang bằng skip, limit và chi phí ở trang sâu
  - Phân trang theo khóa với khóa ghép và thứ tự ổn định
  - Đếm tổng số bản ghi và đánh đổi độ chính xác với độ trễ
  - Giới hạn thời gian truy vấn bằng maxTimeMS và xử lý hủy yêu cầu
  - Đọc tập dữ liệu lớn khi dữ liệu có thể thay đổi giữa các lượt
- level1: Index cơ bản
  level2:
  - Index hỗ trợ truy vấn như thế nào và chi phí duy trì khi ghi
  - Index mặc định _id và quản lý createIndex, getIndexes, dropIndex
  - Index đơn và index ghép
  - Thứ tự trường, tiền tố index và khả năng dùng lại index
  - Nguyên tắc equality, sort, range và đánh đổi theo truy vấn
  - Index cho sắp xếp, chiều tăng giảm và bộ lọc kết hợp
  - Truy vấn được index bao phủ và điều kiện cần đọc document
  - Độ chọn lọc, phân bố giá trị và kích thước index
  - Thiết kế bộ index từ truy vấn thực tế và loại index trùng lặp
  - Hidden index và thử nghiệm tác động trước khi loại bỏ index
- level1: Index chuyên biệt
  level2:
  - Multikey index cho mảng và giới hạn index ghép nhiều trường mảng
  - 'Unique index: dữ liệu trùng, null và trường không tồn tại'
  - Sparse index và partial index với điều kiện lọc
  - TTL index, thời gian hết hạn và độ trễ xóa nền
  - Hashed index và phạm vi truy vấn được hỗ trợ
  - Wildcard index cho cấu trúc trường biến đổi
  - Collation của index và yêu cầu tương thích với truy vấn
  - Ràng buộc unique index trong sharded collection
  - Xây dựng index trên hệ thống đang hoạt động và theo dõi tiến trình
  - Giới hạn index theo kiểu collection, phiên bản và mô hình triển khai
- level1: Kế hoạch thực thi
  level2:
  - explain và các mức queryPlanner, executionStats, allPlansExecution
  - Đọc COLLSCAN, IXSCAN, FETCH và SORT trong kế hoạch truy vấn
  - Đối chiếu nReturned, totalKeysExamined và totalDocsExamined
  - Phân tích truy vấn có sort, projection, mảng và nhiều nhánh điều kiện
  - hint, giới hạn sử dụng và cách kiểm chứng một index được đề xuất
  - Query shape, plan cache và thay đổi kế hoạch khi dữ liệu biến động
  - So sánh kế hoạch trước sau trên bộ dữ liệu đại diện
  - Phân biệt thời gian thực thi trong explain với độ trễ ứng dụng
- level1: Aggregation cơ bản
  level2:
  - Luồng document qua pipeline và cách phân biệt stage với expression
  - Lọc sớm bằng $match và quan hệ với index
  - Chọn, thêm, xóa trường bằng $project, $set và $unset
  - Sắp xếp, giới hạn và bỏ qua bằng $sort, $limit, $skip
  - Tách phần tử mảng bằng $unwind và xử lý null hoặc mảng rỗng
  - Gom nhóm bằng $group và lựa chọn khóa nhóm
  - Các accumulator $sum, $avg, $min, $max, $push và $addToSet
  - Đếm bằng $count và tổng hợp tần suất bằng $sortByCount
  - Thay đổi document gốc bằng $replaceRoot và $replaceWith
  - Đọc kết quả aggregation bằng cursor và kiểm chứng từng stage
- level1: Biểu thức aggregation
  level2:
  - Tham chiếu trường, biến hệ thống và phạm vi biến với $let
  - Điều kiện $cond, $switch, $ifNull và xử lý dữ liệu thiếu
  - Kiểm tra, chuyển đổi kiểu bằng $type, $convert và $to*
  - Biểu thức số học, làm tròn và tính toán với Decimal128
  - Xử lý chuỗi, biểu thức chính quy và giới hạn theo collation
  - Xử lý mảng bằng $map, $filter, $reduce và toán tử tập hợp
  - Chuyển đổi object với $objectToArray, $arrayToObject và $mergeObjects
  - Đọc ghi trường động bằng $getField và $setField theo phiên bản hỗ trợ
  - Tính toán ngày giờ, múi giờ, $dateTrunc, $dateAdd và $dateDiff
  - Kiểm chứng biểu thức trên dữ liệu null, sai kiểu và trường không tồn tại
- level1: Aggregation nâng cao
  level2:
  - Kết hợp collection bằng $lookup và pipeline truy vấn con
  - Tác động của index, số bản ghi khớp và kích thước kết quả khi join
  - Duyệt quan hệ bằng $graphLookup và kiểm soát độ sâu
  - Hợp nhất tập dữ liệu bằng $unionWith
  - Tổng hợp nhiều nhánh bằng $facet và giới hạn bộ nhớ riêng
  - Chia khoảng bằng $bucket và $bucketAuto
  - 'Phân tích cửa sổ với $setWindowFields: xếp hạng và tổng lũy kế'
  - Bổ sung khoảng trống với $densify, $fill và điều kiện hỗ trợ
  - Ghi kết quả bằng $out, $merge và kiểm soát tác động lên dữ liệu đích
  - View tổng hợp, dữ liệu tính sẵn và chiến lược cập nhật
  - Giới hạn pipeline, kích thước document và tràn bộ nhớ ra đĩa
  - Đọc explain cho aggregation và tối ưu thứ tự stage
- level1: Nguyên tử và cạnh tranh
  level2:
  - Tính nguyên tử trên một document và giới hạn với nhiều document
  - Tránh mất cập nhật bằng toán tử nguyên tử thay cho đọc rồi ghi
  - Cập nhật có điều kiện và so sánh phiên bản trước khi ghi
  - Khóa lạc quan bằng trường version và xử lý xung đột
  - Unique index bảo vệ ràng buộc khi nhiều yêu cầu chạy đồng thời
  - Write conflict, gửi lại thao tác và yêu cầu về tính lặp an toàn
  - Khóa chống xử lý trùng bằng mã yêu cầu nghiệp vụ
  - Lựa chọn giữa nhúng dữ liệu, cập nhật nguyên tử và giao dịch
- level1: Replica set
  level2:
  - Mục tiêu sao chép và cấu trúc primary, secondary
  - Quorum, thành viên bỏ phiếu và điều kiện có primary
  - Khởi tạo replica set, cấu hình thành viên và kiểm tra rs.status
  - Oplog, cửa sổ lịch sử và độ trễ sao chép
  - Initial sync và bổ sung hoặc thay thế thành viên
  - Bầu chọn, stepdown và xử lý kết nối khi chuyển primary
  - Majority commit point và nguy cơ rollback sau sự cố
  - Priority, votes, arbiter và các đánh đổi về khả năng chịu lỗi
  - Hidden member, delayed member và giới hạn sử dụng
  - Phân bố thành viên theo vùng lỗi và kiểm thử mất thành viên
  - Lựa chọn secondary theo tag và mục đích phân tải đọc
- level1: Nhất quán đọc ghi
  level2:
  - 'Write concern: w, j, wtimeout và mức xác nhận ghi'
  - Phân biệt lỗi xác nhận với thao tác ghi chưa được thực hiện
  - 'Read concern: local, available, majority, linearizable và snapshot'
  - 'Read preference: primary, secondary và các chế độ ưu tiên'
  - Độ trễ sao chép và nguy cơ đọc dữ liệu cũ
  - Logical session, causal consistency và thứ tự thao tác có quan hệ nhân quả
  - Điều kiện bảo đảm đọc lại dữ liệu vừa ghi
  - Snapshot read và phạm vi áp dụng bên ngoài hoặc bên trong giao dịch
  - Kết hợp read concern, write concern và read preference theo nghiệp vụ
  - Đánh đổi tính nhất quán, độ trễ và khả dụng khi mạng bị phân vùng
- level1: Giao dịch
  level2:
  - Khi nào cần giao dịch nhiều document
  - Điều kiện triển khai giao dịch trên replica set và sharded cluster
  - Session, bắt đầu giao dịch, commit và abort
  - Read concern, write concern và read preference trong giao dịch
  - Phân biệt gửi lại toàn giao dịch với gửi lại commit
  - TransientTransactionError, UnknownTransactionCommitResult và xử lý lỗi
  - Giới hạn thời gian, dung lượng và các thao tác bị hạn chế
  - Giao dịch dài, xung đột ghi và ảnh hưởng đến tài nguyên
  - Phối hợp giao dịch với gửi sự kiện bằng transactional outbox
  - Kiểm chứng toàn vẹn dữ liệu khi giao dịch thất bại hoặc ứng dụng mất kết nối
- level1: Sharding
  level2:
  - Phân biệt sharding, replication và phân vùng nghiệp vụ
  - Vai trò mongos, config server replica set và các shard
  - Phân bố dữ liệu, metadata định tuyến, chunk và balancer
  - Chọn shard key theo độ phân tán, tần suất và hướng tăng giá trị
  - Ranged sharding, hashed sharding và khóa ghép
  - Truy vấn định tuyến đúng shard và truy vấn scatter gather
  - Điểm nóng ghi, dữ liệu lệch và truy vấn thiếu shard key
  - Zone sharding và ràng buộc vị trí dữ liệu
  - Ràng buộc _id, unique index và tính duy nhất trên toàn cụm
