references:
  - title: "Apache Cassandra — Tổng quan kiến trúc"
    url: "https://cassandra.apache.org/doc/stable/cassandra/architecture/overview.html"
    description: "Giới thiệu mục tiêu thiết kế, mô hình cột rộng, các khái niệm CQL và phạm vi khả năng của Cassandra."
  - title: "Apache Cassandra — Thiết kế theo truy vấn"
    url: "https://cassandra.apache.org/doc/latest/cassandra/developing/data-modeling/intro.html"
    description: "Cơ sở thiết kế bảng theo truy vấn, lựa chọn khóa phân vùng/khóa phân cụm và đánh giá kích thước phân vùng."
  - title: "CQL — Thao tác dữ liệu"
    url: "https://cassandra.apache.org/doc/stable/cassandra/developing/cql/dml.html"
    description: "Đặc tả truy vấn, ghi, xóa, TTL, timestamp, cập nhật có điều kiện và ngữ nghĩa BATCH."
  - title: "Apache Cassandra — Phân phối, sao chép và nhất quán"
    url: "https://cassandra.apache.org/doc/stable/cassandra/architecture/dynamo.html"
    description: "Các kỹ thuật phân phối token, sao chép, mức nhất quán có thể điều chỉnh và đồng bộ phiên bản dữ liệu."
  - title: "Apache Cassandra — Bộ máy lưu trữ"
    url: "https://cassandra.apache.org/doc/stable/cassandra/architecture/storage-engine.html"
    description: "Đường ghi/đọc, commit log, memtable, SSTable và hoạt động compaction của bộ máy lưu trữ."
  - title: "Apache Cassandra — Khái niệm chỉ mục"
    url: "https://cassandra.apache.org/doc/latest/cassandra/developing/cql/indexing/indexing-concepts.html"
    description: "Phân biệt truy cập theo khóa phân vùng, chỉ mục phụ và SAI; đối chiếu khả năng theo phiên bản."
  - title: "Apache Cassandra Java Driver 4.19 — API cốt lõi"
    url: "https://apache.github.io/cassandra-java-driver/4.19.0/core/"
    description: "Hướng dẫn CqlSession, thực thi truy vấn, xử lý kết quả và quản lý tài nguyên kết nối từ Java."
  - title: "Apache Cassandra Java Driver 4.19 — Tính lũy đẳng"
    url: "https://apache.github.io/cassandra-java-driver/4.19.0/core/idempotence/"
    description: "Định nghĩa tính lũy đẳng của thao tác và quan hệ với retry hoặc thực thi dự phòng."
  - title: "Apache Cassandra — Repair"
    url: "https://cassandra.apache.org/doc/latest/cassandra/managing/operating/repair.html"
    description: "Cơ chế đối soát bản sao, repair toàn phần/tăng dần và các điều kiện cần xét khi lập kế hoạch vận hành."
  - title: "Apache Cassandra — Sao lưu"
    url: "https://cassandra.apache.org/doc/latest/cassandra/managing/operating/backups.html"
    description: "Snapshot, sao lưu tăng dần và các bước chuẩn bị, khôi phục dữ liệu từ bản sao SSTable."
  - title: "Apache Cassandra — Bảo mật"
    url: "https://cassandra.apache.org/doc/latest/cassandra/managing/operating/security.html"
    description: "Xác thực, vai trò, phân quyền và TLS cho kết nối giữa nút hoặc từ ứng dụng."
