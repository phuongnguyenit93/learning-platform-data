menu:
  - level1: "Tổng quan migration"
    level2:
      - "Schema migration là gì và vì sao cần quản lý thay đổi cơ sở dữ liệu bằng phiên bản"
      - "Rủi ro của chỉnh sửa thủ công và sự khác biệt lược đồ giữa các môi trường"
      - "Phân biệt thay đổi lược đồ, chuyển đổi dữ liệu và dữ liệu khởi tạo"
      - "Quan hệ giữa mã nguồn ứng dụng, phiên bản lược đồ và quy trình phát hành"
      - "Cách tiếp cận theo trạng thái mong muốn và theo chuỗi thay đổi có thứ tự"
      - "Các thành phần cơ bản của migration và bảng lịch sử thực thi"
      - "Trách nhiệm của lập trình viên, người vận hành và người duyệt thay đổi"
      - "Giới hạn phạm vi của schema migration so với sao lưu, đồng bộ và di chuyển hệ quản trị"
  - level1: "Mô hình phiên bản"
    level2:
      - "Định danh migration bằng số thứ tự hoặc thời gian và cách tránh trùng phiên bản"
      - "Quy ước đặt tên mô tả mục đích, phạm vi và thứ tự phụ thuộc"
      - "Phân biệt migration có phiên bản, migration lặp lại và changeset"
      - "Tính bất biến của migration đã được thực thi trên môi trường dùng chung"
      - "Checksum và phát hiện nội dung migration bị sửa sau khi phát hành"
      - "Tách một thay đổi lớn thành các migration nhỏ có thứ tự rõ ràng"
      - "Phân biệt khả năng chạy lại an toàn, tính lũy đẳng và việc công cụ ghi nhận đã thực thi"
      - "Quản lý quan hệ giữa phiên bản ứng dụng và tập migration đi kèm"
  - level1: "Vòng đời thực thi"
    level2:
      - "Các bước phát hiện, sắp thứ tự, kiểm tra và áp dụng migration"
      - "Đối chiếu migration đang chờ với lịch sử đã thực thi trong cơ sở dữ liệu"
      - "Ghi nhận trạng thái thành công, thất bại và thay đổi chỉ thực hiện được một phần"
      - "Cơ chế khóa điều phối của công cụ để tránh nhiều tiến trình cùng chạy migration"
      - "Phân biệt khóa điều phối migration với khóa bảng và khóa giao dịch"
      - "Kiểm tra trạng thái lược đồ trước và sau khi nâng cấp"
      - "Xử lý migration thiếu, sai thứ tự hoặc khác nội dung giữa các môi trường"
      - "Phát hiện schema drift khi thay đổi thực tế nằm ngoài lịch sử migration"
  - level1: "Quy trình làm việc nhóm"
    level2:
      - "Lưu migration cùng mã nguồn và tổ chức thư mục theo quy ước của dự án"
      - "Phối hợp khi nhiều nhánh cùng thêm migration vào một lược đồ"
      - "Giải quyết trùng phiên bản trước khi hợp nhất và kiểm thử thứ tự thực thi"
      - "Phân biệt migration chưa chia sẻ với migration đã chạy trên môi trường dùng chung"
      - "Duyệt thay đổi về cấu trúc, dữ liệu, thời gian chạy và khả năng khôi phục"
      - "Quản lý hotfix cơ sở dữ liệu và đồng bộ thay đổi về nhánh phát triển"
      - "Ghi nhận chủ sở hữu, mục đích nghiệp vụ và điều kiện triển khai"
      - "Nguyên tắc lưu trữ hoặc hợp nhất lịch sử cũ mà vẫn hỗ trợ các lộ trình nâng cấp"
  - level1: "Thiết kế thay đổi"
    level2:
      - "Phân tích trạng thái hiện tại và trạng thái đích của lược đồ cùng dữ liệu"
      - "Phân loại thay đổi bổ sung, thay đổi phá vỡ tương thích và thay đổi tốn tài nguyên"
      - "Xác định ứng dụng, tác vụ nền, báo cáo và tích hợp đang phụ thuộc vào cấu trúc cần sửa"
      - "Đặt điều kiện trước khi chạy và tiêu chí xác nhận sau khi chạy"
      - "Ước lượng kích thước dữ liệu, thời gian thực thi, dung lượng tạm và thời gian giữ khóa"
      - "Tách thao tác tạo cấu trúc, chuyển dữ liệu và siết ràng buộc thành các bước phù hợp"
      - "Lựa chọn thời điểm triển khai và giới hạn gián đoạn chấp nhận được"
      - "Lập phương án dừng, tiếp tục, sửa tiến và khôi phục trước khi phát hành"
  - level1: "Thay đổi cấu trúc"
    level2:
      - "Tạo bảng, thêm cột và lựa chọn kiểu dữ liệu phù hợp với dữ liệu hiện có"
      - "Thêm giá trị mặc định và đánh giá việc cập nhật dữ liệu hoặc ghi lại bảng"
      - "Đổi kiểu dữ liệu, độ dài và độ chính xác mà không làm mất thông tin"
      - "Đổi tên hoặc xóa bảng, cột và các đối tượng phụ thuộc"
      - "Thêm NOT NULL sau khi xử lý dữ liệu thiếu và kiểm soát các lượt ghi mới"
      - "Tạo ràng buộc UNIQUE, CHECK và khóa ngoại sau khi kiểm tra dữ liệu vi phạm"
      - "Tạo, thay đổi hoặc loại bỏ chỉ mục và đánh giá ảnh hưởng đến truy vấn cùng thao tác ghi"
      - "Quản lý phụ thuộc của view, trigger và thủ tục khi cấu trúc nền thay đổi"
  - level1: "Tương thích ứng dụng"
    level2:
      - "Tương thích ngược và tương thích tiến giữa mã ứng dụng với lược đồ"
      - "Lập ma trận phiên bản ứng dụng cũ, ứng dụng mới và trạng thái lược đồ chuyển tiếp"
      - "Thiết kế thay đổi bổ sung để ứng dụng cũ tiếp tục đọc và ghi"
      - "Ảnh hưởng của ORM, ánh xạ thực thể và truy vấn liệt kê hoặc ngầm định các cột"
      - "Tách thời điểm triển khai cấu trúc khỏi thời điểm kích hoạt tính năng bằng feature flag"
      - "Duy trì tương thích với tác vụ nền, công cụ báo cáo và bên tiêu thụ dữ liệu"
      - "Xác định thứ tự phát hành cơ sở dữ liệu và ứng dụng trong triển khai cuốn chiếu"
      - "Điều kiện rollback mã ứng dụng khi cơ sở dữ liệu đã được nâng cấp"
  - level1: "Mẫu expand–contract"
    level2:
      - "Các giai đoạn mở rộng, chuyển tiếp và thu gọn của một thay đổi phá vỡ tương thích"
      - "Thêm cấu trúc mới mà vẫn giữ cấu trúc cũ đang được sử dụng"
      - "Chọn cơ chế ghi dữ liệu trong giai đoạn chuyển tiếp và xử lý lỗi khi ghi hai nơi"
      - "Backfill dữ liệu cũ trong khi ứng dụng vẫn tiếp tục hoạt động"
      - "Đối chiếu tính nhất quán trước khi chuyển luồng đọc sang cấu trúc mới"
      - "Chuyển luồng ghi, theo dõi sử dụng cấu trúc cũ và loại bỏ đường xử lý chuyển tiếp"
      - "Chỉ thu gọn sau khi ứng dụng cũ và các bên phụ thuộc đã ngừng sử dụng cấu trúc cũ"
      - "Áp dụng expand–contract để đổi tên cột hoặc thay đổi cách biểu diễn dữ liệu"
  - level1: "Chuyển đổi dữ liệu"
    level2:
      - "Phân biệt dữ liệu tham chiếu bắt buộc, dữ liệu mẫu và dữ liệu nghiệp vụ"
      - "Viết thao tác chuyển đổi với điều kiện chọn bản ghi rõ ràng và kết quả có thể kiểm chứng"
      - "Xử lý NULL, dữ liệu trùng, giá trị không hợp lệ và quy tắc ánh xạ thiếu"
      - "Chuyển đổi định dạng, mã nghiệp vụ, múi giờ và giá trị số mà không gây mất nghĩa"
      - "Duy trì quan hệ khóa chính, khóa ngoại và thứ tự chuyển đổi giữa các bảng"
      - "Chọn thực hiện trong migration hay tách thành tác vụ dữ liệu có kiểm soát"
      - "Xây dựng phép đối soát số lượng, tổng giá trị và bất biến nghiệp vụ"
      - "Xác định dữ liệu cần lưu lại để khôi phục khi phép chuyển đổi không thể đảo ngược"
  - level1: "Backfill theo lô"
    level2:
      - "Rủi ro của một lần cập nhật toàn bảng và mục tiêu chia nhỏ backfill"
      - "Chọn khóa phân trang ổn định, phạm vi bản ghi và thứ tự xử lý"
      - "Thiết kế mỗi lô có giao dịch ngắn và kích thước phù hợp với tải hệ thống"
      - "Lưu tiến độ để tạm dừng và tiếp tục sau khi tiến trình bị gián đoạn"
      - "Chạy lại lô an toàn và tránh ghi đè dữ liệu mới của ứng dụng"
      - "Xử lý bản ghi phát sinh hoặc thay đổi đồng thời trong thời gian backfill"
      - "Điều tiết tốc độ theo tải, thời gian khóa, dung lượng nhật ký và độ trễ bản sao"
      - "Đối soát dữ liệu còn thiếu trước khi kết thúc backfill và siết ràng buộc"
  - level1: "Giao dịch và lỗi"
    level2:
      - "Tính nguyên tử của migration và phạm vi giao dịch do công cụ hoặc cơ sở dữ liệu quyết định"
      - "Khác biệt về DDL trong giao dịch và implicit commit giữa PostgreSQL, MySQL cùng các phiên bản"
      - "Nhận diện thao tác phải chạy ngoài giao dịch theo hệ quản trị đang sử dụng"
      - "Ảnh hưởng của giao dịch dài đến khóa, nhật ký và khả năng phục hồi"
      - "Xác định trạng thái thực tế khi DDL thành công một phần nhưng migration báo lỗi"
      - "Phân biệt lỗi kết nối, lỗi câu lệnh, deadlock và lỗi điều kiện dữ liệu"
      - "Chỉ retry sau khi xác minh thao tác đã hoàn thành hay còn có thể chạy lại an toàn"
      - "Đồng bộ lịch sử công cụ với trạng thái đã kiểm chứng sau khi xử lý sự cố"
  - level1: "Khóa và hiệu năng"
    level2:
      - "Khóa hàng, khóa bảng và khóa metadata có thể xuất hiện khi thay đổi lược đồ"
      - "Nhận diện giao dịch lâu, phiên chặn và hàng đợi khóa trước khi chạy migration"
      - "Ảnh hưởng của tạo chỉ mục, đổi kiểu cột và ghi lại bảng trên dữ liệu lớn"
      - "Đánh giá khả năng DDL online hoặc tạo chỉ mục đồng thời theo hệ quản trị và phiên bản"
      - "Thiết lập thời gian chờ khóa và thời gian thực thi để giới hạn ảnh hưởng"
      - "Đo mức dùng CPU, I/O, dung lượng trống, nhật ký và độ trễ bản sao"
      - "Chọn cửa sổ bảo trì khi yêu cầu khóa không đáp ứng mục tiêu sẵn sàng"
      - "Dừng thao tác có kiểm soát và xác minh trạng thái sau khi hủy câu lệnh"
  - level1: "Rollback và phục hồi"
    level2:
      - "Phân biệt rollback giao dịch, migration ngược, sửa tiến và phục hồi từ bản sao lưu"
      - "Chọn sửa tiến hay quay lui dựa trên trạng thái ứng dụng, dữ liệu và thời gian gián đoạn"
      - "Giới hạn của rollback khi đã xóa dữ liệu, thu hẹp kiểu hoặc chuyển đổi mất thông tin"
      - "Thiết kế thao tác đảo ngược và điều kiện an toàn trước khi thực hiện"
      - "Chuẩn bị sao lưu và kiểm chứng khả năng phục hồi trước thay đổi rủi ro cao"
      - "Khái niệm phục hồi tới thời điểm cùng mục tiêu mất dữ liệu và thời gian khôi phục"
      - "Phối hợp rollback ứng dụng với khả năng tương thích của lược đồ đang tồn tại"
      - "Diễn tập phục hồi và xử lý các lượt ghi phát sinh sau thời điểm sao lưu"
  - level1: "Lựa chọn công cụ"
    level2:
      - "Các khả năng cần có ở công cụ quản lý migration cho một dự án Java"
      - "So sánh cách tổ chức SQL migration của Flyway và changelog của Liquibase"
      - "Đánh giá SQL thuần, định dạng khai báo và nhu cầu kiểm soát câu lệnh theo hệ quản trị"
      - "Kiểm tra hỗ trợ cơ sở dữ liệu, phiên bản công cụ và tính năng theo bản phân phối"
      - "So sánh quản lý lịch sử, kiểm tra checksum và cơ chế điều phối thực thi"
      - "Đánh giá nhu cầu rollback, sinh SQL để duyệt và tích hợp quy trình phát hành"
      - "Chọn một công cụ cho cùng chuỗi thay đổi và tránh hai công cụ cùng quản lý một lược đồ"
      - "Xác định phần công cụ tự động hóa và phần nhóm vẫn phải thiết kế, kiểm thử"
  - level1: "Flyway căn bản"
    level2:
      - "Cấu hình nguồn kết nối, schema đích và vị trí tìm migration"
      - "Quy ước tên và thứ tự thực thi của versioned SQL migration"
      - "Repeatable migration, checksum và thứ tự xử lý các đối tượng có thể tạo lại"
      - "Vai trò của bảng lịch sử và các thao tác info, validate, migrate"
      - "Baseline cho cơ sở dữ liệu hiện hữu và giới hạn khi xác nhận lược đồ ban đầu"
      - "Ngăn sửa migration đã chạy và hiểu điều kiện xử lý migration đến muộn"
      - "Dùng repair sau khi điều tra và đối chiếu trạng thái thực tế của cơ sở dữ liệu"
      - "Bảo vệ môi trường dùng chung khỏi clean và kiểm tra điều kiện hỗ trợ khi cần undo"
  - level1: "Liquibase căn bản"
    level2:
      - "Tổ chức changelog gốc, tệp được include và changeset theo thứ tự triển khai"
      - "Định danh changeset bằng id, author và đường dẫn để giữ ổn định lịch sử"
      - "Lựa chọn SQL định dạng Liquibase hoặc changelog khai báo phù hợp dự án"
      - "Vai trò của DATABASECHANGELOG, DATABASECHANGELOGLOCK và checksum"
      - "Dùng precondition để xác minh giả định và chọn cách xử lý khi điều kiện không đạt"
      - "Dùng context, label và tham số mà vẫn kiểm soát sự nhất quán giữa các môi trường"
      - "Kiểm tra changelog, xem SQL dự kiến và áp dụng thay đổi bằng quy trình được duyệt"
      - "Khai báo rollback, sử dụng tag khi phù hợp và kiểm chứng khả năng đảo ngược của changeset"
  - level1: "Tích hợp Java"
    level2:
      - "Khai báo thư viện, JDBC driver và cấu hình công cụ trong dự án Java"
      - "Tổ chức tài nguyên migration để được đóng gói cùng phiên bản ứng dụng"
      - "Lựa chọn chạy qua Maven, Gradle, dòng lệnh hoặc API theo quy trình triển khai"
      - "Tích hợp Spring Boot và kiểm soát thứ tự chạy migration trước khi phục vụ yêu cầu"
      - "Phối hợp ORM với migration và dùng kiểm tra schema thay cho tự sửa lược đồ ở môi trường dùng chung"
      - "Tách cấu hình datasource và tài khoản migration khỏi tài khoản chạy ứng dụng"
      - "Kiểm soát migration khi nhiều instance cùng khởi động hoặc tự động mở rộng"
      - "Dùng Testcontainers hoặc cơ sở dữ liệu cô lập để kiểm thử migration trong dự án Java"
  - level1: "Quản lý môi trường"
    level2:
      - "Duy trì cùng nội dung migration từ phát triển đến kiểm thử và sản xuất"
      - "Tách tham số kết nối, tên schema và bí mật khỏi logic thay đổi nghiệp vụ"
      - "Kiểm soát placeholder để tránh tạo cấu trúc khác nhau ngoài chủ đích"
      - "Giữ phiên bản hệ quản trị, extension, collation và thiết lập liên quan đủ tương đồng"
      - "Tách dữ liệu mẫu cho phát triển khỏi dữ liệu tham chiếu cần ở mọi môi trường"
      - "Tạo mới môi trường từ lịch sử migration và xác minh khả năng tái lập"
      - "Dùng dữ liệu đại diện đã được bảo vệ khi diễn tập nâng cấp"
      - "Đối chiếu lịch sử và phát hiện thay đổi thủ công giữa các môi trường"
  - level1: "Tiếp nhận hệ thống cũ"
    level2:
      - "Kiểm kê bảng, chỉ mục, ràng buộc và đối tượng phụ thuộc của cơ sở dữ liệu hiện hữu"
      - "So sánh lược đồ thực tế giữa các môi trường trước khi thiết lập baseline"
      - "Chọn mốc bắt đầu quản lý phiên bản và ghi nhận trạng thái được chấp nhận"
      - "Phân biệt baseline lịch sử với migration khởi tạo cho cơ sở dữ liệu trống"
      - "Đảm bảo baseline không làm chạy lại DDL trên các đối tượng đã tồn tại"
      - "Hợp thức hóa chênh lệch bằng thay đổi được duyệt thay vì chỉ sửa bảng lịch sử"
      - "Kiểm thử cả đường tạo mới và đường nâng cấp từ lược đồ cũ"
      - "Chuyển quyền quản lý thay đổi từ thao tác thủ công sang quy trình migration"
  - level1: "Kiểm thử migration"
    level2:
      - "Kiểm thử dựng cơ sở dữ liệu mới từ toàn bộ chuỗi migration"
      - "Kiểm thử nâng cấp từ các phiên bản còn được hỗ trợ và dữ liệu đại diện"
      - "Xác nhận kiểu dữ liệu, chỉ mục, ràng buộc và bất biến nghiệp vụ sau nâng cấp"
      - "Kiểm thử ứng dụng cũ và mới trên các trạng thái lược đồ chuyển tiếp"
      - "Kiểm thử dữ liệu rỗng, NULL, trùng lặp, giá trị biên và dữ liệu không hợp lệ"
      - "Mô phỏng gián đoạn, thực thi một phần và chạy lại hoặc tiếp tục có kiểm soát"
      - "Kiểm thử migration ngược hoặc diễn tập sửa tiến và khôi phục tùy phương án đã chọn"
      - "Đo thời gian chạy và ảnh hưởng khóa với quy mô dữ liệu gần thực tế"
  - level1: "Kiểm tra trong CI"
    level2:
      - "Kiểm tra quy ước tên, trùng định danh, cú pháp và tính toàn vẹn lịch sử migration"
      - "Phát hiện migration đã phát hành bị sửa hoặc bị xóa khỏi mã nguồn"
      - "Khởi tạo cơ sở dữ liệu cô lập đúng hệ quản trị cho từng lần kiểm tra"
      - "Tự động chạy kiểm thử tạo mới, nâng cấp và tích hợp ứng dụng trong pipeline"
      - "Kiểm tra SQL dự kiến cùng các thao tác xóa dữ liệu, khóa lớn hoặc không thể đảo ngược"
      - "Xác minh kết quả lược đồ và dữ liệu bằng các tiêu chí hậu kiểm có thể tự động hóa"
      - "Đóng gói migration vào cùng artifact đã kiểm thử để đưa qua các môi trường"
      - "Lưu kết quả kiểm tra và đặt điều kiện chặn phát hành khi phát hiện sai lệch"
  - level1: "Triển khai trong CD"
    level2:
      - "Chọn chạy migration bằng bước triển khai riêng hoặc khi ứng dụng khởi động"
      - "Chỉ định một đầu mối thực thi và điều phối các lượt triển khai đồng thời"
      - "Kiểm tra kết nối, quyền, phiên bản nguồn, sao lưu và tài nguyên trước triển khai"
      - "Sắp thứ tự mở rộng lược đồ, phát hành ứng dụng, backfill và thu gọn"
      - "Phân biệt thời gian chạy của pipeline với thời gian chờ khóa và thực thi trong cơ sở dữ liệu"
      - "Ngăn pipeline tiếp tục phát hành khi migration thất bại hoặc trạng thái chưa rõ"
      - "Chạy lại bước triển khai dựa trên lịch sử và trạng thái thực tế đã được xác nhận"
      - "Theo dõi sau phát hành và quyết định tiếp tục, dừng, sửa tiến hoặc khôi phục"
  - level1: "Quan sát và vận hành"
    level2:
      - "Ghi log định danh migration, phiên bản artifact, môi trường và kết quả thực thi"
      - "Đo thời gian từng bước, số bản ghi xử lý và tiến độ backfill"
      - "Theo dõi khóa chờ, lỗi ứng dụng, tài nguyên và độ trễ bản sao trong triển khai"
      - "Cảnh báo migration thất bại, chạy quá lâu hoặc lệch lịch sử giữa các môi trường"
      - "Hậu kiểm truy vấn quan trọng và các chỉ số nghiệp vụ sau thay đổi"
      - "Lưu bằng chứng triển khai và liên kết thay đổi với người thực hiện, bản phát hành"
      - "Soạn quy trình thao tác khi cần dừng, tiếp tục, sửa tiến hoặc phục hồi"
      - "Rút kinh nghiệm sự cố để cập nhật tiêu chí kiểm thử và giới hạn vận hành"
  - level1: "Bảo mật và quản trị"
    level2:
      - "Áp dụng quyền tối thiểu cho tài khoản migration theo phạm vi thay đổi cần thiết"
      - "Tách quyền thay đổi lược đồ khỏi quyền đọc ghi thường ngày của ứng dụng"
      - "Quản lý bí mật kết nối trong môi trường triển khai và tránh lưu vào mã nguồn"
      - "Kiểm tra quyền sở hữu đối tượng và quyền truy cập sau khi tạo hoặc thay thế cấu trúc"
      - "Tránh đưa dữ liệu nhạy cảm vào migration, log và dữ liệu mẫu"
      - "Kiểm soát thay đổi xóa dữ liệu theo yêu cầu lưu giữ và quy trình phê duyệt của dự án"
      - "Ghi nhận quyền truy cập khẩn cấp và đưa mọi thay đổi ngoài quy trình về lịch sử được kiểm chứng"
      - "Xác định trách nhiệm của từng dịch vụ khi dùng chung cơ sở dữ liệu hoặc schema"
  - level1: "Xử lý sự cố"
    level2:
      - "Điều tra checksum không khớp mà vẫn bảo toàn bằng chứng migration đã chạy"
      - "Giải quyết trùng phiên bản, thiếu migration và thứ tự khác với dự kiến"
      - "Xử lý khóa điều phối còn tồn tại sau khi xác minh không còn tiến trình thực thi"
      - "Điều tra lỗi quyền, schema đích, cấu hình kết nối và đối tượng không tồn tại"
      - "Tìm nguyên nhân timeout, deadlock và câu lệnh bị giao dịch khác chặn"
      - "Phục hồi từ migration thực thi một phần khi DDL không được rollback hoàn toàn"
      - "Xử lý schema drift do hotfix thủ công mà không che giấu chênh lệch"
      - "Tránh xóa lịch sử, bỏ kiểm tra hoặc chạy lại mù quáng để vượt qua lỗi triển khai"
  - level1: "Bài thực hành"
    level2:
      - "Khởi tạo dự án Java với một cơ sở dữ liệu và chọn Flyway hoặc Liquibase"
      - "Tạo bảng nghiệp vụ ban đầu, thêm chỉ mục và dữ liệu tham chiếu bằng migration"
      - "Thêm cột mới tương thích ứng dụng rồi backfill trước khi áp dụng NOT NULL"
      - "Đổi cách lưu một thuộc tính bằng expand–contract và kiểm thử ứng dụng cũ cùng mới"
      - "Tạo dữ liệu vi phạm để thực hành tiền kiểm, xử lý lỗi và tiếp tục migration"
      - "Mô phỏng giao dịch giữ khóa để đo thời gian chờ và kiểm chứng cơ chế dừng"
      - "Thiết lập CI kiểm thử tạo mới, nâng cấp và triển khai cùng artifact đã kiểm chứng"
      - "Diễn tập sửa tiến hoặc khôi phục, đối soát dữ liệu và đánh giá kết quả theo tiêu chí hoàn thành"
