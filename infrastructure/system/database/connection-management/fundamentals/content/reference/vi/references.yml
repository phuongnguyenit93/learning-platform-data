references:
  - title: "Oracle JDBC - DataSource API"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/javax/sql/DataSource.html"
    description: "DataSource là cách được ưu tiên để lấy connection, bao gồm triển khai cơ bản và pooling."
  - title: "Oracle JDBC - DriverManager API"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/java/sql/DriverManager.html"
    description: "Cách DriverManager quản lý JDBC drivers và tạo connection."
  - title: "Oracle JDBC - Connection API"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/java/sql/Connection.html"
    description: "Vòng đời Connection, AutoCloseable, commit, rollback và transaction isolation."
  - title: "Oracle Tutorial - Connecting with DataSource"
    url: "https://docs.oracle.com/javase/tutorial/jdbc/basics/sqldatasources.html"
    description: "So sánh DataSource với DriverManager và cơ chế lấy/trả pooled connection."
  - title: "Oracle Tutorial - JDBC Transactions"
    url: "https://docs.oracle.com/javase/tutorial/jdbc/basics/transactions.html"
    description: "Auto-commit, transaction, commit/rollback và các mức isolation."
  - title: "Spring Framework - Database Connections"
    url: "https://docs.spring.io/spring-framework/reference/data-access/jdbc/connections.html"
    description: "Kết nối qua DataSource, DataSourceUtils và tích hợp với transaction management."
  - title: "Spring Framework - Transactional"
    url: "https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html"
    description: "Định nghĩa phạm vi transaction trong ứng dụng Java dùng Spring."
  - title: "HikariCP - About Pool Sizing"
    url: "https://github.com/brettwooldridge/HikariCP/wiki/About-Pool-Sizing"
    description: "Nguyên tắc sizing pool theo khả năng database và giới hạn đồng thời."
  - title: "HikariCP - Official Documentation"
    url: "https://github.com/brettwooldridge/HikariCP"
    description: "Các cấu hình pool, timeouts, connection lifecycle và chỉ số vận hành."