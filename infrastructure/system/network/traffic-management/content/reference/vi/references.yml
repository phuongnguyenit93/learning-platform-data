references:
  - title: "NGINX - HTTP Load Balancing"
    url: "https://docs.nginx.com/nginx/admin-guide/load-balancer/http-load-balancer/"
    description: "Phân phối HTTP theo round robin, least connections, trọng số và health check."
  - title: "NGINX - Limiting Access to Proxied HTTP Resources"
    url: "https://docs.nginx.com/nginx/admin-guide/security-controls/controlling-access-proxied-http"
    description: "Giới hạn số kết nối, tốc độ yêu cầu, burst và băng thông."
  - title: "Envoy - Load Balancing Overview"
    url: "https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/upstream/load_balancing/overview"
    description: "Cân bằng tải phân tán, trọng số, vị trí backend và điều hướng lưu lượng."
  - title: "RFC 2475 - Differentiated Services"
    url: "https://www.rfc-editor.org/info/rfc2475/"
    description: "Kiến trúc QoS dựa trên phân loại, đánh dấu và hành vi chuyển tiếp gói."
  - title: "Envoy - Circuit Breaking"
    url: "https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/upstream/circuit_breaking"
    description: "Giới hạn kết nối, yêu cầu đang chờ và retry để bảo vệ upstream."
  - title: "Envoy - Health Checking"
    url: "https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/upstream/health_checking"
    description: "Kiểm tra sức khỏe backend, loại bỏ endpoint lỗi và phục hồi lưu lượng."
  - title: "Google SRE - Monitoring Distributed Systems"
    url: "https://sre.google/sre-book/monitoring-distributed-systems/"
    description: "Bốn nhóm tín hiệu phục vụ theo dõi độ trễ, lưu lượng, lỗi và độ bão hòa."