references:
  - title: "RFC 1122 – Requirements for Internet Hosts"
    url: "https://www.rfc-editor.org/rfc/rfc1122.html"
    description: "Nền tảng về liên kết, IP, ICMP và tầng vận chuyển của host."
  - title: "RFC 1035 – Domain Names"
    url: "https://www.rfc-editor.org/rfc/rfc1035.html"
    description: "Truy vấn, phản hồi và bản ghi DNS để phân tích sự cố phân giải tên."
  - title: "RFC 792 – Internet Control Message Protocol"
    url: "https://www.rfc-editor.org/rfc/rfc792.html"
    description: "Các bản tin ICMP và ý nghĩa khi kiểm tra đường mạng."
  - title: "RFC 9293 – Transmission Control Protocol"
    url: "https://www.rfc-editor.org/rfc/rfc9293.html"
    description: "Thiết lập kết nối, TCP port, retransmission và trạng thái kết nối."
  - title: "RFC 8446 – TLS 1.3"
    url: "https://www.rfc-editor.org/rfc/rfc8446.html"
    description: "Cơ chế bắt tay TLS và nguyên nhân sự cố phiên bảo mật."
  - title: "Linux ip-route(8) Manual"
    url: "https://man7.org/linux/man-pages/man8/ip-route.8.html"
    description: "Lệnh kiểm tra bảng định tuyến và đường đi của Linux."
  - title: "Wireshark – Display Filters"
    url: "https://wiki.wireshark.org/Displayfilters"
    description: "Cách lọc gói TCP, DNS, ICMP và các giao thức khi chẩn đoán."