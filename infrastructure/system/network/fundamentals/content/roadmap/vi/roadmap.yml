roadmap:
- id: tong-quan-mang-may-tinh
  title: Tổng quan mạng máy tính
  purpose: Nắm vai trò của mạng và cách các thiết bị kết nối với nhau.
  objectives:
  - Phân biệt LAN, WAN và Internet
  - Nhận diện host, switch, router và access point
- id: mo-hinh-osi-tcp-ip
  title: Mô hình OSI & TCP/IP
  purpose: Hiểu cách dữ liệu được đóng gói và truyền qua các tầng giao thức.
  objectives:
  - Đối chiếu các tầng OSI với TCP/IP
  - Giải thích frame, packet, segment và encapsulation
- id: ethernet-switching
  title: Ethernet & Switching
  purpose: Nắm nguyên lý truyền dữ liệu trong cùng mạng cục bộ.
  objectives:
  - Phân biệt địa chỉ MAC và địa chỉ IP
  - Giải thích vai trò switch, ARP và broadcast
- id: dia-chi-ip-subnet
  title: Địa chỉ IP & Subnet
  purpose: Biết cách xác định mạng con và địa chỉ của thiết bị.
  objectives:
  - Phân biệt IPv4, IPv6 và địa chỉ private/public
  - Tính network, host range và subnet từ CIDR
- id: routing-gateway
  title: Routing & Gateway
  purpose: Hiểu đường đi của gói tin giữa các mạng khác nhau.
  objectives:
  - Đọc default gateway và bảng định tuyến cơ bản
  - Mô tả next hop và luồng chuyển tiếp gói tin
- id: tcp-udp-ports
  title: TCP, UDP & Ports
  purpose: Phân biệt cơ chế vận chuyển dữ liệu của các ứng dụng.
  objectives:
  - Giải thích kết nối, độ tin cậy và thứ tự của TCP
  - So sánh UDP và xác định vai trò port/socket
- id: dns-dhcp-nat
  title: DNS, DHCP & NAT
  purpose: Hiểu các dịch vụ hỗ trợ thiết bị kết nối và sử dụng Internet.
  objectives:
  - Mô tả quy trình phân giải tên miền bằng DNS
  - Giải thích cấp IP qua DHCP và chuyển đổi địa chỉ NAT
- id: chan-doan-mang-co-ban
  title: Chẩn đoán mạng cơ bản
  purpose: Áp dụng kiến thức nền để khoanh vùng lỗi kết nối.
  objectives:
  - Dùng ping, traceroute và nslookup hoặc dig
  - Kiểm tra IP, route, DNS và đọc gói tin cơ bản
