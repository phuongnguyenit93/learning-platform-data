references:
  - title: "RFC 1034 - Domain Names: Concepts and Facilities"
    url: "https://www.rfc-editor.org/info/rfc1034/"
    description: "Khái niệm DNS, cấu trúc tên miền, name server, resolver và ủy quyền."
  - title: "RFC 1035 - Domain Names: Implementation and Specification"
    url: "https://www.rfc-editor.org/info/rfc1035/"
    description: "Thông điệp truy vấn, định dạng và các loại bản ghi DNS cơ bản."
  - title: "RFC 2308 - Negative Caching of DNS Queries"
    url: "https://datatracker.ietf.org/doc/rfc2308/"
    description: "Quy tắc lưu cache các câu trả lời DNS không tồn tại hoặc không có dữ liệu."
  - title: "RFC 4033 - DNS Security Introduction and Requirements"
    url: "https://www.rfc-editor.org/info/rfc4033/"
    description: "Giới thiệu DNSSEC, xác thực nguồn gốc và toàn vẹn dữ liệu DNS."
  - title: "RFC 7766 - DNS Transport over TCP"
    url: "https://datatracker.ietf.org/doc/html/rfc7766"
    description: "Vai trò TCP bên cạnh UDP và yêu cầu hỗ trợ TCP cho DNS."
  - title: "RFC 8484 - DNS Queries over HTTPS"
    url: "https://datatracker.ietf.org/doc/html/rfc8484"
    description: "Gửi truy vấn và nhận phản hồi DNS qua HTTPS để bảo vệ kênh trao đổi."