      - "Phân biệt tài khoản người dùng, tài khoản hệ thống và tài khoản dịch vụ"
      - "Quyền sở hữu, quyền được cấp, đặc quyền và quyền truy cập hiệu lực"
      - "Ranh giới bảo mật giữa máy chủ, phiên đăng nhập, dịch vụ và container"
      - "Đối chiếu user, group, UID/GID, SID, ACL và cơ chế nâng quyền của Linux với Windows"
  - level1: "Danh tính Linux"
    level2:
      - "UID, GID và cách kernel xác định danh tính người dùng, nhóm"
      - "Người dùng root, tài khoản thường và dải ID dành cho tài khoản hệ thống"
      - "Nhóm chính, nhóm bổ sung và ý nghĩa của danh sách nhóm"
      - "Cấu trúc /etc/passwd, /etc/shadow, /etc/group và /etc/gshadow"
      - "Tra cứu danh tính bằng id, whoami, groups và getent"
      - "NSS và thứ tự tra cứu danh tính từ tệp cục bộ, LDAP hoặc Active Directory"
      - "Phân biệt tên tài khoản hiển thị với UID/GID lưu trên hệ thống tệp"
      - "Rủi ro trùng ID, tái sử dụng ID và tệp không còn chủ sở hữu hợp lệ"
  - level1: "Tài khoản Linux"
    level2:
      - "Tạo tài khoản bằng useradd và adduser, nhận biết khác biệt theo bản phân phối"
      - "Thiết lập thư mục home, shell đăng nhập, nhóm chính và tệp mẫu /etc/skel"
      - "Chỉnh sửa tài khoản bằng usermod và cập nhật thông tin nhận diện"
      - "Đặt mật khẩu, ngày hết hạn và chu kỳ đổi mật khẩu bằng passwd, chage"
      - "Phân biệt khóa mật khẩu, hết hạn tài khoản và vô hiệu hóa đăng nhập"
      - "Quản lý tài khoản dịch vụ với shell nologin và home phù hợp"
      - "Đổi UID/GID và rà soát quyền sở hữu trên từng hệ thống tệp"
      - "Xóa tài khoản bằng userdel, xử lý dữ liệu và tiến trình còn tồn tại"
      - "Kiểm tra cấu hình mặc định trong /etc/login.defs và thiết lập của useradd"
  - level1: "Nhóm Linux"
    level2:
      - "Tạo, đổi tên và xóa nhóm bằng groupadd, groupmod, groupdel"
      - "Thêm hoặc gỡ nhóm bổ sung bằng usermod và gpasswd"
      - "Tránh mất nhóm hiện có khi sử dụng usermod -G và -aG"
      - "Thay đổi nhóm chính và ảnh hưởng đến tệp mới được tạo"
      - "Hiệu lực thay đổi nhóm trong phiên hiện tại, phiên mới và tiến trình đang chạy"
      - "Chuyển ngữ cảnh nhóm bằng newgrp và sg"
      - "Thiết kế nhóm theo vai trò cho thư mục dùng chung và dịch vụ"
      - "Rà soát nhóm nhạy cảm như sudo, wheel, docker và nhóm truy cập thiết bị"
  - level1: "Xác thực Linux"
    level2:
      - "Luồng đăng nhập và vai trò của PAM trong xác thực, tài khoản, mật khẩu và phiên"
      - "Phân biệt quyết định của PAM với kiểm tra quyền truy cập của kernel"
      - "Chính sách mật khẩu, giới hạn thử sai và khóa đăng nhập"
      - "Đăng nhập SSH bằng mật khẩu hoặc khóa và quyền truy cập thư mục .ssh"
      - "Giới hạn truy cập từ xa bằng AllowUsers, AllowGroups và cấu hình đăng nhập root"
      - "Phân biệt chuyển tài khoản bằng su, su - và thực thi lệnh bằng sudo"
      - "Tích hợp danh tính tập trung qua SSSD, LDAP và Active Directory ở mức hệ điều hành"
      - "Giới hạn phiên, tài nguyên và môi trường đăng nhập của tài khoản"
      - "Thu hồi quyền khi phiên, khóa SSH hoặc thông tin xác thực còn hiệu lực"
  - level1: "Quyền POSIX"
    level2:
      - "Đọc quyền, chủ sở hữu, nhóm và loại tệp từ ls -l, stat"
      - "Ba lớp quyền owner, group, others và cách kernel chọn lớp để kiểm tra"
      - "Quyền đọc, ghi, thực thi đối với tệp thông thường"
      - "Biểu diễn quyền bằng ký hiệu rwx và giá trị bát phân"
      - "Tính quyền truy cập của chủ sở hữu, thành viên nhóm và người dùng khác"
      - "Phân biệt quyền ghi nội dung, thay đổi metadata và thay đổi quyền"
      - "Ảnh hưởng của UID hiệu lực, GID hiệu lực và nhóm bổ sung đến truy cập"
      - "Phân biệt quyền đọc tệp, chạy chương trình và khả năng thực thi định dạng tệp"
      - "Giới hạn của mô hình owner/group/others khi nhiều nhóm cần quyền khác nhau"
  - level1: "Truy cập thư mục"
    level2:
      - "Ý nghĩa quyền đọc, ghi và tìm kiếm x đối với thư mục"
      - "Quyền tìm kiếm trên mọi thư mục cha trong đường dẫn"
      - "Điều kiện tạo, xóa và đổi tên tệp trong thư mục"
      - "Vì sao quyền xóa tệp phụ thuộc vào thư mục chứa tệp"
      - "Phân biệt liệt kê tên tệp với truy cập một tên tệp đã biết"
      - "Quyền trên thư mục home, thư mục tạm và thư mục dùng chung"
      - "Ảnh hưởng của symbolic link và hard link đến truy cập, sở hữu và xóa tệp"
      - "Lần theo quyền của từng thành phần đường dẫn bằng namei"
      - "Thiết kế thư mục trao đổi dữ liệu chỉ ghi, chỉ đọc hoặc dùng chung"
  - level1: "Thiết lập quyền Linux"
    level2:
      - "Thay đổi quyền bằng chmod với cú pháp ký hiệu và bát phân"
      - "Thay đổi chủ sở hữu và nhóm bằng chown, chgrp"
      - "Áp dụng quyền đệ quy và phân biệt nhu cầu quyền của tệp với thư mục"
      - "Sử dụng quyền X để cấp thực thi có điều kiện"
      - "Ảnh hưởng của symbolic link khi thay đổi quyền và sở hữu"
      - "umask và cách loại bỏ bit quyền khỏi chế độ tạo tệp, thư mục"
      - "Phạm vi umask trong shell, phiên đăng nhập, tiến trình và dịch vụ"
      - "Kết hợp nhóm dùng chung, setgid và umask cho dữ liệu cộng tác"
      - "Kiểm tra quyền sau sao chép, di chuyển, giải nén và khôi phục"
      - "Phân biệt quyền POSIX với thuộc tính immutable, append-only và trạng thái chỉ đọc"
  - level1: "Quyền đặc biệt"
    level2:
      - "setuid trên tệp thực thi và sự thay đổi UID hiệu lực"
      - "setgid trên tệp thực thi và sự thay đổi GID hiệu lực"
      - "setgid trên thư mục và kế thừa nhóm cho đối tượng mới"
      - "Sticky bit trên thư mục dùng chung và điều kiện xóa, đổi tên"
      - "Đọc các ký hiệu s, S, t, T trong kết quả ls -l"
      - "Thiết lập, gỡ bỏ và tìm kiếm các bit quyền đặc biệt"
      - "Giới hạn và rủi ro của chương trình setuid, setgid"
      - "Ảnh hưởng của nosuid, noexec và no_new_privs đến hành vi nâng quyền"
      - "Rà soát quyền đặc biệt sau cài đặt gói, triển khai và phục hồi dữ liệu"
  - level1: "ACL POSIX"
    level2:
      - "ACL truy cập và trường hợp cần nhiều người dùng hoặc nhóm có quyền khác nhau"
      - "Đọc ACL bằng getfacl và nhận diện dấu cộng trong ls -l"
      - "Cấp, sửa và xóa ACL bằng setfacl"
      - "ACL mask và cách tính quyền hiệu lực của các mục chịu mask"
      - "Thứ tự xét owner, named user, group và others trong ACL POSIX"
      - "Default ACL trên thư mục và cách đối tượng mới kế thừa ACL"
      - "Tương tác giữa chmod, ACL mask, chế độ tạo tệp và default ACL"
      - "Thiết kế ACL cho thư mục cộng tác có nhiều vai trò"
      - "Sao lưu, khôi phục và bảo toàn ACL khi sao chép dữ liệu"
      - "Nhận biết giới hạn hỗ trợ ACL theo hệ thống tệp và giao thức chia sẻ"
  - level1: "Ủy quyền sudo"
    level2:
      - "Cơ chế sudo và sự khác biệt giữa sudo, su và đăng nhập root trực tiếp"
      - "Cấu trúc /etc/sudoers, thư mục sudoers.d và kiểm tra bằng visudo"
      - "Quy tắc theo người dùng, nhóm, máy chủ, Runas và lệnh được phép"
      - "Liệt kê quyền sudo bằng sudo -l và kiểm thử bằng tài khoản được ủy quyền"
      - "Thiết kế danh sách lệnh cụ thể, giới hạn tham số và sử dụng đường dẫn tuyệt đối"
      - "PASSWD, NOPASSWD, bộ nhớ đệm xác thực và thu hồi phiên sudo"
      - "Kiểm soát biến môi trường, PATH, thư mục làm việc và tệp cấu hình"
      - "Rủi ro từ shell escape, trình soạn thảo, wildcard và chương trình gọi lệnh khác"
      - "Sử dụng sudoedit để cho phép sửa tệp theo phạm vi cần thiết"
      - "Ghi nhận lệnh quản trị, đầu vào, đầu ra và yêu cầu bảo vệ nhật ký"
      - "Kiểm thử quy tắc, phương án cứu hộ và phục hồi khi cấu hình sudo sai"
  - level1: "Capabilities Linux"
    level2:
      - "Chia nhỏ đặc quyền root thành Linux capabilities"
      - "Các tập permitted, effective, inheritable, bounding và ambient"
