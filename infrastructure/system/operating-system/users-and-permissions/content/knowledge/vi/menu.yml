      - "Nhận diện tài khoản hiện tại bằng whoami và các lệnh PowerShell"
      - "Tác động của việc đổi tên, xóa, tạo lại tài khoản đến SID và quyền"
      - "Phạm vi trust và sự khác biệt giữa danh tính cục bộ với danh tính miền"
  - level1: "Tài khoản Windows"
    level2:
