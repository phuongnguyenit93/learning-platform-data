      - "Cấp và gỡ file capabilities bằng setcap"
      - "Phạm vi sử dụng CAP_NET_BIND_SERVICE, CAP_CHOWN và CAP_DAC_OVERRIDE"
      - "Rủi ro của CAP_SYS_ADMIN và các capability có phạm vi rộng"
      - "Tương tác giữa capabilities, execve, setuid và no_new_privs"
      - "Thiết kế capability tối thiểu cho dịch vụ và container"
      - "Giới hạn capabilities bằng systemd và cấu hình runtime container"
  - level1: "SELinux và AppArmor"
    level2:
      - "Vai trò của kiểm soát truy cập bắt buộc khi quyền POSIX hoặc ACL đã cho phép"
      - "SELinux context, domain, type và quyết định truy cập"
      - "Nhận diện trạng thái enforcing, permissive và disabled của SELinux"
      - "Đọc thông báo AVC để xác định chủ thể, đối tượng và hành động bị chặn"
      - "Khôi phục nhãn bằng restorecon và khai báo nhãn bền vững bằng semanage fcontext"
      - "AppArmor profile, chế độ enforce, complain và nhật ký từ chối"
      - "Điều chỉnh chính sách hoặc nhãn theo nhu cầu thực tế của ứng dụng"
      - "Kiểm chứng nguyên nhân trước khi thay đổi chính sách SELinux hoặc AppArmor"
  - level1: "Danh tính Windows"
    level2:
      - "Tài khoản cục bộ, tài khoản miền và tài khoản Microsoft"
