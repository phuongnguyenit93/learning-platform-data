menu:
  - level1: "Nguyên lý truy cập"
    level2:
      - "Phân biệt định danh, xác thực, phân quyền và kiểm toán truy cập"
      - "Chủ thể, đối tượng, hành động và ngữ cảnh trong quyết định cấp quyền"
      - "Mô hình DAC, MAC, RBAC và cách áp dụng trong hệ điều hành"
