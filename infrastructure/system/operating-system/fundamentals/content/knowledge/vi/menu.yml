      - "Chờ tiến trình con, mã thoát và thu hồi tài nguyên"
      - "Tiến trình zombie, tiến trình mồ côi và trách nhiệm thu dọn"
      - "Nhóm tiến trình, session, tiến trình tiền cảnh và nền"
      - "Biến môi trường, thư mục làm việc và tài nguyên được kế thừa"
      - "Chuyển ngữ cảnh tiến trình và tác động đến cache, TLB và hiệu năng"
  - level1: "Luồng"
    level2:
      - "Luồng là gì: tài nguyên dùng chung và trạng thái thực thi riêng"
