      - "So sánh tiến trình với luồng về chi phí, chia sẻ và mức độ cô lập"
      - "Luồng ở user space, luồng kernel và mô hình ánh xạ luồng"
      - "Tạo, kết thúc, join, detach và hủy luồng"
      - "Concurrency và parallelism trong chương trình đa luồng"
      - "Tác vụ giới hạn bởi CPU và tác vụ giới hạn bởi I/O"
      - "Thread pool, số lượng luồng và chi phí tạo quá nhiều luồng"
