      - "SJF và SRTF: dự đoán CPU burst và hạn chế khi áp dụng"
      - "Round Robin: lát thời gian và chi phí chuyển ngữ cảnh"
      - "Độ ưu tiên, hàng đợi nhiều mức, phản hồi nhiều mức và aging"
