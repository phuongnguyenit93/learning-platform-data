references:
  - title: "Microsoft Learn — Processes and Threads"
    url: "https://learn.microsoft.com/en-us/windows/win32/procthread/processes-and-threads"
    description: "Khái niệm process, thread, địa chỉ ảo, tài nguyên chia sẻ, thread pool và lập lịch."
  - title: "Oracle Java Tutorials — Processes and Threads"
    url: "https://docs.oracle.com/javase/tutorial/essential/concurrency/procthread.html"
    description: "So sánh process và thread, bộ nhớ riêng/chung, time slicing và IPC."
  - title: "Linux man-pages — pthreads(7)"
    url: "https://man7.org/linux/man-pages/man7/pthreads.7.html"
    description: "Mô hình POSIX threads, tài nguyên được chia sẻ và khác biệt giữa process với thread."
  - title: "GNU C Library — Process Creation Concepts"
    url: "https://www.gnu.org/software/libc/manual/html_node/Process-Creation-Concepts.html"
    description: "Tạo process bằng fork/posix_spawn, quan hệ parent-child, exec và wait."
  - title: "Linux Kernel Documentation — Scheduler"
    url: "https://docs.kernel.org/scheduler/"
    description: "Các chính sách, lớp lập lịch, preemption, scheduler domains và quản lý CPU."
  - title: "Linux Kernel Documentation — CFS Scheduler"
    url: "https://docs.kernel.org/scheduler/sched-design-CFS.html"
    description: "Virtual runtime, run queue, fairness, scheduling class và cách chọn task tiếp theo."
  - title: "Microsoft Learn — Processes, Threads, and Apartments"
    url: "https://learn.microsoft.com/en-us/windows/win32/com/processes--threads--and-apartments"
    description: "Không gian tiến trình, thread context, tài nguyên dùng chung và quan hệ scheduler."
  - title: "Java SE — Thread API"
    url: "https://docs.oracle.com/en/java/javase/26/docs/api/java.base/java/lang/Thread.html"
    description: "Vòng đời thread, start, join, interrupt và quản lý execution."