  - Các luồng output, error, warning, verbose và information
  - try, catch, finally và điều kiện lỗi kết thúc
  - Phân biệt Windows PowerShell và PowerShell đa nền tảng
  - Execution policy và giới hạn của nó trong mô hình bảo mật
- level1: CMD và batch
  level2:
  - Phiên cmd.exe và cách dùng chế độ chạy lệnh
  - Phân biệt lệnh nội bộ và chương trình ngoài
  - Tham chiếu biến theo cú pháp phần trăm
  - Mở rộng biến trong khối lệnh và delayed expansion
  - setlocal, endlocal và phạm vi thay đổi môi trường
  - Tham số batch và mở rộng thông tin đường dẫn
  - for, if, call và điều khiển luồng cơ bản
  - Quy tắc dấu nháy và escape bằng dấu mũ
  - Ghép lệnh, chuyển hướng và pipeline trong CMD
  - Chuyển mã thoát khi kết thúc batch
  - Rủi ro phân tích nhiều lần khi lồng CMD với shell khác
- level1: Ngôn ngữ và mã hóa
  level2:
  - Phân biệt byte, ký tự và chuỗi hiển thị
  - UTF-8, UTF-16 và code page theo môi trường
  - Mã hóa của terminal, tệp và chương trình không nhất thiết giống nhau
  - LANG, LC_* và mức ưu tiên của locale
  - Ảnh hưởng của locale tới sắp xếp và so khớp
  - Định dạng số, ngày giờ và dữ liệu cần phân tích tự động
  - TZ và lựa chọn múi giờ của chương trình
  - CRLF, LF và dữ liệu qua pipeline
  - Tên tệp Unicode và khác biệt chuẩn hóa
  - Thiết lập định dạng dữ liệu ổn định cho tự động hóa
- level1: Quyền và danh tính
  level2:
  - Danh tính người dùng và quyền của tiến trình
  - UID, GID và quyền hiệu lực trong môi trường Unix
  - Quyền truy cập thư mục và quyền đọc hoặc chạy tệp
  - umask và quyền mặc định khi tạo dữ liệu
  - Thay người dùng và ảnh hưởng tới môi trường
  - sudo, su và chính sách giữ hoặc loại biến
  - UAC và phiên chạy với quyền cao trên Windows
  - Quyền truy cập tệp tạm hoặc tệp cấu hình
  - Phân biệt thiếu quyền, sai đường dẫn và không có chương trình
  - Thiết kế script hoạt động với đặc quyền tối thiểu
- level1: Môi trường công cụ
  level2:
  - Cấu hình công cụ qua đối số, biến môi trường và tệp
  - Thứ tự ưu tiên cấu hình do từng ứng dụng quyết định
  - Phân biệt biến môi trường và thuộc tính hệ thống của runtime
  - JAVA_HOME, PATH và lựa chọn JDK làm ví dụ
  - Biến tìm mô-đun, thư viện và chương trình hỗ trợ
  - Thư mục tạm, thư mục người dùng và thư mục cấu hình
  - Biến proxy và cấu hình riêng của từng công cụ
  - Tệp .env và yêu cầu có thành phần đọc cấu hình
  - Phân biệt cú pháp dotenv và cú pháp script shell
  - Môi trường dự án, môi trường ảo và cơ chế kích hoạt
  - Khôi phục cấu hình phiên sau khi hoàn tất công việc
- level1: Gọi từ ứng dụng
  level2:
  - Chạy chương trình với danh sách đối số
  - Khi nào cần shell và khi nào gọi trực tiếp
  - Chỉ định thư mục làm việc và môi trường của tiến trình con
  - Giữ nguyên dữ liệu khi đi qua API tạo tiến trình
  - Thu stdout, stderr và mã thoát
  - Tránh bế tắc do bộ đệm đầu ra chưa được đọc
  - Gửi đầu vào và đóng stdin đúng thời điểm
  - Thời hạn chờ và hủy tiến trình con
  - Phân biệt điều khiển tiến trình con và điều khiển toàn cây tiến trình
  - Vì sao script con không trực tiếp kích hoạt môi trường cho ứng dụng cha
  - Tránh ghép dữ liệu không tin cậy vào chuỗi lệnh
- level1: Tự động hóa
  level2:
  - Khác biệt giữa chạy tay và chạy không tương tác
  - Môi trường của cron, dịch vụ và trình lập lịch
  - Môi trường của bước CI và tiến trình do bước đó tạo
  - Không phụ thuộc prompt, alias hoặc lịch sử phiên
  - Khai báo rõ thư mục làm việc, công cụ và cấu hình bắt buộc
  - Thiết kế đầu ra máy đọc được và mã thoát có nghĩa
  - Giữ hành vi ổn định khi chạy lại
  - Khóa công việc và ngăn chạy chồng
  - Tệp tạm, dọn dẹp và phục hồi khi bị ngắt
  - Ghi log có kiểm soát và che thông tin bí mật
  - Chạy với tập biến tối thiểu để phát hiện phụ thuộc ngầm
- level1: Môi trường từ xa
  level2:
  - Shell cục bộ và shell phía máy từ xa
  - SSH tương tác và chạy một lệnh không tương tác
  - Trích dẫn qua nhiều lớp khi gửi lệnh từ xa
  - Truyền biến môi trường theo chính sách máy khách và máy chủ
  - Terminal ảo và ảnh hưởng tới đầu vào hoặc tín hiệu
  - Môi trường WSL và môi trường Windows
  - Chuyển đổi đường dẫn khi qua ranh giới nền tảng
  - Cấu hình lúc tạo image và cấu hình khi chạy container
  - Dạng lệnh qua shell và dạng thực thi trực tiếp trong container
  - Tiến trình đầu container và việc chuyển tiếp tín hiệu
  - Phân biệt môi trường máy chủ, container và ứng dụng bên trong
- level1: Tính di động
  level2:
  - Chọn hợp đồng POSIX hay chỉ rõ một shell cụ thể
  - Nhận diện phần mở rộng Bash không thuộc tập mục tiêu
  - Khác biệt giữa Bash, Zsh và Fish
  - Khác biệt giữa công cụ GNU và BSD
  - Tùy chọn lệnh, định dạng đầu ra và mặc định phụ thuộc nền tảng
  - PowerShell trên Windows, Linux và macOS
  - Khác biệt Windows PowerShell và PowerShell mới
  - Đường dẫn, ký tự phân cách và quy tắc hoa thường
  - Điều kiện phiên bản cho cú pháp và cách truyền đối số
  - Kiểm tra khả năng thực tế thay cho suy đoán theo tên hệ điều hành
  - Lập ma trận môi trường được hỗ trợ
- level1: Bảo mật
  level2:
  - Phân biệt dữ liệu đầu vào và mã lệnh
  - Chèn lệnh qua chuỗi ghép và nhiều lớp phân tích
  - Giới hạn sử dụng eval hoặc cơ chế thực thi chuỗi
  - Giữ đối số nguyên vẹn và xác định rõ chương trình đích
  - Rủi ro từ PATH, thư mục hiện tại và tệp khởi động
  - Biến môi trường ảnh hưởng tới trình nạp hoặc runtime
  - Bí mật trong đối số, môi trường, lịch sử và log
  - Nạp cấu hình hoặc script từ nguồn có quyền ghi không phù hợp
  - Tạo tệp tạm an toàn và tránh đụng độ tên
  - Xác minh phạm vi đường dẫn trước thao tác xóa hoặc di chuyển
  - Quyền chạy script và giới hạn của shell hạn chế
  - Thiết kế ví dụ thực hành trong phạm vi dữ liệu riêng
- level1: Chẩn đoán
  level2:
  - Xác minh shell, phiên bản và chế độ khởi động
  - Xác minh chương trình thực tế được tìm từ PATH
  - So sánh thư mục làm việc và danh tính tiến trình
  - Kiểm tra một tập biến cần thiết mà không xuất toàn bộ bí mật
  - Tìm nguồn cấu hình đã gán hoặc ghi đè một giá trị
  - Chẩn đoán biến chưa export hoặc thay đổi sai phạm vi
  - Chẩn đoán trường hợp terminal nhận cấu hình khác IDE hoặc dịch vụ
  - Quan sát đối số sau quá trình phân tích
  - Truy vết script và kiểm soát dữ liệu bị lộ qua trace
  - Chẩn đoán lỗi mã hóa, xuống dòng hoặc dấu nháy
  - Thu nhỏ môi trường và tạo tình huống tái hiện tối thiểu
  - Đọc stdout, stderr và mã thoát cùng nhau
- level1: Kiểm thử
  level2:
  - Tách dữ liệu thử nghiệm khỏi dữ liệu đang sử dụng
  - Chạy script với môi trường và thư mục làm việc xác định
  - Kiểm thử đường dẫn có khoảng trắng, ký tự đặc biệt hoặc Unicode
  - Kiểm thử biến thiếu, biến rỗng và cấu hình không hợp lệ
  - Kiểm thử dữ liệu có xuống dòng và ranh giới đối số
  - Kiểm thử công cụ không tồn tại hoặc trả lỗi
  - Kiểm thử lỗi ở chặng giữa của pipeline
  - Kiểm thử ngắt, hết thời hạn và dọn dẹp
  - Kiểm tra cú pháp và phân tích tĩnh theo ngôn ngữ
  - Kiểm thử nhiều phiên bản shell và hệ điều hành
  - Đối chiếu đầu ra, mã thoát và tác động phụ
- level1: Thực hành
  level2:
  - Vẽ quan hệ terminal, shell và các tiến trình con
  - Quan sát kế thừa môi trường qua hai thế hệ tiến trình
  - So sánh biến cục bộ, biến export và cấu hình lưu lâu dài
  - Thiết kế tập đối số có khoảng trắng hoặc chuỗi rỗng
  - Xây dựng pipeline lọc dữ liệu với kiểm tra mã thoát
  - Viết script nhận tham số và có đầu ra rõ ràng
  - Thiết kế dọn dẹp khi script bị ngắt
  - Chẩn đoán công cụ chạy khác phiên bản giữa hai terminal
  - Chạy cùng công việc với môi trường tối thiểu và trong CI
  - Chuyển một công việc giữa Bash và PowerShell theo hành vi
  - Lập báo cáo cấu hình đã che thông tin bí mật
- level1: Đánh giá script
  level2:
  - Kiểm tra shell, phiên bản và nền tảng mục tiêu
  - Kiểm tra kế thừa, phạm vi và thứ tự ưu tiên cấu hình
  - Kiểm tra trích dẫn và ranh giới đối số
  - Kiểm tra đường dẫn và chương trình thực tế sẽ chạy
  - Kiểm tra stdin, stdout, stderr và mã thoát
  - Kiểm tra vòng đời tiến trình và xử lý ngắt
  - Kiểm tra tệp tạm và phạm vi thao tác thay đổi dữ liệu
  - Kiểm tra bí mật, đặc quyền và nguồn cấu hình
  - Kiểm tra khả năng chạy lại và chạy không tương tác
  - Ghi nhận điều kiện hỗ trợ và bằng chứng kiểm thử
