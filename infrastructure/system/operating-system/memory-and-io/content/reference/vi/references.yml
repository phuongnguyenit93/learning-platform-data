references:
  - title: "Linux Kernel - Memory Management Documentation"
    url: "https://docs.kernel.org/mm/index.html"
    description: "Tổng quan memory subsystem: physical memory, page tables, process addresses, allocation, reclaim, swap, page cache và OOM."
  - title: "Linux Kernel - Memory Management Administration Guide"
    url: "https://docs.kernel.org/admin-guide/mm/index.html"
    description: "Các cơ chế quản trị và theo dõi memory của Linux kernel."
  - title: "Linux man-pages - mmap(2)"
    url: "https://www.man7.org/linux/man-pages/man2/mmap.2.html"
    description: "Ánh xạ file hoặc thiết bị vào không gian địa chỉ tiến trình và gỡ ánh xạ bằng munmap."
  - title: "Linux man-pages - read(2)"
    url: "https://man7.org/linux/man-pages/man2/read.2.html"
    description: "System call đọc dữ liệu từ file descriptor và các hành vi trả về, EOF, lỗi."
  - title: "Linux man-pages - write(2)"
    url: "https://man7.org/linux/man-pages/man2/write.2.html"
    description: "System call ghi dữ liệu qua file descriptor, partial writes và xử lý lỗi."
  - title: "Linux man-pages - fsync(2)"
    url: "https://man7.org/linux/man-pages/man2/fsync.2.html"
    description: "Đồng bộ dữ liệu và metadata đã thay đổi xuống storage device."
  - title: "Linux man-pages - io_uring(7)"
    url: "https://man7.org/linux/man-pages/man7/io_uring.7.html"
    description: "Mô hình asynchronous I/O của Linux qua submission/completion queues và shared rings."
  - title: "Linux man-pages - proc_meminfo(5)"
    url: "https://man7.org/linux/man-pages/man5/proc_meminfo.5.html"
    description: "Các trường /proc/meminfo về RAM, cache, swap, slab, page tables và committed memory."
  - title: "Microsoft Learn - Virtual Address Space (Memory Management)"
    url: "https://learn.microsoft.com/en-us/windows/win32/memory/virtual-address-space"
    description: "Không gian địa chỉ ảo của process, page table và ánh xạ tới địa chỉ vật lý."
  - title: "Microsoft Learn - About Memory Management"
    url: "https://learn.microsoft.com/en-us/windows/win32/memory/about-memory-management"
    description: "Khái niệm quản lý bộ nhớ Windows, virtual memory, allocation, heap và file mapping."