references:
  - title: "Apache Tomcat — Which Version Do I Want?"
    url: "https://tomcat.apache.org/whichversion.html"
    description: "Bảng đối chiếu Tomcat 9/10.1/11 với các bản Servlet/Jakarta EE và yêu cầu Java tối thiểu."
  - title: "Apache Tomcat 11 — Setup"
    url: "https://tomcat.apache.org/tomcat-11.0-doc/setup.html"
    description: "Cài đặt, chạy Tomcat dưới service, cấu hình người dùng hệ điều hành và quy trình khởi động."
  - title: "Apache Tomcat 11 — Application Deployment"
    url: "https://tomcat.apache.org/tomcat-11.0-doc/appdev/deployment.html"
    description: "Cấu trúc ứng dụng web, WAR, WEB-INF, context path và phương án triển khai."
  - title: "Apache Tomcat 11 — HTTP Connector"
    url: "https://tomcat.apache.org/tomcat-11.0-doc/config/http.html"
    description: "HTTP Connector, port, protocol, maxThreads, maxConnections, acceptCount và các giới hạn xử lý."
  - title: "Apache Tomcat 11 — Context Container"
    url: "https://tomcat.apache.org/tomcat-11.0-doc/config/context.html"
    description: "Cấu hình Context, appBase, đường dẫn ứng dụng, nạp ứng dụng và thông số resource."
  - title: "Apache Tomcat 11 — Manager App"
    url: "https://tomcat.apache.org/tomcat-11.0-doc/manager-howto.html"
    description: "Quản lý vòng đời WAR, deploy/reload/undeploy, theo dõi session và giới hạn quyền truy cập."
  - title: "Apache Tomcat 11 — Security Considerations"
    url: "https://tomcat.apache.org/tomcat-11.0-doc/security-howto.html"
    description: "Bảo vệ ứng dụng mặc định, Manager, cấu hình server.xml, quyền người dùng và giảm bề mặt tấn công."
  - title: "Apache Tomcat 11 — SSL/TLS Configuration"
    url: "https://tomcat.apache.org/tomcat-11.0-doc/ssl-howto.html"
    description: "Cấu hình HTTPS/TLS, certificates, keystore và kiểm tra lỗi kết nối bảo mật."
  - title: "Apache Tomcat 11 — Logging"
    url: "https://tomcat.apache.org/tomcat-11.0-doc/logging.html"
    description: "JULI, cấu hình log container và cách phân biệt log ứng dụng với log nội bộ."
  - title: "Apache Tomcat 11 — Monitoring"
    url: "https://tomcat.apache.org/tomcat-11.0-doc/monitoring.html"
    description: "JMX và MBeans để theo dõi, kiểm tra và quản lý Tomcat khi vận hành."