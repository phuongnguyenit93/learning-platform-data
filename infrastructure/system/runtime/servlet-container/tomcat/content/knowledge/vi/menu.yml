- level1: Giám sát
  level2:
  - Phân biệt trạng thái tiến trình với sức khỏe ứng dụng
  - Thu thập chỉ số Tomcat qua JMX
  - Theo dõi kết nối, luồng bận và hàng đợi
  - Thông lượng request, độ trễ và tỷ lệ lỗi
  - Giám sát session, ứng dụng và kết quả triển khai
  - 'Chỉ số JVM: heap, GC, Metaspace và số luồng'
  - 'Chỉ số hệ điều hành: CPU, RAM, file descriptor và socket'
  - Micrometer và tích hợp chỉ số trong ứng dụng Spring Boot
  - Truy vết phân tán và vị trí instrumentation
  - Cảnh báo theo mức bão hòa và ảnh hưởng người dùng
  - Dashboard kết hợp proxy, Tomcat, ứng dụng và cơ sở dữ liệu
  - Thu thập bằng chứng trước khi khởi động lại
- level1: Hiệu năng
  level2:
  - Đặt mục tiêu độ trễ, thông lượng và mức tải đồng thời
  - Đo đường cơ sở trước khi thay cấu hình
  - Phân biệt nghẽn CPU, I/O, thread pool và connection pool
  - Điều chỉnh số luồng theo đặc điểm tác vụ
  - Chọn giới hạn kết nối và hàng đợi theo dung lượng thực
  - Keep-alive, kết nối dài và chi phí tài nguyên
  - Timeout và bảo vệ khi hệ thống phụ thuộc xử lý chậm
  - Nén, tài nguyên tĩnh và chi phí CPU
  - Kích thước buffer, body lớn và áp lực bộ nhớ
  - Ảnh hưởng của session, JSP và quét thư viện
  - HTTP/2 và hiệu năng cần kiểm chứng theo tình huống
  - Kiểm thử tải tăng dần, tải đột biến và tải kéo dài
  - Tránh tăng giới hạn đồng loạt khiến quá tải chuyển sang tầng khác
- level1: Bộ nhớ và JVM
  level2:
  - Heap, Metaspace, bộ nhớ trực tiếp và stack luồng
  - Chọn heap theo giới hạn tiến trình và container
  - Thu gom rác, thời gian dừng và độ trễ request
  - OutOfMemoryError theo từng vùng bộ nhớ
  - Thread dump để phát hiện chờ, khóa và cạn luồng
  - Heap dump và phân tích đối tượng giữ bộ nhớ
  - JFR, jcmd và dữ liệu chẩn đoán JVM
  - Session, cache và upload giữ bộ nhớ như thế nào
  - Rò rỉ bộ nhớ sau nhiều lần redeploy
  - Luồng nền, ThreadLocal và thư viện không dọn tài nguyên
  - Cạn file descriptor, socket và bộ nhớ native
  - Kiểm chứng cấu hình JVM thực sự được áp dụng
- level1: Cụm và tính sẵn sàng
  level2:
  - Scale up, scale out và giới hạn một instance
  - Chạy nhiều Tomcat sau bộ cân bằng tải
  - Ứng dụng không giữ session và ứng dụng có session
  - Sticky session và điều kiện failover
  - Nhân bản session trong cụm Tomcat
  - DeltaManager, BackupManager và phạm vi lựa chọn
  - Yêu cầu distributable và dữ liệu có thể tuần tự hóa
  - Chi phí mạng, bộ nhớ và tính nhất quán của session
  - Lưu session bên ngoài container và đánh đổi
  - Khám phá thành viên cụm và bảo vệ kênh trao đổi
  - Rolling deployment và tương thích dữ liệu session
  - Diễn tập mất instance và kiểm chứng phục hồi
- level1: Tomcat nhúng
  level2:
  - Tomcat nhúng khác bản độc lập ở cách ghép nối và quản lý
  - Khởi tạo Tomcat bằng API Java
  - Tạo Connector, Context và đăng ký Servlet bằng mã
  - Thiết lập base directory và tài nguyên ứng dụng
  - Thêm Filter, Listener và Valve theo vòng đời
  - Classpath ứng dụng và khả năng khám phá thư viện
  - Khởi động, chờ và dừng container trong tiến trình chủ
  - Truyền cấu hình và quản lý tài nguyên dùng chung
  - Đóng gói executable JAR với container nhúng
  - Giới hạn của cấu hình khi không dùng bộ cài độc lập
  - Kiểm thử tích hợp với Tomcat nhúng
- level1: Spring Boot
  level2:
  - Tomcat trong mô hình Spring Boot Servlet
  - Starter web và quan hệ phụ thuộc container
  - Quá trình Spring Boot tạo và khởi động web server
  - Cấu hình server.* và đối chiếu tài liệu đúng phiên bản
  - WebServerFactoryCustomizer và tùy biến Tomcat
  - Thêm Connector, Valve và cấu hình session
  - Context path, cổng, địa chỉ bind và trang lỗi
  - Graceful shutdown và thời hạn dừng của ứng dụng
  - Actuator, trạng thái sẵn sàng và chỉ số Tomcat
  - Executable JAR và WAR triển khai lên Tomcat ngoài
  - SpringBootServletInitializer và cấu hình phụ thuộc provided
  - Quản lý phiên bản Tomcat theo cơ chế dependency management
  - Tránh nhầm thuộc tính Spring Boot với thuộc tính Connector gốc
- level1: Dịch vụ và container
  level2:
  - Chạy Tomcat bằng script, dịch vụ hệ điều hành và container
  - Thiết lập systemd unit và biến môi trường
  - Windows service và cấu hình Java của tiến trình dịch vụ
  - Chạy foreground trong container và truyền tín hiệu dừng
  - Image bất biến, tài khoản không đặc quyền và quyền tệp
  - Giới hạn CPU, bộ nhớ và file descriptor
  - Đưa cấu hình, bí mật và dữ liệu ra vị trí phù hợp
  - Ghi log ra console và thu gom tập trung
  - Liveness, readiness và thời gian khởi động
  - Thư mục tạm, hệ tệp chỉ đọc và dữ liệu cần ghi
  - Dừng theo thứ tự loại lưu lượng rồi kết thúc tiến trình
  - Tự khởi động lại có kiểm soát và tránh che giấu lỗi lặp
- level1: Kiểm thử
  level2:
  - Kiểm thử cấu hình và khởi động container
  - Kiểm thử Servlet bằng mock và bằng Tomcat thực
  - Kiểm thử WAR trên cùng nhánh Tomcat mục tiêu
  - Kiểm thử HTTP header, mã hóa, cookie và redirect
  - Kiểm thử TLS, mTLS và hoạt động sau reverse proxy
  - Kiểm thử session, timeout và đăng nhập đồng thời
  - Kiểm thử upload lớn, client chậm và client ngắt kết nối
  - Kiểm thử async Servlet và WebSocket
  - Kiểm thử tải với số kết nối và số request được kiểm soát
  - Kiểm thử deploy, redeploy, shutdown và quay lui
  - Kiểm thử failover và dữ liệu session
  - Tạo môi trường tái lập và lưu bằng chứng cấu hình
- level1: Chẩn đoán sự cố
  level2:
  - Quy trình khoanh vùng từ mạng đến ứng dụng
  - Tomcat không khởi động do Java, cấu hình hoặc quyền truy cập
  - Port đã được sử dụng và bind sai địa chỉ
  - Tiến trình đang chạy nhưng ứng dụng chưa triển khai thành công
  - 404 do context path, mapping hoặc tài nguyên không tồn tại
  - 400 và lỗi phân tích request, mã hóa hoặc header
  - 413 và các giới hạn upload không thống nhất
  - 500 do ứng dụng và chuỗi nguyên nhân trong log
  - 502, 503, 504 tại proxy và cách đối chiếu log Tomcat
  - Request treo do cạn luồng, khóa hoặc chờ cơ sở dữ liệu
  - Lỗi chứng chỉ, TLS handshake và giao thức không tương thích
  - Lỗi session mất sau cân bằng tải hoặc triển khai lại
  - Lỗi classloader và xung đột thư viện
  - CPU cao, GC kéo dài và rò rỉ bộ nhớ
  - Không dừng được do tác vụ nền hoặc tài nguyên chưa đóng
  - Lập báo cáo nguyên nhân gốc và xác minh biện pháp sửa
- level1: Nâng cấp và bảo trì
  level2:
  - Lập ma trận Tomcat, Java và Jakarta Servlet cần hỗ trợ
  - Đọc hướng dẫn chuyển đổi giữa các nhánh phiên bản
  - javax.servlet và jakarta.servlet trong tương thích ứng dụng
  - Kiểm tra JSP, WebSocket, thư viện và API liên quan
  - Tham số cấu hình bị đổi, bỏ hoặc thay ngữ nghĩa
  - Đối chiếu thư viện native và tính năng TLS
  - Không sao chép nguyên thư mục conf cũ sang bản mới
  - Kiểm thử hồi quy bằng bản phân phối sạch
  - Thay phiên bản Tomcat nhúng trong giới hạn tương thích của framework
  - Triển khai thử, quan sát và chuẩn bị quay lui
  - Quản lý lịch vá lỗi và bằng chứng phiên bản đang chạy
- level1: Thực hành Tomcat
  level2:
  - Chuẩn bị hai instance Tomcat độc lập trên cùng máy
  - Đóng gói và triển khai ứng dụng Servlet tối thiểu
  - Theo dõi một request qua Connector, Valve, Filter và Servlet
  - Thử nghiệm request đồng thời và trạng thái dùng chung
  - Quan sát thread pool với tác vụ nhanh và tác vụ chặn
  - Thực nghiệm timeout và async Servlet
  - Thiết lập DataSource JNDI và quan sát cạn connection pool
  - Đặt reverse proxy và kiểm chứng scheme, địa chỉ IP, redirect
  - Thiết lập HTTPS và xác minh chuỗi chứng chỉ
  - Cấu hình session rồi kiểm thử nhiều instance
  - Triển khai ứng dụng Spring Boot theo JAR và WAR
  - Thu thập access log, JMX và thread dump khi có tải
  - Tái hiện lỗi classloader và rò rỉ sau redeploy
  - Thực hành graceful shutdown và chuyển lưu lượng
  - Rà soát bảo mật, hiệu năng và viết runbook vận hành
