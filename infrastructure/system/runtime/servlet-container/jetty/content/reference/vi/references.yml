references:
  - title: "Eclipse Jetty 12 — Documentation"
    url: "https://jetty.org/docs/jetty/12/index.html"
    description: "Tổng quan Jetty HTTP server và Servlet Container, mô hình standalone/embedded, giao thức hỗ trợ và tương thích Java/Jakarta EE."
  - title: "Jetty 12 — Architecture Overview"
    url: "https://jetty.org/docs/jetty/12/operations-guide/arch/index.html"
    description: "Giải thích JETTY_HOME, JETTY_BASE, module system, Server, Connector và start mechanism."
  - title: "Jetty 12 — Getting Started"
    url: "https://jetty.org/docs/jetty/12/operations-guide/begin/index.html"
    description: "Thiết lập Jetty standalone, bật module http và ee10-deploy, chạy start.jar và truy cập ứng dụng."
  - title: "Jetty 12 — Start Mechanism"
    url: "https://jetty.org/docs/jetty/12/operations-guide/start/index.html"
    description: "Hướng dẫn --add-modules, cấu hình start.d, ưu tiên cấu hình và các chế độ khởi động server."
  - title: "Jetty 12 — HTTP Server Libraries"
    url: "https://jetty.org/docs/jetty/12/programming-guide/server/http.html"
    description: "API embedded Server/ServerConnector/Handler, ServletContextHandler, WebAppContext, request và callback."
  - title: "Jetty 12 — Web Application Deployment"
    url: "https://jetty.org/docs/jetty/12/operations-guide/deploy/index.html"
    description: "Triển khai WAR, môi trường EE8/EE9/EE10, context path, hot/static deploy và tùy biến WebAppContext."
  - title: "Jetty 12 — Connectors and Protocols"
    url: "https://jetty.org/docs/jetty/12/operations-guide/protocols/index.html"
    description: "Hướng dẫn HTTP/1.1, HTTPS, HTTP/2, TLS/ALPN, SSL keystore và giao thức HTTP/3."
  - title: "Jetty 12.1 — JMX Monitoring and Management"
    url: "https://jetty.org/docs/jetty/12.1/operations-guide/jmx/index.html"
    description: "Tài liệu Jetty về bật module JMX, xem MBeans và theo dõi trạng thái server để chẩn đoán sự cố."
