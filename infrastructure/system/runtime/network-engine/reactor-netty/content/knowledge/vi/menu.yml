  - Đóng luồng, hết thời gian nhàn rỗi và giải phóng tài nguyên
  - Chứng chỉ, token và cấu hình cho môi trường thử nghiệm hoặc vận hành
  - Kiểm thử tương thích đầu cuối và phương án khi hạ tầng chưa hỗ trợ
- level1: WebSocket
  level2:
  - Nâng cấp HTTP sang WebSocket
  - Thiết lập client và server WebSocket
  - Khung văn bản, nhị phân và khung điều khiển
  - Phân mảnh thông điệp và giới hạn kích thước
  - Đọc và ghi hai chiều theo luồng
  - Ping, pong và phát hiện kết nối không còn hoạt động
  - Backpressure khi bên nhận chậm
  - Mã đóng, đóng chủ động và đóng bất thường
  - Tái kết nối và khôi phục trạng thái ở tầng ứng dụng
  - Quản lý tài nguyên cho nhiều kết nối kéo dài
- level1: UDP
  level2:
  - Tạo UdpServer và UdpClient
  - Bind địa chỉ và gửi tới đầu cuối từ xa
  - DatagramPacket và ranh giới từng gói dữ liệu
  - Địa chỉ gửi, địa chỉ nhận và phản hồi
  - Quyền sở hữu ByteBuf trong datagram
  - Giới hạn kích thước gói và bộ đệm nhận
  - Phân biệt connect của UDP và kết nối tin cậy
  - Mất gói, lặp gói và sai thứ tự ở tầng ứng dụng
  - Giới hạn backpressure đối với mạng UDP
  - Đóng tài nguyên và theo dõi lỗi gửi nhận
- level1: Backpressure và tải
  level2:
  - Nhu cầu reactive và khả năng đọc dữ liệu từ Channel
  - Khả năng ghi của Channel và ngưỡng bộ đệm ghi
  - Phân biệt giới hạn ứng dụng và điều khiển luồng của giao thức
  - Giới hạn số yêu cầu hoặc tác vụ đang xử lý
  - Prefetch và bộ đệm phát sinh từ toán tử Reactor
  - Bên phát nhanh, bên nhận chậm và sự tăng bộ nhớ
  - Phản hồi áp lực ngược qua luồng đọc–xử lý–ghi
  - Gộp nội dung hoặc đệm vô hạn làm mất giới hạn tải
  - Cô lập phụ thuộc chậm và bảo vệ event loop
  - Giới hạn tiếp nhận, từ chối có kiểm soát và phục hồi sau quá tải
- level1: Metrics và tracing
  level2:
  - Bật chỉ số và tích hợp Micrometer
  - Chỉ số kết nối, byte nhận gửi và thời gian xử lý
  - Đo thời gian DNS, kết nối và bắt tay TLS
  - Theo dõi pool, thời gian chờ và số yêu cầu cấp kết nối
  - Theo dõi bộ nhớ trực tiếp và bộ cấp phát buffer
  - Theo dõi tác vụ chờ trên event loop
  - Chuẩn hóa URI và kiểm soát số lượng giá trị nhãn
  - Observation và truy vết HTTP xuyên hệ thống
  - Reactor Context, ThreadLocal và truyền ngữ cảnh
  - Liên kết log, trace và định danh kết nối
  - Đặt cảnh báo cho bão hòa tài nguyên và suy giảm độ trễ
- level1: Log và chẩn đoán
  level2:
  - Phân biệt access log, error log và wiretap
  - Chọn định dạng log và mức chi tiết dữ liệu mạng
  - Đọc định danh kết nối, yêu cầu HTTP và luồng HTTP/2
  - Lần theo một yêu cầu qua nhiều bản ghi
  - Chẩn đoán lỗi DNS, kết nối và proxy
  - Chẩn đoán lỗi TLS hoặc thương lượng giao thức
  - Phân tích PrematureCloseException và mốc đóng kết nối
  - Phân tích lỗi mượn kết nối và pool bão hòa
  - Nhận diện event loop bị chặn bằng thread dump và phép đo
  - Dùng bộ phát hiện rò rỉ buffer và chỉ số bộ nhớ
  - Đối chiếu log ứng dụng với gói tin trong môi trường kiểm thử
  - Kiểm soát chi phí, dữ liệu nhạy cảm và thời gian bật log chi tiết
- level1: Tích hợp Spring
  level2:
  - Vai trò Reactor Netty dưới Spring WebFlux
  - Phân biệt cấu hình engine và cấu hình xử lý nghiệp vụ
  - HttpClient bên dưới WebClient và ReactorClientHttpConnector
  - Quản lý tài nguyên qua ReactorResourceFactory
  - Dùng chung hoặc tách pool giữa các nhóm lời gọi
  - Cấu hình thời hạn và giới hạn kết nối tại đúng lớp
  - Phân biệt buffer của Spring với ByteBuf ở tầng Netty
  - Vòng đời tài nguyên theo ApplicationContext
  - Quản lý phiên bản bằng nền tảng Spring đang sử dụng
  - Kiểm tra cấu hình hiệu lực khi có nhiều lớp tùy biến
- level1: Kiểm thử
  level2:
  - Khởi động server cục bộ với cổng động
  - Tạo client đối ứng và đóng tài nguyên sau kiểm thử
  - Kiểm tra tín hiệu reactive bằng StepVerifier
  - Kiểm thử framing khi dữ liệu bị chia nhỏ hoặc gộp
  - Kiểm thử HTTP với nội dung theo luồng
  - Mô phỏng bên nhận chậm, hủy đăng ký và ngắt kết nối
  - Kiểm thử các loại timeout với điều kiện kiểm soát được
  - Kiểm thử pool đầy và hàng chờ vượt giới hạn
  - Kiểm thử TLS với chứng chỉ của môi trường thử nghiệm
  - Kiểm thử HTTP/2, HTTP/3 hoặc QUIC theo môi trường hỗ trợ
  - Kiểm tra rò rỉ buffer, luồng và kết nối
  - Giới hạn của thời gian ảo khi thao tác I/O vẫn dùng thời gian thực
- level1: Hiệu năng
  level2:
  - Thiết kế phép đo theo tải và giao thức thực tế
  - Phân biệt chi phí khởi tạo, kết nối mới và kết nối tái sử dụng
  - Đo thông lượng, phân vị độ trễ và tỷ lệ lỗi
  - Cân đối số kết nối, số luồng giao thức và mức đồng thời
  - Điều chỉnh số luồng I/O theo bằng chứng
  - Đo tác động của gộp lô, flush và kích thước buffer
  - Chi phí TLS, nén và chuyển đổi dữ liệu
  - So sánh transport trong môi trường tương đương
  - Theo dõi heap, bộ nhớ trực tiếp và giới hạn container
  - Tránh kết luận từ phép đo bỏ qua lỗi hoặc hàng chờ
- level1: Vận hành tài nguyên
  level2:
  - Lập bản đồ quyền sở hữu LoopResources và ConnectionProvider
  - Giới hạn socket, file descriptor và cổng tạm
  - Đồng bộ cấu hình timeout với proxy hoặc bộ cân bằng tải
  - Giới hạn CPU và bộ nhớ theo môi trường triển khai
  - Kiểm tra native library khi đóng gói hoặc đổi nền tảng
  - Giữ client, pool và tài nguyên ở vòng đời phù hợp
  - Dừng nhận công việc mới và chờ thao tác đang chạy
  - Thứ tự đóng server, client, pool và event loop
  - Phân biệt quiet period và thời hạn dừng tối đa
  - Giám sát tài nguyên sau khởi động lại hoặc triển khai cuốn chiếu
- level1: Sai lầm thường gặp
  level2:
  - Gọi mã chặn hoặc xử lý nặng trực tiếp trên event loop
  - Tạo client hoặc tài nguyên mới cho từng yêu cầu
  - Tưởng tăng số luồng luôn làm tăng thông lượng
  - Bỏ qua nội dung phản hồi hoặc giữ kết nối quá lâu
  - Gộp nội dung không giới hạn dù giao diện là reactive
  - Giữ ByteBuf quá vòng đời mà không xử lý quyền sở hữu
  - retain không cân bằng hoặc giải phóng buffer nhiều lần
  - Tự subscribe làm tách lỗi và vòng đời tài nguyên
  - Thử lại yêu cầu ghi mà không xét tác động lặp
  - Đóng tài nguyên toàn cục khi thành phần khác còn sử dụng
  - Áp dụng API hoặc giá trị mặc định của phiên bản khác
- level1: Thực hành
  level2:
  - Xây dựng TCP echo với framing rõ ràng
  - Xây dựng HTTP server và client tối giản
  - Truyền tệp lớn với giới hạn bộ nhớ
  - Quan sát thread và tác động của một thao tác chặn
  - Thiết kế pool có giới hạn và thử tình huống bão hòa
  - Mô phỏng kết nối đóng giữa chừng và phân tích lỗi
  - Thiết kế ngân sách timeout và thử lại an toàn
  - Xây dựng luồng SSE hoặc WebSocket với bên nhận chậm
  - Bật metrics, tracing và chẩn đoán một yêu cầu cụ thể
  - Thử giao thức nâng cao khi phiên bản và môi trường đáp ứng
  - Xác minh giải phóng tài nguyên sau lỗi và khi dừng ứng dụng
- level1: Đánh giá thiết kế
  level2:
  - Kiểm tra phạm vi phiên bản và phụ thuộc
  - Kiểm tra mô hình luồng và điểm có thể chặn
  - Kiểm tra vòng đời inbound, outbound và buffer
  - Kiểm tra số kết nối, hàng chờ và giới hạn đồng thời
  - Kiểm tra thời hạn, hủy và hành vi thử lại
  - Kiểm tra TLS, proxy và giới hạn dữ liệu
  - Kiểm tra chỉ số, log và khả năng truy tìm lỗi
  - Kiểm tra bằng chứng hiệu năng và khả năng chịu tải
  - Kiểm tra dừng an toàn và quyền đóng tài nguyên
  - Ghi nhận cấu hình hiệu lực, đánh đổi và rủi ro còn lại
