references:
  - title: "Linux man-pages — execve(2)"
    url: "https://man7.org/linux/man-pages/man2/execve.2.html"
    description: "Mô tả nạp chương trình, tham số, biến môi trường và lỗi khởi chạy trên Linux; dùng để minh họa ranh giới giữa chương trình và tiến trình."
  - title: "V8 — Launching Ignition and TurboFan"
    url: "https://v8.dev/blog/launching-ignition-and-turbofan"
    description: "Bài viết năm 2017 của nhóm V8 minh họa cách kết hợp thông dịch bytecode và biên dịch tối ưu khi chạy; đọc để đối chiếu mô hình, không suy rộng thành kiến trúc mọi phiên bản."
  - title: "Microsoft Learn — Processes and Threads"
    url: "https://learn.microsoft.com/en-us/windows/win32/procthread/processes-and-threads"
    description: "Giải thích tiến trình, luồng và nhóm luồng trong Windows, giúp đối chiếu cơ chế lập lịch và tổ chức công việc giữa các hệ điều hành."
  - title: "The Rust Programming Language — What Is Ownership?"
    url: "https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html"
    description: "Giới thiệu stack, heap và mô hình quyền sở hữu của Rust để so sánh với cấp phát thủ công và thu gom rác."
  - title: "Microsoft Learn — Fundamentals of garbage collection"
    url: "https://learn.microsoft.com/en-us/dotnet/standard/garbage-collection/fundamentals"
    description: "Trình bày cấp phát, khả năng truy cập đối tượng và thu hồi bộ nhớ qua ví dụ .NET; phân biệt GC với việc dọn dẹp tài nguyên hệ điều hành."
  - title: "libuv — Design overview"
    url: "https://docs.libuv.org/en/v1.x/design.html"
    description: "Giải thích vòng lặp sự kiện, I/O không chặn, nhóm luồng và vòng đời handle trong thư viện đa nền tảng."
  - title: "The Linux Kernel documentation — Control Group v2"
    url: "https://docs.kernel.org/admin-guide/cgroup-v2.html"
    description: "Tham khảo các phần giới hạn CPU, bộ nhớ và I/O để hiểu ngân sách tài nguyên và tác động khi ứng dụng chạm giới hạn; cơ chế cụ thể thuộc Linux."
  - title: "The GNU C Library — Program Termination"
    url: "https://sourceware.org/glibc/manual/latest/html_node/Program-Termination.html"
    description: "Giới thiệu kết thúc chương trình, mã thoát, dọn dẹp khi thoát và kết thúc do tín hiệu trong môi trường GNU/POSIX."
  - title: "Debugging with GDB — Backtraces"
    url: "https://sourceware.org/gdb/current/onlinedocs/gdb.html/Backtrace.html"
    description: "Hướng dẫn đọc ngăn xếp lời gọi và xem backtrace của nhiều luồng để hỗ trợ phân tích treo hoặc sự cố dừng chương trình."
  - title: "OpenTelemetry — Signals"
    url: "https://opentelemetry.io/docs/concepts/signals/"
    description: "Giới thiệu log, metric và trace để lựa chọn bằng chứng quan sát ứng dụng; signals ở đây là dữ liệu telemetry, khác với tín hiệu điều khiển tiến trình."
