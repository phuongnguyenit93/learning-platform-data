references:
  - title: "Oracle Java SE 25 — The java Command"
    url: "https://docs.oracle.com/en/java/javase/25/docs/specs/man/java.html"
    description: "Cú pháp khởi chạy Java bằng main class, -jar, classpath, module path và biến JDK_JAVA_OPTIONS."
  - title: "Oracle Java SE 25 — The jar Command"
    url: "https://docs.oracle.com/en/java/javase/25/docs/specs/man/jar.html"
    description: "Tạo, cập nhật, kiểm tra archive JAR và khai báo main class cho ứng dụng độc lập."
  - title: "Oracle Java SE 25 — JAR File Specification"
    url: "https://docs.oracle.com/en/java/javase/25/docs/specs/jar/jar.html"
    description: "Cấu trúc JAR, META-INF, manifest, modular JAR và cách triển khai trên classpath/module path."
  - title: "Apache Maven — Introduction to the Build Lifecycle"
    url: "https://maven.apache.org/guides/introduction/introduction-to-the-lifecycle"
    description: "Các phase validate, compile, test, package, verify, install và deploy trong quá trình tạo artifact."
  - title: "Gradle — The Application Plugin"
    url: "https://docs.gradle.org/current/userguide/application_plugin.html"
    description: "Khai báo main class và tạo distribution với runtime dependencies cùng start scripts cho từng hệ điều hành."
  - title: "Spring Boot — Packaging Executable Archives"
    url: "https://docs.spring.io/spring-boot/maven-plugin/packaging.html"
    description: "Tạo executable JAR/WAR, cấu trúc archive và tách layer dependencies/application cho image."
  - title: "Docker Docs — Multi-stage Builds"
    url: "https://docs.docker.com/get-started/docker-concepts/building-images/multi-stage-builds/"
    description: "Tách build stage khỏi runtime stage và chỉ chuyển artifact cần thiết vào image cuối."
  - title: "Docker Docs — Building Best Practices"
    url: "https://docs.docker.com/build/building/best-practices/"
    description: "Giảm package thừa, tổ chức image sạch và áp dụng multi-stage build để giảm kích thước, attack surface."