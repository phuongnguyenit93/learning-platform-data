      - "Sử dụng kho reachability metadata và xác minh tương thích phiên bản dependency"
      - "Phát hiện metadata thiếu, dư thừa hoặc đã lỗi thời sau khi thay đổi mã"
      - "Quản lý metadata trong mã nguồn và kiểm tra các chế độ phát hiện đăng ký thiếu"
  - level1: "Reflection"
    level2:
      - "Tra cứu lớp, constructor, phương thức và trường bằng reflection"
