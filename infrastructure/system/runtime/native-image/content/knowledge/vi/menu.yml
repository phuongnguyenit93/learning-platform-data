      - "Xử lý annotation, generic và mô hình introspection của thư viện"
      - "Ảnh hưởng của private access, module encapsulation và tùy chọn mở module"
      - "Cấu hình reflection tối thiểu cho dependency injection và ánh xạ đối tượng"
      - "Chẩn đoán lỗi thiếu thành viên và kiểm chứng đường gọi reflection hiếm gặp"
  - level1: "Proxy và gọi động"
