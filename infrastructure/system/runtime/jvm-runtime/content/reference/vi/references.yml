references:
  - title: "Java Virtual Machine Specification, Java SE 25"
    url: "https://docs.oracle.com/javase/specs/jvms/se25/html/index.html"
    description: "Đặc tả class file, class loading/linking, runtime data areas, frames và instruction execution."
  - title: "Java Virtual Machine Guide, JDK 25"
    url: "https://docs.oracle.com/en/java/javase/25/vm/index.html"
    description: "Tổng quan HotSpot JVM, compiler control, garbage collection, CDS, native memory tracking và fatal error reporting."
  - title: "The java Command, JDK 25"
    url: "https://docs.oracle.com/en/java/javase/25/docs/specs/man/java.html"
    description: "Cú pháp khởi chạy Java, JVM options, heap sizing, logging, runtime flags và container support."
  - title: "HotSpot Virtual Machine Garbage Collection Tuning Guide, JDK 25"
    url: "https://docs.oracle.com/en/java/javase/25/gctuning/index.html"
    description: "Các collector của HotSpot, ergonomics, G1, ZGC và phương pháp chọn/tuning GC theo workload."
  - title: "Diagnostic Tools, JDK 25"
    url: "https://docs.oracle.com/en/java/javase/25/troubleshoot/diagnostic-tools.html"
    description: "Sử dụng jcmd, jstack/jmap, Java Flight Recorder và công cụ chẩn đoán JVM."
  - title: "Troubleshoot Performance Issues Using Flight Recorder, JDK 25"
    url: "https://docs.oracle.com/en/java/javase/25/troubleshoot/troubleshoot-performance-issues-using-jfr.html"
    description: "Phân tích CPU, allocation, GC pauses, thread stalls, I/O và bottleneck từ flight recording."
  - title: "Flight Recorder API Programmer's Guide, JDK 25"
    url: "https://docs.oracle.com/en/java/javase/25/jfapi/index.html"
    description: "Tạo custom events, cấu hình ghi nhận, event streaming và đọc bản ghi JFR."
  - title: "jdk.jcmd Module, Java SE 25"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/jdk.jcmd/module-summary.html"
    description: "Tổng quan các công cụ jcmd, jps và jstat phục vụ chẩn đoán process JVM."
  - title: "Overview of Java SE Monitoring and Management, JDK 25"
    url: "https://docs.oracle.com/en/java/javase/25/management/overview-java-se-monitoring-and-management.html"
    description: "Runtime MXBeans về class loading, compilation, memory, garbage collector, threads và operating system."