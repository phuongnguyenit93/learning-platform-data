references:
  - title: "OWASP — Secure Product Design Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Secure_Product_Design_Cheat_Sheet.html"
    description: "Nguyên tắc secure defaults, least privilege, separation of duties, defense in depth và fail securely trong thiết kế sản phẩm."
  - title: "OWASP — Attack Surface Analysis Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html"
    description: "Nhận diện, lập bản đồ và giảm các điểm đầu vào, kết nối và thành phần có thể bị tấn công."
  - title: "OWASP — Authorization Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"
    description: "Least privilege, deny by default, kiểm tra quyền ở từng request và kiểm thử logic phân quyền."
  - title: "OWASP — Input Validation Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html"
    description: "Xác thực dữ liệu không tin cậy bằng các giới hạn cú pháp và ngữ nghĩa tại ranh giới ứng dụng."
  - title: "OWASP — Cryptographic Storage Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html"
    description: "Tối thiểu hóa dữ liệu nhạy cảm, lựa chọn mã hóa, quản lý khóa và bảo vệ dữ liệu lưu trữ."
  - title: "OWASP — Error Handling Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html"
    description: "Xử lý lỗi có kiểm soát, không tiết lộ thông tin nội bộ và trả kết quả thất bại an toàn."
  - title: "OWASP — Threat Modeling Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Threat_Modeling_Cheat_Sheet.html"
    description: "Nhận diện ranh giới tin cậy, phân tích tình huống lạm dụng và xem xét rủi ro từ thiết kế."
  - title: "OWASP — Application Security Verification Standard"
    url: "https://owasp.org/www-project-application-security-verification-standard/"
    description: "Tập hợp yêu cầu kiểm chứng kỹ thuật bảo mật để đánh giá thiết kế và thực thi ứng dụng."
  - title: "NIST — SP 800-218 Secure Software Development Framework"
    url: "https://csrc.nist.gov/pubs/sp/800/218/final"
    description: "Khung thực hành phát triển phần mềm an toàn, bao gồm chuẩn bị, thiết kế, sản xuất và xử lý lỗ hổng."