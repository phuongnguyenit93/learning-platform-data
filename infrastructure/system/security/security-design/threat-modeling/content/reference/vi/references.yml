references:
  - title: "OWASP Cheat Sheet — Threat Modeling"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Threat_Modeling_Cheat_Sheet.html"
    description: "Hướng dẫn mô hình hệ thống, xác định/đánh giá threats, đề xuất mitigation và review."
  - title: "Microsoft Learn — Threat Modeling Tool"
    url: "https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool"
    description: "Tư duy threat modeling trong SDLC, DFD, phân tích STRIDE và quản lý mitigation."
  - title: "Microsoft Learn — Threat Modeling Getting Started"
    url: "https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-getting-started"
    description: "Ví dụ tạo sơ đồ, trust boundaries và đọc sáu nhóm threat trong STRIDE."
  - title: "OWASP — Threat Dragon"
    url: "https://owasp.org/projects/threat-dragon"
    description: "Công cụ mã nguồn mở tạo sơ đồ threat model, đánh dấu threats và biện pháp giảm thiểu."
  - title: "OWASP — Risk Rating Methodology"
    url: "https://community.owasp.org/OWASP_Risk_Rating_Methodology"
    description: "Cách đánh giá likelihood, impact và xếp mức độ ưu tiên cho rủi ro ứng dụng."
  - title: "OWASP — Application Security Verification Standard"
    url: "https://asvs.owasp.org/"
    description: "Tham chiếu yêu cầu và kiểm chứng các security controls bảo vệ ứng dụng."
  - title: "MITRE ATT&CK — Get Started"
    url: "https://attack.mitre.org/resources/"
    description: "Tactics và techniques từ quan sát thực tế để bổ trợ tư duy kịch bản tấn công."