references:
  - title: "OWASP — Password Storage Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"
    description: "Hướng dẫn chọn Argon2id, scrypt, bcrypt, PBKDF2; salt, pepper, work factor và nâng cấp hash cũ."
  - title: "NIST — SP 800-63B-4 Authentication and Authenticator Management"
    url: "https://pages.nist.gov/800-63-4/sp800-63b.html"
    description: "Khuyến nghị hiện hành về lưu password verifier, salted hashing, giới hạn thử đăng nhập và quy trình xác thực."
  - title: "RFC 9106 — Argon2 Memory-Hard Function"
    url: "https://www.rfc-editor.org/rfc/rfc9106.html"
    description: "Đặc tả Argon2id, input salt, memory, passes, parallelism và lựa chọn tham số an toàn."
  - title: "RFC 7914 — The scrypt Password-Based Key Derivation Function"
    url: "https://www.rfc-editor.org/rfc/rfc7914.html"
    description: "Đặc tả hàm scrypt có chi phí bộ nhớ để giảm lợi thế phần cứng khi thử mật khẩu."
  - title: "RFC 8018 — PKCS #5 Password-Based Cryptography"
    url: "https://www.rfc-editor.org/rfc/rfc8018.html"
    description: "Chuẩn kỹ thuật về PBKDF2, salt và iteration count trong các cơ chế dẫn xuất khóa từ mật khẩu."
  - title: "Spring Security — Password Storage"
    url: "https://docs.spring.io/spring-security/reference/features/authentication/password-storage.html"
    description: "Hướng dẫn PasswordEncoder, adaptive hashing, DelegatingPasswordEncoder và quản lý nâng cấp thuật toán trong Java."
  - title: "OWASP — Authentication Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"
    description: "Thực hành xác thực, rate limiting, bảo vệ thông tin đăng nhập và xử lý lỗi an toàn."
  - title: "OWASP — Secrets Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
    description: "Nguyên tắc lưu, phân quyền và xoay vòng secret khi hệ thống áp dụng pepper hoặc khóa liên quan."