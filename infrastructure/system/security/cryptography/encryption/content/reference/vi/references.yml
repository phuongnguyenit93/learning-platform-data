references:
  - title: "OWASP — Cryptographic Storage Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html"
    description: "Chọn AEAD, nguồn ngẫu nhiên và thiết kế mã hóa dữ liệu lưu trữ an toàn."
  - title: "OWASP — Key Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet.html"
    description: "Sinh, lưu, phân quyền, luân chuyển và hủy khóa mã hóa."
  - title: "NIST FIPS 197 — Advanced Encryption Standard"
    url: "https://csrc.nist.gov/pubs/fips/197/final"
    description: "Chuẩn AES và các độ dài khóa được xác định."
  - title: "NIST SP 800-38D — GCM and GMAC"
    url: "https://csrc.nist.gov/pubs/sp/800/38/d/final"
    description: "Chế độ AES-GCM, xác thực dữ liệu và yêu cầu dùng nonce/IV an toàn."
  - title: "NIST SP 800-57 Part 1 Rev. 5 — Key Management"
    url: "https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final"
    description: "Hướng dẫn vòng đời, bảo vệ và quản trị vật liệu khóa."
  - title: "IETF RFC 8439 — ChaCha20 and Poly1305"
    url: "https://www.rfc-editor.org/rfc/rfc8439.html"
    description: "Đặc tả ChaCha20-Poly1305 trong mã hóa xác thực AEAD."
  - title: "IETF RFC 8446 — TLS 1.3"
    url: "https://www.rfc-editor.org/rfc/rfc8446.html"
    description: "Kênh truyền bảo mật và các yêu cầu của giao thức TLS 1.3."
  - title: "Oracle — Java Cryptography Architecture Guide"
    url: "https://docs.oracle.com/en/java/javase/25/security/java-cryptography-architecture-jca-reference-guide.html"
    description: "API Java Cipher, KeyGenerator, SecureRandom và ví dụ AES-GCM."
  - title: "NIST SP 800-131A Rev. 2 — Cryptographic Transitions"
    url: "https://csrc.nist.gov/pubs/sp/800/131/a/r2/final"
    description: "Đánh giá thuật toán, độ dài khóa và chuyển đổi khỏi cơ chế cũ."