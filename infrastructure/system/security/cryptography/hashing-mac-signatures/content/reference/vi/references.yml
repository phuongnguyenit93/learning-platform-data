references:
  - title: "NIST FIPS 180-4 - Secure Hash Standard"
    url: "https://csrc.nist.gov/pubs/fips/180-4/upd1/final"
    description: "Thuật toán SHA-1/SHA-2, cơ chế tạo digest và các tính chất cơ bản."
  - title: "NIST FIPS 202 - SHA-3 Standard"
    url: "https://csrc.nist.gov/pubs/fips/202/final"
    description: "Họ thuật toán SHA3-224/256/384/512 và hàm mở rộng SHAKE."
  - title: "NIST FIPS 198-1 - HMAC"
    url: "https://csrc.nist.gov/pubs/fips/198-1/final"
    description: "Nguyên tắc MAC bằng hàm băm và khóa bí mật chia sẻ; theo dõi thông báo cập nhật chuẩn."
  - title: "NIST FIPS 186-5 - Digital Signature Standard"
    url: "https://csrc.nist.gov/pubs/fips/186-5/final"
    description: "Chuẩn thuật toán chữ ký số và phương pháp xác minh tính toàn vẹn, người ký."
  - title: "IETF RFC 2104 - HMAC"
    url: "https://www.rfc-editor.org/rfc/rfc2104.html"
    description: "Định nghĩa HMAC, xử lý khóa và dữ liệu đầu vào cho cơ chế xác thực thông điệp."
  - title: "IETF RFC 8017 - PKCS #1 RSA"
    url: "https://www.rfc-editor.org/rfc/rfc8017.html"
    description: "RSASSA-PSS, chữ ký RSA và định dạng/thuật toán xác minh liên quan."
  - title: "IETF RFC 8032 - EdDSA"
    url: "https://www.rfc-editor.org/rfc/rfc8032.html"
    description: "Chữ ký số dựa trên Edwards curve với Ed25519 và Ed448."
  - title: "Oracle Java - MessageDigest"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/security/MessageDigest.html"
    description: "API Java để băm SHA-256, cập nhật byte và so sánh kết quả digest."
  - title: "Oracle Java - Mac"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/javax/crypto/Mac.html"
    description: "API javax.crypto.Mac cho HmacSHA256 và xác thực thông điệp có khóa."
  - title: "Oracle Java - Signature"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/security/Signature.html"
    description: "API java.security.Signature với initSign, initVerify, update, sign và verify."
  - title: "NIST SP 800-57 Part 1 Rev. 5 - Key Management"
    url: "https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final"
    description: "Quản lý tạo, lưu giữ, bảo vệ, luân chuyển và kết thúc vòng đời khóa mật mã."