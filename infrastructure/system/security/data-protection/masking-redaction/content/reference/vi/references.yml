references:
  - title: "NIST SP 800-122 — Protecting PII Confidentiality"
    url: "https://csrc.nist.gov/pubs/sp/800/122/final"
    description: "Hướng dẫn nhận diện PII, đánh giá ảnh hưởng và lựa chọn biện pháp giảm lộ dữ liệu."
  - title: "Google Cloud — De-identifying Sensitive Data"
    url: "https://docs.cloud.google.com/sensitive-data-protection/docs/deidentify-sensitive-data"
    description: "Các phương pháp masking, redaction, tokenization và cấu hình phát hiện thông tin nhạy cảm."
  - title: "Google Cloud — De-identification Transformation Reference"
    url: "https://docs.cloud.google.com/sensitive-data-protection/docs/transformations-reference"
    description: "So sánh redaction, replacement, character masking và crypto-based tokenization."
  - title: "Google Cloud — Redacting Sensitive Data From Text"
    url: "https://docs.cloud.google.com/sensitive-data-protection/docs/redacting-sensitive-data"
    description: "Quy trình phát hiện và thay thế thông tin nhạy cảm trong nội dung văn bản."
  - title: "OWASP — Logging Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
    description: "Khuyến nghị không ghi trực tiếp PII, access token, mật khẩu và khóa bảo mật vào log."
  - title: "Microsoft Learn — Dynamic Data Masking"
    url: "https://learn.microsoft.com/sql/relational-databases/security/dynamic-data-masking?preserve-view=true&view=azuresqldb-mi-current"
    description: "Cách che dữ liệu ở truy vấn SQL, giới hạn quyền và cảnh báo rủi ro suy luận dữ liệu gốc."
  - title: "Microsoft Presidio — Text Anonymization"
    url: "https://microsoft.github.io/presidio/text_anonymization/"
    description: "Minh họa nhận diện PII bằng recognizer và áp dụng redact, replace, hash hoặc encrypt."