references:
  - title: "OWASP — Cryptographic Storage Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html"
    description: "Threat modeling, các lớp mã hóa at rest, thuật toán, quản lý khóa và tách khóa khỏi dữ liệu."
  - title: "NIST SP 800-111 — Storage Encryption Technologies"
    url: "https://csrc.nist.gov/pubs/sp/800/111/final"
    description: "Phân biệt full-disk, volume và file/folder encryption cùng các trường hợp bảo vệ."
  - title: "NIST SP 800-209 — Security Guidelines for Storage Infrastructure"
    url: "https://csrc.nist.gov/pubs/sp/800/209/final"
    description: "Đảm bảo bảo vệ dữ liệu và metadata ở storage, backup, replication và recovery."
  - title: "NIST SP 800-38D — GCM and GMAC"
    url: "https://csrc.nist.gov/pubs/sp/800/38/d/final"
    description: "Cơ sở AES-GCM, authenticated encryption, tính toàn vẹn và yêu cầu dùng nonce."
  - title: "NIST SP 800-57 Part 1 Rev. 5 — Key Management"
    url: "https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final"
    description: "Quản lý vòng đời, bảo vệ, khôi phục, rotation và hủy khóa mật mã."
  - title: "OWASP — Key Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet.html"
    description: "Thực hành quản lý và lưu khóa an toàn, tách DEK/KEK và hạn chế hard-code."
  - title: "Oracle Java SE 25 — Cipher API"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/javax/crypto/Cipher.html"
    description: "Java JCE Cipher, AES/GCM/NoPadding, AAD, authentication tag và IV duy nhất."
  - title: "Microsoft Learn — Azure Storage Encryption at Rest"
    url: "https://learn.microsoft.com/en-us/azure/storage/common/storage-service-encryption"
    description: "Mã hóa mặc định, encryption scopes và các lựa chọn customer-managed keys."
  - title: "Microsoft Learn — Customer-managed Keys for Azure Storage"
    url: "https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview"
    description: "Cách bảo vệ data encryption key bằng customer-managed key trong Key Vault hoặc HSM."