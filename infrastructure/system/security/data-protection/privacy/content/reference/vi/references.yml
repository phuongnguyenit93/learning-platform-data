references:
  - title: "NIST — Privacy Framework"
    url: "https://www.nist.gov/privacy-framework/privacy-framework"
    description: "Khung quản trị rủi ro quyền riêng tư với các chức năng Identify, Govern, Control, Communicate và Protect."
  - title: "ICO — Guide to Data Protection Principles"
    url: "https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/data-protection-principles/a-guide-to-the-data-protection-principles/"
    description: "Giải thích nguyên tắc lawful, fair, transparent, purpose limitation, data minimisation, storage limitation và accountability."
  - title: "EDPB — Data Protection by Design and by Default"
    url: "https://www.edpb.europa.eu/documents/guideline/guidelines-42019-on-article-25-data-protection-by-design-and-by-default_en"
    description: "Hướng dẫn chính thức đưa nguyên tắc bảo vệ dữ liệu vào thiết kế và cấu hình mặc định của hệ thống."
  - title: "EDPB — Respect Individuals' Rights"
    url: "https://www.edpb.europa.eu/sme/be-compliant/respect-individuals-rights_en"
    description: "Tổng quan yêu cầu hỗ trợ các quyền truy cập, chỉnh sửa, xóa, hạn chế, phản đối và di chuyển dữ liệu theo GDPR."
  - title: "ICO — How Do We Do a DPIA?"
    url: "https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/accountability-and-governance/data-protection-impact-assessments-dpias/how-do-we-do-a-dpia/"
    description: "Các bước mô tả hoạt động xử lý, đánh giá tính cần thiết và rủi ro đối với cá nhân, xác định biện pháp giảm thiểu."
  - title: "OWASP — User Privacy Protection Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/User_Privacy_Protection_Cheat_Sheet.html"
    description: "Thực hành kỹ thuật để bảo vệ quyền riêng tư người dùng qua mã hóa, truyền tải an toàn và hạn chế lộ thông tin."
