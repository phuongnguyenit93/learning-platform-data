references:
  - title: "GDPR — Regulation (EU) 2016/679, Articles 5 and 17"
    url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?toc=OJ%3AL%3A2016%3A119%3AFULL&uri=uriserv%3AOJ.L_.2016.119.01.0001.01.ENG"
    description: "Storage limitation, quyền yêu cầu xóa dữ liệu cá nhân và các ngoại lệ theo luật áp dụng."
  - title: "ICO — Storage Limitation Guidance"
    url: "https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/data-protection-principles/a-guide-to-the-data-protection-principles/storage-limitation/?q=online+identifiers"
    description: "Cách xây retention schedule, đánh giá nhu cầu tiếp tục lưu, review và xóa hoặc ẩn danh dữ liệu."
  - title: "NIST SP 800-88 Rev. 2 — Guidelines for Media Sanitization"
    url: "https://csrc.nist.gov/pubs/sp/800/88/r2/final"
    description: "Chương trình media sanitization, clear/purge, cryptographic erase và kiểm chứng hiệu quả."
  - title: "AWS S3 — Expiring Objects"
    url: "https://docs.aws.amazon.com/us_en/AmazonS3/latest/userguide/lifecycle-expire-general-considerations.html"
    description: "Lifecycle expiration theo versioning, delete marker và xử lý phiên bản không còn hiện hành."
  - title: "Azure Blob Storage — Lifecycle Policies that Delete Blobs"
    url: "https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-policy-delete"
    description: "Xóa object theo lifecycle rule và tác động của soft delete/retention policy."
  - title: "Google Cloud — Data Deletion"
    url: "https://docs.cloud.google.com/docs/security/deletion"
    description: "Pipeline xóa dữ liệu khỏi hệ thống hoạt động, bản sao lưu và cryptographic erasure."
  - title: "AWS Backup — Backup Deletion"
    url: "https://docs.aws.amazon.com/aws-backup/latest/devguide/deleting-backups.html"
    description: "Lập lịch xóa recovery point, xử lý backup đã hết hạn và giới hạn của xóa thủ công."
  - title: "OWASP — Logging Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
    description: "Không ghi thông tin bí mật vào log; chính sách retention/disposal cho log và bản sao."
  - title: "Google Cloud Storage — Object Lifecycle Management"
    url: "https://docs.cloud.google.com/storage/docs/lifecycle"
    description: "Quản lý expiration, soft delete, object versioning và retention/hold khi xóa object."