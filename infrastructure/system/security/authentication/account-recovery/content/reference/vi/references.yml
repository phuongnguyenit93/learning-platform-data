references:
  - title: "OWASP – Forgot Password Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html"
    description: "Ngăn user enumeration, token an toàn, hạn dùng, one-time use và quy trình reset mật khẩu."
  - title: "NIST SP 800-63B-4 – Digital Identity Guidelines"
    url: "https://pages.nist.gov/800-63-4/sp800-63b.html"
    description: "Account recovery, saved/issued recovery codes, mức đảm bảo và notifications."
  - title: "OWASP – Multifactor Authentication Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Multifactor_Authentication_Cheat_Sheet.html"
    description: "Khôi phục MFA, backup codes, xác minh lại và thay thế authenticator an toàn."
  - title: "OWASP – Authentication Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"
    description: "Thông báo xác thực nhất quán, reauthentication và ngăn liệt kê tài khoản."
  - title: "OWASP – Session Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet"
    description: "Session ID, đổi mật khẩu, tái xác thực và thu hồi phiên cũ."
  - title: "OWASP – Password Storage Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"
    description: "Lưu mật khẩu mới bằng thuật toán hash chậm có salt thay vì mã hóa đảo ngược."
  - title: "OWASP WSTG – Weak Password Change or Reset"
    url: "https://wstg.owasp.org/latest/4-Web_Application_Security_Testing/04-Authentication/09-Weak_Password_Change_or_Reset_Functionalities/"
    description: "Test token replay, expiry, brute force, đổi user ID, Host header và Referrer leakage."
  - title: "OWASP – CSRF Prevention Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html"
    description: "Bảo vệ các thao tác state-changing trong luồng đổi mật khẩu và account recovery."
  - title: "NIST SP 800-63B – Authenticator Event Management"
    url: "https://pages.nist.gov/800-63-4/sp800-63b/events/"
    description: "Ràng buộc lại authenticator, phương án account recovery và notification sự kiện."