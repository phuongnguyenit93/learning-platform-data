references:
  - title: "RFC 2104 — HMAC: Keyed-Hashing for Message Authentication"
    url: "https://www.rfc-editor.org/rfc/rfc2104.html"
    description: "Định nghĩa cơ chế HMAC dựa trên hash và shared secret, nguyên tắc chọn và bảo vệ khóa."
  - title: "RFC 4231 — HMAC-SHA-256 Test Vectors"
    url: "https://www.rfc-editor.org/rfc/rfc4231.html"
    description: "Các test vector chuẩn cho HMAC-SHA-224/256/384/512 để đối chiếu kết quả triển khai."
  - title: "RFC 9421 — HTTP Message Signatures"
    url: "https://www.rfc-editor.org/rfc/rfc9421.html"
    description: "Quy tắc chuẩn hóa thành phần HTTP, signature base, signature metadata, xác minh và chống replay với nonce, timestamp."
  - title: "RFC 9530 — Digest Fields"
    url: "https://www.rfc-editor.org/rfc/rfc9530.html"
    description: "Định nghĩa Content-Digest và Repr-Digest để kiểm tra tính toàn vẹn body, có thể kết hợp với HTTP Message Signatures."
  - title: "AWS — Create a Signed API Request (SigV4)"
    url: "https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_sigv-create-signed-request.html"
    description: "Ví dụ chính thức về canonical method/URI/query/headers/body hash và tính HMAC-SHA256 khi ký HTTP request."
  - title: "Microsoft Azure App Configuration — HMAC Authentication"
    url: "https://learn.microsoft.com/en-us/azure/azure-app-configuration/rest-api-authentication-hmac"
    description: "Hướng dẫn xác thực REST request bằng HMAC-SHA256, key ID, secret, date và các header cần ký."
  - title: "Oracle Java — javax.crypto.Mac"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/javax/crypto/Mac.html"
    description: "API Java tiêu chuẩn để khởi tạo và tính Message Authentication Code, gồm init, update và doFinal."
