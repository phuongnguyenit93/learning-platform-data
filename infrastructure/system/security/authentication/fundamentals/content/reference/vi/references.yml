references:
  - title: "NIST SP 800-63B-4 — Authentication and Authenticator Management"
    url: "https://csrc.nist.gov/pubs/sp/800/63/b/4/final"
    description: "Chuẩn 2025 về phương thức xác thực, mức bảo đảm AAL, mật khẩu, authenticator và quản lý vòng đời."
  - title: "OWASP — Authentication Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"
    description: "Hướng dẫn danh tính, xác thực, bảo vệ luồng đăng nhập, generic error, reauthentication và monitoring."
  - title: "OWASP — Password Storage Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"
    description: "Thực hành lưu mật khẩu an toàn bằng thuật toán băm thích hợp, salt và work factor."
  - title: "OWASP — Multifactor Authentication Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Multifactor_Authentication_Cheat_Sheet.html"
    description: "Các yếu tố độc lập, phương thức MFA, khuyến nghị triển khai và xử lý các tình huống rủi ro."
  - title: "W3C — Web Authentication Level 3 Recommendation"
    url: "https://www.w3.org/TR/2026/REC-webauthn-3-20260825/"
    description: "Đặc tả WebAuthn Level 3 về public-key credentials, passkeys và xác thực dựa trên khóa."
  - title: "OWASP — Credential Stuffing Prevention Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Credential_Stuffing_Prevention_Cheat_Sheet.html"
    description: "Phòng chống credential stuffing, password spraying và brute force bằng phòng thủ nhiều lớp."
  - title: "OWASP — Session Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet"
    description: "Session ID, cookie flags, rotation, timeout, logout và giảm rủi ro session hijacking/fixation."
  - title: "OWASP — Forgot Password Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html"
    description: "Luồng reset mật khẩu chống enumeration, reset token một lần và quản lý thời hạn."
  - title: "OpenID Foundation — OpenID Connect Core 1.0"
    url: "https://openid.net/specs/openid-connect-core-1_0.html"
    description: "Giao thức xác thực liên kết trên OAuth 2.0, ID token, issuer, audience, nonce và các bước kiểm chứng."