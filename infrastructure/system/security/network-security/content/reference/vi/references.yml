references:
  - title: "NIST SP 800-41 Rev. 1 — Guidelines on Firewalls and Firewall Policy"
    url: "https://csrc.nist.gov/pubs/sp/800/41/r1/final"
    description: "Thiết kế, cấu hình, kiểm thử và quản lý chính sách firewall để lọc lưu lượng."
  - title: "AWS VPC — Security Groups"
    url: "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html"
    description: "Quy tắc ingress/egress theo nguồn, đích, protocol và port; firewall dạng stateful."
  - title: "AWS VPC — Network Security"
    url: "https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Security.html"
    description: "Cơ chế security groups, network ACLs, flow logs và traffic mirroring của VPC."
  - title: "NIST SP 800-52 Rev. 2 — TLS Guidelines"
    url: "https://csrc.nist.gov/pubs/sp/800/52/r2/final"
    description: "Lựa chọn phiên bản, cấu hình TLS và chứng chỉ để bảo vệ dữ liệu đang truyền."
  - title: "NIST SP 800-207 — Zero Trust Architecture"
    url: "https://csrc.nist.gov/pubs/sp/800/207/final"
    description: "Xác thực và ủy quyền truy cập tài nguyên, không mặc định tin cậy theo vị trí mạng."
  - title: "NIST SP 1800-35 — Implementing Zero Trust Architecture"
    url: "https://csrc.nist.gov/pubs/sp/1800/35/final"
    description: "Các mô hình triển khai Zero Trust thực tế ở môi trường hybrid và multi-cloud."
  - title: "NIST SP 800-94 — Guide to Intrusion Detection and Prevention Systems"
    url: "https://csrc.nist.gov/pubs/sp/800/94/final"
    description: "Cấu hình, theo dõi, đánh giá IDS/IPS và tín hiệu phát hiện xâm nhập mạng."
  - title: "NIST SP 800-115 — Technical Guide to Security Testing"
    url: "https://csrc.nist.gov/pubs/sp/800/115/final"
    description: "Thực hiện đánh giá, kiểm tra lỗ hổng và xác minh biện pháp bảo vệ trong phạm vi cho phép."
  - title: "NIST SP 800-61 Rev. 3 — Incident Response"
    url: "https://csrc.nist.gov/pubs/sp/800/61/r3/final"
    description: "Chuẩn bị, phát hiện, ứng phó và khôi phục sự cố bảo mật gắn với CSF 2.0."