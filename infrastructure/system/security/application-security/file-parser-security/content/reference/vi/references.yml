references:
  - title: "OWASP — File Upload Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html"
    description: "Allowlist loại tệp, kiểm tra chữ ký, giới hạn kích thước và xử lý tệp không tin cậy."
  - title: "OWASP — Input Validation Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html"
    description: "Xác thực định dạng và nội dung đầu vào, không tin filename hay Content-Type."
  - title: "OWASP — XML External Entity Prevention"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html"
    description: "Cấu hình JAXP/XML an toàn và ngăn DTD, entity ngoài, truy cập file/mạng."
  - title: "OWASP — Deserialization Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html"
    description: "Giảm rủi ro từ ObjectInputStream, XMLDecoder và dữ liệu đối tượng không tin cậy."
  - title: "Apache POI — Configuration"
    url: "https://poi.apache.org/components/configuration.html"
    description: "Các giới hạn XML, bộ nhớ và ZipSecureFile chống tệp nén độc hại."
  - title: "MITRE CWE-22 — Path Traversal"
    url: "https://cwe.mitre.org/data/definitions/22.html"
    description: "Đường dẫn vượt thư mục giới hạn và các biện pháp kiểm soát truy cập tệp."
  - title: "MITRE CWE-400 — Resource Consumption"
    url: "https://cwe.mitre.org/data/definitions/400.html"
    description: "Kiểm soát CPU, bộ nhớ và tài nguyên để ngăn từ chối dịch vụ."
  - title: "OWASP WSTG — CSV Injection"
    url: "https://owasp.github.io/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Injection/21-CSV_Injection"
    description: "Kiểm tra nội dung tệp CSV khi xuất hoặc mở lại bằng ứng dụng bảng tính."
  - title: "Google OSS-Fuzz — Documentation"
    url: "https://google.github.io/oss-fuzz/"
    description: "Thực hành fuzz testing cho trình xử lý dữ liệu và thư viện định dạng tệp."