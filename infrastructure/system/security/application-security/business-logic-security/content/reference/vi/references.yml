references:
  - title: "OWASP — Business Logic Security Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Business_Logic_Security_Cheat_Sheet.html"
    description: "Invariants, trạng thái phía server, contextual authorization, race conditions, idempotency và chống abuse."
  - title: "OWASP WSTG — Business Logic Testing"
    url: "https://wstg.owasp.org/stable/4-Web_Application_Security_Testing/10-Business_Logic_Testing/"
    description: "Các kịch bản kiểm thử dữ liệu, workflow, timing, integrity và lạm dụng chức năng."
  - title: "OWASP API6:2023 — Sensitive Business Flows"
    url: "https://api-security.owasp.org/editions/2023/en/0xa6-unrestricted-access-to-sensitive-business-flows/"
    description: "Rủi ro dùng quá mức các nghiệp vụ mua hàng, đặt chỗ, referral và biện pháp chống tự động hóa."
  - title: "OWASP — Transaction Authorization Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Transaction_Authorization_Cheat_Sheet.html"
    description: "Xác nhận giao dịch gắn với dữ liệu, thứ tự workflow, chống replay và kiểm tra cuối ở server."
  - title: "OWASP — Secure Code Review Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Secure_Code_Review_Cheat_Sheet.html"
    description: "Review business rules, race conditions, atomicity, resource limits và chống bypass API."
  - title: "OWASP — Race Conditions"
    url: "https://community.owasp.org/pages/vulnerabilities/race_conditions"
    description: "Giải thích TOCTOU, vấn đề check-then-act và các hướng thiết kế tránh cập nhật đồng thời sai."
  - title: "OWASP WSTG — Test Business Logic Data Validation"
    url: "https://wstg.owasp.org/stable/4-Web_Application_Security_Testing/10-Business_Logic_Testing/01-Test_Business_Logic_Data_Validation/"
    description: "Kiểm thử ràng buộc dữ liệu nghiệp vụ và các kết hợp giá trị không hợp lệ."