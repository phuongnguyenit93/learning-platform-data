references:
  - title: "MDN — Same-origin policy"
    url: "https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Same-origin_policy"
    description: "Giải thích ranh giới origin, cách ly truy cập cross-origin và giới hạn tương tác giữa tài liệu trình duyệt."
  - title: "MDN — Cross-Origin Resource Sharing (CORS)"
    url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS"
    description: "Hướng dẫn CORS headers, preflight, credentials và giới hạn của kiểm soát cross-origin trong browser."
  - title: "MDN — Using HTTP Cookies"
    url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Cookies"
    description: "Các thuộc tính Secure, HttpOnly, SameSite, Domain, Path và lưu ý quản lý cookie phiên."
  - title: "OWASP — Cross Site Scripting Prevention"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html"
    description: "Hướng dẫn output encoding theo ngữ cảnh, DOM API an toàn và HTML sanitization chống XSS."
  - title: "OWASP — CSRF Prevention"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html"
    description: "Các mẫu CSRF token, kiểm tra Origin, Fetch Metadata và giới hạn của SameSite."
  - title: "MDN — Content Security Policy (CSP)"
    url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP"
    description: "CSP để hạn chế script, tài nguyên và iframe; nonce/hash, Report-Only và Trusted Types."
  - title: "OWASP — Clickjacking Defense"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Clickjacking_Defense_Cheat_Sheet.html"
    description: "Biện pháp bảo vệ ứng dụng khỏi nhúng trái phép bằng frame-ancestors và X-Frame-Options."
  - title: "MDN — Cross-Origin-Opener-Policy"
    url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Cross-Origin-Opener-Policy"
    description: "Giới hạn quan hệ với cửa sổ khác origin và các cơ chế bảo vệ liên quan browsing context."
  - title: "MDN — Strict-Transport-Security"
    url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Strict-Transport-Security"
    description: "Cấu hình HSTS để yêu cầu trình duyệt dùng HTTPS cho các lần truy cập tiếp theo."
