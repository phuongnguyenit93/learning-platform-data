references:
  - title: "NIST SP 800-63-4 - Digital Identity Guidelines"
    url: "https://csrc.nist.gov/pubs/sp/800/63/4/final"
    description: "Hướng dẫn chuẩn về identity proofing, enrollment, authentication và quản lý danh tính số."
  - title: "NIST SP 800-53 Rev. 5 - Security and Privacy Controls"
    url: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
    description: "Kiểm soát AC-2 về quản lý tài khoản, cấp/thu hồi, giám sát và audit."
  - title: "Microsoft Entra - Understanding Lifecycle Workflows"
    url: "https://learn.microsoft.com/en-us/entra/id-governance/understanding-lifecycle-workflows"
    description: "Tổng quan các workflow tự động cho Joiner, Mover và Leaver."
  - title: "Microsoft Entra - Employee Lifecycle Deployment"
    url: "https://learn.microsoft.com/en-us/entra/architecture/governance-deployment-employee-lifecycle"
    description: "Thiết kế luồng nhân sự khi vào, chuyển vị trí hoặc rời tổ chức."
  - title: "Microsoft Entra - How Application Provisioning Works"
    url: "https://learn.microsoft.com/en-us/entra/identity/app-provisioning/how-provisioning-works"
    description: "Đồng bộ tài khoản, thuộc tính, role và deprovisioning qua SCIM."
