    url: "https://www.rfc-editor.org/info/rfc7644/"
    description: "Chuẩn HTTP API tạo, đọc, sửa và xóa tài nguyên identity qua SCIM."
  - title: "Microsoft Entra - Access Reviews Overview"
    url: "https://learn.microsoft.com/en-us/entra/id-governance/access-reviews-overview"
    description: "Rà soát định kỳ group membership, application access và role assignments."
  - title: "Microsoft Entra - Entitlement Management"
    url: "https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-overview"
    description: "Access packages, yêu cầu/phê duyệt quyền và hạn sử dụng quyền."
  - title: "Microsoft Entra - Lifecycle Workflow Tasks"
    url: "https://learn.microsoft.com/en-us/entra/id-governance/lifecycle-workflow-tasks"
    description: "Danh mục tác vụ tự động cho onboarding, thay đổi vai trò và offboarding."
  - title: "OWASP - CI/CD Security Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/CI_CD_Security_Cheat_Sheet.html"
    description: "Kiểm kê identity, least privilege và quản lý vòng đời tài khoản trong CI/CD."