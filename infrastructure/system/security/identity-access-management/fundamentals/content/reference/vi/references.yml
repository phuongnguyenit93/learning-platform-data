references:
  - title: "NIST SP 800-63-4 - Digital Identity Guidelines"
    url: "https://csrc.nist.gov/pubs/sp/800/63/4/final"
    description: "Khung quản lý digital identity, identity proofing, authentication và federation."
  - title: "NIST SP 800-63B-4 - Authentication and Authenticator Management"
    url: "https://csrc.nist.gov/pubs/sp/800/63/b/4/final"
    description: "Quản lý authenticator, authentication assurance và MFA theo chuẩn hiện hành."
  - title: "OWASP - Authentication Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"
    description: "Nguyên tắc xác thực tài khoản và phân biệt identity proofing với authentication."
  - title: "OWASP - Multifactor Authentication Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Multifactor_Authentication_Cheat_Sheet.html"
    description: "Các loại yếu tố xác thực, triển khai MFA và khả năng chống phishing."
  - title: "OWASP - Authorization Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"
    description: "Nguyên tắc deny by default, least privilege và kiểm tra quyền trên mọi request."
  - title: "OpenID Foundation - OpenID Connect Core"
    url: "https://openid.net/specs/openid-connect-core-1_0.html"
    description: "SSO, ID token, phân biệt xác thực qua OIDC và ủy quyền qua OAuth 2.0."
  - title: "IETF - OAuth 2.0 Authorization Framework"
    url: "https://www.rfc-editor.org/rfc/rfc6749.html"
    description: "Khung cấp quyền truy cập hạn chế và vai trò của access token."
  - title: "IETF - SCIM 2.0 Protocol"
    url: "https://www.rfc-editor.org/rfc/rfc7644.html"
    description: "Giao thức chuẩn hóa provisioning và quản lý vòng đời identity."
  - title: "AWS - IAM Policies and Permissions"
    url: "https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html"
    description: "Cấu trúc IAM policy, policy evaluation và cấp quyền tối thiểu."
  - title: "AWS - IAM Roles"
    url: "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles.html"
    description: "Role, temporary credentials và phân quyền cho người, ứng dụng hoặc dịch vụ."
  - title: "Microsoft Entra - Identity Governance"
    url: "https://learn.microsoft.com/en-us/entra/id-governance/identity-governance-overview"
    description: "Quản trị quyền truy cập, vòng đời danh tính và quy trình phê duyệt."
  - title: "Microsoft Entra - Access Reviews"
    url: "https://learn.microsoft.com/en-us/entra/id-governance/access-reviews-overview"
    description: "Rà soát định kỳ group membership, application access và privileged roles."