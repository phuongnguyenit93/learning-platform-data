menu:
- level1: Tổng quan
  level2:
  - Tài khoản dịch vụ là gì và vì sao hệ thống cần danh tính riêng
  - Phân biệt tài khoản dịch vụ với tài khoản người dùng
  - Phân biệt danh tính, tài khoản, thông tin xác thực và quyền truy cập
  - Các bên quản lý, sử dụng và xác minh tài khoản dịch vụ
  - Luồng từ workload đến xác thực rồi truy cập tài nguyên
  - Trường hợp sử dụng trong ứng dụng, tự động hóa, hạ tầng và tích hợp
  - Rủi ro của việc dùng tài khoản cá nhân cho tiến trình tự động
  - Rủi ro của một tài khoản dùng chung cho nhiều dịch vụ
  - Bản đồ vòng đời và các quyết định bảo mật chủ yếu
- level1: Danh tính phi con người
  level2:
  - Service account trong bức tranh non-human identity
  - Workload identity và mối quan hệ với tài khoản dịch vụ
  - Service principal, ứng dụng OAuth và tài khoản dịch vụ
  - Managed identity và danh tính do nền tảng quản lý
  - Machine account, tài khoản thiết bị và tài khoản tiến trình
  - Tài khoản hệ điều hành khác với danh tính trên dịch vụ đám mây
  - Tài khoản cơ sở dữ liệu khác với danh tính ứng dụng
  - API key, chứng thư và token là thông tin xác thực hay bằng chứng
  - Danh tính dùng chung, danh tính chuyên biệt và danh tính tạm thời
  - Không đồng nhất thuật ngữ của các nhà cung cấp
- level1: Mô hình đe dọa
  level2:
  - Đánh cắp khóa, mật khẩu, token và chứng thư của dịch vụ
  - Workload bị xâm phạm và lạm dụng quyền của chính workload
  - Quyền vượt nhu cầu và mở rộng phạm vi ảnh hưởng
  - Tài khoản mồ côi hoặc không có chủ sở hữu
  - Thông tin xác thực nằm trong mã nguồn, ảnh máy hoặc nhật ký
  - Giả mạo ngữ cảnh workload khi liên kết danh tính
  - Leo thang quyền qua giả danh hoặc tạo thông tin xác thực
  - Di chuyển ngang giữa môi trường, tenant hoặc tài khoản đám mây
  - Confused deputy trong truy cập thay mặt bên khác
  - Lạm dụng tài khoản dịch vụ để che giấu người thực hiện
  - Gián đoạn hệ thống khi xoay khóa hoặc vô hiệu hóa tài khoản
- level1: Thiết kế danh tính
  level2:
  - Một danh tính cho một trách nhiệm hoặc ranh giới tin cậy phù hợp
  - Tách tài khoản theo môi trường phát triển, thử nghiệm và sản xuất
  - Tách danh tính triển khai khỏi danh tính chạy ứng dụng
  - Tách tác vụ đọc, ghi, quản trị và khôi phục khi cần
  - Chọn phạm vi theo dịch vụ, workload, nhóm triển khai hoặc tenant
  - Định danh bất biến và tên hiển thị dễ quản trị
  - Quy ước tên, nhãn và metadata phục vụ vận hành
  - Tránh đưa dữ liệu nhạy cảm vào tên hoặc nhãn công khai
  - Chọn danh tính dài hạn hoặc danh tính theo workload ngắn hạn
  - Giới hạn số danh tính mà vẫn giữ khả năng truy vết
- level1: Trách nhiệm sở hữu
  level2:
  - Chủ sở hữu nghiệp vụ và chủ sở hữu kỹ thuật
  - Đơn vị vận hành, người phê duyệt và người quản lý quyền
  - Phân biệt người tạo tài khoản với người chịu trách nhiệm lâu dài
  - Ghi nhận mục đích, hệ thống sử dụng và tài nguyên truy cập
  - Thời hạn sử dụng hoặc thời điểm cần rà soát
  - Quy trình chuyển chủ sở hữu khi nhân sự hoặc đội nhóm thay đổi
  - Trách nhiệm khi nhà cung cấp hoặc đối tác dùng tài khoản
  - Đầu mối xử lý cảnh báo, xoay khóa và sự cố
  - Tách nhiệm vụ trong tạo tài khoản, cấp quyền và truy cập bí mật
  - Không coi danh tính phi con người là tài khoản không cần quản trị
- level1: Kiểm kê tài khoản
  level2:
  - Phát hiện tài khoản trên IAM, hệ điều hành và hệ thống dữ liệu
  - Ánh xạ tài khoản với workload, ứng dụng và môi trường
  - Thu thập chủ sở hữu, mục đích và mức quan trọng
  - Kiểm kê khóa, token, chứng thư cùng cơ chế cấp phát
  - Quyền trực tiếp, quyền kế thừa và quyền hiệu lực
  - Quan hệ giả danh, ủy quyền và quyền tạo thông tin xác thực
  - Lần sử dụng gần nhất và hạn chế của dữ liệu hoạt động
  - Tài khoản không rõ chủ, không dùng hoặc có quyền nhạy cảm
  - Biểu diễn phụ thuộc giữa tài khoản với các dịch vụ
  - Đối chiếu cấu hình thực tế với nguồn quản trị
- level1: Vòng đời tài khoản
  level2:
  - Yêu cầu, phê duyệt, tạo và đưa vào sử dụng
  - Chọn thời hạn hoặc điều kiện chấm dứt tài khoản
  - Cấp quyền ban đầu và gắn với workload hợp lệ
  - Theo dõi thay đổi mục đích, quyền và thông tin xác thực
  - Rà soát định kỳ quyền và nhu cầu tồn tại
  - Tạm dừng, vô hiệu hóa và khôi phục có kiểm soát
  - Thu hồi quyền khi workload hoặc dự án chấm dứt
  - Xóa tài khoản và xử lý dữ liệu hoặc tài nguyên liên quan
  - Trạng thái vòng đời cùng bằng chứng chuyển trạng thái
  - Tự động hóa quy trình mà vẫn giữ phê duyệt và truy vết
- level1: Tạo và đăng ký
  level2:
  - Thông tin bắt buộc trong yêu cầu tạo tài khoản
  - Đánh giá rủi ro trước khi chọn loại danh tính
  - Kiểm soát ai được tạo và ở phạm vi nào
  - Ngăn tạo tài khoản đặc quyền bằng quy trình tự phục vụ
  - Thiết lập hạn chế đăng nhập tương tác theo mục đích
  - Không mặc nhiên cấp quyền quản trị hoặc quyền mặc định rộng
  - Tạo bằng API, công cụ quản trị hoặc hạ tầng dưới dạng mã
  - Tính lặp lại an toàn và tránh tạo tài khoản trùng
  - Liên kết tài khoản với chủ sở hữu và hệ thống kiểm kê
  - Kiểm tra cấu hình trước khi giao cho workload sử dụng
- level1: Cơ chế xác thực
  level2:
  - Mật khẩu của tài khoản dịch vụ và các giới hạn vận hành
  - Khóa API, client secret và khóa truy cập
  - Chứng thư máy khách, mTLS và bằng chứng giữ khóa riêng
  - Chữ ký yêu cầu và khóa bất đối xứng
  - OAuth client credentials trong xác thực ứng dụng
  - Token do nền tảng cấp cho danh tính được quản lý
  - Liên kết danh tính và đổi bằng chứng workload lấy token
  - Kerberos và xác thực tài khoản dịch vụ trong miền
  - Chọn cơ chế theo môi trường và mô hình đe dọa
  - Phân biệt xác thực workload với xác thực người quản trị
  - Không dùng việc không hỗ trợ MFA như lý do bỏ các kiểm soát thay thế
- level1: Bảo vệ thông tin xác thực
  level2:
  - Tránh khóa dài hạn khi nền tảng cung cấp cơ chế phù hợp
  - Sinh khóa hoặc bí mật bằng nguồn ngẫu nhiên an toàn
  - Phân phối qua kho bí mật hoặc kênh quản trị được bảo vệ
  - Quyền đọc bí mật và phạm vi workload được phép nhận
  - Không nhúng bí mật trong kho mã, tệp cấu hình hoặc ảnh container
  - Biến môi trường, tệp, volume và rủi ro lộ dữ liệu tiến trình
  - Bí mật trong bộ nhớ, crash dump và công cụ chẩn đoán
  - Bảo vệ khóa riêng bằng phần cứng hoặc kho khóa khi phù hợp
  - Kiểm soát xuất khóa, tải khóa và tạo bản sao mới
  - Nhật ký, bản sao lưu và pipeline có thể chứa bí mật
  - Phát hiện bí mật bị công khai và quy trình xử lý
  - Tách dữ liệu kiểm kê khỏi giá trị bí mật thực tế
- level1: Token ngắn hạn
  level2:
  - Lợi ích và giới hạn của thông tin xác thực tạm thời
  - Luồng xin token từ môi trường hoặc dịch vụ cấp phát
  - Ràng buộc issuer, audience, subject và mục đích token
  - Giới hạn thời gian sống cùng phạm vi quyền
  - Làm mới token trước hạn mà không gây gián đoạn
  - Quản lý bộ nhớ đệm token trong nhiều tiến trình
  - Xử lý token hết hạn, đồng hồ lệch và nguồn cấp phát lỗi
  - Thu hồi quyền cấp token khác với thu hồi token đã cấp
  - Chống phát lại bằng ràng buộc với bên giữ khóa khi hồ sơ hỗ trợ
  - Không ghi hoặc chuyển tiếp token sang dịch vụ ngoài đối tượng nhận
- level1: Liên kết workload
  level2:
  - Workload identity federation là gì và khi nào cần dùng
  - Nguồn danh tính bên ngoài và miền tin cậy nhận token
  - Ràng buộc các thuộc tính của workload trong chính sách tin cậy
  - Kiểm tra issuer, audience và điều kiện nhận dạng
  - Ánh xạ workload bên ngoài sang danh tính được phép sử dụng
  - Ngăn wildcard hoặc điều kiện quá rộng trong trust policy
  - Ràng buộc kho mã, nhánh, môi trường và tác vụ CI/CD
  - Chống giả mạo thuộc tính có thể do bên không tin cậy điều khiển
  - Thu hồi quan hệ liên kết khi nguồn workload thay đổi
  - Chẩn đoán lỗi giữa cấp bằng chứng, đổi token và kiểm tra quyền
  - Giới hạn của liên kết danh tính khi workload nguồn đã bị xâm phạm
- level1: Quyền tối thiểu
  level2:
  - Xác định hành động và tài nguyên thật sự cần thiết
  - Quyền trực tiếp, nhóm, role và quyền kế thừa
  - Role dựng sẵn so với role tùy chỉnh
  - Tách quyền đọc dữ liệu, ghi dữ liệu và quản trị
  - Giới hạn quyền theo tài nguyên, môi trường và tenant
  - Điều kiện theo thời gian, mạng hoặc ngữ cảnh được hỗ trợ
  - Rủi ro quyền wildcard và quyền quản trị dự án hoặc tài khoản
  - Quyền cấp quyền, tạo khóa và gắn danh tính cho workload
  - Phân tích đường leo thang quyền gián tiếp
  - Rà soát quyền theo hoạt động thực tế và giới hạn của suy luận này
  - Kiểm tra quyền hiệu lực sau thay đổi
  - Tạm cấp đặc quyền theo thời hạn khi tác vụ yêu cầu
- level1: Giả danh và ủy quyền
  level2:
  - Impersonation khác với chia sẻ khóa của tài khoản
  - Delegation và giới hạn truy cập thay mặt chủ thể
  - Ai được phép xin token hoặc ký dưới danh tính dịch vụ
  - Quyền giả danh khác với quyền của danh tính đích
  - Chuỗi ủy quyền nhiều bước và khả năng truy vết nguồn
  - Ngăn người dùng trở thành tài khoản đặc quyền qua đường gián tiếp
  - Giới hạn audience, scope và thời hạn khi ủy quyền
  - Ủy quyền cho đối tác hoặc hệ thống ngoài tổ chức
  - Ngăn confused deputy bằng ràng buộc bên yêu cầu và tài nguyên
  - Nhật ký người khởi tạo, danh tính trung gian và tài khoản đích
  - Thu hồi quyền giả danh mà không phá vỡ các workload hợp lệ
- level1: Ranh giới truy cập
  level2:
  - Kết hợp danh tính với chính sách mạng và tài nguyên
  - Giới hạn môi trường từ đó thông tin xác thực được sử dụng
  - Metadata endpoint và rủi ro SSRF lấy token của workload
  - Đường truy cập từ container đến thông tin xác thực của máy chủ
  - Truy cập tài nguyên qua proxy hoặc bộ trung gian
  - Ràng buộc tài nguyên đích và tránh chuyển tiếp token tùy tiện
  - Tách dữ liệu cùng danh tính giữa các tenant
  - Giới hạn đường ra để giảm phát tán dữ liệu khi tài khoản bị chiếm
  - Không coi vị trí mạng là bằng chứng danh tính đầy đủ
  - Đánh giá quyền truy cập tại tài nguyên thay vì chỉ tại cổng vào
- level1: Tích hợp ứng dụng
  level2:
  - Chọn danh tính chạy ứng dụng thay cho tài khoản người phát triển
  - Chuỗi tìm thông tin xác thực và nguy cơ chọn nhầm nguồn
  - Cấu hình môi trường rõ ràng và tránh rơi về khóa ngoài dự kiến
  - Khởi tạo kết nối khi token hoặc chứng thư chưa sẵn sàng
  - Tái sử dụng kết nối và cập nhật thông tin xác thực mới
  - Phân biệt lỗi xác thực với lỗi thiếu quyền
  - Retry có giới hạn và tránh lặp cấp token gây quá tải
  - Không gắn bí mật vào thông báo lỗi hoặc dấu vết chẩn đoán
  - Xác định danh tính hiệu lực khi ứng dụng gọi dịch vụ
  - Tách danh tính gọi ra của ứng dụng khỏi danh tính người dùng cuối
  - Ví dụ luồng tích hợp trung lập ngôn ngữ và nền tảng
- level1: CI/CD và tự động hóa
  level2:
  - Danh tính của pipeline, runner và tác vụ triển khai
  - Tách quyền xây dựng, phát hành và triển khai
  - Thông tin xác thực theo tác vụ thay cho khóa dùng chung
  - Liên kết OIDC giữa hệ thống CI/CD với nền tảng đích
  - Ràng buộc kho mã, ref, môi trường và quy trình đã phê duyệt
  - Pull request từ nguồn không tin cậy và nguy cơ truy cập bí mật
  - Quyền của runner tự quản lý và phạm vi thông tin xác thực nhận được
  - Bí mật trong artifact, cache, log và biến đầu ra
  - Phê duyệt môi trường sản xuất và giới hạn thời gian đặc quyền
  - Thu hồi quyền của pipeline hoặc runner đã ngừng
  - Truy vết lần triển khai về người khởi tạo và phiên bản mã
- level1: Kubernetes
  level2:
  - Kubernetes ServiceAccount và danh tính trong namespace
  - Phân biệt ServiceAccount với tài khoản người dùng và cloud identity
  - Gắn ServiceAccount phù hợp cho từng workload
  - Token được chiếu vào Pod, audience và thời hạn
  - TokenRequest và hạn chế token tĩnh dài hạn
  - Automount token và giảm cấp phát cho Pod không cần dùng
  - 'RBAC: Role, ClusterRole, RoleBinding và ClusterRoleBinding'
  - Quyền tạo Pod, đọc Secret hoặc gắn ServiceAccount có thể mở đường leo thang
  - Liên kết Kubernetes ServiceAccount với danh tính đám mây
  - Pod bị xâm phạm và phạm vi ảnh hưởng của token
  - Thay đổi, xóa ServiceAccount và tác động lên workload đang chạy
  - Kiểm tra danh tính cùng quyền hiệu lực từ góc nhìn Pod
- level1: Nền tảng đám mây
  level2:
  - Ánh xạ khái niệm tài khoản dịch vụ sang mô hình từng nhà cung cấp
  - AWS IAM role, role session và trust policy cho workload
  - AWS IAM user cùng rủi ro khóa truy cập dài hạn
  - Azure service principal và thông tin xác thực ứng dụng
  - Azure managed identity theo mô hình nền tảng hỗ trợ
  - Google Cloud service account, role và quyền giả danh
  - Khóa do người dùng quản lý khác với token do nền tảng cấp
  - Danh tính gắn với máy ảo, container hoặc tác vụ serverless
  - Truy cập chéo tài khoản, subscription, project hoặc tenant
  - Chính sách tổ chức hạn chế tạo khóa và cấp đặc quyền
  - Theo dõi khác biệt thuật ngữ, giới hạn và cấu hình giữa các nền tảng
- level1: Hệ điều hành
  level2:
  - Tài khoản chạy dịch vụ trên Linux và Unix
  - UID, GID, quyền tệp và quyền tiến trình
  - Tài khoản không đăng nhập tương tác và giới hạn thực tế
  - Đặc quyền root, capabilities và cơ chế cô lập tiến trình
  - Danh tính cho daemon, tác vụ theo lịch và dịch vụ nền
  - Tài khoản dịch vụ cục bộ và tài khoản miền trên Windows
  - Managed Service Account và Group Managed Service Account
  - Quyền đăng nhập như dịch vụ và quyền truy cập tài nguyên mạng
  - SPN, Kerberos và sai cấu hình tài khoản dịch vụ
  - Tách danh tính hệ điều hành khỏi thông tin xác thực ứng dụng
  - Giám sát việc tài khoản dịch vụ bị dùng cho hoạt động tương tác
- level1: Dữ liệu và tích hợp
  level2:
  - Tài khoản kết nối cơ sở dữ liệu và quyền theo lược đồ
  - Tách danh tính chạy ứng dụng khỏi danh tính migration
  - Xác thực cơ sở dữ liệu bằng token hoặc danh tính nền tảng
  - Tài khoản cho hàng đợi, object storage và dịch vụ dữ liệu
  - Danh tính riêng cho từng tích hợp bên thứ ba
  - Giới hạn thao tác hàng loạt, xuất dữ liệu và quyền xóa
  - Connection pool khi mật khẩu, token hoặc chứng thư thay đổi
  - Truy vết người dùng nghiệp vụ khi truy cập qua tài khoản dùng chung
  - Chỉ ghi nhận danh tính người dùng qua ngữ cảnh đáng tin cậy
  - Đánh giá tác động khi cùng tài khoản được nhiều ứng dụng sử dụng
- level1: Xoay và thu hồi bí mật
  level2:
  - Phân biệt xoay bí mật với thay danh tính dịch vụ
  - Chu kỳ xoay dựa trên rủi ro và cơ chế xác thực
  - Kiểm kê mọi workload đang dùng thông tin xác thực cũ
  - Khoảng chồng lấn giữa thông tin xác thực cũ và mới
  - Phân phối, reload và xác minh bản triển khai mới
  - Thu hồi khóa cũ sau khi xác nhận chuyển đổi
  - Ứng dụng không hỗ trợ hai khóa và kế hoạch chuyển đổi
  - Mật khẩu do nền tảng quản lý và trách nhiệm phần ứng dụng
  - Rollback an toàn khi xoay thông tin xác thực thất bại
  - Xoay khẩn cấp khi nghi ngờ bí mật bị lộ
  - Phát hiện bản sao khóa cũ còn tồn tại sau xoay
- level1: Vô hiệu hóa và xóa
  level2:
  - Xác minh nhu cầu ngừng trước khi thay đổi danh tính
  - Vô hiệu hóa tài khoản khác với xóa tài khoản
  - Thu hồi quyền, quan hệ giả danh và quan hệ liên kết
  - Thu hồi khóa, chứng thư và khả năng cấp token mới
  - Token hoặc phiên còn hiệu lực sau khi tài khoản bị thay đổi
  - Kiểm tra tác vụ nền, lịch chạy và dịch vụ ít hoạt động
  - Chuyển quyền sở hữu tài nguyên trước khi xóa
  - Gỡ bí mật khỏi workload, kho bí mật và cấu hình
  - Lưu bằng chứng cùng dữ liệu kiểm toán theo chính sách
  - Phát hiện tái tạo tài khoản cùng tên với danh tính khác
  - Xác minh không còn đường truy cập từ tài khoản đã ngừng
- level1: Giám sát và kiểm toán
  level2:
  - Sự kiện tạo, sửa, cấp quyền và xóa tài khoản
  - Sự kiện tạo khóa, đọc bí mật, xin token và giả danh
  - Hoạt động truy cập theo tài nguyên, vị trí và workload
  - Phân biệt người khởi tạo với danh tính thực thi
  - Cảnh báo quyền tăng bất thường hoặc quan hệ tin cậy bị mở rộng
  - Phát hiện sử dụng ngoài môi trường hoặc ngoài lịch dự kiến
  - Tài khoản không hoạt động nhưng còn quyền cao
  - Khóa lâu chưa xoay và thông tin xác thực không rõ nơi sử dụng
  - Che giấu bí mật trong log và báo cáo
  - Bảo vệ nhật ký khỏi chỉnh sửa hoặc mất dấu vết
  - Đo độ phủ chủ sở hữu, kiểm kê và rà soát quyền
  - Đầu mối xử lý cảnh báo và bằng chứng hoàn tất khắc phục
- level1: Ứng phó sự cố
  level2:
  - Phân loại lộ khóa, chiếm workload và lạm dụng đặc quyền
  - Cô lập workload hoặc đường cấp phát bị xâm phạm
  - Xác định quyền hiệu lực và tài nguyên đã bị truy cập
  - Thu hồi bí mật, token và quyền giả danh liên quan
  - Vô hiệu hóa tài khoản theo phạm vi tác động
  - Xử lý đường leo thang qua tài khoản hoặc role khác
  - Khôi phục workload bằng danh tính hoặc thông tin xác thực an toàn
  - Xác minh quyền truy cập cũ thực sự đã bị chặn
  - Bảo toàn nhật ký và dấu vết người khởi tạo
  - Phối hợp khôi phục dịch vụ khi tài khoản phục vụ nhiều hệ thống
  - Rà soát nguyên nhân cùng thay đổi chính sách sau sự cố
- level1: Chính sách bằng mã
  level2:
  - Quản lý danh tính và quyền bằng hạ tầng dưới dạng mã
  - Yêu cầu có chủ sở hữu, mục đích và phạm vi tài nguyên
  - Kiểm tra quyền wildcard hoặc role đặc quyền trong thay đổi
  - Chính sách cấm khóa dài hạn khi có lựa chọn phù hợp
  - Kiểm tra trust policy và điều kiện liên kết workload
  - Phê duyệt thay đổi quyền nhạy cảm trước triển khai
  - Phát hiện sai lệch giữa cấu hình khai báo với cấu hình thực
  - Tách quyền chạy pipeline quản trị danh tính khỏi ứng dụng
  - Quản lý state và output tránh lưu bí mật ngoài kiểm soát
  - Rà soát định kỳ và lưu bằng chứng quyết định giữ hoặc thu hồi quyền
- level1: Sẵn sàng và di trú
  level2:
  - Phụ thuộc vào IAM, kho bí mật và dịch vụ cấp token
  - Token hết hạn khi nguồn cấp phát không sẵn sàng
  - Bộ nhớ đệm và giới hạn duy trì hoạt động khi có sự cố
  - Sao lưu cấu hình danh tính và quan hệ quyền
  - Khôi phục mà không làm sống lại khóa hoặc quyền đã thu hồi
  - Chuyển từ tài khoản dùng chung sang danh tính chuyên biệt
  - Chuyển từ khóa dài hạn sang managed identity hoặc federation
  - Đổi chủ sở hữu, nền tảng hoặc miền tin cậy
  - Triển khai theo giai đoạn và kiểm tra phụ thuộc
  - Tiêu chí hoàn tất cùng loại bỏ danh tính và khóa cũ
- level1: Kiểm thử bảo mật
  level2:
  - Xác minh đúng danh tính thực thi trong từng môi trường
  - Kiểm thử hành động được phép và hành động phải bị từ chối
  - Truy cập tài nguyên ngoài phạm vi hoặc tenant khác
  - Thông tin xác thực sai, hết hạn, bị thu hồi hoặc bị thay thế
  - Điều kiện federation sai issuer, audience, ref hoặc thuộc tính workload
  - Giả danh trái phép và chuỗi leo thang quyền gián tiếp
  - Pod hoặc pipeline không tin cậy cố lấy token
  - Metadata endpoint và đường SSRF có thể chạm thông tin xác thực
  - Xoay khóa khi còn kết nối hoặc yêu cầu đang chạy
  - Vô hiệu hóa tài khoản trong khi token cũ chưa hết hạn
  - Kho bí mật hoặc IAM gián đoạn và hành vi từ chối an toàn
  - Kiểm tra bí mật không lọt vào log, artifact, cache và ảnh máy
  - Diễn tập tài khoản bị chiếm và xác minh hiệu quả thu hồi
- level1: Thực hành tổng hợp
  level2:
  - Thiết kế danh tính cho ứng dụng có API, tác vụ nền và pipeline
  - Lập danh mục tài khoản cùng chủ sở hữu và đồ thị phụ thuộc
  - Thiết kế quyền tối thiểu từ các thao tác nghiệp vụ
  - Mô phỏng pipeline được triển khai nhưng không được đọc dữ liệu ứng dụng
  - Chuyển một tích hợp dùng khóa tĩnh sang token ngắn hạn
  - Thiết kế federation cho pipeline theo kho mã và môi trường
  - Rà soát ServiceAccount cùng RBAC trong một cụm thử nghiệm
  - Diễn tập xoay bí mật mà không gián đoạn dịch vụ
  - Diễn tập vô hiệu hóa tài khoản mồ côi và kiểm tra phụ thuộc
  - Phân tích một đường giả danh dẫn đến leo thang quyền
  - Xây dựng cảnh báo và quy trình xử lý tài khoản bị xâm phạm
  - Đánh giá thiết kế bằng mô hình đe dọa và bằng chứng kiểm thử
