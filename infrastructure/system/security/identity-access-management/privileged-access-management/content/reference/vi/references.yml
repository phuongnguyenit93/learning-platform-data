references:
  - title: "Microsoft Learn — Privileged Access Strategy"
    url: "https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-strategy"
    description: "Chiến lược giảm rủi ro truy cập đặc quyền với Zero Trust, đường nâng quyền, tài khoản và phiên quản trị."
  - title: "Microsoft Learn — Securing Privileged Access Accounts"
    url: "https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-accounts"
    description: "Bảo vệ tài khoản admin, giới hạn thiết bị và đường truy cập, theo dõi hoạt động có nguy cơ cao."
  - title: "Microsoft Learn — Privileged Access Intermediaries"
    url: "https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-intermediaries"
    description: "Rủi ro và kiểm soát bảo mật của jump server, VDI, VPN và trung gian phiên truy cập đặc quyền."
  - title: "Microsoft Entra — Plan a PIM Deployment"
    url: "https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-deployment-plan"
    description: "Quyền theo thời gian, JIT, yêu cầu phê duyệt, MFA, giám sát và đánh giá định kỳ quyền đặc quyền."
  - title: "Microsoft Entra — Configure PIM Role Settings"
    url: "https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-how-to-change-default-settings"
    description: "Thực hành cấu hình thời hạn kích hoạt, yêu cầu MFA, lý do, phê duyệt và thông báo cấp quyền."
  - title: "Google Cloud — Privileged Access Manager Overview"
    url: "https://docs.cloud.google.com/iam/docs/pam-overview"
    description: "Entitlement, đề nghị cấp quyền tạm thời, justification, approval và audit log trên Google Cloud."
  - title: "AWS IAM — Security Best Practices"
    url: "https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html"
    description: "Định danh liên kết, thông tin xác thực tạm thời, MFA, least privilege và rà soát quyền không sử dụng."
  - title: "OWASP — Authorization Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"
    description: "Least privilege, deny by default, kiểm tra quyền ở mỗi lần truy cập và kiểm thử phân quyền."
  - title: "Microsoft Learn — Implement a Privileged Access Architecture"
    url: "https://learn.microsoft.com/en-us/security/zero-trust/adopt/implement-privileged-access"
    description: "Mô hình kết hợp danh tính quản trị chuyên dụng, workstation đáng tin cậy và điều kiện giám sát truy cập."