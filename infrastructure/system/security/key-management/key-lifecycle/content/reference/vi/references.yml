references:
  - title: "NIST SP 800-57 Part 1 Rev. 5 — Key Management"
    url: "https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final"
    description: "Chuẩn hướng dẫn giai đoạn, trạng thái, cryptoperiod, bảo vệ, thu hồi và tiêu hủy khóa mật mã."
  - title: "NIST SP 800-133 Rev. 2 — Key Generation"
    url: "https://csrc.nist.gov/pubs/sp/800/133/r2/final"
    description: "Nguyên tắc sinh khóa mật mã, dữ liệu ngẫu nhiên và phương pháp tạo khóa đối xứng, bất đối xứng."
  - title: "OWASP — Key Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet"
    description: "Thực hành an toàn về tạo, lưu, phân phối, rotation, compromised key, recovery và zeroization."
  - title: "OWASP — Cryptographic Storage Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html"
    description: "Chính sách bảo vệ và thay thế khóa, key generation, lưu trữ và quản lý vòng đời trong ứng dụng."
  - title: "AWS KMS — Key Policies"
    url: "https://docs.aws.amazon.com/kms/latest/developerguide/key-policies.html"
    description: "Phân quyền theo key policy, IAM và grants; giới hạn sử dụng và quản trị khóa."
  - title: "AWS KMS — Audit with CloudTrail"
    url: "https://docs.aws.amazon.com/kms/latest/developerguide/logging-using-cloudtrail.html"
    description: "Audit sự kiện tạo, thay đổi policy, sử dụng, vô hiệu hóa và xóa key."
  - title: "Google Cloud KMS — Key Version States"
    url: "https://docs.cloud.google.com/kms/docs/key-states"
    description: "Vòng đời trạng thái phiên bản khóa: enabled, disabled, scheduled for destruction và destroyed."
  - title: "Google Cloud KMS — Key Rotation"
    url: "https://docs.cloud.google.com/kms/docs/key-rotation"
    description: "Rotation, cryptoperiod, các phiên bản khóa cũ và yêu cầu re-encryption dữ liệu."
  - title: "Google Cloud KMS — Destroy and Restore"
    url: "https://docs.cloud.google.com/kms/docs/destroy-restore"
    description: "Cách lên lịch tiêu hủy, khôi phục trước hạn và nguy cơ mất dữ liệu không thể phục hồi."
  - title: "AWS KMS — Rotate Keys Manually"
    url: "https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys-manually.html"
    description: "Thay khóa theo cách thủ công và duy trì khóa cũ để giải mã dữ liệu trước migration."